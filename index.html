  "body": "8강은 \"[[race condition]]을 막으려면 [[critical section]]을 [[atomic|atomic]]하게 만들어야 한다\"까지 왔다. 9강의 질문은 하나다:\n\n> \"'''But how should we build a lock?'''\" (p.13)\n\n이 문서는 '''락을 막 구현했을 때 무엇이 어떻게 고장나는지를 순서대로''' 따라간다. 교수님의 강의 구조 자체가 \"'''No를 하나씩 Yes로 바꿔 가는 과정'''\"이므로, 각 단계마다 ① 슬라이드 코드 ② '''무엇이 고장나는가 / 무엇이 해결됐고 무엇이 남았나''' ③ 시뮬레이터를 붙여 두었다. OSTEP 28장에 해당한다.\n\n{info}전체 흐름 한 줄: '''[[인터럽트 비활성화|인터럽트 끄기]] → [[flag 락|그냥 flag]](실패) → 하드웨어 [[atomic]] 명령([[test-and-set]], [[compare-and-swap]], [[fetch-and-add]])으로 [[spin lock]] → spin 낭비를 줄이는 OS 지원([[yield 락|yield]], [[queue 락|park/unpark]], [[futex]])'''{/info}\n\n== 락이란 무엇인가 (p.12) ==\n\n<pre class=\"c\">\nlock_t mutex;            // 락 변수 하나 (모든 스레드가 같은 것을 써야 의미가 있다)\n\nlock(&mutex);            // 진입 — 남이 쥐고 있으면 여기서 기다린다\ncounter = counter + 1;   // critical section\nunlock(&mutex);          // 퇴장 — 기다리던 스레드 하나가 들어올 수 있다\n<\/pre>\n\n* '''lock 변수''' (`lock_t`) — 락의 상태를 담는다. 보통 \"available(free) / held(acquired)\" 두 상태.\n* '''`lock()`''' — 락이 free면 획득하고 진입한다. held면 '''리턴하지 않는다'''(기다린다).\n* '''`unlock()`''' — 락을 놓는다. 기다리던 스레드가 있으면 그중 하나가 획득한다.\n* '''owner''' — 락을 현재 쥐고 있는 스레드. 구현에 따라 명시적으로 저장하기도 한다([[futex]]의 robust mutex).\n\n> \"'''Ensure that any such critical section executes as if it were a single atomic instruction.'''\" (p.12)\n\n{warn}락은 '''선점을 막지 않는다'''. 락을 쥔 스레드도 [[타이머 인터럽트]]로 선점된다. 락이 하는 일은 \"선점돼 있는 동안 '''남이 critical section에 못 들어오게'''\" 하는 것뿐이다. → [[mutual exclusion]]{/warn}\n\n== 락을 만들려면 무엇이 필요한가 (p.13) ==\n\n{def}\"Efficient locks provide mutual exclusion at '''low cost'''.\"\n\"Building a lock needs some help from the '''hardware (i.e., CPU)''' and the '''OS'''.\"{/def}\n\n이 한 문장이 강의 후반부의 목차다. '''하드웨어 → [[atomic]] 명령'''(p.19~), '''OS → sleep/wakeup 지원'''(p.31~).\n\n== 평가 기준 세 가지 (p.14) ==\n\n앞으로 모든 구현을 이 세 잣대로 잰다. 자세한 것은 [[락 평가 기준]].\n\n{|\n! 기준 || 질문 (슬라이드 원문)\n|-\n| '''Mutual exclusion (correctness)''' || \"Does the lock work, preventing multiple threads from entering a critical section?\"\n|-\n| '''Fairness''' || \"Does each thread contending for the lock get a fair shot at acquiring it once it is free? ('''Starvation''')\"\n|-\n| '''Performance''' || \"The '''time overheads''' added by using the lock\"\n|}\n\n{exam}⭐⭐⭐ '''이 3기준 × 구현별 Yes/No 표'''가 시험에 내기 딱 좋은 형태다. 슬라이드에도 p.24, p.29, p.42 세 번 반복해서 나온다. 이 문서 맨 아래의 종합표를 외워라.{/exam}\n\n----\n\n== ① flag 락 — 그냥 변수 하나로 해 보기 (p.16~18) ==\n\n가장 소박한 시도. 소프트웨어만으로, `flag` 변수(0=사용 가능, 1=사용 중)를 둔다.\n\n[[img:L9-16.png|Why Hardware Support Needed? — flag만 쓴 lock 코드|medium]]\n\n<pre class=\"c\">\n 1   typedef struct __lock_t { int flag; } lock_t;\n 2\n 3   void init(lock_t *mutex) {\n 4       // 0 -> lock is available, 1 -> held\n 5       mutex->flag = 0;\n 6   }\n 7\n 8   void lock(lock_t *mutex) {\n 9       while (mutex->flag == 1)   // (1) TEST the flag\n10             ;                    //     spin-wait (do nothing)\n11       mutex->flag = 1;           // (2) now SET it !\n12   }\n13\n14   void unlock(lock_t *mutex) {\n15       mutex->flag = 0;\n16   }\n<\/pre>\n\n'''줄 읽기''': 9번 줄이 '''TEST'''(남이 쥐고 있나 확인), 11번 줄이 '''SET'''(내가 쥔다고 표시). 딱 보면 맞는 것 같다. 그런데 이 둘이 '''별개의 명령'''이라는 게 함정이다.\n\n=== 무엇이 고장나는가 ===\n\n[[img:L9-18.png|Two threads obtain locks! — ①②③④⑤ 순서로 두 스레드가 모두 락을 얻는다|large]]\n\n슬라이드 그림의 ①~⑤ 마커는 이런 뜻이다:\n\n{|\n! 마커 || 무슨 일 || flag 값\n|-\n| ① || Thread1이 `lock()` 진입, 9번 줄 `while (flag == 1)` 검사 통과 (flag는 0) || 0\n|-\n| ② || '''Thread1 & Context Switch''' — 11번 줄 `flag = 1`을 '''실행하기 직전에''' 끊긴다. 슬라이드 주석: ''flag is still 0'' || '''0'''\n|-\n| ③ || Thread2가 `lock()` 진입 → 검사 통과 (flag가 아직 0이므로!) || 0\n|-\n| ④ || Thread2가 `flag = 1` 실행 → '''락 획득'''. 슬라이드 주석: ''flag becomes 1 (obtain the lock)'' || 1\n|-\n| ⑤ || Thread1 복귀 → 자기 차례의 11번 줄 `flag = 1` 실행 → '''자기도 락 획득'''. 주석: ''set flag to 1 too!!'' || 1\n|}\n\n> '''\"Two threads obtain locks!\"'''\n\n[[sim:flag_lock]]\n\n{warn}🔥 '''무엇이 고장나는가: mutual exclusion 자체가 깨진다.'''\n[[race condition]]을 막으려고 쓴 코드 안에 '''또 race condition이 있다'''. 원인은 9번 줄(TEST)과 11번 줄(SET)이 '''두 개의 분리된 명령'''이고, 그 틈에서 [[컨텍스트 스위치]]가 가능하다는 것.\n게다가 문제가 하나 더 있다 — '''Problem 2: Spin-waiting wastes time''' (기다리는 동안 CPU를 태운다).{/warn}\n\n{analogy}🎭 flag 락 = '''화장실 문의 \"사용 중\" 팻말을 보고 나서 내가 팻말을 뒤집기까지의 틈'''이다. A가 \"비어 있음\"을 확인하고 손을 뻗는 순간 전화를 받으러 갔다. B가 와서 역시 \"비어 있음\"을 보고 팻말을 뒤집고 들어간다. A가 돌아와 '''자기가 본 것만 믿고''' 팻말을 뒤집고 들어간다. 둘이 같이 들어갔다.\n해결책은? '''\"확인하고 뒤집기\"를 한 동작으로''' 만드는 것 — 그게 [[test-and-set]]이다.{/analogy}\n\n> \"'''An atomic instruction supported by hardware is needed!'''\" (p.17)\n\n자세한 것은 [[flag 락]].\n\n----\n\n== ② 인터럽트 비활성화 (p.15) ==\n\n시간 순서로는 이쪽이 더 오래된 해법이다. race의 원인이 인터럽트에 의한 [[컨텍스트 스위치]]니까, '''critical section 동안 인터럽트를 꺼 버리자'''.\n\n[[img:L9-15.png|Controlling Interrupts — DisableInterrupts / EnableInterrupts|medium]]\n\n<pre class=\"c\">\n1   void lock() {\n2       DisableInterrupts();\n3   }\n4   void unlock() {\n5       EnableInterrupts();\n6   }\n<\/pre>\n\n{def}\"One of the earliest solutions used to provide mutual exclusion. '''Invented for single-processor systems'''.\"{/def}\n\n=== 무엇이 고장나는가 ===\n\n{warn}🔥 슬라이드가 든 문제 '''세 가지 — 셋 다 중요하다'''.\n# '''Require too much trust in applications''' — 유저가 인터럽트를 끌 수 있으면, greedy/malicious 프로그램이 인터럽트를 끄고 '''CPU를 독점'''한다. 4강에서 배운 \"OS가 통제권을 잃는\" 바로 그 상황이다 → [[타이머 인터럽트]]는 [[특권 명령]]이어야 한다.\n# '''Interrupts become lost''' — 오래 꺼 두면 디스크 I/O 완료 신호 같은 인터럽트를 '''놓친다'''.\n# '''Do not work on multiprocessors''' ← '''결정타'''. 인터럽트를 끄는 건 '''그 CPU 하나'''에만 적용된다. 다른 CPU에서 도는 스레드는 인터럽트와 무관하게 critical section에 들어온다.{/warn}\n\n{info}그래도 '''커널 내부에서는 여전히 쓴다'''. 유저를 신뢰할 필요가 없고 아주 짧은 구간이면 유효하다. [[xv6]]의 `push_off()`/`pop_off()`가 그 예다 — 단, xv6도 멀티코어이므로 '''스핀락과 함께''' 쓴다.{/info}\n\n자세한 것은 [[인터럽트 비활성화]].\n\n----\n\n== ③ test-and-set 스핀락 (p.19~21) ==\n\n하드웨어가 '''TEST와 SET을 한 덩어리로''' 해 주면 ①의 문제가 사라진다.\n\n[[img:L9-19.png|Test And Set (Atomic Exchange) — CPU가 하드웨어로 구현|medium]]\n\n<pre class=\"c\">\n1   /* implemented in CPU as hardware */\n2   int TestAndSet(int *ptr, int new) {\n3       int old = *ptr;       // (1) fetch old value at ptr      = TEST\n4       *ptr = new;           // (2) store 'new' into ptr        = SET\n5       return old;           // (3) return the OLD value\n6   }\n<\/pre>\n\n{def}* Return ('''testing''') old value pointed to by the ptr\n* Simultaneously update ('''setting''') said value to new\n* \"This sequence of operations is performed '''atomically''' — '''All or nothing and no context switch'''\"{/def}\n\n{warn}⭐ '''반환값은 새 값이 아니라 옛 값(old)이다.''' 시험에서 가장 자주 뒤집히는 지점. → [[자주 틀리는 함정 모음]]{/warn}\n\n이걸로 만든 스핀락:\n\n[[img:L9-20.png|A Simple Spin Lock using test-and-set|medium]]\n\n<pre class=\"c\">\n 1   typedef struct __lock_t {\n 2       int flag;\n 3   } lock_t;\n 4\n 5   void init(lock_t *lock) {\n 6       // 0 indicates that lock is available,\n 7       // 1 that it is held\n 8       lock->flag = 0;\n 9   }\n10\n11   void lock(lock_t *lock) {\n12       while (TestAndSet(&lock->flag, 1) == 1)\n13                ;        // spin-wait\n14   }\n15\n16   void unlock(lock_t *lock) {\n17       lock->flag = 0;\n18   }\n<\/pre>\n\n'''12번 줄 하나로 두 경우가 갈린다''' (반환값으로 판별):\n\n{|\n! 락 상태 || `TestAndSet(&flag, 1)` || 부수효과 || 결과\n|-\n| '''free''' (flag=0) || '''0을 반환''' || flag를 1로 '''설정''' || `while` 탈출 → '''획득'''\n|-\n| '''held''' (flag=1) || '''1을 반환''' || 1을 1로 덮어씀 (무해) || 계속 '''spin'''\n|}\n\n[[img:L9-21.png|①②③④ — T1이 락을 얻고, T2는 TestAndSet이 1을 반환해 계속 spinning|large]]\n\n슬라이드 ①~④ 마커:\n* ① Thread1이 `lock()` 호출 → ② '''Thread1 & Context Switch''': ''TestAndSet() returns 0, flag becomes 1 (obtain the lock)''\n* ③ Thread2가 `lock()` 호출 → ④ '''Thread2 & Context Switch''': ''TestAndSet() returns 1, spinning….''\n\np.18과 대비되는 '''\"성공\" 그림'''이다. 검사와 설정 사이에 끼어들 틈이 없다.\n\n[[sim:test_and_set]]\n\n{warn}✅ '''무엇이 해결됐고 무엇이 남았나 (p.24)'''\n* '''Correctness: Yes''' — 한 스레드만 critical section에 진입한다\n* '''Fairness: No''' — \"a thread spinning may '''spin forever'''\". 누가 다음에 잡을지 보장이 없다 → '''starvation'''\n* '''Performance: No''' — 특히 '''single CPU'''에서 치명적. \"lock을 쥔 스레드가 critical section 안에서 preempt되면, '''나머지 모든 스레드가 각자 [[time slice]]를 통째로 spin으로 낭비'''한다\"{/warn}\n\n자세한 것은 [[test-and-set]] · [[spin lock]].\n\n----\n\n== ④ compare-and-swap (p.22~23) ==\n\n또 다른 하드웨어 원자 명령. '''조건부''' 갱신이라는 점이 [[test-and-set]]과 다르다.\n\n[[img:L9-22.png|Compare-And-Swap (CAS)와 이를 이용한 spin lock|medium]]\n\n<pre class=\"c\">\n1   int CompareAndSwap(int *ptr, int expected, int new) {\n2       int actual = *ptr;\n3       if (actual == expected)   // 기대값과 같을 때만\n4                *ptr = new;      // 갱신\n5       return actual;            // 어느 쪽이든 '실제' 값을 반환\n6   }\n<\/pre>\n\n<pre class=\"c\">\n1   void lock(lock_t *lock) {\n2       while (CompareAndSwap(&lock->flag, 0, 1) == 1)\n3                ; // spin\n4   }\n<\/pre>\n\n읽는 법: \"flag가 '''0이길 기대'''하고, 맞으면 '''1로 바꿔라'''\". 반환값이 1이면 남이 쥐고 있었다는 뜻이니 계속 spin.\n\nx86 실제 구현 (p.23)은 `lock; cmpxchgl` 인라인 어셈블리다. 어셈블리 자체는 외울 필요 없고 다음 두 줄이 포인트:\n* spin lock을 만드는 용도로는 [[test-and-set]]과 '''동일'''하게 동작한다\n* 하지만 CAS는 '''더 강력한''' 명령 — '''lock-free synchronization''' 구현에도 쓸 수 있다\n\n{warn}✅ '''무엇이 해결됐고 무엇이 남았나''': 성적표는 [[test-and-set]] 스핀락과 '''똑같다''' (Y / N / N). CAS의 추가 가치는 락 밖, 즉 lock-free 자료구조에 있다.{/warn}\n\n[[sim:cas_llsc]]\n\n자세한 것은 [[compare-and-swap]].\n\n----\n\n== ⑤ load-linked / store-conditional (보충) ==\n\n{info}⚠️ '''이 절은 교수님 슬라이드에 없다.''' OSTEP 28.9의 내용이고, [[RISC-V]]가 실제로 쓰는 방식이라 [[과제1 xv6 alarm|xv6]] 이해에 도움이 되므로 보충한다. 시험 우선순위는 낮다.{/info}\n\n<pre class=\"c\">\nint LoadLinked(int *ptr) {\n    return *ptr;                    // 값을 읽고 '이 주소를 지켜보겠다'고 표시\n}\n\nint StoreConditional(int *ptr, int value) {\n    if (LoadLinked 이후 그 주소에 아무도 쓰지 않았다면) {\n        *ptr = value;\n        return 1;                   // 성공\n    } else {\n        return 0;                   // 실패 — 다시 시도해야 한다\n    }\n}\n\nvoid lock(lock_t *lock) {\n    while (1) {\n        while (LoadLinked(&lock->flag) == 1)\n            ;                               // 누가 쥐고 있으면 spin\n        if (StoreConditional(&lock->flag, 1) == 1)\n            return;                         // 내가 먼저 썼다 -> 획득\n        // 실패했으면 처음부터 다시\n    }\n}\n<\/pre>\n\n'''[[compare-and-swap|CAS]]와의 차이''': CAS는 \"값이 기대와 같으면 써라\", LL/SC는 \"'''내가 읽은 뒤로 아무도 안 건드렸으면''' 써라\". 후자는 ABA 문제에 강하다. [[RISC-V]]의 `lr.w` / `sc.w`가 이것이다.\n\n[[sim:cas_llsc]]\n\n자세한 것은 [[load-linked store-conditional]].\n\n----\n\n== ⑥ fetch-and-add 티켓 락 (p.25~29) ==\n\n드디어 '''fairness'''가 해결된다.\n\n[[img:L9-25.png|Fetch-And-Add — 옛 값을 반환하면서 원자적으로 1 증가|medium]]\n\n<pre class=\"c\">\n1      int FetchAndAdd(int *ptr) {\n2          int old = *ptr;\n3          *ptr = old + 1;\n4          return old;              // 여기서도 반환은 '옛 값'\n5      }\n<\/pre>\n\n{exam}🎯 '''2025F 중간고사 Problem 7이 FetchAdd 기반 락의 빈칸 채우기였다.''' 이 명령과 다음의 ticket lock은 '''반드시 손으로 시뮬레이션'''해 볼 것. 문제와 교수님의 의도 답은 [[2025F 중간고사 족보]]에 그대로 옮겨 두었다.{/exam}\n\n[[img:L9-26.png|Ticket Lock — ticket과 turn 두 필드|medium]]\n\n<pre class=\"c\">\n 1   typedef struct __lock_t {\n 2       int ticket;                                  // 다음에 발급될 번호표\n 3       int turn;                                    // 지금 서비스 중인 번호\n 4   } lock_t;\n 5\n 6   void lock_init(lock_t *lock) {\n 7       lock->ticket = 0;\n 8       lock->turn = 0;\n 9   }\n10\n11   void lock(lock_t *lock) {\n12       int myturn = FetchAndAdd(&lock->ticket);     // (1) 번호표 뽑기 (원자적)\n13       while (lock->turn != myturn)                 // (2) 내 차례 기다리기\n14                ; // spin\n15   }\n16   void unlock(lock_t *lock) {\n17       FetchAndAdd(&lock->turn);                    // (3) \"다음 손님!\"\n18   }\n<\/pre>\n\n{analogy}🎭 '''은행 번호표 시스템'''이다. `ticket` = 번호표 발급기, `turn` = 전광판. 들어오면서 번호표를 뽑고(12번 줄), 전광판에 내 번호가 뜰 때까지 기다리고(13번 줄), 볼일이 끝나면 전광판을 1 올린다(17번 줄). '''번호표를 뽑는 동작이 원자적'''이므로 두 사람이 같은 번호를 받을 수 없다.{/analogy}\n\n=== 슬라이드 그림 추적 (p.27~28) ===\n\n[[img:L9-27.png|Ticket Lock (Cont.) ①~⑤ — T1은 즉시 획득, T2는 myturn=1로 spinning|large]]\n\n{|\n! 마커 || 무슨 일 || myturn || ticket || turn\n|-\n| ① || 초기화 (`lock_init`) || — || 0 || 0\n|-\n| ② || '''T1 & Context Switch''' — T1이 `FetchAndAdd(&ticket)` → myturn=0, ticket은 1로 || T1: '''0''' || '''1''' || 0\n|-\n| ③ || Thread2 진입 || || ||\n|-\n| ④ || '''T2 & Spinning''' — T2가 번호표를 뽑아 myturn=1, ticket은 2로. `turn(0) != 1` → '''spin''' || T2: '''1''' || '''2''' || 0\n|-\n| ⑤ || T1 복귀: `turn(0) == myturn(0)` → '''obtain the lock!''' || || 2 || 0\n|-\n| ⑥ (p.28) || T1이 `unlock()` → `FetchAndAdd(&turn)` → turn=1 || || 2 || '''1'''\n|-\n| ⑦ (p.28) || spin 중이던 T2: `turn(1) == myturn(1)` → '''obtain the lock!''' || || 2 || 1\n|}\n\n[[img:L9-28.png|Ticket Lock (Cont.) ⑥⑦ — unlock이 turn을 올리자 T2가 정확히 다음 차례로 들어간다|large]]\n\n[[sim:ticket_lock]]\n\n{warn}✅ '''무엇이 해결됐고 무엇이 남았나 (p.29)'''\n* '''Correctness: Yes'''\n* '''Fairness: Yes''' ← '''달라진 부분'''. \"Fetch-and-Add enable multiple threads to '''equally share''' the critical section\". 각 스레드가 '''고유한''' myturn을 받으므로 '''FIFO 순서'''가 보장되고 '''starvation이 불가능'''하다. 슬라이드 표현으로는 \"ensure '''progress for all threads'''\".\n* '''Performance: 여전히 No''' — spin 자체는 그대로다. 락을 쥔 스레드가 preempt되면 나머지가 [[time slice]]를 낭비하는 문제는 남는다.{/warn}\n\n자세한 것은 [[fetch-and-add]] · [[ticket lock]].\n\n----\n\n== spinning 문제 — 왜 이렇게 낭비인가 (p.30) ==\n\n{def}\"Hardware-based spin locks are '''simple, and they work'''. In some cases, these solutions can be quite '''inefficient''' — '''Any time a thread gets caught spinning, it wastes an entire time slice doing nothing but checking a value'''.\"{/def}\n\n슬라이드의 노란 박스: \"'''How to avoid spinning? We'll need OS support too!'''\" — p.13에서 예고한 \"하드웨어 + OS\" 중 이제 OS 차례다.\n\n구체적 시나리오 (p.24가 든 예):\n* CPU가 '''하나'''이고 스레드가 '''N개'''\n* 락을 쥔 T1이 critical section 안에서 preempt된다\n* T2~TN이 차례로 스케줄되어 각자 '''[[time slice]]를 통째로 spin에 태운다'''\n* T1이 다시 돌아와 락을 놓을 때까지 '''(N−1) × time slice'''가 증발\n\n{warn}⭐ '''CPU가 여러 개면 얘기가 다르다.''' critical section이 아주 짧고 코어가 남아돈다면, [[컨텍스트 스위치]]하는 것보다 몇 사이클 spin하는 게 더 싸다. 그래서 [[xv6]]를 포함한 커널들은 여전히 스핀락을 쓴다. '''spin이 나쁜 것은 \"싱글 CPU\"이거나 \"critical section이 길 때\"'''라는 조건을 붙여 기억할 것.{/warn}\n\n----\n\n== ⑦ yield 락 (p.31~32) ==\n\n\"spin할 것 같으면 '''CPU를 양보'''하라.\"\n\n[[img:L9-31.png|A Simple Approach: Just Yield|medium]]\n\n<pre class=\"c\">\n 1   void init() {\n 2       flag = 0;\n 3   }\n 4\n 5   void lock() {\n 6       while (TestAndSet(&flag, 1) == 1)\n 7           yield();  // give up the CPU\n 8   }\n 9\n10   void unlock() {\n11       flag = 0;\n12   }\n<\/pre>\n\n`yield()`는 호출한 스레드를 '''running → ready'''로 옮기는 시스템 콜이다 (5강의 [[프로세스 상태]] 전이). spin으로 태울 [[time slice]]를 남에게 넘긴다.\n\n{warn}🔥 '''무엇이 남았나 (p.32) — 둘 다 심각하다'''\n# '''Context switch 비용''': 스레드가 N개일 때 락 보유자가 잠들면 '''나머지 N−1개가 전부 run-and-yield'''를 반복한다 → '''N−1번의 컨텍스트 스위치'''가 계속 발생. 락을 오래 쥐면 오버헤드가 극심하다.\n# '''Starvation 여전''': \"There is a possibility that the thread 1 '''repeatedly gets the lock'''.\" 누가 다음에 잡을지는 여전히 운이다.{/warn}\n\n교훈: \"무작정 양보\"는 낭비를 '''줄일 뿐 없애지 못하고''', 순서 보장도 없다 → '''잠재우고 정확히 깨우자'''.\n\n자세한 것은 [[yield 락]].\n\n----\n\n== ⑧ queue 락 — park / unpark (p.33~38) ==\n\n{def}'''`park()`''' — Put a calling thread to '''sleep'''.\n'''`unpark(threadID)`''' — '''Wake''' a particular thread as designated by threadID.{/def}\n\n\"기다림\"을 CPU 낭비(spin)가 아니라 '''명단에 이름 적고 자기'''로 바꾸는 발상이다. 큐(queue)가 대기자 명단이다.\n\n[[img:L9-34.png|Lock With Queues, Test-and-set, Yield, And Wakeup — lock() 부분|large]]\n\n<pre class=\"c\">\n 1   typedef struct __lock_t { int flag; int guard; queue_t *q; } lock_t;\n 2\n 3   void lock_init(lock_t *m) {\n 4       m->flag  = 0;\n 5       m->guard = 0;\n 6       queue_init(m->q);\n 7   }\n 8\n 9   void lock(lock_t *m) {\n10       while (TestAndSet(&m->guard, 1) == 1)\n11           ;                            // (1) guard 락을 spin으로 획득\n12       if (m->flag == 0) {\n13           m->flag = 1;                 // (2) 진짜 락 획득\n14           m->guard = 0;                //     guard 해제 — 다른 스레드가 올 수 있다\n15       } else {\n16           queue_add(m->q, gettid());   // (3) 대기열에 내 TID 등록\n17           m->guard = 0;                //     guard 해제\n18           park();                      // (4) 잠들기\n19       }\n20   }\n<\/pre>\n\n'''슬라이드 주석''': ''m->guard prevents the function lock from being executed by multiple threads simultaneously''\n\n{|\n! 변수 || 정체\n|-\n| '''`flag`''' || '''진짜 락''' — critical section을 보호한다\n|-\n| '''`guard`''' || '''락 내부 자료구조(flag와 queue)를 보호하는 보조 [[spin lock]]'''. \"락을 만들기 위한 락\"\n|-\n| '''`q`''' || 대기 중인 스레드 ID들의 큐\n|}\n\n[[img:L9-35.png|unlock()과 Limitations|large]]\n\n<pre class=\"c\">\n22   void unlock(lock_t *m) {\n23       while (TestAndSet(&m->guard, 1) == 1)\n24            ;                                   // guard 획득\n25       if (queue_empty(m->q))\n26            m->flag = 0;                        // 기다리는 사람 없음 -> 락 해제\n27       else\n28            unpark(queue_remove(m->q));         // 다음 스레드를 깨움 (flag는 1 유지!)\n29       m->guard = 0;\n30   }\n<\/pre>\n\n{warn}⭐ '''미묘하지만 중요한 디테일''': 대기자가 있으면 '''`flag`를 0으로 내리지 않고''' 다음 스레드를 깨운다 — 락을 '''손에서 손으로 직접 전달(hand-off)'''하는 것이다. 슬라이드 주석도 ''hold lock (for next thread!)''. 깨어난 스레드는 flag를 다시 검사/설정할 필요가 없다.{/warn}\n\n=== Limitations (p.35) ===\n\n{warn}🔥 '''무엇이 해결됐고 무엇이 남았나'''\n✅ 해결: spin으로 [[time slice]]를 통째로 태우는 문제가 사라졌다. 대기자는 '''잠든다'''.\n🔥 남은 문제 1: '''\"Don't avoid spin-waiting entirely\"''' — `guard`를 잡을 때는 여전히 spin한다. 다만 \"the time spent spinning is '''quite limited (just a few instructions)'''\".\n🔥 남은 문제 2: '''\"Sleep forever\" — Wakeup/waiting race condition.'''{/warn}\n\n=== 🔥 Wakeup/Waiting Race (p.36) ===\n\n[[img:L9-36.png|Wakeup/Waiting Race — ①②③④, Thread B가 영원히 잠든다|large]]\n\n{def}\"In case of releasing the lock (thread A) '''just before the call to `park()`''' (thread B) → '''Thread B would sleep forever''' (potentially)\"{/def}\n\n{|\n! 마커 || 무슨 일\n|-\n| ① || '''Thread A & Context Switch''' — A가 `queue_add` + `guard=0`까지 했는데 '''`park()` 호출 직전에''' 끊긴다\n|-\n| ② || Thread B가 `unlock()` 진입\n|-\n| ③ || Thread B가 큐에서 A를 꺼내 '''`unpark(A)`''' 호출 — 그런데 '''A는 아직 잠들지 않았다''' → 깨우기 신호가 허공에 사라진다 ('''lost wakeup''')\n|-\n| ④ || A가 다시 스케줄되어 `park()` 실행 → '''영원히 잠듦'''. 슬라이드 주석: ''Thread A wakes up but starts to sleep immediately''\n|}\n\n{warn}⭐ '''p.18의 flag race와 구조가 완전히 같다''': \"등록\"과 \"잠들기\" 사이의 틈. '''[[atomic|원자적]]이어야 할 두 동작이 분리되어 있으면 늘 race가 생긴다''' — 9강 전체를 관통하는 패턴이다.{/warn}\n\n=== ⑨ setpark() — Solaris의 해결책 (p.37~38) ===\n\n[[img:L9-38.png|setpark() (Cont.) — ①②③, unpark가 먼저 와도 park가 무시된다|large]]\n\n<pre class=\"c\">\n1   queue_add(m->q, gettid());\n2   setpark();       // new code — \"나 곧 park할 거야\" 예고\n3   m->guard = 0;\n4   park();\n<\/pre>\n\n{def}\"By calling this routine, a thread can indicate it is '''about to park'''. If it happens to be interrupted and another thread calls `unpark` before `park` is actually called, the '''subsequent park returns immediately instead of sleeping'''.\"{/def}\n\n슬라이드 ①②③:\n* ① A가 `setpark()` 후 context switch\n* ② ''Thread B cannot progress until m->guard = 0'' — guard 때문에 B가 잠시 대기\n* ③ ''Thread B now invokes unpark(), '''subsequent park() is ignored'''''\n\n[[sim:queue_lock]]\n\n자세한 것은 [[queue 락]] · [[park와 unpark]] · [[setpark]] · [[guard]].\n\n----\n\n== ⑩ futex — 리눅스의 two-phase lock (p.39~41) ==\n\n{def}'''futex''' = '''fast userspace mutex'''. park()의 \"'''Checked'''\" and \"'''Queued'''\" version.\n* '''`futex_wait(address, value)`''' — Put a calling thread to sleep queue '''only if `*address == value`'''\n* '''`futex_wake(address)`''' — Wake a waiting thread that waits for address{/def}\n\n{warn}⭐ '''`futex_wait`의 조건 검사가 [[setpark]]를 대신한다.''' \"잠들기 전에 값을 한 번 더 확인\"하는 일을 '''커널이 [[atomic|원자적]]으로''' 해 주므로 lost wakeup이 생기지 않는다. 주소(address) 하나가 대기열의 key가 된다.{/warn}\n\n[[img:L9-40.png|Futex-based lock implementation — glibc mutex의 골격|large]]\n\n<pre class=\"c\">\n 1   void lock(int *mutex) {\n 2       if (atomic_bit_test_set(mutex, 31) == 0) return;   // (1) 빠른 경로: 경쟁 없으면 끝\n 3       atomic_increment(mutex);                           // (2) 대기자 수 +1\n 4       while (1) {\n 5           if (atomic_bit_test_set(mutex, 31) == 0) {     // (3) 다시 시도\n 6               atomic_decrement(mutex);                   //     성공 -> 대기자 수 -1\n 7               return;\n 8           }\n 9           v = *mutex;                                    // (4) 현재 상태를 읽어 두고\n10           if (v >= 0) continue;                          //     bit31이 0이면(=풀림) 재시도\n11           futex_wait(mutex, v);                          // (5) 값이 v 그대로일 때만 잠든다\n12       }\n13   }\n14\n22   void unlock(int *mutex) {\n23       if (atomic_add_zero(mutex, 0x80000000))            // 대기자 0이면 커널 진입 없이 끝\n24           return;\n25       futex_wake(mutex);                                 // 대기자가 있을 때만 커널\n26   }\n<\/pre>\n\n'''정수 하나에 상태를 패킹'''하는 것이 핵심이다:\n\n{|\n! 비트 || 의미\n|-\n| '''bit 31''' (최상위) || 락이 잡혀 있는가 (1 = held). 그래서 값이 '''음수면 held'''\n|-\n| 나머지 비트 || '''대기자 수'''\n|}\n\n10번 줄 `if (v >= 0) continue;`가 \"bit31이 0 = 락이 풀렸다 = 잠들 필요 없다\"를 뜻하는 이유다.\n\n{warn}✅ '''무엇이 해결됐나 — 코드를 외울 필요는 없고 설계 철학이 포인트'''\n\"'''경쟁이 없으면 유저 공간에서 [[atomic]] 연산만으로 끝나고(커널 진입 0회), 경쟁이 있을 때만 커널로 들어간다.'''\" 이것이 \"'''fast userspace''' mutex\"라는 이름의 뜻이고, [[two-phase lock]]의 정의이기도 하다.{/warn}\n\n=== park/unpark vs futex (p.41) ===\n\n{|\n! || '''park/unpark''' (Solaris) || '''futex''' (Linux)\n|-\n| 성격 || '''Purely scheduling primitive''' || 락 지원에 특화된 시스템 콜\n|-\n| 커널이 유지하는 것 || '''minimal state''' || '''대기 queue를 커널이 직접 관리''' (락 상태는 '''유저가 소유''')\n|-\n| 왜? || || '''Fair wakeup''' (priority inheritance) · '''Robust mutexes''' (owner-death detection)\n|}\n\n\"Why?\"에 대한 답 두 가지가 슬라이드에 적혀 있다 — 커널이 대기 큐를 알고 있어야 '''우선순위 상속'''([[priority inversion]] 대응)과 '''락 소유자가 죽은 것을 감지'''하는 일이 가능하다.\n\n자세한 것은 [[futex]] · [[two-phase lock]] · [[priority inversion]].\n\n----\n\n== 최종 평가 (p.42) ==\n\n{def}'''Correctness: Yes''' — The spin lock only allows a single thread to enter the critical section\n'''Fairness: Yes''' — Fetch-and-Add enable multiple threads to equally share the critical section\n'''Performance: Yes''' — Spinning problem can be mitigated with '''yield and sleeping'''{/def}\n\np.14의 3기준이 드디어 모두 Yes가 된다. 강의 전체가 \"'''No를 하나씩 Yes로 바꿔 온 과정'''\"이었음을 확인하는 마무리 슬라이드다.\n\n== ⭐ 종합표 — 이걸 외워라 ==\n\n{|\n! # || 구현 || Correctness || Fairness || Performance || 필요한 하드웨어/OS || 결정적 약점\n|-\n| ① || '''[[flag 락]]''' (그냥 flag) || '''No''' || — || No || 없음 (load/store만) || TEST와 SET이 분리 → 둘 다 락 획득\n|-\n| ② || '''[[인터럽트 비활성화]]''' || 단일 CPU만 Yes || No || 보통 || [[특권 명령]] || '''멀티프로세서에서 무효''', 신뢰 문제, 인터럽트 유실\n|-\n| ③ || '''[[test-and-set]] [[spin lock]]''' || '''Yes''' || '''No''' (starvation) || '''No''' (spin 낭비) || atomic exchange || 공정성 없음 + time slice 낭비\n|-\n| ④ || '''[[compare-and-swap]] 스핀락''' || Yes || No || No || CAS || ③과 동일 (단, lock-free에 응용 가능)\n|-\n| ⑤ || '''[[load-linked store-conditional|LL/SC]] 스핀락''' (슬라이드 밖) || Yes || No || No || LR/SC ([[RISC-V]]) || ③과 동일\n|-\n| ⑥ || '''[[ticket lock]]''' ([[fetch-and-add]]) || Yes || '''Yes''' (FIFO) || '''No''' || fetch-and-add || spin은 그대로\n|-\n| ⑦ || '''[[yield 락]]''' || Yes || No (starvation) || 중간 || TAS + `yield()` 시스템 콜 || N−1번의 컨텍스트 스위치, starvation\n|-\n| ⑧ || '''[[queue 락]]''' (park/unpark) || Yes || Yes (큐 FIFO) || '''Yes''' || TAS + `park`/`unpark` || guard 구간의 짧은 spin, '''wakeup/waiting race'''\n|-\n| ⑧′ || '''+ [[setpark]]''' || Yes || Yes || Yes || + `setpark` || race 해결 (Solaris 전용)\n|-\n| ⑨ || '''[[futex]] [[two-phase lock]]''' || Yes || Yes || '''Yes''' (무경쟁 시 커널 진입 0) || `futex_wait`/`futex_wake` || 리눅스 전용, 구현 복잡\n|}\n\n== 시험 대비 핵심 요약 ==\n\n# '''락 평가 3기준''': mutual exclusion(correctness) / fairness(starvation) / performance. 구현별 Yes/No 표 — [[spin lock]](Y/N/N) → [[ticket lock]](Y/Y/N) → sleeping lock(Y/Y/Y)\n# '''[[인터럽트 비활성화]]''' 문제 3가지: ① 애플리케이션을 너무 신뢰 ② 인터럽트 유실 ③ '''멀티프로세서에서 무효'''\n# '''[[flag 락]]이 실패하는 이유''': TEST와 SET이 분리되어 그 틈에 switch → '''두 스레드가 모두 락 획득'''. p.18 타임라인(①~⑤)을 서술할 수 있어야 한다\n# '''하드웨어 atomic 명령 3종 코드 암기''': `TestAndSet`(옛 값 반환 + 새 값 저장), `CompareAndSwap`(기대값과 같을 때만 갱신, lock-free에도 사용), `FetchAndAdd`(옛 값 반환 + 1 증가). '''셋 다 반환값이 \"옛 값\" 또는 \"실제 값\"'''\n# '''[[ticket lock]]''' (⭐ 2025F 기출): `myturn = FetchAndAdd(&ticket)` → `while (turn != myturn) spin` → `unlock`은 `FetchAndAdd(&turn)`. FIFO라 '''fairness 보장'''. (myturn, ticket, turn) 값 추적 연습 필수\n# '''spin의 대가''': 락 보유자가 preempt되면 나머지가 '''각자 [[time slice]] 전체를 낭비'''. 싱글 CPU에서 특히 치명적\n# '''[[yield 락]]''': 낭비를 줄이지만 N−1번의 컨텍스트 스위치 + starvation 잔존\n# '''[[queue 락]]''': [[guard]]는 짧은 spin으로 '''락 내부 구조만''' 보호, `flag`는 대기자에게 '''hand-off'''(0으로 내리지 않음)\n# '''Wakeup/waiting race''': `park()` 직전 switch → `unpark`가 먼저 → 영원히 잠듦. 해결 = '''[[setpark]]'''(예고제) 또는 '''`futex_wait(addr, value)`'''(잠들기 전 값 검사를 커널이 원자적으로)\n# '''[[futex]] 철학''': 경쟁 없으면 유저 공간에서 끝, 경쟁 시에만 커널. 커널이 '''대기 큐를 관리'''하는 이유 = fair wakeup(priority inheritance) + robust mutex(owner-death detection)\n\n== 관련 문서 ==\n* [[락 평가 기준]] · [[flag 락]] · [[인터럽트 비활성화]]\n* [[test-and-set]] · [[spin lock]] · [[compare-and-swap]] · [[load-linked store-conditional]] · [[fetch-and-add]] · [[ticket lock]]\n* [[yield 락]] · [[queue 락]] · [[park와 unpark]] · [[setpark]] · [[guard]]\n* [[futex]] · [[two-phase lock]] · [[priority inversion]]\n* [[스레드]] · [[race condition]] · [[critical section]] · [[mutual exclusion]] · [[atomic]] · [[counter 예제]]\n* [[2025F 중간고사 족보]] · [[자주 틀리는 함정 모음]]"
 },

  ],
  "body": "9강 p.14 \"Evaluating Locks – Basic criteria\". 이후의 모든 락 구현이 이 세 잣대로 채점된다. 슬라이드에 p.24, p.29, p.42 세 번이나 다시 나오므로 '''출제 의도가 노골적'''이다.\n\n[[img:L9-14.png|Evaluating Locks – Basic criteria|medium]]\n\n{def}'''1. Mutual exclusion''' — \"Does the lock work, '''preventing multiple threads from entering a critical section'''?\"\n\n'''2. Fairness''' — \"Does each thread contending for the lock get a '''fair shot at acquiring it once it is free'''? ('''Starvation''')\"\n\n'''3. Performance''' — \"The '''time overheads''' added by using the lock\"{/def}\n\n== 각 기준을 실제로 어떻게 판정하나 ==\n\n{|\n! 기준 || \"No\"가 나오는 대표 상황\n|-\n| '''Correctness''' (mutual exclusion) || [[flag 락]]처럼 '''두 스레드가 동시에 락을 얻는''' 인터리빙이 존재하면 즉시 No\n|-\n| '''Fairness''' || \"a thread spinning may '''spin forever'''\" — 운 나쁜 스레드가 영원히 못 잡을 수 있으면 No. '''순서 보장(FIFO)'''이 있으면 Yes\n|-\n| '''Performance''' || 락을 쥔 스레드가 preempt됐을 때 나머지가 '''[[time slice]]를 통째로 낭비'''하면 No\n|}\n\n{warn}⭐ '''Performance를 평가할 때는 항상 조건을 명시해야 한다.''' 슬라이드가 든 예도 조건부다: \"'''In the single CPU''', performance overheads can be quite painful — imagine the case where the thread holding the lock is preempted '''within a critical section''' — every other thread will spin for a given [[time slice]].\"\n즉 '''① CPU 개수'''와 '''② critical section 길이'''에 따라 답이 바뀐다. 멀티코어 + 아주 짧은 critical section이면 [[spin lock]]이 오히려 유리하다.{/warn}\n\n== 슬라이드에 나온 세 번의 채점표 ==\n\n{|\n! 슬라이드 || 대상 || Correctness || Fairness || Performance\n|-\n| '''p.24''' || [[test-and-set]] [[spin lock]] || '''Yes''' || '''No''' || '''No'''\n|-\n| '''p.29''' || [[ticket lock]] ([[fetch-and-add]]) || Yes || '''Yes''' ← 바뀐 곳 || No\n|-\n| '''p.42''' || sleeping lock ([[queue 락]] / [[futex]]) || Yes || Yes || '''Yes''' ← 바뀐 곳\n|}\n\n{exam}⭐⭐⭐ '''한 번에 한 칸씩만 No→Yes로 바뀐다.'''\n* p.24 → p.29: '''fairness'''가 바뀐 이유 = [[fetch-and-add]]로 '''고유한 번호표'''를 받아 FIFO가 되기 때문\n* p.29 → p.42: '''performance'''가 바뀐 이유 = spin 대신 '''yield와 sleeping'''을 쓰기 때문\n이 \"무엇이 바뀌었고 왜 바뀌었는가\"를 묻는 서술형이 가장 나오기 쉽다.{/exam}\n\n{analogy}🎭 세 기준은 '''식당 줄 서기'''로 생각하면 쉽다.\n'''Correctness''' = 한 테이블에 한 팀만 앉는가 (두 팀이 같은 테이블에 앉으면 대참사).\n'''Fairness''' = 먼저 온 사람이 먼저 앉는가 (새치기가 가능하면 No).\n'''Performance''' = 기다리는 동안 무엇을 하는가 — 문 앞에 서서 '''계속 문을 쳐다보는 것'''(spin)과 '''번호표 받고 앉아 있다가 호출되면 가는 것'''(park)의 차이.{/analogy}\n\n{quiz}[[test-and-set]] 스핀락과 [[ticket lock]]의 채점표에서 '''딱 한 칸'''이 다르다. 어느 칸이고 왜 바뀌는가?{/quiz}\n{answer}'''Fairness''' 칸이 No → Yes로 바뀐다. TAS 스핀락은 락이 풀릴 때 '''누가 잡을지 보장이 없어''' 운 나쁜 스레드가 영원히 spin할 수 있다(starvation). [[ticket lock]]은 `FetchAndAdd(&ticket)`로 각 스레드가 '''고유한 myturn'''을 받고 `turn`이 순서대로 올라가므로 '''FIFO 진입이 보장'''된다.{/answer}\n\n{quiz}[[ticket lock]]은 fairness가 Yes인데 performance는 여전히 No다. 왜인가?{/quiz}\n{answer}'''spin 자체가 그대로'''이기 때문이다. 순서는 공평해졌지만, 자기 차례를 기다리는 스레드들은 여전히 `while (turn != myturn)`을 돌며 [[time slice]]를 태운다. 락을 쥔 스레드가 preempt되면 나머지가 전부 낭비한다. (p.29){/answer}\n\n== 관련 문서 ==\n* [[락]] · [[spin lock]] · [[ticket lock]] · [[queue 락]] · [[futex]]\n* [[mutual exclusion]] · [[time slice]] · [[fairness]]"
 },
 "flag 락": {
  "title": "flag 락 (Why Hardware Support Needed?)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''flag 락'''은 락을 '''소프트웨어만으로''' 만들어 보려는 첫 시도이고, '''실패 사례'''다. 9강 p.16~18. 슬라이드 제목부터가 \"'''Why Hardware Support Needed?'''\" — 왜 하드웨어의 도움이 필요한지를 보여 주기 위한 반례다.\n\n[[img:L9-16.png|Why Hardware Support Needed? — flag 변수만 쓴 lock 코드|large]]\n\n<pre class=\"c\">\n 1   typedef struct __lock_t { int flag; } lock_t;\n 2\n 3   void init(lock_t *mutex) {\n 4       // 0 -> lock is available, 1 -> held\n 5       mutex->flag = 0;\n 6   }\n 7\n 8   void lock(lock_t *mutex) {\n 9       while (mutex->flag == 1)   // TEST the flag\n10             ;                    // spin-wait (do nothing)\n11       mutex->flag = 1;           // now SET it !\n12   }\n13\n14   void unlock(lock_t *mutex) {\n15       mutex->flag = 0;\n16   }\n<\/pre>\n\n{|\n! 줄 || 하는 일 || 슬라이드 주석\n|-\n| 5 || `flag = 0`으로 초기화 || `0 -> lock is available, 1 -> held`\n|-\n| '''9~10''' || flag가 1인 동안 제자리에서 돌며 기다린다 || '''`// TEST the flag`''' / `// spin-wait`\n|-\n| '''11''' || 빠져나왔으니 내가 쥔다고 표시 || '''`// now SET it !`'''\n|-\n| 15 || 락 해제 || —\n|}\n\n{warn}'''9번 줄(TEST)과 11번 줄(SET)이 별개의 명령'''이라는 것 — 이 한 가지가 전부다.{/warn}\n\n== 무엇이 고장나는가 ==\n\n=== Problem 1: No Mutual Exclusion ===\n\n슬라이드 p.17의 타임라인 (flag=0에서 시작):\n\n{|\n! Thread1 || Thread2\n|-\n| `call lock()` ||\n|-\n| `while (flag == 1);` ← 통과 (flag=0) ||\n|-\n| '''interrupt: switch to Thread 2''' ||\n|-\n| || `call lock()`\n|-\n| || `while (flag == 1);` ← '''통과''' (flag가 아직 0!)\n|-\n| || `flag = 1;` ← '''락 획득'''\n|-\n| || '''interrupt: switch to Thread 1'''\n|-\n| `flag = 1; // set flag to 1 (too!)` ← '''락 획득''' ||\n|}\n\n그림 버전이 p.18이다:\n\n[[img:L9-18.png|Two threads obtain locks! — ①~⑤ 마커|large]]\n\n{|\n! 마커 || 의미 (슬라이드 주석)\n|-\n| ① || Thread1이 `lock()`의 while 검사 지점에 도달\n|-\n| ② || '''Thread1 & Context Switch''' — ''flag is still 0''\n|-\n| ③ || Thread2가 `lock()` 진입\n|-\n| ④ || '''Thread2 & Context Switch''' — ''flag becomes 1 (obtain the lock)''\n|-\n| ⑤ || Thread1 복귀 — ''set flag to 1 too!! (obtain the lock)''\n|}\n\n> '''\"Two threads obtain locks!\"'''\n\n[[sim:flag_lock]]\n\n=== Problem 2: Spin-waiting wastes time ===\n\n설사 correctness가 맞았더라도, 기다리는 동안 '''CPU를 태운다'''. 이 문제는 [[test-and-set]] [[spin lock]]까지 그대로 이어지고, [[yield 락]]과 [[queue 락]]에서야 해결된다.\n\n== 왜 이런 일이 생기나 ==\n\n`lock()` 안의 \"확인하고 표시하기\"가 '''read-modify-write'''다. [[counter 예제]]의 `counter = counter + 1`과 '''구조가 완전히 같다''':\n\n<pre class=\"ascii\">\ncounter 예제:   load counter  ->  add 1     ->  store counter\nflag 락:        load flag     ->  (판단)    ->  store flag = 1\n                     ^                              ^\n                     +-------- 이 사이에서 끊긴다 ---+\n<\/pre>\n\n{warn}⭐ '''[[race condition]]을 막으려고 쓴 코드 안에 또 race condition이 있다.''' 이것이 \"락은 공짜로 만들 수 없다 → 하드웨어의 도움이 필요하다\"는 결론으로 이어진다.\n\n> \"'''An atomic instruction supported by hardware is needed!''' — test-and-set instruction, also known as '''atomic exchange'''\" (p.17){/warn}\n\n{analogy}🎭 '''화장실 문 팻말'''이다. 팻말을 '''보는 것'''(TEST)과 '''뒤집는 것'''(SET) 사이에 누가 끼어들 수 있다. A가 \"비어 있음\"을 확인하고 손을 뻗는 순간 전화가 와서 자리를 뜬다. B가 와서 역시 \"비어 있음\"을 보고 팻말을 뒤집고 들어간다. A가 돌아와 '''아까 본 것만 믿고''' 팻말을 뒤집고 들어간다 — 둘이 같이 들어갔다.\n\n해결은 간단하다. '''\"팻말을 확인하면서 동시에 뒤집는\" 한 동작'''을 하드웨어가 제공하면 된다. 그게 [[test-and-set]]이다.{/analogy}\n\n{exam}⭐⭐ '''p.18 타임라인을 서술하라'''는 문제가 나올 수 있다. ①~⑤를 \"T1이 검사 통과 → 전환(flag는 아직 0) → T2가 검사 통과 → T2가 flag=1, 획득 → T1 복귀, flag=1, 획득\"으로 다섯 줄 쓸 수 있으면 된다. '''\"flag is still 0\"'''이 핵심 문구.{/exam}\n\n{quiz}아래 코드가 mutual exclusion을 보장하지 못하는 이유를, 인터리빙을 들어 설명하시오.\n<pre class=\"c\">\nvoid lock(lock_t *mutex) {\n    while (mutex->flag == 1)\n        ;\n    mutex->flag = 1;\n}\n<\/pre>{/quiz}\n{answer}`while` 검사(TEST)와 `flag = 1`(SET)이 '''분리된 두 명령'''이기 때문이다. T1이 검사를 통과한 직후, `flag = 1`을 '''실행하기 전에''' [[컨텍스트 스위치]]가 일어나면 flag는 여전히 0이다. T2도 검사를 통과해 flag=1을 쓰고 락을 얻고, 복귀한 T1도 flag=1을 써서 '''둘 다 락을 획득'''한다. (p.17~18){/answer}\n\n{quiz}이 코드의 문제는 몇 가지인가? 각각 무엇인가?{/quiz}\n{answer}'''두 가지'''. ① '''No mutual exclusion''' — 두 스레드가 동시에 락을 얻을 수 있다. ② '''Spin-waiting wastes time''' — 기다리는 동안 CPU 시간을 태운다. (p.17){/answer}\n\n== 관련 문서 ==\n* [[락]] · [[test-and-set]] · [[spin lock]] · [[atomic]]\n* [[race condition]] · [[counter 예제]] · [[컨텍스트 스위치]]\n* [[자주 틀리는 함정 모음]]"
 },
 "인터럽트 비활성화": {
  "title": "인터럽트 비활성화 (Controlling Interrupts)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "락을 만드는 '''가장 오래된''' 방법. 9강 p.15 \"Controlling Interrupts\".\n\n[[img:L9-15.png|Controlling Interrupts — lock은 DisableInterrupts, unlock은 EnableInterrupts|medium]]\n\n<pre class=\"c\">\n1   void lock() {\n2       DisableInterrupts();\n3   }\n4   void unlock() {\n5       EnableInterrupts();\n6   }\n<\/pre>\n\n{def}\"Disable Interrupts for critical sections.\n* One of the '''earliest''' solutions used to provide mutual exclusion\n* '''Invented for single-processor systems'''\"{/def}\n\n== 왜 이게 락이 되나 ==\n\n[[race condition]]의 원인은 [[타이머 인터럽트]]에 의한 [[컨텍스트 스위치]]다. 그러니 [[critical section]] 동안 인터럽트를 꺼 버리면 '''끊기지 않는다''' → 그 구간이 통째로 [[atomic|원자적]]으로 실행된다.\n\n단순하고, 싱글 CPU에서는 실제로 동작한다. 그런데도 유저 프로그램용 락으로는 쓰이지 않는다.\n\n== 문제 세 가지 (슬라이드, 전부 중요) ==\n\n{warn}🔥 '''1. Require too much trust in applications'''\n\"'''Greedy (or malicious) program could monopolize the processor'''\" — 유저가 인터럽트를 끌 수 있다면, 악의적인(혹은 그냥 버그 있는) 프로그램이 인터럽트를 끄고 CPU를 영영 독점한다. 4강에서 배운 '''\"OS가 통제권을 잃는\"''' 바로 그 상황이다.\n→ 그래서 인터럽트 제어는 '''[[특권 명령]]'''이고, [[타이머 인터럽트]]는 부팅 때 OS가 켠다.\n\n🔥 '''2. Interrupts become lost'''\n\"Turning off interrupts for extended periods of time can lead to '''interrupts becoming lost (e.g., disk I/Os)'''\" — 오래 꺼 두면 디스크 I/O 완료 신호 같은 인터럽트를 놓친다. 장치가 \"다 했어요\"라고 말하는데 아무도 안 듣는 셈.\n\n🔥 '''3. Do not work on multiprocessors''' ← '''결정타'''\n인터럽트를 끄는 것은 '''그 CPU 하나'''에만 적용된다. 다른 CPU에서 도는 스레드는 인터럽트와 무관하게 [[critical section]]에 '''그냥 들어온다'''. 멀티코어 시대에는 락으로 쓸 수 없다.{/warn}\n\n{exam}⭐⭐ '''\"인터럽트를 끄는 방식의 문제점 세 가지를 쓰시오\"'''는 전형적인 서술형이다. ① '''신뢰''' ② '''인터럽트 유실''' ③ '''멀티프로세서에서 무효''' — 세 개를 다 쓸 것. 특히 ③이 '''결정적인 이유'''라는 점을 덧붙이면 좋다.{/exam}\n\n== 그럼에도 여전히 쓰이는 곳 ==\n\n{info}'''커널 내부'''에서는 지금도 쓴다. 조건이 다르기 때문이다:\n* 유저를 신뢰할 필요가 없다 (코드를 커널이 직접 씀)\n* 구간이 아주 짧다 (몇 명령어)\n* 인터럽트 핸들러와 공유하는 자료구조를 보호할 때는 '''이 방법밖에 없다''' — 핸들러는 락을 기다릴 수 없으니까\n\n[[xv6]]의 `push_off()` / `pop_off()`가 그 예다. 단 xv6도 멀티코어이므로 '''스핀락과 함께''' 쓴다: `acquire()`가 인터럽트를 끄고(같은 CPU의 재진입 방지) + `amoswap`으로 스핀(다른 CPU 차단)한다.{/info}\n\n{analogy}🎭 인터럽트 비활성화 = '''회의 중 휴대폰 전원 끄기'''. 방해는 확실히 막힌다. 하지만\n① 사원이 마음대로 끌 수 있으면 '''퇴근 시간에도 안 꺼져''' 있을 수 있고(신뢰),\n② 끈 동안 온 '''부재중 전화는 기록도 안 남고'''(인터럽트 유실),\n③ 무엇보다 '''내 폰만 껐지 옆 회의실 사람은 멀쩡히 들어온다'''(멀티프로세서).{/analogy}\n\n{quiz}\"인터럽트를 끄면 [[mutual exclusion]]이 보장된다\"는 명제는 어떤 조건에서만 참인가?{/quiz}\n{answer}'''단일 프로세서(single-processor)'''에서만 참이다. 멀티프로세서에서는 인터럽트 비활성화가 '''그 CPU에만''' 적용되므로, 다른 CPU의 스레드가 [[critical section]]에 그대로 진입한다. 슬라이드도 \"Invented for single-processor systems\"라고 못 박는다.{/answer}\n\n{quiz}유저 프로그램이 `DisableInterrupts()`를 직접 호출할 수 있게 하면 무슨 일이 생기는가? 이것이 4강의 어떤 문제와 연결되는가?{/quiz}\n{answer}greedy/malicious 프로그램이 인터럽트를 끄고 '''CPU를 독점'''할 수 있다. [[타이머 인터럽트]]가 안 오면 OS가 CPU 제어권을 되찾지 못하므로, 4강 \"Problem 2: Switching Between Processes\"의 '''통제권 상실''' 문제가 그대로 재현된다. 그래서 인터럽트 제어는 [[특권 명령]]이다.{/answer}\n\n== 관련 문서 ==\n* [[락]] · [[락 평가 기준]] · [[flag 락]] · [[spin lock]]\n* [[타이머 인터럽트]] · [[특권 명령]] · [[인터럽트]] · [[제한적 직접 실행]]\n* [[atomic]] · [[xv6]]"
 },
 "test-and-set": {
  "title": "Test-And-Set (Atomic Exchange)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''Test-And-Set'''(= '''atomic exchange''')은 [[flag 락]]의 실패를 하드웨어로 고친 명령이다. 9강 p.19. '''코드를 통째로 외워야 하는''' 슬라이드 세 개 중 하나다.\n\n[[img:L9-19.png|Test And Set (Atomic Exchange) — CPU가 하드웨어로 구현한다|large]]\n\n<pre class=\"c\">\n1   /* implemented in CPU as hardware */\n2   int TestAndSet(int *ptr, int new) {\n3       int old = *ptr;       // fetch old value at ptr    = TEST\n4       *ptr = new;           // store 'new' into ptr      = SET\n5       return old;           // return the OLD value\n6   }\n<\/pre>\n\n{def}* Return ('''testing''') old value pointed to by the `ptr`\n* Simultaneously update ('''setting''') said value to `new`\n* \"This sequence of operations is performed '''atomically''' — '''All or nothing and no context switch'''\"{/def}\n\n{warn}⭐⭐ '''반환값은 \"옛 값\"이다.''' 새 값도, 성공/실패도 아니다. 시험에서 가장 흔하게 뒤집히는 지점이다.\n* 0을 반환 = '''원래 free였다''' = '''내가 락을 얻었다'''\n* 1을 반환 = 원래 held였다 = 계속 기다려야 한다{/warn}\n\n== 이 한 줄이 왜 결정적인가 ==\n\n[[flag 락]]에서는 TEST(9번 줄)와 SET(11번 줄)이 '''두 개의 명령'''이라 그 사이에서 끊겼다. `TestAndSet`은 그 둘을 '''하나의 명령'''으로 묶는다. 끊길 틈이 물리적으로 없다.\n\n<pre class=\"ascii\">\n[flag 락]           load flag  ...틈...  store flag=1     <- 여기서 사고\n[TestAndSet]        <====== 한 덩어리, 끊기지 않음 ======>\n<\/pre>\n\n'''이 보장이 소프트웨어 방식과의 유일하고 결정적인 차이'''다.\n\n{analogy}🎭 [[flag 락]]이 \"'''팻말을 확인하고 → 팻말을 뒤집는'''\" 두 동작이었다면, test-and-set은 \"'''팻말을 뒤집으면서 뒤집기 전에 뭐라고 쓰여 있었는지 알려 주는'''\" 한 동작이다. 뒤집어 보니 '비어 있음'이었다면 내가 먼저 온 것이고, '사용 중'이었다면 남이 이미 들어간 것이다. 어느 쪽이든 '''팻말은 이미 \"사용 중\"으로 뒤집혀 있으므로''' 세 번째 사람이 끼어들 수 없다.{/analogy}\n\n== 이걸로 만든 락 ==\n\n<pre class=\"c\">\nvoid lock(lock_t *lock) {\n    while (TestAndSet(&lock->flag, 1) == 1)\n             ;   // spin-wait\n}\nvoid unlock(lock_t *lock) { lock->flag = 0; }\n<\/pre>\n\n{|\n! 락 상태 || 반환값 || flag에 일어나는 일 || 결과\n|-\n| '''free''' (flag=0) || '''0''' || 0 → 1 || 탈출 → '''획득'''\n|-\n| '''held''' (flag=1) || '''1''' || 1 → 1 (무해하게 덮어씀) || 계속 '''spin'''\n|}\n\nheld일 때 1을 1로 다시 쓰는 것이 '''아무 해가 없다'''는 점이 이 코드의 우아함이다. 자세한 것은 [[spin lock]].\n\n== 실제 하드웨어 ==\n\n{|\n! 아키텍처 || 명령\n|-\n| x86 || `xchg` (메모리 피연산자에는 `lock` prefix가 암묵적으로 붙는다)\n|-\n| [[RISC-V]] || `amoswap.w` — [[xv6]]의 `acquire()`가 `__sync_lock_test_and_set` → `amoswap.w.aq`를 쓴다\n|-\n| ARM || `SWP` (구형) / `LDREX`+`STREX` ([[load-linked store-conditional|LL/SC]] 방식)\n|}\n\n== 평가 (p.24) ==\n\n{|\n! 기준 || 결과 || 이유\n|-\n| '''Correctness''' || '''Yes''' || 한 스레드만 [[critical section]]에 진입한다\n|-\n| '''Fairness''' || '''No''' || \"a thread spinning may '''spin forever'''\" — 순서 보장 없음 → starvation\n|-\n| '''Performance''' || '''No''' || 싱글 CPU에서 락 보유자가 preempt되면 나머지가 [[time slice]] 전체를 spin에 낭비\n|}\n\n[[sim:test_and_set]]\n\n{exam}🎯 '''코드 빈칸 채우기'''로 나오기 가장 좋은 형태다 (2025F Problem 7이 [[fetch-and-add]]로 같은 형식이었다). 3~5번 줄의 `int old = *ptr;` / `*ptr = new;` / `return old;`를 순서까지 정확히 쓸 수 있어야 한다.{/exam}\n\n{quiz}`TestAndSet(&flag, 1)`이 '''0'''을 반환했다. 이는 무엇을 뜻하며, 호출 직후 `flag`의 값은?{/quiz}\n{answer}'''원래 락이 free였다는 뜻'''이며, 따라서 '''내가 락을 획득'''했다. 호출 직후 `flag`는 '''1'''이다 (반환은 옛 값 0, 저장은 새 값 1이 동시에 일어났다).{/answer}\n\n{quiz}`TestAndSet`이 \"atomic exchange\"라고도 불리는 이유는?{/quiz}\n{answer}하는 일이 정확히 '''교환(swap)'''이기 때문이다 — 메모리의 값과 인자로 준 값을 '''원자적으로 맞바꾸고''' 옛 값을 돌려준다. x86의 `xchg`, [[RISC-V]]의 `amoswap`이 이 이름을 그대로 쓴다.{/answer}\n\n== 관련 문서 ==\n* [[락]] · [[spin lock]] · [[flag 락]] · [[atomic]]\n* [[compare-and-swap]] · [[fetch-and-add]] · [[load-linked store-conditional]]\n* [[queue 락]] ([[guard]] 획득에 그대로 쓰인다) · [[yield 락]]\n* [[자주 틀리는 함정 모음]]"
 },
 "spin lock": {
  "title": "Spin Lock (스핀락)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''Spin lock'''은 락을 얻을 때까지 '''제자리에서 계속 돌며 값을 확인하는''' 락이다. 9강 p.20~21, p.24.\n\n[[img:L9-20.png|A Simple Spin Lock using test-and-set|large]]\n\n<pre class=\"c\">\n 1   typedef struct __lock_t {\n 2       int flag;\n 3   } lock_t;\n 4\n 5   void init(lock_t *lock) {\n 6       // 0 indicates that lock is available,\n 7       // 1 that it is held\n 8       lock->flag = 0;\n 9   }\n10\n11   void lock(lock_t *lock) {\n12       while (TestAndSet(&lock->flag, 1) == 1)\n13                ;        // spin-wait\n14   }\n15\n16   void unlock(lock_t *lock) {\n17       lock->flag = 0;\n18   }\n<\/pre>\n\n'''12번 줄 한 줄이 전부다.''' [[test-and-set]]의 반환값으로 두 경우가 갈린다:\n\n{|\n! 락 상태 || `TestAndSet(&flag, 1)` 반환 || flag || 결과\n|-\n| free (0) || '''0''' || 0 → 1 || while 탈출 → '''획득'''\n|-\n| held (1) || '''1''' || 1 → 1 (무해) || '''계속 spin'''\n|}\n\n[[img:L9-21.png|①②③④ — T1은 획득, T2는 TestAndSet이 1을 반환해 spinning|large]]\n\n* ① Thread1이 `lock()` 호출 → ② ''TestAndSet() returns 0, flag becomes 1 '''(obtain the lock)'''''\n* ③ Thread2가 `lock()` 호출 → ④ ''TestAndSet() returns 1, '''spinning….'''''\n\np.18([[flag 락]]의 실패 그림)과 나란히 놓고 보면 대비가 선명하다. '''검사와 설정 사이에 끼어들 틈이 없다.'''\n\n[[sim:test_and_set]]\n\n== 평가 (p.24) ==\n\n{def}'''Correctness: Yes''' — The spin lock only allows a single thread to enter the critical section\n'''Fairness: No''' — Spin locks don't provide any fairness guarantees. Indeed, '''a thread spinning may spin forever'''\n'''Performance: No''' — In the single CPU, performance overheads can be quite painful. Imagine the case where '''the thread holding the lock is preempted within a critical section''' — '''every other thread will spin for a given time slice'''{/def}\n\n=== Performance가 No인 이유를 그림으로 ===\n\n<pre class=\"ascii\">\nCPU 1개, 스레드 4개. T1이 락을 쥔 채 preempt되면:\n\n 시간 -->\n T1 [lock 획득][critical section 시작]| preempt\n T2                                   [======= spin (time slice 통째 낭비) =======]\n T3                                                                                [==== spin ====]\n T4                                                                                               [== spin ==]\n T1                                                                                                          [critical section 끝][unlock]\n\n -> (N-1) x time slice 가 증발했다\n<\/pre>\n\n{warn}⭐ '''\"spin lock은 나쁘다\"고 단순 암기하면 틀린다.''' 조건이 붙는다:\n* '''싱글 CPU''' + 락 보유자가 preempt될 수 있는 상황 → 최악\n* '''멀티코어''' + [[critical section]]이 아주 짧음 → '''오히려 최선'''. 몇 사이클 도는 게 [[컨텍스트 스위치]](수천 사이클)보다 싸다\n그래서 [[xv6]]를 비롯한 커널들은 여전히 스핀락을 쓴다. 슬라이드도 \"In the '''single CPU'''\"라고 조건을 명시한다.{/warn}\n\n{analogy}🎭 spin lock = '''화장실 문 앞에 서서 1초에 백 번씩 손잡이를 돌려 보는 것'''. 문이 열리는 순간 '''바로''' 들어갈 수 있어 반응이 빠르다(멀티코어에서 짧은 대기라면 최적). 하지만 안에 있는 사람이 오래 걸리면 '''그 시간 내내 아무것도 못 하고 손잡이만 돌린다'''. 게다가 줄이 없으니 '''방금 온 사람이 먼저 들어갈 수도''' 있다(fairness No).{/analogy}\n\n== 남은 두 문제와 그 해법 ==\n\n{|\n! 문제 || 해법 || 문서\n|-\n| '''Fairness: No''' (starvation) || 번호표를 뽑아 FIFO로 || [[ticket lock]] ([[fetch-and-add]])\n|-\n| '''Performance: No''' (spin 낭비) || CPU 양보 / 잠들기 || [[yield 락]] → [[queue 락]] → [[futex]]\n|}\n\n== 다른 원자 명령으로 만든 스핀락 ==\n\n같은 구조를 [[compare-and-swap]]이나 [[load-linked store-conditional|LL/SC]]로도 만들 수 있고, '''채점표는 동일'''하다 (Y/N/N).\n\n<pre class=\"c\">\n// compare-and-swap 버전\nvoid lock(lock_t *lock) {\n    while (CompareAndSwap(&lock->flag, 0, 1) == 1)\n             ; // spin\n}\n<\/pre>\n\n[[sim:cas_llsc]]\n\n{quiz}[[spin lock]]의 Performance가 \"No\"인 이유를, CPU 개수와 preemption을 언급해 설명하시오.{/quiz}\n{answer}'''싱글 CPU'''에서 락을 쥔 스레드가 [[critical section]] '''안에서 preempt'''되면, 그 락을 기다리는 다른 모든 스레드가 각자 배정받은 '''[[time slice]] 전체를 값 확인에만 낭비'''한다. 락 보유자는 자기 차례가 다시 올 때까지 락을 놓을 수 없으므로, N개 스레드면 (N−1) × time slice가 증발한다. (p.24){/answer}\n\n{quiz}`unlock()`이 `flag = 0;` 한 줄뿐인데 원자 명령을 쓰지 않아도 되는 이유는?{/quiz}\n{answer}단순 '''store 한 번'''이고, 락을 쥔 스레드는 '''자기 하나뿐'''이므로 read-modify-write가 아니다. 경쟁할 상대가 없으니 원자 명령이 필요 없다. (반면 [[ticket lock]]의 `unlock`은 `turn`을 '''증가'''시켜야 하므로 [[fetch-and-add]]를 쓴다.){/answer}\n\n== 관련 문서 ==\n* [[락]] · [[락 평가 기준]] · [[test-and-set]] · [[compare-and-swap]]\n* [[flag 락]] · [[ticket lock]] · [[yield 락]] · [[queue 락]] · [[guard]]\n* [[time slice]] · [[컨텍스트 스위치]] · [[자주 틀리는 함정 모음]]"
 },
 "compare-and-swap": {
  "title": "Compare-And-Swap (CAS)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''Compare-And-Swap'''(CAS)은 [[test-and-set]]보다 '''강력한''' 하드웨어 [[atomic|원자]] 명령이다. 차이는 한 단어 — '''조건부'''다. 9강 p.22~23.\n\n[[img:L9-22.png|Compare-And-Swap (CAS)와 이를 이용한 spin lock|large]]\n\n<pre class=\"c\">\n1   int CompareAndSwap(int *ptr, int expected, int new) {\n2       int actual = *ptr;\n3       if (actual == expected)   // 기대값과 같을 때만\n4                *ptr = new;      // 갱신\n5       return actual;            // 어느 쪽이든 '실제' 값을 반환\n6   }\n<\/pre>\n\n{def}\"Test whether the value at the address (`ptr`) is equal to `expected`\n* If so, '''update''' the memory location pointed to by `ptr` with the `new` value\n* '''In either case, return the actual value''' at that memory location\"{/def}\n\n{warn}⭐ 반환값은 '''성공/실패가 아니라 \"그 자리에 실제로 있던 값\"'''이다. [[test-and-set]]이 \"옛 값\"을 돌려주는 것과 같은 철학. 호출자가 반환값을 `expected`와 비교해서 성공 여부를 판단한다.{/warn}\n\n== 이걸로 만든 스핀락 ==\n\n<pre class=\"c\">\n1   void lock(lock_t *lock) {\n2       while (CompareAndSwap(&lock->flag, 0, 1) == 1)\n3                ; // spin\n4   }\n<\/pre>\n\n읽는 법: \"'''flag가 0이길 기대하고, 맞으면 1로 바꿔라.'''\"\n\n{|\n! 락 상태 || 반환값 || 갱신되나 || 결과\n|-\n| free (flag=0) || '''0''' (= expected) || '''O''' — 0 → 1 || while 탈출 → '''획득'''\n|-\n| held (flag=1) || '''1''' || X — 기대값과 다르므로 '''건드리지 않음''' || 계속 spin\n|}\n\n{info}[[test-and-set]]과의 미묘한 차이: TAS는 held일 때도 '''1을 1로 덮어쓴다'''(무해하지만 쓰기는 한다). CAS는 '''아예 쓰지 않는다'''. 멀티코어에서 캐시 라인을 더럽히지 않는다는 실질적 이점이 있다.{/info}\n\n[[sim:cas_llsc]]\n\n== x86 실제 구현 (p.23) ==\n\n<pre class=\"c\">\n 1   char CompareAndSwap(int *ptr, int old, int new) {\n 2       unsigned char ret;\n 3\n 4       // Note that sete sets a 'byte' not the word\n 5       __asm__ __volatile__ (\n 6                \" lock\\n\"\n 7                \" cmpxchgl %2,%1\\n\"\n 8                \" sete %0\\n\"\n 9                : \"=q\" (ret), \"=m\" (*ptr)\n10                : \"r\" (new), \"m\" (*ptr), \"a\" (old)\n11                : \"memory\");\n12       return ret;\n13   }\n<\/pre>\n\n어셈블리 자체를 외울 필요는 없다. 포인트는 두 개:\n* '''`lock` prefix'''가 원자성을 보장한다 (버스/캐시 라인 잠금)\n* 슬라이드가 강조한 두 줄:\n** \"Compare-and-swap is '''identical to a simple spin lock''' (test-and-swap)\" — 락을 만드는 용도로는 [[test-and-set]]과 똑같다\n** \"A '''more powerful''' instruction than test-and-swap in that it can be used for implementing a '''lock-free synchronization'''\"\n\n== 왜 \"더 강력한가\" — lock-free ==\n\n[[test-and-set]]은 \"무조건 새 값으로 바꾼다\"라서 '''플래그 세우기'''밖에 못 한다. CAS는 \"'''내가 읽은 값이 아직 그대로면''' 바꿔라\"라고 말할 수 있어서, 락 없이 자료구조를 갱신하는 데 쓸 수 있다.\n\n<pre class=\"c\">\n// lock-free 스택 push — 락이 전혀 없다\nvoid push(node_t *n) {\n    node_t *old;\n    do {\n        old = head;            // 현재 head를 읽고\n        n->next = old;         // 내 노드를 그 앞에 붙일 준비\n    } while (CompareAndSwap((int *)&head, (int)old, (int)n) != (int)old);\n    // head가 그동안 안 바뀌었을 때만 성공. 바뀌었으면 처음부터 다시.\n}\n<\/pre>\n\n{analogy}🎭 [[test-and-set]]이 '''\"무조건 팻말을 사용중으로 뒤집고, 원래 뭐였는지 알려줘\"'''라면, CAS는 '''\"팻말이 아직 '비어 있음'이면 그때만 뒤집어\"'''다.\n이 조건부 성격 덕분에 위키 편집에 비유할 수 있다 — \"내가 읽은 판본이 아직 최신이면 저장, 그사이 누가 고쳤으면 저장 취소하고 다시 읽기\". 이게 lock-free 알고리즘의 기본 패턴이다.{/analogy}\n\n{warn}CAS의 알려진 약점은 '''ABA 문제'''다 — 내가 읽은 뒤 값이 A→B→A로 돌아오면 CAS는 \"안 바뀌었다\"고 착각한다. 값이 아니라 '''변경 여부'''를 보는 [[load-linked store-conditional|LL/SC]]는 이 문제가 없다.{/warn}\n\n== 평가 ==\n\nCAS로 만든 스핀락의 채점표는 [[test-and-set]] 스핀락과 '''완전히 동일'''하다:\n\n{|\n! Correctness || Fairness || Performance\n|-\n| Yes || '''No''' (starvation) || '''No''' (spin 낭비)\n|}\n\nCAS의 추가 가치는 '''락 바깥'''(lock-free 자료구조)에 있지, 락 자체를 개선하지는 않는다.\n\n{exam}🎯 \"test-and-set과 compare-and-swap의 차이를 쓰시오\"는 서술형 단골 후보다. 답의 두 축: ① '''조건부 갱신'''(expected와 같을 때만) ② '''lock-free synchronization에 쓸 수 있다'''. 락으로 쓰는 한에서는 동작이 같다는 점도 함께 적을 것.{/exam}\n\n{quiz}`CompareAndSwap(&flag, 0, 1)`이 '''1'''을 반환했다. `flag`의 현재 값과, 내가 락을 얻었는지 답하시오.{/quiz}\n{answer}반환값은 '''그 자리에 실제로 있던 값'''이므로 `flag`는 '''1'''(held)이었고, 기대값 0과 다르므로 '''갱신되지 않았다'''. 따라서 나는 '''락을 얻지 못했고''' 계속 spin해야 한다.{/answer}\n\n{quiz}CAS가 [[test-and-set]]보다 \"more powerful\"하다고 말하는 근거는 무엇인가?{/quiz}\n{answer}'''lock-free synchronization'''을 구현할 수 있기 때문이다. \"내가 읽은 값이 그대로일 때만 갱신\"이라는 조건부 의미 덕분에, 락 없이 공유 자료구조(스택·큐 등)를 안전하게 갱신하는 retry 루프를 만들 수 있다. (p.23){/answer}\n\n== 관련 문서 ==\n* [[test-and-set]] · [[fetch-and-add]] · [[load-linked store-conditional]] · [[atomic]]\n* [[spin lock]] · [[락]] · [[락 평가 기준]]"
 },

  "body": "{warn}⚠️ '''이 문서는 교수님 슬라이드에 없는 보충 내용이다.''' OSTEP 28.9에 나오고, [[RISC-V]]가 실제로 쓰는 방식이라 [[xv6]] 이해에 도움이 되어 정리해 둔다. 시험 우선순위는 [[test-and-set]] · [[compare-and-swap]] · [[fetch-and-add]] 세 개보다 낮다.{/warn}\n\n'''LL/SC'''는 원자 연산을 '''한 명령'''이 아니라 '''두 명령의 쌍'''으로 구현하는 방식이다.\n\n<pre class=\"c\">\nint LoadLinked(int *ptr) {\n    return *ptr;            // 값을 읽으면서 \"이 주소를 지켜보겠다\"고 하드웨어에 등록\n}\n\nint StoreConditional(int *ptr, int value) {\n    if (LoadLinked 이후 그 주소에 아무도 쓰지 않았다면) {\n        *ptr = value;\n        return 1;           // 성공\n    } else {\n        return 0;           // 실패 — 처음부터 다시 시도해야 한다\n    }\n}\n<\/pre>\n\n== 이걸로 만든 락 ==\n\n<pre class=\"c\">\nvoid lock(lock_t *lock) {\n    while (1) {\n        while (LoadLinked(&lock->flag) == 1)\n            ;                                   // 누가 쥐고 있으면 spin\n        if (StoreConditional(&lock->flag, 1) == 1)\n            return;                             // 내가 먼저 썼다 -> 획득\n        // 실패 = 그사이 남이 가져갔다 -> 바깥 while로 돌아가 재시도\n    }\n}\n\nvoid unlock(lock_t *lock) {\n    lock->flag = 0;\n}\n<\/pre>\n\n'''안쪽 while'''은 \"락이 free가 되기를 기다리는\" 부분, '''`if (StoreConditional...)`'''은 \"free가 된 순간 내가 먼저 잡았는지 확인\"하는 부분이다. 둘 다 통과해야 락을 얻는다.\n\n== CAS와의 차이 ==\n\n{|\n! || '''[[compare-and-swap|CAS]]''' || '''LL/SC'''\n|-\n| 판단 기준 || \"값이 '''기대값과 같으면'''\" || \"내가 읽은 뒤 '''아무도 안 건드렸으면'''\"\n|-\n| 명령 개수 || 1개 || '''2개(쌍)'''\n|-\n| ABA 문제 || '''있음''' (A→B→A면 못 알아챈다) || '''없음''' (건드린 사실 자체를 본다)\n|-\n| 대표 아키텍처 || x86 `cmpxchg` || '''[[RISC-V]] `lr.w` / `sc.w`''', ARM `LDREX`/`STREX`, MIPS `ll`/`sc`\n|}\n\n{analogy}🎭 CAS = '''\"잔액이 아직 5만 원이면 인출해 주세요\"'''. 그사이 누가 5만 원을 뺐다가 다시 5만 원을 넣었어도 은행은 통과시킨다(ABA).\nLL/SC = '''\"내가 통장을 확인한 뒤로 거래 기록이 하나도 없으면 인출해 주세요\"'''. 들어왔다 나간 흔적만 있어도 거절당한다 — 더 엄격하다.{/analogy}\n\n[[sim:cas_llsc]]\n\n{info}'''왜 하드웨어가 이걸 더 좋아하나?''' CAS 한 명령은 \"읽고-비교하고-쓰기\"를 한 사이클 안에 묶어야 해서 구현이 복잡하다. LL/SC는 '''캐시 라인에 예약(reservation) 비트 하나'''만 두면 된다 — LL이 비트를 세우고, 그 캐시 라인에 다른 코어가 쓰면 비트가 지워지고, SC는 비트를 확인한 뒤 쓴다. RISC 계열이 이 방식을 택한 이유다.{/info}\n\n{warn}[[xv6]]의 `acquire()`는 실제로는 LL/SC가 아니라 '''`amoswap.w.aq`'''([[test-and-set]]에 해당하는 AMO 명령)를 쓴다. [[RISC-V]]는 LR/SC와 AMO 명령을 '''둘 다''' 제공한다.{/warn}\n\n{quiz}CAS의 ABA 문제란 무엇이며, LL/SC는 왜 이 문제가 없는가?{/quiz}\n{answer}'''ABA 문제''' = 내가 값 A를 읽은 뒤 다른 스레드가 A→B→A로 바꿔 놓으면, CAS는 \"값이 여전히 A니까 아무 일도 없었다\"고 '''착각'''하고 갱신을 성공시킨다. 실제로는 자료구조가 바뀌었을 수 있어 위험하다.\nLL/SC는 '''값'''이 아니라 \"LoadLinked 이후 그 주소에 '''쓰기가 있었는가'''\"를 보므로, A→B→A라도 쓰기가 있었다는 사실을 잡아내 StoreConditional을 실패시킨다.{/answer}\n\n== 관련 문서 ==\n* [[compare-and-swap]] · [[test-and-set]] · [[fetch-and-add]] · [[atomic]]\n* [[spin lock]] · [[락]] · [[RISC-V]] · [[xv6]]"
 },
 "fetch-and-add": {
  "title": "Fetch-And-Add",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''Fetch-And-Add'''는 \"'''옛 값을 반환하면서 [[atomic|원자적]]으로 1 증가'''\"시키는 하드웨어 명령이다. 9강 p.25. 이것으로 [[ticket lock]]을 만들면 드디어 '''fairness'''가 해결된다.\n\n{exam}🎯🎯 '''2025F 중간고사 Problem 7(마지막 문제)이 FetchAdd 기반 락의 빈칸 채우기였다.''' 9강에서 '''가장 출제 확률이 높은''' 명령이다. 문제 원문과 교수님의 의도 답은 [[2025F 중간고사 족보]]에 그대로 옮겨 두었다.{/exam}\n\n[[img:L9-25.png|Fetch-And-Add Hardware atomic instruction (C-style)|large]]\n\n<pre class=\"c\">\n1      int FetchAndAdd(int *ptr) {\n2          int old = *ptr;\n3          *ptr = old + 1;\n4          return old;          // 여기서도 반환은 '옛 값'\n5      }\n<\/pre>\n\n{def}\"'''Atomically increment a value while returning the old value''' at a particular address.\"{/def}\n\n{warn}⭐ [[test-and-set]], [[compare-and-swap]]과 마찬가지로 '''반환값은 증가 후 값이 아니라 증가 전 값'''이다. 세 명령 모두 \"옛 값 / 실제 값\"을 돌려준다는 공통 패턴으로 묶어 외워라.{/warn}\n\n== 세 원자 명령 비교 ==\n\n{|\n! 명령 || 하는 일 || 반환 || 대표 용도\n|-\n| '''[[test-and-set]]''' || 무조건 새 값을 쓴다 || '''옛 값''' || [[spin lock]]의 flag\n|-\n| '''[[compare-and-swap]]''' || 기대값과 같을 때만 쓴다 || 실제 값 || lock-free 자료구조\n|-\n| '''fetch-and-add''' || 값을 '''1 증가'''시킨다 || '''옛 값''' || '''[[ticket lock]]''', 카운터, 시퀀스 번호\n|}\n\n{analogy}🎭 fetch-and-add = '''은행 번호표 발급기'''. 버튼을 누르면 ① 지금 번호를 뽑아 주고 ② 동시에 내부 카운터를 1 올린다. 두 사람이 동시에 눌러도 '''절대 같은 번호가 나오지 않는다'''. 이 \"고유 번호 보장\"이 곧 [[ticket lock]]의 fairness다.{/analogy}\n\n== 왜 이것만이 fairness를 만드나 ==\n\n[[test-and-set]]은 \"'''내가 잡았나?'''\"라는 예/아니오만 알려 준다. 락이 풀리는 순간 기다리던 모두가 동시에 달려들고, 누가 이길지는 운이다 → starvation 가능.\n\nfetch-and-add는 각 스레드에게 '''서로 다른 정수'''를 나눠 준다. 정수에는 '''순서'''가 있으므로 '''FIFO'''를 만들 수 있다.\n\n<pre class=\"ascii\">\nTestAndSet:  \"빈자리 있어요?\"  -> 예/아니오       -> 순서 정보 없음 -> starvation\nFetchAndAdd: \"번호표 주세요\"   -> 0, 1, 2, 3 ...  -> 순서 정보 있음 -> FIFO = fairness\n<\/pre>\n\n[[sim:ticket_lock]]\n\n== 2025F 기출 형태 미리보기 ==\n\n작년 시험은 ticket lock이 아니라 '''flag 하나를 FetchAdd로 증감시키는''' 변형을 냈다 (교수님 의도 답):\n\n<pre class=\"c\">\n13  void lock(lock_t *lock) {\n14      do {\n15        int old = (a) FetchAdd (&lock->flag, 1);\n16        if (old == (b) 0 ) {\n17          return;\n18        } else {\n19          (c) FetchAdd ( &lock->flag, -1);\n20        }\n21      } while ( (d) 1 );\n22  }\n23\n24  void unlock(lock_t *lock) {\n25      FetchAdd ( &lock->flag, -1);\n26  }\n<\/pre>\n\n읽는 법: 일단 flag를 1 올려 보고, '''옛 값이 0이었으면''' 내가 처음 = 획득. 아니면 올린 걸 도로 내리고(19번 줄) 재시도한다.\n\n{warn}이 문제는 교수님이 '''25번 줄을 잘못 써서''' 어떻게 풀어도 성립하지 않는 문제가 되었고, 결국 '''\"This problem has a flaw. I give full credit to all.\"'''로 처리되었다. 그래도 '''출제 형식'''(코드 빈칸 + FetchAdd)은 그대로 참고 대상이다. → [[2025F 중간고사 족보]]{/warn}\n\n{quiz}`FetchAndAdd(&ticket)`을 두 스레드가 \"동시에\" 호출했다. 두 스레드가 같은 값을 받을 수 있는가?{/quiz}\n{answer}'''없다.''' 읽기와 증가가 [[atomic|원자적]]으로 묶여 있어 중간 상태가 관찰되지 않으므로, 두 호출은 반드시 직렬화되어 서로 '''다른 옛 값'''(예: 0과 1)을 받는다. 이 고유성이 [[ticket lock]]의 FIFO 보장의 근거다.{/answer}\n\n{quiz}`FetchAndAdd`가 없다면 `ticket++`로 대신할 수 있는가?{/quiz}\n{answer}'''없다.''' `ticket++`는 load / add / store 세 명령이라 [[counter 예제]]와 똑같은 [[race condition]]이 생겨 '''두 스레드가 같은 번호표'''를 받을 수 있다. 그러면 둘 다 `turn`이 그 번호가 될 때 동시에 진입해 [[mutual exclusion]]이 깨진다.{/answer}\n\n== 관련 문서 ==\n* [[ticket lock]] · [[락]] · [[락 평가 기준]] · [[fairness]]\n* [[test-and-set]] · [[compare-and-swap]] · [[atomic]]\n* [[2025F 중간고사 족보]] · [[자주 틀리는 함정 모음]]"
 },
 "ticket lock": {
  "title": "Ticket Lock (티켓 락)",
  "category": [
   "9강 Lock",
   "핵심"
  ],
  "body": "'''Ticket lock'''은 [[fetch-and-add]]로 만든, '''fairness를 보장하는''' 최초의 락이다. 9강 p.26~29. 은행 번호표 시스템과 구조가 완전히 같다.\n\n{exam}⭐⭐⭐ '''2025F 중간고사 기출 영역.''' 교수님은 \"fetch-and-add 기반 락 코드의 빈칸\"을 마지막 문제로 냈다. (myturn, ticket, turn) 세 값을 '''손으로 추적'''하는 연습이 필수다. → [[2025F 중간고사 족보]]{/exam}\n\n[[img:L9-26.png|Ticket Lock — ticket과 turn 두 필드로 구현|large]]\n\n<pre class=\"c\">\n 1   typedef struct __lock_t {\n 2       int ticket;                                  // 다음에 발급될 번호표\n 3       int turn;                                    // 지금 서비스 중인 번호\n 4   } lock_t;\n 5\n 6   void lock_init(lock_t *lock) {\n 7       lock->ticket = 0;\n 8       lock->turn = 0;\n 9   }\n10\n11   void lock(lock_t *lock) {\n12       int myturn = FetchAndAdd(&lock->ticket);     // (1) 번호표 뽑기 (원자적)\n13       while (lock->turn != myturn)                 // (2) 내 차례 기다리기\n14                ; // spin\n15   }\n16   void unlock(lock_t *lock) {\n17       FetchAndAdd(&lock->turn);                    // (3) \"다음 손님!\"\n18   }\n<\/pre>\n\n== 변수 세 개 ==\n\n{|\n! 변수 || 정체 || 누가 바꾸나\n|-\n| '''`ticket`''' || 다음에 '''발급될''' 번호표 (번호표 발급기의 현재 숫자) || `lock()`이 [[fetch-and-add]]로 증가\n|-\n| '''`turn`''' || 지금 '''서비스 중인''' 번호 (전광판) || `unlock()`이 [[fetch-and-add]]로 증가\n|-\n| '''`myturn`''' || '''내가 뽑은''' 번호표 — '''스레드마다 다른 [[스레드 스택|스택]]의 지역 변수''' || 자기 자신만\n|}\n\n{warn}⭐ `myturn`이 '''공유 변수가 아니라 지역 변수'''라는 점이 중요하다. 각 스레드가 자기 번호표를 손에 쥐고 있고, 그 번호는 [[fetch-and-add]] 덕에 '''절대 겹치지 않는다'''.{/warn}\n\n== 동작 추적 (p.27~28) ==\n\n[[img:L9-27.png|Ticket Lock (Cont.) 그림 1 — ①~⑤. T1은 즉시 획득, T2는 myturn=1로 spinning|large]]\n\n{|\n! 마커 || 무슨 일 || myturn || ticket || turn\n|-\n| ① || `lock_init` — 초기 상태 || — || '''0''' || '''0'''\n|-\n| ② || '''Thread1 & Context Switch''' — T1이 `FetchAndAdd(&ticket)` 호출 → myturn=0을 받고 ticket은 1이 됨 || T1: '''0''' || '''1''' || 0\n|-\n| ③ || Thread2 진입 || || ||\n|-\n| ④ || '''Thread2 & Spinning''' — T2가 번호표를 뽑아 myturn=1, ticket은 2로. `turn(0) != myturn(1)` → '''spin''' || T2: '''1''' || '''2''' || 0\n|-\n| ⑤ || T1 복귀: `turn(0) == myturn(0)` → '''obtain the lock!''' || || 2 || 0\n|}\n\n[[img:L9-28.png|Ticket Lock (Cont.) 그림 2 — ⑥⑦. unlock이 turn을 1로 올리자 T2가 정확히 다음 차례로 들어간다|large]]\n\n{|\n! 마커 || 무슨 일 || ticket || turn\n|-\n| ⑥ || T1이 `unlock()` → `FetchAndAdd(&turn)` → turn이 1이 됨 || 2 || '''1'''\n|-\n| ⑦ || spin 중이던 T2: `turn(1) == myturn(1)` → '''obtain the lock!''' || 2 || 1\n|}\n\n[[sim:ticket_lock]]\n\n{analogy}🎭 '''은행 번호표.''' `ticket` = 입구의 발급기, `turn` = 벽의 전광판, `myturn` = 내 손의 종이.\n① 들어오면서 번호표를 뽑고(12번 줄) ② 전광판에 내 번호가 뜰 때까지 앉아서 기다리고(13번 줄) ③ 볼일이 끝나면 전광판을 1 올린다(17번 줄).\n'''발급기가 원자적'''이라 두 사람이 같은 번호를 받을 수 없고, 전광판이 '''1씩만''' 올라가므로 '''순서를 건너뛸 수 없다'''. 이게 fairness의 전부다.{/analogy}\n\n== 왜 fairness가 보장되나 (p.29) ==\n\n{def}\"'''Ensure progress for all threads''' → '''fairness'''\"\n* '''Correctness: Yes'''\n* '''Fairness: Yes''' — \"Fetch-and-Add enable multiple threads to '''equally share''' the critical section\"\n* '''Performance: No''' — \"In the single CPU, performance overheads can be quite painful… every other thread will spin for a given time slice\"{/def}\n\n논리 사슬:\n# [[fetch-and-add]]가 각 스레드에게 '''고유한''' `myturn`을 준다\n# `turn`은 `unlock()`마다 '''정확히 1씩''' 올라간다\n# 따라서 번호표를 먼저 뽑은 스레드가 '''반드시 먼저''' 들어간다 = '''FIFO'''\n# FIFO면 '''starvation이 불가능'''하다 — 앞에 있는 사람 수는 유한하고 계속 줄어든다\n\n[[spin lock]](TAS)과의 본질적 차이가 여기다. TAS는 락이 풀릴 때 '''모두가 다시 경쟁'''하지만, ticket lock은 '''순서가 이미 정해져 있다'''.\n\n{warn}⭐ '''남은 문제는 performance뿐이다.''' 자기 차례를 기다리는 스레드는 여전히 `while (turn != myturn)`을 돌며 [[time slice]]를 태운다. 락 보유자가 preempt되면 나머지가 전부 낭비한다. 이 문제는 [[yield 락]] → [[queue 락]]에서 해결된다.{/warn}\n\n== 채점표 변화 ==\n\n{|\n! || Correctness || Fairness || Performance\n|-\n| [[spin lock]] (p.24) || Yes || '''No''' || No\n|-\n| '''ticket lock''' (p.29) || Yes || '''Yes''' ← 바뀐 칸 || No\n|}\n\n{quiz}ticket=0, turn=0인 상태에서 T1, T2, T3가 순서대로 `lock()`을 호출했다. 각자의 `myturn`과 이때의 `ticket`, `turn` 값을 쓰시오. 그리고 T1이 `unlock()`한 뒤 누가 들어가는가?{/quiz}\n{answer}T1: myturn=0, T2: myturn=1, T3: myturn=2. 호출이 모두 끝난 시점에 '''ticket=3, turn=0'''이다.\n`turn(0) == myturn(0)`이므로 '''T1만 진입'''하고 T2·T3는 spin한다.\nT1이 `unlock()`하면 `FetchAndAdd(&turn)`으로 '''turn=1''' → `myturn`이 1인 '''T2가 진입'''한다. 번호표 순서 그대로다.{/answer}\n\n{quiz}`unlock()`에서 `turn++` 대신 `FetchAndAdd(&turn)`을 쓰는 이유는?{/quiz}\n{answer}형식적 일관성과 안전을 위해서다. 사실 락을 '''쥔 스레드는 하나뿐'''이라 `turn++`로도 대개 문제가 없지만, `turn`은 다른 스레드들이 '''동시에 읽고 있는''' 공유 변수이므로 원자 명령으로 갱신하는 편이 안전하다. 슬라이드는 [[fetch-and-add]]로 통일해 보여 준다.{/answer}\n\n{quiz}ticket lock에서 starvation이 불가능한 이유를 한 문장으로 쓰시오.{/quiz}\n{answer}각 스레드가 [[fetch-and-add]]로 '''고유한 번호'''를 받고 `turn`이 '''1씩 순서대로''' 올라가므로, 어떤 스레드 앞에 있는 대기자 수는 유한하고 계속 줄어들어 '''반드시 자기 차례가 온다'''(FIFO).{/answer}\n\n== 시험 대비 핵심 요약 ==\n# `myturn = FetchAndAdd(&ticket)` — 번호표 뽑기, '''원자적'''이라 고유\n# `while (turn != myturn) ;` — 내 차례까지 spin\n# `unlock`은 `FetchAndAdd(&turn)` — \"다음 손님\"\n# '''Correctness Yes / Fairness Yes / Performance No'''\n# fairness의 근거 = '''고유한 번호 + 1씩 증가하는 turn = FIFO'''\n# 남은 문제 = spin 낭비 → [[yield 락]], [[queue 락]]으로\n\n== 관련 문서 ==\n* [[fetch-and-add]] · [[락]] · [[락 평가 기준]] · [[spin lock]]\n* [[yield 락]] · [[queue 락]] · [[fairness]] · [[time slice]]\n* [[2025F 중간고사 족보]] · [[자주 틀리는 함정 모음]]"
 },
 "yield 락": {
  "title": "yield 락 (A Simple Approach: Just Yield)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''\"spin할 것 같으면 CPU를 양보하라.\"''' 9강 p.31~32. [[spin lock]]의 performance 문제에 OS가 처음으로 손을 대는 단계다.\n\n[[img:L9-31.png|A Simple Approach: Just Yield — Lock with Test-and-set and Yield|large]]\n\n<pre class=\"c\">\n 1   void init() {\n 2       flag = 0;\n 3   }\n 4\n 5   void lock() {\n 6       while (TestAndSet(&flag, 1) == 1)\n 7           yield();  // give up the CPU\n 8   }\n 9\n10   void unlock() {\n11       flag = 0;\n12   }\n<\/pre>\n\n[[spin lock]]과 딱 '''한 줄'''만 다르다 — 7번 줄이 `;`(제자리 돌기)에서 `yield();`(양보)로 바뀌었다.\n\n{def}\"When you are going to spin, '''give up the CPU''' to another thread.\n'''OS system call''' moves the caller from the '''running state to the ready state'''.\"{/def}\n\n{|\n! || [[spin lock]] || yield 락\n|-\n| 대기 중 하는 일 || 제자리에서 값 확인 반복 || '''스케줄러에게 CPU 반납'''\n|-\n| 상태 전이 || Running 유지 || '''Running → Ready'''\n|-\n| 남은 [[time slice]] || 통째로 낭비 || '''남에게 넘어감'''\n|}\n\n{warn}⭐ `yield()`는 '''Running → Ready'''다. '''Blocked가 아니다.''' 자원을 기다리며 잠드는 게 아니라 \"지금은 내 차례를 양보하겠다\"일 뿐이라, [[스케줄러]]는 곧 다시 이 스레드를 고른다. 이 점이 아래 문제 1의 원인이다.{/warn}\n\n== 무엇이 남았나 (p.32) ==\n\n{warn}🔥 '''문제 1 — Context switch 비용'''\n\"The cost of a context switch can be '''substantial'''.\n* Imagine that there are '''N threads'''\n* If thread 1 holding the lock goes into sleep, the rest '''N−1 threads perform yield(), causing N−1 context switches (run-and-yield)'''\n* If thread 1 holds the lock for a long time, the N−1 threads repeat run-and-yields, making the overhead '''severe'''\"\n\n즉 '''낭비의 종류만 바뀌었다''' — [[time slice]]를 통째로 태우는 대신, '''컨텍스트 스위치를 N−1번씩 계속''' 하게 된다.\n\n🔥 '''문제 2 — Starvation 여전'''\n\"There is a possibility that the '''thread 1 repeatedly gets the lock'''.\" 누가 다음에 잡을지는 여전히 운이다. [[ticket lock]]과 달리 순서 정보가 없다.{/warn}\n\n<pre class=\"ascii\">\nCPU 1개, 스레드 5개. T1이 락을 쥔 채 preempt:\n\n spin lock :  T2[===== time slice 통째 spin =====] T3[===== spin =====] T4[=== spin ===] ...\n yield 락  :  T2[y] T3[y] T4[y] T5[y] T2[y] T3[y] T4[y] T5[y] ...\n                ^                                    ^\n                |                                    |\n          곧바로 yield하니 slice 낭비는 없다      그러나 컨텍스트 스위치가 폭발한다\n<\/pre>\n\n{analogy}🎭 [[spin lock]]이 '''화장실 문 앞에 서서 손잡이를 계속 돌리는 것'''이라면, yield 락은 '''문을 한 번 밀어 보고 안 열리면 줄 맨 뒤로 갔다가, 다시 앞으로 와서 또 밀어 보는 것'''이다.\n자리를 지키느라 시간을 낭비하지는 않지만, '''왔다 갔다 하는 데 드는 발품'''(컨텍스트 스위치)이 만만치 않고, '''먼저 온 사람이 먼저 들어간다는 보장도 없다'''.\n\n진짜 해법은 '''대기실 의자에 앉아 이름이 불릴 때까지 자는 것''' — [[park와 unpark]]이다.{/analogy}\n\n== 교훈 ==\n\n\"무작정 양보\"는 낭비를 '''줄일 뿐 없애지 못하고''', 순서 보장도 없다. 그래서 다음 단계는:\n# '''대기자 명단(queue)'''을 만들어 순서를 기록하고\n# 기다리는 스레드를 '''정말로 재우고''' ([[park와 unpark|park()]])\n# 락이 풀리면 '''정확히 한 명만 깨운다''' ([[park와 unpark|unpark()]])\n\n→ [[queue 락]]\n\n{quiz}스레드가 N개일 때 yield 락의 오버헤드를 설명하시오.{/quiz}\n{answer}락을 쥔 스레드가 잠들거나 preempt되면, 나머지 '''N−1개 스레드가 각각 스케줄됐다가 즉시 `yield()`'''하는 run-and-yield를 반복한다. 즉 락이 풀릴 때까지 '''N−1번의 [[컨텍스트 스위치]]가 계속 발생'''하며, 락을 오래 쥘수록 오버헤드가 심해진다. (p.32){/answer}\n\n{quiz}yield 락은 [[락 평가 기준]] 세 가지 중 무엇을 개선했고 무엇을 개선하지 못했는가?{/quiz}\n{answer}'''Performance를 부분적으로''' 개선했다 — spin으로 [[time slice]]를 통째로 태우지는 않는다. 그러나 '''컨텍스트 스위치 비용'''이 대신 발생하므로 완전한 해결은 아니다. '''Fairness는 전혀 개선되지 않았다''' — 순서 보장이 없어 같은 스레드가 반복해서 락을 잡는 starvation이 여전히 가능하다.{/answer}\n\n== 관련 문서 ==\n* [[락]] · [[spin lock]] · [[test-and-set]] · [[락 평가 기준]]\n* [[queue 락]] · [[park와 unpark]] · [[ticket lock]]\n* [[yield]] · [[프로세스 상태]] · [[컨텍스트 스위치]] · [[time slice]]"
 },
 "queue 락": {
  "title": "queue 락 (Using Queues: Sleeping Instead of Spinning)",
  "category": [
   "9강 Lock",
   "핵심"
  ],
  "body": "'''queue 락'''은 \"기다림\"을 CPU 낭비(spin)가 아니라 '''명단에 이름 적고 자기'''로 바꾼 락이다. 9강 p.33~35. 드디어 [[락 평가 기준]] 세 칸이 모두 Yes가 되는 구조다.\n\n{def}p.33: \"'''Queue''' to keep track of which threads are waiting to get the lock.\"\n* '''`park()`''' — Put a calling thread to sleep\n* '''`unpark(threadID)`''' — Wake a particular thread as designated by threadID{/def}\n\n== lock() (p.34) ==\n\n[[img:L9-34.png|Lock With Queues, Test-and-set, Yield, And Wakeup — lock() 부분|large]]\n\n<pre class=\"c\">\n 1   typedef struct __lock_t { int flag; int guard; queue_t *q; } lock_t;\n 2\n 3   void lock_init(lock_t *m) {\n 4       m->flag  = 0;\n 5       m->guard = 0;\n 6       queue_init(m->q);\n 7   }\n 8\n 9   void lock(lock_t *m) {\n10       while (TestAndSet(&m->guard, 1) == 1)\n11           ;                            // (1) acquire guard lock by spinning\n12       if (m->flag == 0) {\n13           m->flag = 1;                 // (2) lock is acquired\n14           m->guard = 0;                //     guard lock is freed; the other thread can come\n15       } else {\n16           queue_add(m->q, gettid());   // (3) put a thread ID to the queue\n17           m->guard = 0;                //     guard lock is freed\n18           park();                      // (4) go to sleep\n19       }\n20   }\n<\/pre>\n\n'''슬라이드 주석''': ''m->guard prevents the function lock from being executed by multiple threads simultaneously''\n\n{|\n! 필드 || 정체 || 보호 대상\n|-\n| '''`flag`''' || '''진짜 락''' (0=free, 1=held) || 사용자의 [[critical section]]\n|-\n| '''`guard`''' || '''보조 [[spin lock]]''' — \"락을 만들기 위한 락\" || `flag`와 `q` 자체 (lock/unlock 함수 내부)\n|-\n| '''`q`''' || 대기 중인 스레드 ID들의 큐 || —\n|}\n\n'''줄 읽기'''\n* 10~11: [[guard]]를 [[test-and-set]]으로 spin 획득. '''여기만 spin'''한다.\n* 12~14: 락이 비어 있으면 내가 갖고(`flag=1`) guard를 놓는다.\n* 15~18: 이미 잠겨 있으면 '''대기열에 내 TID를 넣고''' → guard를 놓고 → '''[[park와 unpark|park()]]로 잠든다'''.\n\n{warn}'''17번 줄과 18번 줄의 순서에 주목.''' guard를 '''먼저 놓고 나서''' 잠든다. guard를 쥔 채 잠들면 아무도 `unlock()`에 들어올 수 없어 '''데드락'''이 된다. 그런데 이 \"놓고 나서 잠들기\" 사이의 틈이 바로 아래 '''wakeup/waiting race'''를 만든다. 피할 수 없는 트레이드오프다.{/warn}\n\n== unlock() (p.35) ==\n\n[[img:L9-35.png|unlock()과 Limitations — 대기자가 있으면 flag를 내리지 않고 hand-off한다|large]]\n\n<pre class=\"c\">\n22   void unlock(lock_t *m) {\n23       while (TestAndSet(&m->guard, 1) == 1)\n24            ;                                  // guard 획득\n25       if (queue_empty(m->q))\n26            m->flag = 0;                       // let go of lock; no one wants it\n27       else\n28            unpark(queue_remove(m->q));        // hold lock (for next thread!)\n29       m->guard = 0;                           // guard lock is freed\n30   }\n<\/pre>\n\n{warn}⭐ '''가장 미묘하고 가장 잘 나오는 디테일''': 대기자가 있으면 '''`flag`를 0으로 내리지 않는다'''(28번 줄에는 `m->flag = 0;`이 없다). 락을 '''손에서 손으로 직접 넘기는''' 것 — 슬라이드 주석 그대로 ''hold lock (for next thread!)''.\n\n왜 그래야 하나? flag를 0으로 내려 버리면, 깨어난 스레드가 [[park와 unpark|park()]]에서 리턴한 직후 '''락이 자기 것이라고 믿고''' 진행하는데 그사이 제3의 스레드가 `lock()`에 들어와 flag=1을 해 버릴 수 있다. hand-off는 그 틈을 없앤다.{/warn}\n\n[[sim:queue_lock]]\n\n== Limitations (p.35) ==\n\n{warn}🔥 '''1. Don't avoid spin-waiting entirely'''\n\"`m->guard` is used as a '''spin-lock around the flag and queue'''. But, the time spent spinning is '''quite limited (just a few instructions)'''.\"\n→ spin이 사라진 게 아니라 '''아주 짧은 구간으로 한정'''된 것이다. 사용자의 critical section이 아무리 길어도 guard 구간은 몇 명령어다.\n\n🔥 '''2. Sleep forever — Wakeup/waiting race condition'''\n→ 아래.{/warn}\n\n=== 🔥 Wakeup/Waiting Race (p.36) ===\n\n[[img:L9-36.png|Wakeup/Waiting Race — ①②③④. Thread A가 영원히 잠든다|large]]\n\n{def}\"In case of releasing the lock (thread A) '''just before the call to `park()`''' (thread B) → '''Thread B would sleep forever''' (potentially)\"{/def}\n\n{|\n! 마커 || 무슨 일\n|-\n| ① || '''Thread A & Context Switch''' — A가 `queue_add` + `guard = 0`까지 실행했는데 '''`park()` 직전에''' 끊긴다\n|-\n| ② || '''Thread B'''가 `unlock()` 진입 (guard 획득)\n|-\n| ③ || '''Thread B'''가 `unpark(queue_remove(m->q))` 호출 — 그런데 '''A는 아직 잠들지 않았다''' → 깨우기 신호가 허공에 사라진다 ('''lost wakeup''')\n|-\n| ④ || A가 다시 스케줄되어 `park()` 실행 → '''영원히 잠듦'''. 슬라이드 주석: ''Thread A wakes up but starts to sleep immediately''\n|}\n\n{warn}⭐⭐ '''p.18([[flag 락]])의 race와 구조가 완전히 같다.'''\n\n{|\n! || 분리된 두 동작 || 그 틈에 일어나는 일\n|-\n| [[flag 락]] || TEST(검사) … SET(표시) || 남도 검사를 통과한다\n|-\n| queue 락 || 큐에 등록 … `park()`(잠들기) || `unpark`이 먼저 지나가 버린다\n|}\n\n'''[[atomic|원자적]]이어야 할 두 동작이 분리되어 있으면 반드시 race가 생긴다''' — 9강 전체를 관통하는 패턴이다.{/warn}\n\n해결책은 두 가지:\n* '''[[setpark]]''' — \"나 곧 잘 거야\"를 미리 예고 (Solaris)\n* '''[[futex|futex_wait(addr, value)]]''' — 잠들기 직전에 값을 다시 확인하는 일을 커널이 원자적으로 (Linux)\n\n{analogy}🎭 queue 락 = '''병원 접수'''다.\n[[spin lock]]이 진료실 문 앞에 서 있는 것, [[yield 락]]이 나갔다 들어왔다 하는 것이라면, queue 락은 '''접수하고(queue_add) 대기실 의자에 앉아 자는 것'''(park)이다. 이름이 불리면(unpark) 일어나 들어간다.\n\n[[guard]]는 '''접수 창구'''다. 접수 자체는 한 번에 한 사람만 할 수 있어야 하므로 거기엔 줄을 서야 하지만(spin), 접수는 '''몇 초'''면 끝난다.\n\n그리고 wakeup/waiting race는 '''접수는 마쳤는데 아직 의자에 앉기 전에 내 이름이 불린 상황'''이다. 뒤늦게 의자에 앉아 자면 아무도 다시 불러 주지 않는다.{/analogy}\n\n== 평가 ==\n\n{|\n! || Correctness || Fairness || Performance\n|-\n| [[ticket lock]] || Yes || Yes || '''No'''\n|-\n| '''queue 락''' (+[[setpark]]) || Yes || Yes (큐 FIFO) || '''Yes''' ← 바뀐 칸\n|}\n\np.42의 최종 평가: \"'''Performance: Yes''' — Spinning problem can be mitigated with '''yield and sleeping'''.\"\n\n{quiz}queue 락에서 `guard`와 `flag`의 역할 차이를 설명하시오.{/quiz}\n{answer}'''`flag`'''는 사용자의 [[critical section]]을 보호하는 '''진짜 락'''이고, '''`guard`'''는 `lock()`/`unlock()` 함수 안에서 '''`flag`와 큐 자체를 보호하는 보조 [[spin lock]]'''이다. guard 덕분에 \"flag 검사 → 큐 등록\" 같은 여러 단계를 원자적으로 수행할 수 있다. guard 구간은 몇 명령어로 아주 짧으므로 spin해도 손해가 작다.{/answer}\n\n{quiz}`unlock()`에서 대기자가 있을 때 `flag`를 0으로 내리지 않는 이유는?{/quiz}\n{answer}락을 다음 스레드에게 '''직접 넘기기(hand-off)''' 위해서다. flag를 0으로 내리면 깨어난 스레드가 도착하기 전에 제3의 스레드가 락을 채 갈 수 있다. flag를 1로 유지한 채 `unpark`만 하면, 깨어난 스레드는 '''이미 자기 것이 된 락'''을 들고 그대로 진행하면 된다.{/answer}\n\n{quiz}Wakeup/waiting race가 발생하는 정확한 시점과 결과를 쓰시오.{/quiz}\n{answer}스레드 A가 `queue_add` 후 `m->guard = 0`까지 했지만 '''`park()`를 호출하기 직전'''에 선점된 시점이다. 이때 다른 스레드 B가 `unlock()`에서 '''`unpark(A)`를 먼저 호출'''하면, A는 아직 자고 있지 않으므로 그 깨우기 신호가 '''사라진다'''(lost wakeup). 이후 A가 `park()`를 실행하면 깨워 줄 사람이 없어 '''영원히 잠든다'''. (p.36){/answer}\n\n== 관련 문서 ==\n* [[park와 unpark]] · [[setpark]] · [[guard]] · [[futex]]\n* [[락]] · [[락 평가 기준]] · [[spin lock]] · [[yield 락]] · [[ticket lock]]\n* [[test-and-set]] · [[race condition]] · [[atomic]]\n* [[자주 틀리는 함정 모음]]"
 },
 "park와 unpark": {
  "title": "park() / unpark() (Sleeping Instead of Spinning)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''`park()` / `unpark()`'''는 [[queue 락]]을 만들기 위해 OS가 제공하는 두 프리미티브다. 9강 p.33. Solaris 계열의 API다.\n\n{def}p.33 원문:\n* '''`park()`''' — \"Put a calling thread to '''sleep'''.\"\n* '''`unpark(threadID)`''' — \"'''Wake''' a particular thread as designated by `threadID`.\"{/def}\n\n{warn}⭐ '''`unpark`는 \"아무나\"가 아니라 \"지정한 스레드 하나\"를 깨운다.''' 그래서 [[queue 락]]이 대기열에 '''TID'''(`gettid()`)를 저장해 두는 것이다. \"깨어난 여럿이 다시 경쟁\"하는 thundering herd가 없고, 이것이 fairness의 근거가 된다.{/warn}\n\n== 무엇이 달라지는가 ==\n\n{|\n! 대기 방식 || 하는 일 || 상태 || 비용\n|-\n| '''[[spin lock|spin]]''' || 값을 계속 확인 || Running 유지 || '''[[time slice]] 전체 낭비'''\n|-\n| '''[[yield 락|yield]]''' || CPU 양보 || Running → '''Ready''' || 컨텍스트 스위치 N−1회 반복\n|-\n| '''park''' || 잠듦 || Running → '''Blocked''' || '''스케줄러가 아예 고르지 않음''' — 깨울 때까지 0\n|}\n\n{warn}⭐ '''`yield()`는 Ready, `park()`는 Blocked다.''' Ready인 스레드는 [[스케줄러]]가 계속 다시 골라 주지만(그래서 run-and-yield가 반복된다), Blocked인 스레드는 '''`unpark`이 오기 전까지 후보에서 아예 빠진다'''. 이 차이가 [[yield 락]]과 [[queue 락]]의 성능 차이 전부다.{/warn}\n\n== 쓰이는 자리 ==\n\n<pre class=\"c\">\n// lock() — 락이 이미 잡혀 있을 때\nqueue_add(m->q, gettid());   // 대기열에 내 TID 등록\nm->guard = 0;                // guard 해제\npark();                      // 잠들기\n\n// unlock() — 대기자가 있을 때\nunpark(queue_remove(m->q));  // 큐에서 꺼낸 TID의 스레드를 깨움 (flag는 1로 유지 = hand-off)\n<\/pre>\n\n[[sim:queue_lock]]\n\n{analogy}🎭 '''병원 대기실 의자'''다.\n[[spin lock]] = 진료실 문 앞에 서서 계속 문을 밀어 본다.\n[[yield 락]] = 밀어 보고 안 열리면 밖에 나갔다가 다시 들어와 또 밀어 본다.\n'''park''' = 접수하고 '''의자에 앉아 잔다'''. 간호사가 '''내 이름을 콕 집어''' 부를 때만 일어난다(`unpark(threadID)`).\n간호사가 \"다음 분~\"이라고만 외치면 모두가 깨어나 다시 경쟁하겠지만, '''이름을 부르므로''' 그런 일이 없다.{/analogy}\n\n== 알려진 함정: lost wakeup ==\n\n{warn}🔥 `park()`와 \"대기열 등록\"이 '''분리된 두 동작'''이라, 그 사이에 `unpark`이 먼저 도착하면 '''깨우기 신호가 사라진다''' → 이후의 `park()`는 영원히 잠든다. 이것이 [[queue 락]]의 '''wakeup/waiting race'''(p.36)다.\n\n해결:\n* '''[[setpark]]''' — \"나 곧 park할 거야\"를 미리 선언해 두면, 그 뒤에 온 `unpark`이 예약을 소모하고 `park()`는 즉시 리턴한다 (Solaris)\n* '''[[futex|futex_wait(address, value)]]''' — 잠들기 직전 값 검사를 '''커널이 원자적으로''' 수행 (Linux){/warn}\n\n== park/unpark vs futex (p.41) ==\n\n{|\n! || '''park/unpark''' (Solaris) || '''[[futex]]''' (Linux)\n|-\n| 성격 || '''Purely scheduling primitive''' — \"재워라/깨워라\"만 안다 || 락 지원에 특화된 시스템 콜\n|-\n| 커널이 유지하는 상태 || '''minimal state''' || '''대기 queue를 커널이 직접 관리''' (락 상태는 유저가 소유)\n|-\n| 그래서 가능한 것 || — || '''Fair wakeup''' ([[priority inversion|priority inheritance]]) · '''Robust mutexes''' (owner-death detection)\n|}\n\n{exam}🎯 \"커널이 대기 큐를 관리하면 무엇이 좋은가?\"의 답 두 가지가 슬라이드에 그대로 있다: '''fair wakeup (priority inheritance)'''과 '''robust mutexes (owner-death detection)'''. 단답으로 나오기 좋다.{/exam}\n\n{quiz}`yield()`와 `park()`의 차이를 [[프로세스 상태]] 전이로 설명하시오.{/quiz}\n{answer}`yield()`는 '''Running → Ready'''로, 스레드는 여전히 실행 후보에 남아 [[스케줄러]]가 곧 다시 고른다(그래서 run-and-yield가 반복된다). `park()`는 '''Running → Blocked'''로, '''`unpark`이 올 때까지 스케줄 후보에서 완전히 제외'''되어 CPU를 전혀 소비하지 않는다.{/answer}\n\n{quiz}`unpark`이 \"특정 스레드 하나\"를 지정해 깨우는 설계의 장점은?{/quiz}\n{answer}락이 풀릴 때 '''대기자 전원이 깨어나 다시 경쟁'''하는 일(thundering herd)이 없고, 큐의 '''순서대로''' 정확히 한 명만 깨울 수 있어 '''fairness'''가 보장된다. 그래서 [[queue 락]]은 대기열에 스레드 ID(`gettid()`)를 저장한다.{/answer}\n\n== 관련 문서 ==\n* [[queue 락]] · [[setpark]] · [[guard]] · [[futex]]\n* [[락]] · [[spin lock]] · [[yield 락]] · [[yield]]\n* [[프로세스 상태]] · [[스케줄러]] · [[priority inversion]]"
 },
 "setpark": {
  "title": "setpark()",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''`setpark()`'''는 [[queue 락]]의 '''wakeup/waiting race'''를 해결하기 위해 Solaris가 추가한 '''세 번째 시스템 콜'''이다. 9강 p.37~38.\n\n{def}\"Solaris solves this problem by adding a '''third system call: `setpark()`'''\n* By calling this routine, a thread can indicate it is '''about to park'''\n* If it happens to be interrupted and another thread calls `unpark` before `park` is actually called, the '''subsequent `park` returns immediately instead of sleeping'''\"{/def}\n\n== 코드 수정 (p.37) ==\n\n<pre class=\"c\">\n1   queue_add(m->q, gettid());\n2   setpark();       // new code  -- \"나 곧 park할 거야\" 예고\n3   m->guard = 0;\n4   park();\n<\/pre>\n\n원래 코드와 비교하면 '''2번 줄 한 줄'''이 추가됐을 뿐이다. 위치도 중요하다 — '''`m->guard = 0` 이전'''에 놓아야 한다. guard를 놓는 순간부터 다른 스레드가 `unlock()`에 들어올 수 있으므로, '''그 전에''' 예약을 걸어 둬야 한다.\n\n== 어떻게 race가 사라지나 (p.38) ==\n\n[[img:L9-38.png|setpark() (Cont.) — ①②③. unpark이 먼저 와도 park()가 무시된다|large]]\n\n{|\n! 마커 || 무슨 일\n|-\n| ① || '''Thread A & Context Switch''' — A가 `queue_add` + '''`setpark()`'''까지 하고 끊긴다\n|-\n| ② || ''Thread B '''cannot progress until `m->guard = 0`''''' — B는 guard를 못 잡아 잠시 대기\n|-\n| ③ || ''Thread B now invokes `unpark()`, '''subsequent `park()` is ignored'''''  → A가 나중에 `park()`를 불러도 '''무시되고 즉시 진행'''\n|}\n\n{warn}⭐ '''핵심은 \"예약을 소모한다\"는 것.''' `setpark()`가 \"나 곧 잘 거야\" 표시를 세워 두고, `unpark()`이 그 표시를 '''소모'''한다. 표시가 이미 소모된 상태에서 `park()`가 호출되면 잠들지 않고 그냥 리턴한다. lost wakeup이 '''기록으로 남아''' 사라지지 않는 셈이다.{/warn}\n\n== 비교: race가 있는 버전 vs setpark 버전 ==\n\n{|\n! || [[queue 락|setpark 없음]] (p.36) || setpark 있음 (p.38)\n|-\n| A: 큐 등록 || O || O\n|-\n| A: 예약 || — || '''`setpark()`'''\n|-\n| A: guard 해제 || O || O\n|-\n| ''(여기서 A가 선점)'' || ||\n|-\n| B: `unpark(A)` || '''신호가 허공에 사라짐''' || '''예약을 소모함'''\n|-\n| A: `park()` || '''영원히 잠듦''' 🔥 || '''즉시 리턴''' ✅\n|}\n\n[[sim:queue_lock]]\n\n{analogy}🎭 '''택배 부재중 표'''다.\nsetpark 없는 버전 = 내가 자리를 비운 사이 택배기사가 왔다 가면 '''그걸로 끝'''이다(lost wakeup). 나중에 집에 들어가 기다려도 택배는 영영 안 온다.\nsetpark 있는 버전 = 문에 \"'''나 곧 들어옵니다'''\"라고 붙여 둔다. 기사가 와서 그 쪽지를 보고 '''문 앞에 놓고 간다'''. 내가 나중에 들어와 \"기다려야지\" 하면 '''이미 와 있으니 기다릴 필요가 없다'''.{/analogy}\n\n== futex와의 관계 ==\n\n같은 문제를 Linux는 다른 방식으로 푼다 — '''[[futex|`futex_wait(address, value)`]]'''는 \"`*address == value`'''일 때만''' 잠들라\"고 커널에 요청한다. 잠들기 직전의 값 재확인을 '''커널이 원자적으로''' 해 주므로, 예고제 없이도 lost wakeup이 생기지 않는다.\n\n{|\n! || '''setpark''' (Solaris) || '''[[futex|futex_wait]]''' (Linux)\n|-\n| 방식 || '''예고제''' — \"곧 잘 거야\" 표시를 세우고, unpark이 소모 || '''조건부 대기''' — 잠들기 직전 값 검사를 커널이 원자적으로\n|-\n| 추가된 것 || 시스템 콜 하나 || `futex_wait`의 `value` 인자\n|}\n\n{exam}🎯 \"wakeup/waiting race를 해결하는 방법 두 가지를 쓰시오\" → '''setpark()'''(예고제)와 '''futex_wait(addr, value)'''(잠들기 전 값 검사). 이 짝을 묶어 기억할 것.{/exam}\n\n{quiz}`setpark()`를 `m->guard = 0` '''다음에''' 놓으면 무슨 문제가 생기는가?{/quiz}\n{answer}guard를 놓는 순간부터 다른 스레드가 `unlock()`에 진입해 '''`unpark`을 호출할 수 있다'''. 그 시점에 아직 `setpark()`를 안 했다면 소모할 예약이 없으므로 신호가 사라지고, 뒤이은 `park()`가 '''영원히 잠든다''' — 원래의 wakeup/waiting race가 그대로 재현된다. 그래서 `setpark()`는 반드시 '''guard 해제 이전'''에 와야 한다.{/answer}\n\n{quiz}`setpark()` 호출 후 `unpark()`이 먼저 실행되면 그 다음 `park()`는 어떻게 동작하는가?{/quiz}\n{answer}'''잠들지 않고 즉시 리턴한다'''(the subsequent park returns immediately instead of sleeping). `unpark()`이 `setpark()`이 세워 둔 \"곧 park함\" 표시를 소모했기 때문이다. (p.37){/answer}\n\n== 관련 문서 ==\n* [[queue 락]] · [[park와 unpark]] · [[guard]] · [[futex]]\n* [[락]] · [[race condition]] · [[atomic]]\n* [[자주 틀리는 함정 모음]]"

 "futex": {
  "title": "futex (Fast Userspace Mutex)",
  "category": [
