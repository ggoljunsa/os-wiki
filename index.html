  ],
  "body": "'''`user/usys.pl`'''은 [[xv6]]의 '''시스템 콜 스텁 생성기'''다. Perl 스크립트 한 장이 `user/usys.S`(어셈블리)를 만들어 내고, 그 안에 각 시스템 콜의 '''3줄짜리 진입 코드'''가 들어 있다. [[과제1 xv6 alarm|과제 1]]에서 두 줄만 추가하면 되는 파일이지만, '''빠뜨리면 링크 에러'''가 난다.\n\n{def}\n`entry(\"sigalarm\");` → `usys.S`에 다음을 생성:\n<pre class=\"asm\">\n.global sigalarm\nsigalarm:\n li a7, SYS_sigalarm    # 시스템 콜 번호를 a7 에\n ecall                  # 트랩 (user → kernel)\n ret                    # 커널에서 돌아오면 caller 로\n<\/pre>\n{/def}\n\n{analogy}\n`usys.pl`은 '''민원 신청서 자동 발급기'''다. 민원 종류를 하나 추가하면 \"번호표 뽑고 → 창구 벨 누르고 → 결과 받아 나오기\" 3단계 양식을 자동으로 찍어 준다. 이 양식이 없으면 유저 프로그램은 '''벨을 누르는 방법 자체를 모른다''' — `sigalarm`이라는 심볼이 존재하지 않아 링커가 못 찾는다.\n{/analogy}\n\n== 과제 1에서의 수정 ==\n\n<pre class=\"c\">\n# user/usys.pl 끝부분\nentry(\"getpid\");\nentry(\"sbrk\");\nentry(\"sleep\");\nentry(\"uptime\");\n+entry(\"sigalarm\");\n+entry(\"sigreturn\");\n<\/pre>\n\n이 두 줄이 빌드 시 `usys.S`의 두 스텁으로 변환된다.\n\n== 3줄이 하는 일 ==\n\n<pre class=\"ascii\">\n   유저 코드:   sigalarm(2, periodic);\n                    │ C 호출 규약: a0 = 2, a1 = periodic 주소\n                    ▼\n   usys.S  sigalarm:\n              li a7, 22      ← ① 시스템 콜 번호 (SYS_sigalarm)\n              ecall          ← ② 트랩! 여기서 커널로 넘어간다\n              ret            ← ③ 커널이 sret 으로 돌려보내 주면 caller 로 복귀\n\n   ★ 인자 a0, a1 은 건드리지 않는다 — C 호출 규약이 넣어 준 그대로\n     커널의 argint(0,...) / argaddr(1,...) 이 trapframe 에서 읽는다.\n   ★ 반환값도 a0 그대로 — syscall() 이 trapframe->a0 에 써 둔 값이\n     userret 에서 복원되어 그대로 C 함수의 반환값이 된다.\n<\/pre>\n\n{tip}\n'''`ecall` 다음에 `ret`이 실행되는 이유''': 커널이 [[usertrap]]에서 `p->trapframe->[[epc]] += 4`를 했기 때문이다. `ecall`이 4바이트라 +4하면 정확히 `ret` 명령어를 가리킨다. 만약 +4를 안 하면 '''`ecall`을 무한 반복'''한다.\n{/tip}\n\n== 빠뜨렸을 때의 증상 ==\n\n{| class=\"table\"\n! 빠뜨린 파일 || 에러\n|-\n| `user/user.h` || 컴파일 경고/에러 — implicit declaration of `sigalarm`\n|-\n| '''`user/usys.pl`''' || '''링크 에러 — undefined reference to `sigalarm`'''\n|-\n| `kernel/syscall.h` || `usys.S` 생성 실패 (`SYS_sigalarm` 미정의)\n|-\n| `kernel/syscall.c` || 실행 시 \"unknown sys call 22\"\n|}\n\n{warn}\n`usys.S`는 '''빌드할 때 자동 생성되는 파일'''이라 직접 고쳐도 다음 `make`에서 덮어써진다. 반드시 '''`usys.pl`''' 쪽을 고쳐야 한다. (`.gitignore`에 `usys.S`가 들어 있는 이유이기도 하다.)\n{/warn}\n\n{quiz}\n`sigreturn`도 `usys.pl`에 등록해야 하는가? 커널이 직접 부르면 안 되나?\n{/quiz}\n{answer}\n'''반드시 등록해야 한다.''' [[sigreturn]]은 '''유저 핸들러가 직접 호출하는''' 시스템 콜이다(과제의 설계 결정: \"user alarm handlers are '''required to call''' the sigreturn system call\"). 커널이 대신 부를 수는 없다 — 핸들러가 '''언제 끝나는지''' 커널은 알 방법이 없기 때문이다. 핸들러가 [[트랩]]으로 커널에 들어와 \"나 끝났어\"라고 알려 주는 것이 유일한 신호다.\n{/answer}\n\n== 관련 문서 ==\n* [[xv6 시스템 콜 경로]] · [[시스템 콜 추가 절차]] · [[시스템 콜]] · [[트랩]] · [[a0]]\n* [[sigalarm]] · [[sigreturn]] · [[epc]] · [[usertrap]] · [[과제1 xv6 alarm]] · [[xv6]]"
 },
 "myproc": {
  "title": "myproc()",
  "category": [
   "과제1",
   "용어"
  ],
  "body": "'''`myproc()`'''은 [[xv6]]에서 '''\"지금 이 CPU에서 실행 중인 프로세스\"의 [[struct proc]] 포인터'''를 돌려주는 함수다. [[usertrap]], `sys_sigalarm`, `sys_sigreturn` 등 [[과제1 xv6 alarm|과제 1]]의 모든 코드가 이 함수로 시작한다.\n\n{def}\n`struct proc *myproc(void);` — returns the `struct proc *` of the process currently running on this CPU (`c->proc`).\n{/def}\n\n{analogy}\n`myproc()`은 '''\"지금 이 진료실에 앉아 있는 환자의 차트를 꺼내 오는 것\"'''이다. 병원(커널)에는 환자 차트가 64장 꽂혀 있는데(`struct proc proc[NPROC]`), 의사는 '''지금 눈앞의 환자 것'''만 필요하다. 그래서 `p->alarm_interval = n`이라고 쓰면 '''[[sigalarm]]을 부른 바로 그 프로세스의 칸'''에만 기록된다 — 알람 설정이 프로세스마다 독립인 이유.\n{/analogy}\n\n== 구현 ==\n\n<pre class=\"c\">\n// kernel/proc.c\nstruct proc*\nmyproc(void)\n{\n  push_off();               // 1  인터럽트 끄기\n  struct cpu *c = mycpu();  // 2  tp 레지스터의 hartid 로 CPU 구조체\n  struct proc *p = c->proc; // 3  그 CPU 가 지금 돌리는 프로세스\n  pop_off();                // 4  인터럽트 복원\n  return p;\n}\n<\/pre>\n\n{warn}\n1·4행의 `push_off()`/`pop_off()`가 핵심이다. 2행과 3행 사이에 [[타이머 인터럽트]]가 들어와 [[컨텍스트 스위치]]가 일어나면, '''다른 CPU로 옮겨 가서 엉뚱한 `c`를 읽게 된다'''. 그래서 그 짧은 구간 동안 인터럽트를 꺼 둔다 — 9강 [[인터럽트 비활성화]]와 같은 기법.\n{/warn}\n\n== 프로세스는 배열의 한 칸이다 ==\n\n<pre class=\"ascii\">\n   kernel/proc.c:   struct proc proc[NPROC];    // NPROC = 64. 부팅 때부터 고정 존재\n\n   커널 메모리 (bss)\n   proc[0]  ┌──────────────────────────────────────────┐\n            │ lock, state, pid, parent, kstack, sz     │  원래 필드\n            │ pagetable                                │\n            │ trapframe ─────────────┐  (포인터 8B)    │\n            │ context, ofile[], cwd, name              │\n            │ ── Assignment 1 추가 ──                   │\n            │ alarm_interval, alarm_handler,           │  ← 이 칸 \"안에\" 직접\n            │ alarm_elapsed, alarm_active              │\n            │ alarm_saved  [ 288B 구조체 통째 ]         │  ← 포인터가 아니라 내용물\n            └────────────────────────│─────────────────┘\n   proc[1]  ┌──────── 같은 모양 ─────│─────────────────┐\n     …                               │\n   proc[63]                          ▼\n                       trapframe 페이지 (4096B, 프로세스마다 1장)\n                       ┌──────────────────────────┐\n                       │ kernel_satp … epc        │\n                       │ ra sp … a0 … t6          │\n                       └──────────────────────────┘\n\n   myproc() 이 돌려주는 p = 이 배열의 \"한 칸을 가리키는 포인터\"\n<\/pre>\n\n== `->` 와 `.` 의 차이가 곧 \"어디에 있나\" ==\n\n{| class=\"table\"\n! 식 || 뜻 || 데이터 위치\n|-\n| `p->alarm_interval` || p가 가리키는 칸의 필드 || '''proc 칸 안'''\n|-\n| `p->trapframe` || 칸 안의 '''포인터 값''' || 칸 안 (8 B)\n|-\n| `p->trapframe->epc` || 그 포인터를 '''한 번 더 따라간''' 페이지의 [[epc]] || '''별도 [[trapframe]] 페이지'''\n|-\n| `p->alarm_saved.epc` || 칸 안에 박힌 구조체의 epc (포인터 아님 → `.`) || '''proc 칸 안'''\n|}\n\n{tip}\n그래서 백업/복원 코드가 이렇게 생긴 것이다:\n<pre class=\"c\">\np->alarm_saved = *p->trapframe;   // 페이지 → 칸 안   (백업)\n*p->trapframe = p->alarm_saved;   // 칸 안 → 페이지   (복원)\n<\/pre>\n{/tip}\n\n{quiz}\n`sys_sigalarm()` 안에서 `myproc()` 대신 전역 변수에 interval을 저장하면 어떤 문제가 생기나?\n{/quiz}\n{answer}\n'''모든 프로세스가 같은 알람 설정을 공유'''하게 된다. A가 `sigalarm(2, fa)`를, B가 `sigalarm(5, fb)`를 부르면 서로 덮어쓰고, [[alarm_saved]] 슬롯도 하나뿐이라 A의 문맥이 B의 문맥으로 덮여 '''둘 다 crash'''한다. 프로세스별 상태는 반드시 [[struct proc]]([[PCB]]) 안에 둬야 한다 — 그것이 PCB의 존재 이유다.\n{/answer}\n\n== 관련 문서 ==\n* [[struct proc]] · [[PCB]] · [[trapframe]] · [[epc]] · [[alarm_saved]] · [[프로세스]]\n* [[sigalarm]] · [[sigreturn]] · [[usertrap]] · [[yield]] · [[인터럽트 비활성화]]\n* [[과제1 xv6 alarm]] · [[xv6]]"
 },
 "퀴즈1 복기": {
  "title": "퀴즈 1 복기 (2026-09-23)",
  "category": [
   "시험",
   "과제1"
  ],
  "body": "'''2026년 9월 23일(수) 수업 시간에 치러진 퀴즈 1'''의 전체 복기. '''15분 / 100점 / 서술은 한 문장 제한'''이었고, '''100점 전부가 [[과제1 xv6 alarm|과제 1(Alarm)]]에서 나왔다'''. 이론 문제는 단 한 개도 없었다.\n\n{warn}\n'''\"Limit each written explanation to one sentence.\"''' — 문제지에 명시된 규칙. 길게 쓰면 감점 요인이지 가점 요인이 아니다. 서술형은 '''결론 한 문장 + 이유 한 절'''로 끝내라.\n{/warn}\n\n{analogy}\n이번 퀴즈는 '''\"과제를 돌아가게 만든 사람\"과 \"과제를 이해한 사람\"을 가르는 필터'''였다. 코드는 똑같이 80/80을 받아도, `sigreturn`이 왜 `a0`를 반환해야 하는지 설명하지 못하면 4번 20점이 그대로 날아간다. 실제로 이 학생의 [[퀴즈1 복기|모의고사]]에서 과제 메커니즘 3문항(A18·A19·A20)이 '''3/3 전멸'''했고, 진짜 퀴즈는 그 세 개를 그대로 20+20+20점짜리로 확대해서 냈다.\n{/analogy}\n\n== 문제지 구성 ==\n\n{| class=\"table\"\n! 번호 || 주제 || 배점 || 관련 문서\n|-\n| 1 || 핸들러가 도는 '''모드''' || 10 || [[유저 모드와 커널 모드]]\n|-\n| 2 || [[usertrap]] 타이머 분기 '''빈칸 3개''' || 20 (5+10+5) || [[과제1 xv6 alarm]]\n|-\n| 3 || 문맥 저장/복원 (a)(b)(c) || 20 (10+5+5) || [[alarm_saved]], [[sigreturn]]\n|-\n| 4 || 반환값 추적 — '''`a0` 덮어쓰기''' || 20 (5+5+10) || [[a0 복원]]\n|-\n| 5 || 프로그램 '''출력 예측''' (a)(b) || 30 (20+10) || [[alarmtest]], [[재진입 금지]]\n|}\n\n[[sim:alarm_trace]]\n\n----\n\n== 1번 (10점) — 핸들러는 어느 모드에서 도는가 ==\n\n{quiz}\nThe alarm handler registered by `sigalarm` executes in ( '''user mode''' / '''kernel mode''' ).\n{/quiz}\n{answer}\n'''user mode'''\n\n이유: 커널이 한 일은 `p->trapframe->[[epc]] = [[alarm_handler]]` 한 줄뿐이고, 그 뒤 [[usertrapret]] → [[sret]]이 '''정상적으로 유저 모드로 내려가면서''' 핸들러 주소에서 실행을 시작한다. [[sret]]은 `sstatus.SPP`를 보고 모드를 되돌리는데, 트랩 전이 user였으므로 user로 돌아간다. 핸들러 주소 자체도 '''유저 주소 공간'''(`user/alarmtest.c`의 `periodic`)이라 커널 모드에서는 실행될 수도 없다.\n\n'''따름 정리''': 핸들러가 user mode에서 돌기 때문에 → 핸들러가 [[시스템 콜]]을 부르면 `p->trapframe`이 덮인다 → 그래서 [[alarm_saved]]라는 '''별도 복사본'''이 필요하다. 3번 (a)의 답이 여기서 나온다.\n{/answer}\n\n관련: [[유저 모드와 커널 모드]] · [[sret]] · [[usertrapret]]\n\n----\n\n== 2번 (20점) — usertrap의 빈칸 세 개 ==\n\n{quiz}\n`alarm_active` is 1 while a handler is running; `alarm_saved` is a separate `struct trapframe` '''value'''; `alarm_handler` is the user handler address. Fill the blanks in order. (5, 10, 5 points)\n\n<pre class=\"c\">\nif (which_dev == 2) {             // timer interrupt\n\n    if (p->alarm_interval > 0 && ____①____) {\n        p->alarm_elapsed++;\n        if (p->alarm_elapsed >= p->alarm_interval) {\n\n            p->alarm_saved = ____②____;\n            p->alarm_active = 1; p->alarm_elapsed = 0;\n\n            p->trapframe->epc = ____③____;\n        }\n    }\n    yield();\n}\n<\/pre>\n{/quiz}\n{answer}\n{| class=\"table\"\n! 빈칸 || 정답 || 배점 || 왜\n|-\n| ① || '''`!p->alarm_active`''' || 5 || '''[[재진입 금지]]'''. 핸들러가 아직 안 끝났으면 tick 자체를 세지 않는다 (test2)\n|-\n| ② || '''`*p->trapframe`''' || 10 || 구조체 '''값''' 대입. 문제지가 \"`alarm_saved` is a separate struct trapframe '''value'''\"라고 친절하게 힌트를 줬다 — 포인터가 아니라 '''역참조'''해야 한다\n|-\n| ③ || '''`(uint64)p->alarm_handler`''' || 5 || 복귀 주소 바꿔치기. `alarm_handler`가 이미 `uint64`면 캐스팅 없이 `p->alarm_handler`도 정답\n|}\n\n'''②에서 자주 나오는 오답:'''\n* `p->trapframe` ← '''포인터 대입'''이라 타입 에러. 설령 통과해도 \"같은 페이지를 가리키는 두 번째 포인터\"라 백업이 아니다.\n* `memmove(&p->alarm_saved, p->trapframe, sizeof(struct trapframe))` ← 동작은 맞지만 '''`p->alarm_saved = ___;` 형태의 빈칸'''이라 문법이 안 맞는다.\n* `&p->trapframe` ← 포인터의 주소. 완전히 다른 것.\n\n'''①을 `p->alarm_handler != 0`으로 쓰면 오답.''' 과제 PDF가 \"the address of the user's alarm function might be 0\"이라고 경고했다.\n{/answer}\n\n관련: [[과제1 xv6 alarm]] · [[usertrap]] · [[which_dev]] · [[alarm_active]] · [[alarm_saved]] · [[alarm_handler]] · [[trapframe]] · [[epc]]\n\n----\n\n== 3번 (20점) — 저장과 복원 ==\n\n=== (a) 10점 — 왜 별도 복사본이 필요한가 ===\n\n{quiz}\nOn a timer interrupt, xv6 already saves the user context in `p->trapframe`. Why is a separate copy still needed before starting the alarm handler?\n{/quiz}\n{answer}\n'''한 문장 답안:''' \"핸들러는 '''user mode에서 실행'''되면서 자기 자신의 시스템 콜(최소한 `sigreturn`)이나 또 다른 트랩으로 '''`p->trapframe`을 덮어쓰기''' 때문에, 끊긴 문맥을 미리 별도 슬롯에 복사해 두어야 한다.\"\n\n'''풀어 쓰면:'''\n* `p->trapframe`은 프로세스마다 하나뿐인 '''\"지금 이 트랩의 문맥\"''' 슬롯이고, 트랩이 날 때마다 `uservec`이 유저 레지스터 31개를 그 자리에 덮어쓴다.\n* 핸들러는 반드시 `sigreturn()`을 부르는데 그것이 곧 `ecall` = 트랩이다 → 그 순간 `p->trapframe`은 '''핸들러의 레지스터'''로 바뀐다.\n* 핸들러 안에서 `printf`를 하면 `write` 시스템 콜, 타이머가 또 오면 인터럽트 — 전부 같은 결과.\n* 따라서 '''핸들러를 시작하기 전에''' [[alarm_saved]](프로세스별 전용 공간)에 통째로 복사해야 원본이 살아남는다.\n\n{analogy}`p->trapframe`은 '''책상 위 \"지금 보는 서류\" 한 자리'''다. 새 손님이 올 때마다 그 위에 새 서류가 얹힌다. 원본을 지키려면 '''서랍에 복사본'''을 넣어야 한다.{/analogy}\n{/answer}\n\n=== (b) 5점 — sigreturn 후 어디서 재개되나 ===\n\n{quiz}\nAfter the handler calls `sigreturn()`, where does execution resume in user space?\n{/quiz}\n{answer}\n'''타이머 인터럽트가 끊었던 바로 그 명령어''' — 즉 `alarm_saved.epc`에 저장돼 있던 주소.\n\n경로:\n# `sys_sigreturn()`이 `*p->trapframe = p->alarm_saved;` → `trapframe->[[epc]]`가 '''끊긴 PC'''로 되돌아온다.\n# [[usertrapret]]이 `w_sepc(p->trapframe->epc)` → [[sepc]]에 그 주소가 들어간다.\n# [[sret]]이 `sepc`로 점프 → 끊긴 명령어부터 재개.\n\n게다가 같은 한 줄로 레지스터 31개도 전부 복원되므로, 유저 코드 입장에서는 '''아무 일도 없었던 것처럼''' 계속된다. (그래서 5번의 `i == j`가 성립한다.)\n{/answer}\n\n=== (c) 5점 — sigreturn 없이 C return 하면 ===\n\n{quiz}\nIf the handler uses C `return` without calling `sigreturn()`, where does control go?\n{/quiz}\n{answer}\n'''`ra` 레지스터가 가리키는 곳''' — 그런데 그 `ra`는 '''핸들러의 리턴 주소가 아니라, 인터럽트 당한 유저 코드가 갖고 있던 `ra`'''다.\n\n이유: 커널은 핸들러를 `call`(`jal`)로 부른 적이 없다. '''[[epc]]만 바꿔서 [[sret]]으로 떨어뜨렸을''' 뿐이고 레지스터 31개는 끊긴 코드의 값 그대로다. RISC-V의 C `return`은 `ret` = `jalr x0, 0(ra)`이므로, 제어는 '''인터럽트 당한 함수가 원래 리턴하려던 주소'''(그 함수의 caller)로 튄다.\n\n결과:\n* 인터럽트 당한 함수의 '''남은 부분이 통째로 건너뛰어진다''' — 스택 프레임이 어긋난다.\n* 핸들러가 쓴 레지스터가 복원되지 않는다.\n* [[alarm_active]]가 '''영원히 1로 남아''' 알람이 다시는 안 울린다.\n* 실질적으로 '''undefined behavior — 대개 crash'''. 과제 PDF도 test0 단계에서 \"it's OK for now if your program '''crashes''' after printing alarm!\"이라고 예고했다.\n\n'''한 문장 답안:''' \"핸들러는 call된 게 아니라 `epc`만 바뀌어 `sret`으로 진입했으므로 `ra`에는 끊긴 코드의 리턴 주소가 남아 있고, C `return`은 그리로 점프해 프레임이 어긋난 채 정의되지 않은 동작(보통 crash)을 한다.\"\n{/answer}\n\n관련: [[alarm_saved]] · [[sigreturn]] · [[sret]] · [[epc]] · [[sepc]] · [[a0]]\n\n----\n\n== 4번 (20점) — 반환값 추적 ⭐⭐⭐ ==\n\n{quiz}\nThe saved trapframe has `a0 = 0x2a`.\n\n<pre class=\"c\">\n// Inside sys_sigreturn():\nstruct proc *p = myproc();\n*p->trapframe = p->alarm_saved;\np->alarm_active = 0;\np->alarm_elapsed = 0;\nreturn 0;\n\n// Inside syscall():\nuint64 result = sys_sigreturn();\np->trapframe->a0 = result;\n<\/pre>\n\n(a) (i) `*p->trapframe = p->alarm_saved;` 직후 `p->trapframe->a0 = ____` (5점)\n(a) (ii) 끊긴 프로그램이 user space에서 재개될 때 `a0 = ____` (5점)\n(b) `return 0;`을 원래 `a0` 값을 보존하는 문장으로 바꿔라. (10점)\n{/quiz}\n{answer}\n'''(i) `0x2a` (= 42)'''\n구조체 통째 대입이 `a0`을 포함한 모든 필드를 복사하므로, '''이 시점에서는 제대로 복원돼 있다'''.\n\n'''(ii) `0`'''\n`sys_sigreturn()`이 리턴한 직후 `syscall()`이 `p->trapframe->a0 = result;`를 실행한다. `result = 0`이므로 '''방금 복원한 0x2a가 0으로 덮인다'''. 유저는 `a0 = 0`으로 깨어난다.\n\n<pre class=\"ascii\">\n  ① sys_sigreturn 안:   trapframe->a0 = 0x2a   ✓ 복원됨\n  ② syscall()이 이어서:  trapframe->a0 = 반환값\n        return 0;                →  a0 = 0      ✗ (i)과 (ii)가 달라지는 지점\n        return trapframe->a0;    →  a0 = 0x2a   ✓ 덮어써도 같은 값\n<\/pre>\n\n'''(b) `return p->trapframe->a0;`'''\n(또는 `return p->alarm_saved.a0;` — 위의 구조체 대입 '''뒤라면''' 둘은 같은 값)\n\n'''왜 이 설계가 되는가:''' [[sigreturn]]은 어쨌든 '''시스템 콜'''이고, [[xv6]]의 규약상 시스템 콜의 반환값은 반드시 `a0`에 실린다. 그 덮어쓰기를 피할 방법이 없으니, '''덮어써도 무해하도록 같은 값을 반환'''하는 것이다.\n\n{warn}\"`a0`는 복원 대상이 아니다\"는 '''거짓'''. `a0`는 범용 레지스터(인자 1번 겸 반환값)라 끊긴 코드가 계산 중간값으로 쓰고 있을 수 있다. 과제 PDF: \"'''Make sure to restore a0.''' sigreturn is a system call, and its return value is stored in a0.\"{/warn}\n{/answer}\n\n관련: [[a0 복원]] · [[a0]] · [[sigreturn]] · [[xv6 시스템 콜 경로]] · [[trapframe]]\n\n----\n\n== 5번 (30점) — 출력 예측 ==\n\n{quiz}\n<pre class=\"c\">\nvolatile int count = 0, sum = 0;\n\nvoid burn(void) {\n    for (volatile int k = 0; k < 500000000; k++)\n        asm volatile(\"nop\");\n}\n\n__attribute__((noinline))\nvoid foo(unsigned int *j) { *j += 1; }\n\nvoid periodic(void) {\n    count++;\n    sum += count;\n    burn();\n    if (count == 3) sigalarm(0, 0);\n    sigreturn();\n}\n\nint main(void) {\n    unsigned int i = 0, j = 0;\n    sigalarm(2, periodic);\n    for (; count < 3; i++)\n        foo(&j);\n\n    printf(\"count=%d sum=%d\\n\", count, sum);\n    printf(\"i==j: %d\\n\", i == j);\n\n    burn();\n    printf(\"after=%d\\n\", count);\n    exit(0);\n}\n<\/pre>\n전제: 구현은 정확하고, 시스템 콜은 성공하며, '''`burn()` 한 번은 최소 5 tick의 CPU 시간'''을 쓴다.\n(a) 출력 세 줄을 순서대로 써라. (20점: 10 / 5 / 5)\n(b) `if (count == 3) sigalarm(0, 0);`을 '''조건 없는''' `sigalarm(0, 0);`으로 바꾸면 첫 `printf`가 실행되는가? 한 문장으로 설명하라. (10점)\n{/quiz}\n{answer}\n'''(a) 정답'''\n<pre class=\"txt\">\ncount=3 sum=6\ni==j: 1\nafter=3\n<\/pre>\n\n'''① `count=3 sum=6` (10점)'''\n\n[[alarm_interval]] = 2이므로 2 tick마다 `periodic`이 불린다. 호출될 때마다:\n\n{| class=\"table\"\n! 호출 || `count` || `sum += count` || 핸들러 안에서\n|-\n| 1회 || 0 → '''1''' || 0 + 1 = '''1''' || `burn()` (≥5 tick) → `count != 3` → `sigreturn()`\n|-\n| 2회 || 1 → '''2''' || 1 + 2 = '''3''' || `burn()` → `count != 3` → `sigreturn()`\n|-\n| 3회 || 2 → '''3''' || 3 + 3 = '''6''' || `burn()` → '''`count == 3` → `sigalarm(0,0)`''' → `sigreturn()`\n|}\n\n`count`가 3이 되는 순간 `main`의 `for (; count < 3; i++)` 조건이 거짓이 되어 루프를 빠져나온다. → `count=3 sum=6`.\n\n{warn}\n'''함정: 핸들러 안의 `burn()`이 5 tick을 태우는데 왜 알람이 또 안 터지나?'''\n[[alarm_active]]가 1이라서 [[usertrap]]이 '''`alarm_elapsed`를 아예 세지 않기''' 때문이다([[재진입 금지]]). 핸들러 안에서 쓴 tick은 '''주기에 포함되지 않는다'''. 그래서 핸들러는 '''정확히 3번만''' 불리고, 중첩 호출도 없다. 이 한 줄을 모르면 \"count가 더 커진다\"는 오답이 나온다.\n{/warn}\n\n'''② `i==j: 1` (5점)'''\n\n`for (; count < 3; i++) foo(&j);` — 한 바퀴마다 몸통 `foo(&j)`가 `j`를 1 올리고, 그 다음 증감식 `i++`이 `i`를 1 올린다. 완전히 돈 바퀴 수가 n이면 `i == j == n`.\n\n타이머 인터럽트가 `foo(&j)`와 `i++` '''사이'''에 끼어들 수는 있다. 그러나:\n* 커널이 끊기는 순간 '''레지스터 31개 전부를 [[alarm_saved]]에 저장'''하고,\n* [[sigreturn]]이 '''통째로 복원'''하며,\n* [[sret]]이 '''끊긴 바로 그 명령어'''로 복귀한다.\n* 핸들러는 `count`·`sum`만 건드리고 `i`·`j`는 손대지 않는다.\n\n즉 '''인터럽트는 `i`와 `j`의 균형을 깨뜨리지 못한다.''' 루프를 빠져나오는 것은 언제나 조건 검사 시점(= 한 바퀴가 완전히 끝난 뒤)이므로 `i == j` → `1`.\n\n{tip}\n이 문항이 바로 '''test1이 검사하는 것'''을 C 코드로 옮긴 것이다. [[alarm_saved]] 복원이 부분적이면(레지스터 일부만 되돌리면) 여기서 `0`이 나올 수 있다. [[a0 복원]]을 빼먹은 경우는 이 프로그램에선 티가 안 날 수도 있는데(끊긴 순간의 a0가 무엇이었느냐에 달림), alarmtest의 test3이 그걸 잡아낸다 — 시뮬레이터의 a0fix=bug 옵션에서 a0가 0x2a→0으로 지워지는 순간을 볼 것. 즉 '''`i==j: 1`은 \"내 구현이 옳다\"는 증거'''이고, 문제는 그걸 묻고 있다.\n{/tip}\n\n'''③ `after=3` (5점)'''\n\n3번째 핸들러 호출에서 `sigalarm(0, 0)`이 실행되어 [[alarm_interval]] = 0이 됐다. 그러면 [[usertrap]]의 조건 `p->alarm_interval > 0`이 거짓 → '''분기 자체를 안 탄다'''. 이후 `burn()`이 5 tick을 태우든 500 tick을 태우든 핸들러는 다시 불리지 않는다. `count`는 3에서 멈춘다.\n\n----\n\n'''(b) 아니오 — 첫 `printf`는 '''영원히''' 실행되지 않는다. (10점)'''\n\n'''한 문장 답안:''' \"조건 없이 `sigalarm(0,0)`을 부르면 '''첫 번째 핸들러 실행에서 알람이 꺼져''' `count`가 1에 멈추고, `for (; count < 3; i++)`의 조건이 영원히 참이라 무한 루프에 빠지므로 첫 `printf`에 도달하지 못한다.\"\n\n<pre class=\"ascii\">\n   tick 1, 2  →  periodic() 1회:  count=1, sum=1, burn()\n                                  sigalarm(0, 0)   ← 조건 없이 무조건 실행 → alarm_interval = 0\n                                  sigreturn()      ← 문맥 복원, alarm_active = 0\n   이후        →  타이머는 계속 오지만 alarm_interval == 0 이라 분기 미진입\n                  count 는 1 에서 동결\n   main        →  for (; count < 3; i++) foo(&j);   ← 조건이 영원히 참  ⇒ 무한 루프\n                  printf(\"count=%d ...\")            ← 도달 불가\n<\/pre>\n\n{tip}\n주의할 것: 무한 루프에 빠져도 xv6가 멈추지는 않는다. [[타이머 인터럽트]]가 계속 오고 [[usertrap]]이 [[yield]]를 부르므로 '''다른 프로세스는 멀쩡히 돌아간다''' — 이 프로세스만 영원히 돈다. [[비협력적 방식]]의 존재 이유를 보여 주는 장면이기도 하다.\n{/tip}\n{/answer}\n\n관련: [[alarmtest]] · [[재진입 금지]] · [[alarm_active]] · [[alarm_interval]] · [[sigalarm]] · [[sigreturn]] · [[a0 복원]] · [[yield]]\n\n----\n\n== 이번 퀴즈가 말해 주는 중간고사 출제 경향 ==\n\n=== 1. 교수는 \"돌아가는 코드\"가 아니라 \"이유\"를 묻는다 ===\n5문제 중 3문제(2, 3, 4번)가 '''과제 PDF의 힌트 문장을 그대로 문제로 바꾼 것'''이다.\n* 3번 = \"In which context should the handler be executed? Where is the interrupted context saved?\" (Tips 2번)\n* 4번 = \"Make sure to restore a0.\" (test1 힌트 마지막 줄)\n* 2번 ① = \"Prevent re-entrant calls to the handler\" (test2 힌트)\n\n→ '''과제 PDF의 힌트 bullet 하나하나가 문제 은행'''이다. 남은 과제(2, 3번)가 나오면 PDF 힌트를 먼저 문장으로 답해 보라.\n\n=== 2. 빈칸 채우기 = 코드를 '''외워서 쓸 수 있어야''' 한다 ===\n2번은 [[usertrap]]의 타이머 분기를 '''손으로 재현'''할 수 있는지 묻는다. 중간고사에서도 손코딩(빈칸/전체 작성)이 나올 가능성이 높다. 외워 둘 코드 블록:\n* [[usertrap]]의 `scause == 8` / `devintr()` / `which_dev == 2` 3분기\n* 알람 발사 4줄 (백업 → 잠금 → re-arm → epc)\n* `sys_sigreturn`의 복원 3줄 + `return p->trapframe->a0;`\n* [[컨텍스트 스위치]]의 `yield()` → `sched()` → `swtch()`\n\n=== 3. 출력 예측 = 메커니즘을 tick 단위로 따라갈 수 있어야 한다 ===\n5번(30점, 최고 배점)은 계산도 암기도 아니고 '''시뮬레이션'''이다. 같은 형식이 [[alarmtest]] 변형, 또는 5강 [[스케줄링]]의 Gantt 차트로 중간고사에 나온다. 연습 방법: 표를 그리고 tick마다 `alarm_elapsed` / `alarm_active` / `count`를 채워 보기.\n\n=== 4. 한 문장 제한 ===\n'''서술형은 \"결론 + 이유\" 한 문장.''' 2025F 중간고사도 Explanation 슬라이드를 보면 답이 전부 한두 줄이다 (평균 52.4 / 표준편차 14.4 / 최고 84 — [[2025F 중간고사 족보]] 참고). 길게 쓸 시간에 다음 문제를 풀어라.\n\n=== 5. 이론 문제는 중간고사에 몰아서 나온다 ===\n퀴즈에 4강 이론이 하나도 안 나왔다는 것은 '''중간고사에서 나온다'''는 뜻에 가깝다. [[제한적 직접 실행]]의 LDE 프로토콜 표(p.22·23·32·33), 예외 4분류, [[협력적 방식]]/[[비협력적 방식]] 대비는 여전히 1순위다.\n\n{exam}\n'''모의고사 오답 → 실제 퀴즈 대응표''' (같은 내용이 배점만 키워서 나왔다)\n{| class=\"table\"\n! 모의 문항 || 내용 || 실제 퀴즈\n|-\n| A18 (틀림) || sepc ← trapframe->epc ← 커널이 바꿈 || '''2번 ③''' + 3번 (b)\n|-\n| A19 (틀림) || `syscall()`이 a0를 덮어씀 || '''4번 전체 (20점)'''\n|-\n| A20 (틀림) || 재진입 금지 || '''2번 ①''' + 5번 (a)의 함정\n|-\n| A5 (틀림) || 타이머는 OS가 부팅 때 켠다 || (미출제 → 중간고사 대기)\n|-\n| A4 (★) || cooperative = 시스템 콜을 기다림 || (미출제 → 중간고사 대기)\n|}\n'''틀린 것이 그대로 나왔다.''' 모의고사 오답 노트는 버리지 말 것.\n{/exam}\n\n== 관련 문서 ==\n* [[과제1 xv6 alarm]] — 이 퀴즈의 범위 전체\n* [[usertrap]] · [[trapframe]] · [[epc]] · [[sepc]] · [[sret]] · [[usertrapret]]\n* [[alarm_interval]] · [[alarm_handler]] · [[alarm_elapsed]] · [[alarm_saved]] · [[alarm_active]]\n* [[재진입 금지]] · [[a0 복원]] · [[a0]] · [[alarmtest]] · [[sigalarm]] · [[sigreturn]]\n* [[제한적 직접 실행]] (중간고사 대비 이론) · [[2025F 중간고사 족보]] · [[시험 정보]]"
 },
 "2025F 중간고사 족보": {
  "title": "2025F 중간고사 족보",

  ],
  "body": "'''2025년 가을학기(2025F) CSE304 중간고사'''의 문제·정답·성적 분포 자료 모음이다. 출처는 교수님이 시험 후 배포한 '''Midterm Exam Explanation''' 슬라이드(`MidTermSolution.pdf`)와, 수강생 디스코드에서 발췌한 시험지 사진·이메일 답장이다.\n\n{warn}⚠️ '''작년 시험이지 올해 공지가 아니다.''' 올해(2026F) 중간고사 날짜·범위는 아직 미확정이다 → [[시험 정보]]. 다만 '''출제 스타일'''은 같은 교수님이므로 1차 자료로서 가치가 크다.{/warn}\n\n== 성적 분포 — 어려운 시험이었다 ==\n\n[[img:SOL-42.png|Statistics — Mean 52.4, Stdev 14.4, Max 84|large]]\n\n{|\n! 항목 || 값\n|-\n| '''Mean''' || '''52.4'''\n|-\n| '''Stdev''' || '''14.4'''\n|-\n| '''Max''' || '''84'''\n|}\n\n히스토그램은 20점대부터 80점대까지 넓게 퍼져 있고 최빈 구간이 '''44~52'''다. 100점 만점 기준으로 '''평균이 절반 근처인 어려운 시험'''이었고, 80점을 넘으면 최상위다. (출처: `족보/_족보_README.md`, `2025F_중간고사_성적분포.jpg`)\n\n{exam}🎯 '''시사점''': 평균 52점이면 '''부분 점수가 당락을 가른다'''. 계산·서술 문제에서 답만 쓰지 말고 '''풀이 과정을 반드시 남길 것'''.{/exam}\n\n== 전체 구성 ==\n\n{|\n! 문제 || 형식 || 주제 || 관련 문서\n|-\n| '''Problem 1''' || 5지선다 객관식 (a~e) || 예외 분류, CPU 상태, deadlock 조건, 비례 지분, 시스템 프로그램 || 아래 참조\n|-\n| '''Problem 2''' || '''정의 → 용어 단답''' (a~g) || PCB, MLFQ, convoy effect, cache affinity, race condition, spurious wakeup, livelock || 아래 참조\n|-\n| '''Problem 3''' || 스케줄링 '''계산/최적화''' (a~c, 최대 10pts) || total turnaround / total fairness || [[스케줄링 지표]]\n|-\n| '''Problem 4''' || '''표 채우기''' (4.1 8pts, 4.2 8pts) || Stride 스케줄링 pass 값 추적 || [[Stride 스케줄링]]\n|-\n| '''Problem 5''' || 계산 (5.1 4pts, 5.2 8pts) || Reader-Writer lock, best/worst case 완료 시각 || —\n|-\n| '''Problem 6''' || '''코드 빈칸 채우기''' (16pts) || Producer-Consumer, semaphore x/y/z || —\n|-\n| '''Problem 7''' || '''코드 빈칸 채우기''' || '''Fetch-And-Add 기반 lock''' || [[fetch-and-add]] · [[ticket lock]]\n|}\n\n{warn}⭐ 범위가 '''동시성(lock, condition variable, semaphore)까지''' 들어가 있었다. Reader-Writer lock, producer-consumer, spurious wakeup은 9강 이후 강의 내용이다. → '''올해도 [[락]] 강의가 중간 범위일 가능성이 매우 크다.'''{/warn}\n\n----\n\n== Problem 1 — 객관식 (5지선다) ==\n\n=== 1-a) Which one is '''not''' a synchronous exception? ===\n\n[[img:SOL-02.png|Problem 1-a — ④ Interrupt가 정답|medium]]\n\n① Trap ② System Call ③ Fault '''④ Interrupt''' ⑤ Abort → '''정답 ④'''\n\n{def}근거 슬라이드(`MidTermSolution` p.3) '''Synchronous Exceptions''' — \"Caused by events that occur as a result of '''executing an instruction'''\":\n* '''Traps''' — Intentional. 예: system calls, breakpoint traps. \"Returns control to '''next''' instruction\"\n* '''Faults''' — Unintentional but possibly recoverable. 예: page faults(recoverable), protection faults(unrecoverable), FP exceptions. \"Either '''re-executes''' faulting('current') instruction or aborts\"\n* '''Aborts''' — Unintentional and unrecoverable. 예: illegal instruction, parity error, machine check. \"Aborts current program\"{/def}\n\n'''Interrupt'''는 명령어 실행과 무관하게 '''외부 장치'''에서 오므로 '''asynchronous'''다. → [[인터럽트]] · [[트랩]]\n\n{exam}🎯 Trap은 '''다음''' 명령어로, Fault는 '''현재''' 명령어로 돌아간다 — 이 대비가 [[epc]]/[[sepc]] 처리와 직결된다. [[xv6]]에서 시스템 콜이면 `p->trapframe->epc += 4`를 하는 이유가 바로 \"returns control to next instruction\"이다. → [[과제1 xv6 alarm]]{/exam}\n\n=== 1-b) Which one is '''not''' a programmer-visible state of the CPU? ===\n\n[[img:SOL-04.png|Problem 1-b — ⑤ Thread Control Block이 정답|medium]]\n\n① Register File ② Program Counter ③ Condition Codes ④ Stack Pointer '''⑤ Thread Control Block''' → '''정답 ⑤'''\n\n근거 슬라이드는 \"Assembly Programmer's View\" — Programmer-Visible State는 '''PC''', '''Register file''', '''Condition codes'''(+ Memory)다. [[TCB]]는 '''CPU의 상태가 아니라 OS의 자료구조'''다.\n\n→ [[TCB]] · [[레지스터]] · [[프로그램 카운터]] · [[스택 포인터]]\n\n=== 1-c) Which one is '''not''' a condition of deadlock? ===\n\n[[img:SOL-06.png|Problem 1-c — ⑤ Busy wait가 정답|medium]]\n\n① Mutual exclusion ② Hold and wait ③ No preemption ④ Circular wait '''⑤ Busy wait''' → '''정답 ⑤'''\n\n{def}'''Deadlock Characterization — 네 조건이 동시에 성립할 때 발생'''\n# '''Mutual exclusion''': Threads claim exclusive control of resources that they require\n# '''Hold and wait''': Threads hold resources already acquired while waiting for additional resources\n# '''No preemption''': Resources cannot be forcibly removed from threads holding them\n# '''Circular wait''': There exists a circular chain of threads, each holding a resource requested by the next{/def}\n\n'''Busy wait'''는 [[spin lock]]의 대기 방식이지 deadlock 조건이 아니다. → [[mutual exclusion]] · [[priority inversion]]\n\n=== 1-d) Which one is '''not''' a proportional-share scheduling method? ===\n\n[[img:SOL-08.png|Problem 1-d — ② Elevator Scheduling이 정답|medium]]\n\n① Completely Fair Scheduling '''② Elevator Scheduling''' ③ Lottery Scheduling ④ Stride Scheduling ⑤ Earliest Eligible Virtual Deadline First → '''정답 ②'''\n\nElevator(SCAN)는 '''디스크 I/O''' 스케줄링이다. 나머지는 전부 6강 내용. → [[비례 지분 스케줄링]] · [[CFS]] · [[Lottery 스케줄링]] · [[Stride 스케줄링]] · [[EEVDF]]\n\n=== 1-e) Computer software designed to provide services to other software is ___ ===\n\n[[img:SOL-09.png|Problem 1-e — ① System Program이 정답|medium]]\n\n'''① System Program''' ② Operating Systems ③ Application Program ④ Runtime Systems ⑤ Compilation Systems → '''정답 ①'''\n\n{def}'''Definition of a System Program'''\n# Computer software designed to '''provide services to other software''' (e.g., application programs)\n# Responsible for the '''management of hardware devices'''\n# '''Supporting environments''' for users and application programs (commands, libraries, shells, …)\n\n'''세 종류''': (1) Compilation System (compiler, assembler, linker, loader, editor, debugger) (2) Runtime System (library, shell, commands, utilities, windows) (3) '''Operating System''' (scheduler, IPC, file system, device driver, virtual memory, protocol stack){/def}\n\n즉 '''OS는 system program의 부분집합'''이다. \"가장 포괄적인 것\"을 고르는 문제. → [[운영체제란]] · [[OS 역사]]\n\n----\n\n== Problem 2 — 정의 → 용어 단답 ==\n\n'''가장 중요한 문제 유형이다.''' 문제 문장이 '''슬라이드 정의와 한 글자도 다르지 않다'''.\n\n[[img:SOL-12.png|Problem 2 a)~c) — Process Control Block / Multi-level Feedback Queue / Convoy Effect|large]]\n\n{|\n! 소문제 || 문제 (원문) || 답 || 근거\n|-\n| '''a)''' || \"the name of the '''OS's data structure that contains information about each process'''? (3 words)\" || '''Process Control Block''' || [[PCB]]\n|-\n| '''b)''' || \"What does '''MLFQ''' stand for?\" || '''Multi-level Feedback Queue''' || [[MLFQ]]\n|-\n| '''c)''' || \"the effect in which several relatively short potential consumers of a resource '''get queued behind a heavyweight resource consumer'''? (2 words)\" || '''Convoy Effect''' || [[convoy effect]]\n|-\n| '''d)''' || \"the reason for '''keeping a process on the same CPU''' if possible in multi-processor scheduling? (Hint: C____ A____)\" || '''Cache Affinity''' || [[cache affinity]]\n|-\n| '''e)''' || \"an '''undesirable situation''' that occurs when a device or system attempts to perform '''two or more operations at the same time'''?\" || '''Race Condition''' || [[race condition]]\n|-\n| '''f)''' || \"the phenomenon in which the OS '''wakes up the sleeping thread, although the waiting condition is not satisfied'''?\" || '''Spurious Wakeup''' || (조건 변수 강의)\n|-\n| '''g)''' || \"the phenomenon where two threads are both repeatedly attempting a '''try-lock sequence and repeatedly failing''' to acquire locks?\" || '''Livelock''' || [[priority inversion]]\n|}\n\n[[img:SOL-17.png|Problem 2 d)~e) — Cache Affinity / Race Condition|large]]\n\n[[img:SOL-20.png|Problem 2 f)~g) — Spurious Wakeup / Livelock|large]]\n\n{exam}⭐⭐⭐ '''이 유형이 올해도 나온다.'''\n* 문제는 '''슬라이드 정의 문장을 그대로''' 옮긴다 → 각 문서의 `{def}` 박스를 '''영어 그대로''' 외울 것\n* '''단어 수 힌트'''(\"2 words\", \"3 words\")와 '''첫 글자 힌트'''(\"C____ A____\")를 준다\n* '''e)는 8강 [[race condition]] 정의 문장 그 자체'''다. 9강의 정의들도 같은 방식으로 출제될 수 있다 — [[critical section]], [[mutual exclusion]], [[atomic]], starvation{/exam}\n\n{info}'''livelock''' 근거 슬라이드는 \"3. No Preemption (Cont.)\"이다. 두 스레드가 `pthread_mutex_trylock`으로 서로의 락을 잡으려다 실패하고 자기 락을 놓고 다시 시도하는 것을 반복 → '''No progress is made'''. 해결책은 \"'''Add a random delay''' before looping back\". [[spin lock]]의 starvation과 달리 '''아무도 진행하지 못한다'''는 점이 다르다.{/info}\n\n----\n\n== Problem 3 — 스케줄링 최적화 계산 ==\n\n[[img:SOL-24.png|Problem 3 문제 원문 — Task A=4, B=5, C=6, total fairness F = T1/T2 + T2/T3|large]]\n\n{def}'''문제 조건'''\n* 단일 프로세서에 세 작업 A, B, C. 길이는 '''A = 4, B = 5, C = 6''' (discrete time units)\n* 예시 스케줄: `AAAA BBBBB CCCCCC`\n* '''turnaround time of a task''' = the time at which it '''finishes'''\n* '''total turnaround time''' = 완료 시각들의 '''합'''\n* '''total fairness''' $F = \\frac{T_1}{T_2} + \\frac{T_2}{T_3}$ (where $T_1, T_2, T_3$ = 첫째·둘째·셋째로 끝나는 작업의 완료 시각)\n* 예시 스케줄에서는 $F = 4/9 + 9/15$\n* \"Assume that the scheduler does '''not make the processor idle'''.\"\n\n'''질문''': 다음을 달성하는 스케줄의 '''total turnaround time'''은?\na) minimizes the total turnaround time (2pts)\nb) maximizes the total fairness (4pts)\nc) minimizes the (total turnaround time / total fairness) '''(10pts)'''{/def}\n\n=== 교수님의 풀이 틀 ===\n\n핵심은 '''스케줄링 문제가 아니라 제약 조건 최적화 문제'''로 본다는 것이다.\n\n{|\n! 제약 || 이유\n|-\n| $T_1 \\ge 4$ || 가장 빨리 끝날 수 있는 작업이 A(길이 4)\n|-\n| $T_2 \\ge 9$ || 둘째는 아무리 빨라도 4+5 = 9\n|-\n| $T_3 = 15$ || CPU를 놀리지 않으므로 마지막은 '''항상''' 4+5+6 = 15\n|-\n| $T_1 < T_2 < T_3$ || 완료 순서 정의상\n|}\n\n> \"'''Any combination that satisfies the condition is possible.'''\" — 조건을 만족하는 어떤 조합도 실제 스케줄로 만들 수 있다는 것이 이 풀이의 전제(good property)다.\n\n=== a) total turnaround 최소화 (답: 28) ===\n\n'''STCF'''(= 짧은 것부터): A → B → C. $T_1 = 4$, $T_2 = 9$, $T_3 = 15$ → '''4 + 9 + 15 = 28'''\n\n> \"But should we know about scheduling in this problem? — This is an '''optimization problem with constraints''': min($T_1+T_2+T_3$) under $T_1 \\ge 4$, $T_2 \\ge 9$, $T_3 = 15$.\"\n\n→ [[SJF]] · [[STCF]] · [[turnaround time]]\n\n=== b) total fairness 최대화 (답: 42) ===\n\n먼저 '''round robin'''을 떠올린다:\n* `ABCABCABCABCBCC` → $T_1{=}10, T_2{=}13, T_3{=}15$ → $F = 10/13 + 13/15$\n* 그런데 `ABCABCABCBCCABC` → $T_1{=}13, T_2{=}14, T_3{=}15$ → $F = 13/14 + 14/15$ ← '''더 크다'''\n\n교수님의 정식 풀이:\n<pre class=\"txt\">\nMaximize  T1/T2 + T2/T3\n  - T1 로 미분 -> 항상 양수  =>  T1 을 최대로  =>  T1 = T2 - 1 (경계 조건)\n  - 대입:  T1/T2 + T2/T3 = 1 - 1/T2 + T2/15\n  - T2 로 미분 -> 역시 항상 양수  =>  T2 를 최대로  =>  T2 = T3 - 1 = 14,  T1 = 13\n  답(total turnaround) = 13 + 14 + 15 = 42\n<\/pre>\n\n{warn}⭐ 문제가 묻는 것은 '''fairness 값이 아니라 그 스케줄의 total turnaround time'''이다. b)의 답은 $F = 13/14 + 14/15$가 아니라 '''42'''다. 문제를 끝까지 읽을 것.{/warn}\n\n=== c) (turnaround / fairness) 최소화 (답: 32) ===\n\n<pre class=\"txt\">\nMinimize  (T1+T2+T3) / (T1/T2 + T2/T3)\n  - T1 으로 미분 -> 항상 음수  =>  T1 을 최대로  =>  T1 = T2 - 1\n  - 대입 후 T2 로 미분 -> 30(7*T2) > 0, 항상 양수  =>  T2 를 최소로  =>  T2 = 9\n  - 따라서 T1 = 8, T2 = 9, T3 = 15\n  답 = 8 + 9 + 15 = 32\n<\/pre>\n\n{exam}🎯 '''10점짜리 문제다.''' 출제 패턴은 명확하다 — '''지표의 정의를 문제에서 새로 주고''', 그것을 최적화하는 스케줄을 찾게 한다. 수업의 [[fairness]] 정의($F$ = 먼저 끝난/나중 끝난, 2개 작업)를 '''3개 작업으로 확장한 시험용 변형'''이다.\n대비법: ① [[SJF]]/[[Round Robin]]/[[FIFO]]가 각 지표를 왜 최적화하는지 '''원리'''로 알 것 ② 제약 조건($T_3$는 항상 고정!)을 먼저 쓰고 ③ 경계 조건($T_1 = T_2 - 1$)을 쓸 것.{/exam}\n\n[[img:SOL-25.png|Problem 3 소문제 a) b) c)와 배점|large]]\n\n----\n\n== Problem 4 — Stride 스케줄링 pass 값 ==\n\n[[img:SOL-31.png|Problem 4 — tickets 100/50/250, stride = 500/tickets|large]]\n\n{def}\"The scheduler schedules the process with '''stride scheduling'''. There are three processes A, B, C which have different numbers of '''tickets: 100, 50, and 250'''. The pass value is updated after each time slice. The scheduler uses the large number of '''500''' to compute the stride value from the ticket.\"\n\n* Stride A : 500 / 100 = '''5'''\n* Stride B : 500 / 50 = '''10'''\n* Stride C : 500 / 250 = '''2'''{/def}\n\n[[img:SOL-32.png|Problem 4.1 / 4.2 — 6번째와 100번째 time slice의 pass 값|large]]\n\n{|\n! || 6th time slice || 100th time slice\n|-\n| Pass (A) || '''5''' || '''125'''\n|-\n| Pass (B) || '''10''' || '''130'''\n|-\n| Pass (C) || '''6''' || '''122'''\n|-\n| Scheduled Process || '''A''' || '''C'''\n|}\n\n→ [[Stride 스케줄링]] · [[pass]] · [[stride]] · [[tickets]]\n\n{exam}🎯 '''표를 한 칸씩 채워 나가는''' 유형이다(8pts × 2). 규칙은 단순하다 — '''pass가 가장 작은 프로세스를 고르고, 그 프로세스의 pass에 자기 stride를 더한다'''. 100번째 같은 큰 수는 주기성을 찾아야 한다(세 프로세스의 pass는 stride의 최소공배수마다 패턴이 반복된다).{/exam}\n\n----\n\n== Problem 5 — Reader-Writer Lock ==\n\n[[img:SOL-36.png|Problem 5.1 / 5.2 — best case / worst case 완료 시각|large]]\n\n{def}근거 슬라이드 '''Reader-Writer Locks''':\n* Only a '''single writer''' can acquire the lock\n* Once a reader has acquired a read lock, '''more readers will be allowed''' to acquire it too\n* A writer will have to '''wait until all readers are finished'''\n* 구조: `sem_t lock`(binary semaphore) + `sem_t writelock`(ONE writer or MANY readers) + `int readers`{/def}\n\n{|\n! 문항 || 입력 (도착시각, 길이) || Best || Worst\n|-\n| '''5.1''' (4pts) || `R(0,3) R(1,5) W(4,3) R(2,1) R(5,3)` || '''11''' || '''11'''\n|-\n| '''5.2''' (8pts) || `R(0,7) R(1,6) W(4,3) R(2,7) R(8,6) R(4,5) R(4,5) R(5,6)` || '''20''' || '''21'''\n|}\n\n5.1 풀이 요지 (동시 reader 최대 3명):\n<pre class=\"txt\">\nR(0,3) R(1,5) R(2,1) 를 먼저 실행 -> 완료 3, 6, 3\nWriter 는 최소 6까지 기다려야 한다\ntimeslice 5 에 R(5,3) 도착, 그때 reader 가 1명뿐 -> 완료 6, 8\nWriter 는 8 에 시작해 11 에 끝난다\n<\/pre>\n\n{info}5.2에서 best/worst가 갈리는 이유는 '''7 시점에 어느 reader 두 개를 고르느냐'''다. `R(4,5) R(4,5)`를 고르면 writer가 18에 시작해 21에 끝나고, `R(4,5) R(5,6)`을 고르면 17에 시작해 20에 끝난다. → 같은 정책이라도 '''tie-breaking'''에 따라 결과가 달라지는 것을 묻는 문제.{/info}\n\n----\n\n== Problem 6 — Producer-Consumer 빈칸 (16pts) ==\n\n[[img:SOL-39.png|Problem 6 — semaphore x, y, z를 MAX / 0 / 1로 초기화|large]]\n\n{def}\"This is the implementation of the '''producer-consumer queue'''. `put(i)` and `get()` do '''not''' assume concurrent access to the queue. There are `MAX` entries inside the queue. There are three semaphores: '''x, y, and z'''. The semaphores x, y, and z are initialized by '''MAX, 0, and 1'''. The implementation should prevent '''race conditions''' in the queue and '''deadlocks'''. Fill in the blanks. (16pts)\"{/def}\n\n정답 코드 (`Final Attempt: A Working Solution`):\n\n<pre class=\"c\">\n 1   sem_t empty;      // = x, MAX 로 초기화\n 2   sem_t full;       // = y, 0 으로 초기화\n 3   sem_t mutex;      // = z, 1 로 초기화 (lock 이므로)\n 4   void *producer(void *arg) {\n 5    int i;\n 6    for (i = 0; i &lt; loops; i++) {\n 7         sem_wait(&empty);    // x\n 8         sem_wait(&mutex);    // z\n 9         put(i);\n10         sem_post(&mutex);    // z\n11         sem_post(&full);     // y\n12    }\n13   }\n14   void *consumer(void *arg) {\n15    int i;\n16    for (i = 0; i &lt; loops; i++) {\n17        sem_wait(&full);      // y\n18        sem_wait(&mutex);     // z\n19        int tmp = get();\n20        sem_post(&mutex);     // z\n21        sem_post(&empty);     // x\n22        printf(\"%d\\n\", tmp);\n23   }\n24   }\n<\/pre>\n\n{exam}⭐⭐ '''순서가 정답이다.''' `sem_wait(&empty)`가 '''`sem_wait(&mutex)`보다 먼저''' 와야 한다. 순서를 바꾸면 — producer가 mutex를 쥔 채 empty를 기다리고, consumer는 mutex를 못 잡아 full을 post하지 못해 — '''deadlock'''이 된다. 문제 지문의 \"should prevent race conditions '''and deadlocks'''\"가 그 힌트다.\n기억법: '''\"자원 세마포어가 바깥, mutex가 안쪽\"'''.{/exam}\n\n→ [[mutual exclusion]] · [[critical section]] · [[락]]\n\n----\n\n== Problem 7 — Fetch-And-Add 락 빈칸 (⭐ 9강 직결) ==\n\n마지막 문제였고, '''출제 오류'''가 있었던 문제다.\n\n[[img:SOL-41.png|Problem 7 — \"This problem has a flaw. I give full credit to all.\"|large]]\n\n> '''\"This problem has a flaw. I give full credit to all.\"'''\n\n=== 교수님이 의도한 답 ===\n\n학생(김동현)이 이메일로 질문했고, 교수님이 직접 답장으로 의도한 정답을 보내 주었다 (`2025F_중간고사_문제7_교수답변_FetchAdd_lock.jpg`, 2025-10-15):\n\n<pre class=\"c\">\n13  void lock(lock_t *lock) {\n14      do {\n15        int old = (a) FetchAdd (&lock->flag, 1);\n16        if (old == (b) 0 ) {\n17          return;\n18        } else {\n19          (c) FetchAdd ( &lock->flag, -1);\n20        }\n21      } while ( (d) 1 );\n22  }\n23\n24  void unlock(lock_t *lock) {\n25      FetchAdd ( &lock->flag, -1);\n26  }\n<\/pre>\n\n'''읽는 법''': 일단 `flag`를 1 올려 본다. '''옛 값이 0이었으면''' 내가 처음 진입한 것이므로 락 획득(16~17번 줄). 아니면 방금 올린 것을 '''도로 내리고'''(19번 줄) 다시 시도한다.\n\n=== 무엇이 잘못됐나 ===\n\n교수님 답장 원문 요지:\n* 학생 질문: \"flag가 0과 1 이외의 값을 가지면 안 되는 것 아닌가?\"\n* 교수님: \"'''0과 1 이외의 값을 가지지 않도록 구현하는 것은 fetch and add로는 불가능''' → 해당 주석이 이외의 값을 금지하는 것은 아니었다\"\n* \"'''25번 줄을 잘못 써서''' 제 생각에는 어떻게 해도 문제가 안 풀릴 것 같네요. 일단 처리를 어떻게 할지 고민해 보고 수업 시간에 알려 드리겠습니다.\"\n* 최종 처리: '''전원 만점'''\n\n{info}'''왜 25번 줄이 문제인가?''' `unlock`이 `FetchAdd(&flag, -1)`이면, 대기자가 여럿일 때 그들이 올려 둔 값 때문에 flag가 0으로 내려오지 않는다. 대기자들이 19번 줄에서 각자 -1을 하긴 하지만 '''+1과 -1 사이의 틈'''에 다른 스레드가 값을 보면 0이 아니어서, 락이 풀렸는데도 아무도 못 들어가는 상황이 생길 수 있다. 제대로 하려면 `unlock`은 '''flag를 0으로 리셋'''하거나 [[ticket lock]]처럼 '''ticket/turn 두 변수'''를 써야 한다.{/info}\n\n{exam}🎯🎯 '''올해 대비 결론'''\n① '''[[fetch-and-add]] 기반 락의 코드 빈칸'''은 교수님이 실제로 낸 형식이다. [[ticket lock]] 코드(12~17번 줄)를 '''빈칸 없이 통째로''' 쓸 수 있어야 한다.\n② `FetchAdd`의 '''반환값은 옛 값'''이라는 점이 이 문제의 핵심 장치다.\n③ '''시험 중 문제가 이상해 보이면''': 일단 '''의도를 추정해 풀고, 답안에 가정을 적어 두자'''. 작년처럼 전원 만점 처리가 될 수도 있지만, 그 전에 내 답이 채점 가능한 형태여야 한다.{/exam}\n\n→ [[fetch-and-add]] · [[ticket lock]] · [[락]] · [[atomic]]\n\n----\n\n== 올해 준비에 주는 시사점 ==\n\n{|\n! # || 시사점 || 대비\n|-\n| 1 || '''객관식 + 정의→용어 단답 + 계산·서술(배점 큼)''' 혼합 || 세 유형을 따로 연습\n|-\n| 2 || 용어는 '''슬라이드 정의 문장 그대로''' 나온다 || 각 문서의 `{def}` 박스를 '''영어로''' 외울 것\n|-\n| 3 || 스케줄링 계산은 '''정의를 문제에서 새로 주고''' 최적 스케줄을 찾게 한다 || [[SJF]]/[[Round Robin]]/[[FIFO]]가 각 지표를 왜 최적화하는지 원리로\n|-\n| 4 || '''코드 빈칸 채우기'''가 두 문제(6번 semaphore, 7번 FetchAdd) || 9강 락 코드들을 '''손으로 써 보기'''\n|-\n| 5 || '''동시성(lock, condition variable, semaphore, spurious wakeup)까지''' 중간 범위였다 || 올해도 [[락]] 이후까지 범위일 가능성 큼\n|-\n| 6 || 평균 '''52.4''' — 어려운 시험 || '''부분 점수'''를 위해 풀이 과정을 반드시 쓸 것\n|-\n| 7 || 출제 오류가 실제로 있었다 || 이상하면 '''가정을 적고''' 풀 것\n|}\n\n== 시험 대비 핵심 요약 ==\n\n# '''Problem 1 정답''': a) Interrupt(비동기라서) b) TCB(CPU 상태 아님) c) Busy wait(deadlock 조건 아님) d) Elevator(디스크 스케줄링) e) System Program(가장 포괄적)\n# '''Deadlock 4조건''': mutual exclusion / hold and wait / no preemption / circular wait\n# '''Synchronous exception 3종''': Trap(의도적, '''next''' 명령어로) / Fault(재실행 또는 abort) / Abort(복구 불가)\n# '''Problem 2 답 7개''': PCB / Multi-level Feedback Queue / Convoy Effect / Cache Affinity / '''Race Condition''' / Spurious Wakeup / Livelock\n# '''Problem 3 답''': a) '''28''' b) '''42''' c) '''32'''. $T_3 = 15$로 고정, $T_1 \\ge 4$, $T_2 \\ge 9$, 경계 조건 $T_1 = T_2 - 1$\n# '''Problem 4''': stride = 500/tickets → A 5, B 10, C 2. 6th에서 (5, 10, 6) → A 선택, 100th에서 (125, 130, 122) → C 선택\n# '''Problem 6''': 세마포어 순서 — '''자원(empty/full)이 바깥, mutex가 안쪽'''. 뒤집으면 deadlock\n# '''Problem 7''': [[fetch-and-add]] 락 빈칸 — (a) FetchAdd (b) 0 (c) FetchAdd(…, −1) (d) 1. '''전원 만점 처리'''됨\n# '''성적''': Mean '''52.4''' / Stdev '''14.4''' / Max '''84'''\n\n== 관련 문서 ==\n* [[시험 정보]] · [[퀴즈1 복기]] · [[자주 틀리는 함정 모음]]\n* [[fetch-and-add]] · [[ticket lock]] · [[락]] · [[race condition]] · [[critical section]] · [[mutual exclusion]]\n* [[TCB]] · [[PCB]] · [[인터럽트]] · [[트랩]] · [[convoy effect]] · [[cache affinity]]\n* [[Stride 스케줄링]] · [[pass]] · [[stride]] · [[tickets]] · [[turnaround time]] · [[fairness]] · [[SJF]] · [[STCF]] · [[Round Robin]] · [[MLFQ]]"

 "자주 틀리는 함정 모음": {

  ],
  "body": "{warn}⏰ '''시험 24시간 전이라면 이 문서만 봐라.''' 각 항목은 '''✗ 틀린 믿음 → ✓ 맞는 사실 → 링크''' 형식이다. 출처는 ① 모의 퀴즈 v1에서 실제로 틀린 문항(`퀴즈1_모의1_틀린것들.md`) ② 슬라이드에서 뒤집히기 쉬운 대비 개념 ③ [[2025F 중간고사 족보]]의 출제 패턴이다.{/warn}\n\n{info}'''읽는 법''': 대비되는 개념(A↔B)을 '''한쪽만 외우고 나머지를 추론'''하다가 뒤집히는 것이 가장 흔한 실패 패턴이다. 아래 표들은 '''항상 양쪽을 나란히''' 적어 두었다.{/info}\n\n== 🔴 1군 — 모의 퀴즈에서 실제로 틀린 것 ==\n\n=== 1-1. 타이머는 누가 켜는가 (A5에서 틀림) ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| 타이머는 '''각 유저 프로그램이 시작할 때''' 켠다 || '''\"During the boot sequence, the OS starts the timer.\"''' — 부팅 때 '''OS가 한 번''' 켜고, 그 뒤로는 하드웨어가 몇 ms마다 알아서 인터럽트를 낸다\n|}\n\n유저가 타이머를 끌 수 있다면 무한 루프 프로세스가 '''CPU를 영영 독점'''한다 → OS가 통제권을 잃는다. 그래서 타이머 설정은 '''[[특권 명령]]'''이다. ([[xv6]]에서는 `start.c`의 `timerinit()`)\n\n'''한 줄''': \"'''타이머는 OS가 부팅 때 켠다. 유저는 못 건드린다.'''\" → [[타이머 인터럽트]] · [[특권 명령]]\n\n=== 1-2. Cooperative의 뜻 (A4에서 흔들림) ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| \"OS가 기다린다\"는 수동적 표현이라 틀린 문장 같다 || 슬라이드 그대로 '''\"A Cooperative Approach: just wait for system calls\"''' — '''맞는 문장이다'''\n|}\n\n{|\n! 방식 || OS가 CPU를 되찾는 방법 || 프로세스가 협조 안 하면\n|-\n| '''[[협력적 방식]]''' (Cooperative) || '''시스템 콜을 기다린다''' (또는 `yield`, 예외) || '''재부팅밖에 없다'''\n|-\n| '''[[비협력적 방식]]''' (Non-cooperative) || '''[[타이머 인터럽트]]'''로 강제로 빼앗는다 || 상관없다\n|}\n\n=== 1-3. STCF ↔ RR — 무엇을 최적화하나 (A7, A8 짝으로 틀림) ===\n\n{warn}🔥 '''가장 위험한 항목.''' 모의에서 '''짝으로 틀렸다''' = 대비 자체가 뒤집혀 있었다는 뜻이다.{/warn}\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| STCF는 '''time-shared machine'''(터미널 앞 사용자)에 좋다 || 슬라이드 p.10: '''\"STCF is not suitable for time-shared machines\"'''. STCF가 좋은 곳은 '''early batch computing'''\n|-\n| Round Robin은 '''turnaround time'''을 최적화한다 || RR이 최적화하는 것은 '''response time'''. turnaround는 '''\"Terrible\"'''\n|}\n\n{|\n! 정책 || 최적화하는 것 || 나쁜 것 || 어울리는 환경\n|-\n| '''[[STCF]]''' || '''turnaround''' || response || '''batch''' (작업 넣고 다음 날 확인)\n|-\n| '''[[Round Robin]]''' || '''response''' || turnaround ('''terrible''') || '''interactive''' (터미널 앞 사용자)\n|}\n\n'''기억법''': '''\"RR은 Response\"''' — 앞 글자 R이 같다. 하나만 확실히 잡으면 나머지는 반대다.\n\n'''한 줄''': \"'''STCF = batch / turnaround. interactive엔 RR.'''\" → [[STCF]] · [[Round Robin]] · [[response time]] · [[turnaround time]]\n\n=== 1-4. EEVDF 규칙 (A13에서 틀림) ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| \"lag > 0이고 VD가 가장 이른 것\"은 틀린 서술 || 슬라이드 p.16 그대로 '''\"Schedule a process with lag > 0 and earliest VD\"''' — '''맞는 서술이다'''\n|}\n\n* '''[[lag]]''' = 받아야 할 CPU 시간 − 실제 받은 시간. '''lag > 0 = 덜 받았다 = eligible(자격 있음)'''. lag ≤ 0이면 후보에서 제외\n* '''[[virtual deadline|VD]]''' = 지금 시각 + slice/weight. eligible한 것들 중 '''마감이 가장 이른''' 것\n\n'''이름 자체가 답''': '''E'''arliest '''E'''ligible '''V'''irtual '''D'''eadline '''F'''irst\n\n{|\n! || 조건 개수 || 무엇\n|-\n| '''[[CFS]]''' || 1개 || [[vruntime]]이 가장 작은 것\n|-\n| '''[[EEVDF]]''' || '''2개''' || '''자격(lag > 0) + 순서(가장 이른 VD)'''\n|}\n\n=== 1-5. 과제 1 — sepc / epc 경로 (A18에서 틀림) ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| `sret` 후 재개 주소는 [[trapframe]]의 epc와 무관하다 || '''3단계로 정확히 연결된다''' (아래)\n|}\n\n# 트랩 '''진입''': [[usertrap]]이 `p->trapframe->epc = r_sepc()` — 끊긴 PC를 '''trapframe에 저장'''\n# 트랩 '''복귀''': [[usertrapret]]이 `w_sepc(p->trapframe->epc)` — trapframe의 epc를 '''[[sepc]] 레지스터에 다시 씀'''\n# '''[[sret]]''' 명령이 '''sepc가 가리키는 주소로''' 점프하며 user mode로\n\n'''한 줄''': \"'''sret은 sepc로 간다. sepc는 trapframe->epc에서 온다. 그래서 epc를 바꾼다.'''\"\n\n그래서 [[과제1 xv6 alarm|과제]]에서 `p->trapframe->epc = handler` 한 줄로 핸들러에 \"떨어지게\" 만든다. → [[epc]] · [[sepc]] · [[return-from-trap]] · [[trapframe]]\n\n=== 1-6. 과제 1 — a0를 왜 돌려주나 (A19에서 틀림) ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| `sys_sigreturn`은 '''그냥 0을 반환'''하면 된다. [[a0]]는 복원 대상이 아니다 || '''저장해 둔 a0를 반환값으로''' 돌려줘야 한다\n|}\n\n흐름:\n# `sys_sigreturn()`이 `*p->trapframe = 저장본`으로 '''범용 레지스터 31개 + epc를 전부 복원'''(a0 포함)\n# 그런데 `syscall()`이 '''그 직후''' `p->trapframe->a0 = 반환값`을 실행 → '''방금 복원한 a0가 덮인다'''\n# 0을 반환하면 끊긴 코드가 a0에 갖고 있던 값이 0이 된다 → test1 실패\n\n'''한 줄''': \"'''sigreturn의 반환값이 a0를 덮으니, 저장된 a0를 반환값으로 준다.'''\" (`return p->trapframe->a0;`)\n\n→ [[a0]] · [[a0 복원]] · [[sigreturn]] · [[alarm_saved]]\n\n=== 1-7. 과제 1 — 핸들러 재진입 (A20에서 틀림) ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| 핸들러가 안 끝났는데 interval이 또 만료되면 '''두 번째로 호출'''해야 한다 || '''호출하면 안 된다.''' 과제 PDF: \"Prevent re-entrant calls to the handler… '''test2 tests this'''\"\n|}\n\n이유: 핸들러 실행 중 또 알람이 터지면 커널이 '''\"지금 끊긴 문맥\"을 저장 슬롯에 다시 복사'''하는데, 지금 끊긴 것은 '''핸들러 자신'''이다 → 원래 유저 코드의 문맥이 '''덮여서 사라진다'''.\n\n'''한 줄''': \"'''핸들러 실행 중엔 다시 안 부른다 — 저장 슬롯이 하나뿐이라.'''\"\n\n→ [[재진입 금지]] · [[alarm_active]] · [[alarm_saved]] · [[과제1 xv6 alarm]]\n\n----\n\n== 🔵 2군 — 락(9강) 함정 ==\n\n=== 2-1. flag 락은 왜 실패하나 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| `while(flag==1); flag=1;`은 '''한 줄씩 보면 맞는''' 코드다 || '''TEST와 SET이 원자적이지 않아서''' 실패한다. 그 사이에 [[컨텍스트 스위치]]가 들어오면 '''두 스레드가 모두 락을 얻는다'''\n|-\n| spin-waiting이 주된 문제다 || '''주된 문제는 mutual exclusion 실패'''(Problem 1). spin 낭비는 Problem 2 (부차적)\n|}\n\n슬라이드 p.18의 결론 한 줄: '''\"Two threads obtain locks!\"''' / 그림 주석: '''\"flag is still 0\"'''\n\n→ [[flag 락]] · [[test-and-set]]\n\n=== 2-2. TAS / CAS / FAA의 반환값 ===\n\n{warn}🔥 '''세 명령 모두 반환값은 \"새 값\"이 아니다.''' 가장 자주 뒤집히는 지점.{/warn}\n\n{|\n! 명령 || ✗ 틀린 믿음 || ✓ 반환값\n|-\n| '''[[test-and-set]]''' || 성공/실패, 또는 새로 쓴 값 || '''옛 값(old)'''. '''0을 반환 = 원래 free = 내가 획득'''\n|-\n| '''[[compare-and-swap]]''' || 성공하면 1, 실패하면 0 || '''그 자리에 실제로 있던 값(actual)'''\n|-\n| '''[[fetch-and-add]]''' || 증가 '''후''' 값 || '''증가 전 값(old)'''\n|}\n\n`while (TestAndSet(&flag, 1) == '''1''') ;` 에서 1과 비교하는 이유가 이것이다 — 1이 돌아왔다 = 원래 held였다 = 계속 spin.\n\n=== 2-3. ticket lock의 fairness 근거 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| [[ticket lock]]은 spin을 안 해서 성능이 좋다 || spin은 '''그대로'''다. '''Performance는 여전히 No'''. 바뀐 칸은 '''Fairness'''뿐\n|-\n| fairness는 \"공평하게 번갈아\" 돌기 때문 || '''[[fetch-and-add]]가 고유한 번호를 주고 turn이 1씩 올라가므로 FIFO'''이기 때문\n|}\n\n{|\n! || Correctness || Fairness || Performance\n|-\n| [[spin lock]] (p.24) || Yes || '''No''' || No\n|-\n| [[ticket lock]] (p.29) || Yes || '''Yes''' ← 여기만 || '''No'''\n|-\n| sleeping lock (p.42) || Yes || Yes || '''Yes''' ← 여기만\n|}\n\n=== 2-4. spin은 항상 나쁜가 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| spin lock은 언제나 비효율적이다 || '''조건이 붙는다.''' 슬라이드도 '''\"In the single CPU\"'''라고 명시한다\n|}\n\n* '''싱글 CPU''' + 락 보유자가 preempt → 나머지가 각자 '''[[time slice]] 전체를 낭비''' → 최악\n* '''멀티코어''' + [[critical section]]이 아주 짧음 → 몇 사이클 도는 게 [[컨텍스트 스위치]](수천 사이클)보다 '''싸다''' → 오히려 최선 ([[xv6]] 커널이 스핀락을 쓰는 이유)\n\n→ [[spin lock]] · [[락 평가 기준]]\n\n=== 2-5. 인터럽트를 끄면 되지 않나 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| 인터럽트를 끄면 [[mutual exclusion]]이 항상 보장된다 || '''단일 프로세서에서만''' 참이다. \"'''Do not work on multiprocessors'''\"\n|}\n\n문제 '''세 가지'''를 다 쓸 것: ① 애플리케이션을 너무 '''신뢰'''(CPU 독점 가능) ② '''인터럽트 유실'''(디스크 I/O 완료 신호) ③ '''멀티프로세서에서 무효''' ← 결정타\n\n→ [[인터럽트 비활성화]]\n\n=== 2-6. wakeup/waiting race ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| [[queue 락]]은 [[park와 unpark|park/unpark]]만 있으면 완전하다 || '''`park()` 직전에 선점되면''' `unpark`이 먼저 지나가 '''영원히 잠든다'''(lost wakeup)\n|-\n| 해결책은 guard를 park 후에 놓는 것 || 그건 '''데드락'''이다. 해결책은 '''[[setpark]]'''(예고제) 또는 '''[[futex|futex_wait(addr, value)]]'''(잠들기 전 값 검사)\n|}\n\n{warn}⭐ '''패턴을 기억하라''': [[flag 락]]의 \"TEST … SET\"과 [[queue 락]]의 \"큐 등록 … park\"는 '''구조가 같다'''. '''원자적이어야 할 두 동작이 분리되면 반드시 race가 생긴다.'''{/warn}\n\n=== 2-7. unlock이 flag를 0으로 내리지 않는 경우 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| `unlock()`은 항상 `flag = 0`을 한다 || [[queue 락]]에서 '''대기자가 있으면 flag를 1로 유지'''한 채 `unpark`만 한다 — '''hand-off'''\n|}\n\n슬라이드 주석: ''hold lock (for next thread!)''. 깨어난 스레드는 flag를 다시 검사/설정할 필요가 없다. → [[queue 락]] · [[guard]]\n\n=== 2-8. guard와 flag 혼동 ===\n\n{|\n! || '''`flag`''' || '''`guard`'''\n|-\n| 보호 대상 || 사용자의 [[critical section]] || '''락 내부 구조'''(flag와 queue)\n|-\n| 대기 방식 || '''[[park와 unpark|park]]'''(잠든다) || '''[[spin lock|spin]]'''([[test-and-set]])\n|-\n| 길이 || 길 수 있다 || '''몇 명령어'''\n|}\n\n\"spin이 완전히 사라지지 않았다\"는 [[queue 락]]의 Limitation 1이 바로 guard 때문이다. → [[guard]]\n\n----\n\n== 🟢 3군 — 스레드(8강) 함정 ==\n\n=== 3-1. volatile이면 안전한가 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| `volatile`을 붙이면 [[race condition]]이 없어진다 || '''매번 메모리에서 읽고 쓰게''' 강제할 뿐, '''read-modify-write의 [[atomic|원자성]]은 전혀 보장하지 않는다'''\n|}\n\n→ [[counter 예제]] · [[atomic]]\n\n=== 3-2. 멀티코어에서만 생기나 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| race condition은 CPU가 여러 개일 때만 생긴다 || '''CPU 1개여도 생긴다.''' 원인은 병렬 실행이 아니라 '''uncontrolled scheduling''' — [[타이머 인터럽트]]가 명령어 사이에 들어온다\n|}\n\n=== 3-3. 락이 선점을 막는가 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| 락을 쥐면 [[타이머 인터럽트]]가 안 걸린다 || '''걸린다.''' 락은 선점을 막지 않고, 선점된 동안 '''남이 critical section에 못 들어오게''' 할 뿐이다\n|}\n\n=== 3-4. preempted ↔ goes to sleep ===\n\n{|\n! 슬라이드 표현 || 무슨 일 || [[프로세스 상태|상태 전이]]\n|-\n| \"main '''goes to sleep'''\" (p.33) || [[pthread_join|join]]에서 스스로 대기 || Running → '''Blocked'''\n|-\n| \"main is '''preempted'''\" (p.34~35) || 타이머로 강제로 빼앗김 || Running → '''Ready'''\n|}\n\n같은 구분이 9강에도 있다 — '''[[yield]]는 Ready, [[park와 unpark|park]]는 Blocked'''.\n\n=== 3-5. 생성 순서 = 실행 순서? ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| 먼저 만든 스레드가 먼저 돈다 || '''보장 없다.''' p.35에서는 OS가 T2를 먼저 고른다\n|-\n| `join` 순서가 실행 순서를 정한다 || `join`은 main이 '''기다리는''' 순서일 뿐이다\n|}\n\n> '''\"What runs next is determined by the OS Scheduler.\"'''\n\np.32 예제의 가능한 출력은 '''2가지'''(A/B 순서만 자유). → [[pthread_join]] · [[스레드]]\n\n=== 3-6. 무엇이 공유되나 ===\n\n{|\n! 따로 (스레드별) || 공유 (프로세스 단위)\n|-\n| [[프로그램 카운터|PC]], [[레지스터]], '''[[스레드 스택|스택]]''', [[TLS]] || 코드, '''전역/static 변수''', '''[[힙]]''', 열린 파일, [[주소 공간]]\n|}\n\n{warn}스택이 '''따로'''라는 건 '''보호된다'''는 뜻이 아니다. 같은 주소 공간이라 포인터만 있으면 남의 스택도 읽고 쓸 수 있다.{/warn}\n\n=== 3-7. TCB는 CPU 상태인가 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| [[TCB]]는 CPU의 programmer-visible state다 || '''OS의 자료구조'''다. 2025F Problem 1-b) 정답이 바로 이것\n|}\n\nprogrammer-visible state = PC, register file, condition codes (+ stack pointer). → [[TCB]] · [[2025F 중간고사 족보]]\n\n----\n\n== 🟡 4군 — 스케줄링 계산 함정 ==\n\n=== 4-1. response time의 정의 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| response time = 완료 시각 − 도착 시각 || 그건 '''turnaround'''다. '''$T_{response} = T_{firstrun} - T_{arrival}$''' — '''처음 스케줄될 때까지'''\n|}\n\n$$T_{turnaround} = T_{completion} - T_{arrival}, \\quad T_{response} = T_{firstrun} - T_{arrival}$$\n\n'''계산 체크''': A, B, C가 0초에 동시 도착, 각 5초, [[time slice]] 1초 [[Round Robin|RR]] → response = 0, 1, 2 → 평균 '''1'''. 같은 것을 [[SJF]]로 하면 0, 5, 10 → 평균 '''5'''.\n\n→ [[response time]] · [[turnaround time]] · [[스케줄링 지표]]\n\n=== 4-2. SJF ↔ STCF ===\n\n{|\n! || 선점? || 언제 판단\n|-\n| '''[[SJF]]''' || '''비선점(non-preemptive)''' || 작업이 끝났을 때만 다음을 고름\n|-\n| '''[[STCF]]''' || '''선점(preemptive)''' || '''새 작업이 도착할 때마다''' 남은 시간을 비교해 갈아탐\n|}\n\nSTCF = Shortest '''Time-to-Completion''' First = SJF의 선점 버전. 도착 시각이 다른 문제에서 둘의 답이 갈린다. → [[선점]]\n\n=== 4-3. RR의 turnaround ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| RR은 골고루 도니까 turnaround도 괜찮다 || '''\"Terrible\"'''이다. 모두가 빨리 '''시작'''하지만 모두가 늦게 '''끝난다'''\n|}\n\n'''증거''': A8/B4/C2 같은 예에서 SJF turnaround 7.33 vs RR 10. response는 SJF 2.67 vs RR 1.\n\n=== 4-4. Fairness metric의 방향 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| F는 '''불'''공정도라서 작을수록 좋다 || 슬라이드에서 \"'''un'''fairness\"의 \"un\"에 '''취소선'''이 그어져 있다. F는 '''공정도'''이고 '''1에 가까울수록 공정'''하다\n|}\n\n정의: '''먼저 끝난 작업의 완료 시각 / 나중 끝난 작업의 완료 시각'''. 예: 10과 20에 끝나면 $F = 10/20 = 0.5$. 둘 다 20이면 $F \\approx 1$.\n\n{warn}[[2025F 중간고사 족보|2025F 중간고사]]는 이것을 3개 작업으로 확장한 '''시험용 변형''' $F = T_1/T_2 + T_2/T_3$를 문제에서 새로 정의해 주었다. '''문제가 정의를 주면 그것을 따르라.'''{/warn}\n\n→ [[fairness]] · [[2025F 중간고사 족보]]\n\n=== 4-5. MLFQ Rule 4의 함정 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| I/O로 CPU를 내놓으면 allotment가 초기화된다 || '''누적해서 센다.''' 그래야 \"slice 끝나기 직전에 I/O 하는 꼼수\"(gaming)를 막는다\n|}\n\n[[MLFQ]] 규칙 5개는 통째로 암기: ① 우선순위 높은 쪽 실행 ② 같으면 RR ③ 새 작업은 '''최고 우선순위'''로 ④ allotment 소진 시 '''강등'''(누적) ⑤ 주기 S마다 '''전부 최상위로'''(priority boost)\n\n=== 4-6. Lottery를 왜 쓰나 ===\n\n{|\n! ✗ 틀린 믿음 || ✓ 맞는 사실\n|-\n| [[Stride 스케줄링|Stride]]가 더 정확하니 Lottery는 쓸 이유가 없다 || Lottery는 '''전역 상태(global state, 예: [[pass]] 값)가 없다''' → 스케줄러 설계가 쉽다\n|}\n\n슬라이드 예: stride 도중 '''새 작업이 들어오면 pass를 몇으로?''' 0으로 두면 '''CPU를 독점'''한다. Lottery는 이 문제가 없다. → [[Lottery 스케줄링]] · [[Stride 스케줄링]]\n\n----\n\n== 🟣 5군 — 정의를 영어로 외워야 하는 것들 ==\n\n{exam}🎯 [[2025F 중간고사 족보|2025F Problem 2]]는 '''슬라이드 정의 문장을 그대로''' 옮겨 용어를 묻는다. 아래는 그렇게 나올 가능성이 높은 정의들이다.{/exam}\n\n{|\n! 정의 (영어) || 답 || 문서\n|-\n| \"An '''undesirable situation''' that occurs when a device or system attempts to perform '''two or more operations at the same time'''\" || '''Race condition''' ('''2025F 기출''') || [[race condition]]\n|-\n| \"A piece of code that '''accesses a shared variable''' and '''must not be concurrently executed by more than one thread'''\" || '''Critical section''' || [[critical section]]\n|-\n| \"A number of relatively-short potential consumers of a resource '''get queued behind a heavyweight resource consumer'''\" || '''Convoy effect''' ('''2025F 기출''') || [[convoy effect]]\n|-\n| \"Keep a process on the '''same CPU''' if possible\" || '''Cache affinity''' ('''2025F 기출''') || [[cache affinity]]\n|-\n| \"the OS's data structure that contains information about '''each process'''\" (3 words) || '''Process Control Block''' ('''2025F 기출''') || [[PCB]]\n|-\n| \"a '''sequential execution stream''' within a process\" || '''Thread''' (unit of '''concurrency''') || [[스레드]]\n|-\n| \"'''All the addresses''' that the program can touch\" || '''Address space''' (unit of '''protection''') || [[주소 공간]]\n|-\n| \"'''All or nothing''' and no context switch\" || '''Atomic''' || [[atomic]]\n|-\n| \"Does each thread contending for the lock get a '''fair shot''' at acquiring it once it is free?\" || '''Fairness''' (반대 현상 = '''starvation''') || [[락 평가 기준]]\n|-\n| \"'''fast userspace mutex'''\", \"checked and queued version of park()\" || '''futex''' || [[futex]]\n|}\n\n{warn}'''unit of ___' 빈칸은 특히 조심''': thread = unit of '''concurrency''', address space = unit of '''protection'''.{/warn}\n\n----\n\n== ⚡ 최종 체크리스트 (시험장 들어가기 직전) ==\n\n# 타이머는 '''부팅 때 OS'''가 켠다 / cooperative = '''시스템 콜을 기다린다'''\n# '''STCF = turnaround = batch''' / '''RR = response = interactive'''\n# '''EEVDF = lag > 0 (eligible) + earliest VD''' — 조건 '''2개'''\n# '''sret → sepc → trapframe->epc''' 3단계\n# '''sigreturn은 저장된 a0를 반환'''한다\n# 핸들러 '''재진입 금지''' — 저장 슬롯이 하나라서\n# '''flag 락은 TEST와 SET이 분리'''되어 실패 → \"Two threads obtain locks!\"\n# '''TAS / CAS / FAA는 모두 \"옛 값\"을 반환'''한다\n# '''ticket lock은 fairness만''' Yes로 바꾼다 (performance는 여전히 No)\n# '''인터럽트 끄기는 멀티프로세서에서 무효'''\n# '''wakeup/waiting race''' → [[setpark]] 또는 [[futex|futex_wait]]\n# queue 락의 '''guard는 spin, flag는 park''' / 대기자 있으면 '''flag를 1로 유지'''(hand-off)\n# '''volatile은 원자성을 보장하지 않는다''' / race는 '''CPU 1개여도''' 생긴다\n# '''response = 첫 실행 − 도착''', turnaround = 완료 − 도착\n# '''SJF는 비선점, STCF는 선점'''\n# '''F는 공정도'''(1에 가까울수록 공정), 문제가 정의를 주면 그것을 따를 것\n# 계산·서술은 '''풀이 과정을 써야''' 부분 점수 (작년 평균 52.4)\n\n== 관련 문서 ==\n* [[2025F 중간고사 족보]] · [[퀴즈1 복기]] · [[시험 정보]] · [[읽는 순서]]\n* [[스레드]] · [[counter 예제]] · [[race condition]] · [[critical section]] · [[atomic]]\n* [[락]] · [[flag 락]] · [[test-and-set]] · [[ticket lock]] · [[queue 락]] · [[setpark]] · [[futex]] · [[guard]]\n* [[STCF]] · [[Round Robin]] · [[SJF]] · [[MLFQ]] · [[EEVDF]] · [[fairness]] · [[response time]] · [[turnaround time]]\n* [[과제1 xv6 alarm]] · [[sepc]] · [[epc]] · [[a0 복원]] · [[재진입 금지]]"
 },
 "OSTEP": {

  ],
  "body": "'''OSTEP'''은 위스콘신 대학의 Remzi &amp; Andrea Arpaci-Dusseau 부부가 쓴 운영체제 교재로, 이 수업의 '''주교재'''다. 슬라이드 자체가 저자 슬라이드를 기반으로 만들어졌으므로, 슬라이드가 잘 이해되지 않을 때 해당 챕터를 읽는 것이 가장 빠른 길이다.\n\n{def}\n'''Textbooks: OSTEP''' (1강 p.11)<br>\n\"Remzi H. Arpaci-Dusseau and Andrea C. Arpaci-Dusseau, University of Wisconsin-Madison — '''Maybe, the best textbook for operating systems'''. '''All the chapters are available to the public'''.\"<br>\n1강 p.10 — \"Lecture slides: '''Based on the authors' slides''', but include the contents of other textbooks and web resources.\"\n{/def}\n\n{analogy}\n🍰 제목의 \"'''Three Easy Pieces'''\"가 곧 이 책의 목차다 — [[가상화]] / [[동시성]] / [[영속성]] 세 조각. 파인만의 물리학 강의 \"Six Easy Pieces\"를 패러디한 제목이고, \"운영체제는 결국 이 세 덩어리뿐이다\"라는 저자들의 선언이다. 2강이 통째로 이 세 조각의 예고편이다.\n{/analogy}\n\n== 이 수업의 교재 3종 ==\n\n{| class=\"table\"\n! 교재 || 저자 || 쓰이는 곳\n|-\n| '''OSTEP''' (2015) || Arpaci-Dusseau || '''주교재'''. 3~9강 대부분\n|-\n| Operating System Concept (9th, 2013) || Silberschatz || 보조\n|-\n| CSAPP (2nd, 2012) || Bryant &amp; O'Hallaron || 3강 전반부 (어셈블리, 링킹, 로딩)\n|}\n\n== 강의별 대응 챕터 ==\n\n슬라이드 마지막 Reference 장에 적혀 있는 것들이다.\n\n{| class=\"table\"\n! 강의 || OSTEP 챕터\n|-\n| 2강 [[운영체제란|What is OS]] || Chapter 2 — '''Introduction to Operating Systems'''\n|-\n| 3강 [[프로세스]] || Chapter 4 — '''The Abstraction: The Process''' (+ CSAPP 2.1~2.3)\n|-\n| ([[프로세스 API]], [[fork]]/[[exec]]/[[wait]]) || Chapter 5 — Process API (`p1.c`~`p3.c` 예제의 출처)\n|-\n| 4강 [[제한적 직접 실행]] || Chapter 6 — Mechanism: Limited Direct Execution\n|-\n| 5강 [[스케줄링]] || Chapter 7~8 — Scheduling, [[MLFQ]]\n|-\n| 6강 [[비례 지분 스케줄링]] || Chapter 9 — Scheduling: Proportional Share\n|-\n| 7강 [[멀티프로세서 스케줄링]] || Chapter 10 — Multiprocessor Scheduling\n|-\n| 8강 [[스레드]] || Chapter 26 — Concurrency: An Introduction\n|-\n| 9강 [[락]] || Chapter 28 — Locks\n|}\n\n{tip}\n전 챕터가 '''무료 공개'''다 (https://pages.cs.wisc.edu/~remzi/OSTEP/). 한국어 커뮤니티 번역본의 GitHub 주소는 과목 폴더의 `_OSTEP_한국어번역_링크.txt`에 적혀 있다. 슬라이드가 압축해 놓은 문장의 원래 맥락이 필요할 때 해당 챕터 PDF만 열어 보면 된다.\n{/tip}\n\n{warn}\n'''슬라이드에만 있는 것과 OSTEP에만 있는 것을 구분할 것.''' 예를 들어 3강 슬라이드는 [[프로세스 API]]의 '''이름만''' 나열하고, `p1.c`/`p2.c`/`p3.c` 코드와 출력은 OSTEP Chapter 5에 있다. 반대로 아이스크림 가게 비유(2강)는 교수님이 직접 만든 것으로 OSTEP에는 없다. 시험은 '''슬라이드 기준'''이 원칙이다.\n{/warn}\n\n== 예상 문제 ==\n\n{quiz}\n'''(개념)''' OSTEP의 제목에 나오는 \"three easy pieces\"란 무엇을 가리키는가?\n{/quiz}\n{answer}\n운영체제의 세 대주제 — '''[[가상화|Virtualization]]''', '''[[동시성|Concurrency]]''', '''[[영속성|Persistence]]'''. 2강이 이 셋을 순서대로 소개한다.\n{/answer}\n\n== 관련 문서 ==\n* [[운영체제란]] / [[가상화]] / [[동시성]] / [[영속성]]\n* [[프로세스]] / [[프로세스 API]] / [[fork]] / [[exec]] / [[wait]]\n* [[xv6]] — 이론이 OSTEP이면 구현은 xv6\n* [[OS 역사]]"
 },
 "RISC-V": {
  "title": "RISC-V",
  "category": [
   "용어",
   "과제1"
  ],
  "body": "'''RISC-V'''는 개방형 RISC 계열 명령어 집합 구조(ISA)다. 과제에서 쓰는 [[xv6]]가 RISC-V 버전이므로, [[trapframe]]·[[a0]]·[[sepc]]·[[sret]] 같은 과제 1의 모든 용어가 이 ISA의 것이다.\n\n{def}\n3강 p.5에서 '''RISC'''가 대비 개념으로 등장한다 — x86은 \"'''Complex''' instruction set computer (CISC): many different instructions with many different formats. '''Hard to match performance of Reduced Instruction Set Computers (RISC)'''.\"<br>\n1강 p.8 — [[xv6]]는 \"designed for multiprocessor x86 and '''RISC-V'''\".\n{/def}\n\n{analogy}\n🔧 '''공구 세트'''의 철학 차이다. CISC(x86)는 \"이 나사 전용 드라이버, 저 나사 전용 드라이버…\" 하고 특수 공구를 수백 개 갖춘 세트다. RISC-V는 \"드라이버·렌치·망치 몇 개만 두고 조합해서 쓴다\"는 세트다. 공구가 적으면 손이 더 가지만, 공구함(디코더)이 단순해져서 더 빠르고 전기를 덜 먹는다. 게다가 RISC-V는 '''설계도가 공개'''되어 있어 누구나 직접 만들 수 있다.\n{/analogy}\n\n== CISC vs RISC ==\n\n{| class=\"table\"\n! || CISC (x86) || RISC (RISC-V, ARM)\n|-\n| 명령어 || 많고 형식이 다양 || 적고 형식이 규칙적\n|-\n| 명령어 길이 || 가변 || 대체로 고정\n|-\n| 성능 || 슬라이드: \"hard to match RISC\" || 유리\n|-\n| 시장 || 데스크탑·서버 ('''backward compatibility''' 때문) || 모바일·임베디드, 그리고 확산 중\n|}\n\n{tip}\n0831 녹음본에서 교수님의 현실 진단: x86이 서버 시장을 잡은 이유는 성능이 아니라 '''하위 호환'''이다 — \"inside the server we usually just use the '''legacy program''' without upgrading it … '''that is the reason X86 processor wins the server market'''.\" 그리고 \"they are '''slowly transitioning''' into the RISC computers\"라고 덧붙인다. → [[OS 역사]]\n{/tip}\n\n== 과제 1에서 알아야 할 것 ==\n\n=== 레지스터 규약 ===\n\n{| class=\"table\"\n! 레지스터 || 용도\n|-\n| '''`a0`~`a7`''' || 함수/시스템 콜 '''인자'''. 그리고 '''`a0`는 반환값''' → [[a0]]\n|-\n| '''`a7`''' || [[시스템 콜]] '''번호'''를 싣는 자리\n|-\n| `sp` || [[스택 포인터]]\n|-\n| `ra` || return address\n|-\n| `s0`~`s11` || callee-saved — `struct context`에 저장되는 것들\n|-\n| `t0`~`t6` || caller-saved (임시)\n|}\n\n=== 트랩 관련 명령·CSR ===\n\n{| class=\"table\"\n! 이름 || 무엇\n|-\n| '''`ecall`''' || 유저가 [[시스템 콜]]을 일으키는 명령 ([[트랩]] 발생)\n|-\n| '''[[sepc]]''' || Supervisor Exception PC — 트랩 순간의 [[프로그램 카운터|PC]]를 하드웨어가 저장\n|-\n| `stvec` || 트랩 벡터 주소 ([[트랩 테이블]])\n|-\n| `scause` || 트랩의 원인 (시스템 콜인지 인터럽트인지 → [[which_dev]])\n|-\n| '''[[sret]]''' || Supervisor Return — 유저 모드로 복귀 ([[return-from-trap]])\n|}\n\n<pre class=\"asm\">\n# user/usys.S (usys.pl 이 생성) — 시스템 콜의 전부\n.global sigalarm\nsigalarm:\n li a7, SYS_sigalarm      # 번호를 a7 에\n ecall                    # 트랩 → 커널\n ret                      # 결과는 a0 에\n<\/pre>\n\n{warn}\n슬라이드의 [[struct proc]]·`struct context`는 '''x86''' 코드(`eip`, `ebx`, `esi`, `edi`, `ebp`)이고 과제 코드는 '''RISC-V'''(`ra`, `sp`, `s0`~`s11`)다. 레지스터 이름이 통째로 다르니 섞지 말 것. → [[struct proc]]\n{/warn}\n\n== 예상 문제 ==\n\n{quiz}\n'''(빈칸)''' [[RISC-V]] xv6에서 시스템 콜 번호는 `_____` 레지스터에 싣고, 반환값은 `_____` 레지스터로 돌아온다.\n{/quiz}\n{answer}\n번호 = '''`a7`''', 반환값 = '''`a0`'''. `kernel/syscall.c`의 `num = p->trapframe->a7;` / `p->trapframe->a0 = syscalls[num]();`가 그 증거다. → [[시스템 콜 추가 절차]]\n{/answer}\n\n== 관련 문서 ==\n* [[a0]] / [[a0 복원]] / [[레지스터]] / [[스택 포인터]]\n* [[sepc]] / [[epc]] / [[sret]] / [[트랩]] / [[트랩 테이블]]\n* [[xv6]] / [[struct proc]] / [[시스템 콜 추가 절차]]\n* [[OS 역사]] — CISC vs RISC 배경"
 },
 "a0": {
  "title": "a0 (레지스터)",
  "category": [
   "용어",
   "과제1"
  ],
  "body": "'''`a0`'''는 [[RISC-V]]의 범용 [[레지스터]] 중 하나로, '''함수의 첫 번째 인자'''이자 '''반환값'''을 담는 자리다. 이 '''두 역할을 겸한다'''는 사실이 [[과제1 xv6 alarm|과제 1]]의 [[a0 복원]] 문제를 만들어 낸다.\n\n{def}\nRISC-V calling convention — `a0`~`a7` = argument registers, and '''`a0`(and `a1`) also hold the return value'''.\n[[xv6]] 시스템 콜에서: 인자 = `a0`~`a5`, '''번호 = `a7`''', '''반환값 = `a0`'''.\n{/def}\n\n{analogy}\n`a0`는 '''창구의 \"서류 놓는 자리\"가 하나뿐인 것'''과 같다. 들어갈 때 신청서를 놓고, 나올 때 결과물을 '''같은 자리에''' 받는다. 자리가 하나라서 편하지만, '''원래 거기 있던 물건은 사라진다.''' [[sigreturn]]이 저장된 값을 반환값으로 돌려주는 이유가 정확히 이것이다.\n{/analogy}\n\n== 역할 ==\n\n{| class=\"table\"\n! 맥락 || `a0`의 역할\n|-\n| 일반 C 함수 호출 || 첫 번째 인자 / 반환값\n|-\n| [[xv6]] 시스템 콜 (유저 → 커널) || 첫 번째 인자. `argint(0, &n)`이 `p->trapframe->a0`을 읽음\n|-\n| [[xv6]] 시스템 콜 (커널 → 유저) || '''반환값'''. `syscall()`이 `p->trapframe->a0 = 결과`\n|-\n| [[trapframe]] || 오프셋 112의 필드로 저장됨\n|-\n| `uservec` || 유일하게 `sscratch`로 잠깐 피신했다가 저장되는 레지스터\n|}\n\n== 시스템 콜 레지스터 3형제 ==\n\n<pre class=\"ascii\">\n   유저:  li a7, 22       ← a7 = 시스템 콜 \"번호\"\n          (a0 = 첫 인자, a1 = 둘째 인자, …)\n          ecall\n             │\n             ▼  커널\n   syscall():  num = p->trapframe->a7;                  ← 번호로 디스패치\n               p->trapframe->a0 = syscalls[num]();      ← ★ 반환값을 a0 에\n             │\n             ▼  sret\n   유저:  a0 에 결과가 들어 있다\n<\/pre>\n\n{warn}\n'''`a0`는 [[sigreturn]]에서 유일하게 \"복원했는데도 덮어써지는\" 레지스터'''다. `ra`, `sp`, `t0`~`t6`, `s0`~`s11`, `a1`~`a7`은 [[alarm_saved]] 복원 뒤 아무도 건드리지 않지만, `a0`만은 `syscall()`이 반환값으로 덮는다. → [[a0 복원]]\n{/warn}\n\n{exam}\n'''실제 퀴즈 1의 4번(20점)이 이 레지스터 하나에 관한 문제였다.''' 저장된 `a0 = 0x2a`일 때, ① 복원 직후는 `0x2a`, ② 유저 재개 시점은 `0` (`return 0;`이므로). 해결은 `return p->trapframe->a0;`. 모의 A19에서도 \"a0는 복원 대상이 아니다\"를 참으로 골라 틀렸다.\n{/exam}\n\n== x86과의 대응 ==\n\n{| class=\"table\"\n! 역할 || x86 (32-bit) || '''[[RISC-V]]'''\n|-\n| 시스템 콜 번호 || `%eax` || '''`a7`'''\n|-\n| 인자 || `%ebx, %ecx, %edx, %esi, %edi, %ebp` || '''`a0`~`a5`'''\n|-\n| 반환값 || `%eax` || '''`a0`'''\n|}\n\n{tip}\nx86에서는 '''번호와 반환값이 둘 다 `%eax`'''라 겹침이 더 심하다. RISC-V는 번호를 `a7`로 분리해 그나마 낫지만, '''인자와 반환값의 겹침'''은 여전히 남아 있다.\n{/tip}\n\n== 관련 문서 ==\n* [[a0 복원]] · [[레지스터]] · [[trapframe]] · [[sigreturn]] · [[xv6 시스템 콜 경로]]\n* [[RISC-V]] · [[시스템 콜]] · [[alarm_saved]] · [[과제1 xv6 alarm]] · [[퀴즈1 복기]]"
 },
 "xv6": {
  "title": "xv6",
  "category": [
   "용어",
   "과제1"
  ],
  "body": "'''xv6'''는 MIT가 운영체제 수업(6.828/6.1810)용으로 만든 교육용 유닉스 계열 운영체제다. 이 과목의 네 개 프로젝트가 전부 xv6 위에서 돌아가고, 3강 p.37~38의 [[struct proc]]도 xv6 코드다.\n\n{def}\n'''xv6''' (1강 p.8)<br>\n\"a simple, Unix-like '''teaching''' operating system — a simple but '''POSIX-compliant''' operating system designed for '''multiprocessor x86 and RISC-V'''. Developed for '''MIT's''' operating system course.\"<br>\n3강 p.37 각주 — \"Xv6, a simple Unix-like teaching operating system\"\n{/def}\n\n{analogy}\n🚗 '''운전 교습용 차량'''이다. 실제 도로를 달릴 수 있는 진짜 차지만, 부품 수를 최소로 줄여서 보닛을 열면 엔진이 한눈에 보인다. 리눅스 커널이 3천만 줄인 데 비해 xv6는 '''1만 줄 남짓''' — 그래서 학부생이 한 학기에 전체를 읽고, 심지어 [[시스템 콜 추가 절차|시스템 콜을 직접 하나 붙여]] 볼 수 있다.\n{/analogy}\n\n== 이 수업에서의 위치 ==\n\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 프로젝트 || 총 '''4개''' (\"Four projects will be assigned\", 1강 p.8). 평가 비중 '''30%''' (퀴즈 + 보고서)\n|-\n| 과제 1 || [[과제1 xv6 alarm]] — [[sigalarm]]/[[sigreturn]] 추가. 마감 2026-10-10 23:00\n|-\n| 저장소 || `coruslab-src/xv6-lab`의 '''`traps` 브랜치'''\n|-\n| 환경 || Docker (`sinasadeghi83/xv6-env`) + QEMU. `make qemu`로 부팅\n|-\n| 아키텍처 || 과제는 '''[[RISC-V]]''' 버전\n|}\n\n<pre class=\"sh\">\n$ git clone https://github.com/coruslab-src/xv6-lab.git\n$ cd xv6-lab\n$ git checkout traps\n$ docker run --name lab1 -it -v $(pwd):/home/xv6/xv6-riscv \\\n      sinasadeghi83/xv6-env:buildx-latest\n$ make qemu          # xv6 부팅 확인\n<\/pre>\n\n== 슬라이드 버전과 과제 버전이 다르다 ==\n\n{warn}\n'''가장 중요한 주의 사항.''' 3강 p.37~38에 실린 xv6 코드는 '''x86 시절''' 버전이다.<br>\n· 슬라이드: `char *mem;`, `struct trapframe *tf;`, `struct context { int eip, ebx, esi, edi, ebp; }`, `enum proc_state { UNUSED, '''EMBRYO''', ... }`<br>\n· 과제: `pagetable_t pagetable;`, `struct trapframe *'''trapframe''';`, `struct context { uint64 ra, sp, s0~s11; }`, `enum procstate { UNUSED, '''USED''', ... }`<br>\n'''시험은 슬라이드 기준, 과제는 소스 기준'''으로 따로 외울 것. 자세한 대조표는 [[struct proc]]에 있다.\n{/warn}\n\n== 알아 두면 좋은 구조 ==\n\n{| class=\"table\"\n! 디렉토리/파일 || 무엇\n|-\n| `kernel/proc.h`, `proc.c` || [[struct proc]], `allocproc()`, `scheduler()`, [[myproc]]()\n|-\n| `kernel/trap.c` || [[usertrap]](), [[usertrapret]](), [[which_dev]] 판정\n|-\n| `kernel/syscall.h`, `syscall.c` || 시스템 콜 번호와 디스패치 테이블\n|-\n| `kernel/sysproc.c` || `sys_*()` 구현체들\n|-\n| `user/user.h`, `user/usys.pl` || 유저 쪽 선언과 스텁 생성기 ([[usys.pl]])\n|-\n| `user/alarmtest.c` || 과제 1 채점 기준 테스트 ([[alarmtest]])\n|-\n| `Makefile` || `UPROGS`에 유저 프로그램 등록, `make qemu` / `make grade` / `make zipball`\n|}\n\n{tip}\n제출은 `make zipball`로 만든 `lab.zip`을 `{학번}_{이름}.zip`으로 개명해서 낸다. '''`git commit`을 먼저 해야''' zipball이 만들어진다.\n{/tip}\n\n== 교재와의 관계 ==\n\n* 이 수업의 이론은 '''[[OSTEP]]''', 구현은 '''xv6'''라는 조합이다\n* xv6 자체의 교재는 MIT의 \"xv6: a simple, Unix-like teaching operating system\" (1강 p.8에 링크)\n* [[OS 역사|계보]]: UNIX (Bell Labs) → xv6 (MIT, x86) → xv6-riscv → `coruslab-src/xv6-lab`\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"MIT의 운영체제 수업을 위해 개발된, 단순하지만 POSIX를 따르는 교육용 유닉스 계열 운영체제\"의 이름은?\n{/quiz}\n{answer}\n'''xv6'''. 슬라이드는 \"designed for multiprocessor '''x86 and RISC-V'''\"라고 덧붙인다.\n{/answer}\n\n== 관련 문서 ==\n* [[struct proc]] / [[PCB]] / [[프로세스]]\n* [[과제1 xv6 alarm]] / [[시스템 콜 추가 절차]] / [[alarmtest]]\n* [[usertrap]] / [[trapframe]] / [[myproc]] / [[usys.pl]]\n* [[OSTEP]] / [[RISC-V]] / [[OS 역사]]"
 },
 "레지스터": {
  "title": "레지스터 (Register)",
  "category": [
   "용어"
  ],
  "body": "'''레지스터'''(Register)는 CPU 안에 있는 극소수의 초고속 저장소다. 3강 p.9~10의 \"Assembly Programmer's View\"에서 '''register file'''이라는 이름으로 등장하며, 프로세스를 멈췄다 재개할 때 저장·복원해야 하는 '''문맥(context)'''의 본체다.\n\n{def}\n'''Register file''' (3강 p.10, Programmer-Visible State)<br>\n\"'''Heavily used program data'''\" — 프로그램이 자주 쓰는 데이터를 담는 CPU 내부 저장소.<br>\n함께 나오는 programmer-visible state: '''PC'''([[프로그램 카운터]]), '''Register file''', '''Condition codes''', 그리고 '''Memory'''.\n{/def}\n\n{analogy}\n🍳 '''조리대 위'''다. 냉장고(디스크)나 창고(메모리)에서 재료를 꺼내 와야 요리할 수 있는데, 조리대는 아주 좁아서 몇 개밖에 못 올린다. 대신 손만 뻗으면 닿는다. CPU가 연산하려면 값을 반드시 레지스터로 '''load'''해 와야 하고, 다 쓰면 다시 메모리로 '''store'''해야 한다 — 이 왕복이 `counter++`가 세 명령어로 쪼개지는 이유다.\n{/analogy}\n\n[[img:L3-10.png|3강 p.10. CPU 박스 안에 PC / Registers / Condition Codes. 메모리와는 Addresses·Data·Instructions를 주고받는다.|large]]\n\n== 어디에 나오나 ==\n\n{| class=\"table\"\n! 맥락 || 레지스터가 하는 역할\n|-\n| [[프로세스]] || control flow의 일부 — \"각 프로세스는 exclusive control flow '''(+ registers)'''를 갖는다\"\n|-\n| [[컨텍스트 스위치]] || 저장·복원 대상. 이 저장 비용이 곧 전환 오버헤드\n|-\n| [[struct proc]] || `struct context` (커널 전환용, callee-saved만) / [[trapframe]] (트랩용, 전부)\n|-\n| [[시스템 콜]] || [[RISC-V]]에서 번호는 `a7`, 인자는 `a0`~`a5`, 반환값은 '''[[a0]]'''\n|-\n| [[동시성]] || `counter++`이 load → add → store로 쪼개지는 이유\n|}\n\n{exam}\n2025F 중간고사 '''Problem 1''' 해설에 \"Assembly Programmer's View (Cont.)\" 슬라이드가 그대로 실렸다. '''PC + register file + condition codes'''라는 세 가지 programmer-visible state를 묻는 문제가 실제로 출제되었다. → [[2025F 중간고사 족보]]\n{/exam}\n\n== 슬라이드에 등장하는 레지스터들 ==\n\n<pre class=\"c\">\n// x86 xv6 (3강 p.38) — 커널 컨텍스트 스위치용 5개\nstruct context {\n    int eip;   // Index pointer register   ← 사실상 PC\n    int ebx;   // base register\n    int esi;   // Source index register\n    int edi;   // Destination index register\n    int ebp;   // Stack base pointer register\n};\n<\/pre>\n\n<pre class=\"c\">\n// RISC-V xv6 (과제 1) — 14개\nstruct context {\n  uint64 ra;    // return address\n  uint64 sp;    // stack pointer\n  uint64 s0; uint64 s1; uint64 s2;  uint64 s3;\n  uint64 s4; uint64 s5; uint64 s6;  uint64 s7;\n  uint64 s8; uint64 s9; uint64 s10; uint64 s11;\n};\n<\/pre>\n\n{warn}\n`struct context`에는 `a0`~`a7`, `t0`~`t6`이 '''없다'''. 함수 호출 규약상 caller가 알아서 챙기는 caller-saved 레지스터이기 때문이다.<br>\n반면 [[trapframe]]에는 '''35개 전부'''가 들어 있다 — 유저 코드는 언제 [[타이머 인터럽트|인터럽트]]당할지 모르므로 하나도 빠뜨릴 수 없다. 이 비대칭이 과제 1에서 \"왜 [[trapframe]]을 통째로 복사해야 하나\"의 답이다.\n{/warn}\n\n== 예상 문제 ==\n\n{quiz}\n'''(나열)''' 3강 p.10의 '''programmer-visible state''' 세 가지를 쓰시오.\n{/quiz}\n{answer}\n'''PC (Program counter)''', '''Register file''', '''Condition codes'''. (+ CPU 밖의 '''Memory''')\n{/answer}\n\n== 관련 문서 ==\n* [[프로그램 카운터]] / [[스택 포인터]] / [[a0]]\n* [[컨텍스트 스위치]] / [[trapframe]] / [[struct proc]]\n* [[프로세스]] / [[RISC-V]]"
 },
 "스택 포인터": {
  "title": "스택 포인터 (SP, Stack Pointer)",
  "category": [
   "용어"
  ],
  "body": "'''스택 포인터'''(SP)는 현재 [[스택]]의 꼭대기 주소를 가리키는 [[레지스터]]다. 3강 p.19의 메모리 그림에서 User stack 옆에 `%esp (stack pointer)`라는 라벨로 등장한다.\n\n{def}\n3강 p.19 \"Loading Executable\" — 프로세스 메모리 이미지에서 '''User stack (created at runtime)''' 영역을 가리키는 화살표에 '''`%esp` (stack pointer)'''라고 표시되어 있다. (맞은편 heap 쪽은 `brk`.)\n{/def}\n\n{analogy}\n🍽️ '''접시 더미의 맨 위'''를 가리키는 손가락이다. 접시를 쌓으면(push, 함수 호출) 손가락이 위로, 치우면(pop, 함수 리턴) 아래로 움직인다. 손가락이 없으면 \"다음 접시를 어디에 놓아야 하는지\"를 알 수 없다. 그래서 SP는 잃어버리면 안 되는 값이고, [[컨텍스트 스위치]]와 [[트랩]] 양쪽에서 반드시 저장·복원된다.\n{/analogy}\n\n[[img:L3-19.png|3강 p.19. 오른쪽 메모리 이미지의 User stack 옆에 %esp (stack pointer) 라벨이 붙어 있다. 스택은 아래로 자란다.|large]]\n\n== 이름과 위치 ==\n\n{| class=\"table\"\n! 맥락 || 이름\n|-\n| IA32 (슬라이드) || '''`%esp`'''\n|-\n| x86-64 || `%rsp`\n|-\n| [[RISC-V]] (과제 1) || '''`sp`''' (= `x2`)\n|-\n| xv6 `struct context` || `uint64 sp;` — 커널 스택 포인터\n|-\n| xv6 [[trapframe]] || `/* 48 */ uint64 sp;` — 유저 스택 포인터\n|}\n\n{warn}\n'''[[스택]]은 높은 주소에서 낮은 주소로 자란다.''' 그래서 `push`는 SP를 '''감소'''시키고 `pop`은 증가시킨다. 반대편의 [[힙]]은 낮은 주소에서 높은 주소로 자란다 — 둘이 서로를 향해 자라다가 만나면 스택 오버플로다.\n{/warn}\n\n{warn}\n'''유저 SP와 커널 SP는 서로 다른 값이다.''' 트랩이 일어나면 하드웨어·`uservec`가 유저 `sp`를 [[trapframe]]에 저장하고, [[커널 스택]]의 꼭대기(`p->trapframe->kernel_sp`)로 갈아 끼운다. 그래서 커널 코드는 유저 스택을 밟지 않는다 — 유저가 SP를 이상한 값으로 조작해도 커널이 안전한 이유다.\n{/warn}\n\n== 왜 프로세스마다 스택이 따로여야 하나 ==\n\n{tip}\n0831 녹음본, 프로세스 생성 2단계를 설명하며: \"the '''stack''' stores the local variables, function parameters and the return addresses. And this is quite important in the process creation because the stack actually '''has some data for the logical control flow'''.\"<br>\n→ 리턴 주소가 스택에 있으므로, 스택은 [[프로그램 카운터|PC]]와 함께 \"어디까지 왔는가\"를 구성한다. 그래서 3강 p.26이 \"each program seems to have exclusive use of the CPU '''(+ stack)'''\"라고 스택을 괄호로 덧붙인 것이다.\n{/tip}\n\n== 예상 문제 ==\n\n{quiz}\n'''(개념)''' [[스택]]이 높은 주소에서 낮은 주소로 자란다면, `push` 연산은 스택 포인터를 증가시키는가 감소시키는가?\n{/quiz}\n{answer}\n'''감소'''시킨다. 꼭대기가 더 낮은 주소로 내려가기 때문이다. 반대편에서 [[힙]]은 위로(주소 증가 방향) 자란다.\n{/answer}\n\n== 관련 문서 ==\n* [[스택]] / [[힙]] / [[주소 공간]]\n* [[레지스터]] / [[프로그램 카운터]]\n* [[커널 스택]] / [[trapframe]] / [[컨텍스트 스위치]]\n* [[프로그램 로딩]]"
 },
 "스택": {
  "title": "스택 (Stack)",
  "category": [
   "용어"
  ],
  "body": "'''스택'''(Stack)은 [[주소 공간]]에서 지역 변수·함수 인자·리턴 주소를 담는 영역이다. 함수 호출이 중첩될 때마다 위로 쌓이고, 리턴할 때마다 걷힌다.\n\n{def}\n'''Process Creation 2단계''' (3강 p.32)<br>\n\"The program's '''run-time stack''' is allocated. Use the stack for '''local variables, function parameters, and return address'''. Initialize the stack with arguments — '''`argc` and `argv`''' array of `main()` function.\"<br>\n3강 p.10 — \"Memory … Includes '''stack''' used to support procedures.\"\n{/def}\n\n{analogy}\n🍽️ '''카페테리아의 접시 더미'''다. 가장 마지막에 올린 접시를 가장 먼저 꺼낸다(LIFO). 함수 `main` → `sum` → `printf` 순으로 호출하면 접시가 세 장 쌓이고, `printf`가 끝나면 그 접시부터 치운다. 접시 한 장이 '''스택 프레임''' 하나이고, 거기에는 그 함수의 지역 변수와 \"돌아갈 주소\"가 적혀 있다.\n{/analogy}\n\n[[img:L3-19.png|3강 p.19. User stack은 주소 공간의 위쪽에 있고 아래로 자란다. \"created at runtime\" — 실행 파일에 들어 있지 않다.|large]]\n\n== 무엇이 들어 있나 ==\n\n<pre class=\"ascii\">\n   높은 주소\n        ┌───────────────────────────┐\n        │  argc, argv (main 의 인자)  │  ← 프로세스 생성 2단계에서 세팅\n        ├───────────────────────────┤\n        │  main 의 스택 프레임         │\n        │    지역 변수 / 리턴 주소      │\n        ├───────────────────────────┤\n        │  sum 의 스택 프레임          │\n        │    x, y, t / 리턴 주소       │\n        ├───────────────────────────┤  ← %esp (스택 포인터)\n        │            ↓              │     여기서부터 아래로 자란다\n        │       (빈 공간)            │\n   낮은 주소\n<\/pre>\n\n{| class=\"table\"\n! 항목 || 예\n|-\n| 지역 변수 || `int t = x+y;`의 `t`\n|-\n| 함수 인자 || `sum(buf[0], buf[1])`의 두 값\n|-\n| '''리턴 주소''' || `sum`이 끝나면 돌아갈 [[프로그램 카운터|PC]] 값\n|-\n| 저장된 프레임 포인터 || `pushl %ebp`로 밀어 넣는 것\n|}\n\n{warn}\n'''스택은 실행 파일에 없다.''' `.text`/`.data`/`.bss`는 ELF에서 복사되지만, User stack과 [[힙]]은 '''런타임에 생성'''된다(3강 p.19: \"created at runtime\"). \"실행 파일에 없는데 프로세스에는 있는 영역 두 개\"를 묻는 문제의 답이 이 둘이다. → [[프로그램 로딩]]\n{/warn}\n\n{warn}\n'''유저 스택과 [[커널 스택]]은 별개다.''' 프로세스마다 유저 스택 하나, [[커널 스택]] 하나씩 있다. [[트랩]]이 일어나면 [[스택 포인터|SP]]가 커널 스택으로 갈아 끼워진다.\n{/warn}\n\n== 프로세스마다 하나, 스레드마다 하나 ==\n\n3강 p.26이 CPU 가상화를 설명하며 굳이 괄호를 붙인다: \"Each program seems to have exclusive use of the CPU '''( + stack )'''\". 스택이 control flow의 일부이기 때문이다.\n\n이 때문에 8강에서 [[스레드]]가 등장할 때, 스레드는 [[주소 공간]]은 공유하면서도 '''[[스레드 스택|스택만은 각자]]''' 갖게 된다 — 함수 호출 흐름이 스레드마다 다르기 때문이다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(나열)''' 3강 p.32에 따르면 run-time stack에 저장되는 것 세 가지는 무엇이며, 스택은 무엇으로 초기화되는가?\n{/quiz}\n{answer}\n'''local variables, function parameters, return address'''. 초기화는 `main()`의 '''`argc`와 `argv` 배열'''로 한다.\n{/answer}\n\n{quiz}\n'''(O/X)''' \"User stack은 실행 파일(ELF)의 한 섹션으로 저장되어 있다가 로드될 때 메모리로 복사된다.\"\n{/quiz}\n{answer}\n'''X.''' User stack과 [[힙]]은 '''런타임에 생성'''된다(created at runtime / created by malloc). 실행 파일에서 복사되는 것은 read-only segment(`.init`/`.text`/`.rodata`)와 read/write segment(`.data`/`.bss`)뿐이다.\n{/answer}\n\n== 관련 문서 ==\n* [[힙]] / [[주소 공간]] / [[스택 포인터]]\n* [[프로그램 로딩]] / [[프로세스]]\n* [[커널 스택]] / [[스레드 스택]] / [[스레드]]"
 },
 "인터럽트 핸들러": {
  "title": "인터럽트 핸들러 (Interrupt Handler)",
  "category": [
   "용어",
   "4강 LDE"
  ],
  "body": "'''인터럽트 핸들러'''는 [[인터럽트]]나 [[트랩]]이 발생했을 때 실행되는 '''커널 코드 조각'''이다. [[트랩 테이블]]의 각 칸이 가리키는 대상이며, 4강에서는 \"'''a pre-configured interrupt handler in the OS'''\"라는 표현으로 등장한다.\n\n{def}\n\"When the interrupt is raised: … '''a pre-configured interrupt handler in the OS runs''' … The OS regains control of the CPU.\" (4강 p.27)\n'''Handler k''' is called each time '''syscall k''' occurs — [[트랩 테이블]]의 k번 칸이 가리키는 코드. (p.19)\n{/def}\n\n{analogy}\n인터럽트 핸들러는 '''119 접수 매뉴얼'''이다. 신고(인터럽트)가 들어오면 접수원은 즉흥적으로 대응하는 게 아니라 '''미리 작성된 매뉴얼'''대로 움직인다. 중요한 건 이 매뉴얼을 '''소방서(OS)가 평시에 미리 써 둔 것'''이고, 신고자(유저 프로그램)가 그 자리에서 내용을 고칠 수 없다는 점이다 — 고칠 수 있다면 \"내 신고가 오면 금고를 열어라\"라고 써 넣을 것이다.\n{/analogy}\n\n== \"pre-configured\"가 핵심 ⭐ ==\n\n<pre class=\"ascii\">\n   OS @ boot (kernel mode)          Hardware\n   ─────────────────────────────────────────────────────\n   initialize trap table  ───────►  remember address of …\n                                       syscall handler\n                                       timer handler\n   start interrupt timer  ───────►  start timer\n\n   ⇒ 핸들러 주소를 등록하는 것은 \"부팅 때, OS가, 커널 모드에서\".\n     유저는 관여할 수 없다 (특권 명령).\n<\/pre>\n\n{warn}\n유저가 핸들러 주소를 등록할 수 있다면 그것은 곧 '''[[커널 모드]]에서 임의 코드를 실행할 권한'''이다. 그래서 [[트랩 테이블]] 설정은 [[특권 명령]]이고, \"핸들러는 미리(pre-) 설정되어 있다\"는 표현이 들어간 것.\n{/warn}\n\n== 핸들러가 하는 일 (일반 형태) ==\n\n# '''문맥 저장''' — 끊긴 프로그램의 [[레지스터]]를 [[커널 스택]]([[xv6]]에서는 [[trapframe]])에 저장\n# '''원인 판별''' — 왜 들어왔는가 ([[xv6]]: `scause`, [[which_dev]])\n# '''실제 처리''' — [[시스템 콜]] 수행, 장치 응답, 타이머 tick 처리\n# '''복귀''' — [[return-from-trap]] / [[sret]]으로 유저 모드로\n\n[[xv6]]에서는 이 네 단계가 `uservec`(1) → [[usertrap]](2·3) → [[usertrapret]] → `userret`(4)으로 나뉘어 있다.\n\n== 유저 레벨 핸들러 — 과제 1의 정체 ==\n\n{tip}\n[[과제1 xv6 alarm|과제 1]]의 [[alarm_handler]]는 '''유저 공간에서 도는 핸들러'''라는 점에서 위와 다르다. 과제 PDF의 표현: \"you'll be implementing a primitive form of '''user-level interrupt/fault handlers'''\". 커널 핸들러가 받은 인터럽트를 '''유저에게 다시 전달'''하는 구조이고, 유닉스의 `signal()`/`SIGALRM`이 같은 일을 한다.\n\n그래서 '''두 겹'''이 된다:\n<pre class=\"ascii\">\n   타이머 인터럽트\n        │\n        ▼  커널 핸들러 (usertrap)  ← \"pre-configured\", 유저가 못 바꿈\n        │      which_dev == 2 → 알람 조건 검사 → epc 바꿔치기\n        ▼  sret\n   유저 핸들러 (periodic)          ← sigalarm 으로 유저가 등록, user mode 에서 실행\n        │\n        ▼  sigreturn()\n   끊긴 유저 코드\n<\/pre>\n{/tip}\n\n{quiz}\n\"인터럽트 핸들러는 유저 프로그램이 등록한다\"는 서술은 옳은가?\n{/quiz}\n{answer}\n'''일반적으로는 틀렸다.''' 4강의 인터럽트 핸들러는 '''OS가 부팅 때 [[트랩 테이블]]에 등록'''하고, 유저는 [[특권 명령]] 제약 때문에 관여할 수 없다.\n다만 [[과제1 xv6 alarm|과제 1]]의 '''유저 레벨''' 핸들러는 [[sigalarm]]이라는 '''시스템 콜을 통해''' 유저가 등록한다 — 즉 \"유저가 커널에 부탁해서\" 등록하는 것이지 트랩 테이블을 직접 건드리는 것이 아니다. 이 구분을 정확히 쓰는 것이 서술형의 득점 포인트.\n{/answer}\n\n== 관련 문서 ==\n* [[인터럽트]] · [[트랩]] · [[트랩 테이블]] · [[타이머 인터럽트]] · [[특권 명령]] · [[커널 모드]]\n* [[usertrap]] · [[usertrapret]] · [[return-from-trap]] · [[sret]] · [[커널 스택]]\n* [[alarm_handler]] · [[과제1 xv6 alarm]] · [[제한적 직접 실행]] · [[비협력적 방식]]"
 },
 "커널 모드": {
  "title": "커널 모드 (Kernel Mode)",
  "category": [
   "용어"
  ],
  "body": "'''커널 모드'''(kernel mode, supervisor mode)는 CPU가 [[특권 명령]]을 실행하고 모든 메모리·장치에 접근할 수 있는 실행 모드다. [[커널]] 코드만 이 모드에서 돈다. 반대편이 user mode이며, 둘의 대비는 [[유저 모드와 커널 모드]] 문서에 자세히 있다.\n\n{def}\n2강·1강 슬라이드는 모드를 그림의 '''경계선'''으로 표현한다. 1강 p.30에서 점선 위는 \"'''User space'''\", 아래는 \"'''OS'''\"로 표시되고, `write()` system call이 그 선을 넘는다. 2강 p.5는 같은 것을 \"'''Make a wall''' and give them a kiosk\"로 비유한다.\n{/def}\n\n{analogy}\n🔑 '''마스터키를 든 상태'''다. 같은 사람(CPU)인데 손에 마스터키를 쥐고 있으면 어느 방이든 열 수 있고, 내려놓으면 자기 방만 열 수 있다. 중요한 건 '''키를 스스로 집어들 수 없다'''는 것 — 정해진 관문(`ecall`, [[인터럽트]], exception)을 통과할 때 '''하드웨어가 쥐여 주고''', [[sret]]로 나갈 때 '''도로 빼앗는다'''.\n{/analogy}\n\n== 이 모드에서만 가능한 것 ==\n\n* '''[[특권 명령]]''' 실행 (I/O 명령, 페이지 테이블 레지스터 변경, 인터럽트 활성/비활성 …)\n* 물리 메모리 전체 접근 — 다른 프로세스의 [[주소 공간]]과 모든 [[PCB]]\n* 장치 레지스터 직접 조작\n* [[커널 스택]] 사용\n\n== 언제 들어가고 나오나 ==\n\n<pre class=\"ascii\">\n   user mode  ──┐                                    ┌──  user mode\n                │ ① ecall (시스템 콜)                  │\n                │ ② 인터럽트 (타이머, 디스크)            │  sret\n                │ ③ exception (page fault, 특권 위반)   │\n                ▼                                    │\n              ──── kernel mode ──────────────────────┘\n<\/pre>\n\n{warn}\n'''유저 프로그램이 \"커널 모드로 전환한다\"는 표현은 부정확하다.''' 유저가 하는 일은 `ecall`을 실행하는 것뿐이고, 모드를 올리면서 [[트랩 테이블]]에 등록된 '''정해진 주소'''로 점프시키는 것은 하드웨어다. 그래서 유저는 커널의 임의 지점으로 뛰어들 수 없다. 이것이 [[제한적 직접 실행]]의 핵심 안전장치다.\n{/warn}\n\n{tip}\n[[RISC-V]]에서는 모드를 privilege level이라 부르고 U(user) / S(supervisor) / M(machine) 세 단계가 있다. xv6 커널이 도는 곳은 '''S 모드'''이며, `sepc`·`stvec`·`scause` 같은 CSR도 앞의 `s`가 supervisor를 뜻한다. → [[sepc]], [[sret]]\n{/tip}\n\n== 자주 나오는 함정 ==\n\n{exam}\n2026-09-23 퀴즈 '''1번(10점)''': \"The alarm handler registered by `sigalarm` executes in ( user mode / kernel mode ).\"<br>\n정답은 '''user mode'''. 커널은 [[trapframe]]의 [[epc]]를 [[alarm_handler]] 주소로 바꾼 뒤 [[sret]]로 '''내려가서''' 실행시키므로, 핸들러는 유저 코드다. \"커널이 등록받은 함수니까 커널 모드\"라고 착각하기 쉽다. → [[퀴즈1 복기]]\n{/exam}\n\n{warn}\n'''새 프로세스도 커널 모드에서 태어난다.''' 0831 녹음본: \"the process would start from the '''kernel state''' and then transfer the control to the user space. Inside the user space, the program will run from the `main` function.\" 프로세스 생성 5단계의 마지막 \"control transfer\"가 바로 이 하강이다. → [[프로세스]]\n{/warn}\n\n== 예상 문제 ==\n\n{quiz}\n'''(선택)''' 다음 중 CPU를 user mode에서 kernel mode로 전환시키는 사건이 '''아닌''' 것은?<br>\n① `ecall` ② [[타이머 인터럽트]] ③ page fault ④ 함수 `call` 명령\n{/quiz}\n{answer}\n'''④ 함수 call 명령.''' 같은 모드·같은 [[주소 공간]] 안의 점프일 뿐이다.\n{/answer}\n\n== 관련 문서 ==\n* [[유저 모드와 커널 모드]] — 상세 비교\n* [[커널]] / [[특권 명령]] / [[커널 스택]]\n* [[시스템 콜]] / [[트랩]] / [[트랩 테이블]] / [[제한적 직접 실행]]\n* [[sret]] / [[sepc]] / [[return-from-trap]]"
 },
