    var per = Math.ceil(segs.length / MAXG), out = [];
    for (var i = 0; i < segs.length; i += per) {
      var chunk = segs.slice(i, i + per), js = [];
      chunk.forEach(function (c) { if (js.indexOf(c.job) < 0) js.push(c.job); });
      out.push({ s: chunk[0].s, e: chunk[chunk.length - 1].e, jobs: js });
    }
    return out;
  }

  function fmt(x) { return (Math.round(x * 100) / 100).toString(); }

  SIMS["sched_gantt"] = {
    title: "스케줄링 정책 간트 차트 (FIFO / SJF / STCF / RR)",
    desc: "[[FIFO]] · [[SJF]] · [[STCF]] · [[Round Robin]] 을 tick 단위로 돌려 [[turnaround time]] 과 [[response time]] 이 어떻게 갈리는지 본다. preset 은 5강 슬라이드 예제와 2025F 중간고사 문제3 숫자 그대로.",
    options: [
      {
        key: "policy", label: "정책", values: [
          { value: "fifo", label: "FIFO" },
          { value: "sjf", label: "SJF (비선점)" },
          { value: "stcf", label: "STCF (선점 SJF)" },
          { value: "rr", label: "Round Robin" }
        ]
      },
      {
        key: "preset", label: "워크로드", values: [
          { value: "abc_equal", label: "A·B·C 10초씩 (p.10)" },
          { value: "a100_bc10", label: "A=100, B=C=10 동시 (convoy)" },
          { value: "late_arrival", label: "A=100@0, B=C=10@10" },
          { value: "rr_5s", label: "A·B·C 5초씩 (RR p.20)" },
          { value: "midterm2025", label: "2025F 중간 문제3 (4/5/6)" }
        ]
      },
      {
        key: "slice", label: "time slice (RR 전용)", values: [
          { value: "1", label: "1초" },
          { value: "2", label: "2초" },
          { value: "5", label: "5초" }
        ]
      }
    ],

    build: function (opts) {
      var policy = opts.policy || "fifo";
      var presetKey = opts.preset || "abc_equal";
      var slice = parseInt(opts.slice || "1", 10) || 1;
      var preset = PRESETS[presetKey];
      var sim = simulate(presetKey, policy, slice);
      var jobs = sim.jobs, n = jobs.length;
      var panel = PANELS[policy];

      var vars = [
        { name: "time", group: "스케줄러" },
        { name: "running", group: "스케줄러" },
        { name: "ready queue", group: "스케줄러" }
      ];
      jobs.forEach(function (j) {
        vars.push({ name: j.id + ".state", group: "job " + j.id });
        vars.push({ name: j.id + ".remaining", group: "job " + j.id });
        vars.push({ name: j.id + ".turnaround", group: "job " + j.id });
        vars.push({ name: j.id + ".response", group: "job " + j.id });
      });
      vars.push({ name: "avg turnaround", group: "평균" });
      vars.push({ name: "avg response", group: "평균" });

      function snapAt(time, runningIdx, finalize) {
        var idx = Math.min(time, sim.snaps.length - 1);
        var sn = sim.snaps[idx];
        var v = {
          time: time,
          running: runningIdx === null || runningIdx === undefined ? "—" : jobs[runningIdx].id,
          "ready queue": sn.ready.length ? "[" + sn.ready.map(function (i) { return jobs[i].id; }).join(", ") + "]" : "[ ]"
        };
        var sumT = 0, sumR = 0, allDone = true;
        jobs.forEach(function (j, i) {
          var rem = sn.remaining[i];
          var st;
          if (j.arrival > time) st = "미도착";
          else if (rem === 0) st = "done";
          else if (i === runningIdx) st = "running";
          else st = "ready";
          v[j.id + ".state"] = st;
          v[j.id + ".remaining"] = rem;
          var doneYet = (j.done >= 0 && j.done <= time);
          var firstYet = (j.first >= 0 && j.first < time);
          v[j.id + ".turnaround"] = doneYet ? (j.done - j.arrival) : "—";
          v[j.id + ".response"] = firstYet ? (j.first - j.arrival) : "—";
          if (!doneYet) allDone = false;
          sumT += (j.done - j.arrival); sumR += (j.first - j.arrival);
        });
        if (allDone || finalize) {
          v["avg turnaround"] = fmt(sumT / n) + " 초";
          v["avg response"] = fmt(sumR / n) + " 초";
        } else {
          v["avg turnaround"] = "—";
          v["avg response"] = "—";
        }
        return v;
      }

      var steps = [];
      var policyName = { fifo: "FIFO", sjf: "SJF", stcf: "STCF", rr: "Round Robin(q=" + slice + ")" }[policy];

      steps.push({
        desc: "'''" + policyName + "''' / " + preset.label + " — 시작 전 상태. " +
          "도착시각·실행시간은 " + preset.src + " 의 숫자다. " +
          "간트 차트의 흐린 막대는 '앞으로' 실행될 구간, 진한 막대는 이미 실행한 구간이다.",
        pc: makePc(panel.id, 1),
        vars: snapAt(0, null, false),
        svg: ganttSvg(sim, 0)
      });

      var groups = groupsOf(sim);
      groups.forEach(function (g) {
        var last = g.jobs[g.jobs.length - 1];
        var names = g.jobs.map(function (i) { return jobs[i].id; });
        var d;
        if (g.jobs.length === 1) {
          var j = jobs[last];
          d = "t = " + g.s + " → " + g.e + " : '''" + j.id + "''' 실행 (" + (g.e - g.s) + "초). ";
        } else {
          d = "t = " + g.s + " → " + g.e + " : " + names.join(" → ") + " 가 번갈아 실행 (" + (g.e - g.s) + "초 압축 표시). ";
        }
        // 도착 이벤트
        var arrivedHere = jobs.filter(function (j) { return j.arrival > g.s && j.arrival <= g.e; });
        if (arrivedHere.length) {
          d += "이 구간에서 " + arrivedHere.map(function (j) { return "'''" + j.id + "'''(t=" + j.arrival + ", " + j.run + "초)"; }).join(", ") + " 도착. ";
          if (policy === "stcf") d += "STCF 는 도착 즉시 남은 시간을 다시 비교해 '''선점'''한다. ";
          if (policy === "sjf") d += "SJF 는 비선점이라 지금 도는 job 이 끝날 때까지 기다린다 — 이게 103.33초의 원인. ";
        }
        var doneHere = jobs.filter(function (j) { return j.done > g.s && j.done <= g.e; });
        if (doneHere.length) {
          d += doneHere.map(function (j) {
            return "'''" + j.id + " 완료''' (T_turnaround = " + j.done + " − " + j.arrival + " = " + (j.done - j.arrival) + ")";
          }).join(", ") + ". ";
        }
        var line = (policy === "rr") ? (doneHere.length ? 4 : 5) : (doneHere.length ? 5 : 4);
        steps.push({
          desc: d,
          pc: makePc(panel.id, line),
          vars: snapAt(g.e, last, false),
          svg: ganttSvg(sim, g.e)
        });
      });

      // 마지막 요약 스텝
      var tsum = jobs.map(function (j) { return (j.done - j.arrival); });
      var rsum = jobs.map(function (j) { return (j.first - j.arrival); });
      var summary = "'''끝''' — " + policyName + ". " +
        "turnaround = " + jobs.map(function (j, i) { return j.id + ":" + tsum[i]; }).join(", ") +
        " → '''평균 " + fmt(sim.avgT) + "초'''. " +
        "response = " + jobs.map(function (j, i) { return j.id + ":" + rsum[i]; }).join(", ") +
        " → '''평균 " + fmt(sim.avgR) + "초'''. " +
        "([[turnaround time]] = T_completion − T_arrival, [[response time]] = T_firstrun − T_arrival)";
      var extra = HINTS[presetKey] && HINTS[presetKey][policy];
      steps.push({
        desc: summary + (extra ? " " + extra : ""),
        pc: makePc(panel.id, policy === "rr" ? 5 : 5),
        vars: snapAt(sim.total, null, true),
        note: extra || null,
        svg: ganttSvg(sim, sim.total)
      });

      return { panels: [panel], vars: vars, steps: steps };
    }
  };

  function makePc(id, line) { var o = {}; o[id] = line; return o; }

  var HINTS = {
    abc_equal: {
      fifo: "슬라이드 p.10 의 (10+20+30)/3 = '''20초''' 와 정확히 같다.",
      sjf: "실행시간이 모두 같으면 SJF = FIFO. 여전히 20초.",
      stcf: "남은 시간이 같으면 선점할 이유가 없어 FIFO 와 동일하게 20초.",
      rr: "RR 은 response 는 좋지만 turnaround 가 크게 나빠진다 — [[fairness]] 와 성능의 trade-off."
    },
    a100_bc10: {
      fifo: "슬라이드 p.11 의 (100+110+120)/3 = '''110초'''. 무거운 A 뒤에 짧은 B·C 가 줄 서는 게 [[convoy effect]].",
      sjf: "슬라이드 p.13 의 (10+20+120)/3 = '''50초'''. 짧은 것부터 돌리는 것만으로 110 → 50 으로 줄었다.",
      stcf: "모두 t=0 에 도착했으니 선점할 일이 없어 SJF 와 같은 '''50초'''.",
      rr: "turnaround 가 최악에 가까워진다 — RR 은 [[response time]] 전용 정책."
    },
    late_arrival: {
      fifo: "A 가 먼저 왔으니 100초를 다 돌고 나서야 B·C 차례. 평균 103.33초.",
      sjf: "슬라이드 p.14 — 비선점이라 A 를 끊지 못하고 (100 + 100 + 110)/3 = '''103.33초'''.",
      stcf: "슬라이드 p.16 — B·C 도착 시점에 '''남은 시간'''(90 vs 10)을 비교해 선점. (120 + 10 + 20)/3 = '''50초'''.",
      rr: "A 가 계속 끊기므로 A 의 turnaround 가 극단적으로 나빠진다."
    },
    rr_5s: {
      sjf: "슬라이드 p.20 위쪽 — SJF 의 평균 response 는 (0+5+10)/3 = '''5초'''.",
      fifo: "FIFO = SJF (모두 5초씩) — 평균 response 5초.",
      stcf: "역시 평균 response 5초.",
      rr: "슬라이드 p.20 아래 — slice 1 이면 A B C A B C … 로 평균 response (0+1+2)/3 = '''1초'''. 대신 turnaround 는 14초로 악화."
    },
    midterm2025: {
      stcf: "2025F 중간 문제3(a) — total turnaround 를 최소화하는 스케줄은 짧은 것부터(STCF/SJF). T1+T2+T3 = 4+9+15 = '''28'''.",
      sjf: "2025F 중간 문제3(a) 정답 '''28'''. (T1≥4, T2≥9, T3=15 라는 제약의 하한을 동시에 만족)",
      fifo: "A→B→C 순서가 마침 짧은 순서라 FIFO 도 28. 하지만 도착 순서가 C,B,A 였다면 최악이 된다.",
      rr: "문제3(b) 관련 — q=1 RR 은 ABCABCABCABCBCC 가 되어 T1=10, T2=13, T3=15, F = 10/13 + 13/15. 해설은 여기서 한 발 더 나가 ABCABCABCBCCABC (T=13,14,15, 합 '''42''') 가 F 최대임을 보인다 — 'RR 이면 무조건 공정' 이 아니라는 게 함정."
    }
  };
})();

// ===== sims/stride_lottery.js =====
// stride_lottery — Stride(pass/stride 표) vs Lottery(시드 고정 추첨)
// 6강 p.24~p.27 의 티켓 A=100 / B=50 / C=250 예제와 pass 표를 그대로 재현한다.
window.SIMS = window.SIMS || {};

(function () {
  var BIG = 10000;                       // 슬라이드: stride = 10,000 / tickets
  var SEED = 20250923;                   // 고정 시드 (퀴즈1 날짜). 같은 옵션이면 항상 같은 결과.

  var P_STRIDE = {
    id: "STRIDE", title: "Stride 스케줄링 의사코드 (6강 p.23)", lang: "c",
    lines: [
      "stride_i  = 10000 / tickets_i;          // 티켓이 많을수록 stride 가 작다",
      "current   = remove_min(queue);          // pass 가 최소인 프로세스",
      "schedule(current);                      // 한 quantum 실행",
      "current->pass += current->stride;       // pass 를 stride 만큼 전진",
      "insert(queue, current);                 // 다시 큐에 넣는다"

  };
  var P_LOTTERY = {
    id: "LOTTERY", title: "Lottery 스케줄링 구현 (6강 p.17)", lang: "c",
    lines: [
      "int counter = 0;",
      "int winner  = getrandom(0, totaltickets);   // 0 ~ 399",
      "node_t *current = head;                     // A -> B -> C",
      "while (current) {",
      "    counter = counter + current->tickets;",
      "    if (counter > winner)",
      "        break;                              // 당첨자 발견",
      "    current = current->next;",
      "}",
      "// 'current' 가 당첨자: schedule(current);"
    ]
  };

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function fmt(x) { return (Math.round(x * 10) / 10).toString(); }

  // ---------------- SVG ----------------
  function passSvg(procs, minIdx, ranIdx) {
    var W = 760, rowH = 26, gap = 10, top = 24;
    var H = top + procs.length * (rowH + gap) + 16;
    var maxPass = 1;
    procs.forEach(function (p) { maxPass = Math.max(maxPass, p.pass); });
    var L = 118, R = 700, sc = (R - L) / Math.max(maxPass, 1);
    var o = ['<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:760px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">'];
    o.push('<text x="4" y="14" font-size="11" fill="#8b95a5">pass 값 (작을수록 먼저 뽑힘 — 빨간 테두리가 이번 최소)</text>');
    procs.forEach(function (p, i) {
      var y = top + i * (rowH + gap);
      o.push('<text x="4" y="' + (y + 18) + '" font-size="11" fill="' + p.color + '" font-weight="bold">' + esc(p.id) + '</text>');
      o.push('<text x="20" y="' + (y + 18) + '" font-size="10" fill="#8b95a5">tix ' + p.tickets + ' / stride ' + p.stride + '</text>');
      o.push('<rect x="' + L + '" y="' + y + '" width="' + (R - L) + '" height="' + rowH +
        '" fill="#8b95a5" fill-opacity="0.07" stroke="#8b95a5" stroke-opacity="0.2"/>');
      var w = Math.max(2, p.pass * sc);
      o.push('<rect x="' + L + '" y="' + y + '" width="' + w.toFixed(1) + '" height="' + rowH +
        '" fill="' + p.color + '" fill-opacity="' + (i === ranIdx ? "0.9" : "0.45") + '"/>');
      if (i === minIdx) {
        o.push('<rect x="' + (L - 2) + '" y="' + (y - 2) + '" width="' + (R - L + 4) + '" height="' + (rowH + 4) +
          '" fill="none" stroke="#ef4444" stroke-width="2" rx="3"/>');
      }
      o.push('<text x="' + (L + w + 6).toFixed(1) + '" y="' + (y + 18) + '" font-size="11" fill="' + p.color + '">' + p.pass + '</text>');
      o.push('<text x="' + (R + 6) + '" y="' + (y + 18) + '" font-size="10" fill="#8b95a5">' + p.runs + '회</text>');
    });
    o.push("</svg>");
    return o.join("");
  }

  function lotterySvg(procs, total, winner, winIdx, draws) {

    var H = 150;
    var L = 20, R = 740, sc = (R - L) / total;

    var acc = 0;
    procs.forEach(function (p, i) {

      o.push('<text x="' + (x0 + w / 2).toFixed(1) + '" y="' + (barY + 18) + '" font-size="12" font-weight="bold" fill="' +
        (i === winIdx ? "#fff" : p.color) + '" text-anchor="middle">' + esc(p.id) + '</text>');
      o.push('<text x="' + (x0 + w / 2).toFixed(1) + '" y="' + (barY + 33) + '" font-size="9" fill="' +
        (i === winIdx ? "#fff" : "#8b95a5") + '" text-anchor="middle">' + acc + '~' + (acc + p.tickets - 1) + '</text>');
      acc += p.tickets;
    });
    if (winner >= 0) {
      var wx = L + winner * sc;
      o.push('<polygon points="' + wx.toFixed(1) + ',' + (barY - 3) + ' ' + (wx - 6).toFixed(1) + ',' + (barY - 15) +
        ' ' + (wx + 6).toFixed(1) + ',' + (barY - 15) + '" fill="#ef4444"/>');
      o.push('<text x="' + wx.toFixed(1) + '" y="' + (barY - 19) + '" font-size="11" fill="#ef4444" text-anchor="middle">' + winner + '</text>');
    }

    o.push('<text x="' + L + '" y="' + (barY + barH + 22) + '" font-size="10" fill="#8b95a5">추첨 기록:</text>');

      o.push('<text x="' + (x + 20) + '" y="' + (barY + barH + 23) + '" font-size="10" fill="' + d.color + '" text-anchor="middle">' + d.n + '→' + d.id + '</text>');
    });
    o.push("</svg>");
    return o.join("");
  }

  SIMS["stride_lottery"] = {
    title: "Stride vs Lottery 스케줄링",
    desc: "[[Stride 스케줄링]] 의 [[pass]]/[[stride]] 표를 슬라이드 그대로 단계별로 돌려보고, [[Lottery 스케줄링]] 은 시드를 고정한 난수(seed = " + SEED + ")로 추첨해 '확률적으로만 공정하다'는 걸 확인한다. [[tickets]] A=100 · B=50 · C=250.",
    options: [
      {
        key: "policy", label: "정책", values: [
          { value: "stride", label: "Stride (결정적)" },
          { value: "lottery", label: "Lottery (확률적)" }
        ]
      },
      {
        key: "join", label: "새 프로세스 D 합류 (stride 전용)", values: [
          { value: "no", label: "없음" },
          { value: "zero", label: "pass = 0 으로 합류 (독점 문제)" },
          { value: "min", label: "pass = min(pass) 로 합류 (해결)" }
        ]
      }
    ],

    build: function (opts) {
      var policy = opts.policy || "stride";
      return policy === "lottery" ? buildLottery() : buildStride(opts.join || "no");
    }
  };

  // ---------------- Stride ----------------
  function buildStride(join) {
    var procs = BASE.map(function (p) {
      return { id: p.id, tickets: p.tickets, color: p.color, stride: BIG / p.tickets, pass: 0, runs: 0 };
    });
    var vars = [
      { name: "time slice #", group: "스케줄러" },
      { name: "min pass", group: "스케줄러" },
      { name: "who runs", group: "스케줄러" }
    ];
    function addVars(p) {
      vars.push({ name: p.id + ".tickets", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".stride", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".pass", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".runs", group: "프로세스 " + p.id });
    }
    procs.forEach(addVars);
    if (join !== "no") addVars(NEWP);
    vars.push({ name: "실행 비율", group: "검증" });
    vars.push({ name: "티켓 비율", group: "검증" });

    var joined = (join === "no");
    function snapshot(slice, minIdx, ranIdx) {
      var v = {
        "time slice #": slice,
        "min pass": minIdx < 0 ? "—" : procs[minIdx].pass,
        "who runs": ranIdx < 0 ? "—" : procs[ranIdx].id
      };
      procs.forEach(function (p) {
        v[p.id + ".tickets"] = p.tickets;
        v[p.id + ".stride"] = p.stride;
        v[p.id + ".pass"] = p.pass;
        v[p.id + ".runs"] = p.runs;
      });
      if (join !== "no" && !joined) {
        v["D.tickets"] = NEWP.tickets; v["D.stride"] = BIG / NEWP.tickets;
        v["D.pass"] = "— (아직 미합류)"; v["D.runs"] = 0;
      }
      var g = gcdAll(procs.map(function (p) { return p.runs; }));
      v["실행 비율"] = procs.map(function (p) { return p.id + ":" + (g ? p.runs / g : p.runs); }).join(" : ");
      var gt = gcdAll(procs.map(function (p) { return p.tickets; }));
      v["티켓 비율"] = procs.map(function (p) { return p.id + ":" + p.tickets / gt; }).join(" : ");
      return v;
    }

    var steps = [];
    steps.push({
      desc: "[[tickets]] A=100, B=50, C=250. [[stride]] = 10,000 / tickets 이므로 '''A=100, B=200, C=40'''. " +
        "'''티켓이 많을수록 stride 가 작다''' → [[pass]] 가 천천히 늘어 자주 뽑힌다. 모든 pass 는 0 에서 시작한다 " +
        "(pass 가 같으면 결정적으로 고를 수 없어서, 여기서는 A→B→C 순으로 tie-break 한다).",
      pc: { STRIDE: 1 },
      vars: snapshot(0, -1, -1),
      svg: passSvg(procs, -1, -1)
    });

    var N = (join === "no") ? 16 : 24, joinAt = 16;
    for (var s = 1; s <= N; s++) {
      if (!joined && s === joinAt + 1) {
        var minPass = Math.min.apply(null, procs.map(function (p) { return p.pass; }));
        var initPass = (join === "zero") ? 0 : minPass;
        procs.push({ id: NEWP.id, tickets: NEWP.tickets, color: NEWP.color, stride: BIG / NEWP.tickets, pass: initPass, runs: 0 });
        joined = true;
        steps.push({
          desc: "⚠ '''새 프로세스 D 합류''' (tickets 100 → stride 100). pass 를 " +
            (join === "zero"
              ? "'''0''' 으로 초기화했다. 기존 A·B·C 의 pass 는 이미 " + minPass + " 이므로 D 의 pass 가 " + minPass +
              " 이 될 때까지 '''D 만 연속으로 실행'''된다 — 슬라이드 p.27 이 지적한 stride 의 전역 상태(global state) 문제."
              : "'''현재 최소 pass(" + minPass + ")''' 로 맞췄다. 이러면 D 가 독점하지 않고 바로 정상적인 비례 배분에 합류한다 — 이게 실제 구현의 해법."),
          pc: { STRIDE: 5 },
          vars: snapshot(s - 1, -1, -1),
          note: join === "zero" ? "pass=0 초기화 → CPU 독점. 이래서 lottery 는 '전역 상태가 없다'는 장점을 갖는다." : null,
          svg: passSvg(procs, -1, -1)
        });
      }
      var mi = 0;
      for (var i = 1; i < procs.length; i++) if (procs[i].pass < procs[mi].pass) mi = i;
      var before = procs.map(function (p) { return p.pass; });
      var p = procs[mi];
      var d = "'''slice " + s + "''' — pass = (" +
        procs.map(function (q, k) { return q.id + ":" + before[k]; }).join(", ") +
        ") 중 최소는 '''" + p.id + "(" + before[mi] + ")''' → '''" + p.id + " 실행'''. " +
        "실행 후 pass(" + p.id + ") += stride(" + p.stride + ") → " + (before[mi] + p.stride) + ".";
      p.pass += p.stride; p.runs++;
      if (s === 8 && join === "no") d += " 여기까지 8 슬라이스: A 2회, B 1회, C 5회 = '''2 : 1 : 5''' 로 티켓 비(100:50:250)와 정확히 일치한다.";
      steps.push({
        desc: d,
        pc: { STRIDE: 4 },
        vars: snapshot(s, mi, mi),
        svg: passSvg(procs, mi, mi)
      });
    }

    var tail = (join === "zero")
      ? "D 가 pass 400 에 도달할 때까지 4 슬라이스를 연속으로 먹었다. [[Lottery 스케줄링]] 은 pass 같은 전역 상태가 없어 이런 보정 문제 자체가 없다 (6강 p.27, 퀴즈1 출제 포인트)."
      : (join === "min")
        ? "D 를 min pass 로 넣으니 독점 없이 곧바로 티켓 비율대로 나눠 갖는다."
        : "16 슬라이스 후 A:B:C = 4:2:10 = '''2:1:5'''. Stride 는 '''사이클이 끝날 때마다 비율이 정확히''' 맞는다 — lottery 와의 결정적 차이.";
    steps.push({
      desc: "'''정리''' — " + tail,
      pc: { STRIDE: 2 },
      vars: snapshot(N, -1, -1),
      svg: passSvg(procs, -1, -1)
    });

    return { panels: [P_STRIDE], vars: vars, steps: steps };
  }

  function gcdAll(arr) {
    function g(a, b) { return b ? g(b, a % b) : a; }
    var r = 0; arr.forEach(function (x) { r = g(r, x); });
    return r || 1;
  }

  // ---------------- Lottery ----------------
  function buildLottery() {
    var procs = BASE.map(function (p) {
      return { id: p.id, tickets: p.tickets, color: p.color, runs: 0 };
    });
    var total = procs.reduce(function (a, p) { return a + p.tickets; }, 0);   // 400
    var rnd = mulberry32(SEED);
    var N = 15;

    var ranges = [], acc = 0;
    procs.forEach(function (p) { ranges.push({ lo: acc, hi: acc + p.tickets - 1 }); acc += p.tickets; });

    var vars = [
      { name: "draw #", group: "추첨" },
      { name: "winning ticket", group: "추첨" },
      { name: "winner", group: "추첨" },
      { name: "counter (코드 8행)", group: "추첨" }
    ];
    procs.forEach(function (p, i) {
      vars.push({ name: p.id + ".tickets", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".ticket 구간", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".runs", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".실제 비율", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".기대 비율", group: "프로세스 " + p.id });
    });

    function snapshot(k, winner, winIdx, counter) {
      var v = {
        "draw #": k,
        "winning ticket": winner < 0 ? "—" : winner + " / " + total,
        "winner": winIdx < 0 ? "—" : procs[winIdx].id,
        "counter (코드 8행)": counter < 0 ? "—" : counter
      };
      var done = procs.reduce(function (a, p) { return a + p.runs; }, 0) || 1;
      procs.forEach(function (p, i) {
        v[p.id + ".tickets"] = p.tickets;
        v[p.id + ".ticket 구간"] = ranges[i].lo + " ~ " + ranges[i].hi;
        v[p.id + ".runs"] = p.runs;
        v[p.id + ".실제 비율"] = fmt(100 * p.runs / done) + " %";
        v[p.id + ".기대 비율"] = fmt(100 * p.tickets / total) + " %";
      });
      return v;
    }

    var steps = [], draws = [];
    steps.push({
      desc: "[[Lottery 스케줄링]] — 티켓 400장을 A(0~99), B(100~149), C(150~399) 로 나눠 갖는다. " +
        "매 슬라이스마다 0~399 중 하나를 뽑아, 슬라이드 p.17 의 리스트 순회 코드로 '''counter 가 winner 보다 커지는 순간의 노드'''가 당첨자다. " +
        "여기서는 시드 " + SEED + " 의 고정 PRNG(mulberry32)를 쓰므로 매번 같은 결과가 나온다.",
      pc: { LOTTERY: 2 },
      vars: snapshot(0, -1, -1, -1),
      svg: lotterySvg(procs, total, -1, -1, draws)
    });

    for (var k = 1; k <= N; k++) {
      var w = Math.floor(rnd() * total);
      var counter = 0, wi = 0;
      for (var i = 0; i < procs.length; i++) {
        counter += procs[i].tickets;
        if (counter > w) { wi = i; break; }
      }
      procs[wi].runs++;
      draws.push({ n: w, id: procs[wi].id, color: procs[wi].color });
      steps.push({
        desc: "'''draw " + k + "''' — winner = " + w + ". 리스트를 A→B→C 로 돌며 counter 를 더하면 " +
          "counter = " + counter + " 에서 처음으로 " + w + " 를 넘는다 → '''" + procs[wi].id + " 당첨''' " +
          "(" + procs[wi].id + " 의 구간 " + ranges[wi].lo + "~" + ranges[wi].hi + " 안에 들어왔다).",
        pc: { LOTTERY: 6 },
        vars: snapshot(k, w, wi, counter),
        svg: lotterySvg(procs, total, w, wi, draws)
      });
    }

    var actual = procs.map(function (p) { return p.id + " " + p.runs + "회(" + fmt(100 * p.runs / N) + "%)"; }).join(", ");
    var expect = procs.map(function (p) { return p.id + " " + fmt(100 * p.tickets / total) + "%"; }).join(", ");
    steps.push({
      desc: "'''정리''' — " + N + "회 추첨 결과: " + actual + ". 기대치는 " + expect + ". " +
        "짧게 돌리면 비율이 어긋나지만, '''오래 돌릴수록''' 기대치에 수렴한다 (6강 p.19~p.20 의 fairness metric F). " +
        "[[Stride 스케줄링]] 은 같은 상황에서 사이클마다 정확히 2:1:5 를 맞춘다 — lottery 는 '''확률적으로만 공정'''하다. " +
        "대신 lottery 는 [[pass]] 같은 '''전역 상태가 없어''' 새 프로세스가 끼어들 때 보정할 값이 없다는 장점이 있다.",
      pc: { LOTTERY: 10 },
      vars: snapshot(N, -1, -1, -1),
      svg: lotterySvg(procs, total, -1, -1, draws)
    });

    return { panels: [P_LOTTERY], vars: vars, steps: steps };
  }
})();

// ===== sims/syscall_trap.js =====
// syscall_trap — user → ecall → uservec → usertrap → syscall → usertrapret → sret 왕복
// 출처: 4-Limited_Direct_Execution.pdf p.14~23, 3-From_Program_to_Process.pdf (시스템 콜 추가 절차), xv6-riscv
window.SIMS = window.SIMS || {};

(function () {
  var USER = [
    "// user/xxx.c — 평범한 C 한 줄",
    "int n = read(fd, buf, 10);",
    "",
    "// user/usys.S  (usys.pl 이 자동 생성)",
    "read:",
    "    li   a7, SYS_read    # 시스템 콜 번호를 a7 에",
    "    ecall                # user → kernel 트랩",
    "    ret                  # a0 = 커널이 돌려준 값"
  ];

  var KERNEL = [
    "# kernel/trampoline.S",
    "uservec:",
    "    csrrw a0, sscratch, a0      # TRAPFRAME 주소를 a0 로",
    "    sd ra,40(a0) ... sd t6,280(a0)   # 유저 레지스터 전부 저장",
    "    ld sp, 8(a0)                # 커널 스택으로 교체",
    "    jr t0                       # → usertrap()",
    "",
    "void usertrap(void) {",
    "  // ...",
    "  p->trapframe->epc = r_sepc();   // 유저 PC 보관",
    "  if (r_scause() == 8) {          // 8 = ecall from U-mode",
    "    p->trapframe->epc += 4;       // ecall '다음' 명령어로",
    "    intr_on();",
    "    syscall();",
    "  }",
    "  usertrapret();",
    "}",
    "",
    "void syscall(void) {",
    "  int num = p->trapframe->a7;",
    "  p->trapframe->a0 = syscalls[num]();   // 반환값을 a0 에",
    "}",
    "",
    "void usertrapret(void) {",
    "  w_sepc(p->trapframe->epc);      // 돌아갈 주소 지정",
    "  // userret: trapframe 에서 유저 레지스터 복원",
    "  //   sret  : kernel → user, pc = sepc",
    "}"
  ];

  function modeSvg(mode, label) {
    var uOn = (mode === "user");
    var s = '<svg viewBox="0 0 360 132" width="100%" style="max-width:360px">';
    s += '<rect x="8" y="10" width="160" height="52" rx="6" fill="' + (uOn ? "#2f6da8" : "#39404a") +

    s += '<text x="88" y="50" font-size="10" text-anchor="middle" fill="#cfd8e3">특권 명령 불가</text>';

    if (uOn) {
      s += '<path d="M272 70 L272 92 L88 92 L88 70" fill="none" stroke="#7fc0ff" stroke-width="2"/>';
      s += '<polygon points="88,64 83,74 93,74" fill="#7fc0ff"/>';
    } else {
      s += '<path d="M88 70 L88 92 L272 92 L272 70" fill="none" stroke="#ffc08a" stroke-width="2"/>';
      s += '<polygon points="272,64 267,74 277,74" fill="#ffc08a"/>';
    }
    s += '<text x="180" y="110" font-size="11" text-anchor="middle" fill="#ddd">' + label + '</text>';
    s += '<text x="180" y="126" font-size="9.5" text-anchor="middle" fill="#9aa">' +
         '모드 전환은 ecall / sret 두 명령어로만 일어난다</text>';
    s += '</svg>';
    return s;
  }

  window.SIMS["syscall_trap"] = {
    title: "시스템 콜 한 바퀴 (ecall → usertrap → syscall → sret)",
    desc: "read() 한 줄이 user mode 를 떠나 커널을 돌고 정확히 제자리로 돌아오기까지, 누가 무엇을 저장하는지 따라갑니다.",
    options: [],
    build: function () {

        "scause": "—",

        "a0": "fd (3)",
        "trapframe->epc": "—",
        "trapframe->a0": "—",
        "trapframe->a7": "—",
        "sp": "user stack"

      var steps = [];
      function snap() { var o = {}; for (var k in st) o[k] = st[k]; return o; }
      function push(desc, pc, label, note) {
        steps.push({
          desc: desc,
          pc: { user: (pc.user == null ? null : pc.user), kernel: (pc.kernel == null ? null : pc.kernel) },
          vars: snap(),
          status: { user: st.mode === "user" ? "running" : "멈춤", kernel: st.mode === "user" ? "—" : "running" },

          svg: modeSvg(st.mode, label)

      }

      push("C 코드 `read(fd, buf, 10)` 은 사실 라이브러리 스텁을 부르는 '''보통 함수 호출'''입니다. " +
           "인자 fd, buf, 10 은 관례대로 [[a0]], a1, a2 에 실려 있습니다.",
           { user: 2 }, "user mode 에서 실행 중");

      st["a7"] = "SYS_read (5)";
      push("[[usys.pl]] 이 만들어 준 스텁이 `li a7, SYS_read` 로 '''시스템 콜 번호'''를 a7 에 넣습니다. " +
           "새 시스템 콜을 추가할 때 [[시스템 콜 추가 절차|usys.pl / syscall.h / syscall.c]] 를 같이 고쳐야 하는 이유가 이것입니다.",

           "③ '''ecall 자신의 주소'''를 [[sepc]] 에 박아 넣습니다.",
           { user: 7 }, "곧 트랩 진입");

      st["mode"] = "kernel";
      st["sepc"] = "read+0x08 (ecall)";
      st["scause"] = "8 (ecall from U-mode)";
      st["pc"] = "uservec";
      push("하드웨어가 한 일: mode=kernel, [[sepc]]=ecall 주소, scause=8, pc=uservec. " +
           "'''여기까지는 소프트웨어가 손댈 틈이 없습니다''' — 유저가 커널 진입점을 고를 수 없게 하드웨어가 강제합니다.",
           { kernel: 2 }, "하드웨어가 모드 전환", "유저가 임의의 커널 주소로 점프할 수 있다면 [[제한적 직접 실행]] 은 무너집니다. 점프 목적지는 부팅 때 커널이 stvec 에 등록한 주소뿐입니다.");

      st["trapframe->a0"] = "fd (3)";
      st["trapframe->a7"] = "SYS_read (5)";
      push("uservec 이 유저 레지스터 32 개를 전부 [[trapframe]] 에 `sd` 로 밀어 넣습니다. " +
           "여기서 a0 와 a7 도 함께 저장되므로 커널은 나중에 '''인자와 콜 번호를 trapframe 에서 읽습니다'''.",
           { kernel: 4 }, "레지스터 저장 중");

      st["sp"] = "kernel stack (p->kstack)";
      push("`ld sp, 8(a0)` — [[스택 포인터]] 를 이 프로세스 전용 [[커널 스택]] 으로 갈아탑니다. " +

      push("`if (r_scause() == 8)` — 8 이면 U-mode 에서 온 [[시스템 콜]]. " +
           "타이머였다면 [[which_dev]] 가 2 로 돌아와 [[타이머 인터럽트]] 분기로 갔을 것입니다.",
           { kernel: 11 }, "트랩 원인 판별");

// test_and_set — 9강 p.19~21 TestAndSet(atomic exchange) 기반 spin lock
(function (global) {
  "use strict";
  global.SIMS = global.SIMS || {};

  var TAS_CODE = [
    "/* CPU 가 하드웨어로 제공, 통째로 atomic */",
    "int TestAndSet(int *ptr, int new) {",
    "    int old = *ptr;   // fetch old value",
    "    *ptr = new;       // store 'new'",
    "    return old;       // return old value",
    "}"
  ];

  var TH_CODE = [
    "void lock(lock_t *lock) {",
    "    while (TestAndSet(&lock->flag, 1) == 1)",
    "        ;             // spin-wait",
    "}",
    "",
    "/* ---- critical section ---- */",
    "    counter = counter + 1;",
    "",
    "void unlock(lock_t *lock) {",
    "    lock->flag = 0;",
    "}"

  function svgFor(step) {

    for (var k in v) { if (/^T\d\.ret$/.test(k)) names.push(k.split(".")[0]); }
    names.sort();

    var w = 120 + names.length * 110;
    var s = '<svg viewBox="0 0 ' + w + ' 170" width="' + w + '" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">';
    // 락 박스
    s += '<rect x="20" y="20" width="' + (w - 40) + '" height="46" rx="6" fill="' +
      (v.flag ? "#ffe4ea" : "#e9f8ea") + '" stroke="' + (v.flag ? "#d6465f" : "#62b36a") + '" stroke-width="2"/>';
    s += '<text x="34" y="40" font-weight="700">lock-&gt;flag = ' + v.flag + "</text>";
    s += '<text x="34" y="58" fill="#555">' +
      (holder && holder !== "-" ? holder + " 가 critical section 안에 있음" : "락 비어 있음") + "</text>";

    names.forEach(function (n, i) {
      var x = 30 + i * 110;
      var stt = v[n + ".state"] || "";
      var color = stt.indexOf("critical") >= 0 ? "#62b36a" : (stt.indexOf("spin") >= 0 ? "#d6465f" : "#999");
      s += '<circle cx="' + (x + 30) + '" cy="105" r="22" fill="#fff" stroke="' + color + '" stroke-width="2.5"/>';
      s += '<text x="' + (x + 30) + '" y="110" text-anchor="middle" font-weight="700">' + n + "</text>";
      s += '<text x="' + (x + 30) + '" y="148" text-anchor="middle" fill="' + color + '" font-size="11">' +

      if (stt.indexOf("spin") >= 0) {
        s += '<text x="' + (x + 30) + '" y="78" text-anchor="middle" fill="#d6465f" font-size="14">↻</text>';
      }
    });
    s += "</svg>";
    return s;
  }

  global.SIMS["test_and_set"] = {
    title: "test-and-set spin lock",
    desc: "TestAndSet 이 '이전 값 반환 + 새 값 저장' 을 atomic 하게 하기 때문에, 단 하나의 스레드만 0 을 돌려받아 락을 얻는다.",
    options: [
      {
        key: "threads",
        label: "스레드 수",
        values: [{ value: "2", label: "2개" }, { value: "3", label: "3개" }]
      }
    ],
    build: function (opts) {
      var n = parseInt(opts.threads, 10) || 2;

      var steps = [];

        "하드웨어가 `old = *ptr` 로 현재 값 0 을 '''먼저 읽고''', 같은 명령 안에서 `*ptr = 1` 로 '''바꾼다'''. " +

        st.flag = 1; st[nxt + ".ret"] = 0; st[nxt + ".state"] = "critical section"; st.holder = nxt;
        st.tasBusy = false;

        "그러나 '''누가 먼저 들어갈지는 보장이 없다([[fairness]]: No)''' — 운 나쁜 스레드는 영원히 spin 할 수도 있다. " +

    "}"

    "typedef struct __lock_t {",

    "void lock(lock_t *lock) {",

    "    while (lock->turn != myturn)",
    "        ;            // spin",
    "}",
    "",
    "/* ---- critical section ---- */",
    "",
    "void unlock(lock_t *lock) {",
    "    FetchAndAdd(&lock->turn);",
    "}"

var BOX_TYPES = ["info", "warn", "tip", "joke", "analogy", "def", "quiz", "exam"];

function renderNav(active) {
  var nav = document.getElementById("navList");
  nav.innerHTML = "";
  (typeof NAV_ORDER !== "undefined" ? NAV_ORDER : []).forEach(function (group) {
    var groupHeader = document.createElement("li");
    var gdiv = document.createElement("div");
    gdiv.style.cssText = "font-weight:700; color:#34466b; padding:6px 4px 2px; font-size:12px;";
    gdiv.textContent = group.group;
    groupHeader.appendChild(gdiv);
    nav.appendChild(groupHeader);
    group.items.forEach(function (key) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#" + encodeURIComponent(key);
      a.textContent = ARTICLES[key] ? ARTICLES[key].title : key;
      if (key === active) a.classList.add("active");
      li.appendChild(a);
      nav.appendChild(li);
    });
  });
}

function renderArticle(key) {
  var art = ARTICLES[key] || ARTICLES["main"];
  var area = document.getElementById("articleArea");

  if (!art) {
    area.innerHTML = '<h1>문서 없음</h1><p>아직 작성되지 않은 문서입니다.</p>';
    renderNav(key);
    renderTOC();
    return;
  }

  var cats = (art.category || []).map(function (c) {
    return '<span class="cat-tag">' + c + "</span>";
  }).join("");

  var html = "";
  if (key !== "main") {
    html += '<div class="breadcrumb"><a href="#main">운체위키</a> &gt; ' + art.title + "</div>";
  }
  html += "<h1>" + art.title + "</h1>";
  html += '<div class="meta">분류: ' + cats + "</div>";
  html += renderWikiText(art.body);
  html += '<div class="categories">분류: ' + cats + "</div>";

  area.innerHTML = html;

  mountSims(area);
  renderMath(area);

  renderNav(key);
  renderTOC();
  window.scrollTo(0, 0);
}

function mountSims(scope) {
  var nodes = scope.querySelectorAll(".sim[data-sim]");
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var name = node.getAttribute("data-sim");
    if (typeof SimEngine !== "undefined" && SimEngine && typeof SimEngine.mount === "function") {
      SimEngine.mount(node, name);
    } else {
      node.className = "sim-missing";
      node.textContent = "시뮬레이터 없음: " + name;
    }
  }
}

function renderMath(scope) {
  if (typeof renderMathInElement !== "function") return;
  try {
    renderMathInElement(scope, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false
    });
  } catch (e) { /* 수식 실패는 무시 */ }
}

      row.cells.forEach(function (c) {
        var tag = c.header ? "th" : "td";
        t += "<" + tag + ">" + inlineFormat(c.text.trim()) + "</" + tag + ">";
      });
      t += "</tr>";
    });
    t += "</table>";
    html += t;
    tableRows = [];
    inTable = false;
  }
  function closeList() {
    while (listStack.length) html += "</" + listStack.pop() + ">";
  }
  function escapeCode(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    // ---- 코드블록 ----
    if (!inPre && /^<pre\b/.test(line)) {
      closeList(); flushTable();
      inPre = true;
      var cm = line.match(/class\s*=\s*"([^"]*)"/);
      preClass = cm ? cm[1] : "";
      preContent = "";
      continue;
    }
    if (inPre) {
      if (line.indexOf("</pre>") === 0) {
        html += '<pre class="' + preClass + '">' + formatPre(preContent.replace(/\n$/, ""), preClass) + "</pre>";
        inPre = false;
      } else {
        preContent += line + "\n";
      }
      continue;
    }

    // ---- 박스 (한 줄 / 여러 줄 공통) ----
    var boxStart = line.match(/^\{(info|warn|tip|joke|analogy|def|quiz|exam|answer)\}([\s\S]*)$/);
    if (boxStart) {
      closeList(); flushTable();
      var cls = boxStart[1];
      var closeRe = new RegExp("\\{/" + cls + "\\}\\s*$");
      var content;
      if (closeRe.test(line)) {
        // 같은 줄에서 열고 닫는 경우
        content = boxStart[2].replace(closeRe, "");
      } else {
        content = boxStart[2];
        while (++i < lines.length) {
          var next = lines[i];
          if (closeRe.test(next)) {           // 닫는 태그는 본문 줄 끝에 붙어도 된다
            content += "\n" + next.replace(closeRe, "");
            break;
          }
          content += "\n" + next;
        }
      }
      var inner = renderBoxBody(content);
      if (cls === "answer") {
        html += '<details class="answer"><summary>정답 보기</summary>' + inner + "</details>";
      } else {
        html += '<div class="' + cls + '">' + inner + "</div>";
      }
      continue;
    }

    // ---- footnotes ----
    if (line.trim() === "{footnotes}") { closeList(); flushTable(); html += '<div class="footnote">'; continue; }
    if (line.trim() === "{/footnotes}") { closeList(); flushTable(); html += "</div>"; continue; }

    // ---- 표 ----
    if (line.indexOf("{|") === 0) { closeList(); inTable = true; tableRows = []; continue; }
    if (line.indexOf("|}") === 0) { flushTable(); continue; }
    if (inTable) {
      if (line.indexOf("|-") === 0) continue;
      if (line.indexOf("!") === 0) {
        tableRows.push({ cells: line.substring(1).split("||").map(function (c) { return { text: c, header: true }; }) });
      } else if (line.indexOf("|") === 0) {
        tableRows.push({ cells: line.substring(1).split("||").map(function (c) { return { text: c, header: false }; }) });
      }
      continue;
    }

    // ---- 헤딩 ----
    if (line.indexOf("==== ") === 0 && /\s====$/.test(line)) {
      closeList(); flushTable();
      var t4 = line.slice(5, -5);
      html += '<h4 id="' + headingId(t4) + '">' + inlineFormat(t4) + "</h4>";
      continue;
    }
    if (line.indexOf("=== ") === 0 && /\s===$/.test(line)) {
      closeList(); flushTable();
      var t3 = line.slice(4, -4);
      html += '<h3 id="' + headingId(t3) + '">' + inlineFormat(t3) + "</h3>";
      continue;
    }
    if (line.indexOf("== ") === 0 && /\s==$/.test(line)) {
      closeList(); flushTable();
      var t2 = line.slice(3, -3);
      html += '<h2 id="' + headingId(t2) + '">' + inlineFormat(t2) + "</h2>";
      continue;
    }

    // ---- 수평선 ----
    if (/^----+\s*$/.test(line)) {
      closeList(); flushTable();
      html += "<hr>";
      continue;
    }

    // ---- 목록 (중첩 1단계까지) ----
    var lm = line.match(/^(\*{1,2}|#{1,2})\s+(.*)$/);
    if (lm) {
      flushTable();
      var depth = lm[1].length;
      var type = lm[1].charAt(0) === "*" ? "ul" : "ol";
      while (listStack.length > depth) html += "</" + listStack.pop() + ">";
      if (listStack.length === depth && listStack[depth - 1] !== type) {
        html += "</" + listStack.pop() + ">";
      }
      while (listStack.length < depth) { html += "<" + type + ">"; listStack.push(type); }
      html += "<li>" + inlineFormat(lm[2]) + "</li>";
      continue;
    }
    closeList();

    if (line.trim() === "") continue;

    // ---- 블록 레벨 단독 태그 ----
    var trimmed = line.trim();
    if (/^\[\[(img|sim):.*\]\]$/.test(trimmed)) {
      html += inlineFormat(trimmed);
      continue;
    }

    html += "<p>" + inlineFormat(line) + "</p>";
  }
  closeList(); flushTable();
  if (inPre) html += '<pre class="' + preClass + '">' + formatPre(preContent, preClass) + "</pre>";
  return html;
}

// 제목에 위키 문법이 섞여 있어도 id 에는 남기지 않는다 ('''굵게''', [[링크]], `code`)
function headingId(text) {
  var t = String(text)
    .replace(/\[\[(?:img|sim):[^\]]*\]\]/g, "")
    .replace(/\[\[(?:[^\]\|]*\|)?([^\]]+)\]\]/g, "$1")
    .replace(/'''/g, "")
    .replace(/''/g, "")
    .replace(/`/g, "");
  return "h_" + t.trim().replace(/\s/g, "_");
}

// 박스 본문: 블록 문법(표/목록/코드/중첩 박스/헤딩/수평선)이 있으면 renderWikiText 로 재귀,
// 없으면 기존처럼 인라인 + <br> (한 줄짜리 박스의 모양을 그대로 유지하기 위함).
var BLOCK_IN_BOX = /^(?:\{\||\*+\s|#+\s|<pre\b|=+\s|----+\s*$|\{(?:info|warn|tip|joke|analogy|def|quiz|exam|answer)\})/;

function renderBoxBody(content) {
  var lines = String(content == null ? "" : content).split("\n");
  var block = false;
  for (var i = 0; i < lines.length; i++) {
    if (BLOCK_IN_BOX.test(lines[i])) { block = true; break; }
  }
  if (block) return renderWikiText(content);
  return inlineFormat(content).replace(/\n/g, "<br>");
}

// <pre> 본문: 항상 HTML 이스케이프한 뒤, txt/ascii 클래스에 한해
// '''굵게''' 와 [[링크]] / [[키|표시]] 만 추가로 처리한다 (c/asm/sh/무클래스는 완전 raw).
function formatPre(src, cls) {
  var out = String(src == null ? "" : src)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  var classes = String(cls || "").split(/\s+/);
  if (classes.indexOf("txt") === -1 && classes.indexOf("ascii") === -1) return out;

  out = out.replace(/\[\[([^\|\]\n]+)\|([^\]\n]+)\]\]/g, function (m, key, label) {
    return wikiLink(key, label);
  });
  out = out.replace(/\[\[([^\]\n]+)\]\]/g, function (m, key) {
    return wikiLink(key, null);
  });
  out = out.replace(/'''([\s\S]+?)'''/g, "<strong>$1</strong>");
  return out;
}

function wikiLink(key, label) {
  key = key.trim();
  var exists = typeof ARTICLES !== "undefined" && !!ARTICLES[key];
  if (label === null || label === undefined) label = exists ? ARTICLES[key].title : key;
  return '<a href="#' + encodeURIComponent(key) + '" class="' +
    (exists ? "wiki" : "wiki wiki-stub") + '">' + label + "</a>";
}

// ------------------------------------------------------------
// 인라인 문법
// ------------------------------------------------------------
function inlineFormat(text) {
  text = String(text == null ? "" : text);

  // [[sim:name]] — 시뮬레이터 자리
  text = text.replace(/\[\[sim:([^\]\|]+)\]\]/g, function (m, name) {
    return '<div class="sim" data-sim="' + name.trim() + '"></div>';
  });

  // [[img:file|caption|size]] — caption 안에 ']' 가 들어갈 수 있다 (예: prio_to_weight[40])
  text = text.replace(/\[\[img:([^\|\]\n]+)(?:\|([^\n]*?))?(?:\|(small|medium|large))?\]\]/g,
    function (m, fname, caption, size) {
      var cls = size || "medium";
      var cap = caption ? "<figcaption>" + caption + "</figcaption>" : "";
      return '<figure class="pdf-img ' + cls + '"><img src="images/' + fname.trim() +
        '" alt="' + (caption || fname) + '" loading="lazy">' + cap + "</figure>";
    });

  // [[key|label]]
  text = text.replace(/\[\[([^\|\]]+)\|([^\]]+)\]\]/g, function (m, key, label) {
    return wikiLink(key, label);
  });
  // [[key]]
  text = text.replace(/\[\[([^\]]+)\]\]/g, function (m, key) {
    return wikiLink(key, null);
  });

  // 굵게 먼저(3따옴표), 그 다음 기울임(2따옴표).
  // 본문에 아포스트로피가 섞여도(We'll, Don't, Little's) 끊기지 않도록 lazy 매칭.
  text = text.replace(/'''([\s\S]+?)'''/g, "<strong>$1</strong>");
  text = text.replace(/''([^\n'](?:[\s\S]*?[^\n'])?)''/g, "<em>$1</em>");
  text = text.replace(/`([^`]+)`/g, function (m, code) {
    return "<code>" + code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</code>";
  });
  return text;
}
if (typeof window !== "undefined") window.inlineFormat = inlineFormat;

// ------------------------------------------------------------
// 목차 / 검색 / 라우팅
// ------------------------------------------------------------
function renderTOC() {
  var tocList = document.getElementById("tocList");
  if (!tocList) return;
  var headings = document.querySelectorAll("main h2, main h3");
  tocList.innerHTML = "";
  headings.forEach(function (h) {
    var li = document.createElement("li");
    li.className = "toc-item " + (h.tagName === "H2" ? "l2" : "l3");
    var a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;
    a.style.color = "#1d65b3";
    a.style.textDecoration = "none";
    a.style.fontSize = "12px";
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      var target = document.getElementById(h.id);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    li.appendChild(a);
    tocList.appendChild(li);
  });
}

document.getElementById("searchBox").addEventListener("input", function (e) {
  var q = e.target.value.trim().toLowerCase();
  var nav = document.getElementById("navList");
  if (q === "") { renderNav(currentArticle()); return; }
  nav.innerHTML = "";
  var hits = 0;
  Object.keys(ARTICLES).forEach(function (key) {
    var art = ARTICLES[key];
    var haystack = (key + " " + art.title + " " + art.body).toLowerCase();
    if (haystack.indexOf(q) !== -1) {
      hits++;
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#" + encodeURIComponent(key);
      a.textContent = art.title;
      li.appendChild(a);
      nav.appendChild(li);
    }
  });
  if (!hits) {
    var li0 = document.createElement("li");
    li0.style.cssText = "color:#999; font-size:12px; padding:6px 4px;";
    li0.textContent = "검색 결과 없음";
    nav.appendChild(li0);
  }
});

function currentArticle() {
  var hash = decodeURIComponent(location.hash.substring(1));
  return ARTICLES[hash] ? hash : "main";
}

window.addEventListener("hashchange", function () { renderArticle(currentArticle()); });
renderArticle(currentArticle());

// KaTeX 는 defer 로 로드되므로, 첫 렌더 시점엔 아직 없을 수 있다 → load 후 한 번 더.
window.addEventListener("load", function () {
  renderMath(document.getElementById("articleArea"));
});
