   "용어"
  ],
  "body": "'''trapframe'''은 [[xv6]]에서 '''트랩이 났을 때 유저 레지스터를 통째로 담아 두는 구조체'''다. 4강 슬라이드의 \"user state saved by HW in the '''kernel stack'''\"을 [[RISC-V]] [[xv6]]가 구체화한 것으로, '''프로세스마다 한 페이지'''가 할당되어 `p->trapframe`으로 접근한다.\n\n{analogy}\ntrapframe은 '''책갈피'''다. 읽던 책을 덮기 전에 ① 몇 페이지였는지([[epc]]) ② 손에 뭘 들고 있었는지(레지스터 31개)를 적어 끼워 둔다. [[과제1 xv6 alarm|과제 1]]의 [[alarm_saved]]는 '''그 책갈피를 통째로 복사한 사본'''이고, 알람은 '''원본 책갈피의 페이지 번호만 몰래 바꿔 쓰는 장난'''이다.\n{/analogy}\n\n== 구조체 필드 ==\n\n<pre class=\"c\">\n// kernel/proc.h\nstruct trapframe {\n  /*   0 */ uint64 kernel_satp;   // ┐ 커널 페이지 테이블 주소\n  /*   8 */ uint64 kernel_sp;     // │ 이 프로세스의 커널 스택 top\n  /*  16 */ uint64 kernel_trap;   // │ usertrap() 의 주소\n  /*  24 */ uint64 epc;           // │ ★ 끊긴 유저 PC 사본\n  /*  32 */ uint64 kernel_hartid; // ┘ CPU 번호\n  /*  40 */ uint64 ra;            // ┐\n  /*  48 */ uint64 sp;            // │\n  /*  56 */ uint64 gp;            // │\n  /*  64 */ uint64 tp;            // │\n  /*  72 */ uint64 t0;            // │ 유저 범용 레지스터 31개\n  ...                             // │ (t0–t6, s0–s11, a0–a7)\n  /* 112 */ uint64 a0;            // │ ★ 인자 1 겸 반환값\n  ...                             // │\n  /* 168 */ uint64 a7;            // │ ★ 시스템 콜 번호\n  ...                             // │\n  /* 280 */ uint64 t6;            // ┘\n};\n<\/pre>\n\n{| class=\"table\"\n! 묶음 || 필드 || 누가 채우나 || 언제\n|-\n| '''커널 정보''' || `kernel_satp`, `kernel_sp`, `kernel_trap`, `kernel_hartid` || '''[[usertrapret]]'''이 '''미리''' 채워 둠 || 유저로 나가기 직전\n|-\n| '''복귀 주소''' || '''[[epc]]''' || '''[[usertrap]]'''이 `r_sepc()`로 || 트랩 진입 직후\n|-\n| '''유저 레지스터 31개''' || `ra sp gp tp t0–t6 s0–s11 a0–a7` || '''`uservec`'''(trampoline.S)이 어셈블리로 || 트랩 진입 순간\n|}\n\n{warn}\n'''`x0`는 없다.''' RISC-V의 `x0`는 항상 0이라 저장할 필요가 없다. 그래서 범용 레지스터는 32개가 아니라 '''31개'''. 그리고 '''PC는 범용 레지스터가 아니다''' — 그래서 `epc`라는 '''별도 칸'''을 만들어 따로 적는다.\n{/warn}\n\n== 왜 커널 정보까지 들어 있나 ==\n\n트랩 직후에는 '''모드는 커널인데 페이지 테이블은 아직 유저 것'''이다. 이 상태에서 커널 스택 주소나 커널 페이지 테이블 주소를 알아내려면 어딘가에서 읽어야 하는데, 유저 주소 공간에서 읽을 수 있는 유일한 커널 데이터가 '''trapframe 페이지'''다. 그래서 [[usertrapret]]이 나가기 전에 \"다음에 들어올 때 쓸 정보\"를 미리 적어 둔다.\n\n<pre class=\"ascii\">\n   유저 주소 공간 꼭대기\n   ┌──────────────────────────┐  MAXVA\n   │ trampoline (uservec/userret)│  ← 유저·커널 양쪽에 같은 주소로 매핑\n   ├──────────────────────────┤\n   │ TRAPFRAME  (1 page)      │  ← p->trapframe 이 가리키는 곳\n   │   kernel_satp … epc      │     PTE_U 없음 → 유저 코드는 못 읽음\n   │   ra sp … a0 … t6        │\n   ├──────────────────────────┤\n   │ user stack               │\n   │ heap / data / text       │\n   └──────────────────────────┘\n<\/pre>\n\n== 과제 1에서의 역할 ==\n\n<pre class=\"c\">\np->alarm_saved = *p->trapframe;   // 백업: 구조체 \"값\" 통째 복사 (= memmove)\np->trapframe->epc = handler;      // 원본의 복귀 주소만 바꿔치기\n...\n*p->trapframe = p->alarm_saved;   // 복원: 31 레지스터 + epc 전부 되돌림\n<\/pre>\n\n{warn}\n'''`p->alarm_saved = p->trapframe;`는 틀렸다''' — 그건 포인터 대입이고(타입도 안 맞음), 설령 된다 해도 '''같은 페이지를 가리키는 두 번째 이름'''일 뿐이라 백업이 아니다. `*`를 붙여 '''내용물'''을 복사해야 한다. 퀴즈 1의 2번 ② 빈칸이 정확히 이것.\n{/warn}\n\n{quiz}\n타이머 인터럽트로 이미 `p->trapframe`에 유저 문맥이 저장되는데, 왜 [[alarm_saved]]라는 사본이 또 필요한가?\n{/quiz}\n{answer}\n`p->trapframe`은 '''\"지금 이 트랩\"용 슬롯 하나'''뿐이고 트랩마다 덮어써진다. 핸들러는 '''user mode'''에서 돌면서 자신의 [[시스템 콜]](최소한 [[sigreturn]])로 또 트랩을 일으키므로, 그 순간 원래 문맥이 사라진다. → 핸들러 시작 '''전에''' 별도 슬롯으로 복사해야 한다. (퀴즈 1 3번 (a), 10점)\n{/answer}\n\n== 관련 문서 ==\n* [[epc]] · [[sepc]] · [[usertrap]] · [[usertrapret]] · [[sret]] · [[커널 스택]]\n* [[alarm_saved]] · [[a0]] · [[a0 복원]] · [[과제1 xv6 alarm]] · [[struct proc]]"
 },
 "epc": {
  "title": "epc (p->trapframe->epc)",
  "category": [
   "4강 LDE",
   "과제1",
   "용어"
  ],
  "body": "'''`epc`'''는 [[trapframe]] 구조체 안의 '''필드 하나'''로, '''\"트랩으로 끊긴 유저 PC\"의 사본'''이다. [[레지스터]]가 아니라 '''메모리 칸'''이라는 점이 핵심이다. CSR 레지스터인 [[sepc]]와 이름이 비슷해 헷갈리기 쉬운데, 둘의 관계를 아는 것이 [[과제1 xv6 alarm|과제 1]] 전체의 열쇠다.\n\n{def}\n`p->trapframe->epc` — a '''per-process memory field''' holding a copy of the interrupted user PC.\n[[usertrap]]이 `r_sepc()`로 채우고, [[usertrapret]]이 `w_sepc()`로 되돌려 쓴다.\n{/def}\n\n{analogy}\n[[sepc]]가 '''비행기 자동조종 장치에 입력된 목적지'''라면, `epc`는 '''조종석 노트에 적어 둔 목적지 메모'''다. 자동조종 장치는 하나뿐이라 다른 승무원이 다른 목적지를 넣어 버릴 수 있다. 그래서 착륙 직전에 '''노트를 보고 다시 입력'''한다. [[과제1 xv6 alarm|알람]]은 이 '''노트를 슬쩍 고쳐 쓰는 것''' — 자동조종 장치를 직접 건드리지 않고도 비행기가 다른 데로 간다.\n{/analogy}\n\n== 왜 sepc에서 옮겨 적나 ⭐ ==\n\n<pre class=\"ascii\">\n  sepc 는 CPU(hart)마다 딱 하나 → 커널 안에서 곧 덮어써진다:\n     · 타이머 분기의 yield() → 다른 프로세스로 전환 → 그쪽이 트랩하면 sepc = 그쪽 PC\n     · 커널 실행 중 또 인터럽트 → sepc = 커널 PC\n\n  ⇒ 프로세스별 메모리인 p->trapframe->epc 로 \"대피\"시켜 두고,\n     나갈 때 usertrapret() 이 w_sepc(p->trapframe->epc) 로 다시 넣어 준다.\n\n  하드웨어 → sepc → (r_sepc) → trapframe->epc → [커널 작업] → (w_sepc) → sepc → sret\n                                    ▲\n                            과제 1이 바꾸는 곳 (프로세스별이라 안전)\n<\/pre>\n\n== 시스템 콜이면 +4 ==\n\n<pre class=\"c\">\nif(r_scause() == 8){            // 유저가 ecall 했다 = 시스템 콜\n    p->trapframe->epc += 4;     // ecall(4바이트) 다음 명령어로 돌아가게\n    intr_on();\n    syscall();\n}\n<\/pre>\n\n{warn}\n'''+4를 하는 것은 [[시스템 콜]]일 때뿐이다.''' [[타이머 인터럽트]]는 '''끊긴 명령어를 아직 실행하지 않았으므로''' 그 명령어부터 다시 해야 한다 → +4 없음. 4강의 예외 분류로 말하면 '''trap은 \"next instruction\"으로, fault는 \"current instruction\" 재실행'''이라는 구분이 여기 코드로 나타난 것.\n{/warn}\n\n== 과제 1에서 ==\n\n<pre class=\"c\">\np->trapframe->epc = (uint64)p->alarm_handler;   // 퀴즈 1의 2번 ③ 빈칸\n<\/pre>\n\n이 한 줄이 '''과제 1의 전부'''다. 3단계 체인:\n# [[usertrap]]: `p->trapframe->epc = r_sepc()` — 대피\n# '''커널이 여기서 값을 바꾼다''' ← 알람\n# [[usertrapret]]: `w_sepc(p->trapframe->epc)` → [[sret]]이 그 주소로 점프\n\n{exam}\n'''\"sret은 [[sepc]]로 간다. sepc는 trapframe->epc에서 온다. 그래서 epc를 바꾼다.\"''' — 퀴즈 1의 2번 ③과 3번 (b)가 이 한 문장으로 풀린다. 모의고사 A18에서 틀린 문항이기도 하다.\n{/exam}\n\n== 관련 문서 ==\n* [[sepc]] · [[sret]] · [[trapframe]] · [[usertrap]] · [[usertrapret]] · [[return-from-trap]]\n* [[프로그램 카운터]] · [[alarm_handler]] · [[alarm_saved]] · [[과제1 xv6 alarm]] · [[퀴즈1 복기]]"
 },
 "sepc": {
  "title": "sepc (Supervisor Exception PC)",
  "category": [
   "4강 LDE",
   "과제1",
   "용어"
  ],
  "body": "'''`sepc`'''(Supervisor Exception Program Counter)는 [[RISC-V]]의 '''CSR 레지스터'''로, [[트랩]]이 나는 순간 '''하드웨어가 끊긴 PC를 써 넣는 곳'''이다. 그리고 [[sret]] 명령어는 '''무조건 `sepc`가 가리키는 주소로 점프'''한다. [[과제1 xv6 alarm|과제 1]]이 성립하는 이유가 바로 이 \"무조건\"이다.\n\n{def}\n'''sepc''' — CSR written by hardware on a trap with the interrupted PC; `sret` jumps to it.\nCPU(hart)마다 '''하나'''뿐이며 supervisor 모드 전용이라 유저 모드에서는 읽을 수도 없다. (\"spec\" 아님 — '''S'''upervisor '''E'''xception '''PC''')\n{/def}\n\n{analogy}\n`sepc`는 '''자동조종 장치에 입력된 목적지'''다. 비행기([[sret]])는 '''거기에 뭐가 적혀 있든 그리로 간다''' — 옳은지 따지지 않는다. 그래서 커널이 [[epc]](조종석 노트)를 고쳐 쓰고 착륙 전에 그 값을 자동조종에 입력하면, 비행기는 '''핸들러 공항'''에 내린다. 알람의 마법은 전부 이 무조건성에 기대고 있다.\n{/analogy}\n\n== 3단계 체인 ⭐⭐⭐ ==\n\n<pre class=\"ascii\">\n  ① 트랩 진입 — usertrap():\n        p->trapframe->epc = r_sepc();      // 하드웨어가 적어 둔 끊긴 PC 를 trapframe 에 대피\n\n  ② 커널 작업 — (과제 1은 여기서 epc 를 handler 로 바꿔치기)\n\n  ③ 트랩 복귀 — usertrapret():\n        w_sepc(p->trapframe->epc);         // trapframe 의 epc 를 sepc 에 되돌려 씀\n                 │\n                 ▼\n        userret: 레지스터 31개 복원 → sret → PC ← sepc, mode ← user\n<\/pre>\n\n{exam}\n'''한 문장으로 외울 것:''' \"'''`sret`은 `sepc`로 간다. `sepc`는 `trapframe->epc`에서 온다. 그래서 우리는 `epc`를 바꾼다.'''\"\n과제 PDF p.4의 힌트 문장 \"When a trap on the RISC-V returns to user space, '''what determines the instruction address at which user-space code resumes execution?'''\"의 답이 이것이다. 모의고사 A18에서 틀렸고, 실제 퀴즈 1의 2번 ③·3번 (b)로 나왔다.\n{/exam}\n\n== sepc vs epc — 표로 정리 ==\n\n{| class=\"table\"\n! || '''`sepc`''' || '''`p->trapframe->[[epc]]`'''\n|-\n| 정체 || CSR '''레지스터''' || [[trapframe]] 구조체의 '''메모리 필드'''\n|-\n| 개수 || '''CPU(hart)마다 1개''' || '''프로세스마다 1개'''\n|-\n| 누가 쓰나 || '''하드웨어'''가 트랩 순간 || '''[[usertrap]]'''이 C 코드로\n|-\n| 덮어써지나 || '''쉽게''' (yield, 커널 중 트랩) || 이 프로세스가 다시 트랩할 때까지 안전\n|-\n| 읽고 쓰는 법 || `r_sepc()` / `w_sepc()` (인라인 `csrr`/`csrw`) || 그냥 `p->trapframe->epc`\n|-\n| 과제에서 || 직접 건드리지 '''않음''' || '''여기를 바꾼다'''\n|}\n\n<pre class=\"c\">\n// kernel/riscv.h — r_ = read, w_ = write\nstatic inline uint64 r_sepc() {\n  uint64 x;\n  asm volatile(\"csrr %0, sepc\" : \"=r\" (x));   // csrr = CSR 읽기\n  return x;\n}\n<\/pre>\n\n{quiz}\n`usertrap()`에서 `w_sepc(handler)`로 [[sepc]]를 직접 바꾸면 안 되는가?\n{/quiz}\n{answer}\n'''위험하다.''' `sepc`는 CPU마다 하나뿐이라, 그 뒤에 오는 `yield()`에서 다른 프로세스로 [[컨텍스트 스위치|context switch]]가 일어나면 그쪽 트랩이 `sepc`를 덮어쓴다. 이 프로세스가 다시 스케줄되어 [[usertrapret]]에 도달할 때는 이미 값이 사라진 뒤다. 그래서 '''프로세스별 메모리인 `p->trapframe->epc`'''를 바꾸고, 나가기 직전에 [[usertrapret]]이 `sepc`로 옮기게 하는 것이 올바른 방법이다.\n{/answer}\n\n== 관련 문서 ==\n* [[epc]] · [[sret]] · [[trapframe]] · [[usertrap]] · [[usertrapret]] · [[return-from-trap]]\n* [[RISC-V]] · [[레지스터]] · [[프로그램 카운터]] · [[과제1 xv6 alarm]] · [[퀴즈1 복기]]"
 },
 "return-from-trap": {
  "title": "return-from-trap",
  "category": [
   "4강 LDE",
   "용어"
  ],
  "body": "'''return-from-trap'''은 [[커널]]에서 유저 프로그램으로 '''돌아 나가는''' 명령어다. [[트랩]]의 정확한 짝이며, [[제한적 직접 실행]] 프로토콜 표에서 '''OS @ run 열에 가장 자주 등장하는 줄'''이다.\n\n{def}\n'''Return-from-trap instruction (kernel → user)''': Return to the calling user program / '''Reduce the privilege level back to user mode'''.\n{/def}\n\n{analogy}\n트랩이 '''입국심사'''라면 return-from-trap은 '''출국 게이트'''다. 들어올 때 맡긴 짐(레지스터)을 되찾고, 신분(권한)이 다시 일반 여행객으로 내려가고, 원래 가려던 곳으로 간다. 재미있는 건 '''처음 태어난 프로세스조차 이 출국 게이트로 세상에 나온다'''는 것 — 입국한 적이 없는데 출국 도장을 찍는 셈이다.\n{/analogy}\n\n[[img:L4-23.png|p.23 LDE Protocol (Cont') — Handle trap → Do work of syscall → return-from-trap, 그리고 하드웨어가 하는 세 가지|large]]\n\n== 하드웨어가 하는 세 가지 ==\n\n<pre class=\"ascii\">\n   OS (kernel mode)        Hardware                        Program (user mode)\n   ──────────────────────────────────────────────────────────────────────────\n   Handle trap\n   Do work of syscall\n   return-from-trap ────►  restore regs from kernel stack\n                           move to user mode\n                           jump to PC after trap  ─────►   (계속 실행)\n<\/pre>\n\n# '''레지스터 복원''' — [[커널 스택]]([[xv6]]에서는 [[trapframe]])에 저장해 둔 유저 상태를 되돌린다.\n# '''모드 하강''' — kernel mode → user mode.\n# '''점프''' — \"PC after trap\"으로. [[xv6]]에서는 [[sepc]]가 가리키는 주소.\n\n== 프로세스를 시작할 때도 쓴다 ⭐ ==\n\nLDE 프로토콜 p.22를 보면, OS가 프로세스를 처음 만들 때도 마지막 줄이 '''return-from-trap'''이다.\n\n<pre class=\"ascii\">\n   Create entry for process list\n   Allocate memory for program\n   Load program into memory\n   Setup user stack with argv\n   Fill kernel stack with reg/PC     ← 가짜 \"유저 상태\"를 미리 채워 넣고\n   return-from-trap                  ← 트랩에서 돌아가는 \"척\"을 한다\n        └─► HW: restore regs / move to user mode / jump to main\n<\/pre>\n\n{tip}\n[[xv6]]에서 이 경로가 `forkret()` → [[usertrapret]] → `userret` → [[sret]]이다. 새 프로세스의 [[trapframe]]에는 `epc = 0`(프로그램 진입점), `sp = 유저 스택 top`이 미리 채워져 있다. '''\"들어온 적 없어도 나갈 수는 있다\"'''는 것이 LDE의 재치 있는 부분.\n{/tip}\n\n== 아키텍처별 이름 ==\n\n{| class=\"table\"\n! 아키텍처 || 트랩 (들어갈 때) || return-from-trap (나올 때)\n|-\n| x86 || `int $0x80` / `syscall` || `iret` / `sysret`\n|-\n| [[RISC-V]] / [[xv6]] || `ecall` || '''[[sret]]'''\n|}\n\n{quiz}\n프로세스를 '''처음''' 실행시킬 때 OS가 return-from-trap을 쓰는 이유는?\n{/quiz}\n{answer}\n유저 모드로 내려가면서 동시에 특정 주소(`main`)로 점프하는 '''유일한 수단'''이 그것이기 때문이다. 커널이 그냥 `jmp main`을 하면 '''모드가 여전히 kernel'''이라 유저 프로그램이 [[특권 명령]]을 쓸 수 있게 된다. 그래서 [[커널 스택]]에 가짜 유저 상태를 채우고 return-from-trap으로 \"돌아가는 척\"을 한다.\n{/answer}\n\n== 관련 문서 ==\n* [[트랩]] · [[sret]] · [[sepc]] · [[epc]] · [[usertrapret]] · [[trapframe]]\n* [[커널 스택]] · [[유저 모드와 커널 모드]] · [[제한적 직접 실행]]"
 },
 "usertrap": {
  "title": "usertrap()",
  "category": [
   "4강 LDE",
   "과제1",
   "용어"
  ],
  "body": "'''`usertrap()`'''(`kernel/trap.c`)은 [[xv6]]에서 '''유저 모드에서 발생한 모든 [[트랩]]이 도착하는 C 함수'''다. 트랩의 '''들어오는 문'''이며, [[과제1 xv6 alarm|과제 1]]의 알람 코드가 들어가는 자리이기도 하다.\n\n{analogy}\n`usertrap()`은 '''응급실 접수 데스크'''다. 구급차([[트랩]])가 어떤 이유로 왔든 일단 여기로 온다. 데스크는 `scause`(왜 왔나)를 보고 '''시스템 콜 / 장치 인터럽트 / 그 외(죽여야 할 것)''' 셋으로 분류해 보낸다. [[과제1 xv6 alarm|알람]]은 \"타이머 때문에 온 환자에게 퇴원 주소를 슬쩍 바꿔 적는\" 창구 직원이다.\n{/analogy}\n\n== 전체 구조 ==\n\n<pre class=\"c\">\nvoid\nusertrap(void)\n{\n  int which_dev = 0;\n  ...\n  w_stvec((uint64)kernelvec);        // 1  이제부터 커널 중 트랩은 kernelvec 으로\n  struct proc *p = myproc();\n\n  p->trapframe->epc = r_sepc();      // 2  ★ 끊긴 PC 를 trapframe 에 대피\n\n  if(r_scause() == 8){               // 3  유저가 ecall = 시스템 콜\n    if(killed(p)) exit(-1);\n    p->trapframe->epc += 4;          // 4  ecall 다음 명령어로 돌아가게\n    intr_on();\n    syscall();                       // 5  a7 보고 sys_xxx 디스패치\n  } else if((which_dev = devintr()) != 0){\n    // 6  장치 인터럽트 — 1 = 다른 장치, 2 = 타이머\n  } else {\n    printf(\"usertrap(): unexpected scause ...\");   // 7  page fault 등\n    setkilled(p);\n  }\n\n  if(killed(p)) exit(-1);\n\n  if(which_dev == 2){                // 8  타이머였으면\n    /* ★★ Assignment 1 알람 코드가 들어가는 자리 */\n    yield();                         // 9  CPU 양보\n  }\n\n  usertrapret();                     // 10 나가는 문으로\n}\n<\/pre>\n\n{| class=\"table\"\n! 행 || 하는 일\n|-\n| 1 || `stvec`을 `kernelvec`으로 교체. 커널 실행 중 트랩은 다른 경로로 가야 하므로\n|-\n| '''2''' || '''`p->trapframe->[[epc]] = r_sepc()`''' — [[sepc]]는 곧 덮어써지므로 프로세스별 메모리로 대피\n|-\n| 3 || `scause == 8` = \"Environment call from U-mode\". 이 숫자는 '''하드웨어(RISC-V 명세)'''가 정한 것\n|-\n| 4 || `ecall`이 4바이트라 +4. '''인터럽트는 +4 안 한다'''\n|-\n| 6 || `devintr()`의 반환값이 [[which_dev]]. '''여기서는 판별만 하고 yield는 8행에서''' 한다\n|-\n| '''8''' || '''알람 코드가 6행이 아니라 여기 들어가는 이유''' — `which_dev`가 확정된 뒤, 그리고 `yield()` '''앞'''이어야 한다\n|}\n\n{warn}\n'''알람 코드는 반드시 `yield()` '''앞''''''에 와야 한다. `yield()`는 [[컨텍스트 스위치]]를 일으켜 '''한참 뒤에야 돌아오거나 아예 안 돌아올''' 수 있다. `yield()` 뒤에 [[epc]]를 바꾸면 이미 다른 프로세스가 돌고 온 뒤라 순서가 엉킨다.\n{/warn}\n\n== scause와 which_dev는 다른 번호 체계다 ==\n\n{| class=\"table\"\n! || `scause` || `which_dev`\n|-\n| 누가 정했나 || '''하드웨어''' ([[RISC-V]] 명세) || '''소프트웨어''' ([[xv6]]의 `devintr()`)\n|-\n| 값 || 8 = U-mode ecall, 12/13/15 = page fault, (bit63=1) 5 = timer, 9 = external || 0 = 모름, 1 = 다른 장치(UART/디스크), '''2 = 타이머'''\n|-\n| 쓰는 곳 || 3행의 분기 || 8행의 분기 ([[과제1 xv6 alarm|알람]])\n|}\n\n{tip}\n`scause`의 '''최상위 비트 1개'''가 4강 p.10–12의 분류를 그대로 담고 있다 — bit63 = 1이면 '''Interrupt(비동기)''', 0이면 '''Exception(동기: trap/fault/abort)'''. 하드웨어에 박혀 있는 4강 이론.\n{/tip}\n\n[[sim:syscall_trap]]\n\n== 관련 문서 ==\n* [[usertrapret]] · [[trapframe]] · [[epc]] · [[sepc]] · [[which_dev]] · [[yield]] · [[myproc]]\n* [[트랩]] · [[인터럽트]] · [[타이머 인터럽트]] · [[시스템 콜]]\n* [[과제1 xv6 alarm]] · [[xv6 시스템 콜 경로]] · [[퀴즈1 복기]]"
 },
 "usertrapret": {
  "title": "usertrapret()",
  "category": [
   "4강 LDE",
   "과제1",
   "용어"
  ],
  "body": "'''`usertrapret()`'''(`kernel/trap.c`)은 [[xv6]]에서 커널이 유저 모드로 '''돌아 나가기 직전에 준비를 마치는''' C 함수다. [[usertrap]]이 '''들어오는 문'''이라면 이쪽은 '''나가는 문'''이고, 4강의 [[return-from-trap]]을 실제로 수행하는 코드다.\n\n{analogy}\n`usertrapret()`은 '''출국 수속 카운터'''다. 여권([[sepc]])에 목적지를 찍고, 다음에 다시 입국할 때 쓸 서류(커널 정보)를 미리 [[trapframe]]에 끼워 두고, 게이트(`userret` → [[sret]])로 보낸다. 재미있는 건 '''다음 입국 때 필요한 물건을 지금 미리 챙겨 둔다'''는 것 — 트랩 직후에는 커널 정보를 읽을 방법이 마땅치 않기 때문이다.\n{/analogy}\n\n== 하는 일 ==\n\n<pre class=\"c\">\nvoid\nusertrapret(void)\n{\n  struct proc *p = myproc();\n\n  intr_off();                                       // 1\n  w_stvec(TRAMPOLINE + (uservec - trampoline));     // 2  다음 트랩은 uservec 으로\n\n  // 다음에 uservec 이 읽을 커널 정보를 미리 채워 둔다\n  p->trapframe->kernel_satp   = r_satp();           // 3  커널 페이지 테이블\n  p->trapframe->kernel_sp     = p->kstack + PGSIZE; // 4  이 프로세스의 커널 스택\n  p->trapframe->kernel_trap   = (uint64)usertrap;   // 5\n  p->trapframe->kernel_hartid = r_tp();             // 6\n\n  unsigned long x = r_sstatus();\n  x &= ~SSTATUS_SPP;      // 7  SPP = 0  → sret 이 user mode 로 내려가게\n  x |=  SSTATUS_SPIE;     // 8  SPIE = 1 → 유저에서 인터럽트 허용\n  w_sstatus(x);\n\n  w_sepc(p->trapframe->epc);                        // 9  ★★ trapframe 의 epc → sepc\n\n  uint64 satp = MAKE_SATP(p->pagetable);\n  userret(TRAMPOLINE + (userret - trampoline))(satp);  // 10 → 레지스터 복원 → sret\n}\n<\/pre>\n\n{| class=\"table\"\n! 행 || 왜 필요한가\n|-\n| 2 || 유저에서 트랩이 나면 `uservec`으로 가야 한다. [[usertrap]]이 1행에서 `kernelvec`으로 바꿔 뒀던 것을 되돌리는 것\n|-\n| 3–6 || 트랩 직후에는 '''모드는 커널인데 페이지 테이블은 유저'''라 커널 정보를 못 읽는다. 그래서 '''미리''' [[trapframe]]에 적어 둔다\n|-\n| 7 || `SPP = 0`. [[sret]]은 '''`sstatus.SPP`를 보고 돌아갈 모드를 정한다''' — 이게 0이라 user mode로 내려간다\n|-\n| '''9''' || '''`w_sepc(p->trapframe->epc)`''' — 과제 1의 epc 바꿔치기가 '''여기서 효력을 발휘'''한다\n|-\n| 10 || `userret`(trampoline.S)이 [[trapframe]]에서 레지스터 31개를 복원하고 [[sret]] 실행\n|}\n\n{exam}\n'''9행이 퀴즈 1의 핵심이다.''' [[usertrap]]에서 `p->trapframe->epc`를 [[alarm_handler]]로 바꿔 놓았으면, 9행이 그 값을 [[sepc]]에 쓰고 [[sret]]이 거기로 점프한다 → 유저는 '''핸들러부터''' 실행한다. 커널은 `sepc`를 직접 건드리지 않고 '''`trapframe->epc`만''' 고친다는 점이 핵심.\n{/exam}\n\n<pre class=\"ascii\">\n   usertrap()                 [커널 작업]              usertrapret()\n   ─────────────────────────────────────────────────────────────────────\n   epc ← r_sepc()      →   (과제1: epc ← handler)  →   w_sepc(epc)\n                                                           │\n                                                           ▼\n                                             userret: 레지스터 31개 복원\n                                                       satp ← 유저 PT\n                                                       sret  → PC ← sepc\n                                                              mode ← user (SPP=0)\n<\/pre>\n\n{quiz}\n`usertrapret()`이 `kernel_sp`, `kernel_satp` 같은 '''커널''' 정보를 [[trapframe]]에 적어 두는 이유는?\n{/quiz}\n{answer}\n'''다음에 트랩으로 들어올 때 쓰려고.''' 트랩 직후에는 모드만 커널로 바뀌고 페이지 테이블은 아직 유저 것이라, 커널 스택 주소나 커널 페이지 테이블 주소를 알아낼 방법이 없다. 유저 주소 공간에서 읽을 수 있는 유일한 커널 데이터가 '''trapframe 페이지'''이므로, 나가기 전에 미리 적어 두는 것이다.\n{/answer}\n\n== 관련 문서 ==\n* [[usertrap]] · [[trapframe]] · [[epc]] · [[sepc]] · [[sret]] · [[return-from-trap]]\n* [[과제1 xv6 alarm]] · [[alarm_handler]] · [[제한적 직접 실행]]"
 },
 "타이머 인터럽트": {
  "title": "타이머 인터럽트 (Timer Interrupt)",
  "category": [
   "4강 LDE",
   "용어"
  ],
  "body": "'''타이머 인터럽트'''는 [[운영체제란|OS]]가 '''CPU 통제권을 되찾는 유일한 강제 수단'''이다. [[비협력적 방식]]의 실체이며, 이것이 없으면 무한 루프에 빠진 프로세스로부터 CPU를 회수할 방법이 없다.\n\n{def}\n'''Timer interrupt''' — Every few ms, an external timer chip triggers an interrupt. '''Used by the kernel to take back control from user programs.'''\n\"'''During the boot sequence, the OS starts the timer.'''\"\n\"'''A timer interrupt gives OS the ability to run again on a CPU.'''\"\n{/def}\n\n{analogy}\n타이머 인터럽트는 '''독서실 총무가 30분마다 울리는 종'''이다. 학생(프로세스)이 자리를 비켜 줄 생각이 전혀 없어도, 종이 울리면 총무(OS)가 들어와 \"다음 사람 차례\"라고 말할 수 있다. 중요한 건 '''종은 총무가 개업할 때(부팅) 한 번 설치한 것이고, 학생은 종을 끄지도 늦추지도 못한다'''는 점이다. 학생이 종을 끌 수 있다면 독서실은 첫날 망한다.\n{/analogy}\n\n[[img:L4-32.png|p.32 LDE Protocol (Timer interrupt) — 부팅 때 trap table에 timer handler를 등록하고 start interrupt timer|large]]\n\n== 동작 순서 (p.27) ==\n\n# '''부팅 시퀀스 중 OS가 타이머를 시작'''한다.\n# 타이머가 몇 ms마다(예: 10 ms) 인터럽트를 올린다.\n# 인터럽트가 올라오면:\n#* 현재 실행 중인 프로세스가 '''멈춘다'''\n#* 프로그램 상태가 '''충분히 저장'''된다 (하드웨어 → [[커널 스택]])\n#* OS 안의 '''미리 설정된 [[인터럽트 핸들러]]'''가 실행된다\n#* '''OS가 CPU 통제권을 되찾는다''' — 현재 프로세스를 멈추고 다른 프로세스를 시작할 수 있다\n\n{exam}\n'''모의고사 A5에서 틀린 문항.''' \"The timer used for timer interrupts is started by '''each user program''' when it begins running.\" → '''거짓'''.\n* 타이머는 '''부팅 때 OS가 한 번''' 켠다. 그 뒤로는 하드웨어가 알아서 인터럽트를 낸다.\n* 유저는 타이머를 '''켜지도 끄지도 못한다''' — 끌 수 있다면 무한 루프 프로세스가 타이머를 끄고 CPU를 영원히 독점한다(p.8의 Control 문제 재발). 타이머 설정은 '''[[특권 명령]]'''.\n* 한 줄: '''\"타이머는 OS가 부팅 때 켠다. 유저는 못 건드린다.\"'''\n{/exam}\n\n== xv6에서 ==\n\n<pre class=\"ascii\">\n  kernel/start.c   timerinit()        ← 부팅 때 한 번. 타이머 하드웨어 설정\n        │\n        ▼ 매 tick 마다\n  trampoline uservec → usertrap()\n        │\n        ├─ devintr() 가 scause 를 보고 \"타이머다\" → which_dev = 2 반환\n        │\n        └─ if (which_dev == 2) {\n               /* ★ 과제 1 알람 코드 */\n               yield();               ← CPU 양보 → 스케줄러 → 다른 프로세스\n           }\n<\/pre>\n\n* `tick`은 xv6에서 '''꽤 임의적인 시간 단위'''로, \"하드웨어 타이머가 얼마나 자주 인터럽트를 내느냐\"로 정해진다 (과제 PDF 원문).\n* [[과제1 xv6 alarm|과제 1]]의 \"n tick마다\"는 '''이 프로세스의 [[usertrap]]에서 센 tick''' = 이 프로세스가 '''소비한 CPU 시간'''이지 벽시계 시간이 아니다.\n\n[[sim:context_switch]]\n\n== 비용 — Tickless (p.35~37) ==\n\n돌릴 프로세스가 없으면 CPU를 `hlt`(x86) / `wfi`([[RISC-V]])로 재우는데, 그럼 누가 깨우나? → 타이머 인터럽트가 주기적으로 깨운다. 그런데 '''1 ms마다 깨어나 인터럽트를 처리하는 것 자체가 전력 낭비'''다. 그래서 현대 커널은\n* '''Tickless Idle''' — idle 코어의 tick을 끈다\n* '''Full Tickless''' — 코어에 프로세스가 하나뿐이면 tick을 끈다 (스케줄할 대상이 없으므로)\n* '''One-shot timer''' — 원하는 시점에 딱 한 번만 울리게 프로그램\n\n== 관련 문서 ==\n* [[비협력적 방식]] · [[협력적 방식]] · [[인터럽트]] · [[인터럽트 핸들러]] · [[컨텍스트 스위치]]\n* [[usertrap]] · [[which_dev]] · [[yield]] · [[스케줄러]] · [[특권 명령]]\n* [[제한적 직접 실행]] · [[과제1 xv6 alarm]] · [[time slice]]"
 },
 "컨텍스트 스위치": {
  "title": "컨텍스트 스위치 (Context Switch)",
  "category": [
   "4강 LDE",
   "핵심"
  ],
  "body": "'''컨텍스트 스위치'''(Context Switch)는 CPU를 한 프로세스에서 다른 프로세스로 넘기는 '''메커니즘'''이다. 4강이 \"'''mechanism'''\"이라고 부르는 것이 정확히 이것이고, \"무엇으로 바꿀까\"를 정하는 '''policy'''는 5강 [[스케줄링]]의 몫이다.\n\n{def}\n'''Context switch''' — A low-level piece of '''assembly code''' that\n① saves a few register values for the current process onto its kernel stack (general purpose registers, '''program counter''', '''kernel stack pointer'''),\n② restores a few for the soon-to-be-executing process, and\n③ switches to the kernel stack for the soon-to-be-executing process.\n{/def}\n\n{analogy}\n컨텍스트 스위치는 '''한 대의 게임기를 여러 명이 번갈아 쓰는 것'''이다. 내 차례가 끝나면 '''세이브 파일'''(레지스터 + PC)을 내 메모리 카드에 저장하고, 다음 사람의 세이브 파일을 불러온다. 게임기는 자기가 누구의 게임을 하고 있는지 모른다 — 세이브 파일이 전부다. 4강 녹음에서 교수가 한 말 그대로: \"'''we can change the context into the other context if we change this register.'''\"\n{/analogy}\n\n[[img:L4-31.png|p.31 Context Switch (Cont.) — ①하드웨어가 유저 상태를 커널 스택에, ③커널 레지스터를 proc-struct(A)에, ④proc-struct(C)에서 복원, ⑤C의 유저 모드로|large]]\n\n== 저장은 두 번 일어난다 ⭐⭐⭐ ==\n\n{warn}\n'''4강 최대의 함정.''' \"컨텍스트 스위치가 유저 레지스터를 저장한다\"는 서술은 '''틀렸다'''.\n{| class=\"table\"\n! 단계 || 누가 || 무엇을 || 어디에\n|-\n| ① || '''하드웨어''' (+ 트랩 진입 코드) || '''유저''' 상태 — PC(`%eip`), SP(`%esp`), flags, 범용 레지스터 || 그 프로세스의 '''[[커널 스택]]''' ([[xv6]]: [[trapframe]])\n|-\n| ③④ || '''OS의 `switch()`''' || '''커널''' 레지스터 — callee-saved, `ra`, 커널 `sp` || '''proc 구조체''' ([[PCB]], [[xv6]]: `p->context`)\n|}\n유저 레지스터는 컨텍스트 스위치가 일어나기 '''전에 이미''' 저장돼 있다. `switch()`는 \"커널 안에서 실행 중이던 흐름\"을 바꿔 끼울 뿐이다.\n{/warn}\n\n<pre class=\"ascii\">\n   Process A                                        Process C\n   ┌──────────────┐                                 ┌──────────────┐\n   │ User Stack   │                                 │ User Stack   │\n   ├──────────────┤  ① HW: 유저 상태 저장            ├──────────────┤\n   │ User state   │ ◄─────────────────              │ User state   │ ⑤ 유저로 복귀\n   │ (saved by HW)│                                 │ (saved by HW)│\n   │ Kernel Stack │                                 │ Kernel Stack │\n   └──────┬───────┘                                 └──────▲───────┘\n          │ ② Call switch();                               │\n          │ ③ Save kernel registers                ④ Restore kernel regs\n          ▼    to proc-struct(A)                      from proc-struct(C)\n      ┌────────────── Kernel ──────────────┐\n      │  proc-struct(A)      proc-struct(C) │\n      └─────────────────────────────────────┘\n<\/pre>\n\n[[sim:context_switch]]\n\n== xv6의 swtch ==\n\n`switch`가 C 키워드라 [[xv6]]는 모음을 빼고 '''`swtch`'''(`kernel/swtch.S`)라고 쓴다.\n\n<pre class=\"c\">\n// kernel/proc.c\nvoid\nyield(void)\n{\n  struct proc *p = myproc();\n  acquire(&p->lock);\n  p->state = RUNNABLE;    // 1  Running → Ready\n  sched();                // 2  → swtch(&p->context, &mycpu()->context)\n  release(&p->lock);      // 3  ← 다시 스케줄될 때 여기로 돌아온다\n}\n<\/pre>\n\n* 2행 — `swtch`는 '''callee-saved 레지스터 14개 + `ra` + `sp`'''만 저장/복원한다. caller-saved는 C 컴파일러가 이미 스택에 넣어 뒀으므로 건드릴 필요가 없다.\n* 3행 — 이 함수는 '''지금 당장 리턴하지 않는다'''. 한참 뒤 스케줄러가 이 프로세스를 다시 고를 때 `swtch`가 \"리턴한 것처럼\" 여기서 재개된다.\n\n{exam}\n9월 9일 녹음에서 교수가 '''\"the key point here is\"'''라며 강조한 문장:\n\"we save '''a few register values''' like '''general purpose register and program counter and kernel stack pointer''' and '''all of them is only this'''.\"\n→ 컨텍스트 스위치가 무엇을 저장하는지 묻는 문제에는 이 '''세 가지'''를 쓰면 된다.\n{/exam}\n\n== 비용 (p.34) ==\n\n{| class=\"table\"\n! 시기 || 시스템 콜 || 컨텍스트 스위치\n|-\n| 1996 (200 MHz P6, Linux 1.3.37) || 약 4 μs || 약 6 μs\n|-\n| 현대 (2–3 GHz) || 더 빠름 || '''sub-microsecond''' (거의 한 자릿수 배 개선)\n|}\n\n숫자보다 '''\"공짜는 아니지만 마이크로초 단위로 꽤 싸다 — 그래도 자주 하면 p.8의 Performance 문제\"'''라는 감각이 중요하다. 5강의 [[time slice]] 길이 선택이 정확히 이 트레이드오프다.\n\n== 관련 문서 ==\n* [[타이머 인터럽트]] · [[스케줄러]] · [[커널 스택]] · [[trapframe]] · [[PCB]] · [[struct proc]]\n* [[yield]] · [[usertrap]] · [[프로세스 상태]] · [[제한적 직접 실행]]\n* [[스케줄링]] (policy) · [[time slice]] · [[스레드 컨텍스트 스위치]] (8강)"
 },
 "커널 스택": {
  "title": "커널 스택 (Kernel Stack)",
  "category": [
   "4강 LDE",
   "용어"
  ],
  "body": "'''커널 스택'''은 프로세스가 [[시스템 콜]]이나 [[인터럽트]]로 커널에 들어와 있는 동안 쓰는 '''전용 스택'''이다. [[운영체제란|OS]]는 프로세스마다 '''유저 스택과 커널 스택 두 개'''를 유지한다.\n\n{def}\nFor two modes, kernel and user modes, the OS maintains '''separate stacks''' — kernel stack and user stack — '''for each process'''. Save and restore '''user state in the kernel stack''' when entering/exiting the kernel via system call.\n{/def}\n\n{analogy}\n커널 스택은 '''수술실 앞 개인 보관함'''이다. 수술실(커널)에 들어가기 전 내 소지품(레지스터)을 '''내 이름이 붙은''' 보관함에 넣고, 나올 때 그대로 찾는다. 보관함이 '''프로세스마다 따로'''라서 남의 물건과 섞이지 않고, 남이 내 보관함을 열 수도 없다(커널 메모리). 유저 스택에 저장하면? 그건 '''대기실 의자 위에 지갑을 놓고 가는 것''' — 유저 코드가 마음대로 고칠 수 있으니 보안이 무너진다.\n{/analogy}\n\n[[img:L4-20.png|p.20 User Stack and Kernel Stack — 프로세스 A의 스택 두 개와, 커널 스택에 저장된 \"User state (saved by HW)\"|large]]\n\n== 두 스택의 역할 ==\n\n{| class=\"table\"\n! || User Stack || '''Kernel Stack'''\n|-\n| 위치 || User Space || '''Kernel Space'''\n|-\n| 유저가 접근 || 가능 || '''불가'''\n|-\n| 담는 것 || 유저 함수의 지역변수, 리턴 주소 || ① '''하드웨어가 저장한 유저 상태''' (PC `%eip`, SP `%esp`, flags) <br> ② 커널 함수들의 지역변수·리턴 주소\n|-\n| 스택 포인터 || 유저 모드의 `%esp` || 커널 모드의 `%esp`\n|}\n\n<pre class=\"ascii\">\n                             Process A's Stacks\n   Process A                 ┌──────────────────┐\n   ┌────────┐                │   User Stack     │\n   │        │  SP(user) ───► │  Local vars,     │\n   └────────┘                │  Return addr, …  │\n  ─ System Call ─ ─ ─ ─ ─ ─ ─┼──────────────────┤ ── User Space ──\n   ┌────────┐                │  User state      │ ◄── PC(%eip), SP(%esp),\n   │ Kernel │                │  (saved by HW)   │     flags, …\n   │        │                │  Local vars,     │\n   └────────┘   SP(kernel)─► │  Return addr, …  │\n   ┌────────┐                │   Kernel Stack   │\n   │Hardware│                └──────────────────┘\n   └────────┘\n<\/pre>\n\n{warn}\n'''왜 유저 스택에 저장하면 안 되는가?''' 세 가지 이유:\n# '''보안''' — 유저 코드가 저장된 PC/모드 정보를 고쳐 커널 주소로 복귀시킬 수 있다.\n# '''신뢰성''' — 유저 `sp`가 잘못된 주소를 가리키고 있으면(스택 오버플로, 악의적 조작) 저장 자체가 실패한다.\n# '''격리''' — 커널 함수의 지역변수가 유저에게 노출된다.\n{/warn}\n\n== xv6에서 ==\n\n[[xv6]]에서는 이 개념이 둘로 나뉜다.\n\n{| class=\"table\"\n! 슬라이드 개념 || [[xv6]]의 구현\n|-\n| 커널 스택에 저장된 '''user state''' || '''[[trapframe]]''' — 프로세스마다 페이지 1장, `p->trapframe`\n|-\n| 커널 함수의 지역변수/리턴 주소 || '''`p->kstack`''' — 프로세스마다 페이지 1장, 진짜 스택\n|-\n| [[컨텍스트 스위치]]가 저장하는 커널 레지스터 || `p->context` ([[struct proc]] 안)\n|}\n\n{tip}\n[[usertrapret]]이 나가기 전에 `p->trapframe->kernel_sp = p->kstack + PGSIZE`를 적어 두는 이유가 이것이다 — 다음에 트랩으로 들어올 때 `uservec`이 그 값을 `sp`에 넣어 '''커널 스택으로 전환'''한다.\n{/tip}\n\n{quiz}\n프로세스가 [[시스템 콜]]을 할 때, 유저 레지스터는 '''누가''' '''어디에''' 저장하는가?\n{/quiz}\n{answer}\n'''하드웨어(+ 트랩 진입 코드)가, 그 프로세스의 커널 스택에.''' LDE 프로토콜 p.23의 Hardware 열 — \"save regs to kernel stack / move to kernel mode / jump to trap handler\". [[xv6]]에서는 `uservec`이 [[trapframe]]에 저장한다. '''[[컨텍스트 스위치]]가 저장하는 것이 아니다''' — 그쪽은 커널 레지스터를 proc 구조체에 저장한다.\n{/answer}\n\n== 관련 문서 ==\n* [[trapframe]] · [[스택 포인터]] · [[컨텍스트 스위치]] · [[struct proc]] · [[PCB]]\n* [[유저 모드와 커널 모드]] · [[시스템 콜]] · [[usertrapret]] · [[제한적 직접 실행]] · [[스택]]"
 },
 "협력적 방식": {
  "title": "협력적 방식 (Cooperative Approach)",
  "category": [

   "용어"
  ],
  "body": "'''협력적 방식'''(A Cooperative Approach)은 [[운영체제란|OS]]가 CPU 통제권을 되찾기 위해 '''프로세스가 스스로 넘겨 주기를 기다리는''' 방식이다. 4강 문제 2(프로세스 간 전환)의 '''첫 번째 답'''이자, '''왜 안 되는지를 보여 주기 위한''' 답이기도 하다.\n\n{def}\n'''A Cooperative Approach: just wait for system calls.'''\nProcesses periodically give up the CPU by making system calls such as `open()` and `yield()`. `yield()` does nothing except to transfer control to the OS. Applications also transfer control to the OS when they do something '''illegal''' (divide by zero, illegal memory access).\n{/def}\n\n{analogy}\n협력적 방식은 '''\"발표 시간 알아서 지켜 주세요\"라고만 하고 타이머를 안 둔 세미나'''다. 대부분의 발표자는 시간을 지킨다(시스템 콜을 부른다). 그런데 '''한 명이 마이크를 놓지 않으면''' 사회자는 할 수 있는 게 아무것도 없다 — 사회자가 마이크를 잡으려면 일단 말할 기회가 있어야 하는데, 그 기회 자체가 발표자에게 달려 있기 때문이다. 유일한 해결책은 '''정전을 시키는 것(재부팅)'''.\n{/analogy}\n\n== 통제권이 OS로 넘어오는 계기 ==\n\n<pre class=\"ascii\">\n   프로세스가 자발적으로:\n      open(), read(), write() …   ← 어차피 I/O 하려면 시스템 콜을 해야 함\n      yield()                      ← \"나 CPU 안 쓸래\"만 하는 전용 시스템 콜\n\n   프로세스가 사고를 쳐서 (비자발적이지만 결국 트랩):\n      0 으로 나누기\n      접근하면 안 되는 메모리 접근\n\n   ⇒ 어느 쪽이든 \"트랩\"으로 커널에 들어온다.  그때 OS가 전환 여부를 결정.\n\n   그런데:   while(1);      ← 시스템 콜도 안 하고 사고도 안 친다\n                            ⇒ OS 는 영원히 못 돌아온다  ⇒  재부팅\n<\/pre>\n\n{warn}\n슬라이드가 굵게 박아 둔 결론: '''\"A process gets stuck in an infinite loop → Reboot the machine.\"'''\n{/warn}\n\n== 실제로 쓰였던 OS ==\n* 초기 버전의 '''Macintosh OS'''\n* '''Xerox Alto''' 시스템\n\n{joke}\n\"프로그램이 멈추면 재부팅한다\"가 '''설계 사양'''이던 시절이 실제로 있었다. 지금도 가끔 그러긴 하는데, 그건 사양이 아니라 사고다.\n{/joke}\n\n{exam}\n'''모의고사 A4 — 맞췄지만 확신이 없었던 문항.'''\n\"In the cooperative approach, the OS regains control of the CPU by '''waiting''' for the process to make a system call.\" → '''참'''.\n\"OS가 기다린다\"는 수동적 표현이 틀린 문장처럼 보이지만, 슬라이드 원문이 '''\"just wait for system calls\"'''다. 대비되는 [[비협력적 방식]]과 '''표로 같이''' 외울 것 — 한쪽만 외우고 다른 쪽을 추론하다 뒤집는 것이 이 학생의 반복 실수 패턴이다.\n{/exam}\n\n{| class=\"table\"\n! || '''협력적''' || '''[[비협력적 방식|비협력적]]'''\n|-\n| 통제권 회수 || 프로세스가 '''줄 때까지 기다림''' || OS가 '''타이머로 빼앗음'''\n|-\n| 계기 || 시스템 콜 / 불법 행위 || '''[[타이머 인터럽트]]'''\n|-\n| 무한 루프 || '''재부팅''' || 다음 tick에 회수\n|-\n| 사례 || 초기 Mac OS, Xerox Alto || 현대의 모든 OS\n|}\n\n== 관련 문서 ==\n* [[비협력적 방식]] · [[타이머 인터럽트]] · [[yield]] · [[시스템 콜]] · [[트랩]]\n* [[컨텍스트 스위치]] · [[스케줄러]] · [[제한적 직접 실행]] · [[선점]]"
 },
 "비협력적 방식": {
  "title": "비협력적 방식 (Non-Cooperative Approach)",
  "category": [
   "4강 LDE",
   "용어"
  ],
  "body": "'''비협력적 방식'''(A Non-Cooperative Approach)은 [[운영체제란|OS]]가 '''[[타이머 인터럽트]]로 CPU를 강제로 빼앗는''' 방식이다. [[협력적 방식]]이 무한 루프 앞에서 무력했던 문제를 해결하며, '''현대의 모든 OS'''가 이 방식을 쓴다.\n\n{def}\n'''A timer interrupt'''\n* During the '''boot sequence, the OS starts the timer'''\n* The timer raises an interrupt every so many milliseconds\n* When the interrupt is raised: the currently running process is '''halted''' / '''save enough of the state''' of the program / a '''pre-configured interrupt handler''' in the OS runs / '''the OS regains control of the CPU''' — it stops the current process and starts a different one\n{/def}\n\n{analogy}\n[[협력적 방식]]이 \"알아서 시간 지켜 주세요\"라면, 비협력적 방식은 '''노래방 기계'''다. 시간이 다 되면 '''노래가 그냥 끊긴다''' — 부르는 사람의 동의는 필요 없다. 그리고 결정적으로, '''시간을 설정하는 리모컨은 카운터(OS)에 있지 방 안에 있지 않다.'''\n{/analogy}\n\n[[img:L4-32.png|p.32 — OS @ boot에서 timer handler 등록과 start interrupt timer가 추가된 LDE 프로토콜|large]]\n\n== 통제권 회수 시나리오 ==\n\n<pre class=\"ascii\">\n   OS @ boot                 Hardware\n   ──────────────────────────────────────────────────────\n   initialize trap table  →  remember … syscall handler\n                                        timer handler     ← 추가\n   start interrupt timer  →  start timer\n                             interrupt CPU in X ms (10 ms)\n\n   ── 이후, 유저 모드 ─────────────────────────────────────\n   Process A: while(1) { }        ← 시스템 콜 안 함, 사고도 안 침\n        │\n        ▼  10 ms 뒤 timer interrupt (A 의 동의 불필요)\n   HW: save regs(A) to k-stack(A) / move to kernel mode / jump to trap handler\n   OS: 스케줄러 판단 → switch() → Process C 로\n<\/pre>\n\n{warn}\n슬라이드의 굵은 결론: '''\"A timer interrupt gives OS the ability to run again on a CPU.\"'''\n그리고 그 능력의 전제가 '''\"타이머를 켠 것이 OS이고, 유저는 끌 수 없다\"'''는 것. 타이머 설정은 [[특권 명령]]이다.\n{/warn}\n\n{exam}\n'''모의고사 A5에서 틀린 문항.''' \"The timer ... is started by '''each user program''' when it begins running.\" → '''거짓'''. 슬라이드 첫 줄이 \"'''During the boot sequence, the OS starts the timer'''\".\n반대로 생각해 보면 자명하다 — 유저가 타이머를 켠다면 '''안 켜면 그만'''이고, 그럼 [[협력적 방식]]으로 되돌아간다.\n{/exam}\n\n== 저장하는 \"enough of the state\" ==\n\n\"충분한 상태\"가 구체적으로 무엇인지는 [[컨텍스트 스위치]] 문서를 보라. 요약하면 '''두 단계'''다 — ① 하드웨어가 '''유저''' 상태를 [[커널 스택]]에, ② OS의 `switch()`가 '''커널''' 레지스터를 [[PCB|proc 구조체]]에.\n\n[[sim:context_switch]]\n\n{quiz}\n[[협력적 방식]]과 비협력적 방식의 차이를 '''한 문장'''으로 쓰고, 각각의 실패/성공 조건을 말하라.\n{/quiz}\n{answer}\n'''협력적 = 프로세스가 시스템 콜을 할 때까지 OS가 기다린다 / 비협력적 = OS가 부팅 때 켠 [[타이머 인터럽트]]로 강제 회수한다.'''\n* 협력적은 프로세스가 '''협조하지 않으면'''(무한 루프) 실패 → 재부팅.\n* 비협력적은 '''유저가 타이머를 못 건드리기''' 때문에 항상 성공 — 타이머 설정이 [[특권 명령]]인 것이 그 보장이다.\n{/answer}\n\n== 관련 문서 ==\n* [[협력적 방식]] · [[타이머 인터럽트]] · [[인터럽트]] · [[인터럽트 핸들러]] · [[특권 명령]]\n* [[컨텍스트 스위치]] · [[스케줄러]] · [[선점]] · [[제한적 직접 실행]] · [[time slice]]"
 },
 "스케줄러": {
  "title": "스케줄러 (Scheduler)",
  "category": [
   "4강 LDE",
   "용어"
  ],
  "body": "'''스케줄러'''(Scheduler)는 [[커널]] 안에서 '''\"지금 이 CPU에 어느 프로세스를 올릴까\"'''를 결정하는 부분이다. 4강에서는 '''policy를 담당하는 쪽'''으로만 등장하고(메커니즘은 [[컨텍스트 스위치]]), 구체적인 알고리즘은 5강 [[스케줄링]]부터 다룬다.\n\n{def}\n'''Scheduler makes a decision''': whether to '''continue running''' the current process, or '''switch''' to a different one. If the decision is made to switch, the OS executes a '''context switch'''.\n{/def}\n\n{analogy}\n스케줄러는 '''병원 진료 순서를 정하는 간호사'''다. 환자를 진료실에 넣고 빼는 '''물리적 행위'''는 [[컨텍스트 스위치]](기계)가 하고, '''누구를 다음에 넣을지'''는 간호사가 정한다. 둘을 분리해 둔 덕에, 병원 방침이 \"선착순\"([[FIFO]])에서 \"급한 사람 먼저\"([[SJF]])로 바뀌어도 '''진료실 문 여닫는 기계는 그대로'''다. 이것이 4강이 말하는 mechanism/policy 분리의 실익이다.\n{/analogy}\n\n<pre class=\"ascii\">\n             Mechanism (4강)                    Policy (5강~)\n   ┌─────────────────────────────┐   ┌────────────────────────────┐\n   │  timer interrupt            │   │  FIFO / SJF / STCF / RR    │\n   │  trap → usertrap            │   │  MLFQ                      │\n   │  swtch (context switch)     │   │  Lottery / Stride / CFS    │\n   │  \"어떻게 바꾸나\"             │   │  \"누구로 바꾸나\"            │\n   └──────────────┬──────────────┘   └──────────────┬─────────────┘\n                  └───────────── scheduler ─────────┘\n                       (결정은 policy, 실행은 mechanism)\n<\/pre>\n\n== xv6의 스케줄러 ==\n\n[[xv6]]에서는 '''CPU마다 스케줄러 스레드가 하나씩''' 있다 (`kernel/proc.c`의 `scheduler()`).\n\n<pre class=\"c\">\nvoid\nscheduler(void)\n{\n  struct cpu *c = mycpu();\n  for(;;){\n    intr_on();\n    for(struct proc *p = proc; p < &proc[NPROC]; p++){   // 1  프로세스 배열 순회\n      acquire(&p->lock);\n      if(p->state == RUNNABLE){                          // 2  준비된 것을 찾으면\n        p->state = RUNNING;\n        c->proc = p;\n        swtch(&c->context, &p->context);                 // 3  그 프로세스로 전환\n        c->proc = 0;                                     // 4  돌아오면 여기부터\n      }\n      release(&p->lock);\n    }\n  }\n}\n<\/pre>\n\n* 1–2행 — 단순한 '''round-robin'''. [[프로세스 목록]]을 처음부터 훑어 RUNNABLE인 첫 프로세스를 고른다. 이게 xv6의 \"policy\" 전부다.\n* 3행 — [[컨텍스트 스위치]]. 여기서 나갔다가, 그 프로세스가 [[yield]]하면 4행으로 돌아온다.\n\n{tip}\n[[yield]] → `sched()` → `swtch()` → '''스케줄러''' → `swtch()` → 다른 프로세스. 즉 프로세스에서 프로세스로 '''직접''' 가는 게 아니라 '''항상 스케줄러 스레드를 경유'''한다. [[타이머 인터럽트]]로 들어온 [[usertrap]]이 `yield()`를 부르는 것이 이 여행의 출발점.\n{/tip}\n\n{quiz}\n\"스케줄러가 컨텍스트 스위치를 수행한다\"는 서술은 옳은가?\n{/quiz}\n{answer}\n'''느슨하게는 맞지만, 4강의 용어 구분으로는 부정확하다.''' 스케줄러는 '''결정'''(policy)을 하고, 결정이 \"바꾼다\"로 나면 OS가 '''[[컨텍스트 스위치]]라는 메커니즘을 실행'''한다 (p.28 원문: \"If the decision is made to switch, the OS '''executes''' context switch\"). 시험에서 mechanism/policy를 구분해 묻는다면 '''스케줄러 = policy, 컨텍스트 스위치 = mechanism'''으로 답해야 한다.\n{/answer}\n\n== 관련 문서 ==\n* [[컨텍스트 스위치]] · [[yield]] · [[타이머 인터럽트]] · [[프로세스 상태]] · [[프로세스 목록]]\n* [[스케줄링]] · [[FIFO]] · [[Round Robin]] · [[MLFQ]] · [[제한적 직접 실행]]"
 },
 "인터럽트": {
  "title": "인터럽트 (Interrupt)",
  "category": [
   "4강 LDE",
   "용어"
  ],
  "body": "'''인터럽트'''(Interrupt)는 '''프로세서 외부의 사건'''으로 생기는 '''asynchronous exception'''이다. [[트랩]]이 \"내가 두드린 문\"이라면 인터럽트는 \"밖에서 울린 경보\"다.\n\n{def}\n'''Asynchronous Exceptions (Interrupts)''' — Caused by events '''external to the processor'''. Indicated by setting the processor's '''interrupt pin'''. Handler returns to the '''\"next\"''' instruction.\n{/def}\n\n{analogy}\n인터럽트는 '''요리 중에 울리는 초인종'''이다. 내가 뭘 하고 있었든 상관없이 밖에서 울린다. 그래서 ① 언제 울릴지 '''예측할 수 없고''' ② 울렸을 때 '''하던 일을 정확히 기억해 두었다가''' 돌아와야 한다 — 냄비 불 끄는 걸 잊으면 안 되니까. 그 \"기억해 두는 노트\"가 [[trapframe]]이고, 기억한 위치가 [[epc]]다.\n{/analogy}\n\n== 예 ==\n\n{| class=\"table\"\n! 종류 || 언제 || 왜 중요한가\n|-\n| '''[[타이머 인터럽트]]''' || 몇 ms마다 외부 타이머 칩이 발생 || \"Used by the kernel to '''take back control''' from user programs\" — 4강의 핵심\n|-\n| I/O 인터럽트 || 키보드 Ctrl-C, 네트워크 패킷 도착, 디스크에서 데이터 도착 || 장치가 준비됐음을 알림 (폴링보다 효율적)\n|}\n\n== 동기 예외와의 구분 ⭐ ==\n\n<pre class=\"ascii\">\n                       Exceptional Control Flow\n                                 │\n            ┌────────────────────┴────────────────────┐\n            ▼                                         ▼\n     Asynchronous                               Synchronous\n     = 인터럽트                                  = 명령어 실행의 결과\n     · 외부 사건                          ┌──────────┼──────────┐\n     · interrupt pin                      ▼          ▼          ▼\n     · 다음 명령어로 복귀               Trap       Fault       Abort\n                                     의도적     비의도적     비의도적\n                                     (syscall)  복구가능      복구불가\n                                     다음 명령어  현재 명령어   종료\n                                                 재실행\n<\/pre>\n\n{exam}\n'''2025F 중간고사 Problem 1'''이 이 분류를 그대로 냈다 — \"Which one is '''not''' a synchronous exception?\" → '''Interrupt'''. 2026 시험에서도 \"재실행하는 것은?\"(→ Fault), \"의도적인 것은?\"(→ Trap), \"복구 불가능한 것은?\"(→ Abort) 형태로 변주되기 쉽다.\n{/exam}\n\n{tip}\n[[RISC-V]]에서는 이 구분이 '''`scause`의 최상위 비트 하나'''에 박혀 있다 — bit63 = 1이면 Interrupt, 0이면 Exception. 4강의 개념 분류가 하드웨어 명세에 그대로 있는 셈.\n{/tip}\n\n== 인터럽트를 끄기 ==\n\n[[커널 모드]]에서는 인터럽트를 '''잠시 끌 수 있다'''([[특권 명령]]). 9강 [[인터럽트 비활성화]]가 이것을 [[락]] 구현에 쓰는 이야기다. 유저 모드에서는 당연히 불가능하다 — 가능했다면 [[타이머 인터럽트]]를 꺼 버리면 그만이다.\n\n{quiz}\n\"인터럽트는 프로그램이 실행한 명령어 때문에 발생한다\"는 서술은 옳은가?\n{/quiz}\n{answer}\n'''틀렸다.''' 그것은 '''synchronous exception'''(trap / fault / abort)의 설명이다. 인터럽트는 '''프로세서 외부'''의 사건(타이머 칩, 디스크, 키보드)으로 생기며, 프로세서의 '''interrupt pin'''을 세워서 알린다. 그래서 '''언제 올지 프로그램과 무관'''하다 — 이것이 \"asynchronous\"의 뜻.\n{/answer}\n\n== 관련 문서 ==\n* [[트랩]] · [[인터럽트 핸들러]] · [[타이머 인터럽트]] · [[트랩 테이블]] · [[비협력적 방식]]\n* [[usertrap]] · [[which_dev]] · [[인터럽트 비활성화]] (9강) · [[제한적 직접 실행]]"
 },

  "category": [

  "body": "'''`sret`'''(Supervisor RETurn)은 [[RISC-V]]에서 [[트랩]]을 빠져나가는 명령어다. 4강의 '''[[return-from-trap]]'''을 실제 ISA에서 구현한 것이며, [[xv6]]에서는 `userret`(trampoline.S)의 '''마지막 한 줄'''이다.\n\n{def}\n`sret` — 명령어 '''하나'''가 세 가지를 '''원자적으로''' 한다:\n① `PC ← sepc` — 끊겼던 곳(또는 커널이 바꿔 둔 곳)으로 점프\n② `mode ← sstatus.SPP` — 트랩 전 모드로 복귀 (SPP = 0 → user)\n③ `SIE ← SPIE` — 트랩 전 인터럽트 허용 상태 복원\n{/def}\n\n{analogy}\n`sret`은 '''\"짐 찾고, 신분증 돌려받고, 문 열고 나가기\"를 동시에 하는 단 하나의 동작'''이다. 왜 원자적이어야 하냐면 — 만약 \"모드를 유저로 내린 뒤\" 한 명령어라도 쉬었다가 점프한다면, 그 사이에 '''유저 권한으로 커널 주소를 실행하는 순간'''이 생긴다. 보안 구멍이다. 그래서 하드웨어가 셋을 한 번에 한다.\n{/analogy}\n\n== ecall ↔ sret 대응표 ==\n\n{| class=\"table\"\n! 들어갈 때 || 나올 때\n|-\n| `ecall` / 인터럽트 → 하드웨어가 '''[[sepc]]에 저장''' || '''`sret`''' → 하드웨어가 '''[[sepc]]에서 꺼내''' 점프\n|-\n| user → '''supervisor(kernel)''' || supervisor → '''user'''\n|-\n| 4강의 '''[[트랩]]''' || 4강의 '''[[return-from-trap]]'''\n|-\n| `scause`에 이유 기록 || `sstatus.SPP`로 모드 결정\n|}\n\n== 왜 알람이 되는가 ⭐ ==\n\n<pre class=\"ascii\">\n   usertrapret() 이 sret 전에 미리 준비하는 것:\n\n      w_sepc(p->trapframe->epc);     ← ①용.  ★ 과제 1이 노리는 지점\n      sstatus.SPP  = 0 (user)        ← ②용\n      sstatus.SPIE = 1               ← ③용\n            │\n            ▼  userret: trapframe 에서 레지스터 31개 복원\n            ▼  sret\n      PC ← sepc   (epc 를 handler 로 바꿔 뒀으면 handler 로 \"복귀\")\n<\/pre>\n\n{exam}\n'''`sret`은 `sepc`에 뭐가 들어 있든 거기로 간다 — 옳은 주소인지 따지지 않는다.''' 이 '''무조건성'''이 [[과제1 xv6 alarm|과제 1]]이 성립하는 이유 전체다. 3단계 체인으로 외울 것:\n'''\"`sret`은 [[sepc]]로 간다 → `sepc`는 [[trapframe]]->[[epc]]에서 온다 → 그래서 `epc`를 바꾼다.\"''' (모의 A18, 실제 퀴즈 2번 ③·3번 (b))\n{/exam}\n\n== 아키텍처별 ==\n\n{| class=\"table\"\n! 아키텍처 || 트랩 || return-from-trap\n|-\n| x86 (32-bit) || `int $0x80` || `iret`\n|-\n| x86-64 || `syscall` || `sysret`\n|-\n| '''[[RISC-V]]''' || '''`ecall`''' || '''`sret`'''\n|}\n\n{quiz}\n핸들러 안에서 C `return`을 쓰면 `sret`과 같은 효과가 나는가?\n{/quiz}\n{answer}\n'''전혀 다르다.''' C `return`은 [[RISC-V]]에서 `ret` = `jalr x0, 0(ra)`, 즉 '''`ra` 레지스터로 점프'''하는 평범한 유저 명령어다. 모드도 안 바뀌고 [[sepc]]도 안 본다. 게다가 알람 핸들러는 `call` 된 적이 없어서 '''`ra`에는 끊긴 코드의 리턴 주소'''가 남아 있다 → 엉뚱한 곳으로 튄다. `sret`을 일으키려면 반드시 '''커널을 거쳐야''' 하고, 그 수단이 [[sigreturn]] 시스템 콜이다. (퀴즈 1의 3번 (c))\n{/answer}\n\n== 관련 문서 ==\n* [[return-from-trap]] · [[sepc]] · [[epc]] · [[트랩]] · [[usertrapret]] · [[trapframe]]\n* [[유저 모드와 커널 모드]] · [[RISC-V]] · [[과제1 xv6 alarm]] · [[sigreturn]] · [[퀴즈1 복기]]"
 },
 "스케줄링": {
  "title": "스케줄링 (CPU Scheduling)",
  "category": [
   "5강 Process Scheduling",
   "핵심"
  ],
  "body": "'''스케줄링'''(scheduling)은 실행 준비가 된 여러 [[프로세스]] 중에서 '''누구를, 언제, 얼마나''' CPU에 올릴지 정하는 [[스케줄러|OS의 정책(policy)]]이다. 4강 [[제한적 직접 실행]]에서 배운 [[타이머 인터럽트]]와 [[컨텍스트 스위치]]가 \"어떻게 바꿀 수 있는가\"라는 '''메커니즘'''이었다면, 5강은 그 위에 올라가는 '''정책'''이다.\n\n이 강의의 구조는 놀랄 만큼 단순하다. '''비현실적인 가정 4개를 세우고 → 하나씩 풀면서 → 정책을 발전시킨다.''' [[FIFO]] → [[SJF]] → [[STCF]] → [[Round Robin]] → [[MLFQ]] 순서로 가는데, 각 정책은 \"앞 정책이 어떤 가정 때문에 무너졌는가\"에 대한 답이다. 이 인과관계로 외우면 시험에서 절대 안 헷갈린다.\n\n{analogy}스케줄링은 '''1인 은행 창구'''를 운영하는 문제다. 창구 직원(CPU)은 한 명뿐인데 손님(프로세스)은 여럿이다. 온 순서대로 받을 것인가([[FIFO]])? 용무가 짧은 사람부터 받을 것인가([[SJF]])? 아니면 모두에게 3분씩 돌아가며 주고 다음 사람으로 넘길 것인가([[Round Robin]])? 정답은 \"무엇을 좋다고 부를 것인가\"에 달려 있고, 그 기준이 바로 [[스케줄링 지표]]다.{/analogy}\n\n== 워크로드 가정 ==\n\n'''워크로드(workload)'''란 어떤 주체가 일정 기간에 처리하는 일의 양이다. CPU 스케줄링에서는 '''일정 기간 동안 프로세서가 실행하는 job(process)의 수'''로 정의한다.\n\n교수님은 이걸 물리학의 \"마찰 없는 완전한 구(friction-less sphere)\" 가정에 비유했다. 현실에는 없지만, 없다고 가정해야 계산이 시작된다.\n\n{def}\n'''Workload assumptions (슬라이드 원문)'''\n# Each job runs for the same amount of time — 모든 job은 같은 시간 실행된다\n# All jobs arrive at the same time — 모든 job은 동시에 도착한다\n# All jobs only use the CPU (i.e., they perform no I/O) — 모든 job은 CPU만 쓴다\n# The run-time of each job is known — 각 job의 실행 시간을 미리 안다\n→ Unrealistic but simplify the problem we want to solve\n{/def}\n\n{exam}'''이 번호를 통째로 외울 것.''' 이후 슬라이드가 정확히 이 순서로 가정을 해제한다.\n* p.11 — 가정 1 해제 → [[FIFO]]가 무너짐 ([[convoy effect]])\n* p.14 — 가정 2 해제 → [[SJF]]가 무너짐 (비선점의 한계)\n* p.22 — 가정 3 해제 → [[I/O와 스케줄링]]\n* p.26 — 가정 4 해제 → [[MLFQ]]\n\"어떤 가정을 풀었더니 어떤 정책이 나왔나\"는 서술형으로 나오기 딱 좋다.{/exam}\n\n== 스케줄링 지표 ==\n\n자세한 것은 [[스케줄링 지표]] 문서를 보라. 여기서는 세 개만 짚는다.\n\n$$T_{turnaround} = T_{completion} - T_{arrival}$$\n\n$$T_{response} = T_{firstrun} - T_{arrival}$$\n\n* [[turnaround time]] (반환 시간) = '''완료 − 도착'''. 성능 지표. \"언제 다 끝나느냐\".\n* [[response time]] (응답 시간) = '''처음 스케줄된 시각 − 도착'''. 대화형 지표. \"언제 처음 반응하느냐\".\n* [[fairness]] (공정성) — 슬라이드 원문: \"Performance and fairness are '''often at odds''' in scheduling.\" 성능과 공정성은 자주 충돌한다.\n\n{warn}'''계산 문제에서 가장 많이 나오는 실수: 도착 시각을 빼지 않는 것.''' turnaround는 \"완료 시각\"이 아니라 \"완료 시각 − 도착 시각\"이다. 모든 job이 t=0에 도착하면 둘이 같아 보여서 습관이 안 들고, 도착 시각이 다른 문제에서 그대로 틀린다.{/warn}\n\n== FIFO — 온 순서대로 ==\n\n[[FIFO]](= FCFS, First Come First Served). 아주 단순하고 구현하기 쉽다.\n\n[[img:L5-10.png|FIFO: A, B, C가 각 10초. 평균 turnaround = (10+20+30)/3 = 20초|medium]]\n\n가정 4개가 전부 유지될 때는 FIFO도 그럭저럭 괜찮다. 문제는 '''가정 1을 푸는 순간''' 터진다.\n\n[[img:L5-11.png|가정 1 해제: A=100초, B=C=10초. 평균 turnaround가 110초로 폭발한다|medium]]\n\n<pre class=\"txt\">\nA(100) B(10) C(10) 순서로 도착, FIFO\n A: 0 ──────────────────────── 100   turnaround = 100\n B:                       100 ── 110  turnaround = 110\n C:                            110 ── 120  turnaround = 120\n 평균 = (100 + 110 + 120) / 3 = 110초\n<\/pre>\n\n10초짜리 job이 100초를 기다렸다. 이 현상의 이름이 [[convoy effect]]다.\n\n== SJF — 짧은 것부터 ==\n\n[[SJF]](Shortest Job First)는 가장 짧은 job부터 돌린다.\n\n[[img:L5-13.png|SJF: B(10) C(10) A(100) 순서. 평균 turnaround = (10+20+120)/3 = 50초|medium]]\n\n<pre class=\"txt\">\n B: 0 ── 10            turnaround = 10\n C:   10 ── 20          turnaround = 20\n A:      20 ────────── 120  turnaround = 120\n 평균 = (10 + 20 + 120) / 3 = 50초   ← 110초에서 절반 이하로\n<\/pre>\n\n'''모든 job이 동시에 도착한다면 SJF는 평균 turnaround의 최적 정책'''이다. 그런데 가정 2를 풀면 다시 무너진다.\n\n[[img:L5-14.png|가정 2 해제: A는 t=0 도착(100초), B·C는 t=10 도착(각 10초). SJF는 비선점이라 A를 못 멈춘다|medium]]\n\n<pre class=\"txt\">\n 평균 turnaround = (100 + (110 − 10) + (120 − 10)) / 3 = 103.33초\n                     ↑ 도착 시각 10을 반드시 뺀다\n<\/pre>\n\nSJF는 '''비선점(non-preemptive)'''이다. 이미 A를 돌리기 시작했으면 끝날 때까지 못 바꾼다. 그래서 convoy effect가 부활했다.\n\n== STCF — 선점을 추가하다 ==\n\n[[STCF]](Shortest Time-to-Completion First) = SJF + [[선점]]. 교과서에 따라 '''PSJF'''(Preemptive SJF) 또는 SRTF라고도 부른다.\n\n{def}\n'''STCF (슬라이드 원문)''': Add preemption to SJF. A new job enters the system → determine the run time of the remaining jobs and new job → schedule the job which has the '''least time left'''.\n{/def}\n\n[[img:L5-16.png|STCF: t=10에 B·C가 도착하면 A를 선점. 평균 turnaround = 50초|medium]]\n\n<pre class=\"txt\">\n t=0   A 실행 시작 (남은 100)\n t=10  B, C 도착 (각 10). A 남은 90 > B 10 → A를 선점\n A: 0──10                      30 ──────────── 120   turnaround = 120 − 0  = 120\n B:      10 ── 20                                     turnaround =  20 − 10 =  10\n C:          20 ── 30                                 turnaround =  30 − 10 =  20\n 평균 = (120 + 10 + 20) / 3 = 50초\n<\/pre>\n\n103.33 → 50초. STCF는 '''turnaround time을 최적화'''한다. 하지만 어두운 면이 둘 있다.\n\n[[img:L5-17.png|Starvation: 10초짜리 짧은 job이 계속 들어오면 A는 영원히 CPU를 못 받는다|medium]]\n\n# '''Starvation(기아)''': 짧은 job이 계속 들어오면 긴 job A는 영영 실행되지 않는다. 교수님도 녹음본에서 \"this phenomenon is called starvation\"이라고 짚었다.\n# '''response time이 나쁘다''' → 다음 절.\n\n[[sim:sched_gantt]]\n\n== response time과 Round Robin ==\n\nSTCF는 '''early batch computing'''엔 훌륭하다. 작업을 잔뜩 맡기고 다음 날 결과를 확인하면 되니까. 하지만 여러 사용자가 터미널 앞에 앉아 즉각 반응을 기다리는 '''time-shared machine'''엔 부적합하다.\n\n{exam}'''모의 퀴즈 A7·A8에서 실제로 뒤집어 틀린 지점.''' 슬라이드 원문이 \"STCF is '''not suitable''' for time-shared machines\"이다. 아래 표를 손으로 한 번 써 볼 것.\n\n{|\n! 정책 || 최적화하는 지표 || 나쁜 지표 || 어울리는 환경\n|-\n| '''[[STCF]]''' || '''[[turnaround time]]''' || [[response time]] || batch (배치)\n|-\n| '''[[Round Robin]]''' || '''[[response time]]''' || [[turnaround time]] ('''Terrible''') || interactive (대화형)\n|}\n\n기억법: '''R'''ound '''R'''obin → '''R'''esponse. 앞 글자가 같다. 하나만 확실히 잡으면 나머지는 반대다.{/exam}\n\n[[Round Robin]]은 job을 [[time slice]](= scheduling quantum)만큼만 돌리고 run queue의 다음 job으로 넘긴다.\n\n[[img:L5-20.png|같은 워크로드(A·B·C 각 5초)에서 SJF는 평균 response 5초, RR(슬라이스 1초)은 1초|large]]\n\n<pre class=\"txt\">\n SJF: A A A A A B B B B B C C C C C\n      response: A=0, B=5, C=10  → 평균 5초\n      turnaround: A=5, B=10, C=15 → 평균 10초\n\n RR(1초): A B C A B C A B C A B C A B C\n      response: A=0, B=1, C=2   → 평균 1초   ← 좋다\n      turnaround: A=13, B=14, C=15 → 평균 14초  ← 최악\n<\/pre>\n\n'''RR은 모든 job을 최대한 늘여서 끝내는 정책'''이라 turnaround에는 구조적으로 최악이다. 슬라이드 노란 박스 원문: \"RR is fair, but performs poorly on metrics such as turnaround time.\"\n\n=== time slice 길이의 trade-off ===\n\n[[img:L5-41.png|MLFQ 튜닝 예: Q2=10ms, Q1=20ms, Q0=40ms. 큐마다 슬라이스를 다르게 준다|medium]]\n\n[[time slice]] 길이는 [[컨텍스트 스위치]] 횟수를 결정한다.\n\n* '''짧으면''': response time ↑좋음, 그러나 '''switching 비용이 전체 성능을 지배'''.\n* '''길면''': switching 비용을 '''amortize(상각)''', 그러나 response time 나빠짐.\n\n{exam}녹음본(2026-09-09)에서 교수님이 숫자를 직접 들었다. \"context switching은 '''100 사이클 이상''', 대략 1μs 정도 걸린다. 슬라이스를 1ms로 잡으면 오버헤드가 '''0.1%''', 10ms로 잡으면 '''0.01%'''다.\" 그리고 덧붙였다 — \"League of Legends 같은 실시간 게임을 하면 10ms만 늘어도 user experience가 확 나빠진다.\" '''슬라이스 길이는 response time과 switching overhead 사이의 trade-off'''라는 문장이 시험에 나올 문장이다.\n\n또 하나: '''time slice는 반드시 timer-interrupt period의 배수'''여야 한다(슬라이드 p.19). 타이머가 10ms마다 울리면 슬라이스는 10·20·30ms만 가능하다. [[타이머 인터럽트]] 없이는 CPU를 되찾을 방법이 없기 때문이다.{/exam}\n\n== I/O를 고려하면 ==\n\n가정 3을 풀면 [[I/O와 스케줄링]] 문제가 된다.\n\n[[img:L5-23.png|위: A가 I/O 하는 동안 CPU를 놀린다(140ms). 아래: overlap으로 B를 끼워 넣는다(100ms)|large]]\n\n핵심 단어는 '''overlap'''이다. A의 각 10ms CPU 구간을 '''독립된 짧은 sub-job'''으로 취급하면 STCF가 자연스럽게 A 조각을 먼저 돌리고, A가 I/O로 나가면 B를 돌린다. 결과적으로 CPU utilization이 극대화된다.\n\n== MLFQ — 실행 시간을 모를 때 ==\n\n마지막 남은 가정 4(\"실행 시간을 미리 안다\")를 푼다. 현실의 OS는 프로그램이 얼마나 돌지 '''전혀 모른다'''. [[MLFQ]](Multi-Level Feedback Queue)는 '''과거로부터 학습(learn from the past)'''해서 예측한다. \"Feedback\"이라는 이름이 여기서 나왔다.\n\n{analogy}MLFQ는 '''처음 오는 손님을 일단 VIP로 대접하는 식당'''이다. 누가 커피 한 잔만 마시고 갈 사람이고 누가 풀코스를 시킬 사람인지 모르니까, 일단 전부 VIP석(최상위 큐)에 앉힌다. 커피만 마시고 갈 사람은 금방 일어나니 VIP석이 아깝지 않다. 반면 계속 눌러앉아 주문을 이어가는 손님은 점점 뒷자리로 옮긴다. 손님이 자기 행동으로 스스로 정체를 증명하는 것이다.{/analogy}\n\n[[img:L5-30.png|MLFQ 정적 스냅샷: Q8(최고)~Q1(최저). A·B는 Q8, C는 Q4, D는 Q1|medium]]\n\n=== 5가지 규칙 ===\n\n{def}\n'''The refined set of MLFQ rules (슬라이드 p.43 원문)'''\n* '''Rule 1''': If Priority(A) > Priority(B), A runs (B doesn't).\n* '''Rule 2''': If Priority(A) = Priority(B), A & B run in RR.\n* '''Rule 3''': When a job enters the system, it is placed at the highest priority.\n* '''Rule 4''': If a job uses up an entire time slice while running, its priority is reduced; if a job gives up the CPU before the time slice is up, it stays at the same priority level; '''once a job uses up its time slice at a given level, its priority is reduced'''.\n* '''Rule 5''': After some time period S, move all the jobs in the system to the topmost queue.\n{/def}\n\n규칙별 상세 예제와 단계별 추적은 [[MLFQ]] 문서에 있다.\n\n[[sim:mlfq]]\n\n=== MLFQ가 STCF를 근사하는 원리 ===\n\n[[img:L5-34.png|Example 2: t=100에 20ms짜리 짧은 job B가 도착. Rule 3으로 Q2에 들어가 먼저 끝난다 — \"Behave like STCF\"|medium]]\n\nMLFQ는 job이 짧을지 길지 모르므로 '''일단 짧다고 가정'''하고 높은 우선순위를 준다.\n* 실제로 짧으면 → 빨리 돌고 완료 (STCF와 동일한 결과).\n* 길면 → 천천히 큐를 내려가며 '''스스로 batch job임을 증명'''.\n\n{exam}녹음본에서 교수님이 \"every job starts from the '''high priority''', which means that MLFQ assumes that the job is basically the '''interactive''' job, and '''this is quite important'''\"라고 강조했다. 이유까지 말했다 — \"I/O-intensive job은 우선순위를 빨리 줘야 의미가 있고, CPU-intensive batch job은 어차피 오래 걸리니 분류에 시간을 좀 써도 손해가 아니다.\" 서술형으로 \"MLFQ는 왜 새 job에 최고 우선순위를 주는가?\"가 나오면 이 두 문장이 만점 답이다.{/exam}\n\n=== 기본 MLFQ의 세 가지 문제와 해법 ===\n\n{|\n! 문제 || 내용 || 해법\n|-\n| '''Starvation''' || 대화형 job이 너무 많으면 긴 job이 CPU를 영영 못 받음 || '''Rule 5''' — priority boost\n|-\n| '''행동 변화''' || CPU-bound → I/O-bound로 바뀌어도 최하위 큐에 갇힘 || '''Rule 5''' — priority boost\n|-\n| '''Gaming(공격)''' || 슬라이스 끝나기 직전에 CPU를 반납해 우선순위 유지 → 사실상 독점 || '''Rule 4''' — 누적 회계(better accounting)\n|}\n\n[[img:L5-38.png|Rule 5 priority boost. 왼쪽(부스트 없음)에서는 A가 starvation, 오른쪽에서는 S마다 전부 Q2로 올라온다|large]]\n\n[[img:L5-39.png|Rule 4 better accounting. 왼쪽(누적 없음)은 gaming 성공, 오른쪽(누적함)은 결국 Q0까지 내려간다|large]]\n\n'''Gaming''' 공격은 슬라이드 원문으로 \"Malicious process returns the CPU right before the deadline … '''Sort of security threat'''\"이다. 해법은 CPU를 놓았다고 사용량 카운터를 리셋하지 않고 '''해당 레벨에서 누적'''하는 것. 한 레벨에서 쓴 시간의 총합(allotment)이 슬라이스에 도달하면 하락시킨다.\n\n=== 파라미터 튜닝 ===\n\n큐를 몇 개? 큐마다 슬라이스는? 부스트 주기 S는? → 슬라이드 원문: \"'''There are no easy answers to these questions.'''\" 경험과 튜닝만이 답이다.\n\n* 높은 우선순위 큐 → '''짧은 슬라이스''' (대화형이니 빠르게 번갈아, 10ms 이하)\n* 낮은 우선순위 큐 → '''긴 슬라이스''' (CPU-bound니 전환 비용 아끼기, 100ms)\n* Solaris 기본값: '''60개 큐''', 슬라이스 20ms(최고) → 수백 ms(최하위), '''약 1초마다 부스트'''.\n\n{joke}Solaris 슬라이드 마지막 줄이 \"But you know, '''no one touches the default'''\"이다. 관리자가 튜닝할 수 있게 테이블을 60개나 만들어 놨는데 아무도 안 건드린다는 교수님의 유머.{/joke}\n\n== 정책 총정리 표 ==\n\n{|\n! 정책 || 최적화 || 못하는 것 || 선점? || 무너지는 지점\n|-\n| '''[[FIFO]]''' || 구현 단순함 || turnaround ([[convoy effect]]) || ✗ || 가정 1 해제\n|-\n| '''[[SJF]]''' || turnaround (동시 도착 시 최적) || 늦게 온 짧은 job, response || ✗ || 가정 2 해제\n|-\n| '''[[STCF]]''' || '''turnaround''' || '''response''', starvation || ✓ || 실행 시간을 알아야 함 (가정 4)\n|-\n| '''[[Round Robin]]''' || '''response''', [[fairness]] || '''turnaround (최악)''' || ✓ || switching 비용\n|-\n| '''[[MLFQ]]''' || turnaround + response 둘 다 근사 || 파라미터 튜닝이 어려움 || ✓ || 정답 없는 튜닝\n|}\n\n== 알고리즘 평가 방법 ==\n\n슬라이드 마지막 네 장은 \"그래서 어떤 알고리즘을 고를 것인가\"를 다룬다. 정확도와 비용 순으로 세 단계다.\n\n# '''Deterministic modeling''' — 미리 정해진 특정 워크로드로 각 알고리즘의 성능을 계산. '''이 강의에서 지금까지 한 계산이 전부 이것'''이다.\n# '''Queueing models''' — 도착·버스트를 확률적으로(보통 지수 분포) 기술. 대표 도구가 '''Little's Formula'''.\n# '''Simulations''' — 시스템을 프로그램으로 모델링. 입력은 난수 / 분포 / 실제 trace. open loop vs closed loop.\n\n$$n = \\lambda \\times W$$\n\n* $n$ = 평균 큐 길이, $\\lambda$ = 평균 도착률, $W$ = 평균 대기 시간.\n* '''어떤 스케줄링 알고리즘, 어떤 도착 분포에도 성립'''한다는 게 이 법칙의 힘.\n* 예: 초당 7개 도착($\\lambda=7$), 평균 14개 대기($n=14$) → $W = 14/7 = $ '''2초'''.\n\n== 예상 문제 ==\n\n{quiz}\n'''(2025F 중간고사 Problem 3 재현)''' 세 task A, B, C를 단일 프로세서에서 스케줄한다. 각 task는 이산 시간 단위로 실행되며 길이는 A = 4, B = 5, C = 6이다. 예시 스케줄은 `AAAA BBBBB CCCCCC`.\n\n* task의 turnaround time = 그 task가 끝나는 시각\n* '''total turnaround time''' = 모든 task의 완료 시각의 '''합'''\n* '''total fairness''' $F = \\frac{T_1}{T_2} + \\frac{T_2}{T_3}$ ($T_1 \\le T_2 \\le T_3$ = 첫째·둘째·셋째로 끝난 시각)\n* 스케줄러는 프로세서를 놀리지 않는다.\n\n'''(a)''' total turnaround time을 '''최소화'''하는 스케줄의 값은? (2pts)\n'''(b)''' total fairness를 '''최대화'''하는 스케줄의 total turnaround time은? (4pts)\n{/quiz}\n\n{answer}\n'''(a) 답: 28'''\n\n총 작업량이 4+5+6 = 15이고 프로세서를 놀리지 않으므로 '''마지막 완료 시각은 무조건 $T_3 = 15$'''로 고정이다. 남은 건 $T_1, T_2$를 최대한 앞당기는 것.\n\n[[SJF]]/[[STCF]]로 짧은 것부터 끝까지 돌린다:\n<pre class=\"txt\">\n A(4): 0 ──── 4          T1 = 4\n B(5):    4 ──── 9       T2 = 9\n C(6):        9 ──── 15  T3 = 15\n total turnaround = 4 + 9 + 15 = 28\n<\/pre>\n제약식으로 보면 $T_1 \\ge 4$, $T_2 \\ge 9$(A와 B 둘 다 끝나려면 최소 9), $T_3 = 15$이므로 $\\min(T_1+T_2+T_3) = 4+9+15 = 28$. '''짧은 것부터 = turnaround 최소''' 라는 [[SJF]]의 정체를 다시 확인해 주는 문제다.\n\n'''(b) 답: 42''' (= 13 + 14 + 15)\n\nfairness를 최대화한다는 건 '''셋이 최대한 동시에 끝나게''' 하는 것 = [[Round Robin]]의 성질이다. 하지만 \"RR로 돌린다\"로 끝내면 부분 점수다. 교수님 해설은 최적화 문제로 푼다:\n\n최대화 대상 $F = \\dfrac{T_1}{T_2} + \\dfrac{T_2}{T_3}$, 단 $T_3 = 15$ 고정, $T_1 < T_2 < T_3$.\n\n# $T_1$로 미분 → $\\partial F/\\partial T_1 = 1/T_2 > 0$ → '''항상 양수''' → $T_1$을 최대로 = 경계값 $T_1 = T_2 - 1$.\n# 대입: $F = \\dfrac{T_2-1}{T_2} + \\dfrac{T_2}{15} = 1 - \\dfrac{1}{T_2} + \\dfrac{T_2}{15}$.\n# $T_2$로 미분 → $1/T_2^2 + 1/15 > 0$ → '''역시 항상 양수''' → $T_2$도 최대 = $T_2 = T_3 - 1 = 14$, 따라서 $T_1 = 13$.\n# total turnaround = 13 + 14 + 15 = '''42'''.\n\n실제 스케줄 예: `ABCABCABCBCCABC` → $T_1=13, T_2=14, T_3=15$, $F = 13/14 + 14/15 \\approx 1.862$.\n\n{warn}참고로 단순한 RR(`ABCABCABCABCBCC`)은 $T_1=10, T_2=13, T_3=15$ → $F = 10/13 + 13/15 \\approx 1.636$으로 '''최적이 아니다'''. \"RR이면 답\"이라고 외우면 틀린다 — 문제가 정의를 새로 주면 그 정의로 최적화해야 한다.{/warn}\n\n'''(c)''' (10pts, 참고) total turnaround / total fairness를 최소화 → 같은 방식으로 $T_1 = T_2 - 1$, $T_2$는 최소(9) → $8 + 9 + 15 = $ '''32'''.\n{/answer}\n\n{quiz}\nA는 t=0에 도착해 100초, B와 C는 t=10에 도착해 각 10초 필요하다. [[STCF]]로 스케줄할 때 평균 turnaround time과 평균 response time을 각각 구하라.\n{/quiz}\n\n{answer}\n<pre class=\"txt\">\n A: 0──10          30 ──────────── 120\n B:     10 ── 20\n C:         20 ── 30\n\n turnaround (완료 − 도착)\n   A = 120 − 0  = 120\n   B =  20 − 10 =  10\n   C =  30 − 10 =  20\n   평균 = 150 / 3 = 50초\n\n response (첫 실행 − 도착)\n   A = 0 − 0  = 0\n   B = 10 − 10 = 0\n   C = 20 − 10 = 10\n   평균 = 10 / 3 ≈ 3.33초\n<\/pre>\nA는 t=10에 '''선점'''당했지만 이미 t=0에 한 번 실행됐으므로 response는 0이다. '''response는 \"처음\" 실행된 시각만 본다''' — 선점 후 재개는 세지 않는다.\n{/answer}\n\n== 시험 대비 핵심 요약 ==\n\n# '''워크로드 가정 4개''' ①실행 시간 동일 ②동시 도착 ③CPU만 사용 ④실행 시간을 안다 → 순서대로 풀리며 정책이 발전한다.\n# '''[[turnaround time]] = 완료 − 도착''', '''[[response time]] = 첫 실행 − 도착'''. 도착 시각 빼는 걸 잊지 말 것.\n# '''[[FIFO]]''' = 단순하지만 [[convoy effect]]. 긴 job 뒤에 짧은 job이 줄 선다.\n# '''[[SJF]]''' = 동시 도착이면 turnaround 최적. 하지만 '''비선점'''이라 늦게 온 짧은 job에 무력.\n# '''[[STCF]]''' = SJF + [[선점]]. '''turnaround 최적, response 나쁨, starvation 위험'''. batch용.\n# '''[[Round Robin]]''' = [[time slice]]로 번갈아. '''response 최적, turnaround 최악'''. interactive용. 슬라이스는 타이머 주기의 '''배수'''.\n# 슬라이스 길이 = response time vs switching overhead '''trade-off'''. 1μs switching에 1ms 슬라이스면 0.1%.\n# '''[[I/O와 스케줄링]]''': I/O 중인 job은 Blocked → 다른 job을 돌려 '''overlap''' → CPU utilization ↑.\n# '''[[MLFQ]] 목표''': 실행 시간을 '''모르면서''' STCF(turnaround) + RR(response)의 장점을 결합. 방법은 '''과거 행동으로 미래 예측'''.\n# '''MLFQ 5규칙''' 통째 암기. Rule 4(누적 회계) = gaming 방지, Rule 5(boost) = starvation·행동변화 해결.\n# 평가 3단계: '''deterministic modeling → queueing model(Little's law $n = \\lambda W$) → simulation'''.\n\n== 관련 문서 ==\n* [[스케줄링 지표]] — turnaround / response / fairness 정의와 계산\n* [[turnaround time]] · [[response time]] · [[fairness]]\n* [[FIFO]] · [[SJF]] · [[STCF]] · [[Round Robin]] · [[MLFQ]]\n* [[convoy effect]] · [[선점]] · [[time slice]] · [[I/O와 스케줄링]]\n* [[비례 지분 스케줄링]] — 목표 자체를 \"CPU 몫 보장\"으로 바꾼 6강\n* [[멀티프로세서 스케줄링]] — CPU가 여러 개일 때\n* [[제한적 직접 실행]] · [[컨텍스트 스위치]] · [[타이머 인터럽트]] — 이 정책들을 가능하게 하는 메커니즘\n* [[자주 틀리는 함정 모음]] · [[2025F 중간고사 족보]]"
 },
 "스케줄링 지표": {
  "title": "스케줄링 지표 (Scheduling Metrics)",
  "category": [
   "5강 Process Scheduling",
   "용어"
  ],
  "body": "'''스케줄링 지표'''(scheduling metrics)는 [[스케줄링]] 정책의 좋고 나쁨을 재는 자다. \"좋은 스케줄러\"라는 말은 지표를 정하기 전에는 의미가 없다. 5강은 지표를 '''두 개 + 하나'''로 정리한다.\n\n{analogy}지표는 '''자'''다. 같은 스케줄러라도 어떤 자로 재느냐에 따라 1등이 꼴등이 된다. [[Round Robin]]은 [[response time]]이라는 자로 재면 최고, [[turnaround time]]이라는 자로 재면 최악이다. 시험 문제를 읽을 때 '''\"무슨 자로 재라고 했는지\"를 먼저 동그라미 칠 것.'''{/analogy}\n\n== 세 가지 지표 ==\n\n{def}\n* '''Turnaround time''' (성능 지표): The time at which the job '''completes''' minus the time at which the job '''arrived''' in the system.\n$$T_{turnaround} = T_{completion} - T_{arrival}$$\n* '''Response time''': The time from when the job arrives to the '''first time it is scheduled'''.\n$$T_{response} = T_{firstrun} - T_{arrival}$$\n* '''Fairness''': Performance and fairness are '''often at odds''' in scheduling.\n{/def}\n\n{|\n! 지표 || 공식 || 무엇을 보는가 || 최적화하는 정책\n|-\n| '''[[turnaround time]]''' || 완료 − 도착 || 언제 '''다 끝나나''' || [[SJF]], [[STCF]]\n|-\n| '''[[response time]]''' || 첫 실행 − 도착 || 언제 '''처음 반응하나''' || [[Round Robin]]\n|-\n| '''[[fairness]]''' || (6강에서 $F = T_{first}/T_{second}$) || 몫을 '''공평하게''' 받았나 || [[Round Robin]], [[비례 지분 스케줄링]]\n|}\n\n== 계산할 때의 규칙 ==\n\n<pre class=\"txt\">\n 평균 turnaround = Σ(완료 시각 − 도착 시각) / job 수\n 평균 response   = Σ(첫 실행 시각 − 도착 시각) / job 수\n<\/pre>\n\n{warn}가장 흔한 실수 세 가지.\n# '''도착 시각을 안 뺀다.''' 모든 job이 t=0에 도착하는 예제만 보다가, 도착이 다른 문제에서 그대로 틀린다.\n# '''response를 \"선점 후 재개 시각\"으로 센다.''' response는 오직 '''처음''' 스케줄된 순간만 본다. [[STCF]]에서 A가 t=0에 돌다가 t=10에 선점당하고 t=30에 재개해도 A의 response는 '''0'''이다.\n# '''turnaround를 \"실행 시간\"으로 센다.''' 기다린 시간이 포함되어야 한다.{/warn}\n\n== 성능 vs 공정성 ==\n\n슬라이드가 두 번(5강 p.9, 6강 p.3) 반복하는 문장이 \"Performance and fairness are often at odds\"다. 실제로 그렇다.\n\n* [[SJF]]/[[STCF]]는 turnaround(성능)를 최적화하는 대신 긴 job을 '''starvation'''시킨다 — 불공정.\n* [[Round Robin]]은 완벽하게 공정하지만 turnaround가 '''Terrible'''.\n* [[MLFQ]]는 둘을 근사하려는 타협이고, [[비례 지분 스케줄링]]은 아예 '''공정성 자체를 목표로''' 삼는다.\n\n[[sim:sched_gantt]]\n\n== 관련 문서 ==\n* [[스케줄링]] — 지표가 정의되는 맥락\n* [[turnaround time]] · [[response time]] · [[fairness]]\n* [[STCF]] · [[Round Robin]] — 각 지표를 최적화하는 대표 정책"
 },

   "용어"
