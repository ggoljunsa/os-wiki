  "body": "'''`exec()`''' 계열([[exec|execv]], `execvp`, `execl`, …)은 '''지금 이 프로세스가 실행 중인 프로그램을 통째로 갈아 끼우는''' [[시스템 콜]]이다. [[fork]]가 \"프로세스를 하나 더 만드는\" 일이라면, `exec()`는 \"프로세스는 그대로 두고 내용물만 바꾸는\" 일이다.\n\n{def}\n3강 p.31 — \"'''Create''': Create a new process to run a program — e.g., `fork()` and '''`execv()`'''\".<br>\n아래 `p3.c` 예제와 출력은 '''[[OSTEP]] Chapter 5 (Process API)'''의 것이다.\n{/def}\n\n{analogy}\n🎭 '''빙의'''다. [[fork]]가 세포 분열(몸이 하나 더 생김)이라면 `exec()`는 '''같은 몸에 다른 영혼이 들어오는 것'''이다. PID는 그대로, 프로세스 테이블의 슬롯도 그대로, 부모 자식 관계도 그대로인데 — 코드·데이터·[[힙]]·[[스택]]이 전부 새 프로그램의 것으로 교체되고, 실행은 새 프로그램의 `main()`부터 다시 시작한다. 그래서 `exec()`는 '''성공하면 절대 리턴하지 않는다'''.\n{/analogy}\n\n== 예제 (OSTEP p3.c) ==\n\n<pre class=\"c\">\nint main(int argc, char *argv[]) {\n    printf(\"hello world (pid:%d)\\n\", (int) getpid());\n    int rc = fork();\n    if (rc &lt; 0) {\n        fprintf(stderr, \"fork failed\\n\");\n        exit(1);\n    } else if (rc == 0) {                      // child\n        printf(\"hello, I am child (pid:%d)\\n\", (int) getpid());\n        char *myargs[3];\n        myargs[0] = strdup(\"wc\");              // 실행할 프로그램: \"wc\"\n        myargs[1] = strdup(\"p3.c\");            // 인자: 파일 이름\n        myargs[2] = NULL;                      // 배열의 끝 표시\n        execvp(myargs[0], myargs);             // \"wc\" 를 실행\n        printf(\"this shouldn't print out\");    // ← 여기는 도달하지 않는다\n    } else {                                   // parent\n        int rc_wait = wait(NULL);\n        printf(\"hello, I am parent of %d (rc_wait:%d) (pid:%d)\\n\",\n               rc, rc_wait, (int) getpid());\n    }\n    return 0;\n}\n<\/pre>\n\n'''출력''':\n\n<pre class=\"sh\">\nprompt> ./p3\nhello world (pid:29383)\nhello, I am child (pid:29384)\n     29     107     1030 p3.c\nhello, I am parent of 29384 (rc_wait:29384) (pid:29383)\nprompt>\n<\/pre>\n\n[[sim:fork_exec]]\n\n{warn}\n'''`\"this shouldn't print out\"`이 출력되지 않는 이유'''가 `exec()` 문제의 핵심이다. `execvp()`가 성공하면 그 프로세스의 코드 영역 자체가 `wc`의 것으로 덮어써지므로, '''돌아올 코드가 존재하지 않는다'''. 만약 이 줄이 출력됐다면 `exec()`가 '''실패'''했다는 뜻이다 (파일 없음, 권한 없음 등).\n{/warn}\n\n== fork와 exec의 분업 ==\n\n<pre class=\"ascii\">\n   fork()                                exec()\n   ─────────────────────────             ─────────────────────────\n   프로세스 개수:  1 → 2                  프로세스 개수:  1 → 1\n   PID:           새로 발급               PID:           그대로\n   실행 프로그램:  같음                    실행 프로그램:  '''교체'''\n   리턴:          부모=자식pid, 자식=0     리턴:          '''성공하면 리턴 안 함'''\n   재개 지점:     fork() 다음 줄          재개 지점:     새 프로그램의 main()\n<\/pre>\n\n{| class=\"table\"\n! 프로세스 구성 요소 || `fork()` 후 자식 || `exec()` 후\n|-\n| PID || 새 값 || '''유지'''\n|-\n| 부모 (`parent`) || 호출자 || '''유지'''\n|-\n| 코드 `.text` || 부모와 동일 || '''새 프로그램의 것으로 교체'''\n|-\n| [[주소 공간]] (data/heap/stack) || 복사본 || '''전부 폐기 후 재구성'''\n|-\n| 열린 파일 디스크립터 || 복사 || '''유지''' (close-on-exec 표시가 없다면)\n|-\n| [[프로그램 카운터|PC]] || `fork()` 다음 줄 || 새 프로그램의 엔트리 포인트\n|}\n\n{warn}\n'''\"열린 파일 디스크립터가 `exec()` 후에도 유지된다\"'''는 성질이 유닉스 셸의 리다이렉션을 가능하게 한다.<br>\n`ls > out.txt`의 구현: [[fork]] → 자식에서 stdout(1)을 `out.txt`로 바꿔치기 → `exec(\"ls\")`. `ls`는 자기가 파일로 쓰는 줄 모르고 그냥 stdout에 쓴다. 이것이 [[프로세스 API|fork와 exec를 분리한 이유]]다.\n{/warn}\n\n{tip}\n0831 녹음본: \"the fork system call … '''only copies the process data and then generates a separate logical control flow'''. And then you can use the '''execv''' system call to '''load another program'''. So if you want to run a program, you first need to fork the process and then call the execv system call to '''change the executing program'''.\"\n{/tip}\n\n== exec가 내부에서 하는 일 ==\n\n사실상 [[프로세스|프로세스 생성 5단계]]를 기존 프로세스 위에서 다시 하는 것이다.\n\n# 실행 파일(ELF)을 찾아 열고 헤더를 읽는다 → [[프로그램 로딩]]\n# 기존 [[주소 공간]]을 버리고 새 것을 만든다 (code / data / [[힙]] / [[스택]])\n# 새 [[스택]]에 `argc`, `argv`를 세팅한다 (`myargs[]`가 여기로 들어간다)\n# [[trapframe]]의 [[epc]]를 새 프로그램의 엔트리 포인트로 설정\n# [[return-from-trap|유저 모드로 복귀]] → 새 `main()`이 돈다\n\n{warn}\n`myargs[2] = NULL;`을 빼먹으면 안 된다. `execvp`는 인자 배열의 끝을 '''`NULL` 포인터'''로 판단하기 때문에, 없으면 쓰레기 값을 인자로 읽다가 터진다.\n{/warn}\n\n== 예상 문제 ==\n\n{quiz}\n'''(출력 예측)''' `execvp()` 호출 바로 다음 줄의 `printf(\"this shouldn't print out\");`이 실행되는 경우는 언제인가? 한 문장으로 답하시오.\n{/quiz}\n{answer}\n'''`execvp()`가 실패했을 때만''' 실행된다. 성공하면 프로세스의 코드·데이터가 새 프로그램으로 교체되어 돌아올 자리가 사라지므로 리턴하지 않는다.\n{/answer}\n\n{quiz}\n'''(구분)''' `fork()`와 `exec()`가 각각 \"프로세스 개수\"와 \"PID\"에 어떤 영향을 주는지 표로 정리하시오.\n{/quiz}\n{answer}\n· '''`fork()`''': 프로세스 개수 1 → '''2''', 자식에게 '''새 PID''' 발급<br>\n· '''`exec()`''': 프로세스 개수 1 → '''1'''(변화 없음), PID는 '''그대로 유지'''<br>\n한 줄 요약: `fork`는 몸을 늘리고, `exec`는 내용물을 바꾼다.\n{/answer}\n\n{quiz}\n'''(서술)''' 셸이 `ls > out.txt`를 구현하는 과정을 [[fork]]·`exec`·파일 디스크립터를 써서 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n셸이 [[fork]]로 자식을 만들고, '''자식이 `exec` 하기 전에''' stdout(fd 1)을 `out.txt`로 바꿔치기한 뒤 `exec(\"ls\")`를 호출하면, 파일 디스크립터는 `exec`를 넘어 유지되므로 `ls`는 모르는 채로 파일에 쓰게 된다.\n{/answer}\n\n== 관련 문서 ==\n* [[fork]] / [[wait]] / [[프로세스 API]]\n* [[프로세스]] — 생성 5단계\n* [[프로그램 로딩]] / [[주소 공간]]\n* [[trapframe]] / [[epc]] / [[return-from-trap]]\n* [[OSTEP]] — Chapter 5"
 },

  "body": "'''`wait()`'''는 부모 프로세스가 '''자식이 끝날 때까지 블록'''되었다가, 끝난 자식을 회수(reap)하는 [[시스템 콜]]이다. [[프로세스 API]]의 Wait 갈래이며, `ZOMBIE` 상태를 없애는 유일한 방법이다.\n\n{def}\n3강 p.31 — \"'''Wait''': Wait for a process to stop running — e.g., `wait()` and `waitpid()`\".<br>\n아래 `p2.c` 예제와 출력은 '''[[OSTEP]] Chapter 5 (Process API)'''의 것이다.\n{/def}\n\n{analogy}\n🧾 '''장례 절차'''다. 자식이 `exit()`을 해도 프로세스는 완전히 사라지지 않는다 — 종료 코드와 [[PCB]] 껍데기가 `ZOMBIE` 상태로 남는다. 부모가 `wait()`를 불러 \"얘 갔구나, 사인은 이거구나\"를 확인해 줘야 비로소 시스템에서 지워진다. 부모가 끝까지 안 부르면? 시체가 프로세스 테이블에 계속 쌓인다. 그게 '''좀비 프로세스'''다.\n{/analogy}\n\n== 예제 (OSTEP p2.c) ==\n\n<pre class=\"c\">\nint main(int argc, char *argv[]) {\n    printf(\"hello world (pid:%d)\\n\", (int) getpid());\n    int rc = fork();\n    if (rc &lt; 0) {\n        fprintf(stderr, \"fork failed\\n\");\n        exit(1);\n    } else if (rc == 0) {                  // child\n        printf(\"hello, I am child (pid:%d)\\n\", (int) getpid());\n    } else {                               // parent\n        int rc_wait = wait(NULL);          // 자식이 끝날 때까지 블록\n        printf(\"hello, I am parent of %d (rc_wait:%d) (pid:%d)\\n\",\n               rc, rc_wait, (int) getpid());\n    }\n    return 0;\n}\n<\/pre>\n\n'''출력''':\n\n<pre class=\"sh\">\nprompt> ./p2\nhello world (pid:29266)\nhello, I am child (pid:29267)\nhello, I am parent of 29267 (rc_wait:29267) (pid:29266)\nprompt>\n<\/pre>\n\n[[sim:fork_exec]]\n\n{warn}\n'''`p1.c`와 `p2.c`의 결정적 차이''': `p1.c`는 부모가 먼저 찍힐 수도, 자식이 먼저 찍힐 수도 있었다. `p2.c`는 `wait()` 덕분에 '''자식이 반드시 먼저''' 출력된다. 즉 `wait()`는 비결정적이던 실행 순서를 '''결정적으로''' 만든다. 시험에서 \"출력 순서가 항상 같은가?\"를 묻는다면 `wait()`의 유무를 보면 된다.\n{/warn}\n\n{warn}\n`wait()`의 '''반환값은 끝난 자식의 PID'''다. 위 출력에서 `rc`(= [[fork]]의 반환값)와 `rc_wait`(= `wait()`의 반환값)가 둘 다 `29267`로 같은 이유가 그것이다. 이 두 값이 같다는 걸 확인하는 문제가 자주 나온다.\n{/warn}\n\n== 동작 ==\n\n<pre class=\"ascii\">\n   부모                                     자식\n   ────────────────────────────────────    ───────────────────────────\n   rc = fork()  ──────────────────────►    (rc == 0 으로 시작)\n       │                                        │\n   wait(NULL)                                   │  일한다\n       │  Running → '''Blocked'''                    │\n       │  (CPU 를 놓아 준다)                      │\n       │                                    exit(0)\n       │                                        │  상태: '''ZOMBIE'''\n       │  ◄─────── 커널이 깨움 ──────────────────┘\n       │  Blocked → '''Ready''' → Running\n   rc_wait = 29267                          (PCB 해제, 완전히 소멸)\n<\/pre>\n\n# 부모가 `wait()` 호출 → [[프로세스 상태|Blocked]]로 내려간다 (CPU를 다른 프로세스에 양보)\n# 자식이 `exit()` → 자식은 '''`ZOMBIE`''' 상태가 된다. 종료 코드(`xstate`)만 남긴 껍데기\n# 커널이 부모를 '''Ready'''로 올린다\n# 부모가 다시 Running이 되면 `wait()`가 자식의 PID를 반환하고, '''자식의 [[PCB]]가 완전히 해제'''된다\n\n{| class=\"table\"\n! 시스템 콜 || 무엇을 기다리나\n|-\n| `wait(&amp;status)` || '''아무''' 자식 하나가 끝날 때까지\n|-\n| `waitpid(pid, &amp;status, options)` || '''특정''' 자식을, 또는 `WNOHANG`으로 논블로킹 확인\n|}\n\n`wait(NULL)`처럼 인자를 `NULL`로 주면 종료 상태에 관심이 없다는 뜻이다.\n\n== ZOMBIE와 고아 ==\n\n{| class=\"table\"\n! 상황 || 이름 || 결과\n|-\n| 자식이 끝났는데 부모가 `wait()`를 안 함 || '''좀비(zombie)''' || [[struct proc]] 슬롯이 계속 점유됨 → 프로세스 테이블 고갈\n|-\n| 부모가 자식보다 먼저 끝남 || '''고아(orphan)''' || `init`(pid 1)이 입양해서 대신 `wait()` 해 준다\n|}\n\n{tip}\n[[xv6]]의 `enum procstate`에 '''`ZOMBIE`'''가 실재한다는 점이 3강 p.38과 이 문서를 잇는 고리다. 3-상태 모델(Running/Ready/Blocked)에는 없는 상태이며, 순전히 '''부모-자식 관계''' 때문에 필요하다. → [[프로세스 상태]]\n{/tip}\n\n== 예상 문제 ==\n\n{quiz}\n'''(출력 예측)''' `p1.c`(wait 없음)와 `p2.c`(wait 있음)의 출력 순서 중, '''항상 동일하게 보장되는''' 쪽은 어느 것이며 그 이유는?\n{/quiz}\n{answer}\n'''`p2.c`'''. 부모가 `wait()`에서 [[프로세스 상태|Blocked]]되어 자식의 `exit()` 전까지 진행할 수 없으므로, 자식의 출력이 '''반드시''' 부모의 출력보다 앞선다. `p1.c`는 두 프로세스 모두 Ready 상태로 [[스케줄러]]의 선택에 맡겨지므로 순서가 비결정적이다.\n{/answer}\n\n{quiz}\n'''(빈칸)''' `wait()`의 반환값은 __________ 이다. 그래서 `p2.c`에서 `rc`와 `rc_wait`는 __________.\n{/quiz}\n{answer}\n'''끝난 자식의 PID''' / '''같은 값'''이 된다 (자식이 하나뿐이므로).\n{/answer}\n\n{quiz}\n'''(정의 → 용어)''' \"`exit()`은 했지만 부모가 아직 회수하지 않아 [[PCB]]만 남아 있는 프로세스 상태\"를 [[xv6]]의 `enum procstate` 용어로 쓰시오.\n{/quiz}\n{answer}\n'''`ZOMBIE`'''. 부모가 `wait()`를 호출하는 순간 [[struct proc]] 슬롯이 해제되며 완전히 사라진다.\n{/answer}\n\n== 관련 문서 ==\n* [[fork]] / [[exec]] / [[프로세스 API]]\n* [[프로세스 상태]] — `ZOMBIE`, Blocked\n* [[struct proc]] — `parent`, `xstate`, `chan`\n* [[스케줄러]] / [[동시성]]\n* [[OSTEP]] — Chapter 5"
 },
 "프로그램 로딩": {
  "title": "프로그램 로딩 (Compiling, Linking, Loading)",
  "category": [
   "3강 From Program to Process",
   "용어"
  ],
  "body": "'''프로그램 로딩'''은 사람이 쓴 C 코드가 디스크의 실행 파일(ELF)을 거쳐 메모리 위의 [[프로세스]]가 되기까지의 전 과정이다. 3강 p.11~20이 통째로 이 이야기이고, 마지막 슬라이드의 빨간 문장 \"'''Now, OS takes control of running executable (p)!'''\"에서 운영체제 이야기가 시작된다.\n\n{def}\n'''Loading Executable''' (3강 p.19)<br>\n\"'''Loader''' loads executable (`p`) into the main memory (e.g., DRAM).\" 왼쪽은 Executable Object File (in Disk), 오른쪽은 '''Process (= task)''' (in main memory).\n{/def}\n\n{analogy}\n🍳 '''요리책 → 주방 세팅'''. 소스 코드는 손으로 쓴 레시피 초안, 컴파일은 그걸 표준 조리 용어로 옮겨 적는 일, 어셈블은 그 문장을 조리 기계가 읽는 바코드로 바꾸는 일, '''링크'''는 \"소스는 3번 서랍 참고\"처럼 비어 있던 참조를 실제 서랍 번호로 채우는 일이다. 그리고 '''로드'''는 그 완성된 레시피와 재료를 실제로 조리대(=메모리) 위에 꺼내 놓는 일 — 이 순간부터 요리(=프로세스)가 시작된다.\n{/analogy}\n\n== 전체 파이프라인 ==\n\n[[img:L3-13.png|3강 p.13. C program(text) → Compiler → Assembly(text) → Assembler → Object(binary) → Linker → Executable(binary). 링커에는 정적 라이브러리(.a)도 들어간다.|large]]\n\n<pre class=\"sh\">\ngcc -O1 main.c sum.c -o p\n<\/pre>\n\n한 줄 뒤에서 벌어지는 일:\n\n{| class=\"table\"\n! 단계 || 도구 || 입력 → 출력 || 형태\n|-\n| ① 컴파일 || Compiler (`gcc -S`) || `main.c` `sum.c` → `main.s` `sum.s` || text → '''text'''\n|-\n| ② 어셈블 || Assembler (`gcc -c` 또는 `as`) || `.s` → `.o` || text → '''binary'''\n|-\n| ③ 링크 || Linker (`gcc` 또는 `ld`) || `.o` + `.a` → `p` || binary → binary\n|-\n| ④ 로드 || '''Loader''' (+ OS) || `p` → 메모리의 [[프로세스]] || 디스크 → '''메모리'''\n|}\n\n{warn}\n\"'''text → text → binary → binary'''\" 순서를 기억할 것. 어셈블리(`.s`)는 아직 사람이 읽을 수 있는 '''텍스트'''다. 바이너리가 되는 첫 단계는 어셈블러다.<br>\n그리고 ①~③은 [[운영체제란|Compilation System]], ④의 Loader도 슬라이드 분류상 '''Compilation System'''에 속한다 (OS가 아니다!).\n{/warn}\n\n=== ① 컴파일: C → 어셈블리 ===\n\n<pre class=\"c\">\n/* sum.c */\nint sum(int x, int y)\n{\n    int t = x+y;\n    return t;\n}\n<\/pre>\n\n<pre class=\"asm\">\nsum:\n    pushl %ebp\n    movl %esp,%ebp\n    movl 12(%ebp),%eax\n    addl 8(%ebp),%eax\n    popl %ebp\n    ret\n<\/pre>\n\nC 한 줄(`x+y`)이 스택 프레임 설정·인자 로드·덧셈·복귀 등 '''여러 개의 기계 명령'''으로 풀린다는 감각만 잡으면 된다. 반환값이 `%eax`에 담긴다는 관례도 보인다.\n\n=== ② 어셈블: 어셈블리 → 오브젝트 ===\n\n어셈블러가 각 명령어를 '''이진 인코딩'''한다 (`pushl %ebp` → `0x55`, …). 결과인 `.o`는 \"거의 완성된 실행 이미지\"지만 '''다른 파일에 있는 심볼의 주소가 비어 있다''' — `main.o`는 `sum`이 어디 있는지 모른다.\n\n=== ③ 링크: 흩어진 조각 잇기 ===\n\n{def}\n\"Linker combines multiple objects (`.o`) and creates executable (`p`).\" (3강 p.16)\n{/def}\n\n<pre class=\"ascii\">\n   main.c ──(gcc,as)──► main.o ─┐\n                                ├──► Linker (gcc/ld) ──► p\n   sum.c  ──(gcc,as)──► sum.o  ─┤                         (fully linked\n                                │                          executable)\n   libc.a (printf 등) ──────────┘\n<\/pre>\n\n링킹의 실체는 '''재배치(relocation)'''다 (3강 p.18): 각 `.o`의 `.text`끼리, `.data`끼리 모아 실행 파일의 한 덩어리로 합치고, 그 과정에서 비어 있던 심볼 주소를 실제 값으로 채운다.\n\n{tip}\n0831 녹음본에서 교수님이 링킹이 왜 필요한지 설명한 대목: \"when we call the `sum` function, we need to know about the '''address''' of the buffer data because we need to pass them into the sum function, but we don't have any information about the sum function in the main function. So '''we can't generate the call instruction''' to the sum function. That is the reason we need to '''link'''.\"\n{/tip}\n\n== ELF: 실행 파일의 내부 구조 ⭐ ==\n\n[[img:L3-17.png|3강 p.17. ELF header / Segment header table / .text / .rodata / .data / .bss / .symtab / .rel.txt / .rel.data / .debug / Section header table.|large]]\n\n{| class=\"table\"\n! 섹션 || 내용 || 예\n|-\n| '''ELF header''' || byte ordering, file type(.o/exec/.so), machine type || IA32인지 [[RISC-V]]인지\n|-\n| '''Segment header table''' || page size, 가상 주소, 세그먼트 크기 (실행 파일에 필수) ||\n|-\n| '''`.text`''' || '''코드''' (기계어) || `main`, `sum`\n|-\n| '''`.rodata`''' || 읽기 전용 데이터 || 문자열 상수, switch 점프 테이블\n|-\n| '''`.data`''' || '''초기화된''' 전역 변수 || `int buf[2]={1,2}`\n|-\n| '''`.bss`''' || '''초기화 안 된''' 전역 변수. \"Holds variables that don't have any value yet\", '''Occupies no space''' || `static int t`\n|-\n| `.symtab` / `.debug` / `.rel.*` || 심볼 테이블, 디버그 정보, 재배치 정보 ||\n|}\n\n{warn}\n'''`.data` vs `.bss`는 최다 출제 포인트다.'''<br>\n· `.data` = 초기값이 있는 전역 → 그 값을 '''파일에 저장해야 하므로 공간을 차지'''<br>\n· `.bss` = 초기값이 없는 전역 → 저장할 값이 없으니 \"크기가 얼마\"라는 정보만 두고 '''파일에서 공간을 차지하지 않는다'''(occupies no space). 로드될 때 0으로 채워진다.<br>\n\"`.bss`도 실행 파일에서 자리를 차지한다\"는 틀린 문장이다.\n{/warn}\n\n== ④ 로딩: 프로그램이 프로세스가 되는 순간 ⭐⭐ ==\n\n[[img:L3-19.png|3강 p.19. 왼쪽 실행 파일이 오른쪽 메모리 배치로 옮겨진다. 맨 아래 빨간 글씨 \"Now, OS takes control of running executable (p)!\"|large]]\n\n<pre class=\"ascii\">\n   0x100000000 ┌─────────────────────────────┐\n               │   Kernel virtual memory     │   OS 영역\n               ├─────────────────────────────┤\n               │   User stack                │ ← %esp (스택 포인터)\n               │   (created at runtime)      │   아래로 성장 ↓\n               ├─────────────────────────────┤\n               │                             │\n               │      (빈 공간)               │\n               │                             │\n               ├─────────────────────────────┤\n               │   Run-time heap             │ ← brk\n               │   (created by malloc)       │   위로 성장 ↑\n               ├─────────────────────────────┤  ┐\n               │   Read/write segment        │  │\n               │   (.data, .bss)             │  │ Loaded from\n               ├─────────────────────────────┤  │ the executable\n               │   Read-only segment         │  │ file\n    0x08048000 │   (.init, .text, .rodata)   │  ┘\n               ├─────────────────────────────┤\n             0 │   Unused                    │\n               └─────────────────────────────┘\n<\/pre>\n\n* 실행 파일에서 '''그대로 옮겨오는''' 것: read-only segment(`.init`/`.text`/`.rodata`)와 read/write segment(`.data`/`.bss`)\n* 실행 파일에 '''없고 런타임에 만들어지는''' 것: '''[[스택|User stack]]'''과 '''[[힙|Run-time heap]]'''\n* 주소가 가장 낮은 곳은 Unused — 널 포인터 역참조를 잡기 위해 일부러 비워 둔다\n* [[스택 포인터|%esp]]가 stack의 꼭대기를, `brk`가 heap의 경계를 가리킨다\n\n{warn}\n'''\"`.bss`는 파일에서 공간을 차지하지 않는다\"와 \"메모리에서 공간을 차지하지 않는다\"는 다른 말이다.''' 메모리에는 당연히 자리를 잡고 0으로 채워진다. 차지하지 않는 건 '''디스크의 실행 파일''' 쪽이다.\n{/warn}\n\n{tip}\n0831 녹음본, 로더가 배치 순서를 보존한다는 설명: \"if you build the code section like this — system code, then main function, then sum function, then other system code — this will be '''copied into this region/segment''' … the '''order will be preserved''' after loading.\"\n{/tip}\n\n== 한 장으로 보는 요약 ==\n\n[[img:L3-20.png|3강 p.20. Code(HDD) →Compiler&Linker→ Executable=Program(HDD) →Loader→ Process(Memory) → Processor가 Control Flow를 실행. 이 과목 3강의 요약도.|large]]\n\n{| class=\"table\"\n! 어디에 || 무엇이 || 이름\n|-\n| HDD || `main.c`, `sum.c` || 소스 코드\n|-\n| HDD || ELF 파일 `p` || '''Program''' (= Executable)\n|-\n| Memory || 주소 공간 (stack/heap/data/code) || '''Process'''\n|-\n| Processor || `inst1`, `inst2`, … || '''Control flow'''\n|}\n\n{warn}\n'''프로그램과 프로세스를 가르는 선이 바로 Loader다.''' 로더 왼쪽은 디스크 위의 정적인 바이트, 오른쪽은 메모리 위의 살아 있는 실행 주체. 3강 전체가 이 한 칸을 설명하기 위한 것이다. → [[프로세스]]\n{/warn}\n\n== Lazy loading ==\n\n프로세스 생성 1단계의 단서 조항 (3강 p.32): \"OS performs the loading process '''lazily''' — loading pieces of code or data '''only as they are needed''' during program execution.\"\n\n즉 실제로는 실행 파일 전체를 한 번에 올리지 않는다. 필요한 페이지만 그때그때 올린다(demand paging). 이 문장이 중간고사 이후 가상 메모리 단원의 복선이다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(순서)''' `gcc -O1 main.c sum.c -o p` 가 수행하는 단계를 도구 이름과 입출력 파일 형식(text/binary)까지 포함해 순서대로 쓰시오.\n{/quiz}\n{answer}\n① '''Compiler'''(`gcc -S`): `.c`(text) → `.s`(text)<br>\n② '''Assembler'''(`gcc -c`/`as`): `.s`(text) → `.o`('''binary''')<br>\n③ '''Linker'''(`gcc`/`ld`): `.o` + 정적 라이브러리 `.a` → 실행 파일 `p`(binary)<br>\n(그리고 실행 시 ④ '''Loader'''가 `p`를 메모리에 올려 [[프로세스]]로 만든다.)\n{/answer}\n\n{quiz}\n'''(O/X)''' \"`.bss` 섹션은 초기화되지 않은 전역 변수를 담으며, 실행 파일에서 그 크기만큼의 공간을 차지한다.\"\n{/quiz}\n{answer}\n'''X.''' 앞부분은 맞지만 뒷부분이 틀렸다. 슬라이드 원문은 \"'''Occupies no space'''\" — 저장할 값이 없으므로 '''파일에서는''' 공간을 차지하지 않고, 로드될 때 메모리에 0으로 채워진다.\n{/answer}\n\n{quiz}\n'''(개념)''' 로드된 프로세스의 메모리 이미지 중, 실행 파일에서 그대로 복사되지 '''않고''' 런타임에 새로 만들어지는 영역 두 개를 쓰시오.\n{/quiz}\n{answer}\n'''User stack'''(created at runtime)과 '''Run-time heap'''(created by `malloc`). 실행 파일에서 오는 것은 read-only segment(`.init`/`.text`/`.rodata`)와 read/write segment(`.data`/`.bss`)뿐이다.\n{/answer}\n\n== 관련 문서 ==\n* [[프로세스]] — 로딩의 결과물\n* [[주소 공간]] — 로드된 메모리 배치의 상세\n* [[스택]] / [[힙]] / [[스택 포인터]]\n* [[exec]] — 실행 중에 로딩을 다시 하는 시스템 콜\n* [[운영체제란]] — Compilation System / Runtime System 분류\n* [[OS 역사]] — stored program computer"
 },
 "주소 공간": {
  "title": "주소 공간 (Address Space)",
  "category": [
   "3강 From Program to Process",
   "용어"
  ],
  "body": "'''주소 공간'''(Memory Address Space)은 [[프로세스]]를 구성하는 두 축 중 하나로, 그 프로세스가 접근할 수 있는 메모리의 전부다. 나머지 한 축인 control flow가 \"무엇을 실행하는가\"라면, 주소 공간은 \"무엇을 만질 수 있는가\"다.\n\n{def}\n'''Memory Address Space''' (3강 p.23)<br>\n\"Process includes two key abstractions: ① '''Control flow''' (a.k.a thread), ② '''Memory address space''' — '''set of rights''' of a process (to access the memory). Each process has an '''exclusive''' address space.\"\n{/def}\n\n{tip}\n0831 녹음본에서 교수님이 \"please remember\"를 붙여 강조한 문장: \"'''the memory address space is actually related to the set of rights of the process''', and it is a key concept in the '''protection'''.\"<br>\n→ 주소 공간은 \"메모리 덩어리\"가 아니라 '''접근 권한의 집합'''이다. 정의를 물으면 이 표현을 쓸 것.\n{/tip}\n\n{analogy}\n🏨 '''호텔 객실'''이다. 손님(프로세스)은 자기 카드키로 열리는 방 안에서는 뭐든 할 수 있지만, 옆방 문은 열리지 않는다. 그리고 재미있는 건 — 모든 손님이 자기 방을 \"101호\"라고 부른다. 각자의 카드키가 실제로는 서로 다른 물리적 문에 매핑되기 때문이다. 이것이 [[가상화|가상 주소]]다. 카드키 매핑표를 관리하는 프런트가 [[커널|OS]]다.\n{/analogy}\n\n== 배치 ==\n\n[[img:L3-25.png|3강 p.25. 왼쪽 Memory 안의 프로세스 주소 공간과, 오른쪽에서 그 명령어를 Fetch-Decode-Execute하는 CPU. \"프로세스 = 주소 공간 + 제어 흐름\" 그림.|large]]\n\n<pre class=\"ascii\">\n      N ┌─────────────────────────────┐\n        │   Kernel virtual memory     │   커널 영역 (유저는 접근 불가)\n        ├─────────────────────────────┤\n        │   User stack                │   지역 변수, 함수 인자, 리턴 주소\n        │            ↓                │   아래로 성장\n        ├─────────────────────────────┤\n        │                             │\n        │        (빈 공간)             │   stack 과 heap 이 서로를 향해 자란다\n        │                             │\n        ├─────────────────────────────┤\n        │            ↑                │   위로 성장\n        │   Heap                      │   malloc / free\n        ├─────────────────────────────┤\n        │   Read/write segment        │   .data (초기화된 전역)\n        │   (.data, .bss)             │   .bss  (미초기화 전역)\n        ├─────────────────────────────┤\n        │   Read-only segment         │   .init .text .rodata\n        │   (e.g., code)              │   코드와 상수\n      0 └─────────────────────────────┘\n<\/pre>\n\n{| class=\"table\"\n! 영역 || 무엇이 || 언제 생기나 || 권한\n|-\n| Kernel virtual memory || OS 코드·자료구조 || 부팅 시 || 유저 모드에서 접근 불가\n|-\n| '''[[스택|User stack]]''' || 지역 변수, 함수 인자, 리턴 주소 || '''런타임''' (created at runtime) || R/W\n|-\n| '''[[힙|Heap]]''' || `malloc()`으로 잡은 동적 데이터 || '''런타임''' (created by malloc) || R/W\n|-\n| Read/write segment || `.data`, `.bss` || 로드 시 (실행 파일에서) || R/W\n|-\n| Read-only segment || `.init`, `.text`, `.rodata` || 로드 시 (실행 파일에서) || '''읽기 전용'''\n|}\n\n{warn}\n'''stack과 heap만 런타임에 만들어진다.''' 나머지는 실행 파일에서 그대로 복사된다. \"실행 파일에 없는데 프로세스에는 있는 것\"을 묻는 문제의 답이 이 둘이다. → [[프로그램 로딩]]\n{/warn}\n\n{warn}\n코드 영역이 '''읽기 전용'''인 것은 우연이 아니다. 자기 코드를 수정할 수 없게 해야 보안과 [[OS 설계 목표|protection]]이 성립하고, 덕분에 같은 프로그램을 여러 번 실행해도 '''코드 페이지는 물리적으로 공유'''할 수 있다.\n{/warn}\n\n{tip}\n0831 녹음본, 왜 이 구분이 최적화로 이어지는가: \"you can have the same read/write segments and the same read-only segments for multiple programs. But some internal data, dynamic data like '''stack and heap would be different''' … this characteristic is some key characteristic that we can '''optimize the memory space management'''.\"\n{/tip}\n\n== 왜 \"가상\" 주소 공간인가 ==\n\n{def}\n'''Virtualization''' (3강 p.26)<br>\n\"OS provides two key virtualization for each process:<br>\n· '''Logical control flow''' — Each program '''seems''' to have exclusive use of the CPU (+ stack)<br>\n· '''Private virtual address space''' — Each program '''seems''' to have exclusive use of main memory\"\n{/def}\n\n[[img:L2-20.png|2강 p.20. 각 Task는 자기만의 private virtual memory를 보고, OS가 그것을 물리 메모리의 서로 다른 영역에 매핑한다.|large]]\n\n2강의 `mem.c` 데모가 증거다. 같은 프로그램을 두 번 띄우면 '''둘 다 `0x00200000`'''을 출력하는데, 값은 서로 독립적으로 증가한다.\n\n<pre class=\"sh\">\nprompt> ./mem &; ./mem &\n(24113) memory address of p: 00200000\n(24114) memory address of p: 00200000     ← 같은 주소\n(24113) p: 1\n(24114) p: 1\n(24114) p: 2\n(24113) p: 2\n<\/pre>\n\n{warn}\n'''\"주소가 같으면 같은 메모리\"라는 직관이 깨지는 지점이다.''' 프로그램이 보는 것은 전부 '''가상 주소'''이고, 물리 주소로의 변환(address translation)은 OS와 하드웨어(page/segment table)가 몰래 처리한다. → [[가상화]]\n{/warn}\n\n== 주소 공간과 프로세스의 관계 ==\n\n<pre class=\"ascii\">\n   프로세스 = Control flow  +  Address space\n              ───────────      ─────────────\n              \"무엇을 실행\"      \"무엇을 만질 수 있나\"\n              PC, 레지스터       stack/heap/data/code\n              exclusive         exclusive\n              ↓                 ↓\n              logical           private virtual\n              control flow      address space\n              (CPU 독점 착각)     (메모리 독점 착각)\n<\/pre>\n\n* [[fork]] → 주소 공간이 '''복사'''된다\n* [[exec]] → 주소 공간이 '''폐기되고 새로 만들어진다'''\n* [[스레드]] → 같은 주소 공간을 '''공유'''한다 (그래서 [[race condition]]이 생긴다)\n\n{tip}\n[[스레드]]와 [[프로세스]]의 차이가 정확히 여기서 갈린다. 스레드는 control flow는 따로 갖지만 주소 공간은 공유한다. 그래서 8강의 `counter++` 문제가 성립하는 것이다. → [[스레드와 프로세스 비교]]\n{/tip}\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"프로세스가 메모리에 접근할 수 있는 '''권한의 집합'''이며, 각 프로세스가 배타적으로 갖는 것\"은?\n{/quiz}\n{answer}\n'''Memory address space'''(주소 공간). 슬라이드 원문 \"'''set of rights''' of a process (to access the memory)\"를 쓸 수 있으면 만점.\n{/answer}\n\n{quiz}\n'''(개념)''' 주소 공간의 다섯 영역 중, 실행 파일에서 복사되는 것이 아니라 '''런타임에 생성'''되는 것 두 개를 고르고 그 이유를 한 문장으로 쓰시오.\n{/quiz}\n{answer}\n'''User stack'''과 '''Heap'''. 함수 호출 깊이와 `malloc` 요청량은 '''실행해 봐야 알 수 있는''' 동적 정보라서 실행 파일에 미리 담을 수 없기 때문이다.\n{/answer}\n\n{quiz}\n'''(서술)''' `./mem`을 두 개 띄웠더니 둘 다 `p`의 주소로 `0x00200000`을 출력했다. 두 프로세스가 같은 메모리를 공유하는가? 한 문장으로 답하시오.\n{/quiz}\n{answer}\n'''아니다.''' 출력된 것은 '''가상 주소'''이며, OS가 두 프로세스의 동일한 가상 주소를 서로 다른 물리 주소로 매핑하므로 값이 독립적으로 증가한다.\n{/answer}\n\n== 관련 문서 ==\n* [[프로세스]] — 주소 공간 + control flow\n* [[프로그램 로딩]] — 이 배치가 만들어지는 과정\n* [[스택]] / [[힙]] / [[스택 포인터]]\n* [[가상화]] — private virtual address space\n* [[fork]] / [[exec]] — 주소 공간의 복사와 교체\n* [[스레드]] / [[스레드와 프로세스 비교]] — 주소 공간을 공유하면 벌어지는 일\n* [[유저 모드와 커널 모드]] — kernel virtual memory에 손댈 수 없는 이유"
 },
 "시스템 콜 추가 절차": {
  "title": "시스템 콜 추가 절차 (xv6에 syscall 하나 붙이기)",
  "category": [
   "3강 From Program to Process",
   "과제1",
   "용어"
  ],
  "body": "'''시스템 콜 추가 절차'''는 [[xv6]]에 새 [[시스템 콜]] 하나를 붙이기 위해 손대야 하는 파일과 그 순서다. 과제 1([[과제1 xv6 alarm]])의 전반부가 통째로 이 작업이고, 여기서 막히면 [[sigalarm]]/[[sigreturn]] 구현은 시작조차 못 한다.\n\n{warn}\n'''과제 안내문의 p.30~34 지시에 대하여.''' Assignment 1 PDF의 Tips 1은 \"First, fix this regarding the '''3-From_Program_to_Process (30p-34p)'''\"라고 쓰여 있다. 그런데 현재 배포된 3강 PDF의 p.30~34는 mechanism/policy · [[프로세스 API]] · 프로세스 생성 · [[프로세스 상태]]이고, '''시스템 콜을 추가하는 구체적 절차는 슬라이드에 없다'''.<br>\nTA가 가리킨 것은 [[프로세스 API]] 장(= \"OS는 시스템 콜이라는 인터페이스로 서비스를 노출한다\")으로 보이며, 실제 절차는 [[xv6]] 소스에서 기존 시스템 콜(`sys_getpid` 등)을 흉내 내며 익혀야 한다. 이 문서가 그 빈칸을 메운다.\n{/warn}\n\n{analogy}\n🏢 '''관공서에 새 민원 창구를 여는 일'''이다. ① 민원 안내책자에 항목을 추가하고(`user.h`) ② 접수 번호표 기계에 버튼을 만들고(`usys.pl`) ③ 내부 문서번호를 부여하고(`syscall.h`) ④ 문서번호 → 담당 부서 배정표에 한 줄 넣고(`syscall.c`) ⑤ 담당 부서에 실제로 일할 직원을 앉히고(`sysproc.c`) ⑥ 그 업무에 필요한 서류철을 민원인 파일에 끼운다(`proc.h`/`proc.c`). 여섯 군데 중 하나라도 빠지면 \"그런 창구 없습니다\"(링크 에러)나 \"담당자가 없습니다\"(unknown sys call)가 뜬다.\n{/analogy}\n\n== 전체 그림 ==\n\n<pre class=\"ascii\">\n  ┌─ user space ────────────────────────────────────────────────┐\n  │                                                             │\n  │  alarmtest.c                                                │\n  │     sigalarm(2, periodic);                                  │\n  │          │                                                  │\n  │          │ ① user/user.h      : 함수 선언                    │\n  │          ▼                                                  │\n  │  usys.S (자동 생성)                                          │\n  │     sigalarm:  li a7, SYS_sigalarm                          │\n  │                ecall                                        │\n  │                ret         ② user/usys.pl 이 이 스텁을 생성   │\n  └──────────────┬──────────────────────────────────────────────┘\n                 │  ecall  → 트랩 → uservec → usertrap()\n  ┌──────────────▼──────────────────────────────────────────────┐\n  │  kernel space                                               │\n  │                                                             │\n  │  usertrap()  →  syscall()                                   │\n  │                    num = p->trapframe->a7;                  │\n  │                    p->trapframe->a0 = syscalls[num]();       │\n  │                         │                                   │\n  │                         │ ③ kernel/syscall.h : SYS_sigalarm 번호 │\n  │                         │ ④ kernel/syscall.c : 테이블에 등록  │\n  │                         ▼                                   │\n  │                    sys_sigalarm()   ⑤ kernel/sysproc.c      │\n  │                         │                                   │\n  │                         ▼                                   │\n  │                    p->alarm_interval = ...   ⑥ kernel/proc.h│\n  └─────────────────────────────────────────────────────────────┘\n<\/pre>\n\n== 파일별 체크리스트 ==\n\n=== ① `user/user.h` — 유저가 부를 함수 선언 ===\n\n과제 안내문이 문구까지 지정해 준다.\n\n<pre class=\"c\">\n// system calls\nint fork(void);\nint exit(int) __attribute__((noreturn));\nint wait(int*);\n...\nint sigalarm(int ticks, void (*handler)());\nint sigreturn(void);\n<\/pre>\n\n{warn}\n`void (*handler)()`는 '''함수 포인터''' 타입이다. 여기를 `int handler`로 대충 쓰면 `alarmtest.c`가 컴파일되지 않는다 (원본 테스트 코드를 고치면 안 된다).\n{/warn}\n\n=== ② `user/usys.pl` — 스텁 어셈블리 생성기 ===\n\n이 Perl 스크립트가 빌드 때 `user/usys.S`를 만들어 낸다. 한 줄만 추가하면 된다.\n\n<pre class=\"sh\">\nentry(\"fork\");\nentry(\"exit\");\nentry(\"wait\");\n...\nentry(\"sigalarm\");\nentry(\"sigreturn\");\n<\/pre>\n\n생성되는 어셈블리는 이런 모양이다.\n\n<pre class=\"asm\">\n.global sigalarm\nsigalarm:\n li a7, SYS_sigalarm      # 시스템 콜 번호를 a7 에\n ecall                    # 트랩 발생 → 커널 진입\n ret                      # 반환값은 a0 에 들어 있다\n<\/pre>\n\n{tip}\n'''이 세 줄이 시스템 콜의 전부다.''' 번호를 `a7`에 싣고, `ecall`로 [[트랩]]을 일으키고, 돌아오면 [[a0]]에 결과가 있다. 4강에서 배우는 [[제한적 직접 실행]]의 유저 쪽 절반이 바로 여기다. → [[usys.pl]], [[xv6 시스템 콜 경로]]\n{/tip}\n\n=== ③ `kernel/syscall.h` — 번호 부여 ===\n\n<pre class=\"c\">\n#define SYS_fork    1\n#define SYS_exit    2\n#define SYS_wait    3\n...\n#define SYS_close  21\n#define SYS_sigalarm  22\n#define SYS_sigreturn 23\n<\/pre>\n\n{warn}\n'''기존 번호를 재사용하거나 중간에 끼워 넣지 말 것.''' 번호는 `syscalls[]` 배열의 '''인덱스'''이므로, 끼워 넣으면 다른 시스템 콜이 전부 밀려 `usertests`가 통째로 깨진다. 반드시 '''마지막 번호 다음'''을 쓴다.\n{/warn}\n\n=== ④ `kernel/syscall.c` — 테이블 등록 (두 군데) ===\n\n<pre class=\"c\">\n// (1) extern 선언 추가\nextern uint64 sys_close(void);\nextern uint64 sys_sigalarm(void);\nextern uint64 sys_sigreturn(void);\n\n// (2) 함수 포인터 테이블에 등록\nstatic uint64 (*syscalls[])(void) = {\n[SYS_fork]      sys_fork,\n[SYS_exit]      sys_exit,\n...\n[SYS_close]     sys_close,\n[SYS_sigalarm]  sys_sigalarm,\n[SYS_sigreturn] sys_sigreturn,\n};\n<\/pre>\n\n그리고 디스패치를 실제로 하는 함수가 이것이다.\n\n<pre class=\"c\">\nvoid\nsyscall(void)\n{\n  int num;\n  struct proc *p = myproc();\n\n  num = p->trapframe->a7;                       // ← 번호는 a7 에서 꺼낸다\n  if(num > 0 && num < NELEM(syscalls) && syscalls[num]) {\n    p->trapframe->a0 = syscalls[num]();         // ← 반환값은 a0 에 넣는다\n  } else {\n    printf(\"%d %s: unknown sys call %d\\n\", p->pid, p->name, num);\n    p->trapframe->a0 = -1;\n  }\n}\n<\/pre>\n\n{exam}\n'''`p->trapframe->a0 = syscalls[num]();` 이 한 줄이 2026-09-23 퀴즈 4번의 정답 근거다.'''<br>\n[[sigreturn]]이 `return 0;`을 하면 커널이 그 0을 `p->trapframe->a0`에 '''덮어쓴다'''. 그런데 `sys_sigreturn`은 방금 `*p->trapframe = p->alarm_saved;`로 원래 문맥을 복원한 참이므로, 애써 복원한 [[a0]]가 0으로 날아간다. 그래서 정답은 `return 0;` 대신 '''`return p->trapframe->a0;`'''. → [[a0 복원]], [[퀴즈1 복기]]\n{/exam}\n\n=== ⑤ `kernel/sysproc.c` — 실제 구현 ===\n\n인자를 꺼내는 방법은 기존 시스템 콜을 흉내 내면 된다 (과제 안내문: \"You can find how we can get the argument of the system call by analyzing the implementation of the other system calls\").\n\n<pre class=\"c\">\n// 인자 꺼내는 헬퍼들\n//   argint(n, &ip)   : n 번째 인자를 int 로\n//   argaddr(n, &ap)  : n 번째 인자를 uint64 주소로\n//   argstr(n, buf, max) : 문자열로\n\nuint64\nsys_sigalarm(void)\n{\n  int interval;\n  uint64 handler;\n\n  argint(0, &interval);        // 첫 번째 인자: ticks\n  argaddr(1, &handler);        // 두 번째 인자: 함수 포인터\n\n  struct proc *p = myproc();\n  p->alarm_interval = interval;\n  p->alarm_handler  = handler;\n  p->alarm_elapsed  = 0;       // 카운터 리셋\n  return 0;\n}\n\nuint64\nsys_sigreturn(void)\n{\n  struct proc *p = myproc();\n  *p->trapframe = p->alarm_saved;   // 인터럽트당한 문맥 통째 복원\n  p->alarm_active = 0;              // 재진입 금지 해제\n  p->alarm_elapsed = 0;\n  return p->trapframe->a0;          // ← a0 를 보존하려면 이렇게\n}\n<\/pre>\n\n{warn}\n인자는 '''레지스터가 아니라 [[trapframe]]에서''' 꺼낸다. 유저가 `a0`, `a1`에 실어 보낸 값이 트랩 시점에 [[trapframe]]으로 저장됐기 때문이다. 그래서 `argint`/`argaddr`는 내부적으로 `p->trapframe->a0`, `->a1`을 읽는다.\n{/warn}\n\n=== ⑥ `kernel/proc.h` + `kernel/proc.c` — 프로세스별 상태 ===\n\n시스템 콜이 프로세스마다 기억해야 할 것이 있으면 [[struct proc]]에 필드를 추가한다.\n\n<pre class=\"c\">\n// kernel/proc.h : struct proc 끝부분\n  // --- Assignment 1: alarm ---\n  int alarm_interval;            // sigalarm(n, fn) 의 n\n  uint64 alarm_handler;          // sigalarm(n, fn) 의 fn\n  int alarm_elapsed;             // 마지막 알람 이후 흐른 tick\n  int alarm_active;              // 핸들러 실행 중이면 1\n  struct trapframe alarm_saved;  // 값 복사본 (포인터 아님!)\n<\/pre>\n\n<pre class=\"c\">\n// kernel/proc.c : allocproc() 의 found: 레이블 뒤\n  p->alarm_interval = 0;\n  p->alarm_handler  = 0;\n  p->alarm_elapsed  = 0;\n  p->alarm_active   = 0;\n  memset(&p->alarm_saved, 0, sizeof(p->alarm_saved));\n<\/pre>\n\n과제 안내문도 같은 곳을 지목한다: \"You can initialize proc fields in '''`allocproc()`''' in `proc.c`.\"\n\n=== ⑦ (과제 한정) `Makefile` — 테스트 프로그램 등록 ===\n\n<pre class=\"sh\">\nUPROGS=\\\n\t$U/_cat\\\n\t$U/_echo\\\n\t...\n\t$U/_alarmtest\\\n<\/pre>\n\n과제 안내문의 첫 힌트가 이것이다: \"You'll need to modify the '''Makefile''' to cause `alarmtest.c` to be compiled as an xv6 user program.\" → [[alarmtest]]\n\n== 순서 요약 ==\n\n{| class=\"table\"\n! # || 파일 || 넣는 것 || 빠뜨리면\n|-\n| ① || `user/user.h` || 함수 프로토타입 || 컴파일 에러 (implicit declaration)\n|-\n| ② || `user/usys.pl` || `entry(\"이름\");` || '''링크 에러''' (undefined reference)\n|-\n| ③ || `kernel/syscall.h` || `#define SYS_이름 번호` || `syscall.c`에서 심볼 없음\n|-\n| ④ || `kernel/syscall.c` || `extern` 선언 + `syscalls[]` 등록 || 런타임에 \"'''unknown sys call'''\"\n|-\n| ⑤ || `kernel/sysproc.c` || `sys_이름()` 본체 || 링크 에러\n|-\n| ⑥ || `kernel/proc.h`, `proc.c` || 필드 추가 + `allocproc()` 초기화 || 쓰레기 값으로 오동작\n|-\n| ⑦ || `Makefile` || `$U/_alarmtest\\` || `alarmtest` 명령이 없음\n|}\n\n{warn}\n'''증상으로 어디를 빠뜨렸는지 역추적하기''' — 시험·디버깅 모두에서 유용하다.<br>\n· `undefined reference to 'sigalarm'` → ② `usys.pl`<br>\n· `unknown sys call 22` → ④ `syscall.c` 테이블<br>\n· 컴파일은 되는데 값이 이상함 → ⑥ `allocproc()` 초기화\n{/warn}\n\n== 예상 문제 ==\n\n{quiz}\n'''(나열)''' [[xv6]]에 새 시스템 콜 `sigalarm`을 추가할 때 수정해야 하는 파일을 모두 쓰고, 각 파일에 무엇을 넣는지 한 줄씩 쓰시오.\n{/quiz}\n{answer}\n① `user/user.h` — 함수 프로토타입<br>\n② `user/usys.pl` — `entry(\"sigalarm\");` (a7 세팅 + `ecall` 스텁 생성)<br>\n③ `kernel/syscall.h` — `#define SYS_sigalarm 22`<br>\n④ `kernel/syscall.c` — `extern uint64 sys_sigalarm(void);` + `syscalls[]` 배열 등록<br>\n⑤ `kernel/sysproc.c` — `sys_sigalarm()` 본체 (`argint`/`argaddr`로 인자 획득)<br>\n⑥ `kernel/proc.h` / `proc.c` — [[struct proc]] 필드 추가 + `allocproc()` 초기화<br>\n(+ 과제에서는 `Makefile`에 `$U/_alarmtest\\`)\n{/answer}\n\n{quiz}\n'''(코드 빈칸)''' `kernel/syscall.c`의 `syscall()` 함수에서 빈칸을 채우시오.\n<pre class=\"c\">\nnum = p->trapframe->________;\nif(num > 0 && num < NELEM(syscalls) && syscalls[num]) {\n  p->trapframe->________ = syscalls[num]();\n}\n<\/pre>\n{/quiz}\n{answer}\n첫 번째 = '''`a7`''' (시스템 콜 번호), 두 번째 = '''`a0`''' (반환값).<br>\n\"번호는 a7으로 들어가고 결과는 a0로 나온다\"가 [[RISC-V]] 호출 규약의 핵심이다.\n{/answer}\n\n{quiz}\n'''(디버깅)''' `sigalarm`을 추가했더니 xv6 부팅 후 `alarmtest` 실행 시 `unknown sys call 22`가 출력된다. 어느 파일의 무엇을 빠뜨렸는가?\n{/quiz}\n{answer}\n'''`kernel/syscall.c`의 `syscalls[]` 배열 등록'''이다. 번호(`syscall.h`)와 유저 스텁(`usys.pl`)은 정상이라 `ecall`은 번호 22를 들고 커널에 도달했지만, 테이블에 `[SYS_sigalarm] sys_sigalarm,` 항목이 없어 `syscalls[22]`가 NULL이므로 else 분기로 빠진 것이다.\n{/answer}\n\n== 관련 문서 ==\n* [[시스템 콜]] / [[프로세스 API]]\n* [[과제1 xv6 alarm]] / [[sigalarm]] / [[sigreturn]] / [[alarmtest]]\n* [[struct proc]] / [[myproc]] / [[usys.pl]]\n* [[xv6 시스템 콜 경로]] / [[트랩]] / [[usertrap]] / [[trapframe]]\n* [[a0]] / [[a0 복원]] / [[RISC-V]] / [[xv6]]\n* [[퀴즈1 복기]]"
 },
 "프로세스 목록": {
  "title": "프로세스 목록 (Process List)",
  "category": [
   "3강 From Program to Process",
   "용어"
  ],
  "body": "'''프로세스 목록'''(Process list)은 OS가 시스템 안의 모든 프로세스를 추적하기 위해 유지하는 자료구조다. [[PCB]]가 \"프로세스 한 명의 차트\"라면 프로세스 목록은 \"그 차트들을 꽂아 둔 진료 대기 명부\"다.\n\n{def}\n'''Data Structures''' (3강 p.36)<br>\n\"The OS has some key data structures that track various relevant pieces of information for processes\"<br>\n· '''Process list''' for all processes<br>\n&nbsp;&nbsp;- '''Ready''' processes<br>\n&nbsp;&nbsp;- '''Blocked''' processes<br>\n&nbsp;&nbsp;- '''Current running''' process<br>\n· '''Register context''' — Data &amp; stack registers, Program counter, …<br>\n· '''Process Control Block (PCB)'''\n{/def}\n\n{exam}\n이 \"Data Structures\" 슬라이드는 2025F 중간고사 '''Problem 2''' 해설에 그대로 실려 있다. process list의 '''세 갈래'''(ready / blocked / current running)를 나열하는 문제로 나오기 쉽다. → [[2025F 중간고사 족보]]\n{/exam}\n\n{analogy}\n🏥 병원 접수대의 '''세 개의 바구니'''다. ① '''대기 명부'''(Ready) — 이름 부르면 바로 들어올 수 있는 환자들. 의사는 여기서만 고른다. ② '''검사 나간 명부'''(Blocked) — 엑스레이실에 간 환자들. 검사 끝났다는 연락이 오면 여기서 꺼내 대기 명부로 옮긴다. ③ '''지금 진료 중'''(Running) — 딱 한 장(코어당). 다음 환자를 부르려면 이 사람을 어디로 보낼지부터 정해야 한다.\n{/analogy}\n\n== 세 갈래와 그 용도 ==\n\n{| class=\"table\"\n! 목록 || 담긴 것 || 누가 꺼내 가나 || 언제 들어오나\n|-\n| '''Ready''' || 돌 준비가 된 프로세스 || '''[[스케줄러]]''' — 다음 실행 대상을 여기서 고른다 || Descheduled, 또는 I/O done\n|-\n| '''Blocked''' || I/O 등을 기다리는 프로세스 || 디바이스 [[인터럽트]] 핸들러 — 완료된 것을 찾아 Ready로 옮긴다 || I/O initiate\n|-\n| '''Current running''' || 지금 CPU 위의 프로세스 (코어당 1개) || [[컨텍스트 스위치]] — 누구를 저장해야 하는지 || Scheduled\n|}\n\n<pre class=\"ascii\">\n                    ┌──────────────────────────────┐\n                    │  Current running  (코어당 1)  │\n                    └──────────────────────────────┘\n                        ▲                    │\n         Scheduled      │                    │   Descheduled\n         (스케줄러가 선택) │                    │   (time slice 만료 등)\n                        │                    ▼\n   ┌────────────────────┴──────────────────────────┐\n   │  Ready list     [P3] [P7] [P9] ...            │ ← 스케줄러가 고르는 곳\n   └───────────────────────────────────────────────┘\n                        ▲                    │\n          I/O done      │                    │   I/O initiate\n   (디바이스 인터럽트)     │                    ▼\n   ┌────────────────────┴──────────────────────────┐\n   │  Blocked list   [P1 chan=disk] [P4 chan=...]  │\n   └───────────────────────────────────────────────┘\n<\/pre>\n\n{tip}\n0831 녹음본에서 교수님이 세 목록의 '''용도'''를 하나씩 설명한 부분:<br>\n\"they need to maintain the list of the '''ready''' process to find out '''which process can be scheduled''' by the scheduling policy. And also the list of '''blocked''' process to find out '''which process's I/O request is finished'''. And also the '''current running''' process to find out '''which process should be descheduled'''.\"<br>\n→ 세 목록이 각각 어떤 질문에 답하는지를 묶어서 외우면 나열 문제에서 절대 빠뜨리지 않는다.\n{/tip}\n\n== xv6에서는 어떻게 생겼나 ==\n\n[[xv6]]는 세 개의 연결 리스트를 따로 두지 않고, '''고정 크기 배열 하나'''에 [[struct proc]]을 쭉 늘어놓고 `state` 필드로 구분한다.\n\n<pre class=\"c\">\n// kernel/proc.c\nstruct proc proc[NPROC];      // NPROC = 64, 프로세스 테이블 전체\n\n// 스케줄러는 매번 배열을 훑으며 RUNNABLE 을 찾는다\nvoid\nscheduler(void)\n{\n  struct proc *p;\n  struct cpu *c = mycpu();\n  for(;;){\n    for(p = proc; p < &proc[NPROC]; p++) {\n      acquire(&p->lock);\n      if(p->state == RUNNABLE) {      // ← 여기가 \"Ready list\"\n        p->state = RUNNING;\n        c->proc = p;\n        swtch(&c->context, &p->context);\n        c->proc = 0;\n      }\n      release(&p->lock);\n    }\n  }\n}\n<\/pre>\n\n{| class=\"table\"\n! 개념상의 목록 || xv6의 실제 표현\n|-\n| Ready list || `p->state == RUNNABLE` 인 배열 원소들\n|-\n| Blocked list || `p->state == SLEEPING` 인 원소들 (`p->chan`으로 무엇을 기다리는지 구분)\n|-\n| Current running || `mycpu()->proc`, 그리고 `p->state == RUNNING`\n|-\n| 빈 슬롯 || `p->state == UNUSED`\n|}\n\n{warn}\n'''\"목록이 세 개 있다\"는 개념 모델이고, 구현은 배열 하나 + 상태 필드일 수 있다.''' 교육용 OS인 xv6는 단순함을 택했고(그래서 스케줄링이 O(NPROC) 선형 탐색이다), 리눅스 같은 실제 OS는 우선순위별 런큐·[[레드블랙 트리]] 등을 쓴다. 시험에서 \"OS가 유지하는 process list의 종류\"를 물으면 '''개념 모델(ready/blocked/running)'''로 답하면 된다.\n{/warn}\n\n{tip}\n현재 CPU에서 도는 프로세스의 `struct proc *`를 얻는 함수가 '''[[myproc]]()'''이다. `sys_sigalarm()` 같은 시스템 콜 구현이 맨 처음 하는 일이 `struct proc *p = myproc();`인 이유가 여기 있다 — \"current running\" 항목을 읽는 것이다.\n{/tip}\n\n== 왜 목록을 나눠야 하나 ==\n\nBlocked 프로세스를 Ready 목록에 섞어 두면 [[스케줄러]]가 매번 \"얘는 돌 수 있나?\"를 확인해야 한다. 분리해 두면 스케줄러는 '''Ready 목록만''' 보면 되므로, [[프로세스 상태|Blocked 프로세스에게 CPU를 주는 낭비]]가 구조적으로 불가능해진다.\n\n이 아이디어가 5강에서 [[MLFQ]]의 다중 큐, 7강에서 [[SQMS]]/[[MQMS]]로 확장된다 — \"누구를 고를지\"를 빠르게 하려면 \"어디서 고를지\"를 자료구조로 미리 정리해 두는 것이다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(나열)''' 3강 p.36에서 OS가 유지한다고 말한 '''process list'''의 세 갈래를 쓰고, 각각이 어떤 질문에 답하기 위한 것인지 한 줄씩 쓰시오.\n{/quiz}\n{answer}\n① '''Ready processes''' — \"다음에 스케줄할 수 있는 프로세스는 누구인가\"<br>\n② '''Blocked processes''' — \"어느 프로세스의 I/O 요청이 끝났는가\"<br>\n③ '''Current running process''' — \"누구를 descheduled 해야 하는가\"\n{/answer}\n\n{quiz}\n'''(정의 → 용어)''' OS가 프로세스 관리를 위해 유지하는 핵심 자료구조 세 가지를 3강 p.36의 용어로 쓰시오.\n{/quiz}\n{answer}\n'''Process list''', '''Register context''', '''Process Control Block (PCB)'''. register context는 별개가 아니라 PCB '''안에''' 포함된다.\n{/answer}\n\n{quiz}\n'''(개념)''' [[xv6]]에는 ready list라는 별도의 연결 리스트가 없다. 그렇다면 `scheduler()`는 다음에 돌릴 프로세스를 어떻게 찾는가?\n{/quiz}\n{answer}\n`struct proc proc[NPROC]` 배열 전체를 순회하며 '''`p->state == RUNNABLE`'''인 원소를 찾는다. 즉 \"Ready list\"가 자료구조로 존재하는 대신 '''상태 필드로 표현'''되며, 탐색 비용은 O(NPROC)다.\n{/answer}\n\n== 관련 문서 ==\n* [[PCB]] / [[struct proc]] / [[프로세스]]\n* [[프로세스 상태]] — 목록 간 이동이 곧 상태 전이\n* [[스케줄러]] / [[스케줄링]] / [[컨텍스트 스위치]]\n* [[myproc]] — current running을 읽는 함수\n* [[MLFQ]] / [[SQMS]] / [[MQMS]] — 목록을 더 잘게 나누는 발전형\n* [[2025F 중간고사 족보]]"
 },
 "제한적 직접 실행": {
  "title": "제한적 직접 실행 (Limited Direct Execution)",
  "category": [
   "4강 LDE",
   "핵심"
  ],
  "body": "'''제한적 직접 실행'''(Limited Direct Execution, LDE)은 [[운영체제란|OS]]가 CPU를 [[가상화]]하면서도 '''성능'''과 '''통제권'''을 동시에 챙기기 위해 쓰는 메커니즘이다. 4강 전체가 이 한 문장을 두 개의 문제로 쪼개서 푸는 과정이다.\n\n{def}\n'''Direct Execution''' — Just run the program directly on the CPU.\n'''Limited''' Direct Execution — run it directly, but with '''limits''': the program cannot do restricted operations, and the OS can always take the CPU back.\n프로그램을 CPU에서 '''그냥 돌린다'''(빠르다). 다만 ① 아무 짓이나 못 하게 막고 ② 언제든 CPU를 빼앗아 올 수 있게 '''제한'''을 건다.\n{/def}\n\n{analogy}\nLDE는 '''운전면허 있는 사람에게 차를 그냥 내주되, 차에 리미터와 원격 시동정지 장치를 달아 둔 것'''이다. 운전자가 직접 운전하니 대리기사를 끼는 것보다 빠르다(direct execution). 그런데 과속은 리미터가 막고(문제 1: restricted operation), 렌트 시간이 끝나면 회사가 원격으로 차를 세운다(문제 2: timer interrupt). 리미터도 없고 원격 정지도 없으면 렌트 회사는 \"차를 빌려주는 라이브러리\"일 뿐 아무것도 통제하지 못한다.\n{/analogy}\n\n== 0. 왜 이 강의가 필요한가 — Mechanism vs. Policy ==\n\nCPU 가상화를 구현하려면 두 가지가 필요하다.\n\n{| class=\"table\"\n! 구분 || 질문 || 4강/5강에서의 정체\n|-\n| '''Mechanism''' || '''어떻게''' 하는가 (how) || [[컨텍스트 스위치]] ← '''4강'''\n|-\n| '''Policy''' || '''무엇을''' 할 것인가 (what) || [[스케줄링|스케줄링 정책]] ← 5강 이후\n|}\n\n교수가 슬라이드에 그대로 쓴 정의: \"A mechanism = low-level methods or protocols that implement a needed piece of functionality / A policy = algorithms that make some kind of decision atop a mechanism\". 정책과 메커니즘의 '''분리'''는 시스템 설계의 대원칙인데, 나중에 정책만 갈아끼울 수 있기 때문이다(노트북의 고성능 모드 ↔ 절전 모드가 같은 메커니즘 위의 다른 정책).\n\n{exam}\n시험 단골 서술형: '''\"메커니즘과 정책의 차이를 설명하고 각각 예를 들어라.\"''' → 메커니즘 = context switch(어떻게 바꾸나), 정책 = scheduling(누구로 바꾸나). \"분리하면 정책을 나중에 바꿀 수 있다\"는 이유까지 써야 만점.\n{/exam}\n\n== 1. 출발점: 그냥 실행하면 안 되나 (Direct Execution) ==\n\n[[img:L4-09.png|p.9 Simple Approach: Direct Execution — OS와 Program이 번갈아 하는 10단계|medium]]\n\n{| class=\"table\"\n! OS || Program\n|-\n| 1. Create entry for process list<br>2. Allocate memory for program<br>3. Load program into memory<br>4. Set up stack with `argc` / `argv`<br>5. Clear registers<br>6. Execute `call main()` || \n|-\n|  || 7. Run `main()`<br>8. Execute return from `main()`\n|-\n| 9. Free memory of process<br>10. Remove from process list || \n|}\n\n이 방식은 '''빠르다'''. 프로그램이 CPU에서 네이티브로 돈다. 그런데 슬라이드 아래의 노란 박스가 이 강의의 출발점이다.\n\n{warn}\n\"Without '''limits''' on running programs, the OS wouldn't be in control of anything and thus would be '''just a library'''.\"\n제한이 없으면 OS는 통제하는 게 아무것도 없고, '''그냥 라이브러리'''일 뿐이다.\n{/warn}\n\n그래서 '''두 개의 문제'''가 생긴다 (p.8):\n# '''Control''' — 프로세스를 돌리면서도 CPU에 대한 통제권을 유지할 수 있나? (해로운 짓을 하면? CPU를 안 돌려주면?)\n# '''Performance''' — 그 통제를 '''과도한 오버헤드 없이''' 구현할 수 있나?\n\n== 2. 복습: Exceptional Control Flow ==\n\n4강은 컴구(CS:APP Ch.8)의 예외 분류를 그대로 끌어온다. 이 분류는 '''2025F 중간고사 Problem 1에 그대로 출제'''됐다.\n\n{| class=\"table\"\n! 분류 || 동기/비동기 || 의도적? || 복귀 || 예\n|-\n| '''[[인터럽트]] (Interrupt)''' || '''비동기''' (프로세서 외부 사건) || — || 다음 명령어 || [[타이머 인터럽트]], I/O 인터럽트, Ctrl-C, 패킷 도착\n|-\n| '''[[트랩]] (Trap)''' || 동기 || '''의도적''' || 다음 명령어 || [[시스템 콜]], breakpoint\n|-\n| '''Fault''' || 동기 || 비의도적, '''복구 가능성 있음''' || '''현재''' 명령어 재실행 또는 abort || page fault, protection fault\n|-\n| '''Abort''' || 동기 || 비의도적, 복구 불가 || 프로그램 종료 || illegal instruction, parity error, machine check\n|}\n\n{exam}\n'''2025F 중간고사 Problem 1'''이 이 슬라이드를 그대로 띄우고 물었다 — \"Which one is '''not''' a synchronous exception?\" → 답은 '''Interrupt'''. 나머지(trap / fault / abort)는 전부 명령어 실행의 결과로 생기는 synchronous exception이다. 2026 퀴즈/중간에도 \"비동기인 것을 고르라\", \"재실행하는 것은?\"(→ fault) 형태로 나오기 딱 좋다.\n{/exam}\n\n{tip}\n헷갈리면 '''\"누가 일으켰나\"'''로 나눠라. 내 명령어가 일으켰으면 synchronous(trap/fault/abort), 바깥 장치가 일으켰으면 asynchronous(interrupt). 그리고 '''trap만 의도적'''이다.\n{/tip}\n\n== 3. 문제 1 — Restricted Operation ==\n\n프로세스가 디스크에 직접 쓰거나, 남의 메모리를 읽거나, CPU를 안 돌려주려고 하면? 해결책은 '''protected control transfer''':\n\n{| class=\"table\"\n! 모드 || 권한 || 누가 여기서 도나\n|-\n| '''[[유저 모드와 커널 모드|User mode]]''' || 하드웨어 자원에 '''full access 불가''' || 응용 프로그램\n|-\n| '''[[커널 모드|Kernel mode]]''' || 머신의 '''모든 자원'''에 접근 가능 ([[특권 명령]] 실행 가능) || OS [[커널]]\n|}\n\n=== 시스템 콜 ===\n\n[[img:L4-15.png|p.15 System Call — 유저 모드의 프로세스들이 System Call Interface를 통해서만 커널로 내려간다|medium]]\n\n[[시스템 콜]]은 커널이 '''고르고 골라''' 유저 프로그램에게 열어 주는 기능이다: 파일 시스템 접근, 프로세스 생성·파괴, 프로세스 간 통신, 메모리 추가 할당 등.\n\n핵심은 '''명령어 두 개'''다 (p.16):\n\n{| class=\"table\"\n! 명령어 || 방향 || 하는 일\n|-\n| '''[[트랩|Trap instruction]]''' || user → kernel || 커널로 점프 + 권한을 '''kernel mode로 상승''' (CPU가 지원)\n|-\n| '''[[return-from-trap]]''' || kernel → user || 호출한 유저 프로그램으로 복귀 + 권한을 '''user mode로 하강'''\n|}\n\n{warn}\n\"시스템 콜은 그냥 함수 호출 아닌가?\"가 가장 흔한 오해다. '''아니다.''' 일반 함수 호출은 `call`/`ret`으로 같은 권한 레벨에서 왔다 갔다 하지만, 시스템 콜은 '''trap 명령어'''를 써서 '''모드가 바뀐다'''. 유저가 커널 함수 주소를 알아내서 `call`로 뛰어도 모드는 안 바뀌고, 그냥 권한 위반으로 죽는다.\n{/warn}\n\n[[sim:syscall_trap]]\n\n=== 시스템 콜 번호 (x86 예제) ===\n\n[[img:L4-18.png|p.18 Trap Example (x86): write() / exit() — %eax에 syscall number를 넣고 int $0x80|medium]]\n\n<pre class=\"asm\">\n8   main:\n      First, call write(1, \"hello, world\\n\", 13)\n9     movl $4, %eax        # System call number 4  (write)\n10    movl $1, %ebx        # stdout has descriptor 1\n11    movl $string, %ecx   # Hello world string\n12    movl $len, %edx      # String length\n13    int  $0x80           # System call code  ← 여기서 trap\n\n      Next, call exit(0)\n14    movl $1, %eax        # System call number 0(1) (exit)\n15    movl $0, %ebx        # Argument is 0\n16    int  $0x80           # System call code\n<\/pre>\n\n* 9행 / 14행 — '''`%eax`에 syscall number'''. 어떤 시스템 콜인지는 '''번호'''로 지정한다.\n* 10~12행 — 인자는 `%ebx, %ecx, %edx, %esi, %edi, %ebp`에 최대 6개.\n* 13행 / 16행 — `int $0x80`이 '''trap 명령어'''. 여기서 커널로 넘어간다.\n\n{tip}\n[[RISC-V]]([[xv6]])에서는 번호 레지스터가 '''`a7`''', 인자가 '''`a0`~`a5`''', 반환값이 '''[[a0]]''', trap 명령어가 '''`ecall`'''이다. x86의 `%eax`/`int $0x80`과 이름만 다르고 구조는 똑같다. 과제 1과 퀴즈는 전부 RISC-V 쪽 이름을 쓴다 → [[xv6 시스템 콜 경로]] 참고.\n{/tip}\n\n=== 트랩 테이블 ===\n\n[[img:L4-19.png|p.19 Trap Table — syscall number k가 트랩 테이블의 인덱스가 되어 handler k를 부른다|medium]]\n\n* 이벤트 종류마다 '''고유한 syscall number k'''가 있다.\n* '''k = [[트랩 테이블]]의 인덱스'''.\n* syscall k가 발생할 때마다 '''handler k'''가 불린다.\n\n{warn}\n'''트랩 테이블은 [[커널 모드]]에서, 부팅 때, OS가 설정한다.''' 유저 프로그램이 \"내 핸들러를 트랩 테이블 3번에 꽂아 줘\"라고 할 수 있다면 그건 곧 커널 모드 코드 실행 권한을 주는 것이므로, 트랩 테이블 설정은 [[특권 명령]]이다.\n{/warn}\n\n=== 유저 스택과 커널 스택 ===\n\n[[img:L4-20.png|p.20 User Stack and Kernel Stack — 프로세스마다 스택이 두 개이고, 트랩 시 유저 상태는 커널 스택에 저장된다|medium]]\n\nOS는 프로세스마다 '''스택을 두 개''' 유지한다.\n\n{| class=\"table\"\n! || User Stack || [[커널 스택|Kernel Stack]]\n|-\n| 사는 곳 || User Space || Kernel Space\n|-\n| 내용 || 유저 함수의 지역변수, 리턴 주소 || '''하드웨어가 저장한 유저 상태'''(PC `%eip`, SP `%esp`, flags) + 커널 함수의 지역변수·리턴 주소\n|-\n| 언제 쓰나 || 유저 코드 실행 중 || 시스템 콜/인터럽트로 커널에 들어온 동안\n|}\n\n{analogy}\n커널 스택은 '''병원 접수창구의 개인 보관함'''이다. 수술실(커널)에 들어가기 전에 내 소지품(레지스터)을 내 이름이 붙은 보관함에 넣어 두고, 나올 때 그대로 찾아 간다. 보관함이 프로세스마다 따로 있으니 남의 물건과 섞이지 않는다. [[xv6]]에서 이 보관함의 정체가 [[trapframe]]이다.\n{/analogy}\n\n== 4. LDE 프로토콜 전체 타임라인 ⭐⭐ ==\n\np.22~23의 표 두 장이 '''이 강의의 핵심 요약'''이다. 열이 셋(OS / Hardware / Program)이고, 각자 무슨 일을 하는지를 구분하는 것이 시험 포인트다.\n\n[[img:L4-22.png|p.22 Limited Direct Execution Protocol — OS @ boot과 OS @ run, 그리고 하드웨어/프로그램의 역할 분담|large]]\n\n=== 4-1. 부팅 시 ===\n\n{| class=\"table\"\n! OS @ boot (kernel mode) || Hardware\n|-\n| '''initialize trap table''' || \n|-\n|  || remember address of … syscall handler\n|}\n\n=== 4-2. 프로세스 시작 ~ 시스템 콜 ===\n\n{| class=\"table\"\n! OS @ run (kernel mode) || Hardware || Program (user mode)\n|-\n| Create entry for process list<br>Allocate memory for program<br>Load program into memory<br>Setup user stack with `argv`<br>Fill kernel stack with reg/PC<br>'''return-from-trap''' ||  || \n|-\n|  || restore regs from kernel stack<br>'''move to user mode'''<br>jump to `main` || \n|-\n|  ||  || Run `main()`<br>…<br>Call system call<br>'''trap''' into OS\n|-\n|  || '''save regs to kernel stack'''<br>'''move to kernel mode'''<br>jump to trap handler || \n|-\n| Handle trap<br>Do work of syscall (e.g. `open()`, `write()`)<br>'''return-from-trap''' ||  || \n|-\n|  || restore regs from kernel stack<br>'''move to user mode'''<br>jump to PC after trap || \n|-\n|  ||  || …<br>return from `main`<br>trap (via `exit()`)\n|-\n| Free memory of process<br>Remove from process list ||  || \n|}\n\n{tip}\n재미있는 포인트: '''프로세스를 처음 시작할 때도 [[return-from-trap]]을 쓴다.''' 들어온 적이 없는데 \"트랩에서 돌아가는 척\"을 해서 유저 모드로 떨어뜨리는 것이다. 커널 스택(=[[trapframe]])에 가짜 유저 상태를 채워 놓고 return-from-trap을 때리면 하드웨어가 알아서 유저 모드로 내려 준다. [[xv6]]의 `forkret` → [[usertrapret]] 경로가 정확히 이것.\n{/tip}\n\n{exam}\n'''\"OS / Hardware / Program 중 누가 하는 일인가\"'''를 섞어 놓고 고르게 하는 문제가 가장 만들기 쉽다. 외울 때 이렇게 묶어라:\n* '''하드웨어만''' 하는 일 = 레지스터 저장/복원(커널 스택 ↔ 레지스터), '''모드 전환''', 트랩 핸들러/PC로 점프\n* '''OS만''' 하는 일 = trap table 초기화, 타이머 시작, 프로세스 리스트 관리, 메모리 할당, 시스콜 처리, `switch()` 호출\n* '''Program'''은 `main` 실행과 '''trap 호출'''뿐\n{/exam}\n\n== 5. 문제 2 — Switching Between Processes ==\n\np.25의 문제 제기가 아주 심오하다.\n\n{warn}\n\"If a process is running on the CPU, this means '''the OS is not running'''. If the OS is not running, '''how can it do anything at all'''?\"\n프로세스가 CPU를 쓰고 있다는 건 OS가 안 돌고 있다는 뜻이다. 안 돌고 있는데 어떻게 뭘 한단 말인가?\n{/warn}\n\n두 가지 답이 있다.\n\n{| class=\"table\"\n! || '''[[협력적 방식]]''' (Cooperative) || '''[[비협력적 방식]]''' (Non-cooperative)\n|-\n| 누가 통제권을 넘기나 || '''프로세스'''가 스스로 || '''OS'''가 빼앗음\n|-\n| 계기 || 시스템 콜(`open()`, [[yield|`yield()`]]) 또는 '''불법 행위'''(0으로 나누기, 잘못된 메모리 접근) || '''[[타이머 인터럽트]]'''\n|-\n| OS의 자세 || \"just '''wait''' for system calls\" — 기다린다 || 부팅 때 타이머를 켜 두고 몇 ms마다 강제 회수\n|-\n| 무한 루프 프로세스 || '''속수무책 → 재부팅''' || 다음 tick에 바로 뺏음\n|-\n| 실제 사례 || 초기 Macintosh OS, Xerox Alto || 현대의 모든 OS\n|}\n\n{exam}\n'''퀴즈1 모의 A4·A5에서 둘 다 흔들린 지점이다.'''\n* A4 (T) — \"In the cooperative approach, the OS regains control by '''waiting''' for the process to make a system call.\" → '''참'''. 슬라이드 원문이 \"just wait for system calls\"다. \"기다린다\"는 수동적 표현이 틀려 보여도 그게 정답.\n* A5 (F) — \"The timer ... is started by '''each user program''' when it begins running.\" → '''거짓'''. 슬라이드 첫 줄이 '''\"During the boot sequence, the OS starts the timer\"'''.\n한 줄로: '''cooperative = 프로세스가 줄 때까지 기다림 / non-cooperative = OS가 부팅 때 켠 타이머로 빼앗음.'''\n{/exam}\n\n=== 타이머 인터럽트 ===\n\n[[타이머 인터럽트]]의 동작 순서(p.27):\n# '''부팅 시퀀스 중 OS가 타이머를 시작'''한다.\n# 타이머가 몇 ms마다 인터럽트를 올린다.\n# 인터럽트가 올라오면: 현재 프로세스가 '''멈추고''' → 프로그램 상태가 '''충분히 저장'''되고 → OS 안의 '''미리 설정된 [[인터럽트 핸들러]]'''가 돌고 → '''OS가 CPU 통제권을 되찾는다'''.\n\n{warn}\n'''\"A timer interrupt gives OS the ability to run again on a CPU.\"''' 슬라이드가 굵게 강조한 문장. 유저는 타이머를 켤 수도 끌 수도 없다 — 끌 수 있다면 무한 루프 프로세스가 타이머를 끄고 CPU를 영원히 독점할 것이고, 그럼 p.8의 Control 문제로 원위치다. 타이머 설정은 '''[[특권 명령]]'''.\n{/warn}\n\n{tip}\n[[xv6]]에서는 `kernel/start.c`의 `timerinit()`이 부팅 때 실행되어 타이머를 건다. 이후 매 tick마다 [[usertrap]]이 불리고, `devintr()`가 '''2'''를 돌려주면([[which_dev]] == 2) [[yield]]로 CPU를 양보한다. '''과제 1의 알람 코드가 바로 이 자리에 들어간다.'''\n{/tip}\n\n== 6. 컨텍스트 스위치 ==\n\n[[컨텍스트 스위치]]는 '''low-level assembly 코드'''다 (p.29). 하는 일은 셋:\n# 현재 프로세스의 '''몇 개 안 되는 레지스터 값'''을 그 프로세스의 [[커널 스택]](정확히는 proc 구조체)에 저장 — general purpose registers, [[프로그램 카운터|PC]], kernel [[스택 포인터|stack pointer]]\n# 곧 실행될 프로세스의 레지스터를 '''복원'''\n# 곧 실행될 프로세스의 '''커널 스택으로 전환'''\n\n[[img:L4-31.png|p.31 Context Switch — ①하드웨어가 유저 상태를 커널 스택에, ②switch() 호출, ③커널 레지스터를 proc-struct(A)에 저장, ④proc-struct(C)에서 복원, ⑤C의 유저 모드로 복귀|large]]\n\n{warn}\n'''저장이 두 번 일어난다 — 이게 4강 최대의 함정이다.'''\n{| class=\"table\"\n! 몇 번째 || 누가 || 무엇을 || 어디에\n|-\n| ① || '''하드웨어''' || '''유저''' 레지스터 (PC, SP, flags …) || 그 프로세스의 '''[[커널 스택]]''' ([[xv6]]에서는 [[trapframe]])\n|-\n| ③④ || '''OS (`switch()`)''' || '''커널''' 레지스터 (callee-saved, `ra`, `sp`) || '''proc 구조체'''([[PCB]], [[xv6]]의 `p->context`)\n|}\n\"컨텍스트 스위치가 유저 레지스터를 저장한다\"는 서술은 '''틀렸다'''. 유저 레지스터는 그 전에 이미 하드웨어+트랩 진입 코드가 저장해 뒀다.\n{/warn}\n\n[[sim:context_switch]]\n\n{analogy}\n저장이 두 번인 이유는 '''\"짐을 두 번 푸는 여행\"'''이라서다. ① 공항에 내리면서 기내 가방(유저 레지스터)을 호텔 방(커널 스택)에 둔다. ③ 그런데 방을 옮기게 되면, 지금 방에서 쓰던 물건(커널 레지스터)을 다시 캐리어(proc 구조체)에 챙겨야 한다. 돌아올 때는 역순으로 두 번 푼다. 짐을 한 번만 챙기려 하면 반드시 뭔가를 잃어버린다.\n{/analogy}\n\n=== xv6의 swtch ===\n\n[[xv6]]에서 이 어셈블리 코드의 이름이 '''`swtch`'''(`kernel/swtch.S`)다. `switch`가 C 키워드라 모음 하나를 뺐다.\n\n<pre class=\"c\">\n// kernel/proc.c — 타이머 인터럽트로 들어온 프로세스가 CPU를 놓는 길\nvoid\nyield(void)\n{\n  struct proc *p = myproc();\n  acquire(&p->lock);\n  p->state = RUNNABLE;      // 1. 나는 이제 '실행 중'이 아니라 '준비됨'\n  sched();                  // 2. → swtch(&p->context, &mycpu()->context)\n  release(&p->lock);\n}\n<\/pre>\n\n* 1행 — `p->state`를 RUNNABLE로 바꾼다. [[프로세스 상태]] 기계의 Running → Ready 전이.\n* 2행 — `sched()`가 `swtch()`를 불러 '''커널 레지스터'''를 `p->context`에 저장하고 [[스케줄러]]의 context를 복원한다. 이 함수는 \"나중에 다시 스케줄될 때 그 자리에서 돌아온다\".\n\n== 7. LDE 프로토콜 최종 완성판 (타이머 포함) ⭐⭐ ==\n\n[[img:L4-32.png|p.32 LDE Protocol (Timer interrupt) — 부팅 때 trap table에 timer handler까지 등록하고 타이머를 시작한다|large]]\n\n{| class=\"table\"\n! OS @ boot (kernel mode) || Hardware\n|-\n| '''initialize trap table''' || \n|-\n|  || remember address of … syscall handler / '''timer handler'''\n|-\n| '''start interrupt timer''' || \n|-\n|  || '''start timer''' — interrupt CPU in X ms (e.g. 10 ms)\n|}\n\n{| class=\"table\"\n! OS @ run (kernel mode) || Hardware || Program (user mode)\n|-\n|  ||  || '''Process A''' 실행 중 …\n|-\n|  || '''timer interrupt'''<br>save regs(A) to k-stack(A)<br>move to kernel mode<br>jump to trap handler || \n|-\n| Handle the trap<br>'''Call `switch()` routine'''<br> · save regs(A) to proc-struct(A)<br> · restore regs(C) from proc-struct(C)<br> · switch to k-stack(C)<br>'''return-from-trap (into C)''' ||  || \n|-\n|  || restore regs(C) from k-stack(C)<br>move to user mode<br>jump to C's PC || \n|-\n|  ||  || '''Process C''' 실행 재개 …\n|}\n\n{exam}\n'''이 표 한 장이 4강 전체의 요약'''이다. 2025F 중간에서도 \"CPU 1 after context switch\" 그림이 나왔고, 퀴즈1 모의에서도 A4·A5가 여기서 나왔다. 백지에 '''OS / Hardware / Program 세 열'''을 그리고 채울 수 있으면 4강은 끝난 것이다.\n{/exam}\n\n== 8. 비용과 심화 ==\n\n=== 얼마나 걸리나 (p.34) ===\n* 1996년, 200 MHz P6 + Linux 1.3.37 기준: 시스템 콜 ≈ '''4 μs''', 컨텍스트 스위치 ≈ '''6 μs'''\n* 현대 시스템: 거의 한 자릿수 배 개선 — 2~3 GHz에서 '''sub-microsecond'''\n\n숫자 암기보다 \"'''공짜는 아니지만 마이크로초 단위로 꽤 싸다, 그래도 자주 하면 p.8의 Performance 문제로 돌아온다'''\"는 감이 중요하다.\n\n=== Halt와 Tickless (p.35~37, 심화) ===\n* 돌릴 프로세스가 없으면 no-op 루프를 도는 게 아니라 '''CPU를 재운다''' — C-state (C0 = Active, C1 = Halt). 명령어는 x86-64의 `hlt`, [[RISC-V]]의 '''`wfi`'''(wait for interrupt).\n* 재우면 누가 깨우나? → '''[[인터럽트]]'''. 타이머 인터럽트가 주기적으로 깨운다.\n* 그런데 1 ms마다 깨워서 인터럽트 처리를 하는 것 자체가 '''전력 오버헤드'''다. → '''Tickless Kernel''': one-shot timer로 필요한 시점에만 한 번 울리게 하고, idle 코어(Tickless Idle)나 프로세스가 하나뿐인 코어(Full Tickless)는 아예 tick을 끈다.\n\n=== 생각해 볼 거리 (p.38) ===\n* 인터럽트를 꼭 OS가 처리해야 할까? (유저 레벨 인터럽트 처리 연구가 있다)\n* kernel mode와 user mode 둘로 보호가 충분한가? (x86의 ring 0~3, VM을 위한 ring -1 …)\n\n== 🎙 실제 수업 기록 (9/9 수, 0909_05_운체.txt 기준) ==\n\n9월 9일 녹음은 4강의 '''꼬리'''부터 시작해서 5강으로 넘어간다. 교수가 LDE를 마무리하며 강조한 것:\n\n* \"So for the non-coop(erative), we use the '''timer interrupt'''. ... we '''gain the control''' with this timer interrupt and then we can use some '''context switch''' mechanism to change the running process into the other process.\"\n* \"the key point here is that we save '''a few register values''' like '''general purpose register and program counter and kernel stack pointer''' and '''all of them is only this''' — and we can change the context into the other context if we change this register.\"\n* 컨텍스트 스위치의 실제 어셈블리는 강의에서 안 보고 넘어갔다 — \"we doesn't look into real assembly code but you can find it in some '''lab''' ... I will upload the lab contents in this week.\" → 그 lab이 '''[[과제1 xv6 alarm|과제 1]]'''이다.\n* 그러고는 바로 \"now with this context-switch mechanism we can build a '''schedule'''\"로 5강 [[스케줄링]]에 진입.\n\n{exam}\n교수가 직접 \"'''key point'''\"라고 말한 문장이 '''\"저장하는 건 general purpose register + program counter + kernel stack pointer, 그게 전부다\"'''이다. [[컨텍스트 스위치]]가 무엇을 저장하는지 묻는 문제가 나오면 이 세 가지를 쓰면 된다.\n{/exam}\n\n== 시험 대비 핵심 요약 ==\n\n# '''Direct Execution만으로는 OS가 \"just a library\"''' — 통제 불가. 그래서 '''Limited'''가 필요.\n# '''Mechanism'''(어떻게 = [[컨텍스트 스위치]]) vs '''Policy'''(무엇을 = [[스케줄링]]) 분리는 시스템 설계 대원칙.\n# 예외 4분류: '''[[인터럽트]]'''(비동기·외부) / '''[[트랩]]'''(동기·의도적·시스콜) / '''Fault'''(동기·복구 가능·'''현재 명령어 재실행''') / '''Abort'''(복구 불가). — 2025F Problem 1 출제.\n# '''문제 1(restricted operation)''' 해법 = [[유저 모드와 커널 모드]] + [[트랩]]/[[return-from-trap]] + [[트랩 테이블]]('''부팅 때 OS가 등록''').\n# 시스콜 규약: 번호는 레지스터에(x86 `%eax`, [[RISC-V]] `a7`), 인자는 나머지 레지스터에, 트랩 명령어(`int $0x80`, `ecall`)로 진입. 번호 k = 트랩 테이블 인덱스.\n# 프로세스마다 스택이 '''두 개''' — user stack / [[커널 스택]]. 트랩 시 '''유저 상태는 커널 스택에''' 저장된다.\n# '''문제 2(프로세스 전환)''' 해법: [[협력적 방식]](시스템 콜을 '''기다림''', 무한 루프에 무력 → 재부팅) → '''[[비협력적 방식]]'''('''OS가 부팅 때 켠''' [[타이머 인터럽트]]).\n# [[컨텍스트 스위치]] = 어셈블리 코드. GP 레지스터 + PC + kernel SP를 저장/복원하고 커널 스택을 교체.\n# '''저장은 2단계''' — ① '''하드웨어'''가 유저 상태를 [[커널 스택]]([[trapframe]])에, ② '''OS(`switch`)'''가 커널 상태를 proc 구조체([[PCB]])에. 함정 1순위.\n# LDE 프로토콜 표(p.22·23·32·33)의 '''OS / Hardware / Program''' 열 구분을 백지에 그릴 수 있어야 한다.\n\n== 관련 문서 ==\n* [[트랩]] · [[트랩 테이블]] · [[return-from-trap]] · [[sret]] · [[인터럽트]]\n* [[trapframe]] · [[epc]] · [[sepc]] · [[usertrap]] · [[usertrapret]] · [[커널 스택]]\n* [[타이머 인터럽트]] · [[컨텍스트 스위치]] · [[협력적 방식]] · [[비협력적 방식]] · [[스케줄러]]\n* [[시스템 콜]] · [[유저 모드와 커널 모드]] · [[특권 명령]] · [[시스템 콜 추가 절차]]\n* [[과제1 xv6 alarm]] — 이 강의를 손으로 구현하는 과제\n* [[퀴즈1 복기]] · [[스케줄링]] (5강, 이 메커니즘 위의 정책)"
 },
 "트랩": {
  "title": "트랩 (Trap)",
  "category": [
   "4강 LDE",
   "용어"
  ],
  "body": "'''트랩'''(Trap)은 유저 프로그램이 '''의도적으로''' 커널로 넘어가기 위해 일으키는 '''synchronous exception'''이다. 4강에서는 두 가지 뜻으로 쓰인다 — ① 예외 분류상의 \"의도적 동기 예외\"(= [[시스템 콜]], breakpoint), ② `user → kernel` 방향 전환을 일으키는 '''명령어'''(x86 `int $0x80`, [[RISC-V]] `ecall`).\n\n{def}\n'''Trap''' — Intentional. Examples: system calls, breakpoint traps, special instructions. Returns control to the '''\"next\"''' instruction.\n'''Trap instruction (user → kernel)''': Jump into the kernel / Raise the privilege level to '''kernel mode''' / Supported by CPU.\n{/def}\n\n{analogy}\n트랩은 '''\"교무실 문을 두드리는 행위\"'''다. 학생(유저 프로그램)은 교무실 안 물건에 손댈 수 없지만, 문을 두드리고 \"성적증명서 주세요\"(시스템 콜 번호)라고 말할 수는 있다. 문을 열어 주는 것은 선생님(커널)이고, 학생은 '''문 앞까지만''' 간다. [[인터럽트]]가 \"밖에서 갑자기 화재경보가 울린 것\"이라면, 트랩은 '''내가 직접 두드린 것'''이다.\n{/analogy}\n\n[[img:L4-17.png|p.17 Trap Example (x86) — open()이 int 명령으로 trap하고, OS가 파일을 연 뒤 returns로 돌아온다|medium]]\n\n== 예외 4분류에서의 위치 ==\n\n{| class=\"table\"\n! 분류 || 동기/비동기 || 의도적? || 복귀 지점\n|-\n| [[인터럽트]] || '''비동기''' || — || 다음 명령어\n|-\n| '''트랩''' || 동기 || '''O''' || '''다음''' 명령어\n|-\n| Fault || 동기 || X (복구 가능성 있음) || '''현재''' 명령어 재실행 또는 abort\n|-\n| Abort || 동기 || X (복구 불가) || 없음 (프로그램 종료)\n|}\n\n{exam}\n'''2025F 중간고사 Problem 1'''이 이 표를 그대로 물었다 — \"Which one is not a synchronous exception?\" → '''Interrupt'''. 트랩/폴트/어보트는 전부 '''명령어 실행의 결과'''로 생기는 동기 예외다.\n{/exam}\n\n== 트랩이 하는 일 세 가지 ==\n\n<pre class=\"ascii\">\n  유저 코드:   ... ; ecall ; (다음 명령어)\n                     │\n                     ▼  하드웨어가 한 번에:\n        ① sepc   ← ecall 명령어의 주소      (어디서 끊겼나)\n        ② scause ← 8 (U-mode ecall)        (왜 끊겼나)\n        ③ mode   ← supervisor(kernel)      (권한 상승)\n           PC    ← stvec (= 트랩 테이블 엔트리)\n<\/pre>\n\n주의: 하드웨어는 '''이것만''' 한다. 레지스터 31개를 저장하는 것은 소프트웨어([[xv6]]의 `uservec`)의 몫이고, 그 저장 장소가 [[trapframe]]이다.\n\n{tip}\n\"Returns control to the '''next''' instruction\"이 [[xv6]]에서 `p->trapframe->[[epc]] += 4`로 구현된다 — `ecall`은 4바이트라 4를 더해야 `ecall` 다음 명령어로 돌아간다. 반면 '''[[타이머 인터럽트]]는 +4를 하지 않는다''' — 끊긴 명령어를 아직 실행하지 않았으므로 그것부터 다시 해야 한다.\n{/tip}\n\n[[sim:syscall_trap]]\n\n== 관련 문서 ==\n* [[트랩 테이블]] · [[return-from-trap]] · [[sret]] · [[인터럽트]]\n* [[시스템 콜]] · [[유저 모드와 커널 모드]] · [[특권 명령]]\n* [[usertrap]] · [[trapframe]] · [[제한적 직접 실행]]"
 },
 "트랩 테이블": {
  "title": "트랩 테이블 (Trap Table)",
  "category": [
   "4강 LDE",
   "용어"
  ],
  "body": "'''트랩 테이블'''(Trap Table)은 '''\"어떤 이벤트가 나면 어느 핸들러로 점프할지\"'''를 적어 둔 표다. [[커널]]이 '''부팅 때''' 초기화하고, 하드웨어는 그 주소를 기억해 뒀다가 [[트랩]]/[[인터럽트]]가 날 때마다 표를 뒤져 점프한다.\n\n{def}\nEach type of event has a unique '''syscall number k''' → '''k = index into trap table''' → '''Handler k''' is called each time syscall k occurs.\n{/def}\n\n[[img:L4-19.png|p.19 Trap Table — syscall number가 인덱스가 되어 handler 코드로 연결된다|medium]]\n\n{analogy}\n트랩 테이블은 '''회사 대표번호의 ARS 메뉴'''다. \"주문은 1번, 배송은 2번, 상담원 연결은 0번\" — 고객(유저 프로그램)은 부서 직통번호(커널 함수 주소)를 알 필요도, 알 수도 없고 '''번호만''' 누른다. 그리고 그 메뉴를 만드는 것은 '''회사(OS)'''이지 고객이 아니다.\n{/analogy}\n\n== 왜 부팅 때 OS가 설정하는가 ==\n\n{warn}\n트랩 테이블 설정은 '''[[특권 명령]]'''이다. 유저가 \"내 함수를 트랩 테이블 3번에 꽂아 줘\"라고 할 수 있다면, 그건 '''커널 모드에서 임의 코드를 실행할 권한'''을 준 것과 같다. 그래서\n* '''언제''' — 부팅 시퀀스 중 (OS @ boot)\n* '''누가''' — OS가 [[커널 모드]]에서\n* '''하드웨어는''' — \"remember address of … syscall handler\"만 한다\n{/warn}\n\n<pre class=\"ascii\">\n   OS @ boot (kernel mode)          Hardware\n   ─────────────────────────────────────────────────────────\n   initialize trap table  ───────►  remember address of …\n                                       syscall handler\n                                       timer handler       ← p.32에서 추가\n   start interrupt timer  ───────►  start timer\n                                    interrupt CPU in X ms\n<\/pre>\n\n== 아키텍처별 이름 ==\n\n{| class=\"table\"\n! 아키텍처 || 이름 || 설정 방법\n|-\n| x86 || IDT (Interrupt Descriptor Table) || `lidt` ([[특권 명령]])\n|-\n| [[RISC-V]] / [[xv6]] || '''`stvec`''' CSR — 트랩 진입 주소 하나 || `w_stvec(...)`\n|}\n\n{tip}\n[[xv6]]는 표가 아니라 '''진입점 하나'''(`stvec`)만 두고, 어디서 왔는지는 `scause`를 읽어 C 코드에서 분기한다([[usertrap]]). 그리고 '''유저용/커널용을 바꿔 끼운다''' — `usertrap()` 진입 직후 `w_stvec(kernelvec)`, `usertrapret()` 직전 `w_stvec(uservec)`.\n{/tip}\n\n{quiz}\n트랩 테이블을 초기화하는 주체와 시점은?\n{/quiz}\n{answer}\n'''OS가, 부팅 시퀀스 중, 커널 모드에서.''' 하드웨어는 그 주소를 \"기억\"할 뿐이고, 유저 프로그램은 관여할 수 없다(특권 명령). — LDE 프로토콜 표 p.22/p.32의 첫 줄.\n{/answer}\n\n== 관련 문서 ==\n* [[트랩]] · [[인터럽트]] · [[인터럽트 핸들러]] · [[특권 명령]]\n* [[시스템 콜]] · [[usertrap]] · [[제한적 직접 실행]] · [[타이머 인터럽트]]"
 },
