  "body": "'''가상화'''(Virtualization)는 OS가 물리 자원을 받아서 더 일반적이고 강력하고 쓰기 쉬운 '''가상 형태'''로 바꿔 주는 것이다. OSTEP의 \"three easy pieces\" 중 첫 번째이자 이 과목 중간고사 범위의 대부분을 차지하는 주제다.\n\n{def}\n'''Virtualization''' (2강 p.9)<br>\n\"OS takes physical resources and transforms it to a '''virtual form'''.\"<br>\n· The physical resources include CPUs, memory, disk, …<br>\n· The virtual form is more '''general, powerful and easy-to-use'''<br>\n· Sometimes, we refer to the OS as a '''virtual machine'''\n{/def}\n\n[[img:L2-09.png|2강 p.9. 하나의 그림에 ① CPU / ② Memory / ③ Storage Virtualization이 표시되어 있다.|large]]\n\n{analogy}\n🍦 아이스크림 가게에 직원은 한 명(=물리 CPU 1개)인데 주문은 10개가 밀려 있다. 직원을 더 뽑으면 망한다. 해법은 '''시간을 쪼개는 것''' — 12시 00분~12시 01분은 1번 주문 전담, 01분~02분은 2번 주문 전담. 손님 입장에서는 \"내 주문만 보는 직원이 한 명 있다\"고 느낀다. 실제 직원은 한 명인데 '''가상 직원이 10명''' 생긴 셈이다.\n{/analogy}\n\n== 세 가지 가상화 ==\n\n{| class=\"table\"\n! 대상 || 무엇을 가상화하나 || 메커니즘 || 다루는 강의\n|-\n| '''① CPU''' || 하나의 CPU → 무한히 많아 보이는 virtual CPU || '''Time-sharing''' + [[컨텍스트 스위치]] + [[스케줄러]] || 3~7강\n|-\n| '''② Memory''' || 물리 메모리 → 프로세스마다 private virtual address space || address translation (page/segment table) || [[주소 공간]], 중간고사 이후\n|-\n| '''③ Storage''' || 디스크 → 파일·디렉토리 || File system || [[영속성]]\n|}\n\n== CPU 가상화 ==\n\n{def}\n'''Virtualizing the CPU''' (2강 p.13)<br>\n\"The OS creates an '''illusion''' that the system has a very large number of virtual CPUs — turning a single CPU into a '''seemingly infinite''' number of CPUs, allowing many programs to '''seemingly''' run at once.\"\n{/def}\n\n[[img:L2-13.png|2강 p.13. 위쪽에는 Task마다 하나씩 붙은 Virtual CPU들, 아래쪽에는 실제 Physical CPU 4개.|medium]]\n\n핵심 단어는 '''seemingly'''(~처럼 보인다)다. 실제로 CPU가 늘어나는 게 아니라, 아주 빠르게 번갈아 돌려서 사람이 눈치채지 못하게 하는 것뿐이다.\n\n[[img:L2-12.png|2강 p.12. Time-sharing 비유 — Task #1/#2/#3마다 \"자기 전담 직원\"이 있는 것처럼 시간대를 나눈다.|medium]]\n\n=== 슬라이드의 데모 (cpu.c) ===\n\n<pre class=\"c\">\nint main(int argc, char *argv[])\n{\n    if (argc != 2) {\n        fprintf(stderr, \"usage: cpu <string>\\n\");\n        exit(1);\n    }\n    char *str = argv[1];\n    while (1) {\n        Spin(1);              // 1초가 지날 때까지 시간을 반복 확인\n        printf(\"%s\\n\", str);\n    }\n    return 0;\n}\n<\/pre>\n\n이걸 네 개 동시에 띄우면:\n\n<pre class=\"sh\">\nprompt> ./cpu A & ; ./cpu B & ; ./cpu C & ; ./cpu D &\n[1] 7353\n[2] 7354\n[3] 7355\n[4] 7356\nA\nB\nD\nC\nA\nB\nD\nC\n...\n<\/pre>\n\n프로세서가 하나뿐인데 A·B·C·D가 전부 동시에 도는 것처럼 보인다. 이게 CPU 가상화의 육안 증거다.\n\n{warn}\n출력 순서가 `A B C D` 가 아니라 `A B D C` 다. 어떤 순서로 돌지는 [[스케줄러]]의 '''정책'''이 정하는 것이고, 프로그램이 보장받는 건 \"언젠가는 돈다\"뿐이다.\n{/warn}\n\n== 메모리 가상화 ==\n\n{def}\n'''Virtualizing Memory''' (2강 p.20)<br>\n\"The OS virtualizes the memory as if each process has its own '''private virtual address space'''. The OS maps address space onto the physical memory. A memory reference within one running program '''does not affect''' the address space of other processes. Physical memory is a shared resource, managed by the OS.\"\n{/def}\n\n[[img:L2-20.png|2강 p.20. 각 Task는 자기만의 private virtual memory를 보고, OS가 그걸 물리 메모리의 서로 다른 위치로 매핑한다.|large]]\n\n슬라이드의 `mem.c`를 두 번 띄우면 이런 출력이 나온다.\n\n<pre class=\"sh\">\nprompt> ./mem &; ./mem &\n[1] 24113\n[2] 24114\n(24113) memory address of p: 00200000\n(24114) memory address of p: 00200000     ← 주소가 똑같다!\n(24113) p: 1\n(24114) p: 1\n(24114) p: 2\n(24113) p: 2\n...\n<\/pre>\n\n{warn}\n두 프로세스가 '''똑같은 주소 `0x00200000`'''을 출력하는데도 값은 서로 독립적으로 증가한다. 이게 가능한 이유는 그 주소가 '''가상 주소'''라서 서로 다른 물리 주소로 매핑되기 때문이다. \"주소가 같으면 같은 메모리\"라는 직관이 깨지는 지점이라 시험에 즐겨 나온다.\n{/warn}\n\n== 메커니즘과 정책 ==\n\nCPU 가상화를 구현하려면 두 가지가 필요하다 (3강 p.30). OS 과목 전체를 관통하는 구분이다.\n\n* '''Mechanism (어떻게?)''' → [[컨텍스트 스위치]]: 돌던 프로세스를 멈추고 다른 프로세스로 갈아타는 기술\n* '''Policy (무엇을/언제?)''' → [[스케줄링]]: 다음에 누구를 돌릴지 정하는 규칙\n\n{tip}\n0831 녹음본에서 교수님이 명시적으로 강조: \"'''the separation of mechanism and the policy''' — it is quite an important concept in the operating system course. For the given mechanism, first pick the goal of the operating system and then make some proper policy. '''This is the core of the operating system design.'''\"\n{/tip}\n\n가상화의 대가(cost)는 '''성능'''이다. 전환할 때마다 레지스터를 저장·복원해야 하고, 내 차례가 올 때까지 기다려야 한다. 그래서 [[OS 설계 목표]]에 \"minimize the overhead of the OS\"가 들어간다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"OS가 물리 자원을 받아 더 일반적·강력하고 쓰기 쉬운 형태로 변환하는 것\"을 가리키는 용어는?\n{/quiz}\n{answer}\n'''Virtualization'''(가상화). 이 성질 때문에 OS를 '''virtual machine'''이라고 부르기도 한다.\n{/answer}\n\n{quiz}\n'''(출력 예측)''' `./mem` 을 두 개 동시에 실행했더니 둘 다 `address of p: 00200000` 을 출력했다. 두 프로세스가 같은 물리 메모리를 공유하는가? 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n'''아니다.''' 출력된 것은 '''가상 주소'''이고, OS가 두 프로세스의 같은 가상 주소를 서로 다른 물리 주소로 매핑하기 때문에 값이 독립적으로 증가한다.\n{/answer}\n\n== 관련 문서 ==\n* [[운영체제란]] — three easy pieces 전체 개요\n* [[동시성]] / [[영속성]]\n* [[주소 공간]] — 메모리 가상화의 대상\n* [[프로세스]] — 가상화의 단위\n* [[컨텍스트 스위치]] (mechanism) / [[스케줄링]] (policy)\n* [[제한적 직접 실행]] — CPU 가상화를 실제로 구현하는 법"
 },
 "동시성": {
  "title": "동시성 (Concurrency)",
  "category": [
   "2강 What is OS",
   "용어"
  ],
  "body": "'''동시성'''(Concurrency)은 OS가 여러 일을 '''겹쳐서''' 처리하는 성질, 그리고 그렇게 겹쳤을 때 공유 데이터가 깨지는 문제를 함께 가리킨다. three easy pieces의 두 번째이며, 8·9강([[스레드]], [[락]]) 전체가 이 문제의 해결편이다.\n\n{def}\n'''Concurrency''' (2강 p.27)<br>\n\"The OS is '''juggling many things concurrently''', first running one process, then another, and so forth. Modern '''multi-threaded''' programs sharing the same virtual memory space exhibit the concurrency problem.\"\n{/def}\n\n{analogy}\n🍦 손님 #1이 민트초코 '''100개'''를 주문했다(12:19). 1분 뒤 손님 #2가 초코 '''1개'''를 주문한다. 100개를 다 만들 때까지 #2가 기다려야 한다면 그 손님은 다음 날 아이스크림을 받고 두 번 다시 안 온다. 그래서 가게는 작업을 잘게 잘라 '''번갈아''' 처리한다 — 그게 동시성이다.<br>\n문제는 여기서 생긴다. 직원이 민트초코용 '''그릇'''을 쓰다가 중간에 초코 주문으로 넘어가면서 같은 그릇을 재활용하면, 초코가 민트초코가 되어 나온다. 공유 자원이 중간에 끼어든 작업 때문에 오염되는 것 — 그게 [[race condition]]이다.\n{/analogy}\n\n[[img:L2-12.png|2강 p.12. 밀린 주문을 시간 단위로 잘라 번갈아 처리하는 모습.|medium]]\n\n== 동시 실행 vs 순차 실행 ==\n\n{def}\n\"Two (and more) processes run '''concurrently''' if their flows '''overlap in time'''. Otherwise, they are '''sequential'''.\" (3강 p.29)\n{/def}\n\n[[img:L3-29.png|3강 p.29. A&B는 concurrent, A&C도 concurrent, B&C는 sequential.|large]]\n\n{warn}\n'''최다 함정.''' \"물리적으로 정확히 같은 순간에 돌아야 concurrent\"가 '''아니다'''. 싱글 코어라 언제나 한 순간에는 한 프로세스만 돌더라도, 두 프로세스의 실행 '''구간'''이 겹치면 concurrent다.<br>\n그림에서 B는 앞쪽 구간에서 시작해 끝나고, C는 그 뒤에서 시작한다 — '''명확한 경계(clear boundary)'''가 있으므로 sequential. 반면 A는 앞뒤 양쪽에 걸쳐 있어 B와도 C와도 겹친다.\n{/warn}\n\n{tip}\n0831 녹음본에서 교수님의 판정 기준: \"if you can find there is a '''clear boundary''' between process execution, we will call it sequential … '''if there is overlap''' between their execution, it is concurrent.\" 그리고 그 판정이 의미를 갖는 이유는 \"the execution of process B '''cannot affect''' the execution of process C\" — 겹치지 않으면 서로 간섭할 수 없기 때문이다.\n{/tip}\n\n== 동시성 문제: 슬라이드의 thread.c ==\n\n2강 p.28~31은 동시성이 왜 '''문제'''인지를 실행 결과로 보여 준다.\n\n<pre class=\"c\">\nvolatile int counter = 0;\nint loops;\n\nvoid *worker(void *arg) {\n    int i;\n    for (i = 0; i < loops; i++) {\n        counter++;\n    }\n    return NULL;\n}\n\nint main(int argc, char *argv[])\n{\n    loops = atoi(argv[1]);\n    pthread_t p1, p2;\n    printf(\"Initial value : %d\\n\", counter);\n\n    Pthread_create(&p1, NULL, worker, NULL);\n    Pthread_create(&p2, NULL, worker, NULL);\n    Pthread_join(p1, NULL);\n    Pthread_join(p2, NULL);\n    printf(\"Final value : %d\\n\", counter);\n    return 0;\n}\n<\/pre>\n\n'''[[스레드]]'''는 \"같은 메모리 공간 안에서 도는 함수\"다. 두 스레드가 각자 `loops`번씩 `counter++`를 하므로 결과는 `2 × loops`여야 한다.\n\n<pre class=\"sh\">\nprompt> ./thread 1000\nInitial value : 0\nFinal value : 2000            ← 맞다\n\nprompt> ./thread 100000\nInitial value : 0\nFinal value : 143012          // huh??\nprompt> ./thread 100000\nInitial value : 0\nFinal value : 137298          // what the??\n<\/pre>\n\n=== 왜 이런 일이 ===\n\n{def}\n\"Increment a shared counter → take '''three instructions''': ① Load the value of the counter from memory into register, ② Increment it, ③ Store it back into memory. These three instructions '''do not execute atomically''' → Concurrency problem happens.\" (2강 p.31)\n{/def}\n\n<pre class=\"ascii\">\n  counter++ 는 사실 이 세 줄이다\n\n     mov  counter, %eax      ← ① load\n     add  $1, %eax           ← ② increment\n     mov  %eax, counter      ← ③ store\n\n  T1: ── load(50) ── add(51) ──┐               ┌── store(51) ──\n                               │ (여기서 전환) │\n  T2:                          └── load(50) ── add(51) ── store(51)\n\n  두 번 증가시켰는데 counter 는 51.  하나가 통째로 사라졌다.\n<\/pre>\n\n세 명령어가 '''[[atomic]]하지 않다'''는 것, 즉 중간에 끊길 수 있다는 것이 모든 동시성 버그의 뿌리다. 이 세 줄 사이에 다른 스레드가 끼어드는 구간이 [[critical section]]이고, 거기에 [[mutual exclusion]]을 걸어 주는 도구가 [[락]]이다.\n\n{exam}\n2025F 중간고사 '''Problem 2'''의 해설에 \"Race Condition and Critical Section\" 슬라이드가 그대로 실려 있고, `for (i = 0; i < 1e7; i++) counter = counter + 1;` 부분에 Critical Section 표시가 되어 있다. → [[2025F 중간고사 족보]]\n{/exam}\n\n== 예상 문제 ==\n\n{quiz}\n'''(개념 판정)''' 싱글 코어 시스템에서 프로세스 A와 B가 번갈아 실행되었다. A와 B는 concurrent한가, sequential한가?\n{/quiz}\n{answer}\n'''Concurrent.''' 싱글 코어라도 두 프로세스의 실행 '''구간이 시간상 겹치면''' concurrent다. \"동시에 물리적으로 실행\"은 concurrency의 조건이 아니다.\n{/answer}\n\n{quiz}\n'''(서술)''' `./thread 1000` 은 항상 2000을 출력하는데 `./thread 100000` 은 매번 다른 값을 출력하는 이유를 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n`counter++`가 load–increment–store '''세 명령어로 쪼개지고 atomic하지 않아''' 두 스레드가 겹칠 때 갱신이 유실되는데, loop 수가 적으면 전환이 거의 일어나지 않아 우연히 정답이 나올 뿐이다.\n{/answer}\n\n== 관련 문서 ==\n* [[운영체제란]] / [[가상화]] / [[영속성]]\n* [[스레드]] — 동시성의 실행 단위\n* [[race condition]] / [[critical section]] / [[mutual exclusion]] / [[atomic]]\n* [[counter 예제]] — 이 문서의 `thread.c`를 8강에서 명령어 단위로 해부한다\n* [[락]] — 해결책\n* [[컨텍스트 스위치]]"
 },
 "영속성": {
  "title": "영속성 (Persistence)",
  "category": [
   "2강 What is OS",
   "용어"
  ],
  "body": "'''영속성'''(Persistence)은 전원이 꺼져도 데이터가 살아남게 하는 것, 그리고 그걸 담당하는 '''file system'''과 저장 장치 이야기다. three easy pieces의 세 번째이며, 이번 학기 중간고사 범위에서는 '''개념만''' 다루고 본격적인 내용은 기말 범위로 넘어간다.\n\n{def}\n'''Persistence''' (2강 p.34)<br>\n\"Devices such as DRAM store values in a '''volatile''' manner. Hardware and software are needed to store data persistently.\"<br>\n· '''Hardware''': I/O device such as a hard drive (HDD) and solid-state drives (SSDs)<br>\n· '''Software''': '''File system''' manages the disk — responsible for storing any files the user creates\n{/def}\n\n{analogy}\n🍦 픽업 주문이 들어와 아이스크림을 다 만들어 놨는데 손님이 안 온다. 카운터(=DRAM) 위에 그냥 두면 '''녹아 없어진다'''(= volatile). 해법은 '''냉장고'''(= persistent storage)에 넣는 것. 어느 칸에 넣을지, 어떤 이름표를 붙일지 정하고 기억하는 사람이 '''file system'''이다.\n{/analogy}\n\n[[img:L2-33.png|2강 p.33. 완성된 Ice cream #3를 Refrigerator에 넣는 그림. Refrigerator 안에는 Recipe와 Ingredients가 이미 들어 있다 — 디스크가 프로그램과 데이터의 원본 보관소라는 뜻.|medium]]\n\n== 슬라이드의 데모 ==\n\n`/tmp/file`에 `\"hello world\"`를 쓰는 프로그램(2강 p.35).\n\n<pre class=\"c\">\nint main(int argc, char *argv[])\n{\n    int fd = open(\"/tmp/file\", O_WRONLY | O_CREAT | O_TRUNC, S_IRWXU);\n    assert(fd > -1);\n    int rc = write(fd, \"hello world\\n\", 13);\n    assert(rc == 13);\n    close(fd);\n    return 0;\n}\n<\/pre>\n\n* `open()` / `write()` / `close()` 세 개는 전부 '''[[시스템 콜]]'''이다 (라이브러리 함수 `fopen`/`fwrite`가 아니다)\n* 이 호출들은 OS 안의 '''file system''' 부분으로 라우팅되어 처리된다\n* `fd`(file descriptor)는 OS가 돌려주는 정수 핸들. 모든 프로세스는 기본으로 stdin(0)·stdout(1)·stderr(2)를 이미 열어 놓은 상태로 시작한다 ([[프로세스|프로세스 생성 4단계]])\n\n== OS가 디스크에 쓸 때 하는 일 ==\n\n{def}\n\"What OS does in order to write to disk?\" (2강 p.36)<br>\n· Figure out '''where on disk''' this new data will reside<br>\n· Issue '''I/O requests''' to the underlying storage device<br>\n· File system handles '''system crashes''' during write — journaling or copy-on-write, carefully '''ordering writes''' to disk\n{/def}\n\n마지막 항목이 영속성의 진짜 난제다. \"쓰는 중에 전원이 꺼지면?\"을 견디기 위해 '''journaling'''이나 '''copy-on-write''' 같은 기법을 쓰고, 디스크 쓰기 순서를 신중하게 정한다.\n\n{warn}\n`write()`가 리턴했다고 해서 데이터가 디스크 플래터에 도달한 것은 '''아니다'''. 보통은 OS 버퍼에만 들어간다. 그래서 진짜 영속성이 필요하면 `fsync()`가 따로 있다. (중간고사 범위 밖이지만 개념 문제로 나올 수 있다.)\n{/warn}\n\n== 영속성이 CPU 가상화와 다른 점 ==\n\n{| class=\"table\"\n! || [[가상화|CPU 가상화]] || 영속성\n|-\n| 목표 || 자원이 '''무한히 많아 보이게''' || 데이터가 '''사라지지 않게'''\n|-\n| 착각을 만드나? || 그렇다 (illusion) || '''아니다''' — 파일은 실제로 존재해야 한다\n|-\n| 실패 모델 || 성능 저하 || '''crash consistency''' (전원 차단 중 일관성)\n|-\n| 담당 || [[스케줄러]], [[컨텍스트 스위치]] || File system, device driver\n|}\n\n{tip}\n2강 슬라이드의 Persistence 섹션 표지는 \"How can we ___\"에서 문장이 잘려 있다. 앞의 두 섹션이 각각 \"How can we '''own the shared resource'''?\"([[가상화]]), \"How can we '''overlap the task'''?\"([[동시성]])이었으니 여기 들어갈 말은 \"How can we '''store the data persistently'''?\" 정도다. 슬라이드 오타이므로 시험에 나올 일은 없다.\n{/tip}\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"디스크를 관리하며 사용자가 만든 파일을 저장하는 책임을 지는, OS의 소프트웨어 구성 요소\"는?\n{/quiz}\n{answer}\n'''File system'''(파일 시스템). 하드웨어 쪽 파트너는 HDD/SSD 같은 I/O device다.\n{/answer}\n\n{quiz}\n'''(개념)''' 파일에 쓰는 도중 시스템이 죽을 수 있다. 파일 시스템이 이를 견디기 위해 쓰는 기법 두 가지를 슬라이드 용어로 쓰시오.\n{/quiz}\n{answer}\n'''Journaling'''과 '''copy-on-write'''. 여기에 \"carefully '''ordering writes''' to disk\"(쓰기 순서를 신중히 정하기)가 더해진다. (2강 p.36)\n{/answer}\n\n== 관련 문서 ==\n* [[운영체제란]] / [[가상화]] / [[동시성]]\n* [[시스템 콜]] — `open`/`write`/`close`가 커널로 들어가는 길\n* [[프로그램 로딩]] — 디스크의 실행 파일이 메모리로 올라오는 반대 방향의 여정\n* [[OSTEP]] — 3부 전체가 persistence"
 },
 "커널": {
  "title": "커널 (Kernel)",
  "category": [
   "2강 What is OS",
   "용어"
  ],
  "body": "'''커널'''(Kernel)은 운영체제에서 항상 메모리에 상주하며 [[특권 명령]]을 실행할 수 있는 핵심부다. 슬라이드에서 그냥 \"OS\"라고 적힌 파란 박스가 사실상 커널이고, 그 위의 [[시스템 콜]] 인터페이스가 유저 프로그램과의 유일한 접점이다.\n\n{def}\n슬라이드에 \"kernel\"의 독립된 정의 장은 없지만, 1강 p.22의 그림이 정의 역할을 한다.<br>\n'''Operating System: Overall''' — \"A '''resource manager and service provider''' for user programs.\" 그림은 User Program / '''OS''' / Hardware 3층 구조이고, OS 층 안에 Network, File management, File systems, Buffer cache, Device drivers, Process Control(IPC, Scheduler, Memory Management), Hardware control이 들어 있다.\n{/def}\n\n[[img:L1-22.png|1강 p.22. 위 점선이 user program과 OS의 경계, 아래 점선이 OS와 hardware의 경계. 그 사이 전부가 커널이다.|large]]\n\n{analogy}\n🍦 가게에서 '''주방'''이 커널이다. 손님은 절대 주방에 못 들어오고(= [[유저 모드와 커널 모드|모드 분리]]), 주문은 오직 키오스크를 통해서만 들어간다(= [[시스템 콜]]). 대신 주방은 냉장고·조리대·직원(= 하드웨어) 전부를 마음대로 쓸 수 있다(= [[특권 명령]]).\n{/analogy}\n\n== 커널의 자격 ==\n\n{| class=\"table\"\n! || 유저 프로그램 || 커널\n|-\n| 실행 모드 || user mode || '''[[커널 모드]]''' (supervisor mode)\n|-\n| [[특권 명령]] || 실행 불가 (실행하면 trap) || 실행 가능\n|-\n| 메모리 || 자기 [[주소 공간]]만 || 물리 메모리 전부 + 모든 프로세스의 [[PCB]]\n|-\n| 진입 방법 || — || [[시스템 콜]], [[인터럽트]], exception\n|-\n| 스택 || user stack || 프로세스마다 하나씩 있는 [[커널 스택]]\n|}\n\n== 커널은 \"따로 도는 프로그램\"이 아니다 ==\n\n{warn}\n흔한 오해: \"커널이라는 프로세스가 따로 돌면서 유저 프로그램을 감시한다.\" '''틀렸다.'''<br>\n평소에 CPU 위에서 도는 것은 유저 프로그램뿐이고, 커널 코드는 [[시스템 콜]]·[[인터럽트]]·exception이 발생했을 때 '''그 프로세스의 문맥에서''' 실행된다. 그래서 프로세스마다 [[커널 스택]]이 하나씩 필요한 것이다.\n{/warn}\n\n{tip}\n0831 녹음본, 프로세스 생성의 마지막 단계(control transfer)를 설명하면서 교수님이 짚은 대목: \"actually '''every process can run the kernel'''. In terms of this control transfer, the process would start from the '''kernel state''' and then transfer the control to the '''user space'''. Inside the user space, the program will run from the `main` function.\"<br>\n즉 새 프로세스는 커널 모드에서 태어나서 user mode로 '''내려가며''' 시작한다.\n{/tip}\n\n<pre class=\"ascii\">\n      시간 →\n\n  user mode   ████████         ████████████        ██████\n                      ╲       ╱            ╲      ╱\n                       ecall / 타이머 인터럽트      sret\n                        ╲   ╱                ╲   ╱\n  kernel mode            ███                  ███\n                      (커널 코드가 '그 프로세스의' 커널 스택 위에서 실행)\n<\/pre>\n\n== 커널이 유지하는 것들 ==\n\n* 모든 프로세스의 [[PCB]] ([[xv6]]에서는 [[struct proc]]) — [[프로세스 목록]]\n* [[트랩 테이블]] — 어떤 사건에 어떤 핸들러를 부를지\n* [[스케줄러]] 자료구조\n* 파일 테이블, 페이지 테이블, 디바이스 큐 …\n\n이 데이터들이 유저 프로그램 손에 닿으면 보호가 무너지기 때문에, 커널은 [[제한적 직접 실행]]이라는 방식으로 \"대부분은 하드웨어에서 그냥 직접 돌리되, 위험한 순간에만 개입\"한다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(개념)''' \"커널은 별도의 프로세스로 항상 돌면서 유저 프로그램을 감시한다.\" 참인가 거짓인가? 이유를 한 문장으로.\n{/quiz}\n{answer}\n'''거짓.''' 커널 코드는 [[시스템 콜]]·[[인터럽트]]·exception이 발생했을 때 '''그 프로세스의 문맥(커널 스택)에서''' 실행되며, 평소 CPU 위에서 도는 것은 유저 코드다.\n{/answer}\n\n== 관련 문서 ==\n* [[운영체제란]] / [[시스템 콜]] / [[유저 모드와 커널 모드]]\n* [[커널 모드]] / [[특권 명령]] / [[커널 스택]]\n* [[제한적 직접 실행]] / [[트랩]]\n* [[PCB]] / [[struct proc]]"
 },
 "시스템 콜": {
  "title": "시스템 콜 (System Call)",
  "category": [
   "2강 What is OS",
   "용어"
  ],
  "body": "'''시스템 콜'''(System call)은 유저 프로그램이 OS에게 \"이것 좀 해 달라\"고 말하는 유일한 공식 창구다. 2강에서 개념으로, 3강에서 [[프로세스 API]]로, 4강에서 [[트랩]] 메커니즘으로, 과제 1에서 [[시스템 콜 추가 절차|직접 하나 만들어 보는 것]]으로 네 번 반복해서 나온다.\n\n{def}\n'''System Call''' (2강 p.6)<br>\n\"System call allows users to '''tell the OS what to do'''.\"<br>\n· The OS provides some '''interface''' (APIs and standard library)<br>\n· A typical OS exports '''a few hundred''' system calls — to run programs, to access memory, and to access devices\n{/def}\n\n[[img:L2-06.png|2강 p.6. Task들과 OS 사이에 놓인 하늘색 띠가 \"System call interface\". 화살표는 전부 위에서 아래로 — 유저가 커널에게 요청한다.|large]]\n\n{analogy}\n🍦 (교수님의 슬라이드 비유 그대로) 진상 손님이 왔다. 조리대를 직접 만지게 둘 수도 없고, 메뉴에 없는 주문을 받을 수도 없다. 해법은 '''벽을 세우고 키오스크를 놓는 것'''. 단, 슬라이드가 빨간 글씨로 강조하듯 \"'''But allow them to order anything in the menu'''\" — 보호란 기능을 줄이는 게 아니라 '''입구를 하나로 좁히는 것'''이다.\n{/analogy}\n\n[[img:L2-05.png|2강 p.5. Kiosk(시스템 콜) — Wall(모드 경계) — Table/Worker(커널과 하드웨어).|medium]]\n\n== 라이브러리 함수 vs 시스템 콜 ==\n\n[[img:L1-30.png|1강 p.30. printf()는 user space의 라이브러리 함수, write()가 시스템 콜. 점선이 경계.|medium]]\n\n{| class=\"table\"\n! || 라이브러리 함수 || 시스템 콜\n|-\n| 예 || `printf`, `malloc`, `fopen`, `fwrite` || `write`, `brk`/`sbrk`, `open`, `read`, [[fork]], [[exec|execv]], [[wait]]\n|-\n| 실행 위치 || user space || 커널 (경계를 넘는다)\n|-\n| 비용 || 함수 호출 한 번 || [[트랩]] + [[유저 모드와 커널 모드|모드 전환]] + 복귀\n|-\n| 없어도 되나 || 된다 (직접 시스템 콜을 써도 됨) || 안 된다 — 하드웨어 접근의 유일한 길\n|}\n\n{tip}\n0831 녹음본: \"this file descriptor is set up by the '''operating system''' so you don't need to use the standard library to set up these default files. '''In principle you can directly use the system call to write the data without the standard library.''' This is the point I want to make.\"<br>\n→ `malloc()`은 라이브러리, 그 안에서 부르는 `brk`/`sbrk`가 시스템 콜. 이 짝을 예로 들 수 있으면 개념을 잡은 것이다.\n{/tip}\n\n== 무엇을 위해 있나 ==\n\n1강 p.28의 분류를 시스템 콜 기준으로 다시 읽으면 이렇다.\n\n{| class=\"table\"\n! 자원 || 시스템 콜\n|-\n| CPU / 프로세스 || [[fork]], [[exec|execv]], [[wait]], exit, kill, getpid, getpriority\n|-\n| 메모리 || brk, sbrk (그 위에 malloc/free)\n|-\n| 파일 || open, read, write, close, mknod, pipe\n|-\n| 디바이스 || open, read, write, ioctl\n|-\n| 네트워크 || socket, bind, listen, send, receive\n|}\n\n같은 이름의 `read`/`write`가 파일에도 디바이스에도 쓰인다는 점이 유닉스 설계의 핵심(\"everything is a file\")이다.\n\n== 어떻게 동작하나 ==\n\n개념 수준에서는 \"부른다\"지만, 실제로는 '''보통의 함수 호출이 아니다'''. 유저 코드는 커널 주소로 그냥 점프할 수 없다.\n\n<pre class=\"ascii\">\n  user                        kernel\n  ────────────────────────────────────────────────────────\n  write(fd, buf, n)\n     │  a7 ← SYS_write        (시스템 콜 번호를 레지스터에)\n     │  a0, a1, a2 ← 인자\n     │  ecall  ────────────►  하드웨어가 모드를 kernel 로 올리고\n     │                        트랩 벡터로 점프\n     │                            │\n     │                        usertrap() → syscall() → sys_write()\n     │                            │\n     │  ◄──────── sret ───────  결과를 a0 에 넣고 유저 모드로 복귀\n     ▼\n  리턴값 = a0\n<\/pre>\n\n* 시스템 콜 번호는 레지스터([[RISC-V]]에서는 `a7`)에 실어 보낸다\n* 인자는 `a0`~`a5`, 반환값은 '''[[a0]]'''\n* 실제 전환은 `ecall` 명령어가 일으키는 '''[[트랩]]'''이다 → 자세한 것은 [[xv6 시스템 콜 경로]], [[제한적 직접 실행]]\n\n{warn}\n시스템 콜의 '''반환값은 [[a0]]에 들어간다'''는 사실이 과제 1(그리고 2026-09-23 퀴즈 4번)의 핵심 함정이다. [[sigreturn]]이 `return 0;`을 하면 커널의 `syscall()`이 그 0을 `p->trapframe->a0`에 덮어써서, 인터럽트당한 유저 코드의 원래 `a0`가 날아간다. → [[a0 복원]]\n{/warn}\n\n== 시스템 콜을 직접 하나 만들려면 ==\n\n과제 1은 [[sigalarm]]·[[sigreturn]] 두 개를 추가하는 일이다. 건드려야 하는 파일과 순서는 [[시스템 콜 추가 절차]] 문서에 파일별 체크리스트로 정리해 두었다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"유저가 OS에게 무엇을 할지 알려 주는 수단으로, 전형적인 OS는 수백 개를 export한다\"에 해당하는 용어는?\n{/quiz}\n{answer}\n'''System call'''(시스템 콜). 슬라이드 문장은 \"System call allows users to tell the OS what to do … A typical OS exports a few hundred system calls.\"\n{/answer}\n\n{quiz}\n'''(구분)''' 다음 중 시스템 콜이 '''아닌''' 것을 모두 고르시오.<br>\n① `write` ② `printf` ③ `fork` ④ `malloc` ⑤ `open` ⑥ `fopen`\n{/quiz}\n{answer}\n'''② printf, ④ malloc, ⑥ fopen''' — 전부 표준 라이브러리 함수다. 각각 내부에서 `write`, `brk`/`sbrk`, `open` 시스템 콜을 부른다.\n{/answer}\n\n{quiz}\n'''(서술)''' 시스템 콜이 일반 함수 호출처럼 `call` 명령으로 커널 함수를 직접 부를 수 없는 이유를 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n유저 코드는 '''user mode'''에서 돌기 때문에 커널 메모리에 접근하거나 [[특권 명령]]을 실행할 수 없고, 모드를 올리는 것은 `ecall` 같은 명령이 일으키는 '''[[트랩]]'''과 하드웨어가 정해 둔 [[트랩 테이블|트랩 벡터]]를 통해서만 가능하기 때문이다.\n{/answer}\n\n== 관련 문서 ==\n* [[운영체제란]] / [[커널]] / [[유저 모드와 커널 모드]]\n* [[프로세스 API]] — 프로세스 관련 시스템 콜 묶음\n* [[시스템 콜 추가 절차]] — 과제 1에서 직접 해 보는 절차\n* [[트랩]] / [[제한적 직접 실행]] / [[xv6 시스템 콜 경로]]\n* [[a0]] / [[a0 복원]]\n* [[과제1 xv6 alarm]] / [[sigalarm]] / [[sigreturn]]"
 },
 "유저 모드와 커널 모드": {
  "title": "유저 모드와 커널 모드 (User Mode / Kernel Mode)",
  "category": [
   "2강 What is OS",
   "용어"
  ],
  "body": "CPU는 매 순간 '''user mode''' 아니면 '''kernel mode''' 둘 중 하나로 돌고 있다. 이 하드웨어 비트 하나가 OS의 보호(protection) 전체를 떠받친다. 2강에서 비유로 소개되고, 4강 [[제한적 직접 실행]]에서 본격적으로 다뤄진다.\n\n{def}\n2강 슬라이드는 모드를 \"wall(벽)\"로 소개한다 (p.5).<br>\n\"Someone (malicious user) comes. Can you allow them to '''modify your countertop'''? Can you allow '''any order''' from them? '''Solution: Make a wall and give them a kiosk''' — but allow them to order anything in the menu.\"<br>\n그리고 1강 p.30의 그림에서 점선 위는 '''User space''', 아래는 '''OS'''로 표시된다.\n{/def}\n\n{analogy}\n🍦 주방(커널)과 손님 구역(유저) 사이의 '''벽'''이 모드 비트다. 손님은 벽 안으로 못 들어가지만, 키오스크([[시스템 콜]])로 주문하면 주방이 대신 해 준다. 손님이 벽을 넘으려 시도하면? 경보가 울리고 경비가 온다 — 그게 '''[[트랩]]'''이다.\n{/analogy}\n\n== 두 모드의 차이 ==\n\n{| class=\"table\"\n! || User mode || Kernel mode (supervisor mode)\n|-\n| 누가 || 응용 프로그램, 라이브러리 || [[커널]] 코드\n|-\n| [[특권 명령]] || ✗ 실행하면 [[트랩]] 발생 || ✓\n|-\n| 접근 가능한 메모리 || 자기 [[주소 공간]]만 || 물리 메모리 전부\n|-\n| I/O 장치 직접 접근 || ✗ || ✓\n|-\n| 쓰는 스택 || [[스택|user stack]] || [[커널 스택]]\n|-\n| [[레지스터|모드 비트]]의 물리적 실체 || [[RISC-V]]의 현재 privilege level (U / S / M) ||\n|}\n\n<pre class=\"ascii\">\n   ┌───────────────────────────────────────────────┐\n   │  User mode                                    │\n   │    응용 프로그램, printf(), malloc()           │\n   │    \"메뉴에 있는 건 뭐든 주문 가능\"              │\n   └───────────────────────────────────────────────┘\n       │  ecall / 인터럽트 / exception      ▲  sret\n       │  (모드 ↑, 트랩 테이블로 점프)        │  (모드 ↓, epc 로 복귀)\n       ▼                                     │\n   ┌───────────────────────────────────────────────┐\n   │  Kernel mode                                  │\n   │    usertrap(), syscall(), 스케줄러, 드라이버   │\n   │    특권 명령 + 전체 메모리 + I/O                │\n   └───────────────────────────────────────────────┘\n<\/pre>\n\n== 모드는 언제 바뀌나 ==\n\n'''user → kernel''' (올라감): 유저가 스스로 올라갈 수는 없다. 세 가지 사건뿐.\n# '''System call''' — `ecall` 명령 (의도적, [[트랩]])\n# '''Interrupt''' — [[타이머 인터럽트]], 디스크 완료 등 (비동기, 외부 사건)\n# '''Exception / fault''' — page fault, 0으로 나누기, 잘못된 [[특권 명령]] 실행\n\n'''kernel → user''' (내려감): [[return-from-trap]] — [[RISC-V]]에서는 [[sret]] 명령. 이때 [[sepc]]에 저장돼 있던 주소로 PC가 복원된다.\n\n{warn}\n'''\"유저 프로그램이 커널 모드로 전환한다\"는 표현은 부정확하다.''' 유저가 하는 일은 `ecall`을 실행하는 것뿐이고, 모드를 올리고 정해진 진입점으로 점프시키는 것은 '''하드웨어'''다. 그래서 유저는 \"커널의 아무 주소\"로 들어갈 수 없고, OS가 [[트랩 테이블]]에 등록해 둔 곳으로만 들어간다.\n{/warn}\n\n== 과제 1에서 왜 중요한가 ==\n\n{exam}\n2026-09-23 퀴즈 '''1번(10점)''' — \"The alarm handler registered by `sigalarm` executes in ( user mode / kernel mode ).\"<br>\n정답은 '''user mode'''. [[alarm_handler]]는 유저 프로그램이 작성한 함수이고, 커널은 [[trapframe]]의 [[epc]]를 그 주소로 바꿔치기해서 '''유저 모드로 내려간 뒤에''' 실행되게 만든다. 커널이 핸들러를 \"부르는\" 게 아니다. → [[퀴즈1 복기]]\n{/exam}\n\n{tip}\n0831 녹음본에서 교수님이 프로세스 생성 5단계(`main()`에서 시작)를 설명하며: \"the process would start from the '''kernel state''' and then transfer the control to the '''user space'''. Inside the user space, the program will run from the main function.\" 새 프로세스조차 커널 모드에서 태어난다.\n{/tip}\n\n== 예상 문제 ==\n\n{quiz}\n'''(선택)''' 다음 중 user mode → kernel mode 전환을 일으키지 '''않는''' 것은?<br>\n① `ecall` 실행 ② [[타이머 인터럽트]] ③ page fault ④ 일반 함수 `call` 명령 ⑤ 유저 코드가 특권 명령을 실행\n{/quiz}\n{answer}\n'''④ 일반 함수 call 명령.''' 함수 호출은 같은 모드·같은 [[주소 공간]] 안의 점프일 뿐이다. ⑤는 실행이 '''실패'''하며 exception(트랩)을 일으켜 커널로 들어간다.\n{/answer}\n\n{quiz}\n'''(개념)''' [[sigalarm]]으로 등록한 alarm handler는 어느 모드에서 실행되는가? 한 문장으로 이유까지 쓰시오.\n{/quiz}\n{answer}\n'''User mode.''' 커널은 [[trapframe]]의 [[epc]]를 핸들러 주소로 바꾼 뒤 [[sret|return-from-trap]]으로 유저 모드로 내려가므로, 핸들러는 유저 코드로서 실행된다.\n{/answer}\n\n== 관련 문서 ==\n* [[커널]] / [[커널 모드]] / [[특권 명령]] / [[커널 스택]]\n* [[시스템 콜]] / [[트랩]] / [[트랩 테이블]]\n* [[제한적 직접 실행]] / [[return-from-trap]] / [[sret]] / [[sepc]] / [[epc]]\n* [[과제1 xv6 alarm]] / [[alarm_handler]]"
 },
 "OS 설계 목표": {
  "title": "OS 설계 목표 (Design Goals)",
  "category": [
   "2강 What is OS",
   "용어"
  ],
  "body": "'''OS 설계 목표'''(Design Goals)는 2강 마지막 두 장(p.37~38)에 나오는 목록으로, \"OS를 만들 때 무엇을 잘해야 하는가\"를 정리한 것이다. 항목 수가 적고 문장이 짧아 '''정의→용어''' 또는 '''O/X''' 형태로 출제하기 딱 좋은 장이다.\n\n[[img:L2-37.png|2강 p.37 — OS 설계 목표|medium]]\n\n{def}\n'''Design Goals''' (2강 p.37~38)<br>\n· '''Build up abstraction''' — Make the system convenient and easy to use<br>\n· '''Provide high performance''' — Minimize the overhead of the OS; the OS must strive to provide virtualization '''without excessive overhead'''<br>\n· '''Protection between applications''' — Isolation: '''Bad behavior of one does not harm other and the OS itself'''<br>\n· '''High degree of reliability''' — The OS must also run '''non-stop'''<br>\n· '''Other issues''' — Energy-efficiency, Security, Portability\n{/def}\n\n{analogy}\n🍦 가게를 설계할 때의 목표와 똑같다. ① 손님이 메뉴판만 보고 주문할 수 있게(abstraction — 레시피를 몰라도 된다) ② 주문 처리에 쓸데없는 시간을 안 쓰게(performance) ③ 진상 손님 하나가 다른 손님과 '''가게 자체'''를 망치지 못하게(protection/isolation) ④ 24시간 문을 닫지 않게(reliability) ⑤ 그리고 전기세·보안·다른 지점 확장(energy/security/portability).\n{/analogy}\n\n== 항목별로 ==\n\n{| class=\"table\"\n! 목표 || 슬라이드 문장의 핵심 || 이 과목 어디서 배우나\n|-\n| '''Abstraction''' || convenient and easy to use || [[프로세스]], [[주소 공간]], 파일 — 전부 추상화다\n|-\n| '''Performance''' || '''minimize the overhead''' of the OS || [[제한적 직접 실행]](왜 \"직접\" 실행인가), [[컨텍스트 스위치]] 비용, [[cache affinity]]\n|-\n| '''Protection''' || isolation — 다른 앱'''과 OS 자신'''을 보호 || [[유저 모드와 커널 모드]], [[시스템 콜]], [[트랩]]\n|-\n| '''Reliability''' || run '''non-stop''' || [[비협력적 방식]](무한 루프 프로세스를 [[타이머 인터럽트]]로 끊기)\n|-\n| '''Energy / Security / Portability''' || \"other issues\" || 범위 밖 (언급만)\n|}\n\n== 왜 Performance가 목표로 들어가나 ==\n\n가상화는 공짜가 아니다. 프로세스를 바꿀 때마다 [[레지스터]]를 메모리에 쏟아붓고 다시 채워야 한다.\n\n{tip}\n0831 녹음본: \"you can find their list of overhead — stopping the running process and then change it to another process. This is called '''context switch''' … you need to '''flush the register file contents into the memory''' and you need to store the program counter and so on. So all of them is the '''overhead'''. So for the time sharing, the potential cost is the '''performance'''.\"\n{/tip}\n\n이 긴장 관계(보호를 위해 개입 vs 성능을 위해 개입 최소화)를 해결하는 아이디어가 4강 [[제한적 직접 실행]]의 이름 그 자체다 — \"'''Limited''' Direct Execution\", 제한을 걸되 기본은 '''직접''' 실행.\n\n== 시험에 나오는 지점 ==\n\n{warn}\n'''Protection과 Isolation을 별개 항목으로 외우면 안 된다.''' 슬라이드에서 Isolation은 Protection의 '''설명'''으로 들여쓰기 되어 있다.<br>\n그리고 그 문장이 \"Bad behavior of one does not harm '''other and the OS itself'''\" — 보호 대상에 '''OS 자신이 포함'''된다는 부분이 함정 포인트다.\n{/warn}\n\n{warn}\n\"OS는 virtualization을 '''overhead 없이''' 제공해야 한다\"는 틀린 문장이다. 슬라이드는 \"without '''excessive''' overhead\"(과도한 오버헤드 없이)라고 쓴다. 오버헤드는 0이 될 수 없다.\n{/warn}\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"한 프로그램의 잘못된 동작이 다른 프로그램과 OS 자신에게 해를 끼치지 않도록 하는 것\"을 가리키는 설계 목표 용어는?\n{/quiz}\n{answer}\n'''Protection''' — 구체적으로는 '''Isolation'''(격리). 보호 대상에 \"and '''the OS itself'''\"가 포함된다는 점을 반드시 함께 쓸 것.\n{/answer}\n\n{quiz}\n'''(O/X)''' \"OS의 설계 목표 중 하나는 virtualization을 overhead 없이(without overhead) 제공하는 것이다.\"\n{/quiz}\n{answer}\n'''X.''' 슬라이드 문장은 \"without '''excessive''' overhead\" — '''과도한''' 오버헤드 없이다. 오버헤드 자체는 [[컨텍스트 스위치]] 등으로 불가피하며, 목표는 그것을 '''최소화'''(minimize)하는 것이다.\n{/answer}\n\n== 관련 문서 ==\n* [[운영체제란]] — 설계 목표가 나오는 맥락\n* [[가상화]] — 성능 비용의 출처\n* [[유저 모드와 커널 모드]] / [[시스템 콜]] — protection의 구현\n* [[제한적 직접 실행]] — 보호와 성능의 타협점\n* [[비협력적 방식]] / [[타이머 인터럽트]] — reliability의 구현"
 },
 "OS 역사": {
  "title": "OS 역사와 하드웨어 계보",
  "category": [
   "1강 Intro",
   "3강 From Program to Process",
   "용어"
  ],
  "body": "{info}\n'''먼저 밝혀 둘 것''': 이 수업 슬라이드에는 \"History of Operating Systems\" 같은 독립된 연대기 장이 '''없다'''. 대신 3강 앞부분(p.4~7)이 \"프로세서란 무엇인가\"를 설명하면서 하드웨어 계보를 훑고, 1강이 교재·[[xv6]]의 출신을 언급한다. 이 문서는 그 흩어진 조각을 모은 것이고, 슬라이드에 근거가 있는 부분과 배경 지식을 구분해 표시했다.\n{/info}\n\n== ① Stored Program Computer (슬라이드 3강 p.4) ==\n\n{def}\n'''Stored Program Computer''' (3강 p.4)<br>\n· Instantiation of '''Universal Turing Machine'''<br>\n· '''Von Neumann architecture (1945)'''<br>\n&nbsp;&nbsp;- Charles Babbage's Analytical Engine (1837)<br>\n&nbsp;&nbsp;- Manchester Baby (1948) and EDSAC (1949)\n{/def}\n\n[[img:L3-04.png|3강 p.4. 왼쪽은 초기 전자계산기 사진, 오른쪽은 Input → CPU(Control Unit + Logic Unit) ↔ Memory → Output 구조.|medium]]\n\n핵심 아이디어는 '''프로그램을 데이터와 똑같이 메모리에 저장한다'''는 것이다. 이 한 줄이 없으면 [[프로그램 로딩]]도 [[프로세스]]도 성립하지 않는다 — \"디스크의 실행 파일을 메모리에 올린다\"는 말 자체가 stored program 모델의 산물이기 때문이다.\n\n{tip}\n0831 녹음본에서 교수님의 배경 설명: \"in older computers there is '''no concept like the program'''. … the calculator is one kind of computer and it only can process the given formula. … the primitive computer like '''Colossus''' which used to break some encryption. At that time the computer cannot process some general purpose program but they only have some '''program circuit''' that is specialized for the given task.\"<br>\n→ 옛날 컴퓨터는 \"용도별 회로\"였고, 범용 컴퓨터가 되려면 프로그램이 '''데이터로''' 저장돼야 했다.\n{/tip}\n\n{analogy}\n🍦 가게에 비유하면 이렇다. 옛날 방식은 '''바닐라 전용 기계''' 한 대를 사는 것이다 — 초코를 팔려면 기계를 새로 사야 한다. Stored program 방식은 '''레시피 종이를 바꿔 끼우는 것''' — 직원(CPU)은 그대로 두고 레시피(프로그램)만 갈아 끼우면 뭐든 만든다. 냉장고에 레시피와 재료가 '''같은 방식으로''' 들어가 있다는 게 von Neumann의 핵심이다.\n{/analogy}\n\n== ② x86의 진화 (슬라이드 3강 p.5~6) ==\n\n{| class=\"table\"\n! 프로세서 || 연도 || 트랜지스터\n|-\n| 386 || 1985 || 0.3M\n|-\n| Pentium || 1993 || 3.1M\n|-\n| Pentium/MMX || 1997 || 4.5M\n|-\n| PentiumPro || 1995 || 6.5M\n|-\n| Pentium III || 1999 || 8.2M\n|-\n| Pentium 4 || 2001 || 42M\n|-\n| Core 2 Duo || 2006 || 291M\n|-\n| Core i7 || 2008 || 731M\n|}\n\n[[img:L3-06.png|3강 p.6. 오른쪽 다이 사진에 Core 0~3과 Shared L3 Cache가 보인다 — 트랜지스터가 남아돌기 시작하자 코어를 늘리는 쪽으로 갔다는 증거.|medium]]\n\n슬라이드가 강조하는 건 숫자가 아니라 '''왜 x86이 이겼는가'''다.\n\n* '''Evolutionary design''': 1978년 8086부터 '''backward compatible'''을 유지하며 기능만 계속 추가\n* '''CISC''' (Complex Instruction Set Computer): 명령어 종류·형식이 많고 복잡. \"Hard to match performance of '''RISC'''\"라고 슬라이드가 직접 인정한다\n\n{tip}\n0831 녹음본: \"it is quite important, especially in the '''server market''', because inside the server we usually just use the '''legacy program''' without upgrading it. So … '''that is the reason X86 processor wins the server market'''. … They are slowly transitioning into the RISC computers.\"<br>\n→ 성능이 아니라 '''하위 호환'''이 시장을 결정했고, 지금은 ARM/[[RISC-V]] 쪽으로 서서히 넘어가는 중이라는 것.\n{/tip}\n\n=== Architecture vs Microarchitecture (3강 p.7) ===\n\n{def}\n· '''Architecture''' (= ISA, Instruction Set Architecture): \"The parts of a processor design that one needs to understand to write '''assembly''' code.\" 예: `mov`/`add` 같은 명령어 명세, `eip` 같은 [[레지스터]] 명세<br>\n· '''Microarchitecture''': \"'''Implementation''' of the architecture.\" 예: cache size, core frequency<br>\n· Example ISAs (Intel): x86, IA32\n{/def}\n\nISA는 '''약속(인터페이스)''', 마이크로아키텍처는 '''구현'''이다. 같은 x86 ISA를 인텔과 AMD가 전혀 다른 마이크로아키텍처로 구현한다. 이 구분은 [[레지스터]]·[[프로그램 카운터]]가 \"ISA가 정한 것\"이라는 점을 이해하는 데 필요하다.\n\n== ③ UNIX → xv6 → 이 수업 ==\n\n슬라이드에 연대는 없지만 1강 p.8·p.10~11이 계보를 밝힌다.\n\n<pre class=\"ascii\">\n  UNIX (Bell Labs, 1970s)\n      │  \"simple, Unix-like\"\n      ▼\n  xv6  — MIT 6.828 교육용 OS, x86 → RISC-V 로 포팅\n      │  이 수업의 4개 프로젝트가 돌아가는 무대\n      ▼\n  coruslab-src/xv6-lab  (traps 브랜치)  ← 과제 1\n<\/pre>\n\n* '''[[xv6]]''': \"a simple but POSIX-compliant operating system designed for multiprocessor x86 and '''RISC-V'''\", MIT 운영체제 수업용. (1강 p.8)\n* 교재 3종: '''[[OSTEP]]''' (Arpaci-Dusseau, 2015, 무료 공개) / Silberschatz \"Operating System Concept\" 9th / Bryant \"CSAPP\" 2nd\n* 이 수업의 슬라이드는 \"based on the '''authors' slides'''\" — 즉 OSTEP 저자 슬라이드가 원본이다 (1강 p.10)\n\n{warn}\n과제 1의 [[xv6]]는 '''[[RISC-V]]''' 버전인데, 3강 슬라이드 p.37~38의 [[struct proc]]은 '''x86''' 시절 코드(`eip`, `ebx`, `esi`, `edi`, `ebp`)다. 슬라이드와 실제 과제 코드가 다르다는 걸 모르고 외우면 [[struct proc]] 문제에서 헷갈린다. → [[struct proc]]\n{/warn}\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"프로그램을 데이터와 마찬가지로 메모리에 저장해 두고 CPU가 하나씩 꺼내 실행하는 컴퓨터 구조\"를 가리키는 말과, 그것을 1945년에 정식화한 구조의 이름을 쓰시오.\n{/quiz}\n{answer}\n'''Stored Program Computer''' / '''Von Neumann architecture (1945)'''. 이론적 뿌리는 '''Universal Turing Machine'''이고, 슬라이드는 선구 사례로 Babbage's Analytical Engine(1837), Manchester Baby(1948), EDSAC(1949)를 든다.\n{/answer}\n\n{quiz}\n'''(구분)''' 다음 중 '''Microarchitecture'''에 속하는 것을 모두 고르시오.<br>\n① `mov`, `add` 명령어 명세 ② cache size ③ `eip` 레지스터의 존재 ④ core frequency\n{/quiz}\n{answer}\n'''② cache size, ④ core frequency.''' ①③은 '''Architecture(ISA)''' — 어셈블리를 쓰기 위해 알아야 하는 명세다.\n{/answer}\n\n== 관련 문서 ==\n* [[운영체제란]] — 1·2강 본문\n* [[프로세스]] — stored program 모델의 직접적 귀결\n* [[프로그램 로딩]] / [[주소 공간]]\n* [[레지스터]] / [[프로그램 카운터]] / [[RISC-V]]\n* [[xv6]] / [[OSTEP]]\n* [[struct proc]] — 슬라이드(x86)와 과제(RISC-V)의 차이"
 },
 "프로세스": {
  "title": "프로세스 (Process)",
  "category": [
   "3강 From Program to Process"
  ],
  "body": "'''프로세스'''(Process)는 '''실행 중인 프로그램의 인스턴스'''다. 3강 전체가 딱 네 개의 질문에 답하기 위해 존재하고, 그 마지막 질문의 답이 바로 이 단어다.\n\n3강 p.2에서 교수님이 던지는 네 질문:\n# What is program execution? (프로그램 실행이란 무엇인가)\n# What happens when we execute the program? (실행하면 무슨 일이 일어나는가)\n# How can we manage the program execution? (그 실행을 어떻게 관리하는가)\n# What should be the name of the thing (\"program-in-execution\")? (그것의 이름은?)\n\np.39에서 답이 전부 채워진다: ① 프로그램이 기술한 계산의 수행 ② 메모리에 로드 + CPU의 fetch-decode-execute ③ '''OS가 실행에 필요한 정보를 보관하며''' 관리 ④ '''Process'''.\n\n{def}\n'''Process''' (3강 p.23)<br>\n\"A process is an '''instance of a running program'''. One of the most profound ideas in computer science. '''Not the same as \"program\" or \"processor\"'''.\"<br>\nProcess includes two key abstractions:<br>\n· '''Control flow''' (a.k.a thread) — a sequence of instructions; each process has '''exclusive''' control flow (+ registers)<br>\n· '''Memory address space''' — set of rights of a process (to access the memory); each process has an '''exclusive''' address space\n{/def}\n\n{analogy}\n🏢 '''아파트 건설'''. 프로그램은 '''설계도'''다 — 종이 한 장, 디스크 위의 바이트 나열, 정적인 청사진. 프로세스는 그 설계도로 실제로 '''짓고 있는 건물'''이다. 같은 설계도로 3개 동을 지으면 건물은 3개 생기고, 각 동의 공사 진척도(= [[프로그램 카운터|PC]]와 [[레지스터]])와 자재 창고(= [[주소 공간]])는 서로 완전히 별개다.<br>\n0831 녹음본에서 교수님이 쓴 비유가 정확히 이것이다: \"the apartments have the same blueprint and they have multiple buildings … all of the process have the '''exclusive control flow'''.\"\n{/analogy}\n\n{warn}\n'''용어 3형제 구분''' (슬라이드가 직접 경고한다)<br>\n· '''Program''' = 디스크 위의 실행 파일 (ELF). 정적, 바이트의 나열<br>\n· '''Process''' = 메모리에 올라가 실행 중인 인스턴스. 동적<br>\n· '''Processor''' = 하드웨어 CPU<br>\n셋을 섞어 쓰면 3강 문제는 거의 다 틀린다.\n{/warn}\n\n----\n\n== 1. 프로그램이 실행된다는 것 ==\n\n=== Fetch – Decode – Execute ===\n\n{def}\n\"A running program (task or process) executes instructions\" (3강 p.8)<br>\n# '''Fetch''': The processor reads an instruction from memory<br>\n# '''Decode''': Figure out which instruction this is<br>\n# '''Execute''': i.e., add two numbers, access memory, check a condition, jump to function, etc.<br>\n# The processor '''moves on to the next instruction''' and so on\n{/def}\n\n[[img:L3-08.png|3강 p.8. Disk의 Program → Memory의 Task(Code+Data) → CPU가 ①Fetch ②Decode ③Execute를 startup부터 shutdown까지 반복.|large]]\n\nCPU는 이것 말고 아무것도 하지 않는다. 0831 녹음본의 표현: \"what CPU do is actually just '''repeatedly doing the fetch-decode-execute loop''' for each cycle, and what CPU does is '''determined by the instructions'''.\"\n\n=== 프로그래머에게 보이는 상태 ===\n\n[[img:L3-10.png|3강 p.10. CPU 안에 보이는 건 PC / Registers / Condition Codes 셋뿐. 메모리와는 Addresses·Data·Instructions를 주고받는다.|large]]\n\n{| class=\"table\"\n! 상태 || 정체 || 나중에 어디서 쓰이나\n|-\n| '''PC''' ([[프로그램 카운터]]) || 다음에 실행할 명령어의 '''주소'''. IA32에선 `EIP`, x86-64에선 `RIP` || [[epc]], [[sepc]] — 트랩에서 복귀할 지점\n|-\n| '''Register file''' ([[레지스터]]) || 자주 쓰는 프로그램 데이터 || [[trapframe]]에 통째로 저장\n|-\n| '''Condition codes''' || 직전 산술 연산의 상태 (0인가, 음수인가). 조건 분기에 사용 || 역시 저장/복원 대상\n|-\n| '''Memory''' || 바이트 단위 주소가 붙은 배열. Code, user data, (some) OS data, 그리고 [[스택]] ||\n|}\n\n{exam}\n2025F 중간고사 '''Problem 1'''의 해설 슬라이드에 이 \"Assembly Programmer's View (Cont.)\" 장이 그대로 실려 있다. 즉 '''PC / register file / condition codes'''라는 세 가지 programmer-visible state를 묻는 문제가 실제로 나왔다. → [[2025F 중간고사 족보]]\n{/exam}\n\n{tip}\n이 세 가지가 바로 나중에 말하는 '''\"컨텍스트(문맥)\"의 정체'''다. 프로세스를 멈췄다 재개하려면 이걸 저장했다 복원해야 한다 → [[컨텍스트 스위치]], [[struct proc]]의 `context` 필드.\n{/tip}\n\n----\n\n== 2. 프로그램 → 프로세스: 빌드와 로딩 ==\n\n자세한 것은 [[프로그램 로딩]]에 있고, 여기서는 흐름만.\n\n[[img:L3-13.png|3강 p.13. C program(text) →Compiler→ Assembly(text) →Assembler→ Object(binary) →Linker→ Executable(binary). 링커에는 정적 라이브러리(.a)도 들어간다.|large]]\n\n<pre class=\"ascii\">\n   main.c  sum.c          .s            .o              p              프로세스\n      │                    │             │              │                 │\n      ├── Compiler ────────┤             │              │                 │\n      │   (gcc -S)         ├─ Assembler ─┤              │                 │\n      │                    │  (gcc -c)   ├─── Linker ───┤                 │\n      │                    │             │   (gcc/ld)   ├──── Loader ─────┤\n      │                    │             │              │                 │\n     text                text         binary         binary            메모리\n                                                    ←── 프로그램 ──→  ←프로세스→\n<\/pre>\n\n[[img:L3-19.png|3강 p.19. 로더가 디스크의 실행 파일 p를 메모리에 올리는 순간, 빨간 글씨로 \"Now, OS takes control of running executable (p)!\" — 이 지점부터가 운영체제 이야기다.|large]]\n\n이 그림의 메모리 배치가 곧 [[주소 공간]]이다. 위에서부터 Kernel virtual memory / User stack([[스택 포인터|%esp]]가 가리킴, 아래로 성장) / 빈 공간 / Run-time heap(`brk`, [[힙|malloc]]이 위로 성장) / Read-write segment(`.data`, `.bss`) / Read-only segment(`.init`, `.text`, `.rodata`) / Unused.\n\n----\n\n== 3. 프로세스의 두 얼굴 ==\n\n=== ① Control flow ===\n\n{def}\n\"Processors do only one thing: from startup to shutdown, a CPU simply '''reads and executes a sequence of instructions, one at a time'''. This sequence is the CPU's '''control flow'''.\" (3강 p.24)\n{/def}\n\n=== ② Memory address space ===\n\n[[img:L3-25.png|3강 p.25. 왼쪽 Memory 안에 프로세스의 주소 공간(User stack / Heap / Read-write / Read-only), 오른쪽 CPU가 그 안의 명령어를 Fetch-Decode-Execute하며 Control Flow를 만든다. \"프로세스 = 주소 공간 + 제어 흐름\" 그림의 완성.|large]]\n\n{tip}\n0831 녹음본에서 교수님이 \"꼭 기억하라\"고 덧붙인 문장: \"please '''remember about the memory address space is actually related to the set of rights of the process''' and it is a key concept in the '''protection'''.\"<br>\n→ 주소 공간은 \"메모리 덩어리\"가 아니라 '''접근 권한의 집합'''이다. 이게 protection의 출발점.\n{/tip}\n\n=== 가상화: 두 얼굴을 각각 속이기 ===\n\n{def}\n\"OS provides two key virtualization for each process\" (3강 p.26)<br>\n· '''Logical control flow''' — Each program '''seems''' to have exclusive use of the CPU (+ stack)<br>\n· '''Private virtual address space''' — Each program '''seems''' to have exclusive use of main memory\n{/def}\n\n핵심 단어는 '''seems'''다. 실제로는 공유하지만 독점처럼 보이게 하는 것 → [[가상화]].\n\n----\n\n== 4. 여러 프로세스를 어떻게 돌리나 ==\n\n[[img:L3-29.png|3강 p.29. A&B concurrent, A&C concurrent, B&C sequential. 겹치면 concurrent, 명확한 경계가 있으면 sequential.|large]]\n\n{warn}\n'''최다 함정.''' 싱글 코어에서도 실행 구간이 '''겹치면 concurrent'''다. \"물리적으로 동시에 돌아야 한다\"가 아니다. → [[동시성]]\n{/warn}\n\n[[img:L3-30.png|3강 p.30. Mechanism: Context Switch / Policy: Scheduling Policy. 오른쪽에 전환 시점이 화살표로 표시된 타임라인.|large]]\n\n{| class=\"table\"\n! || 질문 || 답 || 배우는 곳\n|-\n| '''Mechanism''' || 어떻게 바꿔 끼우나? || '''[[컨텍스트 스위치]]''' || 4강\n|-\n| '''Policy''' || 다음엔 누구를 돌리나? || '''[[스케줄링]] 정책''' || 5~7강\n|}\n\n{tip}\n0831 녹음본, 교수님이 직접 \"quite an important concept in the operating system course\"라고 못 박은 부분: \"'''the separation of mechanism and the policy''' … for the given mechanism, first pick the '''goal''' of the operating system and then make some proper policy. '''This is the core of the operating system design.'''\"\n{/tip}\n\n----\n\n== 5. 프로세스 생성 5단계 ⭐ ==\n\n3강 p.32~33. 시험에 순서 그대로 나올 수 있다.\n\n# '''Load a program into memory''', creating the address space<br>· 프로그램은 처음엔 디스크에 실행 파일로 있다<br>· OS는 로딩을 '''lazily'''(게으르게) 수행 — 실제로 필요해지는 코드·데이터 조각만 그때그때 올린다 (나중의 demand paging 복선)\n# '''The program's run-time stack is allocated'''<br>· 지역 변수, 함수 인자, 리턴 주소용<br>· `main()`의 '''`argc`와 `argv` 배열'''로 초기화\n# '''The program's heap is created'''<br>· `malloc()`으로 요청하고 `free()`로 반납하는 동적 할당 공간\n# '''OS does some other initialization tasks'''<br>· I/O setup<br>· 모든 프로세스는 기본으로 '''3개의 file descriptor'''를 갖는다: '''stdin(0), stdout(1), stderr(2)'''\n# '''Start the program running at the entry point, `main()`'''<br>· OS가 CPU 제어권을 새 프로세스에 넘긴다\n\n{warn}\n4번의 \"stdin / stdout / stderr는 '''OS가''' 열어 준다\"가 포인트다. 표준 라이브러리(`stdio.h`)가 여는 게 아니다. 녹음본: \"this file descriptor is set up by the operating system so '''you don't need to use the standard library''' to set up these default files.\"\n{/warn}\n\n{tip}\n5번의 \"control transfer\"가 무슨 뜻인지 녹음본이 풀어 준다: \"the process would start from the '''kernel state''' and then transfer the control to the '''user space'''. Inside the user space, the program will run from the main function.\" → 새 프로세스는 커널 모드에서 태어나 user mode로 내려가며 `main()`에 도달한다. ([[유저 모드와 커널 모드]])\n{/tip}\n\n----\n\n== 6. 프로세스 상태 ⭐⭐ ==\n\n{def}\n\"A process can be one of '''three states'''\" (3강 p.34)<br>\n· '''Running''' — A process is running on a processor<br>\n· '''Ready''' — A process is ready to run but for some reason the OS has chosen '''not to run it''' at this given moment<br>\n· '''Blocked''' — A process has performed some kind of operation; when a process initiates an '''I/O request''' to a disk, it becomes blocked and thus '''some other process can use the processor'''\n{/def}\n\n[[img:L3-35.png|3강 p.35. Running ↔ Ready (Descheduled / Scheduled), Running → Blocked (I/O: initiate), Blocked → Ready (I/O: done). 시험에 그대로 그리라고 나올 수 있는 그림.|large]]\n\n[[sim:proc_states]]\n\n{warn}\n'''최다 출제 함정''': I/O가 끝나면 '''Blocked → Ready'''로 간다. '''Running으로 바로 가지 않는다.''' CPU는 그 사이 다른 프로세스가 쓰고 있을 수 있으므로, 다시 [[스케줄러]]의 선택을 받아야 한다.<br>\nReady = \"CPU만 주면 바로 뜀\" / Blocked = \"'''CPU를 줘도 못 뜀'''(I/O가 끝나야 함)\".\n{/warn}\n\n자세한 전이 조건과 [[xv6]]의 6-상태 모델은 [[프로세스 상태]] 참고.\n\n----\n\n== 7. 프로세스 API ==\n\n{def}\n\"These APIs are available on '''any modern OS'''\" (3강 p.31)<br>\n· '''Create''' — e.g., `fork()` and `execv()`<br>\n· '''Destroy''' — e.g., `exit()` and `kill(SIGKILL)`<br>\n· '''Wait''' — e.g., `wait()` and `waitpid()`<br>\n· '''Miscellaneous Control''' (suspend/resume) — e.g., `kill(SIGSTOP)` and `signal()`<br>\n· '''Status''' — e.g., `getpid()`, `getpriority()`\n{/def}\n\n[[sim:fork_exec]]\n\n가장 유명한 짝이 [[fork]] + [[exec]] + [[wait]]다. `fork()`는 '''복제만''' 하고, `exec()`가 '''프로그램을 갈아 끼운다'''.\n\n{tip}\n0831 녹음본에서 교수님이 짚은, 시험에 나오기 좋은 통찰:<br>\n\"we only have the '''fork''' system call. So … if we want to generate the process, we need a '''parent''' process. … if we need a process to generate another process, then it is actually related to the '''tree''' concept in the data structure. … it means that inside our computer the multiple processes form a '''tree''' and there is the '''root node'''. … all of the processes are actually originated from a '''single process''' and we give some special role to that root process — it is called '''init''' process in Linux.\"\n{/tip}\n\n각 API의 코드와 출력은 [[프로세스 API]], [[fork]], [[exec]], [[wait]] 문서에.\n\n----\n\n== 8. OS는 프로세스를 어떻게 기억하나 ==\n\n{def}\n'''Data Structures''' (3강 p.36)<br>\n· '''Process list''' for all processes — Ready processes / Blocked processes / Current running process<br>\n· '''Register context''' — Data & stack registers, Program counter, …<br>\n· '''Process Control Block (PCB)''' — OS's data structure that contains information about each process\n{/def}\n\n{exam}\n이 \"Data Structures\" 슬라이드는 2025F 중간고사 '''Problem 2''' 해설에 실려 있다. [[PCB]]의 정의(\"OS's data structure that contains information about each process\")와 process list의 세 갈래(ready / blocked / running)를 그대로 쓸 수 있어야 한다. → [[2025F 중간고사 족보]]\n{/exam}\n\n=== xv6의 실물 PCB ===\n\n[[img:L3-37.png|3강 p.37. xv6의 struct proc — \"PCB에 뭐가 들어가는가?\"의 실물 답안.|large]]\n\n<pre class=\"c\">\n// the information xv6 tracks about each process\n// including its register context and state\nstruct proc {\n    char *mem;                  // Start of process memory\n    uint sz;                    // Size of process memory\n    char *kstack;               // Bottom of kernel stack for this process\n    enum proc_state state;      // Process state\n    int pid;                    // Process ID\n    struct proc *parent;        // Parent process\n    void *chan;                 // If non-zero, sleeping on chan\n    int killed;                 // If non-zero, have been killed\n    struct file *ofile[NOFILE]; // Open files\n    struct inode *cwd;          // Current directory\n    struct context context;     // Switch here to run process\n    struct trapframe *tf;       // Trap frame for the current interrupt\n};\n<\/pre>\n\n<pre class=\"c\">\n// the registers xv6 will save and restore\n// to stop and subsequently restart a process\nstruct context {\n    int eip;   // Index pointer register\n    int ebx;   // Called the base register\n    int esi;   // Source index register\n    int edi;   // Destination index register\n    int ebp;   // Stack base pointer register\n};\n\n// the different states a process can be in\nenum proc_state { UNUSED, EMBRYO, SLEEPING,\n                  RUNNABLE, RUNNING, ZOMBIE };\n<\/pre>\n\n{warn}\n이 코드는 '''x86 시절 xv6'''다 (`eip`, `ebx`, `esi`, `edi`, `ebp`). 과제 1에서 쓰는 xv6는 '''[[RISC-V]]''' 버전이라 `struct proc`의 필드 이름이 꽤 다르고, `struct trapframe *tf` 대신 `struct trapframe *trapframe`이다. 슬라이드 암기용과 과제 구현용을 따로 관리할 것. → [[struct proc]]\n{/warn}\n\n필드별 설명, [[RISC-V]] 버전과의 대조표, 과제 1이 추가하는 alarm 필드는 [[struct proc]]에 정리되어 있다.\n\n----\n\n== 9. 시스템 콜을 하나 추가하려면 (과제 1 연결) ==\n\n{warn}\n과제 1 안내문(Tips 1)은 \"First, fix this regarding the '''3-From_Program_to_Process (30p-34p)'''\"라고 지시한다. 그런데 현재 배포된 3강 PDF의 p.30~34는 mechanism/policy · [[프로세스 API]] · 프로세스 생성 · 프로세스 상태이고, '''시스템 콜 추가 절차 자체는 슬라이드에 없다'''. TA가 가리킨 것은 [[프로세스 API]] 부분(= \"OS는 시스템 콜로 서비스를 노출한다\")으로 보이며, 실제 절차는 [[xv6]] 소스를 따라가며 익혀야 한다.\n{/warn}\n\n[[sigalarm]]/[[sigreturn]] 같은 시스템 콜 하나를 추가하려면 '''여섯 개 파일'''을 손대야 한다.\n\n<pre class=\"ascii\">\n  user/user.h      ① 유저가 부를 함수 선언\n       │\n  user/usys.pl     ② 스텁 어셈블리 생성 (a7 ← 번호, ecall)\n       │\n  kernel/syscall.h ③ 시스템 콜 번호 #define\n       │\n  kernel/syscall.c ④ 번호 → 함수 포인터 테이블 등록 + extern 선언\n       │\n  kernel/sysproc.c ⑤ sys_xxx() 본체 (인자 꺼내기, 일 하기)\n       │\n  kernel/proc.h/.c ⑥ 필요한 상태를 struct proc 에 추가 + allocproc 에서 초기화\n<\/pre>\n\n파일별 실제 코드와 체크리스트는 '''[[시스템 콜 추가 절차]]'''에, 과제 전체 구조는 '''[[과제1 xv6 alarm]]'''에 있다.\n\n----\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"실행 중인 프로그램의 인스턴스이며, control flow와 memory address space라는 두 추상화로 구성되는 것\"은?\n{/quiz}\n{answer}\n'''Process'''(프로세스). 슬라이드는 \"Not the same as '''program''' or '''processor'''\"라고 못 박는다. Program은 디스크의 실행 파일, Processor는 하드웨어 CPU.\n{/answer}\n\n{quiz}\n'''(상태 전이)''' 디스크 I/O를 요청한 프로세스 P가 있다. I/O가 완료되었을 때 P의 상태는 어떻게 바뀌는가? 그리고 그 직후 P는 반드시 CPU를 받는가?\n{/quiz}\n{answer}\n'''Blocked → Ready''' (\"I/O: done\"). 그리고 '''반드시 받지는 않는다''' — Running으로 가려면 [[스케줄러]]에 의해 다시 '''Scheduled'''되어야 한다. \"I/O 끝나면 바로 Running\"은 최다 오답.\n{/answer}\n\n{quiz}\n'''(빈칸)''' 프로세스 생성 5단계의 빈칸을 채우시오.<br>\n① 프로그램을 메모리에 __________ (단, __________ 하게)<br>\n② __________ 할당 — `argc`, `argv`로 초기화<br>\n③ __________ 생성 — `malloc()`/`free()`용<br>\n④ I/O setup — 기본 file descriptor __________ 3개<br>\n⑤ 엔트리 포인트 __________ 에서 실행 시작\n{/quiz}\n{answer}\n① '''로드(load)''', '''lazily(게으르게)''' ② '''run-time stack''' ③ '''heap''' ④ '''stdin(0), stdout(1), stderr(2)''' ⑤ '''`main()`'''\n{/answer}\n\n{quiz}\n'''(서술)''' CPU 가상화를 구현하는 데 필요한 두 가지를 \"메커니즘\"과 \"정책\"으로 나누어 쓰고, 각각이 무엇인지 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n'''Mechanism = [[컨텍스트 스위치]]''' — 돌던 프로세스의 [[레지스터]]·[[프로그램 카운터|PC]]를 저장하고 다른 프로세스의 것을 복원해 실행 주체를 바꿔 끼우는 기술.<br>\n'''Policy = [[스케줄링]] 정책''' — 다음에 어떤 프로세스를 돌릴지 고르는 규칙.<br>\n(교수님 강조: \"the separation of mechanism and the policy is the core of the operating system design.\")\n{/answer}\n\n== 시험 대비 핵심 요약 ==\n\n# '''Program(디스크의 ELF) ≠ Process(메모리의 실행 인스턴스) ≠ Processor(하드웨어 CPU)'''.\n# 프로세스 = '''control flow + memory address space'''. 각 프로세스는 둘 다 '''exclusive'''하게 갖는다(고 착각한다).\n# CPU는 '''fetch – decode – execute'''만 반복한다.\n# Programmer-visible state = '''PC + register file + condition codes''' (+ memory). ← 2025F Problem 1\n# 빌드 파이프라인: C →(컴파일러)→ `.s` →(어셈블러)→ `.o` →(링커)→ 실행 파일 →(로더)→ 프로세스.\n# OS는 두 가지를 가상화한다: '''logical control flow'''(CPU 독점 착각) + '''private virtual address space'''(메모리 독점 착각). 키워드는 '''seems'''.\n# 실행 구간이 '''겹치면 concurrent''', 경계가 명확하면 sequential. 싱글 코어여도 concurrent 가능.\n# CPU 가상화 = '''mechanism([[컨텍스트 스위치]]) + policy([[스케줄링]])'''. 이 분리가 OS 설계의 핵심.\n# 프로세스 생성 5단계: '''load(lazily) → stack → heap → I/O setup(stdin/stdout/stderr) → main()에서 시작'''.\n# 3상태: '''Running / Ready / Blocked'''. 전이는 Scheduled / Descheduled / I/O initiate / '''I/O done → Ready'''.\n# OS의 자료구조: '''process list'''(ready·blocked·running) + '''register context''' + '''[[PCB]]'''. ← 2025F Problem 2\n# [[xv6]]의 PCB는 `struct proc`, 저장 레지스터는 `struct context`, 상태는 `enum proc_state { UNUSED, EMBRYO, SLEEPING, RUNNABLE, RUNNING, ZOMBIE }`.\n# 프로세스는 [[fork]]로만 생기므로 시스템 전체 프로세스는 '''트리'''를 이루고, 루트는 '''init'''이다.\n\n== 관련 문서 ==\n* [[프로세스 상태]] / [[프로세스 목록]] / [[PCB]] / [[struct proc]]\n* [[프로세스 API]] / [[fork]] / [[exec]] / [[wait]]\n* [[프로그램 로딩]] / [[주소 공간]]\n* [[시스템 콜 추가 절차]] / [[과제1 xv6 alarm]]\n* [[가상화]] / [[동시성]] / [[운영체제란]]\n* [[컨텍스트 스위치]] / [[스케줄링]] / [[제한적 직접 실행]]\n* [[레지스터]] / [[프로그램 카운터]] / [[스택 포인터]] / [[스택]] / [[힙]]\n* [[xv6]] / [[OSTEP]] / [[RISC-V]]"
 },
 "프로세스 상태": {
  "title": "프로세스 상태 (Process States)",
  "category": [
   "3강 From Program to Process",
   "용어"
  ],
  "body": "'''프로세스 상태'''는 프로세스가 지금 CPU 위에서 돌고 있는지, 돌 준비만 된 채 대기 중인지, 아니면 아예 돌 수 없는 상태인지를 나타내는 세 가지 값이다. 3강에서 가장 출제 확률이 높은 장이고, 함정도 정확히 한 군데에 몰려 있다.\n\n{def}\n\"A process can be one of '''three states'''\" (3강 p.34)<br>\n· '''Running''' — A process is running on a processor<br>\n· '''Ready''' — A process is '''ready to run''' but for some reason the OS has chosen '''not to run it''' at this given moment<br>\n· '''Blocked''' — A process has performed some kind of operation. When a process '''initiates an I/O request''' to a disk, it becomes blocked and thus '''some other process can use the processor'''\n{/def}\n\n{analogy}\n🏥 병원 진료실. '''Running'''은 지금 진료실 안에서 의사와 마주 앉은 환자. '''Ready'''는 대기실에서 이름 불리기만 기다리는 환자 — 부르면 즉시 들어갈 수 있다. '''Blocked'''는 \"엑스레이 찍고 오세요\"를 듣고 방사선실로 간 환자 — 지금 이름을 불러도 들어올 수 없다. 엑스레이가 끝나면? 진료실로 직행하는 게 아니라 '''대기실(Ready)로 돌아가서 줄을 선다'''. 그 사이 다른 환자가 들어가 있기 때문이다.\n{/analogy}\n\n== 상태 전이도 ⭐⭐ ==\n\n[[img:L3-35.png|3강 p.35. 이 그림을 그대로 그리라는 문제가 나올 수 있다.|large]]\n\n[[sim:proc_states]]\n\n{| class=\"table\"\n! 전이 || 이름 (슬라이드 표기) || 누가 일으키나\n|-\n| Running → Ready || '''Descheduled''' || [[스케줄러]] (예: [[time slice]] 만료, [[타이머 인터럽트]])\n|-\n| Ready → Running || '''Scheduled''' || [[스케줄러]]\n|-\n| Running → Blocked || '''I/O: initiate''' || 프로세스 자신 (I/O 시스템 콜을 부름)\n|-\n| Blocked → '''Ready''' || '''I/O: done''' || 디바이스 [[인터럽트]] → 커널\n|}\n\n<pre class=\"ascii\">\n                     Descheduled\n        ┌─────────┐ ─────────────► ┌─────────┐\n        │ Running │                │  Ready  │\n        └─────────┘ ◄───────────── └─────────┘\n             │        Scheduled          ▲\n             │                           │\n    I/O:     │                           │   I/O: done\n    initiate │                           │   (Running 으로 직행 ✗)\n             ▼                           │\n        ┌─────────────────────────────────┐\n        │            Blocked              │\n        └─────────────────────────────────┘\n<\/pre>\n\n{warn}\n'''이 과목 최다 출제 함정.''' I/O가 끝나면 '''Blocked → Ready'''다. '''Blocked → Running 화살표는 존재하지 않는다.'''<br>\n이유: I/O가 도는 동안 CPU는 놀지 않고 다른 프로세스를 돌렸다. 그 프로세스를 쫓아낼 이유가 없으므로, I/O를 마친 프로세스는 '''다시 줄을 서서''' [[스케줄러]]의 선택(Scheduled)을 기다려야 한다.\n{/warn}\n\n{warn}\n'''Ready와 Blocked의 차이를 한 줄로''':<br>\n· '''Ready''' = \"CPU만 주면 바로 뜀\" — 못 도는 이유가 '''OS의 선택'''<br>\n· '''Blocked''' = \"'''CPU를 줘도 못 뜀'''\" — 못 도는 이유가 '''기다리는 사건'''(I/O 완료 등)<br>\n그래서 Blocked 프로세스에게 CPU를 주는 것은 [[스케줄링|스케줄링]]상 완전한 낭비다.\n{/warn}\n\n{tip}\n0831 녹음본에서 교수님이 설명한 생애 주기: \"when the process is created, first it starts at the '''ready''' state and if it is scheduled, it turns to the '''running''' state … if you initiate the I/O jobs, then it turns into the '''block''' state … if the I/O is done, operating system will change the state into the '''ready''' and now it can be scheduled into the running state. So this is the '''life cycle of the process'''.\"<br>\n→ 프로세스가 '''태어나는 곳은 Ready'''다. 이것도 시험 포인트.\n{/tip}\n\n== xv6의 실제 상태는 6개 ==\n\n이론의 3-상태 모델은 실제 구현에서 더 잘게 쪼개진다 (3강 p.38).\n\n<pre class=\"c\">\n// the different states a process can be in\nenum proc_state { UNUSED, EMBRYO, SLEEPING,\n                  RUNNABLE, RUNNING, ZOMBIE };\n<\/pre>\n\n{| class=\"table\"\n! xv6 상태 || 3-상태 모델 대응 || 의미\n|-\n| `UNUSED` || (없음) || 프로세스 테이블의 빈 슬롯\n|-\n| `EMBRYO` || (생성 중) || `allocproc()`이 잡았지만 아직 초기화가 안 끝난 상태\n|-\n| `SLEEPING` || '''Blocked''' || `chan`에 매달려 어떤 사건을 기다림\n|-\n| `RUNNABLE` || '''Ready''' || 돌 준비 완료, [[스케줄러]] 대기\n|-\n| `RUNNING` || '''Running''' || 지금 CPU 위\n|-\n| `ZOMBIE` || (종료됨) || `exit()`은 했지만 부모가 아직 [[wait]]로 회수하지 않음\n|}\n\n{warn}\n'''`RUNNABLE`이 Ready에 대응한다'''는 것을 반드시 기억할 것. 이름이 \"runnable\"이라 Running과 헷갈리기 쉽다.<br>\n그리고 `ZOMBIE`는 3-상태 모델에 없다 — [[fork]]/[[wait]]의 부모-자식 관계 때문에 생기는 상태다. 부모가 [[wait]]를 안 부르면 자식은 좀비로 남는다.\n{/warn}\n\n== 상태별로 프로세스는 어디에 저장되나 ==\n\nOS는 상태별 목록을 따로 관리한다 ([[프로세스 목록]], 3강 p.36).\n\n* '''Ready processes''' 목록 → [[스케줄러]]가 여기서 고른다\n* '''Blocked processes''' 목록 → I/O 완료 인터럽트가 오면 여기서 찾아 Ready로 옮긴다\n* '''Current running process''' → 지금 누구를 쫓아내야 하는지 알기 위해\n\n프로세스 하나의 상태 값 자체는 [[PCB]](= [[xv6]]의 [[struct proc]])의 `state` 필드에 들어 있다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"돌 준비는 되었지만 어떤 이유로 OS가 지금은 돌리지 않기로 선택한 상태\"는?\n{/quiz}\n{answer}\n'''Ready'''. 슬라이드 원문: \"A process is ready to run but for some reason '''the OS has chosen not to run it''' at this given moment.\"\n{/answer}\n\n{quiz}\n'''(그림)''' Running / Ready / Blocked 3상태의 전이도를 그리고, 네 개 화살표에 슬라이드 용어로 이름을 붙이시오.\n{/quiz}\n{answer}\nRunning →(Descheduled)→ Ready, Ready →(Scheduled)→ Running, Running →(I/O: initiate)→ Blocked, Blocked →('''I/O: done''')→ '''Ready'''.<br>\nBlocked → Running 화살표는 '''없다'''.\n{/answer}\n\n{quiz}\n'''(대응)''' [[xv6]]의 `enum proc_state` 6개 중 3-상태 모델의 Ready에 해당하는 것은? 그리고 3-상태 모델에 대응이 없는 상태 두 개를 고르시오.\n{/quiz}\n{answer}\nReady = '''`RUNNABLE`'''. 대응이 없는 것은 '''`UNUSED`'''(빈 슬롯), '''`EMBRYO`'''(생성 중), '''`ZOMBIE`'''(종료 후 회수 대기) — 셋 중 둘을 고르면 된다. `SLEEPING`은 Blocked, `RUNNING`은 Running.\n{/answer}\n\n== 관련 문서 ==\n* [[프로세스]] — 본문\n* [[프로세스 목록]] / [[PCB]] / [[struct proc]]\n* [[스케줄러]] / [[스케줄링]] / [[컨텍스트 스위치]]\n* [[wait]] — `ZOMBIE`를 회수하는 시스템 콜\n* [[I/O와 스케줄링]] — Blocked 구간을 활용하는 법\n* [[타이머 인터럽트]] — Descheduled의 대표 원인"
 },

  "body": "'''프로세스 API'''는 유저 프로그램이 프로세스를 만들고·죽이고·기다리고·조회하는 [[시스템 콜]] 묶음이다. 3강 p.31이 다섯 갈래로 정리해 준다.\n\n{def}\n'''Process APIs''' — \"These APIs are available on '''any modern OS'''\" (3강 p.31)<br>\n· '''Create''': Create a new process to run a program — e.g., `fork()` and `execv()`<br>\n· '''Destroy''': Halt a runaway process — e.g., `exit()` and `kill(SIGKILL)`<br>\n· '''Wait''': Wait for a process to stop running — e.g., `wait()` and `waitpid()`<br>\n· '''Miscellaneous Control''': Some method to '''suspend''' a process and then '''resume''' it — e.g., `kill(SIGSTOP)` and `signal()`<br>\n· '''Status''': Get some status info about a process — e.g., `getpid()`, `getpriority()`\n{/def}\n\n{analogy}\n🍦 가게 사장이 직원에게 쓸 수 있는 명령 목록이다. '''Create'''는 알바 한 명 더 투입, '''Destroy'''는 퇴근시키기, '''Wait'''는 \"저 알바 끝날 때까지 기다렸다 인수인계 받아\", '''Control'''은 \"잠깐 멈춰\" / \"다시 해\", '''Status'''는 \"지금 몇 번 주문 하고 있어?\"다. 이 다섯 가지만 있으면 어떤 작업 흐름이든 짤 수 있다는 게 유닉스의 주장.\n{/analogy}\n\n[[sim:fork_exec]]\n\n== 다섯 갈래 ==\n\n{| class=\"table\"\n! 갈래 || 시스템 콜 || 하는 일 || 자세히\n|-\n| '''Create''' || `fork()`, `execv()` || 프로세스 복제 / 프로그램 교체 || [[fork]], [[exec]]\n|-\n| '''Destroy''' || `exit()`, `kill(SIGKILL)` || 스스로 끝내기 / 남을 강제 종료 ||\n|-\n| '''Wait''' || `wait()`, `waitpid()` || 자식이 끝날 때까지 블록 || [[wait]]\n|-\n| '''Control''' || `kill(SIGSTOP)`, `signal()` || 일시정지·재개, 시그널 핸들러 등록 || [[sigalarm]](과제 1이 흉내 내는 것)\n|-\n| '''Status''' || `getpid()`, `getpriority()` || 정보 조회 ||\n|}\n\n{tip}\n0831 녹음본에서 교수님이 일상 경험과 연결해 준 부분: \"you can type '''Control-C''' or Control-D to the shell and then you can finish the program execution — it is actually related to this '''kill''' system call. And also you can type the '''ps''' command and then you can get the ID of each process — it actually uses this '''getpid''' system call.\"\n{/tip}\n\n== fork / exec가 분리된 이유 ==\n\n가장 자주 나오는 개념 문제다. \"프로그램 실행\"이라는 한 가지 일이 왜 '''두 개'''의 시스템 콜로 쪼개져 있나?\n\n<pre class=\"ascii\">\n   부모 프로세스\n       │\n       │  fork()        ← 복제. 주소 공간·열린 파일이 그대로 복사된다\n       ├──────────────► 자식 (부모와 똑같은 프로그램)\n       │                   │\n       │                   │  이 틈에 자식이 환경을 손볼 수 있다\n       │                   │  (stdout 리다이렉트, 우선순위 변경 …)\n       │                   │\n       │                   │  exec(\"/bin/ls\")   ← 프로그램만 갈아 끼움\n       │                   ▼\n       │                자식 (이제 ls)\n       │                   │\n       │  wait()  ◄────────┘  자식 종료를 회수\n       ▼\n<\/pre>\n\n{warn}\n`fork()`와 `exec()` '''사이의 틈'''이 유닉스 셸의 모든 기능(파이프, 리다이렉션, 백그라운드 실행)이 사는 곳이다. 두 개를 합친 API였다면 `ls > out.txt` 같은 것을 만들 수 없다. \"왜 분리했나\"를 묻는 문제의 정답은 '''\"자식이 exec 전에 자기 실행 환경을 바꿀 수 있게 하려고\"'''.\n{/warn}\n\n{tip}\n녹음본: \"the fork system call is generating the process and actually it '''only copies the process data and then generates a separate logical control flow'''. And then you can use the '''execv''' system call to load another program. So if you want to run a program, you first need to fork the process and then call the execv system call to change the executing program.\"\n{/tip}\n\n== 프로세스 트리 ==\n\n프로세스를 만드는 방법이 [[fork]]뿐이라는 사실에는 구조적 귀결이 있다.\n\n{tip}\n0831 녹음본: \"if we want to generate the process, we need a '''parent''' process … if we need a process to generate another process, then it is actually related to the '''tree''' concept in the data structure. If you have a single parent for each node, the data structure would be a '''tree'''. … all of the processes are actually originated from a '''single process''' and we give some special role to that root process — it is called '''init''' process in Linux.\"\n{/tip}\n\n<pre class=\"ascii\">\n              init  (pid 1, 루트)\n             ╱   │   ╲\n        sshd   getty   systemd-*\n          │\n        bash\n       ╱    ╲\n     ls      gcc\n<\/pre>\n\n그래서 [[struct proc]]에 `struct proc *parent;` 필드가 있고, [[wait]]가 '''부모만''' 자식을 회수할 수 있는 것이다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(분류)''' 다음 시스템 콜을 3강 p.31의 다섯 갈래(Create / Destroy / Wait / Control / Status)로 분류하시오.<br>\n`waitpid()`, `kill(SIGSTOP)`, `execv()`, `getpid()`, `exit()`\n{/quiz}\n{answer}\n`waitpid()` = '''Wait''' / `kill(SIGSTOP)` = '''Miscellaneous Control'''(suspend) / `execv()` = '''Create''' / `getpid()` = '''Status''' / `exit()` = '''Destroy'''.<br>\n함정: `kill()`은 시그널에 따라 갈래가 갈린다 — `kill(SIGKILL)`은 Destroy, `kill(SIGSTOP)`은 Control.\n{/answer}\n\n{quiz}\n'''(서술)''' 프로세스 생성이 `fork()`와 `exec()` 두 시스템 콜로 나뉘어 있는 이유를 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n`fork()` 직후 `exec()` 이전의 '''틈'''에서 자식이 자기 실행 환경(열린 파일 디스크립터, 리다이렉션, 우선순위 등)을 고칠 수 있게 하기 위해서다. 셸의 파이프·리다이렉션이 전부 이 틈에서 구현된다.\n{/answer}\n\n== 관련 문서 ==\n* [[프로세스]] — 본문\n* [[fork]] / [[exec]] / [[wait]]\n* [[시스템 콜]] / [[시스템 콜 추가 절차]]\n* [[프로세스 상태]] — `ZOMBIE`와 [[wait]]의 관계\n* [[struct proc]] — `parent` 필드"
 },
 "struct proc": {
  "title": "struct proc (xv6의 PCB)",
  "category": [
   "3강 From Program to Process",
   "과제1",
   "용어"
  ],
  "body": "'''`struct proc`'''는 [[xv6]]가 프로세스 하나에 대해 기억하는 모든 것을 담은 구조체다. 즉 [[PCB]]의 실물이다. 3강 p.37~38에 x86 시절 버전이 실려 있고, 과제 1에서 만지는 것은 [[RISC-V]] 버전이다. '''두 버전이 다르다'''는 점이 이 문서의 존재 이유다.\n\n{analogy}\n🏥 '''환자 차트'''다. 이름표(`pid`), 지금 상태(`state`, 진료중/대기중/검사중), 보호자(`parent`), 병실 위치(`pagetable`), 수술 중 잠시 빼놓은 소지품 보관함([[trapframe]]), 진료 중단 시 어디까지 했는지 메모(`context`). 의사(= [[스케줄러]])는 환자 본인이 아니라 '''차트만 보고''' 다음에 누구를 부를지 정한다.\n{/analogy}\n\n== 슬라이드 버전 (x86 xv6, 3강 p.37~38) ==\n\n[[img:L3-37.png|3강 p.37. 시험에서 \"PCB에는 무엇이 들어가는가?\"를 물으면 이 필드 목록이 답이다.|large]]\n\n<pre class=\"c\">\n// the information xv6 tracks about each process\n// including its register context and state\nstruct proc {\n    char *mem;                  // Start of process memory\n    uint sz;                    // Size of process memory\n    char *kstack;               // Bottom of kernel stack for this process\n    enum proc_state state;      // Process state\n    int pid;                    // Process ID\n    struct proc *parent;        // Parent process\n    void *chan;                 // If non-zero, sleeping on chan\n    int killed;                 // If non-zero, have been killed\n    struct file *ofile[NOFILE]; // Open files\n    struct inode *cwd;          // Current directory\n    struct context context;     // Switch here to run process\n    struct trapframe *tf;       // Trap frame for the current interrupt\n};\n<\/pre>\n\n{| class=\"table\"\n! 필드 || 무엇 || 어느 개념과 연결되나\n|-\n| `mem`, `sz` || 프로세스 메모리의 시작 주소와 크기 || [[주소 공간]]\n|-\n| `kstack` || 이 프로세스의 [[커널 스택]] 바닥 || [[제한적 직접 실행]]\n|-\n| `state` || `enum proc_state` 값 || [[프로세스 상태]]\n|-\n| `pid` || 프로세스 ID || `getpid()`\n|-\n| `parent` || 부모 프로세스 포인터 || [[fork]], [[wait]], 프로세스 트리\n|-\n| `chan` || 0이 아니면 이 채널에서 자는 중 || `SLEEPING`(= Blocked)\n|-\n| `killed` || 0이 아니면 죽으라는 표시가 붙음 || `kill()`\n|-\n| `ofile[]`, `cwd` || 열린 파일들, 현재 디렉토리 || stdin/stdout/stderr, [[영속성]]\n|-\n| `context` || 멈췄다 재개할 때 저장·복원할 레지스터 || '''[[컨텍스트 스위치]]'''\n|-\n| `tf` || 현재 인터럽트의 trap frame || '''[[trapframe]]''', [[트랩]]\n|}\n\n[[img:L3-38.png|3강 p.38. struct context(저장할 레지스터 5개)와 enum proc_state(상태 6개).|large]]\n\n<pre class=\"c\">\n// the registers xv6 will save and restore\n// to stop and subsequently restart a process\nstruct context {\n    int eip;   // Index pointer register  ← 사실상 PC\n    int ebx;   // Called the base register\n    int esi;   // Source index register\n    int edi;   // Destination index register\n    int ebp;   // Stack base pointer register\n};\n\n// the different states a process can be in\nenum proc_state { UNUSED, EMBRYO, SLEEPING,\n                  RUNNABLE, RUNNING, ZOMBIE };\n<\/pre>\n\n{tip}\n3강 p.10의 \"programmer-visible state\"(PC + register file + condition codes)가 여기서 '''실제로 저장되는 모습'''으로 되돌아온다. `eip`가 곧 [[프로그램 카운터|PC]]이고, `ebp`가 스택 프레임 베이스다. 이론 → 구현의 연결고리라 시험에서 엮어 물어보기 좋다.\n{/tip}\n\n{warn}\n'''`context`와 `trapframe`은 다른 물건이다.'''<br>\n· '''`context`''' = 커널 안에서 프로세스 A → B로 '''[[컨텍스트 스위치]]'''할 때 저장하는 '''callee-saved 레지스터''' 몇 개. `swtch()`가 쓴다.<br>\n· '''`trapframe`''' = user → kernel로 '''[[트랩]]'''이 일어날 때 저장하는 '''유저 레지스터 전부'''(RISC-V에서 35개). `uservec`가 쓴다.<br>\n과제 1에서 백업해야 하는 건 '''[[trapframe]]''' 쪽이다.\n{/warn}\n\n== 실제 과제 버전 (RISC-V xv6) ==\n\n과제 1의 `coruslab-src/xv6-lab` (traps 브랜치)에서 `kernel/proc.h`의 실물은 이렇다.\n\n<pre class=\"c\">\nenum procstate { UNUSED, USED, SLEEPING, RUNNABLE, RUNNING, ZOMBIE };\n\n// Per-process state\nstruct proc {\n  struct spinlock lock;\n\n  // p->lock must be held when using these:\n  enum procstate state;        // Process state\n  void *chan;                  // If non-zero, sleeping on chan\n  int killed;                  // If non-zero, have been killed\n  int xstate;                  // Exit status to be returned to parent's wait\n  int pid;                     // Process ID\n\n  // wait_lock must be held when using this:\n  struct proc *parent;         // Parent process\n\n  // these are private to the process, so p->lock need not be held.\n  uint64 kstack;               // Virtual address of kernel stack\n  uint64 sz;                   // Size of process memory (bytes)\n  pagetable_t pagetable;       // User page table\n  struct trapframe *trapframe; // data page for trampoline.S\n  struct context context;      // swtch() here to run process\n  struct file *ofile[NOFILE];  // Open files\n  struct inode *cwd;           // Current directory\n  char name[16];               // Process name (debugging)\n};\n<\/pre>\n\n=== 슬라이드 ↔ 과제 대조표 ===\n\n{| class=\"table\"\n! 슬라이드 (x86) || 과제 (RISC-V) || 비고\n|-\n| `char *mem; uint sz;` || `pagetable_t pagetable; uint64 sz;` || 세그먼트 → '''페이지 테이블'''로 바뀜\n|-\n| `char *kstack;` || `uint64 kstack;` || 타입만 다름\n|-\n| `enum proc_state state;` || `enum procstate state;` || 이름의 `_` 차이 + '''`EMBRYO` → `USED`'''\n|-\n| `struct trapframe *tf;` || `struct trapframe *trapframe;` || '''이름이 다르다''' — 과제 코드에선 `p->trapframe`\n|-\n| (없음) || `int xstate;` || [[wait]]에 넘길 exit status\n|-\n| (없음) || `struct spinlock lock;` || 멀티코어 대응 ([[락]])\n|-\n| (없음) || `char name[16];` || 디버깅용\n|}\n\n<pre class=\"c\">\n// RISC-V 버전의 struct context — 저장 레지스터가 14개로 늘었다\nstruct context {\n  uint64 ra;      // return address  ← swtch 가 돌아갈 곳\n  uint64 sp;      // stack pointer\n  // callee-saved\n  uint64 s0;  uint64 s1;  uint64 s2;  uint64 s3;\n  uint64 s4;  uint64 s5;  uint64 s6;  uint64 s7;\n  uint64 s8;  uint64 s9;  uint64 s10; uint64 s11;\n};\n<\/pre>\n\n{warn}\n`struct context`에 '''`a0`~`a7`, `t0`~`t6`이 없다'''. caller-saved 레지스터라 `swtch()` 호출 규약상 저장할 필요가 없기 때문이다. 반면 [[trapframe]]에는 '''전부''' 들어 있다 — 유저 코드는 언제 끊길지 모르므로 하나도 빠뜨릴 수 없다. 이 비대칭이 과제 1에서 \"왜 trapframe을 통째로 복사해야 하나\"의 답이다.\n{/warn}\n\n== 과제 1이 추가하는 alarm 필드 ==\n\n[[sigalarm]]/[[sigreturn]]을 구현하려면 `struct proc`에 상태 네 개를 더 달아야 한다. 아래는 2026-09-23 퀴즈에 쓰인 '''정식 이름'''이다.\n\n<pre class=\"c\">\n  // --- Assignment 1: alarm ---\n  int alarm_interval;            // sigalarm(n, fn) 의 n. 0 이면 알람 해제\n  uint64 alarm_handler;          // sigalarm(n, fn) 의 fn (유저 함수 주소)\n  int alarm_elapsed;             // 마지막 알람 이후 흐른 tick 수\n  int alarm_active;              // 핸들러 실행 중이면 1 (재진입 금지용)\n  struct trapframe alarm_saved;  // 인터럽트당한 유저 문맥의 사본 (포인터 아님!)\n<\/pre>\n\n{| class=\"table\"\n! 필드 || 역할 || 문서\n|-\n| `alarm_interval` || 몇 tick마다 알람을 울릴지. `sigalarm(0,0)`이면 0 || [[alarm_interval]]\n|-\n| `alarm_handler` || 호출할 유저 함수 주소. 0일 수도 있다(주의) || [[alarm_handler]]\n|-\n| `alarm_elapsed` || 카운터. `>= alarm_interval`이 되면 발화하고 0으로 리셋 || [[alarm_elapsed]]\n|-\n| `alarm_active` || 핸들러가 아직 [[sigreturn]]을 안 불렀으면 1 || [[alarm_active]], [[재진입 금지]]\n|-\n| `alarm_saved` || 발화 직전의 `*p->trapframe` '''값 복사본''' || [[alarm_saved]]\n|}\n\n{warn}\n`alarm_saved`를 '''포인터(`struct trapframe *`)로 잡으면 틀린다.''' 퀴즈 문제 지문도 \"`alarm_saved` is a separate `struct trapframe` '''value'''\"라고 못 박는다. 포인터로 잡고 `p->alarm_saved = p->trapframe;` 하면 같은 메모리를 가리키게 되어, 핸들러가 도는 동안 덮어써진다. 값으로 통째 복사(`p->alarm_saved = *p->trapframe;`)해야 한다.\n{/warn}\n\n{exam}\n2026-09-23 퀴즈 '''2번(20점)'''이 바로 이 필드들로 [[usertrap]]의 빈칸을 채우는 문제였다.<br>\n`if (p->alarm_interval > 0 && ______)` → '''`p->alarm_active == 0`''' ([[재진입 금지]])<br>\n`p->alarm_saved = ______;` → '''`*p->trapframe`'''<br>\n`p->trapframe->epc = ______;` → '''`p->alarm_handler`'''<br>\n→ [[퀴즈1 복기]], [[과제1 xv6 alarm]]\n{/exam}\n\n{info}\n참고로 2025년 다른 학생의 제출물은 이름을 다르게 썼다 — `alarm_interval` / `alarm_handler` / `ticks_until_alarm` / `saved_trapframe`(포인터). 동작은 하지만 '''이 수업 퀴즈의 표기는 위 표'''이므로, 시험 대비로는 `alarm_elapsed` · `alarm_active` · `alarm_saved`로 외울 것.\n{/info}\n\n== 초기화는 어디서 ==\n\n새 필드는 `kernel/proc.c`의 '''`allocproc()`'''에서 0으로 초기화하고, `freeproc()`에서 정리한다. 과제 안내문이 직접 지시한다: \"You can initialize proc fields in '''`allocproc()`''' in `proc.c`.\"\n\n<pre class=\"c\">\n// kernel/proc.c : allocproc() 안, found: 레이블 뒤\n  p->alarm_interval = 0;\n  p->alarm_handler  = 0;\n  p->alarm_elapsed  = 0;\n  p->alarm_active   = 0;\n  memset(&p->alarm_saved, 0, sizeof(p->alarm_saved));\n<\/pre>\n\n현재 프로세스의 `struct proc *`를 얻는 함수는 '''[[myproc]]()'''이다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"프로세스 각각에 대한 정보를 담고 있는 OS의 자료구조\"를 가리키는 일반 용어와, [[xv6]]에서 그것에 해당하는 구조체 이름을 쓰시오.\n{/quiz}\n{answer}\n일반 용어는 '''PCB (Process Control Block)''', xv6에서는 '''`struct proc`'''이다.\n{/answer}\n\n{quiz}\n'''(구분)''' `struct context`와 `struct trapframe`의 차이를 \"언제 저장되는가\"와 \"무엇을 저장하는가\"로 나누어 한 문장씩 쓰시오.\n{/quiz}\n{answer}\n· '''`context`''': 커널 안에서 프로세스를 갈아 끼울 때([[컨텍스트 스위치]], `swtch()`) 저장하며, '''callee-saved 레지스터'''(`ra`, `sp`, `s0`~`s11`)만 담는다.<br>\n· '''`trapframe`''': user → kernel [[트랩]]이 일어날 때 저장하며, '''유저 레지스터 전부'''(+ [[epc]], 커널 진입 정보)를 담는다.\n{/answer}\n\n{quiz}\n'''(코드 빈칸)''' 과제 1에서 알람 발화 직전에 유저 문맥을 백업하는 문장은?<br>\n`p->alarm_saved = ____________;`\n{/quiz}\n{answer}\n'''`*p->trapframe`''' — 포인터가 아니라 '''역참조한 값'''이다. `p->trapframe`을 그대로 대입하면 같은 메모리를 공유해 핸들러 실행 중 덮어써진다.\n{/answer}\n\n== 관련 문서 ==\n* [[PCB]] / [[프로세스]] / [[프로세스 상태]] / [[프로세스 목록]]\n* [[trapframe]] / [[epc]] / [[컨텍스트 스위치]] / [[커널 스택]]\n* [[과제1 xv6 alarm]] / [[sigalarm]] / [[sigreturn]]\n* [[alarm_interval]] / [[alarm_handler]] / [[alarm_elapsed]] / [[alarm_active]] / [[alarm_saved]]\n* [[재진입 금지]] / [[myproc]] / [[usertrap]]\n* [[시스템 콜 추가 절차]]\n* [[xv6]] / [[RISC-V]]"
 },
 "PCB": {
  "title": "PCB (Process Control Block)",
  "category": [
   "3강 From Program to Process",
   "용어"
  ],
  "body": "'''PCB'''(Process Control Block)는 OS가 프로세스 하나에 대한 정보를 모아 두는 자료구조다. 용어 자체가 시험에 그대로 나오는 단골이다.\n\n{def}\n'''Process Control Block (PCB)''' (3강 p.36)<br>\n\"OS's data structure that contains information about '''each process'''.\"<br>\n함께 나오는 자료구조:<br>\n· '''Process list''' for all processes — Ready processes / Blocked processes / Current running process<br>\n· '''Register context''' — Data &amp; stack registers, Program counter, …\n{/def}\n\n{exam}\n2025F 중간고사 '''Problem 2'''의 해설 슬라이드가 정확히 이 \"Data Structures\" 장이다. PCB의 정의 한 줄과 process list의 세 갈래를 영어 그대로 쓸 수 있어야 한다. → [[2025F 중간고사 족보]]\n{/exam}\n\n{analogy}\n🏥 병원의 '''환자 차트'''. 환자(프로세스) 한 명당 한 장이고, 의사(OS)는 환자를 직접 기억하는 게 아니라 차트를 보고 판단한다. 진료실에서 잠시 나가야 할 때도 \"어디까지 진행했는지\"를 차트에 적어 두면(= register context) 나중에 이어서 볼 수 있다. 차트가 없으면 [[컨텍스트 스위치]]는 불가능하다.\n{/analogy}\n\n== PCB에는 무엇이 들어가나 ==\n\n{| class=\"table\"\n! 분류 || 내용 || xv6 필드 ([[struct proc]])\n|-\n| '''식별''' || 프로세스 ID, 부모 || `pid`, `parent`\n|-\n| '''상태''' || [[프로세스 상태|Running/Ready/Blocked]] || `state`, `chan`, `killed`\n|-\n| '''Register context''' || [[레지스터]], [[프로그램 카운터|PC]], 스택 레지스터 || `context`, `trapframe`\n|-\n| '''메모리''' || [[주소 공간]] 위치·크기 || `sz`, `pagetable`(또는 `mem`)\n|-\n| '''I/O''' || 열린 파일, 현재 디렉토리 || `ofile[]`, `cwd`\n|-\n| '''커널''' || 이 프로세스 전용 [[커널 스택]] || `kstack`\n|}\n\n{tip}\n0831 녹음본에서 교수님이 정리한 문장: \"processor needs to maintain the '''register context''' that is some kind of the logical control flow, and this register context is actually '''included in the process control block'''.\"<br>\n→ register context는 PCB와 '''별개'''가 아니라 PCB '''안에''' 들어 있다.\n{/tip}\n\n== PCB가 없으면 무슨 일이 ==\n\n<pre class=\"ascii\">\n   PCB 가 하는 일 = \"중단된 프로세스를 되살릴 수 있게 한다\"\n\n   Running  ──── 타이머 인터럽트 ────►  레지스터·PC 를 PCB 에 저장\n      A                                         │\n                                                ▼\n                                           스케줄러가 B 선택\n                                                │\n   Running  ◄──── B 의 PCB 에서 복원 ────────────┘\n      B\n\n   PCB 에 저장하지 않으면 A 는 \"어디까지 했는지\"를 영원히 잃는다.\n<\/pre>\n\n즉 PCB는 [[가상화|CPU 가상화]]의 물리적 토대다. [[컨텍스트 스위치]]라는 메커니즘이 성립하려면 문맥을 \"어딘가\"에 두어야 하고, 그 어딘가가 PCB다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"각 프로세스에 대한 정보를 담고 있는 OS의 자료구조\"를 가리키는 용어를 '''영어 약어와 풀네임'''으로 쓰시오.\n{/quiz}\n{answer}\n'''PCB — Process Control Block.''' 슬라이드 원문: \"OS's data structure that contains information about each process.\"\n{/answer}\n\n{quiz}\n'''(나열)''' 3강 p.36에서 OS가 유지한다고 말한 '''process list'''의 세 갈래를 쓰시오.\n{/quiz}\n{answer}\n① '''Ready processes''' ② '''Blocked processes''' ③ '''Current running process'''. → [[프로세스 목록]]\n{/answer}\n\n== 관련 문서 ==\n* [[struct proc]] — xv6의 실물 PCB\n* [[프로세스]] / [[프로세스 상태]] / [[프로세스 목록]]\n* [[컨텍스트 스위치]] / [[레지스터]] / [[프로그램 카운터]]\n* [[trapframe]] / [[커널 스택]]\n* [[2025F 중간고사 족보]]"
 },
 "fork": {
  "title": "fork()",
  "category": [
   "3강 From Program to Process",
   "용어"
  ],
  "body": "'''`fork()`'''는 현재 프로세스를 통째로 '''복제'''해 자식 프로세스를 만드는 [[시스템 콜]]이다. [[프로세스 API]]의 Create 갈래에 속하며, 유닉스에서 새 프로세스를 만드는 '''유일한''' 방법이다.\n\n{def}\n3강 p.31은 이름만 든다 — \"'''Create''': Create a new process to run a program — e.g., `fork()` and `execv()`\".<br>\n아래의 `p1.c` 예제와 출력은 교재 '''[[OSTEP]] Chapter 5 (Process API)'''의 것으로, 슬라이드에는 없지만 이 수업이 OSTEP을 따라가므로 함께 익혀 두는 것이 좋다.\n{/def}\n\n{analogy}\n🧬 '''세포 분열'''이다. `fork()` 직전의 프로세스가 반으로 갈라져 '''똑같은 두 개'''가 된다. 코드도 같고, 변수 값도 같고, 열어 둔 파일도 같고, 심지어 \"지금 `fork()` 줄을 막 끝냈다\"는 실행 위치까지 같다. 딱 하나 다른 게 있다 — '''`fork()`가 돌려주는 값'''. 부모는 자식의 [[프로세스|PID]]를 받고, 자식은 0을 받는다. 이 숫자 하나로 둘은 자기가 누구인지 안다.\n{/analogy}\n\n== 예제 (OSTEP p1.c) ==\n\n<pre class=\"c\">\n#include &lt;stdio.h&gt;\n#include &lt;stdlib.h&gt;\n#include &lt;unistd.h&gt;\n\nint main(int argc, char *argv[]) {\n    printf(\"hello world (pid:%d)\\n\", (int) getpid());\n    int rc = fork();\n    if (rc &lt; 0) {            // fork failed; exit\n        fprintf(stderr, \"fork failed\\n\");\n        exit(1);\n    } else if (rc == 0) {    // child (new process)\n        printf(\"hello, I am child (pid:%d)\\n\", (int) getpid());\n    } else {                 // parent goes down this path (main)\n        printf(\"hello, I am parent of %d (pid:%d)\\n\", rc, (int) getpid());\n    }\n    return 0;\n}\n<\/pre>\n\n'''출력''':\n\n<pre class=\"sh\">\nprompt> ./p1\nhello world (pid:29146)\nhello, I am parent of 29147 (pid:29146)\nhello, I am child (pid:29147)\nprompt>\n<\/pre>\n\n[[sim:fork_exec]]\n\n== 반환값이 전부다 ==\n\n{| class=\"table\"\n! `fork()` 반환값 || 누가 받나 || 의미\n|-\n| `&gt; 0` || '''부모''' || 방금 만든 '''자식의 PID'''\n|-\n| `== 0` || '''자식''' || \"너는 자식이다\"\n|-\n| `&lt; 0` || 부모 || 생성 실패 (프로세스 테이블 가득 참 등)\n|}\n\n<pre class=\"ascii\">\n                       fork() 호출 시점\n   부모 (pid 29146) ──────────┬─────────────────────► rc = 29147\n                              │                        (자식의 pid)\n                              │ 복제\n                              └─────────────────────► rc = 0\n                         자식 (pid 29147)\n\n   두 프로세스 모두 \"int rc = fork();\" 다음 줄부터 실행을 이어간다.\n   코드는 같고, rc 값만 다르다.\n<\/pre>\n\n{warn}\n'''\"hello world\"는 왜 한 번만 찍히나?''' `fork()`가 `printf` '''뒤에''' 있기 때문이다. 복제는 `fork()` 시점의 상태를 그대로 가져가므로, 그 전에 이미 출력된 것은 다시 출력되지 않는다.<br>\n반대로 `fork()`를 `printf` 앞에 두면 '''두 번''' 찍힌다. 시험에서 `fork()` 위치를 바꿔 놓고 출력 줄 수를 묻는 문제가 나오기 좋다.\n{/warn}\n\n{warn}\n'''부모와 자식 중 누가 먼저 출력되는지는 보장되지 않는다.''' 위 출력에서는 부모가 먼저지만, [[스케줄러]]의 판단에 따라 자식이 먼저 나올 수도 있다. 이것이 [[동시성]]이 만드는 비결정성(non-determinism)의 가장 작은 예다. 순서를 강제하려면 [[wait]]를 써야 한다.\n{/warn}\n\n== 무엇이 복사되나 ==\n\n{| class=\"table\"\n! 항목 || 자식에게 || 비고\n|-\n| 코드 (`.text`) || 공유 (읽기 전용) ||\n|-\n| 데이터·[[힙]]·[[스택]] || '''복사''' || 실제 구현은 copy-on-write로 지연시킨다\n|-\n| 열린 파일 디스크립터 || '''복사''' (같은 파일을 가리킴) || 셸 리다이렉션이 여기 기댄다\n|-\n| [[프로그램 카운터|PC]]·[[레지스터]] || 복사 || 그래서 같은 줄부터 이어 실행\n|-\n| PID || '''새로 발급''' || 유일하게 다른 것\n|-\n| `parent` 포인터 || 부모를 가리킴 || [[struct proc]]의 `parent`\n|}\n\n== fork만으로 프로세스 트리가 생긴다 ==\n\n{tip}\n0831 녹음본에서 교수님이 강조한 부분: \"'''we only have the fork system call'''. … if we want to generate the process, we need a '''parent''' process. … it is actually related to the '''tree''' concept in the data structure. … all of the processes are actually originated from a '''single process''' and we give some special role to that root process — it is called '''init''' process in Linux.\"\n{/tip}\n\n<pre class=\"ascii\">\n        init  (pid 1)\n       ╱     ╲\n    sshd      getty\n      │\n    bash\n   ╱    ╲\n  ls     gcc\n<\/pre>\n\n부모가 있어야만 자식이 생기므로, 시스템의 모든 프로세스는 하나의 루트(`init`)에서 뻗어 나온 '''트리'''를 이룬다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(출력 예측)''' 다음 프로그램의 출력으로 가능한 것을 모두 고르시오. (pid는 임의)\n<pre class=\"c\">\nprintf(\"A\\n\");\nint rc = fork();\nprintf(\"B\\n\");\n<\/pre>\n① A B ② A B B ③ A A B B ④ B B A\n{/quiz}\n{answer}\n'''② A B B.''' `printf(\"A\")`는 `fork()` 이전이라 한 번, `printf(\"B\")`는 부모·자식 양쪽에서 실행되어 두 번 출력된다. A가 항상 먼저이므로 ④는 불가능.\n{/answer}\n\n{quiz}\n'''(빈칸)''' `int rc = fork();` 직후, `rc`의 값은 부모에서 __________ 이고 자식에서 __________ 이다.\n{/quiz}\n{answer}\n부모: '''자식의 PID''' (양수) / 자식: '''0'''. 실패 시 부모가 '''음수'''를 받는다.\n{/answer}\n\n{quiz}\n'''(서술)''' `fork()` 후 부모와 자식 중 어느 쪽이 먼저 실행되는지 단언할 수 없는 이유를 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n`fork()` 직후 두 프로세스는 모두 '''Ready''' 상태가 되고 누구를 먼저 Running으로 올릴지는 [[스케줄러]]의 정책이 정하므로, 프로그램은 순서를 보장받지 못한다.\n{/answer}\n\n== 관련 문서 ==\n* [[프로세스 API]] / [[exec]] / [[wait]]\n* [[프로세스]] / [[프로세스 상태]] / [[struct proc]]\n* [[주소 공간]] — 무엇이 복사되는지\n* [[스케줄러]] / [[동시성]]\n* [[OSTEP]] — Chapter 5"
 },
