  "body": "'''Lottery 스케줄링'''은 매 [[time slice]]마다 '''당첨 티켓을 무작위로 뽑아''' 그 티켓을 가진 [[프로세스]]를 실행하는 [[비례 지분 스케줄링]] 방식이다.\n\n{def}\n'''Lottery Scheduling''': The scheduler picks a '''winning ticket randomly''' → load the state of that winning process and runs it.\n'''The longer these two jobs compete, the more likely they are to achieve the desired percentages.'''\n{/def}\n\n{analogy}이름 그대로 '''복권'''이다. [[tickets|티켓]]을 많이 산 사람이 당첨 확률이 높다. 단, '''한 번의 추첨에서는''' 티켓 1장짜리가 이길 수도 있다. 75:25로 티켓을 나눠도 15번 추첨에서 27%가 나오는 식이다. 하지만 추첨을 만 번 하면 비율은 반드시 75:25에 수렴한다 — '''큰 수의 법칙'''이 공정성을 보장해 주는 구조다.{/analogy}\n\n== 동작 ==\n\n[[img:L6-12.png|총 100장 중 A가 0~74번, B가 75~99번. 난수 15개로 A 11번 / B 4번|medium]]\n\n<pre class=\"txt\">\n 총 티켓 100장.  A = 0~74 (75장),  B = 75~99 (25장)\n 당첨 번호: 63 85 70 39 76 17 29 41 36 39 10 99 68 83 63\n 실행     :  A  B  A  A  B  A  A  A  A  A  A  B  A  B  A\n → B가 15번 중 4번 ≈ 27% (목표 25%)\n<\/pre>\n\n== 구현 ==\n\n필요한 건 셋뿐이다 — '''난수 생성기''', '''프로세스 리스트''', '''총 티켓 수'''. 슬라이드 표현으로 \"the most amazing thing about lottery scheduling is the '''simplicity of its implementation'''\".\n\n[[img:L6-17.png|총 400장, A(100) → B(50) → C(250) 리스트. 누적합이 winner를 넘는 순간이 당첨|medium]]\n\n<pre class=\"c\">\n1   int counter = 0;\n2   int winner = getrandom(0, totaltickets);   // 0 ~ 399\n3   node_t *current = head;\n4\n5   while (current) {\n6       counter = counter + current->tickets;  // 누적합\n7       if (counter > winner)\n8           break;                             // 당첨자 발견\n9       current = current->next;\n10  }\n11  // 'current' is the winner\n<\/pre>\n\n* 2행: 0 ~ (총 티켓 − 1) 중 난수 하나.\n* 6~7행: 리스트를 따라가며 티켓을 '''누적'''하다가, 누적합이 winner를 '''넘는 순간'''의 노드가 당첨.\n* 예: `winner = 300` → A(100) → B(150) → C(400 > 300) → '''C 당첨'''.\n\n{tip}티켓이 많은 프로세스를 '''리스트 앞쪽'''에 정렬해 두면 평균 순회 길이가 짧아진다. 정확성에는 전혀 영향이 없고 속도만 개선된다.{/tip}\n\n{warn}이 순회가 '''O(n)'''이다. 슬라이드 p.29가 바로 이 코드를 다시 띄우며 \"데이터센터 CPU 시간의 5%가 스케줄링에 쓰인다\"고 지적하고, 그 답으로 [[CFS]]의 [[레드블랙 트리]] O(log n)이 나온다.{/warn}\n\n== 공정성의 한계 ==\n\n[[img:L6-20.png|실행 시간 R을 1~1000으로 바꾸며 30회 평균. R이 클수록 F가 1에 수렴|medium]]\n\n티켓 수(100)도 같고 실행 시간(R)도 같은 두 job인데 난수 때문에 하나가 먼저 끝난다. [[fairness|F]] = 먼저 끝난 시각 / 나중 끝난 시각으로 재면 R이 작을 때 0.5(최악)에서 시작해 R이 커질수록 1에 수렴한다.\n\n{def}\n'''Why Randomness?'''\n* Randomness gets us a '''simple and approximately correct''' scheduler\n* However, it occasionally will '''not deliver the exact right proportions''', especially over '''short time scales'''\n{/def}\n\n== Stride와 비교해 남는 장점 ==\n\nStride가 비율을 정확히 맞추는데도 Lottery가 의미 있는 이유는 '''전역 상태(global state)가 없다'''는 것이다.\n\n* Lottery는 [[pass]] 같은 값을 관리하지 않는다. 새 job이 들어오면 '''총 티켓 수만 갱신'''하면 끝.\n* [[Stride 스케줄링]]은 새 job의 pass를 뭘로 줄지 정해야 하고, 0으로 두면 '''CPU를 독점'''한다.\n\n[[sim:stride_lottery]]\n\n== 관련 문서 ==\n* [[tickets]] · [[Stride 스케줄링]] · [[비례 지분 스케줄링]]\n* [[fairness]] · [[CFS]]"
 },
 "tickets": {
  "title": "tickets (티켓)",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''tickets'''(티켓)은 [[프로세스]]가 받아야 할 자원의 '''몫(share)'''을 나타내는 단위다. [[비례 지분 스케줄링]] 전체가 이 개념 위에 서 있다.\n\n{def}\n'''Tickets''': Represent the '''share of a resource''' that a process should receive. The '''percent of tickets''' represents its share of the system resource in question.\ne.g., Process A has 75 tickets → receive '''75%''' of the CPU / Process B has 25 tickets → '''25%'''.\n{/def}\n\n{analogy}'''회사 주식'''이다. 전체 발행 주식 중 내 지분율이 곧 내가 받을 배당 비율이다. 100주 중 75주를 가졌으면 배당의 75%. 티켓도 똑같이 '''절대 개수가 아니라 전체 대비 비율'''만 의미가 있다 — A가 75장, B가 25장이든 A가 750장, B가 250장이든 결과는 같다.{/analogy}\n\n<pre class=\"ascii\">\n 전체 티켓 100장\n ┌───────────────────────────────────┬───────────┐\n │  A : 0 ~ 74  (75장 = 75%)         │ B: 75~99  │\n └───────────────────────────────────┴───────────┘\n   ↑ [[Lottery 스케줄링]]은 0~99 중 난수를 뽑아 이 구간에 떨어뜨린다\n<\/pre>\n\n티켓은 CPU만을 위한 개념이 아니다. 메모리, 디스크 대역폭, 네트워크 등 '''나눠 쓸 수 있는 모든 자원'''에 같은 방식으로 적용할 수 있다.\n\n== 세 가지 메커니즘 ==\n\n=== Ticket currency (티켓 화폐) ===\n\n사용자가 '''자기 마음대로의 단위'''로 자기 job들에 티켓을 나눠 주면, 시스템이 '''전역(global) 화폐로 환산'''한다. 남이 티켓을 몇 장 가졌는지 신경 쓸 필요가 없어진다.\n\n<pre class=\"txt\">\n 전역 200장. 사용자 A·B가 100장씩.\n\n User A → 500 (A's currency) to A1 → '''50''' (global)\n        → 500 (A's currency) to A2 → '''50''' (global)\n User B →  10 (B's currency) to B1 → '''100''' (global)\n\n 환산 공식: 전역 = (사용자의 전역 티켓) × (job의 지역 티켓 / 사용자 지역 티켓 합)\n            A1 = 100 × (500 / 1000) = 50\n            B1 = 100 × ( 10 /   10) = 100\n<\/pre>\n\n{exam}계산 문제로 나오기 딱 좋은 형태다. '''분모는 \"그 사용자의 지역 티켓 총합\"'''이다. A는 500+500=1000, B는 10 하나뿐이라 10이다. 이 분모를 전역 총합(200)으로 잡으면 전부 틀린다.{/exam}\n\n=== Ticket transfer (티켓 양도) ===\n\n프로세스가 자기 티켓을 다른 프로세스에 '''일시적으로 넘겨준다'''.\n\n<pre class=\"ascii\">\n ① client ──\"이 일 해줘\"──► server\n ② client ──\"내 티켓 줄게\"─► server   (client는 어차피 기다리는 중)\n ③ server 가 최고 속도로 처리\n ④ server ──\"티켓 돌려줌\"──► client\n<\/pre>\n\n특정 상황에서 우선순위를 잠깐 바꾸는 수단이다. 9강의 [[priority inversion]]을 티켓으로 푸는 아이디어이기도 하다.\n\n=== Ticket inflation (티켓 인플레이션) ===\n\n프로세스가 '''스스로 티켓 수를 늘리거나 줄인다'''. CPU가 더 필요하면 부풀린다.\n\n{warn}슬라이드 노란 박스: \"'''One greedy process could give itself a vast number of tickets and take over the machine.'''\" 따라서 '''서로 신뢰하는 프로세스들 사이에서만''' 쓸 수 있는 기능이다. 경쟁 환경에서는 말이 안 되고, 협력 환경(같은 앱의 여러 컴포넌트 등)에서는 유용하다.{/warn}\n\n== 다른 스케줄러의 대응물 ==\n\n{|\n! 스케줄러 || 티켓에 해당하는 것\n|-\n| [[Lottery 스케줄링]] || tickets (그대로)\n|-\n| [[Stride 스케줄링]] || tickets → [[stride]] = 큰 수 / tickets (반비례)\n|-\n| [[CFS]] || [[nice]] → [[weight]] (슬라이드 원문: \"similar to the number of tokens in other fair-share scheduling algorithms\")\n|-\n| [[EEVDF]] || [[weight]] + latency_nice\n|}\n\n== 관련 문서 ==\n* [[Lottery 스케줄링]] · [[Stride 스케줄링]] · [[stride]]\n* [[비례 지분 스케줄링]] · [[weight]] · [[nice]]"
 },
 "Stride 스케줄링": {
  "title": "Stride 스케줄링 (Stride Scheduling)",
  "category": [
   "6강 Proportional Share",
   "정책"
  ],
  "body": "'''Stride 스케줄링'''은 난수를 쓰지 않는 '''결정적(deterministic)''' [[비례 지분 스케줄링]]이다. [[Lottery 스케줄링]]이 \"확률적으로 대충 맞는\" 것에 만족했다면, stride는 '''매 스케줄링 사이클 끝에 비율을 정확히 맞춘다'''.\n\n{def}\n'''Stride Scheduling''': A deterministic fair-share scheduler\n* Each process has a '''stride''', which is '''inverse in proportion to tickets''' it has\n* Each process maintains a '''pass''' value which is initially 0 and '''increases by its stride whenever the process runs'''\n* The scheduler picks the process to run that has the '''lowest pass value'''\n\nThe stride scheduling does '''not rely on any randomness''', except when pass values are the same (e.g., 0).\n{/def}\n\n{analogy}'''보폭(stride)이 다른 사람들의 경보 경기'''다. 티켓이 많은 프로세스는 '''종종걸음'''(작은 stride)이라 같은 거리를 가려면 여러 번 걸어야 하고, 티켓이 적은 프로세스는 '''성큼성큼'''(큰 stride)이라 한 걸음에 멀리 간다. 심판은 항상 '''가장 뒤처진 사람'''([[pass]] 최소)에게 다음 한 걸음을 준다. 결과적으로 종종걸음 프로세스가 훨씬 자주 걷게 되고, 걸음 수의 비율이 곧 티켓 비율이 된다.{/analogy}\n\n== 의사 코드 ==\n\n<pre class=\"c\">\n1   current = remove_min(queue);        // pick client with minimum pass\n2   schedule(current);                  // use resource for quantum\n3   current->pass += current->stride;   // compute next pass using stride\n4   insert(queue, current);             // put back into the queue\n<\/pre>\n\n* 1행: [[pass]]가 가장 작은 프로세스를 큐에서 꺼낸다.\n* 2행: 한 quantum(= [[time slice]]) 동안 실행.\n* 3행: 실행했으니 자기 [[stride]]만큼 pass를 늘린다.\n* 4행: 큐에 되돌려 넣는다.\n\n$$stride_i = \\frac{\\text{(a large number)}}{tickets_i}$$\n\n== 계산 예 (슬라이드 기준, 큰 수 = 10,000) ==\n\n[[img:L6-25.png|A=100, B=50, C=250 티켓. stride는 100 / 200 / 40. 한 사이클에서 C 5 : A 2 : B 1|medium]]\n\n<pre class=\"txt\">\n A: 10000 / 100 = 100\n B: 10000 /  50 = 200\n C: 10000 / 250 =  40\n<\/pre>\n\n{|\n! Pass(A)=100 || Pass(B)=200 || Pass(C)=40 || Who Runs?\n|-\n| 0 || 0 || 0 || A (동점)\n|-\n| 100 || 0 || 0 || B\n|-\n| 100 || 200 || 0 || C\n|-\n| 100 || 200 || 40 || C\n|-\n| 100 || 200 || 80 || C\n|-\n| 100 || 200 || 120 || A\n|-\n| 200 || 200 || 120 || C\n|-\n| 200 || 200 || 160 || C\n|-\n| 200 || 200 || 200 || … 사이클 종료\n|}\n\n'''C 5번, A 2번, B 1번 = 250 : 100 : 50 = 5 : 2 : 1 정확히 일치.''' 처음 동점에서 B를 먼저 골라도(`B C A C C A C C …`) 사이클 안의 비율은 똑같다.\n\n[[sim:stride_lottery]]\n\n== 약점: 새 job의 pass 값 ==\n\n{warn}'''이 강의의 반복 주제다.''' Stride 도중에 새 job이 들어오면 [[pass]]를 뭘로 줄까? 0으로 두면 다른 프로세스는 이미 200, 400인데 혼자 0이라 '''pass가 남들을 따라잡을 때까지 CPU를 독점'''한다.\n\n[[Lottery 스케줄링]]에는 이 문제가 없다 — 전역 상태가 없으니 총 티켓 수만 갱신하면 끝이다. 슬라이드가 \"Why use lottery scheduling?\"에 대해 내놓는 답이 정확히 이것이다.\n\n같은 문제의 다른 해답:\n* [[CFS]] — 새 프로세스/깬 프로세스의 [[vruntime]]을 '''min_vruntime'''으로 설정\n* [[EEVDF]] — [[lag]]는 0 위로 올라가지 않으므로 구조적으로 몰아 받기가 불가능{/warn}\n\n{|\n! || [[Lottery 스케줄링]] || Stride 스케줄링\n|-\n| 비율 || 확률적 (오래 돌수록 수렴) || '''정확''' (사이클마다)\n|-\n| 난수 || 필수 || 동점일 때만\n|-\n| 전역 상태 || '''없음''' || [[pass]]\n|-\n| 새 job || 티켓만 추가 || '''pass 값 문제'''\n|}\n\n== 관련 문서 ==\n* [[pass]] · [[stride]] · [[tickets]]\n* [[Lottery 스케줄링]] · [[CFS]] · [[비례 지분 스케줄링]]\n* [[2025F 중간고사 족보]] — Problem 4가 stride pass 표 채우기였다"
 },
 "pass": {
  "title": "pass (패스 값)",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''pass'''는 [[Stride 스케줄링]]에서 각 [[프로세스]]가 유지하는 '''누적 진행도'''다. 처음엔 0이고, 그 프로세스가 실행될 때마다 자기 [[stride]]만큼 증가한다. 스케줄러는 항상 '''pass가 가장 작은''' 프로세스를 고른다.\n\n{def}\nEach process maintains a '''pass''' value which is '''initially 0''' and '''increases by its stride whenever the process runs'''. The scheduler picks the process to run that has the '''lowest pass value'''.\n{/def}\n\n{analogy}'''마라톤 주자들의 누적 거리 전광판'''이다. pass는 \"지금까지 몇 m를 갔는가\"이고, 심판은 항상 '''꼴찌에게 다음 한 걸음'''을 준다. 보폭([[stride]])이 작은 사람은 한 걸음에 조금밖에 못 가니 계속 꼴찌로 남아 자주 걷게 되고, 보폭이 큰 사람은 한 걸음에 확 앞서 나가 한참 쉰다. '''전광판 숫자가 작을수록 우대받는다'''는 점이 직관과 반대라 헷갈리기 쉽다.{/analogy}\n\n<pre class=\"c\">\ncurrent = remove_min(queue);        // pass 최소 프로세스 선택\nschedule(current);\ncurrent->pass += current->stride;   // 실행했으니 pass 증가\ninsert(queue, current);\n<\/pre>\n\n[[img:L6-25.png|pass 표: 매 행에서 최솟값을 가진 프로세스가 실행되고, 그 값에 stride가 더해져 다음 행이 된다|medium]]\n\n== 표를 채우는 법 ==\n\n{exam}2025F 중간고사 Problem 4가 '''이 표를 직접 채우는 문제'''였다. 기계적 규칙 세 줄만 지키면 된다.\n\n# 그 행에서 '''pass 최솟값'''을 가진 프로세스를 찾는다 → \"Who Runs?\"\n# '''동점이면''' 임의(보통 A → B → C 순)로 고른다.\n# 고른 프로세스의 pass에 '''그 프로세스의 stride'''를 더한 것이 '''다음 행'''이다. 나머지는 그대로.\n\n'''표의 pass 값은 \"실행하기 직전\" 상태'''라는 점이 핵심이다. \"실행 후\" 값으로 읽으면 한 칸씩 밀린다.{/exam}\n\n<pre class=\"txt\">\n stride: A=5, B=10, C=2 (큰 수 500, 티켓 100/50/250)\n\n #  Pass(A) Pass(B) Pass(C)  Who Runs?\n 1     0       0       0        A      ← 동점 → A\n 2     5       0       0        B      ← A만 +5\n 3     5      10       0        C\n 4     5      10       2        C\n 5     5      10       4        C\n 6     5      10       6        A      ← 최솟값이 5(A)\n 7    10      10       6        C\n 8    10      10       8        C\n ────────────────────────────────────── 여기까지 한 사이클\n 9    10      10      10        A      ← pass가 전부 10, 처음과 같은 모양\n<\/pre>\n\n== 사이클과 주기성 ==\n\npass가 전부 같은 값이 되는 지점이 '''한 사이클의 끝'''이다. 그 안에서 비율이 정확히 맞는다.\n\n<pre class=\"txt\">\n 사이클 길이 = lcm(모든 stride) 를 각 stride로 나눈 값들의 합\n   lcm(5, 10, 2) = 10\n   A: 10/5 = 2번,  B: 10/10 = 1번,  C: 10/2 = 5번   → 합 '''8 슬라이스'''\n   비율 2 : 1 : 5 = 100 : 50 : 250 ✔\n<\/pre>\n\n{tip}\"100번째 슬라이스의 pass는?\" 같은 문제는 '''절대 100줄을 굴리지 않는다'''. $100 = 8 \\times 12 + 4$ → 12사이클(= pass 전체 +120) 뒤의 4번째 행과 같은 상황이다. 4번째 행 (5, 10, 2)에 120을 더하면 '''(125, 130, 122)''', 실행되는 건 '''C'''.{/tip}\n\n== 새 job의 pass 문제 ==\n\n{warn}Stride의 유일한 구조적 약점이다. 도중에 들어온 job의 pass를 '''0으로 두면''' 다른 프로세스가 이미 200, 400에 있으므로 따라잡을 때까지 '''CPU를 독점'''한다. [[Lottery 스케줄링]]에는 pass 같은 전역 상태가 없어 이 문제 자체가 없다.\n\n[[CFS]]는 같은 문제를 [[vruntime]]을 '''min_vruntime'''으로 맞추는 방식으로 푼다.{/warn}\n\n[[sim:stride_lottery]]\n\n== 관련 문서 ==\n* [[Stride 스케줄링]] · [[stride]] · [[tickets]]\n* [[vruntime]] — CFS에서 pass와 같은 역할\n* [[2025F 중간고사 족보]]"
 },
 "stride": {
  "title": "stride (보폭)",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''stride'''는 [[Stride 스케줄링]]에서 프로세스가 한 번 실행될 때 [[pass]]에 더해지는 값이다. [[tickets|티켓]] 수에 '''반비례'''한다.\n\n$$stride_i = \\frac{\\text{(a large number)}}{tickets_i}$$\n\n{def}\nEach process has a '''stride''', which is '''inverse in proportion to tickets''' it has.\nStride = (a large number) / (the number of tickets of the process)\n{/def}\n\n{analogy}'''보폭'''이다. 티켓이 많은(우대받아야 할) 프로세스에게 '''작은 보폭'''을 준다. 작은 보폭으로는 조금씩밖에 못 가니 항상 꼴찌([[pass]] 최소)로 남아 '''자주 불린다'''. 티켓이 적은 프로세스는 '''큰 보폭'''이라 한 번 걸으면 저만치 앞서 나가서 한참 동안 차례가 안 온다. '''작은 stride = 자주 실행'''이라는 반비례 관계가 핵심이다.{/analogy}\n\n== 계산 ==\n\n\"큰 수\"는 임의로 정한다. 슬라이드 예제는 '''10,000''', 2025F 중간고사 문제는 '''500'''을 썼다. 비율만 맞으면 되므로 어떤 값을 쓰든 스케줄 순서는 같다.\n\n<pre class=\"txt\">\n 티켓  A=100, B=50, C=250\n\n 큰 수 = 10,000                  큰 수 = 500\n   A: 10000/100 = 100              A: 500/100 = 5\n   B: 10000/ 50 = 200              B: 500/ 50 = 10\n   C: 10000/250 =  40              C: 500/250 = 2\n\n 비율은 둘 다 100:200:40 = 5:10:2 로 '''동일''' → 스케줄 순서도 동일\n<\/pre>\n\n{warn}'''큰 수를 문제에서 주면 반드시 그 값을 쓸 것.''' 2025F Problem 4는 \"The scheduler uses the large number of '''500'''\"이라고 명시했다. 습관적으로 10,000을 쓰면 pass 값의 절대치가 전부 틀린다(순서는 맞아도 빈칸 채우기에서 0점).\n\n큰 수가 커야 하는 이유는 '''정수 나눗셈의 오차'''를 줄이기 위해서다. 티켓 3장짜리에 큰 수가 10이면 stride가 3(= 10/3)으로 잘려 비율이 깨진다.{/warn}\n\n[[img:L6-25.png|stride 100/200/40에서 한 사이클 동안 C 5번, A 2번, B 1번 = 티켓 비율 그대로|medium]]\n\n== stride와 다른 스케줄러의 대응 ==\n\n{|\n! 스케줄러 || 누적값 || 증가량\n|-\n| [[Stride 스케줄링]] || [[pass]] || '''stride''' = 큰 수 / 티켓\n|-\n| [[CFS]] || [[vruntime]] || $(weight_0 / weight_i) \\times runtime$\n|}\n\n둘은 구조적으로 '''같은 알고리즘'''이다. stride ↔ $weight_0/weight_i$, pass ↔ vruntime. 차이는 CFS가 증가량을 '''실제 실행 시간에 비례'''시켜 고정 슬라이스 없이도 동작한다는 점이다.\n\n[[sim:stride_lottery]]\n\n== 관련 문서 ==\n* [[Stride 스케줄링]] · [[pass]] · [[tickets]]\n* [[CFS]] · [[vruntime]] · [[weight]]"
 },
 "CFS": {
  "title": "CFS (Completely Fair Scheduler)",
  "category": [
   "6강 Proportional Share",
   "정책"
  ],
  "body": "'''CFS'''(Completely Fair Scheduler)는 리눅스가 '''2007년 커널 2.6.23부터 2023년 6.6까지''' 사용한 실제 [[비례 지분 스케줄링]] 구현이다. [[Stride 스케줄링]]의 아이디어를 '''효율과 확장성'''을 갖춘 형태로 다듬었다.\n\n{def}\nThe Linux CFS implements fair-share scheduling in a '''highly efficient and scalable''' manner.\n* '''Not based on the concept of a fixed time slice''' (e.g., 10 ms)\n* CFS uses a counting-based technique, '''virtual runtime (vruntime)'''\n** As each process runs, it '''accumulates vruntime'''\n** (In the most basic case) each process's vruntime increases at the '''same rate''' (= in proportion with physical time)\n** CFS picks the process with the '''lowest vruntime''' to run next\n{/def}\n\n{analogy}[[vruntime]]은 '''각자 손목에 찬 시계'''다. CPU를 쓰는 동안만 시계가 돌고, 스케줄러는 '''시계가 가장 적게 간 사람'''에게 다음 차례를 준다. 우선순위가 높은 사람의 시계는 '''천천히 가도록 조작'''되어 있어서([[weight]]가 크다) 실제로 10초를 써도 3.2초만 찍힌다. 그래서 계속 \"제일 덜 쓴 사람\"으로 뽑힌다. 자고 있는 사람은 시계가 멈춰 있으니, 깨어나면 당연히 1순위가 된다.{/analogy}\n\n== 왜 만들었나 — 오버헤드 ==\n\n{def}\n'''Scheduling Overhead''': Scheduler efficiency is surprisingly important. Even after aggressive optimization, '''scheduling uses about 5% of overall datacenter CPU time!'''\n{/def}\n\n[[Lottery 스케줄링]]의 리스트 순회가 '''O(n)'''이다. 프로세스가 수천 개인 서버에서는 이 자체가 비용이다. CFS는 [[레드블랙 트리]]로 '''O(log n)'''을 달성한다.\n\n== 고정 슬라이스가 없다 ==\n\n[[img:L6-33.png|sched_latency 48ms. n=4면 슬라이스 12ms, C·D가 끝나 n=2가 되면 24ms로 자동 확대|large]]\n\n$$\\text{time slice} = \\frac{sched\\_latency}{n}, \\quad \\text{단 } \\ge min\\_granularity$$\n\n* [[sched_latency]] (기본 48ms): 이 기간 안에서는 CFS가 '''완전히 공정'''하다. 모든 프로세스가 정확히 제 몫을 한 번씩 돈다.\n* n = 4 → 12ms. C와 D가 끝나 n = 2가 되면 → '''24ms'''. 프로세스가 줄면 슬라이스가 늘어난다.\n* n = 10 → 4.8ms → [[컨텍스트 스위치]] 폭증. 그래서 [[min_granularity]](6ms)가 하한을 둔다.\n\n== 우선순위: nice → weight → vruntime ==\n\n[[img:L6-36.png|vruntime 공식. weight₀ = 1024는 nice 0의 weight|medium]]\n\n$$vruntime_i = vruntime_i + \\frac{weight_0}{weight_i} \\cdot runtime_i$$\n\n* [[nice]] (−20 ~ +19, 기본 0) → [[weight]]로 매핑. nice 0 = weight '''1024'''.\n* nice −5 → weight 3121 → 10초를 돌아도 vruntime은 $\\frac{1024}{3121}\\times 10 = $ '''3.2초'''만 증가 → 더 자주 선택된다.\n\n== red-black tree ==\n\n[[img:L6-38.png|vruntime을 키로 하는 레드블랙 트리. 가장 왼쪽 노드가 다음에 실행될 프로세스|medium]]\n\n* '''runnable 프로세스만''' 트리에 둔다. I/O·네트워크를 기다리며 '''자는 프로세스는 제외'''.\n* 키 = [[vruntime]].\n* 다음 job 찾기 = '''가장 왼쪽 노드 제거 → O(1)''' (leftmost를 캐시해 둔다). 되돌려 넣기 = '''O(log n)'''.\n\n== I/O와 자는 프로세스 ==\n\n{|\n! 상황 || CFS의 동작\n|-\n| I/O로 잠듦 || [[vruntime]]이 '''그대로 멈춘다'''\n|-\n| 깨어남 || vruntime이 남들보다 작음 → '''우선 선택''' (특별한 메커니즘 없이 대화형 우대)\n|-\n| 오래 자다 깨어남 || vruntime이 너무 작아 '''CPU 독점 → 다른 job starvation'''\n|-\n| 해법 || 깬 job의 vruntime을 '''트리의 최솟값(min_vruntime)'''으로 재설정\n|}\n\n{exam}'''starvation 예제를 숫자로 외울 것.''' A는 계속 실행, B는 10초 동안 잠. B가 깨면 vruntime이 A보다 '''10초 뒤져''' 있으므로 B가 다음 '''10초를 독점'''하고 A가 굶는다. 해법은 \"밀린 몫을 다 돌려주지 않고 '''지금 제일 앞 사람과 동급'''으로만 취급\"하는 것. [[Stride 스케줄링]]의 \"새 job의 [[pass]]\" 문제와 정확히 같은 문제, 같은 해법이다.{/exam}\n\n[[sim:cfs_eevdf]]\n\n== CFS의 한계 (→ EEVDF) ==\n\n* '''지연 요구(latency-nice)를 반영할 수 없다''' — nice는 CPU의 '''양'''만 정하고, \"얼마나 빨리 반응해야 하는지\"는 표현할 방법이 없다.\n* 15년간의 진화로 '''휴리스틱이 누적'''됐다 (interactive bonus, wakeup replacement …). 이론적 기반이 없고, 복잡하며, 예측이 어렵다.\n\n그래서 리눅스 6.6(2023.10)에서 코어가 [[EEVDF]]로 교체됐다.\n\n== 관련 문서 ==\n* [[vruntime]] · [[nice]] · [[weight]] · [[sched_latency]] · [[min_granularity]] · [[레드블랙 트리]]\n* [[EEVDF]] · [[lag]] · [[virtual deadline]]\n* [[Stride 스케줄링]] — 같은 알고리즘의 원형\n* [[비례 지분 스케줄링]] · [[MLFQ]]"
 },
 "vruntime": {
  "title": "vruntime (virtual runtime)",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''vruntime'''(virtual runtime, 가상 실행 시간)은 [[CFS]]가 각 [[프로세스]]에 대해 누적하는 '''가중치가 적용된 실행 시간'''이다. CFS는 언제나 '''vruntime이 가장 작은''' 프로세스를 다음에 실행한다.\n\n$$vruntime_i = vruntime_i + \\frac{weight_0}{weight_i} \\cdot runtime_i$$\n\n{def}\n* $runtime_i$ = the '''actual run time''' that $process_i$ has accrued\n* $weight_0$ (= '''1024''') = a weight of a default [[nice]] value 0\n* As each process runs, it accumulates vruntime. CFS picks the process with the '''lowest vruntime''' to run next.\n{/def}\n\n{analogy}'''각자 손목에 찬 시계'''다. CPU를 쓰는 동안만 돌아가고, 스케줄러는 '''시계가 제일 적게 간 사람'''을 부른다. 그런데 우선순위가 높은 사람의 시계는 '''느리게 가도록 조작'''되어 있다 — nice −5인 사람이 10초를 써도 시계에는 3.2초만 찍힌다. 그래서 계속 \"제일 덜 쓴 사람\"으로 뽑힌다. 자고 있으면 시계가 멈추니, 깨어나면 당연히 1순위다.{/analogy}\n\n[[img:L6-36.png|vruntime 공식과 nice −5 예제. weight 3121 → 0.328배로만 누적|medium]]\n\n== 계산 예 ==\n\n<pre class=\"txt\">\n Δvruntime = (weight₀ / weightᵢ) × runtimeᵢ,   weight₀ = 1024\n\n nice   0 (weight 1024): (1024/1024) × 10초 = 10초    ← 실제와 동일\n nice  −5 (weight 3121): (1024/3121) × 10초 = '''3.2초'''  ← 실제보다 적게 쌓임 → 자주 선택\n nice  +5 (weight  335): (1024/ 335) × 10초 = 30.6초  ← 실제보다 많이 쌓임 → 드물게 선택\n<\/pre>\n\n{warn}슬라이드 p.36 첫 줄의 \"a high priority (i.e., a '''low''' weight)\"는 '''오타에 가깝다'''. 공식과 예제 숫자가 기준이다.\n* 우선순위가 높다 → [[nice]]가 음수 → [[weight]]가 '''크다''' (nice −5 = 3121 > nice 0 = 1024)\n* weight가 크다 → 분수 $weight_0/weight_i$가 '''작다''' → vruntime이 '''천천히''' 쌓인다 → 더 자주 뽑힌다{/warn}\n\n== 자는 프로세스 ==\n\n* 프로세스가 I/O로 잠들면 vruntime은 '''그대로 멈춘다'''. 자는 동안은 CPU를 안 쓰니까.\n* 깨어나면 남들보다 vruntime이 '''작다''' → CFS가 먼저 고른다.\n* 이것만으로 '''대화형 job 우대'''가 공짜로 된다. [[MLFQ]]가 규칙 5개로 만들던 효과다.\n\n{exam}'''부작용은 starvation.''' A는 계속 실행, B는 10초 동안 잠 → B가 깨면 vruntime이 A보다 10초 뒤져 있어 '''다음 10초를 독점'''한다.\n\n해법: 깬 job의 vruntime을 '''red-black tree의 최솟값(min_vruntime)'''으로 맞춘다. 밀린 몫을 다 돌려주지 않고 \"지금 제일 앞 사람과 동급\"으로만 취급하는 것.\n\n이건 [[Stride 스케줄링]]의 \"새 job의 [[pass]]를 0으로 두면 독점\" 문제와 '''정확히 같은 문제, 같은 해법'''이다. 세트로 외울 것.{/exam}\n\n== 자료구조에서의 역할 ==\n\n[[레드블랙 트리]]의 '''키'''가 vruntime이다. 가장 왼쪽 노드 = vruntime 최소 = 다음에 실행할 프로세스. 그래서 선택이 '''O(1)''', 삽입이 '''O(log n)'''이다.\n\n[[sim:cfs_eevdf]]\n\n== 대응 관계 ==\n\n{|\n! [[Stride 스케줄링]] || [[CFS]]\n|-\n| [[pass]] || '''vruntime'''\n|-\n| [[stride]] (= 큰 수 / [[tickets]]) || $weight_0 / weight_i$\n|-\n| 매 실행마다 stride 더함 || 실제 실행 시간에 '''비례'''해서 더함\n|-\n| pass 최소 선택 || vruntime 최소 선택\n|}\n\n== 관련 문서 ==\n* [[CFS]] · [[weight]] · [[nice]] · [[레드블랙 트리]]\n* [[pass]] · [[stride]] · [[Stride 스케줄링]]\n* [[EEVDF]] · [[lag]]"
 },
 "nice": {
  "title": "nice value",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''nice''' 값은 유닉스/리눅스에서 [[프로세스]]의 우선순위를 표현하는 정수다. [[CFS]]는 이 값을 [[weight]]로 매핑해 [[vruntime]] 누적 속도를 조절한다. 다른 [[비례 지분 스케줄링]] 알고리즘의 [[tickets|티켓 수]]에 해당한다.\n\n{def}\n* CFS controls a process priority by a '''nice value''' of a process — similar to the number of tokens in other fair-share scheduling algorithms\n* The nice value ranges from '''−20 to +19'''; a default nice value is '''0'''\n* '''Positive nice values imply lower priority'''\n* '''Negative values imply higher priority'''\n* CFS maps the nice value of each process to a '''weight'''\n{/def}\n\n{analogy}이름 그대로 '''\"착한 정도\"'''다. nice 값이 크면(양수) '''남에게 친절하게 양보'''하는 프로세스이므로 CPU를 덜 받는다. nice 값이 작으면(음수) '''이기적'''이라 CPU를 더 많이 가져간다. 부호가 헷갈릴 때는 \"nice할수록 양보한다\"만 떠올리면 된다.{/analogy}\n\n<pre class=\"ascii\">\n  −20 ←──────────── 0 ────────────→ +19\n 높은 우선순위     기본값        낮은 우선순위\n weight 88761    weight 1024    weight 15\n \"이기적\"                        \"착함(nice)\"\n<\/pre>\n\n{warn}'''부호 방향이 직관과 반대'''라 시험 함정으로 쓰기 좋다. \"nice 값이 높으면 우선순위가 높다\" → '''거짓'''. 값이 클수록 '''낮은''' 우선순위다.\n\n참고로 [[weight]]는 반대로 '''클수록 높은 우선순위'''다. nice −20의 weight가 88761로 가장 크다. nice와 weight는 '''부호 방향이 반대'''라는 점을 세트로 기억할 것.{/warn}\n\n== nice → weight 테이블 ==\n\n[[img:L6-35.png|prio_to_weight[40] 테이블. nice 0 = 1024, 한 단계마다 약 1.25배|medium]]\n\n<pre class=\"c\">\nstatic const int prio_to_weight[40] = {\n /* -20 */ 88761, 71755, 56483, 46273, 36291,\n /* -15 */ 29154, 23254, 18705, 14949, 11916,\n /* -10 */  9548,  7620,  6100,  4904,  3906,\n /*  -5 */  3121,  2501,  1991,  1586,  1277,\n /*   0 */  1024,   820,   655,   526,   423,\n /*   5 */   335,   272,   215,   172,   137,\n /*  10 */   110,    87,    70,    56,    45,\n /*  15 */    36,    29,    23,    18,    15,\n};\n<\/pre>\n\n* 배열 크기가 '''40''' = nice −20 ~ +19의 개수.\n* nice 0 = '''1024''' = $weight_0$. 공식의 기준값이다.\n* 한 단계마다 약 '''1.25배''' 차이 — nice를 1 낮추면 CPU 몫이 약 25% 늘어난다.\n* 시험에 자주 나오는 값: '''nice 0 → 1024''', '''nice −5 → 3121'''.\n\n== CPU 몫 계산 ==\n\nnice가 다른 프로세스들이 섞여 있으면 CPU 몫은 weight 비율로 정해진다.\n\n$$\\text{CPU share}_i = \\frac{weight_i}{\\sum_j weight_j}, \\qquad slice_i = \\frac{weight_i}{\\sum_j weight_j} \\times sched\\_latency$$\n\n<pre class=\"txt\">\n 예: nice 0 (1024) 프로세스 하나 + nice 5 (335) 프로세스 하나\n   총 weight = 1024 + 335 = 1359\n   nice 0: 1024/1359 = 75.3%   → sched_latency 48ms 중 '''36ms'''\n   nice 5:  335/1359 = 24.7%   → '''12ms'''\n<\/pre>\n\n== 관련 문서 ==\n* [[weight]] · [[vruntime]] · [[CFS]] · [[sched_latency]]\n* [[tickets]] — 다른 fair-share 알고리즘에서의 대응물\n* [[EEVDF]] — nice(CPU 양)와 별개로 latency_nice(반응 속도)를 도입했다"
 },
 "weight": {
  "title": "weight (가중치)",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''weight'''(가중치)는 [[CFS]]가 [[nice]] 값을 변환해 얻는 수치로, [[vruntime]] 누적 속도와 CPU 몫을 직접 결정한다. '''클수록 우선순위가 높다.'''\n\n$$vruntime_i \\mathrel{+}= \\frac{weight_0}{weight_i} \\cdot runtime_i, \\qquad weight_0 = 1024$$\n\n{analogy}weight는 '''환율'''이다. 모든 프로세스가 \"실제 시간\"이라는 같은 화폐로 CPU를 쓰지만, 장부에 적힐 때는 각자의 환율로 환산된다. weight가 큰 프로세스는 '''환율이 유리'''해서 10초를 써도 장부에는 3.2초만 찍힌다. 장부 숫자가 작은 사람이 계속 우대받으므로, 유리한 환율 = 높은 우선순위다.{/analogy}\n\n[[img:L6-35.png|prio_to_weight[40] 테이블. nice −20의 88761부터 nice +19의 15까지|medium]]\n\n{|\n! nice || −20 || −15 || −10 || '''−5''' || '''0''' || +5 || +10 || +15 || +19\n|-\n| weight || 88761 || 29154 || 9548 || '''3121''' || '''1024''' || 335 || 110 || 36 || 15\n|}\n\n{warn}'''nice와 weight는 부호 방향이 반대다.'''\n* [[nice]]: '''작을수록''' 높은 우선순위 (−20이 최고)\n* weight: '''클수록''' 높은 우선순위 (88761이 최고)\n\n슬라이드 p.36의 \"a high priority (i.e., a '''low''' weight)\"는 이 관계를 뒤집어 쓴 오타다. 같은 슬라이드의 예제(nice −5 → weight 3121 → vruntime이 '''적게''' 쌓임 → 자주 선택)가 올바른 방향을 확인해 준다.{/warn}\n\n== 두 가지 용도 ==\n\n=== 1. vruntime 누적 속도 ===\n\n<pre class=\"txt\">\n Δvruntime = (1024 / weightᵢ) × 실제 실행 시간\n\n weight 3121 (nice −5): 1024/3121 = 0.328배 → 10초 실행 → '''3.2초''' 누적\n weight 1024 (nice  0): 1024/1024 = 1.000배 → 10초 실행 → 10초 누적\n weight  335 (nice +5): 1024/ 335 = 3.057배 → 10초 실행 → 30.6초 누적\n<\/pre>\n\n=== 2. time slice 크기 ===\n\n$$slice_i = \\frac{weight_i}{\\sum_j weight_j} \\times sched\\_latency$$\n\n[[sched_latency]]를 프로세스 수로 균등 분배하는 대신, '''weight 비율대로''' 나눈다. 모든 프로세스의 nice가 같으면 이 식은 $sched\\_latency / n$과 같아진다.\n\n== EEVDF에서의 역할 ==\n\n[[EEVDF]]의 [[virtual deadline]] 공식에도 weight가 들어간다.\n\n$$VD = t_{now} + \\frac{slice_i}{weight_i}$$\n\nweight가 크면 VD가 '''이르다''' → 먼저 선택된다. CFS와 방향이 일관된다.\n\n[[sim:cfs_eevdf]]\n\n== 관련 문서 ==\n* [[nice]] · [[vruntime]] · [[CFS]] · [[sched_latency]]\n* [[virtual deadline]] · [[EEVDF]]\n* [[tickets]] · [[stride]] — 다른 fair-share 알고리즘의 대응물"
 },
 "sched_latency": {
  "title": "sched_latency",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''sched_latency'''는 [[CFS]]의 제어 파라미터로, '''한 [[프로세스]]가 전환을 고려하기 전까지 얼마나 돌아야 하는지'''를 정하는 기준값이다. CFS는 고정 [[time slice]]를 쓰지 않는 대신 이 값을 프로세스 수로 나눠 슬라이스를 '''동적으로''' 계산한다.\n\n$$\\text{time slice} = \\frac{sched\\_latency}{n}$$\n\n{def}\n* '''sched_latency''' is used to determine how long one process should run before considering a switch\n* CFS uses sched_latency to decide a time slice '''dynamically''' — a time slice is decided by dividing sched_latency by the number ('''n''') of processes running on the CPU\n* '''Over this period of time (sched_latency), CFS is completely fair'''\n* Example: sched_latency = 48 ms, n = 4 (with same priority) → a time slice is '''12 ms'''\n{/def}\n\n{analogy}'''수업 시간 하나를 조별 발표로 나누는 것'''과 같다. 48분짜리 한 교시(sched_latency)를 조 수로 나눠서 배정한다. 4개 조면 12분씩, 2개 조면 24분씩. '''한 교시 안에 모든 조가 반드시 한 번씩 발표한다'''는 게 보장이고, 이게 \"over this period, CFS is completely fair\"의 의미다. 조가 10개가 되면 4.8분씩이라 발표 준비하다 끝나므로, 최소 시간([[min_granularity]])을 두게 된다.{/analogy}\n\n[[img:L6-33.png|sched_latency 48ms. n=4면 12ms씩, C·D가 끝나 n=2가 되면 24ms로 자동 확대|large]]\n\n<pre class=\"txt\">\n sched_latency = 48ms\n\n n = 4  →  48 / 4  = '''12ms'''   A B C D | A B C D | ...\n n = 2  →  48 / 2  = '''24ms'''   A  B  |  A  B  |  ...    (C, D 종료 후)\n n = 10 →  48 / 10 = 4.8ms  →  [[min_granularity]] 6ms로 '''올림'''\n<\/pre>\n\n'''프로세스가 줄면 슬라이스가 늘어난다'''는 것이 동적 슬라이스의 핵심이다. [[Round Robin]]처럼 \"무조건 10ms\"로 고정하면 프로세스가 2개일 때 불필요하게 자주 [[컨텍스트 스위치]]한다.\n\n== 우선순위가 다를 때 ==\n\nnice가 모두 같으면 $sched\\_latency / n$이지만, 다르면 [[weight]] 비율로 나눈다.\n\n$$slice_i = \\frac{weight_i}{\\sum_j weight_j} \\times sched\\_latency$$\n\n== EEVDF에서 ==\n\n[[EEVDF]]도 slice를 \"CFS처럼\" 계산한 뒤 '''latency_nice'''로 추가 조정한다. 예: sched_latency 48ms, n = 4 → 기본 12ms, latency_nice = −10이면 '''6ms'''로 축소. 이 slice가 [[virtual deadline]] 공식에 들어간다.\n\n[[sim:cfs_eevdf]]\n\n== 관련 문서 ==\n* [[CFS]] · [[min_granularity]] · [[time slice]] · [[weight]] · [[nice]]\n* [[EEVDF]] · [[virtual deadline]]\n* [[비례 지분 스케줄링]]"
 },
 "min_granularity": {
  "title": "min_granularity",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''min_granularity'''는 [[CFS]]가 [[time slice]]에 두는 '''하한선'''이다. [[sched_latency]]를 프로세스 수로 나눈 값이 이보다 작아지면 min_granularity로 '''올림'''한다. 리눅스 기본값은 '''6ms'''.\n\n{def}\n'''min_granularity''' specifies the '''minimum length of a time slice'''. CFS will '''never set the time slice to less than min_granularity'''.\n* Typically, min_granularity is '''6 ms''' in Linux\n* Example: sched_latency = 48ms, n = 10 → 4.8ms → '''set to 6ms'''\n* CFS won't be perfectly fair over sched_latency of 48 ms, '''but it will be close while still achieving high CPU efficiency'''\n{/def}\n\n{analogy}'''최소 주문 금액'''이다. 배달 앱에서 1,000원짜리 하나만 시킬 수 없는 이유는 배달비(= [[컨텍스트 스위치]] 비용)가 음식값보다 커지기 때문이다. 슬라이스가 4.8ms인데 전환에 1μs씩 든다면 그나마 괜찮지만, 프로세스가 수백 개가 되면 슬라이스가 마이크로초 단위로 떨어져 '''전환하느라 일을 못 하는''' 상태가 된다. min_granularity는 \"이 밑으로는 안 받는다\"는 선이다.{/analogy}\n\n<pre class=\"txt\">\n sched_latency = 48ms, min_granularity = 6ms\n\n n =  4 → 48/4  = 12ms   ≥ 6ms  →  '''12ms''' 그대로\n n =  6 → 48/6  =  8ms   ≥ 6ms  →  '''8ms''' 그대로\n n =  8 → 48/8  =  6ms   = 6ms  →  '''6ms'''\n n = 10 → 48/10 = 4.8ms  < 6ms  →  '''6ms'''로 올림\n n = 12 → 48/12 =  4ms   < 6ms  →  '''6ms'''로 올림\n<\/pre>\n\n== 공정성을 조금 포기한다 ==\n\n{exam}n = 10에서 슬라이스가 6ms면 한 바퀴에 '''60ms'''가 걸린다. sched_latency는 48ms인데 말이다. 즉 '''48ms 안에서 완전히 공정하다는 보장이 깨진다'''.\n\n이게 의도된 trade-off다. 슬라이드 원문: \"CFS won't be perfectly fair over sched_latency of 48 ms, '''but it will be close while still achieving high CPU efficiency'''.\"\n\n시험에 \"n = 12일 때 time slice는? sched_latency 안에서 완전히 공정한가?\"로 나오면 → '''6ms(올림됨) / 아니다(12 × 6 = 72ms > 48ms)'''라고 답해야 만점이다.{/exam}\n\n5강 [[time slice]] 문서의 trade-off를 그대로 이어받은 파라미터다 — 짧은 슬라이스는 [[response time]]에 좋지만 switching 비용이 전체를 지배한다.\n\n[[sim:cfs_eevdf]]\n\n== 관련 문서 ==\n* [[sched_latency]] · [[CFS]] · [[time slice]] · [[컨텍스트 스위치]]\n* [[vruntime]] · [[비례 지분 스케줄링]]"
 },
 "EEVDF": {
  "title": "EEVDF (Earliest Eligible Virtual Deadline First)",
  "category": [
   "6강 Proportional Share",
   "정책"
  ],
  "body": "'''EEVDF'''(Earliest Eligible Virtual Deadline First)는 리눅스 '''6.6(2023년 10월)'''부터 [[CFS]]의 코어를 대체한 [[비례 지분 스케줄링]] 알고리즘이다. 원 논문은 1995년(Stoica & Abdel-Wahab)이라 CFS와 달리 '''수학적으로 증명된''' 공정성 한계를 갖는다.\n\n{def}\n'''Rules''': Schedule a process with '''lag > 0''' and '''earliest VD'''.\n{/def}\n\n이름 자체가 규칙이다 — '''E'''arliest '''E'''ligible '''V'''irtual '''D'''eadline '''F'''irst: '''자격 있는(eligible)''' 것들 중에서 '''가상 마감(virtual deadline)이 가장 이른''' 것을 먼저.\n\n{analogy}'''병원 예약 시스템'''이다. [[lag]]은 \"이 환자가 아직 못 받은 진료 시간\"이다. 이미 제 몫 이상 진료받은 사람(lag ≤ 0)은 '''대기 명단에서 아예 빠진다'''(not eligible). 남은 사람들 중에서는 '''예약 마감 시각([[virtual deadline]])이 가장 이른''' 사람을 부른다. [[CFS]]가 \"제일 적게 진료받은 사람\"만 봤다면, EEVDF는 '''자격(누가 받을 권리가 있나) + 순서(누가 급한가)'''를 분리해서 본다.{/analogy}\n\n== CFS를 왜 갈아엎었나 ==\n\n{def}\n'''Limitation of CFS'''\n* '''Cannot reflect the latency requirements (latency-nice)'''\n* Long evolution introduced a lot of '''heuristics''' — e.g.) interactive bonus, wakeup replacement\n** '''No theoretical foundation'''\n** More complex, Less predictable\n{/def}\n\n[[nice]]는 CPU의 '''양'''만 정한다. \"이 프로세스는 CPU를 조금만 쓰되 '''아주 빨리''' 반응해야 한다\"(오디오 스트림, 게임 입력 처리 등)를 표현할 방법이 없었다. EEVDF는 '''latency_nice'''를 도입해 '''양(weight)'''과 '''반응 속도(slice)'''를 분리했다.\n\n== 두 축: lag와 virtual deadline ==\n\n=== lag — 자격(eligibility) ===\n\n{def}\n'''Lag''': Difference between '''allocated''' vs. '''received''' CPU time\n* '''lag > 0''' : owes service → the process is '''\"eligible\"'''\n* '''lag < 0''' : already got more service\n* '''Negative lag is decayed during sleep but not increased above 0'''\n{/def}\n\n=== virtual deadline — 순서 ===\n\n$$VD = t_{now} + \\frac{slice_i}{weight_i}$$\n\n* $t_{now}$ = 그 프로세스의 '''eligible 시각''' (lag = 0이 되는 시점)\n* $slice_i$ = [[sched_latency]] / n 으로 계산한 뒤 '''latency_nice'''로 조정. 예: 48ms, n=4 → 12ms, latency_nice −10 → '''6ms'''\n* slice가 짧거나 [[weight]]가 크면 VD가 '''이르다''' → 먼저 선택\n\n<pre class=\"ascii\">\n EEVDF 선택 과정\n ┌──────────────────────────────────────────────┐\n │ 전체 runnable 프로세스                        │\n │   ├─ P1  lag = +3   VD = 25   ✔ eligible     │\n │   ├─ P2  lag = −1   VD = 18   ✗ 자격 없음    │ ← lag ≤ 0 이면 탈락\n │   ├─ P3  lag = +7   VD = 21   ✔ eligible     │\n │   └─ P4  lag =  0   VD = 12   ✗ 자격 없음    │ ← lag > 0 이어야 한다\n └──────────────────────────────────────────────┘\n   eligible = {P1(VD 25), P3(VD 21)}  →  '''VD 최소인 P3 실행'''\n<\/pre>\n\n{exam}'''모의 퀴즈 A13에서 틀린 문장.''' \"EEVDF schedules a process whose lag is greater than 0 and whose virtual deadline is the earliest.\" → '''참'''이다.\n\n[[CFS]]와 나란히 놓고 외울 것.\n\n{|\n! || 선택 조건 || 개수\n|-\n| '''[[CFS]]''' || [[vruntime]] 최소 || 조건 '''1개'''\n|-\n| '''EEVDF''' || ① [[lag]] > 0 (자격) ② [[virtual deadline]] 최소 (순서) || 조건 '''2개'''\n|}\n\nVD가 아무리 일러도 lag ≤ 0이면 '''후보에서 빠진다'''는 게 핵심이다. 순서가 반대가 아니다.{/exam}\n\n== CFS 대비 개선점 ==\n\n{def}\n'''Improvement over CFS'''\n* '''Explicit Latency Control''' (latency_nice)\n* '''Predictable Fairness''' — Tight lag bound is '''mathematically proven'''\n* '''Better tail latency'''\n{/def}\n\n{info}[[CFS]]가 \"오래 자다 깬 프로세스가 CPU를 독점한다\"는 문제를 min_vruntime 재설정이라는 '''휴리스틱'''으로 막았다면, EEVDF는 '''\"negative lag is decayed during sleep but not increased above 0\"'''이라는 규칙으로 '''원천 차단'''한다. 자고 일어났다고 밀린 몫을 몰아 받을 수가 없다. 휴리스틱 대신 이론이라는 게 이 교체의 요점이다.{/info}\n\n[[sim:cfs_eevdf]]\n\n== 관련 문서 ==\n* [[lag]] · [[virtual deadline]] · [[weight]] · [[sched_latency]]\n* [[CFS]] · [[vruntime]] · [[nice]]\n* [[비례 지분 스케줄링]] · [[자주 틀리는 함정 모음]]"
 },

  "category": [

   "용어"
  ],
  "body": "'''lag'''은 [[EEVDF]]에서 한 [[프로세스]]가 '''받았어야 할 CPU 시간 − 실제로 받은 CPU 시간'''이다. 이 값의 부호 하나가 그 프로세스가 스케줄 후보가 될 '''자격(eligibility)'''을 결정한다.\n\n$$lag_i = (\\text{allocated CPU time})_i - (\\text{received CPU time})_i$$\n\n{def}\n'''Lag''': Difference between '''allocated''' vs. '''received''' CPU time\n* '''lag > 0''' : '''owes service''' (시스템이 이 프로세스에 빚졌다) → the process is '''\"eligible\"'''\n* '''lag < 0''' : '''already got more service''' (이미 제 몫보다 많이 받았다)\n* '''Negative lag is decayed during sleep but not increased above 0'''\n{/def}\n\n{analogy}'''적금 미납액'''이다. 매달 10만 원씩 넣기로 약속했는데(allocated) 실제로 8만 원만 냈다면 lag = +2만 원, '''아직 낼 게 남았다''' = 창구에 설 자격이 있다. 반대로 12만 원을 냈으면 lag = −2만 원, '''이미 더 냈으니''' 이번 차례는 건너뛴다. 중요한 건 마지막 줄 — '''초과 납입분(음수 lag)은 시간이 지나면 사라지지만, 미납액으로 바뀌지는 않는다'''. 몇 달을 쉬었다고 해서 한 번에 몰아 받을 수는 없다는 뜻이다.{/analogy}\n\n== 부호가 뜻하는 것 ==\n\n<pre class=\"ascii\">\n        lag > 0                      lag = 0                   lag < 0\n ┌──────────────────┐        ┌──────────────────┐      ┌──────────────────┐\n │ 받을 게 남았다   │        │ 정확히 제 몫     │      │ 이미 더 받았다   │\n │ = '''eligible ✔'''     │        │ = eligible 아님  │      │ = eligible 아님 ✗│\n │ 스케줄 후보      │        │ ([[virtual deadline|VD]]의 t_now) │      │ 다음 기회로      │\n └──────────────────┘        └──────────────────┘      └──────────────────┘\n<\/pre>\n\n* lag = 0이 되는 시점이 곧 [[virtual deadline]] 공식의 $t_{now}$다. \"이 프로세스가 자격을 얻는 시각\"이라는 뜻.\n* 시스템 전체의 lag 합은 이론적으로 0이다 — 누군가 더 받으면 누군가는 덜 받는다.\n\n== 자는 동안의 규칙이 핵심 ==\n\n{exam}'''\"Negative lag is decayed during sleep but not increased above 0.\"''' 이 한 줄이 [[CFS]]의 가장 큰 결함을 구조적으로 고친다.\n\n[[CFS]]에서는 프로세스가 10초 동안 자면 [[vruntime]]이 멈춰 남들보다 10초 뒤처지고, 깨어나면 '''다음 10초를 독점'''해 다른 job을 굶긴다. 그래서 \"깬 job의 vruntime을 min_vruntime으로 재설정\"이라는 '''휴리스틱'''을 덧붙여야 했다.\n\nEEVDF는 lag이 '''0 위로 올라가지 않으므로''' 자고 일어났다고 밀린 몫이 쌓이지 않는다. 휴리스틱 없이 규칙 자체로 막는다 — 이게 \"Tight lag bound is '''mathematically proven'''\"의 실질적 의미다.{/exam}\n\n== EEVDF 규칙에서의 위치 ==\n\n<pre class=\"txt\">\n EEVDF: Schedule a process with '''lag > 0''' and '''earliest VD'''\n                                 ↑ 1단계: 자격 필터    ↑ 2단계: 순서 결정\n<\/pre>\n\nlag은 '''후보를 걸러내는 필터'''이고, [[virtual deadline]]은 '''걸러진 후보들 사이의 순서'''를 정한다. VD가 아무리 일러도 lag ≤ 0이면 실행되지 않는다.\n\n[[sim:cfs_eevdf]]\n\n== 관련 문서 ==\n* [[EEVDF]] · [[virtual deadline]] · [[weight]]\n* [[CFS]] · [[vruntime]] — lag이 고쳐 준 문제의 원인\n* [[fairness]] · [[비례 지분 스케줄링]]"
 },
 "virtual deadline": {
  "title": "virtual deadline (VD)",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''virtual deadline'''(VD)은 [[EEVDF]]에서 '''자격([[lag]] > 0)을 갖춘 프로세스들 사이의 실행 순서'''를 정하는 값이다. VD가 가장 이른 프로세스가 실행된다.\n\n$$VD = t_{now} + \\frac{slice_i}{weight_i}$$\n\n{def}\n'''Virtual Deadline (VD)'''\n* $VD = t_{now} + slice_i / weight_i$\n* $t_{now}$ : '''Eligible time''' of the process (i.e. when '''lag = 0''')\n\n'''Slice'''\n* Calculated similarly to CFS\n* '''+) Adjusted by latency_nice'''\n* Example: sched_latency = 48 ms, latency_nice = −10, n = 4 (with same priority) → default time slice is 12 ms, but latency nice reduces it to '''6 ms'''\n{/def}\n\n{analogy}'''과제 마감일'''이다. 각 프로세스에게 \"너는 이 시각까지는 네 몫을 받아야 한다\"는 가상의 마감을 걸어 두고, 스케줄러는 '''마감이 제일 급한 사람부터''' 처리한다. 실시간 스케줄링의 EDF(Earliest Deadline First)를 가상 시간 위로 옮겨 놓은 것이다. 마감이 이르다 = 급하다 = 먼저 처리, 라는 직관이 그대로 통한다.{/analogy}\n\n== 공식 읽는 법 ==\n\n<pre class=\"txt\">\n VD = t_now + slice / weight\n      ─┬───   ──┬──   ──┬───\n       │        │       └─ weight가 '''크면''' 분수가 작다 → VD가 이르다 → 먼저 실행\n       │        └───────── slice가 '''짧으면''' 분수가 작다 → VD가 이르다 → 먼저 실행\n       └────────────────── lag = 0 이 되는 시점 (= eligible 해지는 순간)\n<\/pre>\n\n여기서 두 축이 '''분리'''되는 게 EEVDF의 설계 요점이다.\n\n{|\n! 조절 손잡이 || 무엇을 정하나 || 값\n|-\n| '''[[weight]]''' ([[nice]]에서 옴) || CPU의 '''양''' (몇 %를 받나) || nice −20 ~ +19\n|-\n| '''slice''' (latency_nice에서 옴) || '''반응 속도''' (얼마나 자주 짧게 도나) || latency_nice\n|}\n\n[[CFS]]에서는 [[nice]] 하나가 둘 다를 결정해서, \"CPU는 조금만 쓰되 아주 빨리 반응해야 하는\" 프로세스(오디오, 게임 입력)를 표현할 수 없었다. EEVDF는 slice를 따로 줄여 VD를 앞당김으로써 '''양은 그대로 두고 반응만 빠르게''' 만들 수 있다.\n\n== 계산 예 ==\n\n<pre class=\"txt\">\n sched_latency = 48ms, n = 4 (우선순위 동일) → 기본 slice = 12ms\n\n P1: latency_nice = 0,   slice = 12ms, weight = 1024, t_now = 0\n     VD = 0 + 12/1024 = 0.0117 (가상 단위)\n P2: latency_nice = −10, slice = '''6ms''',  weight = 1024, t_now = 0\n     VD = 0 + 6/1024  = 0.0059   ← '''더 이르다 → P2 먼저'''\n<\/pre>\n\n같은 [[weight]](= 같은 CPU 몫)인데도 latency_nice가 낮은 P2가 먼저 실행된다. 대신 slice가 짧으니 금방 내려오고, 전체 CPU 점유율은 P1과 같게 유지된다.\n\n{exam}'''규칙 전체를 한 문장으로''': Schedule a process with '''lag > 0''' and '''earliest VD'''.\n1단계는 [[lag]]으로 '''자격 필터''', 2단계는 VD로 '''순서 결정'''. 순서를 바꿔 외우면 안 된다 — VD가 아무리 일러도 lag ≤ 0이면 실행되지 않는다.{/exam}\n\n[[sim:cfs_eevdf]]\n\n== 관련 문서 ==\n* [[EEVDF]] · [[lag]] · [[weight]] · [[sched_latency]]\n* [[CFS]] · [[vruntime]] · [[nice]]\n* [[비례 지분 스케줄링]]"
 },
 "레드블랙 트리": {
  "title": "레드블랙 트리 (Red-Black Tree)",
  "category": [
   "6강 Proportional Share",
   "용어"
  ],
  "body": "'''레드블랙 트리'''(red-black tree)는 [[CFS]]가 실행 가능한 [[프로세스]]들을 담아 두는 '''균형 이진 탐색 트리'''다. 키는 [[vruntime]]이며, 덕분에 \"다음에 실행할 프로세스 찾기\"가 '''O(1)''', \"되돌려 넣기\"가 '''O(log n)'''이 된다.\n\n{def}\n* The scheduler should find the next job to run '''as quickly as possible'''\n* Simple data structures (lists) '''do not scale''', with '''O(n)''' complexity\n* CFS uses a '''red-black tree''', one of many types of balanced trees\n** '''Runnable processes only''' are kept in the red-black tree — '''no sleeping processes''' (e.g., waiting for I/Os or network packets)\n** Use '''vruntime as a key''' for the tree\n** Ensure '''O(log n)''' complexity\n{/def}\n\n{analogy}'''자동으로 줄이 정렬되는 대기실'''이다. 손님이 들어오면 자기 번호([[vruntime]])에 맞는 자리에 알아서 끼워지고, 직원은 '''항상 맨 왼쪽 사람만''' 부르면 된다. 리스트라면 매번 처음부터 끝까지 훑어 최솟값을 찾아야 하지만(O(n)), 이 대기실은 구조 자체가 정렬을 유지하므로 왼쪽 끝만 보면 된다. 대신 새 손님을 끼워 넣을 때 줄을 조금 재배치하는 비용(O(log n))이 든다.{/analogy}\n\n[[img:L6-38.png|vruntime 1, 5, 9, 10, 14, 17, 18, 21, 22, 24를 담은 레드블랙 트리. 루트는 14|medium]]\n\n<pre class=\"ascii\">\n                        14\n                   ┌─────┴─────┐\n                  (9)          (18)\n                ┌──┴──┐      ┌──┴──┐\n                1     10     17    22\n                 └┐              ┌─┴─┐\n                 (5)            (21) (24)\n\n  ( ) = 빨강 노드,  나머지 = 검정 노드\n  가장 왼쪽 = vruntime 1 = '''다음에 실행할 프로세스'''\n<\/pre>\n\n== 복잡도 ==\n\n{|\n! 연산 || 복잡도 || 방법\n|-\n| 다음 job 찾기 || '''O(1)''' || 가장 왼쪽 노드 (leftmost 포인터를 캐시해 둔다)\n|-\n| 실행 후 되돌려 넣기 (삽입) || '''O(log n)''' || 갱신된 vruntime 위치에 삽입 + 균형 재조정\n|-\n| ([[Lottery 스케줄링]]의 리스트 순회) || O(n) || 누적합이 winner를 넘을 때까지 순회\n|}\n\n{exam}슬라이드는 \"Finding the next job to run in the tree requires '''O(1)'''\"이라고 쓰고, 바로 앞 장에서는 트리가 \"'''O(log n)''' complexity를 보장한다\"고 쓴다. 모순이 아니다.\n* '''찾기'''는 leftmost를 따로 캐시해 두므로 O(1)\n* '''삽입/삭제'''(균형 유지)가 O(log n)\n* 트리 전체의 성격을 말할 때는 O(log n)\n\n출제되면 '''\"최소 찾기 O(1), 삽입 O(log n)\"'''으로 나눠 쓰는 게 안전하다.{/exam}\n\n== 자는 프로세스는 없다 ==\n\n{warn}'''runnable 프로세스만 트리에 있다.''' I/O나 네트워크 패킷을 기다리는 프로세스는 트리에서 '''빠져 있다'''. 그래서 n이 작게 유지되고, [[sched_latency]] / n 계산의 n도 \"CPU에서 도는 프로세스 수\"다.\n\n깨어나면 다시 삽입되는데, 이때 [[vruntime]]을 그대로 쓰면 너무 작아서 CPU를 독점한다 → '''트리의 최솟값(min_vruntime)으로 맞춰서''' 삽입한다. [[CFS]]의 starvation 해법이 바로 이 지점이다.{/warn}\n\n== 왜 자료구조가 스케줄러의 문제인가 ==\n\n슬라이드 p.29: '''\"scheduling uses about 5% of overall datacenter CPU time!\"''' 스케줄러 자체가 쓰는 CPU를 줄이는 게 현대 스케줄러 설계의 핵심 목표 중 하나다. [[Lottery 스케줄링]]의 O(n) 리스트를 O(log n) 트리로 바꾼 것이 [[CFS]]의 \"highly efficient and scalable\"의 실체다.\n\n[[sim:cfs_eevdf]]\n\n== 관련 문서 ==\n* [[CFS]] · [[vruntime]] · [[sched_latency]]\n* [[Lottery 스케줄링]] — O(n) 리스트와의 대비\n* [[비례 지분 스케줄링]]"
 },
 "멀티프로세서 스케줄링": {
  "title": "멀티프로세서 스케줄링 (Multiprocessor Scheduling)",
  "category": [
   "7강 Multi-CPU Scheduling",
   "핵심"
  ],
  "body": "'''멀티프로세서 스케줄링'''은 CPU(코어)가 여러 개일 때 \"'''작업들을 어느 CPU에 배치할 것인가'''\"를 정하는 문제다. 5·6강의 모든 [[스케줄링]] 정책은 CPU가 하나라는 전제 위에 있었고, 7강은 그 전제를 깬다.\n\n{def}\n* The rise of the '''multicore processor''' is the motivation of multiprocessor-scheduling\n* '''Adding more CPUs does not make that an application runs faster''' → You have to '''rewrite an application to run in parallel using threads'''\n* Once an application is optimized with multiple jobs that run in parallel, the next issue is '''assigning the jobs on multi-core CPUs''' → Multiprocessor scheduling\n{/def}\n\n{warn}이 강의의 '''앞 14쪽은 6강 복습'''이다([[비례 지분 스케줄링]], [[CFS]], [[EEVDF]]). 본론은 p.15부터다. 대신 p.3에서 [[fairness|공정성 지표]]의 기호가 '''F → U (unfairness metric)'''로 바뀌어 있으니 주의할 것. 정의는 동일하다.{/warn}\n\n{analogy}'''식당에 주방을 하나 더 짓는 것'''과 같다. 주방이 둘이 됐다고 손님이 저절로 두 배 빨리 먹는 게 아니다. 요리를 나눌 수 있게 레시피를 다시 짜야 하고(병렬 프로그래밍), 어느 주문을 어느 주방에 보낼지 정해야 하며(스케줄링), 두 주방이 같은 냉장고를 쓰면 재료가 엇갈린다([[캐시 일관성]], 동기화). 게다가 한 요리사가 계속 쓰던 조리대에 재료가 준비돼 있으니 자꾸 주방을 바꾸면 손해다([[cache affinity]]).{/analogy}\n\n== 하드웨어 배경 ==\n\n=== 멀티코어와 하드웨어 스레드 ===\n\n{def}\n* Recent trend to place '''multiple processor cores on same physical chip''' — Faster and consumes less power\n* The number of '''threads per core''' is also growing — Takes advantage of '''memory stall''' to make progress on another thread while memory retrieve happens. e.g., Intel's '''Hyper Threading'''\n* (* CPU threads differ from SW threads)\n{/def}\n\n자세한 용어 구분은 [[멀티코어]] 문서를 보라. 한 줄로: '''Socket ⊃ Core ⊃ Hardware thread'''이고, OS가 스케줄링 대상으로 보는 \"CPU\"는 '''하드웨어 스레드(논리 프로세서)'''다.\n\n=== Concurrency vs. Parallelism ===\n\n{|\n! || 정의 || CPU 개수\n|-\n| '''Concurrency''' (동시성) || 여러 task가 '''진행 중(making progress)''' || CPU '''1개로도 가능''' — 스케줄러가 번갈아 돌림\n|-\n| '''Parallelism''' (병렬성) || 시스템이 여러 task를 '''실제로 동시에(simultaneously)''' 수행 || CPU '''2개 이상 필요'''\n|}\n\n{exam}단골 개념 문제다. '''\"병렬이면 동시적이지만, 동시적이라고 병렬은 아니다.\"''' 동시성은 스케줄러가 만들어 내는 '''구조/착각'''이고, 병렬성은 '''물리적 사실'''이다. → [[동시성]]{/exam}\n\n병렬성의 종류도 함께 나온다.\n* '''Data parallelism''': 데이터를 쪼개 코어마다 나눠 주고 '''같은 연산'''. 예: 배열을 N등분해 부분합.\n* '''Task parallelism''': 작업을 쪼개 코어마다 '''다른 연산'''. 예: 같은 배열에 코어1은 평균, 코어2는 분산.\n* '''Hybrid parallelism''': 둘의 혼합.\n* 구분 팁: '''\"뭘 나눴나?\"''' — 데이터면 data, 하는 일이면 task.\n\n=== Amdahl의 법칙 ===\n\n[[img:L7-21.png|Amdahl의 법칙. S는 직렬 부분, N은 코어 수|medium]]\n\n$$speedup \\le \\frac{1}{S + \\frac{1-S}{N}}$$\n\n75% 병렬 / 25% 직렬인 프로그램을 코어 1 → 2로 늘리면 '''1.6배'''(2배가 아니다). $N \\to \\infty$이면 speedup은 '''1/S'''에 수렴한다. 자세한 계산은 [[Amdahl의 법칙]] 문서.\n\n== 캐시 ==\n\n=== 단일 CPU의 캐시 복습 ===\n\n멀티프로세서의 어려움은 전부 '''캐시'''에서 나온다.\n\n* '''Cache''': 작고 빠른 메모리. 메인 메모리의 '''인기 있는 데이터 복사본'''을 보관. '''temporal locality'''(방금 쓴 건 또 쓴다) + '''spatial locality'''(근처 주소도 곧 쓴다)를 활용.\n* '''Main Memory''': 모든 데이터를 갖지만 느리다.\n* 캐시 덕에 '''느린 메모리가 빠른 것처럼 보인다'''.\n\n=== 캐시 일관성 ===\n\n[[img:L7-27.png|CPU0이 캐시에서 D를 D′으로 바꿨는데, CPU1은 메모리의 옛 값 D를 읽는다|large]]\n\nCPU가 둘이고 각자 캐시를 가지면 같은 주소의 복사본이 여러 곳에 생긴다. CPU0이 자기 캐시에서 $D \\to D'$으로 고쳤는데 메모리에는 아직 $D$가 있고, 그 상태에서 프로세스가 CPU1로 옮겨 가 같은 주소를 읽으면 '''옛 값 $D$를 읽는다'''. 해법은 '''bus snooping'''. 자세한 것은 [[캐시 일관성]].\n\n=== 동기화는 별개 문제 ===\n\n하드웨어가 [[캐시 일관성]]을 지켜 줘도, 여러 CPU가 공유 데이터에 동시에 접근하면 '''[[mutual exclusion]]'''이 필요하다.\n\n<pre class=\"c\">\n1   typedef struct __Node_t {\n2       int value;\n3       struct __Node_t *next;\n4   } Node_t;\n5\n6   int List_Pop() {\n7       Node_t *tmp = head;          // remember old head ...\n8       int value = head->value;     // ... and its value\n9       head = head->next;           // advance head to next pointer\n10      free(tmp);                   // free old head\n11      return value;                // return value at head\n12  }\n<\/pre>\n\n두 CPU가 이 코드를 '''동시에''' 실행하면 둘 다 같은 `head`를 `tmp`에 담고 둘 다 `free(tmp)`를 호출해 '''double free'''가 난다. 해법은 [[락]]이다.\n\n<pre class=\"c\">\n1   pthread_mutex_t m;\n...\n7   int List_Pop() {\n8       lock(&m)\n9       Node_t *tmp = head;\n10      int value = head->value;\n11      head = head->next;\n12      free(tmp);\n13      unlock(&m)\n14      return value;\n15  }\n<\/pre>\n\n{warn}'''캐시 일관성은 \"값이 최신인가\"만 보장한다.''' 명령어들이 CPU 사이에서 섞이는 것([[race condition]])은 막아 주지 못한다. 그건 [[락]]으로 [[critical section]]을 감싸야 해결된다. 그리고 락은 '''CPU가 많을수록 경합이 심해져 느려진다''' — 이게 바로 다음 절 [[SQMS]]의 약점으로 이어진다.{/warn}\n\n=== cache affinity ===\n\n[[img:L7-31.png|① A가 CPU0에서 D 접근(Hit) → ② context switch로 CPU1로 이동 → ③ CPU1 캐시엔 D가 없어 Miss|large]]\n\n{def}\n'''Cache Affinity''': '''Keep a process on the same CPU if possible'''\n* A process '''builds up a fair bit of state''' in the cache of a CPU\n* The next time the process runs, it will run '''faster''' if some of its state is '''already present''' in the cache on that CPU\n{/def}\n\n프로세스를 다른 CPU로 옮기면 쌓아 둔 캐시(그리고 TLB) 상태를 전부 잃는다. 그래서 멀티프로세서 스케줄러는 반드시 '''친화도를 고려'''해야 한다. → [[cache affinity]]\n\n== 두 가지 구조: SQMS vs MQMS ==\n\n큐를 '''하나'''만 둘지 '''CPU마다''' 둘지가 갈림길이다.\n\n=== SQMS (Single Queue Multiprocessor Scheduling) ===\n\n[[img:L7-34.png|작업 A~E 5개, CPU 4개. 각 job이 매 슬라이스마다 다른 CPU로 튕겨 다닌다|large]]\n\n모든 job을 '''하나의 큐'''에 넣고 각 CPU가 전역 공유 큐에서 다음 job을 꺼내 간다.\n\n* '''장점''': 단순하고 구현이 쉽다 (단일 CPU 스케줄러를 거의 그대로 재사용).\n* '''약점 1 — 확장성''': 큐 하나를 여러 CPU가 건드리니 '''락이 필요'''하고, CPU 수가 늘수록 락 경합이 시간을 잡아먹는다.\n* '''약점 2 — [[cache affinity]] 상실''': 위 그림처럼 '''모든 job이 매 슬라이스마다 다른 CPU로 튕겨 다닌다'''.\n* '''보완''': 친화도 메커니즘을 추가해 '''대부분은 고정하고 일부(E)만 CPU를 돌아다니게''' 한다.\n\n자세한 것은 [[SQMS]].\n\n=== MQMS (Multi-Queue Multiprocessor Scheduling) ===\n\n[[img:L7-38.png|C가 끝나면 A가 B·D보다 CPU를 2배 받고, A까지 끝나면 CPU0이 아예 논다|large]]\n\n'''큐를 여러 개''' (보통 CPU당 하나) 두고, job이 들어오면 '''정확히 하나의 큐'''에 배치한다.\n\n* '''장점''': 큐마다 독립이라 '''락 경합 없음(확장성)''' + job이 한 CPU에 머무니 '''[[cache affinity]] 자연 보존'''.\n* '''약점 — [[로드 밸런싱|부하 불균형]]''': 위 그림처럼 한 CPU가 2배를 받거나 아예 논다.\n* '''해법''': '''migration(마이그레이션)''', 구현 기법은 '''[[work stealing]]'''.\n\n자세한 것은 [[MQMS]].\n\n=== 한 줄 대비 ===\n\n{|\n! || [[SQMS]] || [[MQMS]]\n|-\n| 큐 || 전역 1개 || CPU당 1개\n|-\n| 확장성 || '''나쁨''' (락 경합) || '''좋음'''\n|-\n| [[cache affinity]] || '''나쁨''' (튕겨 다님) || '''좋음''' (한 CPU에 머묾)\n|-\n| 공정성/부하 균형 || '''쉬움''' (큐가 하나니 자동) || '''어려움''' ([[로드 밸런싱]] 필요)\n|-\n| 보완책 || 친화도 메커니즘 || migration, [[work stealing]]\n|}\n\n{exam}'''이 표가 7강의 결론이다.''' 서술형으로 \"SQMS와 MQMS의 trade-off를 설명하라\"가 나오면 '''\"SQMS는 공정성이 쉽고 확장성·친화도가 나쁘다 / MQMS는 확장성·친화도가 좋고 균형 맞추기가 어렵다\"'''를 축으로 쓰고, 각각의 보완책(친화도 메커니즘 / work stealing)까지 붙이면 만점이다.{/exam}\n\n== 예상 문제 ==\n\n{quiz}\n'''(2025F 중간고사 Problem 2 형식)''' 다음 정의에 해당하는 용어를 영어로 쓰라.\n'''(a)''' 멀티프로세서에서 프로세스를 가능하면 같은 CPU에 계속 두려는 이유가 되는 성질. (Hint: C___ A___)\n'''(b)''' 같은 데이터의 복사본이 여러 캐시에 존재할 때 그것들이 일관되게 유지되어야 한다는 요구.\n'''(c)''' (b)를 해결하기 위해 각 캐시가 버스를 감시해 자기 복사본을 무효화하거나 갱신하는 기법.\n'''(d)''' 작업이 적은 큐가 다른 큐를 엿보고 작업을 가져오는 기법.\n{/quiz}\n\n{answer}\n'''(a)''' '''Cache affinity''' — 2025F 중간고사 Problem 2 d)에 힌트까지 그대로 출제됐다. 슬라이드 정의: \"A process builds up a fair bit of state in the cache of a CPU; the next time the process runs, it will run faster if some of its state is already present in the cache on that CPU.\"\n\n'''(b)''' '''Cache coherence''' — \"Consistency of shared resource data stored in multiple caches.\"\n\n'''(c)''' '''Bus snooping''' — \"Each cache pays attention to memory updates by observing the bus. When a CPU sees an update for a data item it holds in its cache, it will notice the change and either '''invalidate''' its copy or '''update''' it.\"\n\n'''(d)''' '''Work stealing''' — \"A source queue that is low on jobs occasionally peeks at another target queue; if the target queue is fuller, the source will steal one or more jobs.\"\n\n{tip}Problem 2는 '''슬라이드의 영어 정의 문장을 거의 그대로''' 주고 용어를 쓰게 한다. 단어 수 힌트가 붙는 경우가 많다. 각 용어의 영어 정의 한 문장을 통째로 외워 두면 역방향도 대비된다. → [[2025F 중간고사 족보]]{/tip}\n{/answer}\n\n{quiz}\n어떤 애플리케이션의 '''95%가 병렬화 가능'''하다. (a) 코어 4개일 때 speedup은? (b) 코어를 무한히 늘리면 speedup의 상한은? (c) 이 결과가 멀티프로세서 프로그래밍에 주는 교훈은?\n{/quiz}\n\n{answer}\n$S = 0.05$ (직렬 부분), $1 - S = 0.95$.\n\n'''(a)'''\n$$speedup \\le \\frac{1}{0.05 + \\frac{0.95}{4}} = \\frac{1}{0.05 + 0.2375} = \\frac{1}{0.2875} \\approx '''3.48배'''$$\n코어를 4배로 늘렸는데 3.48배밖에 못 얻는다.\n\n'''(b)''' $N \\to \\infty$이면 $(1-S)/N \\to 0$이므로\n$$speedup \\to \\frac{1}{S} = \\frac{1}{0.05} = '''20배'''$$\n슬라이드 그래프의 빨간 동그라미가 이 지점이다 — 95% 병렬 프로그램에 코어 '''2,048개'''를 넣어야 20배에 도달하고, 그 이상은 아무 소용이 없다.\n\n'''(c)''' '''직렬 부분이 성능에 불균형하게 큰 영향을 미친다.''' 코어를 더 붙이는 것만으로는 한계가 명확하므로 '''처음부터 병렬성을 염두에 두고 소프트웨어를 작성해야''' 한다. 슬라이드 결론 문장: \"Writing software with parallelism in mind!\" → [[Amdahl의 법칙]]\n{/answer}\n\n{quiz}\n[[MQMS]]에서 CPU 2개, Q0 = {A, C}, Q1 = {B, D}로 시작한다. C가 종료한 뒤 일어나는 일을 설명하고, 이어서 A까지 종료하면 어떻게 되는지 쓰라. 그리고 해결책은?\n{/quiz}\n\n{answer}\n'''C 종료 후''': Q0 = {A}, Q1 = {B, D}.\n<pre class=\"txt\">\n CPU0: A A A A A A A A A A A A ...\n CPU1: B B D D B B D D B B D D ...\n → A가 CPU0을 독차지하므로 '''A가 B, D보다 CPU를 2배''' 받는다. 공정성이 깨진다.\n<\/pre>\n\n'''A 종료 후''': Q0 = { } (비어 있음), Q1 = {B, D}.\n<pre class=\"txt\">\n CPU0: (idle)\n CPU1: B B D D B B D D ...\n → '''CPU0이 완전히 논다.''' 일은 남아 있는데 CPU 하나가 놀고 있다.\n<\/pre>\n\n'''원인''': 큐가 독립적이라 서로의 상황을 모른다. 이게 확장성([[cache affinity]] 보존)의 대가다. 이 현상의 이름이 '''load imbalance'''(부하 불균형)다.\n\n'''해결책''': job을 옮긴다 = '''migration(마이그레이션)'''. CPU0이 놀고 있으면 OS가 B나 D 중 하나를 Q0으로 옮긴다.\n\n단, 더 까다로운 경우도 있다. Q0 = {A}, Q1 = {B, D}처럼 job 3개를 CPU 2개에 공평하게 주려면 한 job을 '''계속 왔다 갔다''' 옮겨야 한다. 마이그레이션은 [[cache affinity]]를 잃는 비용이 있으므로 '''얼마나 자주, 누구를''' 옮길지가 정책 문제가 된다.\n\n구현 기법이 '''[[work stealing]]''' — 작업이 적은 큐가 다른 큐를 엿보고 훔쳐 온다. 임계값 정하기는 슬라이드 표현으로 '''\"black art\"'''다. → [[로드 밸런싱]]\n{/answer}\n\n== 시험 대비 핵심 요약 ==\n\n# '''Socket ⊃ Core ⊃ Hardware thread'''. OS가 스케줄링하는 단위는 논리 프로세서(= 하드웨어 스레드). Hyper-Threading은 '''memory stall''' 동안 다른 스레드를 돌려 코어 활용률을 올린다.\n# '''Concurrency''' = 여러 task가 진행 중 (CPU 1개도 가능) / '''Parallelism''' = 실제로 동시 수행 (CPU 2개 이상 필요).\n# '''Data parallelism'''(데이터를 쪼개 같은 연산) vs '''Task parallelism'''(연산을 쪼개 다른 일) vs Hybrid.\n# '''[[Amdahl의 법칙]]''': $speedup \\le 1/(S + (1-S)/N)$, $N \\to \\infty$이면 '''1/S'''. 75% 병렬 + 코어 2개 → '''1.6배'''.\n# '''[[캐시 일관성]]''' 문제: CPU0이 캐시에서 $D \\to D'$로 바꿨는데 CPU1은 메모리의 옛 $D$를 읽음 → 해법 '''bus snooping'''(하드웨어).\n# 일관성이 보장돼도 '''동기화는 별개''': 두 CPU가 동시에 `List_Pop` → double free → '''[[락]]''' 필요. 락은 CPU가 많을수록 느려진다.\n# '''[[cache affinity]]''': 같은 CPU에 두면 캐시(+TLB)에 쌓인 상태 덕에 빠르다. 옮기면 cache miss.\n# '''[[SQMS]]''': 단순. 약점 = '''락 때문에 확장성 없음''' + '''job이 CPU를 튕겨 다녀 친화도 상실'''. 보완 = 친화도 메커니즘(대부분 고정, 일부만 이동).\n# '''[[MQMS]]''': 확장성·친화도 좋음. 약점 = '''[[로드 밸런싱|부하 불균형]]'''(한 CPU가 2배를 받거나 아예 놂).\n# 불균형 해법 = '''migration'''. 구현 = '''[[work stealing]]'''(한가한 큐가 바쁜 큐를 엿보고 훔침). 임계값은 '''black art'''.\n# 한 줄 대비: SQMS는 '''공정성 쉬움 / 확장성·친화도 나쁨''', MQMS는 '''확장성·친화도 좋음 / 균형 어려움'''.\n\n== 관련 문서 ==\n* [[멀티코어]] · [[캐시 일관성]] · [[cache affinity]] · [[Amdahl의 법칙]]\n* [[SQMS]] · [[MQMS]] · [[로드 밸런싱]] · [[work stealing]]\n* [[락]] · [[mutual exclusion]] · [[race condition]] · [[critical section]] — 동기화가 필요한 이유\n* [[스케줄링]] · [[비례 지분 스케줄링]] — 단일 CPU 정책들\n* [[동시성]] · [[스레드]]\n* [[2025F 중간고사 족보]] · [[자주 틀리는 함정 모음]]"
 },
 "캐시 일관성": {
  "title": "캐시 일관성 (Cache Coherence)",
  "category": [
   "7강 Multi-CPU Scheduling",
   "용어"
  ],
  "body": "'''캐시 일관성'''(cache coherence)은 '''같은 데이터의 복사본이 여러 캐시에 존재할 때 그것들이 일관되게 유지되어야 한다'''는 요구다. CPU가 하나일 때는 존재하지 않던 문제로, 멀티프로세서의 모든 어려움이 여기서 시작한다.\n\n{def}\n'''Cache Coherence''': Consistency of shared resource data stored in '''multiple caches'''.\n{/def}\n\n{analogy}'''같은 구글 문서를 오프라인으로 받아 간 두 사람'''이다. A가 자기 노트북에서 3장을 고쳐 썼지만 아직 업로드하지 않았다. 그 사이 B가 서버에서 문서를 내려받으면 '''고치기 전 버전'''을 받는다. 서버의 값이 최신이 아니라는 게 문제의 본질이고, 해결책은 \"누군가 문서를 고치면 나머지 모두에게 '''네 사본은 폐기해'''라고 알리는 것\"이다. 그 알림을 하드웨어가 버스로 하는 게 '''bus snooping'''이다.{/analogy}\n\n== 문제가 생기는 과정 ==\n\n[[img:L7-27.png|2단계: CPU0이 D를 D′으로 수정(캐시에만). 3단계: CPU1이 같은 주소를 읽어 옛 값 D를 얻는다|large]]\n\n<pre class=\"ascii\">\n 0. 초기 상태 — 메모리 주소 1에 값 D\n      CPU 0            CPU 1\n    ┌───────┐        ┌───────┐\n    │ Cache │        │ Cache │\n    └───┬───┘        └───┬───┘\n        └──────┬─────────┘   Bus\n          ┌────┴────┐\n          │ D @ 주소1│  Memory\n          └─────────┘\n\n 1. CPU0이 주소 1을 읽음 → 자기 캐시에 D 복사\n      Cache(CPU0) = D\n\n 2. CPU0이 D를 '''D′으로 수정''' — 캐시에만 반영(write-back), 메모리는 아직 D\n    그 상태에서 프로세스가 '''CPU1로 스케줄'''됨\n      Cache(CPU0) = D′    Memory = D\n\n 3. CPU1이 같은 주소를 읽음 → 자기 캐시에 없으니 '''메모리에서''' 가져옴\n      Cache(CPU1) = D     ← ❌ '''옛 값!''' 올바른 값은 D′\n<\/pre>\n\n슬라이드의 빨간 글씨: \"'''CPU1 gets the old value $D$ instead of the correct value $D'$!'''\"\n\n== 해결: bus snooping ==\n\n{def}\n'''Bus snooping'''\n* Each cache '''pays attention to memory updates by observing the bus'''\n* When a CPU sees an update for a data item it holds in its cache, it will notice the change and either '''invalidate''' its copy '''or update''' it\n{/def}\n\n<pre class=\"ascii\">\n      CPU 0                      CPU 1\n    ┌───────┐                  ┌───────┐\n    │ D → D′│                  │  D    │\n    └───┬───┘                  └───┬───┘\n        │  \"주소1 갱신!\"            │ 👂 버스를 엿듣는 중\n        └──────────┬───────────────┘\n                   │  Bus\n            ┌──────┴──────┐\n            │   Memory    │\n            └─────────────┘\n   → CPU1의 캐시는 자기 사본을 '''invalidate''' 하거나 '''update''' 한다\n<\/pre>\n\n{info}'''이건 하드웨어가 해결해 주는 문제다.''' OS나 프로그래머가 신경 쓰지 않아도 캐시 컨트롤러가 알아서 처리한다. 그래서 슬라이드도 한 장으로 짧게 끝낸다. 하지만 '''바로 다음 장의 동기화는 다르다''' — 그건 소프트웨어의 책임이다.{/info}\n\n== 일관성 ≠ 동기화 ==\n\n{warn}'''가장 중요한 구분이다.'''\n* '''캐시 일관성'''이 보장하는 것: \"내가 읽는 값이 '''최신 값인가'''\" — 하드웨어(bus snooping)가 해결.\n* '''캐시 일관성이 보장하지 못하는 것''': \"두 CPU의 '''명령어 순서가 섞이는 것'''\" — [[락]]으로 [[critical section]]을 감싸야 해결.\n\n슬라이드 다음 장의 `List_Pop()` 예제가 정확히 이 차이를 보여 준다. 두 CPU가 같은 `head` 값을 읽는 것 자체는 '''일관성 위반이 아니다'''(둘 다 최신 값을 읽었다). 그런데 둘 다 그 값을 `free()` 하면 double free가 난다. 이건 [[race condition]]이고, [[mutual exclusion]]으로만 막을 수 있다.{/warn}\n\n<pre class=\"c\">\nint List_Pop() {\n    Node_t *tmp = head;        // 두 CPU가 같은 최신 head를 읽음 — 일관성은 OK\n    int value = head->value;\n    head = head->next;\n    free(tmp);                 // 둘 다 실행 → double free ❌\n    return value;\n}\n<\/pre>\n\n== 시험에서 ==\n\n{exam}2025F 중간고사 '''Problem 2(용어 단답형)'''는 슬라이드의 영어 정의를 그대로 주고 용어를 쓰게 한다. 이 주제에서 나올 수 있는 세 개를 영어 정의째로 외울 것.\n* '''Cache coherence''' — \"Consistency of shared resource data stored in multiple caches\"\n* '''Bus snooping''' — \"Each cache pays attention to memory updates by observing the bus\"\n* '''Cache affinity''' — Problem 2 d)에 실제로 출제됨 (Hint: C___ A___)\n→ [[2025F 중간고사 족보]]{/exam}\n\n== 관련 문서 ==\n* [[cache affinity]] · [[멀티프로세서 스케줄링]] · [[멀티코어]]\n* [[락]] · [[mutual exclusion]] · [[race condition]] · [[critical section]]\n* [[SQMS]] · [[MQMS]]"

 "cache affinity": {

  "body": "'''cache affinity'''(캐시 친화도)는 '''[[프로세스]]를 가능하면 같은 CPU에서 계속 실행하려는 성질'''이다. 프로세스가 그 CPU의 캐시에 쌓아 둔 상태를 재활용하기 위해서다. 7강에서 가장 중요한 단어이며, '''2025F 중간고사에 용어 단답형으로 실제 출제'''됐다.\n\n{def}\n'''Cache Affinity''': Keep a process '''on the same CPU if possible'''\n* A process '''builds up a fair bit of state''' in the cache of a CPU\n* The next time the process runs, it will run '''faster''' if some of its state is '''already present in the cache''' on that CPU\n{/def}\n\n{analogy}'''자기 자리에 공구를 늘어놓은 정비공'''이다. 3번 정비대에서 한참 작업한 사람은 필요한 렌치와 부품이 이미 손 닿는 곳에 있다(cache hit). 그런데 관리자가 \"이번엔 7번 정비대로 가라\"고 하면, 새 정비대에는 아무것도 준비돼 있지 않아 창고(메인 메모리)까지 갔다 와야 한다(cache miss). '''일 자체는 같은데 자리를 옮겼다는 이유만으로 느려진다.'''{/analogy}\n\n== 그림으로 ==\n\n[[img:L7-31.png|① A가 CPU0에서 D 접근(Hit) → ② context switch로 CPU1로 이동 → ③ CPU1 캐시엔 D가 없어 Miss|large]]\n\n<pre class=\"ascii\">\n ① 프로세스 A가 CPU0에서 실행, 데이터 D 접근\n    ┌─A─────────┐   ┌───────────┐\n    │  CPU 0    │   │  CPU 1    │\n    │ Cache: D  │   │ Cache:    │\n    └───────────┘   └───────────┘\n       ✔ '''Hit!'''\n\n ② [[컨텍스트 스위치]] 후 A가 CPU1로 이동\n\n ③ CPU1 캐시에는 D가 없다\n    ┌───────────┐   ┌─A─────────┐\n    │  CPU 0    │   │  CPU 1    │\n    │ Cache: D  │   │ Cache:    │\n    └───────────┘   └───────────┘\n                       ❌ '''Miss!''' → 메모리까지 갔다 와야 함 (느림)\n<\/pre>\n\n{info}잃는 것은 데이터 캐시만이 아니다. '''TLB에 쌓인 주소 변환 정보'''도 같은 이유로 무효가 된다. 그래서 CPU를 옮기는 비용은 단순한 [[컨텍스트 스위치]]보다 훨씬 크다.{/info}\n\n== 스케줄링 구조에 미치는 영향 ==\n\n{|\n! 구조 || cache affinity || 이유\n|-\n| '''[[SQMS]]''' || '''나쁨''' || 각 CPU가 전역 큐에서 아무 job이나 꺼내 가므로 job이 매 슬라이스마다 '''CPU를 튕겨 다닌다'''\n|-\n| '''[[SQMS]] + 친화도 메커니즘''' || 보통 || 대부분의 job은 고정하고 '''일부(예: E)만 이동'''시켜 부하를 맞춘다\n|-\n| '''[[MQMS]]''' || '''좋음''' || job이 하나의 큐(= 하나의 CPU)에 머무르므로 '''자연스럽게 보존'''된다\n|}\n\n[[img:L7-34.png|SQMS: job A~E 5개가 CPU 4개 사이를 매 슬라이스마다 튕겨 다닌다|large]]\n\n<pre class=\"txt\">\n ❌ SQMS (친화도 없음)              ✅ SQMS + 친화도 메커니즘\n CPU0: A E D C B ...               CPU0: A E A A A ...\n CPU1: B A E D C ...               CPU1: B B E B B ...\n CPU2: C B A E D ...               CPU2: C C C E C ...\n CPU3: D C B A E ...               CPU3: D D D D E ...\n → 전부 튕겨 다님                   → A,B,C,D는 고정, '''E만 이동'''\n<\/pre>\n\n{warn}'''[[로드 밸런싱]]과는 정반대 방향의 요구'''라는 점이 핵심이다.\n* cache affinity: \"job을 '''옮기지 마라'''\"\n* load balancing: \"노는 CPU가 있으면 job을 '''옮겨라'''\"\n\n[[MQMS]]의 migration과 [[work stealing]]은 이 둘 사이의 타협이다. 너무 자주 옮기면 친화도를 잃고, 너무 안 옮기면 CPU가 논다. 슬라이드가 임계값 정하기를 '''\"black art\"'''라고 부르는 이유다.{/warn}\n\n== 시험에서 ==\n\n{exam}'''2025F 중간고사 Problem 2 d)에 힌트까지 그대로 출제됐다.'''\n> 멀티프로세서에서 프로세스를 같은 CPU에 두는 이유 '''(Hint: C___ A___)''' → '''Cache affinity''' (7강 p.31)\n\nProblem 2는 슬라이드의 영어 정의 문장을 거의 그대로 주고 용어를 쓰게 하는 형식이다. 정의 문장 \"A process builds up a fair bit of state in the cache of a CPU\"를 영어로 외워 둘 것. → [[2025F 중간고사 족보]]{/exam}\n\n== 관련 문서 ==\n* [[멀티프로세서 스케줄링]] · [[캐시 일관성]] · [[멀티코어]]\n* [[SQMS]] · [[MQMS]] · [[로드 밸런싱]] · [[work stealing]]\n* [[컨텍스트 스위치]]\n* [[2025F 중간고사 족보]]"
 },
 "SQMS": {
  "title": "SQMS (Single Queue Multiprocessor Scheduling)",
  "category": [

  "body": "'''SQMS'''(Single Queue Multiprocessor Scheduling)는 스케줄할 모든 job을 '''하나의 전역 큐'''에 넣고, 각 CPU가 그 큐에서 다음 job을 꺼내 가는 [[멀티프로세서 스케줄링]] 구조다.\n\n{def}\n'''SQMS''': Put all jobs that need to be scheduled into a '''single queue'''. Each CPU simply picks the next job from the '''globally shared queue'''.\n* '''Strengths''': Simple and easy to implement\n* '''Weaknesses''': Some form of '''locking''' have to be inserted → '''Lack of scalability''' / '''Cache affinity'''\n{/def}\n\n{analogy}'''번호표 하나로 돌아가는 은행'''이다. 창구가 넷이어도 번호표 기계는 하나뿐이고, 비는 창구가 생기면 다음 번호를 부른다. 만들기는 제일 쉽다. 문제는 둘이다. ① 네 창구 직원이 '''동시에 같은 번호표 통을 손대면''' 엉키니까 자물쇠를 걸어야 하고, 창구가 많아질수록 그 자물쇠 앞에서 줄을 선다(확장성). ② 한 손님이 갈 때마다 '''다른 창구'''로 배정되니, 앞 창구에서 꺼내 놨던 서류를 매번 새로 준비해야 한다([[cache affinity]] 상실).{/analogy}\n\n== 장점 ==\n\n단일 CPU 스케줄러([[Round Robin]], [[MLFQ]], [[CFS]] 등)를 거의 그대로 재사용할 수 있다. 큐가 하나이므로 '''공정성이나 부하 균형은 자동으로 맞는다''' — 노는 CPU가 생기면 바로 다음 job을 꺼내 가면 그만이다.\n\n== 약점 1 — 확장성 (lack of scalability) ==\n\n큐 하나를 여러 CPU가 건드리므로 '''[[락]]으로 보호'''해야 한다. 7강 p.29~30에서 `List_Pop()` 예제로 미리 깔아 둔 복선이 여기서 회수된다.\n\n<pre class=\"ascii\">\n   CPU0  CPU1  CPU2  CPU3   ... CPU31\n     │     │     │     │          │\n     └─────┴──┬──┴─────┴──────────┘\n              ▼\n          🔒 lock            ← CPU가 늘수록 여기서 '''경합'''\n              │\n       ┌──────┴──────┐\n       │ 전역 run큐   │\n       └─────────────┘\n<\/pre>\n\nCPU 수가 늘어날수록 락 경합이 심해져, 실제 일보다 '''락을 기다리는 시간'''이 커진다. 6강 p.29의 \"데이터센터 CPU 시간의 5%가 스케줄링\"과 같은 맥락의 문제다.\n\n== 약점 2 — cache affinity 상실 ==\n\n[[img:L7-34.png|job A~E 5개, CPU 4개. 각 job이 매 슬라이스마다 다른 CPU로 튕겨 다닌다|large]]\n\n<pre class=\"txt\">\n 큐: A → B → C → D → E → NULL,  CPU 4개, 각 job은 슬라이스 하나씩\n\n CPU0: A  E  D  C  B   ... (repeat) ...\n CPU1: B  A  E  D  C   ... (repeat) ...\n CPU2: C  B  A  E  D   ... (repeat) ...\n CPU3: D  C  B  A  E   ... (repeat) ...\n\n → '''모든 job이 매 슬라이스마다 다른 CPU로 튕겨 다닌다'''\n<\/pre>\n\n원인은 job 수(5)가 CPU 수(4)로 나눠떨어지지 않아 매 라운드마다 '''한 칸씩 밀리는''' 것이다. 결과적으로 [[cache affinity]]가 전멸한다.\n\n== 보완: 친화도 메커니즘 ==\n\n{def}\nSQMS schedulers include some kind of '''affinity mechanism'''\n* Try to make that process will continue to run on the '''same CPU''' if possible\n* Provide affinity for '''some''' jobs, but '''move others around''' to balance load\n{/def}\n\n<pre class=\"txt\">\n CPU0: A  E  A  A  A  ...\n CPU1: B  B  E  B  B  ...\n CPU2: C  C  C  E  C  ...\n CPU3: D  D  D  D  E  ...\n\n → A, B, C, D는 '''자기 CPU에 고정'''(친화도 보존)\n   '''E만 CPU를 돌아다니며''' 공정성을 맞춘다\n<\/pre>\n\n{warn}\"어떤 job을 희생시켜 돌아다니게 할 것인가\"를 정하는 로직이 복잡해진다는 게 SQMS의 현실적 부담이다. 단순함이 장점이었는데, 친화도를 챙기려는 순간 그 장점이 사라진다.{/warn}\n\n== MQMS와의 대비 ==\n\n{|\n! || '''SQMS''' || [[MQMS]]\n|-\n| 큐 || 전역 1개 || CPU당 1개\n|-\n| 구현 || '''단순''' || 복잡\n|-\n| 확장성 || '''나쁨''' (락 경합) || 좋음\n|-\n| [[cache affinity]] || '''나쁨''' || 좋음\n|-\n| 부하 균형 || '''쉬움''' (자동) || 어려움 ([[로드 밸런싱]] 필요)\n|-\n| 보완책 || 친화도 메커니즘 || migration, [[work stealing]]\n|}\n\n{exam}'''한 줄 대비로 외울 것''': SQMS는 '''공정성이 쉽고 확장성·친화도가 나쁘다''', MQMS는 '''확장성·친화도가 좋고 균형 맞추기가 어렵다'''. 두 구조의 약점이 정확히 반대라는 게 이 강의의 결론이다.{/exam}\n\n== 관련 문서 ==\n* [[MQMS]] · [[cache affinity]] · [[로드 밸런싱]] · [[work stealing]]\n* [[멀티프로세서 스케줄링]] · [[캐시 일관성]]\n* [[락]] · [[mutual exclusion]]"

 "MQMS": {
  "title": "MQMS (Multi-Queue Multiprocessor Scheduling)",
  "category": [
   "7강 Multi-CPU Scheduling",
   "용어"
  ],
  "body": "'''MQMS'''(Multi-Queue Multiprocessor Scheduling)는 스케줄링 큐를 '''여러 개'''(보통 CPU당 하나) 두는 [[멀티프로세서 스케줄링]] 구조다. [[SQMS]]의 두 약점(확장성, [[cache affinity]])을 한 번에 피한다.\n\n{def}\n'''MQMS''' consists of '''multiple scheduling queues'''\n* Each queue will follow a '''particular scheduling discipline''' (RR, MLFQ 등)\n* When a job enters the system, it is placed on '''exactly one''' scheduling queue\n* Avoid the '''scalability''' and '''CPU affinity''' problems\n{/def}\n\n{analogy}'''창구마다 번호표 기계가 따로 있는 은행'''이다. 손님은 들어올 때 창구 하나를 배정받고 끝까지 거기서 처리된다. 직원들이 같은 통을 만질 일이 없으니 자물쇠가 필요 없고(확장성), 손님이 창구를 바꾸지 않으니 서류가 그대로 남아 있다([[cache affinity]]). 대신 새 문제가 생긴다 — '''1번 창구 줄만 길고 2번 창구는 텅 비는''' 상황이다.{/analogy}\n\n== 동작 ==\n\n<pre class=\"txt\">\n CPU 2개, job A, B, C, D\n Q0 = {A, C}  →  CPU0 가 담당\n Q1 = {B, D}  →  CPU1 가 담당\n 각 큐 안에서는 [[Round Robin]]\n\n CPU0: A A C C A A C C ...\n CPU1: B B D D B B D D ...\n\n → A와 C는 CPU0에만, B와 D는 CPU1에만 → '''확장성 + 친화도 둘 다 확보'''\n<\/pre>\n\n큐가 서로 독립적이므로 [[락]] 경합이 없고, job이 한 CPU에 머무르므로 캐시 상태가 살아 있다.\n\n{info}새 job이 들어오면 '''어느 큐에 넣을지'''를 정해야 한다. 임의 선택, 가장 짧은 큐 선택 등의 휴리스틱을 쓴다. 6강 [[Stride 스케줄링]]의 \"새 job의 [[pass]] 값을 뭘로 줄까\" 문제와 성격이 같은 '''진입 시점 결정 문제'''다.{/info}\n\n== 약점: 부하 불균형 (load imbalance) ==\n\n[[img:L7-38.png|C가 끝나면 A가 B·D보다 CPU를 2배 받고, A까지 끝나면 CPU0이 완전히 논다|large]]\n\n<pre class=\"txt\">\n ① C가 끝난 뒤:  Q0 = {A},  Q1 = {B, D}\n    CPU0: A A A A A A A A A A A A ...\n    CPU1: B B D D B B D D B B D D ...\n    → '''A가 B, D보다 CPU를 2배''' 받는다 (공정성 붕괴)\n\n ② A까지 끝난 뒤:  Q0 = { },  Q1 = {B, D}\n    CPU0: (idle)\n    CPU1: B B D D B B D D ...\n    → '''CPU0이 완전히 논다''' — 일은 남았는데 CPU가 놀고 있다\n<\/pre>\n\n{warn}'''원인은 큐가 독립적이라 서로의 상황을 모른다는 것'''이다. 확장성과 [[cache affinity]]를 얻은 대가다. [[SQMS]]에서는 큐가 하나라서 이 문제 자체가 존재하지 않았다 — 두 구조의 약점이 정확히 반대인 이유다.{/warn}\n\n== 해법: migration ==\n\n답은 job을 '''옮기는 것(migration)'''이다.\n\n<pre class=\"ascii\">\n 쉬운 경우 — 한쪽이 놀고 있다\n   Q0 = { }        Q1 = {B, D}\n        ◄──────────── D 이동\n   Q0 = {D}        Q1 = {B}\n   → 부하 균등, 모두 만족\n\n 까다로운 경우 — job 3개를 CPU 2개에\n   Q0 = {A}        Q1 = {B, D}\n   한 개만 옮기면 이번엔 반대쪽이 2:1로 불균형\n   → '''계속 번갈아 옮기는''' 패턴이 필요\n\n   CPU0: A A A A B A B A B B B B ...\n   CPU1: B D B D D D D D A D A D ...\n          ↑ B를 CPU0으로     ↑ A를 CPU1로\n<\/pre>\n\n마이그레이션은 [[cache affinity]]를 잃는 비용이 있으므로 '''얼마나 자주, 누구를''' 옮길지가 정책 문제가 된다. 구현 기법이 [[work stealing]]이고, 전체 주제는 [[로드 밸런싱]]이다.\n\n== 대비 표 ==\n\n{|\n! || [[SQMS]] || '''MQMS'''\n|-\n| 큐 || 전역 1개 || '''CPU당 1개'''\n|-\n| 확장성 || 나쁨 (락 경합) || '''좋음'''\n|-\n| [[cache affinity]] || 나쁨 || '''좋음'''\n|-\n| 부하 균형 || 쉬움 (자동) || '''어려움''' (load imbalance)\n|-\n| 보완책 || 친화도 메커니즘 || '''migration''', [[work stealing]]\n|}\n\n{exam}서술형으로 \"SQMS와 MQMS를 비교하라\"가 나오면 축은 셋이다 — '''확장성(락) / cache affinity / 부하 균형'''. 앞 둘은 MQMS 승, 마지막은 SQMS 승이고, 각각의 보완책(친화도 메커니즘 / work stealing)까지 붙이면 만점이다.{/exam}\n\n== 관련 문서 ==\n* [[SQMS]] · [[로드 밸런싱]] · [[work stealing]] · [[cache affinity]]\n* [[멀티프로세서 스케줄링]] · [[멀티코어]]\n* [[Round Robin]] · [[MLFQ]] — 각 큐 안에서 쓰이는 정책"
 },

  "body": "'''work stealing'''(작업 훔치기)은 [[MQMS]]의 [[로드 밸런싱|부하 불균형]]을 해결하기 위해 '''작업이 적은 큐가 다른 큐를 엿보고 job을 가져오는''' 마이그레이션 구현 기법이다.\n\n{def}\n'''Work Stealing''': Move jobs between queues\n* '''Implementation'''\n** A '''source''' queue that is '''low on jobs''' is picked\n** The source queue '''occasionally peeks''' at another '''target''' queue\n** If the target queue is '''fuller''' than the source queue, the source will '''steal''' one or more jobs from the target queue\n* '''Weaknesses'''\n** '''High overhead''' and trouble scaling\n** Finding the right '''threshold''' remains (as is common in system policy design) a '''black art'''\n{/def}\n\n{analogy}'''일 없는 직원이 옆자리 서류함을 넘겨보는 것'''이다. 이름이 \"훔치기\"인 이유가 있다 — '''바쁜 쪽이 나눠 주는 게 아니라 한가한 쪽이 주도한다'''. 바쁜 CPU는 지금 일하느라 바쁜데 \"누구한테 일을 나눠 줄까\" 계산까지 시키면 더 느려지기 때문이다. 한가한 쪽은 어차피 놀고 있으니 엿보는 비용을 감당할 여유가 있다.{/analogy}\n\n== 동작 ==\n\n<pre class=\"ascii\">\n   CPU0                          CPU1\n ┌────────┐                   ┌──────────────────┐\n │ Q0: A  │  👀 peek ──────►  │ Q1: B  D  E  F   │\n └────────┘                   └──────────────────┘\n      │                                │\n      │   target이 더 차 있다 → steal!  │\n      └────────◄─── F 가져옴 ───────────┘\n\n ┌───────────┐                ┌───────────────┐\n │ Q0: A  F  │                │ Q1: B  D  E   │\n └───────────┘                └───────────────┘\n   source = 일이 적은 쪽 (주도자)   target = 일이 많은 쪽\n<\/pre>\n\n# '''source''' 선정: 자기 큐에 job이 적은 CPU.\n# '''peek''': 가끔 다른 큐(target)를 들여다본다.\n# '''steal''': target이 자기보다 더 차 있으면 job을 하나 이상 가져온다.\n\n== 임계값 문제 ==\n\n{warn}'''얼마나 자주 엿볼 것인가'''가 이 기법의 전부다.\n* '''너무 자주''' 엿보면 → peek 자체가 오버헤드가 되고, 결국 [[SQMS]]처럼 확장성이 무너진다. MQMS를 쓴 의미가 사라진다.\n* '''너무 드물게''' 엿보면 → 불균형이 오래가고 CPU가 논다.\n\n슬라이드 원문: \"Finding the right threshold remains (as is common in system policy design) a '''black art'''.\" 5강 [[MLFQ]] 튜닝의 \"There are no easy answers to these questions\"와 똑같은 결론이다. '''시스템 정책 설계에는 정답이 없다'''는 게 이 과목이 반복하는 메시지다.{/warn}\n\n== cache affinity와의 충돌 ==\n\njob을 훔쳐 오는 순간 그 job은 CPU를 옮기게 되고, 쌓아 둔 캐시 상태를 잃는다([[cache affinity]] 상실). 즉 work stealing은 '''공짜가 아니라 trade-off'''다.\n\n{|\n! 훔치기를 || 얻는 것 || 잃는 것\n|-\n| '''많이 하면''' || 부하 균형, CPU utilization || [[cache affinity]], peek 오버헤드\n|-\n| '''적게 하면''' || [[cache affinity]], 낮은 오버헤드 || CPU가 놀거나 불공정\n|}\n\n== 어디에 쓰이나 ==\n\n{info}OS 스케줄러만의 개념이 아니다. 병렬 런타임에서 널리 쓰이는 표준 기법이다 — Cilk, Java의 `ForkJoinPool`, Go의 goroutine 스케줄러, Rust의 rayon 등이 모두 work stealing 기반이다. \"각 워커가 자기 덱(deque)을 갖고, 비면 남의 덱 뒤쪽에서 훔친다\"가 공통 구조다.{/info}\n\n{exam}2025F 중간고사 '''Problem 2(용어 단답형)''' 유형에 대비해 영어 정의를 외울 것.\n> \"A source queue that is low on jobs occasionally '''peeks''' at another target queue; if the target queue is '''fuller''', the source will '''steal''' one or more jobs.\" → '''Work stealing''' (2 words)\n\n함께 나올 수 있는 세트: '''Cache affinity''', '''Cache coherence''', '''Bus snooping''', '''Load imbalance'''. → [[2025F 중간고사 족보]]{/exam}\n\n== 관련 문서 ==\n* [[MQMS]] · [[로드 밸런싱]] · [[cache affinity]] · [[SQMS]]\n* [[멀티프로세서 스케줄링]] · [[멀티코어]]\n* [[MLFQ]] — 같은 \"black art\" 결론"
 },
 "로드 밸런싱": {
  "title": "로드 밸런싱 (Load Balancing / Load Imbalance)",
  "category": [
   "7강 Multi-CPU Scheduling",
   "용어"
  ],
  "body": "'''로드 밸런싱'''(load balancing)은 여러 CPU에 작업을 '''고르게 나누는''' 문제다. [[MQMS]]에서는 큐가 독립적이라 저절로 균형이 깨지는데, 그 상태를 '''load imbalance(부하 불균형)'''라고 부른다.\n\n{analogy}'''마트 계산대'''다. 계산대마다 줄을 따로 세우면([[MQMS]]) 직원들끼리 부딪힐 일이 없어 빠르지만, 3번 줄만 길고 5번 줄은 텅 비는 일이 생긴다. 번호표 하나로 통합하면([[SQMS]]) 이 문제는 없지만 번호표 기계 앞에서 병목이 생긴다. '''줄을 나누면 불균형, 합치면 병목''' — 이 딜레마가 7강의 결론이다.{/analogy}\n\n== 불균형이 생기는 과정 ==\n\n[[img:L7-38.png|C가 끝나면 A가 B·D보다 CPU를 2배 받고, A까지 끝나면 CPU0이 완전히 논다|large]]\n\n<pre class=\"txt\">\n 시작:  Q0 = {A, C},  Q1 = {B, D}   → 완벽히 균형\n   CPU0: A A C C A A C C ...\n   CPU1: B B D D B B D D ...\n\n ① C 종료:  Q0 = {A},  Q1 = {B, D}\n   CPU0: A A A A A A A A A A A A ...\n   CPU1: B B D D B B D D B B D D ...\n   → '''A가 B, D보다 CPU를 2배''' 받는다 — [[fairness|공정성]] 붕괴\n\n ② A 종료:  Q0 = { },  Q1 = {B, D}\n   CPU0: (idle)\n   CPU1: B B D D B B D D ...\n   → '''CPU0이 완전히 논다''' — 자원 낭비\n<\/pre>\n\n{warn}'''원인은 큐가 서로의 상황을 모른다는 것.''' [[MQMS]]가 확장성과 [[cache affinity]]를 얻기 위해 큐를 분리한 바로 그 결정의 대가다. [[SQMS]]에는 이 문제가 아예 없다 — 큐가 하나라 비는 CPU가 알아서 다음 job을 꺼내 간다.{/warn}\n\n== 해법: migration (마이그레이션) ==\n\n{def}\n'''How to Deal with Load Imbalance?''' The answer is to '''move jobs (Migration)'''.\nConsider the situation where one CPU is '''idle''' and the other has jobs → The OS should simply '''move one''' of B or D to CPU 0 → The result of this single job migration is '''evenly balanced load and everyone is happy'''.\n{/def}\n\n=== 쉬운 경우 ===\n\n<pre class=\"ascii\">\n   Q0 = { }          Q1 = {B, D}\n        ◄──── D 이동 ────\n   Q0 = {D}          Q1 = {B}\n   → 1:1, 끝.\n<\/pre>\n\n=== 까다로운 경우 ===\n\njob 3개를 CPU 2개에 공평하게 주려면 한 job을 '''계속 왔다 갔다''' 옮겨야 한다.\n\n<pre class=\"txt\">\n Q0 = {A},  Q1 = {B, D}\n 한 개만 옮기면 이번엔 반대쪽이 2:1로 불균형 → 번갈아 옮기는 패턴\n\n CPU0: A A A A B A B A B B B B ...\n CPU1: B D B D D D D D A D A D ...\n        ↑ B를 CPU0으로     ↑ A를 CPU1로\n<\/pre>\n\n{info}슬라이드가 \"A more tricky case\"라고 부르는 상황이다. '''누군가는 계속 이사를 다녀야 공평해진다'''는 것이 요점이고, 그래서 마이그레이션은 공짜가 아니다.{/info}\n\n== 근본적 trade-off ==\n\n{|\n! || 옮기지 않으면 || 자주 옮기면\n|-\n| [[cache affinity]] || '''보존''' ✔ || '''상실''' ✗ (매번 cache miss)\n|-\n| CPU utilization || CPU가 논다 ✗ || '''균형''' ✔\n|-\n| [[fairness]] || 깨진다 ✗ || '''유지''' ✔\n|-\n| 오버헤드 || 없음 ✔ || peek·이동 비용 ✗\n|}\n\n{exam}'''[[cache affinity]]와 로드 밸런싱은 정확히 반대 방향의 요구'''라는 점이 서술형의 핵심이다.\n* cache affinity: \"job을 '''옮기지 마라'''\"\n* load balancing: \"노는 CPU가 있으면 '''옮겨라'''\"\n\n[[work stealing]]의 임계값(얼마나 자주 엿볼 것인가)이 바로 이 둘 사이의 타협점을 정하는 손잡이이고, 슬라이드는 그것을 '''\"black art\"'''라고 부른다.{/exam}\n\n== 구현: work stealing ==\n\n마이그레이션을 실제로 구현하는 대표 기법이 [[work stealing]]이다 — 작업이 적은 큐(source)가 가끔 다른 큐(target)를 엿보고, target이 더 차 있으면 job을 훔쳐 온다. '''한가한 쪽이 주도한다'''는 점이 포인트다(바쁜 CPU에 부담을 주지 않는다).\n\n== 관련 문서 ==\n* [[work stealing]] · [[MQMS]] · [[SQMS]] · [[cache affinity]]\n* [[멀티프로세서 스케줄링]] · [[멀티코어]]\n* [[fairness]] · [[Amdahl의 법칙]]"
 },
 "Amdahl의 법칙": {
  "title": "Amdahl의 법칙 (Amdahl's Law)",
  "category": [
   "7강 Multi-CPU Scheduling",
   "용어"
  ],
  "body": "'''Amdahl의 법칙'''은 시스템 자원을 늘렸을 때 얻을 수 있는 '''이론적 최대 속도 향상(speedup)'''을 계산하는 공식이다. 직렬 부분과 병렬 부분이 섞인 프로그램에 코어를 더 붙일 때 얼마나 이득인지 알려 준다.\n\n$$speedup \\le \\frac{1}{S + \\frac{1-S}{N}}$$\n\n{def}\n* Theoretical '''speedup''' of a task when system resources are improved\n* Useful to identify performance gains from adding additional cores to an application that has '''both serial and parallel components'''\n* '''$S$ is a serial portion''' and '''$N$ is # of processing cores'''\n* If the application is 75% parallel / 25% serial, moving from 1 to 2 cores results in speedup of '''1.6 times (not 2 times)'''\n* As $N$ approaches infinity, speedup approaches '''$1/S$'''\n{/def}\n\n{analogy}'''혼자 해야 하는 설거지가 섞인 요리'''다. 요리사를 아무리 늘려도 \"혼자 개수대에서 설거지하는 10분\"은 절대 줄지 않는다. 손질·볶기는 열 명이 나눠 하면 1/10이 되지만, 설거지 10분은 그대로다. 그래서 전체 시간이 '''설거지 시간 아래로는 절대 내려가지 않는다''' — 이게 $N \\to \\infty$일 때 speedup이 $1/S$에 막히는 이유다.{/analogy}\n\n[[img:L7-21.png|Amdahl의 법칙 공식. S는 직렬 부분, N은 코어 수|medium]]\n\n== 계산 절차 ==\n\n{exam}'''시험에 숫자만 바꿔 나오기 좋은 유형이다.''' 순서를 고정해서 외울 것.\n# '''$S$를 확인'''한다 — 문제가 \"75% 병렬\"이라고 하면 $S = 0.25$다. '''병렬 비율이 아니라 직렬 비율이 $S$'''라는 점에서 실수가 많이 난다.\n# 병렬 부분 $(1-S)$를 $N$으로 '''나눈다'''.\n# 둘을 '''더하고 역수'''를 취한다.{/exam}\n\n<pre class=\"txt\">\n 예제 1) 75% 병렬 / 25% 직렬, 코어 1 → 2\n   S = 0.25,  N = 2\n   분모 = 0.25 + 0.75/2 = 0.25 + 0.375 = 0.625\n   speedup = 1 / 0.625 = '''1.6배'''    (2배가 '''아니다''')\n\n   N → ∞ :  speedup → 1/S = 1/0.25 = '''4배'''\n   → 코어를 아무리 늘려도 4배가 한계\n\n 예제 2) 95% 병렬 / 5% 직렬, 코어 4개\n   S = 0.05,  N = 4\n   분모 = 0.05 + 0.95/4 = 0.05 + 0.2375 = 0.2875\n   speedup = 1 / 0.2875 ≈ '''3.48배'''\n   N → ∞ :  1/0.05 = '''20배'''\n\n 예제 3) 50% 병렬 / 50% 직렬\n   N → ∞ :  1/0.5 = '''2배'''   ← 절반이 직렬이면 아무리 해도 2배\n<\/pre>\n\n== 그래프가 말하는 것 ==\n\n<pre class=\"ascii\">\n speedup\n   20 ┤                          ╭──────────  95% 병렬 (상한 20배)\n      │                       ╭──╯\n   10 ┤              ╭────────╯─────────────  90% 병렬 (상한 10배)\n      │        ╭─────╯\n    4 ┤   ╭────╯──────────────────────────── 75% 병렬 (상한 4배)\n    2 ┤ ╭─╯────────────────────────────────  50% 병렬 (상한 2배)\n      └─┬────┬─────┬──────┬───────┬────────\n        1    16   256   2048    65536   코어 수 (로그 스케일)\n<\/pre>\n\n슬라이드 그래프의 빨간 동그라미: '''95% 병렬 프로그램에 코어 2,048개를 넣어야 20배에 도달'''한다. 그 이상은 아무 소용이 없다.\n\n{def}\n'''Serial portion of an application has disproportionate effect''' on performance gained by adding additional cores\n→ '''Writing software with parallelism in mind!'''\n{/def}\n\n== 왜 이 강의에 있나 ==\n\n7강의 논리 흐름에서 이 법칙의 역할은 분명하다.\n\n# 코어를 늘린다고 애플리케이션이 저절로 빨라지지 '''않는다'''.\n# 스레드를 써서 '''병렬로 돌게 다시 짜야''' 한다.\n# 그렇게 짜도 '''직렬 부분이 상한을 결정'''한다 (Amdahl).\n# 병렬 job들을 만들었으면, 이제 '''그것들을 어느 CPU에 배치할지'''가 문제다 → [[멀티프로세서 스케줄링]].\n\n{info}같은 병렬성 배경에 '''[[동시성]] vs 병렬성'''(concurrency는 CPU 1개로도 가능, parallelism은 2개 이상 필요)과 '''data / task / hybrid parallelism''' 구분이 함께 나온다. 셋 다 개념 문제로 출제되기 좋다. → [[멀티코어]]{/info}\n\n{warn}Amdahl의 법칙은 '''문제 크기가 고정'''되어 있다고 가정한다. 코어가 늘어난 만큼 더 큰 문제를 푼다고 가정하면 다른 결론(Gustafson의 법칙)이 나온다. 다만 이번 시험 범위는 슬라이드에 있는 Amdahl 쪽이다.{/warn}\n\n== 관련 문서 ==\n* [[멀티코어]] · [[멀티프로세서 스케줄링]] · [[동시성]]\n* [[cache affinity]] · [[SQMS]] · [[MQMS]]\n* [[스레드]]"
 },
