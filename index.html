<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운체위키 — DGIST CSE304 Operating Systems Wiki</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f5f5f5;
    --paper: #ffffff;
    --text: #222;
    --muted: #777;
    --link: #1d65b3;
    --link-visited: #6a4fa3;
    --header: #2a3b5a;
    --header-text: #fff;
    --border: #d8d8d8;
    --code-bg: #f3f3f3;
    --info-bg: #fff8d8;
    --info-border: #e0c060;
    --warn-bg: #ffe9e9;
    --warn-border: #d68080;
    --tip-bg: #e8f3ff;
    --tip-border: #80a8d6;
    --analogy-bg: #f0ecff;
    --analogy-border: #8a74d8;
    --def-bg: #e9f8ea;
    --def-border: #62b36a;
    --quiz-bg: #fff2e0;
    --quiz-border: #e09a40;
    --exam-bg: #ffe4ea;
    --exam-border: #d6465f;
    --table-head: #ecf0f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
    overflow-wrap: break-word;
  }
  header.top {
    background: var(--header);
    color: var(--header-text);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 3px solid #1c2840;
  }
  header.top .logo {
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
  }
  header.top .logo span { color: #ffd75e; }
  header.top .search { flex: 1; min-width: 160px; max-width: 420px; }
  header.top .search input {
    width: 100%;
    padding: 6px 10px;
    border-radius: 3px;
    border: 1px solid #1c2840;
    background: #fff;
    color: #222;
    font-size: 14px;
  }
  header.top .tagline {
    margin-left: auto;
    color: #c8d4e6;
    font-size: 12px;
  }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    gap: 18px;
    max-width: 1280px;
    margin: 16px auto;
    padding: 0 16px;
  }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 200px 1fr; }
    .toc-side { display: none; }
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; gap: 12px; padding: 0 12px; }
    .nav-side {
      position: static;
      max-height: 240px;
    }
    header.top { padding: 8px 12px; gap: 8px; }
    header.top .tagline { display: none; }
    main.article { padding: 16px 14px 40px; }
    main h1 { font-size: 22px; }
    main h2 { font-size: 17px; }
  }

  aside.nav-side, aside.toc-side {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    font-size: 13px;
    align-self: start;
    position: sticky;
    top: 70px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  aside h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside ul li { padding: 3px 0; }
  aside ul li a {
    color: var(--link);
    text-decoration: none;
    display: block;
    padding: 2px 4px;
    border-radius: 3px;
  }
  aside ul li a:hover { background: #f0f4fa; text-decoration: underline; }
  aside ul li a.active { background: var(--header); color: #fff; font-weight: 600; }
  aside .cat { color: var(--muted); font-size: 11px; margin-top: 10px; }
  aside.toc-side .toc-item { padding-left: 0; }
  aside.toc-side .toc-item.l2 { padding-left: 12px; }
  aside.toc-side .toc-item.l3 { padding-left: 24px; }
  aside.toc-side .toc-item a { font-size: 12px; }

  main.article {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px 32px 60px;
    min-height: 70vh;
    min-width: 0;
  }
  main h1 {
    margin: 0 0 4px;
    font-size: 28px;
    border-bottom: 2px solid var(--header);
    padding-bottom: 8px;
  }
  main .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  main h2 {
    margin-top: 28px;
    font-size: 20px;
    background: #f0f4fa;
    padding: 6px 10px;
    border-left: 4px solid var(--header);
  }
  main h3 {
    margin-top: 18px;
    font-size: 16px;
    color: #34466b;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 4px;
  }
  main h4 { margin-top: 14px; font-size: 14px; color: #34466b; }
  main p { margin: 8px 0; }
  main a { color: var(--link); text-decoration: none; }
  main a:hover { text-decoration: underline; }
  main a.wiki { font-weight: 500; }
  main a.wiki-stub { color: #888; font-style: italic; }
  main ul, main ol { padding-left: 22px; }
  main li { margin: 3px 0; }
  main ul ul { margin: 3px 0; }

  main hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  main code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  main pre {
    background: #2b2b2b;
    color: #d0d4d8;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  main pre.c, main pre.asm, main pre.sh, main pre.txt {
    background: #2b2b2b;
    color: #d0d4d8;
  }
  main pre.ascii {
    background: #f8f8f4;
    color: #222;
    border: 1px solid var(--border);
  }

  main table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 14px;
  }
  main table th, main table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  main table th { background: var(--table-head); font-weight: 600; }

  .info, .warn, .tip, .analogy, .def, .quiz, .exam {
    border-left: 4px solid;
    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
    font-size: 14px;
  }
  .info { background: var(--info-bg); border-color: var(--info-border); }
  .warn { background: var(--warn-bg); border-color: var(--warn-border); }
  .tip  { background: var(--tip-bg);  border-color: var(--tip-border); }
  .info::before { content: "📝 참고  "; font-weight: 700; }
  .warn::before { content: "⚠ 주의  "; font-weight: 700; }
  .tip::before  { content: "💡 팁  "; font-weight: 700; }

  .analogy { background: var(--analogy-bg); border-color: var(--analogy-border); }
  .analogy::before { content: "🎭 비유  "; font-weight: 700; color: #5b45a8; }
  .def { background: var(--def-bg); border-color: var(--def-border); }
  .def::before { content: "📖 정의  "; font-weight: 700; color: #2f7a38; }
  .quiz { background: var(--quiz-bg); border-color: var(--quiz-border); }
  .quiz::before { content: "❓ 예상문제  "; font-weight: 700; color: #a8650c; }
  .exam {
    background: var(--exam-bg);
    border-color: var(--exam-border);
    border-left-width: 6px;
    border-top: 1px solid var(--exam-border);
    border-right: 1px solid var(--exam-border);
    border-bottom: 1px solid var(--exam-border);
    box-shadow: 0 1px 3px rgba(214,70,95,0.18);
  }
  .exam::before { content: "🎯 출제 포인트  "; font-weight: 700; color: #b32741; }

  /* 박스 안에 표·목록 같은 블록이 오면 본문이 renderWikiText 로 재귀 렌더된다.
     첫 문단만 inline 으로 두어 "📝 참고" 라벨과 같은 줄에 붙게 한다. */
  .info > p:first-child, .warn > p:first-child, .tip > p:first-child,
  .joke > p:first-child, .analogy > p:first-child, .def > p:first-child,
  .quiz > p:first-child, .exam > p:first-child { display: inline; }
  .info > :last-child, .warn > :last-child, .tip > :last-child,
  .joke > :last-child, .analogy > :last-child, .def > :last-child,
  .quiz > :last-child, .exam > :last-child { margin-bottom: 0; }
  .info > table, .warn > table, .tip > table, .joke > table,
  .analogy > table, .def > table, .quiz > table, .exam > table { background: #fff; }

  details.answer {
    background: #f4f4f4;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    margin: 4px 0 14px;
    font-size: 14px;
  }
  details.answer > summary {
    cursor: pointer;
    font-weight: 700;
    color: #2f6d33;
    list-style: none;
    user-select: none;
  }
  details.answer > summary::-webkit-details-marker { display: none; }
  details.answer > summary::before { content: "▸ "; }
  details.answer[open] > summary::before { content: "▾ "; }
  details.answer[open] > summary { margin-bottom: 6px; border-bottom: 1px dashed #bbb; }

  .joke {
    background: #f5e8ff;
    border-left: 4px solid #a466d6;
    padding: 8px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: #555;
    border-radius: 0 4px 4px 0;
  }
  .joke::before { content: "💬 여담  "; font-weight: 700; color: #7440a8; }

  .footnote {
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 24px;
  }
  .footnote-ref { font-size: 10px; vertical-align: super; color: var(--link); cursor: pointer; }

  .categories {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 2px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .categories .cat-tag, main .meta .cat-tag {
    display: inline-block;
    background: #e8e8e8;
    color: #444;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
    font-size: 12px;
  }

  .diagram {
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 10px;
    margin: 12px 0;
    text-align: center;
    border-radius: 4px;
  }
  .diagram .caption { color: var(--muted); font-size: 12px; margin-top: 6px; }
  figure.pdf-img {
    margin: 16px auto;
    text-align: center;
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 4px;
    max-width: 100%;
  }
  figure.pdf-img img { max-width: 100%; height: auto; border: 1px solid #ddd; background: white; }
  figure.pdf-img figcaption { color: var(--muted); font-size: 12px; margin-top: 8px; font-style: italic; }
  figure.pdf-img.small img { max-width: 400px; }
  figure.pdf-img.medium img { max-width: 600px; }
  figure.pdf-img.large img { max-width: 850px; }

  .stub-banner {
    background: #fff3cd;
    border: 1px dashed #d4a017;
    padding: 8px 12px;
    color: #6a5000;
    font-size: 13px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .breadcrumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .breadcrumb a { color: var(--link); text-decoration: none; }

  footer.page { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

  /* ============================================================
     SimEngine — 단계별 시뮬레이터
     ============================================================ */
  .sim {
    border: 2px solid #3a5480;
    border-radius: 6px;
    background: #fbfcfe;
    margin: 18px 0;
    padding: 0;
    overflow: hidden;
  }
  .sim:focus { outline: 2px solid #ffd75e; }
  .sim .sim-head {
    background: #3a5480;
    color: #fff;
    padding: 8px 12px;
  }
  .sim .sim-head .sim-title { font-weight: 700; font-size: 15px; }
  .sim .sim-head .sim-title::before { content: "🧪 "; }
  .sim .sim-head .sim-subtitle { font-size: 12px; color: #d3ddec; margin-top: 2px; }

  .sim .sim-body { padding: 10px 12px 14px; }

  .sim .sim-opts {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 8px;
  }
  .sim .sim-opt { font-size: 12px; color: #34466b; }
  .sim .sim-opt label { font-weight: 600; margin-right: 5px; }
  .sim select {
    font-size: 12px;
    padding: 3px 5px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fff;
    color: #222;
    max-width: 100%;
  }

  .sim .sim-ctrl {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
  }
  .sim .sim-btn {
    font-size: 14px;
    line-height: 1;
    padding: 6px 10px;
    border: 1px solid #3a5480;
    background: #fff;
    color: #2a3b5a;
    border-radius: 4px;
    cursor: pointer;
    min-width: 36px;
  }
  .sim .sim-btn:hover:not(:disabled) { background: #eef2f8; }
  .sim .sim-btn:disabled { opacity: 0.35; cursor: default; }
  .sim .sim-btn.playing { background: #3a5480; color: #fff; }
  .sim .sim-range { flex: 1; min-width: 100px; accent-color: #3a5480; }
  .sim .sim-count {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: #34466b;
    white-space: nowrap;
    min-width: 62px;
    text-align: right;
  }

  .sim .sim-panels {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .sim .sim-panel {
    flex: 1 1 260px;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  .sim .sim-panel-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: #eef2f8;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: #34466b;
  }
  .sim .sim-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 9px;
    background: #ddd;
    color: #444;
    white-space: nowrap;
  }
  .sim .sim-badge.running { background: #cdefd2; color: #1d6b2a; }
  .sim .sim-badge.ready { background: #fdeec2; color: #8a6000; }
  .sim .sim-badge.spinning { background: #ffd9d9; color: #a52f2f; }
  .sim .sim-badge.blocked, .sim .sim-badge.parked, .sim .sim-badge.sleeping { background: #dcdcf2; color: #3c3c88; }
  .sim .sim-badge.done, .sim .sim-badge.finished { background: #d8d8d8; color: #555; }

  .sim .sim-code {
    position: relative;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    padding: 6px 0;
    overflow: auto;
    max-height: 280px;
  }
  .sim .sim-line { display: flex; padding: 0 8px; white-space: pre; }
  .sim .sim-line .sim-ln {
    color: #aaa;
    width: 2.4em;
    flex: 0 0 auto;
    text-align: right;
    margin-right: 8px;
    user-select: none;
  }
  .sim .sim-line .sim-mark { width: 1.1em; flex: 0 0 auto; color: #c0392b; font-weight: 700; }
  .sim .sim-line .sim-src { flex: 1 1 auto; }
  .sim .sim-line.cur { background: #fff3bf; }
  .sim .sim-line.cur .sim-src { font-weight: 700; color: #6b4a00; }

  .sim .sim-vars { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
  .sim .sim-vars th, .sim .sim-vars td {
    border: 1px solid var(--border);
    padding: 3px 8px;
    text-align: left;
  }
  .sim .sim-vars th { background: #eef2f8; font-weight: 600; width: 40%; }
  .sim .sim-vars tr.sim-group th {
    background: #dde5f0;
    color: #34466b;
    font-size: 11px;
    letter-spacing: 0.03em;
  }
  .sim .sim-vars td {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: #fff;
  }
  .sim .sim-vars td.changed { background: #fff3bf; font-weight: 700; }
  .sim .sim-vars td .sim-prev { font-size: 10px; color: #9a7b1f; font-weight: 400; margin-right: 4px; }

  .sim .sim-descbox {
    background: #eef4fb;
    border-left: 4px solid #3a5480;
    padding: 8px 12px;
    font-size: 13.5px;
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
  }
  .sim .sim-descbox .sim-stepno { font-weight: 700; color: #3a5480; margin-right: 6px; }
  .sim .sim-note {
    background: var(--warn-bg);
    border-left: 4px solid var(--warn-border);
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
  }
  .sim .sim-note::before { content: "⚠ "; font-weight: 700; }
  .sim .sim-svgbox { text-align: center; overflow-x: auto; margin-top: 4px; }
  .sim .sim-svgbox svg { max-width: 100%; height: auto; }
  .sim .sim-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .sim-missing {
    border: 2px dashed #d6465f;
    background: #ffe4ea;
    color: #b32741;
    padding: 12px;
    border-radius: 4px;
    margin: 14px 0;
    font-weight: 700;
    font-size: 14px;
  }

  @media (max-width: 720px) {
    .sim .sim-panels { flex-direction: column; }
    .sim .sim-panel { flex: 1 1 auto; }
    .sim .sim-code { max-height: 220px; }
  }
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="#main">운체<span>위키</span></a>
  <div class="search">
    <input id="searchBox" type="text" placeholder="문서 검색... (예: trapframe, MLFQ, ticket lock)">
  </div>
  <div class="tagline">DGIST CSE304 운영체제 — 중간고사·퀴즈·과제1</div>
</header>

<div class="layout">

  <aside class="nav-side">
    <h3>📚 문서 목록</h3>
    <ul id="navList"></ul>
  </aside>

  <main class="article" id="articleArea">
    <!-- rendered here -->
  </main>

  <aside class="toc-side" id="tocArea">
    <h3>📑 목차</h3>
    <ul id="tocList"></ul>
  </aside>

</div>

<footer class="page">
  운체위키 · DGIST CSE304 Operating Systems · Prof. Yongwoo Lee · OSTEP
</footer>

<script>
// ===== 문서 데이터 (build.py 생성) =====
const ARTICLES = {
 "main": {
  "title": "운체위키:대문",
  "category": [
   "안내"
  ],
  "body": "'''운체위키'''에 오신 것을 환영합니다. 이 위키는 [[xv6|DGIST]] '''CSE304 운영체제'''(Prof. Yongwoo Lee, 교재 [[OSTEP]]) 중간고사·퀴즈·과제1 범위를 나무위키 스타일로 정리한 문서 모음이다. 강의는 영어로 진행되므로 기술 용어는 영어 그대로 두고, 설명은 한국어로 썼다.\n\n{tip}이 위키의 존재 이유는 딱 두 가지다. '''① 그림·시뮬레이터로 본다''' — 코드가 나오면 그 옆에서 변수가 어떻게 바뀌는지 C 디버거처럼 한 단계씩 돌려 볼 수 있다(▶ 버튼). '''② 변수·용어를 까먹으면 클릭한다''' — 본문의 모든 [[trapframe]], [[epc]], [[vruntime]] 같은 파란 글씨는 그 변수가 뭔지 설명하는 사전 문서로 이어진다.{/tip}\n\n{warn}'''2026-09-23 퀴즈'''는 100점 전부가 [[과제1 xv6 alarm|과제 1(xv6 alarm)]]에서 나왔다. 한 문장 서술 + 코드 빈칸 + 출력 예측. 실제 문제와 모범답안은 [[퀴즈1 복기]]에 있다. 중간고사도 이 경향(코드를 읽고 결과를 쓰는 문제)이 이어질 가능성이 크다.{/warn}\n\n== 빠른 시작 ==\n\n처음 방문했다면 [[읽는 순서]]를 따라가면 된다. 요약하면:\n\n# [[운영체제란]] — OS가 하는 일 세 가지: [[가상화]] · [[동시성]] · [[영속성]]\n# [[프로세스]] — 프로그램이 프로세스가 되기까지, [[fork]]/[[exec]]/[[wait]], [[struct proc]]\n# [[제한적 직접 실행]] — [[트랩]]으로 커널에 들어갔다 [[return-from-trap]]으로 나오기, [[타이머 인터럽트]], [[컨텍스트 스위치]]\n# [[과제1 xv6 alarm]] — 3·4강을 손으로 구현한 것. [[sigalarm]]/[[sigreturn]], [[alarm_saved]], [[a0 복원]], [[재진입 금지]]\n# [[스케줄링]] — [[FIFO]] → [[SJF]] → [[STCF]] → [[Round Robin]] → [[MLFQ]]\n# [[비례 지분 스케줄링]] — [[Lottery 스케줄링]], [[Stride 스케줄링]], [[CFS]], [[EEVDF]]\n# [[멀티프로세서 스케줄링]] — [[cache affinity]], [[SQMS]] vs [[MQMS]], [[work stealing]]\n# [[스레드]] — 스택이 여러 개인 주소 공간, [[counter 예제]]로 보는 [[race condition]]\n# [[락]] — 막 구현하면 뭐가 고장나는지 순서대로: [[flag 락]] → [[test-and-set]] → [[ticket lock]] → [[queue 락]] → [[futex]]\n\n{info}시험 24시간 전이라면 [[자주 틀리는 함정 모음]]만 보자. 모의고사에서 실제로 틀린 것들과 작년 [[2025F 중간고사 족보]]에서 나온 함정을 모아 두었다.{/info}\n\n== 시뮬레이터 모음 ==\n\n각 문서 안에 박혀 있지만, 한 번에 찾고 싶을 때:\n\n{|\n! 주제 || 시뮬레이터가 있는 문서 || 무엇을 보여주나\n|-\n| 두 스레드의 counter++ || [[counter 예제]], [[스레드]] || mov/add/mov 사이에 인터럽트가 끼면 51이 되는 과정\n|-\n| 잘못된 flag 락 || [[flag 락]], [[락]] || 두 스레드가 동시에 critical section에 들어가는 인터리빙\n|-\n| test-and-set / CAS / LL-SC || [[test-and-set]], [[compare-and-swap]], [[load-linked store-conditional]] || 하드웨어 atomic 명령이 왜 락을 고치는지\n|-\n| ticket lock || [[ticket lock]], [[fetch-and-add]] || 번호표로 공정성을 얻는 과정\n|-\n| park/unpark 큐 락 || [[queue 락]], [[park와 unpark]] || wakeup/waiting race와 [[setpark]]\n|-\n| 과제1 alarm tick 추적 || [[과제1 xv6 alarm]], [[퀴즈1 복기]] || 퀴즈 5번 프로그램을 tick 단위로 — [[epc]]/[[alarm_saved]]/[[a0]]가 바뀌는 순간\n|-\n| 시스템 콜 트랩 왕복 || [[제한적 직접 실행]], [[트랩]], [[xv6 시스템 콜 경로]] || user → ecall → [[usertrap]] → syscall → [[usertrapret]] → [[sret]]\n|-\n| 컨텍스트 스위치 || [[컨텍스트 스위치]], [[타이머 인터럽트]] || 레지스터가 [[커널 스택]]과 [[struct proc]]에 두 번 저장되는 이유\n|-\n| 프로세스 상태 기계 || [[프로세스 상태]], [[프로세스]] || Running/Ready/Blocked 전이\n|-\n| fork/exec/wait || [[fork]], [[exec]], [[wait]] || p1.c~p3.c 출력 순서\n|-\n| 스케줄링 Gantt || [[스케줄링]], [[FIFO]], [[SJF]], [[STCF]], [[Round Robin]] || turnaround/response 평균이 어떻게 계산되는지\n|-\n| MLFQ || [[MLFQ]] || 규칙 1~5, allotment, priority boost\n|-\n| Stride / Lottery || [[Stride 스케줄링]], [[Lottery 스케줄링]] || pass 표가 채워지는 과정, 추첨\n|-\n| CFS / EEVDF || [[CFS]], [[EEVDF]] || [[vruntime]]과 [[lag]]/[[virtual deadline]]\n|-\n| 스레드 스택 || [[스레드 스택]], [[스레드]] || 주소 공간 안에 스택이 두 개 생기는 과정\n|}\n\n== 분류별 문서 ==\n\n=== 시험·과제 ===\n* [[시험 정보]] · [[퀴즈1 복기]] · [[2025F 중간고사 족보]] · [[자주 틀리는 함정 모음]]\n* [[과제1 xv6 alarm]] · [[sigalarm]] · [[sigreturn]] · [[alarmtest]] · [[xv6 시스템 콜 경로]]\n\n=== 1~2강 ===\n* [[운영체제란]] · [[가상화]] · [[동시성]] · [[영속성]] · [[커널]] · [[시스템 콜]] · [[유저 모드와 커널 모드]] · [[OS 설계 목표]]\n\n=== 3강 ===\n* [[프로세스]] · [[프로세스 상태]] · [[프로세스 API]] · [[struct proc]] · [[fork]] · [[exec]] · [[wait]] · [[프로그램 로딩]] · [[주소 공간]] · [[시스템 콜 추가 절차]]\n\n=== 4강 ===\n* [[제한적 직접 실행]] · [[트랩]] · [[트랩 테이블]] · [[trapframe]] · [[epc]] · [[sepc]] · [[return-from-trap]] · [[usertrap]] · [[usertrapret]] · [[타이머 인터럽트]] · [[컨텍스트 스위치]] · [[커널 스택]] · [[협력적 방식]] · [[비협력적 방식]]\n\n=== 5~7강 ===\n* [[스케줄링]] · [[스케줄링 지표]] · [[FIFO]] · [[SJF]] · [[STCF]] · [[Round Robin]] · [[MLFQ]] · [[convoy effect]]\n* [[비례 지분 스케줄링]] · [[Lottery 스케줄링]] · [[Stride 스케줄링]] · [[CFS]] · [[vruntime]] · [[EEVDF]] · [[lag]]\n* [[멀티프로세서 스케줄링]] · [[cache affinity]] · [[SQMS]] · [[MQMS]] · [[work stealing]]\n\n=== 8~9강 ===\n* [[스레드]] · [[TCB]] · [[스레드 스택]] · [[pthread_create]] · [[TLS]] · [[race condition]] · [[critical section]] · [[atomic]] · [[counter 예제]]\n* [[락]] · [[락 평가 기준]] · [[flag 락]] · [[인터럽트 비활성화]] · [[test-and-set]] · [[spin lock]] · [[compare-and-swap]] · [[load-linked store-conditional]] · [[fetch-and-add]] · [[ticket lock]] · [[yield 락]] · [[queue 락]] · [[park와 unpark]] · [[setpark]] · [[futex]] · [[two-phase lock]]\n\n{joke}컴구위키에 이어 두 번째 위키다. 지난 학기엔 \"TLB가 뭐더라\"를 스무 번 검색했다면, 이번 학기엔 \"trapframe이 뭐더라\"를 스무 번 클릭하게 될 것이다. 클릭이 검색보다 빠르다.{/joke}"

 "읽는 순서": {
  "title": "읽는 순서",
  "category": [
   "안내"
  ],
  "body": "처음부터 끝까지 읽으면 수업 전체가 이해되도록 짠 순서다. 각 단계는 \"이 문서를 읽고 나면 다음 문서의 변수·용어를 알게 된다\"는 의존 관계로 이어진다. 시뮬레이터(▶)는 건너뛰지 말고 반드시 끝까지 눌러 볼 것 — 글로 읽은 것과 변수가 눈앞에서 바뀌는 것은 기억에 남는 정도가 다르다.\n\n{analogy}이 순서는 게임의 튜토리얼 구간과 같다. 1~4강에서 조작법(프로세스, 트랩, 컨텍스트 스위치)을 익히고, 과제1에서 첫 보스(alarm)를 잡고, 5~7강에서 넓은 맵(스케줄링)을 탐험한 뒤, 8~9강에서 진짜 어려운 던전(동시성·락)에 들어간다.{/analogy}\n\n== 1단계 — OS가 뭔지 (1·2강, 30분) ==\n# [[운영체제란]] — 전부 읽기. [[가상화]] · [[동시성]] · [[영속성]] 세 단어를 남의 말로 설명할 수 있으면 통과.\n# [[유저 모드와 커널 모드]] → [[시스템 콜]] → [[커널]] — 4강의 전제.\n\n== 2단계 — 프로세스 (3강, 1시간) ==\n# [[프로세스]] — [[프로세스 상태]] 시뮬레이터, [[fork]] 시뮬레이터 실행.\n# [[struct proc]] — 과제1에서 필드를 직접 추가하므로 표를 눈에 익힐 것.\n# [[시스템 콜 추가 절차]] — 과제1의 절반이 이 절차.\n\n== 3단계 — 제한적 직접 실행 (4강, 1.5시간) ⭐ ==\n# [[제한적 직접 실행]] — 시뮬레이터 두 개(syscall_trap, context_switch) 필수.\n# [[트랩]] → [[trapframe]] → [[epc]] → [[sepc]] → [[return-from-trap]] — 이 다섯 문서를 순서대로. \"[[sret]]은 [[sepc]]로 간다, [[sepc]]는 [[trapframe]]->[[epc]]에서 온다\" 한 문장이 남으면 된다.\n# [[타이머 인터럽트]] · [[협력적 방식]] · [[비협력적 방식]] — 모의고사에서 틀린 부분.\n# [[컨텍스트 스위치]] · [[커널 스택]].\n\n== 4단계 — 과제 1 (2시간) ⭐⭐⭐ ==\n# [[과제1 xv6 alarm]] — 전부. alarm_trace 시뮬레이터를 두 옵션(count==3 조건 / 무조건 sigalarm(0,0)) 모두로 돌려 볼 것.\n# [[alarm_saved]] · [[a0 복원]] · [[재진입 금지]] — 퀴즈에서 각각 문제 하나씩 나온 세 가지.\n# [[퀴즈1 복기]] — 실제 퀴즈를 다시 풀어 보고 답 확인.\n\n== 5단계 — 스케줄링 (5·6·7강, 2시간) ==\n# [[스케줄링]] — sched_gantt 시뮬레이터로 FIFO/SJF/STCF/RR을 같은 입력으로 비교. [[turnaround time]] vs [[response time]] 표를 손으로 한 번 쓰기.\n# [[MLFQ]] — 규칙 5개를 외우고 mlfq 시뮬레이터.\n# [[비례 지분 스케줄링]] — [[Stride 스케줄링]] pass 표를 직접 채워 본 뒤 시뮬레이터로 검산. [[CFS]]의 [[vruntime]], [[EEVDF]]의 [[lag]] 규칙 한 줄.\n# [[멀티프로세서 스케줄링]] — [[cache affinity]], [[SQMS]]/[[MQMS]], [[work stealing]].\n\n== 6단계 — 동시성과 락 (8·9강, 2시간) ⭐⭐ ==\n# [[스레드]] — [[스레드 스택]] 시뮬레이터, [[counter 예제]] 시뮬레이터(인터럽트 시점을 바꿔 가며).\n# [[race condition]] · [[critical section]] · [[mutual exclusion]] · [[atomic]] — 정의→용어 문제 단골.\n# [[락]] — 처음부터 끝까지. 각 버전의 시뮬레이터를 순서대로: [[flag 락]](고장) → [[test-and-set]](고침, 불공정) → [[ticket lock]](공정) → [[queue 락]](스핀 낭비 해결) → [[futex]].\n\n== 7단계 — 마무리 (1시간) ==\n# [[2025F 중간고사 족보]] — 작년 문제 유형과 이 위키의 어느 문서가 대응되는지.\n# [[자주 틀리는 함정 모음]] — 시험 직전용.\n# [[시험 정보]] — 일정 확인."
 },
 "시험 정보": {

  "body": "CSE304 운영체제의 시험·퀴즈 일정과 범위. 원본 기준 파일은 저장소의 `운영체제/_시험정보.md`이며, 새 공지가 나오면 그쪽을 먼저 고친다.\n\n== 확정된 것 ==\n{|\n! 날짜 || 종류 || 범위 || 출처\n|-\n| '''2026-09-23 (수)''' || '''퀴즈 1''' (15분, 100점) || '''전부 [[과제1 xv6 alarm|과제 1]]''' — 핸들러 실행 모드, [[usertrap]] 코드 빈칸, [[alarm_saved]]가 필요한 이유, [[a0 복원]], alarmtest 변형 출력 예측 || 실제 시험지 → [[퀴즈1 복기]]\n|-\n| 2026-10-10 (금) 23:00 || 과제 1 마감 || [[sigalarm]]/[[sigreturn]] 구현 + 보고서 4~6쪽 + `make zipball` || Assignment 1.pdf\n|-\n| 미정 || 중간고사 || 작년 기준 1~9강 + condition variable까지 || [[2025F 중간고사 족보]]\n|}\n\n{exam}교수님이 8강 앞부분 p.2–20에서 1~7강을 복습한 것은 '''퀴즈 대비용'''이라고 밝혔다 (2026-09-21). 실제 퀴즈는 과제 100%였지만, 중간고사에서는 이 복습 슬라이드가 그대로 출제 목록이 될 가능성이 높다. → [[스레드]] 문서의 \"교수님 퀴즈 복습 슬라이드\" 표 참고.{/exam}\n\n== 퀴즈 1에서 드러난 출제 스타일 ==\n* '''한 문장 서술''' — \"Limit each written explanation to one sentence.\" 길게 쓰면 손해.\n* '''코드 빈칸''' — 과제 코드의 조건식·대입문을 그대로 채우기 (`!p->alarm_active`, `*p->trapframe`, `(uint64)p->alarm_handler`).\n* '''값 추적''' — 레지스터 [[a0]]가 특정 시점에 어떤 값인지 ([[a0 복원]]).\n* '''출력 예측''' — 변형된 alarmtest를 읽고 printf 세 줄 쓰기. 코드를 tick 단위로 머릿속에서 돌려야 한다 → alarm_trace 시뮬레이터가 이 훈련용.\n\n== 작년(2025F) 중간고사 ==\n객관식 + 정의→용어 단답 + 스케줄링 계산 + 락 코드 빈칸. 평균 52.4 / 표준편차 14.4 / 최고 84. 자세한 것은 [[2025F 중간고사 족보]].\n\n== 아직 모르는 것 ==\n* 퀴즈 성적 반영 비율, 중간고사 날짜·범위·형식.\n* 확인되면 `_시험정보.md`와 이 문서를 함께 갱신할 것."
 },

   "2강 What is OS"
  ],
  "body": "'''운영체제'''(Operating System, OS)는 CPU·메모리·디스크 같은 물리 자원을 프로그램들이 나눠 쓸 수 있게 관리하고, 그 위에서 프로그램이 쉽게 돌아가도록 편한 추상화를 제공하는 시스템 소프트웨어다. 1강(Intro)과 2강(What is Operating Systems?)이 통째로 이 한 문장을 풀어 쓰는 데 쓰인다.\n\n교수님이 슬라이드 첫 장에서 붙인 정의는 딱 두 단어다 — '''resource manager'''(자원 관리자)와 '''service provider'''(서비스 제공자). 이 두 역할이 각각 [[가상화]]·[[동시성]]·[[영속성]]이라는 **three easy pieces**로 갈라지고, 그걸 사용자에게 열어 주는 창구가 [[시스템 콜]]이다.\n\n{def}\n'''Operating System''' — \"A resource manager and service provider for user programs.\" (1강 p.22)<br>\nThe OS is responsible for ① making it easy to run programs in a CPU(s), ② allowing programs to share memory, ③ enabling programs to interact with devices. (2강 p.4)\n{/def}\n\n{analogy}\n🍦 교수님이 2강 내내 끌고 가는 비유는 '''아이스크림 가게'''다. 여러분은 가게 사장이고, 직원(=CPU)은 성실하지만 멍청하다. 레시피를 한 줄씩 읽어야만 만들 수 있고, 재료를 스스로 분류하지도 못한다. 그래서 여러분은 냉장고(=[[영속성|디스크]])에서 레시피와 재료를 꺼내 '''Table'''(=메모리) 위에 한 세트(=Task)로 올려 준다. 이 세팅을 해 주는 사람, 주문이 밀릴 때 순서를 짜는 사람, 진상 손님이 주방에 못 들어오게 키오스크를 세우는 사람 — 그게 '''운영체제'''다.\n{/analogy}\n\n[[img:L2-02.png|2강 p.2. Refrigerator(디스크) → Table(메모리) → Worker(CPU). 이 그림 한 장이 2강 전체의 뼈대다.|medium]]\n\n== 컴퓨터 시스템의 분류 ==\n\n1강은 \"OS가 어디쯤 있는 물건인가\"부터 자리를 잡아 준다.\n\n[[img:L1-14.png|1강 p.14. Computer System → Hardware System / Software System, Software는 다시 System Programs / Application Programs.|medium]]\n\n* '''Hardware System''': CPU, Memory, I/O Devices\n* '''Software System''': System Programs, Application Programs\n\n여기서 OS는 '''System Program의 한 종류'''다. 즉 \"OS = 시스템 프로그램 전부\"가 아니라 \"OS ⊂ 시스템 프로그램\"이라는 포함 관계가 시험 포인트다.\n\n=== 시스템 프로그램의 정의 ===\n\n{def}\n'''System Program''' (1강 p.18)<br>\n# Computer software designed to provide services to '''other software''' (e.g., application programs)<br>\n# Responsible for the '''management of hardware devices''' — strongly related to hardware<br>\n# '''Supporting environments''' for users and application programs (e.g., commands, libraries, shells, and so on)\n{/def}\n\n\"다른 소프트웨어에게 서비스를 제공한다\"가 1번으로 오는 게 핵심이다. 응용 프로그램은 사람에게 서비스하고, 시스템 프로그램은 '''프로그램에게''' 서비스한다.\n\n{exam}\n2025F 중간고사 '''Problem 1'''의 해설 슬라이드에 이 \"Definition of a System Program\" 장과 아래 \"Three Types of System Programs\" 장이 그대로 실려 있다. 1강 앞부분을 \"오리엔테이션\"이라고 넘기면 안 되는 이유. → [[2025F 중간고사 족보]]\n{/exam}\n\n=== 시스템 프로그램 세 갈래 ===\n\n[[img:L1-19.png|1강 p.19. (1) Compilation System / (2) Runtime System / (3) Operating System — 그리고 그 밑에 Hardware System.|large]]\n\n{| class=\"table\"\n! 분류 || 구성원 || 하는 일\n|-\n| '''(1) Compilation System''' || Compiler, Assembler, Linker, Loader, Editor, Debugger || 사람이 쓴 코드를 기계가 읽는 실행 파일로 번역 ([[프로그램 로딩]])\n|-\n| '''(2) Runtime System''' || Library, Shell, Commands, Utilities, Windows || 실행 중인 프로그램을 도와주는 환경 (`printf()` 같은 표준 라이브러리, `ls`/`ps` 같은 명령어)\n|-\n| '''(3) Operating System''' || Scheduler, IPC, File System, Device Driver, Virtual Memory, Protocol Stack || 하드웨어를 직접 만지며 자원을 관리 ← 이 과목의 주인공\n|}\n\n{warn}\nLoader는 '''Compilation System''' 칸에 있고 Shell은 '''Runtime System''' 칸에 있다. 둘 다 \"OS 아니냐?\"고 헷갈리기 쉬운데 슬라이드 분류상 OS 박스 안에 있는 건 Scheduler / IPC / File System / Device Driver / Virtual Memory / Protocol Stack 여섯 개다.\n{/warn}\n\n== hello.c 한 줄이 화면에 찍히기까지 ==\n\n1강 p.16은 세상에서 제일 단순한 C 프로그램을 띄워 놓고 네 개의 질문을 던진다.\n\n<pre class=\"c\">\n/* hello.c */\n#include &lt;stdio.h&gt;\n\nint main (void)\n{\n    printf (\"hello, world\\n\");\n    return 0;\n}\n<\/pre>\n\n# `printf()`와 `stdio.h`는 도대체 뭔가? → '''Runtime System''' (표준 라이브러리, 링커)\n# 이 프로그램이 어떻게 CPU 위에서 돌 수 있나? → '''Compilation System''' (컴파일러, 어셈블러, 로더)\n# 문자열이 어떻게 모니터에 표시되나? → '''Operating System''' (device driver)\n# 이 프로그램이 어떻게 다른 프로그램들과 동시에 실행되나? → '''Operating System''' (scheduler, [[컨텍스트 스위치|context switch]], IPC)\n\n즉 `hello.c` 한 줄을 완전히 설명하려면 시스템 프로그램 세 갈래가 전부 필요하다. 1강 p.31에서 같은 슬라이드에 답이 덮어씌워지며 끝난다.\n\n[[img:L1-27.png|1강 p.27. vi로 짜고 → Compile → Load → Execute. 마지막 화살표에 \"hello.out converts from an executable to a task\"라는 문장이 붙는다. 프로그램이 프로세스가 되는 지점이 바로 여기다.|large]]\n\n=== printf() vs write() ===\n\n[[img:L1-30.png|1강 p.30. Application Program → Library function printf() → write() wrapper → write() system call. 점선이 user space와 OS의 경계.|medium]]\n\n`printf()`는 '''라이브러리 함수'''라서 아직 user space에 있다. 실제로 화면에 바이트를 뱉는 건 `write()` '''[[시스템 콜]]'''이고, 그 사이에 얇은 wrapper가 한 겹 끼어 있다. 점선을 넘어가는 순간 [[유저 모드와 커널 모드|모드 전환]]이 일어난다.\n\n{tip}\n0831 녹음본에서 교수님이 짚은 포인트: \"이 file descriptor는 '''operating system이''' 세팅해 주는 것이라 standard library를 쓰지 않아도 된다. 원칙적으로는 라이브러리 없이 system call만 직접 써서 데이터를 쓸 수 있다.\" → 라이브러리는 편의, [[시스템 콜]]이 본체.\n{/tip}\n\n== OS가 실제로 관리하는 것들 ==\n\n1강 p.28 \"Operating System: Summary\"가 이 과목 전체의 목차나 다름없다.\n\n{| class=\"table\"\n! 역할 || 담당 자원 || 개념 || 시스템 콜 예시\n|-\n| '''Task manager''' || CPU || schedule, IPC, signal, [[컨텍스트 스위치|context switch]] || [[fork]], [[exec|execv]], [[wait]], getpid, pthread_create\n|-\n| '''Virtual Memory''' || Main memory || page, segment, address translation, LRU || brk, (malloc, free)\n|-\n| '''File system''' || Storage || file, directory, disk scheduling, FAT || open, read, write, pipe, (fopen, printf)\n|-\n| '''Device driver''' || Device || I/O port, interrupt, DMA || open, read, write, ioctl\n|-\n| '''Network protocol''' || Network || connection, routing, fragmentation || socket, bind, listen, send, receive\n|}\n\n중간고사 범위(3~9강)는 이 표의 '''첫 줄, Task manager''' 하나를 파고드는 것이다.\n\n[[img:L1-22.png|1강 p.22. User Program / OS / Hardware 3층 구조와, 그 경계에 놓인 System call interface.|large]]\n\n== Three Easy Pieces ==\n\n교재 제목이 곧 OS의 3대 주제다. 2강은 이 셋을 순서대로 하나씩 아이스크림 비유 → 개념 → 실제 C 코드 데모로 소개한다.\n\n<pre class=\"ascii\">\n                  ┌──────────────────────────────────┐\n   Task   Task    │        응용 프로그램들            │   Task\n     │      │     └──────────────────────────────────┘     │\n     ▼      ▼                                              ▼\n ══════════════ System call interface ═══════════════════════   ← 시스템 콜\n ┌───────────────────────────────────────────────────────────┐\n │                          OS                               │   ← 커널\n └───────────────────────────────────────────────────────────┘\n        │                    │                    │\n        ▼                    ▼                    ▼\n   ┌─────────┐          ┌─────────┐         ┌──────────┐\n   │  Disk   │          │   CPU   │         │  Memory  │\n   └─────────┘          └─────────┘         └──────────┘\n   ③ Storage            ① CPU               ② Memory\n     가상화               가상화               가상화\n     = 영속성              = 가상화             = 주소 공간\n<\/pre>\n\n{| class=\"table\"\n! Piece || 질문 || 해답 || 아이스크림 비유\n|-\n| '''[[가상화]]''' (Virtualization) || How can we own the shared resource? || 물리 자원을 가상 형태로 변환해 각자 독차지한 것처럼 보이게 || 직원은 한 명인데 주문은 10개 → '''time-sharing'''으로 시간대를 쪼개 각 주문마다 전담 직원이 있는 척\n|-\n| '''[[동시성]]''' (Concurrency) || How can we overlap the task? || 작업들을 번갈아 실행해 겹치게 — 대신 공유 데이터가 깨진다 || 100개짜리 대량 주문 뒤에 선 손님이 하루를 기다리면 안 되니, 잘라서 번갈아 처리\n|-\n| '''[[영속성]]''' (Persistence) || 전원이 꺼져도 데이터를 어떻게 살리나? || 파일 시스템 + 디스크 || 손님이 안 오는 픽업 주문을 녹게 두지 말고 '''냉장고'''에 넣기\n|}\n\n[[img:L2-09.png|2강 p.9. 같은 그림에 ① CPU / ② Memory / ③ Storage Virtualization이 빨간 점선으로 표시된 장. \"Sometimes, we refer to the OS as a virtual machine.\"|large]]\n\n=== 왜 자원 관리자인가 ===\n\n{def}\n'''The OS is a Resource Manager''' (2강 p.7)<br>\nThe OS manages resources such as CPU, memory and disk: many programs to run → '''sharing the CPU'''; many programs to concurrently access their own instructions and data → '''sharing memory'''; many programs to access devices → '''sharing storage'''.\n{/def}\n\n핵심 단어는 전부 '''sharing'''이다. 자원이 하나뿐인데 요구자가 여럿일 때 생기는 문제 — 그게 OS가 존재하는 이유 전체다.\n\n== 보호와 격리 ==\n\n2강 p.5의 키오스크 비유가 곧 '''protection'''의 정의다.\n\n[[img:L2-05.png|2강 p.5. 진상 손님(malicious user)이 와도 주방에 못 들어오게 벽을 세우고 키오스크만 준다. 단, 메뉴에 있는 건 뭐든 주문할 수 있게.|medium]]\n\n* 손님이 '''조리대를 직접 건드리게'''(= 유저 프로그램이 커널 자료구조를 직접 수정) 두면 안 된다\n* 아무 주문이나 다 받아도(= 아무 명령이나 실행 허용) 안 된다\n* 해법: '''벽을 세우고 키오스크를 준다''' = [[유저 모드와 커널 모드|모드 분리]] + [[시스템 콜]]이라는 정해진 입구\n* 단, '''메뉴에 있는 건 뭐든 주문 가능''' = 정당한 요청은 전부 처리해 준다 (기능을 줄여서 보호하는 게 아니다)\n\n이 아이디어를 하드웨어로 구현한 게 4강의 [[제한적 직접 실행]]이다.\n\n== 설계 목표 ==\n\n2강 마지막 두 장이 [[OS 설계 목표]]를 정리한다. 요약하면 abstraction / performance / protection / reliability, 그리고 energy-efficiency · security · portability.\n\n{warn}\n'''Protection과 Isolation은 같은 항목이다.''' 슬라이드 문장은 \"Protection between applications — Isolation: '''Bad behavior of one does not harm other and the OS itself'''\". 즉 격리의 보호 대상에 '''OS 자신도 포함'''된다. \"다른 앱만 보호한다\"로 외우면 틀린다.\n{/warn}\n\n== OS의 계보 ==\n\n1강·2강 슬라이드에는 OS 연대기 장이 따로 없고, 대신 3강 p.4에서 stored program computer(von Neumann, 1945)를, p.5~6에서 x86의 진화를 훑는다. 시험 범위 밖일 가능성이 높지만 맥락용으로 [[OS 역사]]에 정리해 두었다.\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' 다음 설명에 해당하는 용어를 쓰시오.<br>\n\"Computer software designed to provide services to other software, responsible for the management of hardware devices, and supporting environments for users and application programs.\"\n{/quiz}\n{answer}\n'''System Program'''(시스템 프로그램). 1강 p.18의 정의 3개를 그대로 붙인 문장이다. Operating System이라고 쓰면 오답 — OS는 시스템 프로그램의 '''세 갈래 중 하나'''다.\n{/answer}\n\n{quiz}\n'''(분류)''' 다음 중 슬라이드 p.19의 '''Operating System''' 박스 안에 들어 있지 '''않은''' 것을 모두 고르시오.<br>\n① Scheduler ② Loader ③ Virtual Memory ④ Shell ⑤ Device Driver ⑥ Protocol Stack ⑦ Linker\n{/quiz}\n{answer}\n'''② Loader, ④ Shell, ⑦ Linker.'''<br>\n· Loader와 Linker는 '''(1) Compilation System'''<br>\n· Shell은 '''(2) Runtime System'''<br>\nOS 박스 안: Scheduler, IPC, File System, Device Driver, Virtual Memory, Protocol Stack.\n{/answer}\n\n{quiz}\n'''(개념)''' `printf(\"hello\\n\")` 한 줄이 실행될 때, user space와 커널의 경계를 넘는 지점은 정확히 어디인가? 한 문장으로 답하시오.\n{/quiz}\n{answer}\n`printf()`(라이브러리 함수)가 내부에서 `write()` wrapper를 호출하고, 그 wrapper가 '''`write()` [[시스템 콜]]을 호출하는 순간''' 경계를 넘는다. `printf()` 자체는 끝까지 user space 코드다. (1강 p.30)\n{/answer}\n\n{quiz}\n'''(서술)''' OS를 \"virtual machine\"이라고 부르는 이유를 [[가상화]]의 정의를 써서 한 문장으로 설명하시오.\n{/quiz}\n{answer}\nOS가 물리 자원(CPU·memory·disk)을 받아 더 일반적이고 강력하며 쓰기 쉬운 '''virtual form'''으로 변환해, 각 프로그램에게 자기만의 기계가 있는 듯한 환상을 제공하기 때문이다. (2강 p.9)\n{/answer}\n\n== 시험 대비 핵심 요약 ==\n\n# '''OS = resource manager + service provider for user programs.''' 이 한 줄이 1강 p.22의 정의다.\n# 컴퓨터 시스템 = Hardware System + Software System, Software = '''System Programs + Application Programs'''. OS는 System Program의 부분집합.\n# 시스템 프로그램 3분류: '''Compilation System''' (compiler/assembler/linker/loader/editor/debugger) / '''Runtime System''' (library/shell/commands/utilities/windows) / '''Operating System''' (scheduler/IPC/file system/device driver/virtual memory/protocol stack). ← 2025F Problem 1 출제\n# 시스템 프로그램의 정의 3가지: 다른 '''소프트웨어'''에 서비스 / 하드웨어 장치 관리 / 사용자·응용 프로그램 지원 환경.\n# Three easy pieces = '''[[가상화]] · [[동시성]] · [[영속성]]'''. 각각 CPU/Memory, 겹쳐 실행, 디스크 담당.\n# CPU 가상화의 비결은 '''time-sharing''', 메모리 가상화의 비결은 '''private virtual address space'''.\n# 보호는 \"기능을 줄이는 것\"이 아니라 \"'''입구를 하나로 좁히는 것'''\" — 키오스크 = [[시스템 콜]].\n# Isolation의 보호 대상에는 다른 응용 프로그램뿐 아니라 '''OS 자신'''도 포함된다.\n# `printf()`는 라이브러리, `write()`가 시스템 콜. stdin/stdout/stderr file descriptor는 '''OS가''' 열어 준다.\n\n== 관련 문서 ==\n* [[가상화]] — three easy pieces 1번\n* [[동시성]] — three easy pieces 2번\n* [[영속성]] — three easy pieces 3번\n* [[커널]] / [[시스템 콜]] / [[유저 모드와 커널 모드]]\n* [[OS 설계 목표]] / [[OS 역사]]\n* [[프로세스]] — 3강, \"실행 중인 프로그램\"의 정식 이름\n* [[제한적 직접 실행]] — 4강, 보호를 하드웨어로 구현하는 법\n* [[OSTEP]] / [[xv6]]"
 },
