  "body": "'''turnaround time'''(반환 시간)은 job이 '''완료된 시각에서 시스템에 도착한 시각을 뺀 값'''이다. [[스케줄링 지표]] 중 '''성능(performance)''' 지표를 대표한다.\n\n{def}\n'''Turnaround time''': The time at which the job completes minus the time at which the job arrived in the system.\n$$T_{turnaround} = T_{completion} - T_{arrival}$$\n{/def}\n\n{analogy}'''택배 주문'''이다. turnaround time은 \"주문 버튼을 누른 순간부터 물건이 내 손에 들어올 때까지\"의 전체 시간이다. 중간에 창고에서 얼마나 기다렸는지, 실제 배송이 몇 분 걸렸는지는 상관없다 — 내가 체감하는 건 총 소요 시간뿐이다. 반대로 [[response time]]은 \"주문 확인 문자가 몇 초 만에 왔나\"에 해당한다.{/analogy}\n\n== 계산 예 ==\n\n<pre class=\"txt\">\n [[FIFO]], A(100) B(10) C(10), 전부 t≈0 도착\n A: 0 ──────────── 100    turnaround = 100 − 0 = 100\n B:            100 ─ 110   turnaround = 110 − 0 = 110\n C:                110 ─ 120  turnaround = 120 − 0 = 120\n 평균 = 330 / 3 = 110초\n\n [[SJF]]로 순서만 바꾸면\n B: 0 ─ 10                 turnaround =  10\n C:    10 ─ 20             turnaround =  20\n A:       20 ──────── 120  turnaround = 120\n 평균 = 150 / 3 = 50초\n<\/pre>\n\n'''실행 시간의 총합은 120초로 똑같은데 평균이 110 → 50초로 바뀌었다.''' 스케줄링 순서만으로 얻는 이득이 이만큼 크다는 게 이 지표의 교훈이다.\n\n[[img:L5-13.png|SJF로 순서를 바꾸면 같은 워크로드에서 평균 turnaround가 110초에서 50초로|medium]]\n\n{warn}'''도착 시각을 반드시 뺀다.''' 5강 p.14 예제에서 B·C가 t=10에 도착하므로 turnaround는 $110-10 = 100$, $120-10=110$이다. 완료 시각을 그대로 더하면 오답이다.\n\n단, 2025F 중간고사 Problem 3처럼 '''문제가 \"turnaround = 끝나는 시각\"이라고 새로 정의해 주는 경우'''도 있다. 그럴 땐 문제의 정의를 따른다. → [[2025F 중간고사 족보]]{/warn}\n\n== 어떤 정책이 최적화하나 ==\n\n* 모든 job이 '''동시에 도착'''하면 [[SJF]]가 평균 turnaround의 '''최적''' 정책이다 (짧은 것부터 돌리면 뒤에서 기다리는 총 시간이 최소).\n* 도착 시각이 다르면 [[STCF]](SJF + [[선점]])가 최적.\n* [[Round Robin]]은 '''최악'''이다. 모든 job을 조금씩 늘여서 다 같이 늦게 끝내기 때문.\n\n{exam}모의 퀴즈 A8에서 \"Round Robin optimizes turnaround time\"을 '''참'''이라고 답해 틀렸다. RR이 최적화하는 건 [[response time]]이다. 기억법: '''R'''ound '''R'''obin → '''R'''esponse.{/exam}\n\n== 관련 문서 ==\n* [[스케줄링 지표]] · [[response time]] · [[fairness]]\n* [[SJF]] · [[STCF]] — turnaround 최적화\n* [[Round Robin]] — turnaround 최악\n* [[스케줄링]]"
 },
 "response time": {
  "title": "response time (응답 시간)",
  "category": [
   "5강 Process Scheduling",
   "용어"
  ],
  "body": "'''response time'''(응답 시간)은 job이 도착한 뒤 '''처음으로 스케줄되기까지'''의 시간이다. [[turnaround time]]만으로는 설명할 수 없는 '''대화형(interactive)''' 시스템의 체감 성능을 재기 위해 도입됐다.\n\n{def}\n'''Response time''': The time from when the job arrives to the first time it is scheduled.\n$$T_{response} = T_{firstrun} - T_{arrival}$$\n{/def}\n\n{analogy}'''식당의 두 시계'''를 생각하면 된다. [[turnaround time]]은 \"들어가서 밥 다 먹고 나올 때까지\", response time은 \"자리에 앉고 나서 '''종업원이 물을 갖다 줄 때까지'''\"다. 배치 작업은 앞 시계만 보고, 터미널 앞에 앉은 사람은 뒤 시계만 본다. 물이 3초 만에 나오면 음식이 좀 늦어도 참을 만하지만, 30분 동안 아무도 안 오면 그냥 나가 버린다.{/analogy}\n\n== 왜 필요했나 ==\n\n[[STCF]]는 turnaround의 최적 정책이지만, 슬라이드가 못을 박는다.\n\n{def}\n* STCF would be a great policy for '''early batch computing''' — e.g., assign a bunch of jobs to the machine and check results the next day.\n* STCF is '''not suitable for time-shared machines''' where multiple users and jobs share the same machine — e.g., users would sit at a terminal and demand interactive results.\n* → A new metric is required: '''response time'''.\n{/def}\n\n{exam}'''모의 퀴즈 A7에서 정확히 이 문장을 뒤집어 틀렸다.''' 문제: \"STCF is a good policy for time-shared machines where users sit at terminals and expect interactive results.\" → '''거짓'''. 이 슬라이드가 존재하는 이유 자체가 \"STCF로는 안 되니 response time이라는 새 지표가 필요하다\"이다.\n\n한 줄 암기: '''STCF = batch / turnaround. interactive엔 RR.'''{/exam}\n\n== 계산 예 ==\n\n[[img:L5-20.png|같은 워크로드에서 SJF는 평균 response 5초, RR(슬라이스 1초)은 1초|large]]\n\nA, B, C가 t=0에 동시 도착, 각 5초.\n\n<pre class=\"txt\">\n [[SJF]]:  A A A A A | B B B B B | C C C C C\n   response: A = 0−0 = 0,  B = 5−0 = 5,  C = 10−0 = 10\n   평균 = (0 + 5 + 10) / 3 = 5초\n\n [[Round Robin]] (슬라이스 1초): A B C A B C A B C A B C A B C\n   response: A = 0,  B = 1,  C = 2\n   평균 = (0 + 1 + 2) / 3 = 1초\n<\/pre>\n\n슬라이스를 더 줄이면 response는 더 좋아진다. 다만 [[time slice]]가 짧아질수록 [[컨텍스트 스위치]] 비용이 전체를 잡아먹으므로 한계가 있다.\n\n{warn}'''선점당한 뒤 재개하는 시각은 세지 않는다.''' [[STCF]]에서 A가 t=0에 실행을 시작했다가 t=10에 선점당하고 t=30에 재개하면, A의 response time은 $30-0$이 아니라 '''$0-0 = 0$'''이다. \"first time it is scheduled\"의 first를 놓치면 계산이 전부 틀어진다.{/warn}\n\n[[sim:sched_gantt]]\n\n== 관련 문서 ==\n* [[스케줄링 지표]] · [[turnaround time]] · [[fairness]]\n* [[Round Robin]] — response 최적화\n* [[time slice]] — 슬라이스 길이와 response의 trade-off\n* [[MLFQ]] — turnaround와 response를 동시에 노린다"
 },
 "FIFO": {
  "title": "FIFO (First In, First Out)",
  "category": [
   "5강 Process Scheduling",
   "정책"
  ],
  "body": "'''FIFO'''(First In, First Out) = '''FCFS'''(First Come, First Served)는 도착한 순서대로 job을 끝까지 실행하는 가장 단순한 [[스케줄링]] 정책이다. 슬라이드 평가는 \"Very simple and easy to implement\" 한 줄이 전부다.\n\n{analogy}'''은행 번호표'''다. 1번부터 차례로 부르고, 한 번 부른 사람은 용무가 끝날 때까지 창구를 차지한다. 공평해 보이지만 앞사람이 부동산 대출 상담을 시작하면 뒤에서 잔액 조회 하나 하려던 사람들이 전부 40분을 기다린다. 이게 [[convoy effect]]다.{/analogy}\n\n== 가정이 유지될 때 ==\n\n[[img:L5-10.png|FIFO: A, B, C가 각 10초. 평균 turnaround = (10+20+30)/3 = 20초|medium]]\n\n'''워크로드 가정 1'''(모든 job이 같은 시간 실행)이 살아 있으면 FIFO도 나쁘지 않다. A, B, C가 각 10초면 평균 [[turnaround time]]은 $(10+20+30)/3 = 20$초로, 어떤 정책을 써도 이보다 못한 게 나오기 어렵다.\n\n{info}녹음본에서 교수님이 짚은 포인트: 모든 job이 '''동시에 도착하고 길이도 같으면''' 애초에 \"첫 번째\"라는 개념이 없고, 어떤 정책을 써도 '''random policy와 결과가 같다'''. FIFO의 장단점은 가정을 풀어야만 보인다.{/info}\n\n== 가정 1을 풀면 무너진다 ==\n\n[[img:L5-11.png|A=100초, B=C=10초. FIFO면 평균 turnaround가 110초|medium]]\n\n<pre class=\"txt\">\n A(100) → B(10) → C(10)\n A: 0 ──────────────────── 100   turnaround = 100\n B:                   100 ── 110  turnaround = 110\n C:                        110 ── 120  turnaround = 120\n 평균 = (100 + 110 + 120) / 3 = 110초\n<\/pre>\n\n10초짜리 B, C가 100초를 기다렸다. 해법은 순서를 바꾸는 것 — [[SJF]].\n\n== 시험에서 ==\n\n{exam}2025F 중간고사 '''Problem 2 (용어 단답형)'''에 \"짧은 작업들이 무거운 작업 뒤에 줄 서는 현상 (2 words)\"이 나왔고 정답은 '''Convoy effect'''였다. FIFO 자체보다 '''FIFO의 문제점 이름'''이 출제 대상이다. → [[convoy effect]], [[2025F 중간고사 족보]]{/exam}\n\n{|\n! 항목 || FIFO\n|-\n| 최적화 || 없음 (구현 단순함이 유일한 장점)\n|-\n| 나쁜 지표 || [[turnaround time]], [[response time]] 둘 다\n|-\n| [[선점]]? || '''✗ 비선점'''\n|-\n| 무너지는 지점 || 워크로드 가정 1 해제 → [[convoy effect]]\n|}\n\n[[sim:sched_gantt]]\n\n== 관련 문서 ==\n* [[스케줄링]] · [[convoy effect]] · [[SJF]]\n* [[스케줄링 지표]] · [[turnaround time]]"
 },
 "SJF": {
  "title": "SJF (Shortest Job First)",
  "category": [
   "5강 Process Scheduling",
   "정책"
  ],
  "body": "'''SJF'''(Shortest Job First)는 '''가장 짧은 job부터''' 실행하고, 그다음 짧은 것, 하는 식으로 진행하는 [[스케줄링]] 정책이다. [[FIFO]]의 [[convoy effect]]를 순서 하나로 해결한다.\n\n{def}\n'''SJF''': Run the shortest job first, then the next shortest, and so on.\n{/def}\n\n{analogy}'''마트의 \"10개 이하 전용 계산대\"'''다. 우유 한 팩 사러 온 사람을 카트 세 대 뒤에 세우지 말고 먼저 보내면, 전체 대기 시간의 합이 확 줄어든다. 우유 손님이 잃는 시간은 30초인데 카트 손님이 절약해 주는 시간은 수십 분이기 때문이다.{/analogy}\n\n== 얼마나 좋아지나 ==\n\n[[img:L5-13.png|SJF: B(10) C(10) A(100). 평균 turnaround = (10+20+120)/3 = 50초|medium]]\n\n<pre class=\"txt\">\n 같은 워크로드 A=100, B=C=10\n [[FIFO]] 평균 [[turnaround time]] = 110초\n SJF  평균 turnaround time = (10 + 20 + 120) / 3 = 50초\n<\/pre>\n\n{info}'''모든 job이 동시에 도착한다면 SJF는 평균 turnaround time의 최적(optimal) 정책'''이다. 증명 아이디어: 인접한 두 job의 순서를 바꿔 보면, 짧은 쪽을 앞에 둘 때 항상 합이 작아진다(exchange argument).{/info}\n\n== 가정 2를 풀면 무너진다 ==\n\n[[img:L5-14.png|A는 t=0 도착(100초), B·C는 t=10 도착(각 10초). SJF는 비선점이라 A를 멈추지 못한다|medium]]\n\nSJF는 '''비선점(non-preemptive)'''이다. 일단 A를 시작했으면 끝까지 돌린다.\n\n<pre class=\"txt\">\n A: 0 ──────────────── 100        turnaround = 100 − 0  = 100\n B:                100 ── 110      turnaround = 110 − 10 = 100\n C:                     110 ── 120 turnaround = 120 − 10 = 110\n 평균 = (100 + 100 + 110) / 3 = 103.33초\n<\/pre>\n\n50초였던 게 103.33초로 되돌아갔다. [[convoy effect]]가 부활한 것이다. 해법은 [[선점]]을 붙이는 것 → [[STCF]].\n\n{warn}'''SJF의 또 다른 치명적 문제: 실행 시간을 미리 알아야 한다.''' 워크로드 가정 4가 그것인데, 현실의 OS는 프로그램이 얼마나 돌지 '''전혀 모른다'''. 이 가정을 푸는 게 [[MLFQ]]의 출발점이다.{/warn}\n\n{|\n! 항목 || SJF\n|-\n| 최적화 || '''[[turnaround time]]''' (단, 동시 도착일 때만 최적)\n|-\n| 나쁜 지표 || [[response time]] (긴 job은 한참 뒤에야 첫 실행)\n|-\n| [[선점]]? || '''✗ 비선점'''\n|-\n| 무너지는 지점 || 가정 2 해제(늦은 도착) / 가정 4(실행 시간을 알아야 함)\n|}\n\n[[sim:sched_gantt]]\n\n== 관련 문서 ==\n* [[STCF]] — SJF에 선점을 더한 것\n* [[FIFO]] · [[convoy effect]] · [[선점]]\n* [[스케줄링]] · [[turnaround time]]"
 },
 "STCF": {
  "title": "STCF (Shortest Time-to-Completion First)",
  "category": [
   "5강 Process Scheduling",
   "정책"
  ],
  "body": "'''STCF'''(Shortest Time-to-Completion First)는 [[SJF]]에 '''[[선점]](preemption)'''을 더한 정책이다. '''PSJF'''(Preemptive Shortest Job First), 교과서에 따라 '''SRTF'''(Shortest Remaining Time First)라고도 부른다.\n\n{def}\n'''STCF''': Add preemption to SJF. Also known as '''Preemptive Shortest Job First (PSJF)'''.\nA new job enters the system →\n* Determine the run time of the '''remaining''' jobs and new job\n* Schedule the job which has the '''least time left'''\n{/def}\n\n{analogy}'''응급실 트리아지'''다. 일반 [[SJF]]가 \"접수 순서대로 가장 가벼운 환자부터\"라면, STCF는 '''치료 중이던 환자도 중단시키고''' 더 빨리 끝날 환자를 먼저 본다. 전체 대기 시간의 합은 최소가 되지만, 오래 걸리는 환자는 계속 밀려나서 영영 치료를 못 받을 수도 있다(starvation).{/analogy}\n\n== 계산 ==\n\n[[img:L5-16.png|t=10에 B·C가 도착하면 A를 선점. 평균 turnaround = 50초|medium]]\n\n<pre class=\"txt\">\n A: t=0 도착, 100초 / B, C: t=10 도착, 각 10초\n\n t=0   A 실행 (남은 100)\n t=10  B(10), C(10) 도착. A 남은 90 > 10 → '''A를 선점'''\n t=10~20  B 실행 → 완료\n t=20~30  C 실행 → 완료\n t=30~120 A 재개 → 완료\n\n [[turnaround time]]\n   A = 120 − 0  = 120\n   B =  20 − 10 =  10\n   C =  30 − 10 =  20\n   평균 = 150 / 3 = '''50초'''   ([[SJF]]의 103.33초 대비)\n\n [[response time]]\n   A = 0 − 0  = 0     ← 선점 전 t=0에 이미 한 번 실행됐다\n   B = 10 − 10 = 0\n   C = 20 − 10 = 10\n   평균 = 10 / 3 ≈ 3.33초\n<\/pre>\n\n== 두 가지 약점 ==\n\n=== 1. Starvation ===\n\n[[img:L5-17.png|10초짜리 job이 계속 들어오면 A(100초)는 영원히 CPU를 못 받는다|medium]]\n\nA가 100초 남았는데 t=10부터 10초짜리 B, C, D, E, … 가 계속 도착하면, 언제나 새 job의 남은 시간이 A보다 짧다. → '''A will never receive any CPU time'''. 같은 문제가 [[MLFQ]]에서 다시 나오고, 거기서는 '''priority boost(Rule 5)'''로 해결한다.\n\n=== 2. response time이 나쁘다 ===\n\n긴 job은 한참 뒤에야 첫 실행을 받는다. 터미널 앞 사용자에겐 최악이다. 그래서 [[response time]]이라는 새 지표와 [[Round Robin]]이 등장한다.\n\n{exam}'''모의 퀴즈 A7·A8을 짝으로 틀린 지점 — 반드시 표로 외울 것.'''\n\n{|\n! || 최적화 || 나쁨 || 어울리는 환경\n|-\n| '''STCF''' || '''[[turnaround time]]''' || [[response time]] || early '''batch''' computing\n|-\n| '''[[Round Robin]]''' || '''[[response time]]''' || [[turnaround time]] (Terrible) || time-shared / '''interactive'''\n|}\n\n슬라이드 원문 그대로: \"STCF is '''not suitable''' for time-shared machines where multiple users and jobs share the same machine.\"{/exam}\n\n[[sim:sched_gantt]]\n\n{|\n! 항목 || STCF\n|-\n| 최적화 || '''[[turnaround time]]''' (도착 시각이 달라도 최적)\n|-\n| 나쁜 지표 || [[response time]], [[fairness]]\n|-\n| [[선점]]? || '''✓ 선점'''\n|-\n| 전제 || 워크로드 가정 4 (실행 시간을 안다)\n|}\n\n== 관련 문서 ==\n* [[SJF]] · [[선점]] · [[Round Robin]]\n* [[MLFQ]] — 실행 시간을 모르면서 STCF를 근사한다\n* [[스케줄링]] · [[turnaround time]] · [[response time]]"
 },
 "Round Robin": {
  "title": "Round Robin (RR) 스케줄링",
  "category": [
   "5강 Process Scheduling",
   "정책"
  ],
  "body": "'''Round Robin'''(RR)은 job을 [[time slice]]만큼만 실행하고 run queue의 '''다음 job으로 넘기는''' 것을 반복하는 [[스케줄링]] 정책이다. '''time slicing scheduling'''이라고도 한다.\n\n{def}\n'''Round Robin''': Run a job for a '''time slice''' (or a scheduling quantum) and then switch to the next job in the run queue, until the jobs are finished. It repeatedly does so until the jobs are finished.\nThe length of a time slice must be a '''multiple of the timer-interrupt period'''.\n→ '''RR is fair, but performs poorly on metrics such as turnaround time.'''\n{/def}\n\n{analogy}'''돌림 노래''' 또는 '''회전 초밥'''이다. 모두가 조금씩 차례로 받는다. 누구도 굶지 않고(공정), 누구나 금방 첫 입을 먹는다([[response time]] 최고). 대신 '''배부르게 먹고 자리를 뜨는 시점은 모두 늦어진다'''([[turnaround time]] 최악). 한 사람이 한 접시를 통째로 먹고 가는 편이 그 사람에겐 빨랐을 것이다.{/analogy}\n\n== 계산 예 ==\n\n[[img:L5-20.png|A·B·C 각 5초. 위는 SJF(평균 response 5초), 아래는 RR 슬라이스 1초(평균 response 1초)|large]]\n\n<pre class=\"txt\">\n A, B, C 동시 도착, 각 5초. RR 슬라이스 = 1초\n A B C A B C A B C A B C A B C\n\n [[response time]] : A=0, B=1, C=2      → 평균 (0+1+2)/3 = '''1초'''\n [[turnaround time]]: A=13, B=14, C=15   → 평균 '''14초'''\n\n 같은 워크로드를 [[SJF]]로 돌리면\n [[response time]] : 0, 5, 10           → 평균 '''5초'''\n [[turnaround time]]: 5, 10, 15          → 평균 '''10초'''\n<\/pre>\n\nresponse는 5배 좋아졌고 turnaround는 1.4배 나빠졌다. 이게 RR의 전부다.\n\n{exam}'''모의 퀴즈 A8: \"Round Robin optimizes turnaround time\" → 거짓.''' RR이 최적화하는 건 [[response time]]이다. 슬라이드 요약 원문: \"RR alternates between all jobs and thus '''optimizes response time''' — '''Terrible''' for turnaround time.\"\n\n기억법: '''R'''ound '''R'''obin → '''R'''esponse.{/exam}\n\n== time slice 길이 ==\n\n[[time slice]]가 짧을수록 response는 좋아지지만 [[컨텍스트 스위치]] 횟수가 늘어난다. 자세한 것은 [[time slice]] 문서.\n\n{warn}'''슬라이스는 timer-interrupt period의 배수여야 한다.''' 타이머가 10ms마다 울린다면 슬라이스는 10·20·30ms만 가능하다. CPU만 쓰는 job에서 OS가 CPU를 되찾을 유일한 수단이 [[타이머 인터럽트]]이기 때문이다. 녹음본에서도 교수님이 \"one second should be the multiple of the timer period\"라고 명시했다.{/warn}\n\n== 왜 turnaround가 구조적으로 나쁜가 ==\n\nRR은 '''모든 job을 최대한 늘여서 다 같이 늦게 끝내는''' 정책이다. 짧은 job도 다른 job들과 번갈아 도느라 자기 실행 시간의 $n$배 가까운 시간이 지나야 끝난다. 반대로 말하면 이건 [[fairness]]가 극대화된 상태이기도 하다 — 2025F 중간고사 Problem 3(b)에서 \"total fairness를 최대화하라\"의 출발점이 RR인 이유다. → [[2025F 중간고사 족보]]\n\n[[sim:sched_gantt]]\n\n{|\n! 항목 || Round Robin\n|-\n| 최적화 || '''[[response time]]''', [[fairness]]\n|-\n| 나쁜 지표 || '''[[turnaround time]] (Terrible)'''\n|-\n| [[선점]]? || '''✓ 선점''' (타이머로 슬라이스 종료)\n|-\n| 핵심 파라미터 || [[time slice]] (타이머 주기의 배수)\n|}\n\n== 관련 문서 ==\n* [[time slice]] · [[response time]] · [[fairness]]\n* [[STCF]] — 정반대 성격의 정책\n* [[MLFQ]] — 같은 큐 안에서는 RR을 쓴다 (Rule 2)\n* [[타이머 인터럽트]] · [[컨텍스트 스위치]]"
 },
 "time slice": {
  "title": "time slice (타임 슬라이스 / scheduling quantum)",
  "category": [
   "5강 Process Scheduling",
   "용어"
  ],
  "body": "'''time slice'''(타임 슬라이스) = '''scheduling quantum'''은 한 job이 [[선점]]당하기 전까지 연속으로 CPU를 쓸 수 있는 시간 길이다. [[Round Robin]]과 [[MLFQ]]의 핵심 파라미터이며, 그 길이 하나로 스케줄러의 성격이 통째로 바뀐다.\n\n{analogy}'''발표 시간 타이머'''다. 한 사람당 1분씩 주면 모두가 금방 마이크를 잡아 보지만(빠른 [[response time]]), 마이크를 넘기느라 시간을 다 쓴다([[컨텍스트 스위치]] 오버헤드). 10분씩 주면 마이크 넘기는 횟수는 줄지만 뒷사람은 한참 기다린다. '''발표 시간 = 반응성과 오버헤드의 trade-off.'''{/analogy}\n\n== 두 가지 제약 ==\n\n=== 1. 타이머 주기의 배수여야 한다 ===\n\n{def}\nThe length of a time slice must be a '''multiple of the timer-interrupt period'''.\n{/def}\n\n[[타이머 인터럽트]]가 10ms마다 울린다면 OS가 CPU를 되찾을 수 있는 순간도 10ms 간격뿐이다. 따라서 슬라이스는 10, 20, 30ms … 만 가능하다. 7ms짜리 슬라이스는 물리적으로 만들 수 없다.\n\n=== 2. 길이 자체가 trade-off ===\n\n{|\n! 슬라이스 || [[response time]] || 오버헤드\n|-\n| '''짧다''' || '''좋음''' || '''나쁨''' — the cost of context switching will '''dominate''' overall performance\n|-\n| '''길다''' || 나쁨 || 좋음 — '''amortize''' the cost of switching\n|}\n\n{exam}녹음본(2026-09-09)에서 교수님이 든 숫자를 그대로 옮긴다.\n* [[컨텍스트 스위치]] 비용 ≈ '''100 사이클 이상, 대략 1μs'''.\n* 슬라이스 1ms → 오버헤드 '''0.1%'''\n* 슬라이스 10ms → 오버헤드 '''0.01%''' (amortize 성공)\n* 대신 10ms 슬라이스면 job이 많을 때 response time이 초 단위로 늘어난다.\n* 교수님 예시: \"League of Legends 같은 실시간 게임에서는 10ms만 늘어도 user experience가 확 나빠진다.\"\n\n슬라이드 노란 박스: \"Deciding on the length of the time slice presents a '''trade-off to a system designer'''.\" 서술형으로 나오면 '''짧으면 response↑/오버헤드↑, 길면 amortize↑/response↓''' 양쪽을 다 써야 만점이다.{/exam}\n\n<pre class=\"txt\">\n 오버헤드 = 전환 비용 / (슬라이스 + 전환 비용)\n\n 전환 1μs, 슬라이스 1μs   →  1/2      = 50%    ← 일을 거의 못 한다\n 전환 1μs, 슬라이스 1ms   →  1/1001   ≈ 0.1%\n 전환 1μs, 슬라이스 10ms  →  1/10001  ≈ 0.01%\n<\/pre>\n\n== MLFQ에서는 큐마다 다르다 ==\n\n[[img:L5-41.png|Q2=10ms, Q1=20ms, Q0=40ms. 높은 큐는 짧게, 낮은 큐는 길게|medium]]\n\n* 높은 우선순위 큐 → 대화형 job이 모여 있으니 '''짧은 슬라이스''' (10ms 이하)\n* 낮은 우선순위 큐 → CPU-bound job이니 '''긴 슬라이스''' (100ms)\n* Solaris 기본값: 최고 우선순위 20ms → 최하위 수백 ms\n\n== 고정 슬라이스를 버린 스케줄러 ==\n\n[[CFS]]는 '''고정 time slice 개념 자체가 없다'''. 대신 [[sched_latency]]를 프로세스 수 $n$으로 나눠 슬라이스를 '''동적으로''' 계산하고, [[min_granularity]]로 하한을 둔다. → [[비례 지분 스케줄링]]\n\n== 관련 문서 ==\n* [[Round Robin]] · [[MLFQ]] · [[컨텍스트 스위치]] · [[타이머 인터럽트]]\n* [[response time]] — 슬라이스가 직접 좌우하는 지표\n* [[sched_latency]] · [[min_granularity]] — CFS의 동적 슬라이스"
 },
 "MLFQ": {
  "title": "MLFQ (Multi-Level Feedback Queue)",
  "category": [
   "5강 Process Scheduling",
   "핵심"
  ],
  "body": "'''MLFQ'''(Multi-Level Feedback Queue, 다단계 피드백 큐)는 '''job의 실행 시간을 전혀 모르는 상태에서''' [[STCF]]의 [[turnaround time]]과 [[Round Robin]]의 [[response time]]을 동시에 노리는 [[스케줄링]] 정책이다. 1962년 Corbató가 CTSS에서 만들었고, 그 공로로 튜링상을 받았다.\n\n{def}\n'''MLFQ의 목표 (슬라이드 p.28 원문)'''\nReal-world workloads are the mixture of batch and interactive jobs, '''without any prior knowledge'''.\nThe goal of MLFQ is to (1) '''optimize turnaround time''' for batch jobs while (2) '''minimizing response time''' for interactive jobs.\n\n'''두 가지 기술적 난제'''\n* How to decide type of jobs (batch or interactive)?\n* How to know run-times of job? (← 워크로드 가정 4)\n→ MLFQ '''learns from the past''' to predict the type and runtime of jobs.\n{/def}\n\n{analogy}MLFQ는 '''처음 보는 손님을 일단 VIP로 모시는 식당'''이다. 누가 에스프레소 한 잔만 마시고 갈 사람이고 누가 3시간 코스를 시킬 사람인지 알 방법이 없다. 그러니 '''전부 VIP석(최상위 큐)에 앉힌다.''' 커피만 마시고 갈 사람은 금방 일어나니 VIP석이 아깝지 않고, 계속 눌러앉는 손님은 알아서 뒷자리로 옮겨진다. '''손님이 자기 행동으로 스스로 정체를 증명하게 만드는 것''' — 이게 \"feedback\"이다.{/analogy}\n\n== 기본 구조 ==\n\n[[img:L5-30.png|MLFQ 정적 스냅샷. Q8(최고)~Q1(최저). A·B는 Q8, C는 Q4, D는 Q1|medium]]\n\n* 우선순위가 다른 '''여러 개의 큐'''를 유지한다.\n* 실행 준비가 된 job은 '''정확히 하나의 큐'''에만 들어 있다.\n* 높은 큐의 job이 먼저 선택되고, '''같은 큐 안에서는 [[Round Robin]]'''.\n\n위 그림의 상태라면 A와 B만 RR로 번갈아 돌고 '''C와 D는 영원히 못 돈다'''. 우선순위가 고정이면 이런 일이 생긴다는 걸 보여주려고 넣은 슬라이드다. 그래서 '''우선순위를 바꿔야''' 한다.\n\n== 5가지 규칙 ==\n\n{def}\n'''The refined set of MLFQ rules (슬라이드 p.43 원문 그대로)'''\n\n* '''Rule 1''': If Priority(A) > Priority(B), '''A runs''' (B doesn't).\n* '''Rule 2''': If Priority(A) = Priority(B), A & B run in '''RR'''.\n* '''Rule 3''': When a job '''enters the system''', it is placed at the '''highest priority'''.\n* '''Rule 4''':\n** If a job '''uses up an entire time slice''' while running, its priority is '''reduced''' (i.e., it moves down on queue);\n** If a job '''gives up the CPU before the time slice is up''', it '''stays at the same priority''' level;\n** '''Once a job uses up its time slice at a given level, its priority is reduced.'''\n* '''Rule 5''': After some time period '''S''', move '''all the jobs''' in the system to the '''topmost queue'''.\n{/def}\n\n{info}'''Rule 4의 세 줄이 왜 세 줄인가.''' 원래 슬라이드 p.32에서는 Rule 4a(슬라이스 소진 → 하락) / Rule 4b(먼저 반납 → 유지) 두 개였다. 그런데 4b를 악용하는 '''gaming''' 공격이 가능해서(p.39), \"한 레벨에서 '''누적'''해서 슬라이스를 다 쓰면 하락\"이라는 세 번째 줄을 붙여 하나의 Rule 4로 합친 것이다. 이 '''누적분'''을 allotment(할당량)라 부른다.{/info}\n\n[[sim:mlfq]]\n\n== 우선순위를 바꾸는 원리 ==\n\n{def}\nMLFQ varies the priority of a job based on its '''observed behavior'''.\n* A job repeatedly '''relinquishes the CPU''' while waiting for I/Os (e.g., keyboard) → this is how an '''interactive''' process might behave → keep its priority '''high''' w/ '''short''' time slice → better '''response time'''\n* A job '''uses the CPU intensively''' for long periods → this is how a '''batch''' job might behave → '''reduce''' its priority w/ '''long''' time slice → better '''turnaround time'''\n{/def}\n\n== 단계별 예제 ==\n\n=== 예제 1 — 긴 job 하나 ===\n\n3개 큐(Q2 > Q1 > Q0), [[time slice]] 10ms.\n\n<pre class=\"ascii\">\n Q2 ████                                  ← Rule 3으로 Q2 진입, 10ms 소진\n Q1     ████                              ← Rule 4로 하락, 또 10ms 소진\n Q0         ████████████████████████████  ← 바닥까지 내려가 계속 실행\n    0      20        50       100      200 (ms)\n<\/pre>\n\n긴 job은 '''자기 행동으로 스스로 바닥까지 내려간다.''' 아무도 \"너는 batch야\"라고 알려 주지 않았는데도.\n\n=== 예제 2 — 짧은 job이 끼어들면 ===\n\n[[img:L5-34.png|A는 긴 CPU job(Q0에서 실행 중), B는 20ms짜리 짧은 job이 t=100에 도착. \"Behave like STCF\"|medium]]\n\n<pre class=\"txt\">\n t<100   A가 Q0에서 실행 중 (이미 바닥까지 내려감)\n t=100   B 도착 → '''Rule 3'''으로 '''Q2''' 진입 → Rule 1에 의해 A를 밀어내고 즉시 실행\n t=110   B가 10ms 슬라이스 소진 → '''Rule 4'''로 Q1 하락, 계속 실행\n t=120   B 완료 (총 20ms)\n t>120   A가 Q0에서 재개\n<\/pre>\n\n'''결과가 [[STCF]]와 같다.''' 슬라이드의 빨간 글씨 \"Behave like STCF\"가 그 뜻이다.\n\n{exam}'''서술형 단골: \"MLFQ는 실행 시간을 모르는데 어떻게 STCF를 근사하는가?\"'''\n\n슬라이드 p.35의 세 문장이 모범답안이다.\n# MLFQ doesn't know whether a job will be short or long-running, so it '''first assumes it might be a short job''', thus giving the job '''high priority'''.\n# If it '''actually is a short job''', it will run quickly and complete.\n# If it is '''not''' a short job, it will '''slowly move down the queues''', and thus soon '''prove itself''' to be a long-running, more batch-like process.\n\n녹음본에서 교수님이 여기에 \"'''this is quite important'''\"를 붙이며 이유까지 설명했다 — I/O-intensive job은 우선순위를 빨리 줘야 의미가 있고, CPU-intensive batch job은 어차피 completion이 멀어서 분류에 시간을 좀 써도 손해가 아니다.{/exam}\n\n=== 예제 3 — I/O 하는 대화형 job ===\n\nA는 긴 CPU job, B는 '''1ms만 CPU를 쓰고 I/O를 하는''' 대화형 job.\n\n<pre class=\"ascii\">\n Q2 ▌  ▌  ▌  ▌  ▌  ▌  ▌  ▌      ← B: 매번 슬라이스 전에 CPU 반납 → Rule 4로 '''Q2 유지'''\n Q1\n Q0  ██  ██  ██  ██  ██  ██     ← A: B가 I/O 나간 틈에만 실행\n    0    50    100   150   200 (ms)\n<\/pre>\n\n슬라이드 노란 박스: \"The MLFQ approach '''keeps an interactive job at the highest priority'''.\" → [[response time]] 확보. [[I/O와 스케줄링]]과 같은 원리다.\n\n== 기본 MLFQ의 세 가지 문제 ==\n\nRule 1~4만으로는 문제가 셋 생긴다.\n\n{|\n! 문제 || 내용 || 해법\n|-\n| '''Starvation''' || 대화형 job이 \"too many\"면 긴 job은 CPU를 영영 못 받음 || '''Rule 5''' (priority boost)\n|-\n| '''행동 변화''' || CPU-bound → I/O-bound로 바뀌어도 '''최하위 큐에 갇힘''' || '''Rule 5''' (priority boost)\n|-\n| '''Gaming(공격)''' || 슬라이스 끝나기 '''직전에''' CPU 반납 → I/O 집약처럼 보이지만 실은 CPU 독점. 슬라이드 표현으로 '''\"Sort of security threat\"''' || '''Rule 4''' (better accounting)\n|}\n\n=== Rule 5 — The Priority Boost ===\n\n[[img:L5-38.png|왼쪽(부스트 없음): A가 Q0에서 starvation. 오른쪽(부스트 있음): S마다 전부 Q2로 올라온다|large]]\n\n{def}\n'''Rule 5''': After some time period '''S''', move '''all the jobs''' in the system to the '''topmost queue'''.\n{/def}\n\n* '''왼쪽''': 긴 job A + 짧은 대화형 B·C. t≈100 이후 B·C가 Q2를 점유하고 A는 Q0에서 '''Starvation'''.\n* '''오른쪽''': 시간 S마다 A가 Q2로 끌려 올라와 조금씩이라도 돈다. 기아 해결 + 행동이 바뀐 프로세스의 구제도 동시에 해결.\n\n$S$ 정하기는 어렵다. 너무 크면 기아가 길고, 너무 작으면 대화형 job이 손해를 본다. Solaris 기본값은 '''약 1초'''.\n\n=== Rule 4 — Better Accounting ===\n\n[[img:L5-39.png|왼쪽(누적 없음): gaming 성공, Q2에 눌러앉아 CPU 독점. 오른쪽(누적함): 결국 Q0까지 내려간다|large]]\n\nCPU를 자진 반납했다고 '''사용량 카운터를 리셋하지 않고 그 레벨에서 누적'''한다. 슬라이스가 10ms라면, 9.9ms씩 쓰고 반납하는 짓을 두 번 하면 누적 19.8ms > 10ms이므로 하락시킨다. → gaming tolerance.\n\n== 파라미터 튜닝 ==\n\n[[img:L5-41.png|큐마다 슬라이스를 다르게: Q2=10ms, Q1=20ms, Q0=40ms|medium]]\n\n* 큐를 몇 개? 큐마다 [[time slice]]는? 부스트 주기 $S$는?\n* 슬라이드 원문: \"'''There are no easy answers to these questions.''' Only some experience with workloads and subsequent tuning of the scheduler will lead to a satisfactory balance.\"\n* 원칙: '''높은 큐 = 짧은 슬라이스''' (대화형), '''낮은 큐 = 긴 슬라이스''' (CPU-bound).\n* '''Solaris''' 기본값: 큐 '''60개''', 슬라이스 최고 20ms → 최하위 수백 ms, 부스트 '''약 1초'''.\n\n{joke}Solaris 슬라이드의 마지막 줄이 \"But you know, '''no one touches the default'''\". 60개짜리 테이블을 관리자가 마음대로 고칠 수 있게 만들어 놨는데 아무도 안 고친다는 교수님의 코멘트다.{/joke}\n\n== 예상 문제 ==\n\n{quiz}\n3개 큐(Q2 > Q1 > Q0), 각 큐의 [[time slice]]는 10ms로 동일, priority boost 주기 $S$ = 50ms라고 하자.\nJob A는 t=0에 도착한 100ms짜리 순수 CPU job, Job B는 t=25에 도착해 '''5ms 실행 후 I/O를 반복'''하는 대화형 job이다.\n\n'''(a)''' t=0 ~ 25 동안 A는 어느 큐에 있는가?\n'''(b)''' t=25에 B가 도착하면 무슨 일이 일어나는가? 적용되는 Rule 번호를 쓰라.\n'''(c)''' B는 왜 계속 Q2에 머무는가?\n'''(d)''' t=50의 priority boost 직후 A와 B는 각각 어느 큐에 있는가?\n{/quiz}\n\n{answer}\n'''(a)''' A는 Rule 3으로 t=0에 '''Q2'''에 들어간다. 10ms를 다 쓰면 '''Rule 4'''로 Q1 하락(t=10), 또 10ms를 다 쓰면 Q0 하락(t=20). 따라서 t=20부터 25까지는 '''Q0'''에 있다.\n\n<pre class=\"txt\">\n t= 0~10  Q2 (A)\n t=10~20  Q1 (A)\n t=20~25  Q0 (A)\n<\/pre>\n\n'''(b)''' B는 '''Rule 3'''(새 job은 최상위 큐)으로 '''Q2'''에 들어간다. 그러면 '''Rule 1'''(Priority(B) > Priority(A))에 의해 A는 '''즉시 선점'''되고 B가 실행된다.\n\n'''(c)''' B는 5ms만 쓰고 I/O를 위해 CPU를 '''스스로 반납'''한다. 슬라이스 10ms를 다 쓰지 않았으므로 '''Rule 4'''의 두 번째 줄(\"gives up the CPU before the time slice is up → stays at the same priority level\")에 따라 Q2에 머문다.\n\n{warn}단, '''누적(allotment)'''이 적용되는 개정된 Rule 4에서는 5ms + 5ms = 10ms가 되는 순간 하락한다. 문제에 \"better accounting을 적용한다\"는 말이 있으면 '''두 번째 5ms 실행 후 Q1으로 내려간다'''고 답해야 한다. 이 차이가 gaming 방지의 전부다.{/warn}\n\n'''(d)''' '''Rule 5'''에 의해 t=50에 '''시스템의 모든 job'''이 최상위 큐로 이동한다. 따라서 A도 B도 '''둘 다 Q2'''. 그 뒤 Rule 2에 의해 둘이 RR로 번갈아 돌다가, A가 슬라이스를 다 쓰면 다시 내려가기 시작한다. Rule 5의 목적이 정확히 이것 — A의 starvation 방지다.\n{/answer}\n\n{quiz}\n악의적인 프로세스가 [[time slice]] 10ms 중 9ms만 쓰고 의미 없는 I/O를 호출해 CPU를 반납하는 짓을 반복한다. (a) 이 공격의 이름은? (b) 기본 Rule 4a/4b에서는 왜 통하는가? (c) 어떻게 막는가?\n{/quiz}\n\n{answer}\n'''(a)''' '''Gaming''' (the scheduler). 슬라이드 원문: \"Malicious process returns the CPU '''right before the deadline'''. Looks like I/O intensive, but CPU-intensive in real. '''Sort of security threat'''.\"\n\n'''(b)''' Rule 4b가 \"슬라이스가 끝나기 전에 CPU를 놓으면 우선순위 유지\"라고만 되어 있어서, 9ms를 쓰고 반납하면 카운터가 '''리셋'''되고 최상위 큐에 영원히 남는다. 결과적으로 CPU의 90%를 독점한다.\n\n'''(c)''' '''Better accounting''' — 개정된 Rule 4: \"Once a job uses up its time slice '''at a given level''', its priority is reduced.\" 한 레벨에서 쓴 시간을 '''누적(allotment)'''하고, 누적분이 슬라이스에 도달하면 하락시킨다. 9ms + 9ms = 18ms > 10ms이므로 두 번째 반납에서 바로 하락한다.\n{/answer}\n\n== 시험 대비 핵심 요약 ==\n\n# MLFQ의 목표: '''실행 시간을 모르면서''' batch의 turnaround와 interactive의 response를 동시에 잡는다. 방법은 '''learn from the past'''.\n# '''Rule 1~5를 영어 문장 그대로''' 외울 것. 특히 Rule 4의 세 줄.\n# Rule 3(새 job은 최상위) + 스스로 내려가기 = '''STCF 근사'''. \"일단 짧다고 가정하고, 아니면 스스로 증명하게 한다\".\n# 기본형의 세 문제 = '''starvation / 행동 변화 / gaming'''.\n# 해법 = '''Rule 5 priority boost'''(앞 둘) + '''Rule 4 better accounting'''(gaming).\n# 같은 큐 안에서는 '''[[Round Robin]]''' (Rule 2).\n# 튜닝 원칙: 높은 큐 = 짧은 슬라이스, 낮은 큐 = 긴 슬라이스. 정답은 없다. Solaris = 60큐 / 20ms~수백ms / 1초 부스트.\n\n== 관련 문서 ==\n* [[스케줄링]] · [[STCF]] · [[Round Robin]] · [[time slice]]\n* [[I/O와 스케줄링]] — 대화형 job이 우선순위를 유지하는 원리\n* [[선점]] · [[컨텍스트 스위치]]\n* [[CFS]] — MLFQ가 규칙 5개로 만든 \"대화형 우선\"을 [[vruntime]] 하나로 얻는다"
 },
 "convoy effect": {

  "body": "'''convoy effect'''(호위 효과)는 '''짧은 작업 여러 개가 무거운 작업 하나 뒤에 줄을 서서 다 같이 기다리게 되는''' 현상이다. [[FIFO]]가 무너지는 이유이자, 2025F 중간고사에 '''용어 단답형'''으로 실제 출제된 단어다.\n\n{def}\n'''Convoy effect''': A number of relatively-short potential consumers of a resource get '''queued behind a heavyweight resource consumer'''.\ne.g., Imagine that, in a single line at a grocery store, you are behind the person with '''three carts'''.\n{/def}\n\n{analogy}슬라이드의 비유가 이미 완벽하다 — '''마트 계산대에서 카트 세 대를 끌고 온 사람 뒤에 선 것'''이다. 내가 살 건 껌 한 통인데 앞사람의 스캔이 끝날 때까지 20분을 서 있어야 한다. 이름의 유래는 '''호송 선단(convoy)''' — 느린 화물선 한 척 때문에 함대 전체가 그 속도로 움직여야 하는 상황이다.{/analogy}\n\n== 언제 생기나 ==\n\n[[img:L5-11.png|A=100초, B=C=10초를 FIFO로. 10초짜리가 100초를 기다린다|medium]]\n\n<pre class=\"txt\">\n A(100) B(10) C(10)을 [[FIFO]]로\n A: 0 ──────────────── 100\n B:                100 ── 110   ← 10초짜리가 100초를 기다림\n C:                     110 ── 120\n 평균 [[turnaround time]] = 110초\n<\/pre>\n\n'''워크로드 가정 1'''(모든 job이 같은 시간 실행)이 풀리는 순간 발생한다. 실행 시간이 다 같으면 \"무거운 작업\"이라는 개념 자체가 없으므로 생길 수 없다.\n\n== 해법 ==\n\n{|\n! 정책 || convoy effect || 이유\n|-\n| '''[[FIFO]]''' || '''발생''' || 도착 순서를 절대 안 바꿈\n|-\n| '''[[SJF]]''' || 해결 (동시 도착 시) || 짧은 것부터 돌림\n|-\n| '''[[SJF]]''' || '''재발''' (늦은 도착 시) || '''비선점'''이라 이미 시작한 긴 job을 못 멈춤\n|-\n| '''[[STCF]]''' || 해결 || [[선점]]으로 긴 job을 밀어냄\n|-\n| '''[[Round Robin]]''' || 해결 || 애초에 아무도 오래 붙잡지 못함\n|}\n\n{exam}'''2025F 중간고사 Problem 2 (용어 단답형)에 그대로 출제됐다.'''\n> \"짧은 작업들이 무거운 작업 뒤에 줄 서는 현상 '''(2 words)'''\" → '''Convoy effect'''\n\nProblem 2는 '''정의를 주고 영어 용어를 쓰게 하는''' 형식이고, 단어 수 힌트가 붙는다. 슬라이드의 영어 정의 문장을 통째로 외워 두면 역방향(용어 → 정의)도 대비된다. → [[2025F 중간고사 족보]]{/exam}\n\n[[sim:sched_gantt]]\n\n== 관련 문서 ==\n* [[FIFO]] · [[SJF]] · [[STCF]] · [[선점]]\n* [[스케줄링]] · [[turnaround time]]\n* [[2025F 중간고사 족보]] · [[자주 틀리는 함정 모음]]"
 },

   "용어"
  ],
  "body": "'''선점'''(preemption)은 실행 중인 [[프로세스]]를 '''끝나기 전에 강제로 중단시키고''' 다른 프로세스에 CPU를 넘기는 것이다. 이게 가능해야 [[STCF]]·[[Round Robin]]·[[MLFQ]] 같은 정책을 만들 수 있다.\n\n{analogy}'''노래방 강제 종료 버튼'''이다. 비선점(non-preemptive)은 부르던 노래가 끝날 때까지 기다리는 것이고, 선점은 3분이 지나면 반주가 끊기는 것이다. 마이크를 자발적으로 놓아 주길 기다리면([[협력적 방식]]) 5절까지 부르는 사람이 나오고, 결국 '''타이머로 끊는 수밖에 없다'''([[비협력적 방식]]).{/analogy}\n\n== 메커니즘: 누가 끊어 주나 ==\n\n선점은 정책이 아니라 '''메커니즘이 있어야 가능한 일'''이다. 4강 [[제한적 직접 실행]]에서 배운 그대로다.\n\n<pre class=\"ascii\">\n 유저 프로세스 실행 중\n        │\n        │  ⏰ [[타이머 인터럽트]] (부팅 때 OS가 켜 둠, 몇 ms마다)\n        ▼\n 하드웨어가 현재 프로세스를 정지 → 커널 모드 진입\n        │\n        ▼\n [[스케줄러]]: \"계속 돌릴까, 바꿀까?\"\n        │  바꾼다\n        ▼\n [[컨텍스트 스위치]] → 다른 프로세스 실행\n<\/pre>\n\n{warn}'''모의 퀴즈 A5에서 틀린 지점.''' 타이머는 '''부팅 시퀀스에서 OS가''' 켠다. 유저 프로그램은 타이머를 켜지도 끄지도 못한다 — 만약 끌 수 있다면 무한 루프 프로세스가 타이머를 꺼 버리고 CPU를 영원히 독점할 수 있다. 타이머 설정은 '''[[특권 명령]]'''이다.{/warn}\n\n== 선점 여부로 본 정책들 ==\n\n{|\n! 정책 || [[선점]] || 결과\n|-\n| [[FIFO]] || ✗ || 긴 job이 끝날 때까지 못 바꿈 → [[convoy effect]]\n|-\n| [[SJF]] || ✗ || 늦게 온 짧은 job이 앞으로 못 감 → 103.33초\n|-\n| '''[[STCF]]''' || '''✓''' || 남은 시간이 더 짧은 job이 오면 즉시 교체 → 50초\n|-\n| '''[[Round Robin]]''' || '''✓''' || [[time slice]]마다 무조건 교체\n|-\n| '''[[MLFQ]]''' || '''✓''' || Rule 1(높은 큐 우선) + Rule 4(슬라이스 소진)\n|}\n\n[[img:L5-16.png|STCF: t=10에 B·C가 도착하자 실행 중이던 A를 선점한다|medium]]\n\n== 선점의 비용 ==\n\n공짜가 아니다. 선점할 때마다 [[컨텍스트 스위치]]가 일어나고, 녹음본 기준 '''100 사이클 이상(약 1μs)'''이 든다. 게다가 7강에서 보듯 다른 CPU로 옮겨 가면 [[cache affinity]]까지 잃는다. 그래서 [[time slice]] 길이 결정이 trade-off가 된다.\n\n{info}'''선점 ≠ 우선순위 역전 해결.''' 선점 가능한 시스템에서도 낮은 우선순위 스레드가 락을 쥔 채 선점당하면 [[priority inversion]]이 생긴다. 이건 9강 [[락]]의 주제다.{/info}\n\n== 관련 문서 ==\n* [[STCF]] · [[Round Robin]] · [[MLFQ]] · [[SJF]]\n* [[타이머 인터럽트]] · [[컨텍스트 스위치]] · [[제한적 직접 실행]]\n* [[협력적 방식]] · [[비협력적 방식]] · [[스케줄러]]"
 },
 "I/O와 스케줄링": {
  "title": "I/O와 스케줄링 (Incorporating I/O)",
  "category": [
   "5강 Process Scheduling",
   "용어"
  ],
  "body": "워크로드 '''가정 3'''(\"모든 job은 CPU만 쓴다\")을 풀면 [[스케줄링]]에 새 문제가 생긴다. job이 I/O를 요청하면 CPU에서 내려와야 하고, 그동안 CPU를 놀릴 것이냐가 문제다. 답은 '''overlap(겹치기)'''이다.\n\n{analogy}'''세탁기와 요리'''다. 세탁기를 돌려 놓고(I/O 요청) 30분간 멍하니 세탁기 앞에 서 있는 사람은 없다. 그 시간에 요리를 한다(다른 job 실행). 빨래가 끝나면 알림이 울리고(완료 [[인터럽트]]) 그때 널면 된다. '''기계가 일하는 동안 사람이 노는 게 진짜 낭비''' — 이게 CPU utilization의 전부다.{/analogy}\n\n== 문제 상황 ==\n\nA와 B가 각각 CPU 시간 50ms를 필요로 한다. A는 '''10ms 돌고 I/O 요청'''(각 I/O는 10ms)을 반복하고, B는 I/O 없이 CPU만 50ms 쓴다. 스케줄러는 [[STCF]].\n\n[[img:L5-23.png|위: A의 I/O 동안 CPU를 놀려 140ms. 아래: overlap으로 B를 끼워 넣어 100ms|large]]\n\n<pre class=\"ascii\">\n ❌ Poor Use of Resources\n CPU  A····A····A····A····A····      B B B B B\n Disk     ▓▓▓▓ ▓▓▓▓ ▓▓▓▓ ▓▓▓▓ ▓▓▓▓\n      0    20   40   60   80  100  120  140 (ms)\n      → A가 I/O 하는 동안 CPU가 '''놀고 있다'''. 총 140ms.\n\n ✅ Overlap Allows Better Use of Resources\n CPU  A B  A B  A B  A B  A B\n Disk   ▓▓▓▓ ▓▓▓▓ ▓▓▓▓ ▓▓▓▓ ▓▓▓▓\n      0    20   40   60   80  100 (ms)\n      → A가 I/O로 나간 10ms 동안 '''B를 CPU에''' 올린다. 총 100ms.\n<\/pre>\n\n{def}\n* When a job initiates an '''I/O request''': the job is '''blocked''' waiting for I/O completion → the scheduler should schedule '''another job''' on the CPU.\n* When the I/O '''completes''': an '''interrupt''' is raised → the OS moves the process from '''blocked''' back to the '''ready''' state.\n{/def}\n\n== 왜 STCF가 알아서 이걸 하나 ==\n\n핵심 아이디어: '''A의 각 10ms CPU 구간을 독립된 짧은 sub-job으로 취급'''한다. 그러면 남은 시간이 10ms인 A 조각이 50ms짜리 B보다 짧으므로 [[STCF]]가 자연스럽게 A를 먼저 돌린다. A가 I/O로 나가면 CPU에 남은 건 B뿐이니 B가 돈다. 정책을 고칠 필요가 없다.\n\n== 프로세스 상태와의 연결 ==\n\n3강의 [[프로세스 상태]] 기계가 여기서 쓰인다.\n\n<pre class=\"ascii\">\n              I/O 요청\n   Running ──────────────► Blocked\n      ▲                       │\n      │ 스케줄               │ I/O 완료 ([[인터럽트]])\n      │                       ▼\n    Ready ◄─────────────── Ready\n<\/pre>\n\n{exam}[[MLFQ]]와 이어서 볼 것. MLFQ에서 '''대화형 job이 최상위 큐에 머무는 이유'''가 바로 이 I/O 행동이다 — 슬라이스를 다 쓰기 전에 CPU를 반납하므로 Rule 4에 의해 우선순위가 유지된다. [[CFS]]에서도 같은 일이 벌어진다 — 자는 동안 [[vruntime]]이 안 늘어서 깨어나면 우선 선택된다. '''\"I/O job은 어느 스케줄러에서나 우대받는다, 다만 메커니즘이 다르다\"'''가 한 줄 정리다.{/exam}\n\n== 관련 문서 ==\n* [[스케줄링]] · [[STCF]] · [[MLFQ]]\n* [[프로세스 상태]] · [[인터럽트]]\n* [[CFS]] — vruntime으로 같은 효과를 얻는 방법"
 },
 "fairness": {
  "title": "fairness (공정성)",
  "category": [
   "5강 Process Scheduling",
   "용어"
  ],
  "body": "'''fairness'''(공정성)는 여러 job이 CPU를 '''얼마나 고르게 나눠 받았는가'''를 재는 [[스케줄링 지표]]다. 5강에서는 \"성능과 자주 충돌한다\"는 한 줄로만 등장하지만, 6강 [[비례 지분 스케줄링]]에서 '''수치로 정의'''되고 2025F 중간고사에서는 '''계산 문제'''로 나왔다.\n\n[[img:L6-03.png|6강 p.3 — 또 하나의 지표, Fairness|medium]]\n\n{def}\n5강 p.9 / 6강 p.3: \"Another metric: '''Fairness'''. Performance and fairness are '''often at odds''' in scheduling.\"\n6강 p.19 (정량 정의): '''F''' = the time the '''first''' job completes divided by the time that the '''second''' job completes.\n$$F = \\frac{T_{first}}{T_{second}}$$\n{/def}\n\n{analogy}'''피자 나누기'''다. 성능(=[[turnaround time]])만 보면 제일 배고픈 사람에게 몰아주는 게 \"효율적\"일 수 있지만, 그건 공정하지 않다. fairness는 '''모두가 비슷한 크기의 조각을 비슷한 시점에 받았는가'''를 본다. 그래서 [[Round Robin]]처럼 한 조각씩 돌리는 정책이 fairness에서는 만점이고 turnaround에서는 빵점이다.{/analogy}\n\n== 값의 범위 ==\n\n<pre class=\"txt\">\n 실행 시간이 같은 두 job이 있을 때\n   완전히 순차 실행: 하나는 10에, 다른 하나는 20에 완료\n     F = 10 / 20 = '''0.5'''   ← 최악\n   거의 동시에 완료: 둘 다 20에 완료\n     F = 20 / 20 = '''1'''     ← 완벽\n → F는 0.5 ~ 1 사이\n<\/pre>\n\n{warn}'''기호가 강의마다 바뀐다.''' 6강 p.19에서는 '''F (fairness metric)''', 7강 p.3에서는 같은 정의를 '''U (unfairness metric)'''이라고 쓴다. 값과 정의는 동일하다. 시험에 어느 글자로 나오든 '''\"먼저 끝난 시각 / 나중 끝난 시각\"'''이라는 정의로 답하면 된다.{/warn}\n\n== 성능과의 충돌 ==\n\n{|\n! 정책 || [[turnaround time]] || fairness\n|-\n| [[STCF]] || '''최적''' || 최악 (긴 job starvation)\n|-\n| [[Round Robin]] || 최악 || '''최적'''\n|-\n| [[Lottery 스케줄링]] || 신경 안 씀 || 확률적으로 보장\n|-\n| [[Stride 스케줄링]] || 신경 안 씀 || '''결정적으로''' 정확히 보장\n|-\n| [[CFS]] / [[EEVDF]] || 신경 안 씀 || 보장 + 효율\n|}\n\n[[비례 지분 스케줄링]]은 아예 '''fairness 자체를 1순위 목표'''로 삼은 계열이다. 슬라이드가 못 박는다 — \"Not optimized for turnaround or response time.\"\n\n== 시험에서 ==\n\n{exam}'''2025F 중간고사 Problem 3에서 fairness 정의를 새로 주고 최적화를 시켰다.'''\n\n> 세 task의 완료 시각을 $T_1 \\le T_2 \\le T_3$이라 할 때 '''total fairness''' $F = \\dfrac{T_1}{T_2} + \\dfrac{T_2}{T_3}$.\n> (b) total fairness를 '''최대화'''하는 스케줄의 total turnaround time은? (4pts)\n\n이건 수업의 2-job 정의 $F = T_{first}/T_{second}$를 3-job으로 확장한 '''시험용 변형'''이다. 정의를 문제가 주니 그대로 따르면 된다.\n\nA=4, B=5, C=6, $T_3 = 15$ 고정에서:\n# $T_1$로 미분 → $1/T_2 > 0$ (항상 양수) → 경계 $T_1 = T_2 - 1$\n# $F = 1 - 1/T_2 + T_2/15$, $T_2$로 미분 → $1/T_2^2 + 1/15 > 0$ → 경계 $T_2 = T_3 - 1 = 14$\n# 따라서 $T_1 = 13, T_2 = 14, T_3 = 15$ → total turnaround = '''42'''\n\n교수님 해설 첫 줄이 \"You can maximize the total fairness by '''round robin'''\"이지만, 단순 RR(`ABCABCABCABCBCC`)은 $T_1=10,T_2=13$으로 $F \\approx 1.636$이라 '''최적이 아니다'''. 최적 스케줄은 `ABCABCABCBCCABC`처럼 '''셋이 13/14/15에 나란히 끝나게''' 만든 것이다. → [[2025F 중간고사 족보]]{/exam}\n\n== 관련 문서 ==\n* [[스케줄링 지표]] · [[turnaround time]] · [[response time]]\n* [[Round Robin]] · [[STCF]]\n* [[비례 지분 스케줄링]] · [[Lottery 스케줄링]] · [[Stride 스케줄링]]\n* [[2025F 중간고사 족보]]"
 },
 "비례 지분 스케줄링": {
  "title": "비례 지분 스케줄링 (Proportional Share)",
  "category": [
   "6강 Proportional Share",
   "핵심"
  ],
  "body": "'''비례 지분 스케줄링'''(proportional share) = '''공정 배분(fair-share) 스케줄링'''은 목표 자체가 5강과 다르다. [[turnaround time]]이나 [[response time]]을 줄이는 게 아니라, '''각 job이 CPU 시간의 몇 %를 받을지 보장'''하는 것이 목적이다.\n\n{def}\n'''Proportional share (or fair-share) scheduler''' (슬라이드 p.9 원문)\n* Guarantee that each job obtains a '''certain percentage of CPU time'''\n* '''Not optimized for turnaround or response time'''\n\n'''Why proportional share?'''\n* '''Fairness'''\n* '''Predictability''' — e.g.) Elevator\n{/def}\n\n{warn}'''시험 함정 1순위.''' \"비례 지분 스케줄러의 목표는?\"에 \"반환 시간/응답 시간 최적화\"라고 답하면 '''틀린다'''. 슬라이드에 \"Not optimized for turnaround or response time\"이라고 명시되어 있다. 목표는 '''[[fairness]] + predictability''' 딱 둘이다.{/warn}\n\n발전 순서는 '''[[Lottery 스케줄링]](확률적) → [[Stride 스케줄링]](결정적) → [[CFS]](리눅스 실제 구현) → [[EEVDF]](리눅스 6.6~)''' 네 단계다. 각 단계가 앞 단계의 어떤 약점을 고쳤는지로 기억하면 된다.\n\n{analogy}'''엘리베이터'''가 슬라이드에 나온 교수님의 비유다. 엘리베이터가 \"가장 빨리 내릴 사람부터\" 태우면 평균 대기 시간은 줄겠지만, 내가 언제 탈지 예측할 수 없다. 반면 순서가 정해져 있으면 느려도 '''언제쯤 내 차례인지 안다'''. 클라우드에서 \"이 VM은 CPU 25%를 보장\" 하고 파는 것도 같은 이야기다 — 빠름보다 '''약속대로''' 가 중요한 영역이 있다.{/analogy}\n\n== 티켓 — 모든 것의 기본 단위 ==\n\n{def}\n'''Tickets''': Represent the '''share of a resource''' that a process should receive. The '''percent of tickets''' represents its share of the system resource in question.\n{/def}\n\n예: 프로세스 A가 [[tickets|티켓]] 75장, B가 25장이면 A는 CPU의 '''75%''', B는 '''25%'''를 받는다. 티켓은 CPU뿐 아니라 메모리·네트워크 대역폭 등 어떤 자원에도 쓸 수 있는 일반적 개념이다.\n\n== Lottery 스케줄링 ==\n\n[[img:L6-12.png|총 100장 중 A가 0~74번, B가 75~99번. 난수 15개로 A 11번 / B 4번|medium]]\n\n{def}\n'''Lottery Scheduling''': The scheduler picks a '''winning ticket randomly''' → load the state of that winning process and runs it.\nThe '''longer''' these two jobs compete, the '''more likely''' they are to achieve the desired percentages.\n{/def}\n\n<pre class=\"txt\">\n 총 티켓 100장. A = 0~74 (75장), B = 75~99 (25장)\n 당첨 번호:  63 85 70 39 76 17 29 41 36 39 10 99 68 83 63\n 실행 결과:  A  B  A  A  B  A  A  A  A  A  A  B  A  B  A\n → 15번 중 B가 4번 ≈ 27%. 목표는 25%지만 '''정확히는 아니다'''.\n<\/pre>\n\n=== 티켓 메커니즘 세 가지 ===\n\n{|\n! 이름 || 내용 || 예시\n|-\n| '''Ticket currency''' || 사용자가 '''자기 화폐'''로 자기 job들에 티켓을 나눠 주면 시스템이 '''전역 화폐로 환산''' || 전역 200장, A·B가 100장씩. A가 자기 화폐 500씩 A1·A2에 → 각 전역 '''50장'''. B가 자기 화폐 10을 B1에 → 전역 '''100장'''\n|-\n| '''Ticket transfer''' || 프로세스가 티켓을 '''일시적으로 양도''' || client가 server에 티켓을 넘김 → server가 최고 속도로 처리 → 끝나면 돌려줌\n|-\n| '''Ticket inflation''' || 프로세스가 '''스스로 티켓 수를 늘리거나 줄임''' || 전역 200 → 300장, A가 100 → 200장. ⚠ 탐욕스러운 프로세스 하나가 머신을 독점할 수 있어 '''서로 신뢰하는 환경에서만''' 사용\n|}\n\n<pre class=\"txt\">\n currency 환산 공식\n   전역 티켓 = (사용자의 전역 티켓) × (job의 지역 티켓 / 사용자 지역 티켓 합)\n   A1 = 100 × (500 / 1000) = 50\n<\/pre>\n\n=== 구현 — 리스트 순회 ===\n\n[[img:L6-17.png|총 400장, A(100) → B(50) → C(250) 리스트를 순회하며 누적합이 당첨 번호를 넘는 순간|medium]]\n\n<pre class=\"c\">\n1   // counter: used to track if we've found the winner yet\n2   int counter = 0;\n3\n4   // winner: use some call to a random number generator to\n5   // get a value, between 0 and the total # of tickets\n6   int winner = getrandom(0, totaltickets);\n7\n8   // current: use this to walk through the list of jobs\n9   node_t *current = head;\n10\n11  // loop until the sum of ticket values is > the winner\n12  while (current) {\n13      counter = counter + current->tickets;\n14      if (counter > winner)\n15          break;                 // found the winner\n16      current = current->next;\n17  }\n18  // 'current' is the winner: schedule it...\n<\/pre>\n\n* 6행: 0 ~ (총 티켓 수 − 1) 중 하나를 뽑는다.\n* 13행: 리스트를 따라가며 티켓 수를 '''누적'''한다.\n* 14행: 누적합이 당첨 번호를 '''넘는 순간'''의 노드가 당첨자.\n* 예: `winner = 300`이면 A(100) → B(150) → C(400 > 300) → '''C 당첨'''.\n\n구현에 필요한 건 셋뿐이다 — 좋은 난수 생성기, 프로세스 리스트, 총 티켓 수. 이 단순함이 lottery의 최대 장점이다. 다만 '''시간 복잡도 O(n)'''이고, 이게 [[CFS]]가 등장하는 이유가 된다.\n\n=== 공정성 지표 ===\n\n[[img:L6-20.png|실행 시간 R을 1~1000으로 바꾸며 30회 평균. R이 클수록 F가 1에 수렴|medium]]\n\n$$F = \\frac{T_{first}}{T_{second}}$$\n\n티켓 수도 실행 시간도 같은 두 job인데 난수 때문에 하나가 먼저 끝난다. 이 불공정을 수치화한 것이 [[fairness|F]]다. R=1이면 0.5에서 시작해, '''실행 시간이 충분히 길면(= 슬라이스가 많으면) 1에 수렴'''한다.\n\n[[sim:stride_lottery]]\n\n== Stride 스케줄링 ==\n\n난수를 쓰지 않는 '''결정적(deterministic)''' 방식이다.\n\n{def}\n'''Stride Scheduling'''\n* Each process has a '''stride''', which is '''inverse in proportion to tickets''' it has\n* Each process maintains a '''pass''' value which is initially 0 and increases by its stride whenever the process runs\n* The scheduler picks the process to run that has the '''lowest pass''' value\n{/def}\n\n<pre class=\"c\">\ncurrent = remove_min(queue);        // pick client with minimum pass\nschedule(current);                  // use resource for quantum\ncurrent->pass += current->stride;   // compute next pass using stride\ninsert(queue, current);             // put back into the queue\n<\/pre>\n\n$$stride_i = \\frac{\\text{(a large number)}}{tickets_i}$$\n\n{analogy}이름 그대로 '''보폭(stride)'''이다. 티켓이 많은 프로세스는 '''종종걸음'''(작은 보폭)이라 같은 거리를 가는 데 여러 번 움직여야 하고, 티켓이 적은 프로세스는 '''성큼성큼'''(큰 보폭)이라 한 번에 멀리 간다. 스케줄러는 '''항상 가장 뒤처진 사람(pass 최소)'''에게 다음 한 걸음을 준다. 결국 종종걸음 프로세스가 훨씬 자주 걷게 된다.{/analogy}\n\n=== 계산 예 ===\n\n[[img:L6-25.png|A=100, B=50, C=250 티켓. 큰 수 10000 기준 stride는 100 / 200 / 40|medium]]\n\n<pre class=\"txt\">\n A: 10000 / 100 = stride '''100'''\n B: 10000 /  50 = stride '''200'''\n C: 10000 / 250 = stride '''40'''\n<\/pre>\n\n{|\n! Pass(A) (stride=100) || Pass(B) (stride=200) || Pass(C) (stride=40) || Who Runs?\n|-\n| 0 || 0 || 0 || '''A''' (동점 — 임의 선택)\n|-\n| 100 || 0 || 0 || '''B'''\n|-\n| 100 || 200 || 0 || '''C'''\n|-\n| 100 || 200 || 40 || '''C'''\n|-\n| 100 || 200 || 80 || '''C'''\n|-\n| 100 || 200 || 120 || '''A'''\n|-\n| 200 || 200 || 120 || '''C'''\n|-\n| 200 || 200 || 160 || '''C'''\n|-\n| 200 || 200 || 200 || … (한 사이클 종료)\n|}\n\n한 사이클에서 '''C 5번, A 2번, B 1번''' = 티켓 비율 250 : 100 : 50 = '''5 : 2 : 1 정확히 일치'''. 처음 동점에서 B를 먼저 골라도 결과 비율은 같다.\n\n{exam}'''표 읽는 법이 시험의 절반이다.''' 각 행의 pass 값은 '''그 행에서 실행하기 직전 상태'''이고, \"Who Runs?\"는 그중 최솟값을 가진 프로세스다. 실행한 뒤 그 프로세스의 pass에 stride를 더한 것이 '''다음 행'''이다. 이 규칙만 지키면 표는 기계적으로 채워진다.{/exam}\n\n=== 왜 그래도 Lottery를 쓰나 ===\n\n{|\n! || [[Lottery 스케줄링]] || [[Stride 스케줄링]]\n|-\n| 비율 달성 || '''확률적''' (오래 돌수록 수렴) || '''결정적''' (사이클마다 정확)\n|-\n| 전역 상태 || '''없음''' || [[pass]] 값을 모두 관리해야 함\n|-\n| 새 job 진입 || 총 티켓 수만 갱신하면 끝 || '''pass를 뭘로 줄지 문제''' — 0으로 두면 CPU 독점\n|}\n\n'''\"새 job의 pass 문제\"'''는 이 강의의 반복 주제다. [[CFS]]에서는 min_vruntime으로, [[EEVDF]]에서는 [[lag]]의 성질로 각각 해결된다.\n\n== CFS (Completely Fair Scheduler) ==\n\n리눅스가 2007년(커널 2.6.23)부터 2023년(6.6)까지 쓴 실제 스케줄러다. 출발점은 '''오버헤드'''다 — 공격적으로 최적화한 뒤에도 '''데이터센터 CPU 시간의 약 5%'''가 스케줄링에 쓰인다. 위 lottery 코드의 O(n) 순회가 그 예다.\n\n{def}\nThe Linux CFS implements fair-share scheduling in a highly efficient and scalable manner.\n* '''Not based on the concept of a fixed time slice''' (e.g., 10 ms)\n* CFS uses a counting-based technique, '''virtual runtime (vruntime)'''\n* As each process runs, it '''accumulates vruntime'''\n* CFS picks the process with the '''lowest vruntime''' to run next\n{/def}\n\n{analogy}[[vruntime]]은 '''각자 손목에 찬 시계'''다. CPU를 쓰는 동안만 시계가 돈다. 스케줄러는 방 안을 둘러보고 '''시계가 가장 적게 간 사람'''에게 다음 차례를 준다. 우선순위가 높은 사람의 시계는 '''천천히 가도록 조작'''되어 있어서(→ [[weight]]), 실제로 10초를 써도 시계에는 3.2초만 찍힌다. 그래서 계속 \"제일 덜 쓴 사람\"으로 뽑힌다.{/analogy}\n\n=== 동적 time slice ===\n\n[[img:L6-33.png|sched_latency 48ms. n=4면 슬라이스 12ms, C·D가 끝나 n=2가 되면 24ms로 자동 확대|large]]\n\n$$\\text{time slice} = \\frac{sched\\_latency}{n}$$\n\n* [[sched_latency]] = 한 프로세스가 전환을 고려하기 전까지 얼마나 돌아야 하는지의 기준. 이 기간 동안 CFS는 '''완전히 공정'''하다.\n* 예: sched_latency = 48ms, n = 4 → 슬라이스 '''12ms'''. C·D가 끝나 n = 2가 되면 '''24ms'''로 자동 확대.\n* 프로세스가 너무 많으면? n = 10 → 4.8ms → [[컨텍스트 스위치]] 폭증. 그래서 [[min_granularity]](리눅스 기본 '''6ms''')가 하한선을 둔다. 4.8ms는 6ms로 올림된다.\n\n=== nice와 weight ===\n\n[[img:L6-35.png|prio_to_weight[40] 테이블. nice 0 = 1024, 한 단계마다 약 1.25배|medium]]\n\n* [[nice]] 값의 범위는 '''−20 ~ +19''', 기본 '''0'''.\n* '''양수 = 낮은 우선순위''' (남에게 nice하게 양보), '''음수 = 높은 우선순위'''.\n* CFS는 nice를 [[weight]]로 매핑한다. nice 0 → weight '''1024'''.\n\n{|\n! nice || −20 || −15 || −10 || −5 || '''0''' || 5 || 10 || 15\n|-\n| weight || 88761 || 29154 || 9548 || '''3121''' || '''1024''' || 335 || 110 || 36\n|}\n\n[[img:L6-36.png|vruntime 공식과 nice −5 예제|medium]]\n\n$$vruntime_i = vruntime_i + \\frac{weight_0}{weight_i} \\cdot runtime_i$$\n\n* $runtime_i$ = 실제로 돈 물리 시간, $weight_0 = 1024$ (nice 0의 weight)\n* 예: nice = −5 → $weight_i = 3121$. 10초를 돌면\n$$\\Delta vruntime = \\frac{1024}{3121} \\times 10 = 0.328 \\times 10 = 3.2\\text{초}$$\n실제보다 작게 쌓이니 '''더 자주 선택'''된다.\n\n{warn}슬라이드의 \"a high priority (i.e., a '''low''' weight)\"는 '''오타에 가깝다'''. 공식과 예제 숫자가 기준이다 — 우선순위가 높으면 '''weight가 크고''', 그래서 $weight_0/weight_i$가 작아져 vruntime이 '''천천히''' 쌓인다. nice −5의 weight 3121이 nice 0의 1024보다 '''크다'''는 것이 증거.{/warn}\n\n=== red-black tree ===\n\n[[img:L6-38.png|vruntime 1,5,9,10,14,17,18,21,22,24를 담은 레드블랙 트리. 루트 14|medium]]\n\n* 리스트는 O(n)이라 확장성이 없다 → [[레드블랙 트리]] 사용.\n* '''runnable 프로세스만''' 트리에 둔다 — I/O나 네트워크를 기다리며 '''자는 프로세스는 제외'''.\n* '''[[vruntime]]을 키'''로 정렬.\n* 다음 job 찾기 = 가장 왼쪽 노드 제거 → '''O(1)''' (leftmost를 캐시). 되돌려 넣기(삽입) → '''O(log n)'''.\n\n=== 자는 프로세스 처리 ===\n\n* job이 I/O로 잠들면 vruntime이 '''그대로 멈춘다'''.\n* 깨어나면 남들보다 vruntime이 '''작으므로''' CFS가 먼저 고른다 → I/O(대화형) job 우대. [[MLFQ]]가 규칙 5개로 만든 효과를 vruntime 하나로 얻는다.\n* '''부작용 = starvation''': A는 계속 실행, B는 10초 동안 잠. B가 깨면 vruntime이 A보다 10초 뒤져 있으므로 '''다음 10초를 독점'''하고 A가 굶는다.\n* '''해법''': 깬 job의 vruntime을 '''트리의 최솟값(min_vruntime)'''으로 맞춰 준다. 밀린 몫을 다 돌려주지 않고 \"지금 제일 앞 사람과 동급\"으로만 취급한다.\n\n[[sim:cfs_eevdf]]\n\n== EEVDF ==\n\n리눅스 '''6.6(2023년 10월)'''부터 CFS의 코어를 대체했다. CFS의 한계는 둘이다.\n\n* '''지연 요구(latency-nice)를 반영할 수 없다''' — [[nice]]는 CPU의 '''양'''만 정하지 \"얼마나 빨리 반응해야 하는지\"는 못 정한다.\n* 15년의 진화로 '''휴리스틱이 잔뜩''' (interactive bonus, wakeup replacement …) → 이론적 기반 없음, 복잡하고 예측 어려움.\n\n{def}\n'''EEVDF''' = '''E'''arliest '''E'''ligible '''V'''irtual '''D'''eadline '''F'''irst\n\n'''Lag''' — Difference between '''allocated''' vs. '''received''' CPU time\n* lag > 0 : '''owes service''' → the process is '''eligible'''\n* lag < 0 : already got more service\n* Negative lag is '''decayed during sleep but not increased above 0'''\n\n'''Virtual Deadline (VD)'''\n$$VD = t_{now} + \\frac{slice_i}{weight_i}$$\n* $t_{now}$ : '''eligible time''' of the process (i.e. when lag = 0)\n* Slice는 CFS처럼 계산하되 '''latency_nice'''로 조정. 예: sched_latency 48ms, n=4 → 12ms, latency_nice −10 → '''6ms'''\n\n'''Rules''': Schedule a process with '''lag > 0''' and '''earliest VD'''.\n{/def}\n\n{exam}'''모의 퀴즈 A13에서 틀린 문장.''' \"EEVDF schedules a process whose lag is greater than 0 and whose virtual deadline is the earliest.\" → '''참'''이다. 규칙이 슬라이드에 한 줄로 그대로 있다.\n\n[[CFS]]와의 차이를 표로 잡아 두면 안 헷갈린다.\n\n{|\n! || 선택 조건\n|-\n| '''[[CFS]]''' || 조건 '''하나''' — [[vruntime]]이 가장 작은 것\n|-\n| '''[[EEVDF]]''' || 조건 '''둘''' — ① 자격([[lag]] > 0) ② 순서([[virtual deadline]] 최소)\n|}\n\n이름 자체가 답이다: '''E'''arliest '''E'''ligible '''V'''irtual '''D'''eadline '''F'''irst.{/exam}\n\nEEVDF의 개선점: '''명시적 지연 제어'''(latency_nice), '''예측 가능한 공정성'''(tight lag bound가 수학적으로 증명됨), '''더 나은 tail latency'''.\n\n== 네 스케줄러 비교 ==\n\n{|\n! || 비율 보장 방식 || 전역 상태 || 선택 기준 || 복잡도\n|-\n| '''[[Lottery 스케줄링]]''' || 확률적 || 없음 || 난수 추첨 || O(n)\n|-\n| '''[[Stride 스케줄링]]''' || 결정적 || [[pass]] || pass 최소 || O(n) 또는 힙\n|-\n| '''[[CFS]]''' || 결정적 || [[vruntime]] + [[weight]] || vruntime 최소 || O(log n)\n|-\n| '''[[EEVDF]]''' || 결정적 + 증명된 한계 || [[lag]], [[virtual deadline]] || lag>0 중 VD 최소 || O(log n)\n|}\n\n== 예상 문제 ==\n\n{quiz}\n'''(2025F 중간고사 Problem 4 재현)''' 스케줄러가 [[Stride 스케줄링]]으로 프로세스를 스케줄한다. 세 프로세스 A, B, C의 [[tickets|티켓]] 수는 각각 '''100, 50, 250'''이다. [[pass]] 값은 매 time slice 후에 갱신되며, 스케줄러는 티켓으로부터 [[stride]]를 계산할 때 '''큰 수 500'''을 쓴다.\n\n'''4.1''' 6번째 time slice에서 각 프로세스의 pass 값과 스케줄되는 프로세스는? (8pts)\n'''4.2''' 100번째 time slice에서는? (8pts)\n{/quiz}\n\n{answer}\n'''0단계 — stride 계산'''\n<pre class=\"txt\">\n stride = 500 / tickets\n   A: 500 / 100 = '''5'''\n   B: 500 /  50 = '''10'''\n   C: 500 / 250 = '''2'''\n<\/pre>\n\n'''1단계 — 표를 굴린다.''' 규칙은 \"pass 최소를 고른다 → 실행 → 그 프로세스 pass += stride\". 동점이면 A→B→C 순으로 잡는다.\n\n{|\n! # Timeslice || Pass(A) || Pass(B) || Pass(C) || Who Runs?\n|-\n| 1 || 0 || 0 || 0 || A\n|-\n| 2 || 5 || 0 || 0 || B\n|-\n| 3 || 5 || 10 || 0 || C\n|-\n| 4 || 5 || 10 || 2 || C\n|-\n| 5 || 5 || 10 || 4 || C\n|-\n| '''6''' || '''5''' || '''10''' || '''6''' || '''A'''\n|-\n| 7 || 10 || 10 || 6 || C\n|-\n| 8 || 10 || 10 || 8 || C\n|}\n\n'''4.1 답''': Pass(A) = '''5''', Pass(B) = '''10''', Pass(C) = '''6''', 스케줄되는 프로세스 = '''A'''\n\n(6번째 행에서 최솟값은 5 = Pass(A)이므로 A가 실행된다.)\n\n'''2단계 — 100번째는 주기성으로 푼다.''' 손으로 100줄을 굴리지 않는다.\n\n한 사이클에서 pass가 전부 같은 값으로 모이는 지점을 찾는다. stride의 최소공배수 $\\text{lcm}(5, 10, 2) = 10$. pass가 전부 10이 되는 데 필요한 실행 횟수는\n<pre class=\"txt\">\n A: 10 / 5  = 2번\n B: 10 / 10 = 1번\n C: 10 / 2  = 5번\n 합계 = '''8번 = 한 사이클'''   (비율 2:1:5 = 100:50:250 ✔)\n<\/pre>\n즉 '''8 슬라이스마다 pass가 모두 +10'''씩 오른 상태로 같은 패턴이 반복된다.\n\n$100 = 8 \\times 12 + 4$이므로, 100번째 슬라이스는 '''12 사이클(= pass 전체 +120) 뒤의 4번째 행'''과 같은 상황이다.\n\n<pre class=\"txt\">\n 4번째 행:  Pass(A)=5,  Pass(B)=10,  Pass(C)=2   → C 실행\n +120:      Pass(A)=125, Pass(B)=130, Pass(C)=122 → '''C 실행'''\n<\/pre>\n\n'''4.2 답''': Pass(A) = '''125''', Pass(B) = '''130''', Pass(C) = '''122''', 스케줄되는 프로세스 = '''C'''\n\n{tip}검산: 100 슬라이스 동안 C는 $100 \\times (250/400) = 62.5$번쯤 실행되어야 하고, Pass(C) = 실행 횟수 × 2 ≈ 122 → 61번. 거의 맞는다. 비율이 정확히 맞는 건 '''사이클 경계'''에서다.{/tip}\n{/answer}\n\n{quiz}\n[[CFS]]에서 sched_latency = 48ms, [[min_granularity]] = 6ms이다. (a) 실행 가능한 프로세스가 6개일 때 time slice는? (b) 12개일 때는? (c) (b)의 경우 sched_latency 안에서 완전히 공정한가?\n{/quiz}\n\n{answer}\n'''(a)''' $48 / 6 = $ '''8ms'''. min_granularity(6ms)보다 크므로 그대로 쓴다.\n\n'''(b)''' $48 / 12 = 4\\text{ms}$ → min_granularity보다 작다 → '''6ms로 올림'''한다.\n\n'''(c)''' '''아니다.''' 12개 × 6ms = '''72ms'''가 필요하므로 48ms 안에 모두가 한 번씩 돌 수 없다. 슬라이드 표현대로 \"CFS won't be perfectly fair over sched_latency of 48ms, '''but it will be close while still achieving high CPU efficiency'''\". min_granularity는 '''공정성을 조금 포기하고 [[컨텍스트 스위치]] 오버헤드를 막는''' 장치다.\n{/answer}\n\n{quiz}\nnice 값이 −5인 프로세스(weight 3121)와 nice 0인 프로세스(weight 1024)가 있다. 둘 다 실제로 10초씩 CPU를 썼다면 각각의 [[vruntime]] 증가량은? 그리고 CFS는 다음에 누구를 고르는가?\n{/quiz}\n\n{answer}\n<pre class=\"txt\">\n Δvruntime = (weight₀ / weightᵢ) × runtimeᵢ,  weight₀ = 1024\n\n nice −5 (weight 3121):  (1024 / 3121) × 10 = 0.328 × 10 = '''3.2초'''\n nice  0 (weight 1024):  (1024 / 1024) × 10 = 1.000 × 10 = '''10초'''\n<\/pre>\n\nCFS는 [[vruntime]]이 '''가장 작은''' 프로세스를 고르므로 '''nice −5 프로세스'''를 다시 고른다. 같은 물리 시간을 썼는데 장부에는 3.2초만 적혔기 때문이다.\n\n'''한 줄 정리''': weight가 크다 → 분수 $weight_0/weight_i$가 작다 → vruntime이 천천히 쌓인다 → '''더 자주 뽑힌다'''.\n{/answer}\n\n== 시험 대비 핵심 요약 ==\n\n# 비례 지분 스케줄러의 목표는 '''CPU 몫(%) 보장'''이지 turnaround/response 최적화가 '''아니다'''. 이유는 '''fairness + predictability'''.\n# '''[[tickets|티켓]]''' = 자원 몫. 부가 기능 셋: '''currency'''(사용자 단위 → 전역 환산), '''transfer'''(client → server), '''inflation'''(신뢰 환경에서만).\n# '''[[Lottery 스케줄링]]''': 난수로 당첨 티켓, 리스트 누적합 순회 '''O(n)'''. 장점 = 단순 + 전역 상태 없음. 단점 = '''확률적'''.\n# '''[[fairness|공정성 지표]] F''' = 먼저 끝난 시각 / 나중 끝난 시각 (0.5 ~ 1). 실행 시간이 길수록 1에 수렴. (7강에서는 '''U'''로 표기)\n# '''[[Stride 스케줄링]]''': stride = 큰 수 / 티켓, [[pass]]는 실행마다 stride씩 증가, '''pass 최소 선택''' → 사이클마다 '''정확한''' 비율. 단점 = 새 job의 pass를 0으로 두면 독점.\n# '''[[CFS]]''': 고정 슬라이스 없음. '''vruntime 최소''' 선택. 슬라이스 = '''sched_latency / n''', 단 '''min_granularity(6ms)''' 이상.\n# CFS 공식: $vruntime \\mathrel{+}= (weight_0 / weight_i) \\times runtime$. '''weight₀ = 1024 = nice 0'''.\n# [[nice]] 범위 '''−20 ~ +19''', '''양수 = 낮은 우선순위'''.\n# runnable 프로세스만 '''[[레드블랙 트리]]'''(키 = vruntime)에 → 최소 찾기 '''O(1)''', 삽입 '''O(log n)'''.\n# CFS의 I/O 처리: 자는 동안 vruntime 정지 → 깨면 우선 선택. 부작용 '''starvation''' → 깬 job의 vruntime을 '''트리 최솟값'''으로 재설정.\n# '''[[EEVDF]]'''(리눅스 6.6~): [[lag]] = 받아야 할 − 받은 시간, '''lag > 0이면 eligible'''. '''VD = t_now + slice/weight'''. 규칙 = '''lag > 0 중 VD 최소'''.\n\n== 관련 문서 ==\n* [[Lottery 스케줄링]] · [[tickets]] · [[Stride 스케줄링]] · [[pass]] · [[stride]]\n* [[CFS]] · [[vruntime]] · [[nice]] · [[weight]] · [[sched_latency]] · [[min_granularity]] · [[레드블랙 트리]]\n* [[EEVDF]] · [[lag]] · [[virtual deadline]]\n* [[스케줄링]] · [[fairness]] · [[MLFQ]] — 5강과의 대비\n* [[멀티프로세서 스케줄링]] — 7강 앞 14쪽이 이 강의의 복습이다\n* [[2025F 중간고사 족보]] · [[자주 틀리는 함정 모음]]"
 },
