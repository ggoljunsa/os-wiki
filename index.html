  "body": "'''멀티코어'''(multicore processor)는 '''하나의 물리 칩에 여러 프로세서 코어를 올린''' 구조다. [[멀티프로세서 스케줄링]]이라는 주제가 생긴 이유 그 자체다.\n\n{def}\n* Recent trend to place '''multiple processor cores on same physical chip''' — '''Faster and consumes less power'''\n* The number of '''threads per core''' is also growing\n** Takes advantage of '''memory stall''' to make progress on another thread while memory retrieve happens\n** e.g., Intel's '''Hyper Threading'''\n* (* '''CPU threads differ from SW threads''')\n{/def}\n\n{analogy}'''주방 확장'''이다. 요리사 한 명을 더 빨리 움직이게 하는 데는 한계가 있으니(클럭을 올리면 발열·전력이 폭발), '''요리사를 여러 명 두는''' 쪽으로 방향을 틀었다. 그런데 요리사가 재료 창고에서 물건이 오기를 기다리며 서 있는 시간(memory stall)이 꽤 길다. 그 틈에 '''다른 주문을 처리하게''' 만든 게 Hyper-Threading이다 — 요리사를 늘린 게 아니라 '''노는 시간을 메운 것'''이다.{/analogy}\n\n== 용어 네 개 구분 ==\n\n{|\n! 용어 || 정의 || OS가 보는 것\n|-\n| '''Socket''' || 메인보드에 물리적으로 꽂히는 프로세서 패키지 자리. 안에 코어 여러 개 || —\n|-\n| '''Core''' || 프로그램 실행에 필요한 '''완전한 레지스터 세트 + 실행 유닛 + retirement queue'''. 진짜 독립 실행 단위 || —\n|-\n| '''Thread (hardware thread)''' || 한 코어 안의 '''하드웨어 문맥'''. 각각 코어의 속성을 갖고, OS에는 '''논리 프로세서 하나'''로 보임 || '''✔ 이것이 \"CPU\"'''\n|-\n| '''SW thread''' || 프로세스 안의 실행 흐름 (pthread 등). 하드웨어 스레드와 '''다른 것''' || 스케줄링 대상 job\n|}\n\n<pre class=\"ascii\">\n ┌─────────────── Socket ───────────────┐\n │  ┌──── Core 0 ────┐ ┌──── Core 1 ────┐│\n │  │ HW thr 0  thr 1│ │ HW thr 2  thr 3││\n │  │  └─ 공유 ─┘    │ │  └─ 공유 ─┘    ││\n │  │   실행유닛/캐시 │ │   실행유닛/캐시 ││\n │  └────────────────┘ └────────────────┘│\n └──────────────────────────────────────┘\n   OS에게는 '''CPU 0, 1, 2, 3 — 네 개의 논리 프로세서'''로 보인다\n<\/pre>\n\n{warn}'''슬라이드 각주를 놓치지 말 것''': \"CPU threads differ from SW threads\". 하드웨어 스레드는 '''\"OS가 볼 때 CPU 한 개\"'''이고, 소프트웨어 스레드(8강 [[스레드]])는 '''\"프로세스 안의 실행 흐름\"'''이다. 이 강의에서 \"CPU\"라고 하면 OS가 스케줄링 대상으로 보는 '''논리 프로세서 = 하드웨어 스레드'''를 뜻한다.{/warn}\n\n== Concurrency vs Parallelism ==\n\n{|\n! || 정의 || 필요한 CPU\n|-\n| '''Concurrency''' (동시성) || 여러 task가 '''진행 중(making progress)'''. 스케줄러가 번갈아 돌리면 성립 || '''1개로도 가능'''\n|-\n| '''Parallelism''' (병렬성) || 시스템이 여러 task를 '''실제로 동시에(simultaneously)''' 수행 || '''2개 이상 필요'''\n|}\n\n{exam}단골 개념 문제다. 한 줄 암기: '''동시성은 \"구조/착각\", 병렬성은 \"물리적 사실\".''' 그리고 '''\"병렬이면 동시적이지만, 동시적이라고 병렬은 아니다.\"''' → [[동시성]]{/exam}\n\n== 병렬성의 종류 ==\n\n{|\n! 종류 || 무엇을 나누나 || 예\n|-\n| '''Data parallelism''' || '''데이터'''를 쪼개 코어마다 나눠 주고 '''같은 연산''' || 배열을 N등분해 각 코어가 부분합 → 합치기\n|-\n| '''Task parallelism''' || '''작업(연산)'''을 쪼개 코어마다 '''다른 연산''' || 같은 배열에 코어1은 평균, 코어2는 분산\n|-\n| '''Hybrid parallelism''' || 둘의 혼합 || 현실 프로그램 대부분\n|}\n\n구분 팁: '''\"뭘 나눴나?\"''' — 데이터면 data, 하는 일이면 task.\n\n== 프로그래머에게 떠넘겨지는 부담 ==\n\n슬라이드는 멀티프로세서가 '''프로그래머에게 압력을 준다'''고 말한다: dividing activities(작업 나누기), '''load balancing'''([[로드 밸런싱]]), data splitting, data dependency, testing and debugging …\n\n'''\"Adding more CPUs does not make that an application runs faster.\"''' 코어를 준다고 프로그램이 저절로 빨라지지 않고, '''스레드를 써서 병렬로 돌게 다시 짜야''' 한다. 그리고 그렇게 짜도 [[Amdahl의 법칙]]이 상한을 정한다.\n\n== 멀티코어가 만들어 낸 문제들 ==\n\n코어가 여러 개가 되면서 새로 생긴 문제들이 7강의 나머지 전부다.\n\n* '''[[캐시 일관성]]''' — 같은 데이터의 복사본이 여러 캐시에 생긴다 → bus snooping\n* '''동기화''' — 여러 CPU가 공유 데이터에 동시 접근 → [[락]], [[mutual exclusion]]\n* '''[[cache affinity]]''' — 프로세스를 옮기면 캐시 상태를 잃는다\n* '''큐 구조''' — [[SQMS]] vs [[MQMS]], 그리고 [[로드 밸런싱]]과 [[work stealing]]\n\n== 관련 문서 ==\n* [[멀티프로세서 스케줄링]] · [[캐시 일관성]] · [[cache affinity]] · [[Amdahl의 법칙]]\n* [[SQMS]] · [[MQMS]] · [[로드 밸런싱]] · [[work stealing]]\n* [[동시성]] · [[스레드]] · [[락]]"
 },
 "스레드": {
  "title": "스레드 (Thread)",
  "category": [
   "8강 Concurrency",
   "핵심"
  ],
  "body": "'''스레드'''(thread)는 8강 Concurrency의 주인공이자, 지금까지 배운 [[프로세스]] 개념을 '''둘로 쪼갠''' 결과물이다. 슬라이드의 한 줄 정의는 \"'''a sequential execution stream within a process'''\" — 프로세스 안의 순차적 실행 흐름이다.\n\n1~7강이 \"CPU 하나를 여러 프로세스가 어떻게 나눠 쓰나\"([[가상화]])였다면, 8강부터는 \"'''한 프로세스 안에 실행 흐름이 여러 개 있고 그들이 메모리를 공유하면 무슨 일이 생기나'''\"가 질문이다. 보호가 기본이던 세계에서 '''공유가 기본'''인 세계로 넘어오는 순간이고, 그 대가가 [[race condition]]이다. OSTEP 26장에 해당한다.\n\n{info}이 강의의 앞 20장(p.2~20)은 1~7강 전체 복습이다. 교수님이 '''퀴즈용'''이라고 직접 밝혔으므로, 이 문서 아래쪽의 \"교수님이 퀴즈용이라고 한 복습 슬라이드 (p.2~20)\" 절을 먼저 훑고 오는 것도 좋다.{/info}\n\n== 왜 Concurrency인가 (p.22) ==\n\n슬라이드가 든 이유 다섯 가지:\n\n{|\n! 용도 || 이유 || 예\n|-\n| 대부분의 현대 앱 || 멀티스레드가 기본 || GUI (그리기 스레드 + 이벤트 스레드)\n|-\n| '''Servers''' || 논리적으로 동시적인 작업을 표현 — 여러 연결을 동시에 처리 || 웹 서버, 연결마다 스레드 하나\n|-\n| '''Parallel programs''' || 더 나은 성능 — 여러 코어를 실제로 활용 || 큰 배열 정렬을 4코어가 분담 ([[Amdahl의 법칙]])\n|-\n| UI 있는 프로그램 || 계산 중에도 '''사용자 반응성''' 유지 || 인코딩 중에도 취소 버튼이 눌림\n|-\n| Network/disk-bound || 네트워크·디스크 '''지연을 숨김(hide latency)''' || 한 스레드가 blocked인 동안 다른 스레드가 계산\n|}\n\n{warn}'''성능(parallelism)은 이유 중 하나일 뿐이다.''' 서버·UI·I/O 숨기기는 '''CPU가 하나여도''' 이득이다. 7강의 \"concurrency ≠ parallelism\"이 여기서 의미를 갖는다.{/warn}\n\n== 프로세스를 쪼개기 (p.23) ==\n\n{def}'''Threads''' — ''unit of concurrency''. \"a sequential execution stream within a process\" (프로세스 안의 순차적 실행 흐름).\n\n'''Address space''' — ''unit of protection''. \"All the addresses that the program can touch\" (프로그램이 건드릴 수 있는 모든 주소), 프로그램 실행에 필요한 모든 상태.{/def}\n\n암기 문장: '''thread = 동시성의 단위, [[주소 공간|address space]] = 보호의 단위.''' \"unit of ___\" 빈칸 문제로 나오기 딱 좋다.\n\n왜 분리하나?\n# 협력하는 실행 흐름이 '''대량으로''' 필요한 경우가 많다 (서버의 수천 개 연결).\n# '''한 주소 공간에 스레드 여러 개'''를 두고 싶은 상황이 많다 (같은 데이터를 함께 다루는 작업들).\n# 분리하지 않으면 협력 작업마다 프로세스를 따로 만들어야 하고, 데이터 교환에 비싼 IPC가 필요하다.\n\n옛날의 \"프로세스\"란 사실 '''스레드 1개짜리 주소 공간'''이었다. [[xv6]]가 정확히 그런 구조다 — [[struct proc]] 하나에 실행 흐름 하나.\n\n자세한 비교는 [[스레드와 프로세스 비교]] 참고.\n\n== 스레드의 실체 (p.26~27) ==\n\n{def}'''Thread''' — a new abstraction for a single running process. A '''multi-threaded program''' has more than one point of execution, i.e. '''multiple PCs''' (Program Counters), and they '''share the same address space'''.{/def}\n\n한 줄로: '''스레드 = 자기 [[프로그램 카운터|PC]] + [[레지스터]] + [[스레드 스택|스택]]을 가지고, 주소 공간은 공유하는 실행 흐름.'''\n\n각 스레드의 상태는 [[TCB]](Thread Control Block)에 저장된다. [[프로세스]]의 [[PCB]]와 같은 역할이다. 스레드 간 전환은 [[스레드 컨텍스트 스위치]] 문서에서 자세히 다룬다 — 핵심은 '''레지스터만 저장/복원하고 주소 공간은 그대로'''라는 것.\n\n{|\n! 스레드마다 따로 ([[TCB]] + 자기 스택) || 모든 스레드가 공유 (프로세스 단위)\n|-\n| [[프로그램 카운터|PC]] || 코드(text)\n|-\n| [[레지스터]] 세트 ([[스택 포인터|sp]] 포함) || 전역 변수, `static` 변수\n|-\n| '''[[스레드 스택|스택]]''' (지역 변수, 인자, 리턴 주소) || '''[[힙]]''' (`malloc`한 메모리)\n|-\n| [[TLS]] || 열린 파일 디스크립터\n|-\n| 스레드 상태, 스케줄링 정보 || [[주소 공간]], PID, 작업 디렉터리\n|}\n\n{warn}스택이 \"따로\"라는 건 '''각자 다른 영역을 쓴다'''는 뜻이지 '''보호된다'''는 뜻이 아니다. 같은 주소 공간이므로 포인터만 넘기면 다른 스레드의 스택도 읽고 쓸 수 있다.{/warn}\n\n== 주소 공간 그림 (p.28) ==\n\n'''There will be one stack per thread''' — 스레드마다 스택이 하나씩.\n\n[[img:L8-28.png|단일 스레드 주소 공간 vs 두 스레드 주소 공간. Stack (2)가 중간에 끼어든다|large]]\n\n[[sim:thread_stack]]\n\n{warn}'''방향 주의.''' 그림은 0KB가 위쪽이라서, heap이 \"아래로(downward)\" 자란다 = '''높은 주소 쪽으로''', stack이 \"위로(upward)\" 자란다 = '''낮은 주소 쪽으로'''다. 헷갈리면 \"'''heap은 주소 증가, stack은 주소 감소'''\"로 외워라.{/warn}\n\n* 단일 스레드일 땐 [[힙]]과 [[스택]]이 양 끝에서 마주 보며 자라 빈 공간을 최대한 활용한다.\n* 스레드가 여러 개면 스택이 주소 공간 '''중간 곳곳에''' 흩어져 이 배치가 깨진다 → 각 스택 크기가 '''고정'''되고, 넘치면 다른 영역을 덮을 수 있다 (그래서 스택 사이에 guard page를 둔다).\n* ⭐ '''각 스레드의 지역 변수는 자기 스택에 있어 안 섞인다 → 공유되는 건 전역·힙.''' [[counter 예제]]의 `counter`가 전역이고 루프 변수 `i`는 문제가 안 되는 이유다.\n\n자세한 것은 [[스레드 스택]] 문서.\n\n== 스레드 만들기 (p.29, p.32) ==\n\n[[img:L8-29.png|pthread_create의 네 인자|medium]]\n\n<pre class=\"c\">\n#include &lt;pthread.h&gt;\n\nint pthread_create(pthread_t            *thread,\n                   const pthread_attr_t *attr,\n                   void *               (*start_routine)(void *),\n                   void *               arg);\n<\/pre>\n\n* `thread` — 이 스레드와 상호작용하는 데 쓰는 핸들. `pthread_t` 변수의 '''주소'''를 넘긴다.\n* `attr` — 스레드 '''속성''': 스택 크기, 스케줄링 우선순위 등. 보통 `NULL`.\n* `start_routine` — 스레드가 실행을 시작할 함수. `void *`를 받고 `void *`를 반환.\n* `arg` — 그 함수에 넘길 인자. '''`void *`라서 어떤 타입이든''' 넘길 수 있다.\n\n인자가 여러 개면 '''구조체로 묶어서''' 주소를 넘긴다:\n\n<pre class=\"c\">\ntypedef struct { int a; int b; } myarg_t;\n\nvoid *mythread(void *arg) {\n    myarg_t *args = (myarg_t *) arg;   // 받는 쪽에서 원래 타입으로 캐스팅\n    printf(\"%d %d\\n\", args->a, args->b);\n    return NULL;\n}\n\nmyarg_t args = { 10, 20 };\npthread_create(&p, NULL, mythread, &args);\n<\/pre>\n\n자세한 건 [[pthread_create]], 짝이 되는 대기 함수는 [[pthread_join]].\n\n슬라이드 p.32의 전체 예제:\n\n[[img:L8-32.png|Multi-threaded Program Example — main + 스레드 2개|medium]]\n\n<pre class=\"c\">\n 7 void *mythread(void *arg) {\n 8     printf(\"%s\\n\", (char *) arg);   // 받은 문자열(\"A\" 또는 \"B\") 출력\n 9     return NULL;\n10 }\n11\n12 int\n13 main(int argc, char *argv[]) {\n14     pthread_t p1, p2;\n15     int rc;\n16     printf(\"main: begin\\n\");\n17     pthread_create(&p1, NULL, mythread, \"A\");\n18     pthread_create(&p2, NULL, mythread, \"B\");\n19     // join waits for the threads to finish\n20     pthread_join(p1, NULL);\n21     pthread_join(p2, NULL);\n22     printf(\"main: end\\n\");\n23     return 0;\n24 }\n<\/pre>\n\n{info}이 프로그램의 '''스레드는 총 3개'''다: main + p1 + p2. main도 스레드다.{/info}\n\n=== 실행 순서는 아무도 모른다 (p.33~35) ===\n\n[[img:L8-33.png|Possible Outputs ① — main이 sleep(→Blocked)하고 T1, T2가 차례로 도는 경우|large]]\n\n슬라이드는 같은 프로그램의 '''세 가지 다른 실행 순서'''를 보여준다.\n\n{|\n! 슬라이드 || 시나리오 || 출력\n|-\n| p.33 || ① main이 `join`에서 '''goes to sleep'''(→ Blocked) → T1 → main → T2 || `begin / A / B / end`\n|-\n| p.34 || ① main이 '''preempted'''(→ Ready, 타이머로 강제 선점) → T1 → main → T2 || `begin / A / B / end`\n|-\n| p.35 || ① main preempted → '''OS가 T2를 먼저 선택''' → main → T1 || `begin / '''B''' / '''A''' / end`\n|}\n\n> \"'''What runs next is determined by the OS Scheduler; It is hard to know what will run at any given moment in time!'''\"\n\n{exam}⭐ 출제 포인트 (p.33~35)\n* `join` 순서(p1 → p2)는 main이 '''기다리는''' 순서일 뿐, 스레드가 '''실행되는''' 순서를 정하지 않는다.\n* \"가능한 출력을 모두 고르라\" 유형의 답은 '''2가지'''. `main: begin`은 스레드 생성 전이라 항상 처음, `main: end`는 두 `join` 뒤라 항상 마지막, '''A와 B 순서만 자유'''.\n* `A`가 `main: begin`보다 먼저? '''불가능'''. `main: end`가 `B`보다 먼저? '''불가능'''.\n* '''preempted(→ Ready)와 goes to sleep(→ Blocked)을 구분'''할 것. [[프로세스 상태]] 전이 문제로 엮이기 좋다.{/exam}\n\n{analogy}🎭 스레드 = '''한 집(주소 공간)에 사는 룸메이트들'''이다. 각자 자기 책상(스택)과 자기 일정표(PC·레지스터)를 갖지만, 냉장고(전역 변수)와 창고([[힙]])는 공유한다. 룸메이트가 늘수록 살림은 편해지지만(데이터 공유가 쉬움), '''냉장고 안의 마지막 푸딩을 두 명이 동시에 꺼내려는''' 사건이 생긴다. 그게 [[race condition]]이다.{/analogy}\n\n== 공유 데이터가 끼어들면 (p.36~40) ==\n\n여기부터 8강의 클라이맥스다. 전역 `counter`를 두 스레드가 1천만 번씩 올리면 2천만이 나와야 하는데, 실제로는 '''매번 다르고 항상 모자란다'''.\n\n[[img:L8-38.png|기대 20000000 vs 실제 19345221 / 19221041 — 매번 다르다|large]]\n\n원인은 C 한 줄이 기계어 세 줄이라는 것:\n\n[[img:L8-39.png|counter = counter + 1의 어셈블리 — mov / add / mov|medium]]\n\n<pre class=\"asm\">\n100  mov 0x8049a1c, %eax   ; ① LOAD : 메모리의 counter를 eax로\n105  add $0x1, %eax        ; ② ADD  : eax에 1 더하기 (아직 메모리엔 반영 X)\n108  mov %eax, 0x8049a1c   ; ③ STORE: eax 값을 counter에 다시 씀\n<\/pre>\n\n> \"'''The context switch can happen at any point of time by the OS scheduler'''\"\n\n[[img:L8-40.png|counter=50에서 두 스레드가 한 번씩 증가 — 기대 52, 결과 51|large]]\n\n[[sim:counter_race]]\n\n{exam}⭐⭐⭐ '''p.40 표는 시험 단골'''이다. PC / eax / counter 세 열을 손으로 재현할 수 있어야 한다. 전체 추적과 변형 문제는 [[counter 예제]] 문서에 정리해 두었다.{/exam}\n\n핵심 통찰:\n* '''CPU가 보장하는 원자성의 단위는 \"명령어 하나\"'''다. C 한 줄은 명령어 여러 개이므로 [[atomic|원자적]]이지 않다.\n* 증가의 중간 결과(1을 더했지만 아직 안 쓴 값)가 '''[[레지스터]]'''에 있는 동안 전환되면, 그 값은 [[TCB]]에 저장되고 다른 스레드는 '''메모리의 옛 값'''을 본다.\n* load-modify-store('''read-modify-write''') 패턴은 전부 같은 위험: `x++`, `x += 5`, `list->head = new`, `balance -= amount`…\n\n== Race condition, Critical section, Mutual exclusion (p.42~44) ==\n\n[[img:L8-42.png|Race Condition과 Critical Section의 슬라이드 정의 — 18번 줄이 critical section|large]]\n\n{def}'''Race condition''' — \"An undesirable situation that occurs when a device or system attempts to perform '''two or more operations at the same time'''.\" Race condition occurs when there exists a critical section(s) in the code.\n\n'''Critical section''' — \"A piece of code that '''accesses a shared variable''' (or a shared resource) and '''must not be concurrently executed by more than one thread'''.\"{/def}\n\n{exam}🎯 이 두 정의는 '''2025F 중간고사 Problem 2-e)에 슬라이드 문장 그대로''' 출제되었다: \"What is the name of an undesirable situation that occurs when a device or system attempts to perform two or more operations at the same time?\" → '''Race Condition'''. 영어 정의 문장을 통째로 외울 것. 자세한 건 [[2025F 중간고사 족보]].{/exam}\n\n인과 사슬:\n\n<pre class=\"ascii\">\n공유 자원 존재 → 그것에 접근하는 코드 = critical section\n  → 보호 없이 여러 스레드가 동시 실행 → race condition → indeterminate한 결과\n  → 해법: critical section에 mutual exclusion\n<\/pre>\n\n해법이 [[mutual exclusion]]이고, 그 도구가 [[락|lock]]이다. p.44의 고친 코드:\n\n<pre class=\"c\">\n13 lock_t mutex;\n14 void *mythread(void *arg) {\n15     printf(\"%s: begin\\n\", (char *) arg);\n16     int i;\n17     for (i = 0; i &lt; 1e7; i++) {\n18         lock(&mutex);            // 진입: 다른 스레드가 쥐고 있으면 대기\n19         counter = counter + 1;   // critical section\n20         unlock(&mutex);          // 퇴장\n21     }\n22     printf(\"%s: done\\n\", (char *) arg);\n23     return NULL;\n24 }\n<\/pre>\n\n{warn}'''락은 인터럽트(선점)를 막는 게 아니다.''' 락을 쥔 스레드도 여전히 선점된다. 락은 선점돼도 '''다른 스레드가 critical section에 못 들어오게''' 할 뿐이다. 그리고 `lock()` 자체를 어떻게 원자적으로 만드느냐가 바로 9강 [[락]]의 주제다.{/warn}\n\n== 교수님이 퀴즈용이라고 한 복습 슬라이드 (p.2~20) ==\n\n{exam}🎯 8강 PDF의 앞 20장은 1~7강 복습이다. 교수님이 '''\"이 부분은 퀴즈용\"'''이라고 직접 밝혔으므로(사용자 전달, 2026-09-21, [[시험 정보]] 기록), '''슬라이드 1장 = 문제 1개'''로 보고 아래 표를 체크리스트처럼 쓰면 된다.{/exam}\n\n{|\n! p. || 슬라이드 제목 || 반드시 말할 수 있어야 하는 한 줄 || 문서\n|-\n| 2 || Process || 프로세스 = an instance of a running program. program(디스크의 정적 파일)도 processor(하드웨어)도 아니다. 두 추상화 = '''control flow (a.k.a thread)''' + '''memory address space''' || [[프로세스]]\n|-\n| 3 || Virtualization || Logical control flow(CPU를 혼자 쓰는 '''것처럼''') + Private virtual address space(메모리를 혼자 쓰는 '''것처럼''') || [[가상화]]\n|-\n| 4 || How to Efficiently Virtualize CPU? || time sharing의 두 문제 = '''Control'''(통제권 유지) + '''Performance'''(오버헤드) || [[제한적 직접 실행]]\n|-\n| 5 || Problem 1: Restricted Operation || 해법 = '''protected control transfer''' → user mode / kernel mode || [[유저 모드와 커널 모드]]\n|-\n| 6 || Problem 2: Switching Between Processes || \"프로세스가 돌고 있다 = OS는 안 돌고 있다\". '''Cooperative = just wait for system calls''' / Non-cooperative = OS가 빼앗음 || [[협력적 방식]] · [[비협력적 방식]]\n|-\n| 7 || A Non-Cooperative Approach || '''During the boot sequence, the OS starts the timer.''' 타이머 인터럽트가 OS에게 다시 돌 능력을 준다 || [[타이머 인터럽트]]\n|-\n| 8 || Scheduling Policies || mechanism(context switch)은 끝, 이제 policy || [[스케줄링]]\n|-\n| 9 || Scheduling Metrics || $T_{turnaround} = T_{completion} - T_{arrival}$. 성능과 공정성은 종종 상충 || [[turnaround time]] · [[fairness]]\n|-\n| 10 || New Scheduling Metric: Response Time || $T_{response} = T_{firstrun} - T_{arrival}$. '''STCF는 time-shared machine에 부적합''', batch용 || [[response time]] · [[STCF]]\n|-\n| 11 || Fairness Metric || F = 먼저 끝난 작업 완료 시각 / 나중 끝난 작업 완료 시각. 1에 가까울수록 공정 || [[fairness]]\n|-\n| 12 || Recall: STCF and RR || '''STCF → turnaround 최적, response 나쁨 / RR → response 최적, turnaround terrible''' || [[STCF]] · [[Round Robin]]\n|-\n| 13 || MLFQ: Summary || 규칙 5개 통째로 암기 || [[MLFQ]]\n|-\n| 14 || Stride vs. Lottery || Lottery = 확률적, Stride = 주기 끝에 정확. 그래도 Lottery를 쓰는 이유 = '''전역 상태(pass)가 없다''' || [[Stride 스케줄링]] · [[Lottery 스케줄링]]\n|-\n| 15 || Linux CFS || '''고정 time slice에 기반하지 않음'''. vruntime 최소인 프로세스를 다음에 실행 || [[CFS]] · [[vruntime]]\n|-\n| 16 || Summary: EEVDF || '''lag > 0'''이면서 '''가장 이른 VD'''를 가진 프로세스 선택 || [[EEVDF]] · [[lag]]\n|-\n| 17 || Multiprocessor Scheduling || '''CPU를 더 붙인다고 앱이 빨라지지 않는다 → 스레드로 병렬화해야 한다''' (← 오늘 주제로 연결) || [[멀티프로세서 스케줄링]]\n|-\n| 18 || Cache Affinity || 가능하면 같은 CPU에. 옮기면 cache miss || [[cache affinity]]\n|-\n| 19 || MQMS || 큐 여러 개, 작업은 '''exactly one''' 큐에. SQMS의 확장성·친화도 문제 회피, 대가는 부하 불균형 || [[MQMS]]\n|-\n| 20 || Work Stealing || source가 target을 '''peek''' → 더 차 있으면 '''steal'''. 임계값 찾기는 '''black art''' || [[work stealing]]\n|}\n\n{exam}🎯 p.10·p.12는 모의 퀴즈에서 '''짝으로 틀린''' 항목이다(A7, A8). '''STCF = batch/turnaround, RR = response/interactive''' — R끼리 묶어 외워라. p.7은 A5에서 틀렸다: '''타이머는 부팅 때 OS가 켠다, 유저 프로그램이 아니다.''' → [[자주 틀리는 함정 모음]]{/exam}\n\n== 예상 문제 ==\n\n{quiz}'''Q1.''' Thread와 address space는 각각 무엇의 '''단위(unit)'''인가? (영어로){/quiz}\n{answer}Thread = '''unit of concurrency''', address space = '''unit of protection'''. (p.23){/answer}\n\n{quiz}'''Q2.''' 같은 프로세스 안의 스레드끼리 '''공유하는 것'''과 '''따로 갖는 것'''을 각각 두 개씩 쓰시오.{/quiz}\n{answer}공유: 코드(text), 전역/static 변수, [[힙]], 열린 파일 디스크립터, 주소 공간 중 2개.\n따로: [[프로그램 카운터|PC]], [[레지스터]] 세트, [[스레드 스택|스택]], [[TLS]] 중 2개. (p.27~28){/answer}\n\n{quiz}'''Q3.''' 아래 프로그램의 가능한 출력은 몇 가지인가? 이유와 함께 쓰시오.\n<pre class=\"c\">\nprintf(\"main: begin\\n\");\npthread_create(&p1, NULL, mythread, \"A\");\npthread_create(&p2, NULL, mythread, \"B\");\npthread_join(p1, NULL);\npthread_join(p2, NULL);\nprintf(\"main: end\\n\");\n<\/pre>{/quiz}\n{answer}'''2가지''' (`begin/A/B/end`, `begin/B/A/end`). `main: begin`은 스레드 생성 전에 출력되므로 항상 처음이고, `main: end`는 두 `join` 뒤이므로 항상 마지막이다. A와 B의 순서만 [[스케줄러]]에 따라 바뀐다. (p.33~35){/answer}\n\n{quiz}'''Q4.''' 두 스레드가 `counter = counter + 1`을 각각 $10^7$번 실행했더니 결과가 20,000,000보다 작았다. 기계어 수준에서 원인을 설명하시오.{/quiz}\n{answer}C 한 줄이 '''load / add / store''' 세 명령어이고, [[타이머 인터럽트]]가 그 사이에 들어올 수 있다. T1이 load·add 후 store 전에 선점되면 T2가 '''옛 값'''을 읽어 증가·저장하고, 복귀한 T1이 자기 [[레지스터]]의 옛 결과를 store해서 T2의 증가를 '''덮어쓴다'''(lost update). (p.39~40){/answer}\n\n{quiz}'''Q5.''' `volatile`을 붙였는데도 왜 결과가 틀리는가?{/quiz}\n{answer}`volatile`은 '''매번 메모리에서 읽고 쓰게''' 강제할 뿐, read-modify-write의 '''[[atomic|원자성]]을 보장하지 않는다'''. 읽기와 쓰기 사이에 끼어드는 것은 전혀 막지 못한다. (p.36){/answer}\n\n== 시험 대비 핵심 요약 ==\n\n# 프로세스 = '''control flow (a.k.a thread)''' + '''address space'''. 8강은 이 둘을 분리: '''thread = unit of concurrency, address space = unit of protection'''\n# Concurrency가 필요한 이유: 서버(여러 연결), 병렬 성능, '''UI 반응성''', '''I/O 지연 숨기기''' — 뒤의 둘은 CPU 1개여도 이득\n# 멀티스레드 = '''PC가 여러 개''', 같은 주소 공간. 스레드 상태는 '''[[TCB]]'''에 저장\n# [[스레드 컨텍스트 스위치]]는 '''레지스터만 저장/복원, 주소 공간은 그대로''' → TLB 유지 → 가볍다\n# '''스레드마다 스택 하나.''' 지역 변수는 스레드별, '''전역·static·[[힙]]은 공유'''. 그림에서 heap은 주소 증가, stack은 주소 감소\n# `pthread_create(thread, attr, start_routine, arg)` — attr = 스택 크기·우선순위, arg는 `void *`(여러 개면 구조체). [[pthread_join]] = 끝날 때까지 대기(프로세스의 [[wait]]에 대응)\n# '''[[TLS]]''': scope가 '''스레드'''(지역 변수는 function frame). static처럼 오래 살지만 스레드마다 고유 (예: `errno`)\n# 스택/TLS는 '''pthread 라이브러리(유저 레벨)'''가 `mmap`으로 할당해 `clone`에 넘긴다. 스레드 = \"address-space-shared process\"\n# 실행 순서는 '''[[스케줄러]]가 결정''' → 생성 순서 ≠ 실행 순서, join 순서 ≠ 실행 순서. preempted(→ Ready) vs goes to sleep(→ Blocked) 구분\n# `counter = counter + 1` = '''load / add / store''' → 사이에서 인터럽트 → '''lost update'''. 50에서 두 번 증가 → 기대 52, 결과 51\n# 결과는 항상 모자라고 실행마다 다르다('''indeterminate'''). `volatile`은 원자성을 보장하지 '''않는다'''. CPU 1개여도 생긴다\n# '''[[critical section]]''' = 공유 자원에 접근해 동시에 실행되면 안 되는 코드. '''[[race condition]]''' = 그것이 보호 없이 동시 실행돼 결과가 타이밍에 좌우되는 상황\n# 해법 = '''[[mutual exclusion]]''' = critical section에 [[atomic|원자성]] 제공: mutex/lock, semaphore, condition variable(Pthreads), monitor(Java)\n# 락은 '''선점을 막지 않는다'''. `lock()` 자체의 원자성은 하드웨어 원자 명령([[test-and-set]] 등)으로 → 9강 [[락]]\n\n== 관련 문서 ==\n* [[TCB]] · [[스레드 스택]] · [[TLS]]\n* [[pthread_create]] · [[pthread_join]]\n* [[스레드와 프로세스 비교]] · [[스레드 컨텍스트 스위치]]\n* [[counter 예제]] · [[race condition]] · [[critical section]] · [[mutual exclusion]] · [[atomic]]\n* [[락]] (9강 — lock을 실제로 만드는 법)\n* [[자주 틀리는 함정 모음]] · [[2025F 중간고사 족보]] · [[시험 정보]]"
 },
 "TCB": {
  "title": "TCB (Thread Control Block)",
  "category": [

  ],
  "body": "'''TCB'''(Thread Control Block)는 [[스레드]] 하나의 상태를 담아 두는 커널(혹은 스레드 라이브러리)의 자료구조다. [[프로세스]]에 [[PCB]]가 있듯, 스레드에는 TCB가 있다.\n\n[[img:L8-27.png|8강 p.27 — 스레드마다 TCB가 필요하다|medium]]\n\n{def}슬라이드 p.27 원문: \"Each thread has its own program counter and set of registers. '''One or more thread control blocks (TCBs) are needed to store the state of each thread.'''\"{/def}\n\n== 무엇이 들어가나 ==\n\n{|\n! 저장하는 것 || 왜\n|-\n| [[프로그램 카운터|PC]] || 스레드마다 실행 지점이 다르다 (멀티스레드 = multiple PCs)\n|-\n| [[레지스터]] 세트 ([[스택 포인터|sp]], [[a0]] 등 전부) || 전환 시 통째로 저장·복원해야 중간 결과가 안 날아간다\n|-\n| 자기 [[스레드 스택|스택]]의 위치 || 스레드마다 스택이 따로다\n|-\n| 스레드 상태 (running/ready/blocked), 스케줄링 정보 || [[스케줄러]]가 쓴다\n|-\n| [[TLS]] 포인터 || 스레드 고유 저장소를 가리킨다 (x86-64 `%fs`, [[RISC-V]] `tp`)\n|}\n\n'''들어가지 않는 것''': [[주소 공간]](페이지 테이블), 열린 파일 테이블, PID — 이들은 프로세스 단위라 [[PCB]]에 있다. 이게 [[스레드 컨텍스트 스위치]]가 가벼운 이유다.\n\n== PCB와의 대응 ==\n\n{|\n! || [[PCB]] || TCB\n|-\n| 단위 || 프로세스 || 스레드\n|-\n| 레지스터 문맥 || O || O\n|-\n| 주소 공간 정보 || '''O''' || '''X''' (프로세스 것을 공유)\n|-\n| [[xv6]]에서 || [[struct proc]] || 없음 — xv6는 프로세스당 스레드 1개\n|}\n\n{info}[[xv6]]에는 TCB가 따로 없다. [[struct proc]] 하나가 PCB이자 TCB 역할을 겸한다. 그 안의 `trapframe`(유저 [[레지스터]])과 `context`(커널 `swtch`용 callee-saved 레지스터)가 사실상 스레드 문맥 저장소다. → [[trapframe]]{/info}\n\n{analogy}🎭 TCB = '''사물함'''이다. 룸메이트([[스레드]])가 외출할 때 자기 물건(레지스터)을 자기 사물함에 넣어 두고, 돌아오면 그대로 꺼낸다. 집 주소(주소 공간)는 사물함에 넣지 않는다 — 어차피 같은 집이니까.{/analogy}\n\n{exam}🎯 2025F 중간고사 Problem 1-b)에 등장: \"Which one is not a '''programmer-visible state of the CPU'''?\" ① Register File ② Program Counter ③ Condition Codes ④ Stack Pointer ⑤ '''Thread Control Block''' → 정답 ⑤. TCB는 '''CPU의 상태가 아니라 OS의 자료구조'''다. 헷갈리지 말 것. → [[2025F 중간고사 족보]]{/exam}\n\n{quiz}TCB에는 저장되고 PCB에만 있는 것은 무엇인가? 그것이 [[스레드 컨텍스트 스위치]] 비용에 미치는 영향은?{/quiz}\n{answer}[[주소 공간]] 정보(페이지 테이블 레지스터: x86 `CR3`, [[RISC-V]] `satp`)는 PCB 쪽에만 있다. 스레드 전환은 이걸 바꾸지 않으므로 TLB flush와 캐시 오염이 없어 훨씬 싸다.{/answer}\n\n== 관련 문서 ==\n* [[스레드]] · [[스레드 컨텍스트 스위치]] · [[스레드 스택]]\n* [[PCB]] · [[struct proc]] · [[trapframe]]\n* [[2025F 중간고사 족보]]"
 },
 "스레드 스택": {
  "title": "스레드 스택 (One stack per thread)",
  "category": [
   "8강 Concurrency",
   "용어"
  ],
  "body": "8강 p.28의 한 줄이 전부다: '''\"There will be one stack per thread.\"''' [[스레드]]마다 [[스택]]이 하나씩 생긴다.\n\n[[img:L8-28.png|단일 스레드 주소 공간(왼쪽) vs 두 스레드 주소 공간(오른쪽). Stack (2)가 free 영역 중간에 끼어든다|large]]\n\n[[sim:thread_stack]]\n\n== 왜 스레드마다 스택이 필요한가 ==\n\n[[스택]]에는 '''지역 변수, 함수 인자, 리턴 주소'''가 쌓인다. 스레드는 각자 다른 함수를 다른 깊이로 호출하고 있으므로, 스택을 공유하면 서로의 프레임을 짓밟게 된다. 그래서 '''실행 흐름이 하나 생길 때마다 스택도 하나''' 생겨야 한다.\n\n8강 p.3의 복습 슬라이드가 \"Logical control flow ('''+ stack''')\"이라고 괄호를 달아 둔 것이 복선이었다.\n\n== 슬라이드 그림 읽기 ==\n\n<pre class=\"ascii\">\n A Single-Threaded Address Space        Two threaded Address Space\n 0KB  +--------------+                  0KB  +--------------+\n      | Program Code |                       | Program Code |\n 1KB  +--------------+                  1KB  +--------------+\n      | Heap    |    |                       | Heap    |    |\n      |         v    |                       |         v    |\n 2KB  +--------------+                  2KB  +--------------+\n      |              |                       |   (free)     |\n      |   (free)     |                       +--------------+\n      |              |                       | Stack (2)  ^ |  <- 스레드 2\n      |              |                       +--------------+\n 15KB +--------------+                       |   (free)     |\n      | Stack (1)  ^ |                  15KB +--------------+\n 16KB +--------------+                       | Stack (1)  ^ |  <- 스레드 1(main)\n                                        16KB +--------------+\n<\/pre>\n\n슬라이드 가운데 설명:\n* '''The code segment''': where instructions live\n* '''The heap segment''': contains malloc'd data, dynamic data structures ''(it grows downward)''\n* '''The stack segment''': contains local variables, arguments to routines, return values, etc. ''(it grows upward)''\n\n{warn}'''\"downward / upward\"에 속지 말 것.''' 그림은 '''0KB가 맨 위'''라서 방향 표현이 뒤집혀 있다. 실제로는 '''heap은 주소가 증가하는 쪽으로, stack은 주소가 감소하는 쪽으로''' 자란다 (x86, [[RISC-V]] 모두). 그림의 \"grows downward/upward\"는 '''그림 상의 방향'''이다.{/warn}\n\n== 무엇이 달라지나 ==\n\n{|\n! || 단일 스레드 || 멀티 스레드\n|-\n| 스택 개수 || 1 || 스레드 수만큼\n|-\n| 배치 || [[힙]]과 스택이 '''양 끝에서 마주 보며''' 자람 → 빈 공간 최대 활용 || 스택이 주소 공간 '''중간 곳곳에''' 흩어짐\n|-\n| 스택 크기 || 사실상 가변 (남은 공간까지) || '''고정''' — 넘치면 남의 영역을 덮음 → 사이에 guard page\n|}\n\n{info}이 16KB짜리 그림은 OSTEP의 교육용 축소 모델이다. 실제 리눅스에서 스레드 스택은 기본 8MB 정도이고 `mmap`으로 잡은 영역에 놓인다.{/info}\n\n== 누가 할당하나 (p.31) ==\n\n'''pthread 라이브러리(유저 레벨)'''가 `mmap`으로 스택 + guard page + [[TLS]] 블록을 잡아 `clone(fn, child_stack, flags, arg)`의 `child_stack` 인자로 넘긴다. 커널이 아니다.\n\n<pre class=\"c\">\n#include &lt;sched.h&gt;\n\nint clone(int (*fn)(void *),     // 새 실행 흐름이 시작할 함수\n          void *child_stack,     // <- 스택은 호출자(유저)가 미리 할당해서 넘김!\n          int flags,             // 무엇을 부모와 공유할지 (CLONE_VM 등)\n          void *arg, ...);\n<\/pre>\n\n[[img:L8-31.png|Allocation of Stack and TLS — 스레드는 \"address-space-shared process\"|medium]]\n\n슬라이드가 던진 두 질문의 답:\n* '''왜 OS가 스레드 스택을 할당하지 않나?''' 스레드는 '''이미 존재하는 주소 공간 안'''에 만들어진다. 그 안에 메모리를 잡는 건 유저 레벨 `mmap`으로 충분하고 [[특권 명령]]이 필요 없다. 스택 크기·guard page·TLS 배치 같은 '''정책은 라이브러리가''' 결정하게 하면 커널은 단순해진다 (mechanism/policy 분리).\n* '''왜 프로세스는 OS가 해 주나?''' 새 프로세스는 '''새 주소 공간 자체'''가 필요한데, 페이지 테이블을 만드는 것은 커널만 할 수 있는 특권 연산이다. [[주소 공간]]이 '''보호의 단위'''이기 때문.\n\n{analogy}🎭 스레드 스택 = '''공용 사무실의 개인 책상'''. 사무실(주소 공간)은 회사가 빌려 주지만(커널이 만듦), 책상은 팀에서 알아서 하나 더 들여놓는다(라이브러리가 `mmap`). 책상 사이에 칸막이(guard page)는 있지만 '''잠금장치는 없다''' — 옆 사람 책상 서랍을 열 수 있다(포인터만 있으면 남의 스택을 읽고 쓸 수 있다).{/analogy}\n\n{warn}스택이 '''따로'''라는 건 보호된다는 뜻이 '''아니다'''. 같은 [[주소 공간]]이므로 주소만 알면 다른 스레드의 스택에 접근할 수 있다. 그래서 '''스레드 함수에서 자기 지역 변수의 주소를 리턴하면''' 스레드 종료 후 dangling pointer가 된다.{/warn}\n\n{quiz}[[counter 예제]]에서 루프 변수 `i`는 왜 [[race condition]]을 일으키지 않는가?{/quiz}\n{answer}`i`는 '''지역 변수'''라 각 스레드의 '''자기 스택'''에 따로 존재한다. 공유되는 것은 전역·static·[[힙]]뿐이고, `counter`가 바로 그 전역이다.{/answer}\n\n== 관련 문서 ==\n* [[스레드]] · [[TCB]] · [[TLS]] · [[주소 공간]]\n* [[스택]] · [[힙]] · [[pthread_create]]\n* [[counter 예제]]"
 },
 "pthread_create": {
  "title": "pthread_create",
  "category": [
   "8강 Concurrency",
   "용어"
  ],
  "body": "'''`pthread_create`'''는 [[스레드]]를 만드는 POSIX API다. 8강 p.29의 주인공이며, 프로세스의 [[fork]]에 대응하는 위치에 있다.\n\n[[img:L8-29.png|Thread Creation — pthread_create의 네 인자|medium]]\n\n<pre class=\"c\">\n#include &lt;pthread.h&gt;\n\nint\npthread_create(          pthread_t      *thread,\n                   const pthread_attr_t *attr,\n                         void *         (*start_routine)(void *),\n                         void *         arg);\n<\/pre>\n\n== 인자 네 개 ==\n\n{|\n! 인자 || 슬라이드 설명 || 보통 쓰는 값\n|-\n| `thread` || \"Used to '''interact''' with this thread.\" `pthread_t` 변수의 '''주소'''를 넘기면 채워 준다 || `&p1`\n|-\n| `attr` || \"Used to specify any '''attributes''' this thread might have — '''Stack size, Scheduling priority''', …\" || `NULL` (기본값)\n|-\n| `start_routine` || \"the function this thread '''start running in'''.\" `void *`를 받아 `void *`를 반환하는 '''함수 포인터''' || `mythread`\n|-\n| `arg` || \"the argument to be passed to the function. '''a void pointer allows us to pass in any type of argument.'''\" || 문자열, 구조체 포인터\n|}\n\n반환값은 성공 시 0, 실패 시 에러 코드다.\n\n{exam}🎯 `attr`이 무엇을 지정하는지 묻는 빈칸 문제가 나오기 좋다. 슬라이드에 적힌 두 가지는 '''stack size'''와 '''scheduling priority'''다. 그대로 외울 것.{/exam}\n\n== 함수 포인터 타입 읽기 ==\n\n`void *(*start_routine)(void *)`를 안쪽부터 읽으면:\n# `start_routine` — 이름\n# `(*start_routine)` — 포인터다\n# `(*start_routine)(void *)` — `void *`를 받는 '''함수'''를 가리키는 포인터\n# `void *(*start_routine)(void *)` — 그 함수는 `void *`를 반환한다\n\n== 왜 `void *`인가 ==\n\nC에는 제네릭이 없으니 \"아무 포인터\"를 받게 해서 범용성을 확보한 것이다. 인자가 여러 개면 '''구조체로 묶어서''' 주소를 넘기고, 받는 쪽에서 캐스팅한다.\n\n<pre class=\"c\">\ntypedef struct { int a; int b; } myarg_t;\n\nvoid *mythread(void *arg) {\n    myarg_t *args = (myarg_t *) arg;    // 원래 타입으로 캐스팅\n    printf(\"%d %d\\n\", args->a, args->b);\n    return NULL;\n}\n\nint main() {\n    pthread_t p;\n    myarg_t args = { 10, 20 };\n    pthread_create(&p, NULL, mythread, &args);\n    pthread_join(p, NULL);\n    return 0;\n}\n<\/pre>\n\n{warn}흔한 실수 두 가지.\n① '''스레드 함수에서 자기 스택의 지역 변수 주소를 리턴'''하면, 스레드가 끝나며 [[스레드 스택|스택]]이 사라져 dangling pointer가 된다.\n② `main`에서 만든 `args`를 스레드에 넘겨 놓고 `main`이 먼저 리턴해 버려도 같은 문제가 생긴다 — 그래서 [[pthread_join]]이 필요하다.{/warn}\n\n{info}컴파일할 때 '''`-pthread`''' 옵션이 필요하다. 슬라이드 p.38의 명령줄: `gcc -o main main.c -Wall -pthread`{/info}\n\n== 내부 동작 ==\n\n`pthread_create`는 시스템 콜이 '''아니다'''. 라이브러리 함수이고, 내부에서 이렇게 움직인다 (리눅스/glibc 기준):\n\n# `mmap`으로 [[스레드 스택|스택]] 영역(+ guard page + [[TLS]] 블록 + 스레드 디스크립터)을 할당 — '''유저 레벨'''\n# `clone(start_thread, 스택_꼭대기, CLONE_VM | CLONE_FILES | CLONE_FS | CLONE_SIGHAND | CLONE_THREAD | CLONE_SETTLS | …, arg)` 호출 — '''여기서만 커널'''\n# 커널은 새 task(`task_struct`)를 만들고, 넘겨받은 스택 포인터로 시작시킨다\n\n{analogy}🎭 [[fork]]가 '''집을 통째로 복사'''해서 독립시키는 것이라면, `pthread_create`는 '''같은 집에 책상 하나 더 들여놓고 룸메이트를 들이는''' 것이다. 이사(주소 공간 생성)가 없으니 훨씬 싸다.{/analogy}\n\n{info}리눅스 커널 입장에서 '''프로세스와 스레드의 차이는 공유 플래그 차이뿐'''이다. `fork()`는 사실상 \"아무것도 공유하지 않는 `clone`\"이다. `CLONE_VM`이 붙으면 [[주소 공간]]을 공유하는 \"address-space-shared process\" = 스레드가 된다.{/info}\n\n{quiz}`pthread_create`의 네 번째 인자 타입이 `void *`인 이유는? 인자를 두 개 넘기려면 어떻게 하는가?{/quiz}\n{answer}C에 제네릭이 없어 \"아무 타입이나\" 넘길 수 있게 하기 위해서다. 인자가 여러 개면 '''구조체를 하나 만들어''' 그 주소를 넘기고, 스레드 함수에서 원래 타입으로 캐스팅한다.{/answer}\n\n== 관련 문서 ==\n* [[pthread_join]] · [[스레드]] · [[스레드 스택]] · [[TLS]]\n* [[fork]] · [[스레드와 프로세스 비교]]"
 },
 "pthread_join": {
  "title": "pthread_join",
  "category": [
   "8강 Concurrency",
   "용어"
  ],
  "body": "'''`pthread_join`'''은 지정한 [[스레드]]가 끝날 때까지 기다리는 함수다. 프로세스의 [[wait]]에 정확히 대응한다.\n\n<pre class=\"c\">\nint pthread_join(pthread_t thread, void **value_ptr);\n<\/pre>\n\n* `thread` — 기다릴 스레드 ([[pthread_create]]가 채워 준 핸들)\n* `value_ptr` — 그 스레드가 `return`한 `void *`를 받을 곳. 필요 없으면 `NULL`\n\n슬라이드 p.32의 주석이 정의 그 자체다: `// join waits for the threads to finish`\n\n[[img:L8-32.png|main이 두 스레드를 만들고 둘 다 join한 뒤 \"main: end\"를 출력한다|medium]]\n\n== 무엇을 보장하고 무엇을 보장하지 않나 ==\n\n{|\n! 보장한다 || 보장하지 '''않는다'''\n|-\n| `pthread_join(p1, ...)`가 리턴했으면 '''p1은 확실히 끝났다''' || p1이 p2보다 '''먼저 실행'''된다\n|-\n| 두 join 뒤에는 두 스레드의 모든 쓰기가 끝나 있다 || join한 '''순서대로''' 스레드가 끝난다\n|-\n| 이미 끝난 스레드를 join하면 '''즉시 리턴'''한다 || 어느 스레드가 먼저 스케줄될지\n|}\n\n{exam}⭐ 8강 p.33~35의 핵심. '''`join` 순서는 main이 기다리는 순서일 뿐, 스레드의 실행 순서와 무관하다.''' p.35에서는 [[스케줄러]]가 T2를 먼저 골라서 출력이 `B / A`가 된다. 그래도 `main: end`는 항상 마지막이다.{/exam}\n\n== 상태 전이 (p.33 vs p.34) ==\n\n슬라이드가 두 표현을 구분해서 쓴다. [[프로세스 상태]] 문제로 엮이기 쉬우니 반드시 구분할 것.\n\n{|\n! 표현 || 무슨 일 || 상태 전이\n|-\n| \"main '''goes to sleep'''\" (p.33) || `join`에서 스스로 대기 || Running → '''Blocked'''\n|-\n| \"main is '''preempted'''\" (p.34, p.35) || [[타이머 인터럽트]]로 강제로 빼앗김 || Running → '''Ready'''\n|}\n\n{analogy}🎭 `pthread_join` = '''약속 장소에서 기다리기'''. 친구(스레드)가 이미 도착해 있으면 기다리지 않고 바로 간다(즉시 리턴). 아직이면 앉아서 잔다(Blocked). 다만 '''내가 A를 먼저 기다린다고 해서 A가 먼저 오는 건 아니다''' — 순서는 [[스케줄러]] 마음이다.{/analogy}\n\n== wait()와의 비교 ==\n\n{|\n! || [[wait]] (프로세스) || `pthread_join` (스레드)\n|-\n| 누구를 기다리나 || 자식 프로세스 || 같은 프로세스 안의 스레드\n|-\n| 대상 지정 || `wait()`는 아무 자식, `waitpid()`로 특정 || '''항상 특정 스레드'''\n|-\n| 받는 값 || exit status (정수) || `void *` (아무 포인터)\n|-\n| 부모만 가능? || 부모만 || '''아무 스레드나''' join 가능\n|}\n\n{warn}스레드 함수가 '''자기 [[스레드 스택|스택]]의 지역 변수 주소를 리턴'''하면, `value_ptr`로 받은 포인터는 이미 사라진 스택을 가리킨다. 리턴값은 [[힙]]이나 전역을 가리켜야 한다.{/warn}\n\n{quiz}아래 프로그램이 출력할 수 있는 결과를 모두 쓰시오.\n<pre class=\"c\">\nprintf(\"main: begin\\n\");\npthread_create(&p1, NULL, mythread, \"A\");   // mythread는 arg를 출력\npthread_create(&p2, NULL, mythread, \"B\");\npthread_join(p1, NULL);\npthread_join(p2, NULL);\nprintf(\"main: end\\n\");\n<\/pre>{/quiz}\n{answer}'''2가지''' — `begin/A/B/end`와 `begin/B/A/end`.\n`main: begin`은 스레드 생성 전이라 항상 처음, `main: end`는 `join(p2)`가 B의 종료를 기다리므로 항상 마지막이다. A와 B의 순서만 자유롭다.{/answer}\n\n== 관련 문서 ==\n* [[pthread_create]] · [[스레드]] · [[프로세스 상태]]\n* [[wait]] · [[스케줄러]] · [[타이머 인터럽트]]"
 },

  "body": "'''TLS'''(Thread-Local Storage)는 \"'''static처럼 오래 살고 어디서나 보이지만, [[스레드]]마다 따로 있는 변수'''\"다. 8강 p.30이 다룬다.\n\n[[img:L8-30.png|8강 p.30 — Thread-local storage|medium]]\n\n{warn}📌 2026-09-23 퀴즈 범위는 '''8강 p.30(TLS)까지'''였다 ([[시험 정보]]). 즉 TLS는 '''범위의 마지막 슬라이드'''로, 출제 가능성이 높게 잡혔던 항목이다.{/warn}\n\n== 슬라이드의 정의 ==\n\n{def}'''Different from local variables'''\n* Local variables are visible only during a '''single function invocation'''\n* TLS visible '''across function invocations'''\n\n'''Similar to static data'''\n* TLS is '''unique to each thread'''\n\n'''Local variables vs Thread-local storage''' — Scope: '''Function frame vs Thread'''{/def}\n\n== 세 가지 비교 ==\n\n{|\n! || 지역 변수 || '''TLS''' || static / 전역\n|-\n| Scope (수명) || '''Function frame''' — 함수 리턴하면 사라짐 || '''Thread''' — 스레드가 사는 동안 || 프로세스 전체\n|-\n| 스레드마다 사본? || O (각자 [[스레드 스택|스택]]) || '''O''' || '''X — 하나를 공유'''\n|-\n| 함수 호출을 넘어 유지 || X || '''O''' || O\n|-\n| [[race condition]] 위험 || 없음 || '''없음''' || '''있음'''\n|}\n\n→ TLS는 static의 '''수명'''과 지역 변수의 '''안전성'''을 합친 것이다.\n\n{analogy}🎭 전역 변수 = '''사무실 공용 화이트보드'''(아무나 덮어씀), 지역 변수 = '''손에 든 포스트잇'''(회의 끝나면 버림), TLS = '''개인 다이어리'''다. 내 것은 나만 보고, 회의가 끝나도 남아 있으며, 옆자리 사람 것과 섞이지 않는다.{/analogy}\n\n== 대표 예: `errno` ==\n\n시스템 콜 실패 원인을 담는 `errno`가 진짜 전역이라면, 스레드 A의 `open` 실패 코드를 스레드 B의 `read` 실패가 덮어쓴다. 그래서 멀티스레드 C 라이브러리에서 '''`errno`는 TLS'''다.\n\n선언 문법:\n<pre class=\"c\">\n_Thread_local int x;   // C11 표준\n__thread int x;        // GCC 확장\nthread_local int x;    // C++11\n<\/pre>\n\n<pre class=\"c\">\n__thread int count = 0;      // 스레드마다 자기 count\n\nvoid *worker(void *arg) {\n    for (int i = 0; i &lt; 5; i++)\n        count++;             // 락 없어도 안전 — 공유가 아니다\n    printf(\"%d\\n\", count);   // 모든 스레드가 5를 출력\n    return NULL;\n}\n<\/pre>\n\n{warn}같은 코드에서 `__thread`를 떼면 `count`는 전역이 되고, 즉시 [[counter 예제]]와 같은 [[race condition]]이 생긴다. '''TLS인지 아닌지가 락이 필요한지를 가른다.'''{/warn}\n\n== \"Where should it be allocated?\" ==\n\n슬라이드가 던진 질문이다. 조건을 보면 답이 나온다 — 스레드마다 하나 + 스레드 수명 동안 유지 → '''스레드를 만들 때 스레드별 메모리 영역에''' 잡아야 한다.\n\n실제로는 p.31처럼 '''pthread 라이브러리가 유저 공간에''' 할당한다. glibc는 보통 [[스레드 스택]]으로 잡은 영역 끝에 TLS 블록과 스레드 디스크립터를 함께 둔다. 그리고 '''전용 [[레지스터]]'''가 현재 스레드의 TLS를 가리킨다:\n\n{|\n! 아키텍처 || TLS 포인터 레지스터\n|-\n| x86-64 || `%fs`\n|-\n| [[RISC-V]] || `tp` (thread pointer)\n|}\n\n[[스레드 컨텍스트 스위치]] 때 이 레지스터만 바꾸면 TLS도 자동으로 따라 바뀐다. [[xv6]]에서도 `tp`는 [[trapframe]]에 저장되는 레지스터 중 하나다 (xv6 커널은 `tp`에 hart id를 넣어 쓴다).\n\n`clone`의 `CLONE_SETTLS` 플래그가 이 영역의 주소를 커널에 알려 주는 역할을 한다. → [[pthread_create]]\n\n{quiz}TLS, 지역 변수, 전역 변수의 차이를 '''scope''' 기준으로 한 줄씩 쓰시오. TLS의 실제 사용 예도 하나 들라.{/quiz}\n{answer}지역 변수 scope = '''function frame'''(호출이 끝나면 사라짐), 전역 = '''프로세스 전체에서 하나를 공유''', TLS = '''스레드''' — 여러 함수에서 보이고 스레드가 사는 동안 유지되지만 '''스레드마다 따로'''다. 예: `errno`. (p.30){/answer}\n\n{quiz}TLS 변수는 왜 [[락]] 없이 증가시켜도 안전한가?{/quiz}\n{answer}스레드마다 '''별도의 사본'''이 존재해 '''공유 데이터가 아니기''' 때문이다. [[critical section]]의 정의(\"공유 변수에 접근하는 코드\") 자체를 만족하지 않으므로 [[race condition]]이 성립하지 않는다.{/answer}\n\n== 관련 문서 ==\n* [[스레드]] · [[스레드 스택]] · [[TCB]]\n* [[pthread_create]] · [[race condition]] · [[counter 예제]]\n* [[시험 정보]]"
 },
 "스레드와 프로세스 비교": {
  "title": "스레드와 프로세스 비교 (Processes vs Threads)",
  "category": [
   "8강 Concurrency",
   "비교표"
  ],
  "body": "8강 p.24 \"Processes vs Threads\"는 '''표 하나로 외워야 하는 슬라이드'''다. 슬라이드가 쓰는 표현(\"heavy-weight\", \"light-weight\", \"non-trivial\")까지 그대로 기억하는 게 좋다.\n\n[[img:L8-28.png|8강 p.28 — single-threaded vs two-threaded 주소 공간|medium]]\n\n== 슬라이드 원문 표 ==\n\n{def}'''(Heavy-weight) processes have separate address space'''\n* Expensive process creation\n* Expensive process switch\n* '''Non-trivial''' memory sharing between processes\n\n'''(Light-weight) threads share address space'''\n* Light thread creation\n* Simple thread switch\n* Simple memory sharing among threads{/def}\n\n{|\n! || (Heavy-weight) '''Process''' || (Light-weight) '''Thread'''\n|-\n| [[주소 공간]] || '''분리(separate)''' || '''공유(share)'''\n|-\n| 생성 || '''비쌈''' — 주소 공간·페이지 테이블 새로 만듦, [[fork]]는 부모 메모리 복사까지 || '''가벼움''' — [[스레드 스택|스택]] 하나 + [[TCB]]만\n|-\n| 전환 || '''비쌈''' — 레지스터 + '''주소 공간 교체'''(페이지 테이블 레지스터 변경 → TLB flush) || '''단순''' — [[레지스터]]만 교체\n|-\n| 메모리 공유 || '''어려움(non-trivial)''' — pipe, 공유 메모리 등 IPC 필요 || '''간단''' — 같은 전역 변수·[[힙]] 포인터를 그냥 봄\n|}\n\n== 슬라이드 밖이지만 알아둘 것 ==\n\n{|\n! || Process || Thread\n|-\n| 고장 격리 || 한 프로세스가 죽어도 다른 프로세스는 무사 || 한 스레드가 segfault → '''프로세스 전체''' 종료\n|-\n| 버그 위험 || 공유가 없으니 race 적음 || 공유가 기본이라 '''[[race condition]]''' 위험\n|-\n| 식별자 || PID || TID (리눅스에선 같은 `task_struct`)\n|}\n\n{warn}⭐ \"'''스레드는 메모리 공유가 간단하다'''\"는 장점이자 '''8강 이후 모든 문제의 원인'''이다. 보호(분리)를 포기하고 편리함(공유)을 얻은 대가를 [[mutual exclusion|동기화]]로 치르는 구조다.{/warn}\n\n== 무엇이 따로고 무엇이 공유인가 ==\n\n{|\n! 스레드마다 따로 || 모든 스레드가 공유\n|-\n| [[프로그램 카운터|PC]] || 코드(text)\n|-\n| [[레지스터]] 세트 ([[스택 포인터|sp]] 포함) || 전역 변수, `static` 변수\n|-\n| '''[[스레드 스택|스택]]''' || '''[[힙]]'''\n|-\n| [[TLS]] || 열린 파일 디스크립터\n|-\n| 스레드 상태·스케줄링 정보 ([[TCB]]) || [[주소 공간]], PID, 작업 디렉터리\n|}\n\n{exam}🎯 \"공유하는 것 2개, 따로 갖는 것 2개를 쓰시오\" 유형이 8강 예상 문제 Q2로 정리되어 있다. 위 표의 왼쪽/오른쪽에서 각각 두 개씩 고르면 된다.{/exam}\n\n== 전환 비용 비교 ==\n\n{|\n! 단계 || 프로세스 전환 || 스레드 전환 (같은 프로세스 내)\n|-\n| 레지스터 저장/복원 || O ([[PCB]]) || O ([[TCB]])\n|-\n| 주소 공간 교체 (x86 `CR3`, [[RISC-V]] `satp`) || '''O''' || '''X'''\n|-\n| TLB || flush 또는 ASID로 구분 필요 || '''그대로 유효'''\n|-\n| 캐시 || 새 프로세스 데이터로 식음 || 공유 데이터는 캐시에 남음\n|}\n\n→ 저장하는 '''양'''은 비슷하지만, 주소 공간을 안 바꾸니 '''그 뒤의 간접 비용'''이 크게 줄어든다. 이게 \"simple thread switch\"의 정체다. 자세히는 [[스레드 컨텍스트 스위치]].\n\n{analogy}🎭 프로세스 전환 = '''이사'''. 짐도 옮기고 주소도 바꾸고 우편물도 새로 신청해야 한다(TLB flush, 캐시 오염).\n스레드 전환 = '''같은 집에서 룸메이트끼리 거실 TV 리모컨을 넘기는 것'''. 주소는 그대로고 짐도 안 옮긴다.{/analogy}\n\n{quiz}스레드 간 [[컨텍스트 스위치]]가 프로세스 간 전환보다 가벼운 이유는?{/quiz}\n{answer}레지스터 저장/복원은 같지만 '''[[주소 공간]](페이지 테이블)을 바꾸지 않는다'''. 따라서 페이지 테이블 레지스터 교체, TLB flush, 캐시 오염 같은 '''간접 비용이 없다'''. (p.27){/answer}\n\n{quiz}\"프로세스 간 메모리 공유는 non-trivial하다\"는 말은 구체적으로 무슨 뜻인가?{/quiz}\n{answer}프로세스는 [[주소 공간]]이 분리되어 있어, 같은 데이터를 보려면 pipe·공유 메모리 세그먼트·메시지 큐 같은 '''IPC 메커니즘을 따로 설정'''해야 한다. 스레드는 그냥 같은 전역 변수를 참조하면 끝이다.{/answer}\n\n== 관련 문서 ==\n* [[스레드]] · [[프로세스]] · [[주소 공간]]\n* [[스레드 컨텍스트 스위치]] · [[컨텍스트 스위치]] · [[TCB]] · [[PCB]]\n* [[pthread_create]] · [[fork]] · [[race condition]]"
 },
 "race condition": {

  ],
  "body": "'''Race condition'''(경쟁 상태)은 8강에서 '''정의 문장을 영어로 통째로 외워야 하는''' 최우선 항목이다. 실제로 2025F 중간고사에 슬라이드 문장 그대로 출제되었다.\n\n[[img:L8-42.png|Race Condition and Critical Section — 슬라이드 p.42|large]]\n\n{def}'''Race condition''' — \"An '''undesirable situation''' that occurs when a device or system attempts to perform '''two or more operations at the same time'''.\"\n\n\"Race condition occurs when there exists a '''critical section(s)''' in the code.\"{/def}\n\n{exam}🎯 '''2025F 중간고사 Problem 2-e) 출제.'''\n\"What is the name of an undesirable situation that occurs when a device or system attempts to perform two or more operations at the same time?\" → '''Race Condition'''\n문제 문장이 '''슬라이드 정의와 한 글자도 다르지 않다'''. 교수님은 정의→용어 단답을 이렇게 낸다. → [[2025F 중간고사 족보]]{/exam}\n\n== OSTEP의 더 정확한 정의 ==\n\n슬라이드 정의는 짧아서 \"왜 나쁜가\"가 안 보인다. OSTEP 26장의 설명을 덧붙이면:\n\n> 여러 스레드가 [[critical section]]에 '''거의 동시에 진입'''해서 공유 자료를 갱신하려 할 때, 결과가 '''명령어 실행 타이밍(인터리빙)에 따라 달라지는''' 상황. 결과가 '''indeterminate''' — 같은 입력에도 실행마다 다르다.\n\n이름 그대로 스레드들이 \"누가 먼저 가나\" '''경주(race)'''하고, 그 승패에 결과가 좌우된다. OSTEP은 공유 데이터에 대한 이 경우를 '''data race'''라고도 부른다.\n\n== 구체적 증상 ==\n\n[[counter 예제]]에서 기대값은 20,000,000인데:\n\n[[img:L8-38.png|첫 실행 19345221, 두 번째 실행 19221041 — 매번 다르고 항상 모자라다|large]]\n\n{|\n! 증상 || 설명\n|-\n| 결과가 '''틀림''' || lost update — 한 스레드의 증가가 다른 스레드의 늦은 store에 덮임\n|-\n| 결과가 '''매번 다름''' || non-deterministic / indeterminate. 재현이 안 되니 디버깅이 지옥\n|-\n| CPU 1개여도 발생 || [[타이머 인터럽트]]에 의한 [[컨텍스트 스위치]]만 있으면 충분하다\n|}\n\n[[sim:counter_race]]\n\n{warn}'''\"멀티코어에서만 생긴다\"는 오해에 주의.''' 원인은 병렬 실행이 아니라 '''uncontrolled scheduling''' — 아무 명령어 경계에서나 끊길 수 있다는 것이다. 싱글 CPU에서도 그대로 발생한다.{/warn}\n\n== 용어 4형제 정리 ==\n\n{|\n! 용어 || 한 줄 정의 || 품사\n|-\n| '''[[critical section]]''' || 공유 자원에 접근하는 '''코드 조각''' || 장소\n|-\n| '''Race condition''' || 여러 스레드가 critical section을 동시에 실행해 결과가 타이밍에 좌우되는 '''상황''' || 현상\n|-\n| '''Indeterminate''' || 같은 입력에도 실행마다 결과가 다른 '''성질''' || 증상\n|-\n| '''[[mutual exclusion]]''' || 한 스레드가 critical section 안에 있으면 다른 스레드는 못 들어오게 하는 '''성질''' || 해법\n|}\n\n인과 사슬:\n<pre class=\"ascii\">\n공유 자원 존재\n  -> 그것에 접근하는 코드 = critical section\n  -> 보호 없이 여러 스레드가 동시 실행 = race condition\n  -> 결과가 indeterminate\n  -> 해법: mutual exclusion (lock)\n<\/pre>\n\n{analogy}🎭 race condition = '''두 사람이 같은 종이에 잔액을 고쳐 적는 것'''. 둘 다 \"잔액 50\"을 읽고 각자 머릿속에서 51을 만든 뒤, 차례로 종이에 51을 적는다. 두 번 입금했는데 잔액은 한 번만 올랐다. 문제는 \"동시에 적은 것\"이 아니라 '''읽기와 쓰기 사이에 남이 끼어든 것'''이다.{/analogy}\n\n== 9강의 반전 ==\n\n[[flag 락]]은 race condition을 막으려고 만든 코드인데, '''그 코드 자체에 race condition이 있다'''. `while (flag == 1)`(TEST)와 `flag = 1`(SET)이 별개의 명령이라 그 틈에 끊기면 두 스레드가 모두 락을 얻는다.\n\n같은 패턴이 [[queue 락]]의 '''wakeup/waiting race'''에서도 반복된다 — \"큐에 등록\"과 \"[[park와 unpark|park()]]\" 사이의 틈. '''원자적이어야 할 두 동작이 분리되어 있으면 늘 race가 생긴다'''는 것이 8~9강을 관통하는 패턴이다.\n\n{quiz}Race condition과 [[critical section]]을 정의하고 둘의 관계를 쓰시오.{/quiz}\n{answer}'''Critical section''' = 공유 변수(자원)에 접근해서 둘 이상의 스레드가 동시에 실행하면 안 되는 코드 조각.\n'''Race condition''' = 그런 코드가 보호 없이 동시에 실행되어, 결과가 실행 타이밍에 따라 달라지는(indeterminate) 바람직하지 않은 상황.\n'''관계''': 코드에 critical section이 존재할 때 race condition이 발생하며, [[mutual exclusion]]으로 막는다. (p.42~43){/answer}\n\n{quiz}CPU가 하나뿐인 시스템에서도 race condition이 생길 수 있는가? 이유는?{/quiz}\n{answer}'''생긴다.''' [[타이머 인터럽트]]에 의한 [[컨텍스트 스위치]]가 '''아무 명령어 경계에서나''' 일어나므로, `load / add / store` 사이에서 끊기면 다른 스레드가 옛 값을 읽어 간다. 병렬 실행이 원인이 아니라 '''uncontrolled scheduling'''이 원인이다.{/answer}\n\n== 관련 문서 ==\n* [[critical section]] · [[mutual exclusion]] · [[atomic]] · [[counter 예제]]\n* [[스레드]] · [[타이머 인터럽트]] · [[컨텍스트 스위치]]\n* [[락]] · [[flag 락]] · [[2025F 중간고사 족보]] · [[자주 틀리는 함정 모음]]"
 },
 "critical section": {
  "title": "Critical Section (임계 구역)",
  "category": [
   "8강 Concurrency",
   "용어"
  ],
  "body": "'''Critical section'''(임계 구역)은 [[race condition]]이 생기는 '''장소'''다. 슬라이드 정의를 영어로 외워 두자.\n\n{def}'''Critical section''' — \"A piece of code that '''accesses a shared variable''' (or a shared resource) and '''must not be concurrently executed by more than one thread'''.\"{/def}\n\n두 조건이 '''and'''로 묶여 있다는 게 포인트다:\n# 공유 변수(자원)에 '''접근'''한다\n# 둘 이상의 스레드가 '''동시에 실행해서는 안 된다'''\n\n[[img:L8-42.png|슬라이드 p.42 — 18번 줄 counter = counter + 1 만이 critical section|large]]\n\n== 어디까지가 critical section인가 ==\n\n<pre class=\"c\">\n15     printf(\"%s: begin\\n\", (char *) arg);\n16     int i;\n17     for (i = 0; i &lt; 1e7; i++) {\n18         counter = counter + 1;      // &lt;- Critical Section\n19     }\n20     printf(\"%s: done\\n\", (char *) arg);\n<\/pre>\n\n{|\n! 코드 || critical section인가 || 이유\n|-\n| 18번 줄 `counter = counter + 1;` || '''O''' || `counter`가 전역 = 공유 데이터. 기계어로는 load/add/store 3개\n|-\n| 17번 줄 `i++`, `i < 1e7` || '''X''' || `i`는 '''지역 변수''' → 각 스레드의 [[스레드 스택|스택]]에 따로\n|-\n| 15·20번 줄 `printf` || 애매 || stdout은 공유 자원이지만 glibc의 `printf`는 '''내부적으로 락을 잡는다'''(thread-safe) → 줄이 섞이진 않고 순서만 달라짐\n|}\n\n{warn}'''한 줄이라고 안전한 게 아니다.''' `counter = counter + 1;`은 C로는 한 줄이지만 기계어로는 '''세 명령어'''이고, 그 사이에서 끊긴다. → [[counter 예제]]{/warn}\n\n== 크기가 성능을 가른다 ==\n\n{|\n! critical section이 || 결과\n|-\n| 너무 크면 || 병렬성이 사라진다 (한 번에 한 스레드만 돌므로 사실상 직렬)\n|-\n| 너무 작으면(빠뜨리면) || [[race condition]] 발생 — '''공유 데이터에 접근하는 모든 곳'''을 감싸야 한다\n|}\n\n실전 개선 예 — 공유가 아닌 것은 밖으로 빼낸다:\n\n<pre class=\"c\">\nint local = 0;\nfor (i = 0; i &lt; 1e7; i++) local++;                 // 공유 아님 -> 락 불필요\nlock(&mutex); counter += local; unlock(&mutex);    // critical section을 1회로\n<\/pre>\n\n{analogy}🎭 critical section = '''1인용 화장실'''이다. 화장실 안(공유 자원)에서 하는 일이 critical section이고, 문을 잠그는 게 [[mutual exclusion]]이다. 화장실 앞에서 옷을 갈아입는 일(지역 변수 계산)까지 안에서 하면 줄이 길어진다 — '''critical section은 짧고 드물게'''.{/analogy}\n\n== 시험에서 묻는 방식 ==\n\n{exam}🎯 2025F 중간고사 Problem 2는 '''정의를 주고 용어를 쓰게''' 했다. critical section의 정의 문장(\"accesses a shared variable … must not be concurrently executed by more than one thread\")도 같은 방식으로 나올 수 있다. 또 코드를 주고 '''\"critical section에 해당하는 줄 번호를 쓰시오\"''' 형태도 가능하다. → [[2025F 중간고사 족보]]{/exam}\n\n{quiz}아래 코드에서 critical section은 몇 번 줄인가? `i`는 왜 아닌가?\n<pre class=\"c\">\n16     int i;\n17     for (i = 0; i &lt; 1e7; i++) {\n18         counter = counter + 1;\n19     }\n<\/pre>{/quiz}\n{answer}'''18번 줄'''뿐이다. `counter`는 전역(static)이라 두 스레드가 '''공유'''하지만, `i`는 '''지역 변수'''여서 각 스레드의 [[스레드 스택|스택]]에 따로 존재한다 — 공유 자원이 아니므로 critical section의 정의를 만족하지 않는다.{/answer}\n\n{quiz}[[TLS]] 변수에 접근하는 코드는 critical section인가?{/quiz}\n{answer}'''아니다.''' TLS는 스레드마다 별도의 사본을 가지므로 '''공유 변수가 아니다'''. 정의의 첫 조건(\"accesses a shared variable\")부터 만족하지 않는다.{/answer}\n\n== 관련 문서 ==\n* [[race condition]] · [[mutual exclusion]] · [[atomic]]\n* [[counter 예제]] · [[스레드 스택]] · [[TLS]]\n* [[락]] · [[2025F 중간고사 족보]]"
 },
 "mutual exclusion": {
  "title": "Mutual Exclusion (상호 배제)",
  "category": [
   "8강 Concurrency",
   "용어"
  ],
  "body": "'''Mutual exclusion'''(상호 배제)은 [[race condition]]의 '''해법'''이다. 8강 p.43 \"Enforcing Mutual Exclusion\"이 정의한다.\n\n[[img:L8-43.png|8강 p.43 — Enforcing Mutual Exclusion|medium]]\n\n{def}\"We must '''synchronize''' the execution of the threads so that '''only one thread enters a critical section''' and performs all the operations '''atomically'''.\"\n* Guarantee '''mutually exclusive access''' to critical regions\n* In other words, '''support atomicity''' for critical sections{/def}\n\n즉 mutual exclusion = \"[[critical section]]에 [[atomic|원자성]]을 부여하는 것\"이다. 두 표현은 같은 말이다.\n\n== 대표적 해법 네 가지 (슬라이드 목록) ==\n\n{|\n! 도구 || 설명 || 어디서\n|-\n| '''Mutex (lock)''' || 한 번에 하나만 들어가는 자물쇠. `lock()` / `unlock()` || `pthread_mutex_t` → 9강 [[락]]\n|-\n| '''Semaphore''' || 정수 카운터 + wait/post. 값 1이면 lock처럼, N이면 N개까지 허용 || POSIX `sem_t`\n|-\n| '''Condition variables''' || \"어떤 조건이 참이 될 때까지 '''기다리기'''\" || '''Pthreads''' `pthread_cond_wait/signal`\n|-\n| '''Monitors''' || 락 + 조건 변수를 '''언어 차원'''에서 묶은 것 || '''Java''' `synchronized`\n|}\n\n{exam}🎯 이 목록은 \"(Pthreads)\", \"(Java)\"라는 괄호까지 슬라이드에 적혀 있다. '''\"Monitor는 어느 언어?\" → Java''', '''\"Condition variable은 어디?\" → Pthreads''' 같은 단답이 나오기 좋다.{/exam}\n\n{info}동시성 문제는 두 종류다 (OSTEP 26장).\n① 공유 데이터에 대한 '''원자성''' 문제 → '''lock'''\n② 한 스레드가 다른 스레드의 '''어떤 일이 끝나길 기다리는''' 문제(예: [[pthread_join]], I/O 완료 대기) → '''condition variable'''\n목록에 조건 변수가 들어 있는 이유가 ②다. 2025F 중간고사에는 조건 변수 관련 '''spurious wakeup'''도 출제되었다.{/info}\n\n== 락을 끼운 코드 (p.44) ==\n\n> \"'''Ensure that any such critical section executes as if it were a single atomic instruction'''\"\n\n<pre class=\"c\">\n13 lock_t mutex;\n14 void *mythread(void *arg) {\n15     printf(\"%s: begin\\n\", (char *) arg);\n16     int i;\n17     for (i = 0; i &lt; 1e7; i++) {\n18         lock(&mutex);            // 진입: 다른 스레드가 쥐고 있으면 여기서 대기\n19         counter = counter + 1;   // critical section\n20         unlock(&mutex);          // 퇴장: 기다리던 스레드 하나가 들어올 수 있음\n21     }\n22     printf(\"%s: done\\n\", (char *) arg);\n23     return NULL;\n24 }\n<\/pre>\n\n같은 시나리오를 락과 함께 다시 돌리면:\n\n{|\n! 순서 || Thread 1 || Thread 2 || counter\n|-\n| 1 || `lock` 성공 → load(50), add(51) || || 50\n|-\n| 2 || '''interrupt → T2로 전환''' (T1은 '''락을 쥔 채''' 선점됨) || || 50\n|-\n| 3 || || `lock` 시도 → '''이미 잠김 → 대기''' || 50\n|-\n| 4 || 다시 T1 → store(51) → `unlock` || || 51\n|-\n| 5 || || `lock` 성공 → load(51), add, store(52) → `unlock` || '''52''' ✅\n|}\n\n{warn}⭐ '''오해 방지 3종'''\n① 락은 '''인터럽트(선점)를 막는 게 아니다'''. 2번 행처럼 T1은 여전히 선점된다. 락은 선점돼도 '''다른 스레드가 critical section에 못 들어오게''' 할 뿐이다.\n② 모든 스레드가 '''같은 락 변수'''를 써야 의미가 있다. 스레드마다 다른 락이면 보호 효과 0.\n③ 공유 데이터에 접근하는 '''모든''' 곳을 감싸야 한다. 한 군데라도 빠지면 race.{/warn}\n\n실제 pthread 버전:\n<pre class=\"c\">\npthread_mutex_t mutex = PTHREAD_MUTEX_INITIALIZER;\npthread_mutex_lock(&mutex);\ncounter = counter + 1;\npthread_mutex_unlock(&mutex);\n<\/pre>\n\n{analogy}🎭 mutual exclusion = '''화장실 문 잠그기'''. 안에 있는 사람이 잠깐 졸아도(선점돼도) 문은 잠겨 있으므로 남이 못 들어온다. 결과적으로 안에서 한 일은 '''통째로 한 번에 일어난 것처럼''' 보인다 — 그게 [[atomic|원자성]]이다.{/analogy}\n\n== 그런데 lock() 자체는? ==\n\n`lock()` 안에서도 \"잠겼나 확인 → 잠금 표시\"가 read-modify-write라 '''똑같은 race가 생긴다'''. 그래서 '''하드웨어 원자 명령'''([[test-and-set]], [[compare-and-swap]], [[RISC-V]] `amoswap`)이 필요하다. 이것이 9강 [[락]]의 출발점이다.\n\n[[xv6]]의 `acquire()`도 내부적으로 `__sync_lock_test_and_set` → RISC-V `amoswap.w.aq`를 쓴다.\n\n{quiz}락을 걸면 critical section 실행 중 [[타이머 인터럽트]]가 걸리지 않는가?{/quiz}\n{answer}'''아니다.''' 선점은 여전히 일어난다. 다만 락을 쥔 스레드가 선점된 동안 다른 스레드는 `lock()`에서 막혀 critical section에 들어오지 못하므로, '''결과적으로 원자적으로 실행된 것과 같아진다'''. (p.44){/answer}\n\n{quiz}Mutual exclusion을 \"atomicity\"라는 단어로 다시 정의하면?{/quiz}\n{answer}\"[[critical section]]이 '''하나의 원자 명령처럼(as if it were a single atomic instruction)''' 실행되도록 보장하는 것.\" 슬라이드 p.43·p.44의 표현 그대로다.{/answer}\n\n== 관련 문서 ==\n* [[race condition]] · [[critical section]] · [[atomic]] · [[counter 예제]]\n* [[락]] · [[락 평가 기준]] · [[test-and-set]]\n* [[2025F 중간고사 족보]]"
 },

  "body": "'''Atomicity'''(원자성)는 \"'''전부 실행되거나, 전혀 실행되지 않은 것처럼(all or nothing)''' 보이는 성질\"이다. 중간 상태가 외부에 관찰되지 않는다.\n\n[[img:L8-43.png|8강 p.43 — critical section을 atomic하게|medium]]\n\n{def}슬라이드 p.19 [[test-and-set]] 설명의 표현이 가장 명확하다: \"This sequence of operations is performed '''atomically''' — '''All or nothing and no context switch'''.\"{/def}\n\n== 무엇이 원자적인가 ==\n\n{|\n! 단위 || 원자적? || 근거\n|-\n| 기계어 '''명령어 하나''' || '''O''' || CPU가 보장 — 한 명령어는 중간에 끊기지 않는다\n|-\n| C '''한 줄''' || '''X''' || `counter = counter + 1`은 load/add/store 3개 → [[counter 예제]]\n|-\n| `volatile` 붙인 변수 접근 || '''X''' || 메모리 접근을 강제할 뿐 원자성은 무관\n|-\n| [[test-and-set]], [[compare-and-swap]], [[fetch-and-add]] || '''O''' || 하드웨어가 읽기+쓰기를 한 덩어리로 보장\n|-\n| [[락]]으로 감싼 [[critical section]] || '''O''' (효과상) || 선점은 되지만 남이 못 들어오므로 결과가 동일\n|}\n\n{warn}⭐ '''원자성 ≠ 인터럽트가 안 걸리는 것.''' 중간에 선점되더라도 '''다른 스레드가 그 공유 데이터를 못 건드리면''' 결과적으로 원자적이다. [[mutual exclusion]]이 바로 이 방식이다. 반대로 [[인터럽트 비활성화]]는 \"진짜로 안 끊기게\" 만드는 방식인데, 멀티프로세서에서 무너진다.{/warn}\n\n{analogy}🎭 원자성 = '''은행 송금'''. \"내 계좌에서 빼고 → 네 계좌에 넣는다\"는 두 동작이지만, 외부에서는 '''둘 다 됐거나 둘 다 안 됐거나''' 두 상태만 보여야 한다. \"빠졌는데 안 들어온\" 중간 상태가 보이는 순간 사고다. [[counter 예제]]에서 \"eax는 51인데 counter는 아직 50\"인 상태가 바로 그 중간 상태다.{/analogy}\n\n== read-modify-write가 위험한 이유 ==\n\n원자성이 깨지는 패턴은 거의 항상 '''read-modify-write'''다:\n\n<pre class=\"asm\">\n100  mov 0x8049a1c, %eax   ; READ\n105  add $0x1, %eax        ; MODIFY   <- 여기서 끊기면 사고\n108  mov %eax, 0x8049a1c   ; WRITE\n<\/pre>\n\n같은 위험을 가진 코드들: `x++`, `x += 5`, `list->head = new`, `balance -= amount`, 그리고 [[flag 락]]의 `while(flag==1); flag=1;`.\n\n== 하드웨어가 주는 원자 명령 3종 ==\n\n9강에서 배우는 원자 명령들은 전부 \"'''읽기와 쓰기를 한 덩어리로'''\" 해 준다:\n\n{|\n! 명령 || 하는 일 || 반환값\n|-\n| [[test-and-set]] || 옛 값을 읽고 새 값을 쓴다 || '''옛 값'''\n|-\n| [[compare-and-swap]] || 기대값과 같을 때만 새 값을 쓴다 || 실제 값\n|-\n| [[fetch-and-add]] || 옛 값을 읽고 1 증가시킨다 || '''옛 값'''\n|}\n\n[[RISC-V]]에는 `amoswap`, `amoadd` 같은 AMO(Atomic Memory Operation) 명령과 [[load-linked store-conditional|LR/SC]] 쌍이 있다. x86은 `lock` prefix + `xchg`/`cmpxchg`/`xadd`를 쓴다.\n\n{quiz}`volatile int counter;`로 선언했는데도 두 스레드의 `counter++`가 값을 잃는 이유는?{/quiz}\n{answer}`volatile`은 컴파일러가 값을 레지스터에 캐싱하지 못하게 해 '''매번 메모리에서 읽고 쓰게''' 강제할 뿐, '''read-modify-write의 원자성은 전혀 보장하지 않는다'''. 읽기와 쓰기 사이의 [[컨텍스트 스위치]]를 막지 못한다.{/answer}\n\n{quiz}\"원자적이다\"와 \"인터럽트가 걸리지 않는다\"는 같은 말인가?{/quiz}\n{answer}'''다르다.''' 기계어 명령 하나는 실제로 끊기지 않아서 원자적이지만, [[락]]으로 보호된 [[critical section]]은 '''중간에 선점되어도''' 다른 스레드가 진입하지 못하므로 '''효과상''' 원자적이다. 원자성의 기준은 \"중간 상태가 관찰되지 않는가\"다.{/answer}\n\n== 관련 문서 ==\n* [[mutual exclusion]] · [[critical section]] · [[race condition]] · [[counter 예제]]\n* [[test-and-set]] · [[compare-and-swap]] · [[fetch-and-add]] · [[load-linked store-conditional]]\n* [[락]] · [[인터럽트 비활성화]]"

 "counter 예제": {
  "title": "counter 예제 (Uncontrolled Scheduling Problem)",

  "body": "8강에서 '''손으로 재현할 수 있어야 하는 유일한 표'''가 여기 있다. 두 [[스레드]]가 전역 `counter`를 올리는 예제로, [[race condition]]의 교과서적 시연이다.\n\n== 코드 (p.36~37) ==\n\n<pre class=\"c\">\n 1 #include &lt;stdio.h&gt;\n 2 #include &lt;pthread.h&gt;\n 3 #include \"common.h\"\n 4 #include \"common_threads.h\"\n 5\n 6 static volatile int counter = 0; // shared data\n 7\n 8 // mythread()\n 9 //\n10 // Simply adds 1 to counter repeatedly, in a loop\n11 // No, this is not how you would add 10,000,000 to\n12 // a counter, but it shows the problem nicely.\n13 //\n14 void *mythread(void *arg) {\n15     printf(\"%s: begin\\n\", (char *) arg);\n16     int i;\n17     for (i = 0; i &lt; 1e7; i++) {\n18         counter = counter + 1;\n19     }\n20     printf(\"%s: done\\n\", (char *) arg);\n21     return NULL;\n22 }\n<\/pre>\n\n<pre class=\"c\">\n29 int main(int argc, char *argv[]) {\n30     pthread_t p1, p2;\n31     printf(\"main: begin (counter = %d)\\n\", counter);\n32     pthread_create(&p1, NULL, mythread, \"A\");\n33     pthread_create(&p2, NULL, mythread, \"B\");\n34\n35     // join waits for the threads to finish\n36     pthread_join(p1, NULL);\n37     pthread_join(p2, NULL);\n38     printf(\"main: done with both (counter = %d)\\n\",\n39         counter);\n40     return 0;\n41 }\n<\/pre>\n\n{|\n! 변수 || 어디 있나 || 공유?\n|-\n| `counter` || 전역(static) → 데이터 영역에 '''하나''' || '''O — 두 스레드가 공유'''\n|-\n| `i` || 지역 변수 → 각 스레드의 [[스레드 스택|스택]] || X\n|}\n\n* `static`: 이 파일 안에서만 보이는 전역. '''공유 여부와는 무관''' — 여전히 스레드 간 공유다.\n* `volatile`: 컴파일러가 최적화로 루프를 `counter += 1e7`로 합쳐 버리는 걸 막아 '''매번 메모리에서 읽고 쓰게''' 강제한다. 문제를 \"잘 보이게\" 하려고 붙인 것이다.\n\n{warn}⚠️ '''`volatile`은 [[atomic|원자성]]을 보장하지 않는다.''' 메모리 접근을 강제할 뿐, 읽기-더하기-쓰기 사이에 끼어드는 것은 전혀 못 막는다. 대표적 오해 포인트다.{/warn}\n\n[[pthread_join]] '''뒤에''' 출력하므로 \"아직 덜 끝나서 작다\"는 핑계는 불가능하다. 기대값은 정확히 $2 \\times 10^7 = 20{,}000{,}000$.\n\n== 실제 출력 (p.38) ==\n\n[[img:L8-38.png|기대 20000000, 1회차 19345221, 2회차 19221041|large]]\n\n<pre class=\"txt\">\nprompt&gt; gcc -o main main.c -Wall -pthread; ./main\nmain: begin (counter = 0)\nA: begin\nB: begin\nA: done\nB: done\nmain: done with both (counter = 20000000)     &lt;- 기대\n<\/pre>\n\n{|\n! 실행 || counter\n|-\n| 기대 || 20,000,000\n|-\n| 실제 1회차 || '''19,345,221'''\n|-\n| 실제 2회차 || '''19,221,041'''\n|}\n\n두 가지 증상: ① '''틀렸다''', ② '''매번 다르다'''(indeterminate). \"What happened?\"의 답이 다음 슬라이드다.\n\n{info}슬라이드의 \"Actual output we '''want'''\"는 \"Actual output we '''get'''\"의 오타다.{/info}\n\n== 원인: C 한 줄 = 기계어 세 줄 (p.39) ==\n\n[[img:L8-39.png|counter = counter + 1의 어셈블리 — mov / add / mov|medium]]\n\n<pre class=\"asm\">\n100  mov 0x8049a1c, %eax   ; (1) LOAD : 메모리의 counter를 eax로\n105  add $0x1, %eax        ; (2) ADD  : eax에 1 (메모리엔 아직 반영 X)\n108  mov %eax, 0x8049a1c   ; (3) STORE: eax를 counter에 다시 씀\n<\/pre>\n\n> \"'''The context switch can happen at any point of time by the OS scheduler'''\"\n\n{info}PC가 100 → 105 → 108 → 113으로 '''불규칙하게''' 증가하는 것은 x86 명령어 길이가 가변이기 때문이다 (`mov` 메모리↔eax는 5바이트, `add $1`은 3바이트). [[RISC-V]]였다면 `lw` / `addi` / `sw` 세 개, 각 4바이트였을 것이다.{/info}\n\n== ⭐⭐⭐ 인터리빙 표 (p.40) ==\n\ncounter 초기값 '''50''', 두 스레드가 한 번씩 +1 → 기대 '''52'''.\n\n[[img:L8-40.png|Uncontrolled Scheduling Problem (Cont.) — 결과가 빨간 동그라미로 51|large]]\n\n{|\n! OS || Thread 1 || Thread 2 || PC || eax || counter\n|-\n| || (시작 전) || || 100 || 0 || 50\n|-\n| || `mov 8049a1c,%eax` || || 105 || '''50''' || 50\n|-\n| || `add $0x1,%eax` || || 108 || '''51''' || 50\n|-\n| '''interrupt''' — save T1, restore T2 || || || 100 || 0 || 50\n|-\n| || || `mov 8049a1c,%eax` || 105 || '''50''' || 50\n|-\n| || || `add $0x1,%eax` || 108 || '''51''' || 50\n|-\n| || || `mov %eax,8049a1c` || 113 || 51 || '''51'''\n|-\n| '''interrupt''' — save T2, restore T1 || || || 108 || 51 || 51\n|-\n| || `mov %eax,8049a1c` || || 113 || 51 || '''51''' ⭕\n|}\n\n[[sim:counter_race]]\n\n=== 단계별 해설 ===\n\n# T1이 counter(50)를 eax로 읽고 51로 만든다 — '''아직 메모리에 안 썼다''' (eax=51, counter=50).\n# 여기서 [[타이머 인터럽트]]. T1의 레지스터('''eax=51, PC=108''')가 '''T1의 [[TCB]]에 저장'''된다.\n# T2 복원(PC=100). T2는 '''메모리의 옛 값 50'''을 읽어 51을 만들고 '''저장''' → counter=51.\n# 다시 인터럽트, T2 저장, T1 복원 → PC=108, '''eax=51'''(아까 저장해 둔 값).\n# T1이 남은 `mov %eax, counter` 실행 → counter='''51'''.\n# 결과 '''51 ≠ 52'''. T2의 +1이 T1의 늦은 store에 '''덮여서 사라졌다''' — '''lost update'''.\n\n{exam}⭐⭐⭐ '''표 읽는 법 (시험에서 이걸 묻는다)'''\n* '''eax 열이 스레드마다 따로 논다'''는 데 주목. [[레지스터]]는 스레드별([[TCB]]), `counter`는 공유(메모리). '''이 비대칭이 문제의 본질'''이다.\n* \"(after instruction)\" = 각 행의 값은 그 명령어 '''실행 후''' 상태.\n* interrupt 행의 PC/eax는 '''복원된 스레드'''의 값이다.{/exam}\n\n== 변형 문제 대비 ==\n\n{|\n! 질문 || 답\n|-\n| '''어떤 인터리빙이면 52가 나오나?''' || 한 스레드가 3개 명령어를 '''모두''' 끝낸 뒤 다른 스레드가 시작하면 52. 즉 한 스레드의 load~store '''사이에 다른 스레드의 load가 끼지 않으면''' 정상\n|-\n| 인터럽트가 T1의 `add` 뒤가 아니라 '''`mov`(load) 직후'''에 들어오면? || 똑같이 '''51'''. T1은 이미 50을 읽어 두었다\n|-\n| 인터럽트가 T1의 '''store 뒤(PC=113)'''에 들어오면? || T2가 51을 읽으므로 '''52''' — 문제 없음\n|-\n| 두 스레드가 각각 N번 증가시킬 때 결과의 '''최댓값'''은? || '''2N''' (한 번도 안 겹칠 때)\n|-\n| 결과의 '''최솟값'''은? || 직관(N)과 달리 '''2'''까지 내려갈 수 있다 — 한 스레드가 아주 오래된 값을 들고 있다가 마지막에 덮어쓰는 교묘한 인터리빙 (슬라이드 밖, 심화)\n|}\n\n{analogy}🎭 이 표는 '''두 사람이 같은 장부에 입금을 적는 장면'''이다. A가 \"잔액 50\"을 읽고 메모지에 51을 적어 둔 채 자리를 비운다. B가 와서 장부의 50을 읽고 51로 고친다. A가 돌아와 '''자기 메모지의 51'''을 장부에 옮겨 적는다. 입금은 두 번인데 잔액은 51. A의 메모지(eax)가 '''자기만의 것'''이라는 점이 사고의 원인이다.{/analogy}\n\n== 해결 (p.44) ==\n\n[[락]]으로 18번 줄을 감싸면 항상 20,000,000이 나온다. 자세한 것은 [[mutual exclusion]] 참고. 그리고 그 `lock()`을 어떻게 만드느냐가 9강 [[락]]이다.\n\n{quiz}counter=50에서 p.40과 같은 인터리빙이 일어나면 최종값은? 52가 나오려면 인터럽트가 어디서 들어와야 하는가?{/quiz}\n{answer}'''51'''. 52가 되려면 한 스레드의 '''load~store 사이에 다른 스레드의 load가 끼지 않아야''' 한다 — 예를 들어 T1의 store(PC=113) '''뒤'''에 전환되면 된다.{/answer}\n\n{quiz}p.40 표에서 두 번째 interrupt 직후 T1의 `eax`가 51인 이유를 설명하시오.{/quiz}\n{answer}첫 번째 interrupt에서 T1의 레지스터 상태(eax=51, PC=108)가 T1의 [[TCB]]에 저장되었고, T1이 다시 스케줄될 때 '''그 값이 그대로 복원'''되기 때문이다. [[레지스터]]는 스레드별 상태이므로 T2가 메모리를 바꾼 것과 무관하게 옛 계산 결과를 들고 있다.{/answer}\n\n== 시험 대비 핵심 요약 ==\n# `counter = counter + 1`은 '''load / add / store''' 세 명령어다\n# [[타이머 인터럽트]]는 '''아무 명령어 경계에서나''' 들어온다 (uncontrolled scheduling)\n# 레지스터는 '''스레드별'''([[TCB]]), counter는 '''공유'''(메모리) — 이 비대칭이 원인\n# 50에서 두 번 증가 → 기대 52, 결과 '''51''' (lost update)\n# `volatile`은 원자성을 '''보장하지 않는다'''\n# CPU가 하나여도 발생한다\n# 해법은 [[mutual exclusion]] — [[락]]으로 18번 줄을 감싸기\n\n== 관련 문서 ==\n* [[race condition]] · [[critical section]] · [[mutual exclusion]] · [[atomic]]\n* [[스레드]] · [[TCB]] · [[타이머 인터럽트]] · [[컨텍스트 스위치]]\n* [[락]] · [[자주 틀리는 함정 모음]]"
 },

  "body": "8강 p.27이 다루는 주제. 한 문장으로: '''레지스터만 저장·복원하고 [[주소 공간]]은 그대로 둔다.'''\n\n{def}슬라이드 원문:\n* Each thread has its own '''program counter and set of registers'''\n* One or more '''thread control blocks ([[TCB]]s)''' are needed to store the state of each thread\n* When switching from running one (T1) to running the other (T2):\n** The register state of T1 be '''saved'''\n** The register state of T2 '''restored'''\n** '''The address space remains the same'''{/def}\n\n== 프로세스 전환과의 비교 ==\n\n{|\n! 단계 || 프로세스 전환 || 스레드 전환 (같은 프로세스 내)\n|-\n| 레지스터 저장/복원 || O ([[PCB]]) || O ([[TCB]])\n|-\n| 주소 공간 교체 (페이지 테이블 레지스터: x86 `CR3`, [[RISC-V]] `satp`) || '''O''' || '''X'''\n|-\n| TLB || flush 또는 ASID로 구분 필요 || '''그대로 유효'''\n|-\n| 캐시 || 새 프로세스 데이터로 식음 || 공유 데이터는 캐시에 남아 있을 수 있음\n|-\n| 비용 || '''비쌈''' || '''단순(simple)'''\n|}\n\n{warn}'''저장하는 레지스터의 개수 자체는 비슷하다.''' 스레드 전환이 싼 이유는 저장량이 적어서가 아니라, 주소 공간을 안 바꿔서 '''그 뒤에 따라오는 간접 비용'''(TLB miss 폭증, 캐시 오염)이 없기 때문이다. 이 구분을 묻는 서술형이 나올 수 있다.{/warn}\n\n== 왜 저장해야 하나 — counter 예제와 연결 ==\n\n[[counter 예제]] p.40의 표에서 T1이 `add` 후 선점될 때:\n* T1의 '''eax=51, PC=108'''이 T1의 [[TCB]]에 저장된다\n* T2가 복원되어 자기 eax(0)로 시작한다\n* 나중에 T1이 복원되면 '''eax=51이 그대로 돌아온다'''\n\n이 \"레지스터는 스레드별, 메모리는 공유\"라는 비대칭이 [[race condition]]의 본질이다. 즉 '''컨텍스트 스위치 메커니즘 자체는 정확하게 동작하는데, 그 정확함이 문제를 만든다'''.\n\n<pre class=\"ascii\">\n  T1 실행 중                 스위치                  T2 실행\n +-----------+          +-------------+          +-----------+\n | eax = 51  | --save-> | TCB(T1)     |          | eax = 0   |\n | PC  = 108 |          |  eax=51     | -restore>| PC  = 100 |\n +-----------+          |  PC =108    |          +-----------+\n       |                +-------------+                |\n       |                                               |\n       +--------- 공유 메모리: counter = 50 ------------+\n                  (주소 공간은 바뀌지 않는다)\n<\/pre>\n\n== 과제 1과의 구조적 동일성 ==\n\n{exam}🎯 퀴즈 범위가 \"진도 + 과제\"이므로 이 연결을 말할 수 있어야 한다.\n[[과제1 xv6 alarm]]에서 하는 일 — 인터럽트 순간의 [[trapframe]] '''전체를 저장''' → [[epc]]를 핸들러로 바꿔 핸들러 실행 → [[sigreturn]]에서 '''통째로 복원''' — 은 p.27의 \"레지스터 저장 → 다른 흐름 실행 → 레지스터 복원\"과 '''완전히 같은 구조'''다. 한 프로세스 안에서 \"끊긴 흐름\"과 \"핸들러 흐름\"을 번갈아 돌리는 '''미니 스레드 전환'''인 셈.\n[[TCB]]에 대응하는 것이 xv6의 [[struct proc]] 안 `trapframe`(유저 레지스터)과 `context`(커널 `swtch`용 callee-saved)이며, 과제에서 추가한 저장 슬롯은 '''두 번째 저장소'''다.{/exam}\n\n{analogy}🎭 프로세스 [[컨텍스트 스위치]] = '''다른 회사로 출근'''(사원증·자리·서류함 전부 교체). 스레드 컨텍스트 스위치 = '''같은 사무실에서 옆자리 동료로 교대'''. 책상 위 메모(레지스터)만 치우고 새 사람 메모를 꺼내면 된다 — 건물 출입 절차(주소 공간 교체)는 필요 없다.{/analogy}\n\n{quiz}스레드 간 컨텍스트 스위치에서 '''하지 않는''' 일을 하나 들고, 그 결과 어떤 비용이 절약되는지 쓰시오.{/quiz}\n{answer}'''주소 공간(페이지 테이블) 교체'''를 하지 않는다. 따라서 페이지 테이블 레지스터(x86 `CR3`, [[RISC-V]] `satp`) 변경, '''TLB flush''', 캐시 오염이 없어 전환 직후의 성능 저하가 없다.{/answer}\n\n{quiz}[[counter 예제]]에서 컨텍스트 스위치가 \"정확하게\" 동작하는데도 결과가 틀리는 이유는?{/quiz}\n{answer}컨텍스트 스위치는 각 스레드의 [[레지스터]]를 '''정확히''' 저장·복원한다. 문제는 그 사이에 '''공유 메모리가 다른 스레드에 의해 바뀌었다'''는 것이다. 복원된 스레드는 '''낡은 계산 결과'''를 들고 최신 메모리를 덮어쓴다(lost update).{/answer}\n\n== 관련 문서 ==\n* [[스레드]] · [[TCB]] · [[스레드와 프로세스 비교]]\n* [[컨텍스트 스위치]] · [[타이머 인터럽트]] · [[레지스터]]\n* [[counter 예제]] · [[race condition]]\n* [[과제1 xv6 alarm]] · [[trapframe]] · [[sigreturn]]"
 },
