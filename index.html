   "용어"
  ],
  "body": "'''특권 명령'''(privileged instruction)은 [[커널 모드]]에서만 실행할 수 있는 명령어다. 유저 프로그램이 실행하려 하면 실행되지 않고 대신 '''exception([[트랩]])'''이 발생해 커널로 넘어간다. 이 하드웨어 규칙이 OS 보호의 물리적 토대다.\n\n{def}\n2강 p.5가 이 개념을 비유로 소개한다 — 진상 손님에게 \"'''Can you allow them to modify your countertop? Can you allow any order from them?'''\"이라 묻고, 답으로 \"Make a wall and give them a kiosk\"를 제시한다. '''조리대를 직접 만지는 행위'''에 해당하는 것이 특권 명령이고, 키오스크가 [[시스템 콜]]이다.\n{/def}\n\n{analogy}\n🚇 '''지하철 기관실 조작 레버'''다. 승객이 앉아서 할 수 있는 일(자기 짐 정리, 스마트폰)은 얼마든지 허용되지만, 레버를 당기는 건 기관사만 할 수 있다. 승객이 레버로 손을 뻗으면 레버가 움직이는 게 아니라 '''경보가 울린다'''(= 트랩). 중요한 건 \"안 움직인다\"가 아니라 \"'''시도 자체가 커널에게 보고된다'''\"는 점이다.\n{/analogy}\n\n== 어떤 것들이 특권 명령인가 ==\n\n{| class=\"table\"\n! 종류 || 예 || 막지 않으면 생기는 일\n|-\n| I/O 명령 || 디스크·네트워크 장치 레지스터 직접 조작 || 남의 파일을 마음대로 읽고 씀 → [[영속성|파일 시스템]] 무력화\n|-\n| 메모리 매핑 변경 || 페이지 테이블 레지스터(`satp`) 쓰기 || 남의 [[주소 공간]]을 자기 것으로 매핑 → 격리 붕괴\n|-\n| [[인터럽트]] 제어 || 인터럽트 비활성화 || [[타이머 인터럽트]]를 꺼서 CPU 독점 → [[비협력적 방식]] 무력화\n|-\n| 트랩 벡터 변경 || `stvec` 쓰기 || [[트랩 테이블]]을 자기 코드로 바꿔치기 → 커널 탈취\n|-\n| 모드 복귀 || [[sret]] || 임의로 특권 상승\n|}\n\n{warn}\n'''[[인터럽트]] 비활성화가 특권 명령이라는 점이 9강까지 이어진다.''' 9강의 [[인터럽트 비활성화]] 락이 \"간단하지만 쓸 수 없는\" 이유가 바로 이것 — 유저 프로그램에게 그 권한을 주면 무한 루프 하나로 시스템 전체를 멈출 수 있다. → [[락 평가 기준]]\n{/warn}\n\n== 왜 필요한가 ==\n\n<pre class=\"ascii\">\n   특권 명령 구분이 없다면\n   ─────────────────────────────────────────────────────\n   유저 프로그램이 직접 페이지 테이블을 바꿈\n        → 남의 메모리 접근            → isolation 붕괴\n   유저 프로그램이 타이머 인터럽트를 끔\n        → 영원히 CPU 독점             → reliability 붕괴\n   유저 프로그램이 디스크에 직접 씀\n        → 파일 시스템 자료구조 파괴     → persistence 붕괴\n\n   → OS 설계 목표의 protection / reliability 가 통째로 무너진다\n<\/pre>\n\n그래서 4강 [[제한적 직접 실행]]의 전략은 이렇다: '''대부분의 명령은 하드웨어에서 그냥 직접 실행'''하게 두되(성능), '''위험한 것만 특권 명령으로 지정'''해 트랩을 걸어 커널이 대신 처리한다(보호).\n\n{tip}\n\"직접 실행하면 빠르지만 위험하다 / 커널이 매번 검사하면 안전하지만 느리다\"라는 딜레마의 해법이 특권 명령이다. 검사를 '''소프트웨어가 아니라 하드웨어가''' 공짜로 해 주기 때문에 둘 다 얻는다. 4강 제목 \"'''Limited''' Direct Execution\"의 \"Limited\"가 이것을 가리킨다.\n{/tip}\n\n== 예상 문제 ==\n\n{quiz}\n'''(개념)''' 유저 프로그램이 특권 명령을 실행하려 하면 어떤 일이 벌어지는가? 한 문장으로 답하시오.\n{/quiz}\n{answer}\n명령이 실행되지 않고 '''exception(트랩)'''이 발생하여 [[커널 모드]]로 전환되며, 커널이 [[트랩 테이블]]에 등록된 핸들러에서 그 프로세스를 처리(보통 종료)한다.\n{/answer}\n\n{quiz}\n'''(서술)''' 인터럽트 비활성화 명령이 특권 명령이어야 하는 이유를 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n유저 프로그램이 [[타이머 인터럽트]]를 끌 수 있다면 [[비협력적 방식]]으로 CPU를 되찾을 방법이 사라져, 무한 루프 하나가 시스템 전체를 영구히 멈출 수 있기 때문이다.\n{/answer}\n\n== 관련 문서 ==\n* [[커널 모드]] / [[유저 모드와 커널 모드]] / [[커널]]\n* [[제한적 직접 실행]] / [[트랩]] / [[트랩 테이블]]\n* [[시스템 콜]] / [[인터럽트]] / [[타이머 인터럽트]]\n* [[인터럽트 비활성화]] / [[락 평가 기준]]\n* [[OS 설계 목표]]"
 },
 "프로그램 카운터": {
  "title": "프로그램 카운터 (PC, Program Counter)",
  "category": [
   "용어"
  ],
  "body": "'''프로그램 카운터'''(PC)는 '''다음에 실행할 명령어의 주소'''를 담고 있는 [[레지스터]]다. 이 값 하나가 \"프로그램이 지금 어디까지 왔는가\"를 통째로 나타내기 때문에, [[프로세스]]를 멈췄다 재개하는 모든 이야기의 중심에 있다.\n\n{def}\n'''PC: Program counter''' (3강 p.10)<br>\n\"'''Address of next instruction'''. Called '''\"EIP\" (IA32)''' or '''\"RIP\" (x86-64)'''.\"\n{/def}\n\n{analogy}\n📖 '''책갈피'''다. 두꺼운 책(프로그램)을 읽다가 잠시 덮어야 할 때, 몇 쪽까지 읽었는지만 적어 두면 나중에 정확히 이어 읽을 수 있다. [[컨텍스트 스위치]]가 하는 일이 정확히 이것 — 프로세스 A의 책갈피를 [[PCB]]에 꽂아 두고, B의 책갈피를 꺼내 오는 것이다. 책갈피를 잃어버리면 A는 영원히 처음부터 다시 읽어야 한다.\n{/analogy}\n\n[[img:L3-10.png|3강 p.10. CPU 박스 안 맨 왼쪽의 작은 사각형이 PC.|large]]\n\n== 이름이 여러 개다 ==\n\n{| class=\"table\"\n! 맥락 || 이름 || 비고\n|-\n| 일반 || '''PC''' (Program Counter) ||\n|-\n| IA32 (32비트 x86) || '''`EIP`''' || 3강 p.38의 `struct context`에 있는 `eip`가 이것\n|-\n| x86-64 || '''`RIP`''' ||\n|-\n| [[RISC-V]] 트랩 || '''[[sepc]]''' (Supervisor Exception PC) || 트랩 순간의 PC를 하드웨어가 여기 저장\n|-\n| xv6 [[trapframe]] || '''[[epc]]''' (`p->trapframe->epc`) || [[sepc]] 값을 소프트웨어가 옮겨 담은 것\n|}\n\n{warn}\n\"PC는 '''현재''' 실행 중인 명령어의 주소\"가 아니라 \"'''다음에''' 실행할 명령어의 주소\"다. 슬라이드 원문이 \"Address of '''next''' instruction\". 트랩에서 복귀할 때 [[epc]]에 4를 더하느냐 마느냐가 갈리는 지점이라 정확히 알아야 한다.\n{/warn}\n\n== 과제 1에서 PC가 주인공이 되는 순간 ==\n\n[[sigalarm]] 구현의 핵심 한 줄이 PC를 바꿔치기하는 것이다.\n\n<pre class=\"c\">\n// kernel/trap.c : usertrap() 안, 알람이 발화할 때\np->alarm_saved = *p->trapframe;          // 원래 문맥 백업 (원래 PC 포함)\np->alarm_active = 1;\np->trapframe->epc = p->alarm_handler;    // ← 복귀할 PC 를 핸들러로 바꾼다\n<\/pre>\n\n{tip}\n과제 안내문이 던지는 힌트가 정확히 이 지점이다: \"When a trap on the RISC-V returns to user space, '''what determines the instruction address at which user-space code resumes execution?'''\" — 답은 '''[[epc]]'''(= 저장된 PC)다. 커널은 핸들러를 \"호출\"하는 게 아니라, '''돌아갈 주소를 속여서''' 유저 모드로 내려보낸다. → [[과제1 xv6 alarm]], [[alarm_handler]]\n{/tip}\n\n== 예상 문제 ==\n\n{quiz}\n'''(정의 → 용어)''' \"다음에 실행할 명령어의 주소를 담는 레지스터이며, IA32에서는 EIP, x86-64에서는 RIP라고 불리는 것\"은?\n{/quiz}\n{answer}\n'''PC (Program Counter)'''. [[RISC-V]] 트랩 문맥에서는 [[sepc]] / [[epc]]로 등장한다.\n{/answer}\n\n{quiz}\n'''(개념)''' 트랩에서 유저 공간으로 돌아갈 때, 유저 코드가 재개될 명령어 주소를 결정하는 것은 무엇인가?\n{/quiz}\n{answer}\n'''[[epc]]''' (`p->trapframe->epc`, 하드웨어 레지스터로는 [[sepc]]). [[sret]] 명령이 이 값을 PC로 복원한다. 과제 1은 이 값을 [[alarm_handler]] 주소로 바꿔치기해서 유저 핸들러를 실행시킨다.\n{/answer}\n\n== 관련 문서 ==\n* [[레지스터]] / [[스택 포인터]]\n* [[epc]] / [[sepc]] / [[sret]] / [[return-from-trap]]\n* [[컨텍스트 스위치]] / [[trapframe]] / [[PCB]]\n* [[과제1 xv6 alarm]] / [[alarm_handler]]"
 },
 "힙": {
  "title": "힙 (Heap)",
  "category": [
   "용어"
  ],
  "body": "'''힙'''(Heap)은 [[주소 공간]]에서 `malloc()`으로 명시적으로 요청해 쓰는 동적 할당 영역이다. [[스택]]과 달리 함수가 끝나도 자동으로 사라지지 않고, `free()`를 불러야 반납된다.\n\n{def}\n'''Process Creation 3단계''' (3강 p.33)<br>\n\"The program's '''heap''' is created. Used for '''explicitly requested dynamically allocated data'''. A program requests such space by calling '''`malloc()`''' and frees it by calling '''`free()`'''.\"<br>\n3강 p.19 — 메모리 그림에서 \"Run-time heap ('''created by `malloc`''')\"이고 경계는 '''`brk`'''로 표시된다.\n{/def}\n\n{analogy}\n🏬 '''창고 임대'''다. [[스택]]이 \"회의실을 잠깐 쓰고 회의 끝나면 자동으로 비워지는 것\"이라면, 힙은 \"창고를 계약해서 빌리는 것\"이다. 내가 계약을 해지(`free`)하기 전에는 계속 내 것이고, 해지를 깜빡하면 아무도 못 쓰는 채로 방치된다 — 그게 메모리 누수다. 계약서 관리를 잘못해서 이미 해지한 창고에 들어가면? use-after-free다.\n{/analogy}\n\n[[img:L3-19.png|3강 p.19. Run-time heap은 read/write segment 바로 위에서 시작해 위로 자라고, 그 경계를 brk가 가리킨다. 위쪽의 User stack은 아래로 자란다.|large]]\n\n== 스택과의 대조 ==\n\n{| class=\"table\"\n! || [[스택]] || 힙\n|-\n| 무엇이 || 지역 변수, 함수 인자, 리턴 주소 || `malloc()`으로 잡은 데이터\n|-\n| 할당·해제 || 함수 진입/리턴 시 '''자동''' || `malloc()`/`free()`로 '''명시적'''\n|-\n| 자라는 방향 || 높은 주소 → 낮은 주소 (아래로) || 낮은 주소 → 높은 주소 ('''위로''')\n|-\n| 경계 레지스터/변수 || [[스택 포인터|`%esp`]] || '''`brk`'''\n|-\n| 실행 파일에 || '''없음''' (런타임 생성) || '''없음''' (런타임 생성)\n|-\n| 수명 || 함수 스코프 || 프로그램이 `free`할 때까지\n|}\n\n<pre class=\"ascii\">\n        │   User stack                │\n        │            ↓                │   아래로\n        ├─────────────────────────────┤\n        │        (빈 공간)             │   둘이 서로를 향해 자란다\n        ├─────────────────────────────┤  ← brk\n        │            ↑                │   위로\n        │   Run-time heap             │\n        ├─────────────────────────────┤\n        │   Read/write segment        │\n<\/pre>\n\n== malloc은 시스템 콜이 아니다 ==\n\n{warn}\n'''`malloc()`은 라이브러리 함수다.''' 실제로 커널에게 \"주소 공간을 늘려 달라\"고 요청하는 것은 '''`brk`/`sbrk` [[시스템 콜]]'''이고, `malloc()`은 그렇게 확보한 덩어리를 잘게 쪼개 관리하는 user space 코드다. 1강 p.28의 분류에서도 \"brk, '''(malloc, free)'''\"처럼 괄호로 구분해 놓았다.\n{/warn}\n\n{tip}\n0831 녹음본: \"for the heap section, we can use the '''malloc''' function and the '''free''' function from the program code. And you may have experience about building the malloc function, and inside the malloc function you need to call the '''system call like sbrk and brk'''.\"<br>\n→ [[시스템 콜]] 문서의 \"라이브러리 vs 시스템 콜\" 구분 문제에서 `printf`/`write` 짝과 함께 자주 나오는 예다.\n{/tip}\n\n== 예상 문제 ==\n\n{quiz}\n'''(구분)''' `malloc()`은 시스템 콜인가? 아니라면 내부에서 어떤 시스템 콜을 부르는가?\n{/quiz}\n{answer}\n'''시스템 콜이 아니다''' — 표준 라이브러리 함수다. 주소 공간을 실제로 늘릴 때 '''`brk`/`sbrk`''' 시스템 콜을 호출하고, 그 덩어리를 쪼개 관리하는 부분은 user space에서 돈다.\n{/answer}\n\n{quiz}\n'''(개념)''' 힙과 [[스택]]이 [[주소 공간]] 안에서 서로 반대 방향으로 자라도록 배치된 이유를 한 문장으로 설명하시오.\n{/quiz}\n{answer}\n둘 다 크기를 미리 알 수 없는 동적 영역이므로, 가운데 빈 공간을 '''공유'''하며 서로를 향해 자라게 하면 어느 한쪽이 많이 필요한 프로그램도 고정 분할 없이 수용할 수 있기 때문이다.\n{/answer}\n\n== 관련 문서 ==\n* [[스택]] / [[주소 공간]] / [[스택 포인터]]\n* [[프로그램 로딩]] / [[프로세스]]\n* [[시스템 콜]] — 라이브러리 함수와의 구분"
 }
};

// ===== SimEngine =====
// ============================================================
// SimEngine — 단계별 시뮬레이터 공용 실행기 (CONTRACT §6)
// 순수 DOM. 외부 라이브러리 없음.
// 각 sim 파일은 SIMS["이름"] = { title, desc, options, build(opts) } 만 제공.
// ============================================================
(function (global) {
  "use strict";

  global.SIMS = global.SIMS || {};

  var SPEEDS = [
    { value: "500", label: "0.5초" },
    { value: "1000", label: "1초" },
    { value: "2000", label: "2초" }
  ];

  // 마지막으로 클릭/포커스된 sim 인스턴스 (키보드 ← → 대상)
  var focused = null;
  var keyboardBound = false;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function fmtValue(v) {
    if (v === null || v === undefined) return "–";
    if (Array.isArray(v)) return "[" + v.map(fmtValue).join(", ") + "]";
    if (typeof v === "boolean") return v ? "true" : "false";
    return String(v);
  }

  function sameValue(a, b) {
    return fmtValue(a) === fmtValue(b);
  }

  // 설명 문자열을 인라인 위키 문법으로 렌더 (renderer.js 의 inlineFormat 재사용)
  function fmtDesc(s) {
    if (s === undefined || s === null) s = "";
    if (typeof global.inlineFormat === "function") {
      try { return global.inlineFormat(String(s)); } catch (e) { /* fall through */ }
    }
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function bindKeyboard() {
    if (keyboardBound) return;
    keyboardBound = true;
    document.addEventListener("keydown", function (e) {
      if (!focused || !focused.root || !focused.root.isConnected) return;
      var t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) {
        if (t.className !== "sim-range") return;
      }
      if (e.key === "ArrowLeft") { focused.go(focused.idx - 1); e.preventDefault(); }
      else if (e.key === "ArrowRight") { focused.go(focused.idx + 1); e.preventDefault(); }
    });
  }

  // ------------------------------------------------------------
  // 인스턴스
  // ------------------------------------------------------------
  function Sim(root, name, spec) {
    this.root = root;
    this.name = name;
    this.spec = spec;
    this.opts = {};
    this.idx = 0;
    this.trace = null;
    this.timer = null;
    this.speed = 1000;
    this.lineNodes = {};   // panelId -> [lineEl]
    this.panelNodes = {};  // panelId -> { wrap, code, badge }
  }

  Sim.prototype.defaultOpts = function () {
    var o = {};
    (this.spec.options || []).forEach(function (opt) {
      if (opt.values && opt.values.length) o[opt.key] = opt.values[0].value;
    });
    return o;
  };

  Sim.prototype.render = function () {
    var self = this;
    var spec = this.spec;
    var root = this.root;
    root.innerHTML = "";
    root.classList.add("sim");
    if (!root.hasAttribute("tabindex")) root.setAttribute("tabindex", "0");

    root.addEventListener("mousedown", function () { focused = self; });
    root.addEventListener("focusin", function () { focused = self; });

    // 헤더
    var head = el("div", "sim-head");
    head.appendChild(el("div", "sim-title", spec.title || this.name));
    if (spec.desc) {
      var sub = el("div", "sim-subtitle");
      sub.innerHTML = fmtDesc(spec.desc);   // [[링크]] 등 인라인 위키 문법 허용
      head.appendChild(sub);
    }
    root.appendChild(head);

    var body = el("div", "sim-body");
    root.appendChild(body);

    // 옵션
    if (spec.options && spec.options.length) {
      var optBar = el("div", "sim-opts");
      spec.options.forEach(function (opt) {
        var wrap = el("span", "sim-opt");
        var lab = el("label", null, opt.label || opt.key);
        lab.setAttribute("for", "");
        wrap.appendChild(lab);
        var sel = el("select");
        (opt.values || []).forEach(function (v) {
          var o = el("option", null, v.label !== undefined ? v.label : v.value);
          o.value = v.value;
          sel.appendChild(o);
        });
        sel.value = self.opts[opt.key];
        sel.addEventListener("change", function () {
          self.opts[opt.key] = sel.value;
          self.stop();
          self.rebuild();
          self.go(0);
        });
        wrap.appendChild(sel);
        optBar.appendChild(wrap);
      });
      body.appendChild(optBar);
    }

    // 컨트롤
    var ctrl = el("div", "sim-ctrl");
    this.btnFirst = el("button", "sim-btn", "⏮");
    this.btnPrev = el("button", "sim-btn", "◀");
    this.btnNext = el("button", "sim-btn", "▶");
    this.btnLast = el("button", "sim-btn", "⏭");
    this.btnPlay = el("button", "sim-btn", "▶ 자동");
    [this.btnFirst, this.btnPrev, this.btnNext, this.btnLast, this.btnPlay].forEach(function (b) {
      b.type = "button";
      ctrl.appendChild(b);
    });
    this.btnFirst.title = "처음";
    this.btnPrev.title = "이전 (←)";
    this.btnNext.title = "다음 (→)";
    this.btnLast.title = "마지막";

    var speedSel = el("select", "sim-speed");
    SPEEDS.forEach(function (s) {
      var o = el("option", null, s.label);
      o.value = s.value;
      speedSel.appendChild(o);
    });
    speedSel.value = String(this.speed);
    speedSel.addEventListener("change", function () {
      self.speed = parseInt(speedSel.value, 10) || 1000;
      if (self.timer) { self.stop(); self.play(); }
    });
    ctrl.appendChild(speedSel);

    this.range = el("input", "sim-range");
    this.range.type = "range";
    this.range.min = "0";
    this.range.step = "1";
    this.range.addEventListener("input", function () {
      self.stop();
      self.go(parseInt(self.range.value, 10) || 0);
    });
    ctrl.appendChild(this.range);

    this.counter = el("span", "sim-count", "0 / 0");
    ctrl.appendChild(this.counter);
    body.appendChild(ctrl);

    this.btnFirst.addEventListener("click", function () { self.stop(); self.go(0); });
    this.btnPrev.addEventListener("click", function () { self.stop(); self.go(self.idx - 1); });
    this.btnNext.addEventListener("click", function () { self.stop(); self.go(self.idx + 1); });
    this.btnLast.addEventListener("click", function () { self.stop(); self.go(self.trace.steps.length - 1); });
    this.btnPlay.addEventListener("click", function () { self.timer ? self.stop() : self.play(); });

    // 동적 영역
    this.panelsBox = el("div", "sim-panels");
    body.appendChild(this.panelsBox);
    this.varsBox = el("div", "sim-varsbox");
    body.appendChild(this.varsBox);
    this.descBox = el("div", "sim-descbox");
    body.appendChild(this.descBox);
    this.noteBox = el("div", "sim-note");
    this.noteBox.style.display = "none";
    body.appendChild(this.noteBox);
    this.svgBox = el("div", "sim-svgbox");
    body.appendChild(this.svgBox);
    var hint = el("div", "sim-hint", "클릭 후 ← → 키로 단계 이동");
    body.appendChild(hint);
  };

  Sim.prototype.rebuild = function () {
    this.trace = this.spec.build(JSON.parse(JSON.stringify(this.opts))) || { panels: [], vars: [], steps: [] };
    this.trace.panels = this.trace.panels || [];
    this.trace.vars = this.trace.vars || [];
    this.trace.steps = this.trace.steps || [];
    this.buildPanels();
    this.buildVars();
    this.range.max = String(Math.max(0, this.trace.steps.length - 1));
  };

  Sim.prototype.buildPanels = function () {
    var self = this;
    this.panelsBox.innerHTML = "";
    this.lineNodes = {};
    this.panelNodes = {};
    this.trace.panels.forEach(function (p) {
      var wrap = el("div", "sim-panel");
      var ph = el("div", "sim-panel-head");
      ph.appendChild(el("span", null, p.title || p.id));
      var badge = el("span", "sim-badge", "");
      badge.style.display = "none";
      ph.appendChild(badge);
      wrap.appendChild(ph);

      var code = el("div", "sim-code");
      var nodes = [];
      (p.lines || []).forEach(function (src, i) {
        var ln = el("div", "sim-line");
        var mark = el("span", "sim-mark", " ");
        var num = el("span", "sim-ln", String(i + 1));
        var txt = el("span", "sim-src", src);
        ln.appendChild(mark);
        ln.appendChild(num);
        ln.appendChild(txt);
        code.appendChild(ln);
        nodes.push(ln);
      });
      wrap.appendChild(code);
      self.panelsBox.appendChild(wrap);
      self.lineNodes[p.id] = nodes;
      self.panelNodes[p.id] = { wrap: wrap, code: code, badge: badge };
    });
  };

  Sim.prototype.buildVars = function () {
    var self = this;
    this.varsBox.innerHTML = "";
    if (!this.trace.vars.length) return;
    var table = el("table", "sim-vars");
    var lastGroup = null;
    this.varCells = {};
    this.trace.vars.forEach(function (v) {
      var g = v.group || "";
      if (g !== lastGroup) {
        lastGroup = g;
        if (g) {
          var gr = el("tr", "sim-group");
          var gth = el("th", null, g);
          gth.colSpan = 2;
          gr.appendChild(gth);
          table.appendChild(gr);
        }
      }
      var tr = el("tr");
      tr.appendChild(el("th", null, v.label || v.name));
      var td = el("td");
      tr.appendChild(td);
      table.appendChild(tr);
      self.varCells[v.name] = td;
    });
    this.varsBox.appendChild(table);
  };

  Sim.prototype.go = function (i) {
    var steps = this.trace.steps;
    if (!steps.length) return;
    if (i < 0) i = 0;
    if (i > steps.length - 1) i = steps.length - 1;
    this.idx = i;
    this.paint();
  };

  Sim.prototype.paint = function () {
    var self = this;
    var steps = this.trace.steps;
    var step = steps[this.idx] || {};
    var prev = this.idx > 0 ? steps[this.idx - 1] : null;

    // 코드 패널
    this.trace.panels.forEach(function (p) {
      var nodes = self.lineNodes[p.id] || [];
      var pc = step.pc ? step.pc[p.id] : null;
      nodes.forEach(function (n, i) {
        var isCur = (pc !== null && pc !== undefined && i === pc - 1);
        n.classList.toggle("cur", isCur);
        n.querySelector(".sim-mark").textContent = isCur ? "▶" : " ";
      });
      if (pc !== null && pc !== undefined && nodes[pc - 1]) {
        var box = self.panelNodes[p.id].code;
        var node = nodes[pc - 1];
        var top = node.offsetTop - box.clientHeight / 2 + node.offsetHeight / 2;
        box.scrollTop = Math.max(0, top);
      }
      var badge = self.panelNodes[p.id].badge;
      var st = step.status ? step.status[p.id] : null;
      if (st) {
        badge.style.display = "";
        badge.textContent = st;
        badge.className = "sim-badge " + String(st).toLowerCase().replace(/[^a-z0-9]+/g, "-");
      } else {
        badge.style.display = "none";
      }
    });

    // 변수표
    if (this.varCells) {
      this.trace.vars.forEach(function (v) {
        var td = self.varCells[v.name];
        if (!td) return;
        var cur = step.vars ? step.vars[v.name] : undefined;
        var old = prev && prev.vars ? prev.vars[v.name] : undefined;
        td.innerHTML = "";
        var changed = prev && !sameValue(cur, old);
        td.classList.toggle("changed", !!changed);
        if (changed) {
          var p = el("span", "sim-prev", fmtValue(old) + "→");
          td.appendChild(p);
        }
        td.appendChild(document.createTextNode(fmtValue(cur)));
      });
    }

    // 설명
    this.descBox.innerHTML =
      '<span class="sim-stepno">' + (this.idx + 1) + ".</span>" + fmtDesc(step.desc);

    // note
    if (step.note) {
      this.noteBox.style.display = "";
      this.noteBox.innerHTML = fmtDesc(step.note);
    } else {
      this.noteBox.style.display = "none";
      this.noteBox.innerHTML = "";
    }

    // svg
    var svg = step.svg;
    if (typeof svg === "function") {
      try { svg = svg(step, this.idx, this.trace); } catch (e) { svg = null; }
    }
    this.svgBox.innerHTML = svg ? String(svg) : "";

    // 컨트롤 상태
    this.counter.textContent = (this.idx + 1) + " / " + steps.length;
    this.range.value = String(this.idx);
    this.btnFirst.disabled = this.btnPrev.disabled = (this.idx === 0);
    this.btnNext.disabled = this.btnLast.disabled = (this.idx === steps.length - 1);
  };

  Sim.prototype.play = function () {
    var self = this;
    if (this.timer) return;
    if (this.idx >= this.trace.steps.length - 1) this.go(0);
    this.btnPlay.classList.add("playing");
    this.btnPlay.textContent = "⏸ 정지";
    this.timer = setInterval(function () {
      if (self.idx >= self.trace.steps.length - 1) { self.stop(); return; }
      self.go(self.idx + 1);
    }, this.speed);
  };

  Sim.prototype.stop = function () {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (this.btnPlay) {
      this.btnPlay.classList.remove("playing");
      this.btnPlay.textContent = "▶ 자동";
    }
  };

  // ------------------------------------------------------------
  // public
  // ------------------------------------------------------------
  var SimEngine = {
    mount: function (container, name) {
      var spec = global.SIMS[name];
      if (!spec || typeof spec.build !== "function") {
        container.className = "sim-missing";
        container.textContent = "시뮬레이터 없음: " + name;
        return null;
      }
      var sim = new Sim(container, name, spec);
      sim.opts = sim.defaultOpts();
      sim.render();
      sim.rebuild();
      sim.go(0);
      bindKeyboard();
      return sim;
    },
    mountAll: function (scope) {
      var out = [];
      (scope || document).querySelectorAll(".sim[data-sim]").forEach(function (node) {
        out.push(SimEngine.mount(node, node.getAttribute("data-sim")));
      });
      return out;
    }
  };

  global.SimEngine = SimEngine;
})(typeof window !== "undefined" ? window : globalThis);

// ===== sims/alarm_trace.js =====
// alarm_trace — 퀴즈1 5번 프로그램을 timer tick 단위로 재현한다.

window.SIMS = window.SIMS || {};

(function () {
  var EPC_LOOP = "main+0x1c (for 루프)";

  function userSrc(variant) {
    return [
      "volatile int count = 0, sum = 0;",
      "",
      "void burn(void) {",
      "    for (volatile int k = 0; k < 500000000; k++)",
      "        asm volatile(\"nop\");",
      "}",
      "",
      "__attribute__((noinline))",
      "void foo(unsigned int *j) { *j += 1; }",
      "",
      "void periodic(void) {",
      "    count++;",
      "    sum += count;",
      "    burn();",
      (variant === "always"
        ? "    sigalarm(0, 0);              // 무조건 해제"
        : "    if (count == 3) sigalarm(0, 0);"),
      "    sigreturn();",
      "}",
      "",
      "int main(void) {",
      "    unsigned int i = 0, j = 0;",
      "    sigalarm(2, periodic);",
      "    for (; count < 3; i++)",
      "        foo(&j);",
      "",
      "    printf(\"count=%d sum=%d\\n\", count, sum);",
      "    printf(\"i==j: %d\\n\", i == j);",
      "",
      "    burn();",
      "    printf(\"after=%d\\n\", count);",
      "    exit(0);",
      "}"
    ];
  }

  var TRAP_SRC = [
    "void usertrap(void) {",
    "  // ... scause 판별, which_dev = devintr() ...",
    "  if (which_dev == 2) {                 // timer interrupt",
    "    if (p->alarm_interval > 0 && !p->alarm_active) {",
    "      p->alarm_elapsed++;",
    "      if (p->alarm_elapsed >= p->alarm_interval) {",
    "        p->alarm_saved   = *p->trapframe;   // 문맥 통째로 복사",
    "        p->alarm_active  = 1;",
    "        p->alarm_elapsed = 0;",
    "        p->trapframe->epc = (uint64)p->alarm_handler;",
    "      }",
    "    }",
    "    yield();",
    "  }",
    "  usertrapret();      // sret 는 trapframe->epc 로 돌아간다",
    "}"
  ];

  function sysretSrc(a0fix) {
    return [
      "uint64 sys_sigreturn(void) {",
      "  struct proc *p = myproc();",

      "  p->alarm_active  = 0;",

      (a0fix === "bug"

      "}",
      "",
      "// kernel/syscall.c 의 syscall() 안에서:",
      "uint64 result = sys_sigreturn();",
      "p->trapframe->a0 = result;             // 반환값을 a0 에 기록"
    ];
  }

  function timelineSvg(ticks, cur, disabled) {
    var n = Math.max(ticks.length, 1);

        s += '<rect x="' + (x - 2) + '" y="20" width="24" height="46" rx="4" fill="' +

      }

    }

         '■ 파랑 = 평범한 tick · ' +
         '■ 주황 = 핸들러 발동 · ' +
         '■ 빨강 = alarm_active 라 무시(재진입 금지) · ' +
         '■ 회색 = alarm 해제됨</text>';

    return s;
  }

  window.SIMS["alarm_trace"] = {
    title: "과제1 alarm — 퀴즈1 5번 프로그램 tick 추적",

    build: function (opts) {

        "output": []
      };

      var steps = [];

      function snap() {

      }
      function push(desc, pc, note) {

        steps.push({

        });
      }
      function addTick(kind) { st.tick++; ticks.push({ n: st.tick, kind: kind }); }

      // ── 0. 준비 ──────────────────────────────────────────────
      push("main() 진입. 지역 변수 i, j 는 0 입니다. 전역 count, sum 도 0. " +
           "지금은 [[alarm_interval]] 이 0 이라 [[타이머 인터럽트]] 가 와도 [[usertrap]] 은 [[yield]] 만 하고 돌아갑니다.",
           { user: 20 });

      st.mode = "kernel mode";
      push("'''sigalarm(2, periodic)''' 호출 — [[usys.pl]] 이 만든 스텁이 a7 에 SYS_sigalarm 을 넣고 `ecall` 을 실행해 커널로 트랩합니다. " +
           "([[xv6 시스템 콜 경로]] 참고)", { user: 21 });

      st["alarm_interval"] = 2;
      st["alarm_handler"] = "periodic (유저 주소)";
      st["alarm_elapsed"] = 0;
      push("sys_sigalarm() 이 [[myproc]]() 으로 얻은 struct proc 에 [[alarm_interval]]=2, [[alarm_handler]]=periodic 을 '''프로세스마다 따로''' 저장합니다. " +
           "커널 전역이 아니라 [[struct proc]] 필드라는 점이 중요합니다.", { user: 21 });

      st.mode = "user mode";
      st["trapframe->a0"] = "0 (sigalarm 반환값)";
      push("[[return-from-trap]] ([[sret]]) 로 유저 모드 복귀. 시스템 콜 반환값 0 이 [[a0]] 에 담겨 있습니다. 이제 for 루프로 들어갑니다.",
           { user: 22 });

      var loopShown = false;
      function loopIter(extra) {
        st.i += 1; st.j += 1;
        st["trapframe->epc"] = EPC_LOOP;
        st["trapframe->a0"] = A0_INT;
        var d = "for 루프가 foo(&j) 를 호출해 i 와 j 를 나란히 1 씩 올립니다. " +
                "i 는 루프가, j 는 foo() 가 올리므로 '''둘은 항상 같은 값'''입니다.";
        var n;
        if (!loopShown) {
          loopShown = true;
          n = "실제로는 tick 사이에 i, j 가 수백만 번 증가하지만 이 시뮬레이터는 1 씩만 표시합니다. " +
              "인터럽트 당시 [[a0]] 에 남아 있던 값은 퀴즈 4번처럼 0x2a 로 잡았습니다.";
        }
        push(d + (extra || ""), { user: 23 }, n);
      }

      function tickNoFire() {
        addTick("normal");
        st.mode = "kernel mode";
        push("&#9200; '''timer tick''' 발생 → 하드웨어가 유저 레지스터를 [[trapframe]] 에 저장하고 [[usertrap]]() 으로 점프. " +
             "[[which_dev]] == 2 이므로 타이머 분기로 들어갑니다.", { trap: 3 });
        st["alarm_elapsed"] += 1;
        push("[[alarm_interval]] > 0 이고 [[alarm_active]] 가 0 이므로 조건 통과 → [[alarm_elapsed]] 를 " +
             (st["alarm_elapsed"] - 1) + " → " + st["alarm_elapsed"] + " 로 올립니다.", { trap: 5 });
        push("elapsed(" + st["alarm_elapsed"] + ") >= interval(2) 가 '''거짓''' → 아직 핸들러를 부르지 않습니다.", { trap: 6 });
        push("[[yield]]() 로 CPU 를 한 번 양보한 뒤 [[usertrapret]]() → [[sret]]. " +
             "[[epc]] 를 건드리지 않았으므로 끊긴 그 명령어로 돌아갑니다.", { trap: 13 });
        st.mode = "user mode";
        push("유저 모드 복귀. 루프가 아무 일 없었다는 듯 이어집니다.", { user: 23 });
      }

      function tickFire() {
        addTick("fire");
        st.mode = "kernel mode";
        push("&#9200; '''timer tick''' 발생 → [[usertrap]]() 진입. 이번에는 [[alarm_elapsed]] 가 interval 에 도달합니다.",
             { trap: 3 });
        st["alarm_elapsed"] += 1;
        push("[[alarm_elapsed]] 를 " + (st["alarm_elapsed"] - 1) + " → " + st["alarm_elapsed"] + ". (퀴즈 2번 첫 빈칸은 `!p->alarm_active`)",
             { trap: 5 });
        push("elapsed(2) >= interval(2) '''참''' → 알람 발동!", { trap: 6 });
        st["alarm_saved.epc"] = st["trapframe->epc"];
        st["alarm_saved.a0"]  = st["trapframe->a0"];
        push("[[alarm_saved]] = '''*p->trapframe''' — 끊긴 유저 문맥을 통째로 '''한 부 더''' 복사합니다. " +
             "곧 같은 [[trapframe]] 의 [[epc]] 를 핸들러 주소로 덮어쓸 것이므로, 원본을 따로 두지 않으면 돌아갈 자리를 잃습니다. (퀴즈 3-a 답)",
             { trap: 7 });
        st["alarm_active"] = 1;
        st["alarm_elapsed"] = 0;
        push("[[alarm_active]] = 1 (핸들러 실행 중 표시), [[alarm_elapsed]] = 0 (다음 주기를 위해 re-arm).", { trap: 8 });
        st["trapframe->epc"] = "periodic";
        push("[[epc|p->trapframe->epc]] 에 [[alarm_handler]] 주소를 씁니다. " +
             "[[usertrapret]]() 이 이 값을 [[sepc]] 에 넣고 [[sret]] 하므로, 유저는 '''끊긴 자리가 아니라 periodic 부터''' 재개합니다. (퀴즈 2번 세 번째 빈칸)",
             { trap: 10 });
        push("[[yield]]() → [[usertrapret]]() → [[sret]].", { trap: 13 });
        st.mode = "user mode";
        push("&#9889; 유저 모드로 돌아왔는데 PC 가 periodic 입니다. 핸들러는 커널이 아니라 '''user mode''' 에서 돕니다. (퀴즈 1번 답)",
             { user: 11 });

      function handlerBody(roundNo) {
        st["count"] += 1;
        push("count++ → " + st["count"] + ". count 와 sum 은 volatile 전역이라 핸들러가 바꿔도 main 이 바로 봅니다.", { user: 12 });
        st["sum"] += st["count"];
        push("sum += count → " + st["sum"] + ".", { user: 13 });
        push("burn() 진입 — 최소 5 tick 을 태우는 긴 계산입니다. 핸들러가 도는 동안에도 [[타이머 인터럽트]] 는 계속 옵니다.",
             { user: 14 });
        st["trapframe->epc"] = EPC_BURN;

        addTick("ignored");
        st.mode = "kernel mode";
        push("&#9200; burn() 도중 tick 도착 → [[usertrap]]() 진입.", { trap: 3 });

        push("[[yield]]() 후 복귀. 알람 관련 상태는 하나도 안 바뀌었습니다.", { trap: 13 });
        st.mode = "user mode";
        push("burn() 계속.", { user: 5 });

        addTick("ignored"); addTick("ignored"); addTick("ignored"); addTick("ignored");
        push("이어지는 4 번의 tick 도 똑같은 이유로 무시됩니다. burn() 이 끝나 " +

             "핸들러를 보통 함수처럼 `return` 으로 끝내면 유저 스택의 가짜 복귀 주소로 튀어 '''대부분 크래시'''합니다. (퀴즈 3-c 답)",

          st["trapframe->a0"] = "0 ← 0x2a 가 지워짐";
          push("syscall() 이 `p->trapframe->a0 = result;` 로 0 을 써 넣습니다. " +
               "인터럽트 당시의 [[a0]]=0x2a 는 '''사라졌습니다'''. (퀴즈 4-a(ii): 버그판 답은 0)", { sysret: 11 },

        }
        st.mode = "user mode";
        push("[[sret]] → [[epc]] 가 " + EPC_LOOP + " 이므로 '''끊겼던 바로 그 명령어'''로 돌아갑니다. (퀴즈 3-b 답)",
             { user: 23 });
      }

      // ── 1회차 ────────────────────────────────────────────────
      loopIter();
      tickNoFire();
      loopIter();
      tickFire();
      handlerBody(1);

      if (variant === "always") {
        disableAlarm("`sigalarm(0, 0);` 을 '''조건 없이''' 호출합니다. count 는 아직 1 인데 알람을 꺼 버리는 겁니다.");
        sigreturnSteps();
        st["alarm_elapsed"] = 0;

        st.mode = "kernel mode";

        st.mode = "user mode";
        addTick("disabled"); addTick("disabled");
        push("for 조건 `count < 3` 은 count 가 영원히 1 이므로 '''항상 참'''. 루프를 빠져나갈 수 없습니다.", { user: 22 });
        push("&#128721; 결론: 첫 번째 printf 는 '''실행되지 않습니다'''. 프로그램은 무한 루프에 빠져 어떤 출력도 내지 않습니다.",
             { user: 22 },

        return { panels: panels(), vars: varDefs(), steps: steps };
      }

      // cond: 1회차 마무리
      push("`if (count == 3)` → 1 == 3 '''거짓''' → 알람은 그대로 살아 있습니다.", { user: 15 });

      loopIter(" 알람 카운트는 0 부터 다시 셉니다.");

      loopIter();
      tickNoFire();
      loopIter();

      push("for 조건 검사: `count < 3` 에서 count 가 3 이므로 '''거짓''' → 루프 탈출.", { user: 22 });
      st["output"].push("count=" + st["count"] + " sum=" + st["sum"]);
      push("첫 번째 printf 출력: '''count=3 sum=6'''. sum 은 1+2+3 입니다.", { user: 25 });
      st["output"].push("i==j: 1");
      push("두 번째 printf: '''i==j: 1'''. 알람이 세 번이나 끼어들었는데도 i 와 j 가 어긋나지 않은 이유는 " +
           "[[sigreturn]] 이 [[alarm_saved]] 로 '''모든 레지스터와 [[epc]] 를 정확히''' 되돌렸기 때문입니다." +
           (a0fix === "bug"
             ? " 다만 지금은 [[a0 복원]] 이 빠진 버그판입니다 \u2014 이 프로그램은 마침 복귀 직후 a0 를 다시 쓰기 때문에 출력이 같아 보일 뿐, alarmtest 의 test3 는 이 오류를 잡아냅니다."
             : " ([[a0 복원]] 포함)"),
           { user: 26 },
           a0fix === "bug"
             ? "출력이 같다고 구현이 맞는 게 아닙니다. `return 0;` 은 인터럽트 당시의 [[a0]] 를 지우므로, 하필 그 순간 a0 에 살아 있던 값을 쓰는 프로그램에서는 조용히 틀린 값이 나옵니다."
             : undefined);
      push("burn() 실행 — 이 구간에도 tick 이 오지만 [[alarm_interval]] 이 0 이라 아무 일도 없습니다.", { user: 28 });
      addTick("disabled"); addTick("disabled"); addTick("disabled"); addTick("disabled"); addTick("disabled");
      push("5 번의 tick 이 조용히 지나갔습니다. count 는 그대로 3.", { user: 28 });
      st["output"].push("after=3");
      push("세 번째 printf: '''after=3'''. 알람이 꺼졌으므로 burn() 을 아무리 돌려도 count 가 더 늘지 않습니다.", { user: 29 });
      push("exit(0) — 최종 출력은 `count=3 sum=6` / `i==j: 1` / `after=3` 세 줄입니다. (퀴즈 5-a 답)", { user: 30 });

      return { panels: panels(), vars: varDefs(), steps: steps };

      function panels() {
        return [
          { id: "user",   title: "user: 퀴즈1 5번 프로그램", lang: "c", lines: USER },
          { id: "trap",   title: "kernel: usertrap() 타이머 분기", lang: "c", lines: TRAP_SRC },

      function varDefs() {

          { name: "trapframe->epc", group: "trapframe (현재 문맥)" },

          { name: "alarm_saved.a0",  group: "alarm_saved (백업 문맥)" },

  function sliceOf(p, list, useLatencyNice) {
    var s = LATENCY * p.weight / sumW(list);
    if (s < MIN_GRAN) s = MIN_GRAN;
    if (useLatencyNice && p.latencyNice < 0) s = Math.max(MIN_GRAN, s / 2);  // 슬라이드 예: 12ms → 6ms
    return s;
  }

  // ---------------- CFS ----------------
  function buildCfs(key) {
    var procs = mkProcs(key), t = 0;
    var vars = [
      { name: "time", group: "스케줄러" },
      { name: "running", group: "스케줄러" },
      { name: "runnable n", group: "스케줄러" },
      { name: "Σ weight", group: "스케줄러" },
      { name: "sched_latency", group: "스케줄러" },
      { name: "min_granularity", group: "스케줄러" }
    ];
    procs.forEach(function (p) {
      vars.push({ name: p.id + ".nice", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".weight", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".slice", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".vruntime", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".받은 CPU", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".state", group: "프로세스 " + p.id });
    });

    function snap(running) {
      var L = live(procs), SW = sumW(L);
      var v = {
        time: f2(t) + " ms",
        running: running || "—",
        "runnable n": L.length,
        "Σ weight": SW,
        "sched_latency": LATENCY + " ms",
        "min_granularity": MIN_GRAN + " ms"
      };
      procs.forEach(function (p) {
        v[p.id + ".nice"] = p.nice;
        v[p.id + ".weight"] = p.weight;
        v[p.id + ".slice"] = p.done ? "—" : f2(sliceOf(p, L, false)) + " ms";
        v[p.id + ".vruntime"] = f2(p.vruntime);
        v[p.id + ".받은 CPU"] = f2(p.received) + " ms";
        v[p.id + ".state"] = p.done ? "done" : (p.id === running ? "running" : "runnable");
      });
      return v;
    }

    var steps = [], L0 = live(procs), SW0 = sumW(L0);
    steps.push({
      desc: "'''CFS''' — " + WL[key].label + ". 슬라이스는 " +
        procs.map(function (p) { return p.id + " = 48 × " + p.weight + "/" + SW0 + " = " + f2(LATENCY * p.weight / SW0) + "ms"; }).join(", ") +
        " (6ms 미만이면 [[min_granularity]] 로 올림). [[vruntime]] 은 모두 0 에서 시작하고, " +
        "'''vruntime += runtime × 1024 / weight''' 로 쌓인다 — weight 가 크면(우선순위 높으면) 천천히 쌓여 더 자주 뽑힌다.",
      pc: { CFS: 1 },
      vars: snap(null),
      svg: barSvg(procs, "vruntime (ms) — 가장 짧은 막대가 다음 차례", function (p) { return p.vruntime; },
        function (p) { return "nice " + p.nice + " / w " + p.weight; }, null, false)
    });

    for (var k = 0; k < 13; k++) {
      var Lv = live(procs);
      if (!Lv.length) break;
      var pick = Lv[0];
      Lv.forEach(function (p) { if (p.vruntime < pick.vruntime - 1e-9) pick = p; });
      var SW = sumW(Lv);
      var sl = sliceOf(pick, Lv, false);
      var ran = Math.min(sl, pick.left);
      var dv = ran * W0 / pick.weight;
      var before = pick.vruntime, t0 = t;
      pick.vruntime += dv; pick.received += ran; pick.left -= ran; t += ran;
      var finished = (pick.left <= 1e-9);
      if (finished) pick.done = true;

      var d = "'''t = " + f2(t0) + " → " + f2(t) + "ms''' : vruntime 최소인 '''" + pick.id + "'''(" + f2(before) + ") 선택. " +
        "슬라이스 = 48 × " + pick.weight + "/" + SW + " = " + f2(sl) + "ms" + (sl === MIN_GRAN && LATENCY * pick.weight / SW < MIN_GRAN ? " ([[min_granularity]] 6ms 로 올림)" : "") + ". " +
        "실행 후 vruntime += " + f2(ran) + " × 1024/" + pick.weight + " = " + f2(dv) + " → '''" + f2(pick.vruntime) + "'''.";
      if (finished) d += " '''" + pick.id + " 종료''' → runnable 이 " + live(procs).length + "개로 줄어 다음 슬라이스가 " +
        f2(LATENCY / Math.max(1, live(procs).length)) + "ms 로 늘어난다.";
      if (key === "nice0_5" && k === 1) d += " ⭐ nice 0 과 nice 5 는 슬라이스 길이가 3배 넘게 다르지만 '''Δvruntime 은 둘 다 " + f2(dv) + "ms 로 같다''' — 그래서 정확히 번갈아 돈다.";

      steps.push({
        desc: d,
        pc: { CFS: 5 },
        vars: snap(pick.id),
        svg: barSvg(procs, "vruntime (ms) — 가장 짧은 막대가 다음 차례", function (p) { return p.vruntime; },
          function (p) { return "nice " + p.nice + " / w " + p.weight; }, pick.id, false)
      });
    }

    steps.push({
      desc: "'''정리''' — " + CFS_SUMMARY(key),
      pc: { CFS: 3 },
      vars: snap(null),
      svg: barSvg(procs, "vruntime (ms)", function (p) { return p.vruntime; },
        function (p) { return "nice " + p.nice + " / w " + p.weight; }, null, false)
    });

    return { panels: [P_CFS], vars: vars, steps: steps };
  }

  function CFS_SUMMARY(key) {
    if (key === "nice0_5")
      return "nice 0(weight 1024) 은 36.17ms, nice 5(weight 335) 는 11.83ms 를 받는다 — [[sched_latency]] 48ms 안에서 weight 비율 1024:335. " +
        "퀴즈 계산: B 가 물리 시간 10ms 를 돌면 Δ[[vruntime]] = 10 × 1024/335 ≈ '''30.6ms'''. 가중치가 낮을수록 vruntime 이 빨리 쌓여 덜 뽑힌다.";
    if (key === "four_same")
      return "n=4 일 때 슬라이스 48/4 = '''12ms''', C·D 가 24ms 씩 쓰고 끝나면 n=2 가 되어 '''24ms''' 로 늘어난다 — 슬라이드 p.33 의 그림 그대로. " +
        "[[sched_latency]] 는 '슬라이스 길이'가 아니라 '한 바퀴 도는 데 걸리는 목표 시간'이다.";
    return "CFS 에는 latency 개념이 없어 D 의 latency_nice 를 반영하지 못한다 — 4개 모두 12ms. " +
      "'지연에 민감한 프로세스를 더 자주, 더 짧게' 돌릴 방법이 없다는 것이 CFS 의 한계이고, [[EEVDF]] 가 나온 이유다 (6강 p.42).";
  }

  // ---------------- EEVDF ----------------
  function buildEevdf(key) {
    var procs = mkProcs(key), t = 0, epoch = 0;   // epoch = lag 회계를 시작한 시각
    var vars = [
      { name: "time", group: "스케줄러" },
      { name: "running", group: "스케줄러" },
      { name: "Σ weight", group: "스케줄러" },
      { name: "eligible 집합", group: "스케줄러" }
    ];
    procs.forEach(function (p) {
      vars.push({ name: p.id + ".weight", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".slice", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".received", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".ideal", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".lag", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".eligible", group: "프로세스 " + p.id });
      vars.push({ name: p.id + ".VD", group: "프로세스 " + p.id });
    });

    function share(p, L) { return p.weight / sumW(L); }
    function lagOf(p, L) { return share(p, L) * (t - epoch) - p.received; }
    function vdOf(p, L) { return p.received / share(p, L) + sliceOf(p, L, true) / share(p, L) + epoch; }

    function snap(running) {
      var L = live(procs);
      var el = [];
      L.forEach(function (p) { if (lagOf(p, L) >= -1e-9) el.push(p.id); });
      var v = {
        time: f2(t) + " ms",
        running: running || "—",
        "Σ weight": sumW(L),
        "eligible 집합": el.length ? "{" + el.join(", ") + "}" : "{ }"
      };
      procs.forEach(function (p) {
        var isL = !p.done;
        v[p.id + ".weight"] = p.weight;
        v[p.id + ".slice"] = isL ? f2(sliceOf(p, L, true)) + " ms" : "—";
        v[p.id + ".received"] = f2(p.received) + " ms";
        v[p.id + ".ideal"] = isL ? f2(share(p, L) * (t - epoch)) + " ms" : "—";
        v[p.id + ".lag"] = isL ? f2(lagOf(p, L)) : "—";
        v[p.id + ".eligible"] = !isL ? "—" : (lagOf(p, L) >= -1e-9 ? "✔ (lag ≥ 0)" : "✘ (이미 더 받음)");
        v[p.id + ".VD"] = isL ? f2(vdOf(p, L)) : "—";
      });
      return v;
    }

    var steps = [], L0 = live(procs);
    steps.push({
      desc: "'''EEVDF''' (Earliest Eligible Virtual Deadline First, 리눅스 6.6~) — " + WL[key].label + ". " +
        "[[lag]] = 받았어야 할 시간(ideal) − 실제로 받은 시간(received). '''lag ≥ 0 이면 eligible'''(아직 덜 받았다). " +
        "[[virtual deadline]] VD = t_e + slice / share (t_e = lag 이 0 이 되는 시각). " +
        "eligible 중 VD 가 가장 이른 것을 고른다. 슬라이스는 " +
        L0.map(function (p) { return p.id + " " + f2(sliceOf(p, L0, true)) + "ms"; }).join(", ") +
        (key === "latency" ? " — D 는 latency_nice −10 이라 12ms 대신 '''6ms''' (6강 p.44)." : "."),
      pc: { EEVDF: 1 },
      vars: snap(null),
      svg: barSvg(procs, "lag (ms) — 0 보다 오른쪽(양수)이 eligible", function (p) { return p.done ? 0 : lagOf(p, live(procs)); },
        function (p) { return "w " + p.weight; }, null, true)
    });

    for (var k = 0; k < 12; k++) {
      var L = live(procs);
      if (!L.length) break;
      var elig = L.filter(function (p) { return lagOf(p, L) >= -1e-9; });
      if (!elig.length) elig = L.slice();               // 이론상 항상 하나는 eligible
      var pick = elig[0];
      elig.forEach(function (p) { if (vdOf(p, L) < vdOf(pick, L) - 1e-9) pick = p; });
      var sl = sliceOf(pick, L, true);
      var ran = Math.min(sl, pick.left);
      var t0 = t, lagBefore = lagOf(pick, L), vdBefore = vdOf(pick, L);
      var eligTxt = elig.map(function (p) { return p.id + "(lag " + f2(lagOf(p, L)) + ", VD " + f2(vdOf(p, L)) + ")"; }).join(", ");
      var outTxt = L.filter(function (p) { return elig.indexOf(p) < 0; })
        .map(function (p) { return p.id + "(lag " + f2(lagOf(p, L)) + ")"; }).join(", ");
      pick.received += ran; pick.left -= ran; t += ran;
      var finished = pick.left <= 1e-9;

      var d = "'''t = " + f2(t0) + " → " + f2(t) + "ms''' : eligible = {" + eligTxt + "}" +
        (outTxt ? " / 탈락(lag < 0) = {" + outTxt + "}" : "") + ". " +
        "이 중 VD 가 가장 이른 '''" + pick.id + "'''(VD = " + f2(vdBefore) + ") 선택. " +
        "lag(" + pick.id + ") = " + f2(lagBefore) + " 였고 슬라이스 " + f2(ran) + "ms 를 받으면 lag 이 음수가 되어 다음 바퀴에서는 eligible 에서 빠진다.";
      if (finished) {
        pick.done = true;
        epoch = t; live(procs).forEach(function (p) { p.received = 0; });
        d += " '''" + pick.id + " 종료''' — 런큐 구성이 바뀌어 lag 회계를 t=" + f2(t) + " 부터 새로 시작한다.";
      }
      if (key === "latency" && k === 0)
        d += " ⭐ 모두 lag=0(전원 eligible)인데 D 만 슬라이스가 절반이라 VD 가 24 로 가장 이르다 → '''지연에 민감한 D 가 먼저'''.";
      if (key === "nice0_5" && k === 0)
        d += " ⚠ 슬라이스를 weight 에 정확히 비례해 주면 slice/share 가 모두 sched_latency 와 같아져 '''VD 가 전부 48 로 동률'''이 된다 — latency_nice 가 필요한 이유가 여기 있다.";

      steps.push({
        desc: d,
        pc: { EEVDF: 6 },
        vars: snap(pick.id),
        svg: barSvg(procs, "lag (ms) — 0 보다 오른쪽(양수)이 eligible",
          function (p) { return p.done ? 0 : lagOf(p, live(procs)); },
          function (p) { return "w " + p.weight + " / slice " + f2(sliceOf(p, live(procs), true)); }, pick.id, true)
      });
    }

    steps.push({
      desc: "'''정리''' — " + EEVDF_SUMMARY(key),
      pc: { EEVDF: 6 },
      vars: snap(null),
      svg: barSvg(procs, "lag (ms)", function (p) { return p.done ? 0 : lagOf(p, live(procs)); },
        function (p) { return "w " + p.weight; }, null, true)
    });

    return { panels: [P_EEVDF], vars: vars, steps: steps };
  }

  function EEVDF_SUMMARY(key) {
    if (key === "latency")
      return "D 는 슬라이스가 절반(6ms)이라 '''VD 가 늘 더 이르다''' → 같은 48ms 주기 안에서 '''두 번''' 돌아온다. " +
        "그런데 받은 총량은 A·B·C 와 똑같은 12ms — [[lag]] 이 음수가 되면 eligible 에서 빠지기 때문이다. " +
        "즉 EEVDF 는 '''CPU 양(weight)'''과 '''반응 속도(slice)'''를 분리해서 제어한다. 이게 [[CFS]] 가 못 하던 것.";
    if (key === "nice0_5")
      return "lag 이 음수인 프로세스는 eligible 에서 빠지므로 A·B 가 정확히 번갈아 돈다. " +
        "[[lag]] 의 상한이 수학적으로 증명돼 있어 CFS 의 휴리스틱(interactive bonus 등)보다 '''예측 가능'''하다 (6강 p.45).";
    return "런큐에서 프로세스가 빠지면 share 가 바뀌므로 [[lag]] 회계를 다시 맞춰야 한다. " +
      "EEVDF 의 핵심은 '''lag ≥ 0 (eligible)''' 필터 + '''가장 이른 [[virtual deadline]]''' 두 조건이고, 이름이 곧 알고리즘이다.";
  }
})();

// ===== sims/context_switch.js =====
// context_switch — timer interrupt 로 프로세스 A → B 컨텍스트 스위치
// 출처: 4-Limited_Direct_Execution.pdf p.27~33 (LDE 프로토콜, timer interrupt), xv6 kernel/swtch.S
window.SIMS = window.SIMS || {};

(function () {
  var PROTO = [
    "[Program (user)]  Process A running",
    "[Hardware]        timer interrupt",
    "[Hardware]        save regs(A) to k-stack(A)",
    "[Hardware]        move to kernel mode",
    "[Hardware]        jump to trap handler",
    "[OS (kernel)]     Handle the trap",
    "[OS (kernel)]     Call switch() routine",
    "[OS (kernel)]       save regs(A) to proc-struct(A)",
    "[OS (kernel)]       restore regs(B) from proc-struct(B)",
    "[OS (kernel)]       switch to k-stack(B)",
    "[OS (kernel)]     return-from-trap (into B)",
    "[Hardware]        restore regs(B) from k-stack(B)",
    "[Hardware]        move to user mode",
    "[Hardware]        jump to B's PC",
    "[Program (user)]  Process B running"
  ];

  var SWTCH = [
    "# kernel/swtch.S  —  swtch(&A->context, &B->context)",
    "#   a0 = &A.context (저장할 곳),  a1 = &B.context (복원할 곳)",
    "swtch:",
    "    sd ra,  0(a0)      # A 의 복귀 주소",
    "    sd sp,  8(a0)      # A 의 커널 스택 포인터",
    "    sd s0, 16(a0)",
    "    #  ... s1 ~ s11 도 같은 방식 (callee-saved 14개만) ...",
    "",
    "    ld ra,  0(a1)      # B 의 복귀 주소",
    "    ld sp,  8(a1)      # B 의 커널 스택 포인터",
    "    ld s0, 16(a1)",
    "    #  ... s1 ~ s11 복원 ...",
    "    ret                # ra(= B 의 복귀 주소) 로 점프"
  ];

  function twoColSvg(st, owner, caption) {
    // owner: "A" | "B" | "sched"
    function col(x, name, kstack, ctx, hot) {
      var s = '';
      s += '<rect x="' + x + '" y="24" width="132" height="126" rx="6" fill="' +
           (hot ? "#2f6da8" : "#343a42") + '" stroke="' + (hot ? "#7fc0ff" : "#4b535d") + '"/>';
      s += '<text x="' + (x + 66) + '" y="42" font-size="12" text-anchor="middle" fill="#fff">Process ' + name + '</text>';
      s += '<text x="' + (x + 8) + '" y="62" font-size="9.5" fill="#cbd5e0">k-stack(' + name + ')</text>';
      s += '<rect x="' + (x + 8) + '" y="68" width="116" height="30" rx="3" fill="#1e232a" stroke="#4b535d"/>';
      s += '<text x="' + (x + 12) + '" y="86" font-size="9" fill="#9fd0a0">' + esc(kstack) + '</text>';
      s += '<text x="' + (x + 8) + '" y="114" font-size="9.5" fill="#cbd5e0">proc-struct(' + name + ').context</text>';
      s += '<rect x="' + (x + 8) + '" y="120" width="116" height="22" rx="3" fill="#1e232a" stroke="#4b535d"/>';
      s += '<text x="' + (x + 12) + '" y="135" font-size="9" fill="#e0c08a">' + esc(ctx) + '</text>';
      return s;
    }
    function esc(t) {
      t = String(t);
      if (t.length > 22) t = t.slice(0, 21) + "…";
      return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    var s = '<svg viewBox="0 0 360 196" width="100%" style="max-width:360px">';
    s += '<text x="4" y="14" font-size="11" fill="#9aa">CPU 는 한 순간에 하나만 실행한다</text>';
    s += col(14, "A", st["k-stack(A)"], "ra=" + st["A.context.ra"], owner === "A");
    s += col(214, "B", st["k-stack(B)"], "ra=" + st["B.context.ra"], owner === "B");
    var cx = owner === "A" ? 80 : owner === "B" ? 280 : 180;
    s += '<rect x="' + (cx - 34) + '" y="160" width="68" height="22" rx="4" fill="#a8642f" stroke="#ffc08a"/>';
    s += '<text x="' + cx + '" y="175" font-size="11" text-anchor="middle" fill="#fff">CPU</text>';
    s += '<polygon points="' + cx + ',150 ' + (cx - 7) + ',160 ' + (cx + 7) + ',160" fill="#ffc08a"/>';
    s += '<text x="180" y="194" font-size="9.5" text-anchor="middle" fill="#9aa">' + caption + '</text>';
    s += '</svg>';
    return s;
  }

  window.SIMS["context_switch"] = {
    title: "컨텍스트 스위치 (timer interrupt → A에서 B로)",
    desc: "레지스터가 '두 번' 저장된다는 것이 핵심입니다. 하드웨어는 trapframe/커널 스택에, 소프트웨어(swtch)는 proc 구조체에 저장합니다.",
    options: [],
    build: function () {
      var st = {
        "mode": "user",
        "pc": "A 의 유저 코드",
        "sp": "A 의 user stack",
        "ra": "—",
        "s0": "A 의 프레임 포인터",
        "k-stack(A)": "(비어 있음)",
        "k-stack(B)": "B 의 유저 문맥 + scheduler 프레임",
        "A.context.ra": "—",
        "A.context.sp": "—",
        "B.context.ra": "forkret/sched 복귀점",
        "B.context.sp": "k-stack(B) 중간"
      };
      var steps = [];
      function snap() { var o = {}; for (var k in st) o[k] = st[k]; return o; }
      function push(desc, pc, owner, caption, note) {
        steps.push({
          desc: desc,
          pc: { proto: (pc.proto == null ? null : pc.proto), swtch: (pc.swtch == null ? null : pc.swtch) },
          vars: snap(),
          status: {
            proto: st.mode === "user" ? "user mode" : "kernel mode",
            swtch: (pc.swtch != null) ? "running" : "—"
          },
          note: note || undefined,
          svg: twoColSvg(st, owner, caption)
        });

// ===== sims/counter_race.js =====
// counter_race — 8강/9강 counter = counter + 1 의 race condition
// 슬라이드: 9-Lock p.7~8 (mov/add/mov, counter 기본값 50, 기대값 52)
(function (global) {
  "use strict";
  global.SIMS = global.SIMS || {};

  var ASM = [
    "mov 0x8049a1c, %eax",   // 1: counter 를 eax 로 load
    "add $0x1, %eax",        // 2: eax = eax + 1
    "mov %eax, 0x8049a1c"    // 3: eax 를 counter 로 store
  ];

  global.SIMS["counter_race"] = {
    title: "counter++ 경쟁 상태 (race condition)",
    desc: "두 스레드가 counter = counter + 1 을 실행할 때, context switch 시점에 따라 결과가 52 도 되고 51 도 된다.",
    options: [
      {
        key: "interrupt",
        label: "인터럽트 시점",
        values: [
          { value: "none", label: "없음 (정상, 52)" },
          { value: "after_load", label: "T1 load 직후 (망함, 51)" }
        ]
      }
    ],
    build: function (opts) {
      var steps = [];
      var st = { counter: 50, t1: "?", t2: "?" };

      function snap() {
        return { counter: st.counter, "T1.eax": st.t1, "T2.eax": st.t2 };
      }
      function push(desc, pc, status, note) {
        steps.push({ desc: desc, pc: pc, vars: snap(), status: status, note: note });
      }

      var running = { T1: "running", T2: "ready" };
      var runT2 = { T1: "ready", T2: "running" };

      push(
        "초기 상태. 전역 변수 `counter` 는 '''50''', 두 스레드는 아직 아무 명령도 실행하지 않았다. " +
        "`counter = counter + 1` 은 C 소스에서는 한 줄이지만 기계어로는 '''3개 명령'''(load / add / store)이고, " +
        "이 3개 사이에서 [[컨텍스트 스위치|context switch]]가 언제든 일어날 수 있다는 것이 문제의 핵심이다.",
        { T1: null, T2: null },
        { T1: "ready", T2: "ready" }
      );

      if (opts.interrupt === "none") {
        st.t1 = 50;
        push("'''T1''' 이 1번 줄을 실행: 메모리의 `counter`(50)를 `%eax` 로 load 한다. `T1.eax = 50`.",
          { T1: 1, T2: null }, running);
        st.t1 = 51;
        push("'''T1''' 이 2번 줄을 실행: `%eax` 에 1을 더한다. `T1.eax = 51`. 아직 메모리는 그대로 50 이다.",
          { T1: 2, T2: null }, running);
        st.counter = 51;
        push("'''T1''' 이 3번 줄을 실행: `%eax`(51)를 메모리 `counter` 에 store. 이제 `counter = 51`. " +
          "T1 의 [[critical section]] 통과가 '''중간에 끊기지 않고''' 끝났다.",
          { T1: 3, T2: null }, running);

        st.t2 = 51;
        push("여기서 [[컨텍스트 스위치|context switch]] 가 일어나 '''T2''' 가 실행된다. " +
          "T2 가 1번 줄에서 `counter`(51)를 load → `T2.eax = 51`.",
          { T1: null, T2: 1 }, runT2);
        st.t2 = 52;
        push("'''T2''' 가 2번 줄 실행: `T2.eax = 52`.", { T1: null, T2: 2 }, runT2);
        st.counter = 52;
        push("'''T2''' 가 3번 줄 실행: `counter = 52`. " +
          "두 스레드의 증가가 '''직렬화(serialize)''' 되었으므로 우리가 기대한 '''52''' 가 나왔다. " +
          "즉 이 결과는 운이 좋았을 뿐, [[atomic|원자성]]이 보장된 것은 아니다.",
          { T1: null, T2: 3 }, { T1: "done", T2: "done" });

      } else {
        st.t1 = 50;
        push("'''T1''' 이 1번 줄을 실행: `counter`(50)를 `%eax` 로 load. `T1.eax = 50`.",
          { T1: 1, T2: null }, running);

        push("여기서 '''timer interrupt''' 발생 → 커널로 [[트랩|trap]] → 스케줄러가 " +
          "[[컨텍스트 스위치|context switch]] 를 수행해 T2 로 전환한다. " +
          "T1 의 `%eax = 50` 은 T1 의 [[trapframe]]/레지스터 문맥에 저장되어 '''살아남는다'''. " +
          "바로 이 값이 나중에 사고를 친다.",
          { T1: 1, T2: null }, { T1: "ready", T2: "running" },
          "T1 은 load 는 했지만 store 는 아직 못 했다. 즉 메모리의 counter 는 여전히 50 인데 T1 은 '내가 읽은 값은 50' 이라고 기억한 채 멈췄다.");

        st.t2 = 50;
        push("'''T2''' 가 1번 줄 실행: 메모리의 `counter` 를 읽는데, T1 이 아직 store 를 못 했으므로 " +
          "'''똑같은 50''' 을 읽는다. `T2.eax = 50`.",
          { T1: null, T2: 1 }, runT2);
        st.t2 = 51;
        push("'''T2''' 가 2번 줄 실행: `T2.eax = 51`.", { T1: null, T2: 2 }, runT2);
        st.counter = 51;
        push("'''T2''' 가 3번 줄 실행: `counter = 51`. T2 입장에서는 정상적으로 1 증가시킨 것이다.",
          { T1: null, T2: 3 }, runT2);

        push("다시 [[컨텍스트 스위치|context switch]] 가 일어나 '''T1''' 이 재개된다. " +
          "T1 의 `%eax` 는 저장해 둔 '''50''' 으로 복원된다 — 그 사이 메모리가 51 로 바뀐 사실을 T1 은 모른다.",
          { T1: 2, T2: null }, { T1: "running", T2: "done" });
        st.t1 = 51;
        push("'''T1''' 이 2번 줄 실행: `T1.eax = 50 + 1 = 51`.", { T1: 2, T2: null },
          { T1: "running", T2: "done" });
        st.counter = 51;
        push("'''T1''' 이 3번 줄 실행: `counter = 51` 을 다시 덮어쓴다. " +
          "두 번 증가시켰는데 결과는 '''51''' — 증가 한 번이 '''사라졌다(lost update)'''. " +
          "이것이 [[race condition]] 이고, 원인은 `counter++` 가 [[atomic]] 하지 않기 때문이다. " +
          "해결책은 이 [[critical section]] 을 [[락|lock]] 으로 감싸 [[mutual exclusion]] 을 보장하는 것.",
          { T1: 3, T2: null }, { T1: "done", T2: "done" },
          "결과가 51 이냐 52 냐가 '''스케줄러의 기분'''에 달려 있다는 것 자체가 버그다. 재현이 어려워 디버깅이 지옥인 이유.");
      }

      return {
        panels: [
          { id: "T1", title: "Thread 1", lang: "asm", lines: ASM },
          { id: "T2", title: "Thread 2", lang: "asm", lines: ASM }
        ],
        vars: [
          { name: "counter", group: "메모리 (0x8049a1c)" },
          { name: "T1.eax", group: "Thread 1 레지스터" },
          { name: "T2.eax", group: "Thread 2 레지스터" }
        ],
        steps: steps
      };
    }
  };
})(typeof window !== "undefined" ? window : globalThis);

// ===== sims/mlfq.js =====
// mlfq — Multi-Level Feedback Queue (3-큐, 규칙 1~5, allotment, priority boost)
// 5강 p.29~p.39 의 Example 1/2/3 · Priority Boost · Better Accounting 을 그대로 재현한다.
window.SIMS = window.SIMS || {};

(function () {
  var TOP = 2, NLV = 3, ALLOT = 10;            // 슬라이드 Example 1~3: 세 큐 모두 time slice 10ms
  var COLORS = { A: "#3b82f6", B: "#10b981", C: "#f59e0b" };
  var LVNAME = ["Q0 (최저)", "Q1", "Q2 (최고)"];

  var RULES = {
    id: "RULES", title: "MLFQ 규칙 (5강 p.43)", lang: "txt",
    lines: [
      "Rule 1: Priority(A) > Priority(B) 이면 A 가 실행 (B 는 대기)",
      "Rule 2: Priority(A) = Priority(B) 이면 A, B 를 RR 로 실행",
      "Rule 3: job 이 처음 들어오면 '최상위 큐'에 놓는다",
      "Rule 4: 한 레벨에서 allotment 를 다 쓰면 우선순위를 낮춘다",
      "        (구 Rule 4b: slice 전에 CPU 를 놓으면 같은 레벨 유지 -> gaming 가능)",
      "Rule 5: 주기 S 마다 모든 job 을 최상위 큐로 올린다 (priority boost)",
      "(대기) I/O 중이거나 아직 도착 전"
    ]
  };

  var SCEN = {
    single_long: {
      label: "① 긴 CPU job 하나 (p.33)",
      end: 200, boostS: 0, gaming: false,
      jobs: [{ id: "A", arrival: 0, kind: "cpu", total: 200 }],
      intro: "CPU 만 쓰는 긴 job A 하나. Rule 3 으로 Q2 에서 시작해 allotment(10ms)를 쓸 때마다 Rule 4 로 한 칸씩 내려가 Q0 에 정착한다."
    },
    short_arrives: {
      label: "② 긴 job + 나중에 온 짧은 job (p.34)",
      end: 200, boostS: 0, gaming: false,
      jobs: [
        { id: "A", arrival: 0, kind: "cpu", total: 300 },
        { id: "B", arrival: 100, kind: "cpu", total: 20 }
      ],
      intro: "A 는 이미 Q0 까지 내려와 있고, t=100 에 20ms 짜리 B 가 도착한다. Rule 3 덕에 B 는 Q2 에서 시작해 A 를 선점 — MLFQ 가 [[STCF]] 를 흉내내는 장면."
    },
    io_job: {
      label: "③ slice 직전에 I/O 를 내는 job (p.37·p.39)",
      end: 100, boostS: 0, gaming: null,       // gaming 은 rule4 옵션으로 결정
      jobs: [
        { id: "A", arrival: 0, kind: "cpu", total: 400 },
        { id: "B", arrival: 0, kind: "io", cpuBurst: 9, ioTime: 1, total: 400 }
      ],
      intro: "B 는 slice(10ms)가 끝나기 '직전'인 9ms 에서 일부러 I/O 를 내는 악의적 job. 구 Rule 4b 에서는 '양보했으니 같은 레벨 유지'라 B 가 Q2 를 독점한다 (gaming). 새 Rule 4(allotment 누적)로 막을 수 있다."
    },
    boost: {
      label: "④ starvation → priority boost (p.38)",
      end: 130, boostS: 50, gaming: true,
      jobs: [
        { id: "A", arrival: 0, kind: "cpu", total: 400 },
        { id: "B", arrival: 0, kind: "io", cpuBurst: 5, ioTime: 5, total: 400 },
        { id: "C", arrival: 0, kind: "io", cpuBurst: 5, ioTime: 5, total: 400 }
      ],
      intro: "긴 CPU job A + 인터랙티브 job B·C. B·C 가 번갈아 CPU 를 꽉 채워 A 는 Q0 에서 굶는다(starvation). Rule 5 가 S=50ms 마다 전원을 Q2 로 끌어올려 A 를 구제한다."
    }
  };

  function sim(sc, gaming) {
    var jobs = sc.jobs.map(function (j) {
      return {
        id: j.id, arrival: j.arrival, kind: j.kind, total: j.total,
        cpuBurst: j.cpuBurst || 0, ioTime: j.ioTime || 0,
        remaining: j.total, burstLeft: j.cpuBurst || 0, ioLeft: 0,
        level: TOP, allot: 0, used: 0, arrived: false, state: "미도착"
      };
    });
    var queues = [[], [], []], running = null, trace = [];

    for (var t = 0; t < sc.end; t++) {
      var pre = [], post = [];
      // --- I/O 진행 / 완료
      jobs.forEach(function (j, i) {
        if (j.state !== "blocked") return;
        if (j.ioLeft <= 0) { j.state = "ready"; queues[j.level].push(i); pre.push({ type: "iodone", job: i }); }
        else j.ioLeft--;
      });
      // --- 도착 (Rule 3)
      jobs.forEach(function (j, i) {
        if (j.arrived || j.arrival > t) return;
        j.arrived = true; j.state = "ready"; j.level = TOP; j.allot = 0;
        queues[TOP].push(i); pre.push({ type: "arrive", job: i });
      });
      // --- Rule 5 priority boost
      if (sc.boostS > 0 && t > 0 && t % sc.boostS === 0) {
        queues = [[], [], []];
        jobs.forEach(function (j, i) {
          if (!j.arrived || j.state === "done") return;
          j.level = TOP; j.allot = 0;
          if (j.state === "ready") queues[TOP].push(i);
        });
        pre.push({ type: "boost" });
      }
      // --- Rule 1: 더 높은 큐에 job 이 있으면 선점
      if (running !== null) {
        var rl = jobs[running].level;
        for (var L = TOP; L > rl; L--) {
          if (queues[L].length) {
            jobs[running].state = "ready"; queues[rl].unshift(running);
            pre.push({ type: "preempt", job: running }); running = null; break;
          }
        }
      }
      // --- dispatch (Rule 1 + Rule 2)
      if (running === null) {
        for (var L2 = TOP; L2 >= 0 && running === null; L2--) {
          while (queues[L2].length) {
            var c = queues[L2].shift();
            if (jobs[c].state === "ready") { running = c; jobs[c].state = "running"; pre.push({ type: "dispatch", job: c }); break; }
          }
        }
      }
      // --- 1ms 실행
      var ran = running, ranLevel = running === null ? -1 : jobs[running].level;
      if (running !== null) {
        var j2 = jobs[running];
        j2.used++; j2.allot++; j2.remaining--;
        if (j2.kind === "io") j2.burstLeft--;
        if (j2.remaining <= 0) {
          j2.state = "done"; post.push({ type: "done", job: running }); running = null;
        } else if (j2.kind === "io" && j2.burstLeft <= 0) {
          j2.state = "blocked"; j2.ioLeft = j2.ioTime; j2.burstLeft = j2.cpuBurst;
          if (gaming) j2.allot = 0;                       // 구 Rule 4b: 양보하면 카운터 리셋
          post.push({ type: "io", job: running }); running = null;
        } else if (j2.allot >= ALLOT) {                    // Rule 4
          j2.allot = 0; j2.state = "ready";
          if (j2.level > 0) { j2.level--; post.push({ type: "demote", job: running }); }
          else post.push({ type: "requeue", job: running });
          queues[j2.level].push(running); running = null;
        }
      }
      trace.push({
        t: t, ran: ran, ranLevel: ranLevel, pre: pre, post: post,
        snap: {
          running: running,
          queues: [queues[0].slice(), queues[1].slice(), queues[2].slice()],
          jobs: jobs.map(function (j) { return { level: j.level, allot: j.allot, state: j.state, used: j.used }; })
        }
      });
    }
    return { jobs: jobs, trace: trace };
  }

  // ---------------- SVG ----------------
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  function svgFor(s, jobs, end, idx) {
    var snap = idx < 0 ? null : s.trace[idx].snap;
    var lanes = [], i;
    for (i = 0; i < NLV; i++) lanes.push((snap ? snap.queues[i] : []).slice());
    var running = snap ? snap.running : null;
    if (idx >= 0 && s.trace[idx].ran !== null && running === null) running = s.trace[idx].ran;

    var W = 760, laneH = 34, laneY0 = 20, laneGap = 8;
    var tlY = laneY0 + NLV * (laneH + laneGap) + 22;
    var H = tlY + 60;
    var o = ['<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="max-width:760px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">'];

    for (i = 0; i < NLV; i++) {
      var lv = TOP - i;                               // 위에서부터 Q2, Q1, Q0
      var y = laneY0 + i * (laneH + laneGap);
      o.push('<text x="4" y="' + (y + 21) + '" font-size="11" fill="#8b95a5">' + LVNAME[lv] + '</text>');
      o.push('<rect x="72" y="' + y + '" width="' + (W - 82) + '" height="' + laneH +
        '" rx="6" fill="#8b95a5" fill-opacity="0.07" stroke="#8b95a5" stroke-opacity="0.25"/>');
      var x = 80;
      if (running !== null && snap && snap.jobs[running].level === lv) {
        var rc = COLORS[jobs[running].id] || "#3b82f6";
        o.push('<rect x="' + x + '" y="' + (y + 5) + '" width="88" height="' + (laneH - 10) + '" rx="4" fill="' + rc + '"/>');
        o.push('<text x="' + (x + 44) + '" y="' + (y + 21) + '" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">' +
          esc(jobs[running].id) + ' ▶RUN</text>');
        x += 96;
      }
      lanes[lv].forEach(function (ji) {
        var col = COLORS[jobs[ji].id] || "#888";
        o.push('<rect x="' + x + '" y="' + (y + 7) + '" width="34" height="' + (laneH - 14) + '" rx="4" fill="' + col + '" fill-opacity="0.35" stroke="' + col + '"/>');
        o.push('<text x="' + (x + 17) + '" y="' + (y + 21) + '" font-size="11" fill="' + col + '" text-anchor="middle">' + esc(jobs[ji].id) + '</text>');
        x += 40;
      });
      if (lv === TOP) {
        var blocked = jobs.map(function (j, k) { return k; }).filter(function (k) {
          return snap && snap.jobs[k].state === "blocked";
        });
        if (blocked.length) {
          o.push('<text x="' + (W - 14) + '" y="' + (y + 21) + '" font-size="10" fill="#8b95a5" text-anchor="end">I/O 대기: ' +
            blocked.map(function (k) { return jobs[k].id; }).join(",") + '</text>');
        }
      }
    }

    // 하단 레벨 타임라인 (슬라이드 그림과 같은 형태)
    var L = 72, R = W - 10, sc2 = (R - L) / Math.max(1, end);
    o.push('<text x="4" y="' + (tlY + 12) + '" font-size="10" fill="#8b95a5">시간축</text>');
    for (i = 0; i < NLV; i++) {
      var lv2 = TOP - i, yy = tlY + i * 14;
      o.push('<line x1="' + L + '" y1="' + (yy + 12) + '" x2="' + R + '" y2="' + (yy + 12) + '" stroke="#8b95a5" stroke-opacity="0.2"/>');
      o.push('<text x="' + (L - 6) + '" y="' + (yy + 15) + '" font-size="9" fill="#8b95a5" text-anchor="end">Q' + lv2 + '</text>');
    }
    var upto = idx < 0 ? -1 : idx;
    for (i = 0; i <= upto; i++) {
      var tr = s.trace[i];
      if (tr.ran === null) continue;
      var row = TOP - tr.ranLevel;
      var cx = L + i * sc2;
      var col2 = COLORS[jobs[tr.ran].id] || "#888";
      o.push('<rect x="' + cx.toFixed(1) + '" y="' + (tlY + row * 14) + '" width="' + Math.max(1, sc2).toFixed(2) +
        '" height="11" fill="' + col2 + '"/>');
    }
    var step = end > 160 ? 50 : (end > 60 ? 20 : 10);
    for (var tt = 0; tt <= end; tt += step) {
      o.push('<text x="' + (L + tt * sc2).toFixed(1) + '" y="' + (tlY + NLV * 14 + 12) + '" font-size="9" fill="#8b95a5" text-anchor="middle">' + tt + '</text>');
    }
    var nowX = L + (upto + 1) * sc2;
    o.push('<line x1="' + nowX.toFixed(1) + '" y1="' + (tlY - 2) + '" x2="' + nowX.toFixed(1) + '" y2="' + (tlY + NLV * 14) +
      '" stroke="#ef4444" stroke-width="1.5"/>');
    o.push("</svg>");
    return o.join("");
  }

  // ---------------- 스텝 만들기 ----------------
  var NOTABLE = { arrive: 1, iodone: 1, boost: 1, preempt: 1, io: 1, demote: 1, done: 1 };
  function hasNotable(list) { for (var i = 0; i < list.length; i++) if (NOTABLE[list[i].type]) return true; return false; }

  function blocksOf(trace) {
    var out = [], start = 0;
    for (var i = 0; i < trace.length; i++) {
      var newBlock = (i === 0) || (trace[i].ran !== trace[i - 1].ran) ||
        hasNotable(trace[i].pre) || hasNotable(trace[i - 1].post) || (i - start >= 50);
      if (newBlock && i > 0) { out.push({ s: start, e: i }); start = i; }
    }
    out.push({ s: start, e: trace.length });
    return out;
  }

  function evText(ev, jobs, ruleLine) {
    var j = ev.job !== undefined ? jobs[ev.job].id : "";
    switch (ev.type) {
      case "arrive": return "'''" + j + " 도착''' → Rule 3 에 따라 최상위 Q2 에 넣는다.";
      case "iodone": return j + " 의 I/O 완료 → blocked 에서 ready 로 돌아와 같은 레벨 큐 뒤에 붙는다.";
      case "boost": return "⭐ '''Rule 5 priority boost''' — 모든 job 을 Q2 로 끌어올리고 allotment 를 0 으로 리셋.";
      case "preempt": return j + " 는 더 높은 큐에 job 이 생겨 '''선점당함''' (Rule 1).";
      case "io": return "'''" + j + " 가 I/O 발행''' → blocked. CPU 를 자발적으로 놓았다.";
      case "demote": return "'''Rule 4''': " + j + " 가 allotment 10ms 를 다 씀 → 한 단계 강등.";
      case "done": return "'''" + j + " 완료'''.";
      default: return "";
    }
  }

  SIMS["mlfq"] = {
    title: "MLFQ — 3-큐 피드백 스케줄러",
    desc: "[[MLFQ]] 규칙 1~5 를 눈으로 본다. Rule 3(신규는 최상위), Rule 4(allotment 소진 시 강등), Rule 5(주기 S 마다 [[선점|priority boost]])가 실제로 언제 발동하는지 큐 그림과 시간축으로 보여준다. allotment = 10ms, 큐 3개.",
    options: [
      {
        key: "scenario", label: "시나리오", values: [
          { value: "single_long", label: "① 긴 CPU job 하나 (p.33)" },
          { value: "short_arrives", label: "② 나중에 온 짧은 job (p.34)" },
          { value: "io_job", label: "③ gaming: slice 직전 I/O (p.39)" },
          { value: "boost", label: "④ starvation → boost (p.38)" }
        ]
      },
      {
        key: "rule4", label: "Rule 4 (시나리오 ③ 전용)", values: [
          { value: "gaming", label: "구 Rule 4b — 양보하면 레벨 유지" },
          { value: "allotment", label: "새 Rule 4 — allotment 누적" }
        ]
      }
    ],

    build: function (opts) {
      var key = opts.scenario || "single_long";
      var sc = SCEN[key];
      var gaming = (sc.gaming === null) ? ((opts.rule4 || "gaming") === "gaming") : sc.gaming;
      var s = sim(sc, gaming);
      var jobs = s.jobs;

      var vars = [
        { name: "time", group: "스케줄러" },
        { name: "running", group: "스케줄러" },
        { name: "Q2 (최고)", group: "큐" },
        { name: "Q1", group: "큐" },
        { name: "Q0 (최저)", group: "큐" },
        { name: "I/O blocked", group: "큐" }
      ];
      jobs.forEach(function (j) {
        vars.push({ name: j.id + ".level", group: "job " + j.id });
        vars.push({ name: j.id + ".allot(사용)", group: "job " + j.id });
        vars.push({ name: j.id + ".state", group: "job " + j.id });
        vars.push({ name: j.id + ".CPU누적", group: "job " + j.id });
      });

      function snapVars(idx) {
        var snap = idx < 0
          ? { running: null, queues: [[], [], []], jobs: jobs.map(function (j) { return { level: TOP, allot: 0, state: j.arrival === 0 ? "ready" : "미도착", used: 0 }; }) }
          : s.trace[idx].snap;
        var run = idx < 0 ? null : (snap.running !== null ? snap.running : s.trace[idx].ran);
        function q(i) {
          var arr = snap.queues[i].filter(function (k) { return snap.jobs[k].state === "ready"; });
          return arr.length ? "[" + arr.map(function (k) { return jobs[k].id; }).join(", ") + "]" : "[ ]";
        }
        var v = {
          time: (idx + 1) + " ms",
          running: run === null ? "— (idle)" : jobs[run].id + " @ Q" + snap.jobs[run].level,
          "Q2 (최고)": q(2), "Q1": q(1), "Q0 (최저)": q(0)
        };
        var bl = [];
        snap.jobs.forEach(function (x, k) { if (x.state === "blocked") bl.push(jobs[k].id + "(I/O)"); });
        v["I/O blocked"] = bl.length ? bl.join(", ") : "—";
        jobs.forEach(function (j, k) {
          v[j.id + ".level"] = "Q" + snap.jobs[k].level;
          v[j.id + ".allot(사용)"] = snap.jobs[k].allot + " / " + ALLOT + " ms";
          v[j.id + ".state"] = snap.jobs[k].state === "running" ? "running"
            : snap.jobs[k].state === "blocked" ? "blocked (I/O)" : snap.jobs[k].state;
          v[j.id + ".CPU누적"] = snap.jobs[k].used + " ms";
        });
        return v;
      }

      var steps = [];
      var ruleNote = gaming
        ? "지금은 '''구 Rule 4b''' — slice 를 다 쓰기 전에 CPU 를 놓으면 같은 레벨에 남는다."
        : "지금은 '''새 Rule 4''' — 레벨별 allotment 를 '누적'해서 센다. 중간에 몇 번 양보했든 10ms 를 다 쓰면 강등.";

      steps.push({
        desc: "'''" + sc.label + "''' — " + sc.intro + " " +
          (key === "io_job" ? ruleNote + " " : "") +
          (sc.boostS ? "priority boost 주기 S = " + sc.boostS + "ms. " : "") +
          "아래 시간축 그림이 슬라이드의 Q2/Q1/Q0 막대 그림과 같은 것이다.",
        pc: { RULES: 3 },
        vars: snapVars(-1),
        svg: svgFor(s, jobs, sc.end, -1)
      });

      var blocks = blocksOf(s.trace);
      blocks.forEach(function (b) {
        var first = s.trace[b.s], last = s.trace[b.e - 1];
        var msgs = [];
        first.pre.forEach(function (e) { if (NOTABLE[e.type]) msgs.push(evText(e, jobs)); });
        var head;
        if (first.ran === null) {
          head = "t = " + b.s + " → " + b.e + " ms : CPU idle.";
        } else {
          head = "t = " + b.s + " → " + b.e + " ms : '''" + jobs[first.ran].id + "''' 가 '''Q" + first.ranLevel +
            "''' 에서 " + (b.e - b.s) + "ms 실행.";
        }
        last.post.forEach(function (e) { if (NOTABLE[e.type]) msgs.push(evText(e, jobs)); });

        var line = 2;
        var all = first.pre.concat(last.post);
        for (var i = 0; i < all.length; i++) {
          if (all[i].type === "arrive") line = 3;
          else if (all[i].type === "demote") line = 4;
          else if (all[i].type === "io") line = gaming ? 5 : 4;
          else if (all[i].type === "boost") line = 6;
          else if (all[i].type === "preempt") line = 1;
          else if (all[i].type === "iodone") line = 7;
        }

        steps.push({
          desc: head + (msgs.length ? " " + msgs.join(" ") : ""),
          pc: { RULES: line },
          vars: snapVars(b.e - 1),
          svg: svgFor(s, jobs, sc.end, b.e - 1)
        });
      });

      // 마지막 요약
      var tally = jobs.map(function (j) { return j.id + " " + j.used + "ms (Q" + j.level + ")"; }).join(", ");
      steps.push({
        desc: "'''정리''' — " + sc.end + "ms 동안 받은 CPU: " + tally + ". " + SUMMARY(key, gaming),
        pc: { RULES: 4 },
        vars: snapVars(s.trace.length - 1),
        note: key === "io_job" && gaming
          ? "구 Rule 4b 하에서 B 가 Q2 를 독점하고 A 는 거의 굶는다 — 슬라이드 p.39 왼쪽 그림."
          : null,
        svg: svgFor(s, jobs, sc.end, s.trace.length - 1)
      });

      return { panels: [RULES], vars: vars, steps: steps };
    }
  };

  function SUMMARY(key, gaming) {
    if (key === "single_long")
      return "Q2 에서 10ms, Q1 에서 10ms 쓰고 t=20 부터는 Q0 에 정착 — 슬라이드 p.33 그림 그대로. 더 내려갈 큐가 없으니 Q0 에서는 계속 RR(혼자라 연속 실행)한다.";
    if (key === "short_arrives")
      return "B 는 자기 길이(20ms)를 아무도 모르는데도 Rule 3 덕에 Q2 에서 시작해 20ms 만에 끝났다. 이게 '''MLFQ approximates [[STCF]]''' (p.35) 의 의미. B 의 [[response time]] = 0.";
    if (key === "io_job")
      return gaming

// queue_lock — 9강 p.33~38 park/unpark 큐 락, guard, wakeup/waiting race, setpark()
(function (global) {
  "use strict";
  global.SIMS = global.SIMS || {};

  // 시나리오에 따라 setpark() 줄이 있고 없고 → 줄 번호가 달라지므로 라벨로 관리
  function makeCode(hasSetpark) {
    var lines = [];
    var L = {};
    function add(label, src) { lines.push(src); if (label) L[label] = lines.length; }

    add(null, "typedef struct __lock_t {");
    add(null, "    int flag; int guard; queue_t *q;");
    add(null, "} lock_t;");
    add(null, "");
    add(null, "void lock(lock_t *m) {");
    add("l_guard", "    while (TestAndSet(&m->guard, 1) == 1)");
    add("l_spin", "        ;   // guard 를 spin 으로 획득");
    add("l_if", "    if (m->flag == 0) {");
    add("l_setflag", "        m->flag = 1;   // 락 획득!");
    add("l_g0a", "        m->guard = 0;  // guard 해제");
    add("l_else", "    } else {");
    add("l_qadd", "        queue_add(m->q, gettid());");
    if (hasSetpark) add("l_setpark", "        setpark();     // 곧 park 한다고 예고");
    add("l_g0b", "        m->guard = 0;  // guard 해제");
    add("l_park", "        park();        // 잠들기");
    add(null, "    }");
    add(null, "}");
    add(null, "");
    add(null, "void unlock(lock_t *m) {");
    add("u_guard", "    while (TestAndSet(&m->guard, 1) == 1)");
    add("u_spin", "        ;");
    add("u_if", "    if (queue_empty(m->q))");
    add("u_clear", "        m->flag = 0;   // 기다리는 놈 없음");
    add("u_else", "    else");
    add("u_unpark", "        unpark(queue_remove(m->q));  // 락을 넘겨줌");
    add("u_g0", "    m->guard = 0;");
    add(null, "}");

    return { lines: lines, L: L };
  }

  global.SIMS["queue_lock"] = {
    title: "queue 락 (park / unpark)",
    desc: "spin 대신 잠재우는 락. guard 로 lock/unlock 자체를 보호하고, 못 들어간 스레드는 큐에 넣고 park() 한다.",
    options: [
      {
        key: "scenario",
        label: "시나리오",
        values: [
          { value: "normal", label: "정상 동작" },
          { value: "wakeup_waiting_race", label: "wakeup/waiting race (영원히 잠듦)" },
          { value: "with_setpark", label: "setpark() 로 해결" }
        ]
      }
    ],
    build: function (opts) {
      var sc = opts.scenario || "normal";
      var hasSP = (sc === "with_setpark");
      var code = makeCode(hasSP);
      var L = code.L;

      var st = { guard: 0, flag: 0, q: [], A: "ready", B: "ready", parkToken: false };
      var steps = [];

      function snap() {
        return {
          guard: st.guard, flag: st.flag, q: st.q.slice(),
          "A.state": st.A, "B.state": st.B,
          "setpark_token": st.parkToken
        };
      }
      function badge(s) {
        if (s.indexOf("critical") >= 0) return "running";
        if (s.indexOf("spin") >= 0) return "spinning";
        if (s.indexOf("park") >= 0 || s.indexOf("잠") >= 0) return "parked";
        if (s === "done") return "done";
        return "ready";
      }
      function push(desc, pc, note) {
        steps.push({
          desc: desc,
          pc: { A: pc.A === undefined ? null : pc.A, B: pc.B === undefined ? null : pc.B },
          vars: snap(),
          status: { A: badge(st.A), B: badge(st.B) },
          note: note
        });
      }

      if (sc === "normal") {
        push("초기 상태: `flag = 0` (락 비어 있음), `guard = 0`, 대기 큐 `q` 는 비어 있다. " +
          "`guard` 는 '''lock()/unlock() 함수 자체''' 를 두 스레드가 동시에 실행하지 못하게 막는 " +
          "짧은 [[spin lock]] 이고, `flag` 가 '''진짜 락''' 이다.", {});

        st.guard = 1;
        push("'''A''' 가 `lock()` 호출 → `TestAndSet(&m->guard, 1)` 이 0 을 반환하여 guard 획득. `guard = 1`.",
          { A: L.l_guard });
        push("'''A''' 가 `m->flag == 0` 을 검사 → 참. 락이 비어 있다.", { A: L.l_if });
        st.flag = 1; st.A = "락 획득";
        push("'''A''' 가 `m->flag = 1` 로 락을 잡는다.", { A: L.l_setflag });
        st.guard = 0; st.A = "critical section";
        push("'''A''' 가 `m->guard = 0` 으로 guard 를 놓고 [[critical section]] 으로 들어간다. " +
          "guard 를 잡고 있던 구간은 몇 개 명령뿐이라 spin 비용이 작다.", { A: L.l_g0a });

        st.guard = 1;
        push("'''B''' 가 `lock()` 호출 → guard 를 [[test-and-set|TAS]] 로 획득. `guard = 1`.",
          { A: L.l_g0a, B: L.l_guard });
        push("'''B''' 가 `m->flag == 0` 검사 → `flag` 는 1 이므로 '''거짓''' → else 로 간다.",
          { B: L.l_if });
        st.q = ["B"];
        push("'''B''' 가 `queue_add(m->q, gettid())` 로 '''자기 tid 를 대기 큐에 넣는다'''.",
          { B: L.l_qadd });
        st.guard = 0;
        push("'''B''' 가 `m->guard = 0` 으로 guard 해제. (park 하기 전에 반드시 놓아야 한다 — " +
          "guard 를 쥔 채 자면 아무도 lock/unlock 을 못 한다.)", { B: L.l_g0b });
        st.B = "parked (잠듦)";
        push("'''B''' 가 `park()` 로 '''잠든다'''. spin 과 달리 CPU 를 전혀 쓰지 않는다 — " +
          "이것이 [[park와 unpark]] 를 쓰는 이유다.", { B: L.l_park });

        st.guard = 1;
        push("'''A''' 가 `unlock()` 호출 → guard 획득.", { A: L.u_guard });
        push("'''A''' 가 `queue_empty(m->q)` 검사 → 큐에 B 가 있으므로 '''거짓''' → else.",
          { A: L.u_if });
        st.q = []; st.B = "ready (깨어남)";
