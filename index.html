  ],
  "body": "'''futex'''는 리눅스가 제공하는 '''fast userspace mutex''' 시스템 콜이다. 9강 p.39~41. [[park와 unpark|park()]]의 \"'''Checked'''\"하고 \"'''Queued'''\"된 버전이라고 슬라이드가 소개한다.\n\n{def}p.39 원문:\n* '''`futex_wait(address, value)`''' — \"Put a calling thread to sleep queue '''only if `*address == value`'''\"\n* '''`futex_wake(address)`''' — \"Wake a waiting thread that waits for `address`\"{/def}\n\n{warn}⭐ '''\"only if\"가 전부다.''' 잠들기 직전에 값을 한 번 더 확인하는 일을 '''커널이 [[atomic|원자적]]으로''' 해 준다. 그래서 [[setpark]] 같은 예고제 없이도 [[queue 락]]의 '''lost wakeup'''이 생기지 않는다.\n그리고 '''주소(address) 하나가 대기열의 key'''가 된다 — 커널은 \"이 주소를 기다리는 스레드들\"의 큐를 관리한다.{/warn}\n\n== futex 기반 락 (p.40) ==\n\n[[img:L9-40.png|Futex-based lock implementation — glibc mutex의 골격|large]]\n\n<pre class=\"c\">\n 1   void lock(int *mutex) {\n 2       if (atomic_bit_test_set(mutex, 31) == 0) return;   // (1) 빠른 경로\n 3       atomic_increment(mutex);                           // (2) 대기자 수 +1\n 4       while (1) {\n 5           if (atomic_bit_test_set(mutex, 31) == 0) {     // (3) 다시 시도\n 6               atomic_decrement(mutex);                   //     성공 -> 대기자 수 -1\n 7               return;\n 8           }\n 9           v = *mutex;                                    // (4) 현재 상태를 읽어 두고\n10           if (v >= 0) continue;                          //     bit31이 0(=풀림)이면 재시도\n11           futex_wait(mutex, v);                          // (5) 값이 v 그대로일 때만 잠든다\n12       }\n13   }\n14\n22   void unlock(int *mutex) {\n23       if (atomic_add_zero(mutex, 0x80000000))            // 대기자 0이면 커널 진입 없이 끝\n24           return;\n25       futex_wake(mutex);                                 // 대기자가 있을 때만 커널로\n26   }\n<\/pre>\n\n=== 정수 하나에 상태를 패킹한다 ===\n\n{|\n! 비트 || 의미\n|-\n| '''bit 31''' (최상위) || 락이 잡혀 있는가 (1 = held). 부호 비트이므로 '''값이 음수면 held'''\n|-\n| 나머지 비트 (0~30) || '''대기자 수'''\n|}\n\n이 트릭 덕분에 10번 줄 `if (v >= 0) continue;`가 성립한다 — \"'''양수 = bit31이 0 = 락이 풀렸다'''\"이므로 잠들 필요 없이 다시 시도하면 된다.\n\n=== 줄 읽기 ===\n\n{|\n! 줄 || 하는 일 || 커널 진입?\n|-\n| 2 || '''빠른 경로''' — bit31을 세워 보고 원래 0이었으면 바로 획득하고 리턴 || '''없음'''\n|-\n| 3 || 실패했으니 \"나 기다리는 중\" 카운트를 올린다 || 없음\n|-\n| 5~7 || 루프 안에서 다시 시도. 성공하면 카운트를 되돌리고 리턴 || 없음\n|-\n| 9~10 || 현재 값 `v`를 읽고, 락이 이미 풀렸으면(`v >= 0`) 잠들지 않고 재시도 || 없음\n|-\n| 11 || '''값이 여전히 `v`일 때만''' 잠든다 || '''있음'''\n|-\n| 23 || 대기자가 0이면 커널에 가지 않고 끝 || '''없음'''\n|-\n| 25 || 대기자가 있을 때만 깨운다 || 있음\n|}\n\n{warn}⭐ '''9~11번 줄이 lost wakeup을 막는 자리다.''' `v`를 읽은 뒤 `futex_wait(mutex, v)`를 호출하기까지의 틈에 다른 스레드가 `unlock`으로 값을 바꿨다면, 커널은 `*mutex != v`임을 보고 '''잠재우지 않고 즉시 리턴'''시킨다. [[setpark]]가 \"예고\"로 푼 문제를 futex는 \"'''잠들기 직전 값 재확인'''\"으로 푼다.{/warn}\n\n== 설계 철학 — 이것만 기억하면 된다 ==\n\n{def}'''\"경쟁이 없으면 유저 공간에서 [[atomic]] 연산만으로 끝나고(커널 진입 0회), 경쟁이 있을 때만 커널로 들어간다.\"'''\n\n이것이 \"'''fast userspace''' mutex\"라는 이름의 뜻이고, [[two-phase lock]]의 정의이기도 하다.{/def}\n\n{analogy}🎭 futex = '''셀프 계산대'''다.\n사람이 없으면 '''직원을 부르지 않고''' 혼자 찍고 나간다(유저 공간 원자 연산만, 커널 진입 0). 문제가 생겼을 때만 호출 버튼을 누른다(`futex_wait`/`futex_wake` = 시스템 콜).\n락 경쟁은 실제로 '''대부분 일어나지 않기''' 때문에, \"문제 없을 때 공짜\"인 설계가 압도적으로 이득이다.{/analogy}\n\n{info}코드를 통째로 외울 필요는 없다. 시험에 나온다면 ① bit 31 = 락 여부 / 나머지 = 대기자 수 ② \"무경쟁이면 커널 진입 없음\" ③ `futex_wait`의 값 검사가 lost wakeup을 막는다 — 이 세 가지다.{/info}\n\n== park/unpark vs futex (p.41) ==\n\n{|\n! || '''[[park와 unpark|park/unpark]]''' (Solaris) || '''futex''' (Linux)\n|-\n| 성격 || '''Purely scheduling primitive''' || 락 지원에 특화된 시스템 콜\n|-\n| 커널이 유지하는 것 || '''minimal state''' || '''대기 queue를 커널이 직접 관리''' (락 상태는 '''유저가 소유''')\n|-\n| 왜 그렇게? || || '''Fair wakeup''' ([[priority inversion|priority inheritance]]) · '''Robust mutexes''' (owner-death detection)\n|}\n\n{exam}🎯 \"커널이 대기 큐를 관리하면 무엇이 좋은가?\" → '''① fair wakeup (priority inheritance)''' '''② robust mutexes (owner-death detection)'''. 슬라이드에 그대로 적힌 두 줄이라 단답으로 나오기 좋다.{/exam}\n\n{quiz}`futex_wait(address, value)`의 `value` 인자는 왜 필요한가?{/quiz}\n{answer}'''lost wakeup을 막기 위해서다.''' 유저 공간에서 값을 읽은 뒤 `futex_wait`을 호출하기까지의 틈에 다른 스레드가 락을 놓아 값이 바뀔 수 있다. 커널은 잠재우기 직전 `*address == value`인지 '''원자적으로 확인'''하고, 다르면 '''잠재우지 않고 즉시 리턴'''시킨다. [[setpark]]와 같은 문제를 다른 방식으로 푼 것이다.{/answer}\n\n{quiz}futex가 \"fast\"한 이유를 한 문장으로 쓰시오.{/quiz}\n{answer}'''락 경쟁이 없는 경우(uncontended)에는 유저 공간의 [[atomic]] 연산만으로 lock/unlock이 끝나 커널에 전혀 진입하지 않기''' 때문이다. 시스템 콜은 경쟁이 실제로 발생했을 때만 일어난다. → [[two-phase lock]]{/answer}\n\n== 관련 문서 ==\n* [[two-phase lock]] · [[park와 unpark]] · [[setpark]] · [[queue 락]]\n* [[락]] · [[락 평가 기준]] · [[atomic]] · [[priority inversion]]\n* [[시스템 콜]] · [[자주 틀리는 함정 모음]]"
 },
 "two-phase lock": {
  "title": "Two-Phase Lock (2단계 락)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''Two-phase lock'''은 \"'''먼저 잠깐 [[spin lock|spin]]해 보고, 그래도 안 되면 [[park와 unpark|잠든다]]'''\"는 하이브리드 전략이다. 9강 p.40의 [[futex]] 기반 락이 정확히 이 구조이며, 실제 리눅스 mutex가 쓰는 방식이다.\n\n[[img:L9-40.png|9강 p.40 — Linux futex 기반 two-phase lock|medium]]\n\n== 두 단계 ==\n\n{|\n! 단계 || 하는 일 || 커널 진입 || 언제 유리한가\n|-\n| '''Phase 1''' || 유저 공간에서 [[atomic]] 연산으로 '''잠깐 시도/spin''' || '''없음''' || 락이 곧 풀릴 때 (대부분의 경우)\n|-\n| '''Phase 2''' || 그래도 못 얻으면 '''`futex_wait`로 잠든다''' || 있음 || 락 보유자가 오래 잡고 있을 때\n|}\n\n== 왜 이렇게 하나 ==\n\n앞 단계들을 되짚어 보면 어느 쪽도 항상 옳지 않았다:\n\n{|\n! 방식 || 강점 || 약점\n|-\n| '''[[spin lock]]''' || 락이 '''곧''' 풀리면 최고 — 깨어나는 지연이 0 || 오래 기다리면 [[time slice]] 전체를 태움\n|-\n| '''[[queue 락|sleeping lock]]''' || 오래 기다려도 CPU를 안 씀 || 잠들고 깨는 [[컨텍스트 스위치]] 비용이 고정으로 든다\n|}\n\n'''대기 시간이 짧으면 spin이, 길면 sleep이 이긴다.''' 그런데 얼마나 기다릴지는 미리 알 수 없다. 그래서 '''일단 짧게 spin해 보고 → 안 되면 잠든다'''로 두 전략의 좋은 쪽만 취한다.\n\n{analogy}🎭 '''엘리베이터 앞에서'''. 곧 올 것 같으면 그냥 서서 기다린다(phase 1 = spin). 층 표시가 한참 위에서 안 내려오면 '''계단으로 가거나 의자에 앉는다'''(phase 2 = park). 처음부터 앉아 버리면 5초면 올 엘리베이터에 '''일어나 앉는 수고'''만 더한 꼴이고, 끝까지 서 있으면 10분을 낭비한다.{/analogy}\n\n== futex 코드에서 두 단계 찾기 (p.40) ==\n\n<pre class=\"c\">\n 1   void lock(int *mutex) {\n 2       if (atomic_bit_test_set(mutex, 31) == 0) return;   // === Phase 1 (fast path) ===\n 3       atomic_increment(mutex);\n 4       while (1) {\n 5           if (atomic_bit_test_set(mutex, 31) == 0) {     //     Phase 1 재시도\n 6               atomic_decrement(mutex);\n 7               return;\n 8           }\n 9           v = *mutex;\n10           if (v >= 0) continue;\n11           futex_wait(mutex, v);                          // === Phase 2 (sleep) ===\n12       }\n13   }\n<\/pre>\n\n* '''2번 줄''' — 경쟁이 없으면 '''여기서 끝'''. 시스템 콜 0회. 이것이 \"fast userspace mutex\"의 fast다.\n* '''11번 줄''' — 여기까지 왔다는 건 실제로 경쟁 중이라는 뜻. 그제서야 커널로 들어가 잠든다.\n\n`unlock` 쪽도 대칭이다 — '''대기자가 없으면 `futex_wake`조차 부르지 않는다'''(23~24번 줄).\n\n{warn}⭐ 시험에서 묻는다면 코드가 아니라 '''원리'''다: \"'''경쟁이 없을 때는 유저 공간에서 원자 연산만으로 끝내고, 경쟁이 있을 때만 커널에 들어간다.'''\" 이 한 문장이 [[futex]]와 two-phase lock 양쪽의 답이다.{/warn}\n\n{info}'''spin을 얼마나 해야 하나?'''는 정해진 답이 없다. 고정 횟수를 쓰기도 하고, 과거 대기 시간을 관찰해 적응적으로 정하기도 한다. 7강 [[work stealing]]의 임계값처럼 \"'''black art'''\"에 가깝다.{/info}\n\n{quiz}Two-phase lock이 순수 [[spin lock]]이나 순수 sleeping lock보다 나은 이유를 쓰시오.{/quiz}\n{answer}대기 시간이 '''짧을 때는 spin이''', '''길 때는 sleep이''' 유리한데 어느 쪽인지 미리 알 수 없다. two-phase lock은 '''먼저 짧게 spin해 보고(커널 진입 없이 빠르게 획득 시도), 실패하면 잠들어''' 두 전략의 장점만 취한다. 락 경쟁은 실제로 드물기 때문에 대부분의 호출이 Phase 1에서 끝나 시스템 콜 비용이 0이 된다.{/answer}\n\n{quiz}리눅스 [[futex]] 락에서 \"시스템 콜이 한 번도 일어나지 않는\" 경우는 언제인가?{/quiz}\n{answer}'''락 경쟁이 없을 때'''(uncontended). `lock()`은 2번 줄의 `atomic_bit_test_set`만으로 획득하고 리턴하며, `unlock()`도 대기자 수가 0이면 `futex_wake` 없이 리턴한다. 유저 공간의 [[atomic]] 연산만으로 완결된다.{/answer}\n\n== 관련 문서 ==\n* [[futex]] · [[락]] · [[spin lock]] · [[queue 락]] · [[park와 unpark]]\n* [[락 평가 기준]] · [[atomic]] · [[컨텍스트 스위치]] · [[시스템 콜]]"
 },
 "guard": {
  "title": "guard (락을 만들기 위한 락)",
  "category": [
   "9강 Lock",
   "용어"
  ],
  "body": "'''`guard`'''는 [[queue 락]] 안에 등장하는 '''보조 [[spin lock]]'''이다. 슬라이드 주석이 역할을 정확히 말해 준다:\n\n{def}\"'''`m->guard` prevents the function `lock` from being executed by multiple threads simultaneously.'''\" (p.34)\n\"`m->guard` is used as a '''spin-lock around the flag and queue'''. But, the time spent spinning is '''quite limited (just a few instructions)'''.\" (p.35){/def}\n\n즉 '''\"락을 만들기 위한 락\"'''이다.\n\n== 왜 필요한가 ==\n\n[[queue 락]]의 `lock()`은 한 번에 여러 단계를 밟는다:\n\n<pre class=\"c\">\nif (m->flag == 0) {              // (1) flag를 읽고\n    m->flag = 1;                 // (2) flag를 쓰고\n    ...\n} else {\n    queue_add(m->q, gettid());   // (3) 큐를 수정하고\n    ...\n}\n<\/pre>\n\n이 여러 단계 자체가 '''read-modify-write'''라서, 보호하지 않으면 [[flag 락]]과 똑같은 [[race condition]]이 생긴다. 그래서 '''락 내부 자료구조를 보호하는 더 작은 락'''이 필요하다.\n\n{|\n! 이름 || 보호 대상 || 어떻게 기다리나 || 대기 시간\n|-\n| '''`flag`''' || 사용자의 [[critical section]] (길 수 있다) || '''[[park와 unpark|park()]]''' — 잠든다 || 길다\n|-\n| '''`guard`''' || `flag`와 `q` (락 내부 구조) || '''[[spin lock|spin]]''' — [[test-and-set]]으로 돈다 || '''몇 명령어'''\n|}\n\n<pre class=\"c\">\nvoid lock(lock_t *m) {\n    while (TestAndSet(&m->guard, 1) == 1)\n        ;                            // guard 획득 — 여기만 spin\n    if (m->flag == 0) { ... }        // <-- guard로 보호되는 짧은 구간\n    else { ... }\n}                                    // guard는 나가기 전에 반드시 0으로\n\nvoid unlock(lock_t *m) {\n    while (TestAndSet(&m->guard, 1) == 1)\n        ;\n    if (queue_empty(m->q)) m->flag = 0;\n    else unpark(queue_remove(m->q));\n    m->guard = 0;\n}\n<\/pre>\n\n{warn}⭐ '''\"spin이 완전히 사라진 게 아니다\"'''가 p.35 Limitations의 1번이다. 다만 spin하는 구간이 '''사용자의 critical section 전체'''에서 '''몇 개의 명령어'''로 줄었다. critical section이 1시간짜리여도 guard 구간은 여전히 몇 나노초다 — '''이 축소가 핵심'''이다.{/warn}\n\n{analogy}🎭 `guard` = '''접수 창구'''다.\n진료(`flag`가 보호하는 [[critical section]])는 오래 걸리니 '''대기실 의자에 앉아 자면서'''(park) 기다린다. 하지만 '''접수하는 행위 자체'''도 한 번에 한 사람만 해야 한다. 접수는 '''몇 초'''면 끝나니 그 앞에는 그냥 '''서서 기다린다'''(spin).\n\"오래 걸리는 것은 앉아서, 짧은 것은 서서\" — 이 분업이 queue 락의 설계다.{/analogy}\n\n== guard를 잘못 쓰면 ==\n\n{warn}🔥 '''guard를 쥔 채 [[park와 unpark|park()]]하면 데드락이다.''' 잠든 스레드가 guard를 놓지 않으므로 `unlock()`이 23번 줄 `while (TestAndSet(&m->guard, 1) == 1)`에서 영원히 spin한다. 아무도 못 깨운다.\n그래서 코드는 반드시 '''`m->guard = 0;` → `park();`''' 순서다.\n\n🔥 그런데 바로 그 순서 때문에 '''guard를 놓은 뒤 park하기 전'''의 틈이 생기고, 이것이 '''wakeup/waiting race'''(p.36)다. → [[setpark]], [[futex]]가 이 틈을 메운다.{/warn}\n\n<pre class=\"ascii\">\n   queue_add(q, tid);\n   m->guard = 0;      <-- 여기서 다른 스레드가 unlock -> unpark 가능\n   ~~~~~~~~~~~~~~~ 위험 구간 ~~~~~~~~~~~~~~~\n   park();            <-- 너무 늦게 도착하면 영원히 잠듦\n<\/pre>\n\n{exam}🎯 '''\"guard와 flag의 차이를 설명하시오\"'''는 9강에서 가장 나오기 쉬운 서술형 중 하나다. 답의 세 축: ① '''보호 대상'''(사용자 critical section vs 락 내부 구조) ② '''대기 방식'''(park vs spin) ③ '''지속 시간'''(길다 vs 몇 명령어).{/exam}\n\n[[sim:queue_lock]]\n\n{quiz}[[queue 락]]에서 `guard`를 [[park와 unpark|park]] 방식이 아니라 [[spin lock|spin]]으로 잡는 이유는?{/quiz}\n{answer}guard가 보호하는 구간이 '''몇 개의 명령어'''로 극히 짧기 때문이다. 그렇게 짧은 대기에 잠들고 깨우는 [[컨텍스트 스위치]] 비용을 치르면 배보다 배꼽이 크다. 또한 '''guard는 \"잠들기 위한 준비\"를 보호하는 락'''이므로, 그 자체가 다시 park를 쓰면 순환 문제가 생긴다.{/answer}\n\n{quiz}`m->guard = 0;`을 `park();` 뒤에 놓으면 어떤 일이 생기는가?{/quiz}\n{answer}'''데드락'''이 된다. 스레드가 guard를 쥔 채 잠들어 버리므로, 락을 놓으려는 스레드가 `unlock()`의 guard 획득 루프에서 '''영원히 spin'''하게 되고 아무도 잠든 스레드를 깨우지 못한다.{/answer}\n\n== 관련 문서 ==\n* [[queue 락]] · [[park와 unpark]] · [[setpark]] · [[futex]]\n* [[spin lock]] · [[test-and-set]] · [[락]] · [[critical section]]\n* [[race condition]] · [[자주 틀리는 함정 모음]]"
 },
 "priority inversion": {
  "title": "Priority Inversion (우선순위 역전)",
  "category": [
   "9강 Lock",
   "보충"
  ],
  "body": "{warn}⚠️ '''이 문서는 보충이다.''' 9강 슬라이드에 독립된 절로는 없고, p.41 \"Park/unpark vs Futex\"에 '''\"Fair wakeup ('''priority inheritance''')\"'''이라는 괄호 한 줄로만 등장한다. 그 한 줄을 이해하기 위한 배경 정리다. 시험 우선순위는 낮지만, \"왜 커널이 대기 큐를 관리하나\"의 답으로 쓰이므로 알아 두면 좋다.{/warn}\n\n== 무엇인가 ==\n\n{def}'''Priority inversion''' — 우선순위가 '''높은''' 스레드가, 우선순위가 '''낮은''' 스레드 때문에 기다리게 되는 현상. 낮은 우선순위 스레드가 [[락]]을 쥐고 있고 높은 우선순위 스레드가 그 락을 기다릴 때 생긴다.{/def}\n\n<pre class=\"ascii\">\n 우선순위:  H (높음) > M (중간) > L (낮음)\n\n 1. L 이 락을 획득하고 critical section 실행 중\n 2. H 가 깨어나 L 을 선점 -> 같은 락을 요청 -> L 이 놓을 때까지 대기\n 3. M 이 깨어나 L 을 선점 (M 은 락과 무관!)\n       -> L 은 CPU를 못 받아 락을 놓지 못하고\n       -> H 는 M 보다 우선순위가 높은데도 M 이 끝날 때까지 기다린다\n\n    결과: H 가 M 에게 밀렸다 = 우선순위가 \"역전\"되었다\n<\/pre>\n\n{analogy}🎭 '''병원 응급실'''이다. 중환자(H)가 왔는데, 경상 환자(L)가 유일한 CT실(락)을 쓰고 있다. 여기까지는 어쩔 수 없다. 그런데 그 사이 '''감기 환자(M)'''가 와서 \"경상 환자보다는 내가 급하다\"며 순서를 가져가 버리면, 경상 환자는 CT실에서 나오지도 못하고 '''중환자는 감기 환자 뒤로 밀린다'''. 시스템 전체의 우선순위 개념이 무너진 것이다.{/analogy}\n\n{info}'''실제 사고 사례''': 1997년 화성 탐사선 '''Mars Pathfinder'''가 착륙 후 반복적으로 리셋된 원인이 priority inversion이었다. 지구에서 원격으로 priority inheritance를 켜서 해결했다.{/info}\n\n== 해결: priority inheritance ==\n\n{def}'''Priority inheritance''' — 높은 우선순위 스레드가 어떤 락을 기다리게 되면, 그 락을 '''쥐고 있는 스레드의 우선순위를 일시적으로 끌어올린다'''. 락을 놓으면 원래대로 되돌린다.{/def}\n\n위 시나리오에서 L의 우선순위가 H만큼 올라가면 M이 L을 선점할 수 없고, L이 빨리 락을 놓아 H가 진행한다.\n\n== 왜 커널이 대기 큐를 알아야 하나 (p.41) ==\n\n{|\n! || '''[[park와 unpark|park/unpark]]''' (Solaris) || '''[[futex]]''' (Linux)\n|-\n| 커널이 유지하는 것 || minimal state || '''대기 queue를 커널이 직접 관리'''\n|-\n| 그래서 가능한 것 || || '''Fair wakeup (priority inheritance)''' · '''Robust mutexes (owner-death detection)'''\n|}\n\n{warn}⭐ '''논리 사슬''': priority inheritance를 하려면 커널이 \"'''누가 이 락을 기다리고 있고, 누가 쥐고 있는가'''\"를 알아야 한다. 대기 큐가 유저 공간에만 있으면 커널은 아무것도 모르니 우선순위를 올려 줄 수 없다. 그래서 [[futex]]는 '''락 상태는 유저가 소유하되 대기 큐는 커널이 관리'''하는 분업을 택했다.\n같은 이유로 '''robust mutex'''(락을 쥔 스레드가 죽었을 때 감지)도 커널이 소유자를 알아야 가능하다.{/warn}\n\n리눅스에는 이를 위한 '''PI-futex'''(priority-inheritance futex)가 따로 있고, `pthread_mutexattr_setprotocol(..., PTHREAD_PRIO_INHERIT)`로 활성화한다.\n\n== 이 강의의 다른 개념과 구분 ==\n\n{|\n! 현상 || 무엇 || 어디서\n|-\n| '''Starvation''' || 특정 스레드가 '''영영 락을 못 얻음''' || [[spin lock]], [[yield 락]] (fairness No)\n|-\n| '''Priority inversion''' || 높은 우선순위가 '''낮은 쪽에 밀림''' || 우선순위 스케줄러 + 락\n|-\n| '''Deadlock''' || 서로가 서로를 기다려 '''아무도 진행 못 함''' || 락 여러 개를 엇갈려 잡을 때\n|-\n| '''Livelock''' || 계속 시도하는데 '''아무도 진행 못 함''' (CPU는 쓴다) || trylock 재시도 루프\n|}\n\n{exam}🎯 2025F 중간고사는 '''deadlock 4조건'''(Problem 1-c: mutual exclusion / hold and wait / no preemption / circular wait — 답은 \"Busy wait이 아닌 것\")과 '''livelock'''(Problem 2-g)을 물었다. priority inversion은 안 나왔지만, 같은 \"락 관련 병리 현상\" 묶음이므로 함께 정리해 두면 안전하다. → [[2025F 중간고사 족보]]{/exam}\n\n{quiz}Priority inversion이 무엇이고, priority inheritance가 어떻게 해결하는지 쓰시오.{/quiz}\n{answer}'''Priority inversion''' = 낮은 우선순위 스레드 L이 [[락]]을 쥔 상태에서, 높은 우선순위 H가 그 락을 기다리는 동안 '''중간 우선순위 M이 L을 선점'''해 버려, 결과적으로 H가 M보다 뒤로 밀리는 현상이다.\n'''Priority inheritance''' = H가 기다리게 되면 락을 쥔 L의 우선순위를 '''일시적으로 H 수준까지 올려''' M이 L을 선점하지 못하게 하고, L이 락을 놓으면 원래 우선순위로 되돌린다.{/answer}\n\n{quiz}[[futex]]에서 커널이 대기 큐를 직접 관리하는 이유 두 가지를 슬라이드 용어로 쓰시오.{/quiz}\n{answer}'''① Fair wakeup (priority inheritance)''' — 누가 기다리는지 커널이 알아야 우선순위를 상속시킬 수 있다. '''② Robust mutexes (owner-death detection)''' — 락 소유자가 죽은 것을 커널이 감지해 정리할 수 있다. (p.41){/answer}\n\n== 관련 문서 ==\n* [[futex]] · [[park와 unpark]] · [[락]] · [[락 평가 기준]]\n* [[스케줄링]] · [[선점]] · [[fairness]]\n* [[2025F 중간고사 족보]]"
 },

  ],
  "body": "'''과제 1 \"Alarm\"'''은 [[xv6]]에 '''주기적으로 유저 함수를 호출해 주는''' 시스템 콜 두 개 — [[sigalarm]]과 [[sigreturn]] — 을 추가하는 과제다. 코드는 스무 줄 남짓인데, 이 스무 줄을 쓰려면 [[제한적 직접 실행|4강 LDE]]의 [[트랩]] 왕복 경로를 '''전부''' 이해해야 한다. 그래서 '''2026-09-23 퀴즈 1이 100점 전부를 이 과제에서 냈다'''([[퀴즈1 복기]] 참고).\n\n{def}\n\"You'll be implementing a primitive form of '''user-level interrupt/fault handlers'''.\"\n과제 PDF의 자기소개. 이건 단순한 타이머 기능이 아니라 '''유저 레벨 인터럽트 핸들러'''의 원시 형태다 — 유닉스의 `signal()`/`SIGALRM`이 하는 일을 손으로 만드는 것.\n{/def}\n\n{analogy}\n알람의 핵심 트릭을 한 문장으로 하면 '''\"책갈피를 몰래 다른 페이지로 옮겨 놓기\"'''다.\n* [[trapframe]] = 커널이 유저 코드 중간에 끼워 둔 '''책갈피''' (어디서 멈췄고 손에 뭘 들고 있었는지 전부 적혀 있음).\n* [[epc]] = 책갈피에 적힌 '''\"여기부터 다시 읽으세요\"''' 페이지 번호.\n* 커널은 이 페이지 번호를 '''핸들러 페이지로 바꿔 쓴다''' → 유저는 눈을 떴을 때 핸들러부터 읽게 된다.\n* 그런데 원래 페이지 번호를 잃어버리면 안 되므로, 바꾸기 '''전에 책갈피를 통째로 복사'''해 둔다 → 그게 [[alarm_saved]].\n* [[sigreturn]] = \"복사본을 다시 꽂아 주세요\"라고 커널에 부탁하는 것.\n{/analogy}\n\n[[img:A1-2.png|Assignment 1 PDF p.2 — Problem 정의와 alarmtest 기대 출력|medium]]\n\n== 1. 과제 사양 ==\n\n{| class=\"table\"\n! 항목 || 내용\n|-\n| 마감 || '''2026-10-10 (금) 23:00'''\n|-\n| TA || Myunggyu Park (myunggyu@dgist.ac.kr)\n|-\n| 환경 || Docker + `coruslab-src/xv6-lab` 저장소의 '''`traps` 브랜치'''\n|-\n| 정답 기준 || `alarmtest` '''전부 통과''' + `usertests -q` '''ALL TESTS PASSED'''\n|-\n| 제출 || 보고서 4–6쪽 + `make zipball` 결과를 `{학번}_{이름}.zip`으로 개명\n|}\n\n=== sigalarm / sigreturn의 의미론 ===\n\n<pre class=\"c\">\nint sigalarm(int ticks, void (*handler)());\nint sigreturn(void);\n<\/pre>\n\n* `sigalarm(n, fn)` — 이 프로세스가 '''CPU 시간을 n tick 쓸 때마다''' 커널이 유저 함수 `fn`을 부르게 한다.\n* `fn`이 끝나면 프로세스는 '''원래 멈췄던 자리에서''' 계속 실행되어야 한다.\n* `sigalarm(0, 0)` — 주기적 알람 호출을 '''중지'''한다.\n* tick은 xv6에서 꽤 임의적인 시간 단위로, '''하드웨어 타이머가 인터럽트를 얼마나 자주 내느냐'''로 정해진다.\n* 설계상 결정: '''유저 핸들러는 끝날 때 반드시 [[sigreturn]] 시스템 콜을 불러야 한다.'''\n\n{warn}\n'''\"n tick마다\"는 벽시계 시간이 아니라 이 프로세스가 소비한 CPU 시간이다.''' tick을 세는 곳이 '''이 프로세스의 [[usertrap]]'''이기 때문이다. 이 프로세스가 스케줄에서 밀려 자고 있는 동안 흘러간 tick은 세지 않는다. 퀴즈·시험에서 \"wall-clock time마다 호출된다\"는 선지는 거짓.\n{/warn}\n\n== 2. 손댈 파일 — 체크리스트 ==\n\n[[img:A1-5.png|Assignment 1 PDF p.5 — 재진입 금지, a0 복원, 그리고 수정할 소스 목록|medium]]\n\n{| class=\"table\"\n! 순서 || 파일 || 무엇을 || 왜\n|-\n| 1 || `Makefile` || `UPROGS += $U/_alarmtest` || [[alarmtest]]를 유저 프로그램으로 빌드\n|-\n| 2 || `user/user.h` || `sigalarm`/`sigreturn` 프로토타입 || C 컴파일러가 알아야 함\n|-\n| 3 || '''[[usys.pl|`user/usys.pl`]]''' || `entry(\"sigalarm\"); entry(\"sigreturn\");` || `usys.S` 스텁(`li a7, N; ecall; ret`) 생성\n|-\n| 4 || `kernel/syscall.h` || `#define SYS_sigalarm 22` / `SYS_sigreturn 23` || 시스템 콜 '''번호''' 부여\n|-\n| 5 || `kernel/syscall.c` || `extern` 선언 + `syscalls[]` 배열에 등록 || 번호 → 함수 디스패치\n|-\n| 6 || '''[[struct proc|`kernel/proc.h`]]''' || 알람 상태 필드 5개 추가 || 프로세스마다 따로 기억해야 함\n|-\n| 7 || `kernel/proc.c` (`allocproc`) || 새 필드 0으로 초기화 || 알람은 꺼진 상태로 시작\n|-\n| 8 || `kernel/sysproc.c` || `sys_sigalarm`, `sys_sigreturn` 구현 || 실제 동작\n|-\n| 9 || '''[[usertrap|`kernel/trap.c`]]''' || `which_dev == 2` 분기에 알람 코드 || 알람이 터지는 자리\n|}\n\n{tip}\n1~5번은 '''[[시스템 콜 추가 절차]]'''(3강 p.30–34)와 '''글자 그대로 똑같다'''. 과제 PDF도 \"Refer 3-From_Program_to_Process\"라고 못 박았다. 6~9번만 이 과제 고유의 내용이다. 전체 경로 그림은 [[xv6 시스템 콜 경로]] 참고.\n{/tip}\n\n== 3. struct proc에 추가하는 것 ==\n\n퀴즈 1이 쓴 이름 기준(가장 보편적인 작명):\n\n<pre class=\"c\">\nstruct proc {\n  ...\n  struct trapframe *trapframe;   // (원래 있음) 현재 트랩의 유저 레지스터 — 페이지 1장\n  ...\n  // ── Assignment 1 추가 ──\n  int    alarm_interval;         // n tick. 0 = 알람 꺼짐            (sigalarm이 설정)\n  uint64 alarm_handler;          // 유저 핸들러 주소 (0일 수도 있음!) (sigalarm이 설정)\n  int    alarm_elapsed;          // 마지막 호출 이후 흐른 tick 수     (usertrap이 ++)\n  int    alarm_active;           // 1 = 핸들러 실행 중 → 재진입 금지  (usertrap이 set, sigreturn이 clear)\n  struct trapframe alarm_saved;  // ★ 끊긴 문맥 통째 백업 (31 레지스터 + epc) — 슬롯은 \"하나\"\n};\n<\/pre>\n\n{| class=\"table\"\n! 키 || 타입 || 누가 쓰나 || 한 줄 설명\n|-\n| [[alarm_interval]] || `int` || `sys_sigalarm`이 설정 || 주기 n. '''0이면 알람 자체가 꺼진 것''' — 분기의 판단 기준\n|-\n| [[alarm_handler]] || `uint64` || `sys_sigalarm`이 설정 || 유저 핸들러 '''주소'''. `epc`에 대입될 값\n|-\n| [[alarm_elapsed]] || `int` || [[usertrap]]이 `++` || 마지막 호출 이후 tick. `>= interval`이면 발사\n|-\n| [[alarm_active]] || `int` || `usertrap`이 1, `sys_sigreturn`이 0 || '''[[재진입 금지]]''' 플래그\n|-\n| [[alarm_saved]] || `struct trapframe` || `usertrap`이 복사, `sys_sigreturn`이 되돌림 || '''끊긴 문맥의 전체 사본'''\n|}\n\n<pre class=\"ascii\">\n        p->trapframe (페이지 1장)            p->alarm_saved (proc 칸 안에 내장)\n        ┌────────────────┐                 ┌────────────────┐\n        │ kernel_satp …  │                 │                │\n        │ epc  = 끊긴 PC │ ──  복사  ──►   │ epc  = 끊긴 PC │   알람이 터질 때\n        │ ra sp gp tp    │                 │ ra sp gp tp    │\n        │ a0 a1 … a7     │ ◄──  복원  ──   │ a0 a1 … a7     │   sigreturn 때\n        │ t0 … t6, s0…s11│                 │ t0 … t6, s0…s11│\n        └────────────────┘                 └────────────────┘\n          \"지금 트랩의 문맥\"                  \"알람 직전의 문맥\"  ← 슬롯 하나뿐!\n<\/pre>\n\n{warn}\n'''`alarm_handler`가 0인 것은 정상이다.''' 과제 PDF: \"the address of the user's alarm function might be 0 (e.g., in user/alarmtest.asm, `periodic` is at address 0)\". 그래서 '''\"알람이 켜졌나\"는 `handler != 0`이 아니라 `alarm_interval > 0`으로 판단'''해야 한다. `handler`로 판단하면 test0부터 실패한다.\n{/warn}\n\n== 4. sys_sigalarm — 그냥 기록만 한다 ==\n\n<pre class=\"c\">\n// sigalarm(ticks, handler): 이 프로세스가 CPU를 ticks tick 쓸 때마다 handler 호출.\n// sigalarm(0, 0)이면 알람 해제.\nuint64\nsys_sigalarm(void)\n{\n  int n;\n  uint64 handler;\n  struct proc *p = myproc();\n\n  argint(0, &n);          // 1\n  argaddr(1, &handler);   // 2\n  if(n < 0)\n    return -1;\n\n  p->alarm_interval = n;  // 3\n  p->alarm_handler  = handler;\n  p->alarm_elapsed  = 0;  // 4\n  return 0;\n}\n<\/pre>\n\n* 1–2행 — 인자는 [[trapframe]]의 `a0`, `a1`에 들어 있다. `argint`/`argaddr`이 `p->trapframe->a0`을 읽어 준다. 그래서 '''인자를 꺼내는 데도 trapframe이 필요'''하다.\n* 3행 — [[myproc]]이 돌려준 '''지금 이 CPU에서 도는 프로세스'''의 칸에만 기록된다. 알람 설정은 프로세스별.\n* 4행 — 카운터를 0으로 리셋. `sigalarm(0, 0)`이면 `alarm_interval = 0`이 되어 [[usertrap]]의 분기 조건 `alarm_interval > 0`이 '''거짓'''이 되고, 그 순간부터 알람이 완전히 멈춘다.\n\n{tip}\n`sys_sigalarm`은 '''아무 일도 하지 않는다''' — 그냥 세 값을 기록할 뿐이다. 실제 마법은 전부 [[usertrap]]과 `sys_sigreturn`에서 일어난다. \"sigalarm이 타이머를 건다\"는 서술은 틀렸다. 타이머는 이미 '''부팅 때 OS가''' 걸어 놨다([[타이머 인터럽트]]).\n{/tip}\n\n== 5. usertrap의 타이머 분기 — 한 줄씩 ⭐⭐⭐ ==\n\n이 분기가 '''퀴즈 1의 2번 문제로 그대로 출제'''됐다.\n\n<pre class=\"c\">\nif (which_dev == 2) {                              // 1  타이머 인터럽트인가?\n\n    if (p->alarm_interval > 0 && !p->alarm_active) {   // 2  켜져 있고, 핸들러 실행 중이 아니면\n        p->alarm_elapsed++;                            // 3  이 프로세스가 소비한 tick 하나\n        if (p->alarm_elapsed >= p->alarm_interval) {   // 4  주기 도달?\n\n            p->alarm_saved  = *p->trapframe;           // 5  ★ 문맥 통째 백업\n            p->alarm_active = 1;                       // 6  재진입 잠금\n            p->alarm_elapsed = 0;                      // 7  re-arm (다음 주기 시작)\n\n            p->trapframe->epc = (uint64)p->alarm_handler;  // 8  ★★ 복귀 주소 바꿔치기\n        }\n    }\n    yield();                                       // 9  CPU 양보 (원래 있던 코드)\n}\n<\/pre>\n\n{| class=\"table\"\n! 행 || 코드 || 왜 이렇게 쓰나\n|-\n| 1 || `which_dev == 2` || `devintr()`가 '''2'''를 돌려주면 타이머라는 xv6의 약속. '''알람은 타이머일 때만''' 센다. [[which_dev]] 참고\n|-\n| 2 || `alarm_interval > 0` || '''켜짐 판단은 interval로'''. `handler != 0`으로 하면 handler 주소가 0인 alarmtest에서 실패\n|-\n| 2 || `!p->alarm_active` || '''[[재진입 금지]]'''. 핸들러가 도는 중이면 '''tick 자체를 세지 않는다''' (test2)\n|-\n| 3 || `alarm_elapsed++` || 이 프로세스의 usertrap에서만 세므로 = '''소비한 CPU 시간'''\n|-\n| 4 || `>=` (`==` 아님) || 방어적. 어떤 이유로 건너뛰어도 놓치지 않게\n|-\n| 5 || `p->alarm_saved = *p->trapframe;` || 구조체 '''값 대입'''(= `memmove`와 동치). 포인터 복사가 아니다 — `p->alarm_saved = p->trapframe`이면 컴파일 에러이자 논리도 틀림\n|-\n| 6 || `alarm_active = 1` || [[sigreturn]]이 풀어 줄 때까지 잠금\n|-\n| 7 || `alarm_elapsed = 0` || '''re-arm'''. 이게 없으면 한 번만 울리고 만다\n|-\n| 8 || `trapframe->epc = handler` || '''이 한 줄이 과제의 전부'''. [[usertrapret]]이 이 값을 [[sepc]]에 쓰고, [[sret]]이 거기로 점프한다\n|-\n| 9 || `yield()` || 원래부터 있던 코드. 순서상 알람 코드가 '''`yield()` 앞'''에 와야 한다 (yield는 돌아오지 않을 수 있음)\n|}\n\n=== epc를 바꾸면 왜 핸들러로 가는가 — 3단계 체인 ===\n\n{exam}\n'''퀴즈1 모의 A18에서 틀린 문항.''' 과제 PDF p.4의 힌트 문장이 곧 문제다 — \"When a trap on the RISC-V returns to user space, '''what determines the instruction address at which user-space code resumes execution?'''\"\n# 트랩 진입: [[usertrap]]이 `p->trapframe->epc = r_sepc()` — 하드웨어가 [[sepc]]에 넣어 둔 '''끊긴 PC를 [[trapframe]]에 대피'''시킨다.\n# 트랩 복귀: [[usertrapret]]이 `w_sepc(p->trapframe->epc)` — '''trapframe의 [[epc]]를 [[sepc]]에 되돌려''' 쓴다.\n# '''[[sret]]'''이 '''`sepc`가 가리키는 주소로''' 점프하며 user mode로 내려간다.\n외울 문장: '''\"sret은 sepc로 간다. sepc는 trapframe->epc에서 온다. 그래서 우리는 epc를 바꾼다.\"'''\n{/exam}\n\n<pre class=\"ascii\">\n      USER MODE                          ‖                    KERNEL MODE\n  유저 코드 실행 중 (PC = 0x1234)          ‖\n        │  ① 타이머 인터럽트              ‖\n        ▼                                ‖\n  [하드웨어] sepc ← 0x1234                ‖   \"끊긴 PC를 sepc에 넣고\"\n            mode ← kernel                 ‖\n            PC   ← stvec (trampoline)     ‖\n        ─────────────────────────────────╫──────────────────────────────►\n                                         ‖   ② uservec (trampoline.S)\n                                         ‖      유저 범용 레지스터 31개 → p->trapframe\n                                         ‖      커널 스택 / 커널 페이지 테이블로 전환\n                                         ‖             ▼\n                                         ‖   ③ usertrap()  (trap.c)\n                                         ‖      p->trapframe->epc = r_sepc()   ★ 대피\n                                         ‖      which_dev==2 → ★ 알람 코드 → yield()\n                                         ‖             ▼\n                                         ‖   ④ usertrapret()\n                                         ‖      w_sepc(p->trapframe->epc)      ★ 되돌림\n                                         ‖             ▼\n                                         ‖   ⑤ userret (trampoline.S)\n                                         ‖      p->trapframe → 레지스터 31개 복원\n        ◄────────────────────────────────╫──   sret  →  PC ← sepc\n        │                                ‖\n  epc를 안 바꿨으면 0x1234 부터,           ‖\n  바꿨으면 handler 부터 실행               ‖\n<\/pre>\n\n=== 타임라인 (sigalarm(2, periodic)) ===\n\n<pre class=\"ascii\">\ntick:      1        2         3        4         5        6\n           │        │         │        │         │        │\n유저코드 ───┴────────┤         │        │         │        │\n                    ▼ epc=handler                ▼ epc=handler\n                    periodic() ─ sigreturn ─┐    periodic() ─ sigreturn ─┐\n                                            ▼                            ▼\n유저코드(끊긴 곳부터) ───────────────────────┴────────────────────────────┴────\n  alarm_elapsed: 0→1     1→2 (>=2 발사, 0으로 re-arm)   0→1    1→2 (발사) …\n<\/pre>\n\n[[sim:alarm_trace]]\n\n== 6. sys_sigreturn — 되돌리고, a0를 돌려준다 ⭐⭐⭐ ==\n\n=== 왜 핸들러가 그냥 `return`하면 안 되는가 ===\n\n<pre class=\"ascii\">\n   보통 함수 호출                          알람 핸들러\n   ┌──────────────┐                     ┌──────────────┐\n   │ caller       │ call f → ra=복귀주소 │ 끊긴 유저코드 │  ← 아무도 call 하지 않았다\n   │ (스택에 흔적) │ ◄─ ret (ra로 점프)   │ (PC 0x1234)  │\n   └──────────────┘                     └──────────────┘\n                                               ╳  커널이 epc만 바꿔서 sret으로 \"떨어뜨림\"\n                                               │  → ra 에는 0x1234 가 없다\n                                               │  → 0x1234 와 레지스터 31개는 커널의 alarm_saved 에만 있다\n                                               ▼\n                                        유저 코드는 alarm_saved 를 읽을 수 없다 (커널 메모리)\n                                        ⇒ 커널로 다시 들어가야 한다 = 시스템 콜 sigreturn()\n<\/pre>\n\n=== 구현 ===\n\n<pre class=\"c\">\nuint64\nsys_sigreturn(void)\n{\n  struct proc *p = myproc();\n\n  if(!p->alarm_active)             // 1  핸들러 밖에서 부르면 거부(선택)\n    return -1;\n  *p->trapframe = p->alarm_saved;  // 2  ★ 31 레지스터 + epc 전부 복원\n  p->alarm_active  = 0;            // 3  잠금 해제\n  p->alarm_elapsed = 0;            // 4  (구현에 따라) 카운터 리셋\n  return p->trapframe->a0;         // 5  ★★ \"저장돼 있던 a0\"를 반환값으로\n}\n<\/pre>\n\n* 2행 — 이 한 줄로 `ra, sp, gp, tp, t0~t6, s0~s11, a0~a7`와 '''[[epc]]'''가 전부 알람 직전 값으로 돌아간다. 그래서 [[usertrapret]]이 `w_sepc`할 때 '''0x1234'''가 들어가고, [[sret]]은 끊긴 바로 그 명령어로 복귀한다.\n* 3행 — [[alarm_active]]를 0으로. 이게 빠지면 '''알람이 영원히 한 번만''' 울린다 (test0은 통과, test1부터 실패).\n* 5행 — '''[[a0 복원]]'''. 이유는 아래.\n\n=== a0 문제 — 퀴즈 4번 그 자체 ⭐⭐⭐ ===\n\n{exam}\n'''퀴즈1 모의 A19에서 틀렸고, 실제 퀴즈 1의 4번(20점)으로 그대로 나왔다.''' 과제 PDF 마지막 힌트: \"'''Make sure to restore [[a0]].''' sigreturn is a system call, and its return value is stored in a0.\"\n{/exam}\n\n문제의 근원은 [[xv6]]의 `syscall()`이다.\n\n<pre class=\"c\">\n// kernel/syscall.c\nvoid\nsyscall(void)\n{\n  int num = p->trapframe->a7;                  // 1  시스콜 번호는 a7\n  if(num > 0 && num < NELEM(syscalls) && syscalls[num]) {\n    p->trapframe->a0 = syscalls[num]();        // 2  ★ 반환값을 a0에 \"덮어쓴다\"\n  } else {\n    ...\n  }\n}\n<\/pre>\n\n2행이 범인이다. 순서를 보자 — '''저장된 a0가 0x2a(=42)였다고 하자:'''\n\n<pre class=\"ascii\">\n   ① sys_sigreturn 안에서 복원:   trapframe->a0 = 0x2a    ✓ (제대로 복원됨)\n   ② syscall()이 이어서 실행:     trapframe->a0 = sys_sigreturn의 반환값\n         return 0;        →      a0 = 0     ✗  끊긴 코드가 42를 쓰려던 참이었다면 test1 실패\n         return trapframe->a0; →  a0 = 0x2a  ✓  덮어써도 같은 값이라 무해\n<\/pre>\n\n{warn}\n'''\"a0는 복원 대상이 아니다\"는 틀렸다.''' `a0`는 '''범용 레지스터'''(인자 1번 겸 반환값)라서 끊긴 유저 코드가 한창 계산 중간값으로 쓰고 있을 수 있다. 복원해야 하는 건 과제 PDF 표현 그대로 '''\"many\"''' — 전부다.\n{/warn}\n\n{tip}\n`return p->alarm_saved.a0;`로 써도 동치다(2행에서 이미 복사했으므로). 단 '''2행보다 앞에서''' 읽으면 안 된다.\n{/tip}\n\n== 7. 재진입 금지 — 슬롯이 하나뿐이라서 ==\n\n[[img:A1-4.png|Assignment 1 PDF p.4 — test1/2/3의 요구사항. 레지스터 복원과 re-arm|medium]]\n\n{exam}\n'''퀴즈1 모의 A20에서 틀린 문항.''' 과제 PDF: \"'''Prevent re-entrant calls to the handler''' — if a handler hasn't returned yet, the kernel shouldn't call it again. '''test2 tests this.'''\"\n{/exam}\n\n<pre class=\"ascii\">\n   슬롯(alarm_saved)이 하나뿐인 게 핵심이다.\n\n   정상 (alarm_active 가드 있음):           재진입을 허용하면:\n   alarm_saved ← [유저코드 문맥 0x1234]      alarm_saved ← [유저코드 문맥 0x1234]\n   periodic() 실행 중 …                      periodic() 실행 중 … 또 tick!\n   sigreturn → 0x1234 복귀  ✓                alarm_saved ← [periodic 중간 문맥]\n                                                   ↑ 0x1234 문맥이 덮여서 영영 사라짐\n                                             periodic() 다시 실행 (중첩)\n                                             sigreturn → periodic 중간으로 복귀\n                                             sigreturn → ??? 원래 코드로 갈 길이 없음  ✗\n   방어: alarm_active == 1 이면 usertrap에서 tick 자체를 세지 않는다.\n<\/pre>\n\n{tip}\n가드를 `alarm_elapsed++`'''보다 앞에''' 두느냐 뒤에 두느냐로 의미가 달라진다. `!alarm_active`를 조건에 넣어 '''세는 것 자체를 막으면''', 핸들러가 5 tick을 쓰든 50 tick을 쓰든 '''핸들러 안에서 쓴 시간은 주기에 안 들어간다'''. 퀴즈 5번이 정확히 이 동작을 묻는다(`burn()`이 핸들러 안에서 5 tick 이상 태워도 알람이 다시 안 터지는 이유).\n{/tip}\n\n== 8. sigalarm(0, 0) — 끄기 ==\n\n`sys_sigalarm`이 `alarm_interval = 0`으로 만들면, [[usertrap]]의 조건 `p->alarm_interval > 0`이 거짓이 되어 '''분기 자체를 안 탄다'''. `alarm_elapsed`도 더 이상 늘지 않는다.\n\n{warn}\n핸들러 '''안에서''' `sigalarm(0, 0)`을 부르는 것은 합법이다. 하지만 '''그 뒤에 `sigreturn()`은 반드시 불러야''' 한다 — 알람을 껐다고 해서 [[alarm_active]]가 풀리거나 끊긴 문맥이 복원되지는 않기 때문이다. 퀴즈 5번의 `periodic()`이 `sigalarm(0,0)` 다음에 `sigreturn()`을 부르는 이유.\n{/warn}\n\n== 9. 왜 trapframe이 이미 있는데 따로 복사하나 ⭐⭐⭐ ==\n\n{exam}\n'''실제 퀴즈 1의 3번(a), 10점.''' \"On a timer interrupt, xv6 already saves the user context in `p->trapframe`. Why is a separate copy still needed before starting the alarm handler?\"\n{/exam}\n\n`p->trapframe`은 '''\"지금 이 트랩의 문맥\"'''을 담는 '''하나뿐인''' 슬롯이고, 트랩이 날 때마다 `uservec`(trampoline.S)이 '''덮어쓴다'''. 그런데 핸들러는 '''유저 모드에서 실행'''되므로:\n\n* 핸들러 안에서 [[시스템 콜]]을 부르면(`printf` 하나만 써도 `write` 시스템 콜이다, 그리고 마지막에 반드시 `sigreturn`) → `ecall` → `p->trapframe`이 '''핸들러의 레지스터로 덮인다'''.\n* 핸들러 실행 중에 타이머 인터럽트가 또 나도 → `p->trapframe`이 덮인다.\n* page fault가 나도 마찬가지.\n\n즉 핸들러가 한 발짝만 움직여도 원래 유저 코드의 문맥은 사라진다. 그래서 '''핸들러를 시작하기 전에''', 프로세스별로 안전한 별도 공간([[alarm_saved]])에 '''통째로 복사'''해 둬야 한다.\n\n{analogy}\n`p->trapframe`은 '''책상 위의 \"지금 보고 있는 서류\"''' 자리다. 자리는 하나뿐이고 새 손님이 올 때마다 그 위에 새 서류가 얹힌다. 원래 서류를 지키려면 '''서랍([[alarm_saved]])에 복사본을 넣어야''' 한다. [[sigreturn]]은 \"서랍에서 꺼내 책상에 다시 올려 주세요\"다.\n{/analogy}\n\n한 문장 답안: '''\"핸들러는 유저 모드에서 돌면서 자신의 시스템 콜(최소한 sigreturn)과 트랩으로 `p->trapframe`을 덮어쓰기 때문에, 그 전에 끊긴 문맥을 별도 슬롯에 복사해 두어야 한다.\"'''\n\n== 10. 핸들러가 sigreturn 없이 C return 하면 ==\n\n{exam}\n'''실제 퀴즈 1의 3번(c), 5점.''' \"If the handler uses C `return` without calling `sigreturn()`, where does control go?\"\n{/exam}\n\n정확히 따져 보자. 커널이 핸들러를 시작시킬 때 바꾼 것은 '''[[epc]] 하나뿐'''이다. 나머지 레지스터 31개는 '''끊긴 유저 코드의 값 그대로''' 복원되어 핸들러에 들어간다. 즉 '''`ra`에는 끊긴 코드가 갖고 있던 리턴 주소가 그대로 들어 있다.'''\n\nRISC-V에서 C 함수의 `return`은 `ret` = `jalr x0, 0(ra)`, 즉 '''`ra`로 점프'''다. 따라서:\n\n# 제어는 '''`ra`가 가리키는 곳''' — 즉 '''인터럽트 당한 그 함수가 원래 리턴하려던 주소'''(= 그 함수를 부른 caller의 다음 줄)로 간다.\n# 결국 '''인터럽트 당한 함수의 남은 부분이 통째로 건너뛰어진다''' — 스택 프레임이 어긋나고, 핸들러가 망가뜨린 레지스터도 복원되지 않는다.\n# 게다가 [[alarm_active]]가 '''영원히 1로 남아''' 이후 알람이 다시는 울리지 않는다.\n# 결과: 정의되지 않은 동작 — 실제로는 대개 '''잘못된 주소로 튀어 crash'''하거나 `alarmtest`가 \"test1 failed\"를 찍는다. 과제 PDF도 test0 단계에서 \"it's OK for now if your program '''crashes''' after printing alarm!\"이라고 예고한다.\n\n{warn}\n'''\"ra가 핸들러의 리턴 주소를 담고 있어서 정상 복귀한다\"는 틀렸다.''' 핸들러는 `call` 된 적이 없다. `call`(RISC-V `jal`)만이 `ra`를 쓰는데, 커널은 `jal`이 아니라 [[sret]]으로 '''떨어뜨렸다'''. 그래서 `ra`는 '''남의 값'''이다.\n{/warn}\n\n== 11. alarmtest가 검사하는 것 ==\n\n[[img:A1-3.png|Assignment 1 PDF p.3 — test0 invoke handler와 힌트 목록|medium]]\n\n{| class=\"table\"\n! 테스트 || 배점 || 무엇을 검사하나 || 통과하려면 필요한 것\n|-\n| '''test0''' — invoke handler || 20 || `sigalarm(2, periodic)` 후 \"alarm!\"이 '''한 번이라도''' 찍히나 || `trapframe->epc = handler` (5·8행). 이후 crash해도 OK\n|-\n| '''test1''' — resume interrupted code || 20 || 알람 후 '''원래 명령어로 복귀'''하고 '''레지스터가 온전'''한가 || `alarm_saved` 통째 저장/복원 + '''[[a0 복원]]''' + re-arm\n|-\n| '''test2''' — re-entrancy || 10 || 핸들러가 '''중첩 호출되지 않는가''' || '''[[재진입 금지]]''' ([[alarm_active]] 가드)\n|-\n| '''test3''' || 10 || `sigalarm(0,0)` 후 '''알람이 멈추는가''' || `alarm_interval > 0` 조건\n|-\n| `usertests -q` || 20 || 커널의 '''다른 부분을 망가뜨리지 않았나''' || 알람 코드가 `which_dev == 2` 안에만 있을 것\n|}\n\n기대 출력:\n\n<pre class=\"sh\">\n$ alarmtest\ntest0 start\n........alarm!\ntest0 passed\ntest1 start\n...alarm!\n..alarm!\n...alarm!\n..alarm!\ntest1 passed\ntest2 start\n..............alarm!\ntest2 passed\ntest3 start\ntest3 passed\n$ usertests -q\n...\nALL TESTS PASSED\n<\/pre>\n\n{tip}\n점(`.`)의 개수는 PDF 예시와 달라도 정상이다 — 호스트가 빠르면 tick 사이에 루프가 더 많이 돌아 점이 더 찍힌다. '''`testN passed` 줄만 맞으면 된다.'''\n{/tip}\n\n== 12. 실제 제출 구현 (git diff) ==\n\n실제로 만점(80/80)을 받은 구현의 핵심 hunk 두 개. 필드 이름만 다를 뿐 위에서 설명한 구조와 같다.\n\n<pre class=\"c\">\ndiff --git a/kernel/trap.c b/kernel/trap.c\n@@ usertrap()\n   // give up the CPU if this is a timer interrupt.\n-  if(which_dev == 2)\n+  if(which_dev == 2){\n+    // sigalarm: only count while an alarm is armed and no handler is\n+    // already running (prevents re-entrant calls; alarmtest test2).\n+    if(p->alarm_ticks > 0 && !p->alarm_inflight){\n+      if(--p->alarm_left <= 0){\n+        p->alarm_left = p->alarm_ticks;          // re-arm\n+        p->alarm_inflight = 1;\n+        memmove(&p->alarm_tf, p->trapframe, sizeof(struct trapframe));\n+        // usertrapret() writes trapframe->epc into sepc, so sret lands\n+        // in the handler instead of the interrupted instruction.\n+        p->trapframe->epc = p->alarm_handler;\n+      }\n+    }\n     yield();\n+  }\n<\/pre>\n\n<pre class=\"c\">\ndiff --git a/kernel/sysproc.c b/kernel/sysproc.c\n+// sigreturn(): called by the handler when it is done. Restore the whole\n+// user register set saved at the moment of the timer interrupt, so the\n+// process resumes exactly where it was. The syscall return value lands\n+// in a0, so return the *saved* a0 to keep it intact.\n+uint64\n+sys_sigreturn(void)\n+{\n+  struct proc *p = myproc();\n+\n+  if(!p->alarm_inflight)\n+    return -1;\n+  memmove(p->trapframe, &p->alarm_tf, sizeof(struct trapframe));\n+  p->alarm_inflight = 0;\n+  return p->trapframe->a0;\n+}\n<\/pre>\n\n{warn}\n'''이름 대응표 — 퀴즈는 왼쪽 이름을 썼다.''' 시험에서는 퀴즈 표기를 따를 것.\n{| class=\"table\"\n! 퀴즈 1 표기 (표준) || 실제 제출 구현 || 차이\n|-\n| `alarm_interval` || `alarm_ticks` || 같음\n|-\n| `alarm_handler` || `alarm_handler` || 같음\n|-\n| `alarm_elapsed` (0에서 '''올라감''', `>= interval`) || `alarm_left` (interval에서 '''내려감''', `<= 0`) || 방향만 반대, 동작 동일\n|-\n| `alarm_active` || `alarm_inflight` || 같음\n|-\n| `alarm_saved` (구조체 대입) || `alarm_tf` (`memmove`) || 같음. `*p->trapframe` 대입 = `memmove(..., sizeof(struct trapframe))`\n|}\n{/warn}\n\n{joke}\n`memmove`와 구조체 대입 중 어느 쪽이 \"진짜\"냐고 물으면, C 표준은 둘이 같다고 답하고 컴파일러는 둘 다 똑같은 코드를 뱉는다. 다만 퀴즈 2번 빈칸에 `memmove(...)`를 적으면 '''칸이 모자란다''' — 출제자가 `*p->trapframe`을 의도했다는 결정적 증거.\n{/joke}\n\n== 13. 제출 ==\n\n[[img:A1-6.png|Assignment 1 PDF p.6 — Submission 절차. git commit 후 make zipball|medium]]\n\n<pre class=\"sh\">\n$ git add -A\n$ git commit -m \"Assignment 1 finished\"\n$ make zipball          # lab.zip 생성 → {학번}_{이름}.zip 으로 개명\n<\/pre>\n\n* '''`make zipball` 전에 반드시 `git commit`''' — zipball이 git 상태를 기준으로 묶기 때문.\n* 보고서는 '''4–6쪽'''. 채점기 점수와 별개로, \"왜 trapframe 전체인가 / 왜 sigreturn이 a0를 반환하는가 / 왜 재진입을 막는가\"를 '''본인 말로''' 쓰는 것이 핵심이다 — 그리고 퀴즈 1이 정확히 그 세 가지를 물었다.\n* 채점기(`make grade`) 만점은 '''80점''' = test0 20 + test1 20 + test2 10 + test3 10 + usertests 20.\n\n== 시험 대비 핵심 요약 ==\n\n# '''sret은 [[sepc]]로 간다. sepc는 [[trapframe]]->[[epc]]에서 온다. 그래서 epc를 바꾼다.''' — 알람의 전부.\n# 알람이 켜졌는지는 '''[[alarm_interval]] > 0'''으로 판단한다. `handler != 0`으로 하면 안 된다(핸들러 주소가 0일 수 있음).\n# tick은 '''이 프로세스의 [[usertrap]]'''에서 `which_dev == 2`일 때만 센다 = 소비한 '''CPU 시간'''.\n# 발사 시 순서: '''백업([[alarm_saved]]) → 잠금([[alarm_active]]=1) → re-arm([[alarm_elapsed]]=0) → epc 바꿔치기'''.\n# 복원은 '''통째로''' — `*p->trapframe = p->alarm_saved;` 한 줄로 31개 레지스터 + epc. 인터럽트라 caller/callee-saved 약속이 없어서 '''전부''' 저장해야 한다.\n# '''[[a0 복원]]''': `syscall()`이 `p->trapframe->a0 = 반환값`을 실행하므로, [[sigreturn]]은 '''저장돼 있던 a0를 반환값으로''' 줘야 한다 → `return p->trapframe->a0;`\n# '''[[재진입 금지]]''': 백업 슬롯이 하나라서. 핸들러 실행 중이면 tick을 세지 않는다 (test2).\n# 핸들러는 '''[[유저 모드와 커널 모드|user mode]]'''에서 돈다. 그래서 `p->trapframe`을 자기 트랩으로 덮어쓴다 → 별도 복사본이 필요.\n# 핸들러가 `sigreturn` 없이 C `return` 하면 '''`ra`(= 끊긴 코드의 리턴 주소)로 점프''' → 프레임이 어긋나 crash, 게다가 `alarm_active`가 1로 남아 알람이 영영 안 울린다.\n# 시스템 콜 번호 = '''`a7`''', 인자 = '''`a0`, `a1`''', 반환값 = '''`a0`'''. 진입 = `ecall`, 복귀 = [[sret]].\n\n== 관련 문서 ==\n* [[sigalarm]] · [[sigreturn]] · [[alarm_interval]] · [[alarm_handler]] · [[alarm_elapsed]] · [[alarm_saved]] · [[alarm_active]]\n* [[재진입 금지]] · [[a0 복원]] · [[alarmtest]] · [[which_dev]] · [[yield]] · [[myproc]] · [[usys.pl]]\n* [[xv6 시스템 콜 경로]] · [[시스템 콜 추가 절차]] · [[struct proc]]\n* [[trapframe]] · [[epc]] · [[sepc]] · [[sret]] · [[usertrap]] · [[usertrapret]] · [[return-from-trap]]\n* [[제한적 직접 실행]] (4강 이론) · [[타이머 인터럽트]] · [[퀴즈1 복기]]"

  "body": "'''`sigalarm(interval, handler)`'''은 [[과제1 xv6 alarm|과제 1]]에서 추가하는 시스템 콜 두 개 중 하나로, \"이 프로세스가 CPU 시간을 `interval` tick 쓸 때마다 유저 함수 `handler`를 불러 달라\"고 커널에 '''등록'''하는 역할이다.\n\n{def}\n`int sigalarm(int ticks, void (*handler)());`\n\"If an application calls `sigalarm(n, fn)`, then after every n '''ticks of CPU time''' that the program consumes, the kernel should cause application function `fn` to be called. When `fn` returns, the application should '''resume where it left off'''. If an application calls `sigalarm(0, 0)`, the kernel should '''stop generating periodic alarm calls'''.\"\n{/def}\n\n{analogy}\n`sigalarm`은 '''알람 시계를 맞추는 행위'''지 '''알람이 울리는 것'''이 아니다. 시계 자체(타이머 하드웨어)는 이미 [[타이머 인터럽트|부팅 때 OS가 켜 둔 것]]이고, `sigalarm`은 그 시계 옆에 '''\"2틱마다 나 좀 깨워 줘, 깨우면 이 번호로 전화해\"라는 메모'''를 붙이는 것뿐이다. 실제로 깨우는 일은 전부 [[usertrap]]이 한다.\n{/analogy}\n\n== 구현 ==\n\n<pre class=\"c\">\n// kernel/sysproc.c\nuint64\nsys_sigalarm(void)\n{\n  int n;\n  uint64 handler;\n  struct proc *p = myproc();\n\n  argint(0, &n);           // 1  첫 번째 인자 = trapframe->a0\n  argaddr(1, &handler);    // 2  두 번째 인자 = trapframe->a1\n  if(n < 0)\n    return -1;\n\n  p->alarm_interval = n;   // 3\n  p->alarm_handler  = handler;\n  p->alarm_elapsed  = 0;   // 4\n  return 0;                // 5\n}\n<\/pre>\n\n{| class=\"table\"\n! 행 || 설명\n|-\n| 1–2 || 인자는 [[trapframe]]의 `a0`, `a1`에 들어 있다. `argint`/`argaddr`이 꺼내 준다 — '''인자를 읽는 데도 trapframe이 필요'''\n|-\n| 3 || [[myproc]]이 돌려준 '''지금 이 프로세스의 칸'''에만 기록 → 알람 설정은 프로세스별\n|-\n| 4 || 카운터 리셋. 이전 설정의 잔여 tick이 남아 새 주기를 망치지 않게\n|-\n| 5 || 성공 시 0. 이 값은 [[a0]]에 실려 유저에게 간다\n|}\n\n{warn}\n'''`sys_sigalarm`은 아무 일도 하지 않는다''' — 값 세 개를 기록할 뿐이다. \"sigalarm이 타이머를 건다\"는 서술은 '''틀렸다'''. 타이머는 이미 [[비협력적 방식|부팅 때 OS가]] 걸어 놨다. 실제 마법은 [[usertrap]]과 [[sigreturn]]에서 일어난다.\n{/warn}\n\n== sigalarm(0, 0) — 끄기 ==\n\n<pre class=\"ascii\">\n   sigalarm(0, 0)  →  p->alarm_interval = 0\n                          │\n                          ▼\n   usertrap():  if (p->alarm_interval > 0 && !p->alarm_active) { ... }\n                     └──────── 거짓 ────────┘\n                ⇒ 분기 자체를 안 탄다. alarm_elapsed 도 더 이상 늘지 않음.\n                ⇒ 타이머 인터럽트는 계속 오지만 핸들러는 다시 안 불림.\n<\/pre>\n\n{tip}\n핸들러 '''안에서''' `sigalarm(0, 0)`을 부르는 것은 합법이지만, '''그 뒤에 [[sigreturn]]은 반드시 불러야 한다''' — 알람을 껐다고 [[alarm_active]]가 풀리거나 끊긴 문맥이 복원되지는 않기 때문이다. 퀴즈 1의 5번 `periodic()`이 정확히 이 순서(`sigalarm(0,0)` → `sigreturn()`)로 쓰여 있다.\n{/tip}\n\n{exam}\n'''퀴즈 1의 5번 (b) (10점)''' — `if (count == 3)` 조건을 떼고 '''무조건''' `sigalarm(0, 0)`을 부르면? → 첫 핸들러 호출에서 알람이 꺼져 `count`가 1에 멈추고, `for (; count < 3; i++)`이 '''무한 루프'''가 되어 첫 `printf`에 영영 도달하지 못한다. 자세히는 [[퀴즈1 복기]].\n{/exam}\n\n== 관련 문서 ==\n* [[sigreturn]] · [[alarm_interval]] · [[alarm_handler]] · [[alarm_elapsed]] · [[alarm_active]]\n* [[myproc]] · [[usys.pl]] · [[xv6 시스템 콜 경로]] · [[trapframe]] · [[a0]]\n* [[과제1 xv6 alarm]] · [[usertrap]] · [[alarmtest]] · [[퀴즈1 복기]]"
 },

  "body": "'''`sigreturn()`'''은 알람 핸들러가 '''끝날 때 반드시 불러야 하는''' 시스템 콜이다. 끊겼던 유저 문맥을 [[alarm_saved]]에서 [[trapframe]]으로 되돌려, 프로세스가 '''원래 멈췄던 명령어'''에서 계속되게 한다.\n\n{def}\n\"As a starting point, we've made a design decision for you: '''user alarm handlers are required to call the sigreturn system call when they have finished.'''\"\n{/def}\n\n{analogy}\n`sigreturn`은 '''\"서랍에 넣어 둔 복사본을 다시 책상에 올려 주세요\"라고 창구에 부탁하는 것'''이다. 복사본([[alarm_saved]])은 '''커널 메모리'''에 있어서 유저가 직접 꺼낼 수 없다. 그래서 유저가 할 수 있는 유일한 일은 '''문을 두드리는 것'''([[트랩]] = `ecall`)뿐이고, 그것이 곧 시스템 콜이다.\n{/analogy}\n\n== 왜 그냥 `return`하면 안 되는가 ⭐⭐⭐ ==\n\n<pre class=\"ascii\">\n   보통 함수 호출                          알람 핸들러\n   ┌──────────────┐                     ┌──────────────┐\n   │ caller       │ call f → ra=복귀주소 │ 끊긴 유저코드 │  ← 아무도 call 하지 않았다\n   │ (스택에 흔적) │ ◄─ ret (ra로 점프)   │ (PC 0x1234)  │\n   └──────────────┘                     └──────────────┘\n                                               ╳  커널이 epc 만 바꿔서 sret 으로 \"떨어뜨림\"\n                                               │  → ra 에는 0x1234 가 없다\n                                               │  → 0x1234 와 레지스터 31개는 커널의 alarm_saved 에만 있다\n                                               ▼\n                                        유저 코드는 alarm_saved 를 읽을 수 없다 (커널 메모리)\n                                        ⇒ 커널로 다시 들어가야 한다 = 시스템 콜 sigreturn()\n<\/pre>\n\n세 가지가 동시에 문제다:\n# '''복귀 주소를 모른다''' — 핸들러는 `call` 된 적이 없어 `ra`에 끊긴 지점이 없다.\n# '''레지스터를 되돌릴 수 없다''' — 31개의 원래 값은 커널 메모리에만 있다.\n# '''[[alarm_active]]를 풀 수 없다''' — 유저가 커널 플래그를 건드릴 수 없다. 안 풀면 알람이 '''영영 한 번만''' 울린다.\n\n== 구현 ==\n\n<pre class=\"c\">\n// kernel/sysproc.c\nuint64\nsys_sigreturn(void)\n{\n  struct proc *p = myproc();\n\n  if(!p->alarm_active)             // 1  핸들러 밖에서 부르면 거부 (선택 사항)\n    return -1;\n  *p->trapframe = p->alarm_saved;  // 2  ★ 31 레지스터 + epc 전부 복원\n  p->alarm_active  = 0;            // 3  ★ 재진입 잠금 해제\n  p->alarm_elapsed = 0;            // 4  카운터 리셋\n  return p->trapframe->a0;         // 5  ★★ \"저장돼 있던 a0\" 를 반환값으로\n}\n<\/pre>\n\n{| class=\"table\"\n! 행 || 빠뜨리면 생기는 일\n|-\n| 2 || 유저가 핸들러 중간 주소·엉뚱한 레지스터로 깨어남 → test1 실패, crash\n|-\n| 3 || [[alarm_active]]가 1로 남아 '''알람이 두 번 다시 안 울림''' (test0만 통과)\n|-\n| 5 || `syscall()`이 `a0`를 반환값으로 덮어써 '''[[a0]]가 0이 됨''' → test1 실패 ([[a0 복원]])\n|}\n\n== a0 반환의 이유 ⭐ ==\n\n<pre class=\"ascii\">\n   ① sys_sigreturn 안:   trapframe->a0 = 저장된 값 (예: 0x2a)   ✓ 복원됨\n   ② syscall() 이 이어서:  trapframe->a0 = sys_sigreturn 의 반환값\n         return 0;              →  a0 = 0      ✗  끊긴 코드의 a0 가 파괴됨\n         return trapframe->a0;  →  a0 = 0x2a   ✓  덮어써도 같은 값\n<\/pre>\n\n{exam}\n'''실제 퀴즈 1의 4번(20점) 전체가 이것이다.''' 과제 PDF 힌트 원문: \"'''Make sure to restore a0.''' sigreturn is a system call, and its return value is stored in a0.\" 모의 A19에서 틀린 문항이기도 하다. 자세히는 [[a0 복원]] / [[퀴즈1 복기]].\n{/exam}\n\n{quiz}\n핸들러가 `sigreturn()` 없이 C `return`으로 끝나면 제어는 어디로 가는가? (퀴즈 1의 3번 (c))\n{/quiz}\n{answer}\n'''`ra` 레지스터가 가리키는 곳''' — 그런데 그 `ra`는 핸들러의 리턴 주소가 아니라 '''인터럽트 당한 유저 코드가 갖고 있던 값'''이다. 커널은 [[epc]]만 바꿨고 레지스터 31개는 끊긴 코드의 값 그대로 복원했기 때문이다. 결과적으로 '''인터럽트 당한 함수가 원래 리턴하려던 주소'''로 튀어 그 함수의 남은 부분이 통째로 건너뛰어지고, 스택 프레임이 어긋나 '''정의되지 않은 동작(대개 crash)'''이 된다. 게다가 [[alarm_active]]가 1로 남아 알람도 멈춘다.\n{/answer}\n\n[[sim:alarm_trace]]\n\n== 관련 문서 ==\n* [[sigalarm]] · [[alarm_saved]] · [[alarm_active]] · [[a0 복원]] · [[a0]] · [[재진입 금지]]\n* [[trapframe]] · [[epc]] · [[sepc]] · [[sret]] · [[usertrapret]] · [[xv6 시스템 콜 경로]]\n* [[과제1 xv6 alarm]] · [[alarmtest]] · [[퀴즈1 복기]]"
 },
 "alarm_interval": {
  "title": "alarm_interval",
  "category": [
   "과제1",
   "용어"
  ],
  "body": "'''`alarm_interval`'''은 [[struct proc]]에 추가하는 필드로, '''알람 주기 n (tick)'''을 담는다. [[sigalarm]]이 설정하고 [[usertrap]]이 읽는다. '''0이면 알람이 꺼진 상태'''라는 것이 핵심 약속이다.\n\n{def}\n`int alarm_interval;` — interval in ticks. '''0 = alarm disabled.'''\n(실제 제출 구현에서의 이름은 `alarm_ticks`. 퀴즈 1은 `alarm_interval`로 출제됐다.)\n{/def}\n\n{analogy}\n`alarm_interval`은 '''알람 시계의 \"몇 분마다\" 설정값'''이다. 그리고 '''0 = OFF 스위치'''를 겸한다 — 별도의 on/off 플래그를 두지 않고 \"주기가 0이면 꺼진 것\"으로 약속한 것. 덕분에 `sigalarm(0, 0)` 한 번으로 끄기가 끝난다.\n{/analogy}\n\n== 켜짐 판단의 유일한 기준 ⭐ ==\n\n<pre class=\"c\">\nif (p->alarm_interval > 0 && !p->alarm_active) {   // ← 여기\n    p->alarm_elapsed++;\n    ...\n}\n<\/pre>\n\n{warn}\n'''`p->alarm_handler != 0`으로 판단하면 안 된다.''' 과제 PDF의 경고: \"Note that the address of the user's alarm function '''might be 0''' (e.g., in `user/alarmtest.asm`, `periodic` is at address 0).\" 핸들러 주소가 0인 것은 '''정상'''이므로, 알람이 켜졌는지는 반드시 '''`alarm_interval > 0`'''으로 봐야 한다. 이걸 틀리면 `alarmtest` test0부터 실패한다.\n{/warn}\n\n== 끄기 ==\n\n<pre class=\"ascii\">\n   sigalarm(0, 0)\n        │\n        ▼  sys_sigalarm:  p->alarm_interval = 0;  p->alarm_handler = 0;\n        │\n        ▼  usertrap:      if (p->alarm_interval > 0 && ...)   ← 거짓\n        │\n        ▼  타이머는 계속 오지만 알람 분기는 미진입. count 동결.\n<\/pre>\n\n{exam}\n'''퀴즈 1의 5번 ③ (`after=3`)이 이 필드 하나로 풀린다.''' 3번째 핸들러에서 `sigalarm(0,0)`이 실행되어 `alarm_interval = 0` → 이후 `burn()`이 아무리 오래 돌아도 핸들러가 다시 불리지 않음 → `count`는 3에서 멈춘다. 또한 `alarmtest`의 '''test3'''이 검사하는 것이 정확히 이 동작이다.\n{/exam}\n\n{quiz}\n`sigalarm(5, 0)` — 주기는 5인데 핸들러가 `0`이다. 어떻게 되는가?\n{/quiz}\n{answer}\n'''알람은 켜진다.''' `alarm_interval = 5 > 0`이므로 5 tick마다 발사되고, [[epc]]에 `0`이 들어가 유저가 '''주소 0부터 실행'''하게 된다. 그 주소에 실제로 코드가 있으면(`alarmtest.asm`에서 `periodic`이 주소 0에 있는 경우) 정상 동작하고, 없으면 page fault로 죽는다. 즉 '''커널은 handler의 값을 검증하지 않으며, 0은 \"꺼짐\"의 표시가 아니다.'''\n{/answer}\n\n== 관련 문서 ==\n* [[alarm_handler]] · [[alarm_elapsed]] · [[alarm_active]] · [[alarm_saved]]\n* [[sigalarm]] · [[usertrap]] · [[struct proc]] · [[alarmtest]] · [[과제1 xv6 alarm]]"
 },
 "alarm_handler": {
  "title": "alarm_handler",
  "category": [
   "과제1",
   "용어"
  ],
  "body": "'''`alarm_handler`'''는 [[struct proc]]에 추가하는 필드로, '''유저 핸들러 함수의 주소'''를 담는다. [[sigalarm]]이 설정하고, 알람이 터질 때 '''[[epc]]에 대입될 값'''이다.\n\n{def}\n`uint64 alarm_handler;` — user-space handler address.\n`p->trapframe->epc = (uint64)p->alarm_handler;` — 퀴즈 1의 2번 ③ 빈칸.\n{/def}\n\n{analogy}\n`alarm_handler`는 '''\"깨우면 이 번호로 전화해 주세요\"라고 적어 둔 전화번호'''다. 커널은 이 번호가 유효한지 '''확인하지 않는다''' — 그냥 적힌 대로 건다. 번호가 0이어도 건다. 그게 [[과제1 xv6 alarm|과제]]에서 \"handler가 0일 수 있다\"는 경고의 의미다.\n{/analogy}\n\n== 쓰이는 곳은 딱 한 줄 ==\n\n<pre class=\"c\">\nif (p->alarm_elapsed >= p->alarm_interval) {\n    p->alarm_saved  = *p->trapframe;\n    p->alarm_active = 1;\n    p->alarm_elapsed = 0;\n    p->trapframe->epc = (uint64)p->alarm_handler;   // ★ 여기서만 쓰인다\n}\n<\/pre>\n\n이 한 줄 뒤의 흐름:\n\n<pre class=\"ascii\">\n   p->trapframe->epc = handler\n            │\n            ▼  usertrapret():  w_sepc(p->trapframe->epc)\n            │\n            ▼  userret:  레지스터 31개 복원  →  sret\n            │\n            ▼  PC ← sepc = handler,  mode ← user\n   USER:  periodic() 이 \"호출된 것처럼\" 실행 시작\n          ← 사실은 call 이 아니라 sret 으로 떨어진 것 (그래서 ra 가 남의 값)\n<\/pre>\n\n{warn}\n'''핸들러 주소가 0인 것은 정상이다.''' 그래서 \"알람이 켜졌나\"는 [[alarm_interval]] `> 0`으로 판단해야 한다. `alarm_handler != 0`으로 판단하면 `alarmtest`가 즉시 실패한다.\n{/warn}\n\n{tip}\n타입을 `uint64`로 두는 이유: [[epc]]가 `uint64`라 대입이 자연스럽고, 유저 함수 포인터를 커널에서 '''호출할 일이 없으므로''' 함수 포인터 타입일 필요가 없다. 커널은 이 주소를 '''실행하지 않는다''' — 유저 모드에서 실행되도록 [[sret]]에게 넘길 뿐이다.\n{/tip}\n\n{quiz}\n커널이 `p->alarm_handler`를 '''직접 호출'''하면(`((void(*)())p->alarm_handler)();`) 왜 안 되는가?\n{/quiz}\n{answer}\n그러면 핸들러가 '''[[커널 모드]]에서''' 실행된다. ① 유저 코드가 커널 권한을 얻어 보호가 무너지고, ② 그 주소는 '''유저 페이지 테이블'''의 주소라 커널 페이지 테이블에서는 유효하지도 않다. 핸들러는 반드시 '''user mode에서''' 돌아야 하며(퀴즈 1의 1번), 그 유일한 방법이 [[epc]]를 바꿔 [[sret]]으로 내려보내는 것이다.\n{/answer}\n\n== 관련 문서 ==\n* [[alarm_interval]] · [[alarm_elapsed]] · [[alarm_active]] · [[alarm_saved]]\n* [[epc]] · [[sepc]] · [[sret]] · [[usertrapret]] · [[sigalarm]] · [[과제1 xv6 alarm]] · [[퀴즈1 복기]]"
 },
 "alarm_elapsed": {
  "title": "alarm_elapsed",
  "category": [
   "과제1",
   "용어"
  ],
  "body": "'''`alarm_elapsed`'''는 [[struct proc]]에 추가하는 필드로, '''마지막 핸들러 호출 이후 이 프로세스가 소비한 tick 수'''를 센다. [[usertrap]]이 `++` 하고, [[alarm_interval]]에 도달하면 발사한 뒤 0으로 되돌린다(re-arm).\n\n{def}\n`int alarm_elapsed;` — ticks elapsed since the last handler call.\n`p->alarm_elapsed++;` → `if (p->alarm_elapsed >= p->alarm_interval) { ... p->alarm_elapsed = 0; }`\n(실제 제출 구현은 반대 방향으로 세는 `alarm_left`를 썼다 — `--p->alarm_left <= 0`. 동작은 동일.)\n{/def}\n\n{analogy}\n`alarm_elapsed`는 '''모래시계'''다. 뒤집으면(0으로 리셋) 다시 처음부터 모래가 쌓이고, 다 차면 종이 울린다. 중요한 건 '''이 모래시계는 내가 CPU를 쓸 때만 흐른다'''는 것 — 내가 스케줄에서 밀려 자고 있는 동안에는 모래가 멈춰 있다.\n{/analogy}\n\n== CPU 시간을 센다 (벽시계 시간이 아니다) ⭐ ==\n\n<pre class=\"ascii\">\n   tick 을 세는 곳은 \"이 프로세스의 usertrap()\" 뿐이다.\n\n   Process A (alarm 설정됨)   Process B\n   ───────────────────────────────────────────────────\n   유저 실행 ── tick! ──►  usertrap(A):  alarm_elapsed++   ✔ 센다\n       │ yield\n       └──────────────►  B 유저 실행 ── tick! ──► usertrap(B)  ✘ A 는 안 셈\n                              │ yield\n   A 유저 실행 ── tick! ──►  usertrap(A):  alarm_elapsed++   ✔ 센다\n\n   ⇒ \"n ticks of CPU time that the program consumes\" (과제 PDF 원문)\n<\/pre>\n\n{warn}\n\"`sigalarm(2, fn)`이면 20 ms마다(= 2 tick의 벽시계 시간마다) 호출된다\"는 서술은 '''틀렸다'''. 시스템이 바쁘면 A가 2 tick을 '''소비'''하는 데 훨씬 오래 걸린다.\n{/warn}\n\n== 왜 `>=` 인가 ==\n\n<pre class=\"c\">\nif (p->alarm_elapsed >= p->alarm_interval) {   // == 이 아니라 >=\n<\/pre>\n\n방어적 코딩이다. `alarm_interval`이 도중에 더 작은 값으로 바뀌는 등의 이유로 `elapsed`가 `interval`을 뛰어넘어 버려도 '''놓치지 않고''' 발사한다. `==`로 쓰면 그런 경우 한 바퀴를 통째로 건너뛴다.\n\n== 핸들러 실행 중에는 세지 않는다 ⭐⭐ ==\n\n<pre class=\"c\">\nif (p->alarm_interval > 0 && !p->alarm_active) {   // ★ 가드가 ++ 보다 앞\n    p->alarm_elapsed++;\n    ...\n}\n<\/pre>\n\n[[재진입 금지]] 가드가 '''`alarm_elapsed++`보다 앞'''에 있기 때문에, 핸들러가 도는 동안 쓴 tick은 '''주기에 전혀 포함되지 않는다'''.\n\n{exam}\n'''퀴즈 1의 5번이 정확히 이 동작을 묻는다.''' `periodic()` 안의 `burn()`이 5 tick 이상을 태우는데도 알람이 다시 터지지 않는 이유가 이것이다 — [[alarm_active]] = 1인 동안 `alarm_elapsed`는 '''멈춰 있다'''. 그래서 핸들러는 정확히 count=1, 2, 3으로 '''세 번만''' 불리고 `sum = 1+2+3 = 6`이 된다.\n{/exam}\n\n{quiz}\n`sigalarm(2, fn)`을 설정했고, 핸들러 안에서 100 tick을 태웠다. 핸들러가 끝나고 몇 tick 뒤에 다음 알람이 울리는가?\n{/quiz}\n{answer}\n'''2 tick 뒤.''' 발사 시점에 `alarm_elapsed = 0`으로 re-arm 했고, 핸들러가 도는 100 tick 동안은 [[alarm_active]] 가드 때문에 '''카운트가 멈춰''' 있었다. [[sigreturn]]이 `alarm_active = 0`으로 풀어 준 뒤부터 다시 1, 2로 세어 2 tick 만에 발사된다.\n{/answer}\n\n== 관련 문서 ==\n* [[alarm_interval]] · [[alarm_active]] · [[alarm_handler]] · [[alarm_saved]] · [[재진입 금지]]\n* [[usertrap]] · [[which_dev]] · [[타이머 인터럽트]] · [[과제1 xv6 alarm]] · [[퀴즈1 복기]]"
 },
 "alarm_saved": {
  "title": "alarm_saved",

   "핵심"
  ],
  "body": "'''`alarm_saved`'''는 [[struct proc]]에 추가하는 '''`struct trapframe` 구조체 통째'''로, 알람이 터지는 순간의 '''끊긴 유저 문맥 전체 사본'''이다. [[과제1 xv6 alarm|과제 1]]에서 가장 중요한 필드이며, '''퀴즈 1의 2번 ②와 3번 (a)가 전부 이 필드에 관한 문제'''였다.\n\n{def}\n`struct trapframe alarm_saved;` — a '''separate struct trapframe value''' holding the interrupted user context (31 registers + [[epc]]), restored by [[sigreturn]].\n포인터가 아니라 '''값'''이다 — 퀴즈 문제지가 \"a separate struct trapframe '''value'''\"라고 명시했다.\n{/def}\n\n{analogy}\n[[trapframe]]이 '''책갈피'''라면 `alarm_saved`는 '''그 책갈피의 복사본'''이다. 책갈피 자리는 하나뿐이고 새 트랩이 날 때마다 새 책갈피로 갈린다. 그래서 원래 페이지를 잃지 않으려면 '''복사본을 서랍에 넣어 둬야''' 한다. [[sigreturn]]은 \"서랍에서 꺼내 다시 끼워 주세요\"다.\n{/analogy}\n\n== 저장과 복원 ==\n\n<pre class=\"c\">\n// usertrap() — 알람 발사 시\np->alarm_saved = *p->trapframe;      // ★ 구조체 \"값\" 대입 (= memmove)\n\n// sys_sigreturn() — 핸들러가 끝났을 때\n*p->trapframe = p->alarm_saved;      // ★ 31 레지스터 + epc 전부 되돌림\n<\/pre>\n\n<pre class=\"ascii\">\n        p->trapframe (페이지 1장)            p->alarm_saved (proc 칸 안에 내장)\n        ┌────────────────┐                 ┌────────────────┐\n        │ kernel_satp …  │                 │                │\n        │ epc  = 0x1234  │ ──  복사  ──►   │ epc  = 0x1234  │   알람이 터질 때\n        │ ra sp gp tp    │                 │ ra sp gp tp    │\n        │ a0 a1 … a7     │ ◄──  복원  ──   │ a0 a1 … a7     │   sigreturn 때\n        │ t0 … t6        │                 │ t0 … t6        │\n        │ s0 … s11       │                 │ s0 … s11       │\n        └────────────────┘                 └────────────────┘\n          \"지금 트랩의 문맥\"                  \"알람 직전의 문맥\"  ← 슬롯 하나뿐!\n          (트랩마다 덮어써짐)                  (sigreturn 까지 안전)\n<\/pre>\n\n{warn}\n'''`p->alarm_saved = p->trapframe;`는 틀렸다''' — 포인터 대입이라 타입이 안 맞고(컴파일 에러), 설령 통과해도 '''같은 페이지를 가리키는 두 번째 이름'''일 뿐이라 백업이 되지 않는다. 반드시 `*`를 붙여 '''내용물'''을 복사해야 한다.\n{/warn}\n\n== 왜 별도 사본이 필요한가 — 퀴즈 3번 (a) ⭐⭐⭐ ==\n\n{exam}\n'''실제 퀴즈 1의 3번 (a), 10점.''' \"On a timer interrupt, xv6 already saves the user context in `p->trapframe`. '''Why is a separate copy still needed''' before starting the alarm handler?\"\n\n'''한 문장 답안:''' \"핸들러는 '''user mode에서 실행'''되면서 자기 자신의 시스템 콜(최소한 [[sigreturn]])이나 또 다른 트랩으로 '''`p->trapframe`을 덮어쓰기''' 때문에, 끊긴 문맥을 미리 별도 슬롯에 복사해 두어야 한다.\"\n{/exam}\n\n풀어 쓰면:\n\n<pre class=\"ascii\">\n   p->trapframe 은 \"지금 이 트랩의 문맥\" 슬롯 하나뿐이고,\n   트랩이 날 때마다 uservec 이 유저 레지스터 31개를 그 자리에 덮어쓴다.\n\n   핸들러가 유저 모드에서 하는 모든 일이 trapframe 을 덮는다:\n      · sigreturn()        ← ecall.  반드시 부른다.      ⇒ 덮임\n      · printf(\"alarm!\")   ← write 시스템 콜             ⇒ 덮임\n      · 핸들러 도중 타이머 인터럽트                        ⇒ 덮임\n      · 핸들러가 page fault                              ⇒ 덮임\n\n   ⇒ 핸들러가 한 발짝만 움직여도 원래 유저 코드의 문맥은 사라진다.\n   ⇒ 그래서 \"핸들러를 시작하기 전에\" 프로세스 전용 슬롯으로 통째로 복사한다.\n<\/pre>\n\n{tip}\n'''1번 문제(핸들러는 user mode에서 돈다)의 답이 곧 3번 (a)의 이유'''다. 만약 핸들러가 커널 모드에서 돈다면 자기 시스템 콜을 부를 일이 없으니 `trapframe`도 덮이지 않았을 것이다. 두 문제가 한 줄로 이어져 있다는 것이 이번 퀴즈의 설계.\n{/tip}\n\n== 왜 \"전부\" 저장하는가 ==\n\n과제 PDF 힌트: \"what registers do you need to save and restore to resume the interrupted code correctly? ('''Hint: it will be many'''.)\"\n\n{warn}\n일반 함수 호출이라면 '''caller-saved / callee-saved 규약''' 덕에 일부만 저장하면 된다. 그러나 알람은 '''[[인터럽트]]'''다 — 끊긴 코드는 \"지금 함수를 호출할 참\"이었을 수도, \"계산 중간\"이었을 수도 있다. '''어떤 규약도 적용되지 않으므로 전부 저장해야 한다.''' [[a0]] 하나만 빠져도 test1이 실패한다([[a0 복원]]).\n{/warn}\n\n== 슬롯이 하나라는 사실의 귀결 ==\n\n저장 슬롯이 '''하나'''이기 때문에 '''[[재진입 금지]]'''가 필요해진다. 핸들러 실행 중에 알람이 또 터지면 `alarm_saved`가 '''핸들러 중간 문맥'''으로 덮여, 원래 유저 코드로 돌아갈 길이 영영 사라진다.\n\n{quiz}\n`alarm_saved`를 [[struct proc]] 안에 구조체로 두는 것과, `kalloc()`으로 페이지를 할당해 포인터로 두는 것 중 어느 쪽이 맞는가?\n{/quiz}\n{answer}\n'''둘 다 맞다''' — 실제로 두 방식 모두 `make grade` 만점(80/80)을 받는다.\n* 구조체 내장: `struct proc` 크기가 288 B × NPROC(64) ≈ 18 KB 늘지만 '''누수가 없다'''.\n* `kalloc` 포인터: 포인터 8 B만 늘지만, 핸들러 실행 중 프로세스가 죽으면 `freeproc`에서 해제하지 않아 '''1페이지 누수''' 가능. 이 경우 `!= 0` 자체를 [[alarm_active]] 대용으로 쓸 수 있다는 장점은 있다.\n핵심 메커니즘(통째 저장/복원)은 동일하며, 퀴즈는 '''구조체 값''' 쪽 표기(`*p->trapframe`)로 출제됐다.\n{/answer}\n\n== 관련 문서 ==\n* [[trapframe]] · [[epc]] · [[a0]] · [[a0 복원]] · [[재진입 금지]] · [[alarm_active]]\n* [[sigreturn]] · [[sigalarm]] · [[usertrap]] · [[struct proc]] · [[커널 스택]]\n* [[과제1 xv6 alarm]] · [[alarmtest]] · [[퀴즈1 복기]]"
 },
 "alarm_active": {
  "title": "alarm_active",
  "category": [
   "과제1",
   "용어"
  ],
  "body": "'''`alarm_active`'''는 [[struct proc]]에 추가하는 '''플래그'''로, '''핸들러가 지금 실행 중인가'''를 나타낸다. [[usertrap]]이 발사 시 1로 세우고, [[sigreturn]]이 0으로 푼다. [[재진입 금지]]의 구현체다.\n\n{def}\n`int alarm_active;` — \"`alarm_active` is 1 while a handler is running\" (퀴즈 1 문제지 원문).\n`usertrap`: `p->alarm_active = 1;` / `sys_sigreturn`: `p->alarm_active = 0;`\n(실제 제출 구현의 이름은 `alarm_inflight`.)\n{/def}\n\n{analogy}\n`alarm_active`는 '''화장실 문의 \"사용 중\" 표시'''다. 안에 사람이 있으면 다음 사람을 들여보내지 않는다. 그런데 이 표시는 '''안에서만 내릴 수 있다''' — [[sigreturn]]을 부르지 않고 나가 버리면 표시가 \"사용 중\"인 채로 영원히 남아, 그 화장실은 다시는 쓰이지 않는다.\n{/analogy}\n\n== 생명주기 ==\n\n<pre class=\"ascii\">\n   alarm_active = 0   (allocproc 에서 초기화, 평소 상태)\n        │\n        │  usertrap: elapsed >= interval  → 발사\n        ▼\n   alarm_active = 1   ┌─ usertrap 의 tick 카운트 중단 (alarm_elapsed++ 안 함)\n        │             └─ 알람 재발사 금지\n        │  유저 모드에서 핸들러 실행 …\n        │\n        │  sys_sigreturn: *p->trapframe = p->alarm_saved;\n        ▼\n   alarm_active = 0   → 다시 tick 을 세기 시작\n<\/pre>\n\n== 두 곳에서 쓰인다 ==\n\n<pre class=\"c\">\n// ① usertrap — 가드\nif (p->alarm_interval > 0 && !p->alarm_active) {   // 퀴즈 1의 2번 ① 빈칸\n    p->alarm_elapsed++;\n    ...\n    p->alarm_active = 1;\n}\n\n// ② sys_sigreturn — 해제 (+ 오용 방지)\nif (!p->alarm_active)\n    return -1;             // 핸들러 밖에서 sigreturn 을 부르면 거부\n...\np->alarm_active = 0;\n<\/pre>\n\n{exam}\n'''퀴즈 1의 2번 ① (5점) 정답이 `!p->alarm_active`.''' 모의 A20에서 틀린 내용이기도 하다 — \"If the alarm handler has not yet returned when the interval expires again, the kernel should call the handler '''a second time'''.\" → '''거짓'''. 과제 PDF: \"Prevent re-entrant calls to the handler ... '''test2 tests this.'''\"\n{/exam}\n\n{warn}\n'''해제를 빠뜨리면''' 알람이 '''영영 한 번만''' 울린다 — test0은 통과하고 test1부터 실패하는 전형적인 증상이다. 반대로 '''가드를 빠뜨리면''' 핸들러가 중첩 호출되어 [[alarm_saved]]가 덮이고 test2가 실패한다.\n{/warn}\n\n{quiz}\n[[alarm_saved]]를 `kalloc`으로 동적 할당한 구현에서는 `alarm_active`를 따로 두지 않아도 되는 이유는?\n{/quiz}\n{answer}\n'''`saved_trapframe != 0`이 그 자체로 \"핸들러 실행 중\"을 뜻하기 때문.''' 발사할 때 할당하고 [[sigreturn]]에서 `kfree` 후 `0`으로 만들면, 포인터의 null 여부가 플래그를 겸한다. 다만 '''핸들러 실행 중 프로세스가 죽으면 `freeproc`에서 해제하지 않아 1페이지가 누수'''될 수 있다는 단점이 있다.\n{/answer}\n\n== 관련 문서 ==\n* [[재진입 금지]] · [[alarm_saved]] · [[alarm_elapsed]] · [[alarm_interval]] · [[alarm_handler]]\n* [[usertrap]] · [[sigreturn]] · [[struct proc]] · [[alarmtest]] · [[과제1 xv6 alarm]] · [[퀴즈1 복기]]"
 },
 "재진입 금지": {
  "title": "재진입 금지 (Re-entrancy Prevention)",
  "category": [
   "과제1",
   "핵심"
  ],
  "body": "'''재진입 금지'''는 알람 핸들러가 '''아직 끝나지 않았는데 또 호출되는 것'''을 막는 규칙이다. [[alarm_active]] 플래그로 구현하며, `alarmtest`의 '''test2'''가 정확히 이것을 검사한다.\n\n{def}\n\"'''Prevent re-entrant calls to the handler''' — if a handler hasn't returned yet, the kernel shouldn't call it again. '''test2 tests this.'''\" (과제 1 PDF)\n{/def}\n\n{analogy}\n재진입 금지는 '''\"통화 중에는 새 전화를 받지 않는다\"'''는 규칙이다. 그런데 이유가 예의 문제가 아니라 '''물리적 제약'''이다 — 이 전화기에는 '''통화 대기 메모지가 딱 한 장'''밖에 없다([[alarm_saved]]). 새 전화를 받으면 그 한 장에 새 내용이 덮여, '''원래 통화 상대가 누구였는지 영영 알 수 없게 된다.'''\n{/analogy}\n\n== 왜 금지해야 하는가 ⭐⭐ ==\n\n<pre class=\"ascii\">\n   슬롯(alarm_saved)이 하나뿐인 게 핵심이다.\n\n   정상 (alarm_active 가드 있음):            재진입을 허용하면:\n   ─────────────────────────────            ─────────────────────────────\n   alarm_saved ← [유저코드 문맥 0x1234]      alarm_saved ← [유저코드 문맥 0x1234]\n   periodic() 실행 중 …                      periodic() 실행 중 … 또 tick!\n                                             alarm_saved ← [periodic 중간 문맥]\n                                                    ↑ 0x1234 문맥이 덮여 영영 사라짐\n   sigreturn → 0x1234 복귀   ✓                periodic() 다시 실행 (중첩)\n                                             sigreturn → periodic 중간으로 복귀\n                                             sigreturn → ??? 원래 코드로 갈 길이 없음  ✗\n\n   방어: alarm_active == 1 이면 usertrap 에서 tick 자체를 세지 않는다.\n<\/pre>\n\n즉 재진입의 진짜 피해는 \"핸들러가 여러 번 도는 것\"이 아니라 '''[[alarm_saved]]가 덮여 원래 유저 문맥이 소실되는 것'''이다. 한 번 잃으면 복구할 방법이 없다.\n\n== 구현 ==\n\n<pre class=\"c\">\n// usertrap()\nif (p->alarm_interval > 0 && !p->alarm_active) {   // ★ 가드가 ++ 보다 앞\n    p->alarm_elapsed++;\n    if (p->alarm_elapsed >= p->alarm_interval) {\n        p->alarm_saved  = *p->trapframe;\n        p->alarm_active = 1;                       // ★ 잠금\n        p->alarm_elapsed = 0;\n        p->trapframe->epc = (uint64)p->alarm_handler;\n    }\n}\n\n// sys_sigreturn()\np->alarm_active = 0;                               // ★ 해제\n<\/pre>\n\n{warn}\n'''가드를 어디에 두느냐로 의미가 달라진다.'''\n* `!alarm_active`를 '''`alarm_elapsed++`보다 앞'''에 두면 → 핸들러가 쓴 tick은 '''주기에 아예 포함되지 않는다'''. (퀴즈 1의 5번이 전제하는 동작)\n* `++`는 계속 하고 '''발사만''' 막으면 → 핸들러가 오래 돌 경우 [[sigreturn]] 직후 '''곧바로''' 다시 발사된다.\n표준 답안과 퀴즈 2번 ①의 위치는 '''전자'''다.\n{/warn}\n\n== 퀴즈에서의 등장 ==\n\n{exam}\n'''모의 A20에서 틀린 문항''' — \"If the alarm handler has not yet returned when the interval expires again, the kernel should call the handler '''a second time'''.\" → '''거짓'''.\n\n'''실제 퀴즈 1에서는 두 번 나왔다:'''\n# '''2번 ① (5점)''' — 빈칸에 `!p->alarm_active`를 채우는 문제.\n# '''5번 (a) (20점)''' — `periodic()` 안의 `burn()`이 5 tick 이상을 태우는데도 알람이 재발사되지 않는 이유. 이걸 모르면 `count`가 3보다 커진다는 오답이 나온다.\n\n'''한 줄 답안:''' \"핸들러 실행 중엔 다시 안 부른다 — '''저장 슬롯이 하나뿐이라''' 원래 문맥이 덮이기 때문.\"\n{/exam}\n\n{tip}\n유닉스의 진짜 시그널도 같은 문제를 겪는다. `SIGALRM` 핸들러 실행 중에는 기본적으로 같은 시그널이 '''block'''되며(`sa_mask`), 여러 겹으로 쌓으려면 '''시그널 스택을 따로''' 둬야 한다. 슬롯이 하나면 재진입 금지, 슬롯이 여러 개면 중첩 허용 — 설계 선택은 결국 '''저장 공간 개수'''의 문제다.\n{/tip}\n\n{quiz}\n[[sigreturn]]에서 `alarm_active = 0`을 빠뜨리면 `alarmtest`는 어떻게 되는가?\n{/quiz}\n{answer}\n'''test0은 통과하고 test1부터 실패한다.''' 첫 알람은 정상적으로 터져 \"alarm!\"이 찍히지만, `alarm_active`가 1로 남아 [[usertrap]]의 가드가 영원히 거짓이 된다 → [[alarm_elapsed]]가 다시는 증가하지 않고 '''알람이 두 번 다시 울리지 않는다'''. test1은 여러 번 울려야 통과하므로 실패.\n{/answer}\n\n== 관련 문서 ==\n* [[alarm_active]] · [[alarm_saved]] · [[alarm_elapsed]] · [[alarm_interval]]\n* [[usertrap]] · [[sigreturn]] · [[alarmtest]] · [[과제1 xv6 alarm]] · [[퀴즈1 복기]]"
 },

  "body": "'''a0 복원'''은 [[sigreturn]]이 '''저장돼 있던 [[a0]] 값을 자신의 반환값으로 돌려줘야 한다'''는 규칙이다. [[과제1 xv6 alarm|과제 1]]에서 가장 미묘한 부분이고, '''실제 퀴즈 1의 4번(20점) 전체'''가 이것이었다.\n\n{def}\n\"'''Make sure to restore a0.''' sigreturn is a system call, and its return value is stored in a0.\" (과제 1 PDF, test1 힌트의 마지막 줄)\n{/def}\n\n{analogy}\n이건 '''\"짐을 제자리에 돌려놨는데, 문을 나서면서 경비원이 그 자리에 도장을 쾅 찍는\"''' 상황이다. 경비원(`syscall()`)은 규정상 '''모든 방문객에게 반드시 도장을 찍어야''' 한다 — 피할 수 없다. 그렇다면 방법은 하나, '''도장 내용을 원래 물건과 똑같이 만드는 것'''이다. 그래서 [[sigreturn]]은 \"저장돼 있던 a0\"를 반환값으로 준다.\n{/analogy}\n\n== 문제의 근원 — syscall()의 한 줄 ==\n\n<pre class=\"c\">\n// kernel/syscall.c\nvoid\nsyscall(void)\n{\n  int num = p->trapframe->a7;                  // 1  시스템 콜 번호는 a7\n  if(num > 0 && num < NELEM(syscalls) && syscalls[num]) {\n    p->trapframe->a0 = syscalls[num]();        // 2  ★ 반환값을 a0 에 \"덮어쓴다\"\n  } else {\n    printf(\"unknown sys call %d\\n\", num);\n    p->trapframe->a0 = -1;\n  }\n}\n<\/pre>\n\n2행은 [[xv6]]의 '''모든 시스템 콜에 공통'''으로 적용되는 규약이다. [[sigreturn]]만 예외로 빠져나갈 방법이 없다.\n\n== 순서를 따라가 보자 ⭐⭐⭐ ==\n\n저장된 [[a0]]가 `0x2a`(= 42)라고 하자.\n\n<pre class=\"ascii\">\n   ① sys_sigreturn 안에서:\n          *p->trapframe = p->alarm_saved;\n          ⇒ trapframe->a0 = 0x2a        ✓  여기까지는 제대로 복원됐다\n\n   ② sys_sigreturn 이 리턴한 직후, syscall() 이:\n          p->trapframe->a0 = <반환값>;\n\n          return 0;                 →  a0 = 0      ✗  끊긴 코드의 42 가 파괴됨\n          return p->trapframe->a0;  →  a0 = 0x2a   ✓  덮어써도 같은 값이라 무해\n\n   ③ usertrapret() → userret → sret\n          ⇒ 유저는 ②의 결과값을 a0 에 들고 깨어난다\n<\/pre>\n\n{exam}\n'''실제 퀴즈 1의 4번 (20점).''' \"The saved trapframe has `a0 = 0x2a`.\"\n* '''(a)(i) 5점''' — `*p->trapframe = p->alarm_saved;` '''직후''' `p->trapframe->a0` = '''`0x2a`'''\n* '''(a)(ii) 5점''' — 끊긴 프로그램이 재개될 때 `a0` = '''`0`''' (`return 0;`이므로 `syscall()`이 덮어씀)\n* '''(b) 10점''' — `return 0;`을 '''`return p->trapframe->a0;`'''로 (또는 `return p->alarm_saved.a0;`)\n\n(i)과 (ii)의 답이 '''다르다'''는 것이 이 문제의 전부다. \"둘 다 0x2a\"라고 쓰면 ②의 덮어쓰기를 모른다는 뜻이고, \"둘 다 0\"이라고 쓰면 ①의 복원을 모른다는 뜻이다.\n{/exam}\n\n== 왜 a0만 문제인가 ==\n\n{| class=\"table\"\n! 레지스터 || 복원되나 || 그 뒤 덮이나\n|-\n| `ra`, `sp`, `gp`, `tp`, `t0`–`t6`, `s0`–`s11`, `a1`–`a7` || ✓ ([[alarm_saved]] 통째 복원) || ✗ 아무도 안 건드림\n|-\n| '''`a0`''' || ✓ (같이 복원됨) || '''✓ `syscall()`이 반환값으로 덮음''' ← 유일한 예외\n|-\n| [[epc]] || ✓ || ✗\n|}\n\n`a0`만 특별한 이유는 [[RISC-V]] 호출 규약에서 '''`a0`가 \"인자 1번\"이자 \"반환값\"을 겸하기''' 때문이다. 시스템 콜 반환값이 실려야 할 자리가 하필 복원 대상 레지스터와 겹친 것.\n\n{warn}\n'''\"a0는 복원 대상이 아니다\"는 거짓이다.''' 모의 A19에서 이 문장을 참으로 골라 틀렸다. `a0`는 '''범용 레지스터'''라서 끊긴 유저 코드가 함수 인자나 계산 중간값으로 한창 쓰고 있을 수 있다. 과제 PDF가 복원 대상을 \"'''it will be many'''\"라고 표현한 것은 '''전부'''라는 뜻이다.\n{/warn}\n\n== 이 한 줄이 없으면 ==\n\n`alarmtest`의 '''test1'''이 실패한다. test1은 알람 전후로 유저 레지스터가 보존되는지를 검사하는데, `a0`가 0으로 바뀌면 \"test1 failed\"가 찍히거나 그 값으로 계산하던 코드가 crash한다.\n\n{quiz}\n`return p->alarm_saved.a0;`로 써도 되는가?\n{/quiz}\n{answer}\n'''된다 — 단, `*p->trapframe = p->alarm_saved;` 뒤든 앞이든 상관없다는 점이 다르다.''' `alarm_saved`는 복원 동작으로 변하지 않는 원본이므로 어느 시점에 읽어도 같은 값이다. 반면 `return p->trapframe->a0;`는 '''반드시 복원 뒤'''에 읽어야 한다 — 복원 전이라면 그건 '''`sigreturn()`을 호출한 핸들러의 `a0`'''(보통 0)이라 틀린 값이 된다.\n{/answer}\n\n== 관련 문서 ==\n* [[a0]] · [[sigreturn]] · [[alarm_saved]] · [[trapframe]] · [[xv6 시스템 콜 경로]]\n* [[레지스터]] · [[RISC-V]] · [[alarmtest]] · [[과제1 xv6 alarm]] · [[퀴즈1 복기]]"
 },
 "alarmtest": {
  "title": "alarmtest (test0 ~ test3)",
  "category": [
   "과제1",
   "용어"
  ],
  "body": "'''`alarmtest`'''(`user/alarmtest.c`)는 [[과제1 xv6 alarm|과제 1]]의 '''공식 채점 프로그램'''이다. test0부터 test3까지 네 단계로 나뉘어, 각 단계가 구현의 서로 다른 조각을 검사한다. \"Your solution is correct if it passes `alarmtest` and `usertests -q`.\"\n\n{analogy}\n`alarmtest`는 '''운전면허 코스 시험'''이다. test0은 \"시동 걸기\", test1은 \"출발해서 원래 차선으로 복귀\", test2는 \"앞차가 있으면 끼어들지 않기\", test3은 \"정지 신호에 멈추기\". 하나라도 빠지면 도로에 나갈 수 없고, 각 코스가 '''정확히 어떤 코드 한 줄을 검사하는지'''가 대응된다.\n{/analogy}\n\n[[img:A1-3.png|Assignment 1 PDF p.3 — test0: invoke handler와 힌트 목록|medium]]\n\n== 네 단계 ==\n\n{| class=\"table\"\n! 테스트 || 배점 || 검사하는 것 || 통과에 필요한 코드\n|-\n| '''test0''' — invoke handler || 20 || `sigalarm(2, periodic)` 후 \"alarm!\"이 '''한 번이라도''' 찍히나 || `p->trapframe->[[epc]] = [[alarm_handler]]`. '''이후 crash해도 통과'''\n|-\n| '''test1''' — resume interrupted code || 20 || 알람 후 '''원래 명령어로 복귀'''하고 '''레지스터가 온전'''한가, 그리고 '''주기적으로''' 울리는가 || [[alarm_saved]] 통째 저장/복원 + '''[[a0 복원]]''' + re-arm([[alarm_elapsed]] = 0)\n|-\n| '''test2''' — re-entrancy || 10 || 핸들러가 '''중첩 호출되지 않는가''' || '''[[재진입 금지]]''' ([[alarm_active]] 가드)\n|-\n| '''test3''' || 10 || `sigalarm(0, 0)` 후 '''알람이 멈추는가''' || 조건이 [[alarm_interval]] `> 0`일 것\n|-\n| `usertests -q` || 20 || 커널의 '''다른 부분을 망가뜨리지 않았나''' || 알람 코드가 `which_dev == 2` 안에만 있을 것\n|}\n\n{tip}\n'''test0은 일부러 관대하다.''' 과제 PDF: \"Don't worry yet what happens after the \"alarm!\" output; '''it's OK for now if your program crashes''' after printing alarm!\". 즉 '''epc 바꿔치기 한 줄'''만 되면 20점이다. 나머지 60점이 \"제대로 돌아오기\"에 걸려 있다.\n{/tip}\n\n== 기대 출력 ==\n\n<pre class=\"sh\">\n$ alarmtest\ntest0 start\n........alarm!\ntest0 passed\ntest1 start\n...alarm!\n..alarm!\n...alarm!\n..alarm!\ntest1 passed\ntest2 start\n..............alarm!\ntest2 passed\ntest3 start\ntest3 passed\n$ usertests -q\n...\nALL TESTS PASSED\n$\n<\/pre>\n\n{warn}\n점('''`.`''')의 개수는 PDF 예시와 달라도 '''정상'''이다. 호스트가 빠르면 tick 사이에 루프가 더 많이 돌아 점이 더 찍힌다. '''`testN passed` 줄만 맞으면 된다.'''\n{/warn}\n\n== 실패 증상으로 원인 역추적하기 ==\n\n{| class=\"table\"\n! 증상 || 원인\n|-\n| test0부터 실패, \"alarm!\"이 안 찍힘 || 조건을 `alarm_handler != 0`으로 썼다 ('''핸들러 주소가 0일 수 있음''') / [[epc]] 대신 [[sepc]]를 직접 건드렸다\n|-\n| test0 통과, test1에서 crash || [[alarm_saved]] 복원 누락 — 핸들러가 [[sigreturn]] 없이 끝나면 `ra`로 튄다\n|-\n| test0 통과, 알람이 '''한 번만''' 울림 || [[sigreturn]]에서 `alarm_active = 0` 누락, 또는 re-arm([[alarm_elapsed]] = 0) 누락\n|-\n| test1 \"failed\" || '''[[a0 복원]] 누락''' — `return 0;`으로 뒀다\n|-\n| test2 실패 || '''[[재진입 금지]]''' 가드 누락\n|-\n| test3 실패 || `sigalarm(0,0)` 후에도 분기를 탄다 — 조건이 [[alarm_interval]] 기준이 아니다\n|-\n| `usertests` 실패 || 알람 코드를 `which_dev == 2` 바깥이나 `yield()` 뒤에 뒀다\n|}\n\n== make grade ==\n\n<pre class=\"sh\">\n$ make grade\n== Test alarmtest: test0 ==   alarmtest: test0: OK (20)\n== Test alarmtest: test1 ==   alarmtest: test1: OK (20)\n== Test alarmtest: test2 ==   alarmtest: test2: OK (10)\n== Test alarmtest: test3 ==   alarmtest: test3: OK (10)\n== Test usertests -q ==       usertests: OK (20)\nScore: 80/80\n<\/pre>\n\n{tip}\n`make grade`에는 '''`python3`이 필요'''하다. 과제용 Docker 이미지에는 없을 수 있어 `apt-get install python3`이 필요하고, zip을 풀어서 채점할 때는 `grade-lab-traps`의 실행 권한이 사라지므로 `chmod +x grade-lab-traps`를 먼저 해야 한다.\n{/tip}\n\n== 퀴즈 5번은 alarmtest의 변형이다 ==\n\n{exam}\n'''퀴즈 1의 5번(30점)은 \"This xv6 test is '''adapted from alarmtest.c'''\"라고 명시했다.''' 즉 `alarmtest`의 각 테스트가 '''무엇을 왜 검사하는지'''를 이해했다면 출력 예측이 가능하도록 설계된 문제다.\n* `count=3 sum=6` ← test1의 \"주기적으로 울린다\"\n* `i==j: 1` ← test1의 \"레지스터가 온전하다\" (= [[a0 복원]]이 되어 있다는 증거)\n* `after=3` ← test3의 \"`sigalarm(0,0)`이 멈춘다\"\n자세한 풀이는 [[퀴즈1 복기]].\n{/exam}\n\n== 관련 문서 ==\n* [[과제1 xv6 alarm]] · [[sigalarm]] · [[sigreturn]] · [[재진입 금지]] · [[a0 복원]]\n* [[alarm_interval]] · [[alarm_handler]] · [[alarm_elapsed]] · [[alarm_active]] · [[alarm_saved]]\n* [[usertrap]] · [[which_dev]] · [[xv6]] · [[퀴즈1 복기]]"

 "xv6 시스템 콜 경로": {
  "title": "xv6 시스템 콜 경로 (user.h → sret)",
  "category": [
   "과제1",
   "4강 LDE"
  ],
  "body": "'''xv6 시스템 콜 경로'''는 유저가 `sigalarm(2, periodic)`이라고 쓴 한 줄이 '''커널 함수 `sys_sigalarm()`까지 갔다가 돌아오는''' 전체 왕복 경로다. [[과제1 xv6 alarm|과제 1]]에서 파일 9개를 고쳐야 하는 이유가 이 경로에 전부 들어 있다.\n\n{analogy}\n이 경로는 '''국제 택배'''다. 발송장 양식(`user.h`) → 창구에서 송장 번호 붙이기(`usys.S`의 `a7`) → 세관 통과(`ecall` = [[트랩]]) → 분류 센터(`syscall()`이 번호로 분류) → 담당 창구(`sys_sigalarm`) → 다시 세관(`sret`) → 수령. '''중간에 한 군데라도 서류가 빠지면 소포는 사라진다''' — 그래서 9개 파일을 전부 고쳐야 한다.\n{/analogy}\n\n== 전체 경로 ==\n\n<pre class=\"ascii\">\n user/user.h        int sigalarm(int ticks, void (*handler)());   ← 프로토타입 (C 컴파일러용)\n       │\n user/usys.pl  ─생성→  user/usys.S:   sigalarm:\n                                        li a7, SYS_sigalarm     ← 번호를 a7 에\n                                        ecall                   ← ★ 트랩 (user → kernel)\n                                        ret\n       │\n ══════════════════ 여기서 모드가 user → supervisor 로 바뀐다 ═══════════════════\n       │\n trampoline.S  uservec:  유저 레지스터 31개 → p->trapframe\n                         커널 스택 / 커널 페이지 테이블로 전환  →  jr t0\n       │\n kernel/trap.c  usertrap():\n                  p->trapframe->epc = r_sepc();     ← 끊긴 PC 대피\n                  if (r_scause() == 8) {            ← 8 = U-mode ecall\n                      p->trapframe->epc += 4;       ← ecall 다음 명령어로\n                      syscall();\n                  }\n       │\n kernel/syscall.h   #define SYS_sigalarm 22                       ← 번호 정의\n kernel/syscall.c   syscall():\n                      num = p->trapframe->a7;                     ← 번호 읽기\n                      p->trapframe->a0 = syscalls[num]();         ← ★ 디스패치 + a0 덮어쓰기\n       │\n kernel/sysproc.c   sys_sigalarm():\n                      argint(0, &n);  argaddr(1, &handler);       ← 인자는 trapframe 의 a0, a1\n                      p->alarm_interval = n; …\n                      return 0;\n       │\n kernel/trap.c  usertrapret():  w_sepc(p->trapframe->epc)         ← 복귀 주소 세팅\n       │\n trampoline.S  userret:  p->trapframe → 레지스터 31개 복원  →  sret\n       │\n ══════════════════ 모드가 supervisor → user 로 돌아온다 ════════════════════════\n       │\n 유저 코드:  sigalarm() 호출 다음 줄부터 계속, 반환값은 a0 에\n<\/pre>\n\n== 레지스터 규약 ==\n\n{| class=\"table\"\n! 역할 || 레지스터 || 비고\n|-\n| 시스템 콜 '''번호''' || '''`a7`''' || x86의 `%eax`에 해당\n|-\n| 인자 1~6 || `a0` ~ `a5` || `argint`/`argaddr`/`argstr`가 [[trapframe]]에서 꺼냄\n|-\n| '''반환값''' || '''[[a0]]''' || `syscall()`이 `p->trapframe->a0 = 결과`로 씀 → [[a0 복원]] 문제의 원인\n|-\n| 트랩 원인 || `scause` (CSR) || `8` = Environment call from U-mode\n|-\n| 끊긴 PC || [[sepc]] (CSR) → [[epc]] ([[trapframe]]) || [[과제1 xv6 alarm|알람]]이 바꾸는 곳\n|}\n\n== 고쳐야 하는 파일 9개 ==\n\n{| class=\"table\"\n! 파일 || 무엇을 || 빠뜨리면\n|-\n| `Makefile` || `UPROGS += $U/_alarmtest` || `alarmtest` 명령이 없음\n|-\n| `user/user.h` || 프로토타입 || 컴파일 에러 (implicit declaration)\n|-\n| '''[[usys.pl]]''' || `entry(\"sigalarm\");` || 링크 에러 — 스텁이 생성되지 않음\n|-\n| `kernel/syscall.h` || `#define SYS_sigalarm 22` || `usys.S`가 번호를 모름\n|-\n| `kernel/syscall.c` || `extern` + `syscalls[]` 등록 || \"unknown sys call 22\"\n|-\n| `kernel/sysproc.c` || `sys_sigalarm` 구현 || 링크 에러\n|-\n| `kernel/proc.h` / `proc.c` || 필드 추가 + 초기화 || 쓰레기 값으로 알람이 멋대로 터짐\n|-\n| '''`kernel/trap.c`''' || [[usertrap]]의 타이머 분기 || 알람이 아예 안 울림\n|}\n\n{tip}\n앞의 5개(Makefile ~ syscall.c)는 '''[[시스템 콜 추가 절차]]'''(3강 p.30–34)와 '''글자 그대로 동일'''하다. 과제 PDF도 \"Refer 3-From_Program_to_Process\"라고 못 박았다. 3강을 복습하면 절반이 끝난다.\n{/tip}\n\n[[sim:syscall_trap]]\n\n== 4강 이론과의 대응 ==\n\n{| class=\"table\"\n! 4강 슬라이드 || [[xv6]] 구현\n|-\n| Trap instruction || `ecall`\n|-\n| [[트랩 테이블]] || `stvec` CSR + `usertrap()`의 `scause` 분기\n|-\n| syscall number k || `a7`의 값 → `syscalls[]` 배열 인덱스\n|-\n| 커널 스택에 저장된 user state || '''[[trapframe]]'''\n|-\n| [[return-from-trap]] || '''[[sret]]'''\n|-\n| jump to PC after trap || [[sepc]] ← `p->trapframe->[[epc]]` (`ecall`이라 +4된 값)\n|}\n\n{quiz}\n`sys_sigalarm()`이 `return 0;` 하면 그 `0`은 어떻게 유저에게 전달되는가?\n{/quiz}\n{answer}\n`syscall()`이 `p->trapframe->[[a0]] = syscalls[num]();`으로 '''[[trapframe]]의 `a0` 칸에 써 넣고''', 나갈 때 `userret`이 그 칸의 값을 실제 [[a0]] 레지스터로 복원한다. 즉 반환값은 '''메모리(trapframe)를 경유해''' 레지스터가 된다. 이 경로 때문에 [[sigreturn]]에서 [[a0 복원]] 문제가 생긴다.\n{/answer}\n\n== 관련 문서 ==\n* [[시스템 콜]] · [[시스템 콜 추가 절차]] · [[트랩]] · [[usertrap]] · [[usertrapret]] · [[sret]]\n* [[trapframe]] · [[epc]] · [[sepc]] · [[a0]] · [[a0 복원]] · [[usys.pl]] · [[myproc]]\n* [[과제1 xv6 alarm]] · [[sigalarm]] · [[sigreturn]] · [[xv6]] · [[RISC-V]]"
 },
 "which_dev": {
  "title": "which_dev",
  "category": [
   "과제1",
   "4강 LDE",
   "용어"
  ],
  "body": "'''`which_dev`'''는 [[usertrap]]의 지역 변수로, '''`devintr()`가 판별한 인터럽트의 종류'''를 담는다. `2`이면 [[타이머 인터럽트]]라는 [[xv6]]의 약속이며, [[과제1 xv6 alarm|과제 1]]의 알람 코드는 '''`which_dev == 2` 분기 안에만''' 들어간다.\n\n{def}\n`devintr()` 반환값 — '''0''' = 알 수 없는 트랩 / '''1''' = 다른 장치 (UART, 디스크) / '''2''' = '''타이머'''.\n과제 PDF 힌트: \"You only want to manipulate a process's alarm ticks if there's a timer interrupt; you want something like `if(which_dev == 2) ...`\"\n{/def}\n\n{analogy}\n`which_dev`는 '''응급실 접수 데스크의 분류 코드'''다. 환자가 왜 왔는지(`scause`)는 구급차가 적어 온 '''표준 코드'''지만, 병원 내부에서 쓰는 \"1번 = 일반, 2번 = 심정지\" 같은 '''자체 분류 번호'''가 따로 있다. `which_dev`가 그 자체 번호다.\n{/analogy}\n\n== scause와는 다른 번호 체계다 ⭐ ==\n\n{| class=\"table\"\n! || '''`scause`''' || '''`which_dev`'''\n|-\n| 누가 정했나 || '''하드웨어''' ([[RISC-V]] 명세) || '''소프트웨어''' ([[xv6]]의 `devintr()`)\n|-\n| 어디에 있나 || CSR 레지스터 || `usertrap()`의 지역 변수\n|-\n| 값의 예 || `8` = U-mode ecall, `12/13/15` = page fault, (bit63=1) `5` = timer, `9` = external || `0` = 모름, `1` = UART/디스크, '''`2` = 타이머'''\n|-\n| 쓰이는 분기 || `if (r_scause() == 8)` — 시스템 콜 || `if (which_dev == 2)` — 타이머 ([[과제1 xv6 alarm|알람]])\n|}\n\n<pre class=\"ascii\">\n   scause (64비트)\n   ┌─┬──────────────────────────────────────────────┐\n   │I│              exception code                  │\n   └─┴──────────────────────────────────────────────┘\n   bit63 = 1 → Interrupt  (비동기: 타이머, 디스크, UART …)\n   bit63 = 0 → Exception  (동기: 명령어 실행의 결과)\n\n   ⇒ 4강 p.10~12의 synchronous / asynchronous 구분이\n     하드웨어 명세에 \"비트 하나\"로 박혀 있는 것.\n\n   devintr() 가 이 scause 를 읽어 종류를 판별한 뒤\n   0 / 1 / 2 로 요약해 주는 것이 which_dev.\n<\/pre>\n\n== usertrap에서의 위치 ==\n\n<pre class=\"c\">\nint which_dev = 0;\n...\nif(r_scause() == 8){                             // 1  시스템 콜\n    ...\n    syscall();\n} else if((which_dev = devintr()) != 0){         // 2  장치 인터럽트 — 판별만\n    // 처리는 devintr() 안에서 끝남\n} else {\n    setkilled(p);                                // 3  page fault 등 → 죽임\n}\n\nif(killed(p)) exit(-1);\n\nif(which_dev == 2){                              // 4  ★ 타이머였으면\n    /* Assignment 1 알람 코드가 들어가는 자리 */\n    yield();\n}\nusertrapret();\n<\/pre>\n\n{warn}\n'''알람 코드가 2행이 아니라 4행에 들어가는 이유:'''\n* 2행은 '''판별만''' 하는 자리다. 실제 \"타이머였으니 CPU를 양보한다\"는 결정은 4행에서 한다.\n* 4행은 '''`killed(p)` 검사를 통과한 뒤'''라, 죽을 프로세스에 알람을 걸지 않는다.\n* 그리고 반드시 '''`yield()` 앞'''이어야 한다 — `yield()`는 [[컨텍스트 스위치]]를 일으켜 한참 뒤에야 돌아오거나 아예 안 돌아올 수 있다.\n{/warn}\n\n{tip}\n\"`which_dev == 2`일 때만 센다\"는 것이 곧 '''\"[[alarm_elapsed]]는 CPU 시간을 센다\"'''는 뜻이다. 이 프로세스가 유저 모드로 돌다가 걸린 타이머만 세므로, 자고 있는 동안의 tick은 포함되지 않는다.\n{/tip}\n\n{quiz}\n알람 코드를 `which_dev` 검사 없이 [[usertrap]] 맨 앞에 넣으면 어떻게 되는가?\n{/quiz}\n{answer}\n'''시스템 콜이나 page fault로 들어올 때마다 [[alarm_elapsed]]가 증가'''한다. `sigalarm(2, fn)`을 걸어 두면 `printf` 두 번만 해도 알람이 터지므로, \"n tick의 '''CPU 시간'''마다\"라는 사양이 깨진다. `usertests`의 여러 테스트가 예상 못 한 지점에서 핸들러로 튀어 '''대량 실패'''한다.\n{/answer}\n\n== 관련 문서 ==\n* [[usertrap]] · [[yield]] · [[타이머 인터럽트]] · [[인터럽트]] · [[트랩]]\n* [[alarm_elapsed]] · [[재진입 금지]] · [[과제1 xv6 alarm]] · [[xv6]] · [[RISC-V]]"
 },
 "yield": {
  "title": "yield()",
  "category": [
   "4강 LDE",
   "과제1",
   "용어"
  ],
  "body": "'''`yield()`'''는 프로세스가 '''CPU를 자발적으로 놓는''' 함수다. 4강 [[협력적 방식]]에서는 \"이것만 하는 시스템 콜\"로 등장하고, [[xv6]]에서는 [[타이머 인터럽트]] 처리의 마지막 단계로 [[usertrap]]이 '''강제로''' 부른다.\n\n{def}\n\"`yield()` does '''nothing except to transfer control to the OS'''.\" (4강 p.26)\n[[xv6]]에서는 시스템 콜이 아니라 커널 내부 함수이며, `usertrap()`이 `which_dev == 2`(타이머)일 때 호출한다.\n{/def}\n\n{analogy}\n`yield()`는 '''\"저 먼저 안 가도 돼요\"라고 말하며 줄에서 물러나는 것'''이다. 4강의 [[협력적 방식]]에서는 이게 '''예의'''에 기대는 시스템이었고(안 물러나면 방법이 없다), [[비협력적 방식]]에서는 '''경비원이 팔을 잡아 끌어내며''' 대신 말해 준다 — [[타이머 인터럽트]]가 그 경비원이다.\n{/analogy}\n\n== 두 가지 얼굴 ==\n\n{| class=\"table\"\n! || 4강 [[협력적 방식]]의 `yield()` || [[xv6]]의 `yield()`\n|-\n| 누가 부르나 || '''유저 프로그램'''이 자발적으로 || '''커널의 [[usertrap]]'''이 타이머 인터럽트 때\n|-\n| 정체 || 시스템 콜 || 커널 내부 함수\n|-\n| 안 부르면 || OS가 통제권을 못 찾음 → 재부팅 || 상관없음 (타이머가 강제)\n|}\n\n== xv6 구현 ==\n\n<pre class=\"c\">\n// kernel/proc.c\nvoid\nyield(void)\n{\n  struct proc *p = myproc();\n  acquire(&p->lock);\n  p->state = RUNNABLE;    // 1  Running → Ready\n  sched();                // 2  → swtch(&p->context, &mycpu()->context)\n  release(&p->lock);      // 3  ← 다시 스케줄될 때 여기로 \"돌아온다\"\n}\n<\/pre>\n\n* 1행 — [[프로세스 상태]] 전이. \"나는 이제 실행 중이 아니라 준비됨\".\n* 2행 — `sched()`가 [[컨텍스트 스위치]]를 일으켜 '''[[스케줄러]] 스레드'''로 넘어간다. 스케줄러가 다음 RUNNABLE 프로세스를 골라 또 `swtch`한다.\n* 3행 — '''이 줄은 지금 실행되지 않는다.''' 한참 뒤 이 프로세스가 다시 선택되면 `swtch`가 \"리턴한 것처럼\" 여기서 재개된다.\n\n<pre class=\"ascii\">\n   Process A (user)\n        │ timer interrupt\n        ▼\n   usertrap()  →  if (which_dev == 2) { [알람 코드] ; yield(); }\n                                                        │\n                                                        ▼\n                                  p->state = RUNNABLE ; sched()\n                                                        │ swtch\n                                                        ▼\n                                          scheduler()  (CPU 전용 스레드)\n                                                        │ 다음 RUNNABLE 선택\n                                                        ▼ swtch\n                                          Process C 의 커널 흐름 재개\n                                                        │\n                                                        ▼ usertrapret → sret\n                                          Process C (user)\n<\/pre>\n\n== 과제 1에서의 순서 ⭐ ==\n\n{warn}\n'''알람 코드는 반드시 `yield()` '''앞'''에 와야 한다.'''\n<pre class=\"c\">\nif (which_dev == 2) {\n    /* ★ 알람 코드 — 여기 */\n    yield();          /* ← 이 뒤에 쓰면 안 됨 */\n}\n<\/pre>\n`yield()`는 [[컨텍스트 스위치]]를 일으켜 '''한참 뒤에야 돌아오거나, 프로세스가 죽으면 아예 안 돌아온다'''. 그 뒤에서 [[epc]]를 바꾸면 이미 다른 프로세스가 여러 번 돌고 온 뒤이고, [[trapframe]]의 상태에 대한 가정이 깨진다.\n{/warn}\n\n{tip}\n그래도 `yield()`가 '''알람 코드 뒤에''' 남아 있어야 한다는 점도 중요하다 — 알람을 위해 `yield()`를 '''지워 버리면''' 타이머 인터럽트가 와도 [[컨텍스트 스위치]]가 일어나지 않아 [[비협력적 방식]]이 무너지고, `usertests`가 대량으로 실패한다.\n{/tip}\n\n{quiz}\n`yield()`를 부른 프로세스는 어떤 [[프로세스 상태|상태]]가 되는가? 그리고 `sleep()`과 무엇이 다른가?\n{/quiz}\n{answer}\n'''`RUNNABLE`(= Ready)''' — 즉시 다시 스케줄될 자격이 있다. `sleep()`은 '''`SLEEPING`(= Blocked)'''이 되어 누군가 `wakeup()`을 해 줄 때까지 스케줄 대상에서 '''제외'''된다. [[타이머 인터럽트]]의 `yield()`는 \"차례를 양보\"할 뿐 \"기다릴 일이 있다\"는 뜻이 아니므로 RUNNABLE이 맞다.\n{/answer}\n\n[[sim:context_switch]]\n\n== 관련 문서 ==\n* [[협력적 방식]] · [[비협력적 방식]] · [[타이머 인터럽트]] · [[컨텍스트 스위치]] · [[스케줄러]]\n* [[usertrap]] · [[which_dev]] · [[myproc]] · [[프로세스 상태]] · [[선점]]\n* [[과제1 xv6 alarm]] · [[제한적 직접 실행]]"
 },
 "usys.pl": {
  "title": "user/usys.pl",
