<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1fa463" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한입 학습">
<title>운영체제 기말 · 한입 학습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f6f7f4; --card: #ffffff; --fg: #1f2a24; --muted: #6b7570; --line: #e1e5df;
  --acc: #1fa463; --acc-d: #15804c; --acc-soft: #dff4e8;
  --red: #e5484d; --red-soft: #fde4e4; --gold: #f2b01e; --blue: #3478f6;
  --chip: #ffffff; --chip-b: #d7dcd5; --shadow: 0 2px 0 rgba(0,0,0,.08);
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --card: #1c221f; --fg: #e8ece9; --muted: #96a09a; --line: #2e3632;
    --acc: #2fc27a; --acc-d: #22955c; --acc-soft: #173826; --red: #ff6b6e; --red-soft: #3a1d1e;
    --gold: #f5c04a; --chip: #232a26; --chip-b: #3a443f; --shadow: 0 2px 0 rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--line); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; } .hidden { display: none; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
#top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: calc(8px + var(--sa-t)) 12px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.cswitch { border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 40px; padding: 0 10px; font-weight: 700; font-size: 14px; max-width: 42%; display: flex; align-items: center; cursor: pointer; }
.ctitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hstats { display: flex; align-items: center; gap: 8px; }
.hs { display: flex; align-items: center; gap: 2px; font-size: 15px; }
.hs b { font-variant-numeric: tabular-nums; }
.hs.goal { border: 0; background: none; padding: 0; min-width: 40px; min-height: 40px; justify-content: center; cursor: pointer; }
#view { flex: 1; padding: 12px 14px calc(84px + var(--sa-b)); }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--sa-b); }
#tabs button { flex: 1; max-width: 140px; min-height: 56px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); cursor: pointer; }
#tabs button i { font-style: normal; font-size: 22px; line-height: 1.1; }
#tabs button.on { color: var(--acc); font-weight: 700; }
body.insession #top, body.insession #tabs { display: none; }
body.insession #view { padding-bottom: 12px; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin: 8px 0 0; padding: 10px 16px; border-radius: 14px;
  border: 2px solid var(--chip-b); background: var(--card); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--fg); cursor: pointer; box-shadow: var(--shadow); }
.btn.primary { background: var(--acc); border-color: var(--acc-d); color: #fff; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.btn.ghost.danger { color: var(--red); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; }
.link { border: 0; background: none; color: var(--blue); padding: 8px 0; min-height: 40px; cursor: pointer; }

/* path */
.exam { margin: 0 0 10px; }
.duecard { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; border: 2px solid var(--gold); background: var(--card); cursor: pointer; }
.duecard span { font-size: 13px; color: var(--muted); }
.unit { margin-bottom: 18px; }
.uhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; color: #fff; background: var(--u); box-shadow: 0 3px 0 var(--ud); }
.utitle { font-weight: 800; font-size: 17px; } .udesc { font-size: 13px; opacity: .9; }
.uprog { font-weight: 700; font-size: 14px; background: rgba(255,255,255,.22); padding: 2px 10px; border-radius: 99px; white-space: nowrap; }
.hue0 { --u: #1fa463; --ud: #15804c; } .hue1 { --u: #3478f6; --ud: #2459bd; } .hue2 { --u: #b4579f; --ud: #87407a; }
.hue3 { --u: #e07a1f; --ud: #a95a14; } .hue4 { --u: #0f9fa8; --ud: #0b767c; } .hue5 { --u: #6f5bd6; --ud: #5243a5; }
.nodes { display: flex; flex-direction: column; align-items: center; padding: 14px 0 4px; }
.nwrap { position: relative; display: flex; flex-direction: column; align-items: center; width: 120px; margin: 6px 0; }
.node { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; position: relative; padding: 0;
  background: conic-gradient(var(--u) var(--p), var(--line) 0); display: flex; align-items: center; justify-content: center; }
.node > span { width: 60px; height: 60px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: var(--u); box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.node.done > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
.node.gold > span { background: var(--gold); color: #fff; }
.node.fresh { opacity: .75; }
.node.rec { animation: pulse 1.6s ease-in-out infinite; }
.node.rec > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--u) 50%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }
.bubble { position: absolute; top: -26px; background: var(--card); border: 2px solid var(--u); color: var(--u); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 10px; z-index: 1; }
.crown { position: absolute; top: 50px; right: 12px; font-size: 12px; font-weight: 800; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 0 5px; }
.nlabel { font-size: 13px; text-align: center; margin-top: 4px; line-height: 1.25; max-width: 120px; }
.pend { text-align: center; margin: 10px 0; }
.lmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 0; font-size: 14px; }

/* modal / toast */
#modal { display: none; position: fixed; inset: 0; z-index: 20; }
#modal.show { display: block; }
.mback { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.mbox { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto; background: var(--card);
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(16px + var(--sa-b)); animation: up .18s ease-out; }
.mbox h3 { margin: 4px 0 8px; font-size: 19px; }
.big { font-size: 56px; text-align: center; line-height: 1.2; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.crow { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px; margin: 6px 0; border-radius: 12px; border: 2px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 700; }
.crow.me { border-color: var(--acc); background: var(--acc-soft); }
.crow .muted { font-weight: 400; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(80px + var(--sa-b)); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; z-index: 30;
  background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; transition: .2s; }
#toast.show { opacity: 1; transform: translateX(-50%); }
textarea.rep { width: 100%; height: 42vh; margin-top: 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px; }

/* lesson */
.lesson { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.lbar { display: flex; align-items: center; gap: 10px; }
.x { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.prog { flex: 1; height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pfill { height: 100%; background: var(--acc); border-radius: 99px; transition: width .3s; }
.lh { font-weight: 700; min-width: 44px; text-align: right; }
.qbody { flex: 1; padding: 10px 2px; }
.qtype { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; color: var(--acc); margin-bottom: 6px; }
.prof { color: #a35b00; background: #fff0d6; border-radius: 99px; padding: 0 8px; font-weight: 700; }
@media (prefers-color-scheme: dark) { .prof { color: #ffcf7a; background: #3a2c12; } }
.combo { color: var(--gold); } .again { color: var(--red); }
.q { font-size: 19px; font-weight: 700; line-height: 1.5; margin: 4px 0 16px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 56px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); }
.choice.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.cnum { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--chip-b); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.tfrow { display: flex; gap: 12px; }
.tf { flex: 1; min-height: 140px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); }
.tfbig { font-size: 56px; font-weight: 900; line-height: 1; }
.tf.t .tfbig { color: var(--acc); } .tf.f .tfbig { color: var(--red); }
.tf.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.chip { min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); font-size: 15px; text-align: left; max-width: 100%; }
.chip.used { visibility: hidden; }
.chip.mini { min-width: 48px; text-align: center; }
.cloze { line-height: 2.2; }
.slot { display: inline-block; min-width: 64px; min-height: 40px; margin: 2px 2px; padding: 2px 10px; border-radius: 10px; border: 2px solid var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--chip)); font-size: 15px; font-weight: 700; line-height: 1.4; vertical-align: middle; cursor: pointer; max-width: 100%; }
.slot.empty { border-style: dashed; border-color: var(--chip-b); background: transparent; color: var(--muted); font-weight: 400; }
.seq { min-height: 120px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 2px dashed var(--chip-b); border-radius: 14px; }
.chip.step { display: flex; align-items: center; gap: 8px; width: 100%; border-color: var(--blue); }
.snum { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mitem { min-height: 56px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; font-size: 14px; box-shadow: var(--shadow); text-align: center; }
.mitem.r { font-size: 13px; }
.mitem.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.mitem.ok { border-color: var(--acc); background: var(--acc-soft); opacity: .55; box-shadow: none; }
.mitem.bad { border-color: var(--red); background: var(--red-soft); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.inp { width: 100%; min-height: 54px; font-size: 18px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); color: var(--fg); }
.inp:focus { outline: none; border-color: var(--blue); }
.inp.sm { min-height: 46px; font-size: 15px; }
.numrow { display: flex; gap: 8px; align-items: center; }
.numrow .inp { flex: 1; min-width: 0; }
.unit { font-weight: 700; color: var(--muted); }
.lfoot { position: sticky; bottom: 0; padding: 8px 0 calc(8px + var(--sa-b)); background: var(--bg); }
.lfoot .skip { margin-top: 0; min-height: 40px; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 560px; margin: 0 auto; transform: translateY(110%); transition: transform .2s ease-out;
  padding: 16px 16px calc(14px + var(--sa-b)); border-radius: 20px 20px 0 0; max-height: 75vh; overflow: auto; }
.sheet.show { transform: none; }
.sheet.ok { background: var(--acc-soft); } .sheet.bad { background: var(--red-soft); }
.shead { font-size: 21px; font-weight: 900; margin-bottom: 6px; }
.sheet.ok .shead { color: var(--acc-d); } .sheet.bad .shead { color: var(--red); }
@media (prefers-color-scheme: dark) { .sheet.ok .shead { color: var(--acc); } }
.sans, .sgiven { margin: 4px 0; } .sans b { color: var(--acc-d); } .sgiven b { color: var(--red); }
@media (prefers-color-scheme: dark) { .sans b { color: var(--acc); } }
.sexp { margin: 8px 0; font-size: 15px; }
.smeta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.smeta a { font-weight: 700; padding: 6px 0; }

/* result */
.result { text-align: center; padding: calc(30px + var(--sa-t)) 4px 10px; }
.result h2 { margin: 6px 0 10px; }
.pill { display: inline-block; margin: 4px; padding: 4px 12px; border-radius: 99px; background: var(--acc-soft); font-weight: 700; font-size: 14px; }
.pill.gold { background: #fff0c2; color: #7a5600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 8px; text-align: center; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; }
.tk { font-size: 13px; color: var(--muted); } .tv { font-size: 21px; font-weight: 800; }
.xpbreak { margin-bottom: 8px; }

/* pages */
.page h2 { margin: 4px 0 12px; }
.ptop { display: flex; align-items: center; gap: 8px; } .ptop h2 { margin: 4px 0; }
.back { border: 0; background: none; color: var(--blue); font-size: 16px; min-height: 44px; padding: 0 6px 0 0; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 0; }
.ctop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { background: var(--acc-soft); color: var(--acc-d); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 99px; white-space: nowrap; }
.badge.red { background: var(--red-soft); color: var(--red); }
.tagrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 44px; gap: 8px; align-items: center; width: 100%; min-height: 48px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; padding: 0; }
.tname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.tbar { display: block; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.tbar.wide { height: 12px; margin-top: 3px; }
.tpct { font-size: 13px; text-align: right; font-weight: 700; }
.ubar { margin: 10px 0; } .ulabel { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0 6px; }
.hm { aspect-ratio: 1; border-radius: 8px; background: var(--line); position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.hm i { position: absolute; top: -2px; right: -2px; font-style: normal; font-size: 11px; }
.hm.l1 { background: color-mix(in srgb, var(--acc) 30%, var(--line)); } .hm.l2 { background: color-mix(in srgb, var(--acc) 55%, var(--line)); }
.hm.l3 { background: color-mix(in srgb, var(--acc) 80%, var(--line)); color: #fff; } .hm.l4 { background: var(--acc-d); color: #fff; }
.hm.today { outline: 2px solid var(--blue); }
.topmiss { padding: 10px 0; border-bottom: 1px solid var(--line); }
.tmq { display: flex; gap: 8px; font-weight: 600; font-size: 15px; }
.rank { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--red-soft); color: var(--red); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.miss .mq { font-weight: 600; margin: 6px 0; }
.mexp { padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.seg button { min-height: 46px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; cursor: pointer; font-size: 14px; }
.seg button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
.fld { display: block; margin: 8px 0; } .fld span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.warn { background: #fff4d6; color: #6b4b00; border-radius: 10px; padding: 8px 10px; }
@media (prefers-color-scheme: dark) { .warn { background: #3a2f12; color: #ffd98a; } .pill.gold { background: #3a2f12; color: #ffd98a; } }
.katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
#probe { display: none; }

/* ---------- hub / shared extras ---------- */
.hs.moon { border: 0; background: none; font-size: 20px; min-width: 40px; min-height: 40px; padding: 0; cursor: pointer; }
#top .cswitch { flex: 1 1 auto; min-width: 0; max-width: none; }
#top .hstats { flex: none; gap: 6px; }
#focusbar { display: none; }
#focusbar.show { display: flex; position: sticky; top: calc(57px + var(--sa-t)); z-index: 4; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; background: var(--acc-soft); font-size: 14px; font-weight: 700; }
#focusbar button { border: 1px solid var(--chip-b); background: var(--card); border-radius: 10px; min-height: 36px; padding: 0 10px; cursor: pointer; }
body.insession #focusbar { display: none; }
.cchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; padding-bottom: 2px; scrollbar-width: none; }
.cchips button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; font-size: 14px; cursor: pointer; }
.cchips button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.row2.slim { margin-bottom: 10px; } .row2.slim .btn { min-height: 42px; font-size: 14px; margin-top: 0; }
.cbadge { background: var(--line); color: var(--fg); border-radius: 99px; padding: 0 8px; font-size: 12px; font-weight: 700; }
.pill.red { background: var(--red-soft); color: var(--red); }
.card.hl { border: 2px solid var(--acc); }
.crow.big { width: 100%; background: var(--card); cursor: pointer; font: inherit; font-weight: 700; min-height: 60px; }
.wlink { border: 0; background: none; color: var(--blue); font-weight: 700; padding: 6px 0; min-height: 36px; cursor: pointer; font-size: 13px; }
/* today */
.hello { display: flex; justify-content: space-between; align-items: center; }
.hello h2 { margin: 2px 0 8px; font-size: 24px; }
.ddays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 6px 0 12px; }
.dd { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px; text-align: center; min-width: 0; }
.ddn { font-weight: 900; font-size: 18px; color: var(--red); }
.ddc { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ddd { font-size: 11px; }
.tbd { display: block; font-size: 10px; color: var(--gold); font-weight: 800; }
.btn.go { flex-direction: column; min-height: 78px; font-size: 20px; }
.btn.go small { font-size: 13px; font-weight: 600; opacity: .9; }
.split { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.sp { border: 0; background: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 4px 0; min-width: 0; }
.spn { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.btn.bedbtn { background: #2b2118; color: #e6c48f; border-color: #3d2f22; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
ol.check { padding-left: 20px; margin: 8px 0; font-size: 14px; } ol.check li { margin: 6px 0; }
.wrow, .erow { display: grid; grid-template-columns: 1fr 90px 44px; gap: 8px; align-items: center; margin: 6px 0; font-size: 14px; }
.erow { grid-template-columns: 1fr 150px 64px; }
.wrow .inp, .erow .inp { min-height: 42px; padding: 6px 8px; min-width: 0; }
.seg.five { grid-template-columns: repeat(5, 1fr); }
/* wiki viewer */
#wiki { display: none; position: fixed; inset: 0; z-index: 25; background: var(--bg); flex-direction: column; }
#wiki.show { display: flex; }
#wiki iframe { flex: 1; width: 100%; border: 0; background: var(--card); }
.wbar { display: flex; align-items: center; gap: 8px; padding: calc(4px + var(--sa-t)) 8px 4px; border-bottom: 1px solid var(--line); background: var(--card); min-height: 48px; }
.wback { border: 0; background: none; color: var(--blue); font-weight: 700; min-height: 44px; padding: 0 8px; cursor: pointer; font-size: 16px; }
.wtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
.wext { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; }
.woff { background: var(--red-soft); color: var(--red); padding: 10px 12px; font-size: 14px; border-radius: 10px; margin: 8px; }
/* ---------- bed mode: warm, dim, no pure white ---------- */
body.bed {
  --bg: #0a0705; --card: #140e0a; --fg: #c79a5e; --muted: #7a6142; --line: #2a1f16;
  --acc: #9c6a2a; --acc-d: #7a521f; --acc-soft: #20170e; --red: #a8553f; --red-soft: #24130d;
  --gold: #a87c2c; --blue: #b08447; --chip: #120c08; --chip-b: #33261a; --shadow: none;
  font-size: 19px; color-scheme: dark;
}
body.bed .btn.primary, body.bed .btn.danger, body.bed .node.done > span, body.bed .node.rec > span, body.bed .uhead { color: #120c08; }
body.bed .q { font-size: 23px; }
body.bed .choice, body.bed .chip, body.bed .mitem { font-size: 18px; }
body.bed code { background: #241a12; }
body.bed .lesson { justify-content: flex-end; }
body.bed .qbody { flex: 0 1 auto; margin-top: auto; }
body.bed #toast { background: #20170e; color: var(--fg); }
body.bed .prof { background: #2a1d0c; color: #b8893a; }
body.bed .warn { background: #241a0f; color: var(--fg); }
.bedwrap { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.bedtop { text-align: center; padding-top: 6vh; }
.bclock { font-size: 64px; font-weight: 300; letter-spacing: 2px; line-height: 1.1; }
.bedctl { margin-top: auto; padding-bottom: calc(6px + var(--sa-b)); }
.btn.tall { min-height: 76px; font-size: 18px; }
.card-flow .cftop { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
.cfbody { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 4px; }
.cfq { font-size: 24px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
.cflist { padding-left: 24px; margin: 4px 0; } .cflist li { margin: 4px 0; }
.cfback { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.cfans { font-size: 22px; margin-bottom: 8px; } .cfans b { color: var(--acc); margin-right: 6px; }
.cfexp { font-size: 17px; color: var(--muted); margin-bottom: 6px; }
.cfbar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.cfbar i { display: block; height: 100%; width: 0; background: var(--acc); }
.cfrow { display: grid; grid-template-columns: 1fr 76px 1fr; gap: 10px; }
.cfb { min-height: 84px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); font-size: 20px; font-weight: 800; cursor: pointer; color: var(--fg); }
.cfb.no { border-color: var(--red); color: var(--red); } .cfb.yes { border-color: var(--acc); color: var(--acc); }
.cfb.pp { font-size: 26px; }
.sleep { animation: dusk 2.5s ease-out both; }
.moonbig { font-size: 72px; filter: saturate(.5) brightness(.8); }
@keyframes dusk { from { opacity: 0; } to { opacity: 1; } }
body.sleeping { --fg: #8a6a40; --muted: #5a4630; }

/* ---------- 탭만으로 풀기 + mouse friendliness ---------- */
.modechip { margin-left: auto; border: 1px solid var(--chip-b); background: var(--chip); color: var(--fg); border-radius: 99px; min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.selfans { background: var(--card); border: 2px solid var(--acc); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; font-size: 18px; }
.selfans b { color: var(--acc-d); }
.selfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.selfrow .btn { min-height: 64px; font-size: 18px; }
.lfoot .row2.slim { margin-bottom: 4px; }
.lfoot .row2.slim .btn { min-height: 44px; margin-top: 0; font-size: 14px; }
.seg.two { grid-template-columns: 1fr 1fr; }
body.bed .selfans b { color: var(--acc); }
@media (hover: hover) and (pointer: fine) {
  .choice:hover:not(:disabled), .tf:hover:not(:disabled), .mitem:hover:not(:disabled), .chip:hover:not(:disabled), .slot:hover,
  .seg button:hover, .cchips button:hover, .crow:hover, .modechip:hover, .cfb:hover { border-color: var(--blue); }
  .btn:hover:not(:disabled), .node:hover, .duecard:hover, .tagrow:hover, .sp:hover { filter: brightness(1.06); }
  body.bed .btn:hover:not(:disabled), body.bed .cfb:hover { filter: brightness(1.25); }
  .x:hover, .link:hover, .back:hover, .wlink:hover, .wback:hover { text-decoration: underline; }
}

<script type="application/json" id="duo-content">[{"course":{"id":"os","title":"운영체제 기말","subtitle":"CSE304 · Prof. Yongwoo Lee","exam":"기말 범위 13강~21강 + 과제 2·3 · 형식: 용어(full term) + 손으로 돌리기","wiki":"../index.html"},"units":[{"id":"u13","title":"13강 Virtual Memory","desc":"메모리 계층 · 메모리 가상화 · 주소 변환 시점 · base and bounds","lessons":[{"id":"u13a","title":"메모리 계층과 가상화","items":[{"id":"u13a-01","type":"mc","q":"같은 비트 수에서 전력을 더 많이 쓰는 RAM 은?","explain":"SRAM 셀은 항상 전원에 연결돼 static current 가 흐른다. DRAM 은 refresh 때만 주기적으로 전력을 쓴다. 수업 중 교수님이 직접 던진 퀴즈다.","src":"10/19 녹음 08:33","wiki":"SRAM과 DRAM","prof":true,"tags":["SRAM","DRAM"],"choices":["SRAM","DRAM","둘이 같다","NAND Flash"],"answer":0},{"id":"u13a-02","type":"match","q":"RAM 종류와 특징을 연결하시오","explain":"p.4 RAM 두 종류와 p.7 계층. SRAM 은 빠르고 비싸서 캐시, DRAM 은 싸고 refresh 가 필요해서 메인 메모리에 쓴다.","src":"13강 p.4~7","wiki":"메모리 계층","tags":["메모리 계층"],"pairs":[["SRAM","셀당 트랜지스터 4~6개, 캐시에 사용"],["DRAM","커패시터 1개 + 트랜지스터 1개, refresh 필요"],["NAND Flash","비휘발성, DRAM 보다 약 100배 느림"],["레지스터","계층 맨 위 L0"]]},{"id":"u13a-03","type":"cloze","q":"메모리 계층이 통하는 이유는 ___ 이다. 같은 것을 곧 다시 쓰는 것은 ___ locality, 가까운 것을 곧 쓰는 것은 ___ locality 다.","explain":"교수님: \"계층이 통하는 이유는 단 하나, locality.\" temporal = 같은 주소 재사용, spatial = 근처 주소 사용.","src":"13강 p.8~9","wiki":"locality","tags":["locality"],"answer":["principle of locality","temporal","spatial"],"bank":["principle of locality","temporal","spatial","virtualization","physical"]},{"id":"u13a-04","type":"mc","q":"`for (i=0;i\u003cn;i++) sum += a[i];` 에서 `a[i]` 접근이 보여 주는 locality 는?","explain":"a[i] 는 차례로 붙은 주소를 훑으니 spatial 이다. 같은 변수를 계속 쓰는 sum 이 temporal 이다.","src":"13강 p.9","wiki":"locality","tags":["locality"],"choices":["spatial","temporal","둘 다 없음","sum 과 같은 종류"],"answer":0},{"id":"u13a-05","type":"tf","q":"명령어 참조에는 spatial locality 만 있고 temporal locality 는 없다.","explain":"순차 실행은 spatial, 루프를 도는 것은 temporal 이다. 명령어와 데이터 모두 두 locality 를 다 가진다.","src":"13강 p.9","wiki":"locality","tags":["locality"],"answer":false},{"id":"u13a-06","type":"mc","q":"교수님이 말한 CPU 와 메모리를 나눠 쓰는 방식의 차이로 옳은 것은?","explain":"메모리는 바이트 단위로 쪼갤 수 있고, 메모리 내용을 통째로 바꾸는 context switch 는 너무 비싸서 공간으로 나눈다.","src":"10/19 녹음 27:03","wiki":"가상 메모리","prof":true,"tags":["메모리 가상화"],"choices":["CPU 는 temporal(time slice), 메모리는 spatial(공간 분할)","CPU 는 spatial, 메모리는 temporal","둘 다 time slice","둘 다 공간 분할"],"answer":0},{"id":"u13a-07","type":"mc","q":"물리 메모리에 프로세스 하나만 올리는 방식(no virtualization ①)의 단점 두 가지는?","explain":"p.13. 한 프로세스만 있으면 그 프로세스가 I/O 를 기다리는 동안 CPU 가 놀고 남는 메모리도 버려진다. 두 번째 보기는 multiprogramming(p.14)의 문제다.","src":"13강 p.13","wiki":"메모리 가상화","tags":["메모리 가상화"],"choices":["poor CPU utilization, memory space waste","protection issue, 재배치 어려움","external fragmentation, compaction 비용","TLB miss, page fault"],"answer":0},{"id":"u13a-08","type":"tf","q":"Multiprogramming 으로 여러 프로세스를 동시에 메모리에 올리면 protection issue(다른 프로세스 영역에 errant access)가 생긴다.","explain":"p.14 그림에서 C 가 A 영역으로 가는 Errant access 화살표가 이 문제다. 그래서 메모리 보호 메커니즘이 필요하다.","src":"13강 p.14","wiki":"메모리 가상화","tags":["protection"],"answer":true},{"id":"u13a-09","type":"cloze","q":"Virtual Memory = Virtual ___ + Address ___","explain":"p.16. 프로세스마다 private 한 virtual address space 를 주고, OS 가 그것을 물리 메모리에 mapping(address translation)한다.","src":"13강 p.15~16","wiki":"가상 메모리","tags":["메모리 가상화"],"answer":["Address Space","Translation"],"bank":["Address Space","Translation","Segmentation","Relocation"]},{"id":"u13a-10","type":"mc","q":"p.18 메모리 가상화의 Benefits 세 가지에 들어가지 않는 것은?","explain":"이점은 memory efficiency · protection · ease of programming 셋이다. TLB 는 15강 개념이다.","src":"13강 p.18","wiki":"메모리 가상화","prof":true,"tags":["메모리 가상화"],"choices":["Lower TLB miss rate","Memory efficiency","Protection","Ease of programming"],"answer":0},{"id":"u13a-11","type":"tf","q":"교수님은 CPU 가상화의 context switch 메커니즘에 대응하는 메모리 가상화의 메커니즘이 address translation 이라고 했다.","explain":"10/19 녹음: CPU 가상화 = 가상 스레드 + 하드웨어 context + context switch ↔ 메모리 가상화 = physical memory + virtual address space + address translation.","src":"10/19 녹음 30:30","wiki":"가상 메모리","prof":true,"answer":true},{"id":"u13a-12","type":"sa","q":"프로그램이 쓰는 모든 주소는 물리 주소가 아니다. mem.c 의 두 프로세스가 같은 주소를 출력하는 까닭은 그 값이 ___ address 이기 때문이다. 빈칸의 영어 한 단어는?","explain":"p.23~24 \"Every address in a running program is virtual.\" 두 프로세스가 같은 물리 주소를 쓸 수는 없다.","src":"13강 p.23~24","wiki":"가상 주소 공간","tags":["가상 주소 공간"],"answer":"virtual","alts":["virtual address","가상"]},{"id":"u13a-13","type":"cloze","q":"p.18 메모리 가상화의 이점 셋: Memory ___ · ___ · Ease of programming","explain":"10/19 녹음 32:22. efficiency = 여러 프로세스 데이터로 DRAM 을 채움, protection = 남의 메모리 접근 차단, ease of programming = 같은 uniform linear address space.","src":"13강 p.18","wiki":"메모리 가상화","prof":true,"answer":["efficiency","Protection"],"bank":["efficiency","Protection","Transparency","Locality","Flexibility"]}]},{"id":"u13b","title":"주소 공간 · 설계 목표 · 변환 시점","items":[{"id":"u13b-01","type":"match","q":"주소 공간의 세 영역과 담는 것을 연결하시오","explain":"p.21~22. heap 과 stack 은 서로 마주 보며 자란다.","src":"13강 p.21~22","wiki":"가상 주소 공간","tags":["주소 공간"],"pairs":[["Program Code","명령어"],["Heap","malloc/new 로 받는 메모리"],["Stack","return address, 지역 변수, 인자"],["(free)","heap 과 stack 사이 아직 안 쓰는 공간"]]},{"id":"u13b-02","type":"num","q":"virtual address space 의 주소 비트 n = 32 일 때 가상 주소의 개수 N 은 $2^?$ 인가? 지수만 쓰시오.","explain":"p.20: N = $2^n$ 개의 가상 주소. n = 32 면 $2^{32}$.","src":"13강 p.20","wiki":"가상 주소 공간","diff":1,"answer":32,"tol":0},{"id":"u13b-03","type":"match","q":"VM 설계 목표와 뜻을 연결하시오","explain":"p.27 / p.37 Design Goals 넷. Efficiency 는 time 과 space(물리 메모리를 낭비하지 않고 가상화용 메모리도 적게) 둘이다.","src":"13강 p.27","wiki":"VM 설계 목표","tags":["설계 목표"],"pairs":[["Transparency","프로그램이 가상화된 줄 모른다"],["Protection","프로세스끼리 서로 보호"],["Flexibility","프로그래밍을 쉽게"],["Efficiency","시간·공간 낭비가 적다"]]},{"id":"u13b-04","type":"sa","q":"\"The program shouldn't be aware of the fact that memory is virtualized\" 에 해당하는 설계 목표는?","explain":"p.27 의 첫 목표. 프로그램은 0번지부터 시작하는 자기만의 메모리가 있다고 믿는다.","src":"13강 p.27","wiki":"VM 설계 목표","tags":["설계 목표"],"answer":"Transparency"},{"id":"u13b-05","type":"tf","q":"Efficiency 목표의 space efficiency 에는 \"가상화 자체에 메모리를 너무 많이 쓰지 않는 것\"도 들어간다.","explain":"p.27: Space efficiency = (1) 물리 메모리를 낭비하지 않기 (2) 가상화를 위해 너무 많은 메모리를 쓰지 않기. page table 크기 문제(15·16강)가 여기 걸린다.","src":"13강 p.27","wiki":"VM 설계 목표","answer":true},{"id":"u13b-06","type":"match","q":"주소 변환 시점과 결과를 연결하시오","explain":"p.31~36. load time 도 여러 프로그램을 동시에 올릴 수는 있다. 문제는 보호가 없다는 것이다.","src":"13강 p.31~36","wiki":"주소 변환 시점","tags":["변환 시점"],"pairs":[["Compile time","VA = PA, 같은 주소를 쓰는 두 번째 프로그램 로드 불가"],["Load time","로딩 때 주소를 고쳐 씀, 보호 없음"],["Execution time","CPU(MMU)가 실행 중 변환"],["MMU","execution time 변환을 맡는 CPU 안 하드웨어"]]},{"id":"u13b-07","type":"tf","q":"Load time 변환 방식은 여러 프로그램을 동시에 메모리에 올릴 수 없다는 것이 문제다.","explain":"동시 로드 불가는 compile time 의 문제(p.32)다. load time 은 동시 로드가 되지만 P1 이 P2 메모리를 건드릴 수 있다(보호 없음, p.34).","src":"13강 p.32~34","wiki":"주소 변환 시점","tags":["변환 시점"],"answer":false},{"id":"u13b-08","type":"mc","q":"P2 실행 파일의 `call 100320` 을 물리 0x300000 에 load time 방식으로 올리면 메모리 안 명령은?","explain":"로딩할 때 +0x200000 을 더해 고쳐 쓴다(p.33). execution time 방식이면 call 100320 그대로 두고 MMU 가 실행 중에 더한다.","src":"13강 p.33~36","wiki":"주소 변환 시점","tags":["변환 시점"],"choices":["call 300320","call 100320","call 200320","call 400320"],"answer":0},{"id":"u13b-09","type":"sa","q":"가상 주소를 물리 주소로 run time 에 바꾸는 CPU 안 하드웨어의 full term 은?","explain":"p.38 \"Hardware device inside CPU, Memory Management Unit (MMU), maps virtual to physical address at run time.\"","src":"13강 p.38","wiki":"MMU","tags":["MMU"],"answer":"Memory Management Unit","alts":["MMU"]},{"id":"u13b-10","type":"tf","q":"Execution time 변환에서는 실행 파일의 주소를 로딩 때 고쳐 쓰지 않는다.","explain":"p.35~36. 실행 파일은 `call 10052d` 그대로이고, CPU 가 실행 중에 +100000 / +200000 해서 물리 주소로 바꾼다.","src":"13강 p.35~36","wiki":"주소 변환 시점","answer":true},{"id":"u13b-11","type":"cloze","q":"MMU 는 ___ 안에 있는 하드웨어이고, 변환은 ___ 에 일어난다. CPU 와 OS 의 close ___ 이 필요하다.","explain":"p.38. 하드웨어가 매 참조를 빠르게 변환하고, OS 는 레지스터·표를 설정한다.","src":"13강 p.38","wiki":"MMU","answer":["CPU","run time","cooperation"],"bank":["CPU","run time","cooperation","DRAM","compile time","competition"]},{"id":"u13b-12","type":"mc","q":"메모리 계층에서 L1·L2·L3 캐시와 TLB 를 관리하는 주체로 교수님이 말한 것은?","explain":"10/19 녹음: \"L1·L2·L3 와 TLB 는 CPU 하드웨어가 관리한다. DRAM·SSD·키보드·마우스는 OS 책임.\"","src":"10/19 녹음 02:51","wiki":"메모리 계층","prof":true,"choices":["CPU 하드웨어","OS","컴파일러","사용자 프로그램"],"answer":0},{"id":"u13b-13","type":"tf","q":"Compile time 변환에서는 실행 중에 MMU 가 주소를 바꾼다.","explain":"compile time 은 컴파일러가 만든 주소가 곧 물리 주소(VA = PA)다. 실행 중 변환은 execution time 방식이다.","src":"13강 p.31~32","wiki":"주소 변환 시점","tags":["변환 시점"],"answer":false}]},{"id":"u13c","title":"Base and Bounds 손으로 돌리기","items":[{"id":"u13c-01","type":"cloze","q":"base and bounds 변환: physical address = virtual address + ___ , 그리고 0 ≤ virtual address \u003c ___","explain":"p.43 두 식. 검사가 먼저, 더하기가 나중이다.","src":"13강 p.43","wiki":"base and bounds","tags":["base and bounds"],"answer":["base","bounds"],"bank":["base","bounds","offset","PFN","limit address"]},{"id":"u13c-02","type":"sa","q":"프로그램이 로드된 물리 메모리의 시작 주소를 담는 CPU 레지스터 이름은? (영어 두 단어)","explain":"p.40. bounds(limit) register 는 그 프로그램 물리 메모리의 길이를 담는다.","src":"13강 p.40","wiki":"base and bounds","tags":["base and bounds"],"answer":"base register","alts":["base"]},{"id":"u13c-03","type":"tf","q":"이 강의 정의에서 bounds 는 물리 메모리의 끝 주소이고, 검사는 변환된 PA 로 한다.","explain":"p.40·p.43: bounds 는 길이(length)이고 검사는 VA \u003c bounds 로 한다. 끝 주소 + PA 검사는 OSTEP 의 다른 설계다.","src":"13강 p.40, p.43","wiki":"base and bounds","tags":["base and bounds"],"answer":false},{"id":"u13c-04","type":"num","q":"base = 32KB, bounds = 16KB. VA 128 의 PA 는? (바이트)","explain":"128 \u003c 16384 이므로 통과. PA = 128 + 32×1024 = 128 + 32768 = 32896. 슬라이드 p.48 의 fetch 128.","src":"13강 p.47~48","wiki":"base and bounds","prof":true,"tags":["base and bounds"],"answer":32896,"unit":"B","tol":0},{"id":"u13c-05","type":"num","q":"base = 32KB, bounds = 16KB. x 를 load 하는 VA 15KB 의 PA 는 몇 KB 인가?","explain":"15KB \u003c 16KB 통과. PA = 15KB + 32KB = 47KB (= 48128 B). p.49 의 load.","src":"13강 p.47·49","wiki":"base and bounds","prof":true,"tags":["base and bounds"],"answer":47,"unit":"KB","tol":0},{"id":"u13c-06","type":"num","q":"`x = x + 3` (명령 3개, x 는 메모리에 있음) 을 실행할 때 MMU 를 지나는 메모리 참조는 몇 번인가?","explain":"fetch 3번(128, 132, 135) + load x 1번 + store x 1번 = 5번. addl 실행은 메모리 참조가 없다.","src":"13강 p.46","wiki":"base and bounds","diff":2,"tags":["base and bounds"],"answer":5,"unit":"번","tol":0},{"id":"u13c-07","type":"num","q":"base = 48KB, bounds = 16KB 인 프로세스 B. VA 1000 의 PA 는? (바이트)","explain":"1000 \u003c 16384 통과. PA = 48×1024 + 1000 = 49152 + 1000 = 50152.","src":"위키 base and bounds 퀴즈","wiki":"base and bounds","tags":["base and bounds"],"answer":50152,"unit":"B","tol":0},{"id":"u13c-08","type":"mc","q":"base = 48KB, bounds = 16KB. VA 16384 에 접근하면?","explain":"조건은 VA \u003c bounds 다. 16384 \u003c 16384 는 거짓(같다)이므로 MMU 가 exception 을 올린다.","src":"13강 p.43, p.48","wiki":"base and bounds","diff":2,"tags":["base and bounds"],"choices":["exception (bounds 위반)","PA 65536","PA 64KB − 1","PA 16384"],"answer":0},{"id":"u13c-09","type":"num","q":"base = 16KB, bounds = 4KB. VA 3000 의 PA 는? (바이트)","explain":"3000 \u003c 4096 통과. PA = 16384 + 3000 = 19384. 단위를 바이트로 맞춘 뒤 더한다.","src":"13강 p.43 규칙 적용","wiki":"base and bounds","tags":["base and bounds"],"answer":19384,"unit":"B","tol":0},{"id":"u13c-10","type":"order","q":"base and bounds 에서 MMU 가 VA 하나를 처리하는 순서","explain":"p.48 그림. 비교에서 no 면 Raise exception → OS handler. base 를 먼저 더하고 bounds 와 비교하면 틀린다.","src":"13강 p.48","wiki":"base and bounds","tags":["base and bounds"],"answer":["VA 를 받는다","VA \u003c bounds 인지 비교","통과하면 base 를 더한다","PA 로 메모리에 접근"]},{"id":"u13c-11","type":"tf","q":"base/bounds 레지스터를 바꾸는 명령은 특권 명령이어야 한다.","explain":"유저 프로그램이 base 를 마음대로 바꾸면 남의 메모리에 접근할 수 있어 protection 이 무너진다(OSTEP 15장 보충).","src":"위키 base and bounds","wiki":"base and bounds","diff":2,"answer":true},{"id":"u13c-12","type":"mc","q":"bounds 위반이 일어나면 그 다음은?","explain":"p.48 Raise exception. 4강 trap 과 같은 경로로 OS 에 넘어간다.","src":"13강 p.48","wiki":"base and bounds","choices":["MMU 가 exception 을 올리고 OS 의 exception handler 가 처리(보통 프로세스 종료)","MMU 가 VA 를 bounds 안으로 잘라서 접근","OS 가 bounds 를 자동으로 늘림","아무 일 없이 다음 명령"],"answer":0},{"id":"u13c-13","type":"num","q":"base = 32KB 일 때 VA 135 (store 명령 fetch) 의 PA 는?","explain":"135 + 32768 = 32903. 같은 규칙을 그대로 적용한다.","src":"위키 base and bounds p.47~49","wiki":"base and bounds","diff":1,"answer":32903,"unit":"B","tol":0},{"id":"u13c-14","type":"cloze","q":"base 32KB, bounds 16KB 에서 VA 20000 은 ___ 이상이므로 MMU 가 ___ 을 올린다.","explain":"20000 ≥ 16384. base 를 더하기 전에 검사에서 걸린다.","src":"13강 p.43, p.48","wiki":"base and bounds","tags":["base and bounds"],"answer":["bounds","exception"],"bank":["bounds","exception","base","page fault","PFN"]}]},{"id":"u13d","title":"OS 가 할 일과 한계","items":[{"id":"u13d-01","type":"match","q":"언제 무엇을 하는지 연결하시오 (base and bounds)","explain":"p.50~54. 레지스터는 CPU 에 한 쌍뿐이라 실행 중인 프로세스 값만 들어 있다.","src":"13강 p.50~54","wiki":"base and bounds","tags":["base and bounds"],"pairs":[["프로세스 시작","free list 에서 주소 공간 자리를 찾는다"],["프로세스 종료","메모리를 free list 에 되돌린다"],["context switch","base/bounds 쌍을 PCB 에 저장·복원"],["bounds 밖 접근","exception → OS handler (보통 종료)"]]},{"id":"u13d-02","type":"sa","q":"사용하지 않는 물리 메모리 범위의 목록을 무엇이라 하는가? (영어 두 단어)","explain":"p.51 \"Free list: A list of the range of the physical memory which are not in use.\"","src":"13강 p.51","wiki":"free list","tags":["free list"],"answer":"free list"},{"id":"u13d-03","type":"cloze","q":"context switch 때 OS 는 실행 중이던 프로세스의 base 와 bounds 를 ___ 에 저장하고, 다음 프로세스의 값을 레지스터에 ___ 한다.","explain":"p.54 그림: A 의 base 32KB/bounds 16KB 를 Process A PCB 에 저장하고 B 의 48KB/16KB 를 올린다.","src":"13강 p.54","wiki":"base and bounds","answer":["PCB","복원"],"bank":["PCB","복원","TLB","page table","삭제"]},{"id":"u13d-04","type":"mc","q":"base and bounds 의 한계로 p.55 가 드는 것은?","explain":"주소 공간을 통째로 연속 배치하므로 \"Big chunk of free space takes up physical memory\". 64-bit Linux 의 heap~stack 빈 공간은 128 TB 다.","src":"13강 p.55","wiki":"동적 재배치의 한계","tags":["base and bounds"],"choices":["heap 과 stack 사이 큰 free 공간까지 물리 메모리를 차지한다","변환이 너무 느리다","보호가 전혀 없다","레지스터가 너무 많이 필요하다"],"answer":0},{"id":"u13d-05","type":"tf","q":"base and bounds 에서는 주소 공간 전체가 물리 메모리에 연속으로 놓여야 한다.","explain":"레지스터 한 쌍으로 시작과 길이만 기억하므로 연속이어야 한다. 이것이 14강 segmentation 이 나온 이유다.","src":"13강 p.55","wiki":"동적 재배치의 한계","answer":true},{"id":"u13d-06","type":"mc","q":"base and bounds 의 장점으로 가장 거리가 먼 것은?","explain":"첫 보기는 오히려 단점이다. 빈 공간까지 통째로 올린다.","src":"위키 base and bounds 장단점","wiki":"base and bounds","choices":["주소 공간 안 빈 공간을 물리 메모리에 두지 않는다","레지스터 2개와 덧셈·비교라 빠르다","프로그램은 0번지라고 믿는다","bounds 로 보호된다"],"answer":0},{"id":"u13d-07","type":"tf","q":"13강 슬라이드에서 계산 문제가 나올 곳은 base and bounds 변환이다.","explain":"위키 정리: 13강에서 손으로 돌리는 계산은 PA = VA + base, VA \u003c bounds 검사 뿐이다.","src":"위키 base and bounds","wiki":"base and bounds","diff":1,"answer":true},{"id":"u13d-08","type":"num","q":"물리 메모리 64KB 에 OS 가 0~16KB, 프로세스 A 가 32~48KB 에 있다. A 의 bounds 는 몇 KB 인가?","explain":"bounds 는 길이다. 48 − 32 = 16KB. base 는 32KB.","src":"13강 p.41~42","wiki":"base and bounds","diff":1,"answer":16,"unit":"KB","tol":0},{"id":"u13d-09","type":"mc","q":"교수님이 p.3~10(메모리 계층·SRAM/DRAM)에 대해 한 말이 아닌 것은?","explain":"10/19 녹음. 교수님은 이 부분 비중을 낮췄다. 단 SRAM 전력 퀴즈와 temporal/spatial 분할 관점은 챙긴다.","src":"10/19 녹음","wiki":"가상 메모리","prof":true,"choices":["\"이 부분이 기말 핵심이다\"","\"architecture 주제다\"","\"system programming 에서 배웠을 것\"","\"Optane 은 몰라도 된다\""],"answer":0},{"id":"u13d-10","type":"tf","q":"\"올바른 address translation 이면 남의 메모리 접근을 막는다\" — 교수님은 이것을 protection 이점의 근거로 들었다.","explain":"10/19 녹음 32:22 \"very clever mechanism\". 변환 결과가 자기 영역 밖으로 못 나가게 하면 보호가 된다.","src":"10/19 녹음 32:22","wiki":"메모리 가상화","prof":true,"answer":true},{"id":"u13d-11","type":"tf","q":"CPU 는 모든 프로세스의 base/bounds 쌍을 레지스터에 동시에 들고 있다.","explain":"레지스터는 한 쌍뿐이라 실행 중인 프로세스 값만 있다. 나머지는 각 PCB 에 저장돼 있다가 context switch 때 복원된다.","src":"13강 p.54","wiki":"base and bounds","diff":2,"answer":false},{"id":"u13d-12","type":"cloze","q":"OS 는 프로세스 시작 때 ___ 에서 빈 칸을 찾고, 종료 때 그 메모리를 ___ 해 다시 쓰게 한다.","explain":"p.50 \"Finding space for address space\" / \"Reclaiming the memory for use\".","src":"13강 p.50~53","wiki":"free list","answer":["free list","reclaim"],"bank":["free list","reclaim","page table","copy","PCB"]}]}]},{"id":"u14","title":"14강 Segmentation","desc":"세그먼트 변환 · stack · protection · fragmentation · free-space management","lessons":[{"id":"u14a","title":"세그먼트와 주소 변환","items":[{"id":"u14a-01","type":"sa","q":"\"The space inside the allocated unit is not all used and thus wasted\" 를 뜻하는 용어는?","explain":"p.3. base and bounds 는 주소 공간 하나를 통째로 할당하므로 그 안의 heap~stack 빈 공간이 버려진다.","src":"14강 p.3","wiki":"internal fragmentation","tags":["fragmentation"],"answer":"Internal Fragmentation","alts":["internal fragmentation","내부 단편화"]},{"id":"u14a-02","type":"cloze","q":"Segment 는 주소 공간의 ___ 한 덩어리이고, 세그먼트마다 ___ 와 bounds 가 따로 있다.","explain":"p.5 \"Segment is just a contiguous portion of the address space of a particular length … Base and bounds exist per each segment.\"","src":"14강 p.5","wiki":"세그멘테이션","tags":["segmentation"],"answer":["contiguous","base"],"bank":["contiguous","base","fixed-sized","PFN","random"]},{"id":"u14a-03","type":"tf","q":"세그멘테이션에서는 heap 과 stack 사이 빈 공간도 물리 메모리를 차지한다.","explain":"세그먼트(code·heap·stack)만 물리 메모리에 놓이고 가운데 빈 공간은 물리 메모리를 쓰지 않는다. 그게 base and bounds 대비 장점이다.","src":"14강 p.6","wiki":"세그멘테이션","answer":false},{"id":"u14a-04","type":"sa","q":"가상 주소의 위 몇 비트로 세그먼트를 고르는 방식을 슬라이드는 무엇이라 부르는가? (___ approach)","explain":"p.7 \"Explicit approach: Chop up the address space into segments based on the top few bits of virtual address.\"","src":"14강 p.7","wiki":"세그먼트 주소 변환","answer":"explicit","alts":["explicit approach"]},{"id":"u14a-05","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 100(10진수)의 PA 는?","explain":"세그먼트 00 = Code, offset 100. 100 \u003c 2048. PA = 32768 + 100 = 32868 (p.10).","src":"14강 p.10","wiki":"세그먼트 주소 변환","prof":true,"tags":["세그먼트 변환"],"answer":32868,"tol":0},{"id":"u14a-06","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 4200(10진수)의 offset 은?","explain":"4200 = 01 | 000001101000. heap 은 VA 4096 에서 시작하므로 offset = 4200 − 4096 = 104.","src":"14강 p.11","wiki":"세그먼트 주소 변환","tags":["세그먼트 변환"],"answer":104,"tol":0},{"id":"u14a-07","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 4200(10진수)의 PA 는?","explain":"PA = base + offset = 34816 + 104 = 34920. VA + base(4200 + 34K)는 틀린다 — p.11 \"Virtual address + base is not the correct physical address\".","src":"14강 p.11","wiki":"세그먼트 주소 변환","prof":true,"tags":["세그먼트 변환"],"answer":34920,"tol":0},{"id":"u14a-08","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 4500 의 PA 는?","explain":"세그먼트 01 Heap, offset 4500 − 4096 = 404 \u003c 2048. PA = 34816 + 404 = 35220.","src":"위키 세그먼트 주소 변환 퀴즈","wiki":"세그먼트 주소 변환","tags":["세그먼트 변환"],"answer":35220,"tol":0},{"id":"u14a-09","type":"mc","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 6200 에 읽기 접근하면?","explain":"Heap, offset 6200 − 4096 = 2104 ≥ size 2048 이므로 범위 위반 → Segmentation Fault.","src":"위키 세그먼트 주소 변환 퀴즈","wiki":"segmentation fault","diff":2,"tags":["세그먼트 변환"],"choices":["Segmentation Fault","PA 36920","Protection Fault","PA 40416"],"answer":0},{"id":"u14a-10","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 5000 의 PA 는?","explain":"Heap, offset 5000 − 4096 = 904 \u003c 2048. PA = 34816 + 904 = 35720.","src":"14강 p.10 규칙 적용","wiki":"세그먼트 주소 변환","tags":["세그먼트 변환"],"answer":35720,"tol":0},{"id":"u14a-11","type":"tf","q":"Code 세그먼트에서는 VA + base 가 우연히 맞는다. code 가 가상 주소 0 에서 시작해 VA = offset 이기 때문이다.","explain":"이것을 일반 규칙으로 착각하면 heap·stack 에서 틀린다. 규칙은 PA = offset + base.","src":"14강 p.10~11","wiki":"세그먼트 주소 변환","diff":2,"answer":true},{"id":"u14a-12","type":"order","q":"세그먼트 주소 변환 순서 (양의 방향 세그먼트)","explain":"p.15 그림: 범위 검사 → base 에 더하기 → 권한 검사. 범위 실패는 Segmentation Fault, 권한 실패는 Protection Fault.","src":"14강 p.15","wiki":"segmentation fault","tags":["세그먼트 변환"],"answer":["VA 위 2비트로 세그먼트 고르기","아래 12비트를 offset 으로","offset \u003c size 검사","PA = base + offset","접근 종류가 protection 에 맞는지 검사"]},{"id":"u14a-13","type":"num","q":"VA 가 14비트이고 위 2비트가 세그먼트 번호라면, 세그먼트 하나의 최대 크기는 몇 바이트인가?","explain":"offset 이 12비트이므로 $2^{12}$ = 4096 = 4KB. stack 음수 offset 계산의 \"최대 세그먼트 크기\"가 이 값이다.","src":"14강 p.7, p.12","wiki":"세그먼트 주소 변환","diff":1,"answer":4096,"unit":"B","tol":0}]},{"id":"u14b","title":"Stack · 공유 · fault","items":[{"id":"u14b-01","type":"cloze","q":"stack 은 ___ 방향으로 자란다. 그래서 세그먼트 레지스터에 \"Grows ___?\" 비트가 추가된다 (1 양, 0 음).","explain":"p.12 \"Stack grows backward. It starts at 28KB and grows back to 26KB.\"","src":"14강 p.12","wiki":"스택 세그먼트","tags":["stack"],"answer":["backward","Positive"],"bank":["backward","Positive","forward","Negative","Upward"]},{"id":"u14b-02","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 15KB(= 15360) 의 음수 offset 은? (부호 포함)","explain":"offset = 15360 − 3×4096 = 3072. 음수 offset = offset − 최대 세그먼트 크기 = 3072 − 4096 = −1024.","src":"14강 p.12","wiki":"스택 세그먼트","prof":true,"tags":["stack"],"answer":-1024,"tol":0},{"id":"u14b-03","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 15KB 의 PA 는 몇 KB 인가?","explain":"PA = base + 음수 offset = 28KB − 1KB = 27KB. |−1024| ≤ 2048 이라 범위 안.","src":"14강 p.12","wiki":"스택 세그먼트","prof":true,"tags":["stack"],"answer":27,"unit":"KB","tol":0},{"id":"u14b-04","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 15872(15.5KB) 의 PA 는? (바이트)","explain":"offset = 15872 − 12288 = 3584. 음수 offset = 3584 − 4096 = −512. PA = 28672 − 512 = 28160.","src":"위키 스택 세그먼트 퀴즈","wiki":"스택 세그먼트","diff":2,"tags":["stack"],"answer":28160,"unit":"B","tol":0},{"id":"u14b-05","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 14KB(= 14336) 의 PA 는 몇 KB 인가?","explain":"offset 2048, 음수 offset −2048, |−2048| ≤ 2048 통과. PA = 28KB − 2KB = 26KB — stack 의 가장 아래 칸. 14KB − 1 이면 size 를 넘어 fault.","src":"위키 스택 세그먼트","wiki":"스택 세그먼트","diff":3,"tags":["stack"],"answer":26,"unit":"KB","tol":0},{"id":"u14b-06","type":"tf","q":"stack 세그먼트의 base(28KB)는 세그먼트의 아래쪽 끝이라 PA 는 base 보다 크다.","explain":"stack 의 base 는 위쪽 끝이다. 음수 offset 을 더하므로 PA 는 base 보다 작다.","src":"14강 p.12","wiki":"스택 세그먼트","diff":2,"answer":false},{"id":"u14b-07","type":"match","q":"세그먼트와 protection 을 연결하시오 (p.14 표)","explain":"code 는 RE 라 공유해도 안전하다. 쓰려 하면 Protection Fault.","src":"14강 p.14","wiki":"코드 공유와 protection bit","tags":["protection"],"pairs":[["Code","base 32K, Read-Execute"],["Heap","base 34K, Read-Write, 양의 방향"],["Stack","base 28K, Read-Write, 음의 방향"],["세그먼트 번호 10","미사용"]]},{"id":"u14b-08","type":"mc","q":"code 세그먼트(RE) 안 VA 100 에 store 하면?","explain":"offset 100 \u003c 2K 라 범위는 통과한다. 쓰기인데 W 권한이 없어 Protection Fault 다.","src":"위키 코드 공유와 protection bit","wiki":"코드 공유와 protection bit","diff":2,"tags":["protection"],"choices":["Protection Fault","Segmentation Fault","PA 32868 에 정상 저장","page fault"],"answer":0},{"id":"u14b-09","type":"match","q":"fault 종류와 원인을 연결하시오","explain":"p.15. 검사 순서는 범위 → 더하기 → 권한.","src":"14강 p.15","wiki":"segmentation fault","pairs":[["Segmentation Fault","offset 이 세그먼트 size 를 넘음"],["Protection Fault","범위 안이지만 권한(R/W/X) 위반"],["External fragmentation","세그먼트 사이 작은 구멍들"],["Internal fragmentation","할당한 칸 안의 안 쓰는 공간"]]},{"id":"u14b-10","type":"tf","q":"세그먼트는 주소 공간끼리 공유할 수 있고(code sharing), 그러려면 protection bit 가 필요하다.","explain":"p.13 \"Segment can be shared between address space … Extra hardware support is needed for form of a protection bit.\"","src":"14강 p.13","wiki":"코드 공유와 protection bit","answer":true},{"id":"u14b-11","type":"sa","q":"세그먼트 레지스터의 네 칸 중 \"세그먼트가 자라는 방향\"을 나타내는 칸 이름은?","explain":"네 칸 = Base, Size, Grows Positive?, Protection.","src":"14강 p.14","wiki":"스택 세그먼트","diff":1,"answer":"Grows Positive","alts":["Grows Positive?","grows positive bit"]},{"id":"u14b-12","type":"mc","q":"13강 base and bounds 와 비교한 세그멘테이션의 새로운 문제는?","explain":"세그먼트 크기가 제각각이라 물리 메모리 사이사이에 구멍이 생긴다. internal fragmentation 은 base and bounds 의 문제였다.","src":"14강 p.16","wiki":"external fragmentation","choices":["external fragmentation","internal fragmentation","TLB miss","보호 불가"],"answer":0},{"id":"u14b-13","type":"tf","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 14KB − 1(= 14335) 은 PA 26KB − 1 로 정상 변환된다.","explain":"offset 2047 → 음수 offset −2049, |−2049| > size 2048 이라 Segmentation Fault. stack 의 가장 아래 칸은 VA 14KB(PA 26KB).","src":"위키 스택 세그먼트","wiki":"스택 세그먼트","diff":3,"tags":["stack"],"answer":false}]},{"id":"u14c","title":"Fragmentation 과 free-space 관리","items":[{"id":"u14c-01","type":"sa","q":"\"Little holes of free space in physical memory that make difficulty to allocate new segments\" 를 뜻하는 용어는?","explain":"p.16. 24KB 가 비어 있어도 연속이 아니어서 20KB 요청을 못 준다.","src":"14강 p.16","wiki":"external fragmentation","tags":["fragmentation"],"answer":"External Fragmentation","alts":["external fragmentation","외부 단편화"]},{"id":"u14c-02","type":"mc","q":"free 구멍이 8KB, 6KB, 10KB 로 흩어져 있을 때 12KB 세그먼트 요청은?","explain":"세그먼트는 연속이어야 한다. 합이 충분해도 한 덩어리가 없으면 실패 — external fragmentation.","src":"위키 external fragmentation 퀴즈","wiki":"external fragmentation","tags":["fragmentation"],"choices":["실패 (연속된 가장 큰 구멍이 10KB)","성공 (합 24KB)","8KB 와 6KB 를 합쳐 성공","internal fragmentation 으로 성공"],"answer":0},{"id":"u14c-03","type":"sa","q":"흩어진 세그먼트를 다시 모아 붙여 구멍을 합치는 것을 무엇이라 하는가?","explain":"p.16 \"Compaction: Rearranging the existing segments in physical memory.\"","src":"14강 p.16","wiki":"compaction","answer":"compaction"},{"id":"u14c-04","type":"mc","q":"compaction 이 비싼 이유로 슬라이드가 들지 않은 것은?","explain":"p.16: Stop running process / Copy data / Change segment register value. TLB 는 15강 개념이다.","src":"14강 p.16","wiki":"compaction","choices":["TLB 를 flush 해야 한다","실행 중인 프로세스를 멈춘다","데이터를 다른 곳으로 복사한다","세그먼트 레지스터 값을 바꾼다"],"answer":0},{"id":"u14c-05","type":"tf","q":"free-space management 는 free space 가 고정 크기 단위일 때 더 어려워진다.","explain":"p.19: variable-sized units 일 때 어렵다. 예는 segmentation 의 OS 와 유저 레벨 malloc/free.","src":"14강 p.19","wiki":"free-space management","answer":false},{"id":"u14c-06","type":"match","q":"용어와 정의를 연결하시오","explain":"p.22~31. free(ptr) 는 크기를 받지 않으므로 header 의 size 를 읽는다.","src":"14강 p.22~31","wiki":"free-space management","tags":["free-space"],"pairs":[["Splitting","요청보다 큰 chunk 를 둘로 나눠 앞부분을 줌"],["Coalescing","반납된 chunk 를 주소가 붙은 빈 chunk 와 합침"],["Header block","free(ptr) 이 크기를 알 수 있게 ptr 앞에 둔 정보"],["Embedded free list","free list 노드를 빈 공간 자신 안에 둠"]]},{"id":"u14c-07","type":"cloze","q":"free list (addr 0, len 10) → (addr 20, len 10) 에서 malloc(1) 이 뒤 chunk 를 쓰면 리스트는 (0, 10) → (addr ___, len ___) 가 된다.","explain":"p.23 splitting. addr 20 chunk 의 앞 1바이트를 주고 나머지 9바이트가 addr 21 에 남는다.","src":"14강 p.22~23","wiki":"splitting과 coalescing","answer":["21","9"],"bank":["21","9","20","10","11"]},{"id":"u14c-08","type":"tf","q":"coalescing 을 하지 않으면 30바이트가 다 비어도 10바이트 조각 3개로 남아 malloc(15) 가 실패할 수 있다.","explain":"p.24~25. 합치지 않은 조각은 external fragmentation 과 같은 효과를 낸다.","src":"14강 p.24~25","wiki":"splitting과 coalescing","answer":true},{"id":"u14c-09","type":"num","q":"header 가 8바이트인 할당기에서 malloc(100) 은 free chunk 에서 몇 바이트를 떼어 가는가?","explain":"p.28: 요청 N + header 크기. 100 + 8 = 108. header 를 빼먹는 것이 대표 실수.","src":"14강 p.28, p.33","wiki":"할당 헤더","tags":["free-space"],"answer":108,"unit":"B","tol":0},{"id":"u14c-10","type":"num","q":"4KB heap 에 embedded free list 를 만들었다(노드 8바이트). 처음 free chunk 의 len 은?","explain":"head->size = 4096 − sizeof(node_t) = 4096 − 8 = 4088 (p.31).","src":"14강 p.30~31","wiki":"embedded free list","tags":["free-space"],"answer":4088,"unit":"B","tol":0},{"id":"u14c-11","type":"num","q":"위 heap(len 4088, header 8B)에서 malloc(100) 을 세 번 한 뒤 남은 free chunk 의 len 은?","explain":"한 번에 108씩 → 108 × 3 = 324. 4088 − 324 = 3764 (p.34).","src":"14강 p.33~34","wiki":"embedded free list","diff":2,"tags":["free-space"],"answer":3764,"unit":"B","tol":0},{"id":"u14c-12","type":"num","q":"같은 4KB heap(len 4088, header 8B)에서 malloc(50) 한 번 뒤 free chunk 의 len 은?","explain":"50 + 8 = 58 을 떼어 가므로 4088 − 58 = 4030, 시작 addr 은 58.","src":"위키 embedded free list 퀴즈","wiki":"embedded free list","tags":["free-space"],"answer":4030,"unit":"B","tol":0},{"id":"u14c-13","type":"mc","q":"free(void *ptr) 의 header 에 들어 있는 magic number 의 용도는?","explain":"p.27: header 에는 size, magic number(integrity checking) 등이 있다. 코드에서 assert(hptr->magic == 1234567).","src":"14강 p.26~27","wiki":"할당 헤더","choices":["진짜 header 인지(무결성) 확인","다음 free chunk 주소","chunk 의 크기","할당한 스레드 번호"],"answer":0},{"id":"u14c-14","type":"tf","q":"malloc(N) 은 free list 에서 정확히 N 바이트만 떼어 간다.","explain":"p.28: N + header 크기를 떼어 간다. header 가 8B 면 malloc(100) 은 108B.","src":"14강 p.28","wiki":"할당 헤더","tags":["free-space"],"answer":false}]},{"id":"u14d","title":"할당 전략 Best · Worst · First · Next","items":[{"id":"u14d-01","type":"match","q":"할당 전략과 고르는 chunk 를 연결하시오","explain":"p.37~38. Best·Worst 는 전체 탐색, First·Next 는 전체 탐색 불필요.","src":"14강 p.37~38","wiki":"할당 전략","tags":["할당 전략"],"pairs":[["Best Fit","충분한 것 중 가장 작은 것"],["Worst Fit","가장 큰 것"],["First Fit","앞에서부터 첫 충분한 것"],["Next Fit","지난번 찾던 곳부터 첫 충분한 것"]]},{"id":"u14d-02","type":"mc","q":"free list head → 10 → 30 → 20 에 요청 15. Best Fit 결과 리스트는?","explain":"15 이상인 30, 20 중 가장 작은 20 을 고른다. 20 − 15 = 5 가 남는다 (p.39).","src":"14강 p.39","wiki":"할당 전략","prof":true,"tags":["할당 전략"],"choices":["10 → 30 → 5","10 → 15 → 20","10 → 30 → 20 (실패)","−5 → 30 → 20"],"answer":0},{"id":"u14d-03","type":"mc","q":"free list head → 10 → 30 → 20 에 요청 15. Worst Fit 결과 리스트는?","explain":"가장 큰 30 을 고른다. 30 − 15 = 15 (p.39). 이 예에서는 First Fit 과 결과가 같지만 정의는 다르다.","src":"14강 p.39","wiki":"할당 전략","tags":["할당 전략"],"choices":["10 → 15 → 20","10 → 30 → 5","10 → 30 → 20","−5 → 30 → 20"],"answer":0},{"id":"u14d-04","type":"tf","q":"p.39 예제에서 First Fit 과 Worst Fit 의 결과가 같으므로 두 전략은 같은 전략이다.","explain":"우연히 첫 충분한 chunk(30)가 가장 큰 chunk 이기도 했을 뿐이다. 정의(첫 것 vs 가장 큰 것)가 다르다.","src":"14강 p.39","wiki":"할당 전략","diff":2,"answer":false},{"id":"u14d-05","type":"mc","q":"free list 25 → 12 → 40 → 18 에 요청 16. Best Fit 이 고르는 chunk 는?","explain":"16 이상인 25, 40, 18 중 가장 작은 18. 결과 25 → 12 → 40 → 2.","src":"위키 할당 전략 퀴즈","wiki":"할당 전략","tags":["할당 전략"],"choices":["18","25","40","12"],"answer":0},{"id":"u14d-06","type":"num","q":"free list 25 → 12 → 40 → 18 에 요청 16. First Fit 뒤 첫 번째 노드의 크기는?","explain":"앞에서 첫 충분한 25 를 고른다. 25 − 16 = 9 → 9 → 12 → 40 → 18.","src":"위키 할당 전략 퀴즈","wiki":"할당 전략","tags":["할당 전략"],"answer":9,"tol":0},{"id":"u14d-07","type":"mc","q":"free list 25 → 12 → 40 → 18, 요청 16. Next Fit 이 지난번 두 번째 노드(12)를 보고 있었다면 고르는 chunk 는?","explain":"12 부터 찾는다. 12 는 부족, 다음 40 을 고른다. 결과 25 → 12 → 24 → 18.","src":"위키 할당 전략 퀴즈","wiki":"할당 전략","diff":2,"tags":["할당 전략"],"choices":["40","25","18","12"],"answer":0},{"id":"u14d-08","type":"tf","q":"Best Fit 은 남는 조각이 가장 작아서 external fragmentation 을 가장 확실하게 줄인다.","explain":"작은 조각(예: 5)이 쌓여 오히려 external fragmentation 을 만든다. 어느 전략도 항상 이기지 않는다.","src":"위키 할당 전략","wiki":"할당 전략","diff":2,"answer":false},{"id":"u14d-09","type":"mc","q":"리스트 전체를 탐색하지 않아도 되는 전략 쌍은?","explain":"p.37~38: First 와 Next 는 \"no exhaustive search required\". Best·Worst 는 full search 필요.","src":"14강 p.37~38","wiki":"할당 전략","choices":["First Fit, Next Fit","Best Fit, Worst Fit","Best Fit, First Fit","Worst Fit, Next Fit"],"answer":0},{"id":"u14d-10","type":"sa","q":"\"searching at where one was looking at instead of the beginning of the list\" 로 정의된 전략은?","explain":"p.38. 탐색 위치를 리스트 전체에 고르게 퍼뜨린다.","src":"14강 p.38","wiki":"할당 전략","tags":["할당 전략"],"answer":"Next Fit"},{"id":"u14d-11","type":"cloze","q":"세그멘테이션의 OS 배치와 유저 레벨 ___ 은 똑같이 가변 크기 free-space 를 관리해야 하는 문제다.","explain":"p.19 e.g. 1 OS managing physical memory with segmentation, e.g. 2 user-level heap-allocation library.","src":"14강 p.19","wiki":"free-space management","answer":["malloc()/free()"],"bank":["malloc()/free()","fork()/exec()","open()/close()"]},{"id":"u14d-12","type":"num","q":"free list head → 10 → 30 → 20 에 요청 15 를 Worst Fit 으로 처리한 뒤 free 공간의 총합은?","explain":"원래 합 60 에서 15 를 떼어 가므로 45 (10 + 15 + 20). 어떤 전략이든 성공하면 총합은 같다.","src":"14강 p.39 적용","wiki":"할당 전략","diff":1,"answer":45,"tol":0},{"id":"u14d-13","type":"cloze","q":"Best Fit 과 Worst Fit 은 free list ___ 탐색이 필요하고, First Fit 은 ___ 충분한 chunk 에서 멈춘다.","explain":"p.37~38: Best·Worst 는 \"a full search of free space is required\", First 는 \"no exhaustive search required\".","src":"14강 p.37~38","wiki":"할당 전략","answer":["전체","첫"],"bank":["전체","첫","부분","마지막","가장 큰"]}]}]},{"id":"u15","title":"15강 Paging","desc":"page · VPN/offset · page table · PTE · CoW · TLB","lessons":[{"id":"u15a","title":"페이징 개념과 VPN/offset","items":[{"id":"u15a-01","type":"cloze","q":"Paging 은 주소 공간을 고정 크기 ___ 로 자르고, 물리 메모리도 같은 크기의 ___ 로 자른다. 프로세스마다 ___ 가 필요하다.","explain":"p.10 원문. segmentation 은 가변 크기 segment 였다.","src":"15강 p.10","wiki":"페이징","tags":["paging"],"answer":["page","page frame","page table"],"bank":["page","page frame","page table","segment","block","free list"]},{"id":"u15a-02","type":"mc","q":"segmentation 대비 paging 의 장점 두 가지(p.11)는?","explain":"Flexibility: heap/stack 이 어떻게 자라는지 가정 불필요. Simplicity: 크기가 같아 free list 관리가 쉽고 external fragmentation 이 없다.","src":"15강 p.11","wiki":"페이징","choices":["Flexibility, Simplicity","Protection, Sharing","Speed, Small page table","No internal fragmentation, No TLB"],"answer":0},{"id":"u15a-03","type":"tf","q":"paging 에는 external fragmentation 도 internal fragmentation 도 없다.","explain":"external 은 없지만, 데이터가 page 보다 작으면 page 안이 남는 internal fragmentation 이 있다(p.27).","src":"15강 p.11, p.27","wiki":"페이징의 문제","tags":["fragmentation"],"answer":false},{"id":"u15a-04","type":"match","q":"기호와 뜻을 연결하시오","explain":"p.13~15. 변환되는 것은 VPN 뿐이고 offset 은 그대로 붙는다.","src":"15강 p.13~15","wiki":"VPN과 offset","tags":["VPN"],"pairs":[["VPN","Virtual Page Number"],["VPO","Virtual Page Offset"],["PFN","Page Frame Number"],["PTE","Page Table Entry"]]},{"id":"u15a-05","type":"num","q":"주소 공간 64바이트, page 16바이트. VPN 은 몇 비트인가?","explain":"page 수 = 64/16 = 4 → log2 4 = 2비트. offset 은 log2 16 = 4비트.","src":"15강 p.13","wiki":"VPN과 offset","diff":1,"tags":["VPN"],"answer":2,"unit":"bit","tol":0},{"id":"u15a-06","type":"num","q":"주소 공간 64B, page 16B, PageTable[1] = PFN 7. VA 21 의 PA 는?","explain":"21 = 01 | 0101 → VPN 1, offset 5. PA = 7 × 16 + 5 = 117 (2진수 111 0101).","src":"15강 p.14~17","wiki":"VPN과 offset","prof":true,"tags":["VPN"],"answer":117,"tol":0},{"id":"u15a-07","type":"num","q":"주소 공간 16B, page 4B, PageTable[2] = PFN 1. VA 9 의 PA 는?","explain":"9 = 10 | 01 → VPN 2, offset 1. PA = 1 × 4 + 1 = 5 (p.18 Quiz).","src":"15강 p.18","wiki":"VPN과 offset","tags":["VPN"],"answer":5,"tol":0},{"id":"u15a-08","type":"num","q":"32비트 VA, page 4KB 일 때 VPN 비트 수는?","explain":"offset = log2 4096 = 12비트, VPN = 32 − 12 = 20비트.","src":"15강 p.19","wiki":"VPN과 offset","diff":1,"tags":["VPN"],"answer":20,"unit":"bit","tol":0},{"id":"u15a-09","type":"num","q":"주소 공간 32KB, page 4KB. VA 13000 의 offset 은?","explain":"13000 = 3 × 4096 + 712 → VPN 3, offset 712.","src":"위키 VPN과 offset 퀴즈","wiki":"VPN과 offset","tags":["VPN"],"answer":712,"tol":0},{"id":"u15a-10","type":"num","q":"위 문제(32KB/4KB)에서 page table 이 VPN 3 → PFN 9 이면 VA 13000 의 PA 는?","explain":"PA = 9 × 4096 + 712 = 36864 + 712 = 37576.","src":"위키 VPN과 offset 퀴즈","wiki":"VPN과 offset","diff":2,"tags":["VPN"],"answer":37576,"tol":0},{"id":"u15a-11","type":"num","q":"16비트 VA, page 4KB. VA 0x3A7F 의 VPN 이 PFN 5 로 매핑되면 PA 는 10진수로?","explain":"offset 12비트 → VPN = 0x3, offset = 0xA7F = 2687. PA = 5 × 4096 + 2687 = 23167 (= 0x5A7F).","src":"15강 p.14 규칙 적용","wiki":"VPN과 offset","diff":2,"tags":["VPN"],"answer":23167,"tol":0},{"id":"u15a-12","type":"tf","q":"PA 는 PFN 에 offset 을 그냥 더한 값이다.","explain":"PA = PFN × page 크기 + offset. 2진수로는 PFN 비트 뒤에 offset 비트를 이어 붙인다.","src":"위키 VPN과 offset","wiki":"VPN과 offset","diff":2,"answer":false},{"id":"u15a-13","type":"tf","q":"offset 비트 수는 주소 공간 크기가 아니라 page 크기로 정해진다.","explain":"offset 비트 = log2(page 크기). VPN 비트 = log2(주소 공간 / page 크기).","src":"위키 VPN과 offset","wiki":"VPN과 offset","answer":true},{"id":"u15a-14","type":"num","q":"주소 공간 16KB, page 2KB. page 는 몇 개인가?","explain":"16KB / 2KB = 8 → VPN 3비트, offset 11비트 (p.22 예).","src":"15강 p.22","wiki":"VPN과 offset","diff":1,"answer":8,"unit":"개","tol":0}]},{"id":"u15b","title":"Page table · PTE · 공유","items":[{"id":"u15b-01","type":"sa","q":"VPN 으로 인덱싱하는 배열 형태의 가장 단순한 page table 은? (영어 세 단어)","explain":"p.15 \"Simplest form: a linear page table, an array.\"","src":"15강 p.15","wiki":"페이지 테이블","answer":"linear page table"},{"id":"u15b-02","type":"tf","q":"page table 은 너무 커서 CPU 레지스터가 아니라 메모리(커널 메모리)에 둔다.","explain":"p.19~20. 32비트·4KB 면 4MB 다. 표 시작 위치는 PTBR 이 가리킨다.","src":"15강 p.19~20","wiki":"페이지 테이블","answer":true},{"id":"u15b-03","type":"match","q":"PTE 플래그와 뜻을 연결하시오","explain":"p.21 Common Flags of PTE. 정의→용어 문제 후보.","src":"15강 p.21","wiki":"PTE 플래그","prof":true,"tags":["PTE"],"pairs":[["Valid bit","이 번역이 유효한가"],["Protection bit","읽기/쓰기/실행 가능 여부"],["Present bit","물리 메모리에 있나, 디스크에 있나"],["Dirty bit","메모리에 올라온 뒤 수정됐나"],["Reference bit","접근된 적 있나"]]},{"id":"u15b-04","type":"sa","q":"\"Indicating whether the page has been modified since it was brought into memory\" 에 해당하는 PTE 플래그는?","explain":"p.21. dirty page 는 내보낼 때 디스크에 써야 한다(17강).","src":"15강 p.21","wiki":"PTE 플래그","tags":["PTE"],"answer":"Dirty bit","alts":["dirty","modified bit"]},{"id":"u15b-05","type":"sa","q":"\"Indicating that a page has been accessed\" 에 해당하는 PTE 플래그는? (다른 이름 Accessed bit)","explain":"p.21. Clock 알고리즘이 이 비트를 쓴다(17강).","src":"15강 p.21","wiki":"PTE 플래그","tags":["PTE"],"answer":"Reference bit","alts":["reference","accessed bit","accessed","referenced bit"]},{"id":"u15b-06","type":"mc","q":"valid 와 present 의 차이로 옳은 것은?","explain":"위키 혼동쌍 표. 쓰는 page 인데 디스크로 swap out 되면 present 0.","src":"15강 p.21","wiki":"PTE 플래그","diff":2,"choices":["valid = 주소 공간에서 쓰는 page 인가, present = 지금 메모리에 있나","valid = 수정됐나, present = 접근됐나","둘은 같은 비트의 다른 이름","valid = 커널 page, present = 유저 page"],"answer":0},{"id":"u15b-07","type":"tf","q":"16KB 주소 공간 2KB page 예에서 valid 가 0 인 page(VPN 1, 3~6)는 물리 frame 을 쓰지 않는다.","explain":"p.22. heap~stack 사이 빈 공간이 메모리를 먹지 않는 이유다 — 13강 base and bounds 한계의 답.","src":"15강 p.22","wiki":"PTE 플래그","answer":true},{"id":"u15b-08","type":"cloze","q":"fork() 는 부모 page 를 가리키는 새 page table 만 만든다(Page ___). 한쪽이 쓰려 할 때만 복사하는 것을 Copy ___ Write 라 한다.","explain":"p.23~24. B 가 page 7 에 쓰면 frame 7 을 새 frame 으로 복사하고 B 의 PTE 만 바꾼다.","src":"15강 p.23~24","wiki":"copy-on-write","tags":["CoW"],"answer":["Sharing","on"],"bank":["Sharing","on","Swapping","after","before"]},{"id":"u15b-09","type":"mc","q":"CoW 공유 중인 page 에 자식 B 가 쓰면 바뀌는 것은?","explain":"p.24 그림: B 의 7→7 이 7→8 로 바뀌고 A 의 7→7 은 그대로.","src":"15강 p.24","wiki":"copy-on-write","tags":["CoW"],"choices":["B 의 PTE 만 새 frame 을 가리킨다","A 와 B 의 PTE 모두 새 frame 을 가리킨다","A 의 PTE 만 바뀐다","아무 PTE 도 안 바뀌고 같은 frame 에 쓴다"],"answer":0},{"id":"u15b-10","type":"tf","q":"code page 는 RE 라서 여러 프로세스가 공유해도 안전하다.","explain":"p.25 Page Protection: 수정은 MMU 가 막는다.","src":"15강 p.25","wiki":"copy-on-write","answer":true},{"id":"u15b-11","type":"num","q":"32비트 VA, page 4KB, PTE 4B. linear page table 하나의 크기는 몇 MB 인가?","explain":"$2^{20}$ PTE × 4B = $2^{22}$ B = 4MB.","src":"15강 p.30","wiki":"페이징의 문제","prof":true,"tags":["page table 크기"],"answer":4,"unit":"MB","tol":0},{"id":"u15b-12","type":"num","q":"32비트 VA, page 16KB, PTE 4B. linear page table 크기는 몇 MB 인가?","explain":"offset 14비트 → VPN 18비트 → $2^{18}$ × 4B = 1MB. page 를 키우면 표는 작아지지만 internal fragmentation 이 커진다.","src":"15강 p.28·30","wiki":"페이징의 문제","tags":["page table 크기"],"answer":1,"unit":"MB","tol":0},{"id":"u15b-13","type":"num","q":"32비트 VA, page 4KB, PTE 4B, 프로세스 50개가 각자 linear page table 을 가지면 page table 에 드는 메모리는 몇 MB 인가?","explain":"프로세스당 4MB × 50 = 200MB. 슬라이드 예는 100개 → 400MB.","src":"위키 페이징의 문제 퀴즈","wiki":"페이징의 문제","tags":["page table 크기"],"answer":200,"unit":"MB","tol":0},{"id":"u15b-14","type":"cloze","q":"PA = PFN × ___ + offset. 2진수로는 PFN 비트 뒤에 ___ 비트를 이어 붙인다.","explain":"offset 은 변환하지 않고 그대로 붙는다.","src":"15강 p.14","wiki":"VPN과 offset","tags":["VPN"],"answer":["page 크기","offset"],"bank":["page 크기","offset","VPN","PTE 크기","base"]}]},{"id":"u15c","title":"페이징의 문제와 TLB","items":[{"id":"u15c-01","type":"match","q":"페이징의 문제와 해결책을 연결하시오","explain":"p.26~30 세 문제. 표 전체를 외운다.","src":"15강 p.26~30","wiki":"페이징의 문제","prof":true,"tags":["paging 문제"],"pairs":[["Internal fragmentation","작은 page (e.g., 1KB)"],["Performance degradation","TLB"],["Huge page tables","hybrid / multi-level paging"],["External fragmentation","paging 으로 이미 사라짐 (p.11)"]]},{"id":"u15c-02","type":"mc","q":"페이징의 performance degradation 이 생기는 이유는?","explain":"p.29 \"Two memory accesses are required for one memory access.\"","src":"15강 p.29","wiki":"페이징의 문제","choices":["메모리 접근 1번에 PTE 읽기 + data 읽기로 2번이 든다","page 가 너무 작아서","세그먼트 레지스터 검사","disk 접근이 필요해서"],"answer":0},{"id":"u15c-03","type":"sa","q":"MMU 안에서 자주 쓰는 virtual-to-physical 번역을 담는 하드웨어 캐시의 full term 은?","explain":"p.32 \"Translation Lookaside Buffers (TLB): A part of the chip's MMU. A hardware cache of popular virtual-to-physical address translation.\"","src":"15강 p.32","wiki":"TLB","prof":true,"tags":["TLB"],"answer":"Translation Lookaside Buffer","alts":["TLB","translation lookaside buffers"]},{"id":"u15c-04","type":"mc","q":"TLB 의 연관 방식(p.38)은?","explain":"p.38 \"TLB is managed by full associative method … Hardware searches the entire TLB in parallel.\" 보통 32·64·128 entry.","src":"15강 p.38","wiki":"TLB","tags":["TLB"],"choices":["fully associative — 전체를 병렬 탐색","direct mapped","2-way set associative","hash 로 한 칸만 봄"],"answer":0},{"id":"u15c-05","type":"match","q":"경로와 data 하나를 얻기까지의 메모리 접근 수를 연결하시오","explain":"p.33~35. hit 은 PTE 를 TLB 에서 받으므로 data 만 읽는다.","src":"15강 p.33~35","wiki":"TLB hit와 miss","tags":["TLB"],"pairs":[["TLB 없음","2번"],["TLB hit","1번"],["TLB miss","2번 (PTE + data)"],["2단계 page table 에서 TLB miss","3번 (PDE + PTE + data, 16강)"]]},{"id":"u15c-06","type":"num","q":"int 4B, page 16B, `for(i=0;i\u003c10;i++) sum += a[i];` 이고 a[0] 은 VPN 6 의 offset 4 다. TLB 가 처음에 비어 있으면 TLB miss 는 몇 번인가?","explain":"a[0]~a[2] VPN 6, a[3]~a[6] VPN 7, a[7]~a[9] VPN 8. 새 page 에 처음 들어갈 때만 miss → a[0], a[3], a[7] = 3번.","src":"15강 p.36","wiki":"TLB hit와 miss","prof":true,"tags":["TLB"],"answer":3,"unit":"번","tol":0},{"id":"u15c-07","type":"num","q":"위 배열 예(10원소, miss 3)의 TLB hit rate 는 몇 % 인가?","explain":"hit = 10 − 3 = 7 → 7/10 = 70%.","src":"15강 p.36","wiki":"TLB hit와 miss","tags":["TLB"],"answer":70,"unit":"%","tol":0},{"id":"u15c-08","type":"num","q":"위 배열 예에서 TLB 가 있을 때 메모리 접근 총 횟수는? (캐시 무시)","explain":"data 10번 + miss 때의 PTE 3번 = 13번. TLB 가 없으면 10 × 2 = 20번.","src":"15강 p.36","wiki":"TLB hit와 miss","diff":2,"tags":["TLB"],"answer":13,"unit":"번","tol":0},{"id":"u15c-09","type":"num","q":"page 32B, int 4B, `int b[20]` 이 page 경계에서 시작. TLB 가 비어 있을 때 `for(i=0;i\u003c20;i++) s+=b[i];` 의 hit rate 는 몇 % 인가?","explain":"page 하나에 int 8개 → b[0], b[8], b[16] 에서 miss 3번. hit 17/20 = 85%.","src":"위키 TLB hit와 miss 퀴즈","wiki":"TLB hit와 miss","diff":2,"tags":["TLB"],"answer":85,"unit":"%","tol":0},{"id":"u15c-10","type":"num","q":"위 b[20] 예에서 메모리 접근 총 횟수는?","explain":"data 20 + PTE 3 = 23번 (TLB 없으면 40번).","src":"위키 TLB hit와 miss 퀴즈","wiki":"TLB hit와 miss","diff":2,"tags":["TLB"],"answer":23,"unit":"번","tol":0},{"id":"u15c-11","type":"num","q":"TLB hit rate 90%, 메모리 접근 100ns, TLB 조회 시간은 무시. hit 이면 메모리 1번, miss 면 2번(PTE + data)일 때 평균 접근 시간은 몇 ns 인가?","explain":"0.9 × 100 + 0.1 × 200 = 90 + 20 = 110 ns. p.34~35 의 hit 1번 / miss 2번 규칙을 평균한 것.","src":"15강 p.34~35 적용","wiki":"TLB hit와 miss","diff":2,"tags":["TLB","EAT"],"answer":110,"unit":"ns","tol":0.001},{"id":"u15c-12","type":"tf","q":"TLB miss 가 드문 이유는 locality 때문이다.","explain":"p.35 \"Fortunately, TLB misses are rare.\" 배열을 훑으면 한 page 안의 원소가 연속 hit(spatial), 루프 재실행은 temporal.","src":"15강 p.35~37","wiki":"TLB hit와 miss","answer":true},{"id":"u15c-13","type":"order","q":"TLB hit 일 때 data 를 얻는 순서","explain":"p.34. 메모리 접근은 마지막 한 번뿐이다.","src":"15강 p.34","wiki":"TLB hit와 miss","tags":["TLB"],"answer":["CPU 가 VA 를 MMU 에","MMU 가 VPN 으로 TLB 조회","TLB 가 PTE 를 줌","MMU 가 PA 를 메모리에","메모리가 data 를 CPU 에"]},{"id":"u15c-14","type":"tf","q":"TLB hit 이면 data 를 얻는 데 메모리 접근이 한 번도 필요 없다.","explain":"hit 은 PTE 읽기만 건너뛴다. data 를 읽으러 메모리에 한 번은 간다(1번).","src":"15강 p.34","wiki":"TLB hit와 miss","tags":["TLB"],"answer":false}]},{"id":"u15d","title":"TLB miss 처리 · context switch","items":[{"id":"u15d-01","type":"order","q":"Hardware-managed TLB 의 miss 처리 순서","explain":"p.40~41. 하드웨어가 page table 위치와 형식을 알고 전부 처리한다.","src":"15강 p.40~41","wiki":"TLB miss 처리","prof":true,"tags":["TLB miss"],"answer":["Jump to the current page table (PTBR)","Find the correct PTE","Extract the desired translation","Update the TLB","Retry the instruction"]},{"id":"u15d-02","type":"order","q":"Software-managed TLB 의 miss 처리 순서","explain":"p.42~43. 4강 LDE 의 trap 경로와 같다. 시스템 콜과 달리 다음 명령이 아니라 같은 명령을 재시도한다.","src":"15강 p.42~43","wiki":"TLB miss 처리","prof":true,"diff":2,"tags":["TLB miss"],"answer":["하드웨어가 exception 을 올림 (kernel mode, trap handler 로)","OS 의 trap handler 가 호출됨","OS 가 page table 에서 번역을 찾음","OS 가 특권 명령으로 TLB 갱신","OS 가 return-from-trap","하드웨어가 명령을 재시도"]},{"id":"u15d-03","type":"sa","q":"x86 에서 현재 page table 을 가리키는 레지스터 개념의 full term 은? (CR3 가 예)","explain":"p.40 \"The page table is pointed to by a page-table base register (PTBR) (e.g., CR3 register in the Intel x86).\"","src":"15강 p.40","wiki":"PTBR","answer":"page-table base register","alts":["PTBR","page table base register"]},{"id":"u15d-04","type":"match","q":"TLB 관리 방식과 특징을 연결하시오","explain":"p.44 장단점 표.","src":"15강 p.44","wiki":"TLB miss 처리","tags":["TLB miss"],"pairs":[["Hardware-managed","빠르지만 CPU 설계가 복잡, page table 형식이 고정"],["Software-managed","느리지만 CPU 가 단순하고 유연"],["Intel x86","hardware-managed 의 예"],["MIPS","software-managed 의 예"]]},{"id":"u15d-05","type":"tf","q":"Software-managed TLB 는 하드웨어 변경 없이 page table 구조를 바꿀 수 있다는 유연성이 장점이다.","explain":"p.44 (+) Flexibility. 대신 trap handler 실행에 사이클이 많이 들어 relatively slower.","src":"15강 p.44","wiki":"TLB miss 처리","answer":true},{"id":"u15d-06","type":"tf","q":"Hardware-managed TLB 는 miss 처리에 trap handler 를 실행하므로 software-managed 보다 느리다.","explain":"반대다. hardware-managed 가 몇 사이클이면 끝나는 efficient 방식이고, trap handler 를 실행하는 쪽이 software-managed 다.","src":"15강 p.44","wiki":"TLB miss 처리","diff":2,"answer":false},{"id":"u15d-07","type":"mc","q":"context switch 뒤 TLB 에 남은 A 의 (VPN 10 → PFN 100) 과 B 의 (VPN 10 → PFN 170) 의 문제는?","explain":"p.47 \"Can't distinguish which entry is meant for which process.\" VPN 은 프로세스마다 같은 숫자를 쓴다.","src":"15강 p.47","wiki":"ASID와 TLB flush","tags":["ASID"],"choices":["어느 프로세스의 항목인지 구분할 수 없다","PFN 이 겹친다","TLB 가 가득 찬다","valid 비트가 없다"],"answer":0},{"id":"u15d-08","type":"cloze","q":"간단한 해결은 context switch 때 TLB 를 ___ 하는 것(모든 valid 비트를 0)이고, 더 나은 해결은 TLB 항목에 ___ 를 두는 것이다.","explain":"p.48~49. ASID 를 쓰면 context switch 뒤에도 남은 항목을 다시 써서 hit ratio 가 오른다.","src":"15강 p.48~49","wiki":"ASID와 TLB flush","tags":["ASID"],"answer":["flush","ASID"],"bank":["flush","ASID","refresh","PFN","PTBR"]},{"id":"u15d-09","type":"sa","q":"TLB 항목마다 두어 여러 프로세스가 TLB 를 나눠 쓰게 하는 필드의 full term 은?","explain":"p.49 \"Provide an address space identifier (ASID) field in the TLB.\"","src":"15강 p.49","wiki":"ASID와 TLB flush","tags":["ASID"],"answer":"address space identifier","alts":["ASID","address-space identifier"]},{"id":"u15d-10","type":"tf","q":"같은 프로세스의 스레드끼리 전환할 때도 TLB flush 가 필요하다.","explain":"스레드는 같은 주소 공간(같은 page table)을 쓰므로 TLB 항목이 그대로 맞다. flush 는 프로세스 전환에서만.","src":"위키 ASID와 TLB flush","wiki":"ASID와 TLB flush","diff":2,"answer":false},{"id":"u15d-11","type":"mc","q":"OS 가 PTBR 을 바꾸면 CPU 가 알아서 옛 TLB 항목을 지우는 방식은?","explain":"p.48. software-based 는 OS 가 특권 TLB-flush 명령을 명시적으로 부른다. xv6 는 hardware-based.","src":"15강 p.48","wiki":"ASID와 TLB flush","choices":["hardware-based flush","software-based flush","ASID","page coloring"],"answer":0},{"id":"u15d-12","type":"tf","q":"TLB 에는 VPN·PFN 말고도 valid 비트, protection 비트, ASID 같은 비트가 있다.","explain":"p.38 \"Other bits: valid bits, protection bits, address-space identifier (ASID), …\"","src":"15강 p.38","wiki":"TLB","diff":1,"answer":true},{"id":"u15d-13","type":"cloze","q":"software-managed TLB 의 miss 처리 마지막에 하드웨어는 다음 명령이 아니라 ___ 명령을 ___ 한다.","explain":"p.43 \"The hardware retries the instruction.\" 시스템 콜은 다음 명령으로 간다.","src":"15강 p.42~43","wiki":"TLB miss 처리","tags":["TLB miss"],"answer":["같은","재시도"],"bank":["같은","재시도","다음","건너뛰기","이전"]}]}]},{"id":"u16","title":"16강 Advanced Page Table","desc":"hybrid · multi-level · inverted · huge page · THP · Sv39","lessons":[{"id":"u16a","title":"Hybrid approach","items":[{"id":"u16a-01","type":"cloze","q":"Hybrid approach 는 segmentation 과 paging 을 합쳐 logical ___ 마다 page table 을 하나씩 둔다.","explain":"p.12 \"why not have one per logical segment?\" 큰 빈 구간의 PTE 를 저장하지 않아 표가 작아진다.","src":"16강 p.12","wiki":"hybrid approach","tags":["hybrid"],"answer":["segment"],"bank":["segment","process","page","CPU"]},{"id":"u16a-02","type":"mc","q":"hybrid approach 에서 세그먼트의
