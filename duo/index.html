 base 레지스터가 가리키는 것은?","explain":"14강과 base 의 뜻이 다르다. 영상 12:24 \"we change the meaning of the base.\" bound 는 그 page table 의 끝(page 개수).","src":"16강 p.12","wiki":"hybrid approach","prof":true,"diff":2,"tags":["hybrid"],"choices":["그 세그먼트 page table 의 물리 주소","세그먼트 데이터의 물리 시작 주소","page directory","다음 세그먼트의 base"],"answer":0},{"id":"u16a-03","type":"num","q":"32비트 VA, 4KB page, 위 2비트가 세그먼트일 때 hybrid 의 VPN 은 몇 비트인가?","explain":"offset 12, Seg 2 → VPN = 32 − 2 − 12 = 18비트 (p.14, 영상 14:57).","src":"16강 p.14","wiki":"hybrid approach","tags":["hybrid"],"answer":18,"unit":"bit","tol":0},{"id":"u16a-04","type":"match","q":"hybrid VA 의 Seg 값과 세그먼트를 연결하시오","explain":"p.14. 14강(01 Heap, 11 Stack, 00 Code)과 번호 배정이 다르니 문제의 표를 볼 것.","src":"16강 p.14","wiki":"hybrid approach","diff":2,"pairs":[["00","Unused segment"],["01","Code"],["10","Heap"],["11","Stack"]]},{"id":"u16a-05","type":"tf","q":"hybrid 변환에서 VPN 이 그 세그먼트의 bound 이상이면 Memory Trap(exception)이 난다.","explain":"p.15. single linear table 대비 추가 작업은 세그먼트 고르기와 bound 검사다(영상 16:52).","src":"16강 p.15","wiki":"hybrid approach","answer":true},{"id":"u16a-06","type":"mc","q":"hybrid approach 가 segmentation 에서 물려받은 문제는?","explain":"p.16 \"Page tables must be allocated continuously and can be of arbitrary size. Free-space management is not easy.\"","src":"16강 p.16","wiki":"hybrid approach","tags":["hybrid"],"choices":["page table 이 가변 크기·연속 할당이라 external fragmentation","TLB 를 쓸 수 없다","internal fragmentation 이 사라진다","page 공유가 불가능하다"],"answer":0},{"id":"u16a-07","type":"tf","q":"hybrid 에서도 큰 heap 의 일부만 쓰면 그 세그먼트 안 invalid PTE 는 여전히 저장된다.","explain":"영상 12:51, 17:58. 세그먼트 사이 빈 공간만 아끼고 세그먼트 안 빈 공간은 못 아낀다.","src":"16강 p.16","wiki":"hybrid approach","diff":2,"answer":true},{"id":"u16a-08","type":"order","q":"hybrid 주소 변환 순서","explain":"p.15 그림과 OSTEP 20.2 의사코드.","src":"16강 p.15","wiki":"hybrid approach","diff":2,"answer":["VA 위 2비트로 세그먼트(SN) 고르기","VPN 을 Bounds[SN] 와 비교","PTEAddr = Base[SN] + VPN × sizeof(PTE)","PTE 를 읽어 PFN 얻기","PA = PFN | offset"]},{"id":"u16a-09","type":"tf","q":"hybrid 에서 base/bound 쌍은 세그먼트 수(code·heap·stack)만큼 있고, context switch 때 OS 가 바꾼다.","explain":"p.14: Hardware 는 base/bound 쌍 세 개, Software(OS)는 context switch 때 새 프로세스의 page table 위치로 바꾼다.","src":"16강 p.14","wiki":"hybrid approach","answer":true},{"id":"u16a-10","type":"mc","q":"hybrid 다음에 나오는 해결책(표 조각도 page 크기로)은?","explain":"p.17. 표를 page 크기 단위로 잘라 external fragmentation 을 없앤다.","src":"16강 p.17","wiki":"multi-level page table","choices":["multi-level page table","inverted page table","compaction","segment 레지스터 추가"],"answer":0},{"id":"u16a-11","type":"tf","q":"교수님은 현대 RISC-V, x86 이 모두 multi-level page table 을 쓰며 이것이 \"winning one\" 이라고 했다.","explain":"11/9 녹음 16강 복습.","src":"11/9 녹음","wiki":"multi-level page table","prof":true,"answer":true},{"id":"u16a-12","type":"cloze","q":"hybrid 의 bound 는 그 세그먼트 page table 의 ___ (= 세그먼트 안 page 개수)를 나타낸다.","explain":"p.12 \"A bound or limit register … Indicate the end of the page table.\"","src":"16강 p.12","wiki":"hybrid approach","tags":["hybrid"],"answer":["끝"],"bank":["끝","시작","PFN","offset"]},{"id":"u16a-13","type":"tf","q":"hybrid approach 에서는 page table 이 page 크기 조각이라 아무 빈 frame 에나 둘 수 있다.","explain":"그건 multi-level 의 장점이다. hybrid 의 page table 은 가변 크기 linear array 라 연속 할당이 필요하고 external fragmentation 이 생긴다.","src":"16강 p.16, p.20","wiki":"hybrid approach","diff":2,"answer":false}]},{"id":"u16b","title":"Multi-level page table 계산","items":[{"id":"u16b-01","type":"cloze","q":"multi-level page table 은 linear page table 을 ___ 단위로 잘라 tree 처럼 만들고, 조각이 통째로 invalid 면 할당하지 않는다. 어떤 조각이 있는지는 ___ 가 기록한다.","explain":"p.18 원문.","src":"16강 p.18","wiki":"multi-level page table","tags":["multi-level"],"answer":["page-sized","page directory"],"bank":["page-sized","page directory","byte","TLB","free list"]},{"id":"u16b-02","type":"match","q":"multi-level 의 장단점을 연결하시오","explain":"p.20. 단점의 비용은 TLB miss 때만 낸다(영상 05:03).","src":"16강 p.20","wiki":"multi-level page table","prof":true,"tags":["multi-level"],"pairs":[["Memory saving","쓰는 주소 공간에 비례해서만 표를 할당"],["Easier memory management","표 조각이 page 크기라 아무 빈 frame 에 둠"],["Time-space trade-off","TLB miss 때 메모리 load 가 늘어남"],["Complexity","표를 여러 개 관리"]]},{"id":"u16b-03","type":"num","q":"조건: address space 16KB, page 64B, PTE 4B, 2단계 page table. offset 은 몇 비트인가?","explain":"64B = $2^6$ → 6비트.","src":"16강 p.21","wiki":"다단계 주소 변환 계산","diff":1,"tags":["multi-level"],"answer":6,"unit":"bit","tol":0},{"id":"u16b-04","type":"num","q":"조건: address space 16KB, page 64B, PTE 4B, 2단계 page table. PT index 는 몇 비트인가?","explain":"page 한 장의 PTE 수 = 64/4 = 16 → 4비트. VPN 8비트 중 남은 4비트가 PD index.","src":"16강 p.21~23","wiki":"다단계 주소 변환 계산","tags":["multi-level"],"answer":4,"unit":"bit","tol":0},{"id":"u16b-05","type":"num","q":"조건: address space 16KB, page 64B, PTE 4B, 2단계 page table. 이 프로세스가 VPN 0·1·4·5·254·255 만 쓸 때 multi-level 표 전체 크기는 몇 바이트인가?","explain":"directory 1장 + PT page 2장(VPN 0~15, 240~255) = 3장 × 64B = 192B. linear 는 1024B.","src":"16강 p.23","wiki":"다단계 주소 변환 계산","prof":true,"diff":2,"tags":["multi-level"],"answer":192,"unit":"B","tol":0},{"id":"u16b-06","type":"num","q":"조건: address space 16KB, page 64B, PTE 4B, 2단계 page table. VA 5844 의 PT index 는?","explain":"5844 = 0101 | 1011 | 010100 → PD 5, PT 11, offset 20.","src":"16강 p.24","wiki":"다단계 주소 변환 계산","prof":true,"tags":["multi-level"],"answer":11,"tol":0},{"id":"u16b-07","type":"num","q":"조건: address space 16KB, page 64B, PTE 4B, 2단계 page table. VA 5844 의 PTE 가 PFN 230 이면 PA 는?","explain":"offset 20. PA = 230 × 64 + 20 = 14720 + 20 = 14740.","src":"16강 p.24","wiki":"다단계 주소 변환 계산","prof":true,"diff":2,"tags":["multi-level"],"answer":14740,"tol":0},{"id":"u16b-08","type":"num","q":"조건: address space 16KB, page 64B, PTE 4B, 2단계 page table. VA 0x3F80 의 PT index 는?","explain":"0x3F80 = 11 1111 1000 0000 → 1111 | 1110 | 000000 → PD 15, PT 14, offset 0.","src":"위키 다단계 주소 변환 계산 퀴즈","wiki":"다단계 주소 변환 계산","diff":2,"tags":["multi-level"],"answer":14,"tol":0},{"id":"u16b-09","type":"num","q":"조건: address space 16KB, page 64B, PTE 4B, 2단계 page table. VA 0x3F80 의 PTE 가 PFN 55 면 PA 는 10진수로?","explain":"offset 0 → PA = 55 × 64 = 3520 (0xDC0).","src":"위키 다단계 주소 변환 계산 퀴즈","wiki":"다단계 주소 변환 계산","diff":2,"answer":3520,"tol":0},{"id":"u16b-10","type":"num","q":"2단계 page table 에서 TLB miss 가 나고 PDE·PTE 가 모두 valid 일 때 메모리 접근은 몇 번인가? (캐시 무시)","explain":"PDE 1 + PTE 1 + data 1 = 3번 (영상 22:53). TLB hit 이면 1번.","src":"16강 p.20","wiki":"다단계 주소 변환 계산","tags":["multi-level"],"answer":3,"unit":"번","tol":0},{"id":"u16b-11","type":"tf","q":"2단계 page table 에서 PDE 가 invalid 면 PDE 를 1번 읽고 바로 exception 이다.","explain":"p.22 \"The PDE is invalid: Raise an exception because the access is invalid.\" PTE·data 는 읽지 않는다.","src":"16강 p.22","wiki":"page directory","answer":true},{"id":"u16b-12","type":"num","q":"32비트 VA, 4KB page, 4B PTE 를 2단계로 나누면 PD index 는 몇 비트인가?","explain":"offset 12, VPN 20, PT index = log2(4096/4) = 10, PD = 20 − 10 = 10 → 10 | 10 | 12. directory 2^10 × 4B = 4KB = 한 page.","src":"위키 multi-level page table 퀴즈","wiki":"multi-level page table","tags":["multi-level"],"answer":10,"unit":"bit","tol":0},{"id":"u16b-13","type":"tf","q":"multi-level page table 이 아끼는 것은 data page 가 아니라 page-table page(metadata)다.","explain":"영상 19:28 \"Be careful about two kinds of pages involved.\"","src":"16강 p.19","wiki":"multi-level page table","prof":true,"answer":true},{"id":"u16b-14","type":"sa","q":"page directory 의 시작 위치를 담는 레지스터의 약어는?","explain":"p.19 \"PDBR: Page Directory Base Register\". 15강 PTBR 의 짝.","src":"16강 p.19","wiki":"PDBR","diff":1,"answer":"PDBR","alts":["Page Directory Base Register"]}]},{"id":"u16c","title":"3단계 · inverted page table","items":[{"id":"u16c-01","type":"num","q":"VA 1GB, page 512B, PTE 4B. VPN 은 몇 비트인가?","explain":"30 − 9 = 21비트.","src":"16강 p.25","wiki":"3단계 page table","tags":["multi-level"],"answer":21,"unit":"bit","tol":0},{"id":"u16c-02","type":"num","q":"VA 1GB, page 512B, PTE 4B 를 2단계로 하면 page directory 크기는 몇 KB 인가?","explain":"PT index 7비트(512/4 = 128) → PD index 14비트 → $2^{14}$ × 4B = 64KB. 한 page 에 안 들어간다(p.26).","src":"16강 p.25~26","wiki":"3단계 page table","prof":true,"diff":2,"tags":["multi-level"],"answer":64,"unit":"KB","tol":0},{"id":"u16c-03","type":"num","q":"위 64KB page directory 는 512B page 몇 장에 걸치는가?","explain":"p.27 \"it spans not one page but 128 pages.\" 64KB / 512B = 128.","src":"16강 p.27","wiki":"3단계 page table","tags":["multi-level"],"answer":128,"unit":"장","tol":0},{"id":"u16c-04","type":"cloze","q":"1GB/512B/4B 를 3단계로 나누면 VA = PD Index 0 (___ 비트) | PD Index 1 (7비트) | PT Index (7비트) | offset (___ 비트)","explain":"p.27~28. 모든 노드가 128 entry × 4B = 512B = 한 page.","src":"16강 p.27~28","wiki":"3단계 page table","tags":["multi-level"],"answer":["7","9"],"bank":["7","9","14","12","6"]},{"id":"u16c-05","type":"num","q":"3단계 page table 에서 TLB miss 한 번에 표 3개를 모두 걸으면 메모리 접근은 몇 번인가? (data 포함)","explain":"표 3번 + data 1번 = 4번. 영상 34:06.","src":"16강 p.29","wiki":"3단계 page table","tags":["multi-level"],"answer":4,"unit":"번","tol":0},{"id":"u16c-06","type":"num","q":"p.29 예: VA 766307601 = 91 | 44 | 118 | 273 이고 PT[118] 의 PFN 이 4131230 이다. page 512B 일 때 PA 는?","explain":"PA = 4131230 × 512 + 273 = 2115189760 + 273 = 2115190033. 슬라이드의 0x2DACECBB 표기는 오류라 그림 필드 기준.","src":"16강 p.29","wiki":"3단계 page table","diff":3,"answer":2115190033,"tol":0},{"id":"u16c-07","type":"num","q":"48비트 VA, 4KB page, 8B PTE 를 \"모든 노드가 한 page\" 규칙으로 나누면 몇 단계인가?","explain":"offset 12 → VPN 36. page 당 PTE 4096/8 = 512 → index 9비트 → 36/9 = 4단계 (x86-64).","src":"위키 3단계 page table 퀴즈","wiki":"3단계 page table","diff":2,"answer":4,"unit":"단계","tol":0},{"id":"u16c-08","type":"cloze","q":"Inverted page table 은 시스템 전체에 표 ___ 개를 두고, ___ page 하나당 PTE 하나를 둔다. 항목의 index 가 곧 ___ 이다.","explain":"p.32 원문. # of PTEs = # of physical pages.","src":"16강 p.32","wiki":"inverted page table","prof":true,"tags":["inverted"],"answer":["1","physical","PFN"],"bank":["1","physical","PFN","virtual","VPN","프로세스 수"]},{"id":"u16c-09","type":"mc","q":"inverted page table 에서 hash 의 입력에 VPN 과 함께 PID 가 필요한 이유는?","explain":"영상 39:22. 시스템 전체 표라 (PID, VPN) 쌍이 열쇠다.","src":"16강 p.32","wiki":"inverted page table","tags":["inverted"],"choices":["다른 프로세스가 같은 VPN 을 쓸 수 있어서","PFN 을 계산하려고","TLB 를 flush 하려고","PTE 크기를 줄이려고"],"answer":0},{"id":"u16c-10","type":"mc","q":"inverted page table 의 장점이 아닌 것은?","explain":"p.33~34 단점: hash collision(최악 시간 김), page sharing 어려움, swapping 지원 비효율.","src":"16강 p.33~34","wiki":"inverted page table","tags":["inverted"],"choices":["page sharing 이 쉽다","물리 메모리 크기에 비례하는 표 하나","collision 이 없으면 TLB miss 처리 메모리 참조가 적다","프로세스마다 표를 따로 둘 필요가 없다"],"answer":0},{"id":"u16c-11","type":"tf","q":"교수님은 inverted page table 이 valid 이지만 frame 에 없는 page 를 표현할 수 없어서 swapping 구현이 어렵다고 했다.","explain":"11/9 16강 복습. 디스크로 나간 page 는 frame 이 없어 표에 줄이 없다.","src":"11/9 녹음","wiki":"inverted page table","prof":true,"tags":["inverted"],"answer":true},{"id":"u16c-12","type":"mc","q":"교수님이 비교한 결정성(deterministic) 측면으로 옳은 것은?","explain":"11/9 녹음. 예: 16 entry 면 최악 16번.","src":"11/9 녹음","wiki":"hash collision","prof":true,"diff":2,"choices":["multi-level 은 3단계면 정확히 3번, inverted 는 collision 이 나면 최악 entry 수만큼","둘 다 항상 1번","inverted 가 항상 더 적게 읽는다","multi-level 은 hash 를 쓴다"],"answer":0},{"id":"u16c-13","type":"mc","q":"hash collision 을 줄이려고 inverted page table 의 항목 수를 물리 page 수보다 늘리면 반드시 추가해야 하는 필드는?","explain":"p.36: 항목 수 > 물리 page 수라 위치로 PFN 을 알 수 없다. 덕분에 page sharing 문제는 풀린다.","src":"16강 p.35~36","wiki":"hash collision","diff":3,"choices":["PFN 필드","ASID 필드","dirty 비트","PDBR"],"answer":0},{"id":"u16c-14","type":"tf","q":"inverted page table 의 PTE 개수는 가상 page 수와 같다.","explain":"p.32 \"# of PTEs = # of physical pages.\" 표 크기가 물리 메모리에 묶인다.","src":"16강 p.32","wiki":"inverted page table","tags":["inverted"],"answer":false}]},{"id":"u16d","title":"Huge page · THP · Sv39","items":[{"id":"u16d-01","type":"mc","q":"huge page 가 필요한 이유로 p.38 이 든 것은?","explain":"p.38. 메모리가 GB 단위라 page 가 수백만 개 → TLB miss 와 walk 비용이 크다. 보통 4KB, 2MB, 1GB 를 섞는다.","src":"16강 p.38","wiki":"huge page","tags":["huge page"],"choices":["High TLB pressure 와 큰 page table 메모리 오버헤드","external fragmentation","disk seek","Belady's anomaly"],"answer":0},{"id":"u16d-02","type":"num","q":"2MB huge page 하나는 4KB page 몇 개와 같은 범위를 덮는가?","explain":"2MB / 4KB = 512. 교수님: page table 한 장 4KB / PTE 8B = 512 entry 라 512배씩 커진다.","src":"16강 p.38, 11/9 녹음","wiki":"huge page","prof":true,"tags":["huge page"],"answer":512,"unit":"개","tol":0},{"id":"u16d-03","type":"num","q":"4KB page 로 1GB 를 덮으려면 TLB 항목이 몇 개 필요한가?","explain":"$2^{30}$ / $2^{12}$ = $2^{18}$ = 262144. 2MB page 면 512개.","src":"위키 huge page 퀴즈","wiki":"huge page","diff":2,"answer":262144,"unit":"개","tol":0},{"id":"u16d-04","type":"match","q":"huge page 방식과 결정 주체를 연결하시오","explain":"p.39. 영상 53:25 \"who makes the allocation decision\".","src":"16강 p.39","wiki":"huge page","pairs":[["Explicit Huge Page","애플리케이션이 요청 (hugetlbfs, 미리 예약)"],["Transparent Huge Page","커널이 자동 관리"],["Promotion","연속된 작은 page 를 huge page 로 합침"],["Demotion","huge page 를 작은 page 로 쪼갬"]]},{"id":"u16d-05","type":"sa","q":"THP 에서 작은 page 들을 huge page 로 합치는 것을 무엇이라 하는가?","explain":"p.41 \"Promote the contiguous pages.\" 조건: virtually- and physically-contiguous.","src":"16강 p.41","wiki":"transparent huge page","tags":["THP"],"answer":"promotion","alts":["promote"]},{"id":"u16d-06","type":"cloze","q":"promotion 의 조건은 virtually- and ___ contiguous pages 다. 물리적으로 흩어져 있으면 ___ 으로 연속을 만든다.","explain":"p.41~42. compaction 은 성공이 보장되지 않고 시간이 든다(영상 58:36).","src":"16강 p.41~42","wiki":"transparent huge page","tags":["THP"],"answer":["physically-","compaction"],"bank":["physically-","compaction","logically-","demotion","coalescing"]},{"id":"u16d-07","type":"sa","q":"huge page 안의 안 쓰는 page 를 해제하려고 다시 작은 page 로 쪼개는 것은?","explain":"p.44 \"We cannot free the unused page in the huge page\" → demotion.","src":"16강 p.44","wiki":"transparent huge page","tags":["THP"],"answer":"demotion","alts":["demote"]},{"id":"u16d-08","type":"mc","q":"THP 의 한계 세 가지(p.45)에 들지 않는 것은?","explain":"THP 는 오히려 TLB miss 를 줄이려는 것이다. Database 는 latency spike 때문에 THP 를 끄라고 권한다.","src":"16강 p.45","wiki":"transparent huge page","prof":true,"tags":["THP"],"choices":["TLB miss 증가","Increased memory usage","Tail latency","External fragmentation"],"answer":0},{"id":"u16d-09","type":"tf","q":"Database 애플리케이션은 보통 THP 를 켜라고 권한다.","explain":"p.45 \"Database application usually recommends to turn-off THP\". demotion·compaction 이 예측 못 할 latency spike 를 낸다.","src":"16강 p.45","wiki":"transparent huge page","diff":1,"answer":false},{"id":"u16d-10","type":"match","q":"Sv39 PTE 의 X W R 값과 뜻을 연결하시오","explain":"p.48 Table 4.4. RISC-V 는 같은 entry 형식을 R/W/X 로 branch 와 leaf 로 구분한다. W 만 켜진 것은 reserved.","src":"16강 p.48","wiki":"Sv39 PTE","prof":true,"tags":["Sv39"],"pairs":[["0 0 0","다음 레벨 page table 포인터 (branch)"],["0 0 1","Read-only page (leaf)"],["0 1 0","Reserved"],["1 0 1","Read-execute page (leaf)"]]},{"id":"u16d-11","type":"cloze","q":"Sv39 는 VA 39비트를 ___ | 9 | 9 | 12 로 나누는 3단계다. 한 단계 위에서 leaf 가 되면 page 크기는 ___ 다.","explain":"4KB × $2^9$ = 2MB, 맨 위 레벨 leaf 는 1GB.","src":"16강 p.48","wiki":"Sv39 PTE","tags":["Sv39"],"answer":["9","2MB"],"bank":["9","2MB","10","4MB","1GB"]},{"id":"u16d-12","type":"mc","q":"x86_64 에서 PMD(PDE) entry 가 2MB page 를 직접 가리키는지 표시하는 비트는?","explain":"p.46~47. 0 이면 아래 page table 주소, 1 이면 2MB page 주소(VA 하위 21비트가 offset).","src":"16강 p.46~47","wiki":"huge page","diff":2,"choices":["Page Size 비트","Present 비트","Dirty 비트","RSW 비트"],"answer":0},{"id":"u16d-13","type":"tf","q":"multi-level page table 은 표의 메모리는 줄이지만 TLB miss 때 walk 를 길게 만들어서 TLB pressure 문제는 풀지 못한다.","explain":"영상 50:38 \"the performance depends on the TLB\". 그래서 huge page 가 필요하다.","src":"16강 p.38","wiki":"huge page","diff":2,"answer":true}]}]},{"id":"u17","title":"17강 Swapping","desc":"swap space · page fault · EAT · thrashing · 교체 정책 · Clock","lessons":[{"id":"u17a","title":"Swap space 와 page fault","items":[{"id":"u17a-01","type":"sa","q":"물리 메모리에 다 못 올리는 page 를 디스크에 두는 공간은? (영어 두 단어)","explain":"p.14 \"Reserve some space on the disk for moving pages back and forth.\" OS 는 page-sized unit 으로 위치를 기억한다.","src":"17강 p.13~14","wiki":"swap space","tags":["swap"],"answer":"swap space"},{"id":"u17a-02","type":"mc","q":"swap space 를 관리하는 단위는?","explain":"p.14. 교수님은 swap space 의 단위를 frame 대신 block 이라고 불렀다.","src":"17강 p.14, 11/9 녹음","wiki":"swap space","prof":true,"choices":["page-sized unit (block)","sector","segment","byte"],"answer":0},{"id":"u17a-03","type":"cloze","q":"PTE 의 ___ bit 가 1 이면 page 가 물리 메모리에 있고, 0 이면 ___ 에 있다. 0 인 page 를 참조하면 ___ 가 난다.","explain":"p.16. Valid 0 + 주소 칸이 disk address 면 디스크에 있음, null 이면 아직 할당 안 됨.","src":"17강 p.16","wiki":"page fault","tags":["page fault"],"answer":["present","disk","page fault"],"bank":["present","disk","page fault","dirty","TLB","segmentation fault"]},{"id":"u17a-04","type":"mc","q":"교수님이 \"page fault\" 를 fault 라고 부르는 이유로 든 것은?","explain":"11/9 녹음: 복구할 수 있어서 fault. valid 0 이고 disk address 도 없으면 매핑이 없는 것 → abort.","src":"11/9 녹음","wiki":"page fault","prof":true,"tags":["page fault"],"choices":["recoverable 이기 때문","항상 프로세스를 죽이기 때문","하드웨어 결함이기 때문","TLB 가 실패해서"],"answer":0},{"id":"u17a-05","type":"order","q":"page fault 의 control flow (p.23)","explain":"p.23 여섯 단계. 번호 순서 쓰기 문제 후보.","src":"17강 p.23","wiki":"page fault","prof":true,"tags":["page fault"],"answer":["Reference: 명령이 page table 참조","Trap: present 0 이라 OS 로","Check storage: page 가 어디 있는지 확인","Get the page: 디스크에서 빈 frame 으로","Reset page table","Reinstruction: 그 명령 재실행"]},{"id":"u17a-06","type":"tf","q":"page fault 처리가 끝나면 CPU 는 fault 를 낸 명령의 다음 명령부터 실행한다.","explain":"fault 를 낸 바로 그 명령을 재실행(restart)한다. 이번에는 page hit 다. 시스템 콜은 다음 명령으로 간다.","src":"17강 p.22~23","wiki":"page fault","diff":2,"tags":["page fault"],"answer":false},{"id":"u17a-07","type":"mc","q":"page fault handler 가 메모리가 꽉 찼을 때 내보낼 page 를 고르는 것을 무엇이라 하나?","explain":"p.20 \"OS page-fault handler selects a victim to be evicted (VP 4) – page replacement.\"","src":"17강 p.20","wiki":"page fault","choices":["page replacement (victim 선택)","prefetching","compaction","promotion"],"answer":0},{"id":"u17a-08","type":"tf","q":"OS 는 page fault 처리 흐름(mechanism)과 어떤 page 를 내보낼지(policy)를 분리한다.","explain":"11/9 녹음. mechanism 과 policy 의 분리는 OS 설계의 반복되는 원칙이다.","src":"11/9 녹음","wiki":"page fault","prof":true,"answer":true},{"id":"u17a-09","type":"mc","q":"software-managed TLB 에서 page fault 흐름은 hardware-managed 와 어떻게 다른가? (교수님 답)","explain":"11/9 녹음 질문. HW-managed 는 page table walk 가 실패하면 fault.","src":"11/9 녹음","wiki":"page fault","prof":true,"diff":2,"choices":["흐름은 같고, TLB miss 에서 바로 OS 로 trap 해 OS 가 page table 을 본다는 점만 다르다","완전히 다른 흐름이다","page fault 가 생기지 않는다","하드웨어가 디스크를 직접 읽는다"],"answer":0},{"id":"u17a-10","type":"match","q":"PTE 상태와 뜻을 연결하시오","explain":"p.16 그림의 Valid 칸과 주소 칸을 같이 읽는다.","src":"17강 p.16","wiki":"page fault","pairs":[["Page hit","VM word 가 물리 메모리에 있음 (DRAM cache hit)"],["Page fault","VM word 가 물리 메모리에 없음 (DRAM cache miss)"],["Valid 0 + disk address","디스크에 있음"],["Valid 0 + null","아직 할당되지 않음"]]},{"id":"u17a-11","type":"tf","q":"교수님에 따르면 동시에 running 인 프로세스 수는 코어 수만큼이고 나머지는 blocked·waiting 인데도 메모리를 차지한다 — 이것이 swapping 의 동기다.","explain":"11/9 녹음 p.11~15.","src":"11/9 녹음","wiki":"스와핑","prof":true,"answer":true},{"id":"u17a-12","type":"mc","q":"page fault 는 누가 일으키는 exception 인가?","explain":"p.18. MMU 가 present 0 을 보고 exception 을 올리고 OS handler 가 처리한다.","src":"17강 p.18","wiki":"page fault","diff":1,"choices":["하드웨어(MMU)","OS 스케줄러","사용자 프로그램의 system call","디스크 컨트롤러"],"answer":0},{"id":"u17a-13","type":"tf","q":"valid 0 이고 주소 칸이 null 인 PTE 는 그 page 가 디스크에 있다는 뜻이다.","explain":"null 이면 아직 할당되지 않은 page 다. 디스크에 있으면 주소 칸에 disk address 가 있다.","src":"17강 p.16","wiki":"page fault","diff":2,"answer":false}]},{"id":"u17b","title":"EAT · working set · swap daemon","items":[{"id":"u17b-01","type":"cloze","q":"EAT = (1 − p) × ___ + p × ___ (p = page-fault rate)","explain":"p.25. 가정: memory access 200 ns, page-fault time 8 ms.","src":"17강 p.25","wiki":"effective access time","tags":["EAT"],"answer":["memory access time","page-fault time"],"bank":["memory access time","page-fault time","TLB lookup time","seek time"]},{"id":"u17b-02","type":"num","q":"memory access 200 ns, page-fault time 8 ms, p = 1/1000 일 때 EAT 는 몇 ns 인가?","explain":"(1 − 0.001) × 200 + 0.001 × 8,000,000 = 199.8 + 8000 = 8199.8 ns ≈ 8.2 µs.","src":"17강 p.25~26","wiki":"effective access time","prof":true,"tags":["EAT"],"answer":8199.8,"unit":"ns","tol":0.001},{"id":"u17b-03","type":"num","q":"위 경우(8199.8 ns) 메모리 접근보다 몇 배 느린가? (정수로)","explain":"8199.8 / 200 ≈ 41. 슬라이드의 \"factor of 40\" 을 교수님이 41 로 정정했다.","src":"17강 p.26, 11/9 녹음","wiki":"effective access time","prof":true,"tags":["EAT"],"answer":41,"unit":"배","tol":0.01},{"id":"u17b-04","type":"num","q":"memory access 200 ns, page-fault time 8 ms, p = 1/10,000 일 때 EAT 는 몇 ns 인가?","explain":"EAT = 200 + 7,999,800 × 0.0001 = 200 + 799.98 = 999.98 ns (약 5배).","src":"위키 effective access time 퀴즈","wiki":"effective access time","tags":["EAT"],"answer":999.98,"unit":"ns","tol":0.001},{"id":"u17b-05","type":"num","q":"memory access 100 ns, page-fault time 10 ms, p = 0.0001 일 때 EAT 는 몇 ns 인가?","explain":"(1 − 0.0001) × 100 + 0.0001 × 10,000,000 = 99.99 + 1000 = 1099.99 ns.","src":"17강 p.25 식 적용","wiki":"effective access time","diff":2,"tags":["EAT"],"answer":1099.99,"unit":"ns","tol":0.001},{"id":"u17b-06","type":"mc","q":"200 ns / 8 ms 조건에서 성능 저하를 10% 이내로 하려면 page fault 는 몇 번에 1번 미만이어야 하나?","explain":"200 + 7,999,800p \u003c 220 → p \u003c 20/7,999,800 ≈ 2.5 × $10^{-6}$ → 400,000번에 1번.","src":"17강 p.26","wiki":"effective access time","prof":true,"diff":2,"choices":["400,000번","40,000번","1,000번","4,000,000번"],"answer":0},{"id":"u17b-07","type":"tf","q":"교수님은 0.1% miss rate 가 TLB·cache 에선 쓸 만하지만 page fault 로는 받아들일 수 없다고 했다.","explain":"11/9 녹음. disk 는 DRAM 보다 약 10,000배 느려서 miss 하나가 너무 비싸다.","src":"11/9 녹음","wiki":"effective access time","prof":true,"answer":true},{"id":"u17b-08","type":"mc","q":"교체 정책을 하드웨어가 아니라 SW 로 만드는 이유(교수님)는?","explain":"11/9 녹음. TLB 는 miss 비용이 작아 HW 로 단순하게(fully associative) 한다.","src":"11/9 녹음","wiki":"페이지 교체 정책","prof":true,"choices":["miss 비용이 DRAM 의 약 10,000배라 정교하고 비싼 알고리즘을 써도 이득이라서","하드웨어가 디스크를 못 읽어서","TLB 와 같은 이유로","SW 가 항상 더 빨라서"],"answer":0},{"id":"u17b-09","type":"sa","q":"\"Performance meltdown where pages are swapped in and out continuously\" 를 뜻하는 용어는?","explain":"p.27. working set size > main memory size 일 때 일어난다.","src":"17강 p.27","wiki":"working set과 thrashing","tags":["thrashing"],"answer":"thrashing"},{"id":"u17b-10","type":"tf","q":"Oversubscription(할당된 가상 메모리 > 물리 메모리)이면 반드시 thrashing 이 난다.","explain":"교수님: oversubscription 은 필요조건이지 충분조건이 아니다. thrashing 은 working set > 메모리일 때. 할당된 메모리가 전부 hot 하진 않다.","src":"11/11 녹음","wiki":"working set과 thrashing","prof":true,"diff":2,"tags":["thrashing"],"answer":false},{"id":"u17b-11","type":"mc","q":"교수님이 말한 서버에서의 swapping 운영은?","explain":"11/9 녹음 \"They choose to die\". thrashing 은 응답이 없어 원인 찾기도 어렵다. 데스크톱·폰에서는 swapping 이 효과적.","src":"11/9 녹음","wiki":"working set과 thrashing","prof":true,"choices":["보통 swapping 을 끈다 — 메모리가 모자라면 죽는 쪽을 택한다","항상 swap space 를 최대로 늘린다","THP 를 켠다","swap daemon 의 HW 를 LW 와 같게 둔다"],"answer":0},{"id":"u17b-12","type":"cloze","q":"swap daemon 은 빈 page 가 ___ Watermark 보다 적어지면 깨어나고, ___ Watermark 만큼 비면 잠든다.","explain":"p.28. 여기서 HW 는 High Watermark 이지 hardware 가 아니다.","src":"17강 p.28","wiki":"swap daemon","tags":["swap daemon"],"answer":["Low","High"],"bank":["Low","High","Middle","Hardware","Zero"]},{"id":"u17b-13","type":"mc","q":"LW 와 HW 를 다르게 두는 이유(교수님 답)는?","explain":"11/9 녹음. 같으면 free page 가 한 장만 모자라도 thread 가 깨어나 한 장만 회수한다. \"배고프면 배부를 때까지 먹는다.\" 두 번째 보기는 학생 답(\"one direction\").","src":"11/9 녹음","wiki":"swap daemon","prof":true,"diff":2,"choices":["background thread 를 부르는 횟수(overhead)를 줄이려고","나중에 메모리가 더 필요할 수 있어서","dirty page 를 줄이려고","TLB flush 를 피하려고"],"answer":0},{"id":"u17b-14","type":"mc","q":"thrashing 에 대해 p.54 가 제시한 대처는?","explain":"p.54 \"Decide not to run a subset of processes\". 남은 프로세스의 working set 이 메모리에 들어가게 한다.","src":"17강 p.54","wiki":"working set과 thrashing","choices":["일부 프로세스를 돌리지 않는다","swap space 를 줄인다","page 크기를 줄인다","TLB 를 키운다"],"answer":0}]},{"id":"u17c","title":"교체 정책 손으로 돌리기","items":[{"id":"u17c-01","type":"match","q":"교체 정책과 내보내는 page 를 연결하시오","explain":"p.30~49 정책 다섯 가지.","src":"17강 p.30~49","wiki":"페이지 교체 정책","tags":["교체 정책"],"pairs":[["Optimal","가장 먼 미래에 쓸 page"],["FIFO","가장 먼저 들어온 page"],["LRU","가장 오래전에 쓴 page"],["Random","무작위"],["Clock","reference bit 가 0 인 page"]]},{"id":"u17c-02","type":"num","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개, 처음엔 비어 있음. Optimal 의 hit 수는?","explain":"0 1 2 miss, 0 1 hit, 3 miss(가장 늦게 쓸 2 를 뺌), 0 3 1 hit, 2 miss(0 과 3 동률), 1 hit → hit 6.","src":"17강 p.32","wiki":"Optimal 교체","prof":true,"tags":["교체 정책"],"answer":6,"unit":"번","tol":0},{"id":"u17c-03","type":"num","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개, 처음엔 비어 있음. Optimal 의 hit rate 는 몇 % 인가? (소수 첫째 자리)","explain":"6/11 = 54.545…% → 54.5%. 슬라이드의 54.6% 는 반올림 오류라 교수님도 \"맞는지 모르겠다\"고 했다.","src":"17강 p.32, 11/9 녹음","wiki":"Optimal 교체","prof":true,"tags":["교체 정책"],"answer":54.5,"unit":"%","tol":0.002},{"id":"u17c-04","type":"num","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개, 처음엔 비어 있음. FIFO 의 hit 수는?","explain":"0 1 2 miss, 0 1 hit, 3 miss(0 뺌), 0 miss(1 뺌), 3 hit, 1 miss(2 뺌), 2 miss(3 뺌), 1 hit → hit 4 (36.4%).","src":"17강 p.34","wiki":"FIFO 교체","prof":true,"tags":["교체 정책"],"answer":4,"unit":"번","tol":0},{"id":"u17c-05","type":"num","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개, 처음엔 비어 있음. LRU 의 hit 수는?","explain":"0 1 2 miss, 0 1 hit, 3 miss(2 뺌), 0 3 1 hit, 2 miss(0 뺌), 1 hit → hit 6. OPT 와 같지만 교수님은 이 예가 LRU 가 좋은 진짜 이유(burst)를 보여 주진 않는다고 했다.","src":"17강 p.39","wiki":"LRU","prof":true,"tags":["교체 정책"],"answer":6,"unit":"번","tol":0},{"id":"u17c-06","type":"sa","q":"어떤 정책도 피할 수 없는, 처음 올리는 page 의 miss 를 무엇이라 하나? (cold miss 라고도 함)","explain":"11/9 녹음: 처음 세 miss = compulsory miss (cold miss).","src":"17강 p.32, 11/9 녹음","wiki":"Optimal 교체","prof":true,"answer":"compulsory miss","alts":["cold miss","compulsory"]},{"id":"u17c-07","type":"num","q":"참조열 1 2 3 4 1 2 5 1 2 3 4 5, FIFO, frame 3개일 때 page fault 수는?","explain":"1 2 3 4(1 뺌) 1(2 뺌) 2(3 뺌) 5(4 뺌) 1·2 hit 3(1 뺌) 4(2 뺌) 5 hit → fault 9.","src":"위키 FIFO 교체 (OSTEP 22장)","wiki":"FIFO 교체","diff":2,"tags":["Belady"],"answer":9,"unit":"번","tol":0},{"id":"u17c-08","type":"num","q":"같은 참조열 1 2 3 4 1 2 5 1 2 3 4 5, FIFO, frame 4개일 때 page fault 수는?","explain":"1 2 3 4 miss, 1·2 hit, 5(1 뺌) 1(2 뺌) 2(3 뺌) 3(4 뺌) 4(5 뺌) 5(1 뺌) → fault 10. frame 을 늘렸는데 fault 가 늘었다.","src":"위키 FIFO 교체 (OSTEP 22장)","wiki":"FIFO 교체","diff":3,"tags":["Belady"],"answer":10,"unit":"번","tol":0},{"id":"u17c-09","type":"sa","q":"frame 을 늘렸는데 hit ratio 가 떨어지는 FIFO 의 현상 이름은?","explain":"p.35 \"FIFO often shows a lower hit ratio with more page frames.\"","src":"17강 p.35","wiki":"FIFO 교체","prof":true,"tags":["Belady"],"answer":"Belady's anomaly","alts":["Belady anomaly","Belady"]},{"id":"u17c-10","type":"tf","q":"LRU 와 OPT 에서도 Belady's anomaly 가 생길 수 있다.","explain":"LRU·OPT 는 stack algorithm 이라 생기지 않는다. 교수님은 \"non-optimal policy 는 관계를 보장하지 않는다\"고 했지만, 객관식에서 Belady 가능 정책은 FIFO 를 고른다.","src":"위키 FIFO 교체, 11/9 녹음","wiki":"FIFO 교체","prof":true,"diff":3,"tags":["Belady"],"answer":false},{"id":"u17c-11","type":"num","q":"frame 3개, 참조열 7 0 1 2 0 3 0 4. LRU 의 hit 수는?","explain":"7 0 1 miss, 2 miss(7 뺌), 0 hit, 3 miss(1 뺌), 0 hit, 4 miss(2 뺌) → hit 2.","src":"위키 LRU 퀴즈","wiki":"LRU","tags":["교체 정책"],"answer":2,"unit":"번","tol":0},{"id":"u17c-12","type":"num","q":"frame 3개, 참조열 1 2 3 1 4 2 5 1. Optimal 의 hit 수는?","explain":"1 2 3 miss, 1 hit, 4 miss(다시 안 쓰는 3 뺌), 2 hit, 5 miss(2·4 모두 다시 안 씀, 아무거나), 1 hit → hit 3.","src":"17강 p.31 규칙 적용","wiki":"Optimal 교체","diff":2,"tags":["교체 정책"],"answer":3,"unit":"번","tol":0},{"id":"u17c-13","type":"num","q":"frame 3개, 참조열 1 2 3 1 4 2 5 1. LRU 의 hit 수는?","explain":"1 2 3 miss, 1 hit(순서 2,3,1), 4 miss(2 뺌), 2 miss(3 뺌), 5 miss(1 뺌), 1 miss → hit 1. 이 참조열에선 FIFO(hit 2)가 LRU 보다 낫다.","src":"17강 p.39 규칙 적용","wiki":"LRU","diff":3,"tags":["교체 정책"],"answer":1,"unit":"번","tol":0},{"id":"u17c-14","type":"tf","q":"Random 교체는 p.32 예 트레이스에서 OPT 와 같은 hit 6 을 낼 때도 있다.","explain":"p.37 \"Sometimes, Random is as good as optimal, achieving 6 hits.\" 교수님: 여러 번 돌리면 약 40% 가 hit 6.","src":"17강 p.37, 11/9 녹음","wiki":"Random 교체","prof":true,"answer":true}]},{"id":"u17d","title":"Workload · LRU 구현 · Clock · dirty","items":[{"id":"u17d-01","type":"match","q":"workload 와 결과를 연결하시오","explain":"p.40~42. 교수님은 looping sequential 을 scan workload 라 불렀다.","src":"17강 p.40~42","wiki":"페이지 교체 정책","prof":true,"tags":["workload"],"pairs":[["No-locality","OPT 외 정책은 차이 없음"],["80-20","LRU 가 hot page 를 잘 붙들어 우세"],["Looping sequential","cache \u003c 50 이면 LRU·FIFO 0%"],["cache 가 workload 전체를 담을 때","어느 정책이든 hit rate 같음"]]},{"id":"u17d-02","type":"tf","q":"교수님은 LRU 가 scan resistant 하다고 했다.","explain":"11/11 녹음: LRU 는 scan resistant 가 아니다. 49칸이면 매번 곧 쓸 page 를 내보낸다. 해법: 따로 메커니즘, cache 키우기, 작업을 나눠 working set 줄이기(blocking).","src":"11/11 녹음","wiki":"페이지 교체 정책","prof":true,"diff":2,"answer":false},{"id":"u17d-03","type":"num","q":"0~49 page 를 반복 참조(총 10,000회)하는 looping workload 에서 cache 가 50 page 이면 hit rate 는 몇 % 인가?","explain":"첫 바퀴 miss 50번 뒤로 전부 hit → (10,000 − 50)/10,000 = 99.5%.","src":"위키 페이지 교체 정책 p.42","wiki":"페이지 교체 정책","diff":2,"tags":["workload"],"answer":99.5,"unit":"%","tol":0.001},{"id":"u17d-04","type":"mc","q":"looping sequential 에서 cache 가 50 미만일 때 LRU·FIFO 보다 나은 정책은? (OPT 제외)","explain":"교수님: Random 은 한 바퀴 뒤에도 안 바뀐 block 이 남아 cache 40 이면 약 60%.","src":"17강 p.42, 11/11 녹음","wiki":"페이지 교체 정책","prof":true,"diff":2,"choices":["Random","없다 — 모두 0%","LFU","Clock"],"answer":0},{"id":"u17d-05","type":"mc","q":"교수님이 LRU 가 LFU 보다 대개 낫다고 한 이유는?","explain":"11/11 녹음. frequency 는 긴 기간의 평균(global), recency 는 시간에 따라 바뀌는 특성.","src":"11/11 녹음","wiki":"LRU","prof":true,"choices":["실제 접근은 짧은 구간에 몰리는 burst 라서 recency 가 더 잘 맞는다","LFU 는 구현이 불가능해서","LRU 는 Belady 가 없어서","LFU 는 dirty bit 를 못 써서"],"answer":0},{"id":"u17d-06","type":"match","q":"LRU 구현과 비용을 연결하시오","explain":"p.44~45. 교수님: stack 은 포인터 4~6개, singly linked 로는 안 된다. 둘 다 HW 지원이 필요해서 Clock 을 쓴다.","src":"17강 p.44~45, 11/11 녹음","wiki":"LRU","prof":true,"pairs":[["Counter (timestamp)","교체 때 표 전체 검색 필요"],["Stack (doubly linked list)","접근마다 포인터 여러 개 갱신, 검색 불필요"],["Clock","reference bit 하나로 LRU 근사"],["LFU","접근 횟수(frequency)가 가장 적은 page 를 뺌"]]},{"id":"u17d-07","type":"cloze","q":"Clock: 참조될 때 reference bit 를 1 로 만드는 것은 ___ 이고, 1 을 0 으로 지우는 것은 ___ 다.","explain":"p.46 \"Hardware never clears the bit, though; that is the responsibility of the OS.\"","src":"17강 p.46","wiki":"Clock 알고리즘","prof":true,"tags":["Clock"],"answer":["hardware","OS"],"bank":["hardware","OS","사용자 프로그램","disk controller","TLB"]},{"id":"u17d-08","type":"mc","q":"Clock 에서 page A(1), B(0), C(1) 이 원형이고 hand 가 A 에 있다. page fault 시 victim 은?","explain":"A 는 1 → 0 으로 지우고 넘어감, B 는 0 → victim. 교체 직전 A 의 bit 은 0.","src":"위키 Clock 알고리즘 퀴즈","wiki":"Clock 알고리즘","tags":["Clock"],"choices":["B","A","C","없음 — 한 바퀴 더"],"answer":0},{"id":"u17d-09","type":"mc","q":"Clock 에서 page A(1), B(1), C(1) 이 원형이고 hand 가 A 에 있다. victim 은?","explain":"A·B·C 를 차례로 1→0 으로 지우고 넘어가 다시 A 에 오면 0 → victim. 모두 1 이면 FIFO 처럼 동작한다.","src":"17강 p.47 규칙 적용","wiki":"Clock 알고리즘","diff":3,"tags":["Clock"],"choices":["A (한 바퀴 돌며 모두 0 으로 지운 뒤)","B","C","고를 수 없음"],"answer":0},{"id":"u17d-10","type":"tf","q":"Clock 은 perfect LRU 만큼은 아니지만 history 를 전혀 안 보는 정책보다는 낫다.","explain":"p.49. 80-20 workload 에서 LRU 와 FIFO/RAND 사이.","src":"17강 p.49","wiki":"Clock 알고리즘","answer":true},{"id":"u17d-11","type":"mc","q":"dirty page 와 clean page 중 보통 victim 으로 고르는 쪽과 이유는?","explain":"p.50 \"If a page has not been modified, the eviction is free. Usually, a clean page is selected as a victim.\"","src":"17강 p.50","wiki":"demand paging","tags":["dirty"],"choices":["clean — 내보낼 때 디스크 쓰기가 없어서","dirty — 이미 수정돼서","clean — reference bit 가 1 이라서","dirty — swap space 가 비어서"],"answer":0},{"id":"u17d-12","type":"match","q":"용어와 정의를 연결하시오","explain":"p.52~53. 교수님: prefetching 은 기대만큼 잘 안 되지만 \"too strong to neglect\".","src":"17강 p.52~53","wiki":"demand paging","prof":true,"pairs":[["Demand paging","접근할 때 page 를 가져옴"],["Prefetching","곧 쓸 page 를 미리 가져옴"],["Clustering","밀린 write 를 모아 한 번에 디스크에 씀"],["Dirty bit","수정돼서 내보낼 때 write back 필요"]]},{"id":"u17d-13","type":"tf","q":"swapping 때문에 PTE 에 present · dirty · reference 세 비트가 추가되었고 x86, RISC-V 모두 있다.","explain":"11/11 녹음.","src":"11/11 녹음","wiki":"demand paging","prof":true,"diff":1,"answer":true},{"id":"u17d-14","type":"cloze","q":"Clock 에서 hand 가 가리킨 page 의 reference bit 가 1 이면 ___ 으로 지우고 넘어가고, 0 이면 ___ 으로 고른다.","explain":"p.47 표: Use bit 1 → clear and advance, 0 → evict.","src":"17강 p.47","wiki":"Clock 알고리즘","tags":["Clock"],"answer":["0","victim"],"bank":["0","victim","1","dirty","present"]}]}]},{"id":"u18","title":"18강 I/O Devices and HDD","desc":"canonical device · polling/interrupt · DMA · MMIO · 접근 시간 · 디스크 스케줄링 · RAID","lessons":[{"id":"u18a","title":"I/O 장치와 인터페이스","items":[{"id":"u18a-01","type":"mc","q":"bus 를 계층(memory bus → general I/O bus → peripheral I/O bus)으로 두는 이유(p.5)는?","explain":"빠른 bus 는 짧아야 하고 비싸다. 교수님 키보드 예: 초당 600 byte 면 충분하니 10 Gbps 가 필요 없다.","src":"18강 p.5, 11/11 녹음","wiki":"I/O 시스템 구조","prof":true,"choices":["physics and cost","protection and sharing","locality","fairness"],"answer":0},{"id":"u18a-02","type":"match","q":"canonical device 의 레지스터와 역할을 연결하시오","explain":"p.6 \"Three registers are minimally required.\"","src":"18강 p.6","wiki":"canonical device","prof":true,"tags":["I/O"],"pairs":[["Status register","장치의 현재 상태를 본다"],["Command register","장치에 할 일을 시킨다"],["Data register","장치와 데이터를 주고받는다"],["Internal structure","장치마다 다른 펌웨어·메모리·칩 (OS 는 몰라도 됨)"]]},{"id":"u18a-03","type":"tf","q":"교수님은 status·command 는 control 이라 latency 가 중요하고, data 는 bandwidth 가 중요하다고 했다.","explain":"11/11 녹음 (슬라이드에 없는 말). 장치는 보통 control 과 data 경로를 분리한다.","src":"11/11 녹음","wiki":"canonical device","prof":true,"answer":true},{"id":"u18a-04","type":"sa","q":"장치가 일이 끝났음을 CPU 에 알리는 asynchronous exception 의 이름은?","explain":"11/11 수업 중 교수님 질문.","src":"18강 p.8, 11/11 녹음","wiki":"polling과 interrupt","prof":true,"answer":"interrupt","alts":["인터럽트"]},{"id":"u18a-05","type":"sa","q":"OS 가 status register 를 반복해서 읽으며 장치가 준비될 때까지 기다리는 방식은?","explain":"p.10. 간단하지만 기다리는 동안 CPU 시간을 낭비한다.","src":"18강 p.10","wiki":"polling과 interrupt","tags":["polling"],"answer":"polling"},{"id":"u18a-06","type":"mc","q":"교수님이 polling 과 같은 문제를 가진다고 비유한 것은?","explain":"11/11 녹음. lock 을 sleeping lock 으로 바꿨던 것처럼 interrupt 로 바꾼다.","src":"11/11 녹음","wiki":"polling과 interrupt","prof":true,"choices":["spinning lock","priority inversion","Belady's anomaly","thrashing"],"answer":0},{"id":"u18a-07","type":"mc","q":"interrupt 의 overhead 로 학생이 답하고 교수님이 받아들인 것은?","explain":"11/11 녹음. interrupt 는 고정 overhead, polling 은 기다리는 시간에 비례.","src":"11/11 녹음","wiki":"polling과 interrupt","prof":true,"choices":["context switch","TLB flush","disk seek","page fault"],"answer":0},{"id":"u18a-08","type":"match","q":"장치 속도와 고를 방식을 연결하시오","explain":"p.12 \"If a device is fast → poll is best. If it is slow → interrupt is better.\" context switch 가 비싸기 때문.","src":"18강 p.12","wiki":"polling과 interrupt","prof":true,"tags":["polling"],"pairs":[["매우 빠른 장치의 완료 확인","polling"],["느린 장치의 완료 확인","interrupt"],["큰 데이터 복사를 CPU 대신","DMA"],["장치 레지스터를 load/store 로","memory-mapped I/O"]]},{"id":"u18a-09","type":"tf","q":"interrupt 는 항상 polling 보다 빠르다.","explain":"p.12 \"Interrupts is not always the best solution.\" 장치가 context switch 보다 빨리 끝나면 polling 이 낫다.","src":"18강 p.12","wiki":"polling과 interrupt","diff":1,"answer":false},{"id":"u18a-10","type":"sa","q":"CPU 가 메모리와 장치 사이 데이터를 직접 옮기는 방식의 full term 은?","explain":"p.13. 교수님: PIO 는 polling 과 잘 맞는다 — 둘 다 CPU 를 쓴다.","src":"18강 p.13","wiki":"PIO와 DMA","tags":["DMA"],"answer":"programmed I/O","alts":["PIO","programmed IO"]},{"id":"u18a-11","type":"cloze","q":"DMA controller 에게는 데이터가 메모리 ___ 에 있는지와 ___ 옮길지만 알려 주면 되고, 끝나면 DMA 가 ___ 를 건다.","explain":"p.14. 교수님: where = physical address, how much = length.","src":"18강 p.14, 11/11 녹음","wiki":"PIO와 DMA","prof":true,"tags":["DMA"],"answer":["어디","얼마나","interrupt"],"bank":["어디","얼마나","interrupt","언제","왜","page fault"]},{"id":"u18a-12","type":"sa","q":"장치 레지스터를 메모리 위치처럼 보이게 해서 load/store 로 접근하는 방식은?","explain":"p.18. 특수 명령이 필요 없다.","src":"18강 p.18","wiki":"memory-mapped I/O","tags":["MMIO"],"answer":"memory-mapped I/O","alts":["memory mapped I/O","MMIO","memory-mapped IO"]},{"id":"u18a-13","type":"tf","q":"교수님은 \"As far as I know, we don't use the port-mapped I/O anymore\" 라고 했다.","explain":"11/11 녹음. x86 의 in/out 같은 특권 I/O 명령은 old style.","src":"11/11 녹음","wiki":"memory-mapped I/O","prof":true,"answer":true},{"id":"u18a-14","type":"match","q":"p.19 표: 상황과 방식을 연결하시오","explain":"p.19 표.","src":"18강 p.19","wiki":"memory-mapped I/O","prof":true,"pairs":[["CPU 가 완료를 확인","Polling"],["장치가 완료를 알림","Interrupt"],["CPU 가 데이터를 복사","Programmed I/O"],["장치가 데이터를 복사","DMA"],["장치를 메모리처럼 부름","Memory-mapped I/O"]]}]},{"id":"u18b","title":"HDD 구조와 접근 시간","items":[{"id":"u18b-01","type":"match","q":"HDD 용어와 뜻을 연결하시오","explain":"p.22~23.","src":"18강 p.22~23","wiki":"HDD 구조","tags":["HDD"],"pairs":[["Platter","두 surface 를 가진 원판"],["Track","surface 위 동심원"],["Sector","track 을 나눈 단위"],["Cylinder","모든 surface 의 같은 반지름 track 묶음"]]},{"id":"u18b-02","type":"mc","q":"바깥 track 이 더 길 때 HDD 는 어떻게 하나? (교수님 질문)","explain":"11/16 녹음. 고정 단위라야 관리·전송이 쉽다 — page 크기를 고정한 것과 같은 이유.","src":"11/16 녹음","wiki":"HDD 구조","prof":true,"choices":["sector 수를 늘린다","sector 크기를 키운다","바깥 track 을 안 쓴다","회전 속도를 바꾼다"],"answer":0},{"id":"u18b-03","type":"cloze","q":"Taccess = Tavg ___ + Tavg ___ + Tavg transfer","explain":"p.27. seek 이 가장 길고 rotational latency 가 transfer 보다 길다.","src":"18강 p.27","wiki":"디스크 접근 시간","prof":true,"tags":["디스크 접근"],"answer":["seek","rotation"],"bank":["seek","rotation","queue","interrupt"]},{"id":"u18b-04","type":"num","q":"7200 RPM 디스크의 Tavg rotation 은 몇 ms 인가? (소수 둘째 자리)","explain":"한 바퀴 = 60/7200 s = 8.33 ms, 평균은 반 바퀴 → 4.17 ms.","src":"18강 p.28","wiki":"디스크 접근 시간","prof":true,"tags":["디스크 접근"],"answer":4.17,"unit":"ms","tol":0.005},{"id":"u18b-05","type":"num","q":"7200 RPM, track 당 평균 400 sector 일 때 Tavg transfer 는 몇 ms 인가?","explain":"8.33 ms / 400 = 0.0208 ms ≈ 0.02 ms.","src":"18강 p.28","wiki":"디스크 접근 시간","tags":["디스크 접근"],"answer":0.0208,"unit":"ms","tol":0.01},{"id":"u18b-06","type":"num","q":"7200 RPM, 평균 seek 9 ms, track 당 400 sector. 슬라이드 근삿값(rotation 4, transfer 0.02)으로 Taccess 는 몇 ms 인가?","explain":"9 + 4 + 0.02 = 13.02 ms. 반올림 전 값으로 더하면 13.19 ms.","src":"18강 p.28","wiki":"디스크 접근 시간","prof":true,"tags":["디스크 접근"],"answer":13.02,"unit":"ms","tol":0.001},{"id":"u18b-07","type":"num","q":"15,000 RPM, 평균 seek 4 ms, track 당 500 sector 의 Taccess 는 몇 ms 인가?","explain":"한 바퀴 4 ms → rotation 2 ms, transfer 4/500 = 0.008 ms. 4 + 2 + 0.008 = 6.008 ms.","src":"위키 디스크 접근 시간 퀴즈","wiki":"디스크 접근 시간","diff":2,"tags":["디스크 접근"],"answer":6.008,"unit":"ms","tol":0.001},{"id":"u18b-08","type":"num","q":"10,000 RPM, 평균 seek 5 ms, track 당 500 sector 의 Taccess 는 몇 ms 인가?","explain":"한 바퀴 6 ms → rotation 3 ms, transfer 6/500 = 0.012 ms. 5 + 3 + 0.012 = 8.012 ms.","src":"위키 디스크 접근 시간 퀴즈","wiki":"디스크 접근 시간","diff":2,"tags":["디스크 접근"],"answer":8.012,"unit":"ms","tol":0.001},{"id":"u18b-09","type":"tf","q":"p.28: \"First bit in a sector is the most expensive, the rest are free.\"","explain":"13.02 ms 중 transfer 는 0.02 ms 뿐이다. 첫 bit 까지 가는 seek·rotation 이 거의 전부.","src":"18강 p.28","wiki":"디스크 접근 시간","answer":true},{"id":"u18b-10","type":"mc","q":"logical block 번호를 (surface, track, sector) 로 바꾸는 주체는?","explain":"p.29. OS 는 logical block 만 쓴다. 교수님: 가상/물리 주소 관계와 같다.","src":"18강 p.29","wiki":"logical block","tags":["HDD"],"choices":["disk controller (hardware/firmware)","OS 의 page table","MMU","DMA controller"],"answer":0},{"id":"u18b-11","type":"mc","q":"rotational latency 를 줄이는 방법(교수님 질문의 답)은?","explain":"11/16 녹음. random access 면 못 줄인다 → 그래서 스케줄링의 목표는 seek time.","src":"11/16 녹음","wiki":"디스크 스케줄링","prof":true,"choices":["spatial locality — 같은 track 의 연속 sector 를 읽기","seek 를 늘리기","interrupt 를 쓰기","RAID 0"],"answer":0},{"id":"u18b-12","type":"tf","q":"교수님은 SSD 는 디스크 스케줄링이 필요 없다고 했다.","explain":"11/16 녹음. 움직이는 arm 이 없기 때문. HDD 내부에도 스케줄러가 있다.","src":"11/16 녹음","wiki":"디스크 스케줄링","prof":true,"diff":1,"answer":true},{"id":"u18b-13","type":"cloze","q":"OS 는 ___ block 만 쓰고, disk controller 가 그것을 (surface, track, ___) 로 바꾼다.","explain":"p.29. 교수님: 안쪽 track 은 sector 가 적어 주소 공간이 고르지 않고 bad sector remap 이 필요하다.","src":"18강 p.29","wiki":"logical block","answer":["logical","sector"],"bank":["logical","sector","physical","cylinder","page"]},{"id":"u18b-14","type":"tf","q":"HDD 접근 시간에서 가장 큰 부분은 transfer time 이다.","explain":"seek 이 가장 길고 rotational latency 가 그다음이다. transfer 는 0.02 ms 정도로 거의 공짜.","src":"18강 p.28","wiki":"디스크 접근 시간","prof":true,"answer":false}]},{"id":"u18c","title":"디스크 스케줄링 손으로 돌리기","items":[{"id":"u18c-01","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. FCFS 의 총 head 이동량은?","explain":"45 + 85 + 146 + 85 + 108 + 110 + 59 + 2 = 640. 교수님: \"stupid\".","src":"18강 p.35","wiki":"FCFS","prof":true,"tags":["디스크 스케줄링"],"answer":640,"tol":0},{"id":"u18c-02","type":"order","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. SSTF 가 처음 방문하는 요청 6개의 순서","explain":"53 에서 65(12) vs 37(16) → 65, 67, 그다음 37(30) vs 98(31) → 37, 14, 98, 122, 124, 183.","src":"18강 p.36","wiki":"SSTF","prof":true,"diff":2,"tags":["디스크 스케줄링"],"answer":["65","67","37","14","98","122"]},{"id":"u18c-03","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. SSTF 의 총 head 이동량은?","explain":"12 + 2 + 30 + 23 + 84 + 24 + 2 + 59 = 236.","src":"18강 p.36","wiki":"SSTF","prof":true,"tags":["디스크 스케줄링"],"answer":236,"tol":0},{"id":"u18c-04","type":"tf","q":"교수님은 SSTF 가 CPU 스케줄링의 STCF(SJF)와 같은 꼴이라 starvation 이 생길 수 있다고 했다.","explain":"11/16 녹음, p.36 \"SSTF scheduling is a form of SJF scheduling; may cause starvation\".","src":"18강 p.36, 11/16 녹음","wiki":"SSTF","prof":true,"answer":true},{"id":"u18c-05","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. SCAN 이 0 쪽으로 먼저 가되 교수님 방식대로 마지막 요청(14)에서 방향을 바꾸면 총 이동량은?","explain":"(53 − 14) + (183 − 14) = 39 + 169 = 208. 11/16 수업: \"0 에는 요청이 없으니 14 에서 멈추면 28 줄어든다\".","src":"18강 p.37, 11/16 녹음","wiki":"SCAN","prof":true,"diff":2,"tags":["디스크 스케줄링"],"answer":208,"tol":0},{"id":"u18c-06","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. SCAN 이 디스크 끝 0 까지 갔다가 방향을 바꾸면 총 이동량은?","explain":"53 + 183 = 236 (53→0 그리고 0→183). 그림대로면 236, 슬라이드 글자 208 은 LOOK 식 값.","src":"18강 p.37","wiki":"SCAN","diff":2,"tags":["디스크 스케줄링"],"answer":236,"tol":0},{"id":"u18c-07","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. C-SCAN(199 쪽으로, 끝까지 갔다 0 으로 복귀, 복귀 이동 포함)의 총 이동량은?","explain":"53→183 130, 183→199 16, 199→0 199, 0→37 37 → 382. 복귀를 빼면 183. 복귀 포함 여부는 문제 말을 따른다.","src":"위키 C-SCAN p.39","wiki":"C-SCAN","diff":3,"tags":["디스크 스케줄링"],"answer":382,"tol":0},{"id":"u18c-08","type":"num","q":"head 100, 디스크 0~199, 요청 55, 58, 39, 18, 90, 160, 150, 38, 184. FCFS 의 총 이동량은?","explain":"45 + 3 + 19 + 21 + 72 + 70 + 10 + 112 + 146 = 498.","src":"위키 디스크 스케줄링 퀴즈","wiki":"FCFS","diff":2,"tags":["디스크 스케줄링"],"answer":498,"tol":0},{"id":"u18c-09","type":"num","q":"head 100, 디스크 0~199, 요청 55, 58, 39, 18, 90, 160, 150, 38, 184. SSTF 의 총 이동량은?","explain":"100→90→58→55→39→38→18→150→160→184: 10 + 32 + 3 + 16 + 1 + 20 + 132 + 10 + 24 = 248.","src":"위키 디스크 스케줄링 퀴즈","wiki":"SSTF","diff":3,"tags":["디스크 스케줄링"],"answer":248,"tol":0},{"id":"u18c-10","type":"num","q":"head 100, 디스크 0~199, 요청 55, 58, 39, 18, 90, 160, 150, 38, 184. SCAN(0 쪽으로 먼저, 0 까지 감)의 총 이동량은?","explain":"100 → 0 = 100, 0 → 184 = 184 → 284.","src":"위키 디스크 스케줄링 퀴즈","wiki":"SCAN","diff":2,"tags":["디스크 스케줄링"],"answer":284,"tol":0},{"id":"u18c-11","type":"num","q":"head 100, 디스크 0~199, 요청 55, 58, 39, 18, 90, 160, 150, 38, 184. C-SCAN(199 쪽으로, 복귀 포함)의 총 이동량은?","explain":"100→199 = 99, 199→0 = 199, 0→90 = 90 → 388.","src":"위키 디스크 스케줄링 퀴즈","wiki":"C-SCAN","diff":3,"tags":["디스크 스케줄링"],"answer":388,"tol":0},{"id":"u18c-12","type":"mc","q":"C-SCAN 이 SCAN 보다 나은 점(교수님 설명)은?","explain":"11/16 녹음. SCAN 은 0 근처 요청의 최악이 400, 가운데는 200. 대가는 복귀 약 200 칸.","src":"18강 p.38~39, 11/16 녹음","wiki":"C-SCAN","prof":true,"choices":["모든 주소의 최악 응답 시간을 같게 만든다","총 이동량이 항상 더 적다","starvation 이 더 많다","rotation 을 줄인다"],"answer":0},{"id":"u18c-13","type":"tf","q":"p.40: 디스크 부하가 큰 시스템에서는 starvation 이 적은 SCAN·C-SCAN 이 낫다.","explain":"p.40 \"SSTF is common … SCAN and C-SCAN perform better for systems that place a heavy load on the disk because of less starvation.\"","src":"18강 p.40","wiki":"디스크 스케줄링","answer":true},{"id":"u18c-14","type":"tf","q":"C-SCAN 은 디스크 끝에서 처음으로 돌아오는 길에도 요청을 처리한다.","explain":"p.39 \"without servicing any requests on the return trip\". 그래야 모든 요청을 같은 방향으로 처리해 대기 시간이 고르다.","src":"18강 p.39","wiki":"C-SCAN","answer":false}]},{"id":"u18d","title":"RAID","items":[{"id":"u18d-01","type":"tf","q":"교수님은 RAID 가 무엇의 약자인지 몰라도 된다고 했다.","explain":"11/16 녹음. p.42 의 \"Don't memorize\" 와 같은 맥락. 레벨별 장단점과 실패율 계산을 본다.","src":"11/16 녹음","wiki":"RAID","prof":true,"diff":1,"answer":true},{"id":"u18d-02","type":"match","q":"RAID 레벨과 방식을 연결하시오","explain":"p.44~51.","src":"18강 p.44~51","wiki":"RAID","prof":true,"tags":["RAID"],"pairs":[["RAID 0","striping, 중복 없음"],["RAID 1","mirroring"],["RAID 4","striping + 전용 parity 디스크 1개"],["RAID 5","parity 분산"],["RAID 6","parity 2개 분산"]]},{"id":"u18d-03","type":"num","q":"디스크 하나의 고장률 r = 5%, n = 2 일 때 RAID 0 배열 실패율은? (소수로)","explain":"1 − (1 − r)^n = 1 − 0.95² = 1 − 0.9025 = 0.0975. 교수님은 의심했지만 맞는 값이다.","src":"18강 p.45, 11/16 녹음","wiki":"RAID 0과 RAID 1","prof":true,"tags":["RAID"],"answer":0.0975,"tol":0.001},{"id":"u18d-04","type":"num","q":"r = 5%, n = 2 일 때 RAID 1 배열 실패율은? (소수로)","explain":"r^n = 0.05² = 0.0025 = 0.25%. 모든 사본이 동시에 고장 나야 실패.","src":"18강 p.47","wiki":"RAID 0과 RAID 1","prof":true,"tags":["RAID"],"answer":0.0025,"tol":0.001},{"id":"u18d-05","type":"num","q":"r = 10%, n = 3 일 때 RAID 0 배열 실패율은?","explain":"1 − 0.9³ = 1 − 0.729 = 0.271.","src":"위키 RAID 0과 RAID 1 퀴즈","wiki":"RAID 0과 RAID 1","diff":2,"tags":["RAID"],"answer":0.271,"tol":0.001},{"id":"u18d-06","type":"num","q":"r = 5%, n = 4 일 때 RAID 4 배열 실패율은 몇 % 인가? (소수 첫째 자리)","explain":"1 − [(1−r)^n + n·r·(1−r)^(n−1)] = 1 − (0.8145 + 0.1715) ≈ 0.014 = 1.4%. 교수님: 알아야 할 것은 디스크 하나 고장은 복구된다는 것.","src":"18강 p.48, 11/16 녹음","wiki":"RAID 4와 parity","prof":true,"diff":3,"tags":["RAID"],"answer":1.4,"unit":"%","tol":0.01},{"id":"u18d-07","type":"num","q":"1TB 디스크 4개로 RAID 4 를 만들면 쓸 수 있는 용량은 몇 TB 인가?","explain":"공간 효율 1 − 1/n = 0.75 → 4 × 0.75 = 3TB (데이터 디스크 3 + parity 1).","src":"18강 p.48","wiki":"RAID 4와 parity","tags":["RAID"],"answer":3,"unit":"TB","tol":0},{"id":"u18d-08","type":"num","q":"2TB 디스크 3개로 RAID 1 을 만들면 쓸 수 있는 용량은 몇 TB 인가?","explain":"공간 효율 1/n. 배열은 가장 작은 member 디스크만큼만 쓴다 → 2TB. 교수님: 사본 3개면 공간 효율 1/3.","src":"18강 p.46~47","wiki":"RAID 0과 RAID 1","diff":2,"tags":["RAID"],"answer":2,"unit":"TB","tol":0},{"id":"u18d-09","type":"num","q":"블록 101, 010, 011 의 parity 를 XOR 로 구하면? (2진수 세 자리를 10진수로 바꿔 쓰시오. 예: 110 → 6)","explain":"101 XOR 010 = 111, 111 XOR 011 = 100 → 10진수 4 (p.49).","src":"18강 p.49","wiki":"RAID 4와 parity","prof":true,"diff":2,"tags":["parity"],"answer":4,"tol":0},{"id":"u18d-10","type":"cloze","q":"Disk 0~2 가 1100, 1010, 0110 이면 parity 는 ___ 다. Disk 2 가 고장 나면 1100 XOR 1010 XOR parity = ___ 로 복구한다.","explain":"1100 XOR 1010 = 0110, 0110 XOR 0110 = 0000. 모든 블록(parity 포함)을 XOR 하면 0 이라 하나가 빠져도 나머지 XOR 이 빠진 값이다.","src":"위키 RAID 4와 parity 퀴즈","wiki":"RAID 4와 parity","diff":2,"tags":["parity"],"answer":["0000","0110"],"bank":["0000","0110","1110","1001","0011"]},{"id":"u18d-11","type":"mc","q":"RAID 4 에서 작은 random write 가 느린 이유는?","explain":"교수님: 쓰기마다 parity 디스크 → 병목. RAID 5 는 parity 를 분산해 해결하므로 RAID 4 를 쓸 이유가 없다.","src":"18강 p.50, 11/16 녹음","wiki":"RAID 5와 RAID 6","prof":true,"tags":["RAID"],"choices":["모든 쓰기가 같은 parity 디스크를 갱신해서 병목","striping 을 안 해서","mirroring 이라서","XOR 계산이 불가능해서"],"answer":0},{"id":"u18d-12","type":"tf","q":"RAID 6 은 parity 가 둘이라 디스크 두 개가 동시에 고장 나도 버티지만 쓰기가 더 느리다.","explain":"p.51. 기업 시스템에서 가장 많이 쓴다고 알려져 있다.","src":"18강 p.51","wiki":"RAID 5와 RAID 6","answer":true},{"id":"u18d-13","type":"mc","q":"슬라이드에 없지만 교수님이 언급한 RAID 10 은?","explain":"11/16 녹음.","src":"11/16 녹음","wiki":"RAID","prof":true,"diff":2,"choices":["둘씩 RAID 1 로 묶고 그것들을 RAID 0 으로 — random read 많은 DB 용","parity 를 10개 둔 것","RAID 1 을 10개 복사","RAID 0 디스크 10개"],"answer":0}]}]},{"id":"u19","title":"19강 File and Directory","desc":"inode · 디렉터리 · 권한 · fd · offset · rename · hard/symbolic link","lessons":[{"id":"u19a","title":"파일 · 디렉터리 · inode","items":[{"id":"u19a-01","type":"cloze","q":"File 은 읽고 쓸 수 있는 바이트의 linear ___ 이고, 보통 ___ number 로 부른다(pid 와 비슷).","explain":"p.3 정의. 내용의 의미는 만든 쪽(creator)이 정한다.","src":"19강 p.3","wiki":"inode","tags":["inode"],"answer":["array","inode"],"bank":["array","inode","list","block","page"]},{"id":"u19a-02","type":"sa","q":"파일의 low-level name 으로 p.3 이 든 것은? (영어 두 단어)","explain":"p.3 \"It is often referred to as its inode number (similar to pid).\"","src":"19강 p.3","wiki":"inode","tags":["inode"],"answer":"inode number","alts":["inode","i-number","inode #"]},{"id":"u19a-03","type":"mc","q":"디렉터리의 내용은?","explain":"p.3 \"Directory: A special file that is a collection of files and other directories.\" 디렉터리도 inode number 로 식별한다.","src":"19강 p.3, p.9","wiki":"디렉터리","tags":["디렉터리"],"choices":["(사람이 읽는 이름, inode #) 쌍의 목록","파일 데이터 블록","파일 크기와 권한","logical block 번호 목록"],"answer":0},{"id":"u19a-04","type":"tf","q":"파일 이름은 그 파일의 inode 안에 저장된다.","explain":"이름은 디렉터리 엔트리에 있다. 그래서 한 파일(inode)에 이름을 여러 개 붙일 수 있다(hard link). struct stat 으로 이름을 알 수 없는 이유.","src":"19강 p.25~26, p.33","wiki":"inode","diff":2,"tags":["inode"],"answer":false},{"id":"u19a-05","type":"match","q":"p.5 그림의 층과 층 사이 이름을 연결하시오","explain":"p.5. 맨 위 트리가 \"Virtualized view to storage\".","src":"19강 p.5","wiki":"파일과 디렉터리","pairs":[["Physical disks","실제 HDD·SSD"],["Logical blocks","0~N 번 번호 붙은 블록 배열"],["Files & directories","사람이 보는 이름 트리"],["Abstraction","disk 층과 block 층 사이 점선"],["Virtualization","block 층과 파일 층 사이 점선"]]},{"id":"u19a-06","type":"sa","q":"모든 경로가 시작하는, 이름이 `/` 한 글자인 디렉터리는?","explain":"p.5 첫 문장.","src":"19강 p.5~6","wiki":"경로와 working directory","diff":1,"answer":"root","alts":["root directory"]},{"id":"u19a-07","type":"match","q":"경로 용어를 연결하시오","explain":"p.6.","src":"19강 p.6","wiki":"경로와 working directory","pairs":[["absolute pathname","root(/) 부터 쓴 경로"],["relative pathname","working directory 기준 경로"],["working directory","프로세스의 현재 디렉터리"],["home directory","사용자의 기본 디렉터리 (~)"]]},{"id":"u19a-08","type":"tf","q":"Unix 는 디스크 파일뿐 아니라 장치·IPC·커널 정보까지 파일 개념을 확장한다.","explain":"p.7 \"UNIX extends the file concept\". 흔히 \"everything is a file\" 이라 부른다.","src":"19강 p.7~8","wiki":"Unix 파일","answer":true},{"id":"u19a-09","type":"mc","q":"struct stat 으로 알 수 없는 것은?","explain":"이름은 inode 가 아니라 디렉터리 엔트리에 있다.","src":"19강 p.25~26","wiki":"inode","tags":["inode"],"choices":["파일 이름","파일 크기","link 수","소유자 uid"],"answer":0},{"id":"u19a-10","type":"num","q":"4KB 블록 파일 시스템에 5000바이트 파일을 만들었다. stat 의 Blocks(512B 단위)는?","explain":"5000B 는 4KB 블록 2개 = 8192B 가 필요 → 8192 / 512 = 16. Size 는 5000.","src":"위키 inode","wiki":"inode","diff":3,"answer":16,"tol":0},{"id":"u19a-11","type":"tf","q":"서로 다른 파일 시스템(파티션)에 있는 두 파일은 inode 번호가 같을 수 있다.","explain":"inode 번호는 파일 시스템 안에서만 유일하다. 그래서 st_dev 와 함께 봐야 하고, hard link 가 파티션을 못 넘는다.","src":"19강 p.37","wiki":"inode","diff":2,"answer":true},{"id":"u19a-12","type":"mc","q":"파일 권한만 chmod 로 바꿨을 때 바뀌는 시간은?","explain":"내용이 그대로라 mtime 은 안 바뀌고, inode(메타데이터) 변경 시간인 ctime 만 바뀐다.","src":"위키 inode","wiki":"inode","diff":3,"choices":["ctime","mtime","둘 다","둘 다 아님"],"answer":0},{"id":"u19a-13","type":"tf","q":"OS 는 파일 내용이 텍스트인지 binary 인지 구별해서 저장한다.","explain":"p.3: 내용은 \"defined by a creator\". OS 는 바이트 배열로만 다룬다.","src":"19강 p.3","wiki":"inode","answer":false}]},{"id":"u19b","title":"권한 · file descriptor · offset","items":[{"id":"u19b-01","type":"num","q":"`rwxr-x--x` 를 8진수 세 자리로 쓰면?","explain":"r4 w2 x1 → user 7, group r-x = 5, others --x = 1 → 751 (p.13).","src":"19강 p.13","wiki":"권한 비트","prof":true,"tags":["권한"],"answer":751,"tol":0},{"id":"u19b-02","type":"num","q":"`rw-r--r--` 를 8진수 세 자리로 쓰면?","explain":"4+2, 4, 4 → 644.","src":"위키 권한 비트","wiki":"권한 비트","tags":["권한"],"answer":644,"tol":0},{"id":"u19b-03","type":"sa","q":"8진수 750 을 rwx 9 글자로 쓰면?","explain":"7 = rwx, 5 = r-x, 0 = ---.","src":"위키 권한 비트","wiki":"권한 비트","tags":["권한"],"answer":"rwxr-x---"},{"id":"u19b-04","type":"tf","q":"권한이 `rwxr-x--x` 인 파일을 owner 도 group 도 아닌 사용자가 cat 으로 읽을 수 있다.","explain":"others 칸이 `--x` 라 실행만 된다. 읽기(r)가 없다.","src":"위키 권한 비트","wiki":"권한 비트","tags":["권한"],"answer":false},{"id":"u19b-05","type":"num","q":"`mkdir(\"foo\", 0777)` 인데 umask 가 027 이면 실제 권한은 8진수로?","explain":"777 & ~027 = 750 (group 의 w, others 의 rwx 가 꺼짐). p.28 의 drwxr-x--- 가 이 값.","src":"위키 권한 비트","wiki":"권한 비트","diff":3,"tags":["권한"],"answer":750,"tol":0},{"id":"u19b-06","type":"match","q":"fd 번호와 처음부터 열려 있는 파일을 연결하시오","explain":"p.21 \"Each process begins life with three open files associated with a terminal.\"","src":"19강 p.19~21","wiki":"file descriptor","tags":["fd"],"pairs":[["0","stdin"],["1","stdout"],["2","stderr"],["3","아무것도 안 닫았을 때 처음 open 한 파일"]]},{"id":"u19b-07","type":"num","q":"프로세스가 막 시작해 0·1·2 만 열려 있다. open(\"a\"), open(\"b\"), open(\"c\") 를 한 뒤 close(3), close(4), open(\"d\"), open(\"e\"), open(\"f\") 를 하면 f 의 fd 는?","explain":"a·b·c = 3·4·5. 3·4 를 닫으면 d = 3, e = 4, f 는 비어 있는 가장 작은 번호 6 (5 는 c 사용 중).","src":"위키 file descriptor","wiki":"file descriptor","diff":2,"tags":["fd"],"answer":6,"tol":0},{"id":"u19b-08","type":"tf","q":"open 이 돌려주는 file descriptor 는 비어 있는 가장 작은 음이 아닌 정수다.","explain":"p.21 \"Non-negative integer (the lowest unused integer).\"","src":"19강 p.21","wiki":"file descriptor","tags":["fd"],"answer":true},{"id":"u19b-09","type":"mc","q":"close(1) 뒤 open(\"g\") 를 하면?","explain":"1 이 비어 있는 가장 작은 번호라 g 에 1 이 배정된다.","src":"위키 file descriptor","wiki":"file descriptor","diff":3,"tags":["fd"],"choices":["g 가 fd 1 이 되어 이후 stdout 출력이 파일 g 로 간다","g 는 fd 3","open 이 실패한다","stdout 이 stderr 로 바뀐다"],"answer":0},{"id":"u19b-10","type":"sa","q":"열린 파일에서 다음 read/write 가 시작될 위치를 무엇이라 하는가? (영어 두 단어)","explain":"p.22 \"An open file has a current offset.\"","src":"19강 p.22","wiki":"파일 offset과 lseek","tags":["offset"],"answer":"current offset","alts":["offset","file offset"]},{"id":"u19b-11","type":"num","q":"크기 100B 파일을 열고 read(fd, buf, 30), lseek(fd, 10, SEEK_CUR), lseek(fd, -20, SEEK_END) 를 한 뒤의 offset 은?","explain":"read 30 → 30, SEEK_CUR +10 → 40, SEEK_END −20 → 100 − 20 = 80.","src":"위키 파일 offset과 lseek","wiki":"파일 offset과 lseek","diff":2,"tags":["offset"],"answer":80,"tol":0},{"id":"u19b-12","type":"num","q":"위 상태(offset 80, 크기 100)에서 read(fd, buf, 50) 의 반환값은?","explain":"80 부터 끝까지 20바이트밖에 없다. offset 은 100 이 되고 다음 read 는 0 을 돌려준다.","src":"위키 파일 offset과 lseek","wiki":"파일 offset과 lseek","diff":2,"tags":["offset"],"answer":20,"tol":0},{"id":"u19b-13","type":"match","q":"lseek 의 whence 와 새 offset 을 연결하시오","explain":"p.23.","src":"19강 p.23","wiki":"파일 offset과 lseek","tags":["offset"],"pairs":[["SEEK_SET","offset"],["SEEK_CUR","현재 위치 + offset"],["SEEK_END","파일 크기 + offset"],["lseek 의 반환값","옮긴 뒤의 새 offset"]]},{"id":"u19b-14","type":"tf","q":"lseek 를 부르면 디스크 head 가 그 위치로 움직인다.","explain":"lseek 는 커널 안 offset 값만 바꾼다. 18강의 disk seek 와 다르다.","src":"위키 파일 offset과 lseek","wiki":"파일 offset과 lseek","diff":2,"answer":false}]},{"id":"u19c","title":"rename · fsync · 디렉터리 API","items":[{"id":"u19c-01","type":"tf","q":"rename(old, new) 은 atomic call 로 구현된다.","explain":"p.24 \"It is implemented as an atomic call.\" 그래서 파일 내용을 통째로 안전하게 바꾸는 데 쓴다.","src":"19강 p.24","wiki":"rename과 atomic update","tags":["rename"],"answer":true},{"id":"u19c-02","type":"order","q":"파일 foo.txt 를 atomic 하게 새 내용으로 바꾸는 순서","explain":"p.24. fsync 를 rename 보다 먼저 해야 이름이 내용이 디스크에 내려간 파일을 가리킨다.","src":"19강 p.24","wiki":"rename과 atomic update","diff":2,"tags":["rename"],"answer":["foo.txt.tmp 를 open","새 내용을 write","fsync(fd)","close(fd)","rename(\"foo.txt.tmp\", \"foo.txt\")"]},{"id":"u19c-03","type":"mc","q":"write 직후(fsync 전) 전원이 나갔다. 재부팅 후 foo.txt 의 내용은?","explain":"foo.txt 는 아직 건드리지 않았다. tmp 는 비었거나 일부만 남는다.","src":"위키 rename과 atomic update","wiki":"rename과 atomic update","diff":2,"choices":["옛 내용","새 내용","빈 파일","반반 섞인 내용"],"answer":0},{"id":"u19c-04","type":"tf","q":"write 가 성공하면 데이터는 이미 디스크에 있다.","explain":"write 는 보통 메모리 버퍼에만 넣는다. 디스크로 내리려면 fsync 가 필요하다.","src":"19강 p.24","wiki":"rename과 atomic update","diff":2,"answer":false},{"id":"u19c-05","type":"tf","q":"rename 은 파일 데이터 블록을 새 위치로 복사한다.","explain":"rename 은 디렉터리 엔트리만 고친다. inode 번호도 그대로다.","src":"위키 rename과 atomic update","wiki":"rename과 atomic update","answer":false},{"id":"u19c-06","type":"mc","q":"`rm` 명령이 부르는 시스템 콜은?","explain":"p.27. 왜 unlink 라는 이름인지는 hard link 에서 답한다 — 이름 하나를 떼는 일이라서.","src":"19강 p.27","wiki":"디렉터리 API","prof":true,"choices":["unlink()","remove()","delete()","rmdir()"],"answer":0},{"id":"u19c-07","type":"mc","q":"막 mkdir 한 빈 디렉터리에 들어 있는 엔트리는?","explain":"p.28 \"Empty directory have two entries: . (itself), .. (parent)\". link count 는 2.","src":"19강 p.28","wiki":"디렉터리 API","tags":["디렉터리"],"choices":[". 과 ..","없음",". 만","lost+found"],"answer":0},{"id":"u19c-08","type":"num","q":"/home 의 link count 가 5 였다. mkdir /home/x 를 하면 /home 의 link count 는?","explain":"새 디렉터리의 .. 이 /home 을 가리켜 1 오른다. 이어서 일반 파일을 만들면 그대로 6.","src":"위키 디렉터리 API","wiki":"디렉터리 API","diff":3,"answer":6,"tol":0},{"id":"u19c-09","type":"tf","q":"rmdir 은 비어 있지 않은 디렉터리에도 성공한다.","explain":"p.30 \"Require that the directory be empty … it will fail.\" empty = . 과 .. 만 있음.","src":"19강 p.30","wiki":"디렉터리 API","answer":false},{"id":"u19c-10","type":"mc","q":"struct dirent 만으로 알 수 있는 것은?","explain":"크기·권한은 inode 에 있어 stat() 을 따로 불러야 한다.","src":"19강 p.29","wiki":"디렉터리 API","diff":2,"choices":["이름과 inode 번호","파일 크기","권한","수정 시간"],"answer":0},{"id":"u19c-11","type":"tf","q":"디렉터리는 write() 로 직접 내용을 고칠 수 없고 전용 API(mkdir, unlink 등)를 쓴다.","explain":"디렉터리 형식은 파일 시스템이 지켜야 하는 메타데이터라서 사용자가 직접 쓰지 못한다.","src":"19강 p.27~30","wiki":"디렉터리 API","diff":2,"answer":true},{"id":"u19c-12","type":"cloze","q":"파일을 안전하게 바꾸려면 tmp 파일에 쓰고 ___ 로 디스크에 내린 뒤 ___ 로 원래 이름으로 바꾼다.","explain":"p.24. rename 이 atomic 이라 다른 프로세스는 옛 내용 아니면 새 내용만 본다.","src":"19강 p.24","wiki":"rename과 atomic update","tags":["rename"],"answer":["fsync","rename"],"bank":["fsync","rename","lseek","unlink","link"]},{"id":"u19c-13","type":"tf","q":"rename 후 파일의 inode 번호가 새로 바뀐다.","explain":"rename 은 디렉터리 엔트리의 이름만 바꾼다. inode 와 데이터는 그대로.","src":"위키 rename과 atomic update","wiki":"rename과 atomic update","answer":false}]},{"id":"u19d","title":"Hard link 와 symbolic link","items":[{"id":"u19d-01","type":"cloze","q":"`ln file file2` 는 디렉터리에 새 ___ 을 만들고 원본과 같은 ___ number 를 가리키게 한다. 파일은 복사되지 ___.","explain":"p.33 \"The file is not copied in any way.\"","src":"19강 p.32~33","wiki":"hard link","tags":["link"],"answer":["이름","inode","않는다"],"bank":["이름","inode","않는다","블록","PID","된다"]},{"id":"u19d-02","type":"mc","q":"`ln file file2` 직후 새로 할당되는 것은?","explain":"엔트리 (같은 inode #, file2) 하나가 생기고 inode 의 link count 가 1 오른다.","src":"위키 hard link","wiki":"hard link","tags":["link"],"choices":["디렉터리 엔트리 하나","새 inode","새 데이터 블록","inode 와 데이터 블록 모두"],"answer":0},{"id":"u19d-03","type":"sa","q":"inode 에 이름이 몇 개 붙어 있는지 세는 값을 슬라이드는 무엇이라 부르는가? (link count 라고도 함)","explain":"p.35. unlink() 가 줄이고 0 이 되면 inode 와 데이터 블록을 해제한다 — 진짜 delete.","src":"19강 p.35","wiki":"hard link","prof":true,"tags":["link"],"answer":"reference count","alts":["link count","refcount"]},{"id":"u19d-04","type":"num","q":"빈 디렉터리에서 echo hi > a, ln a b, ln b c, rm a, ln c d, rm b 를 차례로 한 뒤 inode 의 Links 는?","explain":"1 → 2 → 3 → (rm a) 2 → (ln c d) 3 → (rm b) 2. 남은 이름은 c, d.","src":"위키 hard link","wiki":"hard link","diff":2,"tags":["link"],"answer":2,"tol":0},{"id":"u19d-05","type":"tf","q":"위 상태에서 `mv d e` 를 하면 Links 가 1 줄어든다.","explain":"mv 는 같은 파일 시스템 안이면 rename 이라 이름만 바꾼다. Links 는 2 그대로.","src":"위키 hard link","wiki":"hard link","diff":2,"answer":false},{"id":"u19d-06","type":"mc","q":"hard link 를 다른 파티션의 파일에 만들 수 없는 이유는?","explain":"p.37 \"inode numbers are only unique within a file system.\"","src":"19강 p.37","wiki":"symbolic link","prof":true,"tags":["link"],"choices":["inode 번호는 한 파일 시스템 안에서만 유일해서","권한이 없어서","파일 크기가 달라서","symlink 만 허용돼서"],"answer":0},{"id":"u19d-07","type":"cloze","q":"symbolic link 는 링크된 파일의 ___ 을 자기 데이터로 담는 별도 파일이다. 원본을 지우면 ___ reference 가 된다.","explain":"p.39~40.","src":"19강 p.39~40","wiki":"symbolic link","prof":true,"tags":["link"],"answer":["pathname","dangling"],"bank":["pathname","dangling","inode number","hard","circular"]},{"id":"u19d-08","type":"num","q":"`ln -s file file2` 로 만든 file2 의 크기는 몇 바이트인가?","explain":"담긴 경로 \"file\" 이 4글자 (p.39).","src":"19강 p.39","wiki":"symbolic link","tags":["link"],"answer":4,"unit":"B","tol":0},{"id":"u19d-09","type":"num","q":"`ln -s /home/dgist/file1 link1` 의 link1 크기는 몇 바이트인가?","explain":"\"/home/dgist/file1\" 은 17글자. 크기 = 담긴 경로의 길이.","src":"위키 symbolic link","wiki":"symbolic link","diff":2,"tags":["link"],"answer":17,"unit":"B","tol":0},{"id":"u19d-10","type":"tf","q":"symbolic link 를 만들면 원본 inode 의 link count 가 1 오른다.","explain":"symlink 는 새 inode 를 따로 만들고 원본 inode 는 건드리지 않는다.","src":"위키 symbolic link","wiki":"symbolic link","diff":2,"tags":["link"],"answer":false},{"id":"u19d-11","type":"mc","q":"echo hello > file, ln file file2, ln -s file file3, rm file 후 결과는?","explain":"file2 는 같은 inode(Links 2 → 1, 살아 있음). file3 는 이름 file 을 찾아가는데 이름이 없다 — dangling.","src":"위키 symbolic link","wiki":"symbolic link","diff":3,"tags":["link"],"choices":["cat file2 → hello, cat file3 → No such file","둘 다 hello","둘 다 오류","cat file2 → 오류, cat file3 → hello"],"answer":0},{"id":"u19d-12","type":"num","q":"echo hello > file, ln file file2, ln -s file file3 직후 inode 는 몇 개인가?","explain":"원래 파일 하나(Links 2: file, file2)와 symlink 하나.","src":"위키 symbolic link","wiki":"symbolic link","diff":2,"answer":2,"unit":"개","tol":0},{"id":"u19d-13","type":"match","q":"hard link 와 symbolic link 비교","explain":"p.32~40.","src":"19강 p.32~40","wiki":"symbolic link","tags":["link"],"pairs":[["hard link","같은 inode 를 가리키는 이름, 파티션 못 넘음"],["symbolic link","경로를 담은 별도 파일, 파티션을 넘을 수 있음"],["dangling reference","원본을 지워 아무것도 안 가리키는 symlink"],["reference count","inode 에 붙은 이름 수"]]}]}]},{"id":"u20","title":"20강 File System Implementation","desc":"on-disk 구조 · inode 위치 계산 · multi-level index · 접근 경로 I/O · 캐싱","lessons":[{"id":"u20a","title":"On-disk 구조","items":[{"id":"u20a-01","type":"match","q":"파일 시스템을 구현할 때 생각할 두 측면을 연결하시오","explain":"p.2 The Way To Think 와 p.6~8.","src":"20강 p.2, p.6~8","tags":["FS 구조"],"pairs":[["Data structures","어떤 on-disk 구조로 데이터와 metadata 를 정리하나"],["Access methods","open/read/write 호출이 어떤 구조를 읽고 쓰나"],["Superblock","파일 시스템 전체 정보 (inode 수, inode table 시작 위치)"],["Bitmap","각 inode·data block 의 free(0)/in-use(1)"]],"wiki":"vsfs 디스크 배치"},{"id":"u20a-02","type":"num","q":"block 이 4KB 이고 sector 가 512B 면 block 하나는 sector 몇 개인가?","explain":"p.3 \"4 KB = eight 512-byte sectors\". 4096 / 512 = 8.","src":"20강 p.3","diff":1,"answer":8,"unit":"개","tol":0,"wiki":"vsfs 디스크 배치"},{"id":"u20a-03","type":"num","q":"inode 크기 256B, block 4KB 일 때 block 하나에 inode 가 몇 개 들어가나?","explain":"4096 / 256 = 16 (p.5).","src":"20강 p.5","tags":["inode"],"answer":16,"unit":"개","tol":0,"wiki":"vsfs 디스크 배치"},{"id":"u20a-04","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. 파일 시스템의 inode 는 최대 몇 개인가?","explain":"inode table 이 block 3~7 로 5블록 × 16 = 80 (p.5, 디렉터리 포함).","src":"20강 p.5","tags":["inode"],"answer":80,"unit":"개","tol":0,"wiki":"vsfs 디스크 배치"},{"id":"u20a-05","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. data region 은 몇 블록인가?","explain":"block 8~63 → 64 − 8 = 56블록. 앞 8블록이 S, i, d, inode table 5블록.","src":"20강 p.4~8","diff":2,"answer":56,"unit":"블록","tol":0,"wiki":"vsfs 디스크 배치"},{"id":"u20a-06","type":"order","q":"p.8 그림의 디스크 앞쪽 배치 순서","explain":"block 0 = S, 1 = i, 2 = d, 3~7 = I, 8~63 = D.","src":"20강 p.8","tags":["FS 구조"],"answer":["Superblock (S)","Inode bitmap (i)","Data bitmap (d)","Inode table (I)","Data region (D)"],"wiki":"vsfs 디스크 배치"},{"id":"u20a-07","type":"tf","q":"파일 시스템을 mount 할 때 OS 는 superblock 을 먼저 읽어 여러 정보를 초기화한다.","explain":"p.8 \"When mounting a file system, OS will read the superblock first\".","src":"20강 p.8","answer":true,"wiki":"vsfs 디스크 배치"},{"id":"u20a-08","type":"tf","q":"bitmap 에서 1 은 free, 0 은 in-use 를 뜻한다.","explain":"p.6: 각 bit 는 free (0) 또는 in-use (1).","src":"20강 p.6","diff":1,"answer":false,"wiki":"vsfs 디스크 배치"},{"id":"u20a-09","type":"sa","q":"파일을 만들 때 inode 하나를 할당하려고 보는 구조는? (영어 두 단어)","explain":"p.7 \"Creating a file allocates an inode using the inode bitmap. Allocating a data block also updates the data bitmap.\"","src":"20강 p.7","answer":"inode bitmap","alts":["i-bmap","inode bmap"],"wiki":"vsfs 디스크 배치"},{"id":"u20a-10","type":"cloze","q":"연속 블록을 미리 잡아 두는 ___ 정책을 흔히 쓰며, EXT4 의 ___ 가 그 예다.","explain":"p.7 \"Pre-allocation policy is commonly used for allocate contiguous blocks — e.g., extents in EXT4\".","src":"20강 p.7","answer":["pre-allocation","extents"],"bank":["pre-allocation","extents","demand paging","cylinder group","journaling"],"wiki":"extent"},{"id":"u20a-11","type":"mc","q":"inode 에 저장되지 않는 것은?","explain":"p.10: type, size, data block index, protection, time. 이름은 디렉터리 엔트리에 있다(19강).","src":"20강 p.10","tags":["inode"],"choices":["파일 이름","파일 크기","data block 위치(index)","접근·수정·상태 변경 시간"],"answer":0,"wiki":"vsfs 디스크 배치"},{"id":"u20a-12","type":"match","q":"ext2 inode 필드와 뜻을 연결하시오","explain":"p.11 The EXT2 Inode 표.","src":"20강 p.11 · 🎙 11/23 수업","diff":2,"pairs":[["links_count","hard link 수"],["blocks","할당된 512-byte 단위 수"],["block (60B)","disk pointer 15개"],["dtime","inode 가 삭제된 시간"]],"wiki":"ext2 inode","prof":true},{"id":"u20a-13","type":"num","q":"ext2 inode 의 block 필드는 60바이트에 disk pointer 15개를 담는다. pointer 하나는 몇 바이트인가?","explain":"60 / 15 = 4B.","src":"20강 p.11 · 🎙 11/23 수업","diff":1,"answer":4,"unit":"B","tol":0,"wiki":"ext2 inode","prof":true}]},{"id":"u20b","title":"inode 위치 손으로 계산","items":[{"id":"u20b-01","type":"cloze","q":"inode 번호로 sector 찾기: inodeRegion = inumber × ___ , 그 값에 inode table ___ 를 더하고, ___ 로 나눈다.","explain":"p.9: sector = (inodeStartAddr + inumber × sizeof(inode)) / sectorSize.","src":"20강 p.9","tags":["inode 계산"],"answer":["sizeof(inode)","시작 주소","sector 크기"],"bank":["sizeof(inode)","시작 주소","sector 크기","block 크기","PFN","superblock"],"wiki":"inode 주소 계산"},{"id":"u20b-02","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 32 의 inodeRegion(바이트 offset)은?","explain":"32 × 256 = 8192 (p.9).","src":"20강 p.9 · 🎙 11/23 수업","tags":["inode 계산"],"answer":8192,"unit":"B","tol":0,"wiki":"inode 주소 계산","prof":true},{"id":"u20b-03","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 32 가 있는 sector 번호는?","explain":"(12288 + 8192) / 512 = 20480 / 512 = 40. 주소로는 20KB (p.9).","src":"20강 p.9 · 🎙 11/23 수업","tags":["inode 계산"],"answer":40,"tol":0,"wiki":"inode 주소 계산","prof":true},{"id":"u20b-04","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 0 이 있는 sector 번호는?","explain":"(12288 + 0) / 512 = 24. inode table 의 첫 sector.","src":"20강 p.9 규칙 적용","tags":["inode 계산"],"answer":24,"tol":0,"wiki":"inode 주소 계산"},{"id":"u20b-05","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 20 이 있는 sector 번호는?","explain":"20 × 256 = 5120, (12288 + 5120) / 512 = 17408 / 512 = 34.","src":"20강 p.9 규칙 적용","tags":["inode 계산"],"answer":34,"tol":0,"wiki":"inode 주소 계산"},{"id":"u20b-06","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 15 가 있는 sector 번호는? (나머지는 버림)","explain":"15 × 256 = 3840, (12288 + 3840) / 512 = 31.5 → sector 31 의 뒤쪽 절반. sector 하나에 inode 2개.","src":"20강 p.9 규칙 적용 · 🎙 11/23 수업","diff":2,"tags":["inode 계산"],"answer":31,"tol":0,"wiki":"inode 주소 계산","prof":true},{"id":"u20b-07","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 50 이 들어 있는 block 번호는?","explain":"block 하나에 16개 → 50 / 16 = 3 (몫), inode table 시작 block 3 + 3 = 6.","src":"20강 p.5, p.9 규칙 적용 · 🎙 11/23 수업","diff":2,"tags":["inode 계산"],"answer":6,"tol":0,"wiki":"inode 주소 계산","prof":true},{"id":"u20b-08","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 79(마지막 inode)가 있는 sector 번호는?","explain":"79 × 256 = 20224, (12288 + 20224) / 512 = 63.5 → sector 63. block 7 의 마지막 sector 다.","src":"20강 p.9 규칙 적용","diff":3,"tags":["inode 계산"],"answer":63,"tol":0,"wiki":"inode 주소 계산"},{"id":"u20b-09","type":"num","q":"inode table 시작 16KB, inode 128B, sector 512B 일 때 inode 100 의 sector 번호는?","explain":"100 × 128 = 12800, (16384 + 12800) / 512 = 29184 / 512 = 57.","src":"20강 p.9 규칙 적용","diff":3,"tags":["inode 계산"],"answer":57,"tol":0,"wiki":"inode 주소 계산"},{"id":"u20b-10","type":"num","q":"sector 512B, inode 256B 이면 sector 하나에 inode 가 몇 개 들어가나?","explain":"512 / 256 = 2. 디스크는 sector 단위로 읽으니 inode 하나 읽어도 sector 하나를 읽는다.","src":"20강 p.9","diff":1,"answer":2,"unit":"개","tol":0,"wiki":"inode 주소 계산"},{"id":"u20b-11","type":"tf","q":"파일 시스템은 inode 번호만 있으면 계산만으로 그 inode 의 디스크 위치를 안다.","explain":"p.9 \"By an inode number, the file system calculates where an inode is on the disk\". inode table 이 고정 크기 배열이라서.","src":"20강 p.9","answer":true,"wiki":"inode 주소 계산"},{"id":"u20b-12","type":"num","q":"디렉터리 엔트리 이름 \"foobar\" 의 \"Bytes incl. NUL\" 값은?","explain":"6글자 + NUL 1 = 7 (p.18 표).","src":"20강 p.18","diff":1,"answer":7,"unit":"B","tol":0,"wiki":"inode 주소 계산"},{"id":"u20b-13","type":"mc","q":"p.18 예에서 디렉터리 dir 의 inode 번호가 5 이고 . 과 .. 엔트리가 있다. .. 의 inode 번호 2 가 뜻하는 것은?","explain":". 은 자기(5), .. 는 부모. 예에서 root 의 inode 번호가 2 다(p.19).","src":"20강 p.18~19","diff":2,"choices":["부모 디렉터리(여기선 root)의 inode","dir 자신","첫 번째 파일 foo","빈 엔트리"],"answer":0,"wiki":"inode 주소 계산"}]},{"id":"u20c","title":"Multi-level index 와 최대 파일 크기","items":[{"id":"u20c-01","type":"num","q":"direct pointer 13개만 있는 single-level index, block 4KB 일 때 최대 파일 크기는 몇 KB 인가?","explain":"13 × 4KB = 52KB (p.13).","src":"20강 p.13","tags":["index"],"answer":52,"unit":"KB","tol":0,"wiki":"multi-level index"},{"id":"u20c-02","type":"num","q":"block 4KB, pointer 4B 일 때 indirect block 하나에 들어가는 pointer 수는?","explain":"4096 / 4 = 1024.","src":"20강 p.14","tags":["index"],"answer":1024,"unit":"개","tol":0,"wiki":"multi-level index"},{"id":"u20c-03","type":"num","q":"direct 12개 + single indirect 1개, block 4KB, pointer 4B 일 때 최대 파일 크기는 몇 KB 인가?","explain":"(12 + 1024) × 4KB = 4144KB (p.14).","src":"20강 p.14","tags":["index"],"answer":4144,"unit":"KB","tol":0,"wiki":"multi-level index"},{"id":"u20c-04","type":"num","q":"double indirect pointer 하나가 추가로 가리키는 data block 수는?","explain":"1024 × 1024 = 1,048,576 (p.15). 용량 4GB.","src":"20강 p.15","tags":["index"],"answer":1048576,"unit":"개","tol":0,"wiki":"multi-level index"},{"id":"u20c-05","type":"num","q":"double indirect pointer 하나가 덮는 용량은 몇 GB 인가? (block 4KB, pointer 4B)","explain":"$1024^2$ × 4KB = $2^{20}$ × $2^{12}$ = $2^{32}$ B = 4GB.","src":"20강 p.15","tags":["index"],"answer":4,"unit":"GB","tol":0,"wiki":"multi-level index"},{"id":"u20c-06","type":"num","q":"direct 12 + single + double indirect, block 4KB 일 때 최대 data block 수는?","explain":"12 + 1024 + 1024² = 12 + 1024 + 1,048,576 = 1,049,612 → 용량은 4GB 를 조금 넘는다 (p.16).","src":"20강 p.16","diff":2,"tags":["index"],"answer":1049612,"unit":"개","tol":0,"wiki":"multi-level index"},{"id":"u20c-07","type":"num","q":"triple indirect pointer 하나가 덮는 용량은 몇 TB 인가? (block 4KB, pointer 4B)","explain":"$1024^3$ × 4KB = $2^{30}$ × $2^{12}$ = $2^{42}$ B = 4TB. 슬라이드 p.13 이 언급한 triple indirect 에 같은 규칙 적용.","src":"20강 p.13·15 규칙 적용","diff":3,"tags":["index"],"answer":4,"unit":"TB","tol":0,"wiki":"multi-level index"},{"id":"u20c-08","type":"num","q":"block 1KB, pointer 4B, direct 12개 + single indirect 1개면 최대 파일 크기는 몇 KB 인가?","explain":"indirect block 하나에 1024/4 = 256 pointer → (12 + 256) × 1KB = 268KB.","src":"20강 p.14 규칙 적용","diff":3,"tags":["index"],"answer":268,"unit":"KB","tol":0,"wiki":"multi-level index"},{"id":"u20c-09","type":"mc","q":"direct 12 + single indirect + double indirect (4KB, 4B) 에서 파일의 block 번호 500 은 어느 pointer 로 찾나?","explain":"direct 는 0~11, single indirect 는 12~1035 (12 + 1024 − 1). 500 은 그 안.","src":"20강 p.14~16 적용","diff":2,"tags":["index"],"choices":["single indirect","direct","double indirect","triple indirect"],"answer":0,"wiki":"multi-level index"},{"id":"u20c-10","type":"mc","q":"같은 구조에서 파일 block 번호 2000 은 어느 pointer 로 찾나?","explain":"single indirect 는 1035 까지다. 1036 부터 double indirect.","src":"20강 p.14~16 적용","diff":2,"tags":["index"],"choices":["double indirect","single indirect","direct","찾을 수 없음"],"answer":0,"wiki":"multi-level index"},{"id":"u20c-11","type":"num","q":"inode 는 이미 메모리에 있고 index block 은 캐시에 없다. double indirect 로 가는 data block 하나를 읽는 데 디스크 read 는 몇 번인가?","explain":"double indirect block 1 + indirect block 1 + data 1 = 3. p.15 \"Uncached index blocks require extra disk reads.\"","src":"20강 p.15","diff":3,"tags":["index","I/O 수"],"answer":3,"unit":"번","tol":0,"wiki":"multi-level index"},{"id":"u20c-12","type":"tf","q":"multi-level index 의 indirect block 은 파일이 충분히 커질 때 할당된다.","explain":"p.14 \"If a file grows large enough, an indirect block is allocated, inode's slot for an indirect pointer is set to point to it.\"","src":"20강 p.14","answer":true,"wiki":"multi-level index"},{"id":"u20c-13","type":"cloze","q":"indirect pointer 는 data 가 아니라 ___ 들을 담은 block 을 가리키고, double indirect pointer 는 ___ block 의 pointer 를 담은 block 을 가리킨다.","explain":"p.14~15.","src":"20강 p.14~15","tags":["index"],"answer":["pointer","indirect"],"bank":["pointer","indirect","inode","bitmap","superblock"],"wiki":"multi-level index"}]},{"id":"u20d","title":"접근 경로의 I/O 수와 캐싱","items":[{"id":"u20d-01","type":"order","q":"open(\"/foo/bar\", O_RDONLY) 에서 디스크를 읽는 순서","explain":"p.19~21: root 부터 경로를 따라 inode → data 를 번갈아 읽고 bar 의 inode 를 찾으면 권한 검사 후 fd 를 돌려준다.","src":"20강 p.19~21","tags":["I/O 수"],"answer":["root inode (2번)","root data","foo inode","foo data","bar inode"],"wiki":"파일 접근 경로"},{"id":"u20d-02","type":"num","q":"open(\"/foo/bar\") (각 디렉터리 data 는 block 하나, 캐시 없음) 의 디스크 read 는 몇 번인가?","explain":"root inode, root data, foo inode, foo data, bar inode = 5 (p.21 timeline).","src":"20강 p.21","tags":["I/O 수"],"answer":5,"unit":"번","tol":0,"wiki":"파일 접근 경로"},{"id":"u20d-03","type":"num","q":"이미 연 bar 에서 read() 한 번(block 하나)이 일으키는 I/O 는 몇 번인가? (atime 갱신 포함)","explain":"bar inode read → data read → bar inode write(last-access time) = 3 (p.20~21).","src":"20강 p.20~21","diff":2,"tags":["I/O 수"],"answer":3,"unit":"번","tol":0,"wiki":"파일 접근 경로"},{"id":"u20d-04","type":"num","q":"open(\"/foo/bar\") 뒤 read() 를 3번(block 3개) 하면 총 I/O 는 몇 번인가?","explain":"open 5 + read 3 × 3 = 14. close 는 디스크 I/O 가 없다 (p.20).","src":"20강 p.20~21","diff":2,"tags":["I/O 수"],"answer":14,"unit":"번","tol":0,"wiki":"파일 접근 경로"},{"id":"u20d-05","type":"tf","q":"읽기 전용 예에서 close() 는 추가 디스크 I/O 가 필요 없다.","explain":"p.20 \"close releases the descriptor and needs no additional disk I/O\".","src":"20강 p.20","answer":true,"wiki":"파일 접근 경로"},{"id":"u20d-06","type":"order","q":"새 block 을 할당하는 write() 의 I/O 다섯 개 순서","explain":"p.22 의 1~5 번.","src":"20강 p.22","tags":["I/O 수"],"answer":["inode 읽기","data bitmap 읽기","data bitm ion"},{"id":"u21c-02","type":"sa","q":"일을 한 번에 더 많이 해서 overhead 비율을 줄이는 것을 슬라이드는 무엇이라 부르나?","explain":"p.15 \"Amortization: reducing overhead by doing more work\". chunk 를 충분히 크게 잡으면 seek 비용이 상쇄된다.","src":"21강 p.15","answer":"amortization","alts":["amortize"],"wiki":"large-file exception"},{"id":"u21c-03","type":"num","q":"disk bandwidth 40MB/s, positioning 10ms 에서 peak 의 50% 를 내려면 seek 한 번마다 몇 KB 를 전송해야 하나?","explain":"절반은 seek, 절반은 전송 → 전송 시간 10ms 동안 40 × 1024 KB/s × 0.01 s = 409.6KB (p.16).","src":"21강 p.16","diff":2,"tags":["large file"],"answer":409.6,"unit":"KB","tol":0.001,"wiki":"large-file exception"},{"id":"u21c-04","type":"num","q":"disk bandwidth 100MB/s, positioning 5ms 에서 peak 의 50% 를 내려면 seek 한 번마다 몇 KB 를 전송해야 하나? (1MB = 1024KB)","explain":"100 × 1024 KB/s × 0.005 s = 512KB. p.16 식에 숫자만 바꿈.","src":"21강 p.16 규칙 적용","diff":3,"tags":["large file"],"answer":512,"unit":"KB","tol":0.001,"wiki":"large-file exception"},{"id":"u21c-05","type":"tf","q":"p.16 에 따르면 peak 의 90% 를 내려면 chunk 가 약 4MB 필요하다.","explain":"p.16 \"90% of peak performance on about 4 MB chunk size\".","src":"21강 p.16","answer":true,"wiki":"large-file exception"},{"id":"u21c-06","type":"num","q":"inode 기반 단순 방식에서 indirect block 하나(4KB, pointer 4B)가 가리키는 data 는 몇 MB 이고, 그만큼씩 다른 group 에 놓이나?","explain":"1024 pointer × 4KB = 4MB (p.17). direct 12 block 은 inode 와 같은 group.","src":"21강 p.17","diff":2,"tags":["large file"],"answer":4,"unit":"MB","tol":0,"wiki":"large-file exception"},{"id":"u21c-07","type":"mc","q":"SSD 에서 FFS 식 locality 가 여전히 도움이 될 수 있는 이유로 p.18 이 든 것은?","explain":"p.18: SSD 는 seek 가 없고 FTL 이 물리 매핑을 바꾸지만, readahead·sequential write 의 이득은 남는다.","src":"21강 p.18","diff":2,"choices":["readahead cache 와 sequential write 기회","seek time 이 길어서","cylinder 가 있어서","FTL 이 없어서"],"answer":0,"wiki":"large-file exception"},{"id":"u21c-08","type":"match","q":"ext4 기능과 설명을 연결하시오","explain":"p.19~23.","src":"21강 p.19~23","tags":["ext4"],"pairs":[["Extent","연속 block 묶음을 (시작, 길이) 하나로 표현"],["Preallocat
