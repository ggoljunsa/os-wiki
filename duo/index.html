 합산하기 때문이다.","explain":"이름이 다르면 그 lock 의 contention 은 아예 측정되지 않는다.","src":"위키 과제2 퀴즈 대비 Q2","wiki":"lock contention","prof":true,"answer":true},{"id":"uaa-03","type":"mc","q":"cpuid() 결과를 쓰기 전에 push_off() 로 인터럽트를 끄는 이유는?","explain":"cpuid 직후 yield 로 프로세스가 다른 CPU 로 가면 지역 변수의 번호가 지금 CPU 와 다를 수 있다.","src":"위키 과제2 퀴즈 대비 Q3","wiki":"cpuid","prof":true,"tags":["cpuid"],"choices":["타이머 인터럽트로 다른 CPU 로 옮겨지면 읽은 CPU 번호가 낡기 때문","cpuid 가 특권 명령이라서","lock 을 잡기 위해서","TLB 를 flush 하려고"],"answer":0},{"id":"uaa-04","type":"cloze","q":"kfree 에서 지금 CPU 리스트 고르기: ___(); int id = ___(); acquire(&kmem[id].lock); … release(…); ___();","explain":"acquire 도 내부에서 push_off 를 하지만 cpuid 를 읽는 순간이 acquire 보다 앞이라 따로 꺼야 한다. push_off/pop_off 는 중첩을 센다.","src":"위키 과제2 퀴즈 대비 Q11","wiki":"cpuid","prof":true,"diff":2,"answer":["push_off","cpuid","pop_off"],"bank":["push_off","cpuid","pop_off","sched","myproc","intr_on"]},{"id":"uaa-05","type":"mc","q":"free list 를 CPU 마다 따로 두었는데도 각 리스트에 lock 이 필요한 이유는?","explain":"steal 하는 CPU 가 남의 리스트를 건드린다.","src":"위키 과제2 퀴즈 대비 Q4","wiki":"steal","prof":true,"choices":["내 리스트가 빈 다른 CPU 가 steal 하러 와서 동시에 만질 수 있어서","xv6 규칙이라서","kfree 가 인터럽트 핸들러라서","디스크 I/O 때문에"],"answer":0},{"id":"uaa-06","type":"cloze","q":"원본 kfree: memset(pa, ___, PGSIZE); r->next = kmem.freelist; kmem.freelist = ___;","explain":"junk 1 로 채워 dangling 참조를 잡고, 리스트 head 에 push 한다. kalloc 은 5 로 채운다.","src":"위키 과제2 퀴즈 대비 Q9","wiki":"kalloc","prof":true,"diff":2,"answer":["1","r"],"bank":["1","r","5","0","pa->next"]},{"id":"uaa-07","type":"mc","q":"부팅 직후 CPU0, CPU1 의 free list 길이는 대략?","explain":"kinit → freerange → kfree 가 CPU0 에서만 돈다. CPU1 의 첫 kalloc 은 CPU0 리스트에서 steal 한다.","src":"위키 과제2 퀴즈 대비 Q15","wiki":"per-CPU free list","prof":true,"diff":2,"choices":["CPU0 에 거의 전부, CPU1 은 0","모두 같다","CPU1 에 거의 전부","모두 0"],"answer":0},{"id":"uaa-08","type":"mc","q":"CPU0 은 kmem[0] 을 쥐고 kmem[1] 을, CPU1 은 kmem[1] 을 쥐고 kmem[0] 을 기다린다. 이 상태와 고치는 법은?","explain":"lock ordering 으로 circular wait 를 깨거나, 한 번에 lock 하나(hold and wait 방지)만 쥔다.","src":"위키 과제2 퀴즈 대비 Q16","wiki":"steal","prof":true,"diff":2,"tags":["deadlock"],"choices":["circular wait deadlock — lock 을 번호 순으로 잡거나 내 lock 을 놓고 남의 lock 만 잡는다","livelock — sleep 을 넣는다","starvation — 우선순위를 준다","정상 — 곧 풀린다"],"answer":0},{"id":"uaa-09","type":"num","q":"kalloctest test1 은 테스트 전후 tot 의 차이 n − m 이 몇 미만이어야 OK 인가?","explain":"kalloctest.c: if(n-m \u003c 10) printf(\"test1 OK\"). 원본은 lock 이 kmem 하나라 8만 번 넘게 헛돌아 FAIL.","src":"위키 과제2 퀴즈 대비 Q13","wiki":"lock contention","prof":true,"answer":10,"tol":0},{"id":"uaa-10","type":"tf","q":"make CPUS=1 qemu 로 kalloctest 를 돌려 #test-and-set 이 0 이면 contention 문제가 해결됐다고 볼 수 있다.","explain":"CPU 가 하나면 기다리는 CPU 가 없어 항상 0 이다. 로직 정확성 확인용일 뿐 contention 측정으로는 아무것도 증명하지 못한다.","src":"위키 과제2 퀴즈 대비 Q14","wiki":"lock contention","prof":true,"diff":2,"answer":false},{"id":"uaa-11","type":"tf","q":"kfree 의 memset 은 lock 밖에서 한다.","explain":"위키 Q9 해설: memset 이 lock 밖에 있어 lock 을 쥐는 시간을 줄인다.","src":"위키 과제2 퀴즈 대비 Q9","wiki":"kalloc","prof":true,"diff":2,"answer":true},{"id":"uaa-12","type":"mc","q":"free list 노드(struct run)를 빈 page 자신 안에 두는 발상과 같은 14강 개념은?","explain":"14강 p.29 \"build such a list inside the free space itself\".","src":"위키 embedded free list","wiki":"kalloc","diff":1,"choices":["embedded free list","compaction","Best Fit","segment table"],"answer":0},{"id":"uaa-13","type":"tf","q":"xv6 의 kalloc() 은 할당한 page 를 1 로 채운다.","explain":"kalloc 은 5 로, kfree 는 1 로 채운다(junk). 둘을 다르게 해서 dangling 참조와 초기화 안 된 사용을 구분한다.","src":"위키 과제2 퀴즈 대비 Q9","wiki":"kalloc","prof":true,"answer":false}]},{"id":"uab","title":"과제2 ② bcache 해시 버킷","items":[{"id":"uab-01","type":"mc","q":"kalloc 과 달리 buffer cache 를 per-CPU 로 나눌 수 없는 이유는?","explain":"CPU 별 캐시를 두면 같은 블록의 사본이 여럿 생긴다. 그래서 블록 번호(해시 버킷)로 나눈다.","src":"위키 과제2 퀴즈 대비 Q5","wiki":"bcache 해시 버킷","prof":true,"tags":["bcache"],"choices":["모든 CPU 가 같은 블록의 단 하나의 사본을 공유해야 해서","buffer 가 너무 커서","sleeplock 이라서","NBUF 가 30 이라서"],"answer":0},{"id":"uab-02","type":"num","q":"해시 버킷이 13개(blockno % 13)일 때 블록 40 은 몇 번 버킷인가?","explain":"40 = 3 × 13 + 1 → 버킷 1. 블록 27 도 27 % 13 = 1 이라 같은 버킷이다.","src":"위키 과제2 퀴즈 대비 Q17","wiki":"bcache 해시 버킷","prof":true,"tags":["bcache"],"answer":1,"tol":0},{"id":"uab-03","type":"mc","q":"블록 40(버킷 1) miss 에서 빈 버퍼가 블록 27(버킷 1)의 사본일 때 \"옛 버킷 lock 을 잡고 떼어 낸다\" 를 그대로 하면?","explain":"xv6 acquire 는 if(holding(lk)) panic(\"acquire\"). 같은 버킷이면 lock 을 다시 잡지 말고 그 자리에서 이름만 바꾼다.","src":"위키 과제2 퀴즈 대비 Q17","wiki":"bcache 해시 버킷","prof":true,"diff":3,"choices":["이미 쥔 bucket[1].lock 을 다시 acquire 해 panic: acquire","deadlock","정상 동작","사본이 둘 생긴다"],"answer":0},{"id":"uab-04","type":"tf","q":"해시 버킷 수로 13 같은 소수를 권하는 이유는 규칙적인 간격의 블록 번호가 한 버킷에 몰리지 않게 하려는 것이다.","explain":"같은 버킷 충돌은 그 버킷 lock 의 contention 이 되며 PDF 가 허용하는 경우다.","src":"위키 과제2 퀴즈 대비 Q8","wiki":"bcache 해시 버킷","prof":true,"answer":true},{"id":"uab-05","type":"mc","q":"원본 bget 은 \"at most one cached buffer per block\" 불변식을 어떻게 지키나?","explain":"\"확인 + 없으면 자리 잡기\" 를 atomic 하게 만든다.","src":"위키 과제2 퀴즈 대비 Q6","wiki":"buffer cache","prof":true,"tags":["bcache"],"choices":["bcache.lock 을 캐시 확인부터 새 버퍼 등록까지 계속 쥔다","sleeplock 을 먼저 잡는다","refcnt 를 2 로 둔다","해시를 쓴다"],"answer":0},{"id":"uab-06","type":"mc","q":"버퍼 lock 이 spinlock 이 아니라 sleeplock 인 이유는?","explain":"18강 polling vs interrupt 와 같은 판단 — 오래 기다리면 재운다.","src":"위키 과제2 퀴즈 대비 Q7","wiki":"sleeplock","prof":true,"choices":["디스크 I/O 동안 오래 쥐어야 해서 spin 하면 CPU 낭비","인터럽트를 끄려고","refcnt 를 지키려고","deadlock 을 막으려고"],"answer":0},{"id":"uab-07","type":"tf","q":"bget 이 bcache.lock 을 놓은 뒤 b->lock 을 잡아도 안전한 이유는 놓기 전에 refcnt 를 올려 그 버퍼가 다른 블록으로 재사용되지 않기 때문이다.","explain":"refcnt 가 0 이 아니면 재사용 금지 — spinlock 을 놓고 sleeplock 을 잡는 사이를 이어 준다.","src":"위키 과제2 퀴즈 대비 Q7","wiki":"refcnt","prof":true,"diff":2,"answer":true},{"id":"uab-08","type":"cloze","q":"원본 bget 둘째 루프: 아무도 안 쓰는 버퍼를 찾을 때 조건은 if(b->refcnt == ___), 찾은 버퍼에 새 블록을 등록하며 b->refcnt = ___ 로 둔다.","explain":"쓰는 사람이 없는(refcnt 0) 버퍼만 재사용하고, 지금 가져가는 사람 하나로 refcnt = 1. 루프는 prev 방향(LRU 쪽)부터 돈다.","src":"위키 과제2 퀴즈 대비 Q10","wiki":"buffer cache","prof":true,"diff":2,"answer":["0","1"],"bank":["0","1","2","-1","NBUF"]},{"id":"uab-09","type":"mc","q":"bget 에서 새 버퍼의 b->valid = 0 을 빼먹으면?","explain":"valid == 1 로 보이면 디스크 읽기를 건너뛴다.","src":"위키 과제2 퀴즈 대비 Q10","wiki":"buffer cache","prof":true,"diff":2,"choices":["bread 가 디스크를 안 읽고 옛 블록 내용을 새 블록처럼 돌려준다","panic","deadlock","아무 문제 없다"],"answer":0},{"id":"uab-10","type":"order","q":"Problem 2 bget 의 miss 경로 순서","explain":"버킷 lock 을 쥔 채 bcache.lock 을 기다리면 lock 순서가 뒤집혀 deadlock. 다시 찾기를 안 하면 같은 블록 사본이 둘 생길 수 있다.","src":"위키 과제2 퀴즈 대비 Q12","wiki":"bcache 해시 버킷","prof":true,"diff":3,"answer":["bucket[h].lock 잡고 찾기 → 없음","bucket[h].lock 놓기","bcache.lock 잡기","bucket[h].lock 잡고 한 번 더 찾기","refcnt 0 인 버퍼를 떼어 와 bucket[h] 에 붙임","spinlock 들 놓고 acquiresleep"]},{"id":"uab-11","type":"mc","q":"miss 뒤 재검색 없이 빈 버퍼를 재사용하는 bget 에서 P, Q 가 같은 블록 B 를 동시에 읽으면?","explain":"2025 제출물의 race. bcachetest 는 같은 블록 동시 miss 를 거의 안 만들어 채점기는 100점이었다.","src":"위키 과제2 퀴즈 대비 Q18","wiki":"bcache 해시 버킷","prof":true,"diff":3,"choices":["B 의 사본이 두 개 생겨 불변식이 깨진다","deadlock","panic: acquire","항상 안전"],"answer":0},{"id":"uab-12","type":"num","q":"과제 2 에서 유지해야 하는 buffer 개수 NBUF 는?","explain":"NBUF=30 유지, 블록당 사본 하나.","src":"과목 CLAUDE.md Assignment 2","wiki":"NBUF","prof":true,"answer":30,"unit":"개","tol":0},{"id":"uab-13","type":"tf","q":"miss 경로에서 bucket[h].lock 을 쥔 채 bcache.lock 을 기다려도 안전하다.","explain":"eviction 중인 프로세스가 bcache.lock 을 쥐고 bucket[h].lock 을 기다리면 circular wait. 규칙은 bcache.lock → 버킷 lock 한 방향.","src":"위키 과제2 퀴즈 대비 Q19","wiki":"bcache 해시 버킷","prof":true,"diff":2,"tags":["deadlock"],"answer":false}]},{"id":"uac","title":"과제3 ① COW fork","items":[{"id":"uac-01","type":"mc","q":"COW fork 에서 자식 PTE 뿐 아니라 부모 PTE 의 W 도 꺼야 하는 이유는?","explain":"공유 frame 을 둘 다 읽기 전용으로 만들어야 첫 쓰기에서 fault 가 나 복사할 수 있다.","src":"위키 과제3 퀴즈 대비 Q1","wiki":"COW fork","prof":true,"tags":["COW"],"choices":["부모의 쓰기가 fault 없이 공유 frame 에 바로 써져 자식이 그 값을 보게 돼서","부모가 먼저 exit 하므로","TLB 때문에","커널이 부모 page 를 못 읽어서"],"answer":0},{"id":"uac-02","type":"mc","q":"W 를 끄는 것 말고 RSW 비트에 COW 표시를 따로 두는 이유는?","explain":"text page 쓰기는 kill 해야 하고 COW page 쓰기는 복사해야 한다.","src":"위키 과제3 퀴즈 대비 Q2","wiki":"RSW 비트","prof":true,"tags":["COW"],"choices":["원래 read-only 인 page(text)도 W = 0 이라 복사할 page 와 kill 할 page 를 구분하려고","dirty 비트가 없어서","TLB 가 RSW 만 봐서","refcount 를 저장하려고"],"answer":0},{"id":"uac-03","type":"sa","q":"Sv39 PTE 에서 software 가 자유롭게 쓰는 비트 8~9 칸의 이름은? (약어)","explain":"16강 p.48 그림. 과제에서는 PTE_COW = 1L \u003c\u003c 8 로 쓴다.","src":"16강 p.48, 위키 RSW 비트","wiki":"RSW 비트","prof":true,"answer":"RSW","alts":["Reserved for SoftWare","reserved for software"]},{"id":"uac-04","type":"num","q":"COW page 에 store 해서 나는 page fault 의 scause 값은?","explain":"scause 15 = store/AMO page fault. 8 = ecall, 13 = load page fault, 12 = instruction page fault.","src":"위키 scause, 과제3 퀴즈 대비 Q9","wiki":"scause","prof":true,"tags":["scause"],"answer":15,"tol":0},{"id":"uac-05","type":"match","q":"scause 값과 원인을 연결하시오","explain":"COW 와 관계있는 것은 15 뿐이다. 읽기는 공유 page 에서 그냥 된다.","src":"위키 scause","wiki":"scause","prof":true,"pairs":[["8","U-mode 의 ecall (시스템 콜)"],["12","instruction page fault"],["13","load page fault"],["15","store/AMO page fault"]]},{"id":"uac-06","type":"tf","q":"COW fault 를 처리한 뒤에는 시스템 콜처럼 p->trapframe->epc 에 4 를 더한다.","explain":"fault 를 낸 store 가 실행되지 못했으므로 같은 명령을 재실행해야 한다. 17강 page fault 의 reinstruction 과 같다.","src":"위키 과제3 퀴즈 대비 Q3","wiki":"COW fork","prof":true,"diff":2,"answer":false},{"id":"uac-07","type":"num","q":"부모 data PTE 가 0x21fd0417(V·R·W·U)이다. fork 직후 W(0x4)를 끄고 COW(0x100)를 켠 PTE 의 하위 12비트(16진수 세 자리)를 10진수로 쓰면?","explain":"0x417 & ~0x4 = 0x413, | 0x100 = 0x513 = 1299. 전체 PTE 는 0x21fd0513.","src":"위키 과제3 퀴즈 대비 Q8","wiki":"COW fork","prof":true,"diff":3,"answer":1299,"tol":0},{"id":"uac-08","type":"order","q":"COW store page fault 처리 순서","explain":"검사 전에 할당하면 kill 할 때 page 가 샌다. count 를 복사보다 먼저 줄이면 복사 전에 옛 page 가 free 될 수 있다.","src":"위키 과제3 퀴즈 대비 Q13","wiki":"COW fork","prof":true,"diff":3,"answer":["stval 의 PTE 가 V·U·COW 인지 검사","kalloc() 으로 새 page 받기","옛 page 를 4096B 복사","내 PTE 를 새 PA 로, W 켜고 COW 지움","옛 page 의 count 를 1 줄임","epc 를 그대로 두고 돌아감"]},{"id":"uac-09","type":"mc","q":"fault 핸들러가 있는데도 copyout() 을 따로 고쳐야 하는 이유는?","explain":"원본 copyout 은 W = 0 이면 −1 을 돌려준다. COW 표시가 있으면 복사 후 쓰도록 고친다.","src":"위키 과제3 퀴즈 대비 Q4","wiki":"copyout과 COW","prof":true,"diff":2,"choices":["커널은 direct mapping 으로 PA 에 쓰므로 COW page 에 써도 하드웨어 page fault 가 나지 않아서","copyout 이 user mode 에서 돌아서","TLB 가 없어서","copyout 은 읽기만 해서"],"answer":0},{"id":"uac-10","type":"mc","q":"kfree 를 \"count − 1, 0 이면 free list 로\" 로 바꿀 때 freerange() 를 같이 손봐야 하는 이유는?","explain":"그래서 freerange 에서 count 를 1 로 두고 kfree 한다.","src":"위키 과제3 퀴즈 대비 Q6","wiki":"reference count","prof":true,"diff":2,"tags":["refcount"],"choices":["부팅 때 count 가 0 인 채 kfree 하면 −1 이 되어 아무 page 도 free list 에 안 들어가서","freerange 가 superpage 를 만들어서","lock 이 없어서","freerange 는 CPU1 에서 돌아서"],"answer":0},{"id":"uac-11","type":"num","q":"물리 128MB(KERNBASE 0x80000000~0x88000000), refcount 인덱스를 (pa − KERNBASE)/PGSIZE 로 하면 배열 칸 수는?","explain":"0x8000000 / 4096 = 32768. pa/PGSIZE 로 하면 557056 칸.","src":"위키 과제3 퀴즈 대비 Q12","wiki":"reference count","prof":true,"diff":2,"tags":["refcount"],"answer":32768,"unit":"칸","tol":0},{"id":"uac-12","type":"num","q":"위 방식에서 PA 0x87f41000 의 인덱스는 10진수로?","explain":"(0x87f41000 − 0x80000000) / 0x1000 = 0x7f41 = 32577.","src":"위키 과제3 퀴즈 대비 Q12","wiki":"reference count","prof":true,"diff":3,"tags":["refcount"],"answer":32577,"tol":0},{"id":"uac-13","type":"num","q":"data page frame B(rc 1) 에서 P fork → C1, C1 fork → C2 를 한 뒤 rc[B] 는?","explain":"fork 마다 공유자가 하나 늘어 1 → 2 → 3. C2 가 쓰면 새 frame 을 받고 rc[B] 는 2.","src":"위키 과제3 퀴즈 대비 Q7","wiki":"reference count","prof":true,"tags":["refcount"],"answer":3,"tol":0}]},{"id":"uad","title":"과제3 ② superpage","items":[{"id":"uad-01","type":"cloze","q":"과제 3 의 superpage: sbrk 가 ___ 이상이면 level-___ leaf megapage 로 매핑한다.","explain":"16강 Sv39: 한 단계 위 leaf = 2MB.","src":"과목 CLAUDE.md Assignment 3, 16강 p.48","wiki":"superpage","prof":true,"answer":["2 MB","1"],"bank":["2 MB","1","4 KB","1 GB","2","0"]},{"id":"uad-02","type":"num","q":"VA 0x5A1234 를 Sv39 로 볼 때 VPN[1] 은?","explain":"0x5A1234 >> 21 = 2 (0x400000 ≤ VA \u003c 0x600000). VPN[2] = 0.","src":"위키 과제3 퀴즈 대비 Q10","wiki":"superpage","prof":true,"diff":2,"answer":2,"tol":0},{"id":"uad-03","type":"mc","q":"level-1 PTE 0x21d00017 이 VA 0x5A1234 를 megapage 로 매핑할 때 PA 는?","explain":"PPN = 0x21d00017 >> 10 = 0x87400 → 0x87400000 + offset(하위 21비트) 0x1A1234 = 0x875A1234.","src":"위키 과제3 퀴즈 대비 Q10","wiki":"superpage","prof":true,"diff":3,"choices":["0x875A1234","0x87401234","0x21d01234","0x875A1000"],"answer":0},{"id":"uad-04","type":"tf","q":"level-1 megapage PTE 의 PPN[0] 이 0 이 아니면 misaligned superpage 로 page fault 다.","explain":"2MB page 는 물리 주소도 2MB 정렬이어야 한다. 16강 영상 66:01 \"the larger mapping requires virtual and physical alignment\".","src":"위키 과제3 퀴즈 대비 Q10","wiki":"superpage","prof":true,"diff":3,"answer":true},{"id":"uad-05","type":"mc","q":"superpage 를 맞게 매핑했는데 원본 walk() 를 그대로 두면 superpg_test 가 실패하는 이유는?","explain":"R/W/X 가 켜진 entry 는 leaf 다(16강 Sv39 인코딩). 원본은 2MB 데이터 안 8바이트를 PTE 로 돌려준다.","src":"위키 과제3 퀴즈 대비 Q5","wiki":"superpage","prof":true,"diff":3,"choices":["walk 가 V 만 보고 level-1 leaf 의 PPN 을 table 로 잘못 따라가서","walk 가 TLB 를 flush 해서","superpage 는 V 비트가 없어서","walk 가 level-0 를 건너뛰어서"],"answer":0},{"id":"uad-06","type":"num","q":"프로세스 크기 0x2a000 에서 sbrk(5 MB)를 부르면 2MB 정렬 superpage 로 매핑할 구간은 몇 개인가?","explain":"새 범위 [0x2a000, 0x52a000). [0x200000, 0x400000) 하나만 통째로 들어간다.","src":"위키 과제3 퀴즈 대비 Q11","wiki":"superpage","prof":true,"diff":3,"answer":1,"unit":"개","tol":0},{"id":"uad-07","type":"num","q":"위 sbrk(5 MB) 에서 superpage 앞쪽을 4KB page 로 매핑할 장수는?","explain":"(0x200000 − 0x2a000) / 0x1000 = 0x1d6 = 470장. 뒤쪽은 (0x52a000 − 0x400000)/0x1000 = 298장.","src":"위키 과제3 퀴즈 대비 Q11","wiki":"superpage","prof":true,"diff":3,"answer":470,"unit":"장","tol":0},{"id":"uad-08","type":"num","q":"superpage 가 있는 부모가 fork 2번, 자식 둘이 각각 superpage 에 쓰고 마지막에 부모도 쓴다. 2MB COW + \"count 1 이면 복사 생략\" 설계에서 필요한 superpage 총수(원래 것 포함)는?","explain":"fork 때 0, 자식1 쓰기 +1(count 3→2), 자식2 쓰기 +1(2→1), 부모는 count 1 이라 복사 없음 → 3개. 최적화가 없으면 4개.","src":"위키 과제3 퀴즈 대비 Q15","wiki":"COW와 superpage","prof":true,"diff":3,"answer":3,"unit":"개","tol":0},{"id":"uad-09","type":"tf","q":"page 가 4KB 이고 PTE 가 8B 라서 page table 한 장에 512 entry 가 들어가고, 그래서 megapage 는 4KB × 512 = 2MB 다.","explain":"11/9 교수님 16강 복습과 같은 계산.","src":"11/9 녹음","wiki":"superpage","prof":true,"diff":1,"answer":true},{"id":"uad-10","type":"mc","q":"copyout 이 −1 을 돌려줘야 하는 조건이 아닌 것은?","explain":"COW 표시가 있으면 −1 대신 복사 후 쓴다. W = 0 이고 COW 도 없으면(text) −1.","src":"위키 과제3 퀴즈 대비 Q14","wiki":"copyout과 COW","prof":true,"diff":2,"choices":["PTE 에 COW 표시가 있음","va0 ≥ MAXVA","PTE 가 없거나 V = 0","U = 0 (TRAPFRAME, TRAMPOLINE)"],"answer":0},{"id":"uad-11","type":"cloze","q":"COW 와 관계있는 trap 은 scause ___ (store page fault)이고, 시스템 콜 ecall 은 scause ___ 이다.","explain":"13 load page fault 는 공유 page 에서 그냥 읽히므로 COW 와 관계없다.","src":"위키 scause","wiki":"scause","prof":true,"answer":["15","8"],"bank":["15","8","13","12","2"]},{"id":"uad-12","type":"tf","q":"COW 로 공유 중인 page 를 읽기만 해도 page fault 가 나서 복사가 일어난다.","explain":"공유 page 는 R 이 켜져 있어 읽기는 그냥 된다. 쓰기(store, scause 15)에서만 fault 가 나고 복사한다.","src":"위키 scause","wiki":"COW fork","prof":true,"answer":false}]}]}]}]</script>
<script>

(function (root) {

  var TYPES = ['mc', 'tf', 'cloze', 'match', 'order', 'sa', 'num'];
  var TYPE_KO = { mc: '객관식', tf: 'O/X', cloze: '빈칸', match: '짝 맞추기', order: '순서', sa: '단답', num: '계산' };
  var MIN = 60e3, DAY = 864e5;

  /* ---------- dates (Asia/Seoul) ---------- */
  var dfmt = null;
  function dateKey(ms) {
    try {
      if (!dfmt) dfmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
      return dfmt.format(new Date(ms));

      var d = new Date(ms + 9 * 3600e3);
      return d.toISOString().slice(0, 10);
    }
  }
  function shiftDay(key, delta) {
    var d = new Date(key + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + delta);
    return d.toISOString().slice(0, 10);
  }
  /** streak = consecutive days with lessons>0 ending today (or yesterday if today not yet done). */
  function calcStreak(days, today) {
    days = days || {};

    if (!(days[k] && days[k].lessons > 0)) k = shiftDay(k, -1);
    while (days[k] && days[k].lessons > 0) { n++; k = shiftDay(k, -1); }
    return n;
  }

  /* ---------- grading ---------- */
  function normSA(s) {
