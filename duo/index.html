지 않는다.","src":"위키 symbolic link","wiki":"symbolic link","diff":2,"tags":["link"],"answer":false,"introCard":0},{"id":"u19d-11","type":"mc","q":"echo hello > file, ln file file2, ln -s file file3, rm file 후 결과는?","explain":"file2 는 같은 inode(Links 2 → 1, 살아 있음). file3 는 이름 file 을 찾아가는데 이름이 없다 — dangling.","src":"위키 symbolic link","wiki":"symbolic link","diff":3,"tags":["link"],"choices":["cat file2 → hello, cat file3 → No such file","둘 다 hello","둘 다 오류","cat file2 → 오류, cat file3 → hello"],"answer":0,"introCard":1},{"id":"u19d-12","type":"num","q":"echo hello > file, ln file file2, ln -s file file3 직후 inode 는 몇 개인가?","explain":"원래 파일 하나(Links 2: file, file2)와 symlink 하나.","src":"위키 symbolic link","wiki":"symbolic link","diff":2,"answer":2,"unit":"개","tol":0,"introCard":1},{"id":"u19d-13","type":"match","q":"hard link 와 symbolic link 비교","explain":"p.32~40.","src":"19강 p.32~40","wiki":"symbolic link","tags":["link"],"pairs":[["hard link","같은 inode 를 가리키는 이름, 파티션 못 넘음"],["symbolic link","경로를 담은 별도 파일, 파티션을 넘을 수 있음"],["dangling reference","원본을 지워 아무것도 안 가리키는 symlink"],["reference count","inode 에 붙은 이름 수"]],"introCard":0},{"id":"u19d-14","type":"num","q":"echo hello > file, ln file file2, ln file2 file3 를 한 직후 stat file 이 보여 주는 Links(가려짐)는?","explain":"file · file2 · file3 세 이름이 같은 inode 67158084 를 가리킨다. 이어서 rm file → 2, rm file2 → 1, rm file3 → 0 이 되면 inode 와 데이터 블록이 해제된다.","src":"19강 p.35~36","wiki":"hard link","tags":["link"],"img":"img/os19-p36-unlink.png","imgAlt":"p.36 link 와 unlink 에 따른 stat 출력 — Links 값과 주석이 가려져 있다","explainImg":"img/os19-p36-unlink-ans.png","answer":3,"tol":0,"introCard":0},{"id":"u19d-15","type":"num","q":"ln -s alongerfilename file3 로 만든 file3 의 크기(가려짐)는 몇 바이트인가?","explain":"symbolic link 의 데이터는 링크한 파일의 pathname 이다. \"alongerfilename\" 은 15글자 → 15바이트. 경로가 길수록 symlink 가 커진다.","src":"19강 p.39","wiki":"symbolic link","tags":["link"],"img":"img/os19-p39-symsize.png","imgAlt":"p.39 ls -al alongerfilename file3 — file3 크기가 가려져 있다","explainImg":"img/os19-p39-symsize-ans.png","answer":15,"unit":"B","tol":0,"introCard":1},{"id":"u19d-16","type":"sa","q":"[용어] 원본 파일을 지운 뒤 symbolic link 가 아무것도 가리키지 않는 상태. (2 words, d… r…)","explain":"p.40. symlink 는 이름(pathname)을 담고 있어서 이름이 사라지면 찾아갈 곳이 없다. hard link 에는 이런 일이 없다 — inode 를 직접 가리키므로.","src":"19강 p.40","wiki":"symbolic link","tags":["link"],"answer":"dangling reference","alts":["dangling link","dangling pointer"],"introCard":1},{"id":"u19d-17","type":"num","q":"[규칙 적용] echo hi > a, ln a b, ln -s a c, rm a 를 차례로 한 뒤 b 가 가리키는 inode 의 Links 는?","explain":"a 생성 1 → ln a b 2 → ln -s 는 원본 Links 를 바꾸지 않음 2 → rm a 1. cat b 는 hi, cat c 는 \"No such file\" (dangling).","src":"19강 p.35~40 규칙 적용","wiki":"hard link","diff":2,"tags":["link"],"answer":1,"tol":0,"introCard":0}],"intro":[{"title":"hard link","body":"link(old, new) / `ln file file2`: 디렉터리에 새 이름을 만들어 **같은 inode number** 를 가리키게 한다 — 파일은 복사되지 않고 두 이름은 차이가 없다. inode 의 **reference count(link count)** 가 1 오르고, unlink() 가 1 줄이며 0 이 되면 inode 와 데이터 block 을 해제한다(진짜 delete). inode 번호는 파일 시스템 안에서만 유일해 파티션을 못 넘는다.","img":"img/os19-p33-hardlink-ans.png","imgAlt":"ln file file2: 두 엔트리가 inode 12345 를 가리키고 link count 2","src":"19강 p.32~37"},{"title":"symbolic link","body":"`ln -s`: 링크한 파일의 **pathname** 을 데이터로 담는 별도 파일(새 inode, 원본 link count 그대로). 크기 = 경로 길이(\"file\" → 4B, \"alongerfilename\" → 15B). 파티션을 넘을 수 있지만, 원본 이름을 지우면 가리킬 곳이 없는 **dangling reference** 가 된다.","img":"img/os19-p39-symsize-ans.png","imgAlt":"ls -al: file3 -> alongerfilename, 크기 15","src":"19강 p.37~40"},{"title":"link 수 손으로 세기","body":"이름 생성(echo > a) 1 → ln 으로 이름 추가 +1 → rm(unlink) −1 → ln -s 는 원본 inode 를 건드리지 않음 → mv(같은 FS 안)는 rename 이라 변화 없음. 마지막 Links 가 0 이 되는 순간 inode 와 데이터가 해제된다. 남은 symlink 는 dangling.","img":"img/os19-p36-unlink-ans.png","imgAlt":"link 와 unlink 에 따른 stat 의 Links 변화","src":"19강 p.35~36"}]}]},{"id":"u20","title":"20강 File System Implementation","desc":"on-disk 구조 · inode 위치 계산 · multi-level index · 접근 경로 I/O · 캐싱","lessons":[{"id":"u20a","title":"On-disk 구조","items":[{"id":"u20a-01","type":"match","q":"파일 시스템을 구현할 때 생각할 두 측면을 연결하시오","explain":"p.2 The Way To Think 와 p.6~8.","src":"20강 p.2, p.6~8","wiki":"vsfs 디스크 배치","tags":["FS 구조"],"pairs":[["Data structures","어떤 on-disk 구조로 데이터와 metadata 를 정리하나"],["Access methods","open/read/write 호출이 어떤 구조를 읽고 쓰나"],["Superblock","파일 시스템 전체 정보 (inode 수, inode table 시작 위치)"],["Bitmap","각 inode·data block 의 free(0)/in-use(1)"]],"introCard":0},{"id":"u20a-02","type":"num","q":"block 이 4KB 이고 sector 가 512B 면 block 하나는 sector 몇 개인가?","explain":"p.3 \"4 KB = eight 512-byte sectors\". 4096 / 512 = 8.","src":"20강 p.3","wiki":"vsfs 디스크 배치","diff":1,"answer":8,"unit":"개","tol":0,"introCard":0},{"id":"u20a-03","type":"num","q":"inode 크기 256B, block 4KB 일 때 block 하나에 inode 가 몇 개 들어가나?","explain":"4096 / 256 = 16 (p.5).","src":"20강 p.5","wiki":"vsfs 디스크 배치","tags":["inode"],"answer":16,"unit":"개","tol":0,"introCard":0},{"id":"u20a-04","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. 파일 시스템의 inode 는 최대 몇 개인가?","explain":"inode table 이 block 3~7 로 5블록 × 16 = 80 (p.5, 디렉터리 포함).","src":"20강 p.5","wiki":"vsfs 디스크 배치","tags":["inode"],"img":"img/os20-p05-itable.png","imgAlt":"p.5 64블록 디스크 — block 3~7 이 Inodes, 8~63 이 Data Region","answer":80,"unit":"개","tol":0,"introCard":0},{"id":"u20a-05","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. data region 은 몇 블록인가?","explain":"block 8~63 → 64 − 8 = 56블록. 앞 8블록이 S, i, d, inode table 5블록.","src":"20강 p.4~8","wiki":"vsfs 디스크 배치","diff":2,"answer":56,"unit":"블록","tol":0,"img":"img/os20-gen-u20a-05.png","imgAlt":"64블록 디스크: block 0 superblock, 1 inode bitmap, 2 data bitmap, 3~7 inode table(12KB~), 이후 data","introCard":0},{"id":"u20a-06","type":"order","q":"그림의 디스크 앞쪽 배치 순서","explain":"block 0 = S, 1 = i, 2 = d, 3~7 = I, 8~63 = D.","src":"20강 p.8","wiki":"vsfs 디스크 배치","tags":["FS 구조"],"img":"img/os20-p08-layout.png","imgAlt":"p.8 디스크 배치 — block 0~7 의 내용이 가려져 있다","explainImg":"img/os20-p08-layout-ans.png","answer":["Superblock (S)","Inode bitmap (i)","Data bitmap (d)","Inode table (I)","Data region (D)"],"introCard":0},{"id":"u20a-07","type":"tf","q":"파일 시스템을 mount 할 때 OS 는 superblock 을 먼저 읽어 여러 정보를 초기화한다.","explain":"p.8 \"When mounting a file system, OS will read the superblock first\".","src":"20강 p.8","wiki":"vsfs 디스크 배치","answer":true,"introCard":0},{"id":"u20a-08","type":"tf","q":"bitmap 에서 1 은 free, 0 은 in-use 를 뜻한다.","explain":"p.6: 각 bit 는 free (0) 또는 in-use (1).","src":"20강 p.6","wiki":"vsfs 디스크 배치","diff":1,"answer":false,"introCard":0},{"id":"u20a-09","type":"sa","q":"파일을 만들 때 inode 하나를 할당하려고 보는 구조는? (영어 두 단어)","explain":"p.7 \"Creating a file allocates an inode using the inode bitmap. Allocating a data block also updates the data bitmap.\"","src":"20강 p.7","wiki":"vsfs 디스크 배치","answer":"inode bitmap","alts":["i-bmap","inode bmap"],"introCard":2},{"id":"u20a-10","type":"cloze","q":"연속 블록을 미리 잡아 두는 ___ 정책을 흔히 쓰며, EXT4 의 ___ 가 그 예다.","explain":"p.7 \"Pre-allocation policy is commonly used for allocate contiguous blocks — e.g., extents in EXT4\".","src":"20강 p.7","wiki":"extent","answer":["pre-allocation","extents"],"bank":["pre-allocation","extents","demand paging","cylinder group","journaling"],"introCard":2},{"id":"u20a-11","type":"mc","q":"inode 에 저장되지 않는 것은?","explain":"p.10: type, size, data block index, protection, time. 이름은 디렉터리 엔트리에 있다(19강).","src":"20강 p.10","wiki":"vsfs 디스크 배치","tags":["inode"],"choices":["파일 이름","파일 크기","data block 위치(index)","접근·수정·상태 변경 시간"],"answer":0,"introCard":1},{"id":"u20a-12","type":"match","q":"ext2 inode 필드와 뜻을 연결하시오","explain":"p.11 The EXT2 Inode 표.","src":"20강 p.11 · 🎙 11/23 수업","wiki":"ext2 inode","prof":true,"diff":2,"img":"img/os20-p11-ext2.png","imgAlt":"p.11 The EXT2 Inode 표 — 필드 설명 열이 가려져 있다","explainImg":"img/os20-p11-ext2-ans.png","pairs":[["links_count","hard link 수"],["blocks","할당된 512-byte 단위 수"],["block (60B)","disk pointer 15개"],["dtime","inode 가 삭제된 시간"]],"introCard":1},{"id":"u20a-13","type":"num","q":"ext2 inode 의 block 필드는 60바이트에 disk pointer 15개를 담는다. pointer 하나는 몇 바이트인가?","explain":"60 / 15 = 4B.","src":"20강 p.11 · 🎙 11/23 수업","wiki":"ext2 inode","prof":true,"diff":1,"answer":4,"unit":"B","tol":0,"img":"img/os20-p11-ext2.png","imgAlt":"The EXT2 Inode 필드 표(Size·Name) — 설명 열은 가려져 있다","introCard":1},{"id":"u20a-14","type":"sa","q":"[용어] Contains the information for a particular file system, e.g., the number of inodes and the begin location of the inode table; read first when mounting. (1 word, s…)","explain":"p.8. block 0 에 있다. mount 때 이것부터 읽어야 inode table 이 어디서 시작하는지 알고, 그래야 inode 번호로 위치를 계산할 수 있다(p.9).","src":"20강 p.8","wiki":"vsfs 디스크 배치","tags":["FS 구조"],"answer":"superblock","alts":["super block"],"introCard":0}],"intro":[{"title":"vsfs 디스크 배치","body":"디스크를 4KB **block** 으로 나눈다(sector 512B 8개). 예: 64블록 — block 0 **superblock**(inode 수, inode table 시작 위치; mount 때 먼저 읽음), 1 **inode bitmap**, 2 **data bitmap**(각 bit 0 free / 1 in-use), 3~7 **inode table**, 8~63 **data region**(56블록). inode 256B 면 block 하나에 16개 → 80개.","img":"img/os20-p08-layout-ans.png","imgAlt":"64블록 디스크: S, i, d, inode table 5블록, data region","src":"20강 p.3~8"},{"title":"inode","body":"inode = 파일의 metadata: type, size, data block 의 위치(index), protection, 시간(atime·mtime·ctime·dtime). 이름은 없다(디렉터리 엔트리에). ext2 inode: links_count(hard link 수), blocks(512B 단위 수), block(60B = disk pointer 15개 × 4B).","img":"img/os20-p11-ext2-ans.png","imgAlt":"The EXT2 Inode 필드 표","src":"20강 p.10~11"},{"title":"할당과 pre-allocation","body":"파일을 만들면 inode bitmap 으로 inode 하나를, block 을 할당하면 data bitmap 을 갱신한다. 연속 block 을 미리 잡는 **pre-allocation** 정책을 흔히 쓰며 ext4 의 **extents** 가 예다.","src":"20강 p.7"}]},{"id":"u20b","title":"inode 위치 손으로 계산","items":[{"id":"u20b-01","type":"cloze","q":"inode 번호로 sector 찾기: inodeRegion = inumber × ___ , 그 값에 inode table ___ 를 더하고, ___ 로 나눈다.","explain":"p.9: sector = (inodeStartAddr + inumber × sizeof(inode)) / sectorSize.","src":"20강 p.9","wiki":"inode 주소 계산","tags":["inode 계산"],"answer":["sizeof(inode)","시작 주소","sector 크기"],"bank":["sizeof(inode)","시작 주소","sector 크기","block 크기","PFN","superblock"],"introCard":0},{"id":"u20b-02","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 32 의 inodeRegion(바이트 offset)은?","explain":"32 × 256 = 8192 (p.9).","src":"20강 p.9 · 🎙 11/23 수업","wiki":"inode 주소 계산","prof":true,"tags":["inode 계산"],"img":"img/os20-p09-inode32.png","imgAlt":"p.9 inode 32 의 위치 계산 — 세 결과가 가려져 있다","explainImg":"img/os20-p09-inode32-ans.png","answer":8192,"unit":"B","tol":0,"introCard":0},{"id":"u20b-03","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 32 가 있는 sector 번호는?","explain":"(12288 + 8192) / 512 = 20480 / 512 = 40. 주소로는 20KB (p.9).","src":"20강 p.9 · 🎙 11/23 수업","wiki":"inode 주소 계산","prof":true,"tags":["inode 계산"],"img":"img/os20-p09-inode32.png","imgAlt":"p.9 inode 32 의 위치 계산 — 세 결과가 가려져 있다","explainImg":"img/os20-p09-inode32-ans.png","answer":40,"tol":0,"introCard":0},{"id":"u20b-04","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 0 이 있는 sector 번호는?","explain":"(12288 + 0) / 512 = 24. inode table 의 첫 sector.","src":"20강 p.9 규칙 적용","wiki":"inode 주소 계산","tags":["inode 계산"],"answer":24,"tol":0,"img":"img/os20-gen-u20b-04.png","imgAlt":"64블록 디스크: block 0 superblock, 1 inode bitmap, 2 data bitmap, 3~7 inode table(12KB~), 이후 data","introCard":0},{"id":"u20b-05","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 20 이 있는 sector 번호는?","explain":"20 × 256 = 5120, (12288 + 5120) / 512 = 17408 / 512 = 34.","src":"20강 p.9 규칙 적용","wiki":"inode 주소 계산","tags":["inode 계산"],"answer":34,"tol":0,"img":"img/os20-gen-u20b-04.png","imgAlt":"64블록 디스크: block 0 superblock, 1 inode bitmap, 2 data bitmap, 3~7 inode table(12KB~), 이후 data","introCard":0},{"id":"u20b-06","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 15 가 있는 sector 번호는? (나머지는 버림)","explain":"15 × 256 = 3840, (12288 + 3840) / 512 = 31.5 → sector 31 의 뒤쪽 절반. sector 하나에 inode 2개.","src":"20강 p.9 규칙 적용 · 🎙 11/23 수업","wiki":"inode 주소 계산","prof":true,"diff":2,"tags":["inode 계산"],"answer":31,"tol":0,"img":"img/os20-gen-u20b-04.png","imgAlt":"64블록 디스크: block 0 superblock, 1 inode bitmap, 2 data bitmap, 3~7 inode table(12KB~), 이후 data","introCard":0},{"id":"u20b-07","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 50 이 들어 있는 block 번호는?","explain":"block 하나에 16개 → 50 / 16 = 3 (몫), inode table 시작 block 3 + 3 = 6.","src":"20강 p.5, p.9 규칙 적용 · 🎙 11/23 수업","wiki":"inode 주소 계산","prof":true,"diff":2,"tags":["inode 계산"],"answer":6,"tol":0,"img":"img/os20-gen-u20b-04.png","imgAlt":"64블록 디스크: block 0 superblock, 1 inode bitmap, 2 data bitmap, 3~7 inode table(12KB~), 이후 data","introCard":0},{"id":"u20b-08","type":"num","q":"디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 79(마지막 inode)가 있는 sector 번호는?","explain":"79 × 256 = 20224, (12288 + 20224) / 512 = 63.5 → sector 63. block 7 의 마지막 sector 다.","src":"20강 p.9 규칙 적용","wiki":"inode 주소 계산","diff":3,"tags":["inode 계산"],"answer":63,"tol":0,"img":"img/os20-gen-u20b-04.png","imgAlt":"64블록 디스크: block 0 superblock, 1 inode bitmap, 2 data bitmap, 3~7 inode table(12KB~), 이후 data","introCard":0},{"id":"u20b-09","type":"num","q":"inode table 시작 16KB, inode 128B, sector 512B 일 때 inode 100 의 sector 번호는?","explain":"100 × 128 = 12800, (16384 + 12800) / 512 = 29184 / 512 = 57.","src":"20강 p.9 규칙 적용","wiki":"inode 주소 계산","diff":3,"tags":["inode 계산"],"answer":57,"tol":0,"img":"img/os20-gen-u20b-09.png","imgAlt":"inode table 이 16KB 에서 시작, inode 128B, sector 512B","introCard":0},{"id":"u20b-10","type":"num","q":"sector 512B, inode 256B 이면 sector 하나에 inode 가 몇 개 들어가나?","explain":"512 / 256 = 2. 디스크는 sector 단위로 읽으니 inode 하나 읽어도 sector 하나를 읽는다.","src":"20강 p.9","wiki":"inode 주소 계산","diff":1,"answer":2,"unit":"개","tol":0,"introCard":0},{"id":"u20b-11","type":"tf","q":"파일 시스템은 inode 번호만 있으면 계산만으로 그 inode 의 디스크 위치를 안다.","explain":"p.9 \"By an inode number, the file system calculates where an inode is on the disk\". inode table 이 고정 크기 배열이라서.","src":"20강 p.9","wiki":"inode 주소 계산","answer":true,"introCard":0},{"id":"u20b-12","type":"num","q":"디렉터리 엔트리 이름 \"foobar\" 의 \"Bytes incl. NUL\" 값은?","explain":"6글자 + NUL 1 = 7 (p.18 표).","src":"20강 p.18","wiki":"inode 주소 계산","diff":1,"img":"img/os20-p18-dirdata.png","imgAlt":"p.18 디렉터리 dir 의 on-disk data — Bytes incl. NUL 열 일부가 가려져 있다","explainImg":"img/os20-p18-dirdata-ans.png","answer":7,"unit":"B","tol":0,"introCard":2},{"id":"u20b-13","type":"mc","q":"디렉터리 dir 의 on-disk data 가 (5, .), (2, ..), (12, foo), (13, bar), (24, foobar) 이다. .. 의 inode 번호 2 가 뜻하는 것은?","explain":". 은 자기(5), .. 는 부모. 예에서 root 의 inode 번호가 2 다(p.19).","src":"20강 p.18~19","wiki":"inode 주소 계산","diff":2,"choices":["부모 디렉터리(여기선 root)의 inode","dir 자신","첫 번째 파일 foo","빈 엔트리"],"answer":0,"img":"img/os20-p18-dirdata-ans.png","imgAlt":"디렉터리 dir 의 on-disk data 표: 5 ., 2 .., 12 foo, 13 bar, 24 foobar","introCard":2},{"id":"u20b-14","type":"num","q":"[규칙 적용] 디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 45 가 있는 sector 번호는? (나머지는 버림)","explain":"45 × 256 = 11520, (12288 + 11520) / 512 = 23808 / 512 = 46.5 → sector 46 의 뒤쪽 절반. p.9 의 세 단계(inodeRegion → + inodeStartAddr → / sectorSize)를 그대로 따른다.","src":"20강 p.9 규칙 적용","wiki":"inode 주소 계산","diff":2,"tags":["inode 계산"],"answer":46,"tol":0,"img":"img/os20-gen-u20b-04.png","imgAlt":"64블록 디스크: block 0 superblock, 1 inode bitmap, 2 data bitmap, 3~7 inode table(12KB~), 이후 data","introCard":0},{"id":"u20b-15","type":"num","q":"[규칙 적용] 디스크 64블록(4KB), 0 = superblock, 1 = inode bitmap, 2 = data bitmap, 3~7 = inode table(시작 12KB), inode 256B, sector 512B. inode 45 는 몇 번 block(4KB)에 있는가?","explain":"block 하나에 inode 16개. 45 / 16 = 2 (몫) → inode table 의 세 번째 block(iblock 2) = 디스크 block 3 + 2 = 5. 바이트로 보면 (12288 + 11520) / 4096 = 5.8 → 5.","src":"20강 p.5, p.9 규칙 적용","wiki":"inode 주소 계산","diff":2,"tags":["inode 계산"],"answer":5,"tol":0,"img":"img/os20-gen-u20b-04.png","imgAlt":"64블록 디스크: block 0 superblock, 1 inode bitmap, 2 data bitmap, 3~7 inode table(12KB~), 이후 data","introCard":0}],"intro":[{"title":"inode 위치 공식","body":"inode table 이 고정 크기 배열이라 번호만으로 위치를 계산한다. inodeRegion = inumber × sizeof(inode), 주소 = inodeStartAddr + inodeRegion, **sector = 주소 / 512**(나머지 버림). 예: 시작 12KB(12288), inode 256B, inode 32 → 8192 → 20480 = 20KB → sector 40. block 번호 = 시작 block + inumber / 16(4KB block).","img":"img/os20-p09-inode32-ans.png","imgAlt":"inode 32 의 위치: 8192, 20KB, sector 40","src":"20강 p.9"},{"title":"sector 와 inode","body":"sector 512B 에 inode 256B 가 2개 → 디스크는 sector 단위로 읽으니 inode 하나 읽어도 sector 하나를 읽는다. 31.5 처럼 나오면 sector 31 의 뒤쪽 절반.","src":"20강 p.9"},{"title":"디렉터리 data","body":"디렉터리 data = (inode number, record 길이, 이름 길이 incl. NUL, 이름) 목록. \"foobar\" 는 6 + NUL = 7. . 은 자기, .. 는 부모 — root 의 inode 번호는 보통 2.","img":"img/os20-p18-dirdata-ans.png","imgAlt":"디렉터리 dir 의 on-disk data: 5 ., 2 .., 12 foo, 13 bar, 24 foobar","src":"20강 p.18~19"}]},{"id":"u20c","title":"Multi-level index 와 최대 파일 크기","items":[{"id":"u20c-01","type":"num","q":"direct pointer 13개만 있는 single-level index, block 4KB 일 때 최대 파일 크기는 몇 KB 인가?","explain":"13 × 4KB = 52KB (p.13).","src":"20강 p.13","wiki":"multi-level index","tags":["index"],"answer":52,"unit":"KB","tol":0,"introCard":0},{"id":"u20c-02","type":"num","q":"block 4KB, pointer 4B 일 때 indirect block 하나에 들어가는 pointer 수는?","explain":"4096 / 4 = 1024.","src":"20강 p.14","wiki":"multi-level index","tags":["index"],"answer":1024,"unit":"개","tol":0,"introCard":1},{"id":"u20c-03","type":"num","q":"direct 12개 + single indirect 1개, block 4KB, pointer 4B 일 때 최대 파일 크기는 몇 KB 인가?","explain":"(12 + 1024) × 4KB = 4144KB (p.14).","src":"20강 p.14","wiki":"multi-level index","tags":["index"],"img":"img/os20-p14-indirect.png","imgAlt":"p.14 indirect pointer 그림 — 용량 계산 줄이 가려져 있다","explainImg":"img/os20-p14-indirect-ans.png","answer":4144,"unit":"KB","tol":0,"introCard":1},{"id":"u20c-04","type":"num","q":"double indirect pointer 하나가 추가로 가리키는 data block 수는?","explain":"1024 × 1024 = 1,048,576 (p.15). 용량 4GB.","src":"20강 p.15","wiki":"multi-level index","tags":["index"],"img":"img/os20-p15-double.png","imgAlt":"p.15 double indirect pointer 그림 — 블록 수와 용량 줄이 가려져 있다","explainImg":"img/os20-p15-double-ans.png","answer":1048576,"unit":"개","tol":0,"introCard":1},{"id":"u20c-05","type":"num","q":"double indirect pointer 하나가 덮는 용량은 몇 GB 인가? (block 4KB, pointer 4B)","explain":"$1024^2$ × 4KB = $2^{20}$ × $2^{12}$ = $2^{32}$ B = 4GB.","src":"20강 p.15","wiki":"multi-level index","tags":["index"],"answer":4,"unit":"GB","tol":0,"introCard":1},{"id":"u20c-06","type":"num","q":"direct 12 + single + double indirect, block 4KB 일 때 최대 data block 수는?","explain":"12 + 1024 + 1024² = 12 + 1024 + 1,048,576 = 1,049,612 → 용량은 4GB 를 조금 넘는다 (p.16).","src":"20강 p.16","wiki":"multi-level index","diff":2,"tags":["index"],"answer":1049612,"unit":"개","tol":0,"introCard":0},{"id":"u20c-07","type":"num","q":"triple indirect pointer 하나가 덮는 용량은 몇 TB 인가? (block 4KB, pointer 4B)","explain":"$1024^3$ × 4KB = $2^{30}$ × $2^{12}$ = $2^{42}$ B = 4TB. 슬라이드 p.13 이 언급한 triple indirect 에 같은 규칙 적용.","src":"20강 p.13·15 규칙 적용","wiki":"multi-level index","diff":3,"tags":["index"],"answer":4,"unit":"TB","tol":0,"introCard":1},{"id":"u20c-08","type":"num","q":"block 1KB, pointer 4B, direct 12개 + single indirect 1개면 최대 파일 크기는 몇 KB 인가?","explain":"indirect block 하나에 1024/4 = 256 pointer → (12 + 256) × 1KB = 268KB.","src":"20강 p.14 규칙 적용","wiki":"multi-level index","diff":3,"tags":["index"],"answer":268,"unit":"KB","tol":0,"introCard":1},{"id":"u20c-09","type":"mc","q":"direct 12 + single indirect + double indirect (4KB, 4B) 에서 파일의 block 번호 500 은 어느 pointer 로 찾나?","explain":"direct 는 0~11, single indirect 는 12~1035 (12 + 1024 − 1). 500 은 그 안.","src":"20강 p.14~16 적용","wiki":"multi-level index","diff":2,"tags":["index"],"choices":["single indirect","direct","double indirect","triple indirect"],"answer":0,"introCard":2},{"id":"u20c-10","type":"mc","q":"direct 12 + single indirect + double indirect (block 4KB, pointer 4B) 구조에서 파일의 block 번호 2000 은 어느 pointer 로 찾나?","explain":"single indirect 는 1035 까지다. 1036 부터 double indirect.","src":"20강 p.14~16 적용","wiki":"multi-level index","diff":2,"tags":["index"],"choices":["double indirect","single indirect","direct","찾을 수 없음"],"answer":0,"introCard":1},{"id":"u20c-11","type":"num","q":"inode 는 이미 메모리에 있고 index block 은 캐시에 없다. double indirect 로 가는 data block 하나를 읽는 데 디스크 read 는 몇 번인가?","explain":"double indirect block 1 + indirect block 1 + data 1 = 3. p.15 \"Uncached index blocks require extra disk reads.\"","src":"20강 p.15","wiki":"multi-level index","diff":3,"tags":["index","I/O 수"],"answer":3,"unit":"번","tol":0,"introCard":2},{"id":"u20c-12","type":"tf","q":"multi-level index 의 indirect block 은 파일이 충분히 커질 때 할당된다.","explain":"p.14 \"If a file grows large enough, an indirect block is allocated, inode's slot for an indirect pointer is set to point to it.\"","src":"20강 p.14","wiki":"multi-level index","answer":true,"introCard":0},{"id":"u20c-13","type":"cloze","q":"indirect pointer 는 data 가 아니라 ___ 들을 담은 block 을 가리키고, double indirect pointer 는 ___ block 의 pointer 를 담은 block 을 가리킨다.","explain":"p.14~15.","src":"20강 p.14~15","wiki":"multi-level index","tags":["index"],"answer":["pointer","indirect"],"bank":["pointer","indirect","inode","bitmap","superblock"],"introCard":1},{"id":"u20c-14","type":"cloze","q":"Multi-Level Index 그림: 초록 화살표 ① ___, 빨간 block 72 를 거치는 ② ___, 파란 block 3942 → 104 를 거치는 ③ ___","explain":"inode 의 12칸은 data block 을 바로 가리키고(direct), 72 는 pointer 1024개를 담은 indirect block, 3942 는 indirect block 들의 pointer 를 담은 double indirect block 이다. 그래서 block 1034 를 읽으려면 3942 → 104 → 1034 로 두 번 더 디스크를 읽는다.","src":"20강 p.16~17","wiki":"multi-level index","tags":["index"],"img":"img/os20-p17-multilevel.png","imgAlt":"p.17 multi-level index 그림 — 세 종류 block 이름이 ①②③으로 가려져 있다","explainImg":"img/os20-p17-multilevel-ans.png","answer":["Direct Blocks","Indirect Blocks","Double Indirect Blocks"],"bank":["Direct Blocks","Indirect Blocks","Double Indirect Blocks","Triple Indirect Blocks","Bitmap Blocks"],"introCard":2},{"id":"u20c-15","type":"num","q":"[규칙 적용] block 1KB, pointer 4B, direct 12 + single indirect 1 + double indirect 1 이면 최대 파일 크기는 몇 KB 인가?","explain":"indirect block 하나에 1024/4 = 256 pointer. (12 + 256 + 256²) × 1KB = (12 + 256 + 65536) KB = 65804 KB (약 64MB). block 이 작으면 pointer 수가 제곱으로 줄어 최대 크기가 크게 준다.","src":"20강 p.14~16 규칙 적용","wiki":"multi-level index","diff":3,"tags":["index"],"answer":65804,"unit":"KB","tol":0,"introCard":1},{"id":"u20c-16","type":"sa","q":"[용어] Points to a block that contains more pointers (not data). (2 words, i… p…)","explain":"p.14 정의. 한 단계 더 가면 double indirect pointer — \"points to a block of indirect-block pointers\"(p.15).","src":"20강 p.14","wiki":"multi-level index","tags":["index"],"answer":"indirect pointer","introCard":1}],"intro":[{"title":"single-level index","body":"inode 에 data block 을 바로 가리키는 **direct pointer** 고정 개수. 13개 × 4KB = 52KB 가 한계.","src":"20강 p.12~13"},{"title":"indirect pointer","body":"**indirect pointer** = data 가 아니라 pointer 들을 담은 block 을 가리킴. 4KB block, pointer 4B → 1024개. direct 12 + single indirect 1 → (12 + 1024) × 4KB = 4144KB. 파일이 커질 때 indirect block 을 할당한다. block 1KB 면 indirect 하나에 256 pointer.","img":"img/os20-p14-indirect-ans.png","imgAlt":"indirect pointer: block 72 안에 pointer 100, 101, 102…","src":"20강 p.14"},{"title":"double · triple indirect","body":"**double indirect** = indirect block 들의 pointer 를 담은 block → 1024² = 1,048,576 block = 4GB. triple 은 1024³ × 4KB = 4TB. block 번호 구간: direct 0~11, single 12~1035, double 1036~. 캐시가 없으면 double 경로 data 하나에 디스크 read 3번(double block, indirect block, data).","img":"img/os20-p17-multilevel-ans.png","imgAlt":"multi-level index: Direct Blocks, Indirect Blocks(72), Double Indirect Blocks(3942 → 104)","src":"20강 p.15~17"}]},{"id":"u20d","title":"접근 경로의 I/O 수와 캐싱","items":[{"id":"u20d-01","type":"order","q":"open(\"/foo/bar\", O_RDONLY) 에서 디스크를 읽는 순서","explain":"p.19~21: root 부터 경로를 따라 inode → data 를 번갈아 읽고 bar 의 inode 를 찾으면 권한 검사 후 fd 를 돌려준다.","src":"20강 p.19~21","wiki":"파일 접근 경로","tags":["I/O 수"],"answer":["root inode (2번)","root data","foo inode","foo data","bar inode"],"introCard":0},{"id":"u20d-02","type":"num","q":"open(\"/foo/bar\") (각 디렉터리 data 는 block 하나, 캐시 없음) 의 디스크 read 는 몇 번인가?","explain":"root inode, root data, foo inode, foo data, bar inode = 5 (p.21 timeline).","src":"20강 p.21","wiki":"파일 접근 경로","tags":["I/O 수"],"answer":5,"unit":"번","tol":0,"introCard":0},{"id":"u20d-03","type":"num","q":"이미 연 bar 에서 read() 한 번(block 하나)이 일으키는 I/O 는 몇 번인가? (atime 갱신 포함)","explain":"bar inode read → data read → bar inode write(last-access time) = 3 (p.20~21).","src":"20강 p.20~21","wiki":"파일 접근 경로","diff":2,"tags":["I/O 수"],"img":"img/os20-p21-readtl.png","imgAlt":"p.21 File Read Timeline — 첫 read() 줄이 가려져 있다","explainImg":"img/os20-p21-readtl-ans.png","answer":3,"unit":"번","tol":0,"introCard":0},{"id":"u20d-04","type":"num","q":"open(\"/foo/bar\") 뒤 read() 를 3번(block 3개) 하면 총 I/O 는 몇 번인가?","explain":"open 5 + read 3 × 3 = 14. close 는 디스크 I/O 가 없다 (p.20).","src":"20강 p.20~21","wiki":"파일 접근 경로","diff":2,"tags":["I/O 수"],"answer":14,"unit":"번","tol":0,"introCard":0},{"id":"u20d-05","type":"tf","q":"읽기 전용 예에서 close() 는 추가 디스크 I/O 가 필요 없다.","explain":"p.20 \"close releases the descriptor and needs no additional disk I/O\".","src":"20강 p.20","wiki":"파일 접근 경로","answer":true,"introCard":0},{"id":"u20d-06","type":"order","q":"새 block 을 할당하는 write() 의 I/O 다섯 개 순서","explain":"p.22 의 1~5 번.","src":"20강 p.22","wiki":"파일 접근 경로","tags":["I/O 수"],"answer":["inode 읽기","data bitmap 읽기","data bitmap 쓰기","inode 쓰기","실제 data block 쓰기"],"introCard":1},{"id":"u20d-07","type":"num","q":"block 을 새로 할당하는 write() 한 번의 I/O 수는?","explain":"p.22 \"It generates five I/Os\".","src":"20강 p.22","wiki":"파일 접근 경로","tags":["I/O 수"],"img":"img/os20-p23-writetl.png","imgAlt":"p.23 File Creation Timeline — 첫 write() 줄이 가려져 있다","explainImg":"img/os20-p23-writetl-ans.png","answer":5,"unit":"번","tol":0,"introCard":1},{"id":"u20d-08","type":"num","q":"/foo 가 있을 때 create(\"/foo/bar\") 의 I/O 수는? (디렉터리 data 는 block 하나, 캐시 없음)","explain":"읽기 4 + inode bitmap 2 + foo data 쓰기 1 + bar inode 2 + foo inode 쓰기 1 = 10 (p.23 timeline).","src":"20강 p.23","wiki":"파일 접근 경로","diff":3,"tags":["I/O 수"],"img":"img/os20-p23-createtl.png","imgAlt":"p.23 File Creation Timeline — create 줄 전체가 가려져 있다","explainImg":"img/os20-p23-createtl-ans.png","answer":10,"unit":"번","tol":0,"introCard":1},{"id":"u20d-09","type":"num","q":"create(\"/foo/bar\") (10번) 뒤 block 할당 write() 를 3번 하면 총 I/O 는?","explain":"10 + 3 × 5 = 25.","src":"20강 p.22~23","wiki":"파일 접근 경로","diff":2,"tags":["I/O 수"],"answer":25,"unit":"번","tol":0,"introCard":1},{"id":"u20d-10","type":"tf","q":"overwrite(이미 있는 block 덮어쓰기)도 data bitmap 을 읽고 써야 한다.","explain":"p.22 \"File may allocate a block (unless the block is being overwritten)\". 새 block 을 할당할 때만 bitmap 을 고친다.","src":"20강 p.22","wiki":"파일 접근 경로","diff":2,"answer":false,"introCard":1},{"id":"u20d-11","type":"mc","q":"/1/2/3/…/100/file.txt 처럼 경로가 길면 open 이 비싼 이유는?","explain":"p.24. 그래서 DRAM 캐시를 적극적으로 쓴다.","src":"20강 p.24","wiki":"파일 접근 경로","choices":["디렉터리마다 inode 1번 + data 최소 1번을 읽어 수백 번 read 가 될 수 있어서","fd 가 부족해서","bitmap 을 매번 써서","superblock 을 매번 읽어서"],"answer":0,"introCard":1},{"id":"u20d-12","type":"mc","q":"현대 시스템의 파일 캐시 방식은?","explain":"p.24: 초기에는 fixed-size cache(낭비 가능), 지금은 unified page cache.","src":"20강 p.24","wiki":"파일 접근 경로","choices":["dynamic partitioning — unified page cache","고정 크기 static partitioning","캐시를 쓰지 않음","TLB 에 파일 block 저장"],"answer":0,"introCard":2},{"id":"u20d-13","type":"cloze","q":"write buffering 은 쓰기를 ___ 모아 I/O 를 줄인다. 내구성이 필요하면 ___ 를 불러야 하고, close() 는 flush 를 보장하지 ___.","explain":"p.25 \"Use fsync() for durability. Direct I/O alone does not guarantee it. close() does not guarantee the flush!\"","src":"20강 p.25 · 🎙 11/23 수업","wiki":"파일 접근 경로","prof":true,"answer":["지연시켜","fsync()","않는다"],"bank":["지연시켜","fsync()","않는다","즉시","lseek()","한다"],"introCard":2},{"id":"u20d-14","type":"num","q":"[규칙 적용] open(\"/a/b/c\", O_RDONLY) 의 디스크 read 는 몇 번인가? (디렉터리 data 는 각 block 하나, 캐시 없음)","explain":"root inode, root data, a inode, a data, b inode, b data, c inode = 7. 경로 성분 하나가 늘 때마다 inode + data 2번씩 는다 → 디렉터리 깊이 d 면 2d + 1.","src":"20강 p.19~21 규칙 적용","wiki":"파일 접근 경로","diff":2,"tags":["I/O 수"],"answer":7,"unit":"번","tol":0,"introCard":0},{"id":"u20d-15","type":"mc","q":"create(\"/foo/bar\") 줄에서 inode bitmap 을 read 하고 write 하는 이유는?","explain":"p.7 \"Creating a file allocates an inode using the inode bitmap.\" 그다음 bar inode 를 read·write(초기화)하고, foo data 에 (bar, inode#) 엔트리를 쓰고, foo inode 를 갱신한다. data bitmap 은 첫 write() 에서 block 을 할당할 때 쓴다.","src":"20강 p.7, p.23","wiki":"파일 접근 경로","diff":2,"tags":["I/O 수"],"img":"img/os20-p23-createtl.png","imgAlt":"p.23 File Creation Timeline — create 줄이 가려져 있다","explainImg":"img/os20-p23-createtl-ans.png","choices":["새 파일 bar 에 줄 빈 inode 를 찾아 in-use 로 표시하려고","foo 디렉터리에 data block 을 더 주려고","root inode 의 권한을 바꾸려고","읽기 캐시를 비우려고"],"answer":0,"introCard":1},{"id":"u20d-16","type":"sa","q":"[용어] 현대 시스템이 쓰는, 가상 메모리 page 와 파일 block 이 같은 메모리 풀을 나눠 쓰는 dynamic partitioning 캐시. (3 words, u… p… c…)","explain":"p.24. 예전에는 fixed-size cache 로 메모리를 고정 분할(static partitioning)해서 낭비가 생길 수 있었다.","src":"20강 p.24","wiki":"파일 접근 경로","answer":"unified page cache","introCard":2}],"intro":[{"title":"읽기 경로의 I/O","body":"open(\"/foo/bar\"): root inode(2번) → root data → foo inode → foo data → bar inode = read 5번(경로 깊이 d 면 2d + 1). read() 한 번: bar inode read → data read → bar inode write(last-access time) = 3. close 는 디스크 I/O 없음.","img":"img/os20-p21-readtl-ans.png","imgAlt":"File Read Timeline: open 과 read() 세 번","src":"20강 p.19~21"},{"title":"쓰기·생성 경로의 I/O","body":"새 block 을 할당하는 write(): inode read → data bitmap read → data bitmap write → inode write → data write = 5 (덮어쓰기면 bitmap 불필요). create(\"/foo/bar\"): 경로 read 4 + inode bitmap read·write + foo data write + bar inode read·write + foo inode write = 10.","img":"img/os20-p23-createtl-ans.png","imgAlt":"File Creation Timeline: create 와 write() 세 번","src":"20강 p.22~23"},{"title":"캐싱과 버퍼링","body":"경로가 길면 open 에 수백 번 read → DRAM 캐시. 예전 fixed-size cache(static partitioning, 낭비) → 지금 **unified page cache**(dynamic partitioning). **write buffering** 은 쓰기를 지연시켜 모으고 스케줄링한다. 내구성이 필요하면 fsync(); close() 는 flush 를 보장하지 않는다.","src":"20강 p.24~25"}]}]},{"id":"u21","title":"21강 Fast File System","desc":"old UFS 의 문제 · cylinder group · 배치 정책 · large-file exception · ext4","lessons":[{"id":"u21a","title":"Old FS 의 문제와 cylinder group","items":[{"id":"u21a-01","type":"mc","q":"옛 Unix 파일 시스템(그림의 단순한 배치)의 가장 큰 문제는?","explain":"p.2: 단순하고 구현이 쉬운 것은 좋았지만 성능이 나빴다.","src":"21강 p.2","wiki":"cylinder group","img":"img/os21-p02-oldfs.png","imgAlt":"p.2 Old Unix File System 의 디스크 배치 — Super Block, Inode Bmap, Data Bmap, inodes, Data","choices":["Terrible performance","파일/디렉터리 추상화가 없다","구현이 어렵다","디렉터리를 지원하지 않는다"],"answer":0,"introCard":0},{"id":"u21a-02","type":"cloze","q":"옛 FS 는 디스크를 ___ memory 처럼 다뤄서, 파일의 data block 이 inode 에서 멀리 떨어져 비싼 ___ 가 생겼다.","explain":"p.3 Problem 1: high positioning costs.","src":"21강 p.3 · 🎙 11/25 수업","wiki":"cylinder group","prof":true,"tags":["FFS"],"answer":["random-access","seek"],"bank":["random-access","seek","sequential","page fault","interrupt"],"introCard":0},{"id":"u21a-03","type":"tf","q":"옛 FS 에서 파일이 지워지고 새 파일이 빈 block 들에 흩어져 놓이면 그 파일을 읽을 때 디스크를 오가야 한다.","explain":"p.4 Problem 2: fragmentation. B, D 를 지운 자리에 E1~E4 가 흩어진다.","src":"21강 p.4 · 🎙 11/25 수업","wiki":"cylinder group","prof":true,"img":"img/os21-p04-frag.png","imgAlt":"p.4 B·D 를 지운 자리에 E1~E4 가 흩어진 블록 배치","answer":true,"introCard":0},{"id":"u21a-04","type":"sa","q":"FFS 의 full term 은?","explain":"p.5. UC Berkeley 가 설계. 핵심은 \"disk aware\".","src":"21강 p.5","wiki":"cylinder group","answer":"Fast File System","alts":["FFS"],"introCard":1},{"id":"u21a-05","type":"tf","q":"FFS 는 open/read/write 같은 API 를 바꾸고 내부 구현은 그대로 두었다.","explain":"p.5: API 는 그대로 두고 내부 구현을 바꿨다.","src":"21강 p.5 · 🎙 11/25 수업","wiki":"cylinder group","prof":true,"diff":1,"answer":false,"introCard":1},{"id":"u21a-06","type":"sa","q":"FFS 가 디스크를 나누는 단위, 연속된 N 개 cylinder 의 묶음은? (현대 FS 는 block group 이라 부름)","explain":"p.6.","src":"21강 p.6 · 🎙 11/25 수업","wiki":"cylinder group","prof":true,"tags":["FFS"],"answer":"cylinder group","alts":["block group"],"introCard":1},{"id":"u21a-07","type":"mc","q":"HDD 에서 cylinder 하나는 무엇인가?","explain":"p.6 \"A single cylinder is a set of tracks on different surfaces of HDD\".","src":"21강 p.6","wiki":"cylinder group","img":"img/os21-p06-cyl.png","imgAlt":"p.6 cylinder 그림 — 두 이름표가 가려져 있다","explainImg":"img/os21-p06-cyl-ans.png","choices":["서로 다른 surface 의 같은 반지름 track 묶음","track 하나의 sector 묶음","platter 하나","연속된 block 8개"],"answer":0,"introCard":1},{"id":"u21a-08","type":"mc","q":"cylinder group 마다 superblock 사본을 두는 이유는?","explain":"p.8 \"A copy of the superblock for reliability reason\".","src":"21강 p.8","wiki":"cylinder group","choices":["reliability","seek 감소","bitmap 을 줄이려고","extent 를 쓰려고"],"answer":0,"introCard":1},{"id":"u21a-09","type":"match","q":"cylinder group 안의 구조를 연결하시오","explain":"p.8.","src":"21강 p.8","wiki":"cylinder group","tags":["FFS"],"img":"img/os21-p08-cgroup.png","imgAlt":"p.8 cylinder group 하나의 구조 — 앞 세 칸이 ①②③으로 가려져 있다","explainImg":"img/os21-p08-cgroup-ans.png","pairs":[["Superblock 사본","신뢰성(reliability)"],["Inode bitmap","free inode 추적"],["Data bitmap","free data block 추적"],["Inodes / Data blocks","20강의 단순 FS 와 같은 구조"]],"introCard":1},{"id":"u21a-10","type":"tf","q":"cylinder group 을 쓰는 목적은 서로 관련된 두 파일을 같은 group 에 둬서, 하나를 읽은 뒤 다른 하나를 읽을 때 긴 seek 를 피하는 것이다.","explain":"p.7.","src":"21강 p.7","wiki":"cylinder group","answer":true,"introCard":1},{"id":"u21a-11","type":"num","q":"cylinder group 하나가 4KB block 8개로 이뤄져 있다면 group 하나의 크기는 몇 KB 인가?","explain":"p.7 그림 \"A cylinder (or block) group, composed of 8 blocks\" → 8 × 4KB = 32KB.","src":"21강 p.7","wiki":"cylinder group","diff":1,"answer":32,"unit":"KB","tol":0,"introCard":1},{"id":"u21a-12","type":"tf","q":"FFS 의 cylinder group 마다 들어 있는 inode bitmap·data bitmap·inode table 은 디스크 전체 것의 사본(copy)이다.","explain":"수업 중 학생 질문(\"그룹마다 사본은 너무 많지 않나?\")에 대한 교수님 답: bitmap·inode 는 사본이 아니라 잘라서(slice) 그룹마다 나눈 것이라 내용이 겹치지 않는다. 그룹의 superblock 은 자기 그룹 정보를 담고, 전체를 기술하는 master superblock 이 따로 있다. (슬라이드 p.8 은 superblock 사본을 reliability 때문이라고 쓴다.)","src":"21강 p.8 · 🎙 11/25 녹음 16:51","wiki":"cylinder group","prof":true,"diff":2,"tags":["FFS"],"answer":false,"introCard":1},{"id":"u21a-13","type":"mc","q":"요즘 파일 시스템(ext2/3/4)이 cylinder group 대신 block group 이라는 이름을 쓰는 이유로 맞는 것은?","explain":"교수님(09:46~10:41): cylinder 는 디스크 개념이라 SSD 에는 없지만 관련 데이터를 가까이 두는 동기는 SSD 에도 적용된다. 또 파일 시스템은 linear block abstraction 만 봐서 cylinder 를 모른다.","src":"21강 p.6 · 🎙 11/25 녹음 09:46","wiki":"cylinder group","prof":true,"tags":["FFS"],"choices":["파일 시스템은 linear block 번호만 보고 cylinder 를 모르며, 같은 동기가 cylinder 가 없는 SSD 에도 통하기 때문","요즘 디스크에는 track 이 없기 때문","block group 은 cylinder group 보다 항상 작기 때문","block group 에는 superblock 이 없기 때문"],"answer":0,"introCard":1},{"id":"u21a-14","type":"mc","q":"같은 cylinder 안에 있는 두 블록을 이어서 읽을 때 없어지는 비용과 남는 비용은?","explain":"교수님(08:58~09:18): 같은 cylinder 면 head 를 옮기지 않아 seek time 은 없어지지만, 원판이 원하는 sector 까지 돌아오는 rotation 은 그대로다. 그룹으로 묶으면 seek 가 있어도 짧다.","src":"21강 p.6 · 🎙 11/25 녹음 08:58","wiki":"cylinder group","prof":true,"diff":1,"tags":["FFS"],"choices":["seek 는 없어지고 rotation 은 남는다","rotation 은 없어지고 seek 는 남는다","둘 다 없어진다","둘 다 남는다"],"answer":0,"introCard":1}],"intro":[{"title":"옛 Unix FS 의 문제","body":"단순(Super Block, Inode Bmap, Data Bmap, inodes, Data)하고 구현이 쉽지만 **성능이 나빴다**. 디스크를 random-access memory 처럼 다뤄 ① data block 이 inode 에서 멀어 비싼 seek(high positioning cost), ② 지운 자리에 새 파일이 흩어지는 **fragmentation**.","img":"img/os21-p04-frag.png","imgAlt":"B·D 를 지운 자리에 E1~E4 가 흩어진 블록 배치","src":"21강 p.2~4"},{"title":"FFS 와 cylinder group","body":"**Fast File System**(UC Berkeley): API(open/read/write)는 그대로, 내부를 **disk aware** 하게. 디스크를 연속된 N 개 cylinder 묶음 **cylinder group**(현대 FS 의 block group)으로 나눈다. group 마다 superblock 사본(reliability), inode bitmap, data bitmap, inodes, data blocks.","img":"img/os21-p08-cgroup-ans.png","imgAlt":"cylinder group G0~G9 와 group 하나의 구조","src":"21강 p.5~8"},{"title":"cylinder 와 group 의 목적","body":"cylinder = 서로 다른 surface 의 같은 반지름 track 묶음(head 들이 함께 움직여 seek 없이 읽음). 관련된 두 파일을 같은 group 에 두면 하나를 읽고 다른 하나를 읽을 때 긴 seek 가 없다. 예: group 이 4KB block 8개면 32KB.","img":"img/os21-p06-cyl-ans.png","imgAlt":"Cylinder k 와 N Cylinders = Cylinder Group","src":"21강 p.6~7"}]},{"id":"u21b","title":"배치 정책과 locality","items":[{"id":"u21b-01","type":"cloze","q":"FFS 의 기본 정책은 \"keep ___ stuff together\" 다.","explain":"p.9.","src":"21강 p.9 · 🎙 11/25 수업","wiki":"FFS 배치 정책","prof":true,"tags":["FFS 정책"],"answer":["related"],"bank":["related","random","large","hot"],"introCard":0},{"id":"u21b-02","type":"mc","q":"FFS 가 새 디렉터리를 둘 cylinder group 을 고르는 기준은?","explain":"p.9 Policy 1. 디렉터리 data 와 inode 를 그 group 에 둔다.","src":"21강 p.9 · 🎙 11/25 수업","wiki":"cylinder group","prof":true,"tags":["FFS 정책"],"choices":["할당된 디렉터리가 적고 free inode 가 많은 group","free data block 이 가장 적은 group","부모 디렉터리와 같은 group","아무 group 이나"],"answer":0,"introCard":0},{"id":"u21b-03","type":"match","q":"FFS 배치 정책을 연결하시오","explain":"p.9, p.15.","src":"21강 p.9, p.15 · 🎙 11/25 수업","wiki":"FFS 배치 정책","prof":true,"tags":["FFS 정책"],"pairs":[["디렉터리","디렉터리 적고 free inode 많은 group 에"],["파일의 data block","그 파일 inode 와 같은 group 에"],["파일","자기 디렉터리와 같은 group 에"],["큰 파일","덩어리(chunk)로 나눠 여러 group 에"]],"introCard":0},{"id":"u21b-04","type":"mc","q":"/a/b, /a/c, /a/d, /b/f 를 만들면 FFS 는?","explain":"p.9 예. 파일은 자기 디렉터리 group 에, 디렉터리 /a 와 /b 는 서로 다른 group 에.","src":"21강 p.9","wiki":"FFS 배치 정책","tags":["FFS 정책"],"choices":["앞의 셋은 같은 group, /b/f 는 다른 group","넷 다 같은 group","넷 다 다른 group","/b/f 만 /a 와 같은 group"],"answer":0,"introCard":0},{"id":"u21b-05","type":"tf","q":"inode 를 group 들에 고르게 흩뿌리는 방식은 같은 디렉터리 파일들의 name-based locality 를 지키지 못한다.","explain":"p.12 대조 예: /a/c, /a/d, /a/e 접근이 group 1개가 아니라 3개에 걸친다.","src":"21강 p.12 · 🎙 11/25 수업","wiki":"FFS 배치 정책","prof":true,"diff":2,"img":"img/os21-p12-spread.png","imgAlt":"p.12 inode 를 group 마다 흩뿌린 대조 예의 group/inodes/data 표","answer":true,"introCard":0},{"id":"u21b-06","type":"match","q":"SEER trace 의 distance 를 연결하시오","explain":"p.13. proc/src/foo.c → proc/src/bar.c 는 1, proc/src/foo.c → proc/obj/foo.o 는 2.","src":"21강 p.13~14","wiki":"FFS 배치 정책","pairs":[["0","같은 파일을 다시 open"],["1","같은 디렉터리의 다른 파일"],["2","dir/subdir1/f 다음 dir/subdir2/g"],["같은 파일 접근 비율 (Observation 1)","약 7%"]],"introCard":1},{"id":"u21b-07","type":"num","q":"SEER trace 에서 같은 파일에 대한 접근은 몇 % 였나?","explain":"p.14 Observation 1.","src":"21강 p.14 · 🎙 11/25 수업","wiki":"FFS 배치 정책","prof":true,"img":"img/os21-p14-seer.png","imgAlt":"p.14 SEER trace 누적 분포 그래프 — Observation 의 비율이 가려져 있다","explainImg":"img/os21-p14-seer-ans.png","answer":7,"unit":"%","tol":0,"introCard":1},{"id":"u21b-08","type":"num","q":"SEER trace 에서 같은 파일이거나 같은 디렉터리 파일에 대한 접근은 약 몇 % 였나?","explain":"p.14 Observation 2. distance 2 미만은 약 65% (Observation 3).","src":"21강 p.14 · 🎙 11/25 수업","wiki":"FFS 배치 정책","prof":true,"diff":2,"img":"img/os21-p14-seer.png","imgAlt":"p.14 SEER trace 누적 분포 그래프 — Observation 의 비율이 가려져 있다","explainImg":"img/os21-p14-seer-ans.png","answer":40,"unit":"%","tol":0,"introCard":1},{"id":"u21b-09","type":"tf","q":"SEER trace 결과는 FFS 의 \"같은 디렉터리 파일을 가까이\" 가정을 뒷받침한다.","explain":"약 40% 가 같은 파일·같은 디렉터리, 약 65% 가 distance 2 미만이었다.","src":"21강 p.13~14","wiki":"FFS 배치 정책","answer":true,"introCard":0},{"id":"u21b-10","type":"mc","q":"FFS 배치를 손으로 채워 보는 슬라이드 예제(그룹마다 칸 10개짜리 표)는 계산을 쉽게 하려고 몇 가지 조건을 정해 두었다. 그 예제의 조건이 **아닌** 것은?","explain":"p.10: group 당 inode 10·data 10(비현실적), 디렉터리 1 block, 파일 2 block.","src":"21강 p.10","wiki":"FFS 배치 정책","diff":2,"choices":["파일 하나가 data block 10개를 쓴다","group 마다 inode 10개, data block 10개","디렉터리는 data block 하나","파일은 block 두 개"],"answer":0,"introCard":0},{"id":"u21b-11","type":"mc","q":"[규칙 적용] : group 당 inode 10·data 10, 디렉터리 data 1 block, 파일 2 block. /, /a, /b 와 /a/c, /a/d, /a/e, /b/f 를 FFS 정책대로 놓았다(group 0 은 /). 가려진 group 1·2 줄(inodes / data)은?","explain":"Policy 1: 디렉터리 /a, /b 는 디렉터리가 적은 서로 다른 group(1, 2)에. Policy 2: 파일은 자기 디렉터리 group 에, data 는 자기 inode 와 같은 group 에 → group 1 inode a c d e, data a(1) cc dd ee(2씩), group 2 inode b f, data b ff. 같은 디렉터리 파일이 한 group 에 모인다.","src":"21강 p.9~11 규칙 적용 · 🎙 11/25 수업","wiki":"FFS 배치 정책","prof":true,"diff":3,"tags":["FFS 정책"],"img":"img/os21-p10-ffsalloc.png","imgAlt":"p.10 FFS 할당 예 — group 1·2 줄이 가려져 있다","explainImg":"img/os21-p10-ffsalloc-ans.png","choices":["1: acde / accddee,  2: bf / bff","1: abcdef / aabbccddeeff,  2: 비어 있음","1: a / a,  2: b / b,  3~6: c d e f 하나씩","1: ab / ab,  2: cdef / ccddeeff"],"answer":0,"introCard":0},{"id":"u21b-12","type":"num","q":"대조 예(inode 를 group 마다 하나씩 흩뿌림)에서 /a/c, /a/d, /a/e 세 파일에 접근하면 몇 개 group 에 걸치는가?","explain":"c, d, e 의 inode·data 가 group 3, 4, 5 에 따로 있다 → 3개. FFS 정책이면 셋 다 group 1 하나. \"Name-based locality is not preserved.\"","src":"21강 p.12","wiki":"FFS 배치 정책","tags":["FFS 정책"],"img":"img/os21-p12-spread.png","imgAlt":"p.12 대조 예의 group/inodes/data 표","answer":3,"unit":"개","tol":0,"introCard":0},{"id":"u21b-13","type":"mc","q":"같은 디렉터리의 파일들을 cylinder group 마다 하나씩 흩어 그룹 사이 load balancing 을 하면 성능은 어떻게 되나?","explain":"교수님 질문(26:49)과 답: 활성 그룹이 디스크 여기저기라(예: 그룹 0 → 6) seek 가 길어진다. \"In terms of performance, we should not have load balanced groups.\" 얻는 것은 utilization 정도이고 name-based locality 도 깨진다.","src":"21강 p.12 · 🎙 11/25 녹음 26:49","wiki":"FFS 배치 정책","prof":true,"diff":2,"tags":["FFS 정책"],"choices":["그룹 사이를 멀리 오가 평균 seek time 이 늘어난다","평균 seek time 이 줄어든다","seek 는 그대로이고 rotation 이 준다","inode 가 부족해진다"],"answer":0,"introCard":0},{"id":"u21b-14","type":"tf","q":"SEER trace 에서 파일을 무작위 순서로 연 비교 trace(Random)에도 어느 정도 locality 가 보였다. 디렉터리 구조 자체가 locality 를 만든다는 뜻이다.","explain":"교수님(32:03~32:43): random trace 도 실제 디렉터리 구조 위에서 만든 것이라 locality 가 조금 나온다. 사람의 실제 사용(Trace)은 그보다 큰 locality 를 보인다.","src":"21강 p.14 · 🎙 11/25 녹음 32:03","wiki":"FFS 배치 정책","prof":true,"diff":2,"answer":true,"introCard":1}],"intro":[{"title":"배치 정책","body":"\"keep related stuff together\". **디렉터리**: 할당된 디렉터리가 적고 free inode 가 많은 group 에. **파일**: data block 은 자기 inode 와 같은 group, 파일은 자기 디렉터리와 같은 group. 예: /a/b, /a/c, /a/d 는 한 group, /b/f 는 다른 group.","img":"img/os21-p10-ffsalloc-ans.png","imgAlt":"FFS 할당 예: group 1 acde/accddee, group 2 bf/bff","src":"21강 p.9~11"},{"title":"대조 예와 SEER trace","body":"inode 를 group 마다 흩뿌리면 같은 디렉터리 파일이 여러 group 에 걸쳐 name-based locality 가 깨진다. SEER trace: 같은 파일 재접근 약 7%, 같은 파일 또는 같은 디렉터리 약 40%, distance 2 미만 약 65% → FFS 가정을 뒷받침.","img":"img/os21-p14-seer-ans.png","imgAlt":"SEER trace 누적 분포: 7%, 40%, 65%","src":"21강 p.12~14"},{"title":"손으로 배치하기","body":"규칙대로 놓는다: 각 디렉터리는 비어 있는 다른 group 에(동률이면 번호 작은 쪽), 그 디렉터리의 파일 inode·data 는 같은 group 에 차례로. 단순화 예의 가정: group 당 inode 10·data 10, 디렉터리 data 1 block, 파일 2 block.","img":"img/os21-p10-ffsalloc-ans.png","imgAlt":"FFS 할당 예의 group 표","src":"21강 p.10"}]},{"id":"u21c","title":"Large-file exception · SSD · ext4","items":[{"id":"u21c-01","type":"mc","q":"큰 파일을 한 group 에 다 넣으면 생기는 문제는?","explain":"p.15. 그래서 큰 파일은 chunk 로 나눠 여러 group 에 흩는다.","src":"21강 p.15 · 🎙 11/25 수업","wiki":"large-file exception","prof":true,"tags":["large file"],"img":"img/os21-p15-largefile.png","imgAlt":"p.15 큰 파일이 G2 를 채우는 경우와 chunk 로 여러 group 에 흩는 경우","choices":["그 group 이 차서 같은 디렉터리의 작은 파일들이 다른 group 으로 밀려 locality 가 깨진다","inode 가 부족해진다","superblock 이 지워진다","fsync 가 실패한다"],"answer":0,"introCard":0},{"id":"u21c-02","type":"sa","q":"일을 한 번에 더 많이 해서 overhead 비율을 줄이는 것을 무엇이라 부르나? (large-file exception 의 chunk 크기를 정하는 원리)","explain":"p.15 \"Amortization: reducing overhead by doing more work\". chunk 를 충분히 크게 잡으면 seek 비용이 상쇄된다.","src":"21강 p.15","wiki":"large-file exception","answer":"amortization","alts":["amortize"],"introCard":0},{"id":"u21c-03","type":"num","q":"disk bandwidth 40MB/s, positioning 10ms 에서 peak 의 50% 를 내려면 seek 한 번마다 몇 KB 를 전송해야 하나?","explain":"절반은 seek, 절반은 전송 → 전송 시간 10ms 동안 40 × 1024 KB/s × 0.01 s = 409.6KB (p.16).","src":"21강 p.16 · 🎙 11/25 수업","wiki":"large-file exception","prof":true,"diff":2,"tags":["large file"],"img":"img/os21-p16-chunk.png","imgAlt":"p.16 chunk 크기와 bandwidth 그래프, 계산 — 결과가 가려져 있다","explainImg":"img/os21-p16-chunk-ans.png","answer":409.6,"unit":"KB","tol":0.001,"introCard":0},{"id":"u21c-04","type":"num","q":"disk bandwidth 100MB/s, positioning 5ms 에서 peak 의 50% 를 내려면 seek 한 번마다 몇 KB 를 전송해야 하나? (1MB = 1024KB)","explain":"100 × 1024 KB/s × 0.005 s = 512KB. p.16 식에 숫자만 바꿈.","src":"21강 p.16 규칙 적용","wiki":"large-file exception","diff":3,"tags":["large file"],"answer":512,"unit":"KB","tol":0.001,"introCard":0},{"id":"u21c-05","type":"tf","q":"disk bandwidth 40MB/s, positioning 10ms 일 때 peak 의 90% 를 내려면 chunk 가 약 4MB 필요하다.","explain":"p.16 \"90% of peak performance on about 4 MB chunk size\".","src":"21강 p.16 · 🎙 11/25 수업","wiki":"large-file exception","prof":true,"answer":true,"introCard":0},{"id":"u21c-06","type":"num","q":"inode 기반 단순 방식에서 indirect block 하나(4KB, pointer 4B)가 가리키는 data 는 몇 MB 이고, 그만큼씩 다른 group 에 놓이나?","explain":"1024 pointer × 4KB = 4MB (p.17). direct 12 block 은 inode 와 같은 group.","src":"21강 p.17 · 🎙 11/25 수업","wiki":"large-file exception","prof":true,"diff":2,"tags":["large file"],"img":"img/os21-p17-inodeapp.png","imgAlt":"p.17 inode 구조 기반 배치 — 두 계산 값이 가려져 있다","explainImg":"img/os21-p17-inodeapp-ans.png","answer":4,"unit":"MB","tol":0,"introCard":0},{"id":"u21c-07","type":"mc","q":"seek 가 없고 FTL 이 물리 매핑을 바꾸는 SSD 에서도 FFS 식 locality 가 도움이 될 수 있는 이유는?","explain":"p.18: SSD 는 seek 가 없고 FTL 이 물리 매핑을 바꾸지만, readahead·sequential write 의 이득은 남는다.","src":"21강 p.18","wiki":"large-file exception","diff":2,"choices":["readahead cache 와 sequential write 기회","seek time 이 길어서","cylinder 가 있어서","FTL 이 없어서"],"answer":0,"introCard":1},{"id":"u21c-08","type":"match","q":"ext4 기능과 설명을 연결하시오","explain":"p.19~23.","src":"21강 p.19~23","wiki":"extent","tags":["ext4"],"pairs":[["Extent","연속 block 묶음을 (시작, 길이) 하나로 표현"],["Preallocation","fallocate() 로 미리 block 확보"],["Delayed block allocation","write() 때가 아니라 page flush 때 할당"],["Journaling","뒤에 다룰 예정"]],"introCard":1},{"id":"u21c-09","type":"tf","q":"extent 는 심하게 조각났거나 sparse 한 파일에서도 indirect block 보다 항상 효율적이다.","explain":"p.20: 연속 block 이 없으면 block 마다 extent 하나가 필요해 사실상 더 비싼 indirect block 이 된다.","src":"21강 p.20 · 🎙 11/25 수업","wiki":"extent","prof":true,"diff":2,"tags":["ext4"],"answer":false,"introCard":2},{"id":"u21c-10","type":"num","q":"extent 하나는 최대 $2^{15}$ 개의 연속 block 을 나타낸다. block 4KB 면 최대 몇 MB 인가?","explain":"32768 × 4KB = 128MB (p.21).","src":"21강 p.21 · 🎙 11/25 수업","wiki":"extent","prof":true,"tags":["ext4"],"answer":128,"unit":"MB","tol":0,"introCard":0},{"id":"u21c-11","type":"mc","q":"delayed block allocation 의 장점이 아닌 것은?","explain":"p.23: 성능과 신뢰성 사이 trade-off 가 있다(flush 전에 죽으면 잃는다). throughput 30% 향상, CPU 50% 감소.","src":"21강 p.23 · 🎙 11/25 수업","wiki":"large-file exception","prof":true,"diff":2,"tags":["ext4"],"choices":["신뢰성이 항상 높아진다","여러 할당 요청을 하나로 합쳐 fragmentation 감소","CPU cycle 절약","금방 지워질 파일의 불필요한 할당을 피함"],"answer":0,"introCard":1},{"id":"u21c-12","type":"cloze","q":"preallocation 은 ___ 시스템 콜로 쓰며, extent tree 는 ___ 이 적을 때 효율적이라 연속 할당이 중요하다.","explain":"p.22. DB 와 streaming media server 가 쓴다.","src":"21강 p.22 · 🎙 11/25 수업","wiki":"extent","prof":true,"tags":["ext4"],"answer":["fallocate()","fragmentation"],"bank":["fallocate()","fragmentation","mmap()","locality","journaling"],"introCard":1},{"id":"u21c-13","type":"num","q":"[규칙 적용] disk bandwidth 80MB/s, positioning 4ms. peak 의 50% 를 내려면 seek 한 번마다 몇 KB 를 전송해야 하나? (1MB = 1024KB)","explain":"50% = seek 시간과 전송 시간이 같다 → 4ms 동안 전송: 80 × 1024 KB/s × 0.004 s = 327.68 KB. p.16 계산식 그대로.","src":"21강 p.16 규칙 적용","wiki":"large-file exception","diff":2,"tags":["large file"],"answer":327.68,"unit":"KB","tol":0.001,"introCard":0},{"id":"u21c-14","type":"num","q":"[규칙 적용] disk bandwidth 40MB/s, positioning 10ms. peak 의 90% 를 내려면 seek 한 번마다 몇 KB 를 전송해야 하나? (1MB = 1024KB)","explain":"90% 면 전송 시간 : seek 시간 = 9 : 1 → 전송 90ms. 40 × 1024 × 0.09 = 3686.4 KB ≈ 3.6MB. p.16 그래프의 \"90%, 3.69M\" 과 같은 값(슬라이드는 약 4MB 라고 적었다).","src":"21강 p.16 규칙 적용 · 🎙 11/25 수업","wiki":"large-file exception","prof":true,"diff":3,"tags":["large file"],"answer":3686.4,"unit":"KB","tol":0.001,"introCard":0},{"id":"u21c-15","type":"sa","q":"[용어] Represent contiguous chunks of blocks (start, length) instead of representing each block. (1 word, e…)","explain":"p.20. 연속이면 indirect block 의 250칸 대신 extent 하나로 끝난다. 심하게 조각나면 block 마다 extent 가 필요해 오히려 비싸다.","src":"21강 p.20","wiki":"extent","tags":["ext4"],"answer":"extent","alts":["extents"],"introCard":0},{"id":"u21c-16","type":"sa","q":"[용어] Block allocations are postponed to page flush time rather than during the write(). (3 words, d… b… a…)","explain":"p.23. 여러 할당 요청을 하나로 합쳐 fragmentation 과 CPU 를 줄이지만, flush 전에 죽으면 잃는 성능-신뢰성 trade-off 가 있다.","src":"21강 p.23","wiki":"large-file exception","tags":["ext4"],"answer":"delayed block allocation","alts":["delayed allocation"],"introCard":1},{"id":"u21c-17","type":"mc","q":"큰 파일만 chunk 로 나눠 여러 cylinder group 에 흩어도 성능 손해가 작은 이유는?","explain":"교수님(35:27~36:23): 작은 파일의 overhead 는 디렉터리 inode → 디렉터리 data → 파일 inode → data 로 이어지는 metadata 접근에서 온다. 큰 파일은 전송량이 커서 throughput 이 병목이고, seek 비용은 큰 chunk 로 상쇄된다.","src":"21강 p.15 · 🎙 11/25 녹음 35:27","wiki":"large-file exception","prof":true,"diff":2,"tags":["large file"],"choices":["큰 파일은 디스크 throughput 이 병목이라, chunk 가 크면 seek 비용이 amortize 되기 때문","큰 파일은 inode 가 없기 때문","큰 파일은 항상 캐시에 있기 때문","큰 파일은 디렉터리 밖에 있기 때문"],"answer":0,"introCard":0},{"id":"u21c-18","type":"num","q":"chunk 4MB 를 대역폭 40MB/s 인 디스크에서 전송하는 데 걸리는 시간은 몇 ms 인가?","explain":"4MB / 40MB/s = 0.1 s = 100 ms (교수님이 수업에서 든 숫자). positioning 10 ms 와 합치면 100 / 110 ≈ 90.9% 의 시간이 전송 → 대역폭의 약 90%.","src":"21강 p.16 · 🎙 11/25 녹음 38:27","wiki":"large-file exception","prof":true,"diff":1,"tags":["large file"],"answer":100,"unit":"ms","tol":0,"introCard":0},{"id":"u21c-19","type":"tf","q":"4KB indirect block 은 4B 포인터 1024 개로 4MB 를 가리키고, 4KB page table page 는 8B PTE 512 개로 2MB 를 가리킨다.","explain":"교수님(41:41~42:17)의 비교. 4096 / 4 = 1024 → 1024 × 4KB = 4MB. 4096 / 8 = 512 → 512 × 4KB = 2MB. FFS 가 indirect block 하나마다 그룹을 바꾸는 단위 4MB 는 p.16 의 90% 계산과 맞는다.","src":"21강 p.17 · 🎙 11/25 녹음 41:41","wiki":"large-file exception","prof":true,"diff":2,"tags":["large file"],"answer":true,"introCard":0},{"id":"u21c-20","type":"num","q":"[손으로] block pointer 방식(블록 4KB = 4096B)에서 파일의 바이트 offset 10,000 은 0 번부터 셀 때 몇 번 블록에 있나?","explain":"10000 / 4096 = 2.44 → 블록 2 (세 번째 블록; 교수님은 \"block 3\" 이라고 셈). 블록 크기가 고정이라 나눗셈 한 번이면 된다. extent 는 길이가 제각각이라 이렇게 못 하고 extent tree 를 검색해야 한다.","src":"21강 p.21 · 🎙 11/25 녹음 51:38","wiki":"extent","prof":true,"diff":2,"tags":["ext4"],"answer":2,"unit":"번","tol":0,"introCard":0},{"id":"u21c-21","type":"mc","q":"ext4 가 extent 들을 red-black tree 가 아니라 B-tree 로 관리하는 이유는?","explain":"교수님(52:54~53:53): 2-3-4 tree 는 red-black tree 와 같고 B-tree 는 그 일반형이다. B-tree 는 부모 하나에 자식이 많아 depth 가 낮다. 디스크에서는 부모 → 자식을 따라갈 때마다 블록을 읽으니 depth 가 낮을수록 좋다.","src":"21강 p.21 · 🎙 11/25 녹음 52:54","wiki":"extent","prof":true,"diff":2,"tags":["ext4"],"choices":["노드마다 자식이 많아 깊이가 얕고, 디스크에서는 노드 하나를 읽는 것이 비싸서","B-tree 는 정렬이 필요 없어서","red-black tree 는 검색을 못 해서","B-tree 는 메모리를 쓰지 않아서"],"answer":0,"introCard":1},{"id":"u21c-22","type":"mc","q":"seek 가 없는 SSD 에서도 \"관련된 블록을 가까이 둔다\" 는 FFS 아이디어를 쓸 수 있는 근거로 맞는 것은?","explain":"교수님(42:48~43:32): 대역폭이 훨씬 커서 4MB 같은 숫자 설계는 그대로 못 쓰지만, 물리적 배치에 locality 가 있는 저장 장치라면 아이디어는 적용된다. 슬라이드 p.18 의 실마리는 readahead cache 와 sequential write 기회.","src":"21강 p.18 · 🎙 11/25 녹음 42:48","wiki":"Fast File System","prof":true,"diff":2,"choices":["SSD 도 물리적 블록 배치에 locality 가 있다","SSD 에도 cylinder 가 있다","SSD 의 대역폭이 40MB/s 로 HDD 와 같다","SSD 에는 FTL 이 없다"],"answer":0,"introCard":0},{"id":"u21c-23","type":"mc","q":"ext4 의 delayed block allocation 이 write buffering(디스크 쓰기를 미뤄 모으는 것)과 다른 점은?","explain":"교수님(55:37~): \"this delayed block allocation is about allocation, not the write\". 기다리는 동안 파일이 커지면 큰 chunk 를 한 번에 잡을 수 있다. 미리 잡아 두는 것은 preallocation(fallocate). 대가: flush 전에 crash 가 나면 할당도 안 됐으니 파일 데이터를 다 잃는다.","src":"21강 p.23 · 🎙 11/25 녹음 55:37","wiki":"preallocation과 delayed allocation","prof":true,"diff":2,"tags":["ext4"],"choices":["쓰기뿐 아니라 블록을 고르는 일(할당) 자체를 page flush 때까지 미룬다","데이터를 디스크에 즉시 쓴다","fsync 를 자동으로 부른다","블록을 미리 크게 잡아 둔다"],"answer":0,"introCard":1}],"intro":[{"title":"large-file exception","body":"큰 파일 하나가 group 을 채우면 같은 디렉터리의 작은 파일들이 밀려난다 → 큰 파일은 chunk 로 나눠 여러 group 에. 대가인 seek 는 chunk 를 크게 잡아 **amortization**. 50% peak: 전송 시간 = positioning 시간 → 40MB/s × 10ms = 409.6KB. 90% 면 전송 = 9 × positioning(약 3.6~4MB). inode 기반: direct 12 block 은 inode group, indirect 하나(1024 × 4KB = 4MB)마다 다른 group.","img":"img/os21-p16-chunk-ans.png","imgAlt":"chunk 크기와 bandwidth 그래프: 50% 409.6K, 90% 3.69M","src":"21강 p.15~17"},{"title":"SSD 와 ext4","body":"SSD 는 seek 가 없고 FTL 이 매핑을 바꾸지만 readahead·sequential write 이득은 남는다. ext4: **extent**(연속 block 을 (시작, 길이) 하나로; 최대 $2^{15}$ block = 128MB; 조각나면 오히려 비쌈), **preallocation**(fallocate()), **delayed block allocation**(write() 가 아닌 page flush 때 할당 — 요청을 합쳐 fragmentation·CPU 절약, 대신 성능-신뢰성 trade-off).","src":"21강 p.18~23"},{"title":"extent 의 장단점","body":"extent = (시작 block, 길이). 디스크 block 50~300 이 파일 block 0~250 이면 extent 하나 — indirect block 이면 250칸을 채우고 삭제 때 250칸을 free 로 표시해야 한다. 하지만 심하게 조각나거나 sparse 하면 block 마다 extent 가 필요해 더 비싼 indirect 가 된다. extent tree 는 B-tree 처럼 동작.","src":"21강 p.20~21"}]}]},{"id":"u22","title":"22강 FSCK and Journaling","desc":"crash consistency · crash 시나리오 · fsck · data journaling · circular log · ext3/4 모드","lessons":[{"id":"u22a","title":"crash consistency 와 crash 시나리오","items":[{"id":"u22a-01","type":"mc","q":"파일 시스템 자료구조가 메모리 자료구조와 달리 crash 를 신경 써야 하는 이유는?","explain":"영속 자료구조는 재부팅 뒤에도 그대로 읽힌다. 갱신 도중 전원이 나가면 반쯤 고친 상태가 영원히 남는다. 디스크는 오히려 한 번에 한 블록만 쓴다.","src":"22강 p.3 · 🎙 11/25 수업","wiki":"FSCK와 Journaling","prof":true,"diff":1,"tags":["crash consistency"],"choices":["전원이 꺼져도 디스크에 남아(persist) 고치다 만 상태도 그대로 남기 때문","디스크가 메모리보다 빠르기 때문","파일 시스템은 lock 을 쓸 수 없기 때문","디스크는 한 번에 여러 블록을 atomic 하게 쓰기 때문"],"answer":0,"introCard":0},{"id":"u22a-02","type":"num","q":"inode 2(size 1, pointer 4)인 파일 끝에 4 KB 블록 하나를 append 해서 data block 5 를 받았다. 갱신 뒤 inode 의 size(블록 수)는? (가려진 두 칸 중 위쪽)","explain":"블록이 하나 늘어 size 1 → 2, 두 번째 pointer 가 5 가 된다(I[v2]).","src":"22강 p.5~6","wiki":"crash consistency","diff":1,"tags":["crash consistency"],"img":"img/os22-p06-after.png","imgAlt":"갱신 뒤 inode 상자(size 와 두 번째 pointer 가 가려짐)와 bitmap·inode·data block 배치","explainImg":"img/os22-p06-after-ans.png","answer":2,"unit":"블록","tol":0,"introCard":1},{"id":"u22a-03","type":"cloze","q":"[손으로] data bitmap 이 0000 1000 (0 번 비트부터)이고, append 로 새 블록 5 를 할당했다. 갱신 뒤 data bitmap 은 ___ 이다.","explain":"4 번(Da)은 그대로 1, 5 번이 새로 1 → 0000 1100 = B[v2]. 0 번 비트부터 세니 왼쪽에서 여섯 번째 자리다.","src":"22강 p.4~6","wiki":"crash consistency","tags":["crash consistency"],"answer":["0000 1100"],"bank":["0000 1100","0000 0100","0000 1000","0001 1000"],"introCard":1},{"id":"u22a-04","type":"match","q":"블록 하나를 append 할 때 바뀌는 것과 그 내용을 연결하시오","explain":"세 쓰기는 성능 때문에 바로 나가지 않고 메모리에 dirty 로 머물다가 나중에 따로따로 디스크에 쓰인다.","src":"22강 p.6~7","wiki":"crash consistency","tags":["crash consistency"],"pairs":[["I[v2]","inode: size 2, pointer 4·5"],["B[v2]","data bitmap: 5 번 비트 = 1"],["Db","data block 5 의 새 내용"],["page cache / buffer cache","디스크로 나가기 전 dirty 블록이 머무는 곳"]],"introCard":1},{"id":"u22a-05","type":"tf","q":"write() 가 돌아오면 바뀐 inode, bitmap, data block 세 블록이 이미 디스크에 쓰여 있다.","explain":"성능 때문에 dirty 블록은 page cache / buffer cache 에 머물다 나중에 쓰인다. 그래서 한두 개만 쓰인 상태에서 crash 가 날 수 있다.","src":"22강 p.7 · 🎙 11/25 수업","wiki":"crash consistency","prof":true,"diff":1,"answer":false,"introCard":1},{"id":"u22a-06","type":"mc","q":"append 의 세 쓰기(I[v2], B[v2], Db) 중 Db 만 디스크에 닿고 crash 가 났다. 결과는?","explain":"Case 1a. Db 를 가리키는 inode 도, 할당 표시도 없으니 블록 5 는 그냥 빈 블록이다. 사용자 데이터는 사라졌지만 구조는 멀쩡하다.","src":"22강 p.8 · 🎙 11/25 수업","wiki":"crash 시나리오","prof":true,"tags":["crash 시나리오"],"choices":["consistency 문제 없음. write 가 없었던 것과 같다","inode 가 garbage 를 가리킨다","space leak","다른 파일이 블록 5 를 가져갈 수 있다"],"answer":0,"introCard":3},{"id":"u22a-07","type":"mc","q":"세 쓰기 중 I[v2] 만 디스크에 닿고 crash 가 났다. 결과는?","explain":"Case 1b. inode ↔ bitmap 불일치 + 블록 5 의 옛 내용(garbage)을 읽는다. \"metadata 는 맞다\" 는 I + B 가 같이 쓰인 2a 다.","src":"22강 p.8 · 🎙 11/25 수업","wiki":"crash 시나리오","prof":true,"tags":["crash 시나리오"],"choices":["inode 가 블록 5 를 가리키지만 bitmap 은 5 가 비었다고 하고, 읽으면 garbage","metadata 는 맞고 data 만 garbage","문제없음","space leak 만 생긴다"],"answer":0,"introCard":3},{"id":"u22a-08","type":"sa","q":"data bitmap 만 새 판이 쓰여서, 아무 inode 도 가리키지 않는 블록이 할당된 것으로 남아 다시는 안 쓰이게 된 현상은? (2 words)","explain":"Case 1c. bitmap 은 5 를 썼다고 하는데 가리키는 inode 가 없다.","src":"22강 p.9 · 🎙 11/25 수업","wiki":"crash 시나리오","prof":true,"tags":["crash 시나리오"],"answer":"space leak","alts":["leak","spaceleak"],"introCard":1},{"id":"u22a-09","type":"tf","q":"I[v2] 와 B[v2] 는 디스크에 쓰였고 Db 만 못 쓰인 채 crash 가 나면, 파일 시스템 metadata 는 서로 완전히 일치한다.","explain":"Case 2a. inode 와 bitmap 이 둘 다 5 를 쓴다고 하니 metadata 는 consistent. 대신 블록 5 가 garbage 다.","src":"22강 p.10 · 🎙 11/25 수업","wiki":"crash 시나리오","prof":true,"tags":["crash 시나리오"],"answer":true,"introCard":1},{"id":"u22a-10","type":"match","q":"[손으로] append 의 세 쓰기 중 디스크에 닿은 것과 crash 뒤 결과를 연결하시오","explain":"규칙: inode 와 bitmap 이 같이 쓰이거나 같이 안 쓰이면 metadata 가 맞고, inode 가 쓰였는데 Db 가 없으면 garbage 다.","src":"22강 p.8~11","wiki":"crash 시나리오","diff":2,"tags":["crash 시나리오"],"pairs":[["Db 만","문제없음 (write 가 없었던 것과 같다)"],["I[v2] + B[v2]","metadata 는 맞지만 블록 5 가 garbage"],["I[v2] + Db","옛 bitmap 이라 다른 파일이 블록 5 를 가져갈 수 있다"],["B[v2] + Db","블록 5 가 어느 파일 것인지 모른다"]],"introCard":1},{"id":"u22a-11","type":"num","q":"[손으로] 세 쓰기 I[v2], B[v2], Db 중 정확히 하나 또는 정확히 둘만 디스크에 닿고 crash 가 나는 경우는 모두 몇 가지인가?","explain":"하나만 3가지(1a·1b·1c) + 둘만 3가지(2a·2b·2c) = 6.","src":"22강 p.8~11","wiki":"crash 시나리오","diff":1,"tags":["crash 시나리오"],"answer":6,"unit":"가지","tol":0,"introCard":0},{"id":"u22a-12","type":"mc","q":"[손으로] 파일 시스템이 append 의 쓰기 순서를 항상 Db → B[v2] → I[v2] 로 지킨다. 중간에 crash 가 나서 생길 수 있는 inconsistent 상태는?","explain":"가능한 중간 상태는 Db 만(1a, 문제없음)과 Db + B(2c)뿐이다. inode 를 마지막에 쓰니 garbage 를 가리키는 1b·2a 는 생기지 않는다. 2c 는 fsck 가 bit 5 를 0 으로 되돌려 고친다.","src":"22강 p.8~11 · 20강 p.23","wiki":"crash 시나리오","prof":true,"diff":3,"tags":["crash 시나리오"],"choices":["B[v2] + Db 만 쓰인 상태 (Case 2c)","I[v2] 만 쓰인 상태 (Case 1b)","I[v2] + B[v2] 만 쓰인 상태 (Case 2a)","없다"],"answer":0,"introCard":3},{"id":"u22a-13","type":"cloze","q":"원하는 것은 파일 시스템을 한 consistent state 에서 다른 consistent state 로 ___ 옮기는 것이지만, 디스크는 한 번에 쓰기 ___ 만 commit 한다.","explain":"Summary: crash 나 전원 차단이 쓰기들 사이에 올 수 있어서 쉽지 않다.","src":"22강 p.12 · 🎙 11/25 수업","wiki":"crash consistency","prof":true,"tags":["crash consistency"],"answer":["atomically","하나"],"bank":["atomically","하나","sequentially","여러 개","lazily"],"introCard":0},{"id":"u22a-14","type":"mc","q":"파일 시스템의 consistency 가 뜻하는 것으로 가장 알맞은 것은?","explain":"교수님(59:26~60:31): \"rather than consistency, it is much closer to the integrity\". bitmap 은 블록이 비었다는데 inode 는 쓰고 있다고 하면 inconsistent 다.","src":"22강 p.3 · 🎙 11/25 녹음 59:26","wiki":"crash consistency","prof":true,"diff":1,"tags":["crash consistency"],"choices":["data bitmap, inode, data block 처럼 서로 관련된 구조가 같은 사실을 말하는 것(integrity 에 가깝다)","모든 파일 내용이 최신인 것","디스크 쓰기가 순서대로 일어나는 것","파일 시스템이 디스크 하나에만 있는 것"],"answer":0,"introCard":0},{"id":"u22a-15","type":"tf","q":"프로세스의 메모리 자료구조도 파일 시스템처럼 crash consistency 를 보장해야 한다.","explain":"교수님(61:06~61:28): 프로세스 구조는 전원이 나가면 사라져도 되니(다시 실행하면 된다) crash consistency 가 필요 없다. 파일 시스템은 전원이 나간 뒤에도 남아야 하므로 필요하다.","src":"22강 p.3 · 🎙 11/25 녹음 61:06","wiki":"crash consistency","prof":true,"diff":1,"tags":["crash consistency"],"answer":false,"introCard":0},{"id":"u22a-16","type":"mc","q":"I[v2] 와 B[v2] 는 쓰이고 Db 만 못 쓰인 채 crash 가 난 경우를, I[v2] 만 쓰인 경우보다 덜 심각하게 보는 이유는?","explain":"Case 2a. 교수님(69:05~69:24): \"the problem is isolated into a single file … usually okay\". I[v2] 만 쓰인 1b 는 bitmap 이 블록 5 를 free 라고 해서 다른 파일까지 같은 블록을 받아 갈 수 있다(\"quite important\"). fsck 는 2a 의 garbage 를 못 찾는다.","src":"22강 p.8~10 · 🎙 11/25 녹음 69:05","wiki":"crash 시나리오","prof":true,"diff":2,"tags":["crash 시나리오"],"choices":["metadata 는 맞고 망가진 것은 그 파일 하나의 내용뿐이라 문제가 한 파일에 갇히기 때문","fsck 가 garbage 를 찾아 고쳐 주기 때문","블록 5 가 free 로 표시되기 때문","다른 파일이 블록 5 를 가져가기 때문"],"answer":0,"introCard":3},{"id":"u22a-17","type":"mc","q":"디스크가 inode 블록과 bitmap 블록을 한 번에(atomic 하게) 쓸 수 없는 이유로 맞는 것은?","explain":"교수님(70:41~71:09): 여러 블록의 atomic write 는 디스크에서 불가능하다. head 가 하나라 한 번에 한 블록. 디스크에 battery 가 있으면 남은 쓰기를 flush 할 전력이 있어 기회가 있지만 일반적으로는 안 된다. 그래서 fsck 와 journaling 이 나온다.","src":"22강 p.12 · 🎙 11/25 녹음 70:41","wiki":"crash consistency","prof":true,"diff":1,"tags":["crash consistency"],"choices":["head 가 하나라 한 번에 블록 하나만 쓴다","디스크는 4KB 보다 큰 블록을 못 쓴다","inode 와 bitmap 이 서로 다른 파티션에 있다","OS 가 디스크 쓰기를 막는다"],"answer":0,"introCard":0}],"intro":[{"title":"crash-consistency problem","body":"파일 시스템 자료구조는 **persist** 한다: 전원이 꺼져도 남고 다음 부팅에 그대로 읽힌다. 그런데 갱신 하나가 디스크 블록 여러 개를 바꾸고, 디스크는 **한 번에 한 블록씩** 쓴다. 그 사이 crash 가 나면 고치다 만 상태가 영원히 남는다. 원하는 것은 consistent state 사이를 **atomically** 옮기는 것.","src":"22강 p.3, p.12"},{"title":"예제: 4 KB append","body":"inode **2**(I[v1]: size 1, pointer 4), data block **4**(Da)짜리 파일에 블록 하나를 덧붙인다. bitmap 은 8 비트(0 번부터). 갱신 뒤: data bitmap 5 번 = 1 (**B[v2]**, 0000 1000 → 0000 1100), inode **I[v2]**(size 2, pointer 4·5), 블록 5 에 **Db**. inode bitmap 은 그대로.","img":"img/os22-p06-after-ans.png","imgAlt":"갱신 뒤: inode size 2, pointer 4·5, data bitmap 5 번 켜짐, 블록 5 에 Db","src":"22강 p.4~6"},{"title":"세 쓰기와 dirty 블록","body":"디스크에 따로 쓰는 것 셋: ① **I[v2]** ② **B[v2]** ③ **Db**. 성능 때문에 바로 안 쓰고 **page cache / buffer cache** 에 dirty 로 머물다 나중에 나간다. 그래서 한두 개만 쓰이고 crash 날 수 있다(inconsistent).","src":"22강 p.7"},{"title":"crash 시나리오 여섯","body":"**1a** Db 만: 문제없음(write 가 없었던 것). **1b** I 만: inode↔bitmap 불일치 + garbage. **1c** B 만: **space leak**. **2a** I+B: metadata 는 맞고 블록 5 가 garbage. **2b** I+Db: 옛 bitmap → 다른 파일이 5 를 가져갈 수 있음. **2c** B+Db: 어느 파일 것인지 모름. 규칙: inode 와 bitmap 중 하나만 쓰이면 불일치, inode 가 쓰였는데 Db 가 없으면 garbage. inode 를 마지막에 쓰면 1b·2a 가 안 생긴다.","src":"22강 p.8~11"}]},{"id":"u22b","title":"fsck: 디스크 전체 검사","items":[{"id":"u22b-01","type":"sa","q":"fsck 의 full term 은?","explain":"불일치를 찾아 고치는 Unix 도구.","src":"22강 p.14","wiki":"fsck","diff":1,"tags":["fsck"],"answer":"file system checker","alts":["filesystemchecker","file system check"],"introCard":0},{"id":"u22b-02","type":"mc","q":"fsck 는 언제 실행되나?","explain":"mount 전이라 실행 중 다른 파일 시스템 활동이 없다. 끝나면 디스크의 파일 시스템은 consistent 해야 한다.","src":"22강 p.14","wiki":"fsck","tags":["fsck"],"choices":["파일 시스템을 mount 하기 전","파일을 쓸 때마다","checkpoint 직후","mount 한 뒤 백그라운드에서"],"answer":0,"introCard":0},{"id":"u22b-03","type":"tf","q":"fsck 는 inode 와 bitmap 이 서로 맞는데 블록 내용이 garbage 인 경우(I + B 는 쓰이고 Db 는 못 쓰임)도 찾아내 고친다.","explain":"Case 2a 는 못 고친다. fsck 의 목표는 metadata 의 internal consistency 이고, 사용자 데이터가 맞는지는 모른다.","src":"22강 p.15","wiki":"fsck","tags":["fsck"],"answer":false,"introCard":0},{"id":"u22b-04","type":"cloze","q":"fsck 의 목표는 파일 시스템 ___ 가 internally ___ 하게 만드는 것이다.","explain":"그래서 data 가 틀린 경우는 못 고친다.","src":"22강 p.15","wiki":"fsck","tags":["fsck"],"answer":["metadata","consistent"],"bank":["metadata","consistent","data","atomic","durable"],"introCard":0},{"id":"u22b-05","type":"mc","q":"fsck 가 bitmap 과 inode 의 정보가 서로 다르다는 것을 발견했다. 어느 쪽을 믿고 고치나?","explain":"inode·indirect·double indirect block 을 훑어 실제로 쓰이는 블록을 구하고, bitmap 을 거기에 맞춘다(Case 1c, 2b).","src":"22강 p.16","wiki":"fsck","tags":["fsck"],"choices":["inode","bitmap","superblock","저널"],"answer":0,"introCard":1},{"id":"u22b-06","type":"num","q":"[손으로] crash 뒤 data bitmap 의 5 번 비트는 1 인데, 어떤 inode 도 블록 5 를 가리키지 않는다. fsck 가 고친 뒤 5 번 비트의 값은?","explain":"Case 1c. inode 를 믿으니 아무도 안 쓰는 블록 → 0 으로 해제. space leak 이 풀린다.","src":"22강 p.16","wiki":"fsck","tags":["fsck"],"answer":0,"tol":0,"introCard":1},{"id":"u22b-07","type":"num","q":"[손으로] crash 뒤 inode 2 는 블록 5 를 가리키고 블록 5 에는 새 데이터가 있는데, data bitmap 의 5 번 비트는 0 이다. fsck 가 고친 뒤 5 번 비트의 값은?","explain":"Case 2b. inode 가 가리키니 할당 표시(1)로 고친다. 이제 다른 파일이 5 를 가져갈 수 없다.","src":"22강 p.16","wiki":"fsck","tags":["fsck"],"answer":1,"tol":0,"introCard":1},{"id":"u22b-08","type":"mc","q":"[손으로] inode bitmap 이 1110 0000 (0 번 비트부터)이다. 어떤 디렉터리의 엔트리는 \".\", \"..\", \"a\" 이고 각각 inode 2, 1, 5 를 가리킨다. fsck 의 디렉터리 검사에 걸리는 것은?","explain":"비트 0·1·2 만 1 이라 inode 5 는 free 다. 엔트리가 가리키는 inode 가 할당됐는지 검사하는 항목에 걸린다. \".\" 와 \"..\" 는 첫 두 엔트리로 맞다.","src":"22강 p.17","wiki":"fsck","diff":3,"tags":["fsck"],"choices":["\"a\" 가 할당되지 않은 inode 5 를 가리킨다","\".\" 가 첫 엔트리가 아니다","inode 1 이 할당되지 않았다","문제없다"],"answer":0,"introCard":2},{"id":"u22b-09","type":"tf","q":"fsck 는 필드가 깨져서 쉽게 고칠 수 없는 inode 를 suspect 로 보고 지워 버린다(clear).","explain":"Inode state 검사: type 확인 등, 고칠 수 없으면 clear.","src":"22강 p.16","wiki":"fsck","diff":1,"answer":true,"introCard":1},{"id":"u22b-10","type":"mc","q":"fsck 의 디렉터리 검사 항목으로 맞는 것은?","explain":"디렉터리는 파일 시스템이 직접 만든 형식이라 검사할 수 있다. 사용자 파일 내용은 fsck 가 이해하지 못한다.","src":"22강 p.17","wiki":"fsck","tags":["fsck"],"choices":["\".\" 와 \"..\" 가 첫 두 엔트리인지","사용자 파일 내용의 형식이 맞는지","저널의 TxE 가 있는지","파일 이름이 알파벳 순인지"],"answer":0,"introCard":2},{"id":"u22b-11","type":"mc","q":"fsck 의 더 크고 근본적인 문제는?","explain":"Summary: 디스크 전체 스캔에 몇 분~몇 시간 → prohibitive. 그래서 journaling 이 나왔다.","src":"22강 p.18","wiki":"fsck","diff":1,"tags":["fsck"],"choices":["너무 느리다(디스크 전체를 훑는다)","모든 inode 를 지운다","mount 중에만 돈다","저널이 필요하다"],"answer":0,"introCard":3},{"id":"u22b-12","type":"tf","q":"fsck 는 사용자 파일의 내용까지 형식을 검사해서 깨진 파일을 복구한다.","explain":"fsck 는 사용자 파일 내용을 이해하지 못한다. 검사하는 것은 metadata 와 디렉터리 형식이다.","src":"22강 p.17","wiki":"fsck","diff":1,"answer":false,"introCard":2}],"intro":[{"title":"fsck 란","body":"**fsck** = **file system checker**. 불일치를 찾아 고치는 Unix 도구. superblock, free blocks, inode 상태, inode links 등을 검사. **mount 하기 전**에 돈다(다른 활동 없음). 목표는 **metadata 가 internally consistent** — 그래서 2a(metadata 는 맞고 data 가 garbage)는 못 고친다.","src":"22강 p.14~15"},{"title":"inode 를 믿는다","body":"Free blocks 검사: inode·indirect·double indirect block 을 훑어 실제로 쓰이는 블록을 구하고, bitmap 과 다르면 **inode 를 믿는다**. 1c(bitmap 만 1) → 비트를 0 으로, 2b(inode 가 가리키는데 비트 0) → 1 로. Inode state 검사: type 등이 깨져 못 고치는 inode 는 **suspect → clear**.","src":"22강 p.16"},{"title":"디렉터리 검사","body":"디렉터리는 파일 시스템이 정한 형식이라 내용까지 검사한다(사용자 파일 내용은 fsck 가 이해 못 함). 예: **\".\" 와 \"..\"** 가 첫 두 엔트리인가, 엔트리가 가리키는 inode 가 **할당**(inode bitmap 1)됐는가.","src":"22강 p.17"},{"title":"fsck 의 근본 문제","body":"제대로 만들려면 파일 시스템을 속속들이 알아야 하고, 무엇보다 **too slow**: 망가진 건 블록 몇 개인데 디스크 전체를 훑느라 몇 분~몇 시간 → prohibitive. 그래서 journaling.","src":"22강 p.18"}]},{"id":"u22c","title":"data journaling 과 recovery","items":[{"id":"u22c-01","type":"sa","q":"journaling 의 다른 이름, WAL 의 full term 은?","explain":"제자리 구조를 덮어쓰기 전에(ahead) 할 일을 log 에 먼저 적는다.","src":"22강 p.20","wiki":"data journaling","diff":1,"tags":["journaling"],"answer":"Write-Ahead Logging","alts":["writeaheadlogging","write ahead log"],"introCard":0},{"id":"u22c-02","type":"mc","q":"journaling 이 fsck 보다 crash 뒤 복구가 빠른 이유는?","explain":"p.20 마지막 줄: \"Know exactly what to fix after a crash, instead of having to scan the entire disk\". 쓰는 양은 오히려 늘어난다.","src":"22강 p.20","wiki":"data journaling","tags":["journaling"],"choices":["할 일을 미리 적어 둬서 고칠 곳만 알고 디스크 전체를 훑지 않는다","디스크에 쓰는 양이 적다","mount 전에 돌지 않는다","bitmap 을 쓰지 않는다"],"answer":0,"introCard":0},{"id":"u22c-03","type":"mc","q":"ext2 와 ext3 의 디스크 배치를 비교했다. ext3 에서 Super 와 Group 0 사이에 새로 들어간 칸(?)은?","explain":"ext3 의 새 핵심 구조는 journal 자체다. 파티션 안 작은 공간 또는 다른 장치에 둔다.","src":"22강 p.21","wiki":"data journaling","diff":1,"img":"img/os22-p21-ext3.png","imgAlt":"ext3 배치: Super, ?, Group 0, Group 1, …, Group N","explainImg":"img/os22-p21-ext3-ans.png","choices":["Journal","Inode bitmap","Superblock 사본","Extent tree"],"answer":0,"introCard":0},{"id":"u22c-04","type":"order","q":"data journaling 에서 transaction 하나가 저널에 쓰이는 블록 순서","explain":"TxB(TID) 로 시작해 바꿀 블록 내용(physical logging), TxE(같은 TID) 로 끝난다.","src":"22강 p.23","wiki":"data journaling","tags":["journaling"],"answer":["TxB","I[v2]","B[v2]","Db","TxE"],"introCard":1},{"id":"u22c-05","type":"match","q":"journaling 용어와 뜻을 연결하시오","explain":"TxB 와 TxE 의 TID 가 같아야 한 transaction 으로 짝이 맞는다. 블록을 통째로 적으니 physical logging 이다.","src":"22강 p.23~24","wiki":"data journaling","tags":["journaling"],"pairs":[["TxB","transaction 시작 블록, TID 를 담는다"],["TxE","transaction 끝 블록, 같은 TID 를 담는다"],["physical logging","바꿀 블록 내용을 그대로 저널에 적기"],["checkpoint","저널에 쓴 블록을 최종 위치에 덮어쓰기"]],"introCard":1},{"id":"u22c-06","type":"num","q":"data journaling 에서 append 한 번의 새 data block(Db)은 디스크에 모두 몇 번 쓰이나?","explain":"저널에 한 번(journal write), 최종 위치 블록 5 에 한 번(checkpoint).","src":"22강 p.22~24","wiki":"data journaling","diff":1,"tags":["journaling"],"answer":2,"unit":"번","tol":0,"introCard":0},{"id":"u22c-07","type":"tf","q":"TxB, I[v2], B[v2], Db, TxE 다섯 블록을 한 번의 sequential write 로 동시에 내보내면 빠르고 안전하다.","explain":"빠르지만 unsafe 다. 디스크가 내부에서 순서를 바꿔 TxE 를 Db 보다 먼저 쓸 수 있다(그림의 ?? 자리).","src":"22강 p.27","wiki":"journal commit과 recovery","img":"img/os22-p27-unsafe.png","imgAlt":"저널: TxB, I[v2], B[v2], ??, TxE","answer":false,"introCard":1},{"id":"u22c-08","type":"mc","q":"[손으로] 다섯 블록을 한 번에 보냈더니 디스크가 TxB, I[v2], B[v2], TxE 를 먼저 쓰고 Db 를 쓰기 전에 전원이 나갔다. 재부팅 뒤 recovery 는?","explain":"transaction 이 유효해 보이고, 파일 시스템은 Db 자리가 garbage 인 줄 모른다. superblock 같은 블록이면 더 나쁘다. 그래서 TxE 를 따로 쓴다.","src":"22강 p.27","wiki":"journal commit과 recovery","diff":3,"tags":["recovery"],"choices":["TxE 가 있으니 replay 해서 garbage 가 블록 5 에 쓰인다","TxE 가 있지만 Db 가 없음을 알아채고 skip 한다","fsck 를 돌려 고친다","아무 일도 하지 않는다"],"answer":0,"introCard":2},{"id":"u22c-09","type":"order","q":"[손으로] TxE 를 따로 쓰도록 고친 뒤의 세 단계 순서","explain":"TxE 를 앞 블록들이 다 쓰인 뒤에 따로 쓰니, TxE 가 있으면 transaction 이 온전하다.","src":"22강 p.29","wiki":"journal commit과 recovery","tags":["recovery"],"answer":["Journal write (TxB, data, metadata) 후 대기","Journal commit (TxE)","Checkpoint (최종 위치에)"],"introCard":1},{"id":"u22c-10","type":"mc","q":"[손으로] 재부팅 뒤 저널에 TxB(id=7), I[v2], B[v2], Db 는 있는데 TxE(id=7) 가 없다. recovery 는 무엇을 하고, 디스크의 inode 2 는 어떤 판인가?","explain":"commit 전 crash 라 그 갱신은 건너뛴다. 제자리는 checkpoint 전이라 한 번도 안 건드렸으니 옛 판 그대로, consistent.","src":"22강 p.30","wiki":"journal commit과 recovery","diff":2,"tags":["recovery"],"choices":["skip, inode 2 는 I[v1]","replay, inode 2 는 I[v2]","skip, inode 2 는 I[v2]","fsck 실행, inode 2 는 지워짐"],"answer":0,"introCard":3},{"id":"u22c-11","type":"mc","q":"[손으로] 저널에 TxB(id=7) … TxE(id=7) 가 다 있고, checkpoint 도중이라 제자리에는 I[v2] 만 쓰였다. recovery 뒤 inode·bitmap·블록 5 의 상태는?","explain":"commit 된 transaction 은 replay. 저널의 블록을 순서대로 제자리에 다시 쓰니 이미 쓴 I[v2] 를 또 써도 결과가 같다.","src":"22강 p.30","wiki":"journal commit과 recovery","diff":2,"tags":["recovery"],"choices":["셋 다 새 판 (I[v2] 도 한 번 더 쓰인다)","I[v2] 만 새 판","셋 다 옛 판으로 되돌린다","bitmap 만 옛 판"],"answer":0,"introCard":1},{"id":"u22c-12","type":"tf","q":"두 단계 쓰기에서 파일 시스템은 TxB, I[v2], B[v2], Db 의 쓰기가 끝난 것을 확인한 뒤에 TxE 를 쓴다.","explain":"첫 단계는 TxE 를 뺀 전부, 둘째 단계는 TxE 하나. TxE 가 쓰이는 순간 commit 이다.","src":"22강 p.28","wiki":"journal commit과 recovery","img":"img/os22-p28-twostep.png","imgAlt":"두 단계 쓰기: 첫 줄 TxB id=1·I[v2]·B[v2]·Db, 둘째 줄에 TxE id=1 추가","answer":true,"introCard":2},{"id":"u22c-13","type":"sa","q":"TxE(transaction commit block)를 써서 transaction 을 확정하는 단계의 이름은? (2 words)","explain":"Journal write 와 Checkpoint 사이에 추가된 단계.","src":"22강 p.29","wiki":"journal commit과 recovery","tags":["recovery"],"answer":"Journal commit","alts":["commit","journalcommit"],"introCard":2}],"intro":[{"title":"WAL 과 ext3 저널","body":"**Write-Ahead Logging**: 제자리 구조를 덮어쓰기 **전에** 할 일을 little note 로 **log(journal)** 에 먼저 적는다. crash 뒤 고칠 곳을 정확히 알아 전체 스캔이 필요 없다. ext2 는 journaling 없음, ext3 = Super | **Journal** | Group 0 … Group N (파티션 안 또는 다른 장치).","img":"img/os22-p21-layout.png","imgAlt":"ext2: Super, Group 0~N / ext3: Super, Journal, Group 0~N","src":"22강 p.20~21"},{"title":"transaction 과 checkpoint","body":"저널: **TxB**(시작, **TID**) · I[v2] · B[v2] · Db(블록 내용 그대로 = **physical logging**) · **TxE**(끝, 같은 TID). 저널에 안전하게 쓴 뒤 같은 블록을 최종 위치에 쓰는 것이 **checkpoint**. data journaling 에서 Db 는 두 번 쓰인다.","img":"img/os22-p23-tx.png","imgAlt":"저널: TxB, I[v2], B[v2], Db, TxE","src":"22강 p.22~25"},{"title":"한 번에 쓰면 unsafe → Journal commit","body":"다섯 블록을 하나씩 쓰면 느리고, 한 번에 쓰면 디스크가 순서를 바꿔 TxE 를 Db 보다 먼저 쓸 수 있다 → TxE 가 있으니 유효해 보이는 transaction 으로 **garbage 를 replay**. 해법: TxE 를 뺀 블록을 먼저 쓰고 기다린 뒤 **TxE 를 따로** 쓴다(**Journal commit**). 순서: Journal write → Journal commit → Checkpoint.","img":"img/os22-p28-twostep.png","imgAlt":"두 단계: TxB·I[v2]·B[v2]·Db 를 먼저, 다음에 TxE","src":"22강 p.26~29"},{"title":"Recovery","body":"crash 뒤 저널을 훑는다. **TxE 가 없으면**(commit 전) 그 갱신은 **skip** — 제자리는 안 건드렸으니 옛 상태. **TxE 까지 있으면**(commit 뒤, checkpoint 완료 전) **replay**: 저널의 블록을 제자리에 다시 쓴다. 이미 쓴 블록을 또 써도 결과가 같다.","src":"22강 p.30"}]},{"id":"u22d","title":"circular log 와 journaling mode","items":[{"id":"u22d-01","type":"mc","q":"저널(log)이 가득 찼을 때 생기는 문제 두 가지로 맞는 것은?","explain":"Making the log finite: recovery 시간, 그리고 commit 불가로 파일 시스템이 useless.","src":"22강 p.31","wiki":"circular log","tags":["circular log"],"choices":["저널이 클수록 recovery 가 오래 걸리고, 가득 차면 더 commit 할 수 없다","TxB 가 지워지고 TID 가 겹친다","bitmap 이 커지고 inode 가 부족하다","fsck 가 돌지 않고 mount 가 실패한다"],"answer":0,"introCard":0},{"id":"u22d-02","type":"sa","q":"checkpoint 가 끝난 transaction 의 공간을 비워 저널을 처음부터 다시 쓰는 구조, 저널을 부르는 이름은? (2 words)","explain":"저널을 원형 자료구조로 재사용한다.","src":"22강 p.32","wiki":"circular log","diff":1,"tags":["circular log"],"answer":"circular log","alts":["circularlog","circular journal"],"introCard":0},{"id":"u22d-03","type":"mc","q":"저널 맨 앞의 journal superblock 이 가리키는 두 위치(? 두 칸)는?","explain":"아직 checkpoint 되지 않은 transaction 의 범위를 적는다.","src":"22강 p.33","wiki":"circular log","img":"img/os22-p33-jsuper.png","imgAlt":"Journal Super 에서 나온 두 화살표(이름이 가려짐)가 Tx1 과 Tx5 다음을 가리킨다","explainImg":"img/os22-p33-jsuper-ans.png","choices":["oldest 와 newest transaction","TxB 와 TxE","inode bitmap 과 data bitmap","첫 block group 과 마지막 block group"],"answer":0,"introCard":1},{"id":"u22d-04","type":"tf","q":"아직 checkpoint 가 끝나지 않은 transaction 의 저널 칸도 free 해서 새 transaction 에 내줄 수 있다.","explain":"제자리에 아직 반영이 안 됐는데 저널 사본을 지우면 crash 때 replay 할 것이 없어진다. free 는 checkpoint 가 끝난 transaction 만.","src":"22강 p.32","wiki":"circular log","tags":["circular log"],"answer":false,"introCard":0},{"id":"u22d-05","type":"order","q":"[손으로] 유한한 저널을 쓰는 journaling 의 최종 네 단계 순서","explain":"Free 는 checkpoint 뒤 \"some time later\", journal superblock 을 고쳐 transaction 을 free 로 표시한다.","src":"22강 p.34","wiki":"circular log","prof":true,"tags":["circular log"],"answer":["Journal write","Journal commit","Checkpoint","Free"],"introCard":1},{"id":"u22d-06","type":"num","q":"[손으로] 칸이 8 개(0~7 번)인 circular log 에 Tx1~Tx8 이 0~7 번 칸에 차 있다. Tx1~Tx3 의 checkpoint 가 끝나 free 했다. 다음 Tx9 는 몇 번 칸에 쓰이나?","explain":"newest 가 7 번 칸(끝)이니 처음으로 돌아와(wrap) Tx1 이 있던 0 번 칸.","src":"22강 p.32~33","wiki":"circular log","diff":2,"tags":["circular log"],"answer":0,"unit":"번","tol":0,"introCard":0},{"id":"u22d-07","type":"mc","q":"[손으로] 칸이 8 개인 circular log 에 Tx1~Tx8 이 차 있고, Tx1~Tx3 의 checkpoint 가 끝나 free 했다. journal superblock 의 oldest 는 무엇을 가리키나?","explain":"free 는 oldest 를 앞으로 옮기는 것. 아직 checkpoint 안 된 가장 오래된 것이 Tx4.","src":"22강 p.33~34","wiki":"circular log","diff":2,"tags":["circular log"],"choices":["Tx4","Tx1","Tx3","Tx8"],"answer":0,"introCard":0},{"id":"u22d-08","type":"num","q":"[손으로] 칸이 8 개(0~7)인 circular log 에서 3~7 번 칸에 checkpoint 안 된 Tx4~Tx8 이 있고 0~2 번 칸은 free 다. Tx9, Tx10 을 쓴 뒤 남는 빈칸은 몇 개인가?","explain":"Tx9 → 0 번, Tx10 → 1 번. 빈칸은 2 번 하나. Tx4~Tx8 칸은 checkpoint 전이라 쓸 수 없다.","src":"22강 p.31~34","wiki":"circular log","diff":3,"tags":["circular log"],"answer":1,"unit":"개","tol":0,"introCard":0},{"id":"u22d-09","type":"match","q":"ext3/4 journaling mode 와 설명을 연결하시오","explain":"Ordered 와 Writeback 은 둘 다 metadata 만 저널링한다. 차이는 data 를 metadata 보다 먼저 쓰도록 순서를 지키느냐다.","src":"22강 p.35","wiki":"ext3 journaling mode","tags":["journaling mode"],"pairs":[["Ordered","기본값. metadata 만 저널, data 는 그 전에 최종 위치에"],["Writeback","metadata 만 저널, data 는 순서 상관없이"],["Journal","data 와 metadata 모두 저널에 먼저"],["fsck","저널 없이 crash 뒤 디스크 전체를 검사"]],"introCard":2},{"id":"u22d-10","type":"mc","q":"ext3/4 의 기본(default) journaling mode 는?","explain":"Ordered (default). metadata 만 저널링하되 data 를 먼저 제자리에 쓴다.","src":"22강 p.35","wiki":"ext3 journaling mode","diff":1,"tags":["journaling mode"],"choices":["Ordered","Writeback","Journal","Data"],"answer":0,"introCard":2},{"id":"u22d-11","type":"mc","q":"[손으로] 어떤 모드의 쓰기 순서다: Db(최종 위치) → TxB, I[v2], B[v2](저널) → TxE → I[v2], B[v2](최종 위치). 어느 모드인가?","explain":"Db 가 저널에 안 들어가고(metadata 만 저널), metadata commit 보다 먼저 제자리에 쓰였다 → Ordered. Journal 모드라면 Db 도 저널에 들어간다.","src":"22강 p.35","wiki":"ext3 journaling mode","diff":2,"tags":["journaling mode"],"choices":["Ordered","Journal","Writeback","fsck"],"answer":0,"introCard":2},{"id":"u22d-12","type":"tf","q":"Writeback 모드에서는 data 가 metadata commit 보다 늦게 쓰일 수 있어서, crash 뒤 inode 가 garbage 블록을 가리킬 수 있다.","explain":"data 순서를 지키지 않으니 I[v2] 는 replay 되는데 Db 는 없는 상태(Case 2a 와 같은 모양)가 생길 수 있다. Ordered 는 Db 를 먼저 써서 이를 막는다.","src":"22강 p.35","wiki":"ext3 journaling mode","diff":2,"tags":["journaling mode"],"answer":true,"introCard":2},{"id":"u22d-13","type":"sa","q":"ext3/4 에서 사용자 data 까지 저널에 먼저 쓰고 그다음 최종 위치에 쓰는 모드의 이름은? (한 단어)","explain":"Journal 모드 = data journaling. 가장 안전하지만 data 를 두 번 쓴다.","src":"22강 p.35","wiki":"ext3 journaling mode","tags":["journaling mode"],"answer":"Journal","alts":["data journaling","journal mode"],"introCard":2}],"intro":[{"title":"유한한 저널과 circular log","body":"저널이 크면 recovery 가 오래 걸리고, 가득 차면 더 commit 할 수 없다(useless). 그래서 **circular log**: checkpoint 가 끝난 transaction 의 공간을 **free** 해서 처음부터 다시 쓴다(끝에 닿으면 앞으로 wrap). checkpoint 전 transaction 은 free 하면 안 된다.","src":"22강 p.31~32"},{"title":"journal superblock 과 4 단계","body":"저널 맨 앞 **journal superblock** 이 **oldest·newest** transaction 을 적는다 = 아직 checkpoint 안 된 범위. free = oldest 를 앞으로 옮기기. 최종 순서: **Journal write → Journal commit → Checkpoint → Free**(some time later).","img":"img/os22-p33-jsuper-ans.png","imgAlt":"Journal Super 의 oldest·newest 화살표와 Tx1~Tx5","src":"22강 p.33~34"},{"title":"ext3/4 journaling mode","body":"**Ordered**(기본): metadata 만 저널, data 는 metadata 를 저널에 쓰기 **전에** 최종 위치에. **Writeback**: metadata 만 저널, data 순서 상관없음 → inode 가 garbage 를 가리킬 수 있다. **Journal**: data 와 metadata 모두 저널에 먼저(data 를 두 번 씀).","src":"22강 p.35"}]}]},{"id":"ua","title":"과제 2·3 개념 (xv6 lock · COW · superpage)","desc":"퀴즈 대비: kalloc per-CPU · bcache 해시 · COW fork · refcount · megapage","lessons":[{"id":"uaa","title":"과제2 ① kalloc per-CPU free list","items":[{"id":"uaa-01","type":"mc","q":"kalloctest 가 출력하는 `#test-and-set` 이 세는 것은?","explain":"lk->nts. contention 의 척도다. acquire() 호출 횟수는 #acquire() (lk->n).","src":"위키 과제2 퀴즈 대비 Q1","wiki":"lock contention","prof":true,"tags":["contention"],"choices":["이미 다른 CPU 가 쥔 lock 때문에 test-and-set 루프가 실패해 다시 돈 횟수","acquire() 호출 횟수","kalloc() 호출 횟수","free page 수"],"answer":0,"introCard":0},{"id":"uaa-02","type":"tf","q":"과제 2 의 lock 이름을 \"kmem\"/\"bcache\" 로 시작하게 해야 하는 이유는 statslock() 이 그 접두어 lock 의 nts 만 tot 에 합산하기 때문이다.","explain":"이름이 다르면 그 lock 의 contention 은 아예 측정되지 않는다.","src":"위키 과제2 퀴즈 대비 Q2","wiki":"lock contention","prof":true,"answer":true,"introCard":0},{"id":"uaa-03","type":"mc","q":"cpuid() 결과를 쓰기 전에 push_off() 로 인터럽트를 끄는 이유는?","explain":"cpuid 직후 yield 로 프로세스가 다른 CP
