space","introCard":0},{"id":"u17a-02","type":"mc","q":"swap space 를 관리하는 단위는?","explain":"p.14. 교수님은 swap space 의 단위를 frame 대신 block 이라고 불렀다.","src":"17강 p.14, 11/9 녹음","wiki":"swap space","prof":true,"choices":["page-sized unit (block)","sector","segment","byte"],"answer":0,"introCard":0},{"id":"u17a-03","type":"cloze","q":"PTE 의 ___ bit 가 1 이면 page 가 물리 메모리에 있고, 0 이면 ___ 에 있다. 0 인 page 를 참조하면 ___ 가 난다.","explain":"p.16. Valid 0 + 주소 칸이 disk address 면 디스크에 있음, null 이면 아직 할당 안 됨.","src":"17강 p.16","wiki":"page fault","tags":["page fault"],"answer":["present","disk","page fault"],"bank":["present","disk","page fault","dirty","TLB","segmentation fault"],"img":"img/os17-p16-pte-swap.png","imgAlt":"swapping 을 지원하는 page table: Valid 칸, 물리 메모리 VP 1·2·7·4, 디스크 VP","introCard":1},{"id":"u17a-04","type":"mc","q":"page fault 를 \"fault\" 라고 부르는 이유는?","explain":"11/9 녹음: 복구할 수 있어서 fault. valid 0 이고 disk address 도 없으면 매핑이 없는 것 → abort.","src":"11/9 녹음","wiki":"page fault","prof":true,"tags":["page fault"],"choices":["recoverable 이기 때문","항상 프로세스를 죽이기 때문","하드웨어 결함이기 때문","TLB 가 실패해서"],"answer":0,"introCard":0},{"id":"u17a-05","type":"order","q":"page fault 의 control flow 를 순서대로 놓으시오 (그림의 단계 이름은 가려져 있다)","explain":"p.23 여섯 단계. 번호 순서 쓰기 문제 후보.","src":"17강 p.23","wiki":"page fault","prof":true,"tags":["page fault"],"img":"img/os17-p23-flow.png","imgAlt":"p.23 Page Fault Control Flow 그림 — 1~6 단계 이름이 가려져 있다","explainImg":"img/os17-p23-flow-ans.png","answer":["Reference: 명령이 page table 참조","Trap: present 0 이라 OS 로","Check storage: page 가 어디 있는지 확인","Get the page: 디스크에서 빈 frame 으로","Reset page table","Reinstruction: 그 명령 재실행"],"introCard":1},{"id":"u17a-06","type":"tf","q":"page fault 처리가 끝나면 CPU 는 fault 를 낸 명령의 다음 명령부터 실행한다.","explain":"fault 를 낸 바로 그 명령을 재실행(restart)한다. 이번에는 page hit 다. 시스템 콜은 다음 명령으로 간다.","src":"17강 p.22~23","wiki":"page fault","diff":2,"tags":["page fault"],"answer":false,"introCard":2},{"id":"u17a-07","type":"mc","q":"page fault handler 가 메모리가 꽉 찼을 때 내보낼 page 를 고르는 것을 무엇이라 하나?","explain":"p.20 \"OS page-fault handler selects a victim to be evicted (VP 4) – page replacement.\"","src":"17강 p.20","wiki":"page fault","choices":["page replacement (victim 선택)","prefetching","compaction","promotion"],"answer":0,"introCard":2},{"id":"u17a-08","type":"tf","q":"OS 는 page fault 처리 흐름(mechanism)과 어떤 page 를 내보낼지(policy)를 분리한다.","explain":"11/9 녹음. mechanism 과 policy 의 분리는 OS 설계의 반복되는 원칙이다.","src":"11/9 녹음","wiki":"page fault","prof":true,"answer":true,"introCard":2},{"id":"u17a-09","type":"mc","q":"software-managed TLB 에서 page fault 처리 흐름은 hardware-managed TLB 와 어떻게 다른가?","explain":"11/9 녹음 질문. HW-managed 는 page table walk 가 실패하면 fault.","src":"11/9 녹음","wiki":"page fault","prof":true,"diff":2,"choices":["흐름은 같고, TLB miss 에서 바로 OS 로 trap 해 OS 가 page table 을 본다는 점만 다르다","완전히 다른 흐름이다","page fault 가 생기지 않는다","하드웨어가 디스크를 직접 읽는다"],"answer":0,"introCard":2},{"id":"u17a-10","type":"match","q":"PTE 상태와 뜻을 연결하시오","explain":"p.16 그림의 Valid 칸과 주소 칸을 같이 읽는다.","src":"17강 p.16","wiki":"page fault","img":"img/os17-p16-pte-swap.png","imgAlt":"p.16 swapping 을 지원하는 page table — PTE 0~7, 물리 메모리, 디스크","pairs":[["Page hit","VM word 가 물리 메모리에 있음 (DRAM cache hit)"],["Page fault","VM word 가 물리 메모리에 없음 (DRAM cache miss)"],["Valid 0 + disk address","디스크에 있음"],["Valid 0 + null","아직 할당되지 않음"]],"introCard":1},{"id":"u17a-11","type":"tf","q":"동시에 running 인 프로세스 수는 코어 수만큼이고 나머지는 blocked·waiting 인데도 메모리를 차지한다 — 이것이 swapping 의 동기다.","explain":"11/9 녹음 p.11~15.","src":"11/9 녹음","wiki":"스와핑","prof":true,"answer":true,"introCard":0},{"id":"u17a-12","type":"mc","q":"page fault 는 누가 일으키는 exception 인가?","explain":"p.18. MMU 가 present 0 을 보고 exception 을 올리고 OS handler 가 처리한다.","src":"17강 p.18","wiki":"page fault","diff":1,"choices":["하드웨어(MMU)","OS 스케줄러","사용자 프로그램의 system call","디스크 컨트롤러"],"answer":0,"introCard":1},{"id":"u17a-13","type":"tf","q":"valid 0 이고 주소 칸이 null 인 PTE 는 그 page 가 디스크에 있다는 뜻이다.","explain":"null 이면 아직 할당되지 않은 page 다. 디스크에 있으면 주소 칸에 disk address 가 있다.","src":"17강 p.16","wiki":"page fault","diff":2,"answer":false,"introCard":1},{"id":"u17a-14","type":"num","q":"그림(PTE 0~7). valid 가 0 인데 주소 칸이 null 이 아닌(디스크 주소가 있는) PTE 는 몇 개인가?","explain":"PTE 3(→ 디스크 VP 3)과 PTE 6(→ 디스크 VP 6). 이 page 를 참조하면 page fault 가 나고 OS 가 디스크에서 가져온다. PTE 0·5 는 valid 0 + null = 아직 할당 안 된 page 라 접근하면 오류다.","src":"17강 p.16","wiki":"page fault","tags":["page fault"],"img":"img/os17-p16-pte-swap.png","imgAlt":"p.16 swapping 을 지원하는 page table — 아래 Value/Meaning 표는 가려져 있다","answer":2,"unit":"개","tol":0,"introCard":1},{"id":"u17a-15","type":"mc","q":"그림: VP 3 을 참조해 page fault 가 났고 handler 가 victim 으로 VP 4 를 골랐다. 처리가 끝난 뒤 PTE 3 과 PTE 4 는?","explain":"VP 4 를 디스크로 내보내고(VP 4 가 수정됐다면 써야 한다) 그 자리 PP 3 에 VP 3 을 올린다. PTE 4 는 디스크 주소를 가리키게 되고 null 이 아니다. 그다음 fault 를 낸 명령을 재실행하면 page hit.","src":"17강 p.19~22","wiki":"page fault","tags":["page fault"],"img":"img/os17-p20-fault.png","imgAlt":"p.20 page fault 처리 중 — VP 4 가 victim 으로 표시된 그림","choices":["PTE 3 valid 1(PP 3), PTE 4 valid 0(디스크 VP 4)","PTE 3 valid 0, PTE 4 valid 1","둘 다 valid 1","PTE 3 valid 1, PTE 4 valid 0 + null"],"answer":0,"introCard":1},{"id":"u17a-16","type":"num","q":"그림: 물리 메모리 frame 4개와 swap block 8개. Proc 3 의 page 중 지금 물리 메모리에 있는 것은 몇 개인가?","explain":"PFN 0~3 에는 Proc 0·1·2 만 있다. Proc 3 의 VPN 0·1 은 둘 다 swap space(Block 5, 7)에 있다 — 프로세스 전체가 swap out 될 수도 있다. 다시 돌 때 page fault 로 하나씩 올라온다.","src":"17강 p.15","wiki":"swap space","tags":["swap"],"img":"img/os17-p15-swapspace.png","imgAlt":"p.15 Physical Memory 와 Swap Space 의 page 배치","answer":0,"unit":"개","tol":0,"introCard":0},{"id":"u17a-17","type":"sa","q":"[용어] Brings the page into memory when it is accessed. (2 words, d… p…)","explain":"p.52. 미리 가져오는 것은 prefetching. \"접근할 때 비로소\" 가 핵심어다.","src":"17강 p.52","wiki":"demand paging","tags":["page fault"],"answer":"demand paging","introCard":0}],"intro":[{"title":"swap space","body":"메모리에 다 못 올리는 page 를 둘 디스크 공간 = **swap space**. OS 는 page-sized unit(block)으로 위치를 기억한다. 동시에 running 인 프로세스는 코어 수만큼이고 나머지는 기다리면서도 메모리를 차지하므로, 안 쓰는 page 를 디스크로 내보낸다. 프로세스 전체가 swap out 돼 있을 수도 있다.","img":"img/os17-p15-swapspace.png","imgAlt":"물리 메모리 frame 4개와 swap space block 8개의 page 배치","src":"17강 p.12~15"},{"title":"present bit 와 page fault","body":"PTE 의 **present(valid) bit** 1 = 물리 메모리에 있음(page hit), 0 = 없음. 0 이면서 주소 칸이 **disk address** 면 디스크에 있는 page — 참조하면 하드웨어(MMU)가 **page fault** exception 을 올린다. 0 + **null** 이면 아직 할당 안 된 page(접근하면 오류). page fault 는 recoverable 이라 fault 라 부른다.","img":"img/os17-p16-pte-swap.png","imgAlt":"swapping 을 지원하는 page table: PTE 0~7, 물리 메모리 VP 1·2·7·4, 디스크","src":"17강 p.16~18"},{"title":"page fault 처리 흐름","body":"1 Reference(명령이 page table 참조) → 2 Trap(present 0 → OS) → 3 Check storage(page 가 어디 있나) → 4 Get the page(디스크에서 빈 frame 으로, 꽉 찼으면 **page replacement** 로 victim 을 내보냄) → 5 Reset page table → 6 **Reinstruction**: fault 를 낸 바로 그 명령을 재실행(다음 명령이 아님). mechanism(흐름)과 policy(무엇을 내보낼지)를 분리한다.","img":"img/os17-p23-flow-ans.png","imgAlt":"Page Fault Control Flow 그림 1~6","src":"17강 p.19~23"}]},{"id":"u17b","title":"EAT · working set · swap daemon","items":[{"id":"u17b-01","type":"cloze","q":"EAT = (1 − p) × ___ + p × ___ (p = page-fault rate)","explain":"p.25. 가정: memory access 200 ns, page-fault time 8 ms.","src":"17강 p.25","wiki":"effective access time","tags":["EAT"],"answer":["memory access time","page-fault time"],"bank":["memory access time","page-fault time","TLB lookup time","seek time"],"introCard":0},{"id":"u17b-02","type":"num","q":"memory access 200 ns, page-fault time 8 ms, p = 1/1000 일 때 EAT 는 몇 ns 인가?","explain":"(1 − 0.001) × 200 + 0.001 × 8,000,000 = 199.8 + 8000 = 8199.8 ns ≈ 8.2 µs.","src":"17강 p.25~26","wiki":"effective access time","prof":true,"tags":["EAT"],"answer":8199.8,"unit":"ns","tol":0.001,"introCard":0},{"id":"u17b-03","type":"num","q":"memory access 200 ns, page-fault time 8 ms, page fault rate 1/1000 이면 EAT ≈ 8199.8 ns 다. 메모리 접근(200 ns)보다 몇 배 느린가? (정수로)","explain":"8199.8 / 200 ≈ 41. 슬라이드의 \"factor of 40\" 을 교수님이 41 로 정정했다.","src":"17강 p.26, 11/9 녹음","wiki":"effective access time","prof":true,"tags":["EAT"],"answer":41,"unit":"배","tol":0.01,"introCard":0},{"id":"u17b-04","type":"num","q":"memory access 200 ns, page-fault time 8 ms, p = 1/10,000 일 때 EAT 는 몇 ns 인가?","explain":"EAT = 200 + 7,999,800 × 0.0001 = 200 + 799.98 = 999.98 ns (약 5배).","src":"위키 effective access time 퀴즈","wiki":"effective access time","tags":["EAT"],"answer":999.98,"unit":"ns","tol":0.001,"introCard":0},{"id":"u17b-05","type":"num","q":"memory access 100 ns, page-fault time 10 ms, p = 0.0001 일 때 EAT 는 몇 ns 인가?","explain":"(1 − 0.0001) × 100 + 0.0001 × 10,000,000 = 99.99 + 1000 = 1099.99 ns.","src":"17강 p.25 식 적용","wiki":"effective access time","diff":2,"tags":["EAT"],"answer":1099.99,"unit":"ns","tol":0.001,"introCard":0},{"id":"u17b-06","type":"mc","q":"200 ns / 8 ms 조건에서 성능 저하를 10% 이내로 하려면 page fault 는 몇 번에 1번 미만이어야 하나?","explain":"200 + 7,999,800p \u003c 220 → p \u003c 20/7,999,800 ≈ 2.5 × $10^{-6}$ → 400,000번에 1번.","src":"17강 p.26","wiki":"effective access time","prof":true,"diff":2,"choices":["400,000번","40,000번","1,000번","4,000,000번"],"answer":0,"introCard":0},{"id":"u17b-07","type":"tf","q":"0.1% miss rate 는 TLB·cache 에서는 쓸 만하지만 page fault rate 로는 받아들일 수 없다.","explain":"11/9 녹음. disk 는 DRAM 보다 약 10,000배 느려서 miss 하나가 너무 비싸다.","src":"11/9 녹음","wiki":"effective access time","prof":true,"answer":true,"introCard":0},{"id":"u17b-08","type":"mc","q":"page 교체 정책(replacement policy)을 하드웨어가 아니라 OS 소프트웨어로 만드는 이유는?","explain":"11/9 녹음. TLB 는 miss 비용이 작아 HW 로 단순하게(fully associative) 한다.","src":"11/9 녹음","wiki":"페이지 교체 정책","prof":true,"choices":["miss 비용이 DRAM 의 약 10,000배라 정교하고 비싼 알고리즘을 써도 이득이라서","하드웨어가 디스크를 못 읽어서","TLB 와 같은 이유로","SW 가 항상 더 빨라서"],"answer":0,"introCard":0},{"id":"u17b-09","type":"sa","q":"\"Performance meltdown where pages are swapped in and out continuously\" 를 뜻하는 용어는?","explain":"p.27. working set size > main memory size 일 때 일어난다.","src":"17강 p.27","wiki":"working set과 thrashing","tags":["thrashing"],"img":"img/os17-p54-thrash.png","imgAlt":"p.54 degree of multiprogramming 에 따른 CPU utilization — 급락 구간 이름이 가려져 있다","answer":"thrashing","introCard":0},{"id":"u17b-10","type":"tf","q":"Oversubscription(할당된 가상 메모리 > 물리 메모리)이면 반드시 thrashing 이 난다.","explain":"교수님: oversubscription 은 필요조건이지 충분조건이 아니다. thrashing 은 working set > 메모리일 때. 할당된 메모리가 전부 hot 하진 않다.","src":"11/11 녹음","wiki":"working set과 thrashing","prof":true,"diff":2,"tags":["thrashing"],"answer":false,"introCard":1},{"id":"u17b-11","type":"mc","q":"메모리가 모자랄 때 서버에서 흔히 쓰는 swapping 운영 방식은?","explain":"11/9 녹음 \"They choose to die\". thrashing 은 응답이 없어 원인 찾기도 어렵다. 데스크톱·폰에서는 swapping 이 효과적.","src":"11/9 녹음","wiki":"working set과 thrashing","prof":true,"choices":["보통 swapping 을 끈다 — 메모리가 모자라면 죽는 쪽을 택한다","항상 swap space 를 최대로 늘린다","THP 를 켠다","swap daemon 의 HW 를 LW 와 같게 둔다"],"answer":0,"introCard":2},{"id":"u17b-12","type":"cloze","q":"swap daemon 은 빈 page 가 ___ Watermark 보다 적어지면 깨어나고, ___ Watermark 만큼 비면 잠든다.","explain":"p.28. 여기서 HW 는 High Watermark 이지 hardware 가 아니다.","src":"17강 p.28","wiki":"swap daemon","tags":["swap daemon"],"answer":["Low","High"],"bank":["Low","High","Middle","Hardware","Zero"],"introCard":2},{"id":"u17b-13","type":"mc","q":"swap daemon 의 Low Watermark(LW)와 High Watermark(HW)를 서로 다르게 두는 이유는?","explain":"11/9 녹음. 같으면 free page 가 한 장만 모자라도 thread 가 깨어나 한 장만 회수한다. \"배고프면 배부를 때까지 먹는다.\" 두 번째 보기는 학생 답(\"one direction\").","src":"11/9 녹음","wiki":"swap daemon","prof":true,"diff":2,"choices":["background thread 를 부르는 횟수(overhead)를 줄이려고","나중에 메모리가 더 필요할 수 있어서","dirty page 를 줄이려고","TLB flush 를 피하려고"],"answer":0,"introCard":2},{"id":"u17b-14","type":"mc","q":"thrashing(working set 이 메모리보다 커서 page 가 계속 들락날락)에 대한 대처로 옳은 것은?","explain":"p.54 \"Decide not to run a subset of processes\". 남은 프로세스의 working set 이 메모리에 들어가게 한다.","src":"17강 p.54","wiki":"working set과 thrashing","choices":["일부 프로세스를 돌리지 않는다","swap space 를 줄인다","page 크기를 줄인다","TLB 를 키운다"],"answer":0,"introCard":1},{"id":"u17b-15","type":"sa","q":"[용어] At any point in time, programs tend to access a set of active virtual pages called the ___. (2 words, w… s…)","explain":"p.27. temporal locality 가 좋을수록 working set 이 작다. working set size > main memory size 면 thrashing.","src":"17강 p.27","wiki":"working set과 thrashing","tags":["thrashing"],"answer":"working set","introCard":1},{"id":"u17b-16","type":"num","q":"[규칙 적용] memory access 200 ns, page-fault time 8 ms. 성능 저하를 20% 이내(EAT \u003c 240 ns)로 하려면 page fault 가 약 몇 번에 1번 미만이어야 하나?","explain":"200 + 7,999,800p \u003c 240 → p \u003c 40 / 7,999,800 ≈ 5.0 × $10^{-6}$ → 약 200,000번에 1번. 10% 일 때(400,000번)의 절반이다. 식 EAT = 200 + 7,999,800p 는 p.25.","src":"17강 p.25~26 규칙 적용","wiki":"effective access time","diff":2,"tags":["EAT"],"answer":200000,"unit":"번","tol":0.01,"introCard":0}],"intro":[{"title":"EAT","body":"$EAT = (1-p) \\times$ memory access $+ p \\times$ page-fault time ($p$ = page-fault rate). 200 ns, 8 ms 면 $EAT = 200 + 7{,}999{,}800\\,p$ (ns). p = 1/1000 → 8199.8 ns ≈ 8.2 µs, 약 41배 느림. 성능 저하 10% 이내(EAT \u003c 220)면 p \u003c 2.5 × $10^{-6}$ — 400,000번에 1번. 디스크가 DRAM 보다 약 10,000배 느려 miss 하나가 매우 비싸다 → 교체 정책을 정교한 SW 로.","src":"17강 p.24~26"},{"title":"working set 과 thrashing","body":"**working set** = 지금 프로그램이 쓰는 active page 들. working set size > 메모리면 **thrashing**: page 가 계속 들락날락하는 performance meltdown. oversubscription(할당 > 물리 메모리)은 필요조건일 뿐이다. 대처: 일부 프로세스를 돌리지 않아 남은 working set 이 들어가게. 서버는 흔히 swapping 을 끄고 차라리 죽는 쪽을 택한다.","img":"img/os17-p54-thrash.png","imgAlt":"degree of multiprogramming 에 따른 CPU utilization 급락","src":"17강 p.27, 54"},{"title":"swap daemon","body":"메모리가 꽉 찰 때까지 기다리지 않고, free page 가 **Low Watermark(LW)** 보다 적어지면 background thread(swap/page daemon)가 깨어나 **High Watermark(HW)** 만큼 빌 때까지 내보낸다. LW ≠ HW 로 두는 이유: 같으면 한 장 모자랄 때마다 깨어나 한 장씩 회수 — thread 호출 overhead 가 커진다. (HW 는 hardware 가 아니다.)","src":"17강 p.28"}]},{"id":"u17c","title":"교체 정책 손으로 돌리기","items":[{"id":"u17c-01","type":"match","q":"교체 정책과 내보내는 page 를 연결하시오","explain":"p.30~49 정책 다섯 가지.","src":"17강 p.30~49","wiki":"페이지 교체 정책","tags":["교체 정책"],"pairs":[["Optimal","가장 먼 미래에 쓸 page"],["FIFO","가장 먼저 들어온 page"],["LRU","가장 오래전에 쓴 page"],["Random","무작위"],["Clock","reference bit 가 0 인 page"]],"introCard":0},{"id":"u17c-02","type":"num","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개, 처음엔 비어 있음. Optimal 의 hit 수는?","explain":"0 1 2 miss, 0 1 hit, 3 miss(가장 늦게 쓸 2 를 뺌), 0 3 1 hit, 2 miss(0 과 3 동률), 1 hit → hit 6.","src":"17강 p.32","wiki":"Optimal 교체","prof":true,"tags":["교체 정책"],"img":"img/os17-p32-opt.png","imgAlt":"p.32 Optimal 트레이스 표 — 6번째 접근부터 결과가 가려져 있다","explainImg":"img/os17-p32-opt-ans.png","answer":6,"unit":"번","tol":0,"introCard":1},{"id":"u17c-03","type":"num","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개, 처음엔 비어 있음. Optimal 의 hit rate 는 몇 % 인가? (소수 첫째 자리)","explain":"6/11 = 54.545…% → 54.5%. 슬라이드의 54.6% 는 반올림 오류라 교수님도 \"맞는지 모르겠다\"고 했다.","src":"17강 p.32, 11/9 녹음","wiki":"Optimal 교체","prof":true,"tags":["교체 정책"],"answer":54.5,"unit":"%","tol":0.002,"img":"img/os17-gen-u17c-03.png","imgAlt":"Optimal 트레이스 빈 표: 참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개","introCard":1},{"id":"u17c-04","type":"num","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개, 처음엔 비어 있음. FIFO 의 hit 수는?","explain":"0 1 2 miss, 0 1 hit, 3 miss(0 뺌), 0 miss(1 뺌), 3 hit, 1 miss(2 뺌), 2 miss(3 뺌), 1 hit → hit 4 (36.4%).","src":"17강 p.34","wiki":"FIFO 교체","prof":true,"tags":["교체 정책"],"img":"img/os17-p34-fifo.png","imgAlt":"p.34 FIFO 트레이스 표 — 6번째 접근부터 결과가 가려져 있다","explainImg":"img/os17-p34-fifo-ans.png","answer":4,"unit":"번","tol":0,"introCard":1},{"id":"u17c-05","type":"num","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개, 처음엔 비어 있음. LRU 의 hit 수는?","explain":"0 1 2 miss, 0 1 hit, 3 miss(2 뺌), 0 3 1 hit, 2 miss(0 뺌), 1 hit → hit 6. OPT 와 같지만 교수님은 이 예가 LRU 가 좋은 진짜 이유(burst)를 보여 주진 않는다고 했다.","src":"17강 p.39","wiki":"LRU","prof":true,"tags":["교체 정책"],"img":"img/os17-p39-lru.png","imgAlt":"p.39 LRU 트레이스 표 — 6번째 접근부터 결과가 가려져 있다","explainImg":"img/os17-p39-lru-ans.png","answer":6,"unit":"번","tol":0,"introCard":1},{"id":"u17c-06","type":"sa","q":"어떤 정책도 피할 수 없는, 처음 올리는 page 의 miss 를 무엇이라 하나? (cold miss 라고도 함)","explain":"11/9 녹음: 처음 세 miss = compulsory miss (cold miss).","src":"17강 p.32, 11/9 녹음","wiki":"Optimal 교체","prof":true,"answer":"compulsory miss","alts":["cold miss","compulsory"],"introCard":0},{"id":"u17c-07","type":"num","q":"참조열 1 2 3 4 1 2 5 1 2 3 4 5, FIFO, frame 3개일 때 page fault 수는?","explain":"1 2 3 4(1 뺌) 1(2 뺌) 2(3 뺌) 5(4 뺌) 1·2 hit 3(1 뺌) 4(2 뺌) 5 hit → fault 9.","src":"위키 FIFO 교체 (OSTEP 22장)","wiki":"FIFO 교체","diff":2,"tags":["Belady"],"answer":9,"unit":"번","tol":0,"img":"img/os17-gen-u17c-07.png","imgAlt":"FIFO 트레이스 빈 표: 참조열 1 2 3 4 1 2 5 1 2 3 4 5, frame 3개","introCard":1},{"id":"u17c-08","type":"num","q":"참조열 1 2 3 4 1 2 5 1 2 3 4 5, FIFO, frame 4개(처음 비어 있음)일 때 page fault 수는?","explain":"1 2 3 4 miss, 1·2 hit, 5(1 뺌) 1(2 뺌) 2(3 뺌) 3(4 뺌) 4(5 뺌) 5(1 뺌) → fault 10. frame 을 늘렸는데 fault 가 늘었다.","src":"위키 FIFO 교체 (OSTEP 22장)","wiki":"FIFO 교체","diff":3,"tags":["Belady"],"img":"img/os17-p35-belady.png","imgAlt":"p.35 Belady 그래프 — frame 3 에서 4 로 늘 때 page fault 수가 오른다(빨간 원)","answer":10,"unit":"번","tol":0,"introCard":1},{"id":"u17c-09","type":"sa","q":"frame 을 늘렸는데 hit ratio 가 떨어지는 FIFO 의 현상 이름은?","explain":"p.35 \"FIFO often shows a lower hit ratio with more page frames.\"","src":"17강 p.35","wiki":"FIFO 교체","prof":true,"tags":["Belady"],"answer":"Belady's anomaly","alts":["Belady anomaly","Belady"],"introCard":1},{"id":"u17c-10","type":"tf","q":"LRU 와 OPT 에서도 Belady's anomaly 가 생길 수 있다.","explain":"LRU·OPT 는 stack algorithm 이라 생기지 않는다. 교수님은 \"non-optimal policy 는 관계를 보장하지 않는다\"고 했지만, 객관식에서 Belady 가능 정책은 FIFO 를 고른다.","src":"위키 FIFO 교체, 11/9 녹음","wiki":"FIFO 교체","prof":true,"diff":3,"tags":["Belady"],"answer":false,"introCard":2},{"id":"u17c-11","type":"num","q":"frame 3개, 참조열 7 0 1 2 0 3 0 4. LRU 의 hit 수는?","explain":"7 0 1 miss, 2 miss(7 뺌), 0 hit, 3 miss(1 뺌), 0 hit, 4 miss(2 뺌) → hit 2.","src":"위키 LRU 퀴즈","wiki":"LRU","tags":["교체 정책"],"answer":2,"unit":"번","tol":0,"img":"img/os17-gen-u17c-11.png","imgAlt":"LRU 트레이스 빈 표: 참조열 7 0 1 2 0 3 0 4, frame 3개","introCard":1},{"id":"u17c-12","type":"num","q":"frame 3개, 참조열 1 2 3 1 4 2 5 1. Optimal 의 hit 수는?","explain":"1 2 3 miss, 1 hit, 4 miss(다시 안 쓰는 3 뺌), 2 hit, 5 miss(2·4 모두 다시 안 씀, 아무거나), 1 hit → hit 3.","src":"17강 p.31 규칙 적용","wiki":"Optimal 교체","diff":2,"tags":["교체 정책"],"answer":3,"unit":"번","tol":0,"img":"img/os17-gen-u17c-12.png","imgAlt":"Optimal 트레이스 빈 표: 참조열 1 2 3 1 4 2 5 1, frame 3개","introCard":1},{"id":"u17c-13","type":"num","q":"frame 3개, 참조열 1 2 3 1 4 2 5 1. LRU 의 hit 수는?","explain":"1 2 3 miss, 1 hit(순서 2,3,1), 4 miss(2 뺌), 2 miss(3 뺌), 5 miss(1 뺌), 1 miss → hit 1. 이 참조열에선 FIFO(hit 2)가 LRU 보다 낫다.","src":"17강 p.39 규칙 적용","wiki":"LRU","diff":3,"tags":["교체 정책"],"answer":1,"unit":"번","tol":0,"img":"img/os17-gen-u17c-13.png","imgAlt":"LRU 트레이스 빈 표: 참조열 1 2 3 1 4 2 5 1, frame 3개","introCard":1},{"id":"u17c-14","type":"tf","q":"참조열 0 1 2 0 1 3 0 3 1 2 1, frame 3개에서 Random 교체가 OPT 와 같은 hit 6 을 낼 때도 있다. (그림: 10,000번 시행의 hit 수 분포)","explain":"p.37 \"Sometimes, Random is as good as optimal, achieving 6 hits.\" 교수님: 여러 번 돌리면 약 40% 가 hit 6.","src":"17강 p.37, 11/9 녹음","wiki":"Random 교체","prof":true,"img":"img/os17-p37-random.png","imgAlt":"p.37 Random 10,000번 시행의 hit 수 분포","answer":true,"introCard":1},{"id":"u17c-15","type":"mc","q":"[규칙 적용] Clock, frame 3개(처음 비어 있음). 빈 frame 은 차례로 채우고 새 page 의 reference bit 는 1, hit 이면 bit 를 1 로. 교체 때는 hand(처음 frame 0)부터 1 이면 0 으로 지우고 넘어가고 0 이면 교체한 뒤 hand 를 다음으로 옮긴다. 참조열 1 2 3 2 4 1 뒤 frame 0·1·2 의 page 는?","explain":"1 2 3 으로 채움(bit 1,1,1, hand 0). 2 hit. 4: frame 0·1·2 를 모두 0 으로 지우고 한 바퀴 돌아 frame 0(page 1) 교체 → 4, hand 1. 1: frame 1(page 2, bit 0) 교체 → 1, hand 2. 결과 4, 1, 3. 모두 1 이면 FIFO 처럼 동작한다.","src":"17강 p.46~47 규칙 적용","wiki":"Clock 알고리즘","diff":3,"tags":["Clock"],"choices":["4, 1, 3","4, 2, 1","1, 4, 3","3, 4, 1"],"answer":0,"img":"img/os17-gen-u17c-15.png","imgAlt":"Clock 트레이스 빈 표: 참조열 1 2 3 2 4 1, frame 3개","introCard":1},{"id":"u17c-16","type":"num","q":"[규칙 적용] frame 3개, 참조열 7 0 1 2 0 3 0 4. FIFO 의 hit 수는?","explain":"7 0 1 miss, 2 miss(7 뺌) → 0 1 2, 0 hit, 3 miss(0 뺌) → 1 2 3, 0 miss(1 뺌) → 2 3 0, 4 miss(2 뺌) → hit 1. 같은 참조열의 LRU 는 hit 2 — 자주 쓰는 0 을 FIFO 는 들어온 순서만 보고 내보낸다(p.34 \"FIFO still kicks it out\").","src":"17강 p.33~34 규칙 적용","wiki":"FIFO 교체","diff":2,"tags":["교체 정책"],"answer":1,"unit":"번","tol":0,"img":"img/os17-gen-u17c-16.png","imgAlt":"FIFO 트레이스 빈 표: 참조열 7 0 1 2 0 3 0 4, frame 3개","introCard":1}],"intro":[{"title":"교체 정책과 victim","body":"**Optimal**: 가장 먼 미래에 쓸 page(비교 기준, 미래를 알아야 함). **FIFO**: 가장 먼저 들어온 page(자주 쓰여도 내보냄). **Random**: 무작위. **LRU**: 가장 오래전에 쓴 page. **Clock**: reference bit 가 0 인 page. 처음 올리는 miss 는 어떤 정책도 피할 수 없는 **compulsory(cold) miss**.","src":"17강 p.30~39"},{"title":"트레이스 표 채우는 법","body":"참조마다 Hit/Miss, Evict, Resulting Cache State 를 적는다. frame 이 빌 때는 그냥 채운다. OPT 는 앞으로 다시 안 쓰는 page 를 먼저, 동률이면 아무거나. LRU 는 hit 때도 \"최근\" 순서를 갱신한다. 예: 0 1 2 0 1 3 0 3 1 2 1, frame 3 → OPT hit 6, FIFO hit 4, LRU hit 6.","img":"img/os17-p32-opt-ans.png","imgAlt":"Optimal 트레이스 표: 0,1,2 miss, … hit rate 54.6%","src":"17강 p.32~39"},{"title":"Belady's anomaly","body":"FIFO 는 frame 을 늘렸는데 hit 가 줄 수 있다: 1 2 3 4 1 2 5 1 2 3 4 5 에서 frame 3 → fault 9, frame 4 → fault 10. LRU·OPT 는 stack algorithm 이라 생기지 않는다.","img":"img/os17-p35-belady.png","imgAlt":"frame 수에 따른 FIFO page fault 수 그래프(3→4 에서 증가)","src":"17강 p.35"}]},{"id":"u17d","title":"Workload · LRU 구현 · Clock · dirty","items":[{"id":"u17d-01","type":"match","q":"workload 와 결과를 연결하시오","explain":"p.40~42. 교수님은 looping sequential 을 scan workload 라 불렀다.","src":"17강 p.40~42","wiki":"페이지 교체 정책","prof":true,"tags":["workload"],"pairs":[["No-locality","OPT 외 정책은 차이 없음"],["80-20","LRU 가 hot page 를 잘 붙들어 우세"],["Looping sequential","cache \u003c 50 이면 LRU·FIFO 0%"],["cache 가 workload 전체를 담을 때","어느 정책이든 hit rate 같음"]],"introCard":0},{"id":"u17d-02","type":"tf","q":"LRU 는 scan resistant 하다 (큰 파일을 한 번 훑는 scan 이 와도 hot page 를 지킨다).","explain":"11/11 녹음: LRU 는 scan resistant 가 아니다. 49칸이면 매번 곧 쓸 page 를 내보낸다. 해법: 따로 메커니즘, cache 키우기, 작업을 나눠 working set 줄이기(blocking).","src":"11/11 녹음","wiki":"페이지 교체 정책","prof":true,"diff":2,"answer":false,"introCard":0},{"id":"u17d-03","type":"num","q":"0~49 page 를 반복 참조(총 10,000회)하는 looping workload 에서 cache 가 50 page 이면 hit rate 는 몇 % 인가?","explain":"첫 바퀴 miss 50번 뒤로 전부 hit → (10,000 − 50)/10,000 = 99.5%.","src":"위키 페이지 교체 정책 p.42","wiki":"페이지 교체 정책","diff":2,"tags":["workload"],"answer":99.5,"unit":"%","tol":0.001,"introCard":0},{"id":"u17d-04","type":"mc","q":"looping sequential 에서 cache 가 50 미만일 때 LRU·FIFO 보다 나은 정책은? (OPT 제외)","explain":"교수님: Random 은 한 바퀴 뒤에도 안 바뀐 block 이 남아 cache 40 이면 약 60%.","src":"17강 p.42, 11/11 녹음","wiki":"페이지 교체 정책","prof":true,"diff":2,"img":"img/os17-p42-loop.png","imgAlt":"p.42 Looping-Sequential workload 의 cache 크기별 hit rate 그래프","choices":["Random","없다 — 모두 0%","LFU","Clock"],"answer":0,"introCard":0},{"id":"u17d-05","type":"mc","q":"LRU 가 LFU 보다 대개 나은 이유는?","explain":"11/11 녹음. frequency 는 긴 기간의 평균(global), recency 는 시간에 따라 바뀌는 특성.","src":"11/11 녹음","wiki":"LRU","prof":true,"choices":["실제 접근은 짧은 구간에 몰리는 burst 라서 recency 가 더 잘 맞는다","LFU 는 구현이 불가능해서","LRU 는 Belady 가 없어서","LFU 는 dirty bit 를 못 써서"],"answer":0,"introCard":0},{"id":"u17d-06","type":"match","q":"LRU 구현과 비용을 연결하시오","explain":"p.44~45. 교수님: stack 은 포인터 4~6개, singly linked 로는 안 된다. 둘 다 HW 지원이 필요해서 Clock 을 쓴다.","src":"17강 p.44~45, 11/11 녹음","wiki":"LRU","prof":true,"pairs":[["Counter (timestamp)","교체 때 표 전체 검색 필요"],["Stack (doubly linked list)","접근마다 포인터 여러 개 갱신, 검색 불필요"],["Clock","reference bit 하나로 LRU 근사"],["LFU","접근 횟수(frequency)가 가장 적은 page 를 뺌"]],"introCard":1},{"id":"u17d-07","type":"cloze","q":"Clock: 참조될 때 reference bit 를 1 로 만드는 것은 ___ 이고, 1 을 0 으로 지우는 것은 ___ 다.","explain":"p.46 \"Hardware never clears the bit, though; that is the responsibility of the OS.\"","src":"17강 p.46","wiki":"Clock 알고리즘","prof":true,"tags":["Clock"],"answer":["hardware","OS"],"bank":["hardware","OS","사용자 프로그램","disk controller","TLB"],"introCard":1},{"id":"u17d-08","type":"mc","q":"Clock 에서 page A(1), B(0), C(1) 이 원형이고 hand 가 A 에 있다. page fault 시 victim 은?","explain":"A 는 1 → 0 으로 지우고 넘어감, B 는 0 → victim. 교체 직전 A 의 bit 은 0.","src":"위키 Clock 알고리즘 퀴즈","wiki":"Clock 알고리즘","tags":["Clock"],"choices":["B","A","C","없음 — 한 바퀴 더"],"answer":0,"introCard":1},{"id":"u17d-09","type":"mc","q":"Clock 에서 page A(1), B(1), C(1) 이 원형이고 hand 가 A 에 있다. victim 은?","explain":"A·B·C 를 차례로 1→0 으로 지우고 넘어가 다시 A 에 오면 0 → victim. 모두 1 이면 FIFO 처럼 동작한다.","src":"17강 p.47 규칙 적용","wiki":"Clock 알고리즘","diff":3,"tags":["Clock"],"choices":["A (한 바퀴 돌며 모두 0 으로 지운 뒤)","B","C","고를 수 없음"],"answer":0,"introCard":1},{"id":"u17d-10","type":"tf","q":"Clock 은 perfect LRU 만큼은 아니지만 history 를 전혀 안 보는 정책보다는 낫다.","explain":"p.49. 80-20 workload 에서 LRU 와 FIFO/RAND 사이.","src":"17강 p.49","wiki":"Clock 알고리즘","answer":true,"introCard":1},{"id":"u17d-11","type":"mc","q":"dirty page 와 clean page 중 보통 victim 으로 고르는 쪽과 이유는?","explain":"p.50 \"If a page has not been modified, the eviction is free. Usually, a clean page is selected as a victim.\"","src":"17강 p.50","wiki":"demand paging","tags":["dirty"],"choices":["clean — 내보낼 때 디스크 쓰기가 없어서","dirty — 이미 수정돼서","clean — reference bit 가 1 이라서","dirty — swap space 가 비어서"],"answer":0,"introCard":1},{"id":"u17d-12","type":"match","q":"용어와 정의를 연결하시오","explain":"p.52~53. 교수님: prefetching 은 기대만큼 잘 안 되지만 \"too strong to neglect\".","src":"17강 p.52~53","wiki":"demand paging","prof":true,"pairs":[["Demand paging","접근할 때 page 를 가져옴"],["Prefetching","곧 쓸 page 를 미리 가져옴"],["Clustering","밀린 write 를 모아 한 번에 디스크에 씀"],["Dirty bit","수정돼서 내보낼 때 write back 필요"]],"introCard":2},{"id":"u17d-13","type":"tf","q":"swapping 때문에 PTE 에 present · dirty · reference 세 비트가 추가되었고 x86, RISC-V 모두 있다.","explain":"11/11 녹음.","src":"11/11 녹음","wiki":"demand paging","prof":true,"diff":1,"answer":true,"introCard":2},{"id":"u17d-14","type":"cloze","q":"Clock 에서 hand 가 가리킨 page 의 reference bit 가 1 이면 ___ 으로 지우고 넘어가고, 0 이면 ___ 으로 고른다.","explain":"p.47 표: Use bit 1 → clear and advance, 0 → evict.","src":"17강 p.47","wiki":"Clock 알고리즘","tags":["Clock"],"answer":["0","victim"],"bank":["0","victim","1","dirty","present"],"introCard":1},{"id":"u17d-15","type":"mc","q":"LRU stack: 참조열 4 7 0 7 1 0 1 2 1 2 7 1 2 에서 a 직전 stack 은 (위부터) 2 1 0 7 4 다. 7 을 참조한 b 직후 stack(가려짐)은?","explain":"참조된 page 를 stack 맨 위로 옮긴다(중간에서 빼서 위로 → 포인터 여러 개 갱신, p.45). 7 이 위로 가고 나머지 순서는 그대로 → 7 2 1 0 4. 맨 아래(4)가 LRU 라 교체 때 검색이 필요 없다.","src":"17강 p.45","wiki":"LRU","tags":["교체 정책"],"img":"img/os17-p45-stack.png","imgAlt":"p.45 LRU stack 그림 — b 직후 stack 이 가려져 있다","explainImg":"img/os17-p45-stack-ans.png","choices":["7 2 1 0 4","2 1 0 7 4","7 4 2 1 0","2 7 1 0 4"],"answer":0,"introCard":1},{"id":"u17d-16","type":"mc","q":"Clock 예: 원형 A(0) B(1) C(0) D(1) E(1) F(0) G(0) H(1), clock hand 는 B 를 가리킨다. page fault 때 교체되는 page(?)는?","explain":"hand 가 B 를 본다: use bit 1 → 0 으로 지우고 다음으로. C: 0 → evict. B 는 이번에 살아남는 대신 bit 가 0 이 돼서 다음 바퀴에 0 이면 쫓겨난다.","src":"17강 p.47","wiki":"Clock 알고리즘","tags":["Clock"],"img":"img/os17-p47-clock.png","imgAlt":"p.47 Clock 예 — 교체될 page 표시가 가려져 있다","explainImg":"img/os17-p47-clock-ans.png","choices":["C","B","A","F"],"answer":0,"introCard":1},{"id":"u17d-17","type":"num","q":"Clock 그림 (a): reference bit 가 위에서부터 0 0 1 1 0 … 1 1 이고 next victim 화살표가 세 번째(bit 1)를 가리킨다. 실제로 교체되는 page 는 화살표가 가리킨 page 부터 세어 몇 번째인가? (화살표 page = 1번째)","explain":"1번째(bit 1) → 0 으로, 2번째(bit 1) → 0 으로, 3번째(bit 0) → victim. 그림 (b) 에서 화살표가 그 page 에 가 있고 앞의 두 bit 가 0 이 된 것이 이 과정이다.","src":"17강 p.48","wiki":"Clock 알고리즘","diff":2,"tags":["Clock"],"img":"img/os17-p48-clocka.png","imgAlt":"p.48 (a) reference bits 와 circular queue, next victim 화살표","answer":3,"unit":"번째","tol":0,"introCard":1}],"intro":[{"title":"workload 별 결과","body":"**No-locality**(무작위): OPT 외에는 정책 차이 없음, cache 가 전체를 담으면 다 100%. **80-20**(80% 참조가 20% page 에): LRU 가 hot page 를 잘 붙들어 우세. **Looping sequential**(0~49 반복): cache \u003c 50 이면 LRU·FIFO 0%, Random 이 낫다 — LRU 는 **scan resistant 가 아니다**. cache ≥ 50 이면 첫 바퀴 뒤 전부 hit.","img":"img/os17-p42-loop.png","imgAlt":"Looping-Sequential workload 의 cache 크기별 hit rate","src":"17강 p.40~42"},{"title":"LRU 구현과 Clock","body":"LRU 를 그대로 하려면 매 참조마다 기록해야 한다: **counter**(교체 때 표 전체 검색) 또는 **stack**(접근마다 포인터 여러 개 갱신, 맨 아래가 LRU). 그래서 **Clock** 으로 근사: 참조되면 하드웨어가 reference bit 를 1 로, OS 가 0 으로 지운다. page fault 때 hand 가 본 page 가 1 이면 0 으로 지우고 다음으로, 0 이면 victim. 모두 1 이면 한 바퀴 돌아 FIFO 처럼.","img":"img/os17-p47-clock-ans.png","imgAlt":"Clock 예: hand 가 B 를 가리키고 C 가 victim","src":"17강 p.43~49"},{"title":"dirty page 와 가져오기","body":"clean page 는 내보낼 때 디스크 쓰기가 없어 보통 victim 으로 고른다(**dirty bit** = 수정됨, 써야 함). **Demand paging**: 접근할 때 가져옴. **Prefetching**: 곧 쓸 page 를 미리. **Clustering**: 밀린 write 를 모아 한 번에. swapping 때문에 PTE 에 present·dirty·reference 비트가 생겼다.","src":"17강 p.50~53"}]}]},{"id":"u18","title":"18강 I/O Devices and HDD","desc":"canonical device · polling/interrupt · DMA · MMIO · 접근 시간 · 디스크 스케줄링 · RAID","lessons":[{"id":"u18a","title":"I/O 장치와 인터페이스","items":[{"id":"u18a-01","type":"mc","q":"bus 를 계층(memory bus → general I/O bus → peripheral I/O bus)으로 두는 이유는?","explain":"빠른 bus 는 짧아야 하고 비싸다. 교수님 키보드 예: 초당 600 byte 면 충분하니 10 Gbps 가 필요 없다.","src":"18강 p.5, 11/11 녹음","wiki":"I/O 시스템 구조","prof":true,"choices":["physics and cost","protection and sharing","locality","fairness"],"answer":0,"introCard":0},{"id":"u18a-02","type":"match","q":"canonical device 의 레지스터와 역할을 연결하시오","explain":"p.6 \"Three registers are minimally required.\"","src":"18강 p.6","wiki":"canonical device","prof":true,"tags":["I/O"],"img":"img/os18-p07-canon.png","imgAlt":"p.7 Canonical Device — Interface 의 세 레지스터 이름이 ①②③으로 가려져 있다","explainImg":"img/os18-p07-canon-ans.png","pairs":[["Status register","장치의 현재 상태를 본다"],["Command register","장치에 할 일을 시킨다"],["Data register","장치와 데이터를 주고받는다"],["Internal structure","장치마다 다른 펌웨어·메모리·칩 (OS 는 몰라도 됨)"]],"introCard":0},{"id":"u18a-03","type":"tf","q":"장치 레지스터 중 status·command 는 control 이라 latency 가 중요하고, data 는 bandwidth 가 중요하다.","explain":"11/11 녹음 (슬라이드에 없는 말). 장치는 보통 control 과 data 경로를 분리한다.","src":"11/11 녹음","wiki":"canonical device","prof":true,"answer":true,"introCard":0},{"id":"u18a-04","type":"sa","q":"장치가 일이 끝났음을 CPU 에 알리는 asynchronous exception 의 이름은?","explain":"11/11 수업 중 교수님 질문.","src":"18강 p.8, 11/11 녹음","wiki":"polling과 interrupt","prof":true,"img":"img/os18-p11-intr.png","imgAlt":"p.11 CPU 가 task 2 를 도는 동안 disk 가 task 1 의 I/O 를 하는 그림","answer":"interrupt","alts":["인터럽트"],"introCard":1},{"id":"u18a-05","type":"sa","q":"OS 가 status register 를 반복해서 읽으며 장치가 준비될 때까지 기다리는 방식은?","explain":"p.10. 간단하지만 기다리는 동안 CPU 시간을 낭비한다.","src":"18강 p.10","wiki":"polling과 interrupt","tags":["polling"],"img":"img/os18-p10-polling.png","imgAlt":"p.10 CPU utilization 그림 — p 칸의 이름이 가려져 있다","answer":"polling","introCard":0},{"id":"u18a-06","type":"mc","q":"polling(status register 를 계속 읽으며 기다리기)과 같은 문제를 가진 동기화 기법은?","explain":"11/11 녹음. lock 을 sleeping lock 으로 바꿨던 것처럼 interrupt 로 바꾼다.","src":"11/11 녹음","wiki":"polling과 interrupt","prof":true,"choices":["spinning lock","priority inversion","Belady's anomaly","thrashing"],"answer":0,"introCard":1},{"id":"u18a-07","type":"mc","q":"interrupt 방식이 polling 에 비해 매번 치르는 overhead 는?","explain":"11/11 녹음. interrupt 는 고정 overhead, polling 은 기다리는 시간에 비례.","src":"11/11 녹음","wiki":"polling과 interrupt","prof":true,"choices":["context switch","TLB flush","disk seek","page fault"],"answer":0,"introCard":1},{"id":"u18a-08","type":"match","q":"장치 속도와 고를 방식을 연결하시오","explain":"p.12 \"If a device is fast → poll is best. If it is slow → interrupt is better.\" context switch 가 비싸기 때문.","src":"18강 p.12","wiki":"polling과 interrupt","prof":true,"tags":["polling"],"pairs":[["매우 빠른 장치의 완료 확인","polling"],["느린 장치의 완료 확인","interrupt"],["큰 데이터 복사를 CPU 대신","DMA"],["장치 레지스터를 load/store 로","memory-mapped I/O"]],"introCard":1},{"id":"u18a-09","type":"tf","q":"interrupt 는 항상 polling 보다 빠르다.","explain":"p.12 \"Interrupts is not always the best solution.\" 장치가 context switch 보다 빨리 끝나면 polling 이 낫다.","src":"18강 p.12","wiki":"polling과 interrupt","diff":1,"answer":false,"introCard":1},{"id":"u18a-10","type":"sa","q":"CPU 가 메모리와 장치 사이 데이터를 직접 옮기는 방식의 full term 은?","explain":"p.13. 교수님: PIO 는 polling 과 잘 맞는다 — 둘 다 CPU 를 쓴다.","src":"18강 p.13","wiki":"PIO와 DMA","tags":["DMA"],"img":"img/os18-p13-pio.png","imgAlt":"p.13 CPU 가 c(copy data from memory)로 바쁜 그림","answer":"programmed I/O","alts":["PIO","programmed IO"],"introCard":2},{"id":"u18a-11","type":"cloze","q":"DMA controller 에게는 데이터가 메모리 ___ 에 있는지와 ___ 옮길지만 알려 주면 되고, 끝나면 DMA 가 ___ 를 건다.","explain":"p.14. 교수님: where = physical address, how much = length.","src":"18강 p.14, 11/11 녹음","wiki":"PIO와 DMA","prof":true,"tags":["DMA"],"answer":["어디","얼마나","interrupt"],"bank":["어디","얼마나","interrupt","언제","왜","page fault"],"introCard":1},{"id":"u18a-12","type":"sa","q":"장치 레지스터를 메모리 위치처럼 보이게 해서 load/store 로 접근하는 방식은?","explain":"p.18. 특수 명령이 필요 없다.","src":"18강 p.18","wiki":"memory-mapped I/O","tags":["MMIO"],"img":"img/os18-p18-mmio.png","imgAlt":"p.18 Memory Space 안 장치용 구간 — 이름과 설명이 가려져 있다","explainImg":"img/os18-p18-mmio-ans.png","answer":"memory-mapped I/O","alts":["memory mapped I/O","MMIO","memory-mapped IO"],"introCard":0},{"id":"u18a-13","type":"tf","q":"x86 의 in/out 같은 특권 I/O 명령(port-mapped I/O)은 old style 이고 지금은 거의 쓰지 않는다.","explain":"11/11 녹음. x86 의 in/out 같은 특권 I/O 명령은 old style.","src":"11/11 녹음","wiki":"memory-mapped I/O","prof":true,"answer":true,"introCard":3},{"id":"u18a-14","type":"match","q":"장치 상호작용의 두 질문 — \"누가 I/O 완료를 확인하나\", \"누가 데이터를 옮기나\" — 의 답과 방식 이름을 연결하시오","explain":"p.19 표.","src":"18강 p.19","wiki":"memory-mapped I/O","prof":true,"pairs":[["CPU 가 완료를 확인","Polling"],["장치가 완료를 알림","Interrupt"],["CPU 가 데이터를 복사","Programmed I/O"],["장치가 데이터를 복사","DMA"],["장치를 메모리처럼 부름","Memory-mapped I/O"]],"introCard":1},{"id":"u18a-15","type":"cloze","q":"Prototypical System Architecture: ① ___ (e.g., AXI), ② ___ (e.g., PCIe), ③ ___ (e.g., SCSI, SATA, USB)","explain":"CPU 와 memory 가 가장 빠르고 짧은 memory bus 에, 그래픽 같은 고성능 장치가 general I/O bus(PCIe)에, 느린 디스크·USB 가 맨 아래 peripheral I/O bus 에 붙는다. 계층을 두는 이유는 physics and cost(p.5).","src":"18강 p.3, p.5","wiki":"I/O 시스템 구조","tags":["I/O"],"img":"img/os18-p03-bus.png","imgAlt":"p.3 세 bus 의 이름이 ①②③으로 가려진 시스템 구조도","explainImg":"img/os18-p03-bus-ans.png","answer":["Memory Bus","General I/O Bus","Peripheral I/O Bus"],"bank":["Memory Bus","General I/O Bus","Peripheral I/O Bus","System Bus","Data Bus"],"introCard":0},{"id":"u18a-16","type":"cloze","q":"port-mapped I/O 명령 `outb(0x1f2, reg)` 에서 ① reg 는 ___ (데이터가 든 곳), ② 0x1f2 는 장치를 가리키는 ___ 다.","explain":"p.17 \"The caller specifies 1) a register with the data in it and 2) a specific port which names the device.\" in/out 은 x86 의 특권 명령이다(old style). 지금은 memory-mapped I/O 를 쓴다.","src":"18강 p.17","wiki":"memory-mapped I/O","tags":["MMIO"],"img":"img/os18-p17-portio.png","imgAlt":"p.17 outb(0x1f2, reg) — 두 인자의 이름이 ①②로 가려져 있다","explainImg":"img/os18-p17-portio-ans.png","answer":["register","port"],"bank":["register","port","page","interrupt","sector"],"introCard":3},{"id":"u18a-17","type":"order","q":"DMA 로 디스크 데이터를 메모리 buffer X 로 옮기는 과정을 순서대로 놓으시오.","explain":"p.15 그림의 1~6. CPU 는 1~2 단계에서 \"어디(X) · 얼마나(C)\" 만 알려 주고 다른 일을 하다가, 6 단계의 interrupt 로 끝난 것을 안다. 2026F 중간 P3(LDE 순서 쓰기)처럼 단계 순서를 묻는 형식.","src":"18강 p.14~15","wiki":"PIO와 DMA","diff":2,"tags":["DMA"],"answer":["device driver 가 disk data 를 buffer X 로 옮기라는 요청을 받는다","device driver 가 disk controller 에 C bytes 를 X 로 보내라고 한다","disk controller 가 DMA transfer 를 시작한다","disk controller 가 byte 를 DMA controller 로 보낸다","DMA controller 가 X 에 쓰며 주소를 늘리고 C 를 줄인다","C = 0 이 되면 DMA 가 CPU 에 interrupt 를 건다"],"introCard":0},{"id":"u18a-18","type":"sa","q":"[용어] DMA 의 full name — offload some of the work to a special-purpose processor that copies data between memory and a device. (3 words, d… m… a…)","explain":"p.14. 약어(DMA)가 아니라 full term 을 써야 점수가 나온다. CPU 가 직접 복사하는 것은 programmed I/O(PIO).","src":"18강 p.14","wiki":"PIO와 DMA","tags":["DMA"],"answer":"direct memory access","alts":["direct-memory-access"],"introCard":2}],"intro":[{"title":"I/O 구조와 canonical device","body":"CPU·memory 는 짧고 빠른 **memory bus**, 고성능 장치는 **general I/O bus**(PCIe), 느린 장치는 **peripheral I/O bus**(SCSI·SATA·USB) — 계층 이유는 physics and cost. 장치 인터페이스의 최소 레지스터 셋: **status**(상태 보기), **command**(할 일 시키기), **data**(데이터 주고받기). control(status·command)은 latency, data 는 bandwidth 가 중요.","img":"img/os18-p03-bus-ans.png","imgAlt":"Memory Bus, General I/O Bus, Peripheral I/O Bus 구조","src":"18강 p.3~7"},{"title":"polling 과 interrupt","body":"**Polling**: OS 가 status register 를 반복해서 읽으며 기다림 — 단순하지만 CPU 낭비(spinning lock 과 같은 문제). **Interrupt**: 요청 후 프로세스를 재우고 다른 일을 하다가 장치가 끝나면 interrupt 로 깨움 — 매번 context switch overhead. 장치가 빠르면 polling, 느리면 interrupt 가 낫다.","img":"img/os18-p10-polling.png","imgAlt":"polling 동안 CPU 가 p 로 낭비되는 그림","src":"18강 p.8~12"},{"title":"PIO 와 DMA","body":"**Programmed I/O(PIO)**: CPU 가 데이터를 직접 복사(큰 데이터면 CPU 가 over-burdened). **Direct Memory Access(DMA)**: DMA controller 에 \"어디(physical address)·얼마나(length)\" 만 알려 주면 장치가 메모리와 직접 복사하고 끝나면 interrupt. 과정: driver 요청 → disk controller 에 지시 → DMA 전송 → 주소↑·count C↓ → C = 0 이면 interrupt.","img":"img/os18-p13-pio.png","imgAlt":"PIO: CPU 가 c(copy) 로 바쁜 그림","src":"18강 p.13~15"},{"title":"장치 주소 지정","body":"**Port-mapped I/O**: x86 in/out 같은 특권 명령, outb(port, register) — old style. **Memory-mapped I/O(MMIO)**: 장치 레지스터를 메모리 주소처럼 보이게 해서 load/store(mov)로 접근, 하드웨어가 장치로 보낸다. 정리: 완료 확인은 CPU(polling)/장치(interrupt), 데이터 복사는 CPU(PIO)/장치(DMA), 주소는 port-mapped/memory-mapped.","img":"img/os18-p18-mmio-ans.png","imgAlt":"Memory Space 안 장치용 구간(I/O)","src":"18강 p.16~19"}]},{"id":"u18b","title":"HDD 구조와 접근 시간","items":[{"id":"u18b-01","type":"match","q":"HDD 용어와 뜻을 연결하시오","explain":"p.22~23.","src":"18강 p.22~23","wiki":"HDD 구조","tags":["HDD"],"pairs":[["Platter","두 surface 를 가진 원판"],["Track","surface 위 동심원"],["Sector","track 을 나눈 단위"],["Cylinder","모든 surface 의 같은 반지름 track 묶음"]],"introCard":0},{"id":"u18b-02","type":"mc","q":"HDD 의 바깥 track 이 안쪽 track 보다 길 때 HDD 는 어떻게 하나?","explain":"11/16 녹음. 고정 단위라야 관리·전송이 쉽다 — page 크기를 고정한 것과 같은 이유.","src":"11/16 녹음","wiki":"HDD 구조","prof":true,"choices":["sector 수를 늘린다","sector 크기를 키운다","바깥 track 을 안 쓴다","회전 속도를 바꾼다"],"answer":0,"introCard":0},{"id":"u18b-03","type":"cloze","q":"Taccess = Tavg ___ + Tavg ___ + Tavg transfer","explain":"p.27. seek 이 가장 길고 rotational latency 가 transfer 보다 길다.","src":"18강 p.27","wiki":"디스크 접근 시간","prof":true,"tags":["디스크 접근"],"answer":["seek","rotation"],"bank":["seek","rotation","queue","interrupt"],"introCard":1},{"id":"u18b-04","type":"num","q":"7200 RPM 디스크의 Tavg rotation 은 몇 ms 인가? (소수 둘째 자리)","explain":"한 바퀴 = 60/7200 s = 8.33 ms, 평균은 반 바퀴 → 4.17 ms.","src":"18강 p.28","wiki":"디스크 접근 시간","prof":true,"tags":["디스크 접근"],"answer":4.17,"unit":"ms","tol":0.005,"introCard":1},{"id":"u18b-05","type":"num","q":"7200 RPM, track 당 평균 400 sector 일 때 Tavg transfer 는 몇 ms 인가?","explain":"8.33 ms / 400 = 0.0208 ms ≈ 0.02 ms.","src":"18강 p.28","wiki":"디스크 접근 시간","tags":["디스크 접근"],"answer":0.0208,"unit":"ms","tol":0.01,"introCard":0},{"id":"u18b-06","type":"num","q":"7200 RPM, 평균 seek 9 ms, track 당 400 sector. rotation 을 4 ms, transfer 를 0.02 ms 로 반올림하면 Taccess 는 몇 ms 인가?","explain":"9 + 4 + 0.02 = 13.02 ms. 반올림 전 값으로 더하면 13.19 ms.","src":"18강 p.28","wiki":"디스크 접근 시간","prof":true,"tags":["디스크 접근"],"answer":13.02,"unit":"ms","tol":0.001,"introCard":1},{"id":"u18b-07","type":"num","q":"15,000 RPM, 평균 seek 4 ms, track 당 500 sector 의 Taccess 는 몇 ms 인가?","explain":"한 바퀴 4 ms → rotation 2 ms, transfer 4/500 = 0.008 ms. 4 + 2 + 0.008 = 6.008 ms.","src":"위키 디스크 접근 시간 퀴즈","wiki":"디스크 접근 시간","diff":2,"tags":["디스크 접근"],"answer":6.008,"unit":"ms","tol":0.001,"introCard":1},{"id":"u18b-08","type":"num","q":"10,000 RPM, 평균 seek 5 ms, track 당 500 sector 의 Taccess 는 몇 ms 인가?","explain":"한 바퀴 6 ms → rotation 3 ms, transfer 6/500 = 0.012 ms. 5 + 3 + 0.012 = 8.012 ms.","src":"위키 디스크 접근 시간 퀴즈","wiki":"디스크 접근 시간","diff":2,"tags":["디스크 접근"],"answer":8.012,"unit":"ms","tol":0.001,"introCard":1},{"id":"u18b-09","type":"tf","q":"HDD 에서 \"First bit in a sector is the most expensive, the rest are free.\"","explain":"13.02 ms 중 transfer 는 0.02 ms 뿐이다. 첫 bit 까지 가는 seek·rotation 이 거의 전부.","src":"18강 p.28","wiki":"디스크 접근 시간","answer":true,"introCard":0},{"id":"u18b-10","type":"mc","q":"logical block 번호를 (surface, track, sector) 로 바꾸는 주체는?","explain":"p.29. OS 는 logical block 만 쓴다. 교수님: 가상/물리 주소 관계와 같다.","src":"18강 p.29","wiki":"logical block","tags":["HDD"],"choices":["disk controller (hardware/firmware)","OS 의 page table","MMU","DMA controller"],"answer":0,"introCard":0},{"id":"u18b-11","type":"mc","q":"random access 가 아닐 때 rotational latency 를 줄이는 방법은?","explain":"11/16 녹음. random access 면 못 줄인다 → 그래서 스케줄링의 목표는 seek time.","src":"11/16 녹음","wiki":"디스크 스케줄링","prof":true,"choices":["spatial locality — 같은 track 의 연속 sector 를 읽기","seek 를 늘리기","interrupt 를 쓰기","RAID 0"],"answer":0,"introCard":0},{"id":"u18b-12","type":"tf","q":"SSD 에는 디스크 스케줄링(seek 순서 최적화)이 필요 없다.","explain":"11/16 녹음. 움직이는 arm 이 없기 때문. HDD 내부에도 스케줄러가 있다.","src":"11/16 녹음","wiki":"디스크 스케줄링","prof":true,"diff":1,"answer":true,"introCard":2},{"id":"u18b-13","type":"cloze","q":"OS 는 ___ block 만 쓰고, disk controller 가 그것을 (surface, track, ___) 로 바꾼다.","explain":"p.29. 교수님: 안쪽 track 은 sector 가 적어 주소 공간이 고르지 않고 bad sector remap 이 필요하다.","src":"18강 p.29","wiki":"logical block","answer":["logical","sector"],"bank":["logical","sector","physical","cylinder","page"],"introCard":0},{"id":"u18b-14","type":"tf","q":"HDD 접근 시간에서 가장 큰 부분은 transfer time 이다.","explain":"seek 이 가장 길고 rotational latency 가 그다음이다. transfer 는 0.02 ms 정도로 거의 공짜.","src":"18강 p.28","wiki":"디스크 접근 시간","prof":true,"answer":false,"introCard":0},{"id":"u18b-15","type":"cloze","q":"Disk Geometry 그림: ① ___ (surface 위 동심원), ② ___ (track 을 나눈 단위), ③ ___ (sector 사이 틈)","explain":"p.22 \"Each surface consists of concentric rings called tracks. Each track consists of sectors separated by gaps.\" 여러 surface 의 같은 반지름 track 묶음은 cylinder(p.23).","src":"18강 p.22","wiki":"HDD 구조","tags":["HDD"],"img":"img/os18-p22-geom.png","imgAlt":"p.22 디스크 surface 와 Track k 확대 그림 — 세 용어가 ①②③으로 가려져 있다","explainImg":"img/os18-p22-geom-ans.png","answer":["Tracks","Sectors","Gaps"],"bank":["Tracks","Sectors","Gaps","Cylinders","Platters","Blocks"],"introCard":0},{"id":"u18b-16","type":"sa","q":"그림에서 가려진 이름 — 여러 platter 의 같은 위치 track 이 위아래로 정렬된 묶음은? (1 word)","explain":"p.23 \"Aligned tracks form a cylinder.\" read/write head 들이 한 arm 에 묶여 같이 움직이므로(move in unison) 한 번 seek 하면 cylinder 전체를 읽을 수 있다.","src":"18강 p.23","wiki":"HDD 구조","tags":["HDD"],"img":"img/os18-p23-cyl.png","imgAlt":"p.23 multiple-platter view — 정렬된 track 묶음의 이름이 가려져 있다","explainImg":"img/os18-p23-cyl-ans.png","answer":"cylinder","alts":["Cylinder k"],"introCard":0},{"id":"u18b-17","type":"order","q":"그림 ①~④ — BLUE sector 를 읽은 뒤 RED sector 를 읽기까지 일어나는 일을 순서대로 놓으시오.","explain":"Taccess = seek + rotation + transfer 의 순서 그대로다. arm 이 먼저 track 을 맞추고(seek), 원판이 돌아 sector 가 오기를 기다린 뒤(rotational latency), 지나가는 동안 읽는다(transfer).","src":"18강 p.25~27","wiki":"디스크 접근 시간","tags":["디스크 접근"],"img":"img/os18-p26-access.png","imgAlt":"p.26 디스크 접근 네 장면 — 아래 이름이 ①~④로 가려져 있다","explainImg":"img/os18-p26-access-ans.png","answer":["Data transfer (BLUE 읽기)","Seek (RED 의 track 으로 arm 이동)","Rotational latency (RED 가 head 아래로 올 때까지 대기)","Data transfer (RED 읽기)"],"introCard":0},{"id":"u18b-18","type":"num","q":"[규칙 적용] 5400 RPM, 평균 seek 10 ms, track 당 300 sector. Taccess = Tavg seek + Tavg rotation + Tavg transfer 는 몇 ms 인가? (소수 둘째 자리)","explain":"한 바퀴 = 60,000/5400 = 11.11 ms → rotation = 반 바퀴 5.56 ms, transfer = 11.11/300 = 0.037 ms. 10 + 5.556 + 0.037 = 15.59 ms. p.27 공식: rotation = 1/2 × 1/RPM × 60, transfer = 1/RPM × 1/(sectors/track) × 60.","src":"18강 p.27~28 규칙 적용","wiki":"디스크 접근 시간","diff":2,"tags":["디스크 접근"],"answer":15.59,"unit":"ms","tol":0.002,"introCard":1},{"id":"u18b-19","type":"sa","q":"[용어] Time waiting for first bit of target sector to pass under r/w head. (2 words, r… l…)","explain":"p.27. Tavg rotation 으로 계산한다. 원판을 끝까지 기다려야 하는 seek 이후의 시간.","src":"18강 p.27","wiki":"디스크 접근 시간","tags":["디스크 접근"],"answer":"rotational latency","introCard":1}],"intro":[{"title":"HDD 구조","body":"platter(두 surface) 위 동심원 **track**, track 을 나눈 **sector**(사이 gap), 모든 surface 의 같은 반지름 track 묶음이 **cylinder**. arm 끝 head 들이 함께 움직인다. 바깥 track 은 sector 수를 늘린다(sector 크기는 고정). OS 는 **logical block** 만 쓰고 disk controller 가 (surface, track, sector)로 바꾼다.","img":"img/os18-p22-geom-ans.png","imgAlt":"surface 의 tracks, Track k 의 sectors 와 gaps","src":"18강 p.21~30"},{"title":"접근 시간","body":"$T_{access} = T_{seek} + T_{rotation} + T_{transfer}$. 한 바퀴 = 60,000 / RPM (ms). 평균 rotation = 반 바퀴, transfer = 한 바퀴 / (track 당 sector 수). 예: 7200 RPM → 8.33 ms, rotation 4.17 ms; 400 sector 면 transfer 0.02 ms; seek 9 ms → 약 13 ms. seek > rotation ≫ transfer — 첫 bit 가 가장 비싸다.","img":"img/os18-p26-access-ans.png","imgAlt":"Data transfer → Seek → Rotational latency → Data transfer","src":"18강 p.25~28"},{"title":"줄일 수 있는 것","body":"rotational latency 는 같은 track 의 연속 sector 를 읽는 spatial locality 로만 줄일 수 있고 random access 면 못 줄인다. 그래서 디스크 스케줄링의 목표는 **seek time**(arm 이동). SSD 는 arm 이 없어 디스크 스케줄링이 필요 없다.","src":"18강 p.30~32"}]},{"id":"u18c","title":"디스크 스케줄링 손으로 돌리기","items":[{"id":"u18c-01","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. FCFS 의 총 head 이동량은?","explain":"45 + 85 + 146 + 85 + 108 + 110 + 59 + 2 = 640. 교수님: \"stupid\".","src":"18강 p.35","wiki":"FCFS","prof":true,"tags":["디스크 스케줄링"],"img":"img/os18-p35-fcfs.png","imgAlt":"p.35 FCFS head 이동 그래프 — 총 이동량이 가려져 있다","answer":640,"tol":0,"introCard":0},{"id":"u18c-02","type":"order","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. SSTF 가 처음 방문하는 요청 6개의 순서","explain":"53 에서 65(12) vs 37(16) → 65, 67, 그다음 37(30) vs 98(31) → 37, 14, 98, 122, 124, 183.","src":"18강 p.36","wiki":"SSTF","prof":true,"diff":2,"tags":["디스크 스케줄링"],"answer":["65","67","37","14","98","122"],"img":"img/os18-gen-u18c-02.png","imgAlt":"디스크 0~199 위 head 53 와 요청 98, 183, 37, 122, 14, 124, 65, 67","introCard":2},{"id":"u18c-03","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. SSTF 의 총 head 이동량은?","explain":"12 + 2 + 30 + 23 + 84 + 24 + 2 + 59 = 236.","src":"18강 p.36","wiki":"SSTF","prof":true,"tags":["디스크 스케줄링"],"img":"img/os18-p36-sstf.png","imgAlt":"p.36 SSTF head 이동 그래프 — 총 이동량이 가려져 있다","answer":236,"tol":0,"introCard":0},{"id":"u18c-04","type":"tf","q":"SSTF 는 CPU 스케줄링의 STCF(SJF)와 같은 꼴이라 starvation 이 생길 수 있다.","explain":"11/16 녹음, p.36 \"SSTF scheduling is a form of SJF scheduling; may cause starvation\".","src":"18강 p.36, 11/16 녹음","wiki":"SSTF","prof":true,"answer":true,"introCard":0},{"id":"u18c-05","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. SCAN 이 0 쪽으로 먼저 가되 디스크 끝(0)까지 가지 않고 마지막 요청(14)에서 방향을 바꾸면 총 이동량은?","explain":"(53 − 14) + (183 − 14) = 39 + 169 = 208. 11/16 수업: \"0 에는 요청이 없으니 14 에서 멈추면 28 줄어든다\".","src":"18강 p.37, 11/16 녹음","wiki":"SCAN","prof":true,"diff":2,"tags":["디스크 스케줄링"],"img":"img/os18-p37-scan.png","imgAlt":"p.37 SCAN head 이동 그래프 — 총 이동량이 가려져 있다","answer":208,"tol":0,"introCard":1},{"id":"u18c-06","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. SCAN 이 디스크 끝 0 까지 갔다가 방향을 바꾸면 총 이동량은?","explain":"53 + 183 = 236 (53→0 그리고 0→183). 그림대로면 236, 슬라이드 글자 208 은 LOOK 식 값.","src":"18강 p.37","wiki":"SCAN","diff":2,"tags":["디스크 스케줄링"],"answer":236,"tol":0,"img":"img/os18-gen-u18c-06.png","imgAlt":"디스크 0~199 위 head 53 와 요청 98, 183, 37, 122, 14, 124, 65, 67","introCard":1},{"id":"u18c-07","type":"num","q":"head 53, 디스크 0~199, 요청 98, 183, 37, 122, 14, 124, 65, 67. C-SCAN(199 쪽으로, 끝까지 갔다 0 으로 복귀, 복귀 이동 포함)의 총 이동량은?","explain":"53→183 130, 183→199 16, 199→0 199, 0→37 37 → 382. 복귀를 빼면 183. 복귀 포함 여부는 문제 말을 따른다.","src":"위키 C-SCAN p.39","wiki":"C-SCAN","diff":3,"tags":["디스크 스케줄링"],"img":"img/os18-p39-cscan.png","imgAlt":"p.39 C-SCAN head 이동 그래프","answer":382,"tol":0,"introCard":1},{"id":"u18c-08","type":"num","q":"head 100, 디스크 0~199, 요청 55, 58, 39, 18, 90, 160, 150, 38, 184. FCFS 의 총 이동량은?","explain":"45 + 3 + 19 + 21 + 72 + 70 + 10 + 112 + 146 = 498.","src":"위키 디스크 스케줄링 퀴즈","wiki":"FCFS","diff":2,"tags":["디스크 스케줄링"],"answer":498,"tol":0,"img":"img/os18-gen-u18c-08.png","imgAlt":"디스크 0~199 위 head 100 와 요청 55, 58, 39, 18, 90, 160, 150, 38, 184","introCard":0},{"id":"u18c-09","type":"num","q":"head 100, 디스크 0~199, 요청 55, 58, 39, 18, 90, 160, 150, 38, 184. SSTF 의 총 이동량은?","explain":"100→90→58→55→39→38→18→150→160→184: 10 + 32 + 3 + 16 + 1 + 20 + 132 + 10 + 24 = 248.","src":"위키 디스크 스케줄링 퀴즈","wiki":"SSTF","diff":3,"tags":["디스크 스케줄링"],"answer":248,"tol":0,"img":"img/os18-gen-u18c-09.png","imgAlt":"디스크 0~199 위 head 100 와 요청 55, 58, 39, 18, 90, 160, 150, 38, 184","introCard":0},{"id":"u18c-10","type":"num","q":"head 100, 디스크 0~199, 요청 55, 58, 39, 18, 90, 160, 150, 38, 184. SCAN(0 쪽으로 먼저, 0 까지 감)의 총 이동량은?","explain":"100 → 0 = 100, 0 → 184 = 184 → 284.","src":"위키 디스크 스케줄링 퀴즈","wiki":"SCAN","diff":2,"tags":["디스크 스케줄링"],"answer":284,"tol":0,"img":"img/os18-gen-u18c-10.png","imgAlt":"디스크 0~199 위 head 100 와 요청 55, 58, 39, 18, 90, 160, 150, 38, 184","introCard":2},{"id":"u18c-11","type":"num","q":"head 100, 디스크 0~199, 요청 55, 58, 39, 18, 90, 160, 150, 38, 184. C-SCAN(199 쪽으로, 복귀 포함)의 총 이동량은?","explain":"100→199 = 99, 199→0 = 199, 0→90 = 90 → 388.","src":"위키 디스크 스케줄링 퀴즈","wiki":"C-SCAN","diff":3,"tags":["디스크 스케줄링"],"answer":388,"tol":0,"img":"img/os18-gen-u18c-11.png","imgAlt":"디스크 0~199 위 head 100 와 요청 55, 58, 39, 18, 90, 160, 150, 38, 184","introCard":1},{"id":"u18c-12","type":"mc","q":"C-SCAN 이 SCAN 보다 나은 점은?","explain":"11/16 녹음. SCAN 은 0 근처 요청의 최악이 400, 가운데는 200. 대가는 복귀 약 200 칸.","src":"18강 p.38~39, 11/16 녹음","wiki":"C-SCAN","prof":true,"choices":["모든 주소의 최악 응답 시간을 같게 만든다","총 이동량이 항상 더 적다","starvation 이 더 많다","rotation 을 줄인다"],"answer":0,"introCard":0},{"id":"u18c-13","type":"tf","q":"디스크 부하가 큰 시스템에서는 starvation 이 적은 SCAN·C-SCAN 이 SSTF 보다 낫다.","explain":"p.40 \"SSTF is common … SCAN and C-SCAN perform better for systems that place a heavy load on the disk because of less starvation.\"","src":"18강 p.40","wiki":"디스크 스케줄링","answer":true,"introCard":0},{"id":"u18c-14","type":"tf","q":"C-SCAN 은 디스크 끝에서 처음으로 돌아오는 길에도 요청을 처리한다.","explain":"p.39 \"without servicing any requests on the return trip\". 그래야 모든 요청을 같은 방향으로 처리해 대기 시간이 고르다.","src":"18강 p.39","wiki":"C-SCAN","answer":false,"introCard":1},{"id":"u18c-15","type":"num","q":"[규칙 적용] head 50, 디스크 0~199, 요청 82, 170, 43, 140, 24, 16, 190. SSTF 의 총 head 이동량은?","explain":"50→43(7)→24(19)→16(8)→82(66)→140(58)→170(30)→190(20) = 208. 매번 지금 위치에서 가장 가까운 요청을 고른다. 43(7) vs 82(32) 처럼 거리를 직접 비교할 것.","src":"18강 p.36 규칙 적용","wiki":"SSTF","diff":2,"tags":["디스크 스케줄링"],"answer":208,"tol":0,"img":"img/os18-gen-u18c-15.png","imgAlt":"디스크 0~199 위 head 50 와 요청 82, 170, 43, 140, 24, 16, 190","introCard":0},{"id":"u18c-16","type":"num","q":"[규칙 적용] head 50, 디스크 0~199, 요청 82, 170, 43, 140, 24, 16, 190. FCFS 의 총 head 이동량은?","explain":"32 + 88 + 127 + 97 + 116 + 8 + 174 = 642. 도착 순서대로라 오락가락한다.","src":"18강 p.35 규칙 적용","wiki":"FCFS","diff":1,"tags":["디스크 스케줄링"],"answer":642,"tol":0,"img":"img/os18-gen-u18c-16.png","imgAlt":"디스크 0~199 위 head 50 와 요청 82, 170, 43, 140, 24, 16, 190","introCard":0}],"intro":[{"title":"FCFS 와 SSTF","body":"총 head 이동량 = 방문 순서대로 |차이|의 합. **FCFS**: 도착 순서대로. **SSTF**: 지금 위치에서 가장 가까운 요청부터 — STCF(SJF)와 같은 꼴이라 starvation 가능. 예: head 53, 98 183 37 122 14 124 65 67 → FCFS 640, SSTF 236(53→65→67→37→14→98→122→124→183).","img":"img/os18-p36-sstf.png","imgAlt":"SSTF head 이동 그래프","src":"18강 p.34~36"},{"title":"SCAN 과 C-SCAN","body":"**SCAN**(elevator): 한쪽 끝까지 가며 처리하고 방향을 바꾼다. 끝(0)까지 가면 53+183 = 236, 마지막 요청(14)에서 바꾸면(LOOK 식) 208 — 문제의 규칙을 따른다. **C-SCAN**: 끝까지 간 뒤 처음으로 돌아오고, 돌아오는 길에는 처리하지 않는다 → 모든 위치의 최악 대기가 같다(대가: 복귀 이동, 포함 여부는 문제에 따름). 부하가 크면 SCAN·C-SCAN 이 낫다.","img":"img/os18-p39-cscan.png","imgAlt":"C-SCAN head 이동 그래프","src":"18강 p.37~40"},{"title":"디스크 요청 큐","body":"OS 는 I/O 요청(읽기/쓰기, 메모리 주소, 디스크 주소, sector 수)을 큐에 모아 두고 다음에 처리할 요청을 고른다. 목표는 arm 이동(seek) 최소화. 문제에서 head 위치, 디스크 범위(0~199), 요청 큐, 처음 방향, 끝까지 가는지·복귀 이동을 세는지를 꼭 확인할 것.","img":"img/os18-p35-fcfs-ans.png","imgAlt":"FCFS head 이동 그래프 (queue 98, 183, 37, 122, 14, 124, 65, 67, head 53)","src":"18강 p.32~35"}]},{"id":"u18d","title":"RAID","items":[{"id":"u18d-01","type":"tf","q":"RAID 0 은 parity 도 사본도 없어서 디스크 하나만 고장 나도 배열의 데이터를 잃는다.","explain":"p.44~45 \"without parity information, redundancy, or fault tolerance\". 그래서 디스크가 늘수록 배열 실패율 1 − (1 − r)^n 이 커진다 — 슬라이드 결론 \"Don’t use\". (RAID 약자는 p.42 \"Don’t memorize\".)","src":"18강 p.44~45","wiki":"RAID 0과 RAID 1","tags":["RAID"],"answer":true,"introCard":0},{"id":"u18d-02","type":"match","q":"RAID 레벨과 방식을 연결하시오","explain":"p.44~51.","src":"18강 p.44~51","wiki":"RAID","prof":true,"tags":["RAID"],"pairs":[["RAID 0","striping, 중복 없음"],["RAID 1","mirroring"],["RAID 4","striping + 전용 parity 디스크 1개"],["RAID 5","parity 분산"],["RAID 6","parity 2개 분산"]],"introCard":0},{"id":"u18d-03","type":"num","q":"디스크 하나의 고장률 r = 5%, n = 2 일 때 RAID 0 배열 실패율은? (소수로)","explain":"1 − (1 − r)^n = 1 − 0.95² = 1 − 0.9025 = 0.0975. 교수님은 의심했지만 맞는 값이다.","src":"18강 p.45, 11/16 녹음","wiki":"RAID 0과 RAID 1","prof":true,"tags":["RAID"],"answer":0.0975,"tol":0.001,"img":"img/os18-gen-u18d-03.png","imgAlt":"RAID 0, 디스크 2개, 디스크 하나 고장률 r = 5% 의 block 배치","introCard":0},{"id":"u18d-04","type":"num","q":"r = 5%, n = 2 일 때 RAID 1 배열 실패율은? (소수로)","explain":"r^n = 0.05² = 0.0025 = 0.25%. 모든 사본이 동시에 고장 나야 실패.","src":"18강 p.47","wiki":"RAID 0과 RAID 1","prof":true,"tags":["RAID"],"answer":0.0025,"tol":0.001,"img":"img/os18-gen-u18d-04.png","imgAlt":"RAID 1, 디스크 2개, 디스크 하나 고장률 r = 5% 의 block 배치","introCard":0},{"id":"u18d-05","type":"num","q":"r = 10%, n = 3 일 때 RAID 0 배열 실패율은?","explain":"1 − 0.9³ = 1 − 0.729 = 0.271.","src":"위키 RAID 0과 RAID 1 퀴즈","wiki":"RAID 0과 RAID 1","diff":2,"tags":["RAID"],"answer":0.271,"tol":0.001,"img":"img/os18-gen-u18d-05.png","imgAlt":"RAID 0, 디스크 3개, 디스크 하나 고장률 r = 10% 의 block 배치","introCard":0},{"id":"u18d-06","type":"num","q":"r = 5%, n = 4 일 때 RAID 4 배열 실패율은 몇 % 인가? (소수 첫째 자리)","explain":"1 − [(1−r)^n + n·r·(1−r)^(n−1)] = 1 − (0.8145 + 0.1715) ≈ 0.014 = 1.4%. 교수님: 알아야 할 것은 디스크 하나 고장은 복구된다는 것.","src":"18강 p.48, 11/16 녹음","wiki":"RAID 4와 parity","prof":true,"diff":3,"tags":["RAID"],"answer":1.4,"unit":"%","tol":0.01,"img":"img/os18-gen-u18d-06.png","imgAlt":"RAID 4, 디스크 4개, 디스크 하나 고장률 r = 5% 의 block 배치","introCard":0},{"id":"u18d-07","type":"num","q":"1TB 디스크 4개로 RAID 4 를 만들면 쓸 수 있는 용량은 몇 TB 인가?","explain":"공간 효율 1 − 1/n = 0.75 → 4 × 0.75 = 3TB (데이터 디스크 3 + parity 1).","src":"18강 p.48","wiki":"RAID 4와 parity","tags":["RAID"],"answer":3,"unit":"TB","tol":0,"img":"img/os18-gen-u18d-07.png","imgAlt":"RAID 4, 디스크 4개, 각 1TB 의 block 배치","introCard":0},{"id":"u18d-08","type":"num","q":"2TB 디스크 3개로 RAID 1 을 만들면 쓸 수 있는 용량은 몇 TB 인가?","explain":"공간 효율 1/n. 배열은 가장 작은 member 디스크만큼만 쓴다 → 2TB. 교수님: 사본 3개면 공간 효율 1/3.","src":"18강 p.46~47","wiki":"RAID 0과 RAID 1","diff":2,"tags":["RAID"],"answer":2,"unit":"TB","tol":0,"img":"img/os18-gen-u18d-08.png","imgAlt":"RAID 1, 디스크 3개, 각 2TB 의 block 배치","introCard":0},{"id":"u18d-09","type":"num","q":"블록 101, 010, 011 의 parity 를 XOR 로 구하면? (2진수 세 자리를 10진수로 바꿔 쓰시오. 예: 110 → 6)","explain":"101 XOR 010 = 111, 111 XOR 011 = 100 → 10진수 4 (p.49).","src":"18강 p.49","wiki":"RAID 4와 parity","prof":true,"diff":2,"tags":["parity"],"img":"img/os18-p49-parity.png","imgAlt":"p.49 parity 계산 — 결과가 가려져 있다","explainImg":"img/os18-p49-parity-ans.png","answer":4,"tol":0,"introCard":1},{"id":"u18d-10","type":"cloze","q":"Disk 0~2 가 1100, 1010, 0110 이면 parity 는 ___ 다. Disk 2 가 고장 나면 1100 XOR 1010 XOR parity = ___ 로 복구한다.","explain":"1100 XOR 1010 = 0110, 0110 XOR 0110 = 0000. 모든 블록(parity 포함)을 XOR 하면 0 이라 하나가 빠져도 나머지 XOR 이 빠진 값이다.","src":"위키 RAID 4와 parity 퀴즈","wiki":"RAID 4와 parity","diff":2,"tags":["parity"],"answer":["0000","0110"],"bank":["0000","0110","1110","1001","0011"],"introCard":1},{"id":"u18d-11","type":"mc","q":"RAID 4 에서 작은 random write 가 느린 이유는?","explain":"교수님: 쓰기마다 parity 디스크 → 병목. RAID 5 는 parity 를 분산해 해결하므로 RAID 4 를 쓸 이유가 없다.","src":"18강 p.50, 11/16 녹음","wiki":"RAID 5와 RAID 6","prof":true,"tags":["RAID"],"img":"img/os18-p48-raid4.png","imgAlt":"p.48 RAID 4 배치 — Disk 3 에 Ap~Dp parity block","choices":["모든 쓰기가 같은 parity 디스크를 갱신해서 병목","striping 을 안 해서","mirroring 이라서","XOR 계산이 불가능해서"],"answer":0,"introCard":1},{"id":"u18d-12","type":"tf","q":"RAID 6 은 parity 가 둘이라 디스크 두 개가 동시에 고장 나도 버티지만 쓰기가 더 느리다.","explain":"p.51. 기업 시스템에서 가장 많이 쓴다고 알려져 있다.","src":"18강 p.51","wiki":"RAID 5와 RAID 6","answer":true,"introCard":1},{"id":"u18d-13","type":"mc","q":"RAID 10 은 어떤 구성인가?","explain":"11/16 녹음.","src":"11/16 녹음","wiki":"RAID","prof":true,"diff":2,"choices":["둘씩 RAID 1 로 묶고 그것들을 RAID 0 으로 — random read 많은 DB 용","parity 를 10개 둔 것","RAID 1 을 10개 복사","RAID 0 디스크 10개"],"answer":0,"introCard":0},{"id":"u18d-14","type":"mc","q":"RAID 5 그림에서 Disk 1 의 C 줄(가림)에 들어갈 block 은?","explain":"RAID 5 는 parity 를 줄마다 다른 디스크에 돌려 놓는다: A 줄 parity 는 Disk 3, B 줄은 Disk 2, C 줄은 Disk 1, D 줄은 Disk 0. 그래서 A1·B2 쓰기처럼 서로 다른 parity 디스크를 쓰는 쓰기는 동시에 할 수 있다(parity disk 병목 없음).","src":"18강 p.50","wiki":"RAID 5와 RAID 6","tags":["RAID"],"img":"img/os18-p50-raid5.png","imgAlt":"p.50 RAID 5 배치 — Disk 1 의 한 칸이 가려져 있다","explainImg":"img/os18-p50-raid5-ans.png","choices":["Cp (C 줄의 parity)","C2","C1","Bp"],"answer":0,"introCard":2},{"id":"u18d-15","type":"num","q":"[규칙 적용] 2TB 디스크 4개로 RAID 5 를 만들면 쓸 수 있는 용량은 몇 TB 인가?","explain":"parity 가 분산돼 있어도 줄마다 한 칸은 parity 다 → 공간 효율 1 − 1/n = 3/4. 4 × 2 × 3/4 = 6TB. RAID 6 이면 parity 2칸이라 1 − 2/n.","src":"18강 p.48, p.50 규칙 적용","wiki":"RAID 5와 RAID 6","tags":["RAID"],"answer":6,"unit":"TB","tol":0,"img":"img/os18-gen-u18d-15.png","imgAlt":"RAID 5, 디스크 4개, 각 2TB 의 block 배치","introCard":0},{"id":"u18d-16","type":"num","q":"[규칙 적용] 디스크 고장률 r = 10%, n = 3 인 RAID 1 배열의 실패율은? (소수로)","explain":"RAID 1 은 사본이 모두 동시에 고장 나야 실패 → $r^n$ = 0.1³ = 0.001. 같은 조건의 RAID 0 은 1 − 0.9³ = 0.271.","src":"18강 p.47 규칙 적용","wiki":"RAID 0과 RAID 1","tags":["RAID"],"answer":0.001,"tol":0.001,"img":"img/os18-gen-u18d-16.png","imgAlt":"RAID 1, 디스크 3개, 디스크 하나 고장률 r = 10% 의 block 배치","introCard":0}],"intro":[{"title":"RAID 0 과 RAID 1","body":"디스크 n 개, 한 디스크 고장률 r. **RAID 0**(striping, 중복 없음): 성능 n배, 공간 효율 1.0, 배열 실패율 $1-(1-r)^n$ — 하나만 고장 나도 잃는다(Don't use). **RAID 1**(mirroring): 실패율 $r^n$(모두 동시에 고장), 읽기 n배·쓰기 1배, 공간 효율 1/n(가장 작은 디스크만큼). RAID 10 = 둘씩 mirroring 한 것을 striping.","src":"18강 p.42~47"},{"title":"RAID 4 와 parity","body":"**RAID 4**: block 단위 striping + 전용 parity 디스크 1개. parity = 데이터 block 들의 **XOR**(101⊕010⊕011 = 100). 디스크 하나가 고장 나면 나머지 전부를 XOR 해 복구. 공간 효율 $1-1/n$, 실패율 $1-[(1-r)^n + nr(1-r)^{n-1}]$(두 개 이상 고장). 작은 random write 가 모두 parity 디스크를 갱신해 병목.","img":"img/os18-p48-raid4full.png","imgAlt":"RAID 4: Disk 0~2 데이터, Disk 3 parity, 성능·효율·실패율 식","src":"18강 p.48~49"},{"title":"RAID 5 와 RAID 6","body":"**RAID 5**: parity 를 줄마다 다른 디스크에 분산(A 줄은 Disk 3, B 는 2, C 는 1, D 는 0) → parity 병목이 없어 random write 가 좋다. 공간 효율 $1-1/n$. **RAID 6**: parity 두 개를 분산 → 디스크 두 개 동시 고장도 버티지만 쓰기가 더 느리다. 기업 시스템에서 가장 많이 쓴다.","img":"img/os18-p50-raid5-ans.png","imgAlt":"RAID 5 배치: parity Ap, Bp, Cp, Dp 가 디스크마다 돌아가며","src":"18강 p.50~51"}]}]},{"id":"u19","title":"19강 File and Directory","desc":"inode · 디렉터리 · 권한 · fd · offset · rename · hard/symbolic link","lessons":[{"id":"u19a","title":"파일 · 디렉터리 · inode","items":[{"id":"u19a-01","type":"cloze","q":"File 은 읽고 쓸 수 있는 바이트의 linear ___ 이고, 보통 ___ number 로 부른다(pid 와 비슷).","explain":"p.3 정의. 내용의 의미는 만든 쪽(creator)이 정한다.","src":"19강 p.3","wiki":"inode","tags":["inode"],"answer":["array","inode"],"bank":["array","inode","list","block","page"],"introCard":0},{"id":"u19a-02","type":"sa","q":"파일의 low-level name(pid 처럼 OS 가 파일을 부르는 번호)은? (영어 두 단어)","explain":"p.3 \"It is often referred to as its inode number (similar to pid).\"","src":"19강 p.3","wiki":"inode","tags":["inode"],"answer":"inode number","alts":["inode","i-number","inode #"],"introCard":0},{"id":"u19a-03","type":"mc","q":"디렉터리의 내용은?","explain":"p.3 \"Directory: A special file that is a collection of files and other directories.\" 디렉터리도 inode number 로 식별한다.","src":"19강 p.3, p.9","wiki":"디렉터리","tags":["디렉터리"],"choices":["(사람이 읽는 이름, inode #) 쌍의 목록","파일 데이터 블록","파일 크기와 권한","logical block 번호 목록"],"answer":0,"introCard":0},{"id":"u19a-04","type":"tf","q":"파일 이름은 그 파일의 inode 안에 저장된다.","explain":"이름은 디렉터리 엔트리에 있다. 그래서 한 파일(inode)에 이름을 여러 개 붙일 수 있다(hard link). struct stat 으로 이름을 알 수 없는 이유.","src":"19강 p.25~26, p.33","wiki":"inode","diff":2,"tags":["inode"],"answer":false,"introCard":0},{"id":"u19a-05","type":"match","q":"저장 장치 추상화의 층(Physical disks → Logical blocks → Files & directories)과 그 사이를 연결하시오","explain":"p.5. 맨 위 트리가 \"Virtualized view to storage\".","src":"19강 p.5","wiki":"파일과 디렉터리","pairs":[["Physical disks","실제 HDD·SSD"],["Logical blocks","0~N 번 번호 붙은 블록 배열"],["Files & directories","사람이 보는 이름 트리"],["Abstraction","disk 층과 block 층 사이 점선"],["Virtualization","block 층과 파일 층 사이 점선"]],"img":"img/os19-p05-layers-ans.png","imgAlt":"Files & directories 트리, Logical blocks, Physical disks 와 Virtualization·Abstraction 경계","introCard":1},{"id":"u19a-06","type":"sa","q":"모든 경로가 시작하는, 이름이 `/` 한 글자인 디렉터리는?","explain":"p.5 첫 문장.","src":"19강 p.5~6","wiki":"경로와 working directory","diff":1,"answer":"root","alts":["root directory"],"introCard":0},{"id":"u19a-07","type":"match","q":"경로 용어를 연결하시오","explain":"p.6.","src":"19강 p.6","wiki":"경로와 working directory","pairs":[["absolute pathname","root(/) 부터 쓴 경로"],["relative pathname","working directory 기준 경로"],["working directory","프로세스의 현재 디렉터리"],["home directory","사용자의 기본 디렉터리 (~)"]],"introCard":1},{"id":"u19a-08","type":"tf","q":"Unix 는 디스크 파일뿐 아니라 장치·IPC·커널 정보까지 파일 개념을 확장한다.","explain":"p.7 \"UNIX extends the file concept\". 흔히 \"everything is a file\" 이라 부른다.","src":"19강 p.7~8","wiki":"Unix 파일","answer":true,"introCard":1},{"id":"u19a-09","type":"mc","q":"struct stat 으로 알 수 없는 것은?","explain":"이름은 inode 가 아니라 디렉터리 엔트리에 있다.","src":"19강 p.25~26","wiki":"inode","tags":["inode"],"choices":["파일 이름","파일 크기","link 수","소유자 uid"],"answer":0,"introCard":0},{"id":"u19a-10","type":"num","q":"4KB 블록 파일 시스템에 5000바이트 파일을 만들었다. stat 의 Blocks(512B 단위)는?","explain":"5000B 는 4KB 블록 2개 = 8192B 가 필요 → 8192 / 512 = 16. Size 는 5000.","src":"위키 inode","wiki":"inode","diff":3,"answer":16,"tol":0,"introCard":2},{"id":"u19a-11","type":"tf","q":"서로 다른 파일 시스템(파티션)에 있는 두 파일은 inode 번호가 같을 수 있다.","explain":"inode 번호는 파일 시스템 안에서만 유일하다. 그래서 st_dev 와 함께 봐야 하고, hard link 가 파티션을 못 넘는다.","src":"19강 p.37","wiki":"inode","diff":2,"answer":true,"introCard":0},{"id":"u19a-12","type":"mc","q":"파일 권한만 chmod 로 바꿨을 때 바뀌는 시간은?","explain":"내용이 그대로라 mtime 은 안 바뀌고, inode(메타데이터) 변경 시간인 ctime 만 바뀐다.","src":"위키 inode","wiki":"inode","diff":3,"choices":["ctime","mtime","둘 다","둘 다 아님"],"answer":0,"introCard":2},{"id":"u19a-13","type":"tf","q":"OS 는 파일 내용이 텍스트인지 binary 인지 구별해서 저장한다.","explain":"p.3: 내용은 \"defined by a creator\". OS 는 바이트 배열로만 다룬다.","src":"19강 p.3","wiki":"inode","answer":false,"introCard":0},{"id":"u19a-14","type":"cloze","q":"그림: 맨 위 Files & directories 트리와 Logical blocks 사이의 점선은 ① ___, Logical blocks 와 Physical disks 사이는 ② ___ 이다.","explain":"디스크 장치가 섹터 구조를 숨기고 번호 붙은 logical block 배열을 보여 주는 것이 abstraction(18강 p.29), 그 위에 OS 가 이름 붙은 파일·디렉터리 트리를 만들어 주는 것이 virtualization — \"Virtualized view to storage\".","src":"19강 p.5","wiki":"파일과 디렉터리","img":"img/os19-p05-layers.png","imgAlt":"p.5 저장 장치 계층 그림 — 두 점선의 이름이 ①②로 가려져 있다","explainImg":"img/os19-p05-layers-ans.png","answer":["Virtualization","Abstraction"],"bank":["Virtualization","Abstraction","Translation","Segmentation","Caching"],"introCard":1},{"id":"u19a-15","type":"sa","q":"디렉터리 내용 예. 엔트리 (207, \"bookmark\") 에서 207 은 무엇인가? (영어 두 단어)","explain":"디렉터리는 (user-readable name, inode #) 쌍의 목록이다. 이름 \"bookmark\" 를 찾으면 inode 207 로 가서 그 파일의 메타데이터와 데이터 블록 위치를 얻는다.","src":"19강 p.9","wiki":"디렉터리","tags":["디렉터리"],"img":"img/os19-p09-dirent.png","imgAlt":"p.9 디렉터리 엔트리 예 — 120 fred, 207 bookmark, 235 abc","answer":"inode number","alts":["inode #","inode","i-number"],"introCard":0},{"id":"u19a-16","type":"mc","q":"예제 디렉터리 트리에서 bar.txt 라는 파일의 absolute pathname 을 모두 고르면?","explain":"root(/) 에서 트리를 따라 내려가며 이름을 / 로 잇는다. 왼쪽은 / → foo → bar.txt, 오른쪽은 / → bar → foo → bar.txt. 이름이 같아도 경로가 다르면 다른 파일이다.","src":"19강 p.10","wiki":"경로와 working directory","tags":["디렉터리"],"img":"img/os19-p10-tree.png","imgAlt":"p.10 예제 디렉터리 트리","choices":["/foo/bar.txt 와 /bar/foo/bar.txt","/bar.txt 하나","/foo/bar.txt 하나","/bar/bar.txt 와 /foo/bar.txt"],"answer":0,"introCard":0},{"id":"u19a-17","type":"sa","q":"[용어] Every process has one; it is the directory from which all relative pathnames are interpreted. (2 words, w… d…)","explain":"p.6. 현재 위치는 pwd 로 보고, 로그인하면 home directory 가 working directory 가 된다.","src":"19강 p.6","wiki":"경로와 working directory","diff":1,"answer":"working directory","alts":["current working directory"],"introCard":1}],"intro":[{"title":"file 과 directory","body":"**File** = 읽고 쓰는 바이트의 linear array, 내용의 의미는 만든 쪽이 정한다. low-level name 은 **inode number**(pid 와 비슷). **Directory** = (사람이 읽는 이름, inode #) 쌍의 목록을 담은 특별한 파일, 자신도 inode number 로 식별. 파일 이름은 inode 가 아니라 디렉터리 엔트리에 있다.","img":"img/os19-p09-dirent.png","imgAlt":"디렉터리 엔트리 예: 120 fred, 207 bookmark, 235 abc","src":"19강 p.3, 9"},{"title":"경로와 계층","body":"모든 것은 root(`/`)에서 시작하는 트리. **absolute pathname** = /부터(/home/dgist/file1), **relative pathname** = **working directory** 기준. 저장 장치 층: physical disks → (abstraction) logical blocks → (virtualization) files & directories. Unix 는 장치·IPC·커널(/proc)까지 파일로 다룬다.","img":"img/os19-p10-tree.png","imgAlt":"예제 디렉터리 트리: / 아래 foo, bar, bar.txt","src":"19강 p.5~10"},{"title":"stat 과 inode 메타데이터","body":"stat() 이 보여 주는 것은 inode 에 있는 메타데이터: 크기, inode number, link 수, uid, 권한, Blocks(512B 단위 수), atime/mtime/ctime. 4KB 블록 FS 에서 5000B 파일은 블록 2개 → Blocks 16. 권한만 바꾸면 ctime 만 바뀐다. inode 번호는 파일 시스템 안에서만 유일.","src":"19강 p.25~26"}]},{"id":"u19b","title":"권한 · file descriptor · offset","items":[{"id":"u19b-01","type":"num","q":"`rwxr-x--x` 를 8진수 세 자리로 쓰면?","explain":"r4 w2 x1 → user 7, group r-x = 5, others --x = 1 → 751 (p.13).","src":"19강 p.13","wiki":"권한 비트","prof":true,"tags":["권한"],"img":"img/os19-p13-perm.png","imgAlt":"p.13 rwxr-x--x 의 비트와 자릿값 — 결과 8진수가 가려져 있다","explainImg":"img/os19-p13-perm-ans.png","answer":751,"tol":0,"introCard":0},{"id":"u19b-02","type":"num","q":"`rw-r--r--` 를 8진수 세 자리로 쓰면?","explain":"4+2, 4, 4 → 644.","src":"위키 권한 비트","wiki":"권한 비트","tags":["권한"],"answer":644,"tol":0,"introCard":0},{"id":"u19b-03","type":"sa","q":"8진수 750 을 rwx 9 글자로 쓰면?","explain":"7 = rwx, 5 = r-x, 0 = ---.","src":"위키 권한 비트","wiki":"권한 비트","tags":["권한"],"answer":"rwxr-x---","introCard":0},{"id":"u19b-04","type":"tf","q":"권한이 `rwxr-x--x` 인 파일을 owner 도 group 도 아닌 사용자가 cat 으로 읽을 수 있다.","explain":"others 칸이 `--x` 라 실행만 된다. 읽기(r)가 없다.","src":"위키 권한 비트","wiki":"권한 비트","tags":["권한"],"answer":false,"introCard":0},{"id":"u19b-05","type":"num","q":"`mkdir(\"foo\", 0777)` 인데 umask 가 027 이면 실제 권한은 8진수로?","explain":"777 & ~027 = 750 (group 의 w, others 의 rwx 가 꺼짐). p.28 의 drwxr-x--- 가 이 값.","src":"위키 권한 비트","wiki":"권한 비트","diff":3,"tags":["권한"],"answer":750,"tol":0,"introCard":0},{"id":"u19b-06","type":"match","q":"fd 번호와 처음부터 열려 있는 파일을 연결하시오","explain":"p.21 \"Each process begins life with three open files associated with a terminal.\"","src":"19강 p.19~21","wiki":"file descriptor","tags":["fd"],"pairs":[["0","stdin"],["1","stdout"],["2","stderr"],["3","아무것도 안 닫았을 때 처음 open 한 파일"]],"introCard":1},{"id":"u19b-07","type":"num","q":"프로세스가 막 시작해 0·1·2 만 열려 있다. open(\"a\"), open(\"b\"), open(\"c\") 를 한 뒤 close(3), close(4), open(\"d\"), open(\"e\"), open(\"f\") 를 하면 f 의 fd 는?","explain":"a·b·c = 3·4·5. 3·4 를 닫으면 d = 3, e = 4, f 는 비어 있는 가장 작은 번호 6 (5 는 c 사용 중).","src":"위키 file descriptor","wiki":"file descriptor","diff":2,"tags":["fd"],"answer":6,"tol":0,"img":"img/os19-gen-u19b-07.png","imgAlt":"처음 fd table: 0 stdin, 1 stdout, 2 stderr, 3 이상 비어 있음","introCard":1},{"id":"u19b-08","type":"tf","q":"open 이 돌려주는 file descriptor 는 비어 있는 가장 작은 음이 아닌 정수다.","explain":"p.21 \"Non-negative integer (the lowest unused integer).\"","src":"19강 p.21","wiki":"file descriptor","tags":["fd"],"answer":true,"introCard":1},{"id":"u19b-09","type":"mc","q":"close(1) 뒤 open(\"g\") 를 하면?","explain":"1 이 비어 있는 가장 작은 번호라 g 에 1 이 배정된다.","src":"위키 file descriptor","wiki":"file descriptor","diff":3,"tags":["fd"],"choices":["g 가 fd 1 이 되어 이후 stdout 출력이 파일 g 로 간다","g 는 fd 3","open 이 실패한다","stdout 이 stderr 로 바뀐다"],"answer":0,"introCard":1},{"id":"u19b-10","type":"sa","q":"열린 파일에서 다음 read/write 가 시작될 위치를 무엇이라 하는가? (영어 두 단어)","explain":"p.22 \"An open file has a current offset.\"","src":"19강 p.22","wiki":"파일 offset과 lseek","tags":["offset"],"answer":"current offset","alts":["offset","file offset"],"introCard":2},{"id":"u19b-11","type":"num","q":"크기 100B 파일을 열고 read(fd, buf, 30), lseek(fd, 10, SEEK_CUR), lseek(fd, -20, SEEK_END) 를 한 뒤의 offset 은?","explain":"read 30 → 30, SEEK_CUR +10 → 40, SEEK_END −20 → 100 − 20 = 80.","src":"위키 파일 offset과 lseek","wiki":"파일 offset과 lseek","diff":2,"tags":["offset"],"answer":80,"tol":0,"img":"img/os19-gen-u19b-11.png","imgAlt":"크기 100B 파일의 byte 막대, offset 0. read(30) → lseek(+10, SEEK_CUR) → lseek(-20, SEEK_END)","introCard":2},{"id":"u19b-12","type":"num","q":"크기 100B 파일의 offset 이 80 일 때 read(fd, buf, 50) 의 반환값은?","explain":"80 부터 끝까지 20바이트밖에 없다. offset 은 100 이 되고 다음 read 는 0 을 돌려준다.","src":"위키 파일 offset과 lseek","wiki":"파일 offset과 lseek","diff":2,"tags":["offset"],"answer":20,"tol":0,"img":"img/os19-gen-u19b-12.png","imgAlt":"크기 100B 파일의 byte 막대, offset 80. read(fd, buf, 50) 를 부른다","introCard":2},{"id":"u19b-13","type":"match","q":"lseek 의 whence 와 새 offset 을 연결하시오","explain":"p.23.","src":"19강 p.23","wiki":"파일 offset과 lseek","tags":["offset"],"pairs":[["SEEK_SET","offset"],["SEEK_CUR","현재 위치 + offset"],["SEEK_END","파일 크기 + offset"],["lseek 의 반환값","옮긴 뒤의 새 offset"]],"introCard":2},{"id":"u19b-14","type":"tf","q":"lseek 를 부르면 디스크 head 가 그 위치로 움직인다.","explain":"lseek 는 커널 안 offset 값만 바꾼다. 18강의 disk seek 와 다르다.","src":"위키 파일 offset과 lseek","wiki":"파일 offset과 lseek","diff":2,"answer":false,"introCard":2},{"id":"u19b-15","type":"cloze","q":"`strace cat foo` 출력(파일 foo 의 내용은 \"hello\\n\"). open 의 반환값 ___, 첫 read 의 반환값 ___, 두 번째 read 의 반환값 ___","explain":"open 은 비어 있는 가장 작은 fd 인 3 을 준다(0·1·2 는 터미널). read 는 읽은 바이트 수 — \"hello\\n\" 6바이트. 다음 read 는 남은 게 없어 0(EOF). 4096 은 버퍼 크기일 뿐이다.","src":"19강 p.19~21","wiki":"file descriptor","tags":["fd"],"img":"img/os19-p20-strace.png","imgAlt":"p.20 strace cat foo — 시스템 콜 반환값이 가려져 있다","explainImg":"img/os19-p20-strace-ans.png","answer":["3","6","0"],"bank":["3","6","0","1","4096","-1"],"introCard":1},{"id":"u19b-16","type":"sa","q":"[용어] open() 이 돌려주는, 이후 read/write 에서 파일을 가리키는 프로세스별 정수. (2 words, f… d…)","explain":"p.15, p.21. non-negative integer, 비어 있는 가장 작은 번호.","src":"19강 p.15, p.21","wiki":"file descriptor","tags":["fd"],"answer":"file descriptor","alts":["fd"],"introCard":1},{"id":"u19b-17","type":"sa","q":"[규칙 적용] 8진수 640 을 rwx 9 글자로 쓰면?","explain":"6 = 4 + 2 = rw-, 4 = r--, 0 = ---. owner 는 읽고 쓰기, group 은 읽기만, others 는 아무것도 못 한다. p.26 stat 출력의 Access: (0640/-rw-r-----) 가 이것.","src":"19강 p.12~13, p.26 규칙 적용","wiki":"권한 비트","tags":["권한"],"answer":"rw-r-----","introCard":0}],"intro":[{"title":"권한 비트","body":"user · group · others 마다 r w x. 8진수로 r = 4, w = 2, x = 1 을 더한다: rwxr-x--x = 751, rw-r----- = 640. **umask** 는 꺼 버릴 비트 — mode & ~umask (0777 & ~027 = 750).","img":"img/os19-p13-perm-ans.png","imgAlt":"rwxr-x--x 의 비트와 자릿값 → 751","src":"19강 p.11~13"},{"title":"file descriptor","body":"open() 은 **file descriptor** 를 돌려준다 — 비어 있는 가장 작은 음이 아닌 정수. 프로세스는 0 stdin, 1 stdout, 2 stderr 를 열고 시작하므로 첫 open 은 3. close(1) 뒤 open 하면 1 을 받아 출력이 그 파일로 간다. read/write 는 실제로 읽고 쓴 바이트 수를 돌려주고, 끝이면 read 는 0.","img":"img/os19-p20-strace-ans.png","imgAlt":"strace cat foo: open = 3, read = 6, write = 6, read = 0","src":"19강 p.15~21"},{"title":"current offset 과 lseek","body":"열린 파일마다 **current offset**: 다음 read/write 가 시작할 위치. N 바이트 읽고 쓰면 N 만큼 늘고, lseek(fd, off, whence) 로 직접 바꾼다 — SEEK_SET = off, SEEK_CUR = 현재 + off, SEEK_END = 파일 크기 + off, 반환값은 새 offset. lseek 는 커널 안 값만 바꾸고 디스크 head 를 움직이지 않는다.","src":"19강 p.22~23"}]},{"id":"u19c","title":"rename · fsync · 디렉터리 API","items":[{"id":"u19c-01","type":"tf","q":"rename(old, new) 은 atomic call 로 구현된다.","explain":"p.24 \"It is implemented as an atomic call.\" 그래서 파일 내용을 통째로 안전하게 바꾸는 데 쓴다.","src":"19강 p.24","wiki":"rename과 atomic update","tags":["rename"],"answer":true,"introCard":0},{"id":"u19c-02","type":"order","q":"파일 foo.txt 를 atomic 하게 새 내용으로 바꾸는 순서","explain":"p.24. fsync 를 rename 보다 먼저 해야 이름이 내용이 디스크에 내려간 파일을 가리킨다.","src":"19강 p.24","wiki":"rename과 atomic update","diff":2,"tags":["rename"],"answer":["foo.txt.tmp 를 open","새 내용을 write","fsync(fd)","close(fd)","rename(\"foo.txt.tmp\", \"foo.txt\")"],"introCard":0},{"id":"u19c-03","type":"mc","q":"write 직후(fsync 전) 전원이 나갔다. 재부팅 후 foo.txt 의 내용은?","explain":"foo.txt 는 아직 건드리지 않았다. tmp 는 비었거나 일부만 남는다.","src":"위키 rename과 atomic update","wiki":"rename과 atomic update","diff":2,"choices":["옛 내용","새 내용","빈 파일","반반 섞인 내용"],"answer":0,"introCard":0},{"id":"u19c-04","type":"tf","q":"write 가 성공하면 데이터는 이미 디스크에 있다.","explain":"write 는 보통 메모리 버퍼에만 넣는다. 디스크로 내리려면 fsync 가 필요하다.","src":"19강 p.24","wiki":"rename과 atomic update","diff":2,"answer":false,"introCard":0},{"id":"u19c-05","type":"tf","q":"rename 은 파일 데이터 블록을 새 위치로 복사한다.","explain":"rename 은 디렉터리 엔트리만 고친다. inode 번호도 그대로다.","src":"위키 rename과 atomic update","wiki":"rename과 atomic update","answer":false,"introCard":0},{"id":"u19c-06","type":"mc","q":"`rm` 명령이 부르는 시스템 콜은?","explain":"p.27. 왜 unlink 라는 이름인지는 hard link 에서 답한다 — 이름 하나를 떼는 일이라서.","src":"19강 p.27","wiki":"디렉터리 API","prof":true,"choices":["unlink()","remove()","delete()","rmdir()"],"answer":0,"introCard":1},{"id":"u19c-07","type":"mc","q":"막 mkdir 한 빈 디렉터리에 들어 있는 엔트리는?","explain":"p.28 \"Empty directory have two entries: . (itself), .. (parent)\". link count 는 2.","src":"19강 p.28","wiki":"디렉터리 API","tags":["디렉터리"],"img":"img/os19-p28-mkdir.png","imgAlt":"p.28 mkdir 직후 ls -al — 새 디렉터리의 link count 가 가려져 있다","explainImg":"img/os19-p28-mkdir-ans.png","choices":[". 과 ..","없음",". 만","lost+found"],"answer":0,"introCard":1},{"id":"u19c-08","type":"num","q":"/home 의 link count 가 5 였다. mkdir /home/x 를 하면 /home 의 link count 는?","explain":"새 디렉터리의 .. 이 /home 을 가리켜 1 오른다. 이어서 일반 파일을 만들면 그대로 6.","src":"위키 디렉터리 API","wiki":"디렉터리 API","diff":3,"answer":6,"tol":0,"introCard":1},{"id":"u19c-09","type":"tf","q":"rmdir 은 비어 있지 않은 디렉터리에도 성공한다.","explain":"p.30 \"Require that the directory be empty … it will fail.\" empty = . 과 .. 만 있음.","src":"19강 p.30","wiki":"디렉터리 API","answer":false,"introCard":1},{"id":"u19c-10","type":"mc","q":"struct dirent 만으로 알 수 있는 것은?","explain":"크기·권한은 inode 에 있어 stat() 을 따로 불러야 한다.","src":"19강 p.29","wiki":"디렉터리 API","diff":2,"choices":["이름과 inode 번호","파일 크기","권한","수정 시간"],"answer":0,"introCard":0},{"id":"u19c-11","type":"tf","q":"디렉터리는 write() 로 직접 내용을 고칠 수 없고 전용 API(mkdir, unlink 등)를 쓴다.","explain":"디렉터리 형식은 파일 시스템이 지켜야 하는 메타데이터라서 사용자가 직접 쓰지 못한다.","src":"19강 p.27~30","wiki":"디렉터리 API","diff":2,"answer":true,"introCard":1},{"id":"u19c-12","type":"cloze","q":"파일을 안전하게 바꾸려면 tmp 파일에 쓰고 ___ 로 디스크에 내린 뒤 ___ 로 원래 이름으로 바꾼다.","explain":"p.24. rename 이 atomic 이라 다른 프로세스는 옛 내용 아니면 새 내용만 본다.","src":"19강 p.24","wiki":"rename과 atomic update","tags":["rename"],"answer":["fsync","rename"],"bank":["fsync","rename","lseek","unlink","link"],"introCard":0},{"id":"u19c-13","type":"tf","q":"rename 후 파일의 inode 번호가 새로 바뀐다.","explain":"rename 은 디렉터리 엔트리의 이름만 바꾼다. inode 와 데이터는 그대로.","src":"위키 rename과 atomic update","wiki":"rename과 atomic update","answer":false,"introCard":0},{"id":"u19c-14","type":"num","q":"mkdir foo 직후 foo 안에서 ls -al 을 했다. ./ 줄의 link count(가려짐)는?","explain":"빈 디렉터리도 엔트리가 두 개 있다. 부모 디렉터리의 \"foo\" 엔트리와 자기 안의 \".\" 가 같은 inode 를 가리키므로 link count 2. 하위 디렉터리를 하나 만들 때마다 그 \"..\" 때문에 1 씩 는다.","src":"19강 p.28","wiki":"디렉터리 API","tags":["디렉터리"],"img":"img/os19-p28-mkdir.png","imgAlt":"p.28 mkdir 과 ls -al 출력 — ./ 의 link count 가 가려져 있다","explainImg":"img/os19-p28-mkdir-ans.png","answer":2,"tol":0,"introCard":1}],"intro":[{"title":"rename 과 atomic update","body":"rename(old, new) 은 **atomic call** — 디렉터리 엔트리 이름만 바꾸고 inode 와 데이터는 그대로. 파일 내용을 안전하게 바꾸려면: tmp 파일 open → write → **fsync**(write 는 보통 메모리 버퍼에만 넣으므로 디스크로 내림) → close → rename(tmp, 원래 이름). 다른 프로세스는 옛 내용 아니면 새 내용만 본다.","src":"19강 p.24"},{"title":"디렉터리 API","body":"rm 은 **unlink()** 를 부른다(이름 하나를 떼는 일). mkdir() 로 만든 빈 디렉터리에도 . (자기)과 .. (부모) 두 엔트리 → link count 2, 하위 디렉터리를 만들 때마다 그 .. 때문에 부모 link count +1. readdir 의 struct dirent 에는 이름·inode 번호뿐(크기·권한은 stat). rmdir 은 빈 디렉터리(. 과 .. 만)일 때만 성공. 디렉터리는 write() 로 직접 못 고친다.","img":"img/os19-p28-mkdir-ans.png","imgAlt":"mkdir 과 ls -al: ./ 의 link count 2","src":"19강 p.27~30"},{"title":"write 와 내구성","body":"write() 는 보통 데이터를 커널 메모리 버퍼에만 넣고 바로 돌아온다 — 성공해도 디스크에 있다는 뜻이 아니다. 디스크에 내리려면 **fsync(fd)**. 그래서 write 직후 전원이 나가면 tmp 는 비거나 일부만 남고 원래 파일은 옛 내용 그대로다.","src":"19강 p.24"}]},{"id":"u19d","title":"Hard link 와 symbolic link","items":[{"id":"u19d-01","type":"cloze","q":"`ln file file2` 는 디렉터리에 새 ___ 을 만들고 원본과 같은 ___ number 를 가리키게 한다. 파일은 복사되지 ___.","explain":"p.33 \"The file is not copied in any way.\"","src":"19강 p.32~33","wiki":"hard link","tags":["link"],"img":"img/os19-p33-hardlink.png","imgAlt":"p.33 ln file file2 전후 — 디렉터리 엔트리 두 개가 같은 inode 12345 를 가리키고 link count 칸이 가려져 있다","explainImg":"img/os19-p33-hardlink-ans.png","answer":["이름","inode","않는다"],"bank":["이름","inode","않는다","블록","PID","된다"],"introCard":0},{"id":"u19d-02","type":"mc","q":"`ln file file2` 직후 새로 할당되는 것은?","explain":"엔트리 (같은 inode #, file2) 하나가 생기고 inode 의 link count 가 1 오른다.","src":"위키 hard link","wiki":"hard link","tags":["link"],"choices":["디렉터리 엔트리 하나","새 inode","새 데이터 블록","inode 와 데이터 블록 모두"],"answer":0,"introCard":0},{"id":"u19d-03","type":"sa","q":"inode 에 이름(hard link)이 몇 개 붙어 있는지 세는 값을 무엇이라 부르는가? (link count 라고도 함)","explain":"p.35. unlink() 가 줄이고 0 이 되면 inode 와 데이터 블록을 해제한다 — 진짜 delete.","src":"19강 p.35","wiki":"hard link","prof":true,"tags":["link"],"answer":"reference count","alts":["link count","refcount"],"introCard":0},{"id":"u19d-04","type":"num","q":"빈 디렉터리에서 echo hi > a, ln a b, ln b c, rm a, ln c d, rm b 를 차례로 한 뒤 inode 의 Links 는?","explain":"1 → 2 → 3 → (rm a) 2 → (ln c d) 3 → (rm b) 2. 남은 이름은 c, d.","src":"위키 hard link","wiki":"hard link","diff":2,"tags":["link"],"answer":2,"tol":0,"introCard":0},{"id":"u19d-05","type":"tf","q":"hard link 두 개(c, d)가 같은 inode(Links 2)를 가리킨다. 같은 파일 시스템 안에서 `mv d e` 를 하면 Links 가 1 줄어든다.","explain":"mv 는 같은 파일 시스템 안이면 rename 이라 이름만 바꾼다. Links 는 2 그대로.","src":"위키 hard link","wiki":"hard link","diff":2,"answer":false,"introCard":0},{"id":"u19d-06","type":"mc","q":"hard link 를 다른 파티션의 파일에 만들 수 없는 이유는?","explain":"p.37 \"inode numbers are only unique within a file system.\"","src":"19강 p.37","wiki":"symbolic link","prof":true,"tags":["link"],"choices":["inode 번호는 한 파일 시스템 안에서만 유일해서","권한이 없어서","파일 크기가 달라서","symlink 만 허용돼서"],"answer":0,"introCard":0},{"id":"u19d-07","type":"cloze","q":"symbolic link 는 링크된 파일의 ___ 을 자기 데이터로 담는 별도 파일이다. 원본을 지우면 ___ reference 가 된다.","explain":"p.39~40.","src":"19강 p.39~40","wiki":"symbolic link","prof":true,"tags":["link"],"answer":["pathname","dangling"],"bank":["pathname","dangling","inode number","hard","circular"],"introCard":1},{"id":"u19d-08","type":"num","q":"`ln -s file file2` 로 만든 file2 의 크기는 몇 바이트인가?","explain":"담긴 경로 \"file\" 이 4글자 (p.39).","src":"19강 p.39","wiki":"symbolic link","tags":["link"],"answer":4,"unit":"B","tol":0,"introCard":1},{"id":"u19d-09","type":"num","q":"`ln -s /home/dgist/file1 link1` 의 link1 크기는 몇 바이트인가?","explain":"\"/home/dgist/file1\" 은 17글자. 크기 = 담긴 경로의 길이.","src":"위키 symbolic link","wiki":"symbolic link","diff":2,"tags":["link"],"answer":17,"unit":"B","tol":0,"introCard":1},{"id":"u19d-10","type":"tf","q":"symbolic link 를 만들면 원본 inode 의 link count 가 1 오른다.","explain":"symlink 는 새 inode 를 따로 만들고 원본 inode 는 건드리
