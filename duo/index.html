<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1fa463" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한입 학습">
<title>운영체제 기말 · 한입 학습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f6f7f4; --card: #ffffff; --fg: #1f2a24; --muted: #6b7570; --line: #e1e5df;
  --acc: #1fa463; --acc-d: #15804c; --acc-soft: #dff4e8;
  --red: #e5484d; --red-soft: #fde4e4; --gold: #f2b01e; --blue: #3478f6;
  --chip: #ffffff; --chip-b: #d7dcd5; --shadow: 0 2px 0 rgba(0,0,0,.08);
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --card: #1c221f; --fg: #e8ece9; --muted: #96a09a; --line: #2e3632;
    --acc: #2fc27a; --acc-d: #22955c; --acc-soft: #173826; --red: #ff6b6e; --red-soft: #3a1d1e;
    --gold: #f5c04a; --chip: #232a26; --chip-b: #3a443f; --shadow: 0 2px 0 rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--line); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; } .hidden { display: none; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
#top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: calc(8px + var(--sa-t)) 12px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.cswitch { border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 40px; padding: 0 10px; font-weight: 700; font-size: 14px; max-width: 42%; display: flex; align-items: center; cursor: pointer; }
.ctitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hstats { display: flex; align-items: center; gap: 8px; }
.hs { display: flex; align-items: center; gap: 2px; font-size: 15px; }
.hs b { font-variant-numeric: tabular-nums; }
.hs.goal { border: 0; background: none; padding: 0; min-width: 40px; min-height: 40px; justify-content: center; cursor: pointer; }
#view { flex: 1; padding: 12px 14px calc(84px + var(--sa-b)); }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--sa-b); }
#tabs button { flex: 1; max-width: 140px; min-height: 56px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); cursor: pointer; }
#tabs button i { font-style: normal; font-size: 22px; line-height: 1.1; }
#tabs button.on { color: var(--acc); font-weight: 700; }
body.insession #top, body.insession #tabs { display: none; }
body.insession #view { padding-bottom: 12px; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin: 8px 0 0; padding: 10px 16px; border-radius: 14px;
  border: 2px solid var(--chip-b); background: var(--card); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--fg); cursor: pointer; box-shadow: var(--shadow); }
.btn.primary { background: var(--acc); border-color: var(--acc-d); color: #fff; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.btn.ghost.danger { color: var(--red); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; }
.link { border: 0; background: none; color: var(--blue); padding: 8px 0; min-height: 40px; cursor: pointer; }

/* path */
.exam { margin: 0 0 10px; }
.duecard { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; border: 2px solid var(--gold); background: var(--card); cursor: pointer; }
.duecard span { font-size: 13px; color: var(--muted); }
.unit { margin-bottom: 18px; }
.uhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; color: #fff; background: var(--u); box-shadow: 0 3px 0 var(--ud); }
.utitle { font-weight: 800; font-size: 17px; } .udesc { font-size: 13px; opacity: .9; }
.uprog { font-weight: 700; font-size: 14px; background: rgba(255,255,255,.22); padding: 2px 10px; border-radius: 99px; white-space: nowrap; }
.hue0 { --u: #1fa463; --ud: #15804c; } .hue1 { --u: #3478f6; --ud: #2459bd; } .hue2 { --u: #b4579f; --ud: #87407a; }
.hue3 { --u: #e07a1f; --ud: #a95a14; } .hue4 { --u: #0f9fa8; --ud: #0b767c; } .hue5 { --u: #6f5bd6; --ud: #5243a5; }
.nodes { display: flex; flex-direction: column; align-items: center; padding: 14px 0 4px; }
.nwrap { position: relative; display: flex; flex-direction: column; align-items: center; width: 120px; margin: 6px 0; }
.node { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; position: relative; padding: 0;
  background: conic-gradient(var(--u) var(--p), var(--line) 0); display: flex; align-items: center; justify-content: center; }
.node > span { width: 60px; height: 60px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: var(--u); box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.node.done > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
.node.gold > span { background: var(--gold); color: #fff; }
.node.fresh { opacity: .75; }
.node.rec { animation: pulse 1.6s ease-in-out infinite; }
.node.rec > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--u) 50%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }
.bubble { position: absolute; top: -26px; background: var(--card); border: 2px solid var(--u); color: var(--u); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 10px; z-index: 1; }
.crown { position: absolute; top: 50px; right: 12px; font-size: 12px; font-weight: 800; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 0 5px; }
.nlabel { font-size: 13px; text-align: center; margin-top: 4px; line-height: 1.25; max-width: 120px; }
.pend { text-align: center; margin: 10px 0; }
.lmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 0; font-size: 14px; }

/* modal / toast */
#modal { display: none; position: fixed; inset: 0; z-index: 20; }
#modal.show { display: block; }
.mback { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.mbox { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto; background: var(--card);
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(16px + var(--sa-b)); animation: up .18s ease-out; }
.mbox h3 { margin: 4px 0 8px; font-size: 19px; }
.big { font-size: 56px; text-align: center; line-height: 1.2; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.crow { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px; margin: 6px 0; border-radius: 12px; border: 2px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 700; }
.crow.me { border-color: var(--acc); background: var(--acc-soft); }
.crow .muted { font-weight: 400; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(80px + var(--sa-b)); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; z-index: 30;
  background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; transition: .2s; }
#toast.show { opacity: 1; transform: translateX(-50%); }
textarea.rep { width: 100%; height: 42vh; margin-top: 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px; }

/* lesson */
.lesson { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.lbar { display: flex; align-items: center; gap: 10px; }
.x { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.prog { flex: 1; height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pfill { height: 100%; background: var(--acc); border-radius: 99px; transition: width .3s; }
.lh { font-weight: 700; min-width: 44px; text-align: right; }
.qbody { flex: 1; padding: 10px 2px; }
.qtype { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; color: var(--acc); margin-bottom: 6px; }
.prof { color: #a35b00; background: #fff0d6; border-radius: 99px; padding: 0 8px; font-weight: 700; }
@media (prefers-color-scheme: dark) { .prof { color: #ffcf7a; background: #3a2c12; } }
.combo { color: var(--gold); } .again { color: var(--red); }
.q { font-size: 19px; font-weight: 700; line-height: 1.5; margin: 4px 0 16px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 56px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); }
.choice.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.cnum { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--chip-b); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.tfrow { display: flex; gap: 12px; }
.tf { flex: 1; min-height: 140px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); }
.tfbig { font-size: 56px; font-weight: 900; line-height: 1; }
.tf.t .tfbig { color: var(--acc); } .tf.f .tfbig { color: var(--red); }
.tf.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.chip { min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); font-size: 15px; text-align: left; max-width: 100%; }
.chip.used { visibility: hidden; }
.chip.mini { min-width: 48px; text-align: center; }
.cloze { line-height: 2.2; }
.slot { display: inline-block; min-width: 64px; min-height: 40px; margin: 2px 2px; padding: 2px 10px; border-radius: 10px; border: 2px solid var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--chip)); font-size: 15px; font-weight: 700; line-height: 1.4; vertical-align: middle; cursor: pointer; max-width: 100%; }
.slot.empty { border-style: dashed; border-color: var(--chip-b); background: transparent; color: var(--muted); font-weight: 400; }
.seq { min-height: 120px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 2px dashed var(--chip-b); border-radius: 14px; }
.chip.step { display: flex; align-items: center; gap: 8px; width: 100%; border-color: var(--blue); }
.snum { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mitem { min-height: 56px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; font-size: 14px; box-shadow: var(--shadow); text-align: center; }
.mitem.r { font-size: 13px; }
.mitem.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.mitem.ok { border-color: var(--acc); background: var(--acc-soft); opacity: .55; box-shadow: none; }
.mitem.bad { border-color: var(--red); background: var(--red-soft); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.inp { width: 100%; min-height: 54px; font-size: 18px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); color: var(--fg); }
.inp:focus { outline: none; border-color: var(--blue); }
.inp.sm { min-height: 46px; font-size: 15px; }
.numrow { display: flex; gap: 8px; align-items: center; }
.numrow .inp { flex: 1; min-width: 0; }
.unit { font-weight: 700; color: var(--muted); }
.lfoot { position: sticky; bottom: 0; padding: 8px 0 calc(8px + var(--sa-b)); background: var(--bg); }
.lfoot .skip { margin-top: 0; min-height: 40px; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 560px; margin: 0 auto; transform: translateY(110%); transition: transform .2s ease-out;
  padding: 16px 16px calc(14px + var(--sa-b)); border-radius: 20px 20px 0 0; max-height: 75vh; overflow: auto; }
.sheet.show { transform: none; }
.sheet.ok { background: var(--acc-soft); } .sheet.bad { background: var(--red-soft); }
.shead { font-size: 21px; font-weight: 900; margin-bottom: 6px; }
.sheet.ok .shead { color: var(--acc-d); } .sheet.bad .shead { color: var(--red); }
@media (prefers-color-scheme: dark) { .sheet.ok .shead { color: var(--acc); } }
.sans, .sgiven { margin: 4px 0; } .sans b { color: var(--acc-d); } .sgiven b { color: var(--red); }
@media (prefers-color-scheme: dark) { .sans b { color: var(--acc); } }
.sexp { margin: 8px 0; font-size: 15px; }
.smeta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.smeta a { font-weight: 700; padding: 6px 0; }

/* result */
.result { text-align: center; padding: calc(30px + var(--sa-t)) 4px 10px; }
.result h2 { margin: 6px 0 10px; }
.pill { display: inline-block; margin: 4px; padding: 4px 12px; border-radius: 99px; background: var(--acc-soft); font-weight: 700; font-size: 14px; }
.pill.gold { background: #fff0c2; color: #7a5600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 8px; text-align: center; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; }
.tk { font-size: 13px; color: var(--muted); } .tv { font-size: 21px; font-weight: 800; }
.xpbreak { margin-bottom: 8px; }

/* pages */
.page h2 { margin: 4px 0 12px; }
.ptop { display: flex; align-items: center; gap: 8px; } .ptop h2 { margin: 4px 0; }
.back { border: 0; background: none; color: var(--blue); font-size: 16px; min-height: 44px; padding: 0 6px 0 0; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 0; }
.ctop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { background: var(--acc-soft); color: var(--acc-d); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 99px; white-space: nowrap; }
.badge.red { background: var(--red-soft); color: var(--red); }
.tagrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 44px; gap: 8px; align-items: center; width: 100%; min-height: 48px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; padding: 0; }
.tname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.tbar { display: block; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.tbar.wide { height: 12px; margin-top: 3px; }
.tpct { font-size: 13px; text-align: right; font-weight: 700; }
.ubar { margin: 10px 0; } .ulabel { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0 6px; }
.hm { aspect-ratio: 1; border-radius: 8px; background: var(--line); position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.hm i { position: absolute; top: -2px; right: -2px; font-style: normal; font-size: 11px; }
.hm.l1 { background: color-mix(in srgb, var(--acc) 30%, var(--line)); } .hm.l2 { background: color-mix(in srgb, var(--acc) 55%, var(--line)); }
.hm.l3 { background: color-mix(in srgb, var(--acc) 80%, var(--line)); color: #fff; } .hm.l4 { background: var(--acc-d); color: #fff; }
.hm.today { outline: 2px solid var(--blue); }
.topmiss { padding: 10px 0; border-bottom: 1px solid var(--line); }
.tmq { display: flex; gap: 8px; font-weight: 600; font-size: 15px; }
.rank { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--red-soft); color: var(--red); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.miss .mq { font-weight: 600; margin: 6px 0; }
.mexp { padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.seg button { min-height: 46px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; cursor: pointer; font-size: 14px; }
.seg button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
.fld { display: block; margin: 8px 0; } .fld span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.warn { background: #fff4d6; color: #6b4b00; border-radius: 10px; padding: 8px 10px; }
@media (prefers-color-scheme: dark) { .warn { background: #3a2f12; color: #ffd98a; } .pill.gold { background: #3a2f12; color: #ffd98a; } }
.katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
#probe { display: none; }

/* ---------- hub / shared extras ---------- */
.hs.moon { border: 0; background: none; font-size: 20px; min-width: 40px; min-height: 40px; padding: 0; cursor: pointer; }
#top .cswitch { flex: 1 1 auto; min-width: 0; max-width: none; }
#top .hstats { flex: none; gap: 6px; }
#focusbar { display: none; }
#focusbar.show { display: flex; position: sticky; top: calc(57px + var(--sa-t)); z-index: 4; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; background: var(--acc-soft); font-size: 14px; font-weight: 700; }
#focusbar button { border: 1px solid var(--chip-b); background: var(--card); border-radius: 10px; min-height: 36px; padding: 0 10px; cursor: pointer; }
body.insession #focusbar { display: none; }
.cchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; padding-bottom: 2px; scrollbar-width: none; }
.cchips button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; font-size: 14px; cursor: pointer; }
.cchips button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.row2.slim { margin-bottom: 10px; } .row2.slim .btn { min-height: 42px; font-size: 14px; margin-top: 0; }
.cbadge { background: var(--line); color: var(--fg); border-radius: 99px; padding: 0 8px; font-size: 12px; font-weight: 700; }
.pill.red { background: var(--red-soft); color: var(--red); }
.card.hl { border: 2px solid var(--acc); }
.crow.big { width: 100%; background: var(--card); cursor: pointer; font: inherit; font-weight: 700; min-height: 60px; }
.wlink { border: 0; background: none; color: var(--blue); font-weight: 700; padding: 6px 0; min-height: 36px; cursor: pointer; font-size: 13px; }
/* today */
.hello { display: flex; justify-content: space-between; align-items: center; }
.hello h2 { margin: 2px 0 8px; font-size: 24px; }
.ddays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 6px 0 12px; }
.dd { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px; text-align: center; min-width: 0; }
.ddn { font-weight: 900; font-size: 18px; color: var(--red); }
.ddc { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ddd { font-size: 11px; }
.tbd { display: block; font-size: 10px; color: var(--gold); font-weight: 800; }
.btn.go { flex-direction: column; min-height: 78px; font-size: 20px; }
.btn.go small { font-size: 13px; font-weight: 600; opacity: .9; }
.split { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.sp { border: 0; background: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 4px 0; min-width: 0; }
.spn { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.btn.bedbtn { background: #2b2118; color: #e6c48f; border-color: #3d2f22; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
ol.check { padding-left: 20px; margin: 8px 0; font-size: 14px; } ol.check li { margin: 6px 0; }
.wrow, .erow { display: grid; grid-template-columns: 1fr 90px 44px; gap: 8px; align-items: center; margin: 6px 0; font-size: 14px; }
.erow { grid-template-columns: 1fr 150px 64px; }
.wrow .inp, .erow .inp { min-height: 42px; padding: 6px 8px; min-width: 0; }
.seg.five { grid-template-columns: repeat(5, 1fr); }
/* wiki viewer */
#wiki { display: none; position: fixed; inset: 0; z-index: 25; background: var(--bg); flex-direction: column; }
#wiki.show { display: flex; }
#wiki iframe { flex: 1; width: 100%; border: 0; background: var(--card); }
.wbar { display: flex; align-items: center; gap: 8px; padding: calc(4px + var(--sa-t)) 8px 4px; border-bottom: 1px solid var(--line); background: var(--card); min-height: 48px; }
.wback { border: 0; background: none; color: var(--blue); font-weight: 700; min-height: 44px; padding: 0 8px; cursor: pointer; font-size: 16px; }
.wtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
.wext { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; }
.woff { background: var(--red-soft); color: var(--red); padding: 10px 12px; font-size: 14px; border-radius: 10px; margin: 8px; }
/* ---------- bed mode: warm, dim, no pure white ---------- */
body.bed {
  --bg: #0a0705; --card: #140e0a; --fg: #c79a5e; --muted: #7a6142; --line: #2a1f16;
  --acc: #9c6a2a; --acc-d: #7a521f; --acc-soft: #20170e; --red: #a8553f; --red-soft: #24130d;
  --gold: #a87c2c; --blue: #b08447; --chip: #120c08; --chip-b: #33261a; --shadow: none;
  font-size: 19px; color-scheme: dark;
}
body.bed .btn.primary, body.bed .btn.danger, body.bed .node.done > span, body.bed .node.rec > span, body.bed .uhead { color: #120c08; }
body.bed .q { font-size: 23px; }
body.bed .choice, body.bed .chip, body.bed .mitem { font-size: 18px; }
body.bed code { background: #241a12; }
body.bed .lesson { justify-content: flex-end; }
body.bed .qbody { flex: 0 1 auto; margin-top: auto; }
body.bed #toast { background: #20170e; color: var(--fg); }
body.bed .prof { background: #2a1d0c; color: #b8893a; }
body.bed .warn { background: #241a0f; color: var(--fg); }
.bedwrap { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.bedtop { text-align: center; padding-top: 6vh; }
.bclock { font-size: 64px; font-weight: 300; letter-spacing: 2px; line-height: 1.1; }
.bedctl { margin-top: auto; padding-bottom: calc(6px + var(--sa-b)); }
.btn.tall { min-height: 76px; font-size: 18px; }
.card-flow .cftop { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
.cfbody { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 4px; }
.cfq { font-size: 24px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
.cflist { padding-left: 24px; margin: 4px 0; } .cflist li { margin: 4px 0; }
.cfback { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.cfans { font-size: 22px; margin-bottom: 8px; } .cfans b { color: var(--acc); margin-right: 6px; }
.cfexp { font-size: 17px; color: var(--muted); margin-bottom: 6px; }
.cfbar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.cfbar i { display: block; height: 100%; width: 0; background: var(--acc); }
.cfrow { display: grid; grid-template-columns: 1fr 76px 1fr; gap: 10px; }
.cfb { min-height: 84px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); font-size: 20px; font-weight: 800; cursor: pointer; color: var(--fg); }
.cfb.no { border-color: var(--red); color: var(--red); } .cfb.yes { border-color: var(--acc); color: var(--acc); }
.cfb.pp { font-size: 26px; }
.sleep { animation: dusk 2.5s ease-out both; }
.moonbig { font-size: 72px; filter: saturate(.5) brightness(.8); }
@keyframes dusk { from { opacity: 0; } to { opacity: 1; } }
body.sleeping { --fg: #8a6a40; --muted: #5a4630; }

/* ---------- 탭만으로 풀기 + mouse friendliness ---------- */
.modechip { margin-left: auto; border: 1px solid var(--chip-b); background: var(--chip); color: var(--fg); border-radius: 99px; min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.selfans { background: var(--card); border: 2px solid var(--acc); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; font-size: 18px; }
.selfans b { color: var(--acc-d); }
.selfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.selfrow .btn { min-height: 64px; font-size: 18px; }
.lfoot .row2.slim { margin-bottom: 4px; }
.lfoot .row2.slim .btn { min-height: 44px; margin-top: 0; font-size: 14px; }
.seg.two { grid-template-columns: 1fr 1fr; }
body.bed .selfans b { color: var(--acc); }
@media (hover: hover) and (pointer: fine) {
  .choice:hover:not(:disabled), .tf:hover:not(:disabled), .mitem:hover:not(:disabled), .chip:hover:not(:disabled), .slot:hover,
  .seg button:hover, .cchips button:hover, .crow:hover, .modechip:hover, .cfb:hover { border-color: var(--blue); }
  .btn:hover:not(:disabled), .node:hover, .duecard:hover, .tagrow:hover, .sp:hover { filter: brightness(1.06); }
  body.bed .btn:hover:not(:disabled), body.bed .cfb:hover { filter: brightness(1.25); }
  .x:hover, .link:hover, .back:hover, .wlink:hover, .wback:hover { text-decoration: underline; }
}

/* ---------- question images ---------- */
.qimg { position: relative; margin: 4px 0 12px; border-radius: 12px; background: #f4f4f1; border: 1px solid var(--line); padding: 6px; text-align: center; }
.qimg img { display: block; margin: 0 auto; max-width: 100%; max-height: 42vh; object-fit: contain; border-radius: 8px; cursor: zoom-in; }
.qimg .zoomhint { position: absolute; right: 8px; bottom: 8px; font-size: 14px; background: rgba(0,0,0,.45); color: #f5f5f5; border-radius: 99px; padding: 1px 7px; pointer-events: none; }
.qimg.exp { margin: 6px 0 10px; }
.qimg.exp img { max-height: 32vh; }
.qimg.thumb { display: inline-block; padding: 3px; margin: 0 0 8px; }
.qimg.thumb img { max-height: 18vh; }
.qimg.broken { background: var(--card); }
.imgalt { padding: 14px 10px; font-size: 14px; color: var(--muted); text-align: left; }
@media (prefers-color-scheme: dark) { .qimg { background: #e9e9e4; border-color: transparent; } .qimg img { filter: brightness(.92); } }
body.bed .qimg { background: #c9c2b4; border-color: transparent; }
body.bed .qimg img { max-height: 35vh; filter: brightness(.8) sepia(.25); }
body.bed .qimg.thumb img { max-height: 16vh; }
body.bed .qimg.broken { background: var(--card); }
.cfbody .qimg { margin-bottom: 10px; }
#zoom { position: fixed; inset: 0; z-index: 60; background: rgba(8,8,8,.94); display: flex; flex-direction: column; }
#zoom .zbar { display: flex; align-items: center; gap: 8px; padding: calc(6px + var(--sa-t)) 10px 6px; color: #ddd; }
#zoom .zalt { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#zoom .zbtn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #555; background: #222; color: #eee; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
#zoom .zwrap { flex: 1; overflow: auto; touch-action: pinch-zoom pan-x pan-y; -webkit-overflow-scrolling: touch; padding: 8px; }
#zoom .zwrap img { display: block; max-width: none; margin: 0 auto; background: #f4f4f1; border-radius: 6px; }
#zoom.fit .zwrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
body.bed #zoom .zwrap img { filter: brightness(.8) sepia(.25); background: #c9c2b4; }
.sheet { -webkit-overflow-scrolling: touch; }

/* ---------- 📖 intro cards ---------- */
#intro { position: fixed; inset: 0; z-index: 50; max-width: 560px; margin: 0 auto; background: var(--bg); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: calc(8px + var(--sa-t)) 14px calc(10px + var(--sa-b)); }
#intro .ibar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#intro .ititle { font-size: 14px; font-weight: 800; color: var(--acc-d); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#intro .iskip { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; min-height: 44px; padding: 0 6px; cursor: pointer; text-decoration: underline; }
#intro .idots { display: flex; align-items: center; gap: 6px; }
#intro .idots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .2s; }
#intro .idots i.past { background: var(--acc-soft); border: 1px solid var(--acc); }
#intro .idots i.on { width: 22px; background: var(--acc); }
#intro .idots span { margin-left: auto; }
#intro .icard { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
#intro .icard h3 { margin: 4px 0 8px; font-size: 22px; }
#intro .ibody { font-size: 17px; line-height: 1.7; }
#intro .inav { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; background: var(--bg); padding-top: 4px; }
#intro .inav .btn { margin-top: 0; min-height: 56px; }
.qimg.intro img { max-height: 38vh; }
body.bed #intro .ititle { color: var(--acc); }
body.bed #intro .ibody { font-size: 19px; }
@media (prefers-color-scheme: dark) { #intro .ititle { color: var(--acc); } }
.nintro { position: absolute; left: -20px; top: 16px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.cfrow.two { grid-template-columns: 76px 1fr; }
.cfexp.intro { color: var(--fg); font-size: 18px; line-height: 1.65; }
@media (hover: hover) and (pointer: fine) { .nintro:hover, #intro .iskip:hover { border-color: var(--blue); color: var(--fg); } }

/* 번호 보기 목록 (Circle all 등) — enumList() */
.enl { margin: 10px 0 2px; font-weight: 500; }
.eni { position: relative; padding-left: 2.1em; margin: 7px 0; line-height: 1.45; }
.eni > b:first-child { position: absolute; left: 0; }

<script type="application/json" id="duo-content">[{"course":{"id":"os","title":"운영체제 기말","subtitle":"CSE304 · Prof. Yongwoo Lee","exam":"기말 범위 13강~22강 + 과제 2·3 · 형식: 용어(full term) + 손으로 돌리기","wiki":"../index.html"},"units":[{"id":"u13","title":"13강 Virtual Memory","desc":"메모리 계층 · 메모리 가상화 · 주소 변환 시점 · base and bounds","lessons":[{"id":"u13a","title":"메모리 계층과 가상화","items":[{"id":"u13a-01","type":"mc","q":"같은 비트 수에서 전력을 더 많이 쓰는 RAM 은?","explain":"SRAM 셀은 항상 전원에 연결돼 static current 가 흐른다. DRAM 은 refresh 때만 주기적으로 전력을 쓴다. 수업 중 교수님이 직접 던진 퀴즈다.","src":"10/19 녹음 08:33","wiki":"SRAM과 DRAM","prof":true,"tags":["SRAM","DRAM"],"choices":["SRAM","DRAM","둘이 같다","NAND Flash"],"answer":0,"introCard":0},{"id":"u13a-02","type":"match","q":"RAM 종류와 특징을 연결하시오","explain":"p.4 RAM 두 종류와 p.7 계층. SRAM 은 빠르고 비싸서 캐시, DRAM 은 싸고 refresh 가 필요해서 메인 메모리에 쓴다.","src":"13강 p.4~7","wiki":"메모리 계층","tags":["메모리 계층"],"pairs":[["SRAM","셀당 트랜지스터 4~6개, 캐시에 사용"],["DRAM","커패시터 1개 + 트랜지스터 1개, refresh 필요"],["NAND Flash","비휘발성, DRAM 보다 약 100배 느림"],["레지스터","계층 맨 위 L0"]],"introCard":0},{"id":"u13a-03","type":"cloze","q":"메모리 계층이 통하는 이유는 ___ 이다. 같은 것을 곧 다시 쓰는 것은 ___ locality, 가까운 것을 곧 쓰는 것은 ___ locality 다.","explain":"교수님: \"계층이 통하는 이유는 단 하나, locality.\" temporal = 같은 주소 재사용, spatial = 근처 주소 사용.","src":"13강 p.8~9","wiki":"locality","tags":["locality"],"answer":["principle of locality","temporal","spatial"],"bank":["principle of locality","temporal","spatial","virtualization","physical"],"introCard":1},{"id":"u13a-04","type":"mc","q":"`for (i=0;i\u003cn;i++) sum += a[i];` 에서 `a[i]` 접근이 보여 주는 locality 는?","explain":"a[i] 는 차례로 붙은 주소를 훑으니 spatial 이다. 같은 변수를 계속 쓰는 sum 이 temporal 이다.","src":"13강 p.9","wiki":"locality","tags":["locality"],"choices":["spatial","temporal","둘 다 없음","sum 과 같은 종류"],"answer":0,"introCard":1},{"id":"u13a-05","type":"tf","q":"명령어 참조에는 spatial locality 만 있고 temporal locality 는 없다.","explain":"순차 실행은 spatial, 루프를 도는 것은 temporal 이다. 명령어와 데이터 모두 두 locality 를 다 가진다.","src":"13강 p.9","wiki":"locality","tags":["locality"],"answer":false,"introCard":1},{"id":"u13a-06","type":"mc","q":"CPU 와 메모리를 여러 프로세스가 나눠 쓰는 방식의 차이로 옳은 것은?","explain":"메모리는 바이트 단위로 쪼갤 수 있고, 메모리 내용을 통째로 바꾸는 context switch 는 너무 비싸서 공간으로 나눈다.","src":"10/19 녹음 27:03","wiki":"가상 메모리","prof":true,"tags":["메모리 가상화"],"choices":["CPU 는 temporal(time slice), 메모리는 spatial(공간 분할)","CPU 는 spatial, 메모리는 temporal","둘 다 time slice","둘 다 공간 분할"],"answer":0,"introCard":1},{"id":"u13a-07","type":"mc","q":"물리 메모리에 프로세스 하나만 올리는 방식(no virtualization ①)의 단점 두 가지는?","explain":"p.13. 한 프로세스만 있으면 그 프로세스가 I/O 를 기다리는 동안 CPU 가 놀고 남는 메모리도 버려진다. 두 번째 보기는 multiprogramming(p.14)의 문제다.","src":"13강 p.13","wiki":"메모리 가상화","tags":["메모리 가상화"],"choices":["poor CPU utilization, memory space waste","protection issue, 재배치 어려움","external fragmentation, compaction 비용","TLB miss, page fault"],"answer":0,"introCard":2},{"id":"u13a-08","type":"tf","q":"Multiprogramming 으로 여러 프로세스를 동시에 메모리에 올리면 protection issue(다른 프로세스 영역에 errant access)가 생긴다.","explain":"p.14 그림에서 C 가 A 영역으로 가는 Errant access 화살표가 이 문제다. 그래서 메모리 보호 메커니즘이 필요하다.","src":"13강 p.14","wiki":"메모리 가상화","tags":["protection"],"answer":true,"introCard":2},{"id":"u13a-09","type":"cloze","q":"Virtual Memory = Virtual ___ + Address ___","explain":"p.16. 프로세스마다 private 한 virtual address space 를 주고, OS 가 그것을 물리 메모리에 mapping(address translation)한다.","src":"13강 p.15~16","wiki":"가상 메모리","tags":["메모리 가상화"],"answer":["Address Space","Translation"],"bank":["Address Space","Translation","Segmentation","Relocation"],"introCard":3},{"id":"u13a-10","type":"mc","q":"메모리 가상화(memory virtualization)의 이점(Benefits) 세 가지에 들어가지 않는 것은?","explain":"이점은 memory efficiency · protection · ease of programming 셋이다. TLB 는 15강 개념이다.","src":"13강 p.18","wiki":"메모리 가상화","prof":true,"tags":["메모리 가상화"],"choices":["Lower TLB miss rate","Memory efficiency","Protection","Ease of programming"],"answer":0,"introCard":3},{"id":"u13a-11","type":"tf","q":"CPU 가상화에서 context switch 가 하는 역할에 대응하는 메모리 가상화의 메커니즘은 address translation 이다.","explain":"10/19 녹음: CPU 가상화 = 가상 스레드 + 하드웨어 context + context switch ↔ 메모리 가상화 = physical memory + virtual address space + address translation.","src":"10/19 녹음 30:30","wiki":"가상 메모리","prof":true,"answer":true,"introCard":3},{"id":"u13a-12","type":"sa","q":"\"Every address in a running program is ___.\" 같은 프로그램(mem.c)을 동시에 두 번 실행하면 두 프로세스가 같은 heap 주소를 출력한다. 빈칸의 영어 한 단어는?","explain":"p.23~24. 두 프로세스가 같은 물리 주소를 동시에 쓸 수는 없으니, 출력된 값은 각자의 virtual address 이고 OS(와 MMU)가 서로 다른 물리 주소로 옮겨 준다.","src":"13강 p.23~24","wiki":"가상 주소 공간","tags":["가상 주소 공간"],"answer":"virtual","alts":["virtual address"],"introCard":3},{"id":"u13a-13","type":"cloze","q":"메모리 가상화(memory virtualization)의 이점 셋: Memory ___ · ___ · Ease of programming","explain":"10/19 녹음 32:22. efficiency = 여러 프로세스 데이터로 DRAM 을 채움, protection = 남의 메모리 접근 차단, ease of programming = 같은 uniform linear address space.","src":"13강 p.18","wiki":"메모리 가상화","prof":true,"answer":["efficiency","Protection"],"bank":["efficiency","Protection","Transparency","Locality","Flexibility"],"introCard":3},{"id":"u13a-14","type":"mc","q":"캐싱 표에서 가려진 칸 — Virtual Memory 행이 캐시하는 단위(What is Cached?)와 관리 주체(Managed By)는?","explain":"Virtual memory 는 main memory 를 disk 의 캐시처럼 쓰고, 단위는 4-KB page 다. 변환은 하드웨어(MMU·TLB)가, 어느 page 를 둘지·쫓아낼지는 OS 가 정해서 Hardware + OS. 64-bytes block / Hardware 는 L1·L2 캐시, Parts of files / OS 는 buffer cache 행이다.","src":"13강 p.10","wiki":"메모리 계층","tags":["메모리 계층"],"img":"img/os13-p10-cache-table.png","imgAlt":"p.10 Example of Caching in the Hierarchy 표 — Virtual Memory 행 두 칸이 가려져 있다","choices":["4-KB page / Hardware + OS","64-bytes block / Hardware","Parts of files / OS","Disk sectors / Disk firmware"],"answer":0,"introCard":3},{"id":"u13a-15","type":"mc","q":"multiprogramming 그림에서 Process C 에서 Process A 로 가는 굽은 화살표(라벨 ?)가 보여 주는 문제는?","explain":"여러 프로세스가 물리 메모리에 같이 있으면 한 프로세스가 남의 영역을 잘못 건드릴 수 있다(errant memory access). 그래서 protection 이 필요하다. Poor CPU utilization·memory space waste 는 프로세스 하나만 올리던 p.13 의 문제다.","src":"13강 p.13~14","wiki":"메모리 가상화","tags":["protection"],"img":"img/os13-p14-errant.png","imgAlt":"p.14 물리 메모리에 Process A·B·C 가 함께 있고 C 에서 A 로 화살표 하나(라벨 가림)","choices":["Errant access — protection issue","Poor CPU utilization","Memory space waste","context switch 비용"],"answer":0,"introCard":2},{"id":"u13a-16","type":"sa","q":"[용어] Programs tend to use data and instructions with addresses near or equal to those they have used recently. (3 words, p… o… l…)","explain":"p.8 정의 문장 그대로. 시험의 vocabulary 문제는 full term 만 인정한다 — \"locality\" 한 단어로 쓰면 틀린다. 둘로 나누면 temporal locality(같은 것 재사용)와 spatial locality(근처 것 사용).","src":"13강 p.8","wiki":"locality","diff":2,"tags":["locality"],"answer":"principle of locality","introCard":1}],"intro":[{"title":"메모리 계층","body":"위로 갈수록 작고 빠르고 비싸다: 레지스터(L0) → L1·L2 캐시(**SRAM**) → main memory(**DRAM**) → Optane → SSD·HDD. SRAM 은 셀당 트랜지스터 4~6개라 빠르고 항상 전력을 쓰며(static current) 캐시에, DRAM 은 커패시터 1개 + 트랜지스터 1개라 싸지만 **refresh** 가 필요하다. L1~L3 와 TLB 는 CPU 하드웨어가, DRAM 아래는 OS 가 관리한다. Virtual memory 는 DRAM 을 디스크의 캐시로 쓰며 단위는 4-KB page, 관리 주체는 Hardware + OS.","img":"img/os13-p07-hierarchy.png","imgAlt":"L0 레지스터부터 L5 local secondary storage 까지의 메모리 계층 피라미드","src":"13강 p.4~10"},{"title":"locality","body":"계층이 통하는 이유는 **principle of locality** 하나다: 프로그램은 최근에 쓴 주소와 같거나 가까운 주소를 다시 쓴다. **temporal locality** = 같은 것을 곧 다시(루프의 sum, 루프 명령 재실행), **spatial locality** = 근처 것을 곧(배열 a[i] 를 차례로, 명령어 순차 실행). 명령어와 데이터 모두 두 가지를 다 가진다.","src":"13강 p.8~9"},{"title":"가상화 없이 물리 메모리를 쓰면","body":"① 프로세스 하나만 올리면 그 프로세스가 I/O 를 기다리는 동안 CPU 가 놀고(poor CPU utilization) 남은 메모리도 버려진다(memory space waste). ② 여러 프로세스를 그대로 올리면(multiprogramming) 한 프로세스가 남의 영역을 잘못 건드리는 **errant access** — **protection issue** 가 생긴다. CPU 는 시간으로(time slice), 메모리는 공간으로 나눠 쓴다.","img":"img/os13-p14-errant-ans.png","imgAlt":"Process A·B·C 가 함께 있는 물리 메모리와 Errant access 화살표","src":"13강 p.13~14"},{"title":"Virtual Memory = 주소 공간 + 주소 변환","body":"OS 는 프로세스마다 private 한 **virtual address space** 를 주고, 그것을 물리 메모리에 **address translation** 으로 매핑한다(CPU 가상화의 context switch 에 대응하는 메커니즘). 이점 셋: **Memory efficiency**(여러 프로그램이 물리 메모리를 나눠 씀), **Protection**(프로세스·OS 서로 격리), **Ease of programming**(모두 같은 uniform linear address space). 프로그램이 쓰는 모든 주소는 virtual 이다.","img":"img/os13-p17-vm.png","imgAlt":"Process 0 ~ N-1 의 virtual address space 가 address translation 으로 physical address space 에 매핑되는 그림","src":"13강 p.15~18, 23"}]},{"id":"u13b","title":"주소 공간 · 설계 목표 · 변환 시점","items":[{"id":"u13b-01","type":"match","q":"주소 공간의 세 영역과 담는 것을 연결하시오","explain":"p.21~22. heap 과 stack 은 서로 마주 보며 자란다.","src":"13강 p.21~22","wiki":"가상 주소 공간","tags":["주소 공간"],"pairs":[["Program Code","명령어"],["Heap","malloc/new 로 받는 메모리"],["Stack","return address, 지역 변수, 인자"],["(free)","heap 과 stack 사이 아직 안 쓰는 공간"]],"introCard":0},{"id":"u13b-02","type":"num","q":"virtual address space 는 주소 비트가 n 이면 $N = 2^n$ 개의 주소를 가진다. 주소 공간이 16KB 라면 주소 비트 수 n 은?","explain":"16KB = $2^4 \times 2^{10} = 2^{14}$ 바이트이고, 바이트마다 주소가 하나이니 $N = 2^{14}$, 즉 n = 14. (주소 비트 n 으로 만들 수 있는 주소 수가 $2^n$ 이라는 관계를 거꾸로 쓴 것)","src":"13강 p.20~21","wiki":"가상 주소 공간","diff":1,"answer":14,"unit":"bit","tol":0,"introCard":0},{"id":"u13b-03","type":"match","q":"VM 설계 목표와 뜻을 연결하시오","explain":"p.27 / p.37 Design Goals 넷. Efficiency 는 time 과 space(물리 메모리를 낭비하지 않고 가상화용 메모리도 적게) 둘이다.","src":"13강 p.27","wiki":"VM 설계 목표","tags":["설계 목표"],"pairs":[["Transparency","프로그램이 가상화된 줄 모른다"],["Protection","프로세스끼리 서로 보호"],["Flexibility","프로그래밍을 쉽게"],["Efficiency","시간·공간 낭비가 적다"]],"introCard":1},{"id":"u13b-04","type":"sa","q":"\"The program shouldn't be aware of the fact that memory is virtualized\" 에 해당하는 설계 목표는?","explain":"p.27 의 첫 목표. 프로그램은 0번지부터 시작하는 자기만의 메모리가 있다고 믿는다.","src":"13강 p.27","wiki":"VM 설계 목표","tags":["설계 목표"],"answer":"Transparency","introCard":1},{"id":"u13b-05","type":"tf","q":"Efficiency 목표의 space efficiency 에는 \"가상화 자체에 메모리를 너무 많이 쓰지 않는 것\"도 들어간다.","explain":"p.27: Space efficiency = (1) 물리 메모리를 낭비하지 않기 (2) 가상화를 위해 너무 많은 메모리를 쓰지 않기. page table 크기 문제(15·16강)가 여기 걸린다.","src":"13강 p.27","wiki":"VM 설계 목표","answer":true,"introCard":1},{"id":"u13b-06","type":"match","q":"주소 변환 시점과 결과를 연결하시오","explain":"p.31~36. load time 도 여러 프로그램을 동시에 올릴 수는 있다. 문제는 보호가 없다는 것이다.","src":"13강 p.31~36","wiki":"주소 변환 시점","tags":["변환 시점"],"pairs":[["Compile time","VA = PA, 같은 주소를 쓰는 두 번째 프로그램 로드 불가"],["Load time","로딩 때 주소를 고쳐 씀, 보호 없음"],["Execution time","CPU(MMU)가 실행 중 변환"],["MMU","execution time 변환을 맡는 CPU 안 하드웨어"]],"introCard":2},{"id":"u13b-07","type":"tf","q":"Load time 변환 방식은 여러 프로그램을 동시에 메모리에 올릴 수 없다는 것이 문제다.","explain":"동시 로드 불가는 compile time 의 문제(p.32)다. load time 은 동시 로드가 되지만 P1 이 P2 메모리를 건드릴 수 있다(보호 없음, p.34).","src":"13강 p.32~34","wiki":"주소 변환 시점","tags":["변환 시점"],"answer":false,"introCard":2},{"id":"u13b-08","type":"mc","q":"P2 실행 파일의 `call 100320` 을 물리 0x300000 에 load time 방식으로 올리면 메모리 안 명령은?","explain":"로딩할 때 +0x200000 을 더해 고쳐 쓴다(p.33). execution time 방식이면 call 100320 그대로 두고 MMU 가 실행 중에 더한다.","src":"13강 p.33~36","wiki":"주소 변환 시점","tags":["변환 시점"],"img":"img/os13-p33-loadtime.png","imgAlt":"p.33 load time 변환 그림 — 물리 메모리 안 call 명령이 가려져 있다 (②가 P2)","explainImg":"img/os13-p33-loadtime-ans.png","choices":["call 300320","call 100320","call 200320","call 400320"],"answer":0,"introCard":2},{"id":"u13b-09","type":"sa","q":"가상 주소를 물리 주소로 run time 에 바꾸는 CPU 안 하드웨어의 full term 은?","explain":"p.38 \"Hardware device inside CPU, Memory Management Unit (MMU), maps virtual to physical address at run time.\"","src":"13강 p.38","wiki":"MMU","tags":["MMU"],"img":"img/os13-p38-mmu.png","imgAlt":"p.38 CPU Chip 안에서 VA 4100 을 PA 4 로 바꾸는 상자(?)","answer":"Memory Management Unit","alts":["MMU"],"introCard":3},{"id":"u13b-10","type":"tf","q":"Execution time 변환에서는 실행 파일의 주소를 로딩 때 고쳐 쓰지 않는다.","explain":"p.35~36. 실행 파일은 `call 10052d` 그대로이고, CPU 가 실행 중에 +100000 / +200000 해서 물리 주소로 바꾼다.","src":"13강 p.35~36","wiki":"주소 변환 시점","answer":true,"introCard":2},{"id":"u13b-11","type":"cloze","q":"MMU 는 ___ 안에 있는 하드웨어이고, 변환은 ___ 에 일어난다. CPU 와 OS 의 close ___ 이 필요하다.","explain":"p.38. 하드웨어가 매 참조를 빠르게 변환하고, OS 는 레지스터·표를 설정한다.","src":"13강 p.38","wiki":"MMU","answer":["CPU","run time","cooperation"],"bank":["CPU","run time","cooperation","DRAM","compile time","competition"],"introCard":3},{"id":"u13b-12","type":"mc","q":"메모리 계층에서 CPU 캐시(level 1~3)와 TLB 를 관리하는 주체는?","explain":"10/19 녹음: \"L1·L2·L3 와 TLB 는 CPU 하드웨어가 관리한다. DRAM·SSD·키보드·마우스는 OS 책임.\"","src":"10/19 녹음 02:51","wiki":"메모리 계층","prof":true,"choices":["CPU 하드웨어","OS","컴파일러","사용자 프로그램"],"answer":0,"introCard":3},{"id":"u13b-13","type":"tf","q":"Compile time 변환에서는 실행 중에 MMU 가 주소를 바꾼다.","explain":"compile time 은 컴파일러가 만든 주소가 곧 물리 주소(VA = PA)다. 실행 중 변환은 execution time 방식이다.","src":"13강 p.31~32","wiki":"주소 변환 시점","tags":["변환 시점"],"answer":false,"introCard":2},{"id":"u13b-14","type":"cloze","q":"주소 공간 그림에서 ①은 ___, ②는 ___, ③은 ___ 이다.","explain":"위(0KB)부터 명령어가 사는 Program Code, malloc 으로 아래로 자라는 Heap, 맨 아래(16KB)에서 위로 자라는 Stack. 둘 사이 빗금 친 곳이 (free) 다.","src":"13강 p.21~22","wiki":"가상 주소 공간","tags":["주소 공간"],"img":"img/os13-p21-addrspace.png","imgAlt":"p.21 16KB 주소 공간 — 세 영역 이름이 ①②③ 으로 가려져 있다","explainImg":"img/os13-p21-addrspace-ans.png","answer":["Program Code","Heap","Stack"],"bank":["Program Code","Heap","Stack","Data","free","PCB"],"introCard":0},{"id":"u13b-15","type":"mc","q":"mem.c 를 동시에 두 번 실행했다. 두 프로세스(2413, 2414)의 heap 주소가 똑같이 0xcf2010 으로 찍힌 이유는?","explain":"p.23 \"Every address in a running program is virtual.\" 같은 가상 주소라도 address translation 이 프로세스마다 다른 물리 주소로 보낸다. 물리 메모리를 공유한다면 서로의 heap 을 덮어쓸 것이다.","src":"13강 p.23~24","wiki":"가상 주소 공간","tags":["가상 주소 공간"],"img":"img/os13-p24-mem-output.png","imgAlt":"p.24 64-bit Linux 에서 mem.c 를 두 번 실행한 출력과 주소 공간","choices":["찍힌 값이 virtual address 이고, 각 프로세스는 자기만의 address space 를 가진다","두 프로세스가 같은 물리 메모리를 공유한다","malloc 이 같은 물리 블록을 두 번 돌려줬다","OS 가 두 번째 프로세스를 첫 번째가 끝난 뒤 실행했다"],"answer":0,"introCard":0},{"id":"u13b-16","type":"sa","q":"load time 변환 그림. P1 실행 파일은 0x100000 부터, 물리 메모리에는 +0x100000 해서 0x200000 부터 올라갔다. ①의 명령은 call 뒤에 무엇인가? (16진수, 0x 없이)","explain":"load time 변환은 로딩할 때 실행 파일 안의 주소를 고쳐 쓴다. swap 은 0x10052d → 0x10052d + 0x100000 = 0x20052d. 그래서 call 10052d 가 call 20052d 로 바뀐다. 같은 원리로 P2(+0x200000)의 call 100320 은 call 300320.","src":"13강 p.33","wiki":"주소 변환 시점","tags":["변환 시점"],"img":"img/os13-p33-loadtime.png","imgAlt":"p.33 load time 변환 — 물리 메모리 안 두 call 명령이 ①②로 가려져 있다","explainImg":"img/os13-p33-loadtime-ans.png","answer":"20052d","alts":["0x20052d"],"introCard":2},{"id":"u13b-17","type":"mc","q":"execution time 변환. P2 가 실행 중 VA 0x100320 의 test 를 call 하면, MMU 가 더하는 값과 PA(둘 다 ?)는?","explain":"execution time 방식은 실행 파일을 고치지 않고(call 100320 그대로), CPU 의 MMU 가 매 참조마다 그 프로세스의 값(P2 는 +0x200000)을 더한다. 0x100320 + 0x200000 = 0x300320.","src":"13강 p.35~36","wiki":"주소 변환 시점","tags":["변환 시점"],"img":"img/os13-p36-exectime.png","imgAlt":"p.36 execution time 변환 — P2 의 더하는 값과 물리 주소가 가려져 있다","explainImg":"img/os13-p36-exectime-ans.png","choices":["+0x200000, PA 0x300320","+0x100000, PA 0x200320","+0, PA 0x100320","+0x300000, PA 0x400320"],"answer":0,"introCard":2},{"id":"u13b-18","type":"sa","q":"[용어] A process of mapping virtual addresses to physical addresses. (2 words, a… t…)","explain":"p.26 정의 그대로. 13강 p.16 \"Virtual Memory = ① Virtual Address Space + ② Address Translation\" 의 두 번째 축이다.","src":"13강 p.26","wiki":"주소 변환","tags":["주소 변환"],"answer":"address translation","introCard":0}],"intro":[{"title":"주소 공간의 구성","body":"주소 비트가 n 이면 virtual address space 는 $N = 2^n$ 개 주소(예: 16KB = $2^{14}$ → n = 14). 위(0)부터 **Program Code**(명령어), **Heap**(malloc/new, 아래로 자람), 빈 공간(free), 맨 아래 **Stack**(return address·지역 변수·인자, 위로 자람). heap 과 stack 은 서로 마주 보며 자란다.","img":"img/os13-p21-addrspace-ans.png","imgAlt":"16KB 주소 공간: Program Code, Heap, (free), Stack","src":"13강 p.20~22"},{"title":"VM 설계 목표","body":"**Transparency**: 프로그램이 메모리가 가상화된 줄 모른다. **Protection**: 프로세스끼리(그리고 OS 와) 서로 보호. **Flexibility**: 프로그래밍을 쉽게. **Efficiency**: time(느려지지 않게) 과 space(물리 메모리를 낭비하지 않고, 가상화 자체에 메모리를 너무 쓰지 않게 — 나중에 page table 크기 문제).","src":"13강 p.27, 37"},{"title":"주소 변환은 언제 하나","body":"**Compile time**: 컴파일러가 만든 주소 = 물리 주소(VA = PA). 같은 주소를 쓰는 두 번째 프로그램을 올릴 수 없다. **Load time**: 로딩할 때 실행 파일 안 주소를 고쳐 쓴다(+0x100000 이면 call 10052d → call 20052d). 여러 개 올릴 수 있지만 보호가 없다. **Execution time**: 실행 파일은 그대로, CPU 안 MMU 가 실행 중에 매 참조를 바꾼다.","img":"img/os13-p33-loadtime-ans.png","imgAlt":"load time 변환: P1 은 +0x100000, P2 는 +0x200000 해서 call 주소를 고쳐 쓴 물리 메모리","src":"13강 p.28~36"},{"title":"MMU","body":"**Memory Management Unit**(MMU) = CPU 안의 하드웨어로, virtual address 를 run time 에 physical address 로 바꾼다. CPU 와 OS 의 close cooperation 이 필요하다: 하드웨어는 매 참조를 빠르게 변환하고, OS 는 레지스터·표를 설정한다.","img":"img/os13-p38-mmu-ans.png","imgAlt":"CPU Chip 안 MMU 가 VA 4100 을 PA 4 로 바꾸는 그림","src":"13강 p.38"}]},{"id":"u13c","title":"Base and Bounds 손으로 돌리기","items":[{"id":"u13c-01","type":"cloze","q":"base and bounds 변환: physical address = virtual address + ___ , 그리고 0 ≤ virtual address \u003c ___","explain":"p.43 두 식. 검사가 먼저, 더하기가 나중이다.","src":"13강 p.43","wiki":"base and bounds","tags":["base and bounds"],"answer":["base","bounds"],"bank":["base","bounds","offset","PFN","limit address"],"introCard":0},{"id":"u13c-02","type":"sa","q":"프로그램이 로드된 물리 메모리의 시작 주소를 담는 CPU 레지스터 이름은? (영어 두 단어)","explain":"p.40. bounds(limit) register 는 그 프로그램 물리 메모리의 길이를 담는다.","src":"13강 p.40","wiki":"base and bounds","tags":["base and bounds"],"answer":"base register","alts":["base"],"introCard":0},{"id":"u13c-03","type":"tf","q":"이 강의 정의에서 bounds 는 물리 메모리의 끝 주소이고, 검사는 변환된 PA 로 한다.","explain":"p.40·p.43: bounds 는 길이(length)이고 검사는 VA \u003c bounds 로 한다. 끝 주소 + PA 검사는 OSTEP 의 다른 설계다.","src":"13강 p.40, p.43","wiki":"base and bounds","tags":["base and bounds"],"answer":false,"introCard":1},{"id":"u13c-04","type":"num","q":"base = 32KB, bounds = 16KB. VA 128 의 PA 는? (바이트)","explain":"128 \u003c 16384 이므로 통과. PA = 128 + 32×1024 = 128 + 32768 = 32896. 슬라이드 p.48 의 fetch 128.","src":"13강 p.47~48","wiki":"base and bounds","prof":true,"tags":["base and bounds"],"img":"img/os13-p48-fetch128.png","imgAlt":"p.48 MMU 그림 — fetch 128 의 물리 주소가 가려져 있다","explainImg":"img/os13-p48-fetch128-ans.png","answer":32896,"unit":"B","tol":0,"introCard":1},{"id":"u13c-05","type":"num","q":"base = 32KB, bounds = 16KB. x 를 load 하는 VA 15KB 의 PA 는 몇 KB 인가?","explain":"15KB \u003c 16KB 통과. PA = 15KB + 32KB = 47KB (= 48128 B). p.49 의 load.","src":"13강 p.47·49","wiki":"base and bounds","prof":true,"tags":["base and bounds"],"img":"img/os13-p49-load15k.png","imgAlt":"p.49 MMU 그림 — load 15KB 의 물리 주소가 가려져 있다","explainImg":"img/os13-p49-load15k-ans.png","answer":47,"unit":"KB","tol":0,"introCard":0},{"id":"u13c-06","type":"num","q":"`x = x + 3` (명령 3개, x 는 메모리에 있음) 을 실행할 때 MMU 를 지나는 메모리 참조는 몇 번인가?","explain":"fetch 3번(128, 132, 135) + load x 1번 + store x 1번 = 5번. addl 실행은 레지스터끼리 더하므로 메모리 참조가 없다.","src":"13강 p.46","wiki":"base and bounds","diff":2,"tags":["base and bounds"],"img":"img/os13-p46-exec-va.png","imgAlt":"p.46 x = x + 3 의 세 명령과 주소 공간","answer":5,"unit":"번","tol":0,"introCard":2},{"id":"u13c-07","type":"num","q":"base = 48KB, bounds = 16KB 인 프로세스 B. VA 1000 의 PA 는? (바이트)","explain":"1000 \u003c 16384 통과. PA = 48×1024 + 1000 = 49152 + 1000 = 50152.","src":"위키 base and bounds 퀴즈","wiki":"base and bounds","tags":["base and bounds"],"answer":50152,"unit":"B","tol":0,"img":"img/os13-gen-u13c-07.png","imgAlt":"물리 메모리 막대와 프로세스 영역: base = 48KB, bounds = 16KB, VA 1000","introCard":1},{"id":"u13c-08","type":"mc","q":"base = 48KB, bounds = 16KB. VA 16384 에 접근하면?","explain":"조건은 VA \u003c bounds 다. 16384 \u003c 16384 는 거짓(같다)이므로 MMU 가 exception 을 올린다.","src":"13강 p.43, p.48","wiki":"base and bounds","diff":2,"tags":["base and bounds"],"choices":["exception (bounds 위반)","PA 65536","PA 64KB − 1","PA 16384"],"answer":0,"img":"img/os13-gen-u13c-08.png","imgAlt":"물리 메모리 막대와 프로세스 영역: base = 48KB, bounds = 16KB, VA 16384","introCard":1},{"id":"u13c-09","type":"num","q":"base = 16KB, bounds = 4KB. VA 3000 의 PA 는? (바이트)","explain":"3000 \u003c 4096 통과. PA = 16384 + 3000 = 19384. 단위를 바이트로 맞춘 뒤 더한다.","src":"13강 p.43 규칙 적용","wiki":"base and bounds","tags":["base and bounds"],"answer":19384,"unit":"B","tol":0,"img":"img/os13-gen-u13c-09.png","imgAlt":"물리 메모리 막대와 프로세스 영역: base = 16KB, bounds = 4KB, VA 3000","introCard":1},{"id":"u13c-10","type":"order","q":"base and bounds 에서 MMU 가 VA 하나를 처리하는 순서","explain":"p.48 그림. 비교에서 no 면 Raise exception → OS handler. base 를 먼저 더하고 bounds 와 비교하면 틀린다.","src":"13강 p.48","wiki":"base and bounds","tags":["base and bounds"],"answer":["VA 를 받는다","VA \u003c bounds 인지 비교","통과하면 base 를 더한다","PA 로 메모리에 접근"],"introCard":1},{"id":"u13c-11","type":"tf","q":"base/bounds 레지스터를 바꾸는 명령은 특권 명령이어야 한다.","explain":"유저 프로그램이 base 를 마음대로 바꾸면 남의 메모리에 접근할 수 있어 protection 이 무너진다(OSTEP 15장 보충).","src":"위키 base and bounds","wiki":"base and bounds","diff":2,"answer":true,"introCard":0},{"id":"u13c-12","type":"mc","q":"bounds 위반이 일어나면 그 다음은?","explain":"p.48 Raise exception. 4강 trap 과 같은 경로로 OS 에 넘어간다.","src":"13강 p.48","wiki":"base and bounds","choices":["MMU 가 exception 을 올리고 OS 의 exception handler 가 처리(보통 프로세스 종료)","MMU 가 VA 를 bounds 안으로 잘라서 접근","OS 가 bounds 를 자동으로 늘림","아무 일 없이 다음 명령"],"answer":0,"introCard":1},{"id":"u13c-13","type":"num","q":"base = 32KB 일 때 VA 135 (store 명령 fetch) 의 PA 는?","explain":"135 + 32768 = 32903. 같은 규칙을 그대로 적용한다.","src":"위키 base and bounds p.47~49","wiki":"base and bounds","diff":1,"answer":32903,"unit":"B","tol":0,"img":"img/os13-gen-u13c-13.png","imgAlt":"물리 메모리 막대와 프로세스 영역: base = 32KB, VA 135 (store 명령 fetch)","introCard":1},{"id":"u13c-14","type":"cloze","q":"base 32KB, bounds 16KB 에서 VA 20000 은 ___ 이상이므로 MMU 가 ___ 을 올린다.","explain":"20000 ≥ 16384. base 를 더하기 전에 검사에서 걸린다.","src":"13강 p.43, p.48","wiki":"base and bounds","tags":["base and bounds"],"answer":["bounds","exception"],"bank":["bounds","exception","base","page fault","PFN"],"img":"img/os13-gen-u13c-14.png","imgAlt":"물리 메모리 막대와 프로세스 영역: base = 32KB, bounds = 16KB, VA 20000","introCard":1},{"id":"u13c-15","type":"num","q":"그림: 프로세스의 16KB 주소 공간이 물리 메모리 32KB~48KB 에 올라가 있다. 가려진 base register 값은 몇 KB 인가?","explain":"base register = 프로그램이 로드된 물리 메모리의 시작 주소 = 32KB. bounds register 는 길이 = 48 − 32 = 16KB (그림 왼쪽 아래의 다른 ?).","src":"13강 p.40, p.42","wiki":"base and bounds","tags":["base and bounds"],"img":"img/os13-p42-bb-reg.png","imgAlt":"p.42 base register·bounds register 값이 가려진 그림","explainImg":"img/os13-p42-bb-reg-ans.png","answer":32,"unit":"KB","tol":0,"introCard":0},{"id":"u13c-16","type":"order","q":"`x = x + 3` (명령 주소 128, 132, 135, x 의 VA 15KB). MMU 를 지나는 메모리 참조를 일어나는 순서대로 놓으시오.","explain":"명령 하나를 fetch 한 뒤 그 명령을 execute 한다. movl(load) → addl(메모리 참조 없음) → movl(store). 그래서 fetch 128 → load 15KB → fetch 132 → (addl 실행) → fetch 135 → store 15KB.","src":"13강 p.45~46","wiki":"base and bounds","tags":["base and bounds"],"img":"img/os13-p46-exec-va.png","imgAlt":"p.46 세 명령과 주소 공간","answer":["fetch 128","load 15KB","fetch 132","fetch 135","store 15KB"],"introCard":2},{"id":"u13c-17","type":"num","q":"[규칙 적용] base = 32KB, bounds = 16KB. VA 100, 4200, 16383, 16384, 20000 을 차례로 접근한다. exception 이 나는 접근은 몇 개인가?","explain":"조건은 0 ≤ VA \u003c 16384. 100·4200·16383 은 통과, 16384(같음)·20000 은 실패 → 2개. \"같으면 통과\"로 착각하면 1개로 틀린다.","src":"13강 p.43 규칙 적용","wiki":"base and bounds","diff":2,"tags":["base and bounds"],"answer":2,"unit":"개","tol":0,"img":"img/os13-gen-u13c-17.png","imgAlt":"물리 메모리 막대와 프로세스 영역: base 32KB, bounds 16KB · VA 100, 4200, 16383, 16384, 20000","introCard":1},{"id":"u13c-18","type":"num","q":"[규칙 적용] base = 16KB, bounds = 8KB. VA 8000 의 PA 는? (바이트)","explain":"8000 \u003c 8192 이므로 통과. PA = 16×1024 + 8000 = 16384 + 8000 = 24384.","src":"13강 p.43 규칙 적용","wiki":"base and bounds","tags":["base and bounds"],"answer":24384,"unit":"B","tol":0,"img":"img/os13-gen-u13c-18.png","imgAlt":"물리 메모리 막대와 프로세스 영역: base = 16KB, bounds = 8KB, VA 8000","introCard":1}],"intro":[{"title":"base and bounds 레지스터","body":"CPU 레지스터 두 개: **base register** = 프로그램이 로드된 물리 메모리의 시작 주소, **bounds(limit) register** = 그 물리 메모리의 **길이**(끝 주소가 아님). 프로그램은 0번지에 있다고 가정하고 컴파일되고, OS 가 시작할 때 위치를 정해 두 값을 넣는다(dynamic relocation).","img":"img/os13-p42-bb-reg-ans.png","imgAlt":"16KB 주소 공간이 물리 32KB~48KB 에, base 32KB · bounds 16KB","src":"13강 p.40~42"},{"title":"변환 규칙","body":"검사 먼저: $0 \\le VA \u003c bounds$ (같으면 실패). 통과하면 $PA = VA + base$. 실패하면 MMU 가 exception 을 올리고 OS handler 가 처리(보통 프로세스 종료). 단위를 바이트로 맞춘 뒤 더할 것(32KB = 32768).","img":"img/os13-p48-fetch128-ans.png","imgAlt":"MMU 그림: VA 128 을 bounds 16KB 와 비교하고 base 32KB 를 더해 32896","src":"13강 p.43, 47~49"},{"title":"명령 하나가 만드는 메모리 참조","body":"`x = x + 3` 은 명령 3개(128: load, 132: addl, 135: store). 명령마다 fetch 1번, load/store 가 메모리를 한 번씩 더 참조한다. addl 은 레지스터끼리라 참조 없음 → fetch 128 → load 15KB → fetch 132 → fetch 135 → store 15KB, 총 5번. 모두 MMU 를 지난다.","img":"img/os13-p46-exec-va.png","imgAlt":"세 명령과 주소 공간(코드 128~135, x 는 15KB)","src":"13강 p.44~46"}]},{"id":"u13d","title":"OS 가 할 일과 한계","items":[{"id":"u13d-01","type":"match","q":"언제 무엇을 하는지 연결하시오 (base and bounds)","explain":"p.50~54. 레지스터는 CPU 에 한 쌍뿐이라 실행 중인 프로세스 값만 들어 있다.","src":"13강 p.50~54","wiki":"base and bounds","tags":["base and bounds"],"pairs":[["프로세스 시작","free list 에서 주소 공간 자리를 찾는다"],["프로세스 종료","메모리를 free list 에 되돌린다"],["context switch","base/bounds 쌍을 PCB 에 저장·복원"],["bounds 밖 접근","exception → OS handler (보통 종료)"]],"introCard":0},{"id":"u13d-02","type":"sa","q":"\"A list of the range of the physical memory which are not in use\" — 쓰지 않는 물리 메모리 영역들을 모은 목록을 무엇이라 하는가? (영어 두 단어)","explain":"p.51 \"Free list: A list of the range of the physical memory which are not in use.\"","src":"13강 p.51","wiki":"free list","tags":["free list"],"answer":"free list","introCard":0},{"id":"u13d-03","type":"cloze","q":"context switch 때 OS 는 실행 중이던 프로세스의 base 와 bounds 를 ___ 에 저장하고, 다음 프로세스의 값을 레지스터에 ___ 한다.","explain":"p.54 그림: A 의 base 32KB/bounds 16KB 를 Process A PCB 에 저장하고 B 의 48KB/16KB 를 올린다.","src":"13강 p.54","wiki":"base and bounds","answer":["PCB","복원"],"bank":["PCB","복원","TLB","page table","삭제"],"introCard":0},{"id":"u13d-04","type":"mc","q":"base and bounds(dynamic relocation)의 한계는? (그림: 64-bit Linux 주소 공간)","explain":"주소 공간을 통째로 연속 배치하므로 \"Big chunk of free space takes up physical memory\". 64-bit Linux 의 heap~stack 빈 공간은 128 TB 다.","src":"13강 p.55","wiki":"동적 재배치의 한계","tags":["base and bounds"],"img":"img/os13-p55-hugeva.png","imgAlt":"p.55 64-bit Linux 주소 공간 — heap 과 stack 사이 128 TB","choices":["heap 과 stack 사이 큰 free 공간까지 물리 메모리를 차지한다","변환이 너무 느리다","보호가 전혀 없다","레지스터가 너무 많이 필요하다"],"answer":0,"introCard":2},{"id":"u13d-05","type":"tf","q":"base and bounds 에서는 주소 공간 전체가 물리 메모리에 연속으로 놓여야 한다.","explain":"레지스터 한 쌍으로 시작과 길이만 기억하므로 연속이어야 한다. 이것이 14강 segmentation 이 나온 이유다.","src":"13강 p.55","wiki":"동적 재배치의 한계","answer":true,"introCard":2},{"id":"u13d-06","type":"mc","q":"base and bounds 의 장점으로 가장 거리가 먼 것은?","explain":"첫 보기는 오히려 단점이다. 빈 공간까지 통째로 올린다.","src":"위키 base and bounds 장단점","wiki":"base and bounds","choices":["주소 공간 안 빈 공간을 물리 메모리에 두지 않는다","레지스터 2개와 덧셈·비교라 빠르다","프로그램은 0번지라고 믿는다","bounds 로 보호된다"],"answer":0,"introCard":2},{"id":"u13d-07","type":"tf","q":"base and bounds MMU 에서 비교기(\u003c)에는 VA 와 bounds register 가, 덧셈기(+)에는 VA 와 base register 가 들어간다.","explain":"비교는 VA 를 길이(bounds)와 견주는 것이라 base 를 더하기 전의 VA 를 쓴다. 비교가 yes 일 때만 base 를 더해 PA 를 만들고, no 면 Raise exception.","src":"13강 p.48","wiki":"base and bounds","diff":2,"tags":["base and bounds"],"answer":true,"img":"img/os13-p48-fetch128-ans.png","imgAlt":"base and bounds MMU: bounds register 와 비교, base register 와 덧셈","introCard":0},{"id":"u13d-08","type":"num","q":"물리 메모리 64KB 에 OS 가 0~16KB, 프로세스 A 가 32~48KB 에 있다. A 의 bounds 는 몇 KB 인가?","explain":"bounds 는 길이다. 48 − 32 = 16KB. base 는 32KB.","src":"13강 p.41~42","wiki":"base and bounds","diff":1,"answer":16,"unit":"KB","tol":0,"img":"img/os13-gen-u13d-08.png","imgAlt":"물리 메모리 막대와 프로세스 영역: OS 0~16KB, 프로세스 A 32~48KB","introCard":0},{"id":"u13d-09","type":"mc","q":"base and bounds 를 dynamic relocation 이라 부르는 이유는?","explain":"p.39~40: 프로그램은 0번지에 있다고 가정하고 컴파일되고, OS 가 시작할 때 base/bounds 를 정하며, MMU 가 매 참조를 run time 에 바꾼다. 실행 파일을 고쳐 쓰는 것은 load time(static) 재배치다.","src":"13강 p.39~40","wiki":"base and bounds","tags":["base and bounds"],"choices":["변환이 실행 중(run time)에 일어나서, base 만 바꾸면 주소 공간을 물리 메모리의 다른 곳에 둘 수 있다","컴파일러가 주소를 재배치한다","loader 가 실행 파일의 주소를 고쳐 쓴다","프로세스마다 page table 을 동적으로 만든다"],"answer":0,"introCard":2},{"id":"u13d-10","type":"tf","q":"변환 결과가 자기 영역 밖으로 나가지 못하게 하는 올바른 address translation 은 그 자체로 남의 메모리 접근을 막는 protection 이 된다.","explain":"10/19 녹음 32:22 \"very clever mechanism\". 변환 결과가 자기 영역 밖으로 못 나가게 하면 보호가 된다.","src":"10/19 녹음 32:22","wiki":"메모리 가상화","prof":true,"answer":true,"introCard":0},{"id":"u13d-11","type":"tf","q":"CPU 는 모든 프로세스의 base/bounds 쌍을 레지스터에 동시에 들고 있다.","explain":"레지스터는 한 쌍뿐이라 실행 중인 프로세스 값만 있다. 나머지는 각 PCB 에 저장돼 있다가 context switch 때 복원된다.","src":"13강 p.54","wiki":"base and bounds","diff":2,"answer":false,"introCard":0},{"id":"u13d-12","type":"cloze","q":"OS 는 프로세스 시작 때 ___ 에서 빈 칸을 찾고, 종료 때 그 메모리를 ___ 해 다시 쓰게 한다.","explain":"p.50 \"Finding space for address space\" / \"Reclaiming the memory for use\".","src":"13강 p.50~53","wiki":"free list","answer":["free list","reclaim"],"bank":["free list","reclaim","page table","copy","PCB"],"introCard":0},{"id":"u13d-13","type":"mc","q":"그림처럼 free list 가 32KB → 16KB → 48KB 이고 OS 가 맨 앞 칸에 새 주소 공간을 놓는다. 그다음 free list 는?","explain":"\"The OS must find a room for a new address space\" — free list 에서 32KB 칸을 꺼내 프로세스를 그 자리에 올리므로 리스트에는 16KB, 48KB 만 남는다.","src":"13강 p.51~52","wiki":"free list","tags":["free list"],"img":"img/os13-p51-freelist.png","imgAlt":"p.51 free list 32KB → 16KB → 48KB 와 비어 있는 물리 메모리","choices":["16KB → 48KB","32KB → 16KB → 48KB","32KB → 48KB","16KB → 32KB → 48KB"],"answer":0,"introCard":1},{"id":"u13d-14","type":"mc","q":"그림 상태(free list 16KB → 48KB, Process A 가 32KB 칸)에서 Process A 가 종료되면 free list 는?","explain":"\"The OS must put the memory back on the free list.\" A 가 쓰던 32KB 칸이 free list 에 돌아온다(슬라이드에서는 맨 앞).","src":"13강 p.53","wiki":"free list","tags":["free list"],"img":"img/os13-p53-terminate.png","imgAlt":"p.53 Process A 종료 전 — free list 16KB → 48KB","choices":["32KB → 16KB → 48KB","16KB → 48KB","16KB → 48KB → 64KB","변화 없음"],"answer":0,"introCard":1},{"id":"u13d-15","type":"num","q":"context switch 로 Process A(32KB~48KB) 에서 Process B(48KB~64KB) 로 넘어간다. 가려진 base register 값은 몇 KB 인가?","explain":"OS 는 A 의 base 32KB·bounds 16KB 를 Process A PCB 에 저장하고, B 의 PCB 에서 base 48KB·bounds 16KB 를 꺼내 레지스터에 넣는다.","src":"13강 p.54","wiki":"base and bounds","tags":["base and bounds"],"img":"img/os13-p54-ctxsw.png","imgAlt":"p.54 context switch 뒤 base·bounds 가 가려진 그림","explainImg":"img/os13-p54-ctxsw-ans.png","answer":48,"unit":"KB","tol":0,"introCard":0},{"id":"u13d-16","type":"sa","q":"[용어] context switch 때 OS 가 base-and-bounds pair 를 저장·복원하는 프로세스별 자료구조. (3 words, p… c… b…)","explain":"p.54 \"In process control block (PCB)\". 시험은 약어(PCB)가 아니라 full term 을 쓰게 한다.","src":"13강 p.54","wiki":"base and bounds","tags":["base and bounds"],"answer":"process control block","introCard":0}],"intro":[{"title":"OS 가 할 일 세 시점","body":"① 프로세스 시작: **free list**(쓰지 않는 물리 메모리 범위의 목록)에서 주소 공간 자리를 찾는다. ② 종료: 그 메모리를 free list 에 되돌린다(reclaim). ③ context switch: 실행 중이던 프로세스의 base/bounds 를 **PCB**(process control block)에 저장하고 다음 프로세스 값을 복원한다 — CPU 에 레지스터 쌍이 하나뿐이라서. bounds 밖 접근은 exception → OS handler.","img":"img/os13-p54-ctxsw-ans.png","imgAlt":"context switch: A(32KB, 16KB) 를 PCB 에 저장하고 B(48KB, 16KB) 를 복원","src":"13강 p.50~54"},{"title":"free list 의 변화","body":"free list 32KB → 16KB → 48KB 에서 맨 앞 칸에 새 프로세스를 놓으면 16KB → 48KB 가 남는다. 프로세스가 끝나면 그 칸(예: 32KB)이 free list 에 돌아온다.","img":"img/os13-p51-freelist.png","imgAlt":"free list 32KB → 16KB → 48KB 와 비어 있는 물리 메모리","src":"13강 p.51~53"},{"title":"base and bounds 의 한계","body":"주소 공간 전체를 물리 메모리에 **연속으로** 놓아야 해서 heap 과 stack 사이 큰 빈 공간까지 물리 메모리를 차지한다(64-bit Linux 에서 128 TB). 변환은 덧셈·비교 하나라 빠르고 보호도 되지만 공간이 낭비된다 → 14강 segmentation.","img":"img/os13-p55-hugeva.png","imgAlt":"64-bit Linux 주소 공간: heap~stack 사이 128 TB","src":"13강 p.55"}]}]},{"id":"u14","title":"14강 Segmentation","desc":"세그먼트 변환 · stack · protection · fragmentation · free-space management","lessons":[{"id":"u14a","title":"세그먼트와 주소 변환","items":[{"id":"u14a-01","type":"sa","q":"\"The space inside the allocated unit is not all used and thus wasted\" 를 뜻하는 용어는?","explain":"p.3. base and bounds 는 주소 공간 하나를 통째로 할당하므로 그 안의 heap~stack 빈 공간이 버려진다.","src":"14강 p.3","wiki":"internal fragmentation","tags":["fragmentation"],"answer":"Internal Fragmentation","alts":["internal fragmentation","내부 단편화"],"introCard":0},{"id":"u14a-02","type":"cloze","q":"Segment 는 주소 공간의 ___ 한 덩어리이고, 세그먼트마다 ___ 와 bounds 가 따로 있다.","explain":"p.5 \"Segment is just a contiguous portion of the address space of a particular length … Base and bounds exist per each segment.\"","src":"14강 p.5","wiki":"세그멘테이션","tags":["segmentation"],"answer":["contiguous","base"],"bank":["contiguous","base","fixed-sized","PFN","random"],"introCard":0},{"id":"u14a-03","type":"tf","q":"세그멘테이션에서는 heap 과 stack 사이 빈 공간도 물리 메모리를 차지한다.","explain":"세그먼트(code·heap·stack)만 물리 메모리에 놓이고 가운데 빈 공간은 물리 메모리를 쓰지 않는다. 그게 base and bounds 대비 장점이다.","src":"14강 p.6","wiki":"세그멘테이션","answer":false,"introCard":0},{"id":"u14a-04","type":"sa","q":"가상 주소의 위 몇 비트로 세그먼트를 고르는 방식을 무엇이라 부르는가? (___ approach)","explain":"p.7 \"Explicit approach: Chop up the address space into segments based on the top few bits of virtual address.\"","src":"14강 p.7","wiki":"세그먼트 주소 변환","answer":"explicit","alts":["explicit approach"],"introCard":1},{"id":"u14a-05","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 100(10진수)의 PA 는?","explain":"세그먼트 00 = Code, offset 100. 100 \u003c 2048. PA = 32768 + 100 = 32868 (p.10).","src":"14강 p.10","wiki":"세그먼트 주소 변환","prof":true,"tags":["세그먼트 변환"],"answer":32868,"tol":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":1},{"id":"u14a-06","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 4200(10진수)의 offset 은?","explain":"4200 = 01 | 000001101000. 위 2비트 01 = Heap, 아래 12비트 = 0x068 = 104. heap 은 VA 4096 에서 시작하므로 4200 − 4096 = 104 와 같다.","src":"14강 p.8, p.11","wiki":"세그먼트 주소 변환","tags":["세그먼트 변환"],"img":"img/os14-p08-va4200.png","imgAlt":"p.8 VA 4200 의 비트 그림 — offset 값이 가려져 있다","explainImg":"img/os14-p08-va4200-ans.png","answer":104,"tol":0,"introCard":1},{"id":"u14a-07","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 4200(10진수)의 PA 는?","explain":"PA = base + offset = 34816 + 104 = 34920. VA + base(4200 + 34K)는 틀린다 — p.11 \"Virtual address + base is not the correct physical address\".","src":"14강 p.11","wiki":"세그먼트 주소 변환","prof":true,"tags":["세그먼트 변환"],"img":"img/os14-p11-heap.png","imgAlt":"p.11 heap 세그먼트 변환 그림 — 결과 상자가 가려져 있다","explainImg":"img/os14-p11-heap-ans.png","answer":34920,"tol":0,"introCard":1},{"id":"u14a-08","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 4500 의 PA 는?","explain":"세그먼트 01 Heap, offset 4500 − 4096 = 404 \u003c 2048. PA = 34816 + 404 = 35220.","src":"위키 세그먼트 주소 변환 퀴즈","wiki":"세그먼트 주소 변환","tags":["세그먼트 변환"],"answer":35220,"tol":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":1},{"id":"u14a-09","type":"mc","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 6200 에 읽기 접근하면?","explain":"Heap, offset 6200 − 4096 = 2104 ≥ size 2048 이므로 범위 위반 → Segmentation Fault.","src":"위키 세그먼트 주소 변환 퀴즈","wiki":"segmentation fault","diff":2,"tags":["세그먼트 변환"],"choices":["Segmentation Fault","PA 36920","Protection Fault","PA 40416"],"answer":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":2},{"id":"u14a-10","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 5000 의 PA 는?","explain":"Heap, offset 5000 − 4096 = 904 \u003c 2048. PA = 34816 + 904 = 35720.","src":"14강 p.10 규칙 적용","wiki":"세그먼트 주소 변환","tags":["세그먼트 변환"],"answer":35720,"tol":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":1},{"id":"u14a-11","type":"tf","q":"Code 세그먼트에서는 VA + base 가 우연히 맞는다. code 가 가상 주소 0 에서 시작해 VA = offset 이기 때문이다.","explain":"이것을 일반 규칙으로 착각하면 heap·stack 에서 틀린다. 규칙은 PA = offset + base.","src":"14강 p.10~11","wiki":"세그먼트 주소 변환","diff":2,"answer":true,"introCard":1},{"id":"u14a-12","type":"order","q":"세그먼트 주소 변환 순서 (양의 방향 세그먼트)","explain":"p.15 그림: 범위 검사 → base 에 더하기 → 권한 검사. 범위 실패는 Segmentation Fault, 권한 실패는 Protection Fault.","src":"14강 p.15","wiki":"segmentation fault","tags":["세그먼트 변환"],"answer":["VA 위 2비트로 세그먼트 고르기","아래 12비트를 offset 으로","offset \u003c size 검사","PA = base + offset","접근 종류가 protection 에 맞는지 검사"],"introCard":2},{"id":"u14a-13","type":"num","q":"VA 가 14비트이고 위 2비트가 세그먼트 번호라면, 세그먼트 하나의 최대 크기는 몇 바이트인가?","explain":"offset 이 12비트이므로 $2^{12}$ = 4096 = 4KB. stack 음수 offset 계산의 \"최대 세그먼트 크기\"가 이 값이다.","src":"14강 p.7, p.12","wiki":"세그먼트 주소 변환","diff":1,"answer":4096,"unit":"B","tol":0,"introCard":1},{"id":"u14a-14","type":"num","q":"그림: Code 32K·size 2K 바로 뒤에 Heap 이 붙어 있다. 표에서 가려진 Heap 의 Base 는 몇 K 인가?","explain":"Code 가 32K~34K 를 차지하고 Heap 이 그 바로 다음에 놓이므로 Heap base = 32K + 2K = 34K. Stack 은 28K 에서 아래로 자라 26K 까지(p.12). Base 칸은 \"Location in physical memory\" 다.","src":"14강 p.6","wiki":"세그멘테이션","tags":["segmentation"],"img":"img/os14-p06-placement.png","imgAlt":"p.6 물리 메모리 배치와 세그먼트 표 — Heap 의 Base 가 가려져 있다","explainImg":"img/os14-p06-placement-ans.png","answer":34,"unit":"K","tol":0,"introCard":0},{"id":"u14a-15","type":"mc","q":"세그먼트 변환 그림에서 offset 과 Size 를 비교한 결과가 No 일 때 가는 곳(?)은?","explain":"비교기(\u003c)는 offset \u003c Size 인지 본다. 범위를 벗어나면 Segmentation Fault — 이름 그대로 \"세그먼트 밖\" 접근이다. Protection Fault 는 p.15 에서 RW 검사가 추가될 때 생기는 두 번째 실패다.","src":"14강 p.9","wiki":"segmentation fault","tags":["세그먼트 변환"],"img":"img/os14-p09-segflow.png","imgAlt":"p.9 세그먼트 변환 하드웨어 흐름 — No 쪽 결과가 가려져 있다","choices":["Segmentation Fault","Protection Fault","Page Fault","TLB miss"],"answer":0,"introCard":2},{"id":"u14a-16","type":"num","q":"[규칙 적용] 세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 0x1100 의 PA 는? (10진수 바이트)","explain":"0x1100 = 01 | 0001 0000 0000 → 세그먼트 01 = Heap, offset 0x100 = 256 \u003c 2048. PA = 34K + 256 = 34816 + 256 = 35072.","src":"14강 p.8~11 규칙 적용","wiki":"세그먼트 주소 변환","diff":2,"tags":["세그먼트 변환"],"answer":35072,"unit":"B","tol":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":1},{"id":"u14a-17","type":"mc","q":"[규칙 적용] 세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. VA 0x2100 에 접근하면?","explain":"0x2100 = 10 | 0001 0000 0000. 세그먼트 표의 10 은 \"−\"(미사용)이라 유효한 base·size 가 없다. 위 2비트를 먼저 보고 세그먼트를 정하는 것이 첫 단계다.","src":"14강 p.7~8 규칙 적용","wiki":"segmentation fault","diff":2,"tags":["세그먼트 변환"],"choices":["세그먼트 10 은 쓰지 않는 번호라 fault (Segmentation Fault)","Heap 의 offset 0x1100 → PA 39168","Stack 의 음수 offset 으로 변환","Code 의 offset 0x100 → PA 33024"],"answer":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":1}],"intro":[{"title":"segment","body":"base and bounds 는 주소 공간 안 빈 공간까지 통째로 할당해 **internal fragmentation** 이 크다. **Segment** = 주소 공간의 contiguous 한 덩어리(code, heap, stack). 세그먼트마다 base 와 bounds(size)가 따로 있어 각각 물리 메모리의 다른 곳에 놓이고, 사이 빈 공간은 물리 메모리를 쓰지 않는다.","img":"img/os14-p06-placement-ans.png","imgAlt":"물리 메모리 배치와 세그먼트 표: Code 32K, Heap 34K, Stack 28K, 각 2K","src":"14강 p.3~6"},{"title":"explicit approach: 비트 나누기","body":"14비트 VA 의 **위 2비트 = 세그먼트 번호**(00 Code, 01 Heap, 11 Stack, 10 미사용), **아래 12비트 = offset**(0~4095). 그래서 세그먼트 하나의 최대 크기는 $2^{12}$ = 4KB. 예: 4200 = 01 | 000001101000 → Heap, offset 104.","img":"img/os14-p07-explicit.png","imgAlt":"VA 100 의 비트 분해: Segment 00, Offset 100","src":"14강 p.7~8"},{"title":"변환 규칙","body":"$PA = base + offset$ (offset 은 그 세그먼트 시작에서 잰 거리). offset \u003c size 가 아니면 **Segmentation Fault**. VA + base 는 틀린다 — code 는 VA 0 에서 시작해 우연히 VA = offset 일 뿐. 예: Heap base 34K(34816), VA 4200 → offset 104 → PA 34920.","img":"img/os14-p11-heap-ans.png","imgAlt":"heap 세그먼트 변환: 104 + 34K = 34920","src":"14강 p.9~11"}]},{"id":"u14b","title":"Stack · 공유 · fault","items":[{"id":"u14b-01","type":"cloze","q":"stack 은 ___ 방향으로 자란다. 그래서 세그먼트 레지스터에 \"Grows ___?\" 비트가 추가된다 (1 양, 0 음).","explain":"p.12 \"Stack grows backward. It starts at 28KB and grows back to 26KB.\"","src":"14강 p.12","wiki":"스택 세그먼트","tags":["stack"],"answer":["backward","Positive"],"bank":["backward","Positive","forward","Negative","Upward"],"introCard":0},{"id":"u14b-02","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 15KB(= 15360) 의 음수 offset 은? (부호 포함)","explain":"offset = 15360 − 3×4096 = 3072. 음수 offset = offset − 최대 세그먼트 크기 = 3072 − 4096 = −1024.","src":"14강 p.12","wiki":"스택 세그먼트","prof":true,"tags":["stack"],"answer":-1024,"tol":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":0},{"id":"u14b-03","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 15KB 의 PA 는 몇 KB 인가?","explain":"PA = base + 음수 offset = 28KB − 1KB = 27KB. |−1024| ≤ 2048 이라 범위 안.","src":"14강 p.12","wiki":"스택 세그먼트","prof":true,"tags":["stack"],"answer":27,"unit":"KB","tol":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":0},{"id":"u14b-04","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 15872(15.5KB) 의 PA 는? (바이트)","explain":"offset = 15872 − 12288 = 3584. 음수 offset = 3584 − 4096 = −512. PA = 28672 − 512 = 28160.","src":"위키 스택 세그먼트 퀴즈","wiki":"스택 세그먼트","diff":2,"tags":["stack"],"answer":28160,"unit":"B","tol":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":0},{"id":"u14b-05","type":"num","q":"세그먼트 테이블: Code base 32K·size 2K, Heap base 34K·size 2K, Stack base 28K·size 2K. VA 14비트 = 세그먼트 2비트(00 Code, 01 Heap, 11 Stack) + offset 12비트. stack 의 VA 14KB(= 14336) 의 PA 는 몇 KB 인가?","explain":"offset 2048, 음수 offset −2048, |−2048| ≤ 2048 통과. PA = 28KB − 2KB = 26KB — stack 의 가장 아래 칸. 14KB − 1 이면 size 를 넘어 fault.","src":"위키 스택 세그먼트","wiki":"스택 세그먼트","diff":3,"tags":["stack"],"answer":26,"unit":"KB","tol":0,"img":"img/os14-gen-u14a-05.png","imgAlt":"세그먼트 테이블(Code 32K/2K, Heap 34K/2K, Stack 28K/2K, stack 은 음의 방향)과 VA 14비트 = seg 2 + offset 12","introCard":0},{"id":"u14b-06","type":"tf","q":"stack 세그먼트(base 28KB, size 2KB, 음의 방향으로 자람)의 base 는 세그먼트의 낮은 주소 쪽 끝이라 PA 는 base 보다 크다.","explain":"stack 의 base 는 위쪽 끝이다. 음수 offset 을 더하므로 PA 는 base 보다 작다.","src":"14강 p.12","wiki":"스택 세그먼트","diff":2,"answer":false,"introCard":0},{"id":"u14b-07","type":"match","q":"세그먼트 레지스터 표(Code base 32K, Heap base 34K, Stack base 28K)에서 세그먼트와 protection 을 연결하시오","explain":"p.13 Segment Register Values (with Protection) 표. code 는 Read-Execute 라 공유해도 안전하다. 쓰려 하면 Protection Fault.","src":"14강 p.13","wiki":"코드 공유와 protection bit","tags":["protection"],"pairs":[["Code","base 32K, Read-Execute"],["Heap","base 34K, Read-Write, 양의 방향"],["Stack","base 28K, Read-Write, 음의 방향"],["세그먼트 번호 10","미사용"]],"introCard":1},{"id":"u14b-08","type":"mc","q":"code 세그먼트(RE) 안 VA 100 에 store 하면?","explain":"offset 100 \u003c 2K 라 범위는 통과한다. 쓰기인데 W 권한이 없어 Protection Fault 다.","src":"위키 코드 공유와 protection bit","wiki":"코드 공유와 protection bit","diff":2,"tags":["protection"],"choices":["Protection Fault","Segmentation Fault","PA 32868 에 정상 저장","page fault"],"answer":0,"introCard":1},{"id":"u14b-09","type":"match","q":"fault 종류와 원인을 연결하시오","explain":"p.15. 검사 순서는 범위 → 더하기 → 권한.","src":"14강 p.15","wiki":"segmentation fault","pairs":[["Segmentation Fault","offset 이 세그먼트 size 를 넘음"],["Protection Fault","범위 안이지만 권한(R/W/X) 위반"],["External fragmentation","세그먼트 사이 작은 구멍들"],["Internal fragmentation","할당한 칸 안의 안 쓰는 공간"]],"introCard":1},{"id":"u14b-10","type":"tf","q":"세그먼트는 주소 공간끼리 공유할 수 있고(code sharing), 그러려면 protection bit 가 필요하다.","explain":"p.13 \"Segment can be shared between address space … Extra hardware support is needed for form of a protection bit.\"","src":"14강 p.13","wiki":"코드 공유와 protection bit","answer":true,"introCard":1},{"id":"u14b-11","type":"sa","q":"세그먼트 레지스터의 네 칸 중 \"세그먼트가 자라는 방향\"을 나타내는 칸 이름은?","explain":"네 칸 = Base, Size, Grows Positive?, Protection (p.12 표에 Grows Positive?, p.13 표에 Protection 이 더해진다).","src":"14강 p.12~13","wiki":"스택 세그먼트","diff":1,"answer":"Grows Positive","alts":["Grows Positive?","grows positive bit"],"introCard":0},{"id":"u14b-12","type":"mc","q":"base and bounds(주소 공간 하나를 통째로 배치)와 비교해 세그멘테이션이 새로 갖게 된 문제는?","explain":"세그먼트 크기가 제각각이라 물리 메모리 사이사이에 구멍이 생긴다. internal fragmentation 은 base and bounds 의 문제였다.","src":"14강 p.16","wiki":"external fragmentation","choices":["external f
